# Cloudflare Workers config for חדר המורים.
#
# Assets come from docs/ — the self-contained pages that
# `npm run build` (scripts/build-standalone.js) generates from the two
# .dc.html sources. Two reasons: those copies inline React so the app boots
# with no CDN round-trip, and serving docs/ instead of the repo root keeps
# uploads/, functions/ and src/ off the public web.
#
# docs/ is also what GitHub Pages serves, so the same build works both ways —
# on Pages without a backend (login cannot succeed), on the Worker with one.

# Must match the Worker that Cloudflare Workers Builds deploys into, which is
# named after the repository. When they disagree the build warns, overrides
# this value with the CI one, and opens a pull request to "fix" the config.
name = "projectnewschool"
main = "src/worker.js"
compatibility_date = "2026-07-01"

[assets]
directory = "./docs"
binding = "ASSETS"
run_worker_first = true

# The id is account-specific: a database created in a different account, or
# deleted and recreated, gets a new one and the deploy fails with D1 error
# 10181 ("database not found") after the assets have already uploaded.
[[d1_databases]]
binding = "DB"
database_name = "teacher-room"
database_id = "586d4fad-7b90-4a24-a825-96f6ef728273"
