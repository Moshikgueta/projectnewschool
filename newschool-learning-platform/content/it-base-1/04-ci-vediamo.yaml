vocabulary:
  - slug: ci-vediamo
    title: Ci vediamo?
    items: *ci-vediamo-words

activities:
  - slug: ci-vediamo-giorni
    title: Giorni della settimana e numeri
    minutes: 8
    items:
      - id: abitudine
        type: multipleChoice
        prompt: Quale frase parla di un'abitudine (ogni settimana)?
        options:
          - { text: Il sabato mi riposo., correct: true }
          - {
              text: Sabato mi riposo.,
              feedback: "Senza articolo parliamo di un solo sabato. Per un'abitudine usiamo *il*: *Il sabato mi riposo.*",
            }
      - id: dopo-martedi
        type: multipleChoice
        prompt: Che giorno viene dopo martedì?
        options:
          - { text: mercoledì, correct: true }
          - { text: lunedì, feedback: '*Lunedì* viene prima di martedì.' }
          - { text: giovedì, feedback: '*Giovedì* viene dopo mercoledì.' }
      - id: plurale-domenica
        type: trueFalse
        prompt: Il plurale di *domenica* è *domeniche*.
        answer: true
        feedback:
          correct: Giusto! Domenica → domeniche.
          incorrect: Sabato e domenica cambiano al plurale. Domenica → domeniche.
      - id: lunedi-invariabile
        type: trueFalse
        prompt: '*Lunedì*, *martedì* e *venerdì* hanno la stessa forma al singolare e al plurale.'
        answer: true
        feedback:
          correct: Giusto! Da lunedì a venerdì i giorni non cambiano al plurale.
          incorrect: 'Da lunedì a venerdì i giorni non cambiano al plurale: *un lunedì*, *tutti i lunedì*.'
      - id: plurale-sabato
        type: fillBlank
        prompt: Scrivi il plurale.
        text: Il plurale di *sabato* è ___.
        blanks: [[sabati]]
      - id: numeri
        type: matching
        prompt: Unisci i numeri.
        pairs:
          - ['1', uno]
          - ['4', quattro]
          - ['6', sei]
          - ['8', otto]
          - ['10', dieci]
      - id: date
        type: fillBlank
        prompt: Completa con *il* o *nel*.
        text: Il mio compleanno è ___ 5 marzo. Sono nata ___ 1998.
        blanks: [[il], [nel]]
        wordBank: [il, nel]
      - id: ordina-lunedi
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Il lunedì vado a scuola.

  - slug: ci-vediamo-preposizioni
    title: 'Preposizioni di base: a, in, di, da, con'
    minutes: 8
    items:
      - id: a-scuola
        type: multipleChoice
        prompt: Vado ___ scuola.
        options:
          - { text: a, correct: true }
          - {
              text: di,
              feedback: "*Di* è per l'origine o il possesso. Per la destinazione usa *a*: *Vado a scuola.*",
            }
          - {
              text: con,
              feedback: '*Con* è per la compagnia o lo strumento. Per la destinazione usa *a*.',
            }
      - id: in-treno
        type: multipleChoice
        prompt: Viaggio ___ treno.
        options:
          - { text: in, correct: true }
          - { text: a, feedback: 'Per un mezzo di trasporto usiamo *in*: *Viaggio in treno.*' }
          - { text: di, feedback: 'Per un mezzo di trasporto usiamo *in*: *Viaggio in treno.*' }
      - id: di-anna
        type: multipleChoice
        prompt: Il libro è ___ Anna.
        options:
          - { text: di, correct: true }
          - { text: con, feedback: 'Per il possesso usiamo *di*: *Il libro è di Anna.*' }
          - { text: in, feedback: '*In* è per un luogo. Per il possesso usiamo *di*.' }
      - id: completa
        type: fillBlank
        prompt: Completa con *alle*, *in* o *con*.
        text: La lezione è ___ 9. Sono ___ città. Vado al cinema ___ un amico.
        blanks: [[alle], [in], [con]]
        wordBank: [alle, in, con]
      - id: unisci-uso
        type: matching
        prompt: Unisci ogni preposizione al suo uso.
        pairs:
          - [a, direzione o orario]
          - [in, luogo o mezzo di trasporto]
          - [di, origine o possesso]
          - [da, da dove vieni]
          - [con, compagnia o strumento]
      - id: orario
        type: trueFalse
        prompt: "Per l'orario usiamo *a*: *alle 9*, *alle 16:00*."
        answer: true
        feedback:
          correct: Giusto! *Alle* = *a* + *le*.
          incorrect: "Per l'orario usiamo *a*: *La lezione è alle 9.*"
      - id: trasporto
        type: trueFalse
        prompt: 'Per un mezzo di trasporto usiamo *di*: *Viaggio di treno.*'
        answer: false
        feedback:
          correct: 'Giusto! Diciamo *Viaggio in treno.*'
          incorrect: 'Per un mezzo di trasporto usiamo *in*: *Viaggio in treno.*'
      - id: ordina-treno
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Mia sorella viaggia in treno.
