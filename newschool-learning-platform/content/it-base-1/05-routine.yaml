vocabulary:
  - slug: routine
    title: Routine
    items: *routine-words

activities:
  - slug: routine-orari
    title: Numeri, giorni e orari
    minutes: 8
    items:
      - id: sette-undici
        type: fillBlank
        prompt: Scrivi i numeri in parole.
        text: Mi sveglio alle ___ (7) e vado a letto alle ___ (11).
        blanks: [[sette], [undici]]
      - id: domani-martedi
        type: multipleChoice
        prompt: Oggi è lunedì. Domani è ___.
        options:
          - { text: martedì, correct: true }
          - { text: domenica, feedback: 'La domenica è il giorno **prima** del lunedì.' }
          - { text: mercoledì, feedback: 'Il mercoledì è due giorni dopo il lunedì.' }
      - id: mercoledi
        type: fillBlank
        prompt: Completa i giorni della settimana.
        text: Lunedì, martedì, ___, giovedì, venerdì.
        blanks: [[mercoledì]]
      - id: giorni-ebraico
        type: matching
        prompt: Unisci ogni giorno al suo nome in ebraico.
        pairs:
          - [lunedì, יום שני]
          - [mercoledì, יום רביעי]
