vocabulary:
  - slug: come-rilassarsi
    title: Come rilassarsi
    items: *rilassarsi-words

activities:
  - slug: come-rilassarsi-riflessivi
    title: 'Verbi riflessivi: mi, ti, si, ci, vi'
    minutes: 8
    items:
      - id: io-mi
        type: multipleChoice
        prompt: Io ___ rilasso con la musica.
        options:
          - { text: mi, correct: true }
          - { text: ti, feedback: '*Ti* è per *tu*. Con *io* usa *mi*: *io mi rilasso*.' }
          - { text: si, feedback: '*Si* è per *lui / lei / loro*. Con *io* usa *mi*.' }
      - id: noi-ci
        type: multipleChoice
        prompt: Noi ___ concentriamo sulla respirazione.
        options:
          - { text: ci, correct: true }
          - { text: si, feedback: '*Si* è per *lui / lei / loro*. Con *noi* usa *ci*.' }
          - { text: vi, feedback: '*Vi* è per *voi*. Con *noi* usa *ci*.' }
      - id: abbina-rilassarsi
        type: matching
        prompt: Abbina ogni persona al verbo *rilassarsi*.
        pairs:
          - [io, mi rilasso]
          - [tu, ti rilassi]
          - [lui / lei, si rilassa]
          - [noi, ci rilassiamo]
          - [voi, vi rilassate]
      - id: tu-ti-loro-si
