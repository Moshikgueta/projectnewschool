        prompt: Completa con il pronome giusto (*mi, ti, si, ci, vi*).
        text: Tu ___ siedi in una posizione comoda. Loro ___ rilassano sull'amaca.
        blanks: [[ti], [si]]
      - id: voi-vi-rilassate
        type: fillBlank
        prompt: Completa con il verbo *rilassarsi* al presente.
        text: Voi ___ ___ a casa la domenica.
        blanks: [[vi], [rilassate]]
      - id: loro-ci
        type: trueFalse
        prompt: 'Con *loro* usiamo il pronome *ci*: *Loro ci rilassano.*'
        answer: false
        feedback:
          correct: 'Giusto! Con *loro* usiamo *si*: *Loro si rilassano.*'
          incorrect: '*Ci* è per *noi*. Con *loro* usiamo *si*: *Loro si rilassano.*'
