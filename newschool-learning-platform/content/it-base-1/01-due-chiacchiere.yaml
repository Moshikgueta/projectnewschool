vocabulary:
  - slug: due-chiacchiere
    title: Due chiacchiere
    items: *due-chiacchiere-words

activities:
  - slug: due-chiacchiere-domande
    title: 'Domande e risposte: cosa, dove, quando, perché, come'
    minutes: 8
    items:
      - id: vivo-a
        type: multipleChoice
        prompt: '*Vivo a Tel Aviv.* Qual è la domanda?'
        options:
          - { text: Dove vivi?, correct: true }
          - {
              text: Quando vivi?,
              feedback: '*Quando* chiede il tempo (giorno, ora). Tel Aviv è un luogo: usa *dove*.',
            }
          - {
              text: Cosa vivi?,
              feedback: '*Cosa* chiede le cose. Tel Aviv è un luogo: usa *dove*.',
            }
      - id: vengo-da
        type: multipleChoice
        prompt: '*Vengo dalla Francia.* Qual è la domanda?'
        options:
          - { text: Da dove vieni?, correct: true }
          - {
              text: Dove vivi?,
              feedback: 'A *Dove vivi?* rispondiamo *Vivo a…*. *Vengo da…* risponde a *Da dove vieni?*',
            }
          - {
              text: Come vieni?,
              feedback: "*Come* chiede il modo o i sentimenti. Per l'origine usa *Da dove vieni?*",
            }
      - id: come-stai
        type: multipleChoice
        prompt: ___ stai oggi? — Sto bene, grazie.
        options:
          - { text: Come, correct: true }
          - { text: Dove, feedback: '*Bene* non è un luogo. Per i sentimenti usa *come*.' }
          - {
              text: Perché,
              feedback: 'La risposta non è una ragione. Per i sentimenti usa *come*.',
            }
      - id: parole-uso
        type: matching
        prompt: Unisci ogni parola interrogativa al suo uso.
        pairs:
          - [Cosa, le cose]
          - [Dove, i luoghi]
          - [Quando, 'il tempo (giorno, ora)']
          - [Perché, le ragioni]
          - [Come, il modo o i sentimenti]
      - id: si-no
        type: trueFalse
        prompt: Usiamo le parole interrogative per domande con la risposta solo «sì» o «no».
        answer: false
        feedback:
          correct: 'Giusto! Le parole interrogative chiedono informazioni: *Dove vivi? — A Tel Aviv.*'
          incorrect: 'Le parole interrogative chiedono informazioni, non solo «sì» o «no»: *Dove vivi? — A Tel Aviv.*'
      - id: cosa-dove
        type: fillBlank
        prompt: Completa con la parola interrogativa giusta.
        text: ___ ti piace fare? — Mi piace ballare. ___ lavori? — Lavoro alla New School.
        blanks: [[Cosa, Che cosa, Che], [Dove]]
        wordBank: [Cosa, Dove, Quando]
      - id: perche
        type: fillBlank
        prompt: Completa la domanda.
        text: ___ ti piace viaggiare? — Perché mi piace vedere nuovi posti.
        blanks: [[Perché]]
      - id: ordina-domanda
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Qual è il tuo cibo preferito?

  - slug: due-chiacchiere-descrittive
    title: 'Frasi descrittive: essere e stare'
    minutes: 8
    items:
      - id: io-sono
        type: multipleChoice
        prompt: Io ___ felice.
        options:
          - { text: sono, correct: true }
          - { text: sei, feedback: '*Sei* è per *tu*. Con *io* il verbo è *sono*.' }
          - { text: è, feedback: '*È* è per *lui / lei*. Con *io* il verbo è *sono*.' }
      - id: loro-sono
        type: multipleChoice
        prompt: Loro non ___ alti.
        options:
          - { text: sono, correct: true }
          - { text: siamo, feedback: '*Siamo* è per *noi*. Con *loro* usa *sono*.' }
          - { text: siete, feedback: '*Siete* è per *voi*. Con *loro* usa *sono*.' }
      - id: sto-bene
        type: multipleChoice
        prompt: Come stai? — ___ bene, grazie.
        options:
          - { text: Sto, correct: true }
          - {
              text: Sono,
              feedback: 'Per dire come ti senti, rispondi con *stare*: *Come stai? — Sto bene.*',
            }
          - { text: Sta, feedback: '*Sta* è per *lui / lei*. Con *io* usa *sto*.' }
      - id: completa-essere
        type: fillBlank
        prompt: Completa con il verbo *essere*.
        text: Tu ___ simpatico. Lei ___ gentile. Noi ___ di Tel Aviv.
        blanks: [[sei], [è, "e'"], [siamo]]
      - id: completa-stare
