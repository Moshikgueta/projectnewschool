# Cycle "Moda e shopping", converted from the Italian base digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-base-1
slug: moda-e-shopping
title: Moda e shopping
goal: Descrivere vestiti e stile con frasi descrittive e parlare di prezzi con i numeri.
position: 6
status: in_review

review:
  - >-
    The two workbook exercises ("Frasi descrittive" and "Numeri") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's two
    skills, its summary rules and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Numbers summary, rule 2 said the tens 20–90 all end in "-anta" (a rule carried
    over from the Spanish notebook). This is wrong in Italian (venti, trenta).
    Rewritten as: 20 *venti*, 30 *trenta*, 40 to 90 end in *-anta*.
  - >-
    Numbers summary, rule 1 (21–99 join tens and units) now adds the Italian
    details: the tens drop their last vowel before *uno* and *otto* (ventuno,
    ventotto) and *tre* takes an accent (ventitré). Rule 3 said 11–19 are
    "irregular"; rewritten: 11–16 end in *-dici* (undici … sedici), 17–19 start with
    *dici-* (diciassette, diciotto, diciannove). Please confirm.
  - >-
    Summary examples in the past ("Ho comprato ventisette camicie", "Ho speso
    sessanta dollari", "Ho comprato quindici paia di calzini") and the Activity 4
    model ("Ho comprato… In totale ho speso 100 $") are now in the present (Ho
    ventisette camicie; Spendo sessanta dollari; Nel carrello ho… In totale spendo
    100 $), as the cycle works in the present.
  - >-
    Descriptive summary: a rule on agreement was added to the adjective rule (il
    vestito è rosso, la gonna è rossa, le scarpe sono comode), because students need
    it to describe clothes and the exercise uses it. Please confirm.
  - >-
    Introduction: "Colpo di scena: mi piace fare shopping" (a literal translation of
    "twist") is rewritten as the frame "Sono ___. Mi piace comprare ___." with the
    notebook's example (Mi piace comprare libri).
  - >-
    Activity 1: the teacher model used "indossi" and the student model "si usa";
    both now use "indossi". "pantaloncini corti" → "pantaloncini" (pantaloncini are
    already short). The picture of clothes and accessories is not in the exported
    notebook; the clothes list is kept as a word bank and the teacher shares the
    picture on screen until it is added to the course's media.
  - >-
    Activity 2: the model "Penso che costi cinquanta dollari" uses the subjunctive,
    which is beyond A1; only "Secondo me costa ___ dollari / euro" is kept. Typo "la
    ativitta" fixed. The Google Slides link is kept as the resource (the "?usp=sharing"
    parameter removed); the real prices are teacher-only (teacher note). The notebook
    gives no time for this activity, so none is recorded.
  - >-
    Activity 4 suggests online shops (ASOS, H&M, ZARA, UNIQLO, SHEIN) with links. Shop
    links are not on the link allow-list, so they were left out; the teacher note
    names the shops and the teacher opens one on screen.
  - >-
    Warm-up: "Compro vestiti ___ volte a ___ (settimana, mese, anno)" → "… volte alla
    settimana / al mese / all'anno"; "nei fine settimana" → "nel fine settimana".
  - >-
    The general information lists Numeri only with the warm-up and questions, but
    Activities 2 and 4 are labelled NUMERI; the plan note says Activities 2 and 4.
  - >-
    Mori: the opening message named the skills "Azioni presenti" and "Numeri"; it now
    names this cycle's skills, "Frasi descrittive" and "Numeri". The tip "spiegare in
    ebraico ma con la frase in inglese" now says "in italiano". "presente semplice" →
    "presente".
  - >-
    Vocabulary: "Abito" is glossed "שמלה" as in the notebook, but *abito* can also
    mean a suit; the examples use *vestito* (also "dress"), so the card is "Abito /
    vestito". "Avere" was glossed "יש לי" (I have); now "יש ל־ (יש לי)". Note that
    "Spesso" here is the adjective "thick", not the adverb "often" from Routine.
    Please confirm.
  - >-
    The Quizlet link lost its "?new" parameter. Activity times given as ranges
    (15–20 minutes) are recorded as 20 minutes; the introduction (5–10) as 10.
  - >-
    The "Risposta dello studente 1/2/3" lines are replaced by the optional answer
    boxes (decision C2): students may type, and the teacher sees the group's answers.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: moda-e-shopping-classe
    title: 'Classe: Moda e shopping'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Moda e shopping
      - id: skills
        type: cycleOverview
        skills:
          - name: Frasi descrittive
            description: Descrivere vestiti e stile con *essere*, *avere* e gli aggettivi (il vestito è elegante)
          - name: Numeri
            description: I numeri da 11 a 100 per parlare di prezzi e quantità
      - id: quizlet
        type: externalLink
        label: Moda su Quizlet
        url: https://quizlet.com/br/1068050464/italiano-basico-moda-atualizato-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Giro di presentazione
      - id: intro
        type: sentenceFrame
        frame: Sono ___. Mi piace comprare ___.
        example: Sono Dana. Mi piace comprare libri.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup
        type: discussionQuestions
        items:
          - question: Ti piace fare shopping? Se sì, quali cose ti piace comprare? Se no, perché?
            frame: Sì, mi piace comprare ___. / No, non mi piace perché ___.
          - question: Preferisci fare acquisti online o andare in un negozio? Perché?
            frame: Preferisco ___ perché ___.
          - question: Quando ti piace andare a fare shopping?
            frame: Mi piace andare a fare shopping nel fine settimana / durante la settimana. Il ___ (giorno).
          - question: Qual è il tuo negozio preferito? Perché?
            frame: Il mio negozio preferito è ___ perché ___.
          - question: Quante volte compri vestiti?
            frame: Compro vestiti ___ volte alla settimana / al mese / all'anno.
          - question: Quando vai al centro commerciale, in quanti negozi entri? Quali?
            frame: Entro in ___ negozi. ___, ___ e ___.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: Cosa dovrei indossare?'
        skills: [Frasi descrittive]
        minutes: 20
        steps:
          - Guarda l'immagine con vestiti e accessori e ripassa le parole.
          - "L'insegnante chiede: *Cosa dovrei indossare per…?* (un compleanno, il lavoro, una gita al mare, un incontro con gli amici)."
          - Rispondi con un vestito e un aggettivo della lista.
        wordBank:
          - abito
          - pantaloncini
          - gonna
          - borsa
          - cappotto
          - maglietta
          - pantaloni
          - scarpe
          - comodo
          - elegante
          - casual
          - formale
          - caldo
          - fresco
          - moderno
          - semplice
          - colorato
          - alla moda
          - largo
          - stretto
          - morbido
          - spesso
          - sottile
        example: |-
          **Insegnante:** *Cosa dovrei indossare per un compleanno?*
          **Studente:** *Per un compleanno indossi un vestito perché è elegante.*
          **Insegnante:** *Cosa dovrei indossare per una gita al mare?*
          **Studente:** *Per andare al mare indossi pantaloncini e una maglietta perché sono comodi.*
      - id: act1-questions
        type: discussionQuestions
        title: Cosa dovrei indossare per…?
        items:
          - question: un compleanno
            frame: Per un compleanno indossi ___ perché è / sono ___.
          - question: il lavoro
            frame: Per il lavoro indossi ___ perché è / sono ___.
          - question: una gita al mare
            frame: Per una gita al mare indossi ___ perché è / sono ___.
          - question: un incontro con gli amici
            frame: Per un incontro con gli amici indossi ___ perché è / sono ___.
      - id: act2
        type: classActivity
        title: 'Attività 2: Indovina il prezzo'
        skills: [Numeri]
        steps:
          - Guarda l'immagine di un vestito o di un accessorio sulla diapositiva.
          - '**Indovina il prezzo** e dillo ad alta voce in italiano.'
          - L'insegnante dice il prezzo vero (da un negozio online).
          - Chi si avvicina di più al prezzo vero **vince il round**.
        resource:
          label: Presentazione «Indovina il prezzo» (diapositive 1–10)
          url: https://docs.google.com/presentation/d/1uFqbDX8-ftLQBBJCfbx6Sna6zhKy-DBUeYQup7FSlq4/edit
        example: '*Secondo me costa cinquanta dollari.* / *Secondo me costa trenta euro.*'
      - id: act2-frame
        type: sentenceFrame
        frame: Secondo me costa ___ dollari / euro.
        example: Secondo me costa quaranta dollari.
      - id: act3
        type: classActivity
        title: 'Attività 3: Organizza il tuo negozio'
        skills: [Frasi descrittive]
        minutes: 20
        steps:
          - Inventa il tuo negozio e completa la scheda qui sotto.
          - Presenta il tuo negozio alla classe.
        example: |-
          **Nome del negozio:** *Tendenze della moda*
          **Cosa vendi?** Abbigliamento, scarpe e accessori.
          **Dove si trova?** Nel centro città, vicino a un centro commerciale.
          **Cosa offre il tuo negozio?** Varietà di abbigliamento moderno per uomo e donna, camerini, sezione sconti, una comoda sala d'attesa.
          **Chi lavora con te?** Due venditori, un cassiere e un consulente di moda.
          *Il mio negozio si chiama… Vendo… Si trova in… Offre…*
      - id: act3-shop
        type: discussionQuestions
        title: Il mio negozio
        items:
          - question: 'Nome del negozio:'
            frame: Il mio negozio si chiama ___.
          - question: Cosa vendi?
            frame: Vendo ___.
          - question: Dove si trova?
            frame: Si trova ___.
          - question: Cosa offre il tuo negozio?
            frame: Offre ___.
          - question: Chi lavora con te?
            frame: Con me lavorano ___.
      - id: act4
        type: classActivity
        title: 'Attività 4: Pianificazione del budget'
        skills: [Numeri]
        minutes: 20
        steps:
          - Vai al negozio online scelto dall'insegnante.
          - Scegli vestiti fino a un massimo di **100 $**.
          - Scegli articoli da **categorie diverse** (magliette, pantaloni, scarpe, accessori).
          - Presenta alla classe cosa hai nel carrello e il prezzo di ogni articolo.
          - Vince chi compra il **maggior numero di articoli da categorie diverse**, avvicinandosi ai 100 $ senza superarli.
        example: '*Nel carrello ho una maglietta da 20 $, un paio di scarpe da 50 $ e una borsa da 30 $. In totale spendo 100 $.*'
      - id: act4-cart
        type: sentenceFrame
        frame: Nel carrello ho ___ da ___ $, ___ da ___ $ e ___ da ___ $. In totale spendo ___ $.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Frasi descrittive** (domande di riscaldamento,
          Attività 1 oppure 3) e **Numeri** (riscaldamento, Attività 2 e 4).
      - id: n-intro
        anchor: intro
        minutes: 10
        text: 'Dai prima il tuo esempio: «Io sono ___. Mi piace comprare libri.» Poi chiedi a ogni studente.'
      - id: n-warmup
        anchor: warmup
        minutes: 20
        text: Fai almeno due domande a ogni studente. Le risposte scritte qui appaiono sotto ogni domanda.
      - id: n-act1
        anchor: act1
        text: >-
          Mostra sullo schermo un'immagine con vestiti e accessori (abito, pantaloncini,
          gonna, borsa, cappotto, maglietta, pantaloni, scarpe): l'immagine non è ancora
          nella piattaforma. Poi chiedi «Cosa dovrei indossare per…?» e dai la risposta
          modello: «Per un compleanno indossi ___ perché è ___ (aggettivo).»
      - id: n-act2
        anchor: act2
        text: >-
          Prezzi veri (solo per l'insegnante): abito $50, gonna $90, pantaloni $40,
          pantaloncini $30, cappotto $60, maglietta $20, scarpe $70, borsa $80. Mostra un
          articolo, lascia che tutti indovinino e poi di' il prezzo vero.
      - id: n-act4
        anchor: act4
        text: >-
          Scegli un negozio online e aprilo sul tuo schermo. Negozi consigliati nel
          quaderno: ASOS, H&M, ZARA, UNIQLO e SHEIN (i link non sono nella piattaforma).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: moda-e-shopping-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: rules-descrizione
        type: ruleSummary
        skill: Frasi descrittive
        rules:
          - text: Usiamo il verbo **essere** per descrivere vestiti e stile.
            examples: [Io sono elegante., Lei è moderna., Queste scarpe sono comode.]
          - text: >-
              Usiamo gli **aggettivi** per dare più informazioni. L'aggettivo cambia
              come la cosa: maschile o femminile, singolare o plurale.
            examples:
              - Il vestito è rosso. · La gonna è rossa.
              - I pantaloni sono comodi. · Le scarpe sono comode.
              - La sua giacca è grande e calda.
          - text: Usiamo il verbo **avere** per parlare di quello che una persona ha.
            examples: [Io ho una borsa rossa., Lei ha cinque paia di scarpe.]
      - id: rules-numeri
        type: ruleSummary
        skill: Numeri
        rules:
          - text: >-
              I numeri da **21 a 99** si formano unendo decine e unità, in una sola
              parola. Davanti a *uno* e *otto* la decina perde l'ultima vocale; *tre*
              prende l'accento.
            examples: [Ho ventisette camicie., 'ventuno, ventotto, trentuno', ventitré]
          - text: '**20** è *venti* e **30** è *trenta*. Da **40 a 90** le decine finiscono in **-anta**.'
            examples:
              [
                Spendo sessanta dollari in scarpe.,
                'quaranta, cinquanta, sessanta, settanta, ottanta, novanta',
              ]
          - text: 'I numeri da **11 a 16** finiscono in **-dici**; da **17 a 19** cominciano con **dici-**.'
            examples:
              - undici, dodici, tredici, quattordici, quindici, sedici
              - diciassette, diciotto, diciannove
              - Compro quindici paia di calzini.
    teacherNotes:
      - id: n-summary
        anchor: null
        minutes: 20
        text: Ripassa le due abilità con il gruppo e chiedi un esempio nuovo per ogni regola.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: moda-e-shopping-compiti
    title: Compiti con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia questo messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
      - id: mori-shopping
        type: aiTutorPrompt
        title: Shopping al centro commerciale
        message: >-
          Ciao Mori! Voglio andare a fare shopping al centro commerciale. Puoi farmi delle
          domande sullo shopping usando le abilità "Frasi descrittive" e "Numeri"? Per
          favore, usa solo il presente e correggi i miei errori.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, chiedimi di più!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico, ma con la frase in italiano?**
      - id: extra-title
        type: heading
        level: 3
        text: Pratica in più
      - id: mori-lista
        type: aiTutorPrompt
        title: La mia lista della spesa
        intro: >-
          Invia questo messaggio a Mori. Obiettivi: usa almeno 4 verbi diversi
          (comprare, andare, mangiare, indossare), 5 articoli diversi (maglietta,
          pantaloni, pane, scarpe, bottiglia) e 5 o più numeri (tre banane, due
          magliette, una bottiglia).
        message: >-
          Ciao Mori! Vorrei parlarti della mia lista della spesa. Puoi farmi delle domande
          usando i numeri e il presente?
      - id: mori-costo
        type: aiTutorPrompt
        title: Quanto costa?
        intro: >-
          Invia questo messaggio a Mori. Obiettivi: rispondi con il prezzo di vari
          articoli, usa i numeri in italiano e i verbi al presente (*Costa… / Io
          compro… / Io pago…*).
        message: >-
          Ciao Mori! Puoi farmi domande su quanto costa ogni cosa, usando i numeri e i
          verbi al presente?

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: moda-e-shopping-pratica
    book: workbook
