vocabulary:
  - slug: moda-e-shopping
    title: Moda e shopping
    items: *moda-e-shopping-words

activities:
  - slug: moda-e-shopping-descrizione
    title: Frasi descrittive
    minutes: 8
    items:
      - id: scarpe-sono
        type: multipleChoice
        prompt: Queste scarpe ___ comode.
        options:
          - { text: sono, correct: true }
          - { text: è, feedback: '*Scarpe* è plurale: usiamo *sono*.' }
          - { text: hanno, feedback: 'Per descrivere usiamo **essere**: *le scarpe sono comode*.' }
      - id: gonna-rossa
        type: multipleChoice
        prompt: La gonna è ___.
        options:
          - { text: rossa, correct: true }
          - { text: rosso, feedback: '*Gonna* è femminile: *la gonna è rossa*.' }
          - { text: rosse, feedback: '*Gonna* è singolare: *la gonna è rossa*.' }
      - id: pantaloni-comodi
        type: multipleChoice
        prompt: I pantaloni sono ___.
        options:
          - { text: comodi, correct: true }
          - { text: comodo, feedback: '*Pantaloni* è plurale: *i pantaloni sono comodi*.' }
          - {
              text: comode,
              feedback: '*Pantaloni* è maschile: *comodi*. *Comode* è per le cose femminili, come *le scarpe*.',
            }
      - id: ho-ha
        type: fillBlank
        prompt: Completa con il verbo *avere*.
        text: Io ___ una borsa rossa. Lei ___ cinque paia di scarpe.
        blanks: [[ho], [ha]]
      - id: aggettivi-concordanza
        type: fillBlank
        prompt: Scrivi l'aggettivo nella forma giusta.
        text: La maglietta è ___ (colorato). Le borse sono ___ (moderno).
        blanks: [[colorata], [moderne]]
      - id: aggettivi-ebraico
        type: matching
        prompt: Unisci ogni aggettivo al suo significato in ebraico.
        pairs:
          - [comodo, נוח]
          - [elegante, אלגנטי]
          - [largo, רחב]
          - [stretto, צמוד]
          - [morbido, רך]
      - id: essere-descrivere
        type: trueFalse
        prompt: 'Per descrivere i vestiti usiamo il verbo *essere*: *Il vestito è elegante.*'
        answer: true
        feedback:
          correct: Giusto! *Essere* descrive; *avere* dice quello che una persona ha.
          incorrect: 'Per descrivere usiamo *essere*: *il vestito è elegante*. *Avere* dice quello che una persona ha.'
      - id: ordina-scarpe
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Queste scarpe sono comode.

