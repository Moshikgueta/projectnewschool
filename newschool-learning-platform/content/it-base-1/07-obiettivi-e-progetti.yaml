vocabulary:
  - slug: obiettivi-e-progetti
    title: Obiettivi e progetti
    items: *obiettivi-e-progetti-words

activities:
  - slug: obiettivi-e-progetti-verbi
    title: Verbi al presente
    minutes: 8
    items:
      - id: io-studio
        type: multipleChoice
        prompt: Io ___ italiano ogni giorno.
        options:
          - { text: studio, correct: true }
          - { text: studia, feedback: '*Studia* è per *lui / lei*. Con *io*: *studio*.' }
          - { text: studiamo, feedback: '*Studiamo* è per *noi*. Con *io*: *studio*.' }
      - id: lei-lavora
        type: multipleChoice
        prompt: Lei ___ in un ufficio.
        options:
          - { text: lavora, correct: true }
          - { text: lavoro, feedback: '*Lavoro* è per *io*. Con *lei*: *lavora*.' }
          - { text: lavorano, feedback: '*Lavorano* è per *loro*. Con *lei*: *lavora*.' }
      - id: noi-voi
        type: fillBlank
        prompt: Scrivi il verbo al presente.
        text: Noi ___ (imparare) a cucinare. Voi ___ (leggere) molti libri?
        blanks: [[impariamo], [leggete]]
      - id: studiare-persone
        type: matching
        prompt: Unisci ogni persona alla forma di *studiare*.
        pairs:
          - [io, studio]
          - [tu, studi]
          - [lui / lei, studia]
          - [noi, studiamo]
          - [loro, studiano]
      - id: negativa
        type: multipleChoice
        prompt: Quale frase negativa è giusta?
        options:
          - { text: Non lavoro il sabato., correct: true }
          - { text: Lavoro non il sabato., feedback: '*Non* va **prima** del verbo: *Non lavoro*.' }
          - {
              text: No lavoro il sabato.,
              feedback: 'Prima del verbo usiamo *non*, non *no*: *Non lavoro*.',
            }
      - id: domanda-ordine
        type: trueFalse
        prompt: 'In italiano una domanda può avere lo stesso ordine delle parole di una frase affermativa: *Studi italiano?*'
        answer: true
        feedback:
