vocabulary:
  - slug: arti-e-mestieri
    title: Arti e mestieri
    items: *arti-e-mestieri-words

activities:
  - slug: arti-e-mestieri-descrittive
    title: 'Frasi descrittive: essere + aggettivo'
    minutes: 8
    items:
      - id: quadro-e
        type: multipleChoice
        prompt: Il quadro ___ bellissimo.
        options:
          - { text: è, correct: true }
          - { text: sono, feedback: '*Il quadro* è una cosa sola: usa *è*.' }
          - { text: ha, feedback: 'Per descrivere usiamo *essere*: *Il quadro è bellissimo.*' }
      - id: colori-luminosi
        type: multipleChoice
        prompt: I colori sono ___.
        options:
          - { text: luminosi, correct: true }
          - {
              text: luminoso,
              feedback: "*I colori* sono plurali: l'aggettivo è plurale, *luminosi*.",
            }
          - { text: luminose, feedback: '*Colori* è maschile: usa *luminosi*.' }
