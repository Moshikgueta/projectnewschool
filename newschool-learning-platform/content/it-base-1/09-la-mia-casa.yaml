vocabulary:
  - slug: la-mia-casa
    title: La mia casa
    items: *la-mia-casa-words

activities:
  - slug: la-mia-casa-descrizioni
    title: "Descrizioni: c'è, ci sono"
    minutes: 8
    items:
      - id: c-e-tavolo
        type: multipleChoice
        prompt: ___ un tavolo in cucina.
        options:
          - { text: "C'è", correct: true }
          - { text: Ci sono, feedback: "*Tavolo* è singolare: usiamo *c'è*." }
      - id: ci-sono-sedie
        type: multipleChoice
        prompt: ___ due sedie in soggiorno.
        options:
          - { text: Ci sono, correct: true }
          - { text: "C'è", feedback: '*Sedie* è plurale: usiamo *ci sono*.' }
      - id: bagno
        type: fillBlank
        prompt: "Completa con *c'è* o *ci sono*."
        text: Nel bagno ___ uno specchio e ___ due asciugamani.
        blanks: [["c'è"], [ci sono]]
        wordBank: ["c'è", ci sono]
      - id: casa-ha
        type: multipleChoice
        prompt: La mia casa ___ un giardino.
        options:
          - { text: ha, correct: true }
          - {
              text: è,
              feedback: 'Dopo il verbo viene un nome (*un giardino*): usiamo *avere* → *ha*.',
            }
      - id: essere-aggettivo
        type: trueFalse
        prompt: 'Per descrivere usiamo *essere* + aggettivo: *La cucina è luminosa.*'
        answer: true
        feedback:
          correct: Giusto! *È* + aggettivo (*luminosa*).
          incorrect: 'Per descrivere usiamo *essere* + aggettivo: *La cucina è luminosa.*'
      - id: camera-piccola
        type: multipleChoice
        prompt: La camera da letto è ___.
        options:
          - { text: piccola, correct: true }
          - { text: piccolo, feedback: '*Camera* è femminile: diciamo *piccola*.' }
          - { text: piccole, feedback: '*Camera* è singolare: diciamo *piccola*.' }
      - id: stanze-elementi
        type: matching
        prompt: Unisci ogni stanza a una cosa che c'è dentro.
        pairs:
          - [Cucina, forno]
          - [Camera da letto, letto]
          - [Bagno, doccia]
          - [Soggiorno, divano]
          - [Giardino, altalena]
      - id: ordina-divano
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: C'è un divano in soggiorno.

  - slug: la-mia-casa-verbi
    title: 'Verbi al presente: pulisco, dormo, mi alzo'
    minutes: 8
    items:
      - id: io-pulisco
        type: multipleChoice
        prompt: Io ___ la casa ogni settimana.
        options:
          - { text: pulisco, correct: true }
          - { text: pulo, feedback: '*Pulire* aggiunge *-isc-*: io *pulisco*.' }
          - { text: pulisce, feedback: '*Pulisce* è per lui / lei. Con *io* diciamo *pulisco*.' }
      - id: voglio-pulire
        type: multipleChoice
        prompt: Voglio ___ la casa.
        options:
          - { text: pulire, correct: true }
          - {
              text: pulisco,
              feedback: "Dopo *voglio* il verbo resta all'infinito: *voglio pulire*.",
            }
      - id: devo-infinito
        type: trueFalse
        prompt: "Dopo *devo* il verbo resta all'infinito: *Devo organizzare gli armadi.*"
        answer: true
        feedback:
