vocabulary:
  - slug: il-meteo
    title: Il meteo
    items: *il-meteo-words

activities:
  - slug: il-meteo-descrivere
    title: "Descrivere il tempo: c'è, ci sono, fa freddo"
    minutes: 8
    items:
      - id: c-e-tempesta
        type: multipleChoice
        prompt: Oggi ___ una tempesta.
        options:
          - { text: "c'è", correct: true }
          - { text: ci sono, feedback: "*Una tempesta* è singolare: usiamo *c'è*." }
      - id: ci-sono-nuvole
        type: multipleChoice
        prompt: ___ le nuvole nel cielo.
