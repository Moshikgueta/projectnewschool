vocabulary:
  - slug: divertimento-e-giochi
    title: Divertimento e giochi
    items: *divertimento-e-giochi-words

activities:
  - slug: divertimento-e-giochi-presente
    title: 'Frasi al presente: azioni'
    minutes: 8
    items:
      - id: lei-ascolta
        type: multipleChoice
        prompt: Lei ___ la musica. (ascoltare)
        options:
          - { text: ascolta, correct: true }
          - { text: ascolto, feedback: '*Ascolto* è per *io*. Con *lei* usa *ascolta*.' }
          - { text: ascolti, feedback: '*Ascolti* è per *tu*. Con *lei* usa *ascolta*.' }
      - id: guardo-tv
        type: multipleChoice
        prompt: Quale frase è corretta?
        options:
          - { text: Guardo la TV., correct: true }
          - {
              text: Io sono guardo la TV.,
              feedback: 'Non si mette *sono* prima di un altro verbo: *Guardo la TV.*',
            }
          - {
              text: Io guarda la TV.,
              feedback: '*Guarda* è per *lui / lei*. Con *io* usa *guardo*.',
            }
      - id: noi-giochiamo
        type: multipleChoice
        prompt: Noi ___ a carte.
        options:
          - { text: giochiamo, correct: true }
          - { text: giocano, feedback: '*Giocano* è per *loro*. Con *noi* usa *giochiamo*.' }
          - { text: giochi, feedback: '*Giochi* è per *tu*. Con *noi* usa *giochiamo*.' }
      - id: leggo-bevi
        type: fillBlank
        prompt: Completa con il verbo al presente.
        text: Io ___ (leggere) un libro e tu ___ (bere) il tè.
        blanks: [[leggo], [bevi]]
      - id: fratello-gioca
        type: fillBlank
        prompt: Completa con il verbo al presente.
        text: Mio fratello ___ (giocare) a calcio.
        blanks: [[gioca]]
      - id: senza-io
        type: trueFalse
        prompt: "In italiano posso dire *Gioco a tennis* senza *io*: il verbo dice già chi fa l'azione."
        answer: true
        feedback:
          correct: Giusto! *Gioco* è sempre *io*.
          incorrect: 'Il verbo dice già la persona: *gioco* = *io gioco*. *Io* si può togliere.'
      - id: guardare
        type: matching
        prompt: Unisci ogni persona al verbo *guardare*.
        pairs:
          - [io, guardo]
          - [tu, guardi]
          - [lui / lei, guarda]
          - [noi, guardiamo]
          - [loro, guardano]
      - id: ordina-film
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Mia sorella guarda un film.

  - slug: divertimento-e-giochi-possessivi
    title: 'Possessivi: mio, tuo, suo, nostro, loro'
    minutes: 8
    items:
      - id: la-nostra-casa
        type: multipleChoice
        prompt: ___ casa è grande. (di noi)
        options:
          - { text: La nostra, correct: true }
          - { text: Il nostro, feedback: '*Casa* è femminile: usa *la nostra*.' }
          - { text: Nostra, feedback: "Con una cosa serve l'articolo: *la nostra casa*." }
      - id: mio-fratello
        type: multipleChoice
        prompt: Quale frase è corretta?
        options:
          - { text: Mio fratello gioca a calcio., correct: true }
          - {
              text: Il mio fratello gioca a calcio.,
              feedback: "Con un parente al singolare non si usa l'articolo: *mio fratello*.",
            }
          - { text: Mia fratello gioca a calcio., feedback: '*Fratello* è maschile: usa *mio*.' }
      - id: la-sua-macchina
        type: multipleChoice
        prompt: Marco ha una macchina. ___ macchina è rossa.
        options:
          - { text: La sua, correct: true }
          - {
              text: Il suo,
              feedback: '*Macchina* è femminile: usa *la sua*, anche se Marco è un uomo.',
            }
          - { text: La loro, feedback: 'Marco è una persona sola: usa *la sua*.' }
      - id: i-loro-gatti
        type: multipleChoice
        prompt: Anna e Luca hanno due gatti. ___ gatti dormono sul divano.
        options:
          - { text: I loro, correct: true }
          - { text: I suoi, feedback: 'I gatti sono di due persone (Anna e Luca): usa *i loro*.' }
          - { text: Loro, feedback: "*Loro* ha sempre l'articolo: *i loro gatti*." }
      - id: suo-sua
        type: trueFalse
        prompt: '*Suo* e *sua* cambiano secondo la persona: *suo* per un uomo, *sua* per una donna.'
        answer: false
        feedback:
          correct: 'Giusto! Cambiano secondo la cosa: *il suo gioco*, *la sua casa*.'
          incorrect: 'Cambiano secondo la cosa, non la persona: *la sua macchina* (di Marco o di Anna).'
      - id: mio-mie
        type: fillBlank
        prompt: Completa con *mio*, *mia*, *miei* o *mie*.
        text: Il ___ gioco preferito è il Monopoli. Le ___ amiche giocano a tennis.
        blanks: [[mio], [mie]]
        wordBank: [mio, mia, miei, mie]
      - id: articolo-possessivo
        type: matching
        prompt: Unisci ogni sostantivo all'articolo e al possessivo giusti.
        pairs:
          - [gioco, il mio]
          - [casa, la mia]
          - [giochi, i miei]
          - [scarpe, le mie]
      - id: ordina-chitarra
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Il nostro amico suona la chitarra.
