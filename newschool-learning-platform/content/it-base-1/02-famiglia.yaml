vocabulary:
  - slug: famiglia
    title: Famiglia
    items: *famiglia-words

activities:
  - slug: famiglia-possessivi
    title: 'Possessivi: mio, mia, i miei, le mie'
    minutes: 8
    items:
      - id: mio-padre
        type: multipleChoice
        prompt: ___ padre si chiama Marco.
        options:
          - { text: Mio, correct: true }
          - {
              text: Il mio,
              feedback: "Con i parenti al singolare non usiamo l'articolo: *mio padre*.",
            }
          - { text: Mia, feedback: '*Padre* è maschile: usa *mio*.' }
      - id: le-mie-sorelle
        type: multipleChoice
        prompt: ___ sorelle abitano a Roma.
        options:
          - { text: Le mie, correct: true }
          - { text: Mie, feedback: "Con i parenti al plurale usiamo l'articolo: *le mie sorelle*." }
          - { text: I miei, feedback: '*Sorelle* è femminile plurale: usa *le mie*.' }
      - id: il-mio-amico
        type: multipleChoice
        prompt: ___ amico si chiama Luca.
        options:
          - { text: Il mio, correct: true }
          - {
              text: Mio,
              feedback: "Un amico non è un parente: di solito usiamo l'articolo, *il mio amico*.",
            }
          - { text: La mia, feedback: '*Amico* è maschile: usa *il mio*.' }
      - id: cambia-nome
        type: trueFalse
        prompt: 'Il possessivo cambia secondo il nome che viene dopo: *mio fratello*, *mia sorella*.'
        answer: true
        feedback:
          correct: Giusto! *Mio* con un nome maschile, *mia* con un nome femminile.
          incorrect: 'Il possessivo cambia secondo il nome (maschile o femminile, singolare o plurale): *mio fratello*, *mia sorella*.'
      - id: articolo-parenti
        type: trueFalse
        prompt: "Con i parenti al singolare usiamo l'articolo: *il mio padre*."
        answer: false
        feedback:
          correct: 'Giusto! Diciamo *mio padre*, senza articolo.'
          incorrect: "Con i parenti al singolare non usiamo l'articolo: *mio padre*, *mia madre*."
      - id: completa-possessivi
        type: fillBlank
        prompt: Completa con *mio*, *mia* o *i miei*.
        text: Questo è ___ fratello. Questi sono ___ cugini. Questa è ___ madre.
        blanks: [[mio], [i miei], [mia]]
        wordBank: [mio, mia, i miei]
      - id: unisci-possessivi
        type: matching
        prompt: Unisci ogni nome al possessivo giusto.
        pairs:
          - [___ padre, mio]
          - [___ madre, mia]
          - [___ fratelli, i miei]
          - [___ sorelle, le mie]
      - id: ordina-fratello
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Mio fratello si chiama Luca.

  - slug: famiglia-date
    title: Date e numeri
    minutes: 8
    items:
      - id: giorno-mese
        type: multipleChoice
        prompt: Quale frase è giusta?
        options:
          - { text: Il mio compleanno è il 9 febbraio., correct: true }
          - {
              text: Il mio compleanno è febbraio 9.,
              feedback: 'Prima il giorno, poi il mese: *il 9 febbraio*.',
            }
          - {
              text: Il mio compleanno è in 9 febbraio.,
              feedback: 'Davanti al giorno usiamo *il*: *il 9 febbraio*.',
            }
      - id: il-nel
        type: fillBlank
        prompt: Completa con *il* o *nel*.
        text: Sono nato ___ 5 marzo. Mia sorella è nata ___ 1998.
        blanks: [[il], [nel]]
        wordBank: [il, nel]
      - id: l-otto
        type: multipleChoice
        prompt: Torniamo a casa ___ luglio.
        options:
          - { text: l'8, correct: true }
          - { text: il 8, feedback: "*Otto* comincia con una vocale: diciamo *l'8 luglio*." }
          - { text: in 8, feedback: "Davanti al giorno usiamo *il* (o *l'*): *l'8 luglio*." }
      - id: numeri
        type: matching
        prompt: Unisci i numeri.
        pairs:
          - ['3', tre]
          - ['5', cinque]
          - ['7', sette]
          - ['9', nove]
          - ['10', dieci]
      - id: prima-giorno
        type: trueFalse
