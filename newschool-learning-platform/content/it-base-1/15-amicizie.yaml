    blocks:
      - id: intro
        type: text
        text: Esercitati con le due abilità del ciclo. Ogni risposta viene corretta subito, e puoi riprovare.
      - id: ex-descrittive
        type: activity
        activity: amicizie-descrittive
      - id: ex-presente
        type: activity
        activity: amicizie-presente

