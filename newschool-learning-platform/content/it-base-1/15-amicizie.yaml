vocabulary:
  - slug: amicizie
    title: Amicizie
    items: *amicizie-words

activities:
  - slug: amicizie-descrittive
    title: 'Frasi descrittive: è / sono + aggettivo'
    minutes: 8
    items:
      - id: amico-e
        type: multipleChoice
        prompt: Il mio amico ___ simpatico.
        options:
          - { text: è, correct: true }
          - { text: sono, feedback: '*Il mio amico* è una persona: usa *è*.' }
          - { text: sei, feedback: '*Sei* è per *tu*. Per *il mio amico* usa *è*.' }
      - id: amici-simpatici
        type: multipleChoice
        prompt: I miei amici sono ___.
        options:
          - { text: simpatici, correct: true }
          - {
              text: simpatico,
              feedback: "*I miei amici* è plurale: anche l'aggettivo va al plurale, *simpatici*.",
            }
          - { text: simpatiche, feedback: '*Amici* è maschile: usa *simpatici*.' }
      - id: amica-alta
        type: multipleChoice
        prompt: La mia amica è ___.
        options:
          - { text: alta, correct: true }
          - { text: alto, feedback: '*La mia amica* è femminile: usa *alta*.' }
          - { text: alte, feedback: '*La mia amica* è singolare: usa *alta*.' }
      - id: e-sono
        type: fillBlank
        prompt: Completa con *è* o *sono*.
        text: La mia amica ___ tranquilla. Le mie amiche ___ divertenti.
        blanks: [[è], [sono]]
        wordBank: [è, sono]
      - id: non-prima
        type: trueFalse
        prompt: 'Nella forma negativa, *non* va prima del verbo: *Il mio amico non è noioso.*'
        answer: true
        feedback:
          correct: Giusto! *Non* va sempre prima di *è* o *sono*.
          incorrect: 'La frase è corretta: *non* va prima del verbo, *non è noioso*.'
      - id: amico-negativo
        type: fillBlank
        prompt: 'Scrivi la frase alla forma negativa: *Il mio amico è rumoroso.*'
        text: Il mio amico ___ rumoroso.
        blanks: [[non è]]
      - id: abbina-persone
        type: matching
        prompt: Abbina ogni soggetto alla fine giusta. Guarda se è maschile o femminile, singolare o plurale.
        pairs:
          - [Il mio amico, è simpatico.]
          - [La mia amica, è alta.]
          - [I miei amici, sono simpatici.]
