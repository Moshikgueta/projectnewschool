          - { term: colloquio, gloss: ראיון }
          - { term: intervistatore, gloss: מראיין }
          - { term: dipendente, gloss: עובד }
          - { term: capo, gloss: בוס / מנהל }
          - { term: azienda, gloss: חברה }
          - { term: esperienza, gloss: ניסיון }
          - { term: responsabilità, gloss: אחריות }
          - { term: squadra, gloss: צוות }
          - { term: cliente, gloss: לקוח }
          - { term: animali, gloss: חיות }
          - { term: cani, gloss: כלבים }
          - { term: gatti, gloss: חתולים }
          - { term: stetoscopio, gloss: סטטוסקופ }
          - { term: veterinario, gloss: וטרינר }
