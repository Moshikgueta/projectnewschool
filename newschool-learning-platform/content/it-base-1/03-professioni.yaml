vocabulary:
  - slug: professioni
    title: Professioni
    items: *professioni-words

activities:
  - slug: professioni-azioni
    title: 'Azioni al presente: i verbi in -are e fare'
    minutes: 8
    items:
      - id: io-lavoro
        type: multipleChoice
        prompt: Io ___ in un ospedale.
        options:
          - { text: lavoro, correct: true }
          - {
              text: lavora,
              feedback: '*Lavora* è per *lui / lei*. Con *io* il verbo finisce in *-o*: *lavoro*.',
            }
          - { text: lavoriamo, feedback: '*Lavoriamo* è per *noi*. Con *io* usa *lavoro*.' }
      - id: faccio
        type: multipleChoice
        prompt: Cosa fai al lavoro? — ___ il cuoco.
        options:
          - { text: Faccio, correct: true }
          - { text: Fai, feedback: '*Fai* è per *tu*. Con *io* usa *faccio*.' }
          - { text: Fa, feedback: '*Fa* è per *lui / lei*. Con *io* usa *faccio*.' }
      - id: completa-are
        type: fillBlank
        prompt: Completa con il verbo al presente.
        text: Tu ___ (parlare) con i clienti. Lei ___ (usare) il computer. Noi ___ (aiutare) le persone.
        blanks: [[parli], [usa], [aiutiamo]]
      - id: completa-fare
        type: fillBlank
        prompt: Completa con il verbo *fare*.
        text: Voi cosa ___ al lavoro? — Noi ___ gli insegnanti. Loro ___ i camerieri.
        blanks: [[fate], [facciamo], [fanno]]
      - id: unisci-lavorare
        type: matching
        prompt: Unisci ogni persona alla forma del verbo *lavorare*.
        pairs:
          - [io, lavoro]
          - [tu, lavori]
          - [lui / lei, lavora]
          - [noi, lavoriamo]
          - [loro, lavorano]
      - id: lui-lavora
        type: trueFalse
        prompt: 'Con *lui* e *lei* i verbi in *-are* finiscono in *-a*: *lui guida*, *lei insegna*.'
        answer: true
        feedback:
          correct: Giusto! *Lui guida*, *lei insegna*, *il pilota viaggia*.
          incorrect: 'Con *lui* e *lei* il verbo finisce in *-a*: *lui guida*, *lei insegna*.'
      - id: tu-lavora
        type: trueFalse
        prompt: 'Con *tu* diciamo: *Tu lavora con le persone?*'
        answer: false
        feedback:
          correct: 'Giusto! Con *tu* il verbo finisce in *-i*: *Tu lavori con le persone?*'
          incorrect: 'Con *tu* il verbo finisce in *-i*: *Tu lavori con le persone?*'
      - id: ordina-veterinario
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Il veterinario aiuta gli animali.

  - slug: professioni-numeri
    title: "Numeri: quanti, c'è / ci sono, l'ora"
    minutes: 8
    items:
      - id: decine
        type: matching
        prompt: Unisci i numeri.
        pairs:
          - ['20', venti]
          - ['30', trenta]
          - ['40', quaranta]
          - ['50', cinquanta]
          - ['100', cento]
      - id: quante-ore
        type: multipleChoice
        prompt: ___ ore lavori ogni settimana?
        options:
          - { text: Quante, correct: true }
          - { text: Quanti, feedback: '*Ore* è femminile plurale: usa *quante*.' }
          - { text: Quando, feedback: '*Quando* chiede il tempo. Per un numero usa *quante*.' }
      - id: quanti-giorni
        type: multipleChoice
        prompt: ___ giorni lavori a settimana?
        options:
          - { text: Quanti, correct: true }
          - { text: Quante, feedback: '*Giorni* è maschile plurale: usa *quanti*.' }
          - { text: Dove, feedback: '*Dove* chiede un luogo. Per un numero usa *quanti*.' }
      - id: cinque
        type: fillBlank
        prompt: Scrivi il numero in lettere.
        text: 'Lavoro 5 giorni a settimana: lavoro ___ giorni.'
        blanks: [[cinque]]
      - id: ce-ci-sono
        type: fillBlank
        prompt: Completa con *c'è* o *ci sono*.
        text: Nella mia scuola ___ tre insegnanti. ___ una receptionist.
        blanks: [[ci sono], ["c'è", 'c’è']]
        wordBank: ["c'è", ci sono]
      - id: alle-nove
        type: multipleChoice
