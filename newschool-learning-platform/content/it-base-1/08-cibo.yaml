vocabulary:
  - slug: cibo
    title: Cibo
    items: *cibo-words

activities:
  - slug: cibo-presente
    title: 'Verbi al presente: mangio, mangi, mangia'
    minutes: 8
    items:
      - id: io-mangio
        type: multipleChoice
        prompt: Io ___ la pizza.
        options:
          - { text: mangio, correct: true }
          - { text: mangia, feedback: '*Mangia* è per lui / lei. Con *io* diciamo *mangio*.' }
          - { text: mangi, feedback: '*Mangi* è per tu. Con *io* diciamo *mangio*.' }
      - id: madre-beve
        type: multipleChoice
        prompt: Mia madre ___ acqua.
        options:
          - { text: beve, correct: true }
          - { text: bevo, feedback: '*Bevo* è per io. Mia madre = lei: diciamo *beve*.' }
          - { text: bevono, feedback: '*Bevono* è per loro. Mia madre = lei: diciamo *beve*.' }
      - id: noi-mangiamo
        type: multipleChoice
        prompt: Noi ___ la pizza il sabato.
        options:
          - { text: mangiamo, correct: true }
          - { text: mangiano, feedback: '*Mangiano* è per loro. Con *noi* diciamo *mangiamo*.' }
          - { text: mangiate, feedback: '*Mangiate* è per voi. Con *noi* diciamo *mangiamo*.' }
      - id: tu-mangi
        type: fillBlank
        prompt: Completa con il verbo *mangiare* al presente.
        text: Tu ___ la pasta.
        blanks: [[mangi]]
      - id: io-taglio
        type: fillBlank
        prompt: Completa con il verbo *tagliare* alla persona *io*.
        text: Io ___ il pane a metà.
        blanks: [[taglio]]
      - id: non-prima
        type: trueFalse
        prompt: 'Per la forma negativa usiamo *non* prima del verbo: *Io non mangio il pesce.*'
        answer: true
        feedback:
          correct: Giusto! *Non* va sempre prima del verbo.
          incorrect: '*Non* va prima del verbo: *Io non mangio il pesce.*'
      - id: infinito-io
        type: matching
        prompt: Unisci l'infinito alla forma con *io*.
        pairs:
          - [tagliare, io taglio]
          - [aprire, io apro]
          - [chiudere, io chiudo]
          - [mettere, io metto]
          - [aggiungere, io aggiungo]
      - id: ordina-pesce
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Io non mangio il pesce.

  - slug: cibo-possessivi
    title: 'Possessivi: il mio, il tuo, il suo'
    minutes: 8
    items:
      - id: mio-padre
        type: multipleChoice
        prompt: ___ padre ama il cioccolato.
        options:
          - { text: Mio, correct: true }
          - {
              text: Il mio,
              feedback: "Con i parenti al singolare non usiamo l'articolo: *mio padre*.",
            }
          - { text: Mia, feedback: '*Padre* è maschile: diciamo *mio padre*.' }
      - id: miei-amici
