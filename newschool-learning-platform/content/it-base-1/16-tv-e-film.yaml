vocabulary:
  - slug: tv-e-film
    title: TV e film
    items: *tv-film-words

activities:
  - slug: tv-e-film-domande
    title: 'Fare domande: chi, dove, quale, quando'
    minutes: 8
    items:
      - id: qual-film
        type: multipleChoice
        prompt: ___ è il tuo film preferito?
        options:
          - { text: Qual, correct: true }
          - { text: Chi, feedback: '*Chi* è per le persone. Per scegliere un film usa *qual*.' }
          - { text: Dove, feedback: '*Dove* è per i luoghi. Per scegliere un film usa *qual*.' }
      - id: dove-netflix
        type: multipleChoice
        prompt: '___ guardi i film italiani? — Su Netflix.'
        options:
          - { text: Dove, correct: true }
          - {
              text: Quando,
              feedback: '*Quando* chiede il tempo (la sera, alle 8). Qui la risposta è un luogo: usa *dove*.',
            }
          - {
              text: Chi,
              feedback: '*Chi* chiede una persona. Qui la risposta è un luogo: usa *dove*.',
            }
      - id: chi-attore
        type: multipleChoice
        prompt: '___ è il tuo attore preferito? — Marcello Mastroianni.'
        options:
          - { text: Chi, correct: true }
          - { text: Cosa, feedback: '*Cosa* chiede una cosa. Per una persona usa *chi*.' }
          - { text: Dove, feedback: '*Dove* chiede un luogo. Per una persona usa *chi*.' }
      - id: abbina-domande
        type: matching
        prompt: Abbina ogni parola interrogativa a una risposta possibile.
        pairs:
          - [Chi?, Sophia Loren.]
          - [Dove?, A Roma.]
          - [Quando?, Alle 8 di sera.]
          - [Perché?, Perché è divertente.]
          - [Cosa?, Un film.]
      - id: chi-dove
        type: fillBlank
        prompt: Completa con *chi* o *dove*.
        text: '___ è il tuo regista preferito? — Federico Fellini. ___ è ambientato il film? — A Roma.'
        blanks: [[Chi, chi], [Dove, dove]]
        wordBank: [Chi, Dove]
      - id: domanda-chiusa
        type: trueFalse
        prompt: '*Sei un attore?* è una domanda chiusa: la risposta è solo *sì* o *no*.'
        answer: true
        feedback:
          correct: Giusto! Le domande chiuse non hanno una parola interrogativa.
          incorrect: 'A *Sei un attore?* rispondiamo solo *sì* o *no*: è una domanda chiusa.'
      - id: domanda-roma
        type: multipleChoice
        prompt: 'Risposta: *Il film è ambientato a Roma.* Qual è la domanda giusta?'
        options:
          - { text: Dove è ambientato il film?, correct: true }
          - {
              text: Quando è ambientato il film?,
              feedback: '*Quando* chiede il tempo. *A Roma* è un luogo: usa *dove*.',
            }
          - {
              text: Chi è ambientato il film?,
              feedback: '*Chi* chiede una persona. *A Roma* è un luogo: usa *dove*.',
            }
      - id: ordina-film
        type: reorderSentence
        prompt: Metti le parole in ordine per fare una domanda.
        sentence: Qual è il tuo film preferito?

  - slug: tv-e-film-preposizioni
    title: 'Preposizioni: in, a, con, su'
    minutes: 8
    items:
      - id: a-roma
        type: multipleChoice
        prompt: Il film è ambientato ___ Roma.
        options:
          - { text: a, correct: true }
          - {
              text: in,
              feedback: 'Con le città usiamo *a*: *a Roma*. *In* è per i paesi: *in Italia*.',
            }
          - {
              text: su,
              feedback: "*Su* è per l'argomento (*un film su un viaggio*). Con le città usiamo *a*.",
            }
      - id: in-italia
        type: multipleChoice
        prompt: Il personaggio principale vive ___ Italia.
        options:
          - { text: in, correct: true }
          - {
              text: a,
              feedback: '*A* è per le città (*a Roma*). Con i paesi usiamo *in*: *in Italia*.',
            }
          - { text: con, feedback: '*Con* è per la compagnia. Con i paesi usiamo *in*.' }
      - id: alle-otto
        type: fillBlank
        prompt: Completa con la preposizione giusta.
        text: Guardo il film ___ 8 di sera.
        blanks: [[alle]]
      - id: nel-in
        type: fillBlank
        prompt: Completa con *nel* o *in*.
        text: Il film è ambientato ___ 1995, ___ estate.
        blanks: [[nel], [in]]
        wordBank: [nel, in]
      - id: abbina-preposizioni
        type: matching
        prompt: Abbina ogni espressione a quello che indica.
        pairs:
          - [alle 5, un'ora]
          - [in gennaio, un mese]
          - [nel 2023, un anno]
          - [a Roma, una città]
          - [in Italia, un paese]
      - id: film-su
        type: multipleChoice
        prompt: È un film ___ un viaggio.
        options:
          - { text: su, correct: true }
          - {
              text: con,
