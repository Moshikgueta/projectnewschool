vocabulary:
  - slug: scoperte
    title: Scoperte
    items: *scoperte-words

activities:
  - slug: scoperte-azioni
    title: 'Azioni al presente: cosa fanno?'
    minutes: 8
    items:
      - id: giraffa-mangia
        type: multipleChoice
        prompt: La giraffa ___ le foglie.
        options:
          - { text: mangia, correct: true }
          - { text: mangio, feedback: '*Mangio* è per *io*. Con *la giraffa* (lei) usa *mangia*.' }
          - {
              text: mangiano,
              feedback: '*Mangiano* è per *loro*. *La giraffa* è una: usa *mangia*.',
            }
      - id: uccelli-volano
        type: multipleChoice
        prompt: Gli uccelli ___.
        options:
          - { text: volano, correct: true }
          - {
              text: vola,
              feedback: '*Vola* è per un uccello (lui / lei). *Gli uccelli* sono loro: *volano*.',
            }
          - { text: voli, feedback: '*Voli* è per *tu*. Con *gli uccelli* (loro) usa *volano*.' }
      - id: scimmia
        type: multipleChoice
        prompt: Cosa fa la scimmia?
        options:
          - { text: La scimmia si arrampica., correct: true }
          - {
              text: La scimmia arrampica.,
              feedback: 'Il verbo è *arrampicarsi*: con lui / lei si dice *si arrampica*.',
            }
          - {
              text: La scimmia si arrampicano.,
              feedback: '*Arrampicano* è per *loro*. La scimmia è una: *si arrampica*.',
            }
      - id: studiamo
        type: fillBlank
        prompt: Completa con il verbo al presente.
        text: Noi ___ (studiare) italiano.
        blanks: [[studiamo]]
      - id: canto-disegni
        type: fillBlank
        prompt: Completa con il verbo al presente.
        text: Io ___ (cantare) e tu ___ (disegnare).
        blanks: [[canto], [disegni]]
      - id: cambia-forma
        type: trueFalse
        prompt: 'In italiano il verbo cambia forma secondo la persona: *io canto, tu canti, lei canta*.'
        answer: true
        feedback:
          correct: Giusto! Ogni persona ha la sua forma.
          incorrect: 'Il verbo cambia: *io canto, tu canti, lei canta, noi cantiamo*.'
      - id: camminare
        type: matching
        prompt: Unisci ogni persona al verbo *camminare*.
        pairs:
          - [io, cammino]
          - [tu, cammini]
          - [lui / lei, cammina]
          - [noi, camminiamo]
          - [loro, camminano]
