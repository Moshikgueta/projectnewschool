vocabulary:
  - slug: viaggi
    title: Viaggi
    items: *viaggi-words

activities:
  - slug: viaggi-domande
    title: 'Domande: dove, quando, con chi, perché'
    minutes: 8
    items:
      - id: quando-vacanza
        type: multipleChoice
        prompt: ___ vai in vacanza? —Vado in vacanza a luglio.
        options:
          - { text: Quando, correct: true }
          - { text: Dove, feedback: '*Dove* chiede un luogo. *A luglio* è un tempo: usa *quando*.' }
          - {
              text: Perché,
              feedback: '*Perché* chiede una ragione. *A luglio* è un tempo: usa *quando*.',
            }
      - id: con-chi
        type: multipleChoice
        prompt: ___ viaggi? —Viaggio con i miei amici.
        options:
          - { text: Con chi, correct: true }
          - {
              text: Chi,
              feedback: 'La risposta è *con i miei amici*: anche la domanda ha *con*. *Con chi viaggi?*',
            }
          - {
              text: Dove,
              feedback: '*Dove* chiede un luogo. La risposta dice delle persone: *Con chi viaggi?*',
            }
      - id: completa-dove-perche
        type: fillBlank
        prompt: Completa con *dove* o *perché*.
        text: ___ dormi quando viaggi? —In un hotel. ___ viaggi? —Perché mi piace esplorare.
        blanks: [[Dove, dove], [Perché, perché]]
        wordBank: [Dove, Perché]
      - id: unisci-risposte
        type: matching
        prompt: Unisci ogni domanda alla sua risposta.
        pairs:
          - [Come viaggi?, Viaggio in aereo.]
          - [Dove vuoi andare?, Voglio andare a Parigi.]
          - [Cosa porti con te in viaggio?, Porto una macchina fotografica.]
          - [Chi viaggia con te?, Mia sorella.]
      - id: non-domanda
        type: trueFalse
        prompt: "Per fare una domanda negativa aggiungiamo *non* prima del verbo: *Non c'è un festival famoso ogni anno?*"
        answer: true
        feedback:
          correct: Giusto! *Non* va prima del verbo.
          incorrect: "È giusto: *non* va prima del verbo (*Non c'è…?*)."
      - id: senza-do
        type: multipleChoice
        prompt: Quale domanda è corretta?
        options:
          - { text: Dove dormi quando viaggi?, correct: true }
          - {
              text: Dove fai dormi quando viaggi?,
              feedback: "In italiano non c'è un verbo «aiutante» come *do* in inglese: *Dove dormi?*",
            }
          - {
              text: Dove dormire quando viaggi?,
              feedback: 'Il verbo cambia secondo la persona. Con *tu*: *Dove dormi?*',
            }
      - id: ordina-valigia
        type: reorderSentence
        prompt: Metti le parole in ordine per fare una domanda.
        sentence: Cosa metti in valigia?
      - id: mia-domanda
        type: shortAnswer
        prompt: Scrivi una domanda per un compagno sul suo viaggio. Usa *dove*, *quando* o *come*.

  - slug: viaggi-indicazioni
    title: 'Indicazioni: vai dritto, gira a sinistra'
    minutes: 8
    items:
      - id: gira-sinistra
        type: multipleChoice
        prompt: 'Il museo è a sinistra. Che cosa dici?'
        options:
          - { text: Gira a sinistra., correct: true }
          - {
              text: Gira a destra.,
              feedback: '*Destra* è il contrario di *sinistra*. Il museo è a sinistra: *Gira a sinistra*.',
            }
          - {
              text: Vai dritto.,
              feedback: '*Vai dritto* vuol dire non cambiare direzione. Il museo è a sinistra: *Gira a sinistra*.',
            }
      - id: completa-isolati
        type: fillBlank
        prompt: Completa le indicazioni.
        text: Prosegui ___ per due isolati. Al semaforo gira a ___.
        blanks: [[dritto, diritto], [destra, sinistra]]
      - id: unisci-posizione
        type: matching
        prompt: Unisci ogni espressione al suo significato in ebraico.
        pairs:
          - [accanto a, ליד]
          - [di fronte a, מול]
          - [a destra, ימינה]
          - [a sinistra, שמאלה]
          - [Vai dritto, לך ישר]
      - id: sulla-sinistra
        type: trueFalse
        prompt: '*Il museo è sulla sinistra* vuol dire che il museo è a destra.'
        answer: false
        feedback:
          correct: Giusto! *Sulla sinistra* vuol dire a sinistra.
          incorrect: '*Sulla sinistra* vuol dire a sinistra, non a destra.'
      - id: per-isolati
        type: multipleChoice
        prompt: Cammina ___ due isolati.
        options:
          - { text: per, correct: true }
          - {
              text: a,
              feedback: 'Per dire quanta strada fare usiamo *per*: *Cammina per due isolati*.',
            }
          - {
              text: di,
              feedback: 'Per dire quanta strada fare usiamo *per*: *Cammina per due isolati*.',
            }
      - id: accanto-alla
        type: multipleChoice
        prompt: La stazione è ___ banca.
        options:
          - { text: accanto alla, correct: true }
          - {
              text: accanto la,
              feedback: 'Diciamo *accanto a*: *a* + *la* = *alla*. *Accanto alla banca*.',
            }
          - {
              text: accanto a la,
              feedback: '*A* + *la* diventa una parola sola: *alla*. *Accanto alla banca*.',
            }
      - id: ordina-semaforo
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Al semaforo gira a destra.
      - id: di-fronte
        type: fillBlank
        prompt: Completa con la parola che manca.
        text: Vai dritto. Il museo è ___ fronte alla stazione.
        blanks: [[di]]
