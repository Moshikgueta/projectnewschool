status: in_review

review:
  - >-
    The two workbook exercises ("tafaaal-routine-meaning" and
    "tafaaal-routine-past") are NEW: the notebook has no self-study exercises.
    They were written only from this cycle's summary, examples and verbs, and use
    only the verbs judged safe (תְגַ'סַּל, תְמַרַּן, תְדַ'כַּר, תְעַשָּׁא and their
    Form II partners). An Arabic teacher must check every right answer, every wrong
    option and every transliteration before students see them.
  - >-
    Grammar explanations rewritten — an Arabic teacher must approve before
    publishing. Every rewritten rule or table is marked in a teacher note with
    "תוקן — לבדיקת המורה". Details in the entries below.
  - >-
    Central idea rewritten. Original: "אַתּ-תַפַּעּוּל = הפועל חוזר על עצמו – אני
    עושה משהו לעצמי. אין אדם נוסף. הפעולה היא עלייך." Now: Form V is Form II
    (פַעַּל) with a ת prefix; it is often the reflexive of Form II (גַ'סַּל →
    תְגַ'סַּל), but not always (תְעַלַּם "learned" from עַלַּם "taught", תְעַשָּׁא
    "had dinner", תְמַנָּא "wished", which the lesson itself uses). The summary's
    "key sentence" אַנָא בַּעְמַל אַלְ-פַּעְלָה עַלָּא חַאלִי was kept, with this
    nuance added.
  - >-
    Present table (Explanation 1, stage 4) rebuilt. Original columns "root | פעל (אני
    עושה) | התפעלל | meaning" mixed Form I and Form II forms (בִּגְ'סַל, בִּלְבַּס,
    בִּדַ'כֻּר are Form I; בְּמַרֵּן is Form II) and wrote the root of "wake up" as
    "צ'ח-י" with "בִּצַ'חִּי" (צ' = ض, which gives a different root, ضحّى "sacrificed");
    the root is ص-ح-ي. The new table pairs Form II (action on someone/something
    else, past "he") with Form V (on myself: present "I" as in the notebook, past
    "he"). The Form II forms (גַ'סַּל, לַבַּס, דַ'כַּר, מַרַּן, צַחָּא) were added by
    the converter: please check.
  - >-
    Past table (Explanation 2, stage 3) corrected: the "she" row had "תְצַחֵּית /
    תְמַרַּנֵת"; תְצַחֵּית is the "I/you" form, so the row is now תְצַחַּת / תְמַרַּנַת /
    תְגַ'סַּלַת (please check the vowels). The "he" row's Hebrew said only "הוא
    התעורר" for three verbs; now התעורר / התאמן / התרחץ.
  - >-
    "דגש חשוב: העבר של אַתּ-תַפַּעּוּל מתחיל ב-תּ" was wrong: the ת belongs to the
    pattern and appears in the present too (בִּתְגַ'סַּל). Rewritten: the ת marks the
    pattern; the past is marked by the endings (תְגַ'סַּלְת) and by the missing
    בִּ־ prefix. The same fix was applied to the summary's "common mistakes".
  - >-
    Explanation 2 listed "אַנָא כֻּנְת בִּתְצַחָּא אַסָּאעָה 7" as the simple past.
    It is the habitual past ("I used to wake up at 7"). It is kept, labelled as a
    habit, and the simple-past line "אַנָא תְצַחֵּיְת אַסָּאעָה 7" (from the past
    table) was added next to it. Teacher note added.
  - >-
    Doubtful verb, please decide: "תְצַחָּא / בִּתְצַחָּא / תְצַחֵּיְת" (woke up) is
    the lesson's main example. Many Levantine speakers say צְחִית / פִקְת for "I woke
    up" (Form I). It was kept as the notebook has it but left out of the exercises.
    Also less sure: תְלַבַּס (got dressed; לִבְסְת is common) and the Activity 1
    challenge "אַנָא לַבַּסְת אַלְ-גַ'אכֵּיט" (dressing a jacket?), and בִּתְחַסּ /
    תְחַסּ (felt) in Activities 2 and 4. None of these is in the exercises.
  - >-
    Dialect choice not corrected: the notebook writes the present "I" of Form V with
    בִּתְ… (אַנָא בִּתְגַ'סַּל), where many Palestinian speakers say בַּתְ…; and the
    habitual past as כֻּנְת בִּתְ… (others say כֻּנְת אַתְ…). Kept; please confirm.
  - >-
    Errors fixed in Arabic lines: Activity 1 "כֻּנְת תִּתְנָאם" → "כֻּנְת תְּנָאם"
    (נָאם has no Form V; the warm-up has תְּנָאם); Activity 4 template
    "וְתְנַּמְת" → "וְנִמְת" (I slept); Activity 2 "כֻּנְת בִּתְעַמַּלוּ וְהַלַּק מָא
    בִּתְעַמַּלוּ" → "כֻּנְת תַּעְמַלוּ וְהַלַּק מָא בְּתַעְמַלוּ" (as in the warm-up;
    עמל here is Form I); Activity 1 challenge "צַ'חֵּיְת" → "צַחֵּיְת" (ص, not ض).
  - >-
    Typos fixed: "בּ-חֻ'ב" → "בּ-חֻבּ" (opening; ח' is خ, the verb is ḥubb);
    "מֻ'בַּכֵּר" → "מֻבַּכֵּר" (3 times) and "מֻ'צָ'ארִע" → "מֻצָ'ארִע" (stray geresh on
    מ); Arabic comma "،" replaced by a blank/comma in two templates.
  - >-
    Not corrected, spelling variants: the notebook writes ص both as צ (בִּתְצַחָּא)
    and as צ' (אַצּ-צֻ'בְּח, אַצּ-צֻ'חוּן), and ג' for both غ (גַ'סַּל) and ج
    (תְגַ'הַּזְת, גַ'אכֵּיט); "תַגַ'יַּר / תְגַ'יַּרְת"; "עַשָּׁאן" (elsewhere in the
    course עַלַשַאן); "בַּסִּיט / בָּסִיט". Kept as written. Activity 2 teacher tip
    "עַטִינִי דַ'ּוְוּמָה חַקִּיקִיָּה" is unclear (maybe עַטִינִי מִשָּׁאל חַקִּיקִי,
    as at the end of Activity 4): please check.
  - >-
    Activity 3 has no answer key in the notebook (the teacher must not give
    answers). A suggested key was added as a teacher note (תוקן — לבדיקת המורה);
    "אַנָא גַ'סַּלְת חַאלִי" and "דַ'כַּרְת חַאלִי אַלְ-מוֹעִד" are marked "depends /
    unnatural" rather than wrong. Same for the Activity 1 challenge and the
    homework parts B and C.
  - >-
    The notebook has no vocabulary list: the vocabulary section was built from the
    verbs and key words the lesson uses (glosses by the converter, please check).
    No links in this cycle. The stray chat line "הנה פעילות 4 להוסיף לשיעור:" and
    the duplicated title line were left out. In the notebook the grammar summary
    sits between Activities 3 and 4; it is in the summary section here. Time ranges
    "3–5 minutes" are recorded as 5.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: tafaaal-routine-class
    title: 'שיעור: תְפַעַּל – שגרת החיים שלי בעבר'
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'תְפַעַּל (בניין V) – שגרת החיים שלי בעבר'
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: 'פעל רגיל או תְפַעַּל? (הבחנה במשמעות)'
            description: "גַ'סַּלְת אַצּ-צֻ'חוּן (שטפתי את הכלים) מול תְגַ'סַּלְת (התרחצתי); דַ'כַּר (הזכיר) מול תְדַ'כַּר (נזכר)."
          - name: 'שגרה בעבר עם תְפַעַּל'
            description: "תְמַרַּנְת, תְגַ'סַּלְת, תְעַשֵּׁיְת; כֻּנְת + הווה להרגל בעבר: כֻּנְת בִּתְמַרַּן."
      - id: goals
        type: callout
        lang: he
        tone: info
        title: 'רמה 3 | 90 דקות'
        text: 'מיומנויות: הבחנה סמנטית, דיבור, שימוש ספונטני.'
      # ── opening ──
      - id: intro-title
        type: heading
        lang: he
        level: 3
        text: 'סבב היכרות (10 דקות)'
      - id: intro-how
        type: text
        lang: he
        text: 'כל תלמיד אומר לפחות 3 משפטים בעבר. תלמיד אחר חייב לשאול שאלה. מרחיבים – לא תשובות של מילה אחת.'
      - id: intro
        type: sentenceFrame
        frame: |-
          אַנָא כֻּנְת בּ-___ כֻּל יוֹם.
          אַנָא כֻּנְת בּ-חֻבּ אַתְעַלַּם ___ עַשָּׁאן ___.
          כָּאן רוּתִינִי פִּל-מָאצִ'י ___.
          בַּעְדֵּין כֻּל שִׁי תַגַ'יַּר לַּאַנּוּ ___.
      - id: prep-h
        type: heading
        lang: he
        level: 4
        text: שאלות הכנה
      - id: prep
        type: discussionQuestions
        items:
          - question: "שׁוּ כָּאן רוּתִינַכּ אַצּ-צֻ'בְּח זְמָאן?"
          - question: 'שׁוּ כֻּנְת תַּעְמַל קַבְּל אַנּוֹם?'
          - question: 'אֵימְתָא כֻּנְת תִּצְחָא וְאֵימְתָא כֻּנְת תְּנָאם?'
          - question: "שׁוּ תַגַ'יַּר מִן זְמָאן לַהַלַּק?"
          - question: 'פִּי שִׁי כֻּנְת תַּעְמַלוּ כֻּל יוֹם וְהַלַּק מָא בְּתַעְמַלוּ?'
      # ── explanation 1 ──
      - id: exp1-title
        type: heading
        lang: he
        level: 3
        text: 'הסבר דידקטי 1 – תְפַעַּל בהווה (10 דקות)'
      - id: exp1-idea
        type: ruleSummary
        lang: he
        skill: הרעיון המרכזי
        rules:
          - text: 'תְפַעַּל (אַתּ-תַפַּעּוּל, בניין V) הוא בניין פַעַּל (בניין II) עם **ת** בהתחלה. לרוב הוא אומר שהפעולה **חוזרת אל מי שעושה אותה** – אני עושה אותה לעצמי, ואין אדם או חפץ נוסף שמקבל אותה. כמו בעברית: רחץ ← התרחץ, הלביש ← התלבש.'
            examples:
              - "גַ'סַּל (רחץ משהו / מישהו) ← תְגַ'סַּל (התרחץ)"
              - 'מַרַּן (אימן מישהו) ← תְמַרַּן (התאמן)'
              - "דַ'כַּר (הזכיר למישהו) ← תְדַ'כַּר (נזכר)"
          - text: 'שימו לב: לא כל פועל בבניין הזה הוא ״לעצמי״ ממש. יש פעלים שהם הצד ״המקבל״ של בניין II, ויש פעלים עם משמעות משלהם.'
            examples:
              - 'עַלַּם (לימד) ← תְעַלַּם (למד)'
              - 'תְעַשָּׁא (אכל ארוחת ערב)'
              - 'תְמַנָּא (ייחל, רצה מאוד)'
      - id: exp1-step1
        type: text
        lang: he
        text: 'שלב 1 – חשיפה: המורה כותב על הלוח.'
      - id: exp1-examples
        type: examples
        items:
          - text: "אַנָא בִּתְצַחָּא אַצּ-צֻ'בְּח"
            gloss: אני מתעורר בבוקר
          - text: "אַנָא בִּתְגַ'סַּל"
            gloss: אני מתרחץ
          - text: 'אַנָא בִּתְלַבַּס'
            gloss: אני מתלבש
          - text: 'אַנָא בִּתְמַרַּן'
            gloss: אני מתאמן
          - text: "אַנָא בִּתְדַ'כַּר אַלְ-אַשְׁיָא"
            gloss: אני נזכר בדברים
      - id: exp1-step2-h
        type: heading
        lang: he
        level: 4
        text: 'שלב 2 – שאלות מנחות'
      - id: exp1-step2
        type: discussionQuestions
        answerable: false
        items:
          - question: 'מִין עָמַל אַלְ-פַּעְלָה?'
          - question: "פִּי חַדָּא תָּאנִי פִּי אַלְ-גּ'מְלָה?"
          - question: 'מִין אַלְּלִי אִסְתַפַאד מִן אַלְ-פַּעְלָה?'
      - id: exp1-rule
        type: ruleSummary
        lang: he
        skill: 'שלב 3 – ניסוח החוק (על ידי התלמידים)'
        rules:
          - text: 'הפעולה חוזרת לדובר – רפלקסיבי.'
            examples:
              - 'אַתּ-תַפַּעּוּל = אַנָא בַּעְמַל אַלְ-פַּעְלָה לַחַאלִי / עַלָּא חַאלִי'
      - id: exp1-table
        type: table
        lang: he
        caption: 'שלב 4 – פעל רגיל (בניין II) מול תְפַעַּל (בניין V)'
        header:
          [
            שורש,
            'פעל רגיל – הוא, עבר (על אחר)',
            'תְפַעַּל – אני, הווה',
            'תְפַעַּל – הוא, עבר',
            משמעות,
          ]
        rows:
          - ['צ-ח-י', 'צַחָּא (העיר מישהו)', 'אַנָא בִּתְצַחָּא', 'תְצַחָּא', להתעורר]
          - ["ג'-ס-ל", "גַ'סַּל (רחץ, שטף משהו)", "אַנָא בִּתְגַ'סַּל", "תְגַ'סַּל", להתרחץ]
          - ['ל-ב-ס', 'לַבַּס (הלביש מישהו)', 'אַנָא בִּתְלַבַּס', 'תְלַבַּס', להתלבש]
          - ["ד'-כ-ר", "דַ'כַּר (הזכיר למישהו)", "אַנָא בִּתְדַ'כַּר", "תְדַ'כַּר", להיזכר]
          - ['מ-ר-ן', 'מַרַּן (אימן מישהו)', 'אַנָא בִּתְמַרַּן', 'תְמַרַּן', להתאמן]
      - id: exp1-practice
        type: speakingPrompt
        lang: he
        minutes: 5
        text: 'מיני תרגול: כל תלמיד אומר 2–3 משפטים בהווה עם תְפַעַּל. בן הזוג שואל: לֵישׁ? / אֵימְתָא? / כֵּיף?'
      # ── explanation 2 ──
      - id: exp2-title
        type: heading
        lang: he
        level: 3
        text: 'הסבר דידקטי 2 – תְפַעַּל בעבר (10 דקות)'
      - id: exp2-step1
        type: text
        lang: he
        text: 'שלב 1 – חשיפה: מהווה לעבר.'
      - id: exp2-present
        type: examples
        items:
          - text: 'אַנָא בִּתְצַחָּא אַסָּאעָה 7'
            gloss: 'הווה: אני מתעורר בשעה 7'
          - text: "אַנָא בִּתְגַ'סַּל כֻּל יוֹם"
            gloss: 'הווה: אני מתרחץ כל יום'
          - text: "אַנָא בִּתְמַרַּן אַצּ-צֻ'בְּח"
            gloss: 'הווה: אני מתאמן בבוקר'
      - id: exp2-past
        type: examples
        items:
          - text: 'אַנָא תְצַחֵּיְת אַסָּאעָה 7'
            gloss: 'עבר: התעוררתי בשעה 7'
          - text: 'אַנָא כֻּנְת בִּתְצַחָּא אַסָּאעָה 7'
            gloss: 'הרגל בעבר: נהגתי להתעורר בשעה 7'
          - text: "אַנָא תְגַ'סַּלְת כֻּל יוֹם"
            gloss: 'עבר: התרחצתי כל יום'
          - text: "אַנָא תְמַרַּנְת אַצּ-צֻ'בְּח"
            gloss: 'עבר: התאמנתי בבוקר'
      - id: exp2-step2-h
        type: heading
        lang: he
        level: 4
        text: 'שלב 2 – שאלות מנחות'
      - id: exp2-step2
        type: discussionQuestions
        answerable: false
        items:
          - question: "שׁוּ אַלְ-פַּרְק בֵּין אַלְ-גּ'מְלְתֵּין?"
          - question: 'אֵימְתָא צָאר הָאד אַשִּׁי?'
          - question: "כֵּיף בְּנְחוֹל מִן אַלְ-מֻצָ'ארִע לַלְ-מָאצִ'י?"
      - id: exp2-table
        type: table
        lang: he
        caption: 'שלב 3 – כלל העבר'
        header: [צורה, תעתיק, עברית]
        rows:
          - ['אני (ז׳/נ׳)', "תְצַחֵּיְת / תְמַרַּנְת / תְגַ'סַּלְת", התעוררתי / התאמנתי / התרחצתי]
          - [הוא, "תְצַחָּא / תְמַרַּן / תְגַ'סַּל", התעורר / התאמן / התרחץ]
          - [היא, "תְצַחַּת / תְמַרַּנַת / תְגַ'סַּלַת", התעוררה / התאמנה / התרחצה]
      - id: exp2-rule
        type: ruleSummary
        lang: he
        skill: 'דגש חשוב: איפה ה־ת ואיפה העבר?'
        rules:
          - text: 'ה־**ת** בהתחלה היא הסימן של הבניין תְפַעַּל, ולכן היא מופיעה **גם בהווה וגם בעבר**. בהווה יש לפניה בִּ־; בעבר אין בִּ־, ובגוף ״אני״ מוסיפים בסוף ־ְת.'
            examples:
              - "הווה: אַנָא בִּתְגַ'סַּל"
              - "עבר: אַנָא תְגַ'סַּלְת"
          - text: 'כדי לספר על **הרגל** בעבר (״נהגתי ל…״) אומרים **כֻּנְת + הווה**.'
            examples:
              - 'אַנָא כֻּנְת בִּתְמַרַּן כֻּל יוֹם'
