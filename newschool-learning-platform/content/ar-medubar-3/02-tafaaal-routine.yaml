        minutes: 20
        steps:
          - 'מטרה: השוואה בין שגרת העבר לשגרת ההווה דרך תְפַעַּל. דגש: עומק, דיוק, שינוי בזמן.'
          - 'שלב 1 – פתיחה (5 דקות): שאלות הפתיחה שלמטה. כל תשובה = לפחות 2–3 משפטים, בלי תשובות קצרות. תלמיד אחר חייב לשאול שאלה (לא לחזור על אותה שאלה).'
