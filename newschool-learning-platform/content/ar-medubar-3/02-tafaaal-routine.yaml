# in Hebrew transliteration, apc-Hebr); Hebrew instructions carry `lang: he`.
course: ar-medubar-3
slug: tafaaal-routine
title: "תְפַעַּל — שגרת החיים שלי בעבר | רוּתִינִי פִּל-מָאצִ'י"
goal: 'להבחין בין פועל רגיל (פַעַּל) לבין תְפַעַּל – פעולה שחוזרת אליי – ולספר על השגרה שלי בעבר עם תְפַעַּל.'
