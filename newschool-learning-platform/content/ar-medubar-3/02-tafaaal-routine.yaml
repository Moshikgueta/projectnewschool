    teacherNotes:
      - id: n-plan
        anchor: null
        text: 'שתי מיומנויות: הבחנה בין פעל רגיל (בניין II) לתְפַעַּל (הסברים 1–2, פעילות 3) ושגרה בעבר עם תְפַעַּל (פעילויות 1, 2 ו־4). דגש לכל השיעור: לא מוותרים על עומק – כל תשובה = הרחבה + הסבר + דוגמה.'
      - id: n-exp1-idea
        anchor: exp1-idea
        text: 'תוקן — לבדיקת המורה. במחברת: ״אַתּ-תַפַּעּוּל = הפועל חוזר על עצמו – אני עושה משהו לעצמי. אין אדם נוסף. הפעולה היא עלייך.״ הוספנו שהבניין נגזר מבניין II, ושלא כל פועל בו הוא ״לעצמי״ (תְעַלַּם, תְעַשָּׁא, תְמַנָּא – פעלים שמופיעים בשיעור עצמו).'
      - id: n-exp1-table
        anchor: exp1-table
        text: "תוקן — לבדיקת המורה. הטבלה במחברת ערבבה צורות מבניין I (בִּגְ'סַל, בִּלְבַּס, בִּדַ'כֻּר) ומבניין II (בְּמַרֵּן), וכתבה את השורש של ״להתעורר״ כ־צ'ח-י (צ' = ض) עם בִּצַ'חִּי. השורש הוא צ-ח-י (ص, לא ض). בטבלה החדשה תְפַעַּל מוצג מול בניין II (פַעַּל), שממנו הוא נגזר. הצורות של בניין II נוספו על ידינו – בדקו. גם תְצַחָּא ו־תְלַבַּס דורשים בדיקה: דוברים רבים אומרים צְחִית / פִקְת (התעוררתי) ו־לִבְסְת (התלבשתי)."
      - id: n-exp2-past
        anchor: exp2-past
        text: 'תוקן — לבדיקת המורה. במחברת ״אַנָא כֻּנְת בִּתְצַחָּא אַסָּאעָה 7״ הוצג כעבר רגיל. זה הרגל בעבר (״נהגתי להתעורר״). הוספנו לידו את העבר הפשוט אַנָא תְצַחֵּיְת אַסָּאעָה 7 (מטבלת העבר). כדאי להראות לתלמידים את שתי הצורות.'
      - id: n-exp2-table
        anchor: exp2-table
        text: "תוקן — לבדיקת המורה. במחברת שורת ״היא״ הייתה תְצַחֵּית / תְמַרַּנֵת (תְצַחֵּית היא צורת ״אני / אתה״), ובשורת ״הוא״ התרגום היה רק ״הוא התעורר״. תיקנו ל־תְצַחַּת / תְמַרַּנַת / תְגַ'סַּלַת ולתרגום מלא."
      - id: n-exp2-rule
        anchor: exp2-rule
        text: "תוקן — לבדיקת המורה. במחברת: ״העבר של אַתּ-תַפַּעּוּל מתחיל ב-תּ בנוסף לשורש. זה הסימן שהפעולה חזרה על הדובר.״ אבל ה־ת קיימת גם בהווה (בִּתְגַ'סַּל), ולכן היא סימן הבניין ולא סימן העבר."
      - id: n-act1
        anchor: act1
        text: "תוקן — לבדיקת המורה. בשאלה 2 במחברת היה ״כֻּנְת תִּתְנָאם״ – לפועל נָאם אין תְפַעַּל, ולכן תוקן ל־תְּנָאם (כמו בשאלות ההכנה). תשובות מוצעות לאתגר: אַנָא גַ'סַּלְת אַצּ-צֻ'חוּן ← אַנָא תְגַ'סַּלְת (המשמעות משתנה: התרחצתי); אַנָא לַבַּסְת אַלְ-גַ'אכֵּיט ← אַנָא תְלַבַּסְת (בדקו אם המשפט המקורי טבעי); אַנָא צַחֵּיְת מֻבַּכֵּר ← אַנָא תְצַחֵּיְת מֻבַּכֵּר."
      - id: n-act2
        anchor: act2
        text: "תוקן — לבדיקת המורה. בשאלה 2 במחברת היה ״כֻּנְת בִּתְעַמַּלוּ וְהַלַּק מָא בִּתְעַמַּלוּ״; תוקן לבניין I כמו בשאלות ההכנה. בדקו גם ״בִּתְחַסּ / תְחַסּ״ (הרגשת). אם התלמיד נשאר כללי – עצרו ושאלו: עַטִינִי דַ'ּוְוּמָה חַקִּיקִיָּה (כך במחברת; אולי הכוונה ל־עַטִינִי מִשָּׁאל חַקִּיקִי)."
      - id: n-act3
        anchor: act3
        text: "אל תתנו תשובות – תנו לתלמידים להסביר. אם התשובה חלשה, שאלו עוד לֵישׁ? מפתח מוצע (תוקן — לבדיקת המורה): 1 נכון. 2 לא נכון – מַרַּן צריך מושא (אימנתי מישהו); לעצמי: אַנָא תְמַרַּנְת. 3 נכון. 4 תלוי – אפשרי, אבל הטבעי הוא תְגַ'סַּלְת. 5 נכון. 6 לא טבעי – אומרים תְדַ'כַּרְת אַלְ-מוֹעִד; דַ'כַּרְת מתאים כשמזכירים למישהו אחר."
      - id: n-act4
        anchor: act4
        text: 'דברו בטבעיות, לא כמו הכתבה, והוסיפו לפחות רגש אחד. המטרה היא סיפור רציף, לא רשימת משפטים. אם התלמיד מונה רק פעולות בלי קישור – עצרו ושאלו: וְבַּעְדֵּין שׁוּ צָאר? / כֵּיף תְחַסּ בַּוַּקְת הָאד? אם הוא לא משתמש בתְפַעַּל – שאלו: הַל עָמַלְת הָאד לַחַאלַכּ? כֵּיף בִּתְקוּל הָאד בַּלְ-עַרַבִּי? אם בן הזוג מדלג על הסיכום – עצרו ואמרו: קַבְּל אַסְאַל, שׁוּ פָהַמְת מִן קִצְּתוּ? תוקן — לבדיקת המורה: בתבנית במחברת היה ״וְתְנַּמְת״; תוקן ל־וְנִמְת (ישנתי, בניין I).'

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: tafaaal-routine-summary
    title: סיכום השיעור
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'סיכום דקדוקי – תְפַעַּל (5 דקות)'
      - id: main-difference
        type: ruleSummary
        lang: he
        skill: ההבדל המרכזי
        rules:
          - text: '**פעל רגיל** (בניין II) – הפעולה יוצאת החוצה, אל מישהו או משהו אחר:'
            examples:
              - "אַנָא גַ'סַּלְת אַצּ-צֻ'חוּן (שטפתי את הכלים)"
              - 'אַנָא לַבַּסְת אַלְ-וָלַד (הלבשתי את הילד)'
          - text: '**תְפַעַּל** (בניין V) – הפעולה חוזרת אליי:'
            examples:
              - "אַנָא תְגַ'סַּלְת (התרחצתי)"
              - 'אַנָא תְלַבַּסְת (התלבשתי)'
          - text: 'השאלה החשובה ביותר: **מי מקבל את הפעולה?** אם זה אני עצמי ← משתמשים בתְפַעַּל.'
      - id: forms
        type: table
        lang: he
        caption: צורות חשובות מהשיעור
        header: [פעל רגיל (על אחר), 'תְפַעַּל – עבר, אני', 'תְפַעַּל – הווה, אני', עברית]
        rows:
          - ["גַ'סַּלְת", "תְגַ'סַּלְת", "אַנָא בִּתְגַ'סַּל", התרחצתי / אני מתרחץ]
          - ['מַרַּנְת', 'תְמַרַּנְת', 'אַנָא בִּתְמַרַּן', התאמנתי / אני מתאמן]
          - ["דַ'כַּרְת", "תְדַ'כַּרְת", "אַנָא בִּתְדַ'כַּר", נזכרתי / אני נזכר]
          - ['לַבַּסְת', 'תְלַבַּסְת', 'אַנָא בִּתְלַבַּס', התלבשתי / אני מתלבש]
      - id: rules-t
        type: ruleSummary
        lang: he
        skill: איך מזהים את הזמן?
        rules:
          - text: 'ה־**ת** בהתחלה שייכת לבניין, ולכן היא גם בהווה וגם בעבר. בהווה יש **בִּ־** לפניה; בעבר אין בִּ־, ויש סיומת (״אני״: ־ְת).'
            examples:
              - "אַנָא בִּתְגַ'סַּל ← אַנָא תְגַ'סַּלְת"
          - text: '**הרגל בעבר** (״נהגתי ל…״): כֻּנְת + הווה.'
            examples:
              - 'אַנָא כֻּנְת בִּתְמַרַּן כֻּל יוֹם'
          - text: 'לא כל פועל בתְפַעַּל הוא ״לעצמי״: תְעַלַּם (למד), תְעַשָּׁא (אכל ארוחת ערב), תְמַנָּא (ייחל).'
      - id: mistakes
        type: ruleSummary
        lang: he
        skill: טעויות נפוצות
        rules:
          - text: '1. לשכוח את ה־ת כשהפעולה היא על עצמי: ❌ אַנָא מַרַּנְת ✅ **אַנָא תְמַרַּנְת**'
          - text: "2. להשתמש בתְפַעַּל כשהפעולה היא על אחר: ❌ תְגַ'סַּלְת אַצּ-צֻ'חוּן ✅ **גַ'סַּלְת אַצּ-צֻ'חוּן**"
          - text: "3. לבלבל בין תְדַ'כַּר (להיזכר) לבין דַ'כַּר (להזכיר למישהו אחר)."
      - id: key
        type: ruleSummary
        lang: he
        skill: משפטי מפתח
        rules:
          - text: 'פעל רגיל:'
            examples:
              - 'אַנָא בַּעְמַל אַלְ-פַּעְלָה'
          - text: 'תְפַעַּל:'
            examples:
              - 'אַנָא בַּעְמַל אַלְ-פַּעְלָה עַלָּא חַאלִי'
    teacherNotes:
      - id: n-summary
        anchor: null
        text: 'תוקן — לבדיקת המורה. במחברת הטעות הראשונה הייתה ״שכחת תּ בתחילת הפועל בעבר: מַרַּן ← תְמַרַּנְת״; ה־ת אינה סימן העבר (היא גם בהווה), ולכן הניסוח שונה. נוספו טבלת הצורות והשורה ״לא כל פועל בתְפַעַּל הוא לעצמי״. במחברת הסיכום מופיע לפני פעילות 4.'

