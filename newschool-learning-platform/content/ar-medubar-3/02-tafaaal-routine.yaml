        minutes: 15
        steps:
          - 'מטרה: שימוש בתְפַעַּל בעבר דרך תיאור שגרת יום אמיתית. דגש: דיבור, עומק, רפלקסיביות.'
          - 'שלב 1 – פתיחה (כל הכיתה, 4 דקות): שאלות הפתיחה שלמטה. כל תשובה = לפחות 2–3 משפטים, ותלמיד אחר חייב לשאול שאלה נוספת.'
          - 'שלב 2 – הכנה אישית (3 דקות): כתבו 3 פעולות שגרתיות מהעבר, לפי התבנית. לכל פעולה: מתי? איפה? למה?'
          - "שלב 3 – עבודה בזוגות (Breakout Rooms, 6 דקות): כל תלמיד מציג את 3 הפעולות שלו בעבר. בן הזוג שואל: לֵישׁ? / אֵימְתָא בַּאלְ-צַ'בְּט? / שׁוּ תַגַ'יַּר הַלַּק? ואז מחליפים תפקידים."
          - 'דרישות דיבור: לפחות 6–8 משפטים לכל תלמיד, תְפַעַּל לפחות 3 פעמים, דוגמה אמיתית אחת לפחות.'
          - 'שלב 4 – אתגר (2 דקות): המורה אומר פועל רגיל, והתלמיד הופך אותו לתְפַעַּל בעבר (המשפטים שלמטה).'
          - "שלב 5 – שיתוף (2 דקות): בוחרים 2 תלמידים ושואלים: שׁוּ עָמַלְת? / כֵּיף תְגַ'יַּר הַלַּק? / לֵישׁ?"
