        type: discussionQuestions
        items:
          - question: "אֵימְתָא בְּנִסְתַּכְ'דַּם אַתּ-תַּפַּעּוּל?"
          - question: 'שׁוּ אַלְ-פַּרְק בֵּין אַלְ-פִּעְל אַלְ-בָּסִיט וְאַתּ-תַּפַּעּוּל?'
          - question: "שׁוּ אַכְּבַּר גַ'לְטָה?"
      # ── Mori ──
      - id: mori-title
        type: heading
        lang: he
        level: 2
        text: 'שיעורי בית עם Mori – תְפַעַּל'
      - id: mori-how
        type: text
        lang: he
        text: "פתחו את הצ'אט עם Mori, העתיקו את ההודעה הבאה ושלחו אותה."
      - id: mori
        type: aiTutorPrompt
        message: "מַרְחַבָּא Mori, אַלְ-יוֹם בִּדְנָא נִתְדַּרַּב עַלָּא אַתּ-תַּפַּעּוּל פִּל-מָאצִ'י. עַטִינִי 5 גְ'מַל בַּלְ-פִּעְל אַלְ-בָּסִיט פִּל-מָאצִ'י, אַנָא בַּחוֹוּל כֻּל גְ'מְלָה לַלְ-תַּפַּעּוּל (אַנָא בַּעְמַל אַלְ-פַּעְלָה עַלָּא חַאלִי). צַחֵּח לִי אִדָ'א פִּי אַגְ'לָאט וְשַׁרַחְלִי לֵישׁ. אִסְאַלְנִי סוּאָאל עַן כֻּל גְ'מְלָה וְכַ'לִינִי אוֹגָ'אוּב בְּגְ'מְלָה כַּאמְלָה. אִדָ'א גְ'וָאבִּי קַצִּיר, טַלַּב מִנִּי אוֹסַּע וְאַשְׁרַח. פִּי אַנּ-נִהָאיָה, אַעְטִינִי 3 גְ'מַל בְּדוּן פִּעְל וְאַנָא בַּכַּמַּלוּן בַּלְ-תַּפַּעּוּל."
      - id: mori-rules
        type: callout
        lang: he
        tone: info
        title: דרישות
        text: |-
          לענות במשפטים מלאים בלבד.
          להשתמש בתְפַעַּל בעבר.
          להסביר, לא רק לענות.
          להרחיב כל תשובה.
    teacherNotes:
      - id: n-homework
        anchor: null
        text: "תוקן — לבדיקת המורה. תשובות מוצעות (אין מפתח במחברת). חלק א: 1 תְפַעַּל, 2 פעל רגיל (אימנתי את החבר), 3 תְפַעַּל, 4 פעל רגיל (שטפתי כלים), 5 תְפַעַּל. חלק ב: אַנָא תְצַחֵּיְת אַסָּאעָה 7 / אַנָא תְמַרַּנְת כֻּל יוֹם / אַנָא תְגַ'סַּלְת אַצּ-צֻ'בְּח (או, כהרגל: אַנָא כֻּנְת בִּתְ…). חלק ג: אַנָא בִּתְמַרַּן כֻּל יוֹם / אַנָא בִּתְגַ'סַּל אַצּ-צֻ'בְּח / אַנָא בִּתְדַ'כַּר אַלְ-מוֹעִד. בהודעה ל־Mori הוספנו סימני פיסוק בלבד."

