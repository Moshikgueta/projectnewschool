        minutes: 15
        steps:
          - 'מטרה: לזהות, לתקן ולהסביר שימוש נכון ולא נכון בתְפַעַּל בעבר.'
          - 'שלב 1 – הצגת משפטים (כל הכיתה, 3 דקות): המורה מציג את המשפטים שלמטה – חלקם נכונים וחלקם לא – ולא אומר מה נכון. התלמידים מחליטים: נכון / לא נכון / תלוי הקשר? כל תשובה חייבת לכלול הסבר; לא מקבלים רק ״נכון״ או ״לא נכון״.'
          - 'שלב 2 – עבודה בקבוצות (Breakout Rooms, 5 דקות): בוחרים 3 משפטים. לכל משפט: האם הוא נכון? אם לא – מתקנים, ומסבירים למה עם עַשָּׁאן / לֵישׁ / שׁוּ אַלְ-פַּרְק.'
          - 'שלב 3 – אתגר (2 דקות): כל קבוצה ממציאה משפט לא נכון. הכיתה מתקנת ומסבירה.'
          - 'שלב 4 – סיכום (כל הכיתה, 2 דקות): שאלות הסיכום שלמטה.'
