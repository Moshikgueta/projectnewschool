      - id: act4
        type: classActivity
        lang: he
        title: 'פעילות 4: סיפור אישי – ספרו על יום מהעבר'
        skills: ['שגרה בעבר עם תְפַעַּל']
        minutes: 15
        steps:
          - 'מטרה: שימוש חופשי וספונטני בתְפַעַּל בעבר דרך סיפור אישי אמיתי. דגש: זרימה טבעית, עומק רגשי, חיבור בין פעולות, הקשבה מכוונת.'
          - 'פתיחה (כל הכיתה, דקה אחת): המורה אומר את פסקת הפתיחה שלמטה.'
          - "שלב 1 – מודל המורה (2 דקות): המורה מספר יום אחד שלו כמודל חי, לפחות 4 משפטים, לפי התבנית. אחר כך שואל את הכיתה: שׁוּ פָהַמְתוּ? שׁוּ תְדַ'כַּרְתוּ מִן קִצְּתִי?"
          - 'שלב 2 – הכנה אישית (3 דקות): בוחרים יום אחד מהעבר – יום עבודה, יום חופש, יום מיוחד – וכותבים את הסיפור שלו לפי הסדר, לפי התבנית. לפחות 5 משפטים, לפחות 3 פעלים בתְפַעַּל, והסבר אחד של רגש או סיבה.'
          - 'שלב 3 – סיפור והקשבה בזוגות (Breakout Rooms, 6 דקות): תלמיד א׳ מספר את היום שלו מההתחלה עד הסוף, בלי הפסקות. תלמיד ב׳ מקשיב בלבד, ואחר כך מסכם בחזרה (לפחות 2 משפטים) ושואל לפחות 3 שאלות. אחרי 3 דקות מחליפים תפקידים.'
          - 'דרישות דיבור: כל תלמיד מספר לפחות 5–6 משפטים רצופים, תְפַעַּל לפחות 3 פעמים, הסבר רגש אחד לפחות. בן הזוג מסכם לפני שהוא שואל.'
          - 'שלב 4 – שיתוף וסיכום (כל הכיתה, 3 דקות): בוחרים 2 תלמידים; כל אחד מספר את היום שלו בקצרה (3–4 משפטים), והמורה שואל את שאלות השיתוף.'
          - 'משפט סיכום בעל פה – חובה לפני היציאה: המורה שואל כל תלמיד את שאלות הסיום.'
