activities:
  - slug: tafaaal-routine-meaning
    title: 'פעל רגיל או תְפַעַּל?'
    minutes: 8
    items:
      - id: past-verbs
        type: matching
        lang: he
        prompt: התאימו כל פועל בעבר לפירוש שלו.
        pairs:
          - ["תְגַ'סַּלְת", 'התרחצתי']
          - ['תְמַרַּנְת', 'התאמנתי']
          - ["תְדַ'כַּרְת", 'נזכרתי']
          - ['תְעַשֵּׁיְת', 'אכלתי ארוחת ערב']
      - id: dishes
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״שטפתי את הכלים״?'
        options:
          - { text: "אַנָא גַ'סַּלְת אַצּ-צֻ'חוּן", correct: true }
          - {
              text: "אַנָא תְגַ'סַּלְת אַצּ-צֻ'חוּן",
              feedback: "תְגַ'סַּלְת פירושו ״התרחצתי״ – הפעולה על עצמי. כשהפעולה היא על משהו אחר (הכלים) משתמשים בפעל הרגיל גַ'סַּלְת.",
            }
          - {
              text: "אַנָא בִּתְגַ'סַּל אַצּ-צֻ'חוּן",
              feedback: "בִּתְגַ'סַּל הוא הווה של תְפַעַּל (״אני מתרחץ״). צריך עבר, ופעל רגיל: גַ'סַּלְת.",
            }
      - id: bath
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״התרחצתי לפני השינה״?'
        options:
          - { text: "תְגַ'סַּלְת קַבְּל אַנּוֹם", correct: true }
          - {
              text: "גַ'סַּלְת קַבְּל אַנּוֹם",
              feedback: "גַ'סַּלְת (בלי ת בהתחלה) פירושו ששטפתי משהו אחר. כשאני מתרחץ בעצמי אומרים תְגַ'סַּלְת.",
            }
          - {
              text: "גַ'סַּלְת אַצּ-צֻ'חוּן קַבְּל אַנּוֹם",
              feedback: '״שטפתי את הכלים לפני השינה״ – הפעולה כאן על הכלים, לא עליי.',
            }
      - id: trained
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״התאמנתי בבוקר״?'
        options:
          - { text: "אַנָא תְמַרַּנְת אַצּ-צֻ'בְּח", correct: true }
          - {
              text: "אַנָא מַרַּנְת אַצּ-צֻ'בְּח",
              feedback: 'מַרַּנְת פירושו ״אימנתי (מישהו אחר)״. כשאני מתאמן בעצמי אומרים תְמַרַּנְת.',
            }
          - {
              text: "אַנָא בִּתְמַרַּן אַצּ-צֻ'בְּח",
              feedback: 'בִּתְמַרַּן הוא הווה (״אני מתאמן״). בעבר אומרים תְמַרַּנְת.',
            }
      - id: dressed-boy
        type: multipleChoice
        lang: he
        prompt: 'מה פירוש ״אַנָא לַבַּסְת אַלְ-וָלַד״?'
        options:
          - { text: 'הלבשתי את הילד', correct: true }
          - {
              text: 'התלבשתי',
              feedback: 'התלבשתי = תְלַבַּסְת (עם ת). כאן הפעולה יוצאת החוצה, אל הילד.',
            }
          - { text: 'אני מלביש את הילד', feedback: 'לַבַּסְת הוא עבר (״הלבשתי״), לא הווה.' }
      - id: remembered
        type: multipleChoice
        lang: he
        prompt: "מה פירוש ״תְדַ'כַּרְת אַלְ-מוֹעִד״?"
        options:
          - { text: 'נזכרתי בפגישה', correct: true }
          - {
              text: 'הזכרתי למישהו את הפגישה',
              feedback: "להזכיר למישהו אחר = דַ'כַּר (בלי ת). תְדַ'כַּר פירושו ״נזכר״.",
            }
          - { text: 'שכחתי את הפגישה', feedback: "תְדַ'כַּרְת פירושו ההפך: ״נזכרתי״." }
      - id: t-in-both
        type: trueFalse
        lang: he
        prompt: "בבניין תְפַעַּל יש ת בהתחלה גם בעבר (תְגַ'סַּלְת) וגם בהווה (בִּתְגַ'סַּל)."
        answer: true
        feedback:
          correct: 'נכון! ה־ת היא הסימן של הבניין. בהווה יש לפניה בִּ־.'
          incorrect: "זה נכון: תְגַ'סַּלְת (עבר) ו־בִּתְגַ'סַּל (הווה) – בשניהם יש ת."
      - id: wrong-dishes
        type: trueFalse
        lang: he
        prompt: "המשפט ״אַנָא תְגַ'סַּלְת אַצּ-צֻ'חוּן״ נכון."
        answer: false
        feedback:
          correct: "נכון, הוא לא נכון! הפעולה היא על הכלים, ולכן אומרים אַנָא גַ'סַּלְת אַצּ-צֻ'חוּן."
          incorrect: "המשפט לא נכון: תְגַ'סַּלְת = התרחצתי (על עצמי). על הכלים אומרים אַנָא גַ'סַּלְת אַצּ-צֻ'חוּן."

