    teacherNotes:
      - id: n-plan
        anchor: null
        text: 'שתי מיומנויות: משמעות פָאעַל – פעולה כלפי אדם נוסף (הסברים 1–2, פעילויות 1 ו־3) וסיפור על יחסים ושיתוף פעולה (פעילויות 2 ו־4). זמנים: סבב היכרות 10, הסבר 1 – 10, הסבר 2 – 10, פעילות 1 – 15, פעילות 2 – 20, פעילות 3 – 15, פעילות 4 – 15, סיכום דקדוקי 5 דקות.'
      - id: n-intro
        anchor: intro
        text: 'כל תלמיד מדבר לפחות 3 משפטים; תלמיד אחר חייב לשאול שאלה. דרשו הרחבה ולא תשובה של מילה אחת.'
      - id: n-expl1
        anchor: expl1-idea
        text: 'תוקן — לבדיקת המורה. במחברת: ״פָּאעַל = הפעולה הולכת בשני כיוונים. שניים עושים את אותו הדבר אחד לשני״, וגם החוק ״פָּאעַל = אַנָא וְחַדָּא תָּאנִי בִּנְעַמַּל אַלְ-פַּעְלָה מַע בַּעַד״. פָאעַל הוא פעולה כלפי אדם נוסף או איתו, ולא בהכרח הדדי; ההדדי באמת הוא בניין VI (תְּסָּאעַדְנָא).'
      - id: n-expl1-step1
        anchor: expl1-step1
        text: 'תוקן — לבדיקת המורה. במחברת ״אַנָא סָּאעַדְת = עזרתי (לאף אחד מסוים / לעצמי)״ ו״אַנָא סָּאעַדְת סַחְבִּי = בניין I״. שניהם בניין III (בניין I של ס-ע-ד פירושו ״שמח״, לא ״עזר״). הצורות סַחְבִּי סָּאעַדְנִי ו־תְּסָּאעַדְנָא נוספו – בדקו אותן.'
      - id: n-expl1-step2
        anchor: expl1-step2
        text: 'השאלה הרביעית במחברת הייתה ״שׁוּ אַלְ-פַּרְק בֵּין סָּאעַד וּסָּאעַד מַע?״; היא שונתה ל־״…וּתְּסָּאעַד״, כי סָּאעַד בא עם מושא ישיר ולא עם מַע.'
      - id: n-expl1-table
        anchor: expl1-table
        text: 'תוקן — לבדיקת המורה. בטבלה במחברת סָּאעַד הופיע כבניין I, סַוַּד כבניין II (סַוַּד הוא משורש אחר, ס-ו-ד), כְּלַם / עָאן / שׁרַכ כבניין I, חַכָּא / שַׁרַּכ / עַוַּן / תַּבַּע כבניין II, וכל המשמעויות היו הדדיות (״עזרו אחד לשני״, ״דיברו אחד עם השני״, ״המשיכו יחד״). השארנו רק את פועל בניין III, משמעותו ואיך הוא מקבל את האדם השני. בדקו בעיקר את עָאוַן ו־תָּאבַע.'
      - id: n-expl2
        anchor: expl2-compare
        text: 'תוקן — לבדיקת המורה. טבלת ההשוואה I / II / III במחברת (״אני גורם לאחר״, בְּסַוִּד / סַוַּדְת, בְּסָאעַד מַע / סָּאעַדְת מַע) ושלושת המשפטים ״אַנָא כְּלַמְת אַחוּ (I) / אַנָא כַּלַּמְת אַחוּ יִחְכִּי (II, גרמתי לאחי לדבר) / אַנָא כָּאלַמְת אַחוּ (III, דיברנו אחד עם השני)״ שגויים: אין בניין I כְּלַם במשמעות ״דיבר״, וכַּלַּמְת = דיברתי עם / התקשרתי, לא ״גרמתי לו לדבר״. הוחלפו בהשוואה בין בניין I, III ו־VI.'
      - id: n-expl2-step4
        anchor: expl2-step4
        text: 'תוקן — לבדיקת המורה. במחברת: ״פָּאעַל כמעט תמיד מגיע עם מַע (עם) או עם שם של אדם שני״. סָּאעַד, חָאכַּא, עָאוַן מקבלים את האדם ישירות; שָׁארַכ – עם פִּי / מַע.'
      - id: n-expl2-practice
        anchor: expl2-practice
        text: 'תוקן — לבדיקת המורה. במחברת התלמידים ״הופכים משפט בניין I לבניין III״, אבל לרוב הפעלים בשיעור אין צורת בניין I מקבילה. התרגול הוחלף ב״כיוון אחד ← זה לזה״.'
      - id: n-act1
        anchor: act1-challenge
        text: 'תוקן — לבדיקת המורה. ה־Challenge במחברת: ״אַנָא סָּאעַדְת סַחְבִּי / אַנָא כְּלַמְת אִמִּי / אַנָא שַׁרַּכְת סַחְבִּי בַּלְ-עַמַל ← בניין III״ (הראשון כבר בניין III, השני – אין כזה בניין I, השלישי – בניין II מפוקפק). הוחלף בשתי הדוגמאות שכאן; אפשר להוסיף עוד בעל פה.'
      - id: n-act2
        anchor: act2-deep
        text: "השאלה ״הַל פִּי פַּרְק בֵּין סָּאעַדְת וּסָּאעַדְת מַע?״ שונתה ל־״…וּתְּסָּאעַדְנָא״. אם התלמיד נשאר כללי – עצרו ושאלו: עַטִינִי דַ'ּוְוּמָה חַקִּיקִיָּה (כך במחברת – בדקו את הניסוח). אל תוותרו על עומק: כל תשובה = הרחבה + הסבר + דוגמה."
      - id: n-act3
        anchor: act3-sentences
        text: 'תוקן — לבדיקת המורה (המחברת לא נותנת תשובות). 1. נכון – בניין III, עזרתי לחבר. 2. תקין, אבל חסר: למי? 3. ״עזרנו יחד״ (למישהו אחר); ל״זה לזה״ אומרים אַנָא וְסַחְבִּי תְּסָּאעַדְנָא – בדקו. 4. חסר האדם השני: אַנָא כָּאלַמְת אִמִּי. 5. לא נכון: כַּלַּמְת סַחְבִּי = דיברתי עם החבר / התקשרתי אליו, לא ״גרמתי לו לדבר״; ״יִחְכִּי״ מיותר. 6. נכון – שָׁארַכ בא עם מַע.'
      - id: n-act4
        anchor: act4-model
        text: 'בדקו: ״סָּאעַדְנָא מַע בַּעַד״ פירושו ״עזרנו יחד״, ו״כָּאלַמְנָא מַע בַּעַד״ אולי טבעי פחות מ״חְכֵינָא מַע בַּעַד״. טיפ מהמחברת: אם התלמיד אומר פָאעַל בלי אדם שני – עצרו ושאלו: מַע מִין? / הַל פִּי תְּנֵין? אם הוא מבלבל עם בניין I – שאלו: הַל אַלְ-פַּעְלָה רָאחַת בְּכַּיוּן וָאחַד אוֹ תְּנֵין?'

