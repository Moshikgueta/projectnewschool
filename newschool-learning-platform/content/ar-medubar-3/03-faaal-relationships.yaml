              - 'אַנָא שָׁארַכְת ← חסר: עם מי? במה?'
          - text: 'בניין II (פַעַּל) הוא ״גרמתי למישהו לעשות״ רק בחלק מהפעלים (פַהַּם = הסביר, דַרַּס / עַלַּם = לימד). כַּלַּם איננו כזה: כַּלַּמְת סַחְבִּי = דיברתי עם החבר שלי / התקשרתי אליו.'
