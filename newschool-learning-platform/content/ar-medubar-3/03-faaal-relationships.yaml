          - text: 'פָאעַל **לא בהכרח הדדי**. כשהפעולה הולכת לשני הכיוונים – זה לזה – משתמשים בבניין VI (**תְפָאעַל**), או מוסיפים **מַע בַּעַד** (יחד).'
