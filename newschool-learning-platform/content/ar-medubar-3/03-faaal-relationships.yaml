      - id: expl2-step4
        type: ruleSummary
        lang: he
        skill: 'שלב 4 – דגש חשוב: פָאעַל תמיד עם אדם שני'
        rules:
          - text: 'ברוב הפעלים האדם השני בא ישירות אחרי הפועל, בלי מילת יחס.'
