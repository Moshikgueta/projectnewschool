        steps:
          - 'מטרה: שימוש חופשי וספונטני בפָאעַל דרך סיפור אמיתי של שיתוף פעולה. דגש: זרימה טבעית, הקשבה, האדם השני.'
          - 'פתיחה (כל הכיתה, דקה): המורה אומר את משפט הפתיחה שלמטה.'
          - "מודל המורה (2 דקות): המורה מספר סיפור שיתופי אמיתי – לפחות 4 משפטים עם פָאעַל, לפי התבנית – ושואל: שׁוּ פָהַמְתוּ? שׁוּ תְדַ'כַּרְתוּ מִן קִצְּתִי?"
          - 'הכנה אישית (3 דקות): כל תלמיד בוחר סיפור אחד של שיתוף פעולה עם מישהו וכותב לפי הסדר. דרישה: לפחות 5 משפטים, לפחות 3 פעלים בפָאעַל, הסבר אחד של רגש או סיבה.'
          - 'סיפור והקשבה בזוגות (Breakout Rooms, 6 דקות): תלמיד א מספר את הסיפור מההתחלה עד הסוף. תלמיד ב רק מקשיב, ואחר כך מסכם בחזרה (לפחות 2 משפטים) ושואל לפחות 3 שאלות. אחרי 3 דקות מחליפים תפקידים.'
          - 'דרישות דיבור: כל תלמיד מספר לפחות 6 משפטים רצופים, פָאעַל לפחות 3 פעמים, הסבר רגש אחד לפחות. הבן־זוג מסכם לפני שהוא שואל.'
          - 'שיתוף וסיכום (כל הכיתה, 3 דקות): בוחרים 2 תלמידים. כל אחד מספר בקצרה (3–4 משפטים), והמורה שואל את שאלות השיתוף.'
          - 'משפט סיכום בעל פה – חובה לפני היציאה: המורה שואל כל תלמיד את שאלות הסיום.'
      - id: act4-opening
        type: examples
        items:
          - text: 'כֻּלְנָא עִנְדְנָא קִצַּץ עַן פָּעֲלָה עָמַלְנָאהָא מַע חַדָּא – מַשְׁרוּע, סָפַר, מַוְּקִף. אַלְ-יוֹם כֻּל וָאחַד רַח יְחְכִּי עַן וַּקְת שָׁארַכ אוֹ סָּאעַד מַע חַדָּא – וְרַח נִשּׁוּף כֵּיף בִּנְחְכִּי עַן הָאד בַּלְ-עַרַבִּי.'
