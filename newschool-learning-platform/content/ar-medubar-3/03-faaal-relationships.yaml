activities:
  - slug: faaal-relationships-meaning
    title: 'מה פָאעַל אומר: פעולה כלפי אדם נוסף'
    minutes: 8
    items:
      - id: verbs
        type: matching
        lang: he
        prompt: התאימו כל מילה לפירוש שלה.
        pairs:
          - ['סָּאעַד', 'עזר (למישהו)']
          - ['חָאכַּא', 'דיבר עם (מישהו)']
          - ['שָׁארַכ', 'השתתף / שיתף פעולה']
          - ['תָּאבַע', 'המשיך / עקב אחרי']
          - ['מַע בַּעַד', 'יחד, זה עם זה']
      - id: meaning-rule
        type: trueFalse
        lang: he
        prompt: 'בבניין III (פָאעַל) הפעולה נעשית כלפי אדם נוסף או יחד איתו. למשל: סָּאעַדְת סַחְבִּי = עזרתי לחבר שלי.'
        answer: true
        feedback:
          correct: 'נכון! בפָאעַל תמיד יש אדם שני במשפט.'
          incorrect: 'זה נכון: פָאעַל = פעולה כלפי אדם נוסף או יחד איתו (סָּאעַדְת סַחְבִּי).'
      - id: not-mutual
        type: trueFalse
        lang: he
        prompt: '״אַנָא סָּאעַדְת סַחְבִּי״ פירושו ״אני והחבר שלי עזרנו זה לזה״.'
        answer: false
        feedback:
          correct: 'נכון, זה לא נכון! סָּאעַדְת סַחְבִּי = עזרתי לחבר שלי – כיוון אחד. ״זה לזה״ = תְּסָּאעַדְנָא.'
          incorrect: 'לא: סָּאעַדְת סַחְבִּי = עזרתי לחבר שלי (כיוון אחד). ״עזרנו זה לזה״ = אַנָא וְסַחְבִּי תְּסָּאעַדְנָא.'
      - id: each-other
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״אני והחבר שלי עזרנו זה לזה.״?'
        options:
          - { text: 'אַנָא וְסַחְבִּי תְּסָּאעַדְנָא', correct: true }
          - { text: 'אַנָא סָּאעַדְת סַחְבִּי', feedback: 'זה ״עזרתי לחבר שלי״ – כיוון אחד בלבד.' }
          - { text: 'סַחְבִּי סָּאעַדְנִי', feedback: 'זה ״החבר שלי עזר לי״ – גם כיוון אחד בלבד.' }
      - id: helped-me
        type: multipleChoice
        lang: he
        prompt: 'מה פירוש ״סַחְבִּי סָּאעַדְנִי״?'
        options:
          - { text: 'החבר שלי עזר לי', correct: true }
          - {
              text: 'עזרתי לחבר שלי',
              feedback: 'הסיומת ־נִי פירושה ״לי״: החבר הוא שעזר. ״עזרתי לחבר שלי״ = אַנָא סָּאעַדְת סַחְבִּי.',
            }
          - { text: 'עזרנו זה לזה', feedback: '״עזרנו זה לזה״ = תְּסָּאעַדְנָא. כאן רק החבר עזר.' }
      - id: with-whom
        type: multipleChoice
        lang: he
        prompt: 'השלימו: אַנָא שָׁארַכְת ___ סַחְבִּי בַּלְ-עַמַל (השתתפתי עם החבר שלי בעבודה)'
        options:
          - { text: 'מַע', correct: true }
          - { text: 'עַן', feedback: 'עַן פירושו ״על״ (נושא), כמו ב״עַן שׁוּ?״. ״עם״ = מַע.' }
          - { text: 'כֵּיף', feedback: 'כֵּיף פירושו ״איך״. ״עם״ = מַע.' }
      - id: missing-person
        type: multipleChoice
        lang: he
        prompt: 'באיזה משפט חסר האדם השני?'
        options:
          - { text: 'אַנָא כָּאלַמְת', correct: true }
          - { text: 'אַנָא כָּאלַמְת אִמִּי', feedback: 'כאן יש אדם שני: אִמִּי (אמא שלי).' }
          - {
              text: 'אַנָא שָׁארַכְת מַע סַחְבִּי',
              feedback: 'כאן יש אדם שני: מַע סַחְבִּי (עם החבר שלי).',
            }
      - id: which-form
        type: multipleChoice
        lang: he
        prompt: 'באיזה בניין הפועל ״תְּסָּאעַדְנָא״ (עזרנו זה לזה)?'
        options:
          - { text: 'בניין VI – תְפָאעַל', correct: true }
          - {
              text: 'בניין III – פָאעַל',
              feedback: 'פָאעַל הוא סָּאעַד (עזר למישהו). עם ת בהתחלה ובמשמעות ״זה לזה״ – זה בניין VI.',
            }
