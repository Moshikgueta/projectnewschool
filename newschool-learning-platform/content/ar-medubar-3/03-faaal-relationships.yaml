              - 'אַנָא כָּאלַמְת ← אַנָא כָּאלַמְת אִמִּי'
              - 'אַנָא שָׁארַכְת ← אַנָא שָׁארַכְת מַע סַחְבִּי'
          - text: 'לחשוב שפָאעַל תמיד הדדי: סָּאעַדְת סַחְבִּי = עזרתי לחבר (כיוון אחד). ״עזרנו זה לזה״ = תְּסָּאעַדְנָא.'
          - text: 'בלבול עם בניין II: כַּלַּמְת סַחְבִּי = דיברתי עם החבר שלי / התקשרתי אליו – לא ״גרמתי לו לדבר״.'
    teacherNotes:
      - id: n-summary
        anchor: null
        text: 'תוקן — לבדיקת המורה. הסיכום במחברת השווה בין בניין I (״אחד, אני, ממני״, כְּלַמְת), II (״אני גורם, ממני לאחר״, כַּלַּמְת סַחְבִּי יִחְכִּי) ו־III (״שנינו, הלוך וחזור״, כָּאלַמְת מַע סַחְבִּי), ובטעויות: ״בניין I במקום III: סָּאעַדְנָא״ ו״כַּלַּמְת סַחְבִּי (גרמתי לו לדבר)״. הכול נכתב מחדש לפי I / III / VI. בדקו אם כָּאלַם בא עם מושא ישיר (כָּאלַמְת אִמִּי) או עם מַע.'

  # ── after class ──────────────────────────────────────────────────────────
  - slug: faaal-relationships-homework
    title: שיעורי בית
    phase: after_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'שיעורי בית – פָאעַל בחיים שלי'
      - id: part-a-title
        type: heading
        lang: he
        level: 4
        text: 'חלק א – זיהוי: בניין I, II, III או VI? הסבירו למה.'
      - id: part-a
        type: discussionQuestions
        items:
          - question: 'אַנָא סָּאעַדְת סַחְבִּי'
          - question: 'אַנָא וְסַחְבִּי תְּסָּאעַדְנָא'
          - question: 'אַנָא פַהַּמְת סַחְבִּי'
          - question: 'אַנָא כָּאלַמְת אִמִּי'
          - question: 'אַנָא וְסַחְבִּי בִּנְחְכִּי כְּתִיר'
      - id: part-b-title
        type: heading
        lang: he
        level: 4
        text: 'חלק ב – השלימו את האדם השני או את מילת היחס (למי? עם מי? במה?).'
      - id: part-b
        type: discussionQuestions
        items:
          - question: 'אַנָא סָּאעַדְת ___'
          - question: 'אַנָא שָׁארַכְת ___ אַלְ-מַשְׁרוּע'
          - question: 'אַנָא כָּאלַמְת ___ עַן ___'
      - id: part-c-how
        type: text
        lang: he
        text: 'חלק ג – יצירה: כתבו 4 זוגות משפטים – משפט פָאעַל בכיוון אחד, ואותו רעיון כפעולה הדדית (זה לזה / מַע בַּעַד). דוגמה:'
      - id: part-c
        type: sentenceFrame
        frame: |-
          1. ___ ← ___
          2. ___ ← ___
          3. ___ ← ___
          4. ___ ← ___
        example: 'אַנָא סָּאעַדְת סַחְבִּי וְהוּ סָּאעַדְנִי (בניין III) ← אַנָא וְסַחְבִּי תְּסָּאעַדְנָא (בניין VI)'
      - id: part-d-rules
        type: callout
        lang: he
        tone: info
        title: חלק ד – כתיבה חופשית
        text: |-
          כתבו 6 משפטים על יחס אמיתי בחיים שלכם:
          - לפחות 3 משפטים עם פָאעַל
          - השוואה לבניין I או לפעולה הדדית לפחות פעם אחת
          - הסבר: למה בחרתם בניין III
      - id: part-d
        type: reflection
        lang: he
        prompt: 'יחס אמיתי בחיים שלי'
      - id: part-e-title
        type: heading
        lang: he
        level: 4
        text: 'חלק ה – חשיבה: ענו במשפטים מלאים.'
      - id: part-e
        type: discussionQuestions
        items:
          - question: "אֵימְתָא בְּנִסְתַּכְ'דַּם פָּאעַל?"
          - question: 'שׁוּ אַלְ-פַּרְק בֵּין בְּנִין אַוּוַל וּתָּלְתָה?'
          - question: "שׁוּ אַכְּבַּר גַ'לְטָה?"
      - id: mori-title
        type: heading
        lang: he
        level: 3
        text: 'שיעורי בית עם Mori – פָאעַל'
      - id: mori-how
        type: text
        lang: he
        text: 'שלחו ל־Mori את ההודעה הבאה:'
      - id: mori-1
        type: aiTutorPrompt
        message: |-
          מַרְחַבָּא Mori, אַלְ-יוֹם בִּדְנָא נִתְדַּרַּב עַלָּא בְּנִין תָּלְתָה – פָּאעַל.
          עַטִינִי 5 גְ'מַל בְּנִין אַוּוַל, אַנָא בַּחוֹוּל כֻּל גְ'מְלָה לְפָּאעַל (פַּעְלָה בֵּין תְּנֵין).
          צַחֵּח לִי אִדָ'א פִּי אַגְ'לָאט וְשַׁרַחְלִי לֵישׁ.
          אִסְאַלְנִי סוּאָאל עַן כֻּל גְ'מְלָה וְכַ'לִינִי אוֹגָ'אוּב בְּגְ'מְלָה כַּאמְלָה.
          אִדָ'א גְ'וָאבִּי קַצִּיר, טַלַּב מִנִּי אוֹסַּע וְאַשְׁרַח.
          פִּי אַנּ-נִהָאיָה, עַטִינִי 3 גְ'מַל בְּנִין תָּלְתָה וְאַנָא בַּשְׁרַח לֵישׁ בְּנִין תָּלְתָה וְמָא אַוּוַל.
      - id: mori-note
        type: callout
        lang: he
        tone: warning
        title: שימו לב
        text: 'לא לכל פועל בבניין I יש צורה בבניין III. אם Mori אומר שאין צורה כזאת, או מציע פועל אחר – זה בסדר. זכרו: פָאעַל = פעולה כלפי אדם נוסף או יחד איתו, ו״זה לזה״ = תְּסָּאעַדְנָא / מַע בַּעַד.'
      - id: mori-rules
        type: callout
        lang: he
        tone: info
        title: דרישות
        text: |-
          - לענות במשפטים מלאים בלבד
          - להשתמש בפָאעַל תמיד עם אדם שני
          - להסביר מי עושה מה למי, לא רק לענות
          - להרחיב כל תשובה
    teacherNotes:
      - id: n-hw-a
        anchor: part-a
        text: 'תוקן — לבדיקת המורה. תשובות: 1. III, 2. VI (הדדי), 3. II (גרמתי לו להבין), 4. III, 5. I. במחברת סעיף 2 היה ״אַנָא וְסַחְבִּי סָּאעַדְנָא מַע בַּעַד״, סעיף 3 ״אַנָא סַוַּדְת סַחְבִּי יְסָּאעַד״ (סַוַּד – שורש אחר) וסעיף 5 ״אַנָא כַּלַּמְת אִמִּי תִּחְכִּי״ (כַּלַּם אינו ״גרם לדבר״); הם הוחלפו.'
      - id: n-hw-b
        anchor: part-b
        text: 'תוקן — לבדיקת המורה. במחברת: ״הפיכה לבניין III״ של אַנָא סָּאעַדְת סַחְבִּי (כבר בניין III), אַנָא כְּלַמְת אַחוּ (אין בניין I כזה) ואַנָא שַׁרַּכְת סַחְבִּי בַּלְ-עַמַל (בניין II מפוקפק). תשובות אפשריות: 1. סַחְבִּי / אִמִּי, 2. פִּי (או מַע + אדם), 3. אדם (אִמִּי…) + נושא.'
      - id: n-hw-mori
        anchor: mori-1
        text: 'ההודעה ל־Mori הועתקה מהמחברת (חולקה לשורות). היא מבקשת להפוך משפטי בניין I לבניין III – לכן נוספה לתלמידים הערה שלא לכל פועל יש צורה כזאת.'

