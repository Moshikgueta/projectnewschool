# Cycle "פָאעַל — יחסים ותקשורת" (pattern III), converted from the spoken Arabic
# level 3 notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review`.
# Blocks without `lang` are in the course language (spoken Arabic in Hebrew
# transliteration, apc-Hebr); Hebrew instructions carry `lang: he`.
course: ar-medubar-3
slug: faaal-relationships
title: 'פָאעַל — יחסים ותקשורת'
goal: 'להבין מה בניין פָאעַל מוסיף (פעולה כלפי אדם נוסף או יחד איתו), ולספר בעזרתו על יחסים ושיתוף פעולה בחיים שלי.'
position: 3
status: in_review

review:
  - >-
    The two workbook exercises ("faaal-relationships-meaning" and
    "faaal-relationships-together") are NEW: the notebook has no self-study
    exercises. They were written only from this cycle's (corrected) explanations,
    examples and vocabulary. An Arabic teacher must check every right answer, every
    wrong option and every transliteration before students see them.
  - >-
    Grammar explanations rewritten — an Arabic teacher must approve before
    publishing. Every rewritten block carries a teacher note "תוקן — לבדיקת המורה".
    Details in the next entries.
  - >-
    CORRECTED (central idea). The notebook defines Form III as reciprocal: "פָּאעַל
    = הפעולה הולכת בשני כיוונים. שניים עושים את אותו הדבר אחד לשני" and the rule
    "פָּאעַל = אַנָא וְחַדָּא תָּאנִי בִּנְעַמַּל אַלְ-פַּעְלָה מַע בַּעַד". Form III
    means doing the action TO or WITH another person (סָּאעַד = helped someone,
    חָאכַּא / כָּאלַם = talked with someone, שָׁארַכ = took part / shared); it is not
    necessarily mutual ("סָּאעַדְת סַחְבִּי" = I helped my friend, one direction). The
    truly reciprocal pattern is Form VI (תְפָאעַל: תְּסָּאעַדְנָא = we helped each
    other; the notebook itself uses בְּנִתְשָׁארַכ, בִּיתְסָּאעַד, תְּסָּאעַדְתוּ). The
    explanation, summary, rule and "common mistakes" were rewritten on that basis.
  - >-
    CORRECTED (Explanation 1, step 1). The notebook labels "אַנָא סָּאעַדְת" as "I
    helped (nobody in particular / myself)" and "אַנָא סָּאעַדְת סַחְבִּי" as Form I.
    Both are Form III (Form I of س-ع-د is سَعِد "was happy"). Rewritten as: סָּאעַדְת
    סַחְבִּי (III, one direction) / סַחְבִּי סָּאעַדְנִי (III, other direction) /
    "אַנָא סָּאעַדְת סַחְבִּי וְהוּ סָּאעַדְנִי" (two Form III clauses = mutual) /
    אַנָא וְסַחְבִּי תְּסָּאעַדְנָא (Form VI). The added forms סַחְבִּי סָּאעַדְנִי and
    תְּסָּאעַדְנָא must be checked.
  - >-
    CORRECTED (Explanation 1, step 4 root table). Original rows (root | I | II | III
    | meaning): ס-ע-ד | סָּאעַד | סַוַּד | סָּאעַד (מַע) | עזרו אחד לשני; ח-כ-י | חְכַּא
    | חַכָּא | חָאכַּא | שוחחו; שׁ-ר-כ | שׁרַכ | שַׁרַּכ | שָׁארַכ | שיתפו פעולה; ע-ו-ן |
    עָאן | עַוַּן | עָאוַן | עזרו / שיתפו; כ-ל-מ | כְּלַם | כַּלַּם | כָּאלַם | דיברו אחד
    עם השני; ת-ב-ע | תִּבַע | תַּבַּע | תָּאבַע | עקבו / המשיכו יחד. Problems: סָּאעַד is
    Form III, not I; סַוַּד is a different root (س-و-د); כְּלַם, עָאן, שׁרַכ are not the
    Form I verbs for "talk / help / share"; the Form II column (חַכָּא, שַׁרַּכ, עַוַּן,
    תַּבַּע) is doubtful; the meanings were all given as mutual. The table was reduced to
    the Form III verb, its meaning and how it takes the second person (no I / II
    columns). Please check the meanings, especially עָאוַן (helped / assisted) and
    תָּאבַע (continued / followed, e.g. a series).
  - >-
    CORRECTED (Explanation 2 and the grammar summary, I / II / III comparison
    tables). Original: rows "מי עושה? אני בלבד / אני גורם לאחר / אני + עוד אחד",
    "כיוון? יוצא ממני / יוצא ממני לאחר / הלוך וחזור", present "בִּסָּאעַד / בְּסַוִּד
    / בְּסָאעַד מַע", past "סָּאעַדְת / סַוַּדְת / סָּאעַדְת מַע", examples "כְּלַמְת /
    כַּלַּמְת סַחְבִּי יִחְכִּי / כָּאלַמְת מַע סַחְבִּי".
  - >-
    CORRECTED (continued). Explanation 2 also had the exposure sentences "אַנָא כְּלַמְת אַחוּ (I) / אַנָא כַּלַּמְת אַחוּ יִחְכִּי (II, 'made my
    brother talk') / אַנָא כָּאלַמְת אַחוּ (III, 'we talked to each other')". Wrong:
    סַוַּד is another root; כַּלַּם means "talked to / called", not "made someone talk";
    there is no Form I כְּלַם "talked"; "סָּאעַד מַע" is not how סָּאעַד takes its
    object. Replaced by a comparison of Form I (בִּנְחְכִּי), Form III (סָּאעַדְת סַחְבִּי,
    כָּאלַמְת אִמִּי) and Form VI (תְּסָּאעַדְנָא), and a small table of Form III forms
    that appear in the lesson. A note says Form II is causative only for some verbs
    (פַהַּם, דַרַּס, עַלַּם) and that כַּלַּם is not one of them.
  - >-
    CORRECTED (mini practices, Activity 1 challenge, homework parts א–ד). They asked
    to "turn a Form I sentence into Form III" using "אַנָא סָּאעַדְת סַחְבִּי" (already
    III), "אַנָא כְּלַמְת אִמִּי / אַחוּ" (no such Form I) and "אַנָא שַׁרַּכְת סַחְבִּי
    בַּלְ-עַמַל" (doubtful Form II). Rewritten as "one direction (III) → each other
    (VI or מַע בַּעַד)". Homework part א items 3 "אַנָא סַוַּדְת סַחְבִּי יְסָּאעַד" and 5
    "אַנָא כַּלַּמְת אִמִּי תִּחְכִּי" were replaced by "אַנָא פַהַּמְת סַחְבִּי" (II) and
    "אַנָא וְסַחְבִּי בִּנְחְכִּי כְּתִיר" (I); item 2 "אַנָא וְסַחְבִּי סָּאעַדְנָא מַע
    בַּעַד" by "אַנָא וְסַחְבִּי תְּסָּאעַדְנָא" (VI). Part ב (transform 3 sentences to
    III) became "add the second person / preposition". Mori message kept as written,
    with a student note that not every Form I verb has a Form III.
  - >-
    Please check (kept, not used in exercises): "סָּאעַדְת מַע" / "סָּאעַדְנָא מַע
    בַּעַד" (סָּאעַד takes a direct object; with מַע בַּעַד it reads "helped together",
    not "each other" — for "each other" תְּסָּאעַדְנָא or סָאעַדְנָא בַּעַד?);
    "כָּאלַמְנָא מַע בַּעַד" and "כָּאלַמְת מַע סַחְבִּי" (does כָּאלַם take מַע or a direct
    object? in daily Levantine חְכֵינָא מַע בַּעַד / כַּלַּמְת is more usual);
    "שָׁארַכְת מַע סַחְבִּי" (kept as correct: שָׁארַכ takes מַע / פִּי); warm-up "שׁוּ
    יַעְנִי אִנּוּ תְּסָּאעַד מַע חַדָּא"; the guiding question "שׁוּ אַלְ-פַּרְק בֵּין
    סָּאעַד וּסָּאעַד מַע" was changed to "…בֵּין סָּאעַד וּתְּסָּאעַד" (Explanation 1,
    Activity 1) and "סָּאעַדְת וּסָּאעַדְת מַע" to "סָּאעַדְת וּתְּסָּאעַדְנָא" (Activity
    2). The form חְכֵינָא (suggested in a teacher note) is not in the notebook.
  - >-
    Typo fixed: "هֹון" (Arabic letter ه inside the transliteration, Activity 2
    deepening) → "הוֹן". Not corrected, please check: "בְּכַּיוּן וָאחַד" and
    "כִּיוּנָאת" use the Hebrew word כיוון (Arabic اتجاه?); "עַטִינִי דַ'ּוְוּמָה
    חַקִּיקִיָּה" (teacher tip — "דַ'ּוְוּמָה" is not clear, perhaps مثال; compare
    "מִשָּׁאל" in the closing questions); "מֻ'הִם" (odd geresh on מ, مهم);
    "אַלְ-שַּׁכְּץ'" (شخص is usually שַׁח'ץ); "אַחוּ" in the notebook means "his brother"
    where "my brother" seems meant (those sentences were replaced). Initial dagesh
    (סָּאעַד, תָּאבַע, כָּאלַם) is the notebook's convention and was kept; ASCII
    quotation marks inside Arabic questions became ״.
  - >-
    The notebook has no vocabulary list: the vocabulary was built from the verbs and
    key words the lesson uses. תְּסָּאעַדְנָא (Form VI) was added to it because the
    corrected explanation needs it. No links, Quizlet or slides in this cycle.
    "Breakout Rooms" kept as in the notebook. The "Date / Participants" lines do not
    exist here.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: faaal-relationships-class
    title: 'שיעור: פָאעַל — יחסים ותקשורת'
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'בניין III פָאעַל — יחסים ותקשורת (אַלְ-עֲלָאקָאת וְאַתּ-תְּוָואצֻל)'
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: 'משמעות פָאעַל: פעולה כלפי אדם נוסף'
            description: >-
              סָּאעַד, חָאכַּא, שָׁארַכ, כָּאלַם; ההבדל מבניין I ומהפעולה ההדדית (תְּסָּאעַדְנָא, מַע בַּעַד).
          - name: לספר על יחסים ושיתוף פעולה
            description: >-
              סָּאעַדְת סַחְבִּי, שָׁארַכְנָא פִּי…, בְּנִשָּׁארַכ, פִּי חַדָּא בִּיסָּאעַדְנִי.
      - id: meta
        type: text
        lang: he
        text: 'רמה 3 · 90 דקות · מיומנויות: הבחנה סמנטית, דיבור, שימוש ספונטני'

      # ── opening round ──
      - id: intro-title
        type: heading
        lang: he
        level: 3
        text: סבב היכרות
      - id: intro-how
        type: text
        lang: he
        text: 'כל תלמיד מדבר לפחות 3 משפטים, ותלמיד אחר חייב לשאול שאלה. דרושה הרחבה – לא תשובות של מילה אחת.'
      - id: intro
        type: sentenceFrame
        frame: |-
          אַנָא וְ___ בִּנְחְכִּי כְּתִיר.
          פִּי חַדָּא בִּיסָּאעַדְנִי לַמָּא ___.
          אַנָא וְסַחְבִּי / מַרְתִי / אִבְנִי בְּנִשְׁתַּגַּל / בְּנִתְשָׁארַכ עַלָּא ___.
      - id: prep-title
        type: heading
        lang: he
        level: 3
        text: שאלות הכנה
      - id: prep
        type: discussionQuestions
        items:
          - question: 'מִין אַלְנָּאס אַלְּלִי בִּתְחָאכִּיהֻם כְּתִיר? עַן שׁוּ?'
          - question: 'הַל פִּי חַדָּא בִּיסָּאעַדַכּ בַּחְיָאתַכּ? כֵּיף?'
          - question: 'שׁוּ יַעְנִי עִנְדַכּ ״תְּשָׁארַכ״ מַע חַדָּא?'
          - question: 'הַל אַנְתָ אַלְּלִי בִּיסָּאעַד אוֹ אַלְּלִי בִּיתְסָּאעַד אַכְּתַר?'
          - question: "פִּי חַדָּא שָׁארַכְתוּ בִּאַשִּׁי מֻ'הִם? שׁוּ כָּאן?"

      # ── explanation 1 ──
      - id: expl1-title
        type: heading
        lang: he
        level: 3
        text: 'הסבר דידקטי 1 – פָאעַל: פעולה כלפי אדם נוסף'
      - id: expl1-idea
        type: callout
        lang: he
        tone: info
        title: הרעיון המרכזי
        text: >-
          בבניין III (**פָאעַל**) הפעולה נעשית **כלפי אדם נוסף או יחד איתו**: סָּאעַד = עזר
          למישהו, חָאכַּא = דיבר עם מישהו, שָׁארַכ = השתתף / שיתף פעולה. תמיד יש בתמונה אדם
          שני. אבל פָאעַל **לא בהכרח הדדי**: ״סָּאעַדְת סַחְבִּי״ = אני עזרתי לחבר שלי (כיוון
          אחד). כשהפעולה באמת הדדית – **זה לזה** – משתמשים בבניין VI (**תְפָאעַל**):
          תְּסָּאעַדְנָא = עזרנו זה לזה.
      - id: expl1-step1
        type: ruleSummary
        lang: he
        skill: 'שלב 1 – חשיפה (כותבים על הלוח): אותו פועל, כיוונים שונים'
        rules:
          - text: 'בניין III, כיוון אחד – אני עוזר לחבר:'
            examples:
              - 'אַנָא סָּאעַדְת סַחְבִּי ← עזרתי לחבר שלי'
          - text: 'בניין III, הכיוון ההפוך – החבר עוזר לי:'
            examples:
              - 'סַחְבִּי סָּאעַדְנִי ← החבר שלי עזר לי'
          - text: 'שני משפטי פָאעַל יחד = עזרנו זה לזה:'
            examples:
              - 'אַנָא סָּאעַדְת סַחְבִּי וְהוּ סָּאעַדְנִי'
          - text: 'בניין VI (תְפָאעַל) – פועל אחד שאומר ״זה לזה״:'
            examples:
              - 'אַנָא וְסַחְבִּי תְּסָּאעַדְנָא ← עזרנו זה לזה'
      - id: expl1-step2-title
        type: heading
        lang: he
        level: 4
        text: 'שלב 2 – שאלות מנחות'
      - id: expl1-step2
        type: discussionQuestions
        answerable: false
        items:
          - question: "כַּם וָאחַד פִּי אַלְ-גּ'מְלָה?"
          - question: 'מִין סָּאעַד מִין?'
          - question: 'הַל אַלְ-פַּעְלָה רָאחַת בְּכַּיוּן וָאחַד אוֹ תְּנֵין?'
          - question: 'שׁוּ אַלְ-פַּרְק בֵּין ״סָּאעַד״ וּ״תְּסָּאעַד״?'
      - id: expl1-step3
        type: ruleSummary
        lang: he
        skill: 'שלב 3 – ניסוח החוק (על ידי התלמידים)'
        rules:
          - text: '**פָאעַל** = אני עושה את הפעולה **כלפי אדם אחר או יחד איתו**. האדם השני תמיד מופיע במשפט.'
            examples:
              - 'אַנָא סָּאעַדְת סַחְבִּי'
              - 'אַנָא שָׁארַכְת מַע סַחְבִּי'
          - text: 'כשהפעולה הולכת לשני הכיוונים (זה לזה) – בניין VI, או מוסיפים **מַע בַּעַד** (יחד).'
            examples:
              - 'אַנָא וְסַחְבִּי תְּסָּאעַדְנָא'
      - id: expl1-table
        type: table
        lang: he
        caption: 'שלב 4 – פעלים מרכזיים בבניין III'
        header: [שורש, 'בניין III – פָאעַל', משמעות, 'איך מוסיפים את האדם השני']
        rows:
          - [ס-ע-ד, סָּאעַד, 'עזר (למישהו)', 'ישירות: סָּאעַדְת סַחְבִּי']
          - [ח-כ-י, חָאכַּא, 'דיבר עם (מישהו)', 'ישירות: בִּתְחָאכִּיהֻם']
          - [שׁ-ר-כ, שָׁארַכ, 'השתתף / שיתף פעולה', 'פִּי (במה) / מַע (עם מי)']
          - [ע-ו-ן, עָאוַן, 'סייע, עזר (למישהו)', 'ישירות']
          - [כ-ל-מ, כָּאלַם, 'דיבר עם (מישהו)', 'כָּאלַמְת אִמִּי']
          - [ת-ב-ע, תָּאבַע, 'המשיך / עקב אחרי (למשל סדרה)', 'ישירות']
      - id: expl1-practice
        type: text
        lang: he
        text: 'מיני תרגול (3 דקות): כל תלמיד אומר 2 משפטים עם פָאעַל. הבן־זוג שואל:'
      - id: expl1-practice-questions
        type: discussionQuestions
        answerable: false
        items:
          - question: 'מִין וְמִין?'
