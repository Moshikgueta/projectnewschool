          - 'פתיחה (5 דקות): המורה שואל את שאלות הפתיחה בערבית בלבד ודורש הרחבה מכל תלמיד. כל תשובה = לפחות 2–3 משפטים, ותלמיד אחר ממשיך בשאלה חדשה. אין תשובות קצרות.'
          - 'הכנה אישית (3 דקות): כל תלמיד כותב 3 מצבים אמיתיים. כל מצב כולל: מין? שו ביעמל? ליש? שו אלנתיג׳ה? הל דיימן בנגח?'
          - 'עבודה בזוגות (8 דקות): כל תלמיד מציג את 3 המצבים שלו. אחרי כל תשובה בן הזוג שואל לפחות 2 שאלות ומאתגר את התשובה (לא רק מסכים). לפחות 6–8 משפטים לכל תלמיד, פַעַּל לפחות 3 פעמים, ודוגמה אמיתית אחת לפחות (לא כללית).'
