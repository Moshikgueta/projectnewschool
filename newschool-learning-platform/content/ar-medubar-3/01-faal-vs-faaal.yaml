          - 'עבודה בקבוצות (5 דקות, קבוצות של 2–3): בוחרים 3 משפטים. לכל משפט: האם הוא נכון? אם לא – מתקנים. מסבירים למה, עם עאשאן, ליש, שו אלפרק. כל תלמיד מסביר לפחות משפט אחד.'
          - 'אתגר (2 דקות): כל קבוצה ממציאה משפט אחד לא נכון, והכיתה מתקנת ומסבירה.'
