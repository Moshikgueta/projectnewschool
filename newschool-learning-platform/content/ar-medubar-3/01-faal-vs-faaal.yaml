activities:
  - slug: faal-vs-faaal-meaning
    title: 'משמעות: פַעַל או פַעַּל?'
    minutes: 8
    items:
      - id: pairs
        type: matching
        lang: he
        prompt: התאימו כל פועל לפירוש שלו.
        pairs:
          - ['בפהם', 'אני מבין']
          - ['בפההם', 'אני מסביר (גורם להבין)']
          - ['בדרס', 'אני לומד']
          - ['בדררס', 'אני מלמד']
          - ['בכתב', 'אני כותב']
      - id: explain-friend
        type: multipleChoice
        lang: he
        prompt: 'מה פירוש: אנא בפההם סחבי אלדרס?'
        options:
          - { text: 'אני מסביר לחבר שלי את השיעור (גורם לו להבין).', correct: true }
          - {
              text: 'אני מבין את השיעור עם החבר שלי.',
              feedback: 'בפההם (פַעַּל) – אני גורם למישהו אחר להבין. ״אני מבין״ זה בפהם.',
            }
          - {
              text: 'החבר שלי מסביר לי את השיעור.',
              feedback: 'הנושא הוא אנא – אני זה שמסביר, והחבר הוא זה שמבין.',
            }
      - id: which-faal
        type: multipleChoice
        lang: he
        prompt: 'באיזה משפט אני עושה את הפעולה בעצמי (פַעַל)?'
