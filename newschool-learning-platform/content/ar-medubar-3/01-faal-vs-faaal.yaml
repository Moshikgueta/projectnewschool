    teacherNotes:
      - id: n-plan
        anchor: null
        text: 'שיעור של 90 דקות. שתי מיומנויות: משמעות – פַעַל או פַעַּל (הסברים דידקטיים, פעילויות 1 ו־4) ושימוש – לגרום למישהו לעשות ולהסביר (פעילויות 1–3). במחברת יש קישור ל״מצגת השיעור״ ולסט קוויזלט ״פעל vs פעלל״, אבל הקישורים לא נמצאים בקובץ. המצגת כנראה ב־Gamma, שאינה מותרת בפלטפורמה – הביאו את החומר בדרך אחרת.'
      - id: n-intro
        anchor: intro
        text: 'כל תלמיד מדבר לפחות 3 משפטים; תלמיד אחר חייב לשאול שאלה; דרשו הרחבה. תוקן — לבדיקת המורה: במחברת ״אנא עלמני ___ ערבי״; הנושא של עלמני הוא המלמד, לכן ״___ עלמני ערבי״ (למשל: אלמעלם עלמני ערבי).'
      - id: n-prep
        anchor: prep
        text: 'תוקן — לבדיקת המורה: בשאלה 8 במחברת ״ובעדין פהמכ לחדא תאני״ (= הוא גרם לך להבין); הכוונה ״הסברת למישהו אחר״, לכן ״פהמתו לחדא תאני״. בשאלה 5 ״בעלמתו״ (הווה) – אולי ״עלמתו״ (עבר).'
      - id: n-exp1
        anchor: exp1-questions
        text: 'שאלה שלישית במחברת נכתבה בחלקה בעברית: ״מי אחראי על אלפעלה?״ – אפשר לשאול אותה בעברית. החוק שהתלמידים צריכים להגיע אליו: ״אנא בעמל אלפעלה לחאלי״. תוקן — לבדיקת המורה: במחברת ״אנא ביעמל״ (ביעמל = הוא עושה).'
      - id: n-exp1-rule
        anchor: exp1-rule
        text: 'תוקן — לבדיקת המורה: במחברת ״פעל = אין אדם נוסף בפעולה״. זה נכון לדוגמאות האלה, אבל לא כלל: גם בפַעַל יכול להיות אדם נוסף כמושא (למשל שפת סחבי – ראיתי את החבר שלי). ההבדל הוא מי עושה את הפעולה.'
      - id: n-exp2
        anchor: exp2-board
        text: 'תוקן — לבדיקת המורה: במחברת הדוגמה הראשונה הייתה ״אנא כתתבת אלולאד יכתבו רסאלה״. צורה גורמת + פועל נוסף (יכתבו) אומרת אותו דבר פעמיים, וגם השימוש בכתתב כ״גרם לכתוב״ לא ודאי. הוחלף ב״אנא ח׳לית אלולאד יכתבו רסאלה״. אם המורה מאשר את כתתב: ״אנא כתתבת אלולאד רסאלה״ (בלי יכתבו).'
      - id: n-exp2-rule
        anchor: exp2-rule
        text: 'תוקן — לבדיקת המורה: במחברת ״פעלל = אני גורם למישהו אחר לעשות״ כחוק כללי, ושם הבניין נכתב ״פעלל״ (כפל של האות האחרונה). בבניין II מוכפלת האות האמצעית (פַעַּל), והמשמעות הגורמת נכונה רק לחלק מהפעלים: פההם, דררס, עלם – בטוחים; פתתח – בדרך כלל ״פתח הרבה / שוב ושוב״. ח׳לי + פועל מופיע במחברת עצמה (״אנא בח׳לי חדא תאני יעמל אלפעלה״; במחברת ״בחלי״ בלי גרש).'
      - id: n-mini2
        anchor: mini2-examples
        text: 'תוקן — לבדיקת המורה: במחברת ״אנא בכתתב אלולאד״ (כתתב כגורם – לא ודאי) הוחלף ב״אנא בח׳לי אלולאד יכתבו״; ״בפההמ״ תוקן ל״בפההם״.'
      - id: n-act1
        anchor: act1-challenge
        text: 'תשובות לאתגר: ״אנא פהמת אלדרס״ ← ״אנא פההמת סחבי אלדרס״. ״אנא כתבּת רסאלה״ ← ״אנא ח׳לית סחבי יכתב רסאלה״ (צורת פַעַּל של כתב כגורם – לבדיקת המורה). תוקן — לבדיקת המורה: בדוגמאות של ההכנה האישית במחברת ״אנא בכתתב סחבי יכתב״ – הוחלף ב״אנא בח׳לי סחבי יכתב״. דגש למורה: אם תלמיד נותן רק משפט – דרשו הסבר; אם אין אדם נוסף – שאלו ״מין?״; אם אין הבדל ברור – עצרו וחדדו.'
      - id: n-act1-open
        anchor: act1-open
        text: 'תוקן: ב״יפהם״ הייתה אות ערבית באמצע התעתיק. ״הל אנת בתעלם חדא שי?״ – כאן ״בתעלם״ = אתה מלמד (פַעַּל), לא ״לומד״.'
      - id: n-act2
        anchor: act2-open
        text: 'אל תסתפקו בתשובה אחת. דגש סופי: אל תוותרו על עומק – כל תשובה = הרחבה + הסבר + דוגמה. אם התלמיד נשאר כללי, עצרו ושאלו ״עטיני דוגמה חקיקיה״ (״דוגמה״ היא מילה עברית – לבדיקת המורה). תוקן: ״בתחללי״ ← ״בתח׳לי״; ב״נוע״ הייתה אות ערבית באמצע התעתיק.'
      - id: n-act3
        anchor: act3-examples
        text: 'תוקן — לבדיקת המורה: במחברת ״אנא בכתתבכ תכתב כל יום״ (צורה גורמת + פועל נוסף) הוחלף ב״אנא בח׳ליכ תכתב כל יום״; ״בח׳ליק תיג׳י בקיר״ ← ״בח׳ליכ תיג׳י בכיר״. ״אלנושא״ ו״אחראי״ הן מילים עבריות – לבדיקת המורה. טיפ: אם תלמיד אומר פועל פשוט, עצרו מיד ושאלו ״כיף תח׳לי חדא תאני יעמל? מין?״.'
      - id: n-act4
        anchor: act4-board
        text: 'תשובות למורה (לבדיקת המורה): פתחת אלבאב – נכון. פתתחת אלבאב – ״תלוי״: פירושו בדרך כלל ״פתחתי (הרבה דלתות / שוב ושוב)״, לא ״גרמתי למישהו לפתוח״; לזה אומרים ״ח׳לית סחבי יפתח אלבאב״. פהמת אלדרס – נכון. פההמת – לא שלם: חסר למי (פההמת סחבי). בכתתב סחבי יכתוב – לא ודאי: אומר פעמיים אותו דבר; עדיף ״בח׳לי סחבי יכתב״. כתבּת סחבי – לא הגיוני; ״ח׳לית סחבי יכתב״ או ״כתבת לסחבי״ (כתבתי לחבר שלי). דוגמאות לא נכונות מהתלמידים: ״אנא פההמת״ (בלי מושא), ״אנא בכתתב אכל״. אל תיתנו תשובות – גרמו להם להסביר; אם התשובה חלשה, שאלו עוד ״ליש?״.'

