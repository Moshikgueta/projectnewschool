              - 'אנא בפהם אלדרס – אני מבין את השיעור.'
              - 'אנא בפתח אלבאב – אני פותח את הדלת.'
          - text: 'איך מזהים? שואלים: האם אני עושה את הפעולה בעצמי? אם כן – פַעַל.'
      - id: form2
        type: ruleSummary
        lang: he
        skill: 'פַעַּל (בניין II) – אני גורם (בחלק מהפעלים)'
        rules:
          - text: 'צורה: האות האמצעית של השורש מוכפלת: פהם → פההם, דרס → דררס.'
          - text: 'משמעות: **בחלק מהפעלים** – אני גורם למישהו אחר לעשות את הפעולה. יש גורם (אני) ויש מבצע (האדם השני), ולכן האדם השני חייב להופיע במשפט.'
            examples:
              - 'אנא בפההם סחבי אלדרס – אני מסביר לחבר שלי את השיעור.'
              - 'אנא בדררס תלאמיזה – אני מלמד תלמידים.'
          - text: 'לא בכל פועל: יש פעלים שבהם פַעַּל מוסיף חיזוק או חזרה (פתתח – פתח הרבה / שוב ושוב). כשרוצים ״לגרום למישהו לעשות״ ואין צורת פַעַּל מתאימה, אומרים ח׳לי + פועל.'
            examples:
              - "אנא בח'לי אלולאד יכתבו – אני גורם לילדים לכתוב."
              - "אנא בח'לי סחבי יפתח אלבאב – אני גורם לחבר שלי לפתוח את הדלת."
          - text: 'איך מזהים? שואלים: האם אני גורם למישהו אחר לעשות את הפעולה? האם יש אדם נוסף שעושה אותה?'
      - id: pairs
        type: table
        lang: he
        caption: זוגות מהשיעור
        header: [פַעַל – אני עושה, פַעַּל, משמעות]
        rows:
          - ['בפהם – אני מבין', 'בפההם', 'אני מסביר, גורם למישהו להבין']
          - ['בדרס – אני לומד', 'בדררס', 'אני מלמד']
          - ['בכתב – אני כותב', 'כתתב', 'לא ודאי כגורם – עדיף ח׳לי + יכתב']
          - ['בפתח – אני פותח', 'פתתח', 'בדרך כלל: פותח הרבה / שוב ושוב – לא ״גורם לפתוח״']
      - id: clear
        type: examples
        items:
          - { text: 'אנא בפהם אלדרס', gloss: 'אני מבין' }
          - { text: 'אנא בפההם סחבי אלדרס', gloss: 'אני גורם לחבר שלי להבין' }
      - id: mistakes
        type: ruleSummary
        lang: he
        skill: טעויות נפוצות
        rules:
          - text: 'פַעַּל גורם בלי אדם נוסף: ״אנא פההמת״ – חסר למי. תיקון:'
            examples:
              - 'אנא פההמת סחבי.'
          - text: 'פַעַל במקום ״לגרום״: ״אנא כתבּת סחבי״ – לא הגיוני (כתבתי את החבר שלי). תיקון:'
            examples:
              - "אנא ח'לית סחבי יכתב."
          - text: 'התמקדות בצורה במקום במשמעות: התלמיד חושב איך הפועל נראה, במקום מה הוא מבטא. הפתרון: תמיד לשאול מי עושה את הפעולה.'
      - id: key
        type: ruleSummary
        lang: he
        skill: משפט מפתח לסיכום
        rules:
          - text: 'פַעַל – אני עושה:'
            examples:
              - 'אנא בעמל אלפעלה.'
          - text: 'פַעַּל / ח׳לי – אני גורם:'
            examples:
              - "אנא בח'לי חדא תאני יעמל אלפעלה."
      - id: tip
        type: callout
        lang: he
        tone: tip
        title: טיפ חשוב
        text: |-
          לא בטוחים באיזה בניין להשתמש? שאלו: האם יש עוד מישהו שעושה את הפעולה?
          אם לא – פַעַל. אם כן – פַעַּל (בפעלים כמו פההם, דררס), או ח׳לי + פועל.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: 'תוקן — לבדיקת המורה: הסיכום במחברת מציג את פַעַּל = ״אני גורם״ כחוק כללי (״יש לפחות שני אנשים״, ״חייב להופיע אדם נוסף״), ואת פַעַל כ״אדם אחד בלבד, אין השפעה על אדם אחר״. הסיכום נכתב מחדש: המשמעות הגורמת – רק בחלק מהפעלים; ח׳לי + פועל כדרך הכללית. גם ״אנא ביעמל אלפעלה״ ← ״אנא בעמל אלפעלה״, ״בחלי״ ← ״בח׳לי״, ״בפההמ״ ← ״בפההם״.'
      - id: n-pairs
        anchor: pairs
        text: 'הטבלה חדשה (לא במחברת) – לבדיקת המורה, במיוחד השורות של כתתב ופתתח.'
      - id: n-mistakes
        anchor: mistakes
        text: 'תוקן — לבדיקת המורה: במחברת התיקון ל״אנא כתבּת סחבי״ היה ״אנא בכתתב סחבי״ (וגם שינוי זמן). הוחלף ב״אנא ח׳לית סחבי יכתב״; אפשרות נוספת: ״כתבת לסחבי״ (כתבתי לחבר שלי).'

  # ── after class: classic homework ────────────────────────────────────────
  - slug: faal-vs-faaal-homework
    title: שיעורי בית
    phase: after_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'שיעורי בית – פַעַל מול פַעַּל'
      - id: goal
        type: text
        lang: he
        text: 'מטרה: חיזוק ההבחנה והשימוש בין פַעַל לפַעַּל. דגש: דיוק ושימוש עצמאי.'
      - id: part-a-title
        type: heading
        lang: he
        level: 3
        text: 'חלק א – הבנה (זיהוי)'
      - id: part-a-how
        type: text
        lang: he
        text: 'קראו את המשפטים וענו: פַעַל או פַעַּל? הסבירו בקצרה למה.'
      - id: part-a
        type: discussionQuestions
        items:
          - question: 'אנא בכתב רסאלה'
          - question: 'אנא בדררס תלאמיזה'
          - question: 'אנא בפהם אלדרס'
          - question: 'אנא בפההם סחבי אלדרס'
          - question: 'אנא בפתח אלבאב'
          - question: 'אנא בדרס'
      - id: part-b-title
        type: heading
        lang: he
        level: 3
        text: 'חלק ב – תיקון טעויות'
      - id: part-b-how
        type: text
        lang: he
        text: 'תקנו את המשפטים והסבירו מה הייתה הטעות.'
      - id: part-b
        type: discussionQuestions
        items:
          - question: 'אנא פההמת'
          - question: 'אנא כתבּת סחבי'
          - question: 'אנא בפהם סחבי אלדרס'
          - question: 'אנא בפתח סחבי אלבאב'
      - id: part-c-title
        type: heading
        lang: he
        level: 3
        text: 'חלק ג – הפיכה'
      - id: part-c-how
        type: text
        lang: he
        text: 'הפכו כל משפט למשפט שבו אתם גורמים למישהו אחר לעשות את הפעולה – בפַעַּל, או בח׳לי + פועל כשאין צורת פַעַּל מתאימה.'
      - id: part-c
        type: discussionQuestions
        items:
          - question: 'אנא בכתב כל יום'
          - question: 'אנא בפהם אלדרס'
          - question: 'אנא בפתח אלבאב'
          - question: 'אנא בדרס'
          - question: 'אנא בלעב'
      - id: part-d-title
        type: heading
        lang: he
        level: 3
        text: 'חלק ד – יצירה (כתיבה)'
      - id: part-d
        type: sentenceFrame
        lang: he
        prompt: 'כתבו 4 זוגות משפטים. לכל רעיון: משפט בפַעַל, ואותו רעיון בפַעַּל.'
        frame: |-
          1. ___ / ___
          2. ___ / ___
          3. ___ / ___
          4. ___ / ___
        example: 'אנא בפהם אלדרס / אנא בפההם סחבי אלדרס'
      - id: part-e-title
        type: heading
        lang: he
        level: 3
        text: 'חלק ה – כתיבה חופשית'
      - id: part-e
        type: reflection
        lang: he
        prompt: >-
          כתבו פסקה (5–6 משפטים) על החיים שלכם: לפחות 2 משפטים בפַעַל ולפחות 3 משפטים
          שבהם אתם גורמים למישהו לעשות. שאלות עזר: מה אתם עושים ביום־יום? למי אתם עוזרים
          או מלמדים? למי אתם גורמים לעשות דברים?
      - id: part-f-title
        type: heading
        lang: he
        level: 3
        text: 'חלק ו – חשיבה'
      - id: part-f
        type: discussionQuestions
        lang: he
        title: ענו במשפטים מלאים
        items:
          - question: מתי משתמשים בפַעַל?
          - question: מתי משתמשים בפַעַּל?
          - question: מה ההבדל הכי חשוב ביניהם?
          - question: איזו טעות הכי נפוצה?
      - id: general
        type: callout
        lang: he
        tone: info
        title: דרישות כלליות
        text: 'כתיבה ברורה, משפטים מלאים, הסברים קצרים כשצריך, ושימוש נכון בבניינים.'

      # ── Mori ──
      - id: mori-title
        type: heading
        lang: he
        level: 2
        text: 'שיעורי בית עם Mori – פַעַל מול פַעַּל'
      - id: mori-how
        type: text
        lang: he
        text: >-
          מטרה: תרגול דיבור, תיקון טעויות ושימוש טבעי בפַעַל ובפַעַּל. שלחו ל־Mori את
          ההודעה הבאה. בהודעה מבקשים מ־Mori לתת 5 משפטים בפַעַל, שאתם הופכים לפַעַּל;
          לתקן ולהסביר; לשאול שאלה על כל משפט; ובסוף לתת 3 משפטים בפַעַּל שאתם הופכים
          לפַעַל.
      - id: mori-1
        type: aiTutorPrompt
        lang: he
        title: 'הודעה ל־Mori'
        message: |-
          מרחבא Mori
          אליום בדנא נתדרב על פעל ופעלל
          1. עטיני 5 ג'מל בפעל (אנא בעמל אלפעלה לחאלי)
          2. אנא בחוול כל ג'מלה לפעלל (אנא בח'לי חדא תאני יעמל אלפעלה)
          3. סחח לי אם פי אע'לאט ושרחל לי ליש
          4. אסאלני אסאלה על כל ג'מלה וח'ליני אוג'אוב בג'מלה כמלה
          5. אם ג'ואבי קציר, טלב מני אוסע ואַשרח
          6. פי אלנהאיה, אעטיני 3 ג'מל בפעלל ואנא בחוולון לפעל
          7. סחח לי ואַשרח לי אלפרק
      - id: mori-rules
        type: callout
        lang: he
        tone: info
        title: דרישות
        text: |-
          לענות במשפטים מלאים בלבד.
          להשתמש גם בפַעַל וגם בפַעַּל.
          להסביר, לא רק לענות, ולהרחיב כל תשובה.
    teacherNotes:
      - id: n-part-a
        anchor: part-a
        text: 'תוקן — לבדיקת המורה: במחברת פריט 2 היה ״אנא בכתתב סחבי יכתב״ (צורה גורמת + פועל נוסף, כתתב לא ודאי) ופריט 6 ״אנא בפתח אולאדי אלבאב״ (פַעַל עם אדם נוסף – לא משפט טבעי). הוחלפו ב״אנא בדררס תלאמיזה״ ו״אנא בדרס״. תשובות: 1 פַעַל, 2 פַעַּל, 3 פַעַל, 4 פַעַּל, 5 פַעַל, 6 פַעַל.'
      - id: n-part-b
        anchor: part-b
        text: 'תשובות (לבדיקת המורה): 1 אנא פההמת סחבי (חסר למי). 2 אנא ח׳לית סחבי יכתב / כתבת לסחבי. 3 אנא בפההם סחבי אלדרס (גורם – צריך פַעַּל). 4 אנא בח׳לי סחבי יפתח אלבאב (פתתח אינו ״גורם לפתוח״). פריט ״אנא בכתתב רסאלה״ מהמחברת הוסר, כי הוא תלוי בכתתב כגורם, שאינו ודאי.'
      - id: n-part-c
        anchor: part-c
        text: 'תשובות (לבדיקת המורה): 1 אנא בח׳לי סחבי יכתב כל יום. 2 אנא בפההם סחבי אלדרס. 3 אנא בח׳לי סחבי יפתח אלבאב. 4 אנא בדררס (תלאמיזה). 5 אנא בלעּב אלולאד (פַעַּל של לעב – לאשר) או אנא בח׳לי אלולאד ילעבו. ההוראה במחברת (״הפוך כל משפט מפעל לפעלל״) שונתה כי לא לכל פועל יש פַעַּל גורם.'
      - id: n-mori
        anchor: mori-1
        text: 'תוקן — לבדיקת המורה: ״נתרב״ ← ״נתדרב״, ״אנא ביעמל״ ← ״אנא בעמל״, ״בחלי״ ← ״בח׳לי״. Mori יחזיר משפטים בפַעַּל לכל פועל – בדקו שהוא לא מציג את פַעַּל כ״גורם״ לכל פועל.'

