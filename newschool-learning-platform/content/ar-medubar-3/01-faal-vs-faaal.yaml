# Cycle "פעל vs פעלל", converted from the spoken Arabic level 3 notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (spoken Arabic in Hebrew
# transliteration, apc-Hebr); Hebrew instructions carry `lang: he`.
course: ar-medubar-3
slug: faal-vs-faaal
title: 'פַעַל מול פַעַּל — אני עושה, אני גורם'
goal: 'להבחין בין פַעַל (אני עושה) לפַעַּל (אני גורם למישהו אחר לעשות), ולהשתמש בהם בדיבור עם הסבר.'
position: 1
status: published

review:
  - >-
    The two workbook exercises ("faal-vs-faaal-meaning" and "faal-vs-faaal-use")
    are NEW: the notebook has no self-study exercises. They were written only from
    this cycle's examples and summary, and use only the safest verb pairs (פהם /
    פההם, דרס / דררס) plus ח'לי + verb. An Arabic teacher must check every right
    answer, every wrong option and every transliteration before students see them.
  - >-
    Grammar explanations rewritten — an Arabic teacher must approve before
    publishing. Each rewritten place has a teacher note "תוקן — לבדיקת המורה".
    Details in the entries below.
  - >-
    Rewritten: the notebook presents Form II as a general rule ("פעלל = אני גורם
    למישהו אחר לעשות", "יש לפחות שני אנשים", "חייב להופיע אדם נוסף") and Form I as
    "only one person, no effect on another person". Both are over-generalisations:
    Form II is causative only for SOME verbs (פההם "made understand / explained",
    דררס "taught" are safe), it can be intensive/repetitive (פתתח, usually "opened
    many / repeatedly", not "made someone open"), and Form I verbs can have another
    person as object. The summary and the explanations now say "for some verbs" and
    show ח'לי + verb (already used in the notebook: "בח'לי חדא תאני יעמל אלפעלה")
    as the general way to say "I make someone do".
  - >-
    Pattern name: the notebook writes the Form II pattern as "פעלל", which doubles
    the LAST root letter; Form II doubles the MIDDLE root letter (فعّل). The Hebrew
    text uses פַעַל / פַעַּל (as in the cycle title). The notebook's transliteration
    of Form II verbs with a doubled letter (פההם, דררס, כתתב, פתתח) was kept.
  - >-
    Doubtful, flagged and kept out of the exercises: (1) "אנא כתתבת אלולאד יכתבו
    רסאלה" / "אנא בכתתב סחבי יכתב" / "אנא בכתתבכ תכתב כל יום": a causative Form II
    plus a second verb (יכתב) says the same thing twice; if כתתב is used
    causatively the shape would be "כתתבת אלולאד רסאלה", otherwise "ח'לית אלולאד
    יכתבו רסאלה". The class examples were changed to the ח'לי shape and the original
    is shown in a teacher note. (2) "אנא פתתחת אלבאב" (Activity 4): marked as "opened
    many / repeatedly", not causative. (3) "אנא כתבת סחבי" — the notebook's
    correction "אנא בכתתב סחבי" was replaced by "אנא ח'לית סחבי יכתב" (or "כתבת
    לסחבי" = I wrote to my friend). (4) Homework part C "אנא בלעב" → "בלעּב" (Form II
    of לעב, "make play") is plausible but please confirm.
  - >-
    Homework changes: part A item 2 "אנא בכתתב סחבי יכתב" replaced by "אנא בדררס
    תלאמיזה" and item 6 "אנא בפתח אולאדי אלבאב" (Form I with an extra person: not a
    natural sentence) replaced by "אנא בדרס"; part B item 3 "אנא בכתתב רסאלה" left
    out (it depends on the doubtful causative כתתב); part B item 5 "אנא בפתח סחבי
    אלבאב" kept, with the correction "אנא בח'לי סחבי יפתח אלבאב"; part D example
    changed to the פהם / פההם pair. Teacher answers are in teacher notes.
  - >-
    Grammar fixes in Arabic text (please confirm): "אנא ביעמל אלפעלה" (ביעמל is "he
    does") → "אנא בעמל אלפעלה" (explanation 1, summary key sentence, Mori message);
    opening frame "אנא עלמני ___ ערבי" → "___ עלמני ערבי" (the teacher is the
    subject); preparation question 8 "ובעדין פהמכ לחדא תאני" ("he made you
    understand") → "ובעדין פהמתו לחדא תאני" (you made someone else understand it).
    Not changed, please check: preparation question 5 "וכמאן בעלמתו לחדא תאני"
    (present "בעלמתו" after a past question; maybe "עלמתו").
  - >-
    Typos fixed: "יפهم" → "יפהם" (stray Arabic letter, Activity 1); "נوع" → "נוע"
    (stray Arabic letter, Activity 2); "בחלי" → "בח'לי" (explanation 2, summary, Mori
    message); "בתחללי" / "תחללי" → "בתח'לי" / "תח'לי" (Activities 2–3); "בח'ליק" →
    "בח'ליכ" (Activity 3); "בקיר" → "בכיר" (بكّير, Activity 3); final-letter typo
    "בפההמ" → "בפההם" (mini practice 2, summary); Mori message "נתרב" → "נתדרב".
  - >-
    Not corrected, please decide: Hebrew words inside Arabic questions — "מי אחראי
    על אלפעלה?" (explanation 1; moved to a Hebrew teacher note), "אחראי" (Activity
    3), "אתגר" (Activity 2), "דוגמה" (Activity 2 teacher tip), "אלנושא" (Activity
    3). Spelling variants kept as in the notebook: עשאן / עאשאן, אסתכ'דמת /
    תסתכדם, דיימן, "ושרחל לי" (Mori message). "הל אנת בתעלם חדא שי" is ambiguous in
    writing (Form II "you teach" vs Form V "you learn"); the context says "teach".
  - >-
    Left out: the "מצגת השיעור" (lesson slides) and the Quizlet set "פעל vs
    פעלל" — the export has no URLs (the slides are probably a Gamma.app link, which is
    not allowed anyway); see the teacher note. The notebook has NO vocabulary list:
    the vocabulary section was built from the verbs and key words the lesson uses.
  - >-
    Times: "3–5 דקות" → 5, "1–2 דקות" → 2. The notebook lists three skills (semantic
    distinction, speaking and explaining, spontaneous use); the platform uses two:
    (1) meaning — פַעַל or פַעַּל, (2) use — saying and explaining "I make someone
    do". Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: faal-vs-faaal-class
    title: 'שיעור: פַעַל מול פַעַּל'
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'פַעַל מול פַעַּל — אני עושה, אני גורם'
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: משמעות – פַעַל או פַעַּל?
            description: >-
              מי עושה את הפעולה? פהמת אלדרס (הבנתי) מול פההמת סחבי אלדרס (הסברתי לחבר
              שלי, גרמתי לו להבין).
          - name: שימוש – לגרום למישהו לעשות, ולהסביר
            description: >-
              בפההם, בדררס, ובפעלים אחרים בח'לי חדא תאני יעמל…; להסביר את ההבדל בעזרת
              ליש? למין? כיף?
      - id: goals
        type: callout
        lang: he
        tone: info
        title: מטרות השיעור
        text: |-
          הבחנה עמוקה במשמעות: מי עושה את הפעולה?
          דיבור והסבר של ההבדל בין המשפטים.
          שימוש ספונטני בפַעַל ובפַעַּל.
      - id: intro-title
        type: heading
        lang: he
        level: 3
        text: סבב היכרות
      - id: intro-how
        type: text
        lang: he
        text: 'כל תלמיד אומר לפחות 3 משפטים לפי התבנית. תלמיד אחר חייב לשאול שאלה.'
      - id: intro
        type: sentenceFrame
        frame: |-
          אנא ___.
          אנא בתעלם ערבי עשאן ___.
          אנא באחב אתעלם דרך ___.
          ___ עלמני ערבי.
          אנא בעלם ___ ערבי.
      - id: prep-title
        type: heading
        lang: he
        level: 3
        text: שאלות הכנה
      - id: prep
        type: discussionQuestions
        items:
          - question: 'שו אלשי אלי בתתעלמו הלפטרה, ומין עלמכ יא?'
          - question: 'הל פי אשי פהמתו לחאלכ, או חדא פהמכ יא?'
          - question: 'מין אלי עלמכ אכתר אשי חשוב בחיאתכ, ושו האדא אלאשי?'
          - question: 'הל אנת בעלם חדא אשי הלפטרה? שו בתעלמו בדיוק?'
          - question: 'שו אלאשי אלי תעלמתו, וכמאן בעלמתו לחדא תאני?'
          - question: 'הל פי חדא ח’לכ תכתב או תדרס? כיף כאן האשי?'
          - question: 'כיף בתתעלם הכי מניח - לחאלכ או למא חדא בעלמכ? ליש?'
          - question: 'הל סאר מעכ מרה אנת פהמת אשי, ובעדין פהמתו לחדא תאני? כיף?'

      # ── explanation 1: Form I ──
      - id: exp1-title
        type: heading
        lang: he
        level: 3
        text: 'הסבר דידקטי 1 – פַעַל (בניין I)'
      - id: exp1
        type: classActivity
        lang: he
        title: 'פַעַל: אני עושה את הפעולה'
        skills: [משמעות – פַעַל או פַעַּל?]
        minutes: 10
        steps:
          - 'חשיפה: המורה כותב על הלוח את שלושת המשפטים שלמטה.'
          - 'שאלות מנחות: המורה שואל את השאלות שלמטה, לפני שהוא מסכם.'
          - 'ניסוח החוק – על ידי התלמידים: מכוונים אותם לנסח את החוק בעצמם מתוך הדוגמאות.'
          - 'חיזוק: חוזרים על הדוגמאות. בכל המשפטים האלה **אני** עושה את הפעולה בעצמי.'
      - id: exp1-board
        type: examples
        items:
          - { text: 'אנא כתבּת רסאלה', gloss: 'כתבתי מכתב' }
          - { text: 'אנא פהמת אלדרס', gloss: 'הבנתי את השיעור' }
          - { text: 'אנא פתחת אלבאב', gloss: 'פתחתי את הדלת' }
      - id: exp1-questions
        type: discussionQuestions
        answerable: false
        items:
          - question: 'מין עמל אלפעלה?'
          - question: 'פי חדא תאני פי אלג’מלה?'
      - id: exp1-rule
        type: ruleSummary
        lang: he
        skill: 'החוק: פַעַל'
        rules:
          - text: 'בפַעַל (בניין I) הנושא עושה את הפעולה בעצמו. במשפטים האלה אין אדם נוסף שגורמים לו לעשות משהו.'
            examples:
              - 'אנא בעמל אלפעלה לחאלי.'
      - id: mini1-title
        type: heading
        lang: he
        level: 4
        text: 'מיני תרגול 1'
      - id: mini1
        type: classActivity
        lang: he
        title: 'מיני תרגול: פַעַל'
        minutes: 5
        steps:
          - 'יצירה: כל תלמיד אומר 2–3 משפטים בפַעַל (ראו דוגמאות).'
          - 'הרחבה בזוגות: בן הזוג שואל ליש? אימתי? כיף?, והתלמיד מרחיב.'
      - id: mini1-examples
        type: examples
        items:
          - { text: 'אנא בכתב כל יום', gloss: 'אני כותב כל יום' }
          - { text: 'אנא בפהם דרוס', gloss: 'אני מבין שיעורים' }
          - { text: 'אנא בפתח אלבאב', gloss: 'אני פותח את הדלת' }

      # ── explanation 2: Form II ──
      - id: exp2-title
        type: heading
        lang: he
        level: 3
        text: 'הסבר דידקטי 2 – פַעַּל (בניין II)'
      - id: exp2
        type: classActivity
        lang: he
        title: 'פַעַּל: אני גורם למישהו אחר לעשות'
        skills: [משמעות – פַעַל או פַעַּל?]
        minutes: 10
        steps:
          - 'מחברים למה שהתלמידים כבר ראו בסבב ההיכרות ובשאלות ההכנה (עלמכ, פהמכ).'
          - 'חשיפה: המורה כותב על הלוח את המשפטים שלמטה.'
          - 'שאלות מנחות: נותנים לתלמידים לזהות את ההבדל לפני שמסכמים.'
          - 'ניסוח החוק – על ידי התלמידים. מדגישים את הרעיון: ״יש עוד מישהו בפעולה״ – אחד גורם, אחד מבצע.'
      - id: exp2-board
        type: examples
        items:
          - {
              text: 'אנא פההמת אלתלאמיזה אלדרס',
              gloss: 'הסברתי לתלמידים את השיעור (גרמתי להם להבין)',
            }
          - { text: 'אנא דררסת אלתלאמיזה', gloss: 'לימדתי את התלמידים' }
          - { text: "אנא ח'לית אלולאד יכתבו רסאלה", gloss: 'גרמתי לילדים לכתוב מכתב' }
      - id: exp2-questions
        type: discussionQuestions
        answerable: false
        items:
          - question: 'פי כמה ואחד פי אלג’מלה?'
          - question: 'מין ביעמל אלפעלה בפועל?'
          - question: 'מין אלי ביעטי הוראות או ביסאעד?'
          - question: 'הל פי השפעה על חדא תאני?'
      - id: exp2-rule
        type: ruleSummary
        lang: he
        skill: 'החוק: פַעַּל'
        rules:
          - text: 'בפַעַּל (בניין II) האות האמצעית של השורש מוכפלת: פהם → פההם, דרס → דררס.'
          - text: '**בחלק מהפעלים** פַעַּל פירושו ״לגרום למישהו אחר לעשות״: יש גורם (אני) ויש מבצע (האדם השני), ולכן האדם השני חייב להופיע במשפט.'
            examples:
              - 'אנא בפהם אלדרס – אני מבין את השיעור.'
              - 'אנא בפההם סחבי אלדרס – אני מסביר לחבר שלי את השיעור (גורם לו להבין).'
              - 'אנא בדרס – אני לומד. / אנא בדררס תלאמיזה – אני מלמד תלמידים.'
          - text: '**זה לא חוק לכל הפעלים.** יש פעלים שבהם פַעַּל מוסיף חיזוק או חזרה ולא ״גרימה״ (למשל פתתח – פתח הרבה / שוב ושוב). כשרוצים לומר ״אני גורם למישהו לעשות״ ואין צורה בטוחה, אומרים ח׳לי + פועל.'
            examples:
              - "אנא בח'לי חדא תאני יעמל אלפעלה."
              - "אנא בח'לי סחבי יכתב."
      - id: mini2-title
        type: heading
        lang: he
        level: 4
        text: 'מיני תרגול 2'
      - id: mini2
        type: classActivity
        lang: he
        title: 'מיני תרגול: פַעַּל'
        minutes: 5
        steps:
          - 'יצירה: כל תלמיד אומר 2–3 משפטים שבהם הוא גורם למישהו אחר לעשות (ראו דוגמאות).'
          - 'הרחבה בזוגות: בן הזוג שואל ליש? למין? כיף?, והתלמיד מרחיב.'
      - id: mini2-examples
        type: examples
        items:
          - { text: 'אנא בפההם סחבי', gloss: 'אני מסביר לחבר שלי' }
          - { text: 'אנא בדררס תלאמיזה', gloss: 'אני מלמד תלמידים' }
          - { text: "אנא בח'לי אלולאד יכתבו", gloss: 'אני גורם לילדים לכתוב' }

      # ── activities ──
      - id: activities-title
        type: heading
        lang: he
        level: 3
        text: פעילויות
      - id: act1
        type: classActivity
        lang: he
        title: 'פעילות 1: אני עושה ואני גורם'
        skills: [משמעות – פַעַל או פַעַּל?, שימוש – לגרום למישהו לעשות, ולהסביר]
        minutes: 15
        steps:
          - 'מטרה: הבחנה ושימוש בין פַעַל לפַעַּל דרך השוואה והסבר. מחלקים לזוגות או לקבוצות של 2–3 (Breakout Rooms). כל תלמיד חייב להשתמש גם בפַעַל וגם בפַעַּל, ולהסביר את ההבדל – לא רק להגיד משפטים.'
          - 'פתיחה (כל הכיתה, 4 דקות): המורה שואל את שאלות הפתיחה ודורש תשובות מורחבות. כל תשובה = לפחות 2–3 משפטים; תלמיד אחר חייב לשאול שאלה נוספת.'
          - 'הכנה אישית (3 דקות): כל תלמיד כותב 3 זוגות משפטים – משפט בפַעַל, ואותו רעיון בפַעַּל (עם אדם נוסף).'
          - 'עבודה בזוגות (6 דקות): כל תלמיד מציג את 3 הזוגות שלו. אחרי כל זוג, בן הזוג חייב להסביר את ההבדל ולשאול לפחות 2 שאלות (שאלות ההכוונה). לפחות 6–8 משפטים לכל תלמיד, פַעַּל לפחות 3 פעמים, ודוגמה אמיתית אחת לפחות.'
          - 'אתגר (2 דקות): המורה נותן משפט בפַעַל, והתלמידים הופכים אותו למשפט שבו הם גורמים למישהו אחר לעשות.'
          - 'שיתוף (כל הכיתה, 2 דקות): בוחרים 2 תלמידים. כל אחד אומר זוג משפטים ומסביר את ההבדל.'
      - id: act1-open-title
        type: heading
        lang: he
        level: 4
        text: שאלות פתיחה
      - id: act1-open
        type: discussionQuestions
        items:
          - question: 'שו בתעמל כל יום?'
          - question: 'שו בתתעלם הלפטרה?'
          - question: 'שו פהמתו לחאלכ?'
          - question: 'שו אלשי אלסעב?'
          - question: 'מין עלמכ האדא אשי?'
          - question: 'הל אנת בתעלם חדא שי?'
          - question: 'הל ח’לית חדא יפהם אשי?'
      - id: act1-frame
        type: sentenceFrame
        lang: he
        prompt: 'תבנית: משפט בפַעַל, ואותו רעיון עם אדם נוסף.'
        frame: |-
          אנא ב___ ___
          אנא ב___ ___ (עם אדם נוסף)
        example: |-
          אנא בפהם אלדרס – אנא בפההם סחבי אלדרס
          אנא בכתב כל יום – אנא בח'לי סחבי יכתב
      - id: act1-guide-title
        type: heading
        lang: he
        level: 4
        text: שאלות הכוונה
      - id: act1-guide
        type: discussionQuestions
        answerable: false
        items:
          - question: 'שו אלפרק בין אלג’מלתין?'
          - question: 'מין ביעמל אלפעלה פי כל ג’מלה?'
          - question: 'פי חדא תאני?'
          - question: 'ליש אסתכ’דמת האדא אלפעל?'
      - id: act1-challenge
        type: examples
        items:
          - { text: 'אנא כתבּת רסאלה 👈 ?' }
          - { text: 'אנא פהמת אלדרס 👈 ?' }
