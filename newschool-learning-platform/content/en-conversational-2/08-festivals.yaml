vocabulary:
  - slug: festivals
    title: Festivals
    items: *festivals-words

activities:
  - slug: festivals-imperative
    title: "Imperative: Wear… Don't forget…"
    minutes: 8
    items:
      - id: wear
        type: multipleChoice
        prompt: ___ comfortable shoes to walk all day!
        options:
          - { text: Wear, correct: true }
          - {
              text: Wears,
              feedback: 'The imperative uses the base form of the verb, with no *-s*: *Wear…!*',
            }
          - {
              text: Wearing,
              feedback: 'The imperative uses the base form of the verb, not *-ing*: *Wear…!*',
            }
      - id: dont-touch
        type: multipleChoice
        prompt: ___ touch that!
        options:
          - { text: "Don't", correct: true }
          - {
              text: Not,
              feedback: "The negative imperative is *Don't / Do not* + base verb: *Don't touch that!*",
            }
          - {
              text: "Doesn't",
              feedback: "The imperative always uses *Don't* (or *Do not*), never *Doesn't*.",
            }
      - id: no-subject
        type: trueFalse
        prompt: 'In the imperative, we usually say the subject *you*: *You close the door.*'
        answer: false
        feedback:
          correct: Right! The subject *you* is understood, so we just say *Close the door.*
          incorrect: "In the imperative, we usually don't say *you*. We say *Close the door.*"
      - id: stay-hydrated
        type: fillBlank
        prompt: Choose the right word.
        text: ___ hydrated! It can get very hot during the festival.
        blanks: [[Stay]]
        wordBank: [Stay, Stays, Staying]
      - id: uses
        type: matching
        prompt: Match each sentence with its use.
        pairs:
          - [Take a seat., A command]
          - [Please pass the salt., A polite request]
          - [Try this new dish., Advice or a suggestion]
          - [Do not speak during the test., A negative command]
      - id: dont-forget
        type: fillBlank
        prompt: Tell your friend not to forget the ticket.
        text: ___ forget your ticket!
        blanks: [["Don't", Do not]]
      - id: polite
        type: multipleChoice
        prompt: Which one is the most polite?
        options:
          - { text: Please sit down., correct: true }
          - {
              text: Sit down.,
              feedback: 'This is correct, but it is a command. *Please* makes it more polite.',
            }
          - {
              text: You sit down.,
              feedback: "In the imperative, we don't say *you*. Add *please* to be polite: *Please sit down.*",
            }
      - id: book-tickets
        type: reorderSentence
        prompt: Put the words in order.
        sentence: Book your tickets in advance.

  - slug: festivals-narratives
    title: 'Past, present and future'
    minutes: 8
    items:
      - id: had
        type: multipleChoice
        prompt: Last year, the festival ___ a large parade.
        options:
          - { text: had, correct: true }
          - { text: has, feedback: '*Last year* is the past. Use the past simple: *had*.' }
          - {
              text: will have,
              feedback: '*Will have* is the future. With *last year*, use the past: *had*.',
            }
      - id: preparing
        type: multipleChoice
        prompt: Right now, people ___ for the festival.
        options:
          - { text: are preparing, correct: true }
          - {
              text: prepared,
              feedback: '*Prepared* is the past. *Right now* needs the present: *are preparing*.',
            }
          - {
              text: will prepare,
              feedback: '*Will prepare* is the future. *Right now* needs the present: *are preparing*.',
            }
      - id: will-be
        type: multipleChoice
        prompt: Next year, there ___ even more performances.
        options:
          - { text: will be, correct: true }
          - {
              text: were,
              feedback: '*Were* is the past. *Next year* is the future: *there will be*.',
            }
          - {
              text: are,
              feedback: '*Are* is the present. *Next year* is the future: *there will be*.',
            }
      - id: tenses
        type: matching
        prompt: Match each sentence with its tense.
        pairs:
          - [Last year I danced at the carnival., Past simple]
          - ['Right now, people are wearing costumes.', Present continuous (now)]
          - [Every year I go to this festival., Present simple (every year)]
          - [Next year I will bring my friends., Future with *will*]
          - ["Next Purim I'm going to dress up as a witch.", Future with *going to*]
      - id: danced
        type: fillBlank
        prompt: Write the verb *dance* in the right tense.
        text: Last year, I ___ at the carnival.
        blanks: [[danced]]
      - id: will-bring
        type: fillBlank
        prompt: Write the verb *bring* in the future.
        text: Next year, I ___ my friends to the festival.
        blanks: [[will bring, am going to bring]]
      - id: order
        type: trueFalse
        prompt: 'To tell a story with multiple narratives, you can start with the present, then talk about the past, and finish with the future.'
        answer: true
        feedback:
          correct: 'Right! Present (*Right now…*), past (*Last year…*), future (*Next year…*).'
          incorrect: 'It is true: set the scene with the present, look back at the past, then look ahead to the future.'
      - id: celebrating
        type: reorderSentence
        prompt: Put the words in order.
        sentence: Right now, people are celebrating.
