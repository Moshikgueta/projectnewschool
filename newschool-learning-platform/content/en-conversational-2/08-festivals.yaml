# Cycle "Festivals", converted from the Conversational English level 2 digital
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-conversational-2
slug: festivals
title: Festivals
goal: Give advice and invitations with the imperative, and talk about festivals in the past, present and future.
position: 8
status: in_review

review:
  - >-
    The two workbook exercises ("Imperative" and "Past, present and future") are NEW:
    the notebook has no self-study exercises. They were written from the cycle's
    summary rules, the activity examples and the vocabulary. Please check level,
    wording and every right answer before students see them.
  - >-
    Activity 1 table, facts: "Wearing orange to honor the queen" (Amsterdam) is out of
    date: since 2014 it is King's Day (Koningsdag), the king's birthday. Changed to
    "Wearing orange on King's Day (Queen's Day until 2013)"; "King" was added to the
    vocabulary next to "Queen". "Wearing masks to hide from an evil deity" (USA,
    Halloween) is simplified history: the old Celtic custom was to hide from spirits.
    Changed to "from evil spirits". "Being dressed up on the street the whole week"
    (Israel, Purim) is kept, but Purim is not a full week in most places. Please
    check both.
  - >-
    Activity 1 table: the column says "Country" but Rio de Janeiro, Amsterdam,
    Catalonia and "Apache and other indigenous tribes" are not countries. The column
    is now "Place". "Carnaval" (Portuguese) → "Carnival"; "Throwing colored powder on
    the people" → "Throwing colored powder at people". The answer key (the source's
    "table in the correct order") is in a teacher note.
  - >-
    Activity 3, Oktoberfest example: "Visit us from September 21st to October 6th" are
    the 2024 dates, and they change every year. Changed to "from late September to
    early October". Please confirm.
  - >-
    Corrections: warm-up "Which music did you listen to" → "What music did you listen
    to"; Activity 4 "Based on which festivals that you gone to in the past? (answer in
    the past term)" → "Which festivals that you went to in the past inspired you?
    (Answer in the past tense.)"; summary "Friendly notes for a happy speaking" →
    "Friendly tips for speaking"; "Politer than a command" → "More polite than a
    command"; Activity 4 teacher instruction "Breakout rooms in Zoom and in the
    frontal one next to another" rewritten in the teacher note.
  - >-
    Summary, skill 2: the source uses only *will* for the future, but the
    introduction round and the warm-up use *going to* ("I'm going to dress up as a
    witch"). One rule example with *going to* was added, and the workbook accepts both
    in one item. Please confirm.
  - >-
    Vocabulary glosses changed: "Holiday → חופשה" → "חג / חופשה" (in this cycle a
    holiday is a celebration); "Dress up → להתלבש" → "להתחפש / להתלבש חגיגי". Please
    confirm.
  - >-
    The homework in the source is two written tasks with no Mori message. Each task
    is now a Mori message with the same instructions and example.
  - >-
    Times: Activity 1 research "10 minutes" is kept; no other times are given in the
    source. The Quizlet link is kept without its "?new" parameter. Frames were added
    to the warm-up and Activity 2 questions (the source has none). The "Student
    1/2/3" lines are replaced by the answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: festivals-class
    title: 'Class: Festivals'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Festivals
      - id: skills
        type: cycleOverview
        skills:
          - name: Imperative
            description: "*Wear comfortable shoes! Don't forget your ticket!*"
          - name: Multiple narratives
            description: 'Past, present and future: *Last year I danced. Right now people are celebrating. Next year I will go again.*'
      - id: quizlet
        type: externalLink
        label: Festival words on Quizlet
        url: https://quizlet.com/il/998306111/festivals-conversational-english-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I am ___. For the next Purim / Halloween, I'm going to dress up as a ___.
        example: I am Florencia. For the next Purim, I'm going to dress up as a witch.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: What festivals did you go to?
            frame: I went to ___.
          - question: What did you dress up as last year? Or what did you wear to your last festival?
            frame: Last year, I dressed up as ___. / At my last festival, I wore ___.
          - question: Is there a festival that you go to every year? Which one, and why?
            frame: Every year, I go to ___ because ___.
          - question: What festivals are you going to go to in the future?
            frame: I'm going to go to ___.
          - question: What music did you listen to at the last festival? Are you going to listen to the same music at your next festival?
            frame: At the last festival, I listened to ___. At my next festival, I'm going to ___.
          - question: What do you need to think about when you go to a festival? Answer in the imperative.
            frame: Bring a bottle of water with you. / Don't ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      - id: act1
        type: classActivity
        title: 'Activity 1: If you go to this festival…'
        skills: [Imperative]
        steps:
          - Look at the table. The traditions and the places are mixed up.
          - Make at least 3 correct matches.
          - In two groups, choose one place and its tradition. Research it for 10 minutes.
          - Write 5 things people have to do when they go to this festival.
          - Share your list with the class. Use imperatives.
        example: |-
          **Place:** Rio de Janeiro. **Tradition:** Carnival.
          5 things you have to do at Carnival in Rio de Janeiro:
          1. **Wear colorful clothes** to blend in with the festive atmosphere!
          2. **Dance samba** in the streets and join the parades!
          3. **Book your tickets in advance** for the Sambadrome to watch the parade!
          4. **Stay hydrated**, because it can get very hot during the festivities!
          5. **Take part in street parties** (*blocos*) with locals and other tourists!
      - id: act1-table
        type: table
        caption: Match the traditions and the places
        header: [Tradition, Place]
        rows:
          - [Carnival, 'Venice, Italy']
          - [Using masks to celebrate without social status distinctions, India]
          - [Celebrating with the dead, United Kingdom]
          - [Throwing colored powder at people, Mexico]
          - [Wearing masks to hide from evil spirits, Rio de Janeiro]
          - [Dressing as Vikings, Israel]
          - [Costumes as a rite of passage to adulthood, Amsterdam]
          - [Dressing as the devil and scaring festival-goers, Apache and other indigenous tribes]
          - ["Wearing orange on King's Day (Queen's Day until 2013)", USA]
          - [Being dressed up on the street the whole week of the festival, Catalonia]
      - id: act1-list
        type: discussionQuestions
        title: 5 things you have to do at this festival
        items:
          - question: '1. ___!'
          - question: '2. ___!'
          - question: '3. ___!'
          - question: '4. ___!'
          - question: '5. ___!'
      - id: act2
        type: classActivity
        title: 'Activity 2: This is my special holiday'
        skills: [Multiple narratives]
        steps:
          - Think of holidays you celebrate or know about.
          - Work in pairs. Interview your partner. Choose one question from each section below, and take notes.
          - Share one answer about your partner with the group.
      - id: act2-general
        type: discussionQuestions
        title: General questions
        items:
          - question: What is your favorite holiday, and why?
            frame: My favorite holiday is ___ because ___.
          - question: When and where is this holiday celebrated?
            frame: It is celebrated in ___ in ___.
          - question: Is this holiday celebrated in other countries? If so, how is it different?
            frame: Yes, it is celebrated in ___. There, people ___.
      - id: act2-traditions
        type: discussionQuestions
        title: Traditions and customs
        items:
          - question: What are some typical traditions or rituals for this holiday?
            frame: On this holiday, people usually ___.
          - question: Do you or your family have any special traditions for this holiday?
            frame: In my family, we always ___.
          - question: Is there any special food or drink for this celebration?
            frame: We eat / drink ___.
      - id: act2-personal
        type: discussionQuestions
        title: Personal experience
        items:
          - question: What is your best memory of this holiday?
            frame: My best memory is when I ___.
          - question: How do you usually celebrate this holiday? (With family, friends, at home, at public events…)
            frame: I usually celebrate with ___ at ___.
          - question: Have your holiday traditions changed over the years? If so, how?
            frame: In the past, we ___. Now, we ___.
      - id: act2-culture
        type: discussionQuestions
        title: Cultural comparison
        items:
          - question: Have you ever celebrated this holiday in another country? How was it different?
            frame: I celebrated it in ___. It was different because ___.
          - question: Are there any holidays from other cultures that you would like to celebrate? Why?
            frame: I would like to celebrate ___ because ___.
          - question: What is a holiday from another country that you find interesting?
            frame: I find ___ interesting because ___.
      - id: act2-opinions
        type: discussionQuestions
        title: Reflection and opinions
        items:
          - question: Do you think holidays are important? Why or why not?
            frame: I think holidays are / aren't important because ___.
          - question: Do you prefer traditional celebrations, or do you like to celebrate holidays in a modern way?
            frame: I prefer ___ because ___.
      - id: act3
        type: classActivity
        title: 'Activity 3: Create a (nice) imperative invitation!'
        skills: [Imperative]
        steps:
          - 'Work alone or in pairs. Choose a famous festival, for example: Diwali (Festival of Lights), Oktoberfest (Germany), Carnival (Brazil), Chinese New Year or Thanksgiving (USA).'
          - Find some basic details about your festival if you need them.
          - Write the text of your invitation. Use imperatives to show the exciting activities and invite people to come.
          - Present your invitation to the class and read your imperatives aloud.
          - Classmates say what they liked and how creative and exciting the invitation is.
        example: |-
          **You're invited to Oktoberfest!**
          *Celebrate the world's biggest beer festival in Munich!*
          *Visit us in Munich, Germany, from late September to early October!*
          *Dress in your traditional Bavarian outfit and join the fun!*
          *Taste authentic German beer and delicious pretzels!*
          *Sing along to live folk music and dance the night away!*
          *Ride the Ferris wheel and enjoy exciting carnival games!*
          *Bring your friends and family to experience this unforgettable event!*
      - id: act3-invitation
        type: discussionQuestions
        title: My invitation
        items:
          - question: "Title: You're invited to ___!"
          - question: 'Opening line: ___!'
          - question: 'Details: Visit us ___! Dress ___! Taste ___! Bring ___!'
      - id: act4
        type: classActivity
        title: 'Activity 4: My own festival'
        skills: [Multiple narratives]
        steps:
          - Now it's your turn to create your own festival!
          - Work in groups. Complete the details below.
          - Present your festival to the class.
      - id: act4-details
        type: discussionQuestions
        title: Our festival
        items:
          - question: 'Name of the festival:'
          - question: 'Date of the festival:'
          - question: 'Place of the festival:'
          - question: How long is this festival?
          - question: 'Dress code:'
          - question: What music will we listen to?
            frame: We will listen to ___.
          - question: Which artists will take part in the festival?
            frame: ___ will take part in the festival.
          - question: What is going to happen at this festival?
            frame: At this festival, people are going to ___.
          - question: What inspired you to make this festival? Which festivals that you went to in the past inspired you? (Answer in the past tense.)
            frame: Last year, I went to ___. I loved ___, so ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: **Imperative** (Activities 1 and 3) and **Multiple
          narratives**: past, present and future (Activities 2 and 4). Recommended
          combinations: Activities 1 and 4, or Activities 2 and 3.
      - id: n-intro
        anchor: intro
        text: Give your own example first, then go around the group.
      - id: n-warmup
        anchor: warmup
        text: Ask each student at least two questions. Answers typed here are visible to you below each question.
      - id: n-act1
        anchor: act1
        minutes: 10
        text: >-
          Show the mixed-up table. After the matching, groups have 10 minutes of
          research. Answer key: Throwing colored powder at people → India (Holi);
          Celebrating with the dead → Mexico (Day of the Dead); Wearing masks to hide
          from evil spirits → USA (Halloween); Dressing as the devil and scaring
          festival-goers → Catalonia (correfoc); Being dressed up on the street the whole
          week → Israel (Purim); Costumes as a rite of passage to adulthood → Apache and
          other indigenous tribes; Carnival → Rio de Janeiro; Using masks to celebrate
          without social status distinctions → Venice, Italy; Dressing as Vikings →
          United Kingdom (Up Helly Aa, Shetland); Wearing orange on King's Day →
          Amsterdam.
      - id: n-act2
        anchor: act2
        text: >-
          Encourage students to brainstorm holidays first. Each student picks one
          question from each section, so they use the past (best memory), the present
          (traditions) and the future or *would like to*.
      - id: n-act3
        anchor: act3
        text: Encourage students to research basic details about their festival if needed. Check that every line starts with a base verb.
      - id: n-act4
        anchor: act4
        text: >-
          Online, use breakout rooms; in the classroom, group students who sit next to
          each other. Make sure the last question is answered in the past tense, and the
          plans in the future.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: festivals-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-imperative
        type: ruleSummary
        skill: Imperative
        rules:
          - text: '**Affirmative imperative** (a command or a request): the verb in the base form.'
            examples: [Close the door., Listen carefully.]
          - text: "**Negative imperative** (telling someone not to do something): *Do not / Don't* + base verb."
            examples: ["Don't touch that.", Do not speak during the test.]
          - text: '**When to use it:** to give commands, to make requests, and to give advice or suggestions.'
            examples:
              - 'Command: *Take a seat.*'
              - 'Request: *Please pass the salt.* (more polite than a command, often with *please*)'
              - 'Advice: *Try this new dish.*'
          - text: "**Friendly tips for speaking:** you usually don't say the subject (*you*). It is understood."
            examples: ['Come here. (= *you* come here)']
          - text: '*Please* or a soft tone makes the imperative more polite.'
            examples: [Please sit down.]
      - id: rules-narratives
        type: ruleSummary
        skill: Multiple narratives
        rules:
          - text: '**Set the scene with the present:** start with what is happening now.'
            examples: ['Right now, people **are preparing** for the festival.']
          - text: '**Look back at the past:** then talk about what already happened. Use the past simple.'
            examples: ['Last year, the festival **had** a large parade.']
          - text: '**Look ahead to the future:** finish with what will happen. Use *will* for predictions, or *going to* for plans.'
            examples:
              - 'Next year, there **will be** even more performances.'
              - "For the next Purim, **I'm going to dress up** as a witch."
      - id: tenses-table
        type: table
        caption: Time words and tenses
        header: [Time, Time words, Example]
        rows:
          - [Past, 'last year, yesterday, last time', Last year I danced at the carnival.]
          - [Present, 'right now, now, every year', 'Right now, people are wearing costumes.']
          - [Future, 'next year, next time, in the future', Next year I will bring my friends.]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both skills with the group and ask for one new example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: festivals-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message, fill in the blanks and send it. Mori will check your sentences.
      - id: mori-imperative
        type: aiTutorPrompt
        title: 'Task 1: Imperative practice'
        intro: 'Imagine you are going to a festival. Write five imperative sentences with advice for someone who is going to this festival: what to do, what to avoid, and how to enjoy it. Example: *Wear comfortable shoes to walk all day!*'
        message: |-
          Hi Mori! I want to practise the imperative. Here is my advice for someone who is going to ___ (festival):
          1. ___
          2. ___
          3. ___
          4. ___
          5. ___
          Please correct my sentences and tell me if they sound polite.
      - id: mori-tenses
        type: aiTutorPrompt
        title: 'Task 2: Past, present and future'
        intro: 'Choose a festival you went to in the past. Write one sentence in the past (what you did last time), one in the present (what people are doing there right now) and one in the future (what will happen next year). Example: *Last year, I danced at the carnival. Right now, people are wearing costumes and celebrating. Next year, I will bring my friends to the festival.*'
        message: |-
          Hi Mori! I want to practise the past, the present and the future. Here are my sentences about ___ (festival):
          Past: ___
          Present: ___
          Future: ___
          Please correct my sentences and ask me one question about the festival.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: festivals-practice
    book: workbook
    title: 'Practice: Festivals'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. Each answer is checked right away, and you can try again.
      - id: ex-imperative
        type: activity
        activity: festivals-imperative
      - id: ex-narratives
        type: activity
        activity: festivals-narratives

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: festivals-vocabulary
    title: Vocabulary
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Festival words
        glossLang: he
        link: https://quizlet.com/il/998306111/festivals-conversational-english-flash-cards/
        items: &festivals-words
          - { term: Festival, gloss: פסטיבל }
          - { term: Costume, gloss: תחפושת }
          - { term: Dress up, gloss: להתחפש / להתלבש חגיגי }
          - { term: Celebrate, gloss: לחגוג }
          - { term: Music, gloss: מוזיקה }
          - { term: Dance, gloss: לרקוד }
          - { term: Custom, gloss: מנהג }
          - { term: Tradition, gloss: מסורת }
          - { term: Mask, gloss: מסכה }
          - { term: Colors, gloss: צבעים }
          - { term: Parade, gloss: מצעד }
          - { term: Street party, gloss: מסיבת רחוב }
          - { term: Queen, gloss: מלכה }
          - { term: King, gloss: מלך }
          - { term: Viking, gloss: ויקינג }
          - { term: Devil, gloss: שטן }
          - { term: Cultural, gloss: תרבותי }
          - { term: Food, gloss: אוכל }
          - { term: Event, gloss: אירוע }
          - { term: Music festival, gloss: פסטיבל מוזיקה }
          - { term: Holiday, gloss: חג / חופשה }
          - { term: Preparation, gloss: הכנה }
          - { term: Ticket, gloss: כרטיס }
          - { term: Weather, gloss: מזג אוויר }
          - { term: Social status, gloss: מעמד חברתי }
