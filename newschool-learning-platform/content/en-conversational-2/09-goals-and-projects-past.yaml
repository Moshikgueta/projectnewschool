    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. Each answer is checked right away, and you can try again.
      - id: ex-past-simple
        type: activity
        activity: goals-and-projects-past-past-simple
      - id: ex-time
        type: activity
