vocabulary:
  - slug: goals-and-projects-past
    title: 'Goals and projects: past'
    items: *goals-and-projects-past-words

activities:
  - slug: goals-and-projects-past-past-simple
    title: 'Past simple: worked, made, did'
    minutes: 8
    items:
      - id: base-past
        type: matching
        prompt: Match each verb with its past simple form.
        pairs:
          - [work, worked]
          - [watch, watched]
          - [go, went]
          - [make, made]
          - [do, did]
      - id: worked
        type: multipleChoice
        prompt: She ___ on her goal yesterday.
        options:
          - { text: worked, correct: true }
          - {
              text: works,
              feedback: '*Works* is the present. With *yesterday*, use the past simple: *worked*.',
            }
          - {
              text: work,
              feedback: '*Work* is the base form. With *yesterday*, add *-ed*: *worked*.',
            }
      - id: did-you-watch
        type: multipleChoice
        prompt: Which question is in the past simple?
        options:
          - { text: Did you watch the movie?, correct: true }
          - {
              text: Did you watched the movie?,
              feedback: 'After *did*, the verb goes back to the base form: *Did you watch…?*',
            }
          - {
              text: Do you watch movies?,
              feedback: '*Do* is for the present. For the past, use *Did* + subject + base verb.',
            }
      - id: didnt-give-up
        type: fillBlank
        prompt: Make it negative with *give up*.
        text: I ___ when it was hard.
        blanks: [["didn't give up", did not give up]]
      - id: no-ed
        type: trueFalse
        prompt: "This sentence is correct: *I didn't watched it last weekend.*"
        answer: false
        feedback:
          correct: "Right! After *didn't*, use the base form: *I didn't watch it.*"
          incorrect: "After *didn't*, the verb goes back to the base form, with no *-ed*: *I didn't watch it.*"
      - id: made-did
        type: fillBlank
        prompt: Write the past simple of *make* and *do*.
        text: He ___ a plan last month. They ___ the work yesterday.
        blanks: [[made], [did]]
      - id: felt
        type: multipleChoice
        prompt: I ___ proud when I saw my progress.
        options:
          - { text: felt, correct: true }
          - {
              text: feeled,
              feedback: '*Feel* is an irregular verb. Its past form is *felt*, not *feeled*.',
            }
          - {
              text: feel,
              feedback: '*Feel* is the present. The sentence is about the past (*saw*), so use *felt*.',
            }
      - id: achieved
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I achieved my goal last month.

  - slug: goals-and-projects-past-time-expressions
    title: 'Time expressions: yesterday, last week, then'
    minutes: 8
    items:
      - id: yesterday
        type: multipleChoice
        prompt: I watched a movie ___.
        options:
          - { text: yesterday, correct: true }
          - {
              text: tomorrow,
              feedback: '*Tomorrow* is the future. *Watched* is the past, so use a past time expression: *yesterday*.',
            }
          - {
              text: next week,
              feedback: '*Next week* is the future. *Watched* is the past: *yesterday*, *last week*.',
            }
      - id: last-night
        type: multipleChoice
        prompt: She studied ___ night.
        options:
          - { text: last, correct: true }
          - {
              text: next,
              feedback: '*Next night* is not correct here: *studied* is the past. We say *last night*.',
            }
          - { text: yesterday, feedback: 'In English we say *last night*, not *yesterday night*.' }
      - id: timeline
        type: fillBlank
        prompt: Complete the timeline with *First*, *Then* and *Finally*.
        text: ___, I signed up for English classes. ___, I practiced with Mori every week. After that, I watched Netflix in English. ___, I passed my speaking test.
        blanks: [[First], [Then], [Finally]]
        wordBank: [First, Then, Finally]
      - id: meanings
        type: matching
        prompt: Match each time expression with its meaning.
        pairs:
          - [yesterday, the day before today]
          - [last week, the week before this week]
          - [last month, the month before this month]
          - [when I was a child, in the years when I was young]
          - [finally, at the end]
      - id: past-markers
        type: trueFalse
        prompt: '*Yesterday* and *last week* tell us that the action happened in the past.'
        answer: true
        feedback:
          correct: Right! Use them with the past simple, for example *I practiced last week.*
          incorrect: 'They are past time expressions: *I practiced yesterday. I studied last week.*'
      - id: after-achieved
        type: multipleChoice
        prompt: ___ I achieved my goal, I celebrated with my family.
        options:
          - { text: After, correct: true }
          - {
              text: Then,
              feedback: '*Then* starts the next step: *I achieved my goal. Then, I celebrated.* To connect two actions in one sentence, use *After*.',
            }
          - {
              text: Last week,
              feedback: '*Last week* says when, but it cannot connect two actions. Use *After*: *After I achieved my goal, I celebrated.*',
            }
      - id: when-child
        type: fillBlank
        prompt: Choose the right word.
        text: ___ I was a child, I played football every day.
        blanks: [[When, While]]
        wordBank: [When, Then, Last]
      - id: last-week-order
        type: reorderSentence
        prompt: Put the words in order.
        sentence: Last week, I practiced every day.
