vocabulary:
  - slug: special-occasions-past
    title: Special Occasions - Past
    items: *special-occasions-past-words

activities:
  - slug: special-occasions-past-sentences
    title: "Simple past sentences: celebrated, went, didn't go"
    minutes: 8
    items:
      - id: went-wedding
        type: multipleChoice
        prompt: Last year I ___ to my cousin's wedding.
        options:
          - { text: went, correct: true }
          - {
              text: go,
              feedback: '*Go* is present. With *last year* we use the simple past: *went*.',
            }
          - { text: goed, feedback: '*Go* is irregular. The simple past is *went*, not *goed*.' }
      - id: irregular-match
        type: matching
        prompt: Match each verb with its simple past form.
        pairs:
          - [eat, ate]
          - [give, gave]
          - [see, saw]
          - [sing, sang]
          - [have, had]
      - id: danced-cried
        type: fillBlank
        prompt: Complete with the simple past of *dance* and *cry*.
        text: At the wedding we ___ all night, and my mother ___ because she was so happy.
        blanks: [[danced], [cried]]
      - id: didnt-eat
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: I didn't eat cake., correct: true }
          - {
              text: I didn't ate cake.,
              feedback: "After *didn't* (*did not*) we use the base verb: *didn't eat*.",
            }
          - {
              text: I not ate cake.,
              feedback: "The simple past negative needs *did not (didn't) + base verb*: *I didn't eat cake.*",
            }
      - id: negative-go
        type: fillBlank
        prompt: 'Make the sentence negative: *I went to the party.*'
        text: I ___ to the party.
        blanks: [["didn't go", did not go]]
      - id: ago-tf
        type: trueFalse
        prompt: '*Two years ago I celebrated my graduation* is a correct sentence.'
        answer: true
        feedback:
          correct: Right! *Two years ago* is a past time expression, and *celebrated* is the simple past.
          incorrect: 'It is correct: *two years ago* + simple past (*celebrated*).'
      - id: received-tf
        type: trueFalse
        prompt: '*Receive* is a regular verb. Its simple past is *received*.'
        answer: true
        feedback:
          correct: 'Right! *Receive* is regular. It ends in *-e*, so we add only *-d*: *received*.'
          incorrect: '*Receive* is regular: *receive → received* (verb + *-e* → add *-d*).'
      - id: order-birthday
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I celebrated my birthday at home.

  - slug: special-occasions-past-questions
    title: 'Simple past questions: Did you…? Where did you…?'
    minutes: 8
    items:
      - id: did-you-dance
        type: multipleChoice
        prompt: Which question is correct?
        options:
          - { text: Did you dance at the party?, correct: true }
          - {
              text: Did you danced at the party?,
              feedback: 'After *did* we use the base verb: *Did you dance?*',
            }
          - {
              text: You did dance at the party?,
              feedback: 'In a question, *did* comes before the subject: *Did you dance…?*',
            }
      - id: where-celebrate
        type: fillBlank
        prompt: Complete the question.
        text: Where ___ you ___ your best birthday? — I celebrated it in a restaurant.
        blanks: [[did], [celebrate]]
      - id: gift-receive
        type: multipleChoice
        prompt: What gift ___ on your last birthday?
        options:
          - { text: did you receive, correct: true }
          - {
              text: did you received,
              feedback: 'After *did* the verb stays in the base form: *receive*.',
            }
          - {
              text: you received,
              feedback: 'A wh- question needs *did* before the subject: *What gift did you receive?*',
            }
      - id: short-answers
        type: matching
        prompt: Match each question with its answer.
        pairs:
          - [Where was the party?, It was at my sister's house.]
          - [Who did you celebrate with?, With my family.]
          - [What did you eat?, We ate pizza and cake.]
          - [Did you dance?, 'Yes, I did.']
          - [How many people attended?, About fifty people.]
      - id: was-party
        type: trueFalse
        prompt: '*Where did the party was?* is a correct question.'
        answer: false
        feedback:
          correct: "Right! With *be* we don't use *did*: *Where was the party?*"
          incorrect: "With *be* we don't use *did*. The correct question is *Where was the party?*"
      - id: no-i-didnt
        type: fillBlank
        prompt: Complete the short answer.
        text: Did you go to the wedding? — No, I ___.
        blanks: [["didn't", did not]]
      - id: question-word
        type: multipleChoice
        prompt: 'Answer: *I gave a t-shirt to my best friend.* What is the question?'
        options:
          - { text: What did you give to your best friend?, correct: true }
          - {
              text: Where did you give to your best friend?,
              feedback: '*Where* asks about a place. The answer is a thing (a t-shirt), so we ask *What*.',
            }
          - {
              text: What you gave to your best friend?,
              feedback: 'A wh- question needs *did + subject + base verb*: *What did you give…?*',
            }
      - id: order-weekend
        type: reorderSentence
        prompt: Put the words in order.
        sentence: What did you do last weekend?
