vocabulary:
  - slug: relocation
    title: Relocation
    items: *relocation-words

activities:
  - slug: relocation-future
    title: "Going to and will: I'm going to move, I'll help"
    minutes: 8
    items:
      - id: going-to-plan
        type: multipleChoice
        prompt: I ___ move to Italy next year. I already have a job there.
        options:
          - { text: "'m going to", correct: true }
          - {
              text: going to,
              feedback: "We need *am / is / are* before *going to*: *I'm going to move*.",
            }
          - {
              text: will to,
              feedback: "After *will*, use the base verb without *to*: *I will move*. For a decided plan, *I'm going to move* is best.",
            }
      - id: will-base
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: I will move to Spain., correct: true }
          - {
              text: I will moving to Spain.,
              feedback: 'After *will*, use the base verb: *will move*, not *will moving*.',
            }
          - {
              text: I will to move to Spain.,
              feedback: 'After *will*, there is no *to*: *will move*.',
            }
      - id: offer-now
        type: multipleChoice
        prompt: "A: This box is very heavy! B: Don't worry, I ___ help you."
        options:
          - { text: "'ll", correct: true }
          - {
              text: "'m going to",
              feedback: "B decides to help right now. For a decision you make now, or an offer, use *will*: *I'll help you.*",
            }
          - { text: going, feedback: "This is an offer made now: *I'll help you.*" }
      - id: save-money
        type: fillBlank
        prompt: Complete with *I* + *will* (short or long form).
        text: ___ save money before I move.
        blanks: [["I'll", I will]]
      - id: we-are-going
        type: fillBlank
        prompt: Complete with *am*, *is* or *are*.
        text: We ___ going to find an apartment. My sister ___ going to help us.
        blanks: [[are], [is]]
        wordBank: [am, is, are]
      - id: wont-move
        type: fillBlank
        prompt: Complete with the negative future of *move* (*will* or *going to*).
        text: My brother loves Tel Aviv, so he ___ with us.
        blanks: [["won't move", will not move, "isn't going to move", is not going to move]]
      - id: base-verb
        type: trueFalse
        prompt: "After *going to*, we use the base verb: *I'm going to learn Portuguese*."
        answer: true
        feedback:
          correct: 'Right! *going to* + base verb: *going to learn, going to move, going to find*.'
          incorrect: "It is true: *going to* + base verb, for example *I'm going to learn Portuguese*."
      - id: order-portuguese
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I'm going to learn Portuguese before I go.

  - slug: relocation-socializing
    title: 'Socializing: short, clear questions'
    minutes: 8
    items:
      - id: best-message
        type: multipleChoice
        prompt: You just moved to London. Which message is short, polite and clear?
        options:
          - {
              text: Hi! I just moved to London. Can anyone recommend a good supermarket nearby?,
              correct: true,
            }
          - {
              text: Supermarket?,
              feedback: 'Too short. Say hello, say why you are asking, then ask a full question.',
            }
          - {
              text: 'Hello, my name is Dana, I am 35, I love cooking, my family is in Israel and I need food so I want to know about supermarkets.',
              feedback: 'Too long. Be brief: give only the essential information and ask a direct question.',
            }
      - id: recommend
        type: multipleChoice
        prompt: Can anyone ___ a good restaurant nearby?
        options:
          - { text: recommend, correct: true }
          - {
              text: recommends,
              feedback: 'After *can*, use the base verb: *Can anyone recommend…?*',
            }
          - {
              text: to recommend,
              feedback: 'After *can*, there is no *to*: *Can anyone recommend…?*',
            }
      - id: how-do-you
        type: fillBlank
        prompt: Complete the question.
        text: How ___ you pay for the bus here?
        blanks: [[do, can]]
      - id: whats-best
        type: fillBlank
        prompt: "Complete the question with *What's* or *Where's*."
        text: ___ the best area to live in? ___ the nearest supermarket?
        blanks: [["What's", What is, "Where's", Where is], ["Where's", Where is]]
        wordBank: ["What's", "Where's"]
      - id: question-answer
        type: matching
        prompt: Match each question with a short, clear answer.
        pairs:
          - ["Where's the nearest supermarket?", "It's on the next street."]
          - [How do you pay for the bus?, With a bus pass.]
          - [When will you move?, In July.]
          - [Where can I meet new people?, At the community center.]
      - id: right-group
        type: trueFalse
        prompt: When you need help in a new city, it is better to ask in a local group for that city than in a random group.
        answer: true
        feedback:
          correct: 'Right! Choose the right group to ask: a local group knows the city.'
          incorrect: 'Choose the right group to ask: a local group for your city knows the answer.'
      - id: order-meet
        type: reorderSentence
        prompt: Put the words in order.
        sentence: Where can I meet new people?
      - id: my-message
        type: shortAnswer
        prompt: You just arrived in a new city. Write a short, polite message to a local group and ask for help.
