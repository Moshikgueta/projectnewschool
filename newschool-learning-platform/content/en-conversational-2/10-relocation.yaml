# Cycle "Relocation", converted from the Conversational English (level 2) digital
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-conversational-2
slug: relocation
title: Relocation
goal: Talk about plans to move with going to and will, and ask short, clear questions in a new city.
position: 10
status: in_review

review:
  - >-
    The two workbook exercises ("Going to and will" and "Socializing") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's two
    skills, its summary rules, the activity examples and its vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    Grammar correction: the summary said "Both forms can be used interchangeably.
    Choose the one that feels natural." This is not quite right. The summary now says:
    *going to* is for plans we already decided (I'm going to move to Italy next year);
    *will* is for decisions we make now, offers and promises (I'll help you!) and for
    predictions and opinions (I think I'll be happy there). For predictions both are
    often possible. The summary also calls *will* "future simple" and *going to*
    "going to" (the source title "Future Simple / Going to" mixed them). Please confirm.
  - >-
    Added to the summary (the source gives only examples): how to form both futures
    (am / is / are + going to + base verb; will / 'll + base verb; won't = will not),
    with a table. The workbook uses it.
  - >-
    The source's skill line said "CEFR Level A2-B1 transition, Duration 90 minutes";
    this is kept as a teacher note. The empty "Date" and "Participants" headings were
    left out.
  - >-
    Activity 2 says "10-step plan", but the example shows only four lines numbered 1–4
    (1 = today, 4 = the final goal). They are shown as steps 1, 2, 3 and 10.
  - >-
    Activity 3 mentions a Facebook group or community forum. No link is given, and
    Facebook is not on the link allow-list, so it stays an instruction in the text.
  - >-
    Homework: the five "Prompt for Mori" parts are turned into full Mori messages with
    the notebook's questions inside (Part 1 keeps the follow-up questions in brackets).
    Part 5 ("as if you lived in my city") was reworded to be clearer. Please confirm.
  - >-
    Vocabulary: the source table repeats its first six rows (Relocation … Landlord) at
    the end; the repeat was removed. Gloss changes: "Move" לעבור → "לעבור (דירה)";
    "Utilities" חשבונות שירות → "חשבונות (חשמל, מים, גז)"; "Commute" נסיעה יומיומית →
    "נסיעה יומית לעבודה"; "Explore" לחקור → "לחקור / לגלות"; "Settle in" (was "Settle
    In") and other terms are in sentence case. Please confirm.
  - >-
    Left out: the footer "Homework submission: Students send their tasks to the New
    School Bot… WhatsApp 050-762-6695" (platform-specific, not course material). The
    "Student 1/2/3" lines are replaced by the optional answer boxes (decision C2). The
    Quizlet link is kept without its "?new" parameter. Typographic fixes only:
    "We’re Moving\!" → "We're moving!", stray asterisks and markdown removed.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: relocation-class
    title: 'Class: Relocation'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Relocation
      - id: skills
        type: cycleOverview
        skills:
          - name: Going to and will
            description: "Plans and predictions: *I'm going to move to Italy. I'll find a new job.*"
          - name: Socializing
            description: "Asking and answering short, practical questions in a new city: *Where's the best restaurant?*"
      - id: quizlet
        type: externalLink
        label: Relocation on Quizlet
        url: https://quizlet.com/br/1106309461/conversational-english-relocation-updated-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I'm ___. Next year, I'm going to ___.
        example: I'm Marta. Next year, I'm going to travel to Paris.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: Do you want to move? Where to?
            frame: Yes, I want to move to ___. / No, I don't want to move.
          - question: Who are you going to move with?
            frame: I'm going to move with my family / my friend / alone.
          - question: When will you move?
            frame: I'll move next year / in July / in two months.
          - question: What will you do before you move?
            frame: I'm going to pack my things / learn the language / find a job / save money.
          - question: What will get better after you move? Name two things.
            frame: My job will be better. I'll have a bigger apartment. I'll go out more.
          - question: Why do you want to move (or why not)?
            frame: I want to move because ___. / I don't want to move because ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      - id: act1
        type: classActivity
        title: "Activity 1: We're moving!"
        skills: [Going to and will, Socializing]
        minutes: 15
        steps:
          - 'The class is in two groups. For example: Group 1 is moving to Europe, Group 2 is moving to Africa.'
          - Each group writes a short message to a friend about the move.
          - Read your group's message to the class.
        example: "*Hey Emma! I finally decided: I'm moving to Portugal! I'm so excited! Before I go, I'm going to learn Portuguese. Can you help me find a place to live?*"
        wordBank: [happy, scared, excited, nervous]
      - id: act1-message
        type: discussionQuestions
        title: Our message
        items:
          - question: "Hey ___! I finally decided: I'm moving to ___!"
          - question: I'm very ___ (happy / scared / excited / nervous).
          - question: Before I leave, I'm going to ___.
          - question: Can you help me with ___?
      - id: act2
        type: classActivity
        title: 'Activity 2: I need a plan'
        skills: [Going to and will]
        minutes: 15
        steps:
          - Write a 10-step plan for your move, from today to your final goal.
          - 'Step 1: where you are now. Step 10: your dream achieved.'
          - Use time expressions and dates for short-term and long-term plans.
          - Share your plan with the group.
        example: |-
          *Step 1: Today I live in Tel Aviv.*
          *Step 2: Next month, I'm going to start looking for a job abroad.*
          *Step 3: In one year, I'll move to Madrid.*
          *Step 10: I'll be settled and happy in my new home!*
      - id: act2-plan
        type: discussionQuestions
        title: My plan
        items:
          - question: 'Step 1: Today I ___.'
          - question: "Step 2: Next month, I'm going to ___."
          - question: "Step 3: In ___, I'll ___."
          - question: "Step 10: I'll ___."
      - id: act3
        type: classActivity
        title: 'Activity 3: Can anyone help me?'
        skills: [Socializing]
        minutes: 20
        steps:
          - Imagine you just arrived in a new city. You need information about restaurants, transportation or housing.
          - Write a short social media post or message asking for help, for example in a local Facebook group or a community forum.
          - Keep it short, polite and clear. Read your message to the group.
        example: |-
          *Hi! I just moved to London. Can anyone recommend a good supermarket nearby?*
          *Hello everyone! How do you pay for parking here?*
          *I'm new in town. What's the best area to live in?*
      - id: act3-message
        type: discussionQuestions
        title: My message
        items:
          - question: Hi! I just moved to ___. Can anyone recommend ___?
          - question: How do you pay for ___ here?
          - question: What's the best ___?
      - id: act4
        type: classActivity
        title: 'Activity 4: What will I do there?'
        skills: [Going to and will]
        minutes: 20
        steps:
          - Choose a city you would like to move to.
          - Describe a typical day there. Use *will* and different verbs and time markers.
          - Share your day with the group.
        example: >-
          *I'll move to Paris. Every morning I'll go to the bakery. I'll eat lots of
          cheese and drink coffee. I'll visit the Eiffel Tower every weekend. I'll work
          with French people and hang out with friends after work.*
      - id: act4-day
        type: discussionQuestions
        title: My day in the new city
        items:
          - question: I'll move to ___.
          - question: Every morning, I'll ___.
          - question: In the afternoon, I'll ___.
          - question: In the evening / On the weekend, I'll ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Level A2–B1 transition, 90 minutes. Two skills this cycle: **Going to and
          will** (warm-up, Activities 2 and 4) and **Socializing** (Activities 1 and 3).
      - id: n-intro
        anchor: intro
        text: 'Give your own example first ("I''m Marta. Next year, I''m going to travel to Paris."), then go around the group.'
      - id: n-warmup
        anchor: warmup
        text: Ask each student at least two questions. Answers typed here are visible to you below each question.
      - id: n-act2
        anchor: act2
        text: Each student writes their own 10 steps, with dates or time expressions (next month, in one year). The example shows only steps 1, 2, 3 and 10 as a model.
      - id: n-act3
        anchor: act3
        text: 'Goal: short, polite, clear messages. This is the key socializing skill.'
      - id: n-act4
        anchor: act4
        text: Encourage varied verbs and time markers (every morning, every weekend, after work).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: relocation-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-future
        type: ruleSummary
        skill: Going to and will
        rules:
          - text: '**Going to** = am / is / are + going to + base verb. Use it for plans you already decided.'
            examples: [I'm going to move to Italy next year., I'm going to find a new job.]
          - text: "**Will** (future simple) = will / 'll + base verb. Use it for decisions you make now, offers and promises, and for predictions and opinions."
            examples:
              [I'll move to Spain., I'll save money before I move., I think I'll be happy there.]
          - text: "Negative: **won't** (= will not) and **am not / isn't / aren't going to**."
            examples: [My brother won't move with me., I'm not going to sell my car.]
          - text: In conversation, both forms are often possible for plans and predictions. Use *going to* when the plan is already decided.
      - id: table-future
        type: table
        caption: 'The future of "move"'
        header: [Person, Going to, Will]
        rows:
          - [I, I'm going to move, I'll move]
          - [You / We / They, you're / we're / they're going to move, you'll / we'll / they'll move]
          - [He / She / It, he's / she's / it's going to move, he'll / she'll / it'll move]
      - id: rules-socializing
        type: ruleSummary
        skill: Socializing
        rules:
          - text: 'Socializing means asking short, clear questions and giving brief answers in social situations. Be brief: give the essential information.'
            examples: [I'll move in July.]
          - text: Ask direct questions.
            examples: [Where's the best restaurant?, How do you pay for the bus?]
          - text: Choose the right group to ask.
            examples: ['Ask in a local Facebook group for your city, not a random one.']
          - text: Start politely, say why you are asking, then ask.
            examples: [Hi! I just moved to London. Can anyone recommend a good supermarket nearby?]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both skills with the group and ask for one new example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: relocation-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy each message and send it. Mori will ask you questions; answer every one.
      - id: mori-future
        type: aiTutorPrompt
        title: 'Part 1: Going to and will, relocation plans'
        message: |-
          Hi Mori! I want to practise the future. Ask me these questions in order. Wait for my answer, and correct me if I don't use the future correctly. After each answer, ask me the extra question.
          1. Do you want to move? (Then: Why or why not?)
          2. Where will you move? (Then: When exactly?)
          3. Who are you going to move with? (Then: Who won't move with you?)
          4. What will you do before you move? (Then: What's the most important thing?)
          5. What will improve after you move? (Then: Give two examples.)
      - id: mori-socializing
        type: aiTutorPrompt
        title: 'Part 2: Socializing, asking for help'
        message: |-
          Hi Mori! Ask me questions as if I just arrived in a new city. Correct me if my answers are not short and clear.
          1. Where's the best restaurant in your city?
          2. How do you pay for public transportation?
          3. What place do you recommend visiting first?
          4. Where can I meet new people?
          5. What's the best neighborhood to live in?
      - id: mori-plan
        type: aiTutorPrompt
        title: 'Part 3: Mini game, my 10-step plan'
        intro: "Example: *Step 1: Today I live in Tel Aviv. · Step 2: I'm going to start saving money. · Step 3: I'll move in six months. · Step 10: I live happily in my new city.*"
        message: >-
          Hi Mori! Guide me to create a list of 10 steps for my move, from today to the
          future. Ask me for one step at a time and correct my mistakes, please.
      - id: mori-writing
        type: aiTutorPrompt
        title: 'Part 4: Writing practice'
        intro: |-
          Example:
          *I'll move to Madrid next year.*
          *I'll look for a new job before I move.*
          *Where's the nearest supermarket?*
          *How do you pay for parking here?*
        message: >-
          Hi Mori! Ask me to write 5 sentences: 3 sentences in the future about my move and
          2 practical social questions I can ask in a new city. Then correct my mistakes,
          please.
      - id: mori-reflection
        type: aiTutorPrompt
        title: 'Part 5: Final reflection'
        message: >-
          Hi Mori! Ask me to write my moving plan in 3 future sentences and one social
          question for you, as if you lived in my new city. Then answer my question and
          correct my mistakes.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: relocation-practice
    book: workbook
    title: 'Practice: Relocation'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. Each answer is checked at once, and you can try again.
      - id: ex-future
        type: activity
        activity: relocation-future
      - id: ex-socializing
        type: activity
        activity: relocation-socializing

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: relocation-vocabulary
    title: Vocabulary
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Relocation words
        glossLang: he
        link: https://quizlet.com/br/1106309461/conversational-english-relocation-updated-flash-cards/
        items: &relocation-words
          - { term: Relocation, gloss: מעבר }
          - { term: Move, gloss: לעבור (דירה) }
          - { term: New city, gloss: עיר חדשה }
          - { term: Neighborhood, gloss: שכונה }
          - { term: Apartment, gloss: דירה }
          - { term: Landlord, gloss: בעל דירה }
          - { term: Lease, gloss: חוזה שכירות }
          - { term: Rent, gloss: שכירות }
          - { term: Utilities, gloss: 'חשבונות (חשמל, מים, גז)' }
          - { term: Bills, gloss: חשבונות }
          - { term: Packing, gloss: אריזה }
          - { term: Belongings, gloss: חפצים }
          - { term: Shipping, gloss: משלוח }
          - { term: Commute, gloss: נסיעה יומית לעבודה }
          - { term: Transportation, gloss: תחבורה }
          - { term: Public transport, gloss: תחבורה ציבורית }
          - { term: Metro, gloss: מטרו }
          - { term: Bus pass, gloss: כרטיס אוטובוס }
          - { term: Supermarket, gloss: סופרמרקט }
          - { term: Local market, gloss: שוק מקומי }
          - { term: Cost of living, gloss: יוקר מחיה }
          - { term: Salary, gloss: משכורת }
          - { term: Job hunt, gloss: חיפוש עבודה }
          - { term: Interview, gloss: ראיון }
          - { term: Opportunity, gloss: הזדמנות }
          - { term: Visa, gloss: ויזה }
