vocabulary:
  - slug: identity-and-community
    title: Identity and community
    items: *identity-and-community-words

activities:
  - slug: identity-and-community-to-be
    title: "To be: I'm a teacher, I'm tired"
    minutes: 8
    items:
      - id: am-teacher
        type: multipleChoice
        prompt: I ___ a teacher, and I ___ in New York today.
        options:
          - { text: am … am, correct: true }
          - { text: is … is, feedback: "With *I*, use *am*: *I am (I'm) a teacher.*" }
          - {
              text: have … am,
              feedback: 'For a profession, use *to be*, not *have*: *I am a teacher.*',
            }
      - id: temporary
        type: multipleChoice
        prompt: Which sentence talks about a temporary state (how you feel now)?
        options:
          - { text: "I'm tired today.", correct: true }
          - {
              text: "I'm Brazilian.",
              feedback: 'Nationality is part of your identity. *Tired today* is how you feel now.',
            }
          - {
              text: "I'm a teacher.",
              feedback: 'A profession is part of your identity. *Tired today* is how you feel now.',
            }
      - id: are-is
        type: fillBlank
        prompt: Complete with *am*, *is* or *are*.
        text: My parents ___ from Argentina. My sister ___ a musician.
        blanks: [[are], [is]]
        wordBank: [am, is, are]
      - id: are-you
        type: fillBlank
        prompt: Complete the question.
        text: ___ you from Brazil? — Yes, I am.
        blanks: [[Are]]
      - id: isnt
        type: multipleChoice
        prompt: She ___ from Israel. She's from Brazil.
        options:
          - { text: "isn't", correct: true }
          - {
              text: "don't",
              feedback: "With *to be*, the negative is *is not / isn't*: *She isn't from Israel.*",
            }
          - { text: "aren't", feedback: "With *she*, use *is*: *She isn't*." }
      - id: short-forms
        type: matching
        prompt: Match the long and short forms.
        pairs:
          - [I am, "I'm"]
          - [he is, "he's"]
          - [we are, "we're"]
          - [they are, "they're"]
          - [it is, "it's"]
      - id: place
        type: trueFalse
        prompt: "We can use *to be* to say where we are now: *I'm in New York today.*"
        answer: true
        feedback:
          correct: 'Right! *To be* is for identity, and also for a state or a place now.'
          incorrect: "It is true: *I'm in New York today* uses *to be* for a place."
      - id: order-proud
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I'm proud of my community.

  - slug: identity-and-community-comparisons
    title: 'Comparisons: bigger than, more international, as quiet as'
    minutes: 8
    items:
      - id: bigger
        type: multipleChoice
        prompt: My city is ___ than my hometown.
        options:
          - { text: bigger, correct: true }
          - { text: more big, feedback: '*Big* is a short adjective: add *-er* → *bigger than*.' }
          - {
              text: biggest,
              feedback: '*Biggest* is for three or more things (*the biggest*). With *than*, use *bigger*.',
            }
      - id: more-less
        type: fillBlank
        prompt: Complete with *more* or *less*.
        text: My current city is ___ international than my hometown.
        blanks: [[more, less]]
      - id: as-as
        type: fillBlank
        prompt: Complete the comparison.
        text: My neighborhood is as quiet ___ yours.
        blanks: [[as]]
      - id: taller
        type: fillBlank
        prompt: Complete with the comparative of *tall*.
        text: My brother is ___ than me.
        blanks: [[taller]]
      - id: the-most
        type: multipleChoice
        prompt: This is ___ diverse community in the city.
        options:
          - { text: the most, correct: true }
          - {
              text: more,
              feedback: 'For three or more things, use *the most*: *the most diverse*.',
            }
          - { text: the more, feedback: 'The superlative is *the most*, not *the more*.' }
      - id: forms
        type: matching
        prompt: Match each adjective with its comparative.
        pairs:
          - [big, bigger]
          - [busy, busier]
          - [good, better]
          - [modern, more modern]
          - [small, smaller]
      - id: than
        type: trueFalse
        prompt: 'After a comparative, we use *than*: *My city is bigger than my hometown.*'
        answer: true
        feedback:
          correct: 'Right! *bigger than, more international than, less busy than*.'
          incorrect: 'It is true: comparative + *than* (*bigger than*).'
      - id: order-taller
        type: reorderSentence
        prompt: Put the words in order.
        sentence: My brother is taller than me.

  - slug: identity-and-community-future
    title: 'Future forms: will and going to'
    minutes: 8
    items:
      - id: going-to-plan
        type: multipleChoice
        prompt: I ___ join a recycling project next week. I already signed up.
        options:
          - { text: "'m going to", correct: true }
          - {
              text: going to,
              feedback: "We need *am / is / are* before *going to*: *I'm going to join*.",
            }
          - {
              text: will to,
              feedback: "After *will*, there is no *to*. For a decided plan, use *I'm going to join*.",
            }
      - id: will-be
        type: multipleChoice
        prompt: I think our community ___ more digital in ten years.
        options:
          - { text: will be, correct: true }
          - { text: will is, feedback: 'After *will*, use the base verb: *will be*.' }
          - {
              text: is going be,
              feedback: 'We need *to*: *is going to be*. For a prediction with *I think*, *will be* is best.',
            }
      - id: we-are
        type: fillBlank
        prompt: Complete with *am*, *is* or *are*.
        text: We ___ going to organize language exchange events.
        blanks: [[are]]
      - id: will
        type: fillBlank
        prompt: Complete with *will*.
        text: In five years, my community ___ be more organized.
        blanks: [[will]]
      - id: wont
        type: fillBlank
        prompt: Complete with the negative of *will*.
        text: My personality ___ change. I'll always be creative.
        blanks: [["won't", will not]]
      - id: base-verb
        type: trueFalse
        prompt: 'After *will*, we use the base verb: *Our community will grow*, not *will grows*.'
        answer: true
        feedback:
          correct: 'Right! *will* + base verb: *will grow, will be, will change*.'
          incorrect: 'It is true: *will* + base verb, without *-s*.'
      - id: short-forms
        type: matching
        prompt: Match the short and long forms.
        pairs:
          - ["I'm going to", I am going to]
          - ["We'll", We will]
          - ["won't", will not]
          - ["It'll", It will]
          - ["They're going to", They are going to]
      - id: order-neighbors
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I'm going to help my neighbors.
