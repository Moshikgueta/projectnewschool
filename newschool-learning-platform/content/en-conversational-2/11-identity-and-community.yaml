# Cycle "Identity and community", converted from the Conversational English (level 2)
# digital notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-conversational-2
slug: identity-and-community
title: Identity and community
goal: Describe your identity and community with to be, comparisons and the future.
position: 11
status: in_review

review:
  - >-
    The three workbook exercises ("To be", "Comparisons" and "Will and going to") are
    NEW: the notebook has no self-study exercises. They were written from the cycle's
    skills, the summary rules, the activity examples and the vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    This cycle lists THREE skills (To be, Comparisons, Future forms), not two. All
    three are kept in the overview, and one exercise was written per skill (three
    exercises instead of the usual two), as in the Spanish level 2 cycle "Identidad y
    comunidad". Please confirm.
  - >-
    The source summary lists only the grammar names ("To be for identity and state",
    "Comparatives (bigger than, smaller than, as… as)", "Future with going to / will").
    The rules, examples and tables in the summary are NEW, written from the activity
    examples: to be for identity vs. temporary state or place; -er / more / less …
    than, as … as, the most / the -est (with good → better → best); going to for plans
    and will for predictions. "As … as" is a comparison of equality, not a
    comparative; it is named "comparisons". Please confirm.
  - >-
    The source's "Summary" paragraphs ("Students practiced describing who they are…"),
    the "Skills practiced" lists (speaking, listening, writing, interaction / critical
    thinking), the CEFR reference and the "Skills practiced at home" lines are
    teacher-facing; they are teacher notes.
  - >-
    Warm-up (Beginners) question 2 "How is your community or neighborhood?" → "What is
    your community or neighborhood like?" (to ask for a description, English uses
    "What is … like?"). The source warm-up questions have no frames; short frames were
    added from the activity examples. Please check them.
  - >-
    Corrections and clean-up: "Activity 3 -My Community in the Future" → "Activity 3:
    My community in the future"; the introduction "Student task" list was merged into
    the frame; stray asterisks, "&#10;" codes and empty "Date / Participants" headings
    were removed. Option A / Option B are called Beginners (A2 / A2+) and Intermediate
    (B1), each under its own heading.
  - >-
    Mori homework: the source gives instructions ("Mori, ask me to…"), not messages. A
    message to Mori was written for each of the four tasks per level; the source's
    examples are kept as intros.
  - >-
    Vocabulary: "Open-minded" פתוח מחשבה → "בעל ראש פתוח"; "Influence" להשפיע →
    "להשפיע / השפעה"; "Respect" כבוד → "כבוד / לכבד"; "Plan" kept as תוכנית. Please
    confirm.
  - >-
    The source gives no activity times, so no minutes are recorded. The "Answer of
    student 1/2/3" lines are replaced by the optional answer boxes (decision C2). The
    Quizlet link is kept without its "?new" parameter.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: identity-and-community-class
    title: 'Class: Identity and community'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Identity and community
      - id: skills
        type: cycleOverview
        skills:
          - name: To be
            description: "Identity vs. temporary state or place: *I'm a teacher. I'm tired. I'm in New York today.*"
          - name: Comparisons
            description: '*bigger than, more / less … than, as … as, the most …*'
          - name: Future forms
            description: '*going to* for plans and *will* for predictions'
      - id: quizlet
        type: externalLink
        label: Identity and community on Quizlet
        url: https://quizlet.com/no/1098301146/identity-and-community-updated-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        prompt: 'Introduce yourself in 3–4 short sentences with *to be*: your name, where you are from or your nationality, your profession or role, and how you feel today.'
        frame: I'm ___ (name). I'm from ___ / I'm ___ (nationality). I'm a ___ (profession). Today I'm ___ (tired / excited / relaxed…).
        example: I'm Marta. I'm an Argentine woman. I'm a teacher, and I'm in New York today.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup-basic-title
        type: heading
        level: 4
        text: Beginners (A2 / A2+)
      - id: warmup-basic
        type: discussionQuestions
        items:
          - question: Where are you from, and where do you live now?
            frame: I'm from ___, and I live in ___ now.
          - question: What is your community or neighborhood like?
            frame: My community is ___ (friendly / quiet / busy…).
          - question: Who in your family is more outgoing than you?
            frame: My ___ is more outgoing than me.
          - question: Is your city bigger or smaller than another city you know?
            frame: My city is bigger / smaller than ___.
          - question: What do you like most about your identity (for example your nationality, culture or language)?
            frame: What I like most about my identity is ___.
          - question: What are you going to do to help your community this year?
            frame: This year, I'm going to ___.
          - question: What part of your personality will never change?
            frame: I'll always be ___.
          - question: What will your community be like in five years?
            frame: In five years, my community will be ___.
      - id: warmup-inter-title
        type: heading
        level: 4
        text: Intermediate (B1)
      - id: warmup-inter
        type: discussionQuestions
        items:
          - question: How would you describe your cultural or social identity?
            frame: I'm ___. I'm proud of ___.
          - question: What makes your community unique compared to others?
            frame: My community is more ___ than ___.
          - question: Who represents your community well, and why?
            frame: ___ represents my community well because ___.
          - question: How is your current community different from the one you grew up in?
            frame: My current community is more / less ___ than ___.
          - question: What values are most important in your community today?
            frame: The most important values are ___.
          - question: What are you going to do to make your community stronger in the future?
            frame: I'm going to ___.
          - question: What part of your identity will always stay the same, no matter where you live?
            frame: I'll always be ___.
          - question: What will an ideal community look like in ten years?
            frame: In ten years, an ideal community will ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      - id: act-basic-title
        type: heading
        level: 4
        text: Beginners (A2 / A2+)
      - id: act1
        type: classActivity
        title: 'Activity 1: Who am I?'
        skills: [To be]
        steps:
          - 'Write three short sentences about yourself: who you are, where you are from, and how you feel about your community.'
          - 'In pairs, share your sentences and ask: *Where are you from? Is your community big or small?*'
        example: "*I'm Daniela. I'm from Brazil, and I live in Tel Aviv. I'm happy because my community is friendly.*"
      - id: act1-sentences
        type: discussionQuestions
        title: About me
        items:
          - question: I'm ___.
          - question: I'm from ___, and I live in ___.
          - question: I'm ___ because my community is ___.
      - id: act2
        type: classActivity
        title: 'Activity 2: Similar or different?'
        skills: [Comparisons]
        steps:
          - In pairs, complete the sentences below to compare yourselves, your families or your communities.
          - Each pair shares one comparison with the class.
        example: '*My city is bigger than my hometown but quieter.*'
      - id: act2-sentences
        type: discussionQuestions
        title: Compare
        items:
          - question: My family is ___ than yours.
          - question: My city is ___ than my hometown.
          - question: My neighborhood is ___ but ___.
      - id: act3
        type: classActivity
        title: 'Activity 3: My community in the future'
        skills: [Future forms]
        steps:
          - In small groups, discuss the two questions below. Use *going to* or *will*.
          - Each group presents two sentences to the class.
        example: |-
          *I'm going to join a recycling project.*
          *My community will be more organized.*
      - id: act3-questions
        type: discussionQuestions
        items:
          - question: What are you going to do to help your community?
            frame: I'm going to ___.
          - question: What will your community be like in five years?
            frame: My community will be ___.
      - id: act4
        type: classActivity
        title: 'Activity 4: True or false?'
        skills: [To be, Comparisons, Future forms]
        steps:
          - 'Say three sentences: one about your identity, one comparison and one future prediction.'
          - One of them must be false.
          - The class guesses which sentence is false.
        example: |-
          *I'm from Argentina.*
          *My brother is taller than me.*
          *My city will disappear next year.*
      - id: act4-sentences
        type: discussionQuestions
        title: My three sentences
        items:
          - question: "Identity: I'm ___."
          - question: 'Comparison: My ___ is ___ than ___.'
          - question: 'Prediction: ___ will ___.'
      - id: act-inter-title
        type: heading
        level: 4
        text: Intermediate (B1)
      - id: act1-b
        type: classActivity
        title: 'Activity 1: Identity map'
        skills: [To be]
        steps:
          - 'Write 4–5 short statements about yourself: cultural identity, nationality, profession or role, personal traits, and feelings about your community.'
          - In pairs, share your statements and find two similarities and one difference.
        example: "*I'm half Israeli and half Brazilian. I'm a teacher, and I'm proud of my community because it's inclusive.*"
      - id: act2-b
        type: classActivity
        title: 'Activity 2: Comparing communities'
        skills: [Comparisons]
        steps:
          - In groups, choose two communities you know (for example, your hometown and your current city).
          - Write four comparison sentences with *more / less / as … as / the most*.
          - Present your sentences. Classmates ask follow-up questions.
        example: |-
          *My current city is more international than my hometown.*
          *My old neighborhood was less busy but more personal.*
      - id: act3-b
        type: classActivity
        title: 'Activity 3: Community in the future'
        skills: [Future forms]
        steps:
          - In groups, brainstorm how your communities might change in the next 10 years.
          - Write 3–4 predictions or plans with *will* and *going to*.
          - The class votes for the community with the most positive future.
        example: |-
          *Our community will be more digital and connected.*
          *We're going to organize language exchange events.*
      - id: act4-b
        type: classActivity
        title: 'Activity 4: Identity and community discussion'
        skills: [To be, Comparisons, Future forms]
        steps:
          - In small groups, discuss the questions below.
          - Summarize your group's answers and share them with the class.
        example: |-
          *My community is more open than before.*
          *I'll always be creative and curious.*
      - id: act4-b-questions
        type: discussionQuestions
        items:
          - question: What values define your community?
          - question: How is your identity different from when you were younger?
          - question: What are you going to do to improve your community?
          - question: What part of your identity will never change?
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Level A2–B1 transition, 90 minutes. Three skills this cycle: **To be**
          (permanent identity vs. temporary state or location), **Comparisons** (more /
          less than, as … as, the most) and **Future forms** (*will* and *going to*). Choose
          the Beginners (A2 / A2+) or Intermediate (B1) warm-up questions and activities,
          based on the class level.
      - id: n-cefr
        anchor: null
        text: >-
          CEFR reference. A2: can describe personal identity in simple terms. A2/B1: can
          compare familiar people and places. B1: can express opinions and future plans.
      - id: n-intro
        anchor: intro
        text: 'Give your own example first, then go around the group. Students can use identity words: nationality, gender, religion, profession or location.'
      - id: n-warmup
        anchor: warmup-title
        text: Ask each student at least two questions from the level of your group. Answers typed here are visible to you below each question.
      - id: n-act4
        anchor: act4
        text: Give your own three sentences first and let the class guess which one is false.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: identity-and-community-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-to-be
        type: ruleSummary
        skill: To be
        rules:
          - text: 'Use **to be** (am / is / are) for identity: name, nationality, profession, personality.'
            examples: [I'm Daniela., I'm from Brazil., I'm a teacher., I'm creative and curious.]
          - text: 'Use **to be** also for a temporary state (how you feel now) or a place (where you are now).'
            examples:
              [
                I'm tired today.,
                I'm happy because my community is friendly.,
                I'm in New York today.,
              ]
          - text: "Questions: put *am / is / are* first. Negative: add *not* (*isn't, aren't, I'm not*)."
            examples:
              [Are you from Brazil?, Is your community big or small?, "She isn't from Israel."]
      - id: table-to-be
        type: table
        caption: To be
        header: [Person, Long form, Short form]
        rows:
          - [I, I am, I'm]
          - [You / We / They, you are / we are / they are, you're / we're / they're]
          - [He / She / It, he is / she is / it is, he's / she's / it's]
      - id: rules-comparisons
        type: ruleSummary
        skill: Comparisons
        rules:
          - text: 'Short adjectives: adjective + **-er than**.'
            examples:
              [
                My city is bigger than my hometown.,
                My brother is taller than me.,
                My city is quieter.,
              ]
          - text: 'Long adjectives: **more / less** + adjective + **than**.'
            examples:
              [
                My current city is more international than my hometown.,
                My old neighborhood was less busy but more personal.,
              ]
          - text: 'Two things are the same: **as** + adjective + **as**.'
            examples: [My neighborhood is as quiet as yours.]
          - text: 'Three or more things: **the most** + long adjective, or **the** + short adjective + **-est**.'
            examples:
              [It's the most diverse city in the country., This is the biggest neighborhood.]
          - text: 'Irregular: good → better → the best; bad → worse → the worst.'
      - id: table-comparisons
        type: table
        caption: Comparisons
        header: [Adjective, Comparative, Superlative]
        rows:
          - [big, bigger than, the biggest]
          - [quiet, quieter than, the quietest]
          - [busy, busier than, the busiest]
          - [international, more / less international than, the most / the least international]
          - [good, better than, the best]
      - id: rules-future
        type: ruleSummary
        skill: Future forms
        rules:
          - text: '**Going to** + base verb for plans you already decided.'
            examples:
              [
                I'm going to join a recycling project.,
                We're going to organize language exchange events.,
              ]
          - text: "**Will** + base verb for predictions and opinions about the future. Negative: **won't** (= will not)."
            examples:
              [
                My community will be more organized.,
                Our community will be more digital and connected.,
                My personality won't change.,
              ]
      - id: inter-title
        type: heading
        level: 3
        text: Intermediate (B1)
      - id: inter-recap
        type: callout
        tone: info
        title: For intermediate groups
        text: |-
          Use *to be* for cultural and social identity: *I'm half Israeli and half Brazilian.*
          Use comparatives **and** superlatives to compare communities: *My city is the most international place I know.*
          Use *will* and *going to* for future plans and community goals: *We're going to organize more social events. It will be more international.*
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through the rules of your group's level and ask for one new example for each rule.
      - id: n-summary-a
        anchor: rules-to-be
        text: >-
          Beginners (A2 / A2+): students practiced describing who they are and where they
          belong, comparing their families and communities, and imagining the future of
          their neighborhoods. Skills: speaking (introducing yourself and describing your
          community), listening (understanding personal information from classmates),
          writing (short sentences with to be, comparatives and future forms) and
          interaction (pair interviews and group sharing).
      - id: n-summary-b
        anchor: inter-recap
        text: >-
          Intermediate (B1): students explored what defines personal and collective
          identity, shared what makes their community unique, compared it to others they
          know, made predictions about future communities and reflected on values that
          stay the same. Skills: speaking (opinions about identity and community values),
          listening (others' descriptions and comparisons), writing (structured
          paragraphs about personal and community identity) and critical thinking
          (changes and values in different communities).

  # ── after class ──────────────────────────────────────────────────────────
  - slug: identity-and-community-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Keep practising grammar, writing and reflection with the words and ideas from class. Open the chat with Mori, copy each message of your level and send it. Answer every question.
      - id: basic-title
        type: heading
        level: 3
        text: Beginners (A2 / A2+)
      - id: mori-basic-1
        type: aiTutorPrompt
        title: '1: Personal identity'
        intro: "Example: *I'm Ana. I'm from Brazil. I'm happy because my community is friendly.*"
        message: >-
          Hi Mori! Please ask me to describe who I am, where I'm from, and how I feel about
          my community. Then correct my sentences with the verb "to be".
      - id: mori-basic-2
        type: aiTutorPrompt
        title: '2: Comparisons'
        intro: '*Example: My brother is taller than me. My city is smaller than São Paulo. My neighborhood is as quiet as yours.*'
        message: >-
          Hi Mori! Please ask me to write three comparison sentences about people or places
          I know. Then correct my mistakes.
      - id: mori-basic-3
        type: aiTutorPrompt
        title: '3: Future plans'
        intro: "Example: *I'm going to join a volunteer project. I'm going to help my neighbors. My community will be more organized.*"
        message: >-
          Hi Mori! Please ask me to write two sentences with "going to" and one sentence
          with "will" about my community in the future. Then correct my mistakes.
      - id: mori-basic-4
        type: aiTutorPrompt
        title: '4: Reflection'
        message: >-
          Hi Mori! Please ask me this question: "What part of your identity will never
          change?" Then ask me one more question about my answer and correct my mistakes.
      - id: inter-title
        type: heading
        level: 3
        text: Intermediate (B1)
      - id: mori-inter-1
        type: aiTutorPrompt
        title: '1: Identity description'
        intro: "Example: *I'm Israeli and Brazilian. I'm a teacher, creative and open-minded.*"
        message: >-
          Hi Mori! Please ask me to write four sentences describing my identity: my
          nationality, my culture, my personality and my profession. Then correct my
          mistakes.
      - id: mori-inter-2
        type: aiTutorPrompt
        title: '2: Community comparisons'
        intro: '*Example: My current city is more diverse than my hometown. My neighborhood is less quiet but more interesting.*'
        message: >-
          Hi Mori! Please ask me to write three comparison sentences about my current
          community and another community I know. Then correct my mistakes.
      - id: mori-inter-3
        type: aiTutorPrompt
        title: '3: The future of my community'
        intro: "Example: *Our community will grow quickly. It will be more international. We're going to organize more social events.*"
        message: >-
          Hi Mori! Please ask me to write three predictions about my community in ten
          years: two with "will" and one with "going to". Then correct my mistakes.
      - id: mori-inter-4
        type: aiTutorPrompt
        title: '4: Reflection'
        message: >-
          Hi Mori! Please ask me this question: "What values define your community, and
          what part of your identity will always stay the same?" Then ask me a follow-up
          question and correct my mistakes.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**
    teacherNotes:
      - id: n-homework
        anchor: null
        text: >-
          Skills practiced at home. Beginners: writing, reflection and grammar accuracy
          (to be, comparatives, future). Intermediate: writing, grammar control, reflection
          and future-oriented expression.

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: identity-and-community-practice
    book: workbook
    title: 'Practice: Identity and community'
    phase: after_class
