vocabulary:
  - slug: movies-and-tv-past
    title: 'Movies & TV: present and past'
    items: *movies-and-tv-past-words

activities:
  - slug: movies-and-tv-past-story
    title: 'Telling a story: I watched, I used to watch, Jack survives'
    minutes: 8
    items:
      - id: watched
        type: multipleChoice
        prompt: Last weekend I ___ *Avatar* at the cinema.
        options:
          - { text: watched, correct: true }
          - {
              text: watch,
              feedback: '*Watch* is present. With *last weekend* we use the past simple: *watched*.',
            }
          - {
              text: used to watch,
              feedback: '*Used to* is for a habit (many times). *Last weekend* is one time: *watched*.',
            }
      - id: used-to
        type: multipleChoice
        prompt: When I was a child, I ___ watch *SpongeBob* every morning.
        options:
          - { text: used to, correct: true }
          - {
              text: use to,
              feedback: 'In a positive sentence, write *used to*: *I used to watch…*',
            }
          - { text: using to, feedback: 'The form is *used to* + base verb: *I used to watch…*' }
      - id: saw-went
        type: fillBlank
        prompt: Complete with the past simple of *see* and *go*.
        text: The last movie I ___ was *Inside Out 2*. I ___ to the cinema with my sister.
        blanks: [[saw], [went]]
      - id: irregular
        type: matching
        prompt: Match each verb with its past simple form.
        pairs:
          - [see, saw]
          - [go, went]
          - [come, came]
          - [leave, left]
          - [sink, sank]
      - id: didnt-use-to
        type: fillBlank
        prompt: Complete with the negative of *used to*.
        text: I ___ like horror movies, but now I love them.
        blanks: [[didn't use to, did not use to, didn’t use to]]
      - id: used-to-rule
        type: trueFalse
        prompt: 'We use *used to* for past habits that are not true anymore: *I used to watch Toy Story a lot.*'
        answer: true
        feedback:
          correct: 'Right! *I used to watch Toy Story a lot* = I watched it many times, but not now.'
          incorrect: '*Used to* is for past habits that are not true now: *I used to watch Toy Story a lot.*'
      - id: new-ending
        type: fillBlank
        prompt: 'Write the new ending in the present simple. Use *climb* and *help*.'
        text: In our version of *Titanic*, Jack survives. He ___ on the door and Rose ___ him.
        blanks: [[climbs], [helps]]
      - id: order-who
        type: reorderSentence
        prompt: Put the words in order.
        sentence: Who did you watch it with?

  - slug: movies-and-tv-past-opinions
    title: 'Opinions: I think… because…'
    minutes: 8
    items:
      - id: because
        type: multipleChoice
        prompt: I didn't like the ending ___ it was sad.
        options:
          - { text: because, correct: true }
          - { text: but, feedback: '*But* shows a contrast. To give a reason, use *because*.' }
          - {
              text: so,
              feedback: '*So* gives a result, not a reason. To give a reason, use *because*.',
            }
      - id: was-funny
        type: fillBlank
        prompt: Complete with the past simple of *be*.
        text: I liked *Barbie* because it ___ funny. The scenes ___ very colorful.
        blanks: [[was], [were]]
      - id: best
        type: multipleChoice
        prompt: The ___ movie I ever saw was *Avatar*.
        options:
          - { text: best, correct: true }
          - {
              text: better,
              feedback: '*Better* compares two things (*better than*). For one movie of all, use *the best*.',
            }
          - { text: good, feedback: 'We choose one movie of all the movies: *the best movie*.' }
      - id: comparatives
        type: matching
        prompt: Match each adjective with its comparative form.
        pairs:
          - [good, better]
          - [bad, worse]
          - [funny, funnier]
          - [happy, happier]
          - [interesting, more interesting]
      - id: better-than
        type: fillBlank
        prompt: Complete with the comparative of *good*.
        text: This movie was ___ than the last one.
        blanks: [[better]]
      - id: superlative-two
        type: trueFalse
        prompt: 'We use the superlative (*the best, the most interesting*) when we compare only two things.'
        answer: false
        feedback:
          correct: 'Right! For two things, use the comparative: *better than, more interesting than*.'
          incorrect: 'For two things, use the comparative (*better than*). The superlative (*the best*) is for three or more.'
      - id: partner-liked
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: My partner liked Barbie because it was funny., correct: true }
          - {
              text: My partner like Barbie because it was funny.,
              feedback: 'In the past simple, add *-d*: *liked*.',
            }
          - {
              text: My partner liked Barbie because was funny.,
              feedback: 'After *because*, the sentence needs a subject: *because it was funny*.',
            }
      - id: order-think
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I think the scene was funny.
