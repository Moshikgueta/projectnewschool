vocabulary:
  - slug: social-media-past
    title: 'Social media: the past'
    items: *social-media-past-words

activities:
  - slug: social-media-past-past-simple
    title: 'Past simple: I posted, I saw, What did you post?'
    minutes: 8
    items:
      - id: used
        type: multipleChoice
        prompt: Yesterday I ___ Instagram.
        options:
          - { text: used, correct: true }
          - {
              text: use,
              feedback: '*Use* is present. With *yesterday* we use the past simple: *used*.',
            }
          - {
              text: using,
              feedback: 'We need a past verb after *I*: *Yesterday I used Instagram.*',
            }
      - id: saw-got
        type: fillBlank
        prompt: Complete with the past simple of *see* and *get*.
        text: Yesterday I ___ a funny meme. Last week my video ___ one hundred likes.
        blanks: [[saw], [got]]
      - id: irregular
        type: matching
        prompt: Match each verb with its past simple form.
        pairs:
          - [see, saw]
          - [have, had]
          - [do, did]
          - [get, got]
          - [post, posted]
      - id: question-did
        type: multipleChoice
        prompt: Which question is correct?
        options:
          - { text: What did you post yesterday?, correct: true }
          - {
              text: What did you posted yesterday?,
              feedback: 'After *did*, use the base verb: *What did you post?*',
            }
          - {
              text: What you posted yesterday?,
              feedback: 'Past simple questions need *did*: *What did you post?*',
            }
      - id: didnt-like
        type: fillBlank
        prompt: Make the sentence negative.
        text: I liked the post about recipes, but I ___ like the advertisement.
        blanks: [[didn't, did not, didn’t]]
      - id: did-watched
        type: trueFalse
        prompt: '*Did you watched the video?* is a correct question.'
        answer: false
        feedback:
          correct: 'Right! After *did*, use the base verb: *Did you watch the video?*'
          incorrect: 'After *did*, use the base verb, not the -ed form: *Did you watch the video?*'
      - id: did-fun
        type: fillBlank
        prompt: Complete the question.
        text: ___ you have fun on TikTok yesterday? — Yes, I did.
        blanks: [[Did]]
      - id: order-post
        type: reorderSentence
        prompt: Put the words in order.
        sentence: What did you post on Instagram?

  - slug: social-media-past-comparisons
    title: 'Comparisons: more, less, the most'
    minutes: 8
    items:
      - id: more-fun
        type: multipleChoice
        prompt: TikTok was ___ fun than YouTube.
        options:
          - { text: more, correct: true }
          - {
              text: most,
              feedback: 'For two things we use *more… than*. *The most* is for three or more things.',
            }
          - { text: much, feedback: 'To compare two things, use *more… than*: *more fun than*.' }
      - id: the-most
        type: multipleChoice
        prompt: Instagram was ___ popular network last year.
        options:
          - { text: the most, correct: true }
          - {
              text: more,
              feedback: 'There is no *than* here, and we choose one from many: *the most popular*.',
            }
          - { text: most, feedback: 'Use *the* before *most*: *the most popular network*.' }
      - id: less-popular
        type: fillBlank
        prompt: Complete with *more* or *less*.
        text: My friends didn't use Facebook a lot. Facebook was ___ popular than Instagram.
        blanks: [[less]]
        wordBank: [more, less]
      - id: than
        type: trueFalse
        prompt: 'We use *than* after *more* or *less* when we compare two things: *more interesting than*.'
        answer: true
        feedback:
          correct: 'Right! *My first post was more popular than yours.*'
          incorrect: 'We do use *than* to compare two things: *My first post was more popular than yours.*'
      - id: forms
        type: matching
        prompt: Match each adjective with its comparative form.
        pairs:
          - [funny, funnier]
          - [big, bigger]
          - [good, better]
          - [bad, worse]
          - [interesting, more interesting]
      - id: bigger
        type: fillBlank
        prompt: Complete with the comparative of *big*.
        text: That problem was ___ than the other one.
        blanks: [[bigger]]
      - id: fewer-likes
        type: multipleChoice
        prompt: You got ___ likes than me.
        options:
          - { text: fewer, correct: true }
          - {
              text: less,
              feedback: 'We can count likes (one like, two likes), so we use *fewer*: *fewer likes*.',
            }
