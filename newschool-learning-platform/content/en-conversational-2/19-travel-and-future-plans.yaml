vocabulary:
  - slug: travel-and-future-plans
    title: Travel & Future Plans
    items: *travel-and-future-plans-words

activities:
  - slug: travel-and-future-plans-going-to
    title: "Be going to: I'm going to travel…"
    minutes: 8
    items:
      - id: going-to-stay
        type: multipleChoice
        prompt: We already booked the hotel. We ___ in Barcelona.
        options:
          - { text: are going to stay, correct: true }
          - {
              text: are going to stayed,
              feedback: 'After *going to* we use the base verb: *going to stay*.',
            }
          - {
              text: going to stay,
              feedback: 'We need *am / is / are* before *going to*: *We are going to stay.*',
            }
      - id: she-is-going
        type: fillBlank
        prompt: Complete with the right form of *be going to*.
        text: My sister ___ visit museums in Rome.
        blanks: [['is going to', "'s going to"]]
      - id: i-am-going
        type: fillBlank
        prompt: Complete with *be going to* and the verb *buy*.
        text: I ___ postcards and magnets.
        blanks: [['am going to buy', "'m going to buy"]]
      - id: questions-match
        type: matching
        prompt: Match each question with its answer.
        pairs:
          - [Where are you going to travel?, I'm going to travel to Italy.]
          - [Who are you going to travel with?, I'm going to travel with my sister.]
          - [Where are you going to stay?, In a hotel near the center.]
          - [What transportation are you going to use?, I'm going to fly and then take a train.]
          - [What souvenirs are you going to buy?, Postcards and magnets.]
      - id: plan-tf
        type: trueFalse
        prompt: "We use *be going to* for plans we already decided: *I'm going to fly to Rome next month.*"
        answer: true
        feedback:
          correct: Right! The plan is already made, so we use *be going to*.
          incorrect: "*Be going to* is for plans and decisions already made: *I'm going to fly to Rome.*"
      - id: question-form
        type: multipleChoice
        prompt: Which question is correct?
        options:
          - { text: Where are you going to stay?, correct: true }
          - {
              text: Where you are going to stay?,
              feedback: 'In a question, *are* comes before *you*: *Where are you going to stay?*',
            }
          - {
              text: Where are you going to staying?,
              feedback: 'After *going to* we use the base verb: *stay*, not *staying*.',
            }
      - id: they-report
        type: fillBlank
        prompt: "Report your partner's plan with *be going to*. Your partner says: *I'm going to travel to Greece.*"
        text: My partner ___ to travel to Greece.
        blanks: [[is going, "'s going"]]
      - id: order-spain
        type: reorderSentence
        prompt: Put the words in order.
        sentence: We are going to travel to Spain.

  - slug: travel-and-future-plans-will
    title: "Will: I think you'll love it"
    minutes: 8
    items:
      - id: prediction
        type: multipleChoice
        prompt: Which sentence is a prediction?
        options:
          - { text: I think you'll love the food., correct: true }
          - {
              text: I'm going to fly to Rome next month.,
              feedback: 'This is a plan already made (*going to*). A prediction often uses *I think + will*.',
            }
          - {
              text: We're going to stay in Barcelona.,
              feedback: 'This is a plan (*going to*). A prediction often uses *I think + will*.',
            }
      - id: will-be
        type: multipleChoice
        prompt: That ___ amazing!
        options:
          - { text: will be, correct: true }
          - { text: will is, feedback: 'After *will* we use the base verb: *will be*.' }
          - { text: will to be, feedback: 'After *will* there is no *to*: *will be*.' }
      - id: offer-send
        type: fillBlank
        prompt: 'The travel agent decides now to help you. Complete with *will* and *send*.'
        text: I ___ you the details.
        blanks: [["'ll send", will send]]
      - id: when-arrive
        type: multipleChoice
        prompt: When I ___, I'm going to take a taxi.
        options:
          - { text: arrive, correct: true }
          - {
              text: will arrive,
              feedback: 'After *when / after / before* we use the present simple, not *will*: *When I arrive…*',
            }
          - {
              text: am going to arrive,
              feedback: 'After *when / after / before* we use the present simple: *When I arrive…*',
            }
      - id: after-check-in
        type: trueFalse
        prompt: '*After I will check in, I will go to the beach.* is correct.'
        answer: false
        feedback:
          correct: 'Right! After *after* we use the present simple: *After I check in, I will go to the beach.*'
          incorrect: 'After *when / after / before* we use the present simple: *After I check in, I will go to the beach.*'
      - id: before-leave
        type: fillBlank
        prompt: Complete with the verb *leave*.
        text: Before I ___, I'm going to pack my suitcase.
        blanks: [[leave]]
      - id: meaning-match
        type: matching
        prompt: Match each sentence with its meaning.
        pairs:
          - [I think I'll love it there., a prediction]
          - [I'll send you the details., an offer]
          - [I'm going to fly to Rome., a plan already made]
          - [I promise I'll call you every day., a promise]
      - id: order-food
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I think you will love the food.
