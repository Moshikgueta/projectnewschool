vocabulary:
  - slug: movies-and-tv-future
    title: 'Movies & TV: present and future'
    items: *movies-and-tv-future-words

activities:
  - slug: movies-and-tv-future-present
    title: 'Present simple: I usually watch, she likes, I prefer…'
    minutes: 8
    items:
      - id: likes
        type: multipleChoice
        prompt: My sister ___ action movies.
        options:
          - { text: likes, correct: true }
          - { text: like, feedback: 'With *he / she / it* (my sister = she), add *-s*: *likes*.' }
          - {
              text: liking,
              feedback: 'In the present simple, use *likes* (not the -ing form): *She likes action movies.*',
            }
      - id: dont-watch
        type: fillBlank
        prompt: Make the sentence negative.
        text: We ___ watch horror films. They are too scary.
        blanks: [[don't, do not, don’t]]
      - id: usually-watch
        type: multipleChoice
        prompt: I usually ___ movies at home.
        options:
          - { text: watch, correct: true }
          - {
              text: watches,
              feedback: "With *I*, don't add *-s*: *I watch*. Only *he / she / it* add *-es*: *she watches*.",
            }
          - {
              text: am watch,
              feedback: 'The present simple has no *am*: *I usually watch movies at home.*',
            }
      - id: do-question
        type: fillBlank
        prompt: Complete the question.
        text: ___ you usually watch movies at home or at the cinema? — At home.
        blanks: [[Do]]
      - id: habits-rule
        type: trueFalse
        prompt: 'We use the present simple for habits and routines: *I usually watch movies at home.*'
        answer: true
        feedback:
          correct: 'Right! Habits, routines and preferences use the present simple.'
          incorrect: 'Habits and routines use the present simple: *I usually watch movies at home.*'
      - id: answers
        type: matching
        prompt: Match each question with its answer.
        pairs:
          - [What kind of movies do you usually watch?, I usually watch comedies.]
          - [Does your brother like horror movies?, "No, he doesn't."]
          - [Who do you watch movies with?, I watch movies with my friends.]
          - [Where do you prefer to watch movies?, I prefer the cinema.]
      - id: prefer-because
        type: multipleChoice
        prompt: I prefer animated movies ___ they are relaxing.
        options:
          - { text: because, correct: true }
          - { text: but, feedback: '*But* shows a contrast. To give a reason, use *because*.' }
          - { text: and, feedback: 'To explain *why* you prefer something, use *because*.' }
      - id: order-doesnt
        type: reorderSentence
        prompt: Put the words in order.
        sentence: She doesn't like horror movies.

  - slug: movies-and-tv-future-future
    title: 'Future: going to and will'
    minutes: 8
    items:
      - id: are-going-to
        type: multipleChoice
        prompt: On Friday night, we ___ watch *Harry Potter* at our friend's house.
        options:
          - { text: are going to, correct: true }
          - { text: going to, feedback: "Don't forget *am / is / are*: *we are going to watch*." }
          - {
              text: are go to,
              feedback: 'The form is *are going to* + base verb: *we are going to watch*.',
            }
      - id: im-going-to
        type: fillBlank
        prompt: 'I have already decided. Complete with *I* + *going to*.'
        text: ___ invite my friends to my movie night.
        blanks: [[I'm going to, I am going to, I’m going to]]
      - id: offer
        type: multipleChoice
        prompt: "A: I'm thirsty. B: Wait, I ___ bring you some water!"
        options:
          - { text: "'ll", correct: true }
          - {
              text: "'m going to",
              feedback: "B decides now, in the moment. For a decision in the moment or an offer, use *will* (*'ll*).",
            }
          - { text: bring, feedback: "B decides now and offers help: *I'll bring you some water.*" }
      - id: plan-rule
        type: trueFalse
        prompt: "We use *going to* when the plan already exists: *We're going to watch Dune on Friday.*"
