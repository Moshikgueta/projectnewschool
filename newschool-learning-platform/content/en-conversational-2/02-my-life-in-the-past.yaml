vocabulary:
  - slug: my-life-in-the-past
    title: My Life in the Past
    items: *my-life-in-the-past-words

activities:
  - slug: my-life-in-the-past-past-simple
    title: 'Past simple: questions and reports'
    minutes: 8
    items:
      - id: where-did-she-go
        type: multipleChoice
        prompt: '*She went to Paris in 2020.* Which question asks about the place?'
        options:
          - { text: Where did she go in 2020?, correct: true }
          - {
              text: Where did she went in 2020?,
              feedback: 'After *did*, use the base verb: *go*, not *went*.',
            }
          - {
              text: Where she went in 2020?,
              feedback: 'A past simple question needs *did*: *Where did she go…?*',
            }
      - id: breakfast
        type: fillBlank
        prompt: Complete the question.
        text: What ___ you have for breakfast yesterday?
        blanks: [[did]]
      - id: did-buy
        type: fillBlank
        prompt: '*They bought new shoes last Friday.* Complete the question.'
        text: What ___ they ___ last Friday?
        blanks: [[did], [buy]]
      - id: q-and-a
        type: matching
        prompt: Match each question with its answer.
        pairs:
          - [Where were you born?, I was born in Haifa.]
          - [What did you eat yesterday?, I ate pasta.]
          - [Who did you talk to yesterday?, I talked to my mom.]
          - [What time did you wake up?, I woke up at 7:00.]
      - id: partner-was-born
        type: multipleChoice
        prompt: 'Your partner says: *I was born in Haifa.* Tell the group: My partner ___ born in Haifa.'
        options:
          - { text: was, correct: true }
          - { text: were, feedback: '*Were* is for *you, we, they*. For *he / she*, use *was*.' }
          - { text: is, feedback: 'Being born is in the past, so use *was*.' }
      - id: base-after-did
        type: trueFalse
        prompt: 'In a past simple question, the verb after *did* is in the base form: *Did you study?*'
        answer: true
        feedback:
          correct: Right! *Did* is already past, so the verb stays in the base form.
          incorrect: '*Did* shows the past, so the verb is in the base form: *Did you study?* (not *studied*).'
      - id: went-cinema
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: I went to the cinema yesterday., correct: true }
          - {
              text: I go to the cinema yesterday.,
              feedback: '*Go* is the present. With *yesterday*, use *went*.',
            }
          - {
              text: I was go to the cinema yesterday.,
              feedback: "Don't use *was* with a base verb. The past simple of *go* is *went*.",
            }
      - id: order-yesterday
        type: reorderSentence
        prompt: Put the words in order.
        sentence: What did you do yesterday?

  - slug: my-life-in-the-past-used-to
    title: 'Used to and past continuous'
    minutes: 8
    items:
      - id: was-studying
        type: multipleChoice
        prompt: At 8 p.m. yesterday, I ___.
        options:
          - { text: was studying, correct: true }
          - { text: were studying, feedback: '*Were* is for *you, we, they*. For *I*, use *was*.' }
          - {
              text: am studying,
              feedback: '*Am studying* is the present. For an action in progress in the past, use *was studying*.',
            }
      - id: cooking-called
        type: fillBlank
        prompt: Complete with the past continuous and the past simple.
        text: I ___ cooking dinner when my friend ___.
        blanks: [[was], [called]]
        wordBank: [was, were, called, was calling]
      - id: used-to-play
        type: multipleChoice
        prompt: When I was a child, I ___ play football every day.
        options:
          - { text: used to, correct: true }
          - { text: use to, feedback: 'In positive sentences, write *used to*: *I used to play.*' }
          - {
              text: was used to,
              feedback: 'For a past habit, use *used to* + base verb, without *was*.',
            }
      - id: did-use-to
        type: fillBlank
        prompt: Complete the question.
        text: What ___ you use to do after school?
        blanks: [[did]]
      - id: didnt-use-to
        type: multipleChoice
        prompt: I ___ like vegetables, but now I love them.
        options:
          - { text: "didn't use to", correct: true }
          - {
              text: "didn't used to",
              feedback: "After *didn't*, write *use to* (without *d*): *I didn't use to like…*",
            }
          - {
              text: not used to,
              feedback: "The negative needs *didn't*: *I didn't use to like vegetables.*",
            }
      - id: match-uses
        type: matching
        prompt: Match each sentence with its use.
        pairs:
          - [I watched a movie., a completed action]
          - [I was watching a movie when my friend called., an interrupted action]
          - [I used to watch cartoons as a child., a past habit (not true now)]
          - [The sun was shining., a background in a story]
      - id: still-live
        type: trueFalse
        prompt: '*They used to live in a small neighborhood.* This means they still live there.'
        answer: false
        feedback:
          correct: Right! *Used to* is for things that were true in the past but are not true now.
          incorrect: "*Used to* means it was true in the past but not now: they don't live there anymore."
      - id: order-seven
        type: reorderSentence
        prompt: Put the words in order.
        sentence: What were you doing at 7 p.m.?
