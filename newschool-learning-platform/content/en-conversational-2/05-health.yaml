vocabulary:
  - slug: health
    title: Health
    items: *health-words

activities:
  - slug: health-past
    title: 'Past simple: I fell, I felt, Did you…?'
    minutes: 8
    items:
      - id: fell
        type: multipleChoice
        prompt: Yesterday I ___ at home and hurt my knee.
        options:
          - { text: fell, correct: true }
          - { text: falled, feedback: '*Fall* is an irregular verb. The past form is *fell*.' }
          - {
              text: fall,
              feedback: '*Fall* is present. With *yesterday*, use the past simple: *fell*.',
            }
      - id: ate-felt
        type: fillBlank
        prompt: Complete with the past simple of *eat* and *feel*.
        text: Last night I ___ bad chicken and ___ very sick.
        blanks: [[ate], [felt]]
      - id: irregular
        type: matching
        prompt: Match each verb with its past simple form.
        pairs:
          - [go, went]
          - [eat, ate]
          - [feel, felt]
          - [drink, drank]
          - [have, had]
      - id: rested
        type: trueFalse
        prompt: 'For regular verbs, add *-ed*: *rest → rested*.'
        answer: true
        feedback:
          correct: 'Right! *walk → walked, rest → rested*.'
          incorrect: 'Regular verbs add *-ed*: *rest → rested*.'
      - id: did-take
        type: multipleChoice
        prompt: ___ you take any medicine yesterday?
        options:
          - { text: Did, correct: true }
          - {
              text: Do,
              feedback: 'With *yesterday*, the question is in the past: *Did you take…?*',
            }
          - {
              text: Were,
              feedback: 'With a verb like *take*, make the question with *did*: *Did you take…?*',
            }
      - id: didnt-feel
        type: fillBlank
        prompt: Complete with the negative of *feel* in the past simple.
        text: I ___ well yesterday, so I stayed at home.
        blanks: [[didn't feel, did not feel]]
      - id: did-go
        type: multipleChoice
        prompt: Which question is correct?
        options:
          - { text: Did you go to the hospital?, correct: true }
          - {
              text: Did you went to the hospital?,
              feedback: 'After *did*, use the base verb: *Did you go…?*',
            }
          - {
              text: Went you to the hospital?,
              feedback: 'Questions in the past simple start with *did*: *Did you go…?*',
            }
      - id: order-slipped
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I slipped on the stairs.

  - slug: health-modals
    title: 'Modal verbs: should, could, must, have to'
    minutes: 8
    items:
      - id: should-drink
        type: multipleChoice
        prompt: You should ___ warm tea.
        options:
          - { text: drink, correct: true }
          - {
              text: to drink,
              feedback: 'After a modal verb, use the base verb with no *to*: *should drink*.',
            }
          - { text: drinks, feedback: 'After a modal verb, the verb has no *-s*: *should drink*.' }
      - id: she-should
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: She should drink tea., correct: true }
          - {
              text: She shoulds drink tea.,
              feedback: "Modal verbs don't change for he / she / it: *she should*.",
            }
          - {
              text: She should to drink tea.,
              feedback: 'Use the base verb after *should*, with no *to*.',
            }
      - id: better-stay
        type: fillBlank
        prompt: Complete with the right form of *stay*.
        text: You'd better ___ at home today, and you shouldn't ___ up too late.
        blanks: [[stay], [stay]]
      - id: better-to
        type: trueFalse
        prompt: "*You'd better to stay home.* This sentence is correct."
        answer: false
        feedback:
          correct: "Right! The correct sentence is *You'd better stay home* (no *to*)."
          incorrect: "After *you'd better*, use the base verb with no *to*: *You'd better stay home*."
      - id: problem-advice
        type: matching
        prompt: Match each problem with the best advice.
        pairs:
          - [I never drink water., "You'd better drink lots of water."]
          - [I hurt my arm., You should rest your arm.]
          - [I'm always on my phone in bed., You might want to turn off your phone at night.]
          - [I never exercise., You could do some light exercise.]
      - id: no-s
        type: trueFalse
        prompt: "Modal verbs like *should* and *must* don't add *-s* for he / she / it."
        answer: true
        feedback:
          correct: 'Right! *He must rest. She should drink tea.*'
          incorrect: 'Modal verbs never change: *he must*, *she should* (not *musts, shoulds*).'
      - id: has-to
        type: multipleChoice
        prompt: He ___ take his medicine every day.
        options:
          - { text: has to, correct: true }
          - { text: have to, feedback: '*Have to* changes for he / she / it: *he has to*.' }
          - {
              text: musts,
              feedback: '*Must* never takes *-s*. You can say *he must* or *he has to*.',
            }
      - id: order-water
        type: reorderSentence
        prompt: Put the words in order.
        sentence: You should drink more water.
