          - { term: Doctor, gloss: רופא }
          - { term: Appointment, gloss: תור }
          - { term: Hospital, gloss: בית חולים }
          - { term: Medicine, gloss: תרופה }
          - { term: Pain, gloss: כאב }
          - { term: Sore throat, gloss: כאב גרון }
          - { term: Cold (illness), gloss: הצטננות }
          - { term: Headache, gloss: כאב ראש }
          - { term: Back pain, gloss: כאב גב }
          - { term: To sleep, gloss: לישון }
