    the sentences for correction.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: music-class
    title: 'Class: Music'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Music
      - id: skills
        type: cycleOverview
        skills:
          - name: Past simple vs. present simple
            description: 'Music memories and preferences: *I used to listen to pop. Now I listen to jazz.*'
          - name: Comparatives
            description: 'Comparing genres and artists: *older than, more popular than, the best*'
      - id: quizlet
        type: externalLink
        label: Music words on Quizlet
        url: https://quizlet.com/br/1106269216/conversational-english-music-updated-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        prompt: Introduce yourself in two short sentences.
        frame: I'm ___. In my opinion, the best kind of music is ___. I like listening to ___ when I ___.
        example: I'm Sarah. In my opinion, the best kind of music is jazz. I like listening to jazz when I cook or relax.
      - id: warmup-title
        type: heading
        level: 3
        text: Preparation questions
      - id: warmup-basic-title
        type: heading
        level: 4
        text: Basic (A2)
      - id: warmup-basic
        type: discussionQuestions
        items:
          - question: Do you like dancing? What music do you dance to?
            frame: Yes, I like dancing. I dance to ___. / No, I don't like dancing.
          - question: What was the last song you listened to?
            frame: The last song I listened to was ___ by ___.
          - question: Did you listen to music yesterday? What kind?
            frame: Yes, I listened to ___ yesterday. / No, I didn't listen to music yesterday.
          - question: Have you ever sung at a party or at school?
            frame: Yes, I have sung at ___. / No, I have never sung at a party.
          - question: What country do you think of when you hear the word *reggaeton* or *salsa*?
            frame: When I hear *reggaeton*, I think of ___.
          - question: What music do you listen to when you are happy? When you are sad?
            frame: When I'm happy, I listen to ___. When I'm sad, I listen to ___.
      - id: warmup-ext-title
        type: heading
        level: 4
        text: Extended (A2+ to B1)
      - id: warmup-ext
        type: discussionQuestions
        items:
          - question: What's a song that reminds you of a special moment in your life?
            frame: ___ reminds me of ___, because ___.
          - question: What's your favorite concert or live music experience?
            frame: My favorite concert was ___. I went there in ___ with ___.
          - question: Which song have you listened to hundreds of times?
            frame: I have listened to ___ hundreds of times.
          - question: How has your taste in music changed since you were a child?
            frame: When I was a child, I used to listen to ___, but now I prefer ___.
          - question: Which artist from another country do you like the most? Why?
            frame: I like ___ the most, because ___.
          - question: Is there a song that reminds you of a person or relationship?
            frame: ___ reminds me of my ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      - id: act1
        type: classActivity
        title: 'Activity 1: Yesterday and today in music'
        skills: [Past simple vs. present simple]
        minutes: 20
        steps:
          - 'Brainstorm with the group: What music did you listen to when you were a child? What kind of music do you like now?'
          - 'In pairs, interview your partner with the questions below.'
          - 'Share your answers with the group. Compare the past and the present.'
        example: |-
          *I used to listen to children's songs. Now I listen to rock music.*
          *When I was 10, I liked Shakira. Now I prefer Coldplay.*
          *Most people used to like pop, but now they prefer rock.*
      - id: act1-questions
        type: discussionQuestions
        title: Interview your partner
        items:
          - question: What was your favorite song when you were 10 years old?
            frame: When I was 10, my favorite song was ___.
          - question: Who was your favorite singer?
            frame: My favorite singer was ___.
          - question: Do you still like the same kind of music?
            frame: Yes, I still like ___. / No, I used to like ___, but now I prefer ___.
      - id: act1-tip
        type: callout
        tone: tip
        title: Grammar tip
        text: |-
          **used to + verb** → past habits: *I used to listen to rock.*
          **still / now** → the present: *Now I listen to jazz.*
      - id: act2
        type: classActivity
        title: 'Activity 2: A Day in the Life (past simple through music)'
        skills: [Past simple vs. present simple]
        minutes: 25
        steps:
          - 'Look at the verbs in the word bank. Which are irregular? What is the past form?'
          - Guess the missing verbs on the song worksheet, before you listen. Don't worry about being correct.
          - 'Listen to *A Day in the Life* (The Beatles) two times. The first time, just listen. The second time, fill in the missing verbs.'
          - Choose 5 verbs from the song and write mini-sentences about your life (use the frame below).
          - Tell your mini-story to a partner. Your partner asks one follow-up question.
          - Tell the group about your partner.
        example: |-
          *Yesterday I woke up late. I went to the bus stop. I drank coffee. I saw a friend. We spoke about our weekend.*
          *My partner woke up at 9, went to the gym and drank coffee with a friend.*
        wordBank:
          [
            be,
            blow,
            drag,
            drink,
            fall,
            find,
            go,
            grab,
            have,
            make,
            notice,
            read,
            see,
            speak,
            stand,
            stare,
            turn,
            wake,
          ]
        resource:
          label: A Day in the Life (The Beatles) on Genius
          url: https://genius.com/The-beatles-a-day-in-the-life-lyrics
      - id: act2-story
        type: discussionQuestions
        title: My mini-story
        items:
          - question: Yesterday I ___.
          - question: Then I ___.
          - question: After that I ___.
          - question: Finally, I ___.
          - question: I felt ___.
      - id: act2-followup
        type: discussionQuestions
        title: Follow-up questions for your partner
        answerable: false
        items:
          - question: Where did you go?
          - question: Who did you speak to?
          - question: How did you feel?
      - id: act3
        type: classActivity
        title: 'Activity 3: Musical biography'
        skills: [Past simple vs. present simple, Comparatives]
        minutes: 35
        steps:
          - 'Which famous English-speaking singers do you know? (*Adele, Ed Sheeran, Beyoncé, Taylor Swift, Bruno Mars…*)'
          - Read or find a short biography (4–5 lines) of one singer.
          - Present your singer to the group in 30 seconds.
          - In pairs, compare the singers.
        example: |-
          *Adele was born in London in 1988. Her most famous song is "Hello". Now she lives in Los Angeles and still sings soulful pop.*
          *Adele is older than Taylor Swift. Billie Eilish is the youngest singer in this group.*
      - id: act3-bio
        type: discussionQuestions
        title: My singer
        items:
          - question: ___ was born in ___ in ___.
          - question: His / Her first big song / most famous song is ___.
          - question: Now he / she sings ___ and is famous for ___.
          - question: ___ is older / younger / more popular than ___.
      - id: act4
        type: classActivity
        title: 'Activity 4: Guess the singer!'
        skills: [Past simple vs. present simple, Comparatives]
        minutes: 30
        steps:
          - Listen to your teacher's clues and guess the singer.
          - In pairs, choose an artist and prepare 3 clues (country, style, famous song).
          - Read your clues aloud. The others guess.
          - Compare two of the singers.
        example: |-
          *She was born in the U.S. Her style is pop. Her song "Shake It Off" is very famous.* → Taylor Swift!
          *Shakira is more energetic than Adele. Bruno Mars sings better than Justin Bieber.*
      - id: act4-clues
        type: discussionQuestions
        title: My 3 clues
        items:
          - question: He / She was born in ___.
          - question: His / Her style is ___.
          - question: His / Her most famous song is ___.
      - id: act5
        type: classActivity
        title: 'Activity 5: Musical memories'
        skills: [Past simple vs. present simple]
        steps:
          - Read the questions below.
          - Write 3 short sentences about your musical memories.
          - Share them with a partner.
        example: |-
          *The first concert I went to was a Coldplay concert in 2019.*
          *When I was a child, my parents played salsa at home.*
      - id: act5-questions
        type: discussionQuestions
        title: Musical memories
        items:
          - question: What was the first concert you went to?
            frame: The first concert I went to was ___.
          - question: What song reminds you of your childhood?
            frame: ___ reminds me of my childhood.
          - question: Did your parents play music at home?
            frame: Yes, my parents played ___ at home. / No, they didn't.
          - question: Did you play an instrument?
            frame: Yes, I played the ___. / No, I didn't play an instrument.
          - question: Did you watch music shows or talent shows on TV?
            frame: Yes, I watched ___. / No, I didn't.
      - id: act6
        type: classActivity
        title: 'Activity 6: The music interview show'
        skills: [Past simple vs. present simple, Comparatives]
        minutes: 30
        steps:
          - 'You are music journalists! Interview your partner about their music life: past, present and future.'
          - Choose or write 5 questions (5 minutes).
          - Interview each other and write down the key ideas (10 minutes).
          - Introduce your partner to the class (10 minutes).
          - 'Talk with the group: Which genres were the most popular in class? Which artists were the most common?'
        example: '*This is Leo. Today he listens to jazz, but before he liked rock. His favorite singer is Ed Sheeran, and he went to a concert last year.*'
      - id: act6-questions
        type: discussionQuestions
        title: Interview questions
        items:
          - question: What kind of music do you listen to now?
          - question: What music did you like as a child?
          - question: Have you ever been to a concert?
          - question: What's a song that makes you emotional?
          - question: Who is your favorite singer today?
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: **Past simple vs. present simple** (memories vs.
          preferences) and **Comparatives** (comparing genres and artists). This lesson is
          flexible: **do not try to complete all activities**, choose **2** for the
          group's level, energy and time. A2 (lower confidence): Activities 1 + 3. A2+
          (gaining fluency): Activities 1 + 2. B1 (comfortable speaking): Activities 2 +
          5. Mixed-level groups: Activities 4 + 6. Short class (45–50 min): Activity 2 only
          or Activity 3 only. Energetic class: Activity 4 + quick mini-presentations.
          Reflective / calm group: Activities 5 + 6.
      - id: n-moves
        anchor: null
        text: >-
          Timing: warm-up and preparation questions 15 minutes; each activity up to 25
          minutes; optional pair / group sharing or reflection 5 minutes. Model short
          sentences before students speak; encourage follow-up questions, not only
          answers; correct lightly and immediately, focusing on verb forms; keep students
          in pairs or small groups as much as possible. Useful prompts: "Tell me more." /
          "Why?" / "What happened next?"; "Before you liked ___, now you prefer ___.";
          "Don't worry about grammar right now, just speak."; "Try again using the past
          form: *went, saw, had*…"
      - id: n-intro
        anchor: intro
        text: >-
          Follow-up prompts: "Why do you like that kind of music?" "Do you usually listen
          to music alone or with friends?" "Do you ever go to concerts?"
      - id: n-warmup
        anchor: warmup-title
        minutes: 15
        text: >-
          Choose the Basic (A2) or Extended (A2+ to B1) questions for your group. Ask each
          student at least two questions. Answers typed here are visible to you below each
          question.
      - id: n-act1
        anchor: act1
        minutes: 20
        text: >-
          Brainstorm 5 minutes (write the two examples on the board), pair interviews 10
          minutes, group reflection 5 minutes.
      - id: n-act2
        anchor: act2
        minutes: 25
        text: >-
          Stage 1, verb activation (up to 6 min): irregular → was/were, blew, drank, fell,
          found, went, had, made, read (same spelling, different sound!), saw, spoke,
          stood, woke; regular → dragged, grabbed, noticed, stared, turned. Stage 2,
          predict (4 min): hand out your gapped lyric worksheet (not in the notebook);
          "Guessing helps your brain activate meaning." Stage 3, listening (up to 8 min):
          play the song twice; pause after each verse for slower groups. Stage 4, personal
          sentences (up to 15 min): model about yourself first. Stage 5, pair storytelling
          (up to 8 min). Optional reflection (2 min): "Are irregular verbs easier to
          remember with music?" (students usually say yes, which helps them remember). The
          stages add up to more than 25 minutes: shorten Stage 4 or 5 if needed. The song
          has a line about smoking and one often read as a drug reference; decide if it
          suits your group.
      - id: n-act3
        anchor: act3
        minutes: 35
        text: >-
          Input 5 minutes (write the singers' names on the board), bio cards 10 minutes,
          presentations 10 minutes, comparisons in pairs 10 minutes. Prepare short bio
          cards before class, or let students research one. Example card: "Ed Sheeran was
          born in England in 1991. His first big song was *The A-Team*. Now he sings pop
          and acoustic music. He's famous for writing emotional lyrics."
      - id: n-act4
        anchor: act4
        minutes: 30
        text: >-
          Warm-up 5 minutes: review country, style and famous song vocabulary ("He was born
          in Canada. He sings pop. His most famous song is *Sorry*." → Justin Bieber).
          Game 10 minutes: describe 5–6 artists without saying their names. Student
          challenge 15 minutes. Finish with comparisons.
      - id: n-act6
        anchor: act6
        minutes: 30
        text: Prepare questions 5 minutes, pair interviews 10 minutes, presentations 10 minutes, reflection 5 minutes.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: music-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-tenses
        type: ruleSummary
        skill: Past simple vs. present simple
        rules:
          - text: '**Present simple**: what you do or like now (habits and preferences). Subject + verb. With *he / she / it*, add **-s**.'
            examples:
              [I listen to pop music., She likes jazz., We usually play music while cooking.]
          - text: '**Past simple**: finished experiences in the past. Regular verbs add **-ed**; irregular verbs have their own past form (learn them by heart).'
            examples:
              [I went to a concert last month., They listened to rock when they were teenagers.]
          - text: '**Used to + base verb**: past habits that are not true now.'
            examples: [I used to listen to children's songs., He used to play the guitar.]
          - text: '**Past → present**: *used to* (past), **but now** + present simple, to show a change.'
            examples:
              - I used to love rock, but now I prefer jazz.
              - We used to watch music shows, but now we listen to podcasts.
          - text: '**Questions**: *do / does* + verb for the present; *did* + base verb for the past.'
            examples:
              - What kind of music do you listen to? (present)
              - What music did you like as a child? (past)
              - Do you go to concerts?
              - Did you play an instrument?
          - text: '**Opinions**: *I think (that)…*, *In my opinion,…*, *I prefer* + noun / verb-ing.'
            examples:
              [
                I think this song is beautiful.,
                'In my opinion, jazz is relaxing.',
                I prefer listening to live music.,
              ]
      - id: irregular-table
        type: table
        caption: Irregular verbs from the song activity
        header: [Verb, Past simple]
        rows:
          - [be, was / were]
          - [blow, blew]
          - [drink, drank]
          - [fall, fell]
          - [find, found]
          - [go, went]
          - [have, had]
          - [make, made]
          - [read, read (same spelling, different sound)]
          - [see, saw]
          - [speak, spoke]
          - [stand, stood]
          - [wake, woke]
      - id: regular-table
        type: table
        caption: Regular verbs from the song activity
        header: [Verb, Past simple]
        rows:
          - [drag, dragged]
          - [grab, grabbed]
          - [notice, noticed]
          - [stare, stared]
          - [turn, turned]
      - id: rules-comparatives
        type: ruleSummary
        skill: Comparatives
        rules:
          - text: '**Comparatives** show a difference between two things. Short adjectives: adjective + **-er** + *than*. Long adjectives: **more** + adjective + *than*.'
            examples:
              [Adele is older than Billie Eilish., K-pop is more popular than classical music now.]
          - text: '**Superlatives** show "the most". Short adjectives: **the** + adjective + **-est**. Long adjectives: **the most** + adjective.'
            examples:
              [
                Billie Eilish is the youngest singer in this group.,
                Ed Sheeran is the most famous singer in my country.,
              ]
          - text: '**Good** is irregular: good → **better** → **the best**. The adverb *well* also becomes *better*.'
            examples:
              [This is the best song on the album., Bruno Mars sings better than Justin Bieber.]
      - id: comparatives-table
        type: table
        caption: Comparatives and superlatives
        header: [Adjective, Comparative, Superlative]
        rows:
          - [old, older than, the oldest]
          - [young, younger than, the youngest]
          - [good, better than, the best]
          - [popular, more popular than, the most popular]
          - [famous, more famous than, the most famous]
          - [energetic, more energetic than, the most energetic]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both skills with the group and ask for one new example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: music-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: writing-title
        type: heading
        level: 3
        text: 'Part 1: Writing'
      - id: writing
        type: text
        text: 'Write 3 sentences in the present about your music habits today, 3 sentences in the past about your childhood music, and 1 comparison between two artists or genres. Then send them to Mori.'
      - id: mori-writing
        type: aiTutorPrompt
        title: Check my sentences
        intro: Fill in your 7 sentences, then send the message to Mori.
        message: |-
          Hi Mori! Here are my sentences about music. Please correct my mistakes.
          Today: ___. ___. ___.
          When I was a child: ___. ___. ___.
          Comparison: ___.
      - id: chat-title
        type: heading
        level: 3
        text: 'Part 2: Chat with Mori'
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-now
        type: aiTutorPrompt
        title: The music I like now
        message: Hi Mori! Please ask me questions about the music I like now. Correct my sentences when I make mistakes.
      - id: mori-past
        type: aiTutorPrompt
        title: My music experiences in the past
        message: Hi Mori! Please ask me questions about my music experiences in the past. Correct my sentences when I make mistakes.
      - id: creative-title
        type: heading
        level: 3
        text: 'Part 3: Optional creative task'
      - id: mori-playlist
        type: aiTutorPrompt
        title: The playlist of my life
        message: |-
          Hi Mori! Please help me make a playlist of my life: 1 song from my childhood, 1 from my teenage years and 1 from now.
          Ask me to write a short sentence about each song, and correct my mistakes.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: music-practice
    book: workbook
    title: 'Practice: Music'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practice the two skills of this cycle on your own. Each answer is checked right away, and you can try again.
      - id: ex-tenses
        type: activity
        activity: music-tenses
      - id: ex-comparatives
        type: activity
        activity: music-comparatives

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: music-vocabulary
    title: Vocabulary
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Music words
        glossLang: he
        link: https://quizlet.com/br/1106269216/conversational-english-music-updated-flash-cards/
        items: &music-words
          - { term: Genre, gloss: ז'אנר }
          - { term: Rhythm, gloss: קצב }
          - { term: Melody, gloss: מנגינה }
          - { term: Lyrics, gloss: מילים (של שיר) }
          - { term: Chorus, gloss: פזמון }
          - { term: Verse, gloss: בית (בשיר) }
          - { term: Beat, gloss: ביט / פעימת קצב }
          - { term: Tempo, gloss: טמפו / מהירות הקצב }
          - { term: Harmony, gloss: הרמוניה }
          - { term: Tune, gloss: לחן }
          - { term: Acoustic, gloss: אקוסטי }
          - { term: Live performance, gloss: הופעה חיה }
          - { term: Concert venue, gloss: מקום ההופעה }
          - { term: Stage presence, gloss: נוכחות על הבמה }
          - { term: Microphone, gloss: מיקרופון }
          - { term: Sound system, gloss: מערכת סאונד }
          - { term: Playlist, gloss: פלייליסט }
          - { term: Soundtrack, gloss: פסקול }
          - { term: Album, gloss: אלבום }
          - { term: Single, gloss: סינגל }
          - { term: Cover song, gloss: קאבר }
          - { term: Original song, gloss: שיר מקורי }
          - { term: Rehearsal, gloss: חזרה (מוזיקלית) }
          - { term: Audition, gloss: אודישן }
          - { term: Composer, gloss: מלחין }
          - { term: Arrangement, gloss: עיבוד }
          - { term: Collaboration, gloss: שיתוף פעולה }
          - { term: Influence, gloss: השפעה }
          - { term: Nostalgic, gloss: נוסטלגי }
          - { term: Energetic, gloss: אנרגטי }
          - { term: Expressive, gloss: אקספרסיבי / מביע רגש }
          - { term: Emotional connection, gloss: חיבור רגשי }

vocabulary:
  - slug: music
    title: Music
    items: *music-words

activities:
  - slug: music-tenses
    title: 'Past and present: music memories and preferences'
    minutes: 8
    items:
      - id: used-to
        type: multipleChoice
        prompt: I ___ listen to children's songs, but now I listen to rock.
        options:
          - { text: used to, correct: true }
          - {
              text: use to,
              feedback: 'For past habits, write *used to* + verb: *I used to listen…*',
            }
          - {
              text: am,
              feedback: '*I am listen* is not correct. For a past habit that is not true now, use *used to* + verb.',
            }
      - id: she-likes
        type: multipleChoice
        prompt: Now she ___ jazz.
        options:
          - { text: likes, correct: true }
          - {
              text: like,
              feedback: 'In the present simple, add *-s* with *he / she / it*: *she likes*.',
            }
          - {
              text: liking,
              feedback: 'In the present simple, use the verb + *-s* with *she*: *she likes*.',
            }
      - id: woke-went
        type: fillBlank
        prompt: Complete with the past simple of *wake* and *go*.
        text: Yesterday I ___ up late and ___ to the bus stop.
        blanks: [[woke], [went]]
      - id: irregular
        type: matching
        prompt: Match each verb with its past simple form.
        pairs:
          - [drink, drank]
          - [see, saw]
          - [speak, spoke]
          - [stand, stood]
          - [find, found]
      - id: readed
        type: trueFalse
        prompt: The past simple of *read* is *readed*.
        answer: false
        feedback:
          correct: 'Right! *Read* is irregular: the past is *read* (same spelling, different sound).'
          incorrect: '*Read* is irregular. The past is *read*: same spelling, different sound. *Readed* is not a word.'
      - id: concert
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: I went to a concert last month., correct: true }
          - {
              text: I go to a concert last month.,
              feedback: '*Last month* is finished time, so use the past simple: *went*.',
            }
          - {
              text: I goed to a concert last month.,
              feedback: '*Go* is irregular. The past simple is *went*.',
            }
      - id: do-did
        type: fillBlank
        prompt: Complete the questions with *do* or *did*.
        text: What kind of music ___ you listen to now? What music ___ you like as a child?
        blanks: [[do], [did]]
        wordBank: [do, did]
      - id: guitar
        type: reorderSentence
        prompt: Put the words in order.
        sentence: He used to play the guitar.

  - slug: music-comparatives
    title: Comparing artists and genres
    minutes: 8
    items:
      - id: older
        type: multipleChoice
        prompt: Adele is ___ than Billie Eilish.
        options:
          - { text: older, correct: true }
          - { text: more old, feedback: '*Old* is a short adjective: add *-er*. *older than*.' }
          - {
              text: the oldest,
              feedback: '*The oldest* is a superlative. With *than*, use the comparative: *older*.',
            }
      - id: more-popular
        type: multipleChoice
        prompt: K-pop is ___ than classical music now.
        options:
          - { text: more popular, correct: true }
          - {
              text: popularer,
              feedback: '*Popular* is a long adjective: use *more* + adjective. *more popular than*.',
            }
          - {
              text: most popular,
              feedback: '*Most* is for the superlative (*the most popular*). With *than*, use *more popular*.',
            }
      - id: youngest
        type: fillBlank
        prompt: Complete with the superlative of *young*.
        text: Billie Eilish is the ___ singer in this group.
        blanks: [[youngest]]
      - id: best
        type: fillBlank
        prompt: Complete with the superlative of *good*.
        text: This is the ___ song on the album.
        blanks: [[best]]
      - id: most-famous
        type: trueFalse
        prompt: 'We say *the most famous* (not *the famousest*), because *famous* is a long adjective.'
        answer: true
        feedback:
          correct: 'Right! Long adjectives use *the most*: *the most famous, the most popular*.'
          incorrect: 'Long adjectives like *famous* use *the most*: *Ed Sheeran is the most famous singer in my country.*'
      - id: forms
        type: matching
        prompt: Match each adjective with its comparative.
        pairs:
          - [old, older]
          - [young, younger]
          - [good, better]
          - [popular, more popular]
          - [energetic, more energetic]
      - id: sings-better
        type: multipleChoice
        prompt: Bruno Mars sings ___ than Justin Bieber.
        options:
          - { text: better, correct: true }
          - {
              text: gooder,
              feedback: '*Good* and *well* are irregular: the comparative is *better*.',
            }
          - {
              text: more good,
              feedback: '*Good* and *well* are irregular: the comparative is *better*.',
            }
      - id: kpop
        type: reorderSentence
        prompt: Put the words in order.
        sentence: K-pop is more popular than classical music.
