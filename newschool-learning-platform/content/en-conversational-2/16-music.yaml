  - >-
    Times given as ranges are recorded as the upper value: warm-up 10–15 → 15; each
    activity 15–25 → 25; Activity 2 18–25 → 25 (its stages: 4–6 → 6, 6–8 → 8, 10–15 → 15,
    5–8 → 8). The Activity 2 stages add up to about 43 minutes, more than the 25 minutes
