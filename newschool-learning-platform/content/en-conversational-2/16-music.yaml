# Cycle "Music", converted from the Conversational English level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-conversational-2
slug: music
title: Music
goal: Talk about music memories and preferences with past simple vs. present simple, and compare artists and genres.
position: 16
status: in_review

review:
  - >-
    The two workbook exercises ("Past and present: music memories and preferences" and
    "Comparing artists and genres") are NEW: the notebook has no self-study exercises.
    They were written from the cycle's summary rules, activity examples and vocabulary.
    Please check level, wording and every right answer before students see them.
  - >-
    Activity 2 uses the song "A Day in the Life" (The Beatles). No lyrics are copied
    here: the activity links to the song on genius.com (please check the link) and keeps
    only the verb word bank. The gapped lyric worksheet the activity needs is not in the
    notebook; the teacher must supply it. Note that the song has a line about smoking and
    a line usually read as a drug reference; please decide if it suits your group.
  - >-
    Teacher note "Activity Selection": the table's reasons do not match the activity
    numbers for three rows. The guessing game is Activity 4 (not 3) and the personal
    memory activity is Activity 5 (not 4). Fixed to: Mixed-level groups → Activities 4 +
    6; Energetic class → Activity 4 + quick mini-presentations; Reflective / calm group →
    Activities 5 + 6. Please confirm.
  - >-
    Summary, present simple: the source structure "Subject + verb (base form)" did not
    mention the -s for he / she / it, but its own example is "She likes jazz". A rule for
    -s was added. "Irregular: memorized" was reworded to "irregular verbs have their own
    past form (learn them by heart)".
  - >-
    Summary, comparatives and superlatives: the examples use "best" and the activities use
    "better", so the irregular forms good → better → the best were added to the rules,
    with a table built from the class examples (old, young, popular, famous, energetic).
  - >-
    Summary: an irregular-verb table was added from the Activity 2 verb list (be, blow,
    drink, fall, find, go, have, make, read, see, speak, stand, wake), with the regular
    verbs from the same list (drag, grab, notice, stare, turn) in a second table. The same
    list is the answer key for Activity 2, Stage 1.
  - >-
    The "Grammar focus" list at the top of the notebook is not repeated: its points are in
    the summary. "Opinion language" and "Question forms" are kept in the summary as
    extra rules for skill 1.
  - >-
    The garbled emoji in Activity 6 ("ð¤") was removed. The Quizlet link is kept without
    its tracking parameters (?i=…&x=…). Vocabulary terms were put in sentence case ("Live
