vocabulary:
  - slug: gossip
    title: Gossip
    items: *gossip-words

activities:
  - slug: gossip-past
    title: 'Past simple: heard, told, went'
    minutes: 8
    items:
      - id: heard
        type: multipleChoice
        prompt: Yesterday I ___ a rumor about my neighbor.
        options:
          - { text: heard, correct: true }
          - { text: heared, feedback: '*Hear* is an irregular verb. The past form is *heard*.' }
          - {
              text: hear,
              feedback: '*Hear* is present. With *yesterday*, use the past simple: *heard*.',
            }
      - id: went-saw
        type: fillBlank
        prompt: Complete with the past simple of *go* and *see*.
        text: Last weekend she ___ to a party and ___ her old friends.
        blanks: [[went], [saw]]
      - id: irregular
        type: matching
        prompt: Match each verb with its past simple form.
        pairs:
          - [go, went]
          - [see, saw]
          - [tell, told]
          - [hear, heard]
          - [have, had]
      - id: regular-ed
        type: trueFalse
        prompt: 'Regular verbs add *-ed* in the past simple: *talk → talked*.'
        answer: true
        feedback:
          correct: 'Right! *talk → talked, listen → listened, watch → watched*.'
          incorrect: 'Regular verbs add *-ed*: *talk → talked*.'
      - id: did-hear
        type: multipleChoice
        prompt: Which question is correct?
        options:
          - { text: Did you hear the news?, correct: true }
          - {
              text: Did you heard the news?,
              feedback: 'After *did*, use the base verb: *Did you hear…?*',
            }
          - {
              text: Do you heard the news?,
              feedback: 'For a question in the past, use *did* + the base verb: *Did you hear…?*',
            }
      - id: didnt-tell
        type: fillBlank
        prompt: Complete with the negative of *tell* in the past simple.
        text: Don't worry. Yesterday I ___ anyone your secret.
        blanks: [[didn't tell, did not tell]]
      - id: time-expression
        type: multipleChoice
        prompt: Which time expression goes with the past simple?
        options:
          - { text: two days ago, correct: true }
          - {
              text: tomorrow,
              feedback: '*Tomorrow* is the future. Past expressions: *yesterday, last week, two days ago*.',
            }
          - {
              text: next week,
              feedback: '*Next week* is the future. Past expressions: *yesterday, last week, two days ago*.',
            }
      - id: order-talked
        type: reorderSentence
        prompt: Put the words in order.
        sentence: We talked about celebrities online.

  - slug: gossip-comparisons
    title: 'Comparisons: more, less, as … as, the most'
    minutes: 8
    items:
      - id: more-fun
        type: multipleChoice
        prompt: Gossip is ___ fun than news.
        options:
          - { text: more, correct: true }
          - {
              text: most,
              feedback: '*The most* is for the top of a group. With *than*, use *more*.',
            }
          - {
              text: as,
              feedback: '*As* goes with *as*: *as fun as*. With *than*, use *more* or *less*.',
            }
      - id: than-as
        type: fillBlank
        prompt: Complete with *than* or *as*.
        text: I'm less dramatic ___ my friend. Celebrity gossip is as common ___ school gossip.
        blanks: [[than], [as]]
        wordBank: [than, as]
      - id: the-most
        type: multipleChoice
        prompt: That was ___ interesting story today.
        options:
          - { text: the most, correct: true }
          - { text: most, feedback: 'The superlative needs *the*: *the most interesting*.' }
          - {
              text: more,
              feedback: '*More* compares two things and needs *than*. For the top of a group, use *the most*.',
            }
      - id: types
        type: matching
        prompt: Match each type with its example.
        pairs:
          - [Superiority (+), Gossip is more fun than news.]
          - [Inferiority (−), I'm less dramatic than my friend.]
          - [Equality (=), Celebrity gossip is as common as school gossip.]
          - [Superlative, That was the most interesting story today.]
      - id: as-as-same
        type: trueFalse
        prompt: '*As … as* means the two things are the same.'
        answer: true
        feedback:
