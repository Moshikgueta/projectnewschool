# Cycle "Past Experiences", converted from the Conversational English level 2
# digital notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-conversational-2
slug: past-experiences
title: Past Experiences
goal: Talk about past experiences with the past simple and the present perfect.
position: 1
status: in_review

review:
  - >-
    The two workbook exercises ("Past simple" and "Present perfect") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's summary
    rules, the activity examples and the irregular verbs table. Please check level,
    wording and every right answer before students see them.
  - >-
    Summary, comparison table: the source says the present perfect is used when "the
    time is not finished". For life experiences (the use taught here) the point is
    that we do not say when it happened. The row now reads "We don't say when (some
    time before now)". Please confirm.
  - >-
    Activity 2 ("I never…"): the source examples use "I never + past simple" (I never
    ate sushi), but the Remember box and the summary teach the present perfect (I
    have never eaten sushi). Both are kept: the past simple form as the basic option
    and the present perfect as the extra challenge. The reaction "I skied!" was
    changed to "I have! / I did!", and "If you haven't" to "If you haven't done it
    either", so the reactions match the statement.
  - >-
    Activity 4: the pictures are on a gamma.app page and Activity 5 uses a wordwall.net
    wheel. Neither host is on the link allow-list, so the links were removed and the
    resources are mentioned in teacher notes. The Activity 5 wheel could be rebuilt on
    wheelofnames.com.
  - >-
    Activity 5 question-word list: "Which - comparison" → "Which - a choice"; "How -
    action, how to do something" → "How - the way you do something"; "Do/Did -
    action" → "Did - yes / no questions about an action".
  - >-
    Small corrections: "Intoduction round" → "Introduction round"; stray asterisks and
    broken bold were removed; "Best Part / Funny Moment" → "Best part / Funny moment"
    in the vocabulary. The Quizlet link is kept without its "?new" parameter.
  - >-
    Activity 3 word bank (be, have, do, say, go, can, get, make, know, think, take,
    see, come, want) is kept as in the source. Note that "can" has no past participle
    (its past is "could").
  - >-
    The source gives no times for the activities and no lesson plan, so no minutes
    were added; the plan note (which activity practises which skill) was written from
    the activity objectives. The A2- / A2+ and "Basic option / Extra challenge" tasks
    are kept as level callouts. The "Student 1/2/3" and "Answer of student 1/2/3"
    lines are replaced by the optional answer boxes (decision C2).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: past-experiences-class
    title: 'Class: Past Experiences'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Past Experiences
      - id: skills
        type: cycleOverview
        skills:
          - name: Past simple
            description: Finished actions at a specific time (*I went to Italy last year.*)
          - name: Present perfect
            description: Life experiences, and the difference from the past simple (*I have been to Italy.*)
      - id: quizlet
        type: externalLink
        label: Past Experiences on Quizlet
        url: https://quizlet.com/br/1106308573/conversational-english-past-experiences-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        prompt: Say 2 short sentences about your recent past.
        frame: Yesterday I ___. / Last weekend I ___. / Two days ago I ___.
        example: Yesterday I cooked dinner. Last weekend I visited my parents.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup-basic-title
        type: heading
        level: 4
        text: Beginner level
      - id: warmup-basic
        type: discussionQuestions
        items:
          - question: What did you do last weekend?
            frame: Last weekend I went to… / ate… / watched…
          - question: What time did you wake up yesterday?
            frame: Yesterday I woke up at…
          - question: What did you eat for your last meal?
            frame: For my last meal, I ate…
          - question: What places did you visit last month?
            frame: Last month I visited…
          - question: What was the last thing you bought in a store?
            frame: The last thing I bought was…
          - question: What did you learn at school (or in a course) last week?
            frame: Last week I learned…
      - id: warmup-inter-title
        type: heading
        level: 4
        text: Intermediate level
      - id: warmup-inter
        type: discussionQuestions
        items:
          - question: What was the last movie or series you watched, and what did you think about it?
            frame: The last movie I watched was… and I thought it was…
          - question: What did you do yesterday evening, and who were you with?
            frame: Yesterday evening I… and I was with…
          - question: What country did you travel to on your last vacation, and what was the best part of the trip?
            frame: I traveled to… and the best part was…
          - question: What was the most interesting thing you learned recently at school, at work or in a course?
            frame: I learned… and I liked it because…
          - question: What was your best experience last month, and why was it special?
            frame: My best experience was… because…
          - question: What was the funniest thing you did last week, and who did you share it with?
            frame: Last week I… with… and it was very funny.
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: What did you do yesterday?'
        skills: [Past simple]
        steps:
          - Write three short sentences about things you did yesterday.
          - 'In pairs: Student A says one sentence. Student B asks a question in the past simple. Switch roles after each sentence.'
          - Compare with your partner. Did you do similar or different things?
          - Report to the group what your partner did. Use the third person (*he / she*).
          - 'Optional challenge: write a short paragraph (4–5 sentences) about your day yesterday, with details and connectors.'
        example: |-
          *A: Yesterday I cooked pasta.*
          *B: What did you cook yesterday?*
          *I watched a movie too. / I didn't cook; I ate at a restaurant.*
          *My partner cooked pasta and watched a movie.*
      - id: act1-levels
        type: callout
        tone: info
        title: By level
        text: |-
          **A2−:** Short, simple sentences with one verb (*Yesterday I went to the supermarket.*). Ask one simple question. Say if you did the same or something different.
          **A2+:** Add details: where, who, why or when (*Yesterday I went to the supermarket with my sister after work.*). Ask one or two follow-up questions (*Where did you cook? Who were you with?*). Use connectors: *and, but, because, after that, then*.
      - id: act1-sentences
        type: discussionQuestions
        title: Three things I did yesterday
        items:
          - question: Yesterday I ___.
          - question: Yesterday I ___.
          - question: Yesterday I ___.
      - id: act1-compare
        type: discussionQuestions
        title: Compare and report
        items:
          - question: 'Similarity: ___'
            frame: I ___ too.
          - question: 'Difference: ___'
            frame: I didn't ___; I ___.
          - question: 'My partner ___.'
            frame: My partner ___ and ___.
          - question: 'Optional challenge: my day yesterday'
            frame: Yesterday I ___. Then I ___. After that, ___.
      - id: act1-remember
        type: callout
        tone: tip
        title: Remember
        text: |-
          Use **did** for questions: *What did you do yesterday?*
          Use **didn't** for negatives: *I didn't go out.*
          Add **-ed** to regular verbs: *watched, cooked, studied.*
          Learn the irregular forms: *go → went, eat → ate, see → saw.*
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Activity 2: I never…'
        skills: [Present perfect, Past simple]
        steps:
          - Think of two or three things you have never done in your life. Write one sentence for each.
          - Take turns sharing your sentences with the whole group. After each sentence, the class reacts.
          - If you **have** done it, say *I have! / I did!* If you haven't done it either, say *Me neither!*
          - After everyone has shared, write two short sentences about what you discovered.
        example: |-
          *A: I have never skied.*
          *B: I have! I skied in France last winter.*
          *C: Me neither!*
          *Most people in the class traveled by plane. Nobody went skydiving.*
      - id: act2-levels
        type: callout
        tone: info
        title: By level
        text: |-
          **Basic option:** Short, simple sentences (*I never ate sushi.*) and short reactions (*I did! / Me neither!*).
          **Extra challenge:** Use the present perfect and add a reason (*I have never eaten sushi because I don't like raw fish.*). Ask one follow-up question (*When did you try it? Where? Why?*). In your reflection, use connectors or report about a classmate (*My classmate ate sushi but didn't try surfing.*).
      - id: act2-sentences
        type: discussionQuestions
        title: I never…
        items:
          - question: I have never ___.
          - question: I have never ___.
          - question: I have never ___.
          - question: 'What I discovered: ___'
            frame: Most people in the class ___. / Nobody ___.
      - id: act2-remember
        type: callout
        tone: tip
        title: Remember
        text: |-
          Use **have / has + past participle** for experiences: *I have tried sushi. He has never gone camping.*
          Use the **past simple** for specific times: *I tried sushi last year.*
          Use **never** for things you haven't done: *I have never traveled alone.*
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Activity 3: The last time I…'
        skills: [Past simple, Present perfect]
        steps:
          - Complete the sentences below with your own ideas. Think about the last time you did each activity.
          - Take turns sharing one sentence with the group. The others react or ask short questions.
          - After everyone has shared, write two short sentences about what you learned from your classmates.
        example: |-
          *A: The last time I cooked was on Sunday.*
          *B: What did you cook?*
          *C: Who did you cook with?*
          *My classmate went to the beach last summer.*
        wordBank: [be, have, do, say, go, can, get, make, know, think, take, see, come, want]
      - id: act3-levels
        type: callout
        tone: info
        title: By level
        text: |-
          **Basic option:** Short sentences with one detail (*The last time I traveled was last year.*). Ask one short question (*What did you do?*).
          **Extra challenge:** Add more information: where, who with, why, what happened (*The last time I traveled was last year. I went to Italy with my sister.*). Ask two questions, or comment with your own experience (*I did that too last week!*).
      - id: act3-sentences
        type: discussionQuestions
        title: The last time I…
        items:
          - question: The last time I cooked was ___.
          - question: The last time I watched a movie was ___.
          - question: The last time I traveled was ___.
          - question: The last time I went on a date was ___.
          - question: The last time we were at a family dinner was ___.
          - question: 'What I learned about my classmates: ___'
            frame: My classmate ___ last ___, and she / he said ___.
      - id: act3-remember
        type: callout
        tone: tip
        title: Remember
        text: |-
          Use the **past simple** for finished actions: *I went to the park. She cooked dinner yesterday.*
          Use **time expressions**: *yesterday, last week, two days ago, in 2019.*
          Add details to make your story interesting: *who, where, what and when.*
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Activity 4: Stories in three pictures'
        skills: [Past simple]
        steps:
          - Look at the three pictures your teacher shows. Think how you can connect them in a short story.
          - Write one sentence for each picture, or connect them into a short story with *and, then, after that, because, but*.
          - Tell your story to the class. Listen to the other stories.
          - After everyone has shared, write two short sentences about another student's story.
        example: |-
          *Pictures: a beach | a restaurant | a party*
          *Last summer I went to the beach with my friends. Then we ate dinner at a restaurant, and after that we went to a big party.*
      - id: act4-levels
        type: callout
        tone: info
        title: By level
        text: |-
          **Basic option:** One short sentence for each picture (*I went to the beach. I ate at a restaurant. I danced at a party.*). Read your sentences clearly.
          **Extra challenge:** Tell your story without reading and add a detail or a feeling (*It was an amazing day, and we were all very tired at the end.*). In your reflection, say what you liked (*I liked her story because it was funny and easy to understand.*).
      - id: act4-sentences
        type: discussionQuestions
        title: My story
        items:
          - question: 'Picture 1: ___'
          - question: 'Picture 2: ___'
          - question: 'Picture 3: ___'
          - question: "Another student's story: ___"
            frame: My classmate went to ___ and ___. / His / Her story was about ___.
      - id: act4-remember
        type: callout
        tone: tip
        title: Remember
        text: |-
          Past simple verbs: *went, saw, ate, visited, danced, studied, played.*
          Time expressions: *yesterday, last weekend, two days ago.*
          Connectors make your story flow: *and, then, after that, because, but.*
      # Activity 5
      - id: act5
        type: classActivity
        title: 'Activity 5: What did I do when?'
        skills: [Past simple]
        steps:
          - Choose a question word from the list below and spin the wheel.
          - Build a past simple question with your question word and what the wheel chose. Ask another student.
          - The student who answered spins the wheel next.
        example: '*Where + last weekend → Where did you go last weekend?*'
      - id: act5-words
        type: table
        caption: Question words
        header: [Question word, Asks about]
        rows:
          - [Who, people]
          - [What, an action or a thing]
          - [Where, a place]
          - [How, the way you do something]
          - [When, a time]
          - [Which, a choice]
          - [Why, a reason]
          - [Did, yes / no questions about an action]
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: the **past simple** (introduction round, warm-up,
          Activities 1, 4 and 5) and the **present perfect** and its difference from the
          past simple (Activities 2 and 3). Choose the warm-up questions for your group's
          level (beginner or intermediate).
      - id: n-warmup
        anchor: warmup-title
        text: Ask each student at least two questions. Answers typed here are visible to you below each question.
      - id: n-act1
        anchor: act1
        text: >-
          Students practise the 1st person (*I cooked*), the 2nd person (*What did you
          cook?*) and the 3rd person (*My partner cooked*). The optional paragraph can be
          homework. Model: *Yesterday I went to the supermarket and bought some food.
          Then I cooked dinner with my sister. After that, we watched a movie and talked
          until midnight.*
      - id: n-act2
        anchor: act2
        text: >-
          Accept *I never ate sushi* from beginners; ask intermediate students for the
          present perfect (*I have never eaten sushi*). Point out the switch to the past
          simple when they give a time: *I have tried sushi. I tried it last year.*
      - id: n-act4
        anchor: act4
        text: >-
          The pictures for this activity are on the old notebook's gamma.app page (not on
          the link allow-list). Show them on screen, or choose three pictures yourself
          (for example: a beach, a restaurant, a party).
      - id: n-act5
        anchor: act5
        text: >-
          The original wheel is a Wordwall resource (wordwall.net/resource/68822061),
          which is not on the link allow-list. Share it on screen, or rebuild it on
          wheelofnames.com with time expressions and actions (last weekend, yesterday,
          eat, travel…).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: past-experiences-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-past-simple
        type: ruleSummary
        skill: Past simple
        rules:
          - text: 'We use the **past simple** for **finished actions** at a **specific time** in the past.'
            examples: [I watched a movie yesterday., We went to the park last weekend.]
          - text: '**Form:** subject + past verb. Regular verbs add **-ed** (*watched, cooked, studied*); irregular verbs have their own form (*go → went*).'
          - text: "**Negative:** *didn't* + base verb."
            examples: [I didn't go to school yesterday.]
          - text: '**Question:** *Did* + subject + base verb?'
            examples: [Did you study English last night?, What did you do yesterday?]
          - text: '**Time expressions:** yesterday, last week, two days ago, in 2019, when I was a child.'
      - id: rules-present-perfect
        type: ruleSummary
        skill: Present perfect
        rules:
          - text: "We use the **present perfect** for **life experiences**: things that happened some time before now. We **don't say when**."
            examples: [I have visited Paris., She has never eaten sushi.]
          - text: '**Form:** *have / has* + past participle.'
          - text: "**Negative:** *haven't / hasn't* + past participle."
            examples: [I haven't tried sushi.]
          - text: '**Question:** *Have / Has* + subject + past participle?'
            examples: [Have you ever traveled by train?]
          - text: '**Time expressions:** ever, never, before, already, yet, in my life.'
      - id: difference-table
        type: table
        caption: Past simple or present perfect?
        header: [Past simple, Present perfect]
        rows:
          - [Talks about a **specific time**, Talks about a **life experience**]
          - ['*I went to Italy last year.*', '*I have been to Italy.*']
          - ['Uses words like *yesterday, last week*', 'Uses words like *ever, never*']
          - [The time is **finished** and we say when, We **don't say when** (some time before now)]
      - id: irregular-table
        type: table
        caption: Common irregular verbs
        header: [Base form, Past, Past participle]
        rows:
          - [go, went, gone]
          - [eat, ate, eaten]
          - [see, saw, seen]
          - [do, did, done]
          - [have, had, had]
          - [make, made, made]
          - [take, took, taken]
          - [be, was / were, been]
      - id: rules-connectors
        type: ruleSummary
        skill: Connectors
        rules:
          - text: 'Connect the ideas in a story with *and, but, because, then, after that, so*.'
            examples: ['I went to the beach, and then we had dinner at a restaurant.']
      - id: quick-rules
        type: callout
        tone: info
        title: Quick rules
        text: |-
          Say **when** it happened? Use the past simple: *I went to Italy last year.*
          Talk about your **experience**? Use the present perfect: *I have been to Italy.*
          Use **connectors** to make your story sound natural: *I went to the park, then I met my friend.*
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both skills with the group and ask for one new example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: past-experiences-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Message 1: Talking about yesterday'
        message: |-
          Hi Mori! I want to practice the past simple.
          Please ask me 5 easy questions about what I did yesterday, for example: What did you eat? Where did you go? Who did you see?
          I'll answer, and please correct my sentences.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Message 2: Life experiences'
        message: |-
          Hi Mori! Let's practice the present perfect.
          Ask me 5 questions about my life experiences, for example: Have you ever traveled by train? Have you ever eaten sushi?
          Correct my answers if I make mistakes.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Message 3: My short story'
        intro: 'Then write your story. Example: *I went to the park, then I met my friends, and after that we had pizza.*'
        message: |-
          Hi Mori! I'll tell you a short story about what I did last weekend.
          Please check if my sentences and connectors (and, then, after that) are correct.
      - id: mori-4
        type: aiTutorPrompt
        title: 'Message 4: I have never…'
        intro: 'Then write your three sentences. Example: *I have never traveled alone.*'
        message: |-
          Hi Mori! I'll tell you three things I have never done.
          Please correct my sentences and ask me one follow-up question for each.
      - id: mori-5
        type: aiTutorPrompt
        title: 'Message 5: Final reflection'
        intro: 'Then write your paragraph. Example: *Last month I visited Rio with my friends. I have never visited the Amazon, but I would love to go one day.*'
        message: |-
          Hi Mori! I'll write a short paragraph about one thing I did recently and one experience I have never had.
          Please correct my sentences and ask me one question about my paragraph.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: past-experiences-practice
    book: workbook
    title: 'Practice: Past Experiences'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. Each answer is checked right away, and you can try again.
      - id: ex-past-simple
        type: activity
        activity: past-experiences-past-simple
      - id: ex-present-perfect
        type: activity
        activity: past-experiences-present-perfect

