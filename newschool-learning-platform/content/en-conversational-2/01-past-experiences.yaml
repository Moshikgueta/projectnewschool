vocabulary:
  - slug: past-experiences
    title: Past Experiences
    items: *past-experiences-words

activities:
  - slug: past-experiences-past-simple
    title: "Past simple: I went, I didn't go, Did you go?"
    minutes: 8
    items:
      - id: went
        type: multipleChoice
        prompt: Yesterday I ___ to the supermarket.
        options:
          - { text: went, correct: true }
          - {
              text: go,
              feedback: '*Go* is the present. With *yesterday* we use the past simple: *went*.',
            }
          - {
              text: have gone,
              feedback: 'With a specific time like *yesterday*, use the past simple, not the present perfect.',
            }
      - id: didnt-go
        type: fillBlank
        prompt: Write the negative of *go* in the past simple.
        text: I ___ to school yesterday. I was sick.
        blanks: [["didn't go", did not go]]
      - id: irregular
        type: matching
        prompt: Match each verb with its past simple form.
        pairs:
          - [go, went]
          - [eat, ate]
          - [see, saw]
          - [take, took]
          - [make, made]
      - id: did-you-study
        type: multipleChoice
        prompt: Which question is correct?
        options:
          - { text: Did you study English last night?, correct: true }
          - {
              text: Did you studied English last night?,
              feedback: 'After *did*, use the base verb: *Did you study…?*',
            }
          - {
              text: You did study English last night?,
              feedback: 'In a question, *did* comes before the subject: *Did you study…?*',
            }
      - id: ed-regular
        type: trueFalse
        prompt: 'Regular verbs add *-ed* in the past simple: *watch → watched, cook → cooked*.'
        answer: true
        feedback:
          correct: Right! *watched, cooked, studied* are regular verbs.
          incorrect: 'Regular verbs add *-ed*: *watched, cooked*. Irregular verbs change (*go → went*).'
      - id: what-did
        type: fillBlank
        prompt: Complete the question.
        text: 'A: Yesterday I cooked pasta. B: What ___ you cook yesterday?'
        blanks: [[did]]
      - id: partner-cooked
        type: multipleChoice
        prompt: 'Your partner says: *Yesterday I cooked pasta.* Tell the group: My partner ___ pasta yesterday.'
        options:
          - { text: cooked, correct: true }
          - {
              text: cook,
              feedback: '*Cook* is the present. The action is finished, so use *cooked*.',
            }
          - { text: cooks, feedback: '*Cooks* is the present simple. For yesterday, use *cooked*.' }
      - id: order-park
        type: reorderSentence
        prompt: Put the words in order.
        sentence: We went to the park last weekend.

  - slug: past-experiences-present-perfect
    title: 'Present perfect: I have never eaten sushi'
    minutes: 8
    items:
      - id: have-ever
        type: multipleChoice
        prompt: ___ you ever traveled by train?
        options:
          - { text: Have, correct: true }
          - { text: Has, feedback: '*Has* is for *he, she, it*. For *you*, use *have*.' }
          - {
              text: Did,
              feedback: '*Traveled* here is a past participle, so we need *have*: *Have you ever traveled…?*',
            }
      - id: last-year
        type: multipleChoice
        prompt: I went to Italy ___.
        options:
          - { text: last year, correct: true }
          - {
              text: ever,
              feedback: '*Ever* goes with the present perfect in questions: *Have you ever been to Italy?*',
            }
          - {
              text: yet,
              feedback: "*Yet* goes with the present perfect: *I haven't been to Italy yet.*",
            }
      - id: eaten
        type: fillBlank
        prompt: Write the past participle of *eat*.
        text: She has never ___ sushi.
        blanks: [[eaten]]
      - id: havent-tried
        type: fillBlank
        prompt: Write the negative of *try* in the present perfect.
        text: I ___ sushi. Is it good?
        blanks: [["haven't tried", have not tried, have never tried]]
      - id: participles
        type: matching
        prompt: Match each verb with its past participle.
        pairs:
          - [go, gone]
          - [eat, eaten]
          - [see, seen]
          - [do, done]
          - [take, taken]
      - id: say-when
        type: trueFalse
        prompt: 'When you say **when** something happened (*last year, yesterday*), you use the present perfect.'
        answer: false
        feedback:
          correct: Right! With a specific time, use the past simple. *I went to Italy last year.*
          incorrect: 'With a specific time, use the past simple: *I went to Italy last year.* The present perfect has no time: *I have been to Italy.*'
      - id: tried-last-year
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: I tried sushi last year., correct: true }
          - {
              text: I have tried sushi last year.,
              feedback: '*Last year* is a specific time, so use the past simple: *I tried*.',
            }
          - {
              text: I try sushi last year.,
              feedback: '*Try* is the present. For last year, use *tried*.',
            }
      - id: order-ever
        type: reorderSentence
        prompt: Put the words in order.
        sentence: Have you ever eaten sushi?
