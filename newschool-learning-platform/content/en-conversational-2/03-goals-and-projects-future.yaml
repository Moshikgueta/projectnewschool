# Cycle "Goals and Projects: Future", converted from the Conversational English
# level 2 digital notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see
# `review` below. Blocks without `lang` are in the course language (English).
course: en-conversational-2
slug: goals-and-projects-future
title: 'Goals and Projects: Future'
goal: Talk about your goals with will and going to, and with future time clauses (when / after + present simple).
position: 3
status: in_review

review:
  - >-
    The two workbook exercises ("Will and going to" and "Future time clauses") are
    NEW: the notebook has no self-study exercises. They were written from the cycle's
    summary rules, the warm-up frames and its vocabulary. Please check level, wording
    and every right answer before students see them.
  - >-
    Summary: the source lists two skills (future simple will / going to, and future
    time clauses with when / after + present simple) but the summary only explains
    will and going to. A rule for the time clauses was added from the warm-up frames
    (*When I achieve my goal, I will travel. I'm going to celebrate after I achieve my
    goal.*): after *when / after / before* we use the present simple, not *will*. The
    workbook uses it. Please confirm.
  - >-
    Homework: the source homework is three written tasks (answer questions, write a
    paragraph, read a passage and answer questions), with no Mori messages. They were
    turned into three Mori messages that contain the same tasks, so Mori can correct
    the answers. The source asks for "future simple" but its example paragraph also
    uses *going to*, so the messages say "will or going to".
  - >-
    Corrections: "Goals and projets" → "Goals and projects"; warm-up frame "My goal is
    to ___ when I achieve my goal, I will ___" → two sentences; "My ___ is going to
    celebrate with me my goal" → "My ___ is going to celebrate my goal with me";
    Activity 2 "We are going to create you a ___" → "We are going to create a ___ for
    you", and "present to the group they will create" → "present your invention to
    the other group"; Activity 3 "Stage ½ / Stage ⅔" → Stages 2 and 3, "guide their
    student" → "guide the students"; "Let´s" → "Let's". In the Activity 1 example the
    steps were made full sentences with *I will* to match the frame "I will start
    to…".
  - >-
    Summary rule 3: "or when something is about to happen" was made clearer: "or when
    you can see that something is going to happen (*Look at the clouds! It's going to
    rain.*)". The Quick Summary line for going to was broken by stray formatting and
    was rebuilt.
  - >-
    The second introduction example ("I am Florencia. I would like to be a… because…")
    has no frame in the source; it is kept as an optional second sentence.
  - >-
    Vocabulary: "Travel לטייל" → "לנסוע / לטייל". The Quizlet link is kept without its
    "?new" parameter. Activity 2 time "10/15 minutes" is recorded as 15 (plus up to 5
    minutes per presentation). The other activities have no times in the source. The
    "Answer of student 1/2/3" lines are replaced by the optional answer boxes
    (decision C2). The cycle has no beginner / intermediate split.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: goals-and-projects-future-class
    title: 'Class: Goals and Projects'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Goals and Projects: Future'
      - id: skills
        type: cycleOverview
        skills:
          - name: Will and going to
            description: Decisions, predictions and plans (*I will help you. I'm going to join the gym.*)
          - name: Future time clauses
            description: '*when / after* + present simple (*When I achieve my goal, I will travel.*)'
      - id: quizlet
        type: externalLink
        label: Goals and projects on Quizlet
        url: https://quizlet.com/il/983036999/goals-and-projects-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I am ___. When I was ___, my goal was to ___. (Now I would like to be a ___ because ___.)
        example: I am Florencia. When I was 18, my goal was to be a psychologist.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: What is your goal? What will you do when you achieve your goal?
            frame: My goal is to ___. When I achieve my goal, I will ___.
          - question: What are you going to do to achieve your goal?
            frame: My goal is to ___. This / Next ___ (day of the week), I'm going to ___.
          - question: How are you going to feel when you achieve your goal? Why?
            frame: I'm going to feel ___ when I achieve my goal, because ___.
          - question: What are you going to do after you achieve your goal?
            frame: I'm going to ___ after I achieve my goal.
          - question: Who is going to celebrate your goal with you?
            frame: My ___ is going to celebrate my goal with me.
          - question: Where are you going to celebrate?
            frame: We are going to celebrate at ___. We will eat ___. We will drink ___.
      - id: warmup-examples
        type: callout
        tone: info
        title: Examples
        text: |-
          *My goal is to speak English fluently. When I achieve my goal, I will travel to Australia and ask locals about their lifestyle.*
          *I'm going to feel happy when I achieve my goal.*
          *I'm going to celebrate with my friends after I achieve my goal.*
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: My vision for my goal'
        skills: [Will and going to]
        steps:
          - 'If we want to make something happen, we need to set dates for each step. The secret is in the small steps.'
          - 'Make a list of 10 steps to your goal, with a date for each step. Start with *I will start to…* and finish with *Got it!*'
          - The path in the middle is the most important part! Share your list with the group.
        example: |-
          **Goal:** Learn to play the guitar.
          1. I will start to learn basic chords by watching online tutorials. (January 10)
          2. I will practice the chords for 15 minutes every day. (January 11–25)
          3. I will learn one simple song with the basic chords. (January 26–31)
          4. I will buy a beginner's guitar book or download an app. (February 1)
          5. I will practice finger exercises for 30 minutes twice a week. (February 2–28)
          6. I will record myself to track my progress. (March 1–15)
          7. I will learn to read basic guitar tabs. (March 16–30)
          8. I will play two songs without stopping. (April 1–15)
          9. I will join a local or online guitar group for feedback. (April 16–30)
          10. Got it! I will play my first mini performance for my family and friends. (May 1)
      - id: act1-steps
        type: discussionQuestions
        title: My 10 steps
        items:
          - question: 'My goal: ___'
          - question: 1. I will start to ___. (date)
          - question: 2. I will ___. (date)
          - question: 3. I will ___. (date)
          - question: 4. I will ___. (date)
          - question: 5. I will ___. (date)
          - question: 6. I will ___. (date)
          - question: 7. I will ___. (date)
          - question: 8. I will ___. (date)
          - question: 9. I will ___. (date)
          - question: 10. Got it! I will ___. (date)
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Activity 2: My gift to your goal, my friend'
        skills: [Will and going to]
        minutes: 20
        steps:
          - Work in groups with similar goals.
          - 'Think of an invention for the other group: something that will help them get closer to their goal. Machines, robots, programs: everything is possible! Discuss your ideas and create it; you can draw it too (15 minutes).'
          - Present your invention to the other group (up to 5 minutes), with the sentences below.
        example: |-
          **Goal:** Travel to Alaska
          *We are going to create a "Polar Explorer Penguin Drone" for you: a flying penguin robot that helps you with all your travel plans.*
          *It will help people to organize their trips, find the best places to visit, and track their flights and hotels.*
          *But especially for you, it will help you to prepare for your trip to Alaska: it will remind you to pack warm clothes and tell you fun facts about Alaska.*
      - id: act2-frame
        type: discussionQuestions
        title: Our invention
        items:
          - question: We are going to create a ___ for you.
          - question: It will help people to ___.
          - question: But especially for you, it will help you to ___.
      # Activity 3
      - id: act3
        type: classActivity
        title: "Activity 3: Let's visualize our vision"
        skills: [Will and going to, Future time clauses]
        steps:
          - '(Optional) Imagine your future self: close your eyes and picture yourself after you achieve your goal. How do you feel? What does your life look like? Who is there with you?'
          - 'Step into that version of you: pretend you **are** your future self. How do you stand, talk and feel now that you have succeeded?'
          - 'Write a letter from "Future Me" to "Past Me" (you today). Say how you feel, who supports you, and the things you had to do to get there.'
      - id: act3-letter
        type: discussionQuestions
        title: A letter from my future self
        items:
          - question: You will feel ___.
          - question: You will be surrounded by ___.
          - question: 1. You will start by ___.
          - question: 2. You will learn to ___.
          - question: 3. You will make sure to ___.
          - question: 4. You will focus on ___.
          - question: 5. You will remember to ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: **will and going to** (all activities) and **future time
          clauses** with *when / after* + present simple (warm-up questions 1, 3 and 4
          and Activity 3). Correct *When I will achieve…* to *When I achieve…* whenever it
          comes up.
      - id: n-warmup
        anchor: warmup-title
        text: Ask each student at least two questions. Answers typed here are visible to you below each question.
      - id: n-act2
        anchor: act2
        text: >-
          Divide the students into groups by similar goals (for example, two groups).
          Group 1 creates an invention for group 2, and group 2 for group 1. Let them fly:
          any invention is fine.
      - id: n-act3
        anchor: act3
        text: >-
          The guided visualization (step 1) is optional; steps 2 and 3 are not. You can
          read: "Imagine your future self. Close your eyes and picture yourself in the
          future, after you've achieved your goal. Imagine how you feel, what your life
          looks like, and who is there with you."

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: goals-and-projects-future-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-future
        type: ruleSummary
        skill: Will and going to
        rules:
          - text: 'Use **will** for **decisions made at the moment of speaking** and for promises. Subject + *will* + base verb.'
            examples: [I will start working on my project tomorrow.]
          - text: 'Use **will** for **predictions** about the future (what you think will happen). Subject + *will* + base verb.'
            examples: [I think my project will be finished next week.]
          - text: 'Use **going to** for **plans and intentions** you decided before speaking, or when you can see that something is going to happen. Subject + *am / is / are* + *going to* + base verb.'
            examples:
              [I am going to start my new goal next month., Look at the clouds! It's going to rain.]
      - id: rules-time-clauses
        type: ruleSummary
        skill: Future time clauses
        rules:
          - text: 'After **when**, **after** and **before** we use the **present simple** for the future, not *will*. The other part of the sentence uses *will* or *going to*.'
            examples:
              - When I achieve my goal, I will travel to Australia.
              - I'm going to celebrate with my friends after I achieve my goal.
              - "I'm going to feel happy when I achieve my goal. (not: when I will achieve)"
          - text: 'For *he / she*, the present simple adds **-s**.'
            examples: [When she finishes the course, she will look for a new job.]
      - id: quick-summary
        type: callout
        tone: info
        title: Quick summary
        text: |-
          **Will:** decisions made now, promises and predictions. *She will finish her work today.*
          **Going to:** plans and things you are sure will happen. *They are going to complete their project by Friday.*
          **When / after + present simple:** *When I achieve my goal, I will celebrate.*
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both skills with the group and ask for one new example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: goals-and-projects-future-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Then write your answers, and Mori will correct them.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Message 1: Questions and answers'
        message: |-
          Hi Mori! I want to practice the future. I'll answer these questions with "will" or "going to":
          1. What will you do next weekend?
          2. What will you achieve by the end of this year?
          3. Where will you go on your next vacation?
          Please correct my answers and ask me one more question about my plans.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Message 2: My goal for next month'
        intro: 'Example: *Next month, I will start working on my fitness. I am going to join the gym, and I will work out three times a week. I will also eat healthier food. By the end of the month, I will feel stronger and more energetic.*'
        message: Hi Mori! I'll write a short paragraph (5–7 sentences) about my goal for next month, with "will" and "going to". Please correct my sentences and ask me one question about my goal.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Message 3: Reading'
        message: |-
          Hi Mori! Please check my answers to this reading exercise.
          Passage: "Next year, I will study abroad in Spain. I am going to improve my Spanish and learn about the culture. I will also meet new people and make new friends. I am excited about this adventure and what I will experience."
          1. Where will the person study next year?
          2. What will they do there?
          3. Who will they meet?
          4. How do they feel about this adventure?
          My answers:
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: goals-and-projects-future-practice
    book: workbook
    title: 'Practice: Goals and Projects'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. Each answer is checked right away, and you can try again.
      - id: ex-will
        type: activity
        activity: goals-and-projects-future-will
      - id: ex-time-clauses
        type: activity
        activity: goals-and-projects-future-time-clauses

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: goals-and-projects-future-vocabulary
    title: Vocabulary
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Goals and projects words
        glossLang: he
        link: https://quizlet.com/il/983036999/goals-and-projects-flash-cards/
        items: &goals-and-projects-future-words
          - { term: Goal, gloss: מטרה }
          - { term: Role model, gloss: מודל לחיקוי }
          - { term: Research, gloss: מחקר }
          - { term: Present, gloss: להציג }
          - { term: Step, gloss: שלב }
          - { term: Plan, gloss: תוכנית }
          - { term: Action, gloss: פעולה }
          - { term: Invention, gloss: המצאה }
          - { term: Technology, gloss: טכנולוגיה }
          - { term: Achievement, gloss: הישג }
          - { term: Task, gloss: משימה }
          - { term: Success, gloss: הצלחה }
          - { term: Struggle, gloss: מאבק }
          - { term: Progress, gloss: התקדמות }
          - { term: Deadline, gloss: מועד אחרון }
          - { term: Motivation, gloss: מוטיבציה }
          - { term: Support, gloss: תמיכה }
          - { term: Effort, gloss: מאמץ }
          - { term: Decision, gloss: החלטה }
          - { term: Future, gloss: עתיד }
          - { term: Past, gloss: עבר }
          - { term: Presentation, gloss: מצגת }
          - { term: Travel, gloss: לנסוע / לטייל }
          - { term: Connect, gloss: להתחבר }

vocabulary:
  - slug: goals-and-projects-future
    title: 'Goals and Projects: Future'
    items: *goals-and-projects-future-words

activities:
  - slug: goals-and-projects-future-will
    title: 'Will and going to'
    minutes: 8
    items:
      - id: answer-it
        type: multipleChoice
        prompt: 'The phone is ringing. You decide now: "I ___ answer it!"'
        options:
          - { text: will, correct: true }
          - {
              text: am going to,
              feedback: "You decide at the moment of speaking, so use *will*: *I'll answer it!*",
            }
          - {
              text: answer,
              feedback: 'For a decision you make now, use *will* + base verb: *I will answer it!*',
            }
      - id: start
        type: fillBlank
        prompt: Write the verb *start* in the right form.
        text: I am going to ___ my new goal next month.
        blanks: [[start]]
      - id: am-is-are
        type: fillBlank
        prompt: Complete with *am*, *is* or *are*.
        text: She ___ going to join the gym. They ___ going to complete their project by Friday.
        blanks: [[is], [are]]
        wordBank: [am, is, are]
      - id: will-be
        type: multipleChoice
        prompt: I think my project ___ finished next week.
        options:
          - { text: will be, correct: true }
          - { text: will is, feedback: 'After *will*, use the base verb: *will be*.' }
          - { text: wills be, feedback: '*Will* never changes: *I will, she will, it will*.' }
      - id: will-travel
        type: multipleChoice
        prompt: He will ___ to Australia next year.
        options:
          - { text: travel, correct: true }
          - {
              text: travels,
              feedback: 'After *will*, use the base verb without *-s*: *He will travel.*',
            }
          - {
              text: to travel,
              feedback: 'After *will*, use the base verb without *to*: *He will travel.*',
            }
      - id: match-uses
        type: matching
        prompt: Match each sentence with its use.
        pairs:
          - ["I'll help you with that!", a decision or promise made now]
          - [I think it will be sunny tomorrow., a prediction]
          - ["I'm going to start the gym next week. I already paid.", a plan made before speaking]
          - ["Look at those clouds! It's going to rain.", something we can see will happen]
      - id: plans-going-to
        type: trueFalse
        prompt: 'We use *going to* for plans we decided **before** speaking: *I am going to start my new goal next month.*'
        answer: true
        feedback:
          correct: Right! *Going to* = a plan or intention. *Will* = a decision made now.
          incorrect: '*Going to* is for plans you already decided. *Will* is for decisions you make at the moment of speaking.'
      - id: order-going-to
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I am going to join the gym next month.

  - slug: goals-and-projects-future-time-clauses
    title: 'Future time clauses: when / after + present simple'
    minutes: 8
    items:
      - id: when-achieve
        type: multipleChoice
        prompt: When I ___ my goal, I will travel to Australia.
        options:
          - { text: achieve, correct: true }
          - {
              text: will achieve,
              feedback: 'After *when*, use the present simple for the future: *When I achieve…*',
            }
          - {
              text: achieved,
              feedback: '*Achieved* is the past. For the future, use the present simple after *when*: *When I achieve…*',
            }
      - id: after-achieve
        type: multipleChoice
        prompt: I'm going to celebrate with my friends after I ___ my goal.
        options:
          - { text: achieve, correct: true }
          - {
              text: will achieve,
              feedback: 'After *after*, use the present simple, not *will*: *after I achieve my goal*.',
            }
          - {
              text: achieving,
              feedback: 'After *after I*, use the present simple: *after I achieve my goal*.',
            }
      - id: finishes
        type: fillBlank
        prompt: Write *finish* in the present simple.
        text: When she ___ the course, she will look for a new job.
        blanks: [[finishes]]
      - id: save
        type: fillBlank
        prompt: Write *save* in the present simple.
        text: After we ___ enough money, we are going to buy a car.
        blanks: [[save]]
      - id: no-will
        type: trueFalse
        prompt: 'After *when* we use *will*: *When I will achieve my goal, I will feel happy.*'
        answer: false
        feedback:
          correct: Right! After *when* we use the present simple. *When I achieve my goal, I will feel happy.*
          incorrect: 'After *when* and *after*, use the present simple: *When I achieve my goal, I will feel happy.*'
      - id: correct-sentence
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: 'When I achieve my goal, I will feel happy.', correct: true }
          - {
              text: 'When I will achieve my goal, I will feel happy.',
              feedback: "Don't use *will* after *when*: *When I achieve my goal…*",
            }
          - {
              text: 'When I achieved my goal, I will feel happy.',
              feedback: 'For the future, use the present simple after *when*: *When I achieve…*',
            }
      - id: my-goal
        type: shortAnswer
        prompt: 'What will you do when you achieve your goal? Write one sentence. Start with *When I achieve my goal, I will…*'
      - id: order-after
        type: reorderSentence
        prompt: Put the words in order.
        sentence: What will you do after you achieve your goal?
