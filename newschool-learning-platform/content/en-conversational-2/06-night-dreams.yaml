# Cycle "Night dreams", converted from the Conversational English (level 2) digital
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-conversational-2
slug: night-dreams
title: Night dreams
goal: Tell your dreams in the past simple and say where and when things happened with prepositions.
position: 6
status: in_review

review:
  - >-
    The two workbook exercises ("Past simple" and "Prepositions") are NEW: the notebook
    has no self-study exercises. They were written from the cycle's summary rules, the
    activity examples and its vocabulary. Please check level, wording and every right
    answer before students see them.
  - >-
    Summary, prepositions: the three "rules" in the source mix different things (rule
    1 mixes "in front of / behind" with "in" for time and place; rule 3 mixes "between,
    near, beside, next to" with "at"). The summary is reorganised into: in / on / at
    for time, in / on / at for place, position words (in front of, behind, next to,
    near, beside, between, under, around), and about / with (the skill names "about,
    in, on, with" but the source summary has no rule for about and with; one was
    added: *dream about*, *with my friends*). A table was added. Please confirm.
  - >-
    Summary, past simple: the rules were numbered 1, 2, 4 and are now 1, 2, 3. The
    "For advanced students" part (past simple vs past continuous) is kept under its
    own heading.
  - >-
    Activity 1 sample frames: "It was in the ___ (morning/afternoon/night)" → "It was
    in the morning / in the afternoon / at night" (we say *at night*); "Over the sky,
    there was…" → "In the sky, there was…"; "In front of the room" → "In front of the
    house"; "A ___ woman near ___" → "A ___ woman was standing near ___"; "A man next
    to a ___" → "A man was sitting next to a ___"; "i dreamt" → "I dreamt".
  - >-
    Other corrections: Introduction "skip right tothe discussion" → "skip right to the
    discussion questions"; warm-up 2 "Did you ever dream one of these most common
    dreams?" → "Did you ever have one of these common dreams?"; Activity 2 reading
    "giant pieces of cake floating on the ceiling" → "floating near the ceiling";
    Activity 3 "J Lo's mansion" → "J.Lo's mansion"; Activity 3 frames "lives with me in
    / on / at my house" → "in my house" and "My dream house is in / on / at (country /
    city)" → "in"; Activity 4 fact 7 "After 5 minutes of waking up, you forget half"
    → "Five minutes after you wake up, you forget half"; Activity 5 "Ask the student"
    → "Think of…" (student-facing); homework question 6 "Where are they next to you…"
    → "Where were they: next to you, behind you, around you or above you?"
  - >-
    Activity 1 refers to dream images "below" and Activity 3 to "the living room
    below"; the images are not in the exported notebook. Activity 1 keeps the Google
    Doc link with the images (without "?usp=sharing"); Activity 3 now asks students to
    find a picture of their dream house online, as the source also says. Please add
    the living-room picture if it is needed.
  - >-
    Homework: the notebook asks students to join the class on Quizlet through a Google
    Doc link (with a "#heading" anchor) and refers to "the chart below", which is not
    in the notebook; that link was left out and the cycle's Quizlet set is linked
    instead. The writing task was "send to the homework email"; it is now a Mori
    message with the same seven questions. Please confirm.
  - >-
    Activity 4 fun facts are kept as in the notebook (e.g. "about 12% of people don't
    dream in color"); please check you are happy presenting them as facts.
  - >-
    Vocabulary glosses changed: "Afternoon אחה"צ" → "אחר הצהריים"; "About על" → "על
    (לחלום על)"; "At ב" → "ב / ליד (מקום מדויק, שעה)"; "Under מתחת ל" → "מתחת ל-";
    "In front of מול" → "מול / לפני". Please confirm.
  - >-
    The source gives no activity times except "no more than 5 minutes" for the
    introduction round. The Quizlet link is kept without its "?new" parameter. The
    "Answer of student 1/2/3" lines are replaced by the optional answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: night-dreams-class
    title: 'Class: Night dreams'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Night dreams
      - id: skills
        type: cycleOverview
        skills:
          - name: Past simple
            description: Telling a dream (*I dreamed, I saw, I woke up; Did you…? I didn't…*)
          - name: Prepositions
            description: '*about, with, in, on, at* and place words (*in front of, behind, next to…*)'
      - id: quizlet
        type: externalLink
        label: Night dreams words on Quizlet
        url: https://quizlet.com/il/994777512/nighttime-dreams-conversational-english-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I am ___. I dream in my native language only. / I dream in ___ (different languages).
        example: I am David. I dream in Hebrew, English and Russian.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: Do you remember your dreams when you wake up?
            frame: Yes, I usually remember… / No, I don't remember…
          - question: 'Did you ever have one of these common dreams? My teeth were falling out. / I was flying. / I was falling. / I failed a test. / I was being chased.'
            frame: Yes, I dreamed that ___. / No, I never had that dream.
          - question: Can you tell us what happened in a dream that you remember?
            frame: In my dream, I was in / on / at ___. I saw ___.
          - question: Did you ever dream that you were in another time or country?
            frame: Yes, I dreamed that I was in ___.
          - question: Can you do anything to have fewer nightmares (bad dreams)?
          - question: Who do you think has more dreams, children or adults? Why?
            frame: I think ___ have more dreams because ___.
          - question: (Bonus) Why do you think people dream?
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      - id: act1
        type: classActivity
        title: 'Activity 1: What did you dream about?'
        skills: [Past simple, Prepositions]
        steps:
          - Open the Google Doc with the dream images and make a copy.
          - Choose one to three images. Write about them in the past simple, as if they were dreams you had last night. Use prepositions (*about, in, on, with…*) and words you know, like colors.
          - Share one of your dreams with the group.
          - 'Optional: the group says what they think the dream means.'
        resource:
          label: Dream images (Google Doc)
          url: https://docs.google.com/document/d/1VVx7xtPF2FhOr0dUIEEftlZEx6-HmZklbXo9NgtBFTk/edit
      - id: act1-frames
        type: discussionQuestions
        title: My dream
        items:
          - question: Last night I dreamed **about** ___.
          - question: It was **in** the morning / **in** the afternoon / **at** night.
          - question: '**In front of** the house / **on** the street, I saw ___.'
          - question: There were many ___ **between** ___.
          - question: '**In** the sky, there was / were ___.'
          - question: A ___ man was ___ **behind** ___.
          - question: A ___ woman was standing **near** ___.
          - question: A child was ___ **beside** ___.
          - question: '**On** the ___, there was ___.'
          - question: The dream took place **under** ___.
          - question: A man was sitting **next to** a ___.
          - question: Suddenly, ___.
          - question: 'The dream finished like this: ___.'
          - question: I know it sounds like a very random dream, but I think I dreamt it **because of** ___.
      - id: act2-title
        type: heading
        level: 4
        text: For advanced students
      - id: act2
        type: classActivity
        title: 'Activity 2: The weirdest dreams'
        skills: [Past simple]
        steps:
          - Read the text together. Each student reads part of the text.
          - Answer the questions (speaking).
          - 'Optional: discuss the questions about your own dreams.'
      - id: act2-text
        type: text
        text: |-
          Last night, I had the strangest dream. I was in a giant forest, surrounded by trees that sparkled in different colors. At first, I felt calm, but suddenly, the ground began to shake. In the middle of the forest, a huge staircase appeared, leading down to an underground room. On the walls of the room, there were paintings of animals dancing and talking to each other. I tried to get closer to the paintings, but they started to move, and one of the animals jumped out of the frame!

          I found myself at the bottom of the staircase, holding a golden key. I felt like I was in a maze, and each door I opened led to a different, strange place. In one room, there were giant pieces of cake floating near the ceiling, and in another, there was a beach with purple sand. I tried to run back, but I couldn't find my way. Just when I felt completely lost, I heard an alarm ringing at my side. I woke up, realizing I was safe in my bed, but the strange feeling of the dream stayed with me all day.
      - id: act2-questions
        type: discussionQuestions
        title: Questions about the text
        items:
          - question: Where was the narrator in the dream?
          - question: What happened when the ground began to shake?
          - question: What was on the walls of the underground room?
          - question: What did the narrator find at the bottom of the staircase?
          - question: What unusual things did the narrator see in the rooms?
          - question: How did the narrator feel when they woke up?
      - id: act2-discuss
        type: discussionQuestions
        title: Let's talk (optional)
        items:
          - question: What is the strangest dream you remember? Describe it and any unusual details.
          - question: Do you think dreams can tell us something about ourselves? Why or why not?
          - question: Have you ever had a recurring dream or a nightmare? How did it make you feel?
          - question: If you could control your dreams, what would you want to dream about? Why?
          - question: Some people say that dreams have meanings. Do you agree? Why do you think we dream in certain ways?
          - question: Do you think we can learn something from our dreams? Share any experiences that felt meaningful.
      - id: act3
        type: classActivity
        title: 'Activity 3: Your dream house'
        skills: [Prepositions]
        steps:
          - Imagine that last year you won your dream house!
          - Find a picture of your dream house online.
          - Prepare a short presentation about it. Use prepositions of place to say where the house is and what is around it.
          - Present your dream house to the group.
        example: |-
          *J.Lo's mansion in Beverly Hills:*
          *My dream house is in Beverly Hills.*
          *I chose this house because I always wanted to live next to the celebrities, and J.Lo is selling the house, so it's a good opportunity.*
          *My boyfriend and my family live with me in my house.*
          *In front of the house, there is a big security gate. Behind my house, there is a swimming pool and a jacuzzi.*
          *There are huge trees and plants around my house.*
      - id: act3-frames
        type: discussionQuestions
        title: My dream house
        items:
          - question: My dream house is in ___ (country / city).
          - question: I chose this house because ___.
          - question: ___ lives / live with me in my house.
          - question: In front of / Next to / Behind my house, there is ___. (2 sentences)
          - question: There are ___ in / around my house.
      - id: act4
        type: classActivity
        title: 'Activity 4: That fun fact is right! Actually…'
        skills: [Past simple]
        steps:
          - Read the fun facts about dreaming with your teacher.
          - Choose one fact and tell a story about it in the past simple. It can be a dream or an experience. If you don't have one, invent one!
      - id: act4-facts
        type: table
        caption: 11 fun facts about dreaming
        header: [Fact, Explanation]
        rows:
          - [
              Everyone dreams every night,
              "You dream every night, but sometimes you don't remember.",
            ]
          - [Dreams are short, Most dreams are only 5 to 20 minutes long.]
          - [You can have many dreams, You can have 4 to 6 dreams in one night.]
          - [Some people dream in black and white, "About 12% of people don't dream in color."]
          - [Dreams help with feelings, Dreams can help your brain understand your emotions.]
          - [
              You can control dreams,
              'In some dreams, called lucid dreams, you know you are dreaming and can control the story.',
            ]
          - [
              You forget dreams quickly,
              'Five minutes after you wake up, you forget half of your dream. After 10 minutes, most of it is gone.',
            ]
          - [
              Sounds can enter your dreams,
              Noises or smells around you while you sleep can become part of your dreams.,
            ]
          - [Animals dream too, 'Cats, dogs and other animals also have dreams!']
          - [
              Blind people dream,
              "People born blind don't see pictures in their dreams, but they dream using sounds, smells and feelings.",
            ]
          - [Dreams can be strange, Dreams often mix ideas and memories in surprising ways.]
      - id: act4-story
        type: discussionQuestions
        items:
          - question: 'My fact is: ___. Once, I ___.'
      - id: act5
        type: classActivity
        title: 'Activity 5: A day to remember'
        skills: [Prepositions, Past simple]
        steps:
          - Review *in, on, at* for time and place with your teacher (see the box below).
          - Think of a memorable day in your life (a trip, a birthday, an accident, a success).
          - Use the questions below to plan your story.
          - Tell your story. Use *in, on, at* correctly. Your classmates listen and help with the prepositions.
        example: '*I remember a fantastic day on my birthday last year. It happened in November, at 3 PM, when my friends surprised me with a party. We met at my house, and everyone brought gifts. In the evening, we had a delicious dinner together.*'
      - id: act5-review
        type: callout
        tone: info
        title: In, on, at
        text: |-
          **Time:** **in** months, years, centuries, long periods (*in 1995, in June, in the morning*) · **on** dates, days of the week, special days (*on Monday, on July 4th, on Christmas Day*) · **at** exact times, holidays without "day" (*at 5 PM, at noon, at Christmas*)
          **Place:** **in** closed spaces or large areas (*in the room, in the city, in the car*) · **on** surfaces or places on a line (*on the table, on the wall, on the street*) · **at** exact points (*at the door, at the station, at the corner*)
      - id: act5-questions
        type: discussionQuestions
        title: My story
        items:
          - question: When did it happen?
          - question: Where did it happen?
          - question: What were you doing at that time?
          - question: What happened next?
          - question: Who was with you?
          - question: How did you feel about it afterward?
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: **Past simple** (Activities 1, 2, 4 and 5) and
          **Prepositions** (Activities 1, 3 and 5). Activity 2 is for advanced students
          (past simple and past continuous). The notebook gives no times for the
          activities.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: >-
          Keep it very, very short: 2 sentences per student, no more than 30 seconds each
          (teacher too). If everyone already knows each other, skip right to the warm-up
          questions.
      - id: n-warmup
        anchor: warmup
        text: Ask each student at least two questions. Answers typed here are visible to you below each question.
      - id: n-act1
        anchor: act1
        text: >-
          Before they start, give students the more difficult words in the images, and
          encourage them to use words they know (colors, etc.). Remind them to make a
          copy of the Google Doc before they write. The interpretation step is optional.
      - id: n-act3
        anchor: act3
        text: >-
          The notebook also asks students to say what objects they used to decorate "the
          living room below" and where they placed them; that picture is not in the
          notebook. Share a living-room picture if you want to use this part.
      - id: n-act4
        anchor: act4
        text: Present the 11 facts first. Each student tells a story connected to one fact.
      - id: n-act5
        anchor: act5
        text: >-
          Give the example story first. While students speak, you or their classmates
          take notes on their use of *in, on, at* and give constructive feedback.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: night-dreams-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-past
        type: ruleSummary
        skill: Past simple
        rules:
          - text: 'We use the past simple for **completed actions in the past**. Structure: subject + verb (past form) + time expression.'
            examples: [I had a strange dream last night.]
          - text: '**Regular verbs:** base form + **-ed**. **Irregular verbs:** a special past form.'
            examples:
              - I dreamed about flying last night.
              - I saw a mysterious figure in my dream last week.
              - I woke up feeling confused this morning.
          - text: "**Questions:** *Did* + subject + base verb? **Negatives:** subject + *did not (didn't)* + base verb."
            examples:
              - Did you have a dream about animals last night?
              - I didn't remember my dream this morning.
      - id: advanced-title
        type: heading
        level: 3
        text: For advanced students
      - id: rules-continuous
        type: ruleSummary
        skill: Past simple and past continuous
        rules:
          - text: '**Past simple** (subject + past form): an action completed at a specific time in the past.'
            examples: [I visited the museum yesterday., I watched a movie last night.]
          - text: '**Past continuous** (subject + *was / were* + verb-*ing*): an action in progress at a moment in the past, or a background action.'
            examples: [I was reading a book when you called me.]
          - text: 'Together: the past continuous is the longer action in progress; the past simple is the short action that happens in the middle of it.'
            examples: [I was watching a movie when the phone rang.]
      - id: rules-prepositions
        type: ruleSummary
        skill: Prepositions
        rules:
          - text: '**Time:** **in** for months, years, seasons and parts of the day; **on** for days and dates; **at** for exact times.'
            examples: [in 2023, in the morning, on Monday, on Christmas Day, at 5 PM, at midnight]
          - text: '**Place:** **in** for closed spaces, cities and countries; **on** for surfaces and streets; **at** for exact points.'
            examples:
              [in the room, in New York, on the table, on the street, at the door, at the station]
          - text: 'Position words: **in front of, behind, next to, near, beside, between, under, around**.'
            examples:
              - In front of the house, there is a big gate.
              - Behind the chair.
              - Between the trees.
              - Next to a dog.
          - text: '**about** = the topic; **with** = together with someone.'
            examples: [Last night I dreamed about flying., I was with my friends in my dream.]
      - id: prepositions-table
        type: table
        caption: In, on, at
        header: ['', Time, Place]
        rows:
          - [
              in,
              'months, years, seasons, parts of the day (in June, in 2023, in the morning)',
              'closed spaces, cities, countries (in the room, in New York)',
            ]
          - [
              on,
              'days, dates, special days (on Monday, on July 4th)',
              'surfaces, streets (on the table, on the street)',
            ]
          - [
              at,
              'exact times (at 5 PM, at midnight, at night)',
              'exact points (at the door, at the station)',
            ]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both skills with the group and ask for one new example for each rule. Use the advanced part only with advanced groups.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: night-dreams-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: quizlet-practice
        type: externalLink
        label: Practise the vocabulary on Quizlet
        url: https://quizlet.com/il/994777512/nighttime-dreams-conversational-english-flash-cards/
      - id: how
        type: text
        text: Then open the chat with Mori, copy this message and send it. Write a short paragraph about a dream you had, using the past tense and prepositions.
      - id: mori-dream
        type: aiTutorPrompt
        title: My dream
        message: |-
          Hi Mori! I want to write a short paragraph about a dream I had, using the past simple and prepositions (in, on, at, about, with, next to, behind…). Please ask me these questions one by one, then correct my paragraph:
          1. Where did the dream take place? (country)
          2. When did you dream this dream? (year / month)
          3. What day was it on?
          4. Where were you in this dream?
          5. What time was it in the dream?
          6. Who was with you in the dream? Where were they: next to you, behind you, around you or above you?
          7. Is there anything else you want to add?
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

