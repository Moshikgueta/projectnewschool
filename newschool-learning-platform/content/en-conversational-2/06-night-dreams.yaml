vocabulary:
  - slug: night-dreams
    title: Night dreams
    items: *night-dreams-words

activities:
  - slug: night-dreams-past
    title: 'Past simple: I dreamed, I saw, I woke up'
    minutes: 8
    items:
      - id: had
        type: multipleChoice
        prompt: Last night I ___ a strange dream.
        options:
          - { text: had, correct: true }
          - { text: haved, feedback: '*Have* is an irregular verb. The past form is *had*.' }
          - {
              text: have,
              feedback: '*Have* is present. With *last night*, use the past simple: *had*.',
            }
      - id: woke-remember
        type: fillBlank
        prompt: Complete with the past simple. Use *wake* and *not remember*.
        text: This morning I ___ up at 7, and I ___ my dream.
        blanks: [[woke], ["didn't remember", did not remember]]
      - id: irregular
        type: matching
        prompt: Match each verb with its past simple form.
        pairs:
          - [see, saw]
          - [fly, flew]
          - [fall, fell]
          - [wake up, woke up]
          - [have, had]
      - id: did-dream
        type: multipleChoice
        prompt: ___ you have a dream about animals last night?
        options:
          - { text: Did, correct: true }
          - {
              text: Do,
              feedback: 'With *last night*, the question is in the past: *Did you have…?*',
            }
          - {
              text: Were,
              feedback: 'With a verb like *have*, make the question with *did*: *Did you have…?*',
            }
      - id: dreamed
        type: fillBlank
        prompt: Complete with the past simple of *dream*.
        text: Last night I ___ about flying.
        blanks: [[dreamed, dreamt]]
      - id: was-watching
        type: multipleChoice
        prompt: 'For advanced students: I ___ a movie when the phone rang.'
        options:
          - { text: was watching, correct: true }
          - { text: were watching, feedback: 'With *I*, use *was*: *I was watching*.' }
          - {
              text: am watching,
              feedback: 'The story is in the past. Use the past continuous: *I was watching*.',
            }
      - id: continuous
        type: trueFalse
        prompt: 'The past continuous is *was / were* + verb-*ing*: *I was reading a book when you called me.*'
        answer: true
        feedback:
          correct: 'Right! *was / were* + *-ing* = an action in progress in the past.'
          incorrect: 'The past continuous is *was / were* + verb-*ing*: *I was reading*.'
      - id: order-saw
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I saw a strange man in my dream.

  - slug: night-dreams-prepositions
    title: 'Prepositions: about, with, in, on, at'
    minutes: 8
    items:
      - id: dreamed-about
        type: multipleChoice
        prompt: Last night I dreamed ___ my grandmother.
