activities:
  - slug: sustainability-future
    title: "Going to and will: I'm going to recycle. The air will be cleaner."
    minutes: 8
    items:
      - id: plan-recycle
        type: multipleChoice
        prompt: 'I decided last week. Next month I ___ recycle more bottles.'
        options:
          - { text: am going to, correct: true }
          - {
              text: going to,
              feedback: 'You need *am / is / are* before *going to*: *I am going to recycle.*',
            }
          - {
              text: is going to,
              feedback: '*Is* is for *he, she, it*. With *I*, use *am*: *I am going to…*',
            }
      - id: were-going-to
        type: fillBlank
        prompt: Complete with *going to* and the verb *plant*.
        text: We ___ trees in the park next weekend.
        blanks: [['are going to plant']]
      - id: prediction-2050
        type: multipleChoice
        prompt: 'A prediction: In 2050, there ___ less pollution in cities.'
        options:
          - { text: will be, correct: true }
          - {
              text: will is,
              feedback: 'After *will*, use the base verb: *will be*, not *will is*.',
            }
          - { text: will to be, feedback: "Don't use *to* after *will*: *there will be*." }
      - id: wont-throw
        type: fillBlank
        prompt: Write the negative of *will*.
        text: We ___ throw trash on the street.
        blanks: [["won't", will not]]
      - id: if-will
        type: multipleChoice
        prompt: If we don't recycle, the oceans ___ dirty.
        options:
          - { text: will be, correct: true }
          - {
              text: will are,
              feedback: 'After *will*, use the base verb: *will be*, not *will are*.',
            }
          - {
              text: be,
              feedback: 'The result is in the future, so use *will*: *the oceans will be dirty*.',
            }
      - id: use-going-to
        type: trueFalse
        prompt: We use *going to* for plans and intentions, like *I'm going to use less plastic.*
        answer: true
        feedback:
          correct: Right! *Going to* is for plans we decided before we speak.
          incorrect: "*Going to* is for plans and intentions: *I'm going to use less plastic.* *Will* is for predictions."
      - id: match-use
        type: matching
        prompt: Match each sentence with its use.
        pairs:
          - ["I'm going to walk more next year.", a plan]
          - [I think solar energy will be cheaper., a prediction]
          - ["It's hot in here. I'll open the window.", a decision now]
          - ["I promise I'll recycle the bottles.", a promise]
      - id: order-bus
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I'm going to take the bus.

  - slug: sustainability-comparisons
    title: 'Comparisons: more ecological than, the most sustainable'
    minutes: 8
    items:
      - id: more-than
        type: multipleChoice
        prompt: The bike is ___ the car.
        options:
          - { text: more ecological than, correct: true }
          - {
              text: ecologicaler than,
              feedback: '*Ecological* is a long adjective, so use *more ecological than*.',
            }
          - { text: more ecological that, feedback: 'After a comparative, use *than*, not *that*.' }
      - id: cleaner
        type: fillBlank
        prompt: Write the comparative of *clean*.
        text: My neighborhood is ___ than downtown.
        blanks: [[cleaner]]
      - id: as-as
        type: multipleChoice
        prompt: 'The two cities are the same: My city is ___ yours.'
        options:
          - { text: as noisy as, correct: true }
          - { text: as noisy than, feedback: 'With *as*, use *as … as*: *as noisy as*.' }
          - {
              text: more noisy as,
              feedback: 'For "the same", use *as + adjective + as*: *as noisy as*.',
            }
      - id: less-polluting
        type: fillBlank
        prompt: 'A cloth bag is better for the environment. Complete with *less* or *more*.'
        text: A cloth bag is ___ polluting than a plastic bag.
        blanks: [[less]]
      - id: the-most
        type: multipleChoice
        prompt: Solar energy is ___ sustainable option of all.
        options:
          - { text: the most, correct: true }
          - {
              text: more,
              feedback: 'We compare all the options (more than two), so use the superlative: *the most*.',
            }
          - { text: most, feedback: 'The superlative needs *the*: *the most sustainable*.' }
      - id: least-ecological
        type: trueFalse
        prompt: '*Cars are the least ecological transport.* means cars are the worst for the environment.'
        answer: true
        feedback:
          correct: Right! *The least* is the lowest degree. Cars are the least ecological of all.
          incorrect: '*The least ecological* means less ecological than all the others, so cars are the worst for the environment.'
      - id: match-forms
        type: matching
        prompt: Match each adjective with its comparative.
        pairs:
          - [clean, cleaner]
          - [big, bigger]
          - [dirty, dirtier]
          - [good, better]
          - [ecological, more ecological]
      - id: order-greener
        type: reorderSentence
        prompt: Put the words in order.
        sentence: Curitiba is greener than São Paulo.
