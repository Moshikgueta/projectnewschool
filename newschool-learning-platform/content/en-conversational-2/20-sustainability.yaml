# Cycle "Sustainability", converted from the Conversational English (level 2)
# digital notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review`
# below. Blocks without `lang` are in the course language (English).
course: en-conversational-2
slug: sustainability
title: Sustainability
goal: Talk about saving the planet with going to and will, and compare eco-friendly choices with comparatives and superlatives.
position: 20
status: in_review

review:
  - >-
    The two workbook exercises ("Future: going to and will" and "Comparisons") are NEW:
    the notebook has no self-study exercises. They were written from the cycle's
    grammar summary, the activity examples and its vocabulary. Please check level,
    wording and every right answer before students see them.
  - >-
    Grammar summary corrections: the going-to structure "Subject + to be + going to"
    now reads "Subject + am / is / are + going to"; *will* was described as "for
    predictions and long-term plans". Plans are *going to*, so the use now reads
    "predictions, and decisions or promises we make at the moment of speaking".
    Please confirm.
  - >-
    Grammar summary addition: the comparisons table only had *more / less … than* and
    *as … as*, but the activities use short adjectives (*cleaner, greener, dirtier,
    bigger*). A NEW rule and table for short adjectives (*-er than, the -est*) and
    *good → better → the best* were added.
  - >-
    Activity 1: "What happens if we don't change our habits?" → "What will happen if we
    don't change our habits?" (matches the *if + will* warning). Campaign example "We
    won't throw away trash." → "We won't throw trash on the street." (we do throw trash
    away; the idea is not littering). Activity 2 support board: "This bag is more
    ecological than plastic." → "than a plastic bag".
  - >-
    Activity 5 instruction "if there will continue to be pollution or not continue to
    be pollution" was rewritten: "Will there be more pollution or less pollution? What
    will it look like in 2050?"
  - >-
    Preparation question 7: "non eco-friendly" → "non-eco-friendly". The A2 Basic / A2
    Advanced preparation questions and the Activity 6 beginner / intermediate readings
    are kept as separate levels. Activity 6 "Option A - Beginner (A1-A2)" / "Option B -
    Intermediate (A2-B1)" are kept as "Beginner" / "Intermediate".
  - >-
    Links: the Quizlet link is kept without its tracking parameters; the Wall-E clip
    (YouTube) is kept. Activities 1, 3 and 4 link to three Canva designs (pictures,
    question cards, world map). canva.com is not on the link allow-list, so the links
    were removed and the resources are mentioned in teacher notes.
  - >-
    Homework: the four Mori tasks (going to, will, comparisons, superlatives) became
    Mori messages; the extra "Skill 2 - Comparisons: how things used to be and how they
    are now" questions became a fifth message with frames. The closing note "Homework
    submission … Mori … New School WhatsApp 050-762-6695" was left out (platform-
    specific, not course material).
  - >-
    Times given as ranges are recorded as the upper value (Activity 1: 20–25 → 25, its
    steps 10–12 → 12 and 5–7 → 7; Activity 3: 15–20 → 20, report 5–10 → 10; Activity
    4: 10–15 → 15, pair work 8–10 → 10, sharing 3–5 → 5; Activity 6: 20–25 → 25, group
    work 10–12 → 12, presentations 8–10 → 10). Activity 5 has no time in the source.
  - >-
    Vocabulary: "Reduce" הפחתה (a noun) → "להפחית" (it is a verb, like *reuse* and
    *recycle* in the 3 Rs; "Reuse" keeps שימוש חוזר). "Climate Change", "Air Quality"
    and the other two-word terms are written in sentence case. Please confirm.
  - >-
    The "Answer of student 1/2/3" lines are replaced by the optional answer boxes
    (decision C2). The empty "Date / Participants" headings and broken bold / stray
    asterisks were removed. Activity 6 and the summary keep opinion examples about real
    places (*Barcelona is cleaner than Buenos Aires*, *Chile is the most advanced
    country in solar energy*); they are models for the activity, not facts to teach.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: sustainability-class
    title: 'Class: Sustainability'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Sustainability
      - id: skills
        type: cycleOverview
        skills:
          - name: 'Future: going to and will'
            description: Plans with *going to* (*I'm going to recycle more.*) and predictions with *will* (*The air will be cleaner.*)
          - name: Comparisons
            description: '*more / less … than, as … as, the most / the least* (*The bike is more ecological than the car.*)'
      - id: quizlet
        type: externalLink
        label: Sustainability on Quizlet
        url: https://quizlet.com/il/1096724867/sustainability-updated-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        prompt: Say your name and how often you recycle.
        frame: My name is ___. I recycle / I recycle sometimes / I never recycle.
        example: My name is Yuval. I never recycle, but I'm going to start next month.
      - id: warmup-title
        type: heading
        level: 3
        text: Preparation questions
      - id: warmup-basic-title
        type: heading
        level: 4
        text: 'A2 Basic: daily life (simple habits)'
      - id: warmup-basic
        type: discussionQuestions
        items:
          - question: What do you use to carry your groceries, and why?
            frame: I use… because…
          - question: How do you carry water when you leave home (plastic bottle, cup, thermos…)?
            frame: I carry water in…
          - question: What do you do at home to use less electricity?
            frame: At home I… / I turn off…
          - question: What type of trash do you recycle most, and how?
            frame: I recycle… most. I put it in…
          - question: How do you prefer to move around your city, and why?
            frame: I prefer to go by… because…
          - question: What do you do with bottles or cans when they're empty?
            frame: When they're empty, I…
      - id: warmup-adv-title
        type: heading
        level: 4
        text: 'A2 Advanced: lifestyle and responsibility'
      - id: warmup-adv
        type: discussionQuestions
        items:
          - question: How can you use less water in your daily routine?
            frame: I can…
          - question: What do you do to keep your home or neighborhood clean?
            frame: To keep my home clean, I…
          - question: What products do you buy that are better for the environment, and why?
            frame: I buy… because it's better than…
          - question: What do you do with clothes you no longer use?
            frame: I give them to… / I sell them…
          - question: In the future, what changes do you want to make to pollute less?
            frame: I'm going to… / I will…
          - question: What kind of transport do you use most, and what are its advantages?
            frame: I usually use… It's cheaper / faster / greener than…
          - question: What is an eco-friendly product that you use? Compare it to a non-eco-friendly product that you use.
            frame: My… is more / less… than…
          - question: Who is the most sustainable person that you know? Why?
            frame: The most sustainable person I know is… because…
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: How are we going to save the planet?'
        skills: ['Future: going to and will']
        minutes: 25
        steps:
          - Look at the pictures of pollution, recycling and renewable energy. Answer the teacher's questions.
          - 'In groups of 3–4, create a mini eco-campaign: a short slogan, three future sentences with *going to* and *will*, and one warning with *if + will*.'
          - Present your campaign to the class (about one minute). Use gestures or a drawing to make it interesting.
          - 'Vote: the most creative campaign and the most realistic campaign.'
        example: |-
          *Teacher: What are you going to do to save the planet?*
          *Student: I'm going to recycle more bottles.*
          *Teacher: Good! What will happen if we don't recycle?*
          *Student: The oceans will be dirty.*
      - id: act1-questions
        type: discussionQuestions
        title: Talk about the pictures
        items:
          - question: What are we going to do if we want to save the planet?
            frame: We're going to…
          - question: What will happen if we don't change our habits?
            frame: If we don't change, there will be… / the planet will…
      - id: act1-campaign
        type: discussionQuestions
        title: Our eco-campaign
        items:
          - question: 'Slogan: ___'
            frame: Recycling is the future!
          - question: 'Future sentence 1: ___'
            frame: We're going to recycle more.
          - question: 'Future sentence 2: ___'
            frame: We're going to use less plastic.
          - question: 'Future sentence 3: ___'
            frame: We won't throw trash on the street.
          - question: 'Warning: ___'
            frame: If we don't do it, the planet will suffer.
      - id: act1-language
        type: callout
        tone: tip
        title: Useful language
        text: |-
          *We're going to…*
          *We will… / We won't…*
          *If we don't…, there will be…*
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Activity 2: The green market (role-play)'
        skills: [Comparisons]
        minutes: 20
        steps:
          - 'The classroom is a "green market". Each group gets a product (for example: cloth bag vs. plastic bag, local food vs. imported food, bicycle vs. car).'
          - Prepare arguments for why *your* product is the most ecological (5 minutes).
          - 'Role-play: buyers ask questions; sellers defend their products with comparisons (10 minutes).'
          - 'Vote: which product was the most convincing? (5 minutes)'
        example: |-
          *Our bag is more ecological than yours.*
          *This bike is less polluting than your car.*
      - id: act2-board
        type: table
        caption: Support board
        header: [Form, Example]
        rows:
          - ['**more … than**', This bag is more ecological than a plastic bag.]
          - ['**less … than**', This product is less harmful than other products in the market.]
          - ['**as … as**', This food is as healthy as local food.]
          - ['**the most / the least**', The bicycle is the most ecological transport.]
      - id: act2-sentences
        type: discussionQuestions
        title: Our arguments
        items:
          - question: 'Our product: ___'
          - question: 'Argument with *more … than*: ___'
            frame: Our… is more… than…
          - question: 'Argument with *less … than*: ___'
            frame: Our… is less… than…
          - question: 'Argument with *the most*: ___'
            frame: Our… is the most… in the market.
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Activity 3: Eco interview (rotating pairs)'
        skills: ['Future: going to and will', Comparisons]
        minutes: 20
        steps:
          - Interview a partner with the questions on Card A (5 minutes). Answer in full sentences with *going to*, *will* and comparisons.
          - Change partners and use Card B (5 minutes).
          - If there is time, change partners again and use Card C (5 minutes).
          - Tell the class one or two sentences about your partner.
        example: |-
          *A: What are you going to do to help the planet this week?*
          *B: I'm going to take the bus instead of driving.*
          *A: That's better than using a car every day.*
      - id: act3-card-a
        type: discussionQuestions
        title: 'Card A: future plans and habits'
        items:
          - question: What will you do tomorrow to help the planet?
            frame: Tomorrow I will probably…
          - question: What are you going to change next year to pollute less?
            frame: Next year I'm going to…
          - question: Who in your family recycles the most, and why?
            frame: My… recycles the most because…
      - id: act3-card-b
        type: discussionQuestions
        title: 'Card B: comparisons and predictions'
        items:
          - question: What pollutes more, cars or planes? Why?
            frame: … pollute more than… because…
          - question: Is your city cleaner or dirtier than other cities you know?
            frame: My city is cleaner / dirtier than… / as clean as…
          - question: In the future, do you think your country will have more or less pollution? Why?
            frame: There will be more / less pollution because…
      - id: act3-card-c
        type: discussionQuestions
        title: 'Card C (optional): personal choices and actions'
        items:
          - question: What product in your home is the least ecological?
            frame: The least ecological product in my home is…
          - question: What will you buy next time to be more sustainable?
            frame: Next time I will buy…
          - question: Do you prefer new or second-hand clothes? Why?
            frame: I prefer… because they're cheaper / greener than…
      - id: act3-report
        type: discussionQuestions
        title: Report about your partner
        items:
          - question: 'My partner ___'
            frame: My partner recycles more glass than paper. / In the future, she's going to use a bicycle. / He thinks his city is as clean as Tel Aviv.
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Activity 4: The green map'
        skills: [Comparisons]
        minutes: 15
        steps:
          - Look at the world map. Read the examples on the board.
          - In pairs, choose two cities or countries (your own or others). Write at least three comparison sentences about them (10 minutes).
          - Read one or two sentences to the class. The others agree or disagree politely (5 minutes).
        example: |-
          *Barcelona is cleaner than Buenos Aires.*
          *Tel Aviv is as modern as Madrid.*
          *Cars are less ecological than bicycles.*
          *I agree. I think Barcelona is cleaner than Buenos Aires, too.*
          *I'm not sure. Madrid is more modern than Tel Aviv, in my opinion.*
      - id: act4-language
        type: callout
        tone: tip
        title: Useful language
        text: |-
          *___ is cleaner / greener / more modern than ___.*
          *___ is less polluted than ___.*
          *___ is as big as / as busy as ___.*
          Examples: *Curitiba is greener than São Paulo. Rome is as historical as Athens. Tokyo is less polluted than Delhi.*
      - id: act4-sentences
        type: discussionQuestions
        title: Our two places
        items:
          - question: 'Comparison 1: ___'
            frame: … is cleaner / greener than…
          - question: 'Comparison 2: ___'
            frame: … is less polluted than…
          - question: 'Comparison 3: ___'
            frame: … is as busy as…
      # Activity 5
      - id: act5
        type: classActivity
        title: 'Activity 5: What will happen?'
        skills: ['Future: going to and will']
        steps:
          - Watch the short clip from the movie *Wall-E*.
          - 'You get a topic about the environment: animal extinction, cities, the countryside and forests, the ocean, recycling, or cars and traffic.'
          - 'Think about your topic in the future: will there be more pollution or less pollution? What will it look like in 2050?'
          - Tell the group your predictions with *will* and *won't*.
        example: "*In 2050 there will be more plastic in the ocean, and many fish will die. / There won't be so many cars in the city.*"
        resource:
          label: 'Video: Too Much Trash (Wall-E)'
          url: https://www.youtube.com/watch?v=yLroOavU3B4
      - id: act5-sentences
        type: discussionQuestions
        title: My topic in the future
        items:
          - question: 'My topic: ___'
          - question: 'Prediction 1: ___'
            frame: In the future, there will be…
          - question: 'Prediction 2: ___'
            frame: … will / won't…
      # Activity 6
      - id: act6
        type: classActivity
        title: 'Activity 6: Which country is the greenest?'
        skills: [Comparisons, 'Future: going to and will']
        minutes: 25
        steps:
          - 'Work in 3 groups. Group 1: Chile, solar energy in the Atacama Desert. Group 2: Colombia, electric transport in Bogotá. Group 3: Mexico, the reforestation program *Sembrando Vida*.'
          - Read about your country (beginner or intermediate text below). Prepare 2 comparison sentences and 2 future sentences (12 minutes).
          - Present your sentences to the class (10 minutes).
          - 'Class debate: which country will be the most ecological in the future, and why? Vote and explain your answer (5 minutes).'
        example: |-
          *Mexico will have more forests by 2050.*
          *Chile has more solar energy than Colombia.*
      - id: act6-guide
        type: discussionQuestions
        title: Guiding questions
        items:
          - question: Why is this project important?
            frame: This project is important because…
          - question: What will happen in the future?
            frame: In the future, … will…
          - question: Which country uses less / more energy, or has fewer forests?
            frame: … uses more… than… / … has fewer… than…
      - id: act6-basic-title
        type: heading
        level: 4
        text: 'Option A: Beginner'
      - id: act6-basic-info
        type: text
        text: Use simple sentences with the present simple, *will* and basic comparisons.
      - id: act6-basic-chile
        type: callout
        tone: info
        title: 'Group 1: Chile (solar energy)'
        text: |-
          Chile has a very big desert called **Atacama**.
          There is **a lot of sun** there.
          Chile uses the sun to make **clean energy**.
          In the future, Chile **will use more solar energy** than today.
      - id: act6-basic-colombia
        type: callout
        tone: info
        title: 'Group 2: Colombia (electric buses)'
        text: |-
          In **Bogotá**, there are many buses.
          The city is changing the buses to **electric buses**.
          Electric buses make **less pollution**.
          In the future, Bogotá **will be cleaner** and the air will be better.
      - id: act6-basic-mexico
        type: callout
        tone: info
        title: 'Group 3: Mexico (planting trees)'
        text: |-
          Mexico has a project called **Sembrando Vida** ("Sowing Life").
          Farmers plant **new trees**.
          The government **pays** the farmers to plant the trees.
          In the future, Mexico **will have more forests**.
      - id: act6-inter-title
        type: heading
        level: 4
        text: 'Option B: Intermediate'
      - id: act6-inter-info
        type: text
        text: Use connectors and more descriptive comparisons.
      - id: act6-inter-chile
        type: callout
        tone: info
        title: 'Group 1: Chile (solar energy)'
        text: |-
          The **Atacama Desert** receives some of the strongest sunlight in the world.
          Because of this, Chile produces **a large amount of solar energy**.
          Solar energy is **cleaner** than oil or coal.
          By 2050, **most of Chile's electricity will come from solar and wind power**.
      - id: act6-inter-colombia
        type: callout
        tone: info
        title: 'Group 2: Colombia (electric transport)'
        text: |-
          In **Bogotá**, public transport is changing.
          The city is replacing **old diesel buses** with **electric buses** to reduce pollution.
          Electric buses are **quieter and cleaner** than diesel buses.
          In the future, Bogotá **will have less air pollution and a better quality of life**.
      - id: act6-inter-mexico
        type: callout
        tone: info
        title: 'Group 3: Mexico (reforestation program)'
        text: |-
          Mexico created a reforestation program called **Sembrando Vida** ("Sowing Life").
          The project **pays farmers** to plant and take care of trees.
          This helps the **environment** and also creates **rural jobs**.
          By 2050, Mexico **will have more forests and stronger rural communities**.
      - id: act6-sentences
        type: discussionQuestions
        title: Our group's sentences
        items:
          - question: 'Comparison 1: ___'
            frame: … has more / less… than…
          - question: 'Comparison 2: ___'
            frame: … is cleaner / greener than…
          - question: 'Future 1: ___'
            frame: In the future, … will…
          - question: 'Future 2: ___'
            frame: By 2050, … will…
          - question: Which country will be the most ecological in the future? Why?
            frame: I think… will be the most ecological because…
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: **going to and will** (introduction round, Activities 1,
          3, 5 and 6) and **comparisons** with comparatives and superlatives (Activities
          2, 3, 4 and 6). Choose the preparation questions for your group's level (A2
          Basic or A2 Advanced). Encourage honesty and curiosity in the introduction round:
          the goal is to observe habits, not to judge.
      - id: n-warmup
        anchor: warmup-title
        text: Ask each student at least two questions. Answers typed here are visible to you below each question.
      - id: n-act1
        anchor: act1
        minutes: 25
        text: >-
          **Step 1 (5 min):** show quick images of pollution, recycling and renewable
          energy (slides, printed cards or a short video). The old notebook links a Canva
          design with pictures (not on the link allow-list); show it on screen or use your
          own pictures. Write both question types (*What are you going to do…? What will
          happen if…?*) on the board. **Step 2 (12 min):** monitor the groups and check
          grammar and pronunciation; encourage creativity and teamwork. **Step 3 (7
          min):** after each presentation give two or three positive comments and one
          grammar correction for everyone to learn from. **Step 4 (3 min):** class vote;
          optionally give small symbolic awards such as "Best slogan" or "Best teamwork".
      - id: n-act3
        anchor: act3
        minutes: 20
        text: >-
          **Set-up (2 min):** give each student a question card or show the questions on
          the board (the old notebook links Canva question cards, not on the link
          allow-list). Interviews last 3–4 minutes, then students change partners twice.
          **Report (10 min):** write a few examples on the board, highlight correct
          grammar and correct common errors.
      - id: n-act4
        anchor: act4
        minutes: 15
        text: >-
          **Set-up (2 min):** show a world map (digital or printed; the old notebook links
          a Canva map, not on the link allow-list) and review the grammar with 2–3
          examples on the board. **Variation, the classroom map:** if no world map is
          available, students draw a simple map of their own city or country and compare
          local places (*My neighborhood is cleaner than downtown. The park is as quiet as
          the beach.*).
      - id: n-act5
        anchor: act5
        text: Give each student one topic. Accept short predictions from beginners (*The ocean will be dirty.*); ask stronger students for a reason with *because*.
      - id: n-act6
        anchor: act6
        minutes: 25
        text: >-
          Give beginner groups the Option A texts and intermediate groups the Option B
          texts. *Sembrando Vida* is the real name of the Mexican program; say it as a
          name, not as an English word.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: sustainability-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-going-to
        type: ruleSummary
        skill: Future with going to
        rules:
          - text: 'Use **going to** for **plans and intentions** (we decided before we speak).'
            examples:
              [
                "I'm going to recycle more.",
                "We're going to plant trees.",
                "They're going to use bicycles.",
              ]
          - text: '**Form:** subject + *am / is / are* + *going to* + base verb.'
          - text: "**Negative:** *I'm not / he isn't / we aren't going to* + base verb."
            examples: ["I'm not going to use plastic bags."]
      - id: rules-will
        type: ruleSummary
        skill: Future simple (will)
        rules:
          - text: 'Use **will** for **predictions** (what we think will happen) and for decisions or promises we make **now**.'
            examples:
              [
                Mexico will have more forests by 2050.,
                Colombia will be cleaner in the future.,
                There will be less pollution in cities.,
              ]
          - text: "**Form:** subject + *will* + base verb. **Negative:** *won't* (will not) + base verb."
            examples: ["We won't throw trash on the street."]
          - text: '**Warning with if:** *If* + present simple, … *will* + base verb.'
            examples: ["If we don't recycle, the oceans will be dirty."]
      - id: rules-comparatives
        type: ruleSummary
        skill: 'Comparatives: comparing two things'
        rules:
          - text: 'Long adjectives: **more / less + adjective + than**.'
            examples:
              [
                The bike is more ecological than the car.,
                A cloth bag is less polluting than a plastic one.,
              ]
          - text: 'Short adjectives: **adjective + -er + than**.'
            examples:
              [My city is cleaner than yours., 'green → greener, big → bigger, dirty → dirtier']
          - text: '**as + adjective + as** = the same.'
            examples: [My city is as noisy as yours.]
      - id: rules-superlatives
        type: ruleSummary
        skill: 'Superlatives: comparing three or more things'
        rules:
          - text: 'Long adjectives: **the most / the least + adjective** (the highest or the lowest degree).'
            examples:
              [
                Chile is the most advanced country in solar energy.,
                Cars are the least ecological transport option.,
              ]
          - text: 'Short adjectives: **the + adjective + -est**. Irregular: **good → better → the best**.'
            examples: [Bogotá is going to be the cleanest city., Solar energy is the best option.]
      - id: comparisons-table
        type: table
        caption: Comparatives and superlatives
        header: [Adjective, Comparative, Superlative]
        rows:
          - [clean, cleaner than, the cleanest]
          - [big, bigger than, the biggest]
          - [dirty, dirtier than, the dirtiest]
          - [ecological, more / less ecological than, the most / the least ecological]
          - [good, better than, the best]
      - id: overview-table
        type: table
        caption: Quick overview
        header: [Grammar, Use, Example]
        rows:
          - ['*going to*', Plan or intention, "I'm going to use less plastic."]
          - ['*will*', Prediction, The air will be cleaner.]
          - ['*more / less … than, as … as*', Comparison, Bikes are more ecological than cars.]
          - ['*the most / the least*', Superlative, Solar energy is the most sustainable option.]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through the rules with the group and ask for one new example for each rule. The short-adjective rule and the first table are new (not in the old notebook).

  # ── after class ──────────────────────────────────────────────────────────
  - slug: sustainability-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-going-to
        type: aiTutorPrompt
        title: 'Message 1: Future plans (going to)'
        intro: "Then write your sentences. Example: *I'm going to use less plastic. I'm going to recycle paper. I'm going to walk more and drive less.*"
        message: |-
          Hi Mori! I'll write 3 sentences with "I'm going to" about my plans to protect the planet.
          Please correct my sentences and ask me one question about each plan.
      - id: mori-will
        type: aiTutorPrompt
        title: 'Message 2: Predictions (will)'
        intro: 'Then write your predictions. Example: *There will be fewer cars. Solar energy will be cheaper. The air will be cleaner.*'
        message: |-
          Hi Mori! I'll make 3 predictions about the planet in 2050 with "will".
          Please correct my sentences and tell me if you agree.
      - id: mori-comparisons
        type: aiTutorPrompt
        title: 'Message 3: Comparisons'
        intro: 'Then write your sentences: one with *more*, one with *less* and one with *as … as*. Example: *The bicycle is more ecological than the car. A cloth bag is less polluting than a plastic one. My city is as big as yours.*'
        message: |-
          Hi Mori! I'll write 3 comparison sentences about the environment: one with "more … than", one with "less … than" and one with "as … as".
          Please check my sentences and correct my mistakes.
      - id: mori-superlatives
        type: aiTutorPrompt
        title: 'Message 4: Superlatives'
        intro: 'Then write your sentences. Example: *Chile is the most advanced country in solar energy. Plastic is the most polluting material.*'
        message: |-
          Hi Mori! I'll write 2 sentences with "the most" or "the least" about the environment.
          Please correct them and ask me one question.
      - id: mori-then-now
        type: aiTutorPrompt
        title: 'Message 5: Then and now'
        intro: 'Answer with comparisons. Example: *It was less hot 50 years ago. Today it is hotter than before.*'
        message: |-
          Hi Mori! Let's compare the past and today with comparatives. Please ask me these questions one by one and correct my answers:
          1. How many things did our parents buy compared to how many things we buy today?
          2. How hot was it in Israel 50 years ago, and how hot is it now?
          3. How pretty was the place you lived in 5 years ago, compared to now?
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

