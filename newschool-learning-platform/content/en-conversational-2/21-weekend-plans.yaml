sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: weekend-plans-class
    title: 'Class: Weekend plans'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Weekend plans
      - id: skills
        type: cycleOverview
        skills:
          - name: 'Future: going to and will'
            description: Plans with *going to* (*We are going to visit our grandparents.*) and predictions and quick decisions with *will* (*I think it will rain on Saturday.*)
          - name: Comparisons
            description: '*more / less … than, -er than, as … as, the most / the least, the best / the worst* (*My weekend is more relaxing than yours.*)'
      - id: quizlet
        type: externalLink
        label: Weekend plans on Quizlet
        url: https://quizlet.com/il/1032257324/conversational-english-weekend-plans-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        prompt: Say your name and one plan for next week.
        frame: I am ___. Next week I'm going to ___.
        example: I am Dana. Next week I'm going to visit my sister in Haifa.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: What are you planning to do this weekend?
            frame: This weekend I'm going to…
          - question: What is the best weekend you can imagine?
            frame: The best weekend I can imagine is…
          - question: What is the worst weekend you can imagine?
            frame: The worst weekend I can imagine is…
          - question: Are you going to spend time with friends or family this weekend?
            frame: Yes, I'm going to… with… / No, I'm not going to…
          - question: Do you prefer doing indoor or outdoor activities during the weekend? Why?
            frame: I prefer… because they're more… than…
          - question: What is your favorite thing about the weekend?
            frame: My favorite thing about the weekend is…
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: A weekend abroad'
        skills: ['Future: going to and will']
        steps:
          - 'Choose a city and research it. Plan the perfect weekend there: transportation, food, sightseeing, culture and relaxation.'
          - 'Work in pairs. Student A is a **tourist center guide**; Student B is a **tourist**.'
          - The guide gives the tourist recommendations for Thursday to Sunday with modal verbs and the future.
          - Swap roles. Now Student B is the guide and gives recommendations to Student A.
          - Share with the group. Explain the itinerary and the recommendations. The tourist says what they will do.
        example: |-
          **Guide:** *On Thursday, you should visit the famous art museum in the city center. You can also grab lunch at a local café nearby. On Friday, you could take a boat tour to see the city from the river. It might be the highlight of your trip! On Saturday, you must hike up the nearby mountain for an amazing view. And on Sunday, you can relax at the botanical garden, but you have to try the herbal tea at the café there.*
          **Tourist:** *On Thursday, I will visit the famous art museum in the city center. After that, I will have lunch at a local café nearby. On Friday, I will take a boat tour along the river to see the city from a different perspective. On Saturday, I will hike up the nearby mountain for an amazing view, and on Sunday, I will relax at the botanical garden.*
      - id: act1-modals
        type: table
        caption: Modal verbs for recommendations
        header: [Modal verb, Use]
        rows:
          - ['**should**', a recommendation]
          - ['**can / could**', a possibility]
          - ['**might**', a suggestion or a possibility]
          - ['**must**', a strong recommendation]
          - ['**have to**', a necessity]
      - id: act1-plan
        type: discussionQuestions
        title: My weekend abroad
        items:
          - question: 'My city: ___'
          - question: 'Thursday: ___'
            frame: You should… / I will…
          - question: 'Friday: ___'
            frame: You could… / I will…
          - question: 'Saturday: ___'
            frame: You must… / I will…
          - question: 'Sunday: ___'
            frame: You can… but you have to… / I will…
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Activity 2: Perfect weekend debate'
        skills: [Comparisons]
        minutes: 20
        steps:
          - The teacher shows a debate topic. Debate it for 5 minutes, then move to the next topic.
          - Not every student has to answer every question, but **everyone must speak** during the activity.
          - Say which option is better and why. Use comparisons.
        example: '*A weekend on a trip is more exciting than a weekend at home, but staying at home is cheaper and more relaxing.*'
      - id: act2-topics
        type: discussionQuestions
        title: Debate topics
        items:
          - question: '**Weekend at home vs. weekend on a trip.** Which is better and why? Staying at home *in* your comfort zone, or going on a trip *to* explore new places *around* the city or country?'
            frame: … is better than… because…
          - question: '**Morning activities vs. evening activities.** Which is better for your weekend? Waking up early *in* the morning to start the day with energy, or enjoying a relaxed evening *with* friends or family *at* home?'
            frame: … are more… than…
          - question: '**Outdoor adventure vs. indoor hobbies.** Is it better to spend the weekend hiking *in* the mountains or biking *around* the lake, or would you rather stay *in* and enjoy activities like reading *by* the window or cooking *in* the kitchen?'
            frame: For me, … is the most… / … is less… than…
          - question: '**Staying active vs. resting.** Which is better during the weekend? Physical activities like running *through* the park or working out *at* the gym, or staying *in* bed and resting *for* the whole day?'
            frame: … is healthier / more fun than…
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Activity 3: What are they going to do?'
        skills: ['Future: going to and will']
        steps:
          - Choose a person. It can be someone you know, a famous person, or even a character from a book or a movie!
          - Make a fun weekend schedule for this person with *going to*.
        example: |-
          **Example: Mario the Chef**
          *Friday morning: He is going to go to the market to buy fresh vegetables.*
          *Friday afternoon: He is going to prepare special dishes for his restaurant.*
          *Friday night: He is going to cook dinner for his guests.*
          *Saturday morning: He is going to sleep late and drink a big cup of coffee.*
          *Saturday afternoon: He is going to take a cooking class with his friends.*
          *Saturday night: He is going to watch a movie and relax on the sofa.*
      - id: act3-schedule
        type: discussionQuestions
        title: What is he / she going to do?
        items:
          - question: 'My person: ___'
          - question: 'Friday morning: ___'
            frame: He / She is going to…
          - question: 'Friday afternoon: ___'
            frame: He / She is going to…
          - question: 'Friday night: ___'
            frame: He / She is going to…
          - question: 'Saturday morning: ___'
            frame: He / She is going to…
          - question: 'Saturday afternoon: ___'
            frame: He / She is going to…
          - question: 'Saturday night: ___'
            frame: He / She is going to…
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Activity 4: Who has the best weekend plan?'
        skills: [Comparisons]
        steps:
          - Compare the schedule you wrote in Activity 3 with another student's schedule, and explain why your weekend is better.
          - Vote for the winner in each category on a piece of paper (in class) or in a private chat (online).
          - Listen to the results. Every winner gets a round of applause!
        example: |-
          *Mario's weekend is more fun than Dana's weekend.*
          *My weekend is less boring than yours.*
          *Saturday night is going to be the most relaxing part.*
          *My plan is better than yours because it has more time with friends.*
        wordBank: [more fun than, less boring than, the most relaxing, better than]
      - id: act4-compare
        type: discussionQuestions
        title: My weekend is better!
        items:
          - question: 'Comparison 1: ___'
            frame: My weekend is more… than…
          - question: 'Comparison 2: ___'
            frame: … is less… than…
          - question: 'Comparison 3: ___'
            frame: … is going to be the most… part.
      - id: act4-vote
        type: discussionQuestions
        title: The results
        items:
          - question: The most relaxing weekend is…
          - question: The most fun weekend is…
          - question: The most active weekend is…
          - question: The best family time weekend is…
          - question: The most surprising weekend is…
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: **going to and will** (introduction round, warm-up,
          Activities 1 and 3) and **comparisons** (warm-up 5, Activities 2 and 4).
          Activity 1 also practises modal verbs for recommendations. Do Activity 4 only
          after Activity 3: students compare the schedules they wrote there.
      - id: n-warmup
        anchor: warmup-title
        text: Ask each student at least two questions. Answers typed here are visible to you below each question.
      - id: n-act1
        anchor: act1
        text: >-
          Students need time to research a city (in class or as preparation before the
          lesson). Encourage the modals in the table: *should* (recommendation), *can /
          could* (possibility), *might* (suggestion or possibility), *must* (strong
          recommendation), *have to* (necessity). The tourist answers with *will*.
      - id: n-act2
        anchor: act2
        minutes: 20
        text: Show one topic at a time and keep 5 minutes per topic. Make sure every student speaks at least once.
      - id: n-act4
        anchor: act4
        text: >-
          After the comparisons, say: "Now we're going to vote! But not for one winner…
          We'll have different categories!" Write the categories on the board (most
          relaxing, most fun, most active, best family time, most surprising). Collect the
          votes on paper (in class) or in a private chat (online), then reveal the
          results: *The most relaxing weekend is…*

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: weekend-plans-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-future
        type: ruleSummary
        skill: 'Future: will and going to'
        rules:
          - text: 'Use **will** for **decisions made at the moment of speaking** and for promises. **Form:** subject + *will* + base verb.'
            examples:
              [
                "I'm tired. I will take a nap this afternoon.",
                'Okay, I will call my friend and invite her over tonight.',
              ]
          - text: 'Use **will** for **predictions**: things you **think** will happen.'
            examples:
              [
                I think it will rain on Saturday.,
                "She will probably go to the beach if it's sunny.",
              ]
          - text: 'Use **going to** for **plans and intentions** you decided **before** speaking. **Form:** subject + *am / is / are* + *going to* + base verb.'
            examples:
              [
                We are going to visit our grandparents this weekend.,
                He is going to watch a movie on Friday night.,
              ]
          - text: 'Use **going to** also when you can see **now** that something is going to happen.'
            examples: ["Look at those clouds! It's going to rain."]
      - id: rules-comparatives
        type: ruleSummary
        skill: 'Comparatives: comparing two things'
        rules:
          - text: 'Short adjectives (one syllable, or two syllables ending in *-y*): **adjective + -er + than**.'
            examples:
              [
                My plan is shorter than yours.,
                Saturday is hotter than Friday.,
                This game is easier than the last one.,
              ]
          - text: 'Spelling: one vowel + one consonant → double the consonant (*hot → hotter, big → bigger*); *-y* → *-ier* (*easy → easier*).'
          - text: 'Long adjectives (two or more syllables, not ending in *-y*): **more / less + adjective + than**.'
            examples:
              [
                Her weekend was more exciting than mine.,
                This movie is more interesting than that one.,
              ]
          - text: 'Irregular: **good → better**, **bad → worse**. *Fun* is different: **more fun**.'
            examples: [My plan is better than yours., Your weekend is more fun than mine.]
      - id: rules-superlatives
        type: ruleSummary
        skill: 'Superlatives: comparing three or more things'
        rules:
          - text: 'Use superlatives to compare **more than two things**, or to show the extremes.'
          - text: '**Best / worst:** *the best* is the superlative of *good*; *the worst* is the superlative of *bad*.'
            examples:
              [That was the best weekend ever!, Sunday night was the worst part of my weekend.]
          - text: 'Short adjectives: **the + adjective + -est**.'
            examples: [Friday is the shortest day of my weekend., Saturday was the hottest day.]
          - text: 'Long adjectives: **the most** (number one, the highest) / **the least** (the lowest) + adjective.'
            examples:
              [
                Saturday morning was the most peaceful time.,
                Cleaning my room was the least fun activity.,
              ]
      - id: comparisons-table
        type: table
        caption: Comparatives and superlatives
        header: [Adjective, Comparative, Superlative]
        rows:
          - [short, shorter than, the shortest]
          - [hot, hotter than, the hottest]
          - [easy, easier than, the easiest]
          - [exciting, more / less exciting than, the most / the least exciting]
          - [fun, more fun than, the most fun]
          - [good, better than, the best]
          - [bad, worse than, the worst]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through the rules with the group and ask for one new example for each rule. The spelling rule, the short superlatives and the table are new (not in the old notebook).

  # ── after class ──────────────────────────────────────────────────────────
  - slug: weekend-plans-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will answer; then do what the instructions say.
      - id: mori-start
        type: aiTutorPrompt
        title: 'Message 1: Start the conversation'
        intro: "Mori will answer. Then write about your own plans with *going to*. Example: *I'm going to go shopping with my sister. We're also going to watch a movie.*"
        message: Hi! What are you going to do this weekend?
      - id: mori-questions
        type: aiTutorPrompt
        title: 'Message 2: Ask Mori 3 more questions'
        intro: 'Send this message, then ask your 3 questions one by one. Some ideas: *Are you going to stay home or go out? What will you do this weekend? Will you go anywhere special on Saturday or Sunday? Who will you spend time with this weekend? What will you eat or cook this weekend? Are you going to do more things on Saturday or Sunday?*'
        message: |-
          Mori, now I'm going to ask you 3 more questions about your weekend with "will" and "going to".
          Please answer them, and correct my questions if they have mistakes.
      - id: mori-compare
        type: aiTutorPrompt
        title: 'Message 3: Compare our weekends'
        intro: "Compare your plans with Mori's. Example: *My weekend is going to be more exciting than yours. You are going to do more relaxing things than me. Our weekends are different, but both sound fun.*"
        message: |-
          Mori, now I'll compare my weekend plans with yours, using comparisons.
          Please correct my sentences. Then help me write a short summary: What am I going to do? What are you going to do? What is similar? What is different?
      - id: summary-callout
        type: callout
        tone: info
        title: Write a short summary
        text: |-
          Write a short summary in your notebook or in Google Docs:
          What are you going to do? What is Mori going to do? What is similar? What is different?
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: weekend-plans-practice
    book: workbook
    title: 'Practice: Weekend plans'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. Each answer is checked right away, and you can try again.
      - id: ex-future
        type: activity
        activity: weekend-plans-future
      - id: ex-comparisons
        type: activity
        activity: weekend-plans-comparisons

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: weekend-plans-vocabulary
    title: Vocabulary
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Weekend plans words
        glossLang: he
        link: https://quizlet.com/il/1032257324/conversational-english-weekend-plans-flash-cards/
        items: &weekend-plans-words
          - { term: Weekend, gloss: סוף שבוע }
          - { term: Plan, gloss: תוכנית / תכנון }
          - { term: Future, gloss: עתיד }
          - { term: Opinion, gloss: דעה }
          - { term: Experience, gloss: חוויה }
          - { term: Schedule, gloss: לוח זמנים }
          - { term: Morning, gloss: בוקר }
          - { term: Afternoon, gloss: אחר הצהריים }
          - { term: Night, gloss: לילה }
          - { term: Tourist, gloss: תייר }
          - { term: Guide, gloss: מדריך }
          - { term: Recommendation, gloss: המלצה }
          - { term: Possibility, gloss: אפשרות }
          - { term: Necessity, gloss: צורך }
          - { term: Relaxation, gloss: הרפיה }
          - { term: Culture, gloss: תרבות }
          - { term: Food, gloss: אוכל }
          - { term: Transportation, gloss: תחבורה }
          - { term: Debate, gloss: דיון }
          - { term: Outdoors, gloss: בחוץ }
          - { term: Indoors, gloss: בפנים }
          - { term: Fun, gloss: כיף }
          - { term: Boring, gloss: משעמם }
          - { term: Active, gloss: פעיל }
          - { term: Rest, gloss: מנוחה }
          - { term: Vote, gloss: להצביע }
          - { term: Winner, gloss: מנצח }
          - { term: Surprising, gloss: מפתיע }
          - { term: Favorite, gloss: מועדף }
          - { term: Energy, gloss: אנרגיה }

vocabulary:
  - slug: weekend-plans
    title: Weekend plans
    items: *weekend-plans-words

activities:
  - slug: weekend-plans-future
    title: 'Going to and will: weekend plans'
    minutes: 8
    items:
      - id: visit-grandparents
        type: multipleChoice
        prompt: 'We decided yesterday: we ___ visit our grandparents this weekend.'
        options:
          - { text: are going to, correct: true }
          - {
              text: is going to,
              feedback: '*Is* is for *he, she, it*. With *we*, use *are going to*.',
            }
          - {
              text: going to,
              feedback: 'You need *am / is / are* before *going to*: *we are going to visit*.',
            }
      - id: take-nap
        type: multipleChoice
        prompt: "I'm tired. I decide now: I ___ take a nap this afternoon."
        options:
          - { text: will, correct: true }
          - {
              text: am going,
              feedback: 'With *going* you need *to*: *I am going to*. For a decision at the moment of speaking, use *will*.',
            }
          - { text: will to, feedback: "Don't use *to* after *will*: *I will take a nap*." }
      - id: think-rain
        type: fillBlank
        prompt: 'A prediction: complete with *will* and the verb *rain*.'
        text: I think it ___ on Saturday.
        blanks: [[will rain]]
      - id: he-is-going-to
        type: fillBlank
        prompt: Complete with *going to* and the verb *watch*.
        text: He ___ a movie on Friday night.
        blanks: [[is going to watch]]
      - id: decided-before
        type: trueFalse
        prompt: We use *will* for plans we decided before we speak.
        answer: false
        feedback:
          correct: 'Right! Plans we decided before are *going to*: *We are going to visit our grandparents.*'
          incorrect: 'Plans we decided before speaking use *going to*: *We are going to visit our grandparents.* *Will* is for decisions now and predictions.'
      - id: look-clouds
        type: multipleChoice
        prompt: Look at those black clouds! It ___ rain.
        options:
          - { text: is going to, correct: true }
          - { text: going to, feedback: 'You need *is* before *going to*: *It is going to rain.*' }
          - {
              text: will to,
              feedback: "Don't use *to* after *will*. Here we can see the clouds now, so *It is going to rain.*",
            }
      - id: match-schedule
        type: matching
        prompt: Match the beginning and the end of each sentence from Mario's weekend.
        pairs:
          - [He is going to go, to the market.]
          - [He is going to cook, dinner for his guests.]
          - [He is going to take, a cooking class.]
          - [He is going to relax, on the sofa.]
      - id: order-shopping
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I'm going to go shopping with my sister.

  - slug: weekend-plans-comparisons
    title: 'Comparisons: more fun than, the best weekend'
    minutes: 8
    items:
      - id: hotter
        type: fillBlank
        prompt: Write the comparative of *hot*.
        text: Saturday is ___ than Friday.
        blanks: [[hotter]]
      - id: easier
        type: multipleChoice
        prompt: This game is ___ than the last one.
        options:
          - { text: easier, correct: true }
          - { text: more easy, feedback: '*Easy* ends in *-y*, so we say *easier* (y → i + -er).' }
          - { text: easyer, feedback: 'Change *y* to *i* and add *-er*: *easier*.' }
      - id: more-exciting
        type: multipleChoice
        prompt: Her weekend was ___ than mine.
        options:
          - { text: more exciting, correct: true }
          - {
              text: excitinger,
              feedback: '*Exciting* is a long adjective, so use *more exciting*.',
            }
          - {
              text: the most exciting,
              feedback: 'We compare two weekends with *than*, so use the comparative: *more exciting than*.',
            }
      - id: best-weekend
        type: fillBlank
        prompt: Write the superlative of *good*.
        text: That was the ___ weekend ever!
        blanks: [[best]]
      - id: worst
        type: multipleChoice
        prompt: Sunday night was the ___ part of my weekend. I didn't like it.
        options:
          - { text: worst, correct: true }
          - { text: baddest, feedback: '*Bad* is irregular: *bad → worse → the worst*.' }
          - { text: most bad, feedback: '*Bad* is irregular: the superlative is *the worst*.' }
      - id: least-fun
        type: trueFalse
        prompt: '*Cleaning my room was the least fun activity.* means cleaning was the most fun activity.'
