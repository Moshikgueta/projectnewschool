# Cycle "Weekend plans", converted from the Conversational English (level 2)
# digital notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review`
# below. Blocks without `lang` are in the course language (English).
course: en-conversational-2
slug: weekend-plans
title: Weekend plans
goal: Talk about weekend plans with going to and will, and compare plans with comparatives and superlatives.
position: 21
status: in_review

review:
  - >-
    The two workbook exercises ("Future: going to and will" and "Comparisons") are NEW:
    the notebook has no self-study exercises. They were written from the cycle's summary
    rules, the activity examples and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Warm-up corrections: "How is it the worst weekend you can imagine?" → "What is the
    worst weekend you can imagine?"; "Will you be spending time with friends or family
    this weekend?" (future continuous, above A2) → "Are you going to spend time with
    friends or family this weekend?". Please confirm.
  - >-
    Summary corrections: "use going to … when something is about to happen" → "when we
    can see now that something is going to happen" with the NEW example *Look at those
    clouds! It's going to rain.* Comparatives: the spelling changes in the source
    examples are now explained (*hot → hotter*: double the last letter; *easy →
    easier*: y → i). "Best / worst = most good / most bad" → "*best* is the superlative
    of *good*, *worst* of *bad*". "Most / least … say something is number one in a
    group" → *the most* is number one (the highest), *the least* is the lowest. A NEW
    rule for short superlatives (*the + adjective + -est*) and a NEW table were added,
    because the activities use *the best*, *the most relaxing* and *better than*.
  - >-
    Activity 1 practises modal verbs (should, can, could, might, must, have to) as well
    as the future; the modals are kept as in the source. Stage 6 ("The student who
