vocabulary:
  - slug: social-media-future
    title: Social media and the future
    items: *social-media-future-words

activities:
  - slug: social-media-future-going-to
    title: "Going to: I'm going to post a photo"
    minutes: 8
    items:
      - id: she-is
        type: multipleChoice
        prompt: She ___ follow more cooking pages.
        options:
          - { text: is going to, correct: true }
          - {
              text: are going to,
              feedback: "With *she*, use *is*: *She is (she's) going to follow*.",
            }
          - {
              text: going to,
              feedback: 'We need *am / is / are* before *going to*: *She is going to follow*.',
            }
      - id: i-am
        type: fillBlank
        prompt: Complete with *am*, *is* or *are*.
        text: I ___ going to post a new photo this weekend. My friends ___ going to like it!
        blanks: [[am], [are]]
        wordBank: [am, is, are]
      - id: question-order
        type: multipleChoice
        prompt: Which question is correct?
        options:
          - { text: What are you going to post this year?, correct: true }
          - {
              text: What you are going to post this year?,
              feedback: 'In a question, *are* comes before *you*: *What are you going to post?*',
            }
          - {
              text: What are you going post this year?,
              feedback: "Don't forget *to*: *going to post*.",
            }
      - id: negative
        type: fillBlank
        prompt: Complete with *I* + the negative of *am*.
        text: ___ going to use TikTok tonight. I'm going to read a book.
        blanks: [["I'm not", I am not]]
      - id: plans
        type: trueFalse
        prompt: We use *going to* + base verb for plans and predictions about the future.
        answer: true
        feedback:
          correct: "Right! *I'm going to post a photo* (plan). *Apps are going to be faster* (prediction)."
          incorrect: 'It is true: *going to* is for plans and predictions.'
      - id: short-forms
        type: matching
        prompt: Match the long and short forms.
        pairs:
          - [I am, "I'm"]
          - [she is, "she's"]
          - [they are, "they're"]
          - [it is, "it's"]
          - [we are, "we're"]
      - id: going-to-verb
        type: fillBlank
        prompt: Complete with *going to* + the verb in brackets.
        text: On Friday, I'm ___ a photo from my weekend. (share)
        blanks: [[going to share]]
      - id: order-break
        type: reorderSentence
        prompt: Put the words in order.
        sentence: On Sunday, I'm going to take a break.

  - slug: social-media-future-comparisons
    title: 'Comparisons: faster than, the most popular'
    minutes: 8
    items:
      - id: faster
        type: multipleChoice
        prompt: TikTok is ___ than YouTube. (fast)
        options:
          - { text: faster, correct: true }
          - { text: more fast, feedback: '*Fast* is a short adjective: add *-er* → *faster than*.' }
          - {
              text: fastest,
              feedback: '*Fastest* is for three or more things (*the fastest*). With *than*, use *faster*.',
            }
      - id: the-most
        type: multipleChoice
        prompt: Instagram is ___ visual social media app.
        options:
          - { text: the most, correct: true }
          - { text: the more, feedback: 'The superlative is *the most*, not *the more*.' }
          - { text: most, feedback: "Don't forget *the*: *the most visual*." }
      - id: more-less
        type: fillBlank
        prompt: Complete with *more* or *less*.
        text: YouTube is ___ addictive than Instagram.
        blanks: [[less, more]]
      - id: fastest
        type: fillBlank
        prompt: Complete with the superlative of *fast*.
        text: TikTok is the ___ app.
        blanks: [[fastest]]
      - id: better
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: My new profile is going to be better than my old one., correct: true }
          - {
              text: My new profile is going to be more good than my old one.,
              feedback: '*Good* is irregular: *good → better → the best*.',
            }
          - {
              text: My new profile is going to be gooder than my old one.,
              feedback: '*Good* is irregular: *good → better → the best*.',
            }
      - id: forms
        type: matching
        prompt: Match each adjective with its comparative.
        pairs:
          - [big, bigger]
          - [safe, safer]
          - [easy, easier]
          - [good, better]
          - [popular, more popular]
      - id: long-adjectives
        type: trueFalse
        prompt: 'For long adjectives like *popular*, we say *more popular*, not *popularer*.'
        answer: true
        feedback:
          correct: 'Right! Long adjectives: *more / less popular*, *the most popular*.'
          incorrect: 'It is true: *more popular*, *the most popular*.'
      - id: order-least
        type: reorderSentence
        prompt: Put the words in order.
        sentence: Facebook is the least popular app in my family.
