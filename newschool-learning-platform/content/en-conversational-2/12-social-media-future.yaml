# Cycle "Social media and the future", converted from the Conversational English
# (level 2) digital notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see
# `review` below. Blocks without `lang` are in the course language (English).
course: en-conversational-2
slug: social-media-future
title: Social media and the future
goal: Talk about future plans for social media with going to, and compare apps with comparatives and superlatives.
position: 12
status: in_review

review:
  - >-
    The two workbook exercises ("Going to" and "Comparisons") are NEW: the notebook has
    no self-study exercises. They were written from the cycle's two skills, its summary
    rules, the activity examples and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Skill name: the source calls "am / is / are going to + verb" the "future simple".
    In English the future simple is *will* + verb; the skill is renamed "Going to"
    (future with going to). Please confirm.
  - >-
    "Social media" was treated as both singular and plural ("Social media is going to
    make the world better" / "Social media are going to make the world worse"). Both
    exist in English, but the cycle now uses the singular everywhere, which is more
    common: warm-up 2 model "They are going to cause…" → "It's going to cause more
    addiction and less family time"; warm-up 5 model "They are going to be faster…" →
    "Apps are going to be faster and have more short videos"; Activity 5 Group B "are
    going to" → "is going to"; summary example "Social media are going to be faster" →
    "Social media apps are going to be faster in the future".
  - >-
    Warm-up 6 "If all social media apps closed tomorrow, how would you communicate with
    your friends?" uses the second conditional, but its model answers with *going to*
    ("I'm going to use my phone…"). It is rewritten to practise the cycle's skill: "All
    social media apps are going to close tomorrow! How are you going to talk to your
    friends?" Please confirm.
  - >-
    Summary corrections: the -est list "biggest, funniest, safest" mixed up *fun* and
    *funny*. The summary now says *fun → more fun → the most fun* and *funny → funnier
    → the funniest*. Spelling notes were added (big → bigger, safe → safer, easy →
    easier) and the irregular *good → better → the best*, used in Activity 2 ("better
    than"), with a NEW table. "Less" + adjective works with all adjectives (less fast);
    this is said in the rule.
  - >-
    Activity 4 extension "Who has the most digital week?" → "Whose week is the most
    digital?" (clearer). Section headings were cleaned (stray asterisks, "Activity 3 -
    The Future Social Network (Invention)").
  - >-
    Activity 1 asks students to open Instagram / TikTok / YouTube / X; no links are
    given, so none are added. The optional extensions of Activities 1, 3 and 4 and the
    stage timings are teacher notes. The "Quick review check" became a callout in the
    summary.
  - >-
    Times given as ranges are recorded as the upper value (Activity 2: 18–22 → 22;
    Activity 3: 20–25 → 25; stages 5–7 → 7, 3–5 → 5, 7–10 → 10). Activities 1 and 5
    have no time in the source.
  - >-
    Vocabulary: "Social media" רשת חברתית → "רשתות חברתיות"; "Prediction" ניבוי →
    "תחזית"; "More … than" / "Less … than" glosses "יותר … מ" / "פחות … מ" →
    "יותר … מ־" / "פחות … מ־". Please confirm.
  - >-
    The "Student 1/2/3" lines are replaced by the optional answer boxes (decision C2).
    The Quizlet link is kept without its "?new" parameter. The empty "Date /
    Participants" headings were left out.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: social-media-future-class
    title: 'Class: Social media and the future'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Social media and the future
      - id: skills
        type: cycleOverview
        skills:
          - name: Going to
            description: '*am / is / are going to* + verb for plans and predictions'
          - name: Comparisons
            description: '*more / less … than*, *-er than*, *the most / the least*, *the -est*'
      - id: quizlet
        type: externalLink
        label: Social media and the future on Quizlet
        url: https://quizlet.com/it/1098760126/social-media-future-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        prompt: Say two sentences. You can add one more sentence to explain why.
        frame: I'm ___. I think social media has made our lives better / worse / the same, because ___.
        example: I'm Sarah. I think social media has made our lives better because it's easier to talk with friends and family.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: Which social media app are you going to use less in the future? Why?
            frame: "I'm going to use ___ less because ___. (*I'm going to use Facebook less because almost nobody uses it now.*)"
          - question: What new problems is social media going to cause in the next few years?
            frame: "It's going to cause more ___ and less ___. (*It's going to cause more addiction and less family time.*)"
          - question: What music are you going to listen to on YouTube or Spotify after class?
            frame: "I'm going to listen to ___. (*I'm going to listen to pop music.*)"
          - question: What photo or video are you going to post this year? Why?
            frame: "I'm going to post ___ because ___. (*I'm going to post photos of my dog because he's cute.*)"
          - question: How is social media going to change in 10 years?
            frame: 'Apps are going to ___. (*Apps are going to be faster and have more short videos.*)'
          - question: All social media apps are going to close tomorrow! How are you going to talk to your friends?
            frame: "I'm going to ___. (*I'm going to call them or meet them in person.*)"
          - question: What are you going to do to use social media in a healthier way?
            frame: "I'm going to spend less time ___ and more time ___. (*I'm going to spend less time online and more time with friends face-to-face.*)"
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      - id: act1
        type: classActivity
        title: 'Activity 1: Learn English with social media'
        skills: [Going to, Comparisons]
        steps:
          - Work in groups of 3–4.
          - Open Instagram, TikTok, YouTube or X and find a real English post about something you like.
          - Write 3 sentences with *going to* about it.
          - 'Share and compare: *My post is going to be more useful than yours.*'
          - Your group chooses the most creative sentence and presents it like a social media post. You can add hashtags (#LearnEnglish #FutureOnline).
        example: |-
          *I'm going to follow this cooking account because I want to learn food words.*
          *This video is going to be more interesting than TV.*
          *In the future, I'm going to learn new vocabulary from this page.*
      - id: act1-sentences
        type: discussionQuestions
        title: My 3 sentences
        items:
          - question: I'm going to follow ___ because ___.
          - question: This ___ is going to be more ___ than ___.
          - question: In the future, I'm going to ___.
      - id: act2
        type: classActivity
        title: 'Activity 2: My perfect profile'
        skills: [Going to, Comparisons]
        minutes: 22
        steps:
          - 'On your own (10 minutes): imagine a brand-new social media profile (not a real one). Complete "My future profile" below.'
          - 'In pairs (7 minutes): show your profile to a partner and compare. Use more than one comparison.'
          - 'Ask your partner: *Why did you choose this app? What are you going to post first? Who are you going to follow?*'
          - "Quick presentations (5 minutes): tell the class one interesting fact about your partner's profile."
        example: |-
          *Your profile is going to be more creative than mine.*
          *My app is less addictive than yours.*
          *This platform is the most useful for learning English.*
          *Anna's profile is going to be on LinkedIn because she wants to find a job.*
          *David's profile is going to be more fun than his old one.*
        wordBank:
          [
            fun,
            useful,
            safe,
            fast,
            creative,
            interesting,
            friendly,
            popular,
            modern,
            helpful,
            positive,
            private,
            addictive,
          ]
      - id: act2-profile
        type: discussionQuestions
        title: My future profile
        items:
          - question: 'Platform: My profile is going to be on ___.'
          - question: "Goal: I'm going to use my profile to ___ (find a job / learn new things / keep in touch / get inspired / have fun…)."
          - question: "Why this platform? This platform is the best because ___ (it's faster / safer / more popular / less stressful / more fun)."
          - question: Three important things about me
          - question: "Future plans: In the future, I'm going to post ___. I'm going to follow ___."
          - question: 'Comparison 1: ___ is better than ___. / My new profile is going to be more ___ than my old one.'
          - question: 'Comparison 2: TikTok is less ___ than YouTube. / Instagram is the most ___ app.'
      - id: act3
        type: classActivity
        title: 'Activity 3: The future social network'
        skills: [Going to, Comparisons]
        minutes: 25
        steps:
          - "Brainstorm in groups of 3–4 (5 minutes): invent a new social media app. Decide its name, what users are going to do there, and why it is better than today's apps."
          - 'Create your app plan (10 minutes): complete "Our app plan" below, on paper or a mini-poster.'
          - 'Present your app in 1 minute (7 minutes for all groups). Listen to the other groups and get ready to vote.'
          - 'Class vote (3 minutes): most original idea, most useful for learning, most fun, and (bonus) most likely to go viral.'
        example: |-
          *Our app is called VisionApp.*
          *It's going to be safer than Instagram and faster than TikTok.*
          *People are going to use it to share short travel videos.*
          *It's the most useful app for travelers.*
        wordBank: [safer, faster, more fun, more useful, more creative, less addictive]
      - id: act3-plan
        type: discussionQuestions
        title: Our app plan
        items:
          - question: 'Name: ___'
          - question: 'Purpose: People are going to use it to ___.'
          - question: "Key features (at least 3): Users are going to ___. / It's going to ___."
          - question: "Comparison 1: It's going to be more ___ than ___."
          - question: "Comparison 2: It's going to be less ___ than ___. / It's the most ___ app for ___."
      - id: act4
        type: classActivity
        title: 'Activity 4: My digital week'
        skills: [Going to, Comparisons]
        minutes: 15
        steps:
          - 'On your own (5 minutes): write at least 5 plans about your media habits next week. Use days of the week + *going to* + verb. Short and simple sentences are perfect!'
          - 'In pairs (5 minutes): compare your plans with your partner.'
          - 'Mini interview (3 minutes): ask your partner questions. Ask two follow-up questions.'
          - 'Group share (2 minutes): say what your partner is going to do.'
        example: |-
          *On Monday, I'm going to use Instagram to check the news.*
          *On Wednesday, I'm going to watch a football video on YouTube.*
          *On Friday, I'm going to share a photo from my weekend.*
          *Anna is going to watch more YouTube videos than me.*
          *Carlos is going to post the most photos next week.*
      - id: act4-week
        type: discussionQuestions
        title: My digital week
        items:
          - question: On Monday, I'm going to use ___.
          - question: On Tuesday, I'm going to watch ___.
          - question: On Wednesday, I'm going to follow ___.
          - question: On Thursday, I'm going to learn ___.
          - question: On Friday, I'm going to post / share ___.
      - id: act4-compare
        type: discussionQuestions
        title: Compare and ask
        answerable: false
        items:
          - question: "I'm going to use ___ more than you. / You are going to watch ___ less than me."
          - question: My week is going to be more interesting than yours! / Your week is going to be the most fun!
          - question: Why are you going to use TikTok so much? What are you going to share?
          - question: Who are you going to talk to online? Where are you going to post that?
      - id: act5
        type: classActivity
        title: 'Activity 5: Debate. Will social media improve the world?'
        skills: [Going to, Comparisons]
        steps:
          - 'Group A: *Social media is going to make the world better.* Group B: *Social media is going to make the world worse.*'
          - Each group writes 3 sentences about the future and presents them.
          - 'Compare the arguments: *Group A has more positive ideas than Group B.*'
          - 'Class vote: who has the best arguments?'
      - id: act5-sentences
        type: discussionQuestions
        title: Our arguments
        items:
          - question: Social media is going to ___.
          - question: People are going to ___.
          - question: In the future, ___ is going to be more / less ___ than now.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Level A2 (conversational), 90 minutes. Two skills this cycle: **Going to**
          (plans and predictions) and **Comparisons** (more / less … than, the most / the
          least). Every activity practises both; choose the activities that fit your time.
      - id: n-intro
        anchor: intro
        text: Give your own example first, then go around the group.
      - id: n-warmup
        anchor: warmup
        text: Ask each student at least two questions. Answers typed here are visible to you below each question.
      - id: n-act1
        anchor: act1
        text: >-
          Optional: students take a screenshot and bring it to the next class; class vote:
          which post will be the most helpful for learning English?
      - id: n-act2
        anchor: act2
        minutes: 22
        text: >-
          Individual → pair → whole class. Write the useful adjectives on the board (word
          bank). In the presentations, highlight strong language and correct gently.
      - id: n-act3
        anchor: act3
        minutes: 25
        text: >-
          Write helpful ideas on the board (safer, faster, more fun, more useful, more
          creative, less addictive). Useful structures: "Users are going to learn new
          things." "It's going to protect personal information." "It's going to be faster
          than TikTok." "It's the most original social media app." Count the votes and
          announce the winners. Optional extensions if time allows: A) Poster gallery walk
          (apps around the room, students vote with stickers); B) Investment pitch (groups
          convince the class to "invest" in their app); C) Logo and slogan ("Our slogan is
          ___.").
      - id: n-act4
        anchor: act4
        minutes: 15
        text: >-
          Individual → pair → group. Write the comparison frames on the board and
          encourage friendly competition. Highlight good use of *going to* + comparisons.
          Optional extensions: A) vote: Whose week is the most digital? Who is going to
          learn the most? Who is going to spend the least time online? B) Healthy habits:
          one extra sentence, e.g. "On Sunday, I'm going to take a break from social
          media."

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: social-media-future-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-going-to
        type: ruleSummary
        skill: Going to
        rules:
          - text: 'Use **am / is / are + going to + base verb** to talk about plans or predictions about the future.'
            examples:
              [
                "I'm going to post a new photo this weekend.",
                "She's going to follow more cooking pages.",
                Social media apps are going to be faster in the future.,
              ]
          - text: 'Useful time expressions:'
            examples:
              ['tomorrow, tonight, next week / month / year, in the future, on Monday / on Friday']
          - text: 'Questions: question word + *am / is / are* + subject + *going to* + verb.'
            examples: [What are you going to post this year?, Which app are you going to use less?]
      - id: table-going-to
        type: table
        caption: Going to
        header: [Person, Going to + verb]
        rows:
          - [I, I am (I'm) going to post]
          - [You / We / They, you / we / they are (you're / we're / they're) going to post]
          - [He / She / It, he / she / it is (he's / she's / it's) going to post]
      - id: rules-comparatives
        type: ruleSummary
        skill: 'Comparatives: comparing two things'
        rules:
          - text: 'Long adjectives: **more / less + adjective + than**.'
            examples:
              [TikTok is more popular than Twitter., YouTube is less addictive than Instagram.]
          - text: 'Short adjectives: **adjective + -er + than**. *Less* works with every adjective (*less fast*).'
            examples: [TikTok is faster than YouTube., 'big → bigger, safe → safer, easy → easier']
          - text: 'Irregular: **good → better**.'
            examples: [My profile is going to be better than my old one.]
          - text: 'Useful adjectives: popular, interesting, safe, fun, creative, addictive, useful, fast, positive.'
      - id: rules-superlatives
        type: ruleSummary
        skill: 'Superlatives: comparing three or more things'
        rules:
          - text: 'Long adjectives: **the most / the least + adjective**.'
            examples:
              [
                Instagram is the most visual social media app.,
                Facebook is the least popular app in my family.,
              ]
          - text: 'Short adjectives: **the + adjective + -est**.'
            examples:
              [
                TikTok is the fastest app.,
                'big → the biggest, safe → the safest, funny → the funniest',
              ]
          - text: '*Fun* is different: **more fun, the most fun**. Irregular: **good → the best**.'
            examples: [Your week is going to be the most fun!, This platform is the best.]
      - id: table-comparisons
        type: table
        caption: Comparatives and superlatives
        header: [Adjective, Comparative, Superlative]
        rows:
          - [fast, faster than, the fastest]
          - [big, bigger than, the biggest]
          - [easy, easier than, the easiest]
          - [popular, more / less popular than, the most / the least popular]
          - [fun, more fun than, the most fun]
          - [good, better than, the best]
      - id: rules-questions
        type: ruleSummary
        skill: Asking and answering questions
        rules:
          - text: We practised simple questions about plans and opinions.
            examples:
              [
                What are you going to post this year?,
                Which app are you going to use less?,
                Why is TikTok more fun than YouTube?,
              ]
          - text: 'Answer frames:'
            examples: ["I'm going to use…", "It's more / less… than…", "It's the most…"]
      - id: review-check
        type: callout
        tone: info
        title: Quick review check
        text: |-
          Try to say one sentence of each:
          **Future plan:** *Tomorrow I'm going to…*
          **Comparative:** *YouTube is more… than…*
          **Superlative:** *Instagram is the most…*
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through the rules with the group and ask for one new example for each rule. Finish with the quick review check.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: social-media-future-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy each message and send it. Mori will ask you questions; answer every one.
      - id: mori-going-to
        type: aiTutorPrompt
        title: 'Part 1: Going to'
        message: |-
          Hi Mori! I want to practise "going to". Ask me these questions one by one, and correct my mistakes:
          1. Which social media app are you going to use less?
          2. What music are you going to listen to after class?
          3. What are you going to post this year?
          4. Then ask me to finish this sentence: "In the future, I'm going to learn…"
      - id: mori-comparisons
        type: aiTutorPrompt
        title: 'Part 2: Comparisons'
        message: |-
          Hi Mori! I want to practise comparisons. Please:
          1. Ask me to compare two apps using "more / less … than".
          2. Ask me which app is the most useful for me.
          3. Ask me to compare YouTube and TikTok.
          Correct my mistakes after each answer.
      - id: mori-creativity
        type: aiTutorPrompt
        title: 'Part 3: Creativity'
        message: >-
          Hi Mori! Ask me to invent a social media app for the future and describe it. Then
          ask me why it is going to be better than today's apps. After that, correct my
          mistakes and give me a better model sentence.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: social-media-future-practice
    book: workbook
    title: 'Practice: Social media and the future'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. Each answer is checked at once, and you can try again.
      - id: ex-going-to
        type: activity
        activity: social-media-future-going-to
      - id: ex-comparisons
        type: activity
        activity: social-media-future-comparisons

