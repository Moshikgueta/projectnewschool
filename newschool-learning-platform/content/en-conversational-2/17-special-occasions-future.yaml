vocabulary:
  - slug: special-occasions-future
    title: 'Special Occasions: Future'
    items: *special-occasions-future-words

activities:
  - slug: special-occasions-future-going-to
    title: 'Be going to: party plans'
    minutes: 8
    items:
      - id: we-are
        type: multipleChoice
        prompt: We decided last week. We ___ have the party in my house.
        options:
          - { text: are going to, correct: true }
          - { text: is going to, feedback: 'With *we*, use *are*: *We are going to…*' }
          - {
              text: going to,
              feedback: 'You need *am / is / are* before *going to*: *We are going to have…*',
            }
      - id: im-going-to
        type: fillBlank
        prompt: Complete with *I* + *be going to*.
        text: ___ celebrate my birthday at home with my family.
        blanks: [[I'm going to, I am going to, I’m going to]]
      - id: where-is
        type: fillBlank
        prompt: Complete the question.
        text: Where ___ the party going to be?
        blanks: [[is]]
      - id: they-invite
        type: multipleChoice
        prompt: They ___ invite 30 guests.
        options:
          - { text: are going to, correct: true }
          - {
              text: are going,
              feedback: "Don't forget *to*: *be going to* + verb. *They are going to invite…*",
            }
          - {
              text: are going to inviting,
              feedback: 'After *going to*, use the base verb: *They are going to invite…*',
            }
      - id: decided-before
        type: trueFalse
        prompt: We use *be going to* for plans we decided before we speak.
        answer: true
        feedback:
          correct: "Right! *We're going to have the party in my house* is a plan we already made."
          incorrect: "*Be going to* is for plans and intentions already decided: *We're going to celebrate in a garden.*"
      - id: party-plan
        type: matching
        prompt: Match each question with its answer.
        pairs:
          - [Where is the party going to be?, It's going to be in a garden.]
          - [Who are you going to invite?, We're going to invite 30 guests.]
          - [What are you going to eat?, We're going to have typical food.]
          - [How are you going to decorate the place?, We're going to decorate it with lights.]
      - id: not-going-to
        type: multipleChoice
        prompt: I'm sorry, ___ be able to go.
        options:
          - { text: I'm not going to, correct: true }
          - {
              text: I not going to,
              feedback: "You need *am*: *I am not going to* / *I'm not going to*.",
            }
          - {
              text: I don't going to,
              feedback: "With *going to*, the negative is *am / is / are + not*: *I'm not going to*.",
            }
      - id: garden
        type: reorderSentence
        prompt: Put the words in order.
        sentence: We're going to celebrate the wedding in a garden.

  - slug: special-occasions-future-will
    title: 'Will: promises, decisions and predictions'
    minutes: 8
    items:
      - id: bring-cake
        type: multipleChoice
        prompt: "A: Oh no, we don't have a cake! B (decides now): Don't worry, I ___ bring one."
        options:
          - { text: will, correct: true }
          - {
              text: am going to,
              feedback: "B decides at this moment, so we use *will*: *I'll bring one.* *Be going to* is for plans made before.",
            }
          - {
              text: will to,
              feedback: 'After *will*, use the base verb without *to*: *I will bring one.*',
            }
      - id: formal
        type: fillBlank
        prompt: Complete the formal invitation with *will*.
        text: The ceremony ___ start at 6 p.m. There ___ be dinner and music.
        blanks: [[will], [will]]
      - id: great-party
        type: multipleChoice
        prompt: I think it ___ a great party.
        options:
          - { text: will be, correct: true }
          - {
              text: wills be,
              feedback: '*Will* is the same for every person: no *-s*. *It will be…*',
            }
          - {
              text: will is,
              feedback: 'After *will*, use the base verb: *be*, not *is*. *It will be…*',
            }
      - id: wont
        type: fillBlank
        prompt: Complete with the negative of *will*.
        text: I'm sorry, I ___ be able to go. I'll be busy that day.
        blanks: [[won't, will not, won’t]]
      - id: promise
        type: trueFalse
        prompt: 'We can use *will* + verb for a promise: *I will be there. I promise!*'
        answer: true
        feedback:
          correct: Right! *Will* is used for promises, decisions made now and predictions.
          incorrect: '*Will* is used for promises: *I will be there. I promise!*'
      - id: who-will
        type: multipleChoice
        prompt: Who ___ to the party?
        options:
          - { text: will come, correct: true }
          - {
              text: will comes,
