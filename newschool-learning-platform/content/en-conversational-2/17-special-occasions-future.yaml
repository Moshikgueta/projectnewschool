# Cycle "Special Occasions: Future", converted from the Conversational English level 2
# digital notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-conversational-2
slug: special-occasions-future
title: 'Special Occasions: Future'
goal: Talk about plans for celebrations with be going to, and about decisions, promises and predictions with will.
position: 17
status: in_review

review:
  - >-
    The two workbook exercises ("Be going to: party plans" and "Will: promises,
    decisions and predictions") are NEW: the notebook has no self-study exercises. They
    were written from the cycle's summary, the activity examples and its vocabulary.
    Please check level, wording and every right answer before students see them.
  - >-
    Grammar: the source says *will* is for "more formal or distant plans". Distance in
    time is not what decides between the two forms: a plan already made uses *be going
    to* even if it is far away ("We're going to get married in 2028"). The summary now
    says: *be going to* for plans and intentions decided before you speak (and
    predictions from what you can see now); *will* for decisions made at the moment of
    speaking, promises, offers, predictions with "I think / probably", and formal
    announcements such as invitations. Activity 2B's goal was reworded to "in a more
    formal way, like an invitation or announcement". Please confirm.
  - >-
    The "compare tone" table had no example for *will*. Added: "Don't worry, I'll bring
    the cake! (promise / decision now)". The class summary line "Both are correct, the
    difference is context and tone" was softened to "Often both are possible; the
    difference is context and tone", because for a decision made now or a promise only
    *will* is natural.
  - >-
    Activity 1 uses a Google Docs invitation template that is "provided by the teacher":
    the notebook has no link. The teacher shares it in class (see the teacher note); a
    docs.google.com link can be added to the activity later.
  - >-
    Activities 3A / 3B need 4 pictures of celebrations and Activity 4 needs a blank
    12-month calendar; neither is in the notebook (teacher notes).
  - >-
    The notebook gives no times for this cycle (warm-up or activities), so no minutes
    were recorded. There is no teacher plan saying which activities to choose; the
    teacher note suggests pairing each A activity with its B version.
  - >-
    Homework, Part 2: "Mori, I will practice the simple future. Correct me if needed." was
    rewritten as a clearer request ("I want to practice the future with *will*. I'm going
    to write 5 sentences. Please correct me if needed."). Part 4 (celebration calendar)
    had no message to send; one was written.
  - >-
    Vocabulary: "Arrivals — הגעות" → "Arrival — הגעה" (singular, like the other terms);
    "Upcoming — מתקרב / עתיד לבוא" → "קרוב / שעומד להגיע"; "Plan — תכנית" →
    "תכנית / לתכנן" and "Promise — הבטחה" → "הבטחה / להבטיח" (both are used as verbs in
    this cycle); "Guest List" → "Guest list". Please confirm.
  - >-
    Preparation question 2 lists "Christmas, New Year, Easter". You may want to add
    holidays your students celebrate (Rosh Hashanah, Passover, Hanukkah); it was left as
    in the source apart from the frame.
  - >-
    The "Student Answer 1/2/3" lines are replaced by the optional answer boxes (decision
    C2). The heading "Special Occasions-  Future" appears twice at the top of the source
    and is kept once. The Quizlet link is kept without "?new".

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: special-occasions-future-class
    title: 'Class: Special Occasions: Future'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Special Occasions: Future'
      - id: skills
        type: cycleOverview
        skills:
          - name: Be going to
            description: 'Plans and intentions already decided: *We’re going to celebrate in a garden.*'
          - name: Will
            description: 'Decisions now, promises, predictions and formal plans: *I’ll bring the cake! There will be music.*'
      - id: quizlet
        type: externalLink
        label: Special occasions words on Quizlet
        url: https://quizlet.com/il/1106014230/conversational-english-special-occasions-future-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        prompt: 'Say two sentences: your name, and one or two of the sentences below.'
        frame: I am ___. I like / don't like organizing parties because ___.
        example: I am Noa. I like organizing parties because I love cooking for my friends.
      - id: intro-options
        type: discussionQuestions
        title: Choose one or two
        items:
          - question: At parties, I always ___ (dance, sing, eat, talk, play…).
          - question: In the future, I'm going to celebrate ___.
          - question: I prefer ___ (big parties / small parties).
          - question: A party without ___ is not a party.
      - id: warmup-title
        type: heading
        level: 3
        text: Preparation questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: How are you going to celebrate your next birthday, and with whom?
            frame: I'm going to celebrate my next birthday ___ (with family, with friends, at home, in a restaurant…).
          - question: During the next holidays (Christmas, New Year, Easter, etc.), what are you going to do and who will you be with?
            frame: I'm going to ___ (travel, cook something special, visit family, stay home…). I will be with ___.
          - question: In the future, will you invite many people to your wedding or another important celebration? Why or why not?
            frame: Yes, I will invite ___ people, because ___. / No, I won't. I will invite only ___.
          - question: How are you going to invite people to your party? Why do you prefer that method?
            frame: I'm going to invite them by ___ (WhatsApp, email, phone call, paper invitation…), because ___.
          - question: What special occasion are you going to celebrate next year?
            frame: Next year I'm going to celebrate ___ (a big birthday, a graduation, a new job…).
          - question: What are you going to do to celebrate that occasion?
            frame: I'm going to ___ (have a party, have dinner, travel, give gifts…).
      - id: useful-language
        type: callout
        tone: info
        title: Useful language
        text: |-
          **Plans (be going to):** I'm going to… / We're going to… / They're going to… / The party is going to be… / We're going to invite… / We're going to celebrate…
          **Decisions, promises, predictions (will):** I will… / We will… / She will… / There will be… / I will bring… / I'll probably…
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      - id: act1
        type: classActivity
        title: 'Activity 1: Invitations'
        skills: [Be going to, Will]
        steps:
          - Make your own copy of the invitation template your teacher shares (Google Docs).
          - 'Write two invitations with future forms: one for a **birthday party** and one for a **wedding or special event**.'
          - You can add pictures and change the fonts.
          - Read one of your invitations to the class.
        example: "*You are invited to my 40th birthday party! The party will be on Saturday, June 6th, at 8 p.m. We're going to have dinner and dance all night. RSVP by June 1st.*"
      - id: act2a
        type: classActivity
        title: 'Activity 2A: Planning a party (be going to)'
        skills: [Be going to]
        steps:
          - Work in pairs or groups of 3.
          - 'Choose a special occasion: a birthday, a wedding, a graduation, a surprise party or a trip celebration.'
          - Answer the questions below with *I'm going to / We're going to…*
          - Present your party to the group.
        example: "*We're going to celebrate the wedding in a garden. We're going to invite 30 guests. We're going to have typical food and dance salsa.*"
      - id: act2a-questions
        type: discussionQuestions
        title: Our party plan
        items:
          - question: Where is the party going to be?
            frame: The party is going to be ___.
          - question: What are you going to eat and drink?
            frame: We're going to eat ___ and drink ___.
          - question: Who are you going to invite?
            frame: We're going to invite ___.
          - question: What music or activities are you going to have?
            frame: We're going to have ___.
          - question: How are you going to decorate the place?
            frame: We're going to decorate the place with ___.
      - id: act2b
        type: classActivity
        title: 'Activity 2B: The same party (will)'
        skills: [Will]
        steps:
          - Keep the same event from Activity 2A.
          - Answer the questions again, now with *will*, in a more formal way, like an invitation or announcement.
          - Present your party to the group.
        example: '*The party will be at the beach. We will invite 20 people. We will dance all night. We will decorate with lights and prepare a video.*'
      - id: act2b-questions
        type: discussionQuestions
        title: Our party, with will
        items:
          - question: Where will the party be?
            frame: The party will be ___.
          - question: What will you eat and drink?
            frame: We will eat ___ and drink ___.
          - question: Who will come?
            frame: ___ will come.
          - question: What activities or music will there be?
            frame: There will be ___.
          - question: How will you decorate?
            frame: We will decorate with ___.
          - question: What special surprise will you prepare?
            frame: We will prepare ___.
      - id: act3a
        type: classActivity
        title: 'Activity 3A: Traditions and celebrations (be going to)'
        skills: [Be going to]
        steps:
          - Look at the 4 pictures of celebrations your teacher shows. Choose 2.
          - In pairs, describe them with *be going to* (use the questions below).
          - Share with the class.
          - 'The others react: accept or say sorry.'
        example: |-
          *They're going to have a wedding in a hotel. The party is going to be next Saturday.*
          *I'm going to go! Thanks for inviting me! / I'm sorry, I'm not going to be able to go.*
      - id: act3a-questions
        type: discussionQuestions
        title: Describe the pictures
        items:
          - question: Why are they going to celebrate?
            frame: They're going to celebrate ___.
          - question: Where is it going to be?
            frame: It's going to be ___.
          - question: When is it going to happen?
            frame: It's going to happen ___.
      - id: act3b
        type: classActivity
        title: 'Activity 3B: Traditions and celebrations (will)'
        skills: [Will]
        steps:
          - Use the same pictures.
          - Describe them again with *will* (use the questions below).
          - Share with the class.
          - The others react with *will*.
        example: |-
          *They will celebrate their wedding in a hotel. The party will be next Saturday.*
          *I will go. Thanks for inviting me! / I won't be able to go. / I will be busy that day.*
      - id: act3b-questions
        type: discussionQuestions
        title: Describe the pictures again
        items:
          - question: Why will they celebrate?
            frame: They will celebrate ___.
          - question: Where will it be?
            frame: It will be ___.
          - question: When will it be?
            frame: It will be ___.
      - id: act4
        type: classActivity
        title: 'Activity 4: Celebration calendar'
        skills: [Be going to, Will]
        steps:
          - Work in groups of 3–4 with a blank 12-month calendar.
          - 'Choose at least 5 celebrations: birthdays in your group, holidays, a trip or vacation, a graduation, a national celebration, a family event, a surprise party.'
          - Write complete sentences. Mix *be going to* and *will*.
          - Decorate your calendar with drawings, pictures or emojis.
          - Present 2–3 celebrations to the class.
          - 'The class asks questions: *Who will come? Where is it going to be? What will you eat?*'
        example: |-
          **March:** *We're going to celebrate Ana's birthday.*
          **July:** *We will travel to the beach with friends.*
          **August:** *I will attend a concert.*
          **December:** *We're going to have Christmas dinner with family.*
      - id: act4-calendar
        type: discussionQuestions
        title: Our celebration calendar
        items:
          - question: "___ (month): We're going to ___."
          - question: '___ (month): We will ___.'
          - question: "___ (month): We're going to ___."
          - question: '___ (month): We will ___.'
          - question: '___ (month): ___.'
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: **Be going to** (plans already decided, near future) and
          **Will** (decisions made now, promises, predictions, formal announcements).
          Activities 2 and 3 come in pairs: do the A version (*be going to*, easier,
          everyday usage, natural conversation) and then the B version with the same
          event or pictures (*will*, higher level, accuracy and range). Activities 1 and 4
          mix both forms. Write sample answers to the preparation questions together on the
          board first.
      - id: n-difference
        anchor: warmup-title
        text: >-
          The difference, for you: when the plan is already decided, use *be going to*
          ("We're going to have the party at my house"). When you decide at the moment of
          speaking, promise, offer or predict, or in a formal announcement, use *will*
          ("OK, I'll bring drinks!", "I think it will be fun", "The ceremony will begin at
          6 p.m."). Ask each student at least two questions; answers typed here are
          visible to you below each question.
      - id: n-useful
        anchor: useful-language
        text: Put the useful language on the board or a slide before the activities.
      - id: n-act1
        anchor: act1
        text: >-
          Share your Google Docs invitation template (the notebook has no link) and remind
          students to make their own copy. Explain **RSVP / Confirm attendance**.
      - id: n-act3a
        anchor: act3a
        text: >-
          Before class, choose 4 pictures of celebrations (birthday, wedding, graduation,
          New Year…) and show them on screen. Activity 3B uses the same pictures.
      - id: n-act4
        anchor: act4
        text: >-
          Prepare a blank 12-month calendar (paper or digital) for each group. Optional
          competition: the class votes for the *Most creative celebration*, the *Best
          summer party* and the *Craziest plan*.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: special-occasions-future-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-going-to
        type: ruleSummary
        skill: Be going to
        rules:
          - text: '**am / is / are + going to + base verb**'
            examples:
              [
                I'm going to have dinner with friends.,
                She's going to invite her cousins.,
                They're going to dance all night.,
              ]
          - text: Use it for **plans and intentions you decided before you speak**, often for the near future.
            examples:
              [
                We're going to have the party in my house.,
                We're going to celebrate Ana's birthday in March.,
              ]
          - text: 'Negative: **am / is / are + not + going to**. Question: **am / is / are + subject + going to**.'
            examples:
              - I'm sorry, I'm not going to be able to go.
              - Where is the party going to be?
              - Who are you going to invite?
      - id: rules-will
        type: ruleSummary
        skill: Will
        rules:
          - text: "**will + base verb**, the same for every person (no *-s*). Short forms: **I'll, we'll**. Negative: **won't** (will not)."
            examples:
              [
                We will invite everyone to the wedding.,
                I'll probably stay home.,
                I won't be able to go.,
              ]
          - text: 'Use it for a **decision you make now**, a **promise** or an **offer**.'
            examples:
              [
                "A: We don't have a cake! B: Don't worry, I'll bring one.",
                I will be there. I promise!,
              ]
          - text: 'Use it for **predictions**, often with *I think* or *probably*.'
            examples: [I think it will be a great party., It will probably rain on Saturday.]
          - text: Use it in **formal announcements and invitations**.
            examples: [The ceremony will start at 6 p.m., There will be dinner and music.]
      - id: compare-table
        type: table
        caption: Be going to or will?
        header: [Form, Use, Example]
        rows:
          - [
              Be going to + verb,
              Plans already decided / near future,
              I'm going to have dinner with friends.,
            ]
          - [
              Will + verb,
              'Decisions now, promises, predictions, formal announcements',
              "Don't worry, I'll bring the cake! / We will invite everyone to the wedding.",
            ]
      - id: recap
        type: callout
        tone: info
        title: Remember
        text: 'Often both are possible: the difference is **context and tone**. For a plan you made before, *be going to* sounds more natural. For a decision you make now or a promise, use *will*.'
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both forms with the group and ask for one new example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: special-occasions-future-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-going-to
        type: aiTutorPrompt
        title: 'Part 1: Be going to'
        intro: Then write and say 5 sentences about your plans.
        message: Hi Mori! I'm going to tell you my plans for next month in 5 sentences with "be going to". Please ask me questions and correct my mistakes.
      - id: mori-will
        type: aiTutorPrompt
        title: 'Part 2: Will'
        intro: Then write and say 5 sentences with *will*.
        message: Hi Mori! I want to practice the future with "will". I'm going to write 5 sentences. Please correct me if needed.
      - id: mori-conversation
        type: aiTutorPrompt
        title: 'Part 3: Conversation'
        message: Hi Mori! Please ask me questions about special occasions and celebrations. Correct my mistakes.
      - id: mori-calendar
        type: aiTutorPrompt
        title: 'Part 4: My celebration calendar'
        intro: Fill in the blanks, then send the message to Mori.
        message: |-
          Hi Mori! This is my celebration calendar for next year:
          In ___ (month), I'm going to ___.
          In ___ (month), we will ___.
          In ___ (month), I'm going to ___.
          In ___ (month), we will ___.
          Please ask me questions about my celebrations and correct my mistakes.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: special-occasions-future-practice
    book: workbook
    title: 'Practice: Special Occasions: Future'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practice the two skills of this cycle on your own. Each answer is checked right away, and you can try again.
      - id: ex-going-to
        type: activity
        activity: special-occasions-future-going-to
      - id: ex-will
        type: activity
        activity: special-occasions-future-will

