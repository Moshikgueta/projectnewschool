vocabulary:
  - slug: argent-et-epargne
    title: Argent et épargne
    items: *argent-et-epargne-words

activities:
  - slug: argent-et-epargne-conditions
    title: 'Les phrases de condition : si…'
    minutes: 8
    items:
      - id: si-economises
        type: multipleChoice
        prompt: Si tu économises, tu ___ plus d’argent.
        options:
          - { text: as, correct: true }
          - {
              text: aurais,
              feedback: 'Après *si* + présent, le résultat est au présent (ou au futur). Le conditionnel *aurais* va avec *si* + imparfait.',
            }
          - {
              text: avais,
              feedback: '*Avais* est à l’imparfait. Après *si* + présent, le résultat est au présent : *tu as*.',
            }
      - id: partirai
        type: fillBlank
        prompt: Complète avec le verbe *partir* au futur simple.
        text: Si j’économise, je ___ en voyage.
        blanks: [[partirai]]
      - id: si-avais
        type: multipleChoice
        prompt: Si j’___ plus d’argent, j’achèterais une maison.
        options:
          - { text: avais, correct: true }
          - {
              text: aurais,
              feedback: 'Jamais de conditionnel après *si* ! Avec un conditionnel présent dans le résultat, on met l’imparfait après *si* : *si j’avais*.',
            }
          - {
              text: aurai,
              feedback: 'Jamais de futur après *si* ! Avec un conditionnel présent dans le résultat, on met l’imparfait après *si* : *si j’avais*.',
            }
      - id: aurais-achete
        type: fillBlank
        prompt: Complète avec le verbe *acheter* au conditionnel passé.
        text: Si j’avais économisé, j’___ une maison.
        blanks: [[aurais acheté]]
      - id: jamais-conditionnel
        type: trueFalse
        prompt: 'On peut dire : *Si j’aurais plus d’argent, je voyagerais.*'
        answer: false
        feedback:
          correct: 'Bravo ! Jamais de conditionnel après *si* : *Si j’avais plus d’argent, je voyagerais.*'
          incorrect: 'Attention : jamais de conditionnel après *si*. On dit : *Si j’avais plus d’argent, je voyagerais.*'
      - id: types
        type: matching
        prompt: Associe chaque structure à son exemple.
        pairs:
          - [
              'si + présent, présent',
              'Si les gens ne planifient pas leurs dépenses, ils ont des problèmes.',
            ]
          - ['si + présent, futur simple', 'Si tu reçois une prime, tu l’économiseras.']
          - [
              'si + imparfait, conditionnel présent',
              'Si tu gagnais 10 000 euros, tu partirais en voyage.',
            ]
          - [
              'si + plus-que-parfait, conditionnel passé',
              'Si tu avais demandé conseil, tu aurais évité cette erreur.',
            ]
      - id: vivrais
        type: multipleChoice
        prompt: Si tu pouvais vivre n’importe où, où ___-tu ?
        options:
          - { text: vivrais, correct: true }
          - {
              text: vivras,
              feedback: 'Après *si* + imparfait (*pouvais*), le résultat est au conditionnel présent : *vivrais-tu*.',
            }
          - {
              text: vivais,
              feedback: '*Vivais* est à l’imparfait. Après *si* + imparfait, le résultat est au conditionnel présent : *vivrais-tu*.',
            }
      - id: ordre-prime
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Si je reçois une prime, je l’économiserai.

  - slug: argent-et-epargne-passive
    title: 'La voix passive : l’argent est économisé'
    minutes: 8
    items:
      - id: ordre-doit
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: L’argent doit être économisé.
      - id: eau-economisee
        type: fillBlank
        prompt: Complète avec le participe passé du verbe *économiser* (attention à l’accord).
        text: L’eau peut être ___ si la consommation est limitée.
        blanks: [[économisée]]
      - id: accord
        type: trueFalse
        prompt: 'À la voix passive, le participe passé s’accorde avec le sujet : *Les lumières sont éteintes.*'
        answer: true
        feedback:
          correct: 'Bravo ! *Les lumières* est féminin pluriel : *éteintes*.'
          incorrect: 'C’est vrai : avec *être*, le participe s’accorde avec le sujet. *Les lumières* est féminin pluriel : *éteintes*.'
      - id: actif-passif
        type: multipleChoice
        prompt: 'Actif : *Les gens économisent de l’argent.* Quelle est la phrase passive ?'
        options:
          - { text: L’argent est économisé par les gens., correct: true }
          - {
              text: L’argent a économisé les gens.,
              feedback: 'À la voix passive, on utilise *être* + participe passé, et la personne qui fait l’action vient après *par* : *L’argent est économisé par les gens.*',
            }
          - {
              text: Les gens sont économisés par l’argent.,
              feedback: 'Le complément (*l’argent*) devient le sujet, et les gens viennent après *par* : *L’argent est économisé par les gens.*',
            }
      - id: prime-accordee
        type: fillBlank
        prompt: Complète avec le participe passé du verbe *accorder* (attention à l’accord).
        text: Une grosse prime t’est ___ au travail.
        blanks: [[accordée]]
      - id: actif-passif-paires
        type: matching
        prompt: Associe chaque phrase active à sa phrase passive.
        pairs:
          - [On réduit le gaspillage., Le gaspillage est réduit.]
          - [On éteint les lumières., Les lumières sont éteintes.]
          - [On limite la consommation d’eau., La consommation d’eau est limitée.]
          - [On réutilise les objets anciens., Les objets anciens sont réutilisés.]
      - id: peut-etre
        type: multipleChoice
        prompt: Plus d’argent ___ économisé si les repas sont pris à la maison.
        options:
          - { text: peut être, correct: true }
          - {
              text: peut,
              feedback: 'Il manque *être* : *pouvoir* + **être** + participe passé (*peut être économisé*).',
            }
          - {
              text: peut avoir,
              feedback: 'La voix passive se forme avec *être*, pas avec *avoir* : *peut être économisé*.',
            }
      - id: devrait
        type: fillBlank
        prompt: Complète avec le verbe *devoir* au conditionnel présent (un conseil).
        text: L’argent ___ être économisé pour les projets futurs.
        blanks: [[devrait]]
