vocabulary:
  - slug: carriere-et-developpement-personnel
    title: Carrière et développement personnel
    items: *carriere-et-developpement-personnel-words

activities:
  - slug: carriere-et-developpement-personnel-presentation
    title: La présentation personnelle
    minutes: 8
    items:
      - id: suis-ingenieure
        type: multipleChoice
        prompt: Je m’appelle Anna, je ___ ingénieure en informatique.
        options:
          - { text: suis, correct: true }
          - {
              text: ai,
              feedback: 'Pour dire sa profession, on utilise *être* : *je suis ingénieure*.',
            }
          - {
              text: fais,
              feedback: 'Pour dire sa profession, on utilise *être* : *je suis ingénieure* (ou *je travaille comme ingénieure*).',
            }
      - id: revais
        type: fillBlank
        prompt: Complète avec le verbe *rêver* à l’imparfait (une situation dans le passé).
        text: Quand j’étais enfant, je ___ de devenir avocate.
        blanks: [[rêvais]]
      - id: developpe
        type: multipleChoice
        prompt: 'Tes activités quotidiennes aujourd’hui : Je ___ des applications éducatives.'
        options:
          - { text: développe, correct: true }
          - {
              text: développais,
              feedback: '*Développais* est à l’imparfait (le passé). Pour les activités d’aujourd’hui, on utilise le présent : *je développe*.',
            }
          - {
              text: développerais,
              feedback: '*Développerais* est au conditionnel (une hypothèse). Pour les activités d’aujourd’hui, on utilise le présent : *je développe*.',
            }
      - id: contenu
        type: trueFalse
        prompt: 'Dans une présentation rapide de networking, on dit son nom et sa profession, ses activités quotidiennes et un fait intéressant.'
        answer: true
        feedback:
          correct: 'Bravo ! Nom et profession, activités quotidiennes, un fait intéressant (passé, présent ou futur).'
          incorrect: 'C’est vrai : nom et profession, activités quotidiennes, un fait intéressant (passé, présent ou futur).'
      - id: parties
        type: matching
        prompt: Associe chaque partie de la présentation à son exemple.
        pairs:
          - ['Nom et profession', 'Je m’appelle Anna, je suis ingénieure.']
          - [Activités quotidiennes, Je développe des applications éducatives.]
          - [Fait intéressant au passé, 'Quand j’étais enfant, je rêvais d’être pilote.']
          - [Projet pour le futur, 'L’année prochaine, j’apprendrai à piloter des drones.']
      - id: apprendrai
        type: fillBlank
        prompt: Complète avec le verbe *apprendre* au futur simple.
        text: L’année prochaine, j’___ à piloter des drones.
        blanks: [[apprendrai]]
      - id: comme
        type: multipleChoice
        prompt: Aujourd’hui, je travaille ___ consultante.
        options:
          - { text: comme, correct: true }
          - {
              text: en,
              feedback: 'Avec *travailler* + un métier, on dit *travailler comme* : *je travaille comme consultante*.',
            }
          - {
              text: pour,
              feedback: '*Travailler pour* + une entreprise (*je travaille pour Air France*). Avec un métier, on dit *je travaille comme consultante*.',
            }
      - id: ordre-anna
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Je m’appelle Anna, je suis ingénieure en informatique.

  - slug: carriere-et-developpement-personnel-narration
    title: 'Construire une narration : passé, présent, futur, conditionnel'
    minutes: 8
    items:
      - id: premier-poste
        type: multipleChoice
        prompt: 'Un fait ponctuel : En 2020, j’___ mon premier poste.'
        options:
          - { text: ai obtenu, correct: true }
          - {
              text: obtiendrai,
              feedback: '*Obtiendrai* est au futur. Pour un fait ponctuel dans le passé (*en 2020*), on utilise le passé composé : *j’ai obtenu*.',
            }
          - {
              text: obtiendrais,
              feedback: '*Obtiendrais* est au conditionnel. Pour un fait ponctuel dans le passé (*en 2020*), on utilise le passé composé : *j’ai obtenu*.',
            }
      - id: ferais
        type: fillBlank
        prompt: Complète avec le verbe *faire* au conditionnel présent.
        text: Si je pouvais changer de travail, je le ___ dès aujourd’hui.
        blanks: [[ferais]]
      - id: creerai
        type: multipleChoice
        prompt: 'Un projet : Dans le futur, je ___ ma propre entreprise.'
        options:
          - { text: créerai, correct: true }
          - {
              text: créais,
              feedback: '*Créais* est à l’imparfait (le passé). Pour un projet, on utilise le futur : *je créerai*.',
            }
          - {
              text: ai créé,
              feedback: '*Ai créé* est au passé composé. Pour un projet, on utilise le futur : *je créerai*.',
            }
      - id: aurais-voyage
        type: fillBlank
        prompt: Complète avec le verbe *voyager* au conditionnel passé.
        text: Si j’avais accepté ce travail, j’___ davantage.
        blanks: [[aurais voyagé]]
      - id: imparfait-habitudes
        type: trueFalse
        prompt: 'Pour parler d’une habitude ou faire une description dans le passé, on utilise l’imparfait : *Quand j’étais enfant, je rêvais de devenir médecin.*'
        answer: true
        feedback:
          correct: 'Bravo ! L’imparfait sert aux habitudes et aux descriptions au passé.'
          incorrect: 'C’est vrai : l’imparfait sert aux habitudes et aux descriptions au passé. Le passé composé sert aux faits ponctuels.'
      - id: connecteurs
        type: matching
        prompt: Associe chaque connecteur au temps de la narration.
        pairs:
          - [Quand j’étais enfant…, le passé]
          - [Actuellement…, le présent]
          - [Dans cinq ans…, le futur]
          - [Si je pouvais…, le conditionnel]
      - id: vais-presenter
        type: multipleChoice
        prompt: Demain, je ___ présenter un projet important.
        options:
          - { text: vais, correct: true }
          - {
              text: irai,
              feedback: 'Le futur proche se forme avec *aller* au **présent** + infinitif : *je vais présenter*.',
            }
          - {
              text: allais,
              feedback: '*Allais* est à l’imparfait. Le futur proche se forme avec *aller* au présent + infinitif : *je vais présenter*.',
            }
      - id: ordre-consultant
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Aujourd’hui, je travaille comme consultant.
