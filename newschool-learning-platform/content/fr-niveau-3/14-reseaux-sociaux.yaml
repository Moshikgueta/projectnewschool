# Cycle "Réseaux sociaux", converted from the French level 3 digital notebook
# ("Cahier digital 2026 - français niveau 3", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-3
slug: reseaux-sociaux
title: Réseaux sociaux
goal: Raconter ses expériences sur les réseaux sociaux au passé composé et présenter des faits à la voix passive.
position: 14
status: in_review

review:
  - >-
    The two workbook exercises ("Le passé composé" and "La voix passive") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's summary
    rules, the activity examples and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Summary, passé composé: the source's uses ("parler d’expériences passées liées au
    présent", "raconter des actions répétées") read like the English present perfect. They
    were rewritten for French: the passé composé tells finished actions at a given moment
    (recent or not), changes, and actions counted (trois fois, plusieurs fois); a habit in
    the past takes the imparfait. Added (please confirm): which verbs take être (aller,
    venir, partir, sortir… and pronominal verbs) with agreement of the participle; the
    agreement with a direct object placed before (je l’ai changée, used in warm-up 1);
    irregular participles (vu, lu, suivi, mis, fait); negation (je n’ai rencontré
    personne).
  - >-
    Summary, voix passive: added that the participle agrees with the subject (une
    publication a été partagée, les photos ont été commentées) and a small table; the
    present passive (est publié) is mentioned once. The source structure "être au passé
    composé (a été / ont été) + participe passé (+ par + agent)" is kept.
  - >-
    Corrections: warm-up 1 "### **As-tu changé…" (markdown left in) cleaned; "fake news"
    (English) → "fausses informations (fake news)" in warm-up 5 and "fausses informations"
    elsewhere (warm-up 5 frame "Des fake news ont été partagées" → "De fausses
    informations ont été partagées": des → de before an adjective); Activity 2 clue "J’ai écouté une chanson sur YouTube qui a été vue des
    millions de fois" → "…qui a été écoutée des millions de fois"; "un post qui m’a
    beaucoup énervé" → "une publication qui m’a beaucoup énervé(e)"; Activity 3 example
    "Un influenceur a été “cancel” sur Instagram" → "Un influenceur a été boycotté sur
    Instagram" (English word); Activity 4 "rumeurs (ou fake news)" → "rumeurs (ou fausses
    informations)". Stray "*\*…\*\* &#10;" marks in the summary were removed. Please
    confirm the "fake news" choice: the term is common in French; the official word is
    "infox".
  - >-
    The Mori homework in the source is a list of short commands ("Mori, pose-moi…",
    "Mori, corrige…"). They are grouped into three messages to Mori (passé composé, voix
    passive, longer answer) with the source's expected examples as intros; the general
    commands ("corrige mes erreurs", "dis-moi si ma réponse est naturelle", "donne-moi un
    exemple avant que je réponde") are in each message or in the tips.
  - >-
    Left out: the "Date / Participants" lines and the "Réponse de l’élève 1/2/3" lines
    (the platform has answer boxes). The source gives no example for the intro round's
    middle option and no viral headlines list beyond the four examples of Activity 3; the
    teacher prepares more titles (teacher note).
  - >-
    Times: Activity 1 has no time in the source (a 3-minute report per group); Activity 2
    10 min; Activity 3 3 + 10 + 8 + 5 + 5 = 31; Activity 4 5 + 5 + 12 + 5 + 10 = 37.
    Ranges are recorded as the upper value (8–10 → 10, 10–12 → 12). The total is more than
    one lesson; the plan note asks the teacher to choose.
  - >-
    Vocabulary: "Inclusion – הכללה" → "הכלה" (הכללה means generalisation);
    "Publication – פרסום" → "פוסט / פרסום"; "Tendance – מגמה" → "טרנד / מגמה"; "Chat –
    צ׳אט" → term "Chat (en ligne)" (le chat alone is also "cat"). The header row
    "Français / Hébreu" was dropped. The Quizlet link is kept without its tracking
    parameters (?i=…&x=…). Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: reseaux-sociaux-classe
    title: 'Classe : Réseaux sociaux'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Réseaux sociaux
      - id: skills
        type: cycleOverview
        skills:
          - name: Le passé composé
            description: 'Raconter ses expériences (*J’ai partagé une vidéo. Je ne l’ai pas changée.*)'
          - name: La voix passive
            description: 'Mettre l’accent sur le fait (*Un mème a été partagé des millions de fois.*)'
      - id: quizlet
        type: externalLink
        label: Réseaux sociaux sur Quizlet
        url: https://quizlet.com/il/1144780154/extreme-french-2026-reseaux-sociaux-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. Je pense que les réseaux sociaux ont amélioré / aggravé / changé notre vie.
        example: Je m’appelle Lévanah. Je pense que les réseaux sociaux ont changé notre vie, à la fois en bien et en mal.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup
        type: discussionQuestions
        items:
          - question: As-tu changé ta routine quotidienne à cause des réseaux sociaux ?
            frame: Oui, je l’ai changée parce que… / Non, je ne l’ai pas changée parce que…
          - question: As-tu rencontré quelqu’un d’important grâce aux réseaux sociaux ?
            frame: Oui, j’ai rencontré… / Non, je n’ai rencontré personne.
          - question: Quelles publications as-tu partagées récemment ?
            frame: J’ai partagé des photos / des articles / des vidéos sur…
          - question: Comment l’inclusion est-elle encouragée sur les réseaux sociaux ?
            frame: L’inclusion est encouragée grâce à des campagnes, des hashtags, des vidéos…
          - question: Quelles fausses informations (fake news) ont été partagées récemment sur les réseaux sociaux ?
            frame: De fausses informations ont été partagées au sujet de…
          - question: Quels changements importants ont été ajoutés / retirés sur tes plateformes préférées ?
            frame: Sur Instagram, une nouvelle fonctionnalité a été ajoutée…
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Les tendances'
        skills: [La voix passive]
        steps:
          - Le professeur divise la classe en petits groupes.
          - 'Chaque groupe reçoit une plateforme : **Instagram, TikTok, YouTube, Twitter / X**, etc.'
          - Chaque groupe imagine ou recherche **5 tendances ou événements récents** sur sa plateforme.
          - Écrivez vos phrases **à la voix passive**, avec la banque de structures.
          - '**Présentation orale :** un rapport court et formel (**3 minutes maximum**).'
        wordBank:
          - Une nouvelle fonctionnalité a été ajoutée, ce qui permet de…
          - Une publication a été partagée, et elle…
          - En 2025, une nouvelle politique a été mise en place…
          - L’intelligence artificielle a été utilisée pour…
          - Un rapport récent a été publié, et il montre que…
      - id: act1-sentences
        type: discussionQuestions
        title: Nos 5 tendances
        items:
          - question: Tendance 1
            frame: … a été / ont été + participe passé…
          - question: Tendance 2
          - question: Tendance 3
          - question: Tendance 4
          - question: Tendance 5
      - id: act2
        type: classActivity
        title: 'Activité 2 : Chasse au trésor sur les réseaux sociaux'
        skills: [Le passé composé]
        minutes: 10
        steps:
          - Chaque élève reçoit la liste d’indices ci-dessous.
          - En **10 minutes**, souviens-toi d’exemples réels ou retrouve-les. Tu n’as pas besoin de montrer ton écran.
          - Tu gagnes un point chaque fois que tu complètes correctement une phrase au passé composé.
      - id: act2-clues
        type: discussionQuestions
        title: Banque d’indices
        items:
          - question: J’ai trouvé une publication qui a été partagée plus de 500 fois.
            frame: J’ai trouvé une publication sur… qui a été partagée…
          - question: J’ai vu une vidéo qui a été commentée plus de 50 fois.
            frame: J’ai vu une vidéo de… qui a été commentée…
          - question: J’ai lu une publication qui m’a beaucoup énervé(e) parce que…
            frame: J’ai lu une publication sur… qui m’a beaucoup énervé(e) parce que…
          - question: J’ai écouté une chanson sur YouTube qui a été écoutée des millions de fois.
            frame: J’ai écouté… qui a été écoutée…
          - question: J’ai trouvé un mème qui a été utilisé dans différents contextes.
            frame: J’ai trouvé un mème sur… qui a été utilisé…
      - id: act3
        type: classActivity
        title: 'Activité 3 : Débat express sur des actualités virales'
        skills: [La voix passive]
        minutes: 31
        steps:
          - '**Présentation du thème (3 minutes) :** le professeur affiche ou distribue des titres viraux.'
          - '**En binômes (10 minutes) :** chaque binôme reçoit 2 ou 3 titres différents. Réagissez à chaque titre avec **au moins une phrase à la voix passive** et **une opinion personnelle**.'
          - '**Débat en groupe (8 minutes) :** chaque binôme partage le titre le plus surprenant et sa réaction. Les autres ajoutent des commentaires à la voix passive.'
          - '**Extension (optionnelle, 5 minutes) :** invente ton propre titre viral à la voix passive. *Une nouvelle application a été téléchargée par des millions d’étudiants en 24 heures.*'
          - '**Conclusion (5 minutes) :** *Penses-tu que la voix passive est très utilisée dans les titres ? Pourquoi ?*'
        example: |-
          *Binôme A : Un influenceur a été boycotté sur Instagram. Nous pensons qu’il a été critiqué de manière excessive.*
          *Binôme B : Oui, mais il a aussi été soutenu par une partie de ses abonnés.*
      - id: act3-titles
        type: callout
        tone: info
        title: Titres viraux
        text: |-
          *Un mème a été partagé plus de 3 millions de fois.*
          *Une nouvelle fonctionnalité a été ajoutée sur TikTok cette semaine.*
          *Une célébrité a été critiquée sur Twitter pour ses commentaires.*
          *Une vidéo a été supprimée de YouTube pour non-respect des règles.*
      - id: act3-reactions
        type: discussionQuestions
        title: Mes réactions
        items:
          - question: 'Titre 1 : ma réaction à la voix passive + mon opinion'
            frame: Cette information a été exagérée par les médias. / Cette vidéo a été vue des millions de fois en quelques heures.
          - question: 'Titre 2 : ma réaction à la voix passive + mon opinion'
            frame: Ce scandale a été utilisé comme publicité par la marque. / Cette publication a été mal interprétée par beaucoup d’utilisateurs.
          - question: 'Mon titre viral'
            frame: Une nouvelle application a été…
      - id: act4
        type: classActivity
        title: 'Activité 4 : Jeu de rôle – l’influenceur interviewé'
        skills: [Le passé composé, La voix passive]
        minutes: 37
        steps:
          - '**Attribution des rôles (5 minutes) :** le professeur distribue des cartes. Influenceurs : gamer, activiste écologiste, mannequin / mode, chef sur YouTube, voyageur sur TikTok. Journalistes : magazine tech, média de mode, journal sérieux, chaîne jeunesse. Adapte rapidement ton personnage.'
          - '**Préparation des questions (5 minutes) :** le journaliste prépare **4 ou 5 questions** au passé composé et / ou à la voix passive (voir la banque de questions).'
          - '**Interview (12 minutes) :** jouez l’interview. L’influenceur répond au passé composé (*J’ai collaboré avec…*) et à la voix passive (*Des critiques ont été publiées à propos de mon travail, mais…*).'
          - '**Changement de rôles (5 minutes) :** échangez les rôles. Nouvelle mini-interview avec au moins **2 nouvelles questions**.'
          - '**Mini-présentation (10 minutes) :** chaque binôme fait un petit résumé oral (2 ou 3 phrases), comme un article.'
          - '**Variante pour les classes nombreuses :** panel de presse avec 1 influenceur et 3 journalistes. Chaque journaliste pose une question différente.'
        example: '*Aujourd’hui, nous avons interviewé un influenceur voyage. Il a collaboré avec trois agences et beaucoup de photos ont été partagées sur Instagram.*'
      - id: act4-questions
        type: discussionQuestions
        title: Banque de questions
        items:
          - question: Combien de collaborations as-tu faites avec des marques cette année ?
            frame: J’ai fait… collaborations avec…
          - question: Quels commentaires négatifs ont été postés sous tes publications ?
            frame: Des commentaires sur… ont été postés, mais…
          - question: As-tu changé ton style de contenu ces derniers mois ?
            frame: Oui, je l’ai changé parce que… / Non, je ne l’ai pas changé.
          - question: Quelles rumeurs (ou fausses informations) ont été partagées à ton sujet ?
            frame: Des rumeurs ont été partagées au sujet de…
          - question: As-tu participé à des campagnes solidaires cette année ?
            frame: Oui, j’ai participé à…
          - question: Quelles tendances ont été suivies par tes abonnés les plus fidèles ?
            frame: La tendance… a été suivie par…
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Deux compétences dans ce cycle : **le passé composé** (échauffement, activités 2 et
          4) et **la voix passive** (activités 1, 3 et 4). Les activités dépassent la durée
          d’un cours : choisis-en deux ou trois selon le temps et le groupe.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: >-
          Deux phrases par élève, 30 secondes maximum par élève et pour toi. Si les élèves
          se connaissent déjà, passe directement aux questions d’échauffement. Cette phase
          ne dépasse pas 5 minutes.
      - id: n-warmup
        anchor: warmup
        text: >-
          Les questions 1 à 3 pratiquent le passé composé (attention à l’accord : *je l’ai
          changée*, car *l’* = *ma routine*) ; les questions 4 à 6, la voix passive. Pose au
          moins deux questions à chaque élève.
      - id: n-act1
        anchor: act1
        text: >-
          Objectif : produire un mini rapport formel à la voix passive. Les élèves peuvent
          chercher sur leur téléphone. Vérifie l’accord du participe (*une fonctionnalité a
          été ajoutée*).
      - id: n-act2
        anchor: act2
        minutes: 10
        text: >-
          Objectif : le passé composé dans un contexte personnel et ludique. Distribue la
          liste d’indices et compte les points au tableau.
      - id: n-act3
        anchor: act3
        minutes: 31
        text: >-
          Objectif : réagir à des titres viraux avec la voix passive. Prépare d’autres titres
          (2 ou 3 par binôme) en plus des quatre exemples. Synthèse finale : la voix passive
          permet de mettre l’accent sur l’événement, pas sur l’auteur de l’action.
      - id: n-act4
        anchor: act4
        minutes: 37
        text: >-
          Objectif : le passé composé et la voix passive dans un contexte réaliste. Prépare
          les cartes de rôles avant le cours. Pendant l’interview, circule et note les
          erreurs pour une correction collective à la fin.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: reseaux-sociaux-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: rules-passe-compose
        type: ruleSummary
        skill: Le passé composé
        rules:
          - text: 'Le **passé composé** raconte des **actions terminées** dans le passé, récentes ou non, et des **changements**. On l’utilise aussi pour compter des actions (*trois fois, plusieurs fois*). Pour une **habitude** dans le passé, on utilise l’imparfait.'
            examples:
              - J’ai publié beaucoup de photos cette semaine.
              - As-tu vu la dernière vidéo virale sur TikTok ?
              - Mes amis ont changé leur photo de profil plusieurs fois.
              - Ces dernières années, nous avons passé trop de temps sur les réseaux.
          - text: 'Structure : **sujet + auxiliaire (*avoir* ou *être* au présent) + participe passé**. La plupart des verbes prennent *avoir*.'
            examples: [j’ai partagé · tu as publié · ils ont suivi]
          - text: 'On utilise **être** avec les verbes de mouvement (*aller, venir, partir, sortir, arriver…*) et les verbes pronominaux. Avec *être*, le participe s’accorde avec le sujet.'
            examples: [Elle est allée sur TikTok., Nous nous sommes inscrits sur un nouveau réseau.]
          - text: 'Avec *avoir*, le participe s’accorde avec le **complément direct placé avant** le verbe (*l’, la, les, que*).'
            examples: ['As-tu changé ta routine ? Oui, je l’ai changée.']
          - text: 'Participes irréguliers utiles :'
            examples: ['voir → vu', 'lire → lu', 'suivre → suivi', 'mettre → mis', 'faire → fait']
          - text: 'À la forme négative, *ne… pas* entoure l’auxiliaire. Avec *ne… personne*, *personne* se place après le participe.'
            examples: [Je ne l’ai pas changée., Je n’ai rencontré personne.]
          - text: 'Expressions utiles :'
            examples:
              - Dernièrement, j’ai passé plus de temps sur TikTok.
              - J’ai toujours aimé les vidéos de cuisine.
              - Ça a été une bonne expérience.
      - id: avoir-etre-table
        type: table
        caption: Les auxiliaires au présent
        header: [Personne, avoir, être]
        rows:
          - [je / j’, ai, suis]
          - [tu, as, es]
          - [il / elle / on, a, est]
          - [nous, avons, sommes]
          - [vous, avez, êtes]
          - [ils / elles, ont, sont]
      - id: rules-passive
        type: ruleSummary
        skill: La voix passive
        rules:
          - text: 'La **voix passive** met l’accent sur l’**action** ou le **fait**, pas sur l’auteur. Elle est très fréquente dans les **titres** et les **informations**.'
          - text: 'Structure : **sujet + *être* au passé composé (*a été / ont été*) + participe passé (+ *par* + agent)**.'
            examples:
              - Un mème a été partagé par des millions d’utilisateurs.
              - L’algorithme a été critiqué par les créateurs de contenu.
              - Une campagne solidaire a été diffusée sur Twitter.
              - Les photos ont été commentées des centaines de fois.
          - text: 'Le participe passé **s’accorde avec le sujet** (féminin : *-e*, pluriel : *-s*).'
            examples:
              [
                Une publication a été partagée.,
                Les photos ont été commentées.,
                De fausses informations ont été partagées.,
              ]
          - text: 'Souvent, on ne mentionne pas l’agent.'
            examples:
              [La vidéo a été supprimée de YouTube., Cette publication a été mal interprétée.]
          - text: 'Au présent, on utilise *être* au présent : *La vidéo est partagée.*'
          - text: '**Comparaison :** passé composé actif (l’action d’une personne) → voix passive (le fait mis en avant).'
            examples:
              - J’ai publié trois photos aujourd’hui. → Trois photos ont été publiées sur le compte officiel de la marque.
              - Mes amis ont créé un nouveau groupe WhatsApp. → Un nouveau groupe a été créé sur WhatsApp.
      - id: passive-table
        type: table
        caption: L’accord du participe à la voix passive
        header: [Sujet, être au passé composé, Participe passé]
        rows:
          - [Un mème (masculin singulier), a été, partagé]
          - [Une vidéo (féminin singulier), a été, partagée]
          - [Les commentaires (masculin pluriel), ont été, partagés]
          - [Les photos (féminin pluriel), ont été, partagées]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Révise les deux compétences avec le groupe. Demande à chaque élève une phrase au passé composé sur sa propre activité en ligne, puis la même idée à la voix passive.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: reseaux-sociaux-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie un message et envoie-le. Mori va te poser des questions ; réponds à toutes.
      - id: mori-passe-compose
        type: aiTutorPrompt
        title: 'Message 1 : Passé composé (expériences personnelles)'
        intro: 'Exemple de question attendue : *As-tu partagé une information virale récemment ?*'
        message: |-
          Bonjour Mori, pose-moi des questions au passé composé sur les réseaux sociaux, une par une. Par exemple :
          Demande-moi si j’ai publié quelque chose récemment.
          Demande-moi si j’ai changé ma photo de profil.
          Demande-moi si j’ai rencontré quelqu’un grâce aux réseaux sociaux.
          Donne-moi un exemple avant que je réponde. Corrige mes erreurs et demande-moi de répéter la phrase corrigée.
      - id: mori-passive
        type: aiTutorPrompt
        title: 'Message 2 : Voix passive (actualité virale)'
        intro: 'Exemple attendu : *Un mème a été partagé des millions de fois. Qu’en penses-tu ?*'
        message: Bonjour Mori, invente une information à la voix passive, comme un titre viral, et demande-moi mon avis. Je réponds avec au moins une phrase à la voix passive. Corrige mon participe passé si je me trompe et dis-moi si ma réponse est naturelle. Recommence avec trois autres titres.
      - id: mori-long
        type: aiTutorPrompt
        title: 'Message 3 : Production plus longue'
        message: Bonjour Mori, pose-moi une question finale sur le meilleur et le pire des réseaux sociaux. Ensuite, demande-moi d’inventer un titre viral à la voix passive et de le commenter. Dans mes réponses, je dois utiliser le passé composé et la voix passive. Corrige mes erreurs et dis-moi si mes phrases sont naturelles.
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          Tu veux plus de questions ? Envoie : **S’il te plaît, pose-moi encore des questions !**
          Tu veux un modèle ? Envoie : **Mori, donne-moi un exemple avant que je réponde.**
          Tu ne comprends pas une explication ? Envoie : **Peux-tu m’expliquer en hébreu, mais avec la phrase en français ?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: reseaux-sociaux-pratique
    book: workbook
    title: 'Pratique : Réseaux sociaux'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Pratique les deux compétences du cycle. Chaque réponse est corrigée tout de suite, et tu peux réessayer.
      - id: ex-passe-compose
        type: activity
        activity: reseaux-sociaux-passe-compose
      - id: ex-passive
        type: activity
        activity: reseaux-sociaux-passive

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: reseaux-sociaux-vocabulaire
    title: Vocabulaire
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Les mots des réseaux sociaux
        glossLang: he
        link: https://quizlet.com/il/1144780154/extreme-french-2026-reseaux-sociaux-flash-cards/
        items: &reseaux-sociaux-words
          - { term: Réseau social, gloss: רשת חברתית }
          - { term: Plateforme, gloss: פלטפורמה }
          - { term: Application, gloss: אפליקציה }
          - { term: Utilisateur, gloss: משתמש }
          - { term: Compte, gloss: חשבון }
          - { term: Profil, gloss: פרופיל }
          - { term: Abonné, gloss: עוקב }
          - { term: Publication, gloss: פוסט / פרסום }
          - { term: Commentaire, gloss: תגובה }
          - { term: Message, gloss: הודעה }
          - { term: Groupe, gloss: קבוצה }
          - { term: Partager, gloss: לשתף }
          - { term: Publier, gloss: לפרסם }
          - { term: Mettre en ligne / Poster, gloss: להעלות }
