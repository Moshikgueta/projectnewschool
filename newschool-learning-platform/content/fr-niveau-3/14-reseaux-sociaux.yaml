vocabulary:
  - slug: reseaux-sociaux
    title: Réseaux sociaux
    items: *reseaux-sociaux-words

activities:
  - slug: reseaux-sociaux-passe-compose
    title: 'Le passé composé : mes expériences en ligne'
    minutes: 8
    items:
      - id: ai-publie
        type: multipleChoice
        prompt: Hier, j’___ trois photos sur Instagram.
        options:
          - { text: ai publié, correct: true }
          - {
              text: suis publié,
              feedback: '*Publier* se conjugue avec *avoir* au passé composé : *j’ai publié*.',
            }
          - {
              text: ai publier,
              feedback: 'Après l’auxiliaire, on met le participe passé *publié*, pas l’infinitif *publier*.',
            }
      - id: ont-change
        type: fillBlank
        prompt: Complète avec le verbe *changer* au passé composé.
        text: Mes amis ___ leur photo de profil plusieurs fois.
        blanks: [[ont changé]]
      - id: a-rencontre
        type: multipleChoice
        prompt: Ma sœur ___ quelqu’un d’important grâce aux réseaux sociaux.
        options:
          - { text: a rencontré, correct: true }
          - {
              text: est rencontrée,
              feedback: '*Rencontrer* se conjugue avec *avoir* : *elle a rencontré*.',
            }
          - {
              text: a rencontrée,
              feedback: 'Avec *avoir*, le participe ne s’accorde pas avec le sujet : *elle a rencontré*.',
            }
      - id: partager-etre
        type: trueFalse
        prompt: 'Cette phrase est correcte : *Je suis partagé une vidéo sur TikTok.*'
        answer: false
        feedback:
          correct: 'Bravo ! *Partager* se conjugue avec *avoir* : *J’ai partagé une vidéo sur TikTok.*'
          incorrect: 'Attention : *partager* se conjugue avec *avoir*. On dit : *J’ai partagé une vidéo sur TikTok.*'
      - id: participes
        type: matching
        prompt: Associe chaque verbe à son participe passé.
        pairs:
          - [publier, publié]
          - [voir, vu]
          - [lire, lu]
          - [suivre, suivi]
          - [mettre, mis]
      - id: routine
        type: fillBlank
        prompt: 'Complète avec *changer* au passé composé. Attention : *l’* = *ma routine* (féminin), placé avant le verbe.'
        text: As-tu changé ta routine à cause des réseaux sociaux ? — Oui, je l’ai ___ parce que je passe trop de temps sur mon téléphone.
        blanks: [[changée]]
      - id: as-tu-vu
        type: multipleChoice
        prompt: ___-tu vu la dernière vidéo virale sur TikTok ?
        options:
          - { text: As, correct: true }
          - {
              text: Es,
              feedback: '*Voir* se conjugue avec *avoir*. Pour *tu*, l’auxiliaire est *as* : *As-tu vu… ?*',
            }
          - {
              text: A,
              feedback: '*A* est pour *il / elle*. Pour *tu*, on dit *as* : *As-tu vu… ?*',
            }
      - id: ordre-groupe
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Mes amis ont créé un nouveau groupe.

  - slug: reseaux-sociaux-passive
    title: 'La voix passive : les titres viraux'
    minutes: 8
    items:
      - id: a-ete-partage
        type: multipleChoice
        prompt: Un mème ___ partagé par des millions d’utilisateurs.
        options:
          - { text: a été, correct: true }
          - {
              text: est été,
              feedback: 'Au passé composé, *être* se conjugue avec *avoir* : *a été*.',
            }
          - {
              text: a,
              feedback: '*Un mème a partagé* veut dire que le mème fait l’action. À la voix passive, on utilise *être* : *a été partagé*.',
            }
      - id: ajoutee
        type: fillBlank
        prompt: Complète avec le participe passé de *ajouter*. Attention à l’accord.
        text: Une nouvelle fonctionnalité a été ___ sur TikTok cette semaine.
        blanks: [[ajoutée]]
      - id: commentees
        type: fillBlank
        prompt: Complète avec le participe passé de *commenter*. Attention à l’accord.
        text: Les photos ont été ___ des centaines de fois.
        blanks: [[commentées]]
      - id: actif-passif
        type: multipleChoice
        prompt: 'Mets à la voix passive : *Les créateurs de contenu ont critiqué l’algorithme.*'
        options:
          - { text: L’algorithme a été critiqué par les créateurs de contenu., correct: true }
          - {
              text: L’algorithme a critiqué les créateurs de contenu.,
              feedback: 'Cette phrase change le sens : ici, c’est l’algorithme qui critique. À la voix passive : *a été critiqué par…*',
            }
          - {
              text: L’algorithme a été critiquée par les créateurs de contenu.,
              feedback: '*Algorithme* est masculin : le participe ne prend pas de *-e*. On écrit *critiqué*.',
            }
      - id: agent
        type: trueFalse
        prompt: À la voix passive, on doit toujours mentionner l’agent avec *par*.
        answer: false
        feedback:
          correct: 'Bravo ! Souvent, on ne mentionne pas l’agent : *La vidéo a été supprimée de YouTube.*'
          incorrect: 'Non : souvent, on ne mentionne pas l’agent. *La vidéo a été supprimée de YouTube.*'
      - id: accord-sujet
        type: matching
        prompt: Associe chaque sujet à la bonne forme passive.
        pairs:
          - [Un mème, a été partagé]
          - [Une campagne, a été diffusée]
          - [Les photos, ont été commentées]
          - [Les commentaires, ont été supprimés]
      - id: ont-ete
        type: multipleChoice
        prompt: Beaucoup de fausses informations ___ partagées sur Twitter.
        options:
          - { text: ont été, correct: true }
          - {
              text: a été,
              feedback: 'Le sujet *beaucoup de fausses informations* est au pluriel : on dit *ont été*.',
            }
          - {
              text: sont été,
              feedback: 'Au passé composé, *être* se conjugue avec *avoir* : *ont été*.',
            }
      - id: ordre-publication
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Cette publication a été mal interprétée.
