# Cycle "Relations publiques", converted from the French level 3 digital notebook
# ("Cahier digital 2026 - français niveau 3", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-3
slug: relations-publiques
title: Relations publiques
goal: Se présenter avec un vocabulaire professionnel et exprimer une opinion en la justifiant.
position: 11
status: published

review:
  - >-
    The two workbook exercises ("Le vocabulaire professionnel" and "Exprimer une opinion
    et la justifier") are NEW: the notebook has no self-study exercises. They were
    written from the cycle's summary rules, the Activity 1 model, the intro frame and the
    vocabulary. Please check level, wording and every right answer before students see
    them.
  - >-
    This cycle is SHORT in the source: one class activity (the professional profile), a
    summary about the professional presentation, a Mori task list and the vocabulary.
    The notebook lists three skills: (1) vocabulaire professionnel, (2) narration avec
    plusieurs temps, (3) exprimer des opinions en se justifiant. The cycle overview keeps
    (1) and (3), which the class and the summary practise. Skill (2) appears only in the
    Mori tasks (passé / présent / futur), which were kept. There are no times for the
    warm-up or Activity 1; please add them.
  - >-
    The Mori homework in the source is a list of four activities, not messages, and
    seems adapted from a Spanish notebook ("modismes" = Spanish "modismos"). Mori
    messages were written from them; "modismes" → "expressions idiomatiques", using the
    idioms of the vocabulary list. "Rappel" kept as the tips callout.
  - >-
    Summary fixes: "Je me spécialise en + substantif / infinitif" → "se spécialiser dans
    / en + nom" (not + infinitif; the model says "Je me spécialise dans l'aménagement
    intérieur"); "Mon objectif professionnel est + infinitif" → "est de + infinitif" (the
    model says "est de satisfaire"); "aider à + infinitif" → "aider quelqu'un à +
    infinitif". Added (please confirm): "car" next to "parce que", and a rule with
    opinion phrases (selon moi, à mon avis, je pense que, il est important de…), taken
    from the intro frame and the warm-up.
  - >-
    Corrections: intro frame "dans les relations publique" → "publiques"; warm-up "un
    professionnel vs un non-professionnel" → "par rapport à"; Activity 1 "Ville / Pays :
    Ramat Gan / Bnei Brak" → "Ramat Gan (Israël)"; second example "Nom : Artiste local /
    Profession : Étude d'art" (Spanish calque "estudio de arte") → "Atelier d'art local /
    artiste peintre"; "Clients" → "Public cible"; vocabulary "Avoir bonne image" →
    "Avoir une bonne image"; "CEO" → "PDG (CEO)"; "TV" → "la télé (TV)".
  - >-
    The source's definition, goal and list of PR tasks are kept as an info callout. The
    warm-up "Exemples de réponses" and the "Discussion" points (professional vs
    non-professional, required skills, advantages / disadvantages: "moins de pression
    sur les décisions / moins de contrôle") are kept as discussion questions and a
    teacher note; the advantages / disadvantages point is unclear in the source
    (positions of what?), it was turned into a question about working for a company vs
    freelance. Please confirm.
  - >-
    Left out: the "Date / Participants" lines and the "Réponse de l'élève 1/2/3" lines
    (the platform has answer boxes). "Dalia Designs" is the notebook's model name (not a
    student). The Quizlet link is kept without its tracking parameters (?i=…&x=…).
  - >-
    Vocabulary: "Répondre – להגיב" → "לענות / להגיב" (להגיב is the gloss of
    "Réagir"); "Rester discret – להישאר מתחת לרדאר" → "להישאר בפרופיל נמוך"; "Avoir
    bonne image – תדמית טובה" → "להיות בעל תדמית טובה" (the term is a verb phrase);
    "Nouvelle page / repartir à zéro" → "Tourner la page / repartir à zéro" (the
    French idiom); "ONG – עמותה" → "ארגון לא ממשלתי / עמותה".
    Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: relations-publiques-classe
    title: 'Classe : Relations publiques'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Relations publiques
      - id: skills
        type: cycleOverview
        skills:
          - name: Le vocabulaire professionnel
            description: 'Se présenter : *Je suis designer d’intérieur. J’aide les personnes à rénover leur maison.*'
          - name: Exprimer une opinion et la justifier
            description: '*Selon moi, il est important d’écouter le public car une marque doit comprendre ses besoins.*'
      - id: definition
        type: callout
        tone: info
        title: Les relations publiques (RP)
        text: |-
          Les relations publiques sont le domaine ou la profession qui consiste à créer et à maintenir une bonne image d’une personne, d’une entreprise ou d’une institution auprès du public.
          **Objectif :** communiquer efficacement, créer la confiance et construire une réputation positive.
          **Tâches d’un professionnel des RP :** organiser des événements, parler aux médias, gérer la communication d’une entreprise, résoudre des crises d’image, soigner l’image publique d’une marque ou d’une personne.
      - id: quizlet
        type: externalLink
        label: Relations publiques sur Quizlet
        url: https://quizlet.com/il/1144023644/extreme-french-2026-relations-publiques-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. Selon moi, dans les relations publiques, il est important de ___ car ___.
        example: Je m’appelle Lévanah. Selon moi, il est important d’écouter le public car une marque doit comprendre ses besoins.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup
        type: discussionQuestions
        items:
          - question: Que signifie « avoir une bonne image » dans le monde professionnel ou sur les réseaux sociaux ? Donne un exemple réel ou imaginé.
            frame: Avoir une bonne image, c’est… Par exemple,…
          - question: Qu’est-ce qui distingue un professionnel d’un non-professionnel ?
            frame: À mon avis, un professionnel… alors qu’un non-professionnel…
          - question: Quelles compétences faut-il pour bien communiquer avec le public ?
            frame: Il faut… parce que…
          - question: Selon toi, quels sont les avantages et les inconvénients de travailler pour une entreprise plutôt qu’à son compte ?
            frame: L’avantage, c’est… L’inconvénient, c’est…
      - id: warmup-examples
        type: callout
        tone: info
        title: Exemples de réponses
        text: |-
          Avoir une image authentique, parler avec sincérité.
          Adapter les contenus aux besoins du public.
          Aider un client ou un patient avec patience et professionnalisme.
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Crée ton profil professionnel'
        skills: [Le vocabulaire professionnel, Exprimer une opinion et la justifier]
        steps:
          - '**Étape 1 – Ton identité professionnelle :** complète les informations (nom professionnel, profession ou services, ville et pays, public cible).'
          - '**Étape 2 – Ta présentation :** écris 5 ou 6 lignes pour te présenter, comme dans le modèle.'
          - '**Étape 3 – Ton image professionnelle :** réponds en phrases courtes : trois adjectifs pour décrire ton style professionnel, ce qui te distingue des autres, le problème principal que tu résous pour tes clients.'
          - Présente ton profil au groupe.
        example: |-
          **Nom professionnel :** Dalia Designs · **Profession :** designer d’intérieur · **Ville :** Ramat Gan (Israël) · **Public cible :** les personnes qui veulent rénover leur maison
          **Autre exemple :** Atelier d’art local · artiste peintre · Madrid (Espagne) · les personnes qui s’intéressent à l’art
          *Je m’appelle Dalia et je suis designer d’intérieur. Je travaille en freelance à Ramat Gan, Petah Tikva et Bnei Brak. J’aide les personnes qui ont une maison ancienne à la rénover. Je me spécialise dans l’aménagement intérieur. Mes clients me choisissent car je suis patiente. Mon objectif professionnel est de satisfaire mes clients.*
      - id: act1-identity
        type: discussionQuestions
        title: 'Étape 1 : Mon identité professionnelle'
        items:
          - question: Nom professionnel
          - question: Profession / services
          - question: Ville / pays
          - question: Public cible
      - id: act1-presentation
        type: discussionQuestions
        title: 'Étape 2 : Ma présentation'
        items:
          - question: Qui es-tu ?
            frame: Je m’appelle… et je suis…
          - question: Où travailles-tu ?
            frame: Je travaille en freelance à… / Je travaille chez…
          - question: Qui aides-tu ?
            frame: J’aide les personnes qui… à…
          - question: Quelle est ta spécialité ?
            frame: Je me spécialise dans…
          - question: Pourquoi tes clients te choisissent-ils ?
            frame: Mes clients me choisissent car / parce que…
          - question: Quel est ton objectif professionnel ?
            frame: Mon objectif professionnel est de…
      - id: act1-image
        type: discussionQuestions
        title: 'Étape 3 : Mon image professionnelle'
        items:
          - question: Trois adjectifs pour décrire ton style professionnel
            frame: Je suis… (créatif / créative, patient(e), organisé(e), flexible…)
          - question: Ce qui te distingue des autres
            frame: Ce qui me distingue des autres, c’est…
          - question: Le problème principal que tu résous pour tes clients
            frame: J’aide mes clients à…
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Ce cycle est court : une seule activité en classe. Le cahier liste trois
          compétences : le vocabulaire professionnel, la narration avec plusieurs temps et
          l’expression d’opinions justifiées. La classe pratique surtout le vocabulaire
          professionnel et l’opinion ; la narration au passé, au présent et au futur
          revient dans les devoirs avec Mori. Le cahier ne donne pas de durée pour
          l’échauffement et l’activité 1.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: >-
          Deux phrases par élève, 30 secondes maximum par élève et pour toi. Si les élèves
          se connaissent déjà, passe directement aux questions d’échauffement.
      - id: n-warmup
        anchor: warmup
        text: >-
          Pour la discussion, parle des compétences nécessaires : patience, maîtrise des
          langues, amabilité, formation professionnelle. Demande à chaque élève de
          justifier son opinion (*parce que, car*).
      - id: n-act1
        anchor: act1
        text: >-
          Compétences travaillées : clarté, langue professionnelle, confiance,
          présentation. Vérifie *aider quelqu’un à + infinitif*, *se spécialiser dans +
          nom* et *mon objectif est de + infinitif*.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: relations-publiques-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: rules-presentation
        type: ruleSummary
        skill: Le vocabulaire professionnel
        rules:
          - text: 'On utilise le **présent de l’indicatif** pour parler de soi et de son travail.'
            examples: [Je m’appelle…, je suis…, je travaille…, j’aide…, je me spécialise…]
          - text: 'Structures pour la présentation professionnelle :'
            examples:
              - Je m’appelle + nom
              - Je suis + profession (sans article) → Je suis designer d’intérieur.
              - Je travaille en freelance à + ville → Je travaille en freelance à Ramat Gan.
              - J’aide + personnes + à + infinitif → J’aide les personnes à rénover leur maison.
              - Je me spécialise dans + nom → Je me spécialise dans l’aménagement intérieur.
              - Mon objectif professionnel est de + infinitif → Mon objectif est de satisfaire mes clients.
          - text: 'Adjectifs pour décrire le style professionnel :'
            examples:
              ['créatif / créative, patient(e), professionnel(le), proche, organisé(e), flexible']
      - id: rules-opinion
        type: ruleSummary
        skill: Exprimer une opinion et la justifier
        rules:
          - text: 'Pour donner son opinion : **selon moi**, **à mon avis**, **je pense que**, **il est important de** + infinitif.'
            examples:
              [
                'Selon moi, il est important d’écouter le public.',
                'À mon avis, une marque doit être authentique.',
              ]
          - text: 'Pour justifier (la cause) : **parce que** ou **car** + phrase.'
            examples:
              - Mes clients me choisissent parce que je suis patiente.
              - Il est important d’écouter le public car une marque doit comprendre ses besoins.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Demande à chaque élève une phrase de présentation et une opinion justifiée sur les relations publiques.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: relations-publiques-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie un message et envoie-le. Mori va te poser des questions ; réponds à toutes.
      - id: mori-porte-parole
        type: aiTutorPrompt
        title: 'Activité 1 : Je suis le porte-parole'
        intro: 'Dans chaque réponse : une phrase au passé, une au présent, une au futur, un connecteur (*parce que, car, donc, mais*) et un sigle (*RP, ONG, PDG, TV*).'
        message: Bonjour Mori, imagine qu’une entreprise a une crise d’image et que je suis son porte-parole. Pose-moi 6 questions de journaliste, une par une. Dans chaque réponse, j’utiliserai le passé, le présent et le futur, un connecteur et un sigle. Corrige-moi tout de suite après chaque réponse.
      - id: mori-expressions
        type: aiTutorPrompt
        title: 'Activité 2 : Expression correcte ou dangereuse ?'
        intro: 'Expressions du cycle : *avoir une bonne image, devenir viral, voler la vedette, rester discret, soigner l’image, repartir à zéro, bien jouer ses cartes, donner un coup de main*.'
        message: Bonjour Mori, écris 8 phrases sur les relations publiques avec des expressions idiomatiques françaises. Certaines sont bien utilisées, d’autres non. Pour chaque phrase, je vais dire si l’expression est correcte, la corriger si nécessaire et proposer une version plus naturelle. Ensuite, corrige mes réponses.
      - id: mori-message
        type: aiTutorPrompt
        title: 'Activité 3 : Un message avec des sigles'
        message: Bonjour Mori, je vais écrire un message court pour les réseaux sociaux d’une entreprise, avec 2 sigles, 1 expression idiomatique et 1 connecteur. Corrige mon message et aide-moi à l’adapter à deux publics différents (des jeunes et des professionnels).
      - id: mori-temps
        type: aiTutorPrompt
        title: 'Activité 4 : Avant, maintenant, après'
        intro: 'Exemple : *L’année dernière, l’entreprise a fait une erreur. Maintenant, elle s’excuse auprès du public. Demain, elle publiera un communiqué.*'
        message: Bonjour Mori, donne-moi 3 situations de relations publiques. Pour chaque situation, je vais écrire une phrase au passé, une au présent et une au futur. Corrige mes phrases et pose-moi une question pour justifier mon opinion.
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          **Rappel :** donne la priorité au message, utilise des connecteurs simples, pense au public et accepte la correction.
          Tu veux plus de questions ? Envoie : **S’il te plaît, pose-moi encore des questions !**
          Tu ne comprends pas une explication ? Envoie : **Peux-tu m’expliquer en hébreu, mais avec la phrase en français ?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: relations-publiques-pratique
    book: workbook
    title: 'Pratique : Relations publiques'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Pratique les deux compétences du cycle. Chaque réponse est corrigée tout de suite, et tu peux réessayer.
      - id: ex-vocabulaire
        type: activity
        activity: relations-publiques-vocabulaire
      - id: ex-opinion
        type: activity
        activity: relations-publiques-opinion

