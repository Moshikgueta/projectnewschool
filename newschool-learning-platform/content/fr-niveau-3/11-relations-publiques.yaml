vocabulary:
  - slug: relations-publiques
    title: Relations publiques
    items: *relations-publiques-words

activities:
  - slug: relations-publiques-vocabulaire
    title: 'Le vocabulaire professionnel : se présenter'
    minutes: 8
    items:
      - id: definitions
        type: matching
        prompt: Associe chaque mot à sa définition.
        pairs:
          - [un porte-parole, la personne qui parle au nom d’une entreprise]
          - [un communiqué, un texte officiel envoyé aux médias]
          - [une crise, un moment difficile pour l’image d’une entreprise]
          - [une campagne, une série d’actions pour transmettre un message]
          - [le public cible, les personnes à qui on s’adresse]
      - id: rp-objectif
        type: multipleChoice
        prompt: Les relations publiques servent à ___ une bonne image auprès du public.
        options:
          - { text: créer et maintenir, correct: true }
          - {
              text: cacher,
              feedback: 'Les RP ne cachent pas l’image : elles servent à créer et à maintenir une bonne image.',
            }
          - {
              text: vendre et acheter,
              feedback: 'Vendre et acheter, c’est le commerce. Les RP servent à créer et à maintenir une bonne image.',
            }
      - id: aider-a
        type: fillBlank
        prompt: Complète avec la bonne préposition.
        text: J’aide les personnes ___ rénover leur maison.
        blanks: [[à]]
      - id: specialise-dans
        type: fillBlank
        prompt: Complète avec la bonne préposition.
        text: Je me spécialise ___ l’aménagement intérieur.
        blanks: [[dans]]
      - id: objectif-de
        type: multipleChoice
        prompt: Mon objectif professionnel est ___ satisfaire mes clients.
        options:
          - { text: de, correct: true }
          - {
              text: à,
              feedback: 'On dit *mon objectif est de + infinitif* : *Mon objectif est de satisfaire mes clients.*',
            }
          - {
              text: pour,
              feedback: 'On dit *mon objectif est de + infinitif* : *Mon objectif est de satisfaire mes clients.*',
            }
      - id: pdg
        type: multipleChoice
        prompt: Que veut dire le sigle *PDG* ?
        options:
          - { text: la personne qui dirige l’entreprise, correct: true }
          - {
              text: un texte officiel pour les médias,
              feedback: 'Un texte officiel pour les médias, c’est un *communiqué*. Le *PDG* (président-directeur général) dirige l’entreprise.',
            }
          - {
              text: une association,
              feedback: 'Une association, c’est une *ONG*. Le *PDG* (président-directeur général) dirige l’entreprise.',
            }
      - id: coup-de-main
        type: trueFalse
        prompt: '*Donner un coup de main* veut dire *aider*.'
        answer: true
        feedback:
          correct: 'Bravo ! *Donner un coup de main* = aider quelqu’un.'
          incorrect: 'C’est vrai : *donner un coup de main*, c’est aider quelqu’un. Ce n’est pas violent !'
      - id: ordre-clients
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Mes clients me choisissent car je suis patiente.

  - slug: relations-publiques-opinion
    title: 'Exprimer une opinion et la justifier'
    minutes: 8
    items:
      - id: important-de
        type: multipleChoice
        prompt: Selon moi, il est important ___ écouter le public.
        options:
          - { text: d’, correct: true }
          - {
              text: de,
              feedback: 'Devant une voyelle, *de* devient *d’* : *il est important d’écouter*.',
            }
          - {
              text: à,
              feedback: 'On dit *il est important de + infinitif*. Devant une voyelle : *d’écouter*.',
            }
      - id: car-parce-que
        type: fillBlank
        prompt: Complète avec un connecteur de cause.
        text: Mes clients me choisissent ___ je suis patiente.
        blanks: [[parce que, car]]
      - id: cause
        type: trueFalse
        prompt: '*Car* et *parce que* servent à justifier : ils expriment la cause.'
        answer: true
        feedback:
          correct: 'Bravo ! *Je suis designer car j’aime créer. / … parce que j’aime créer.*'
          incorrect: 'C’est vrai : *car* et *parce que* expriment la cause. *Je suis designer car j’aime créer.*'
      - id: opinion-justifiee
        type: multipleChoice
        prompt: Quelle phrase donne une opinion ET la justifie ?
        options:
          - {
              text: 'À mon avis, une marque doit être authentique parce que le public veut de la sincérité.',
              correct: true,
            }
          - {
              text: 'À mon avis, une marque doit être authentique.',
              feedback: 'Cette phrase donne une opinion, mais pas de raison. Ajoute *parce que* ou *car* + une raison.',
            }
          - {
              text: Une marque publie un communiqué.,
              feedback: 'Cette phrase décrit un fait : il n’y a ni opinion (*à mon avis*) ni justification (*parce que*).',
            }
      - id: phrases
        type: matching
        prompt: Associe le début et la fin de chaque phrase.
        pairs:
          - [
              'Selon moi, il est important d’écouter le public,',
              car une marque doit comprendre ses besoins.,
            ]
          - [
              'À mon avis, une entreprise doit s’excuser après une erreur,',
              parce que le public veut de la sincérité.,
            ]
          - [
              'Je pense qu’un bon porte-parole doit être patient,',
              car les journalistes posent beaucoup de questions.,
            ]
          - [
              'Il est important de soigner son image sur les réseaux sociaux,',
              parce qu’un message peut devenir viral.,
            ]
      - id: mon-avis
        type: fillBlank
        prompt: Complète l’expression d’opinion.
        text: À mon ___, il faut parler aux médias avec sincérité.
        blanks: [[avis]]
      - id: pense-que
        type: multipleChoice
        prompt: Je pense ___ une bonne image est essentielle.
        options:
          - { text: qu’, correct: true }
          - {
              text: de,
              feedback: 'Pour donner une opinion avec une phrase complète, on dit *je pense que* (*qu’* devant une voyelle).',
            }
          - {
              text: que,
              feedback: 'Devant une voyelle (*une*), *que* devient *qu’* : *Je pense qu’une bonne image…*',
            }
      - id: ordre-avis
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: À mon avis, la confiance est essentielle.
