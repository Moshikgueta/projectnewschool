vocabulary:
  - slug: nouvelles-recentes
    title: Nouvelles récentes
    items: *nouvelles-recentes-words

activities:
  - slug: nouvelles-recentes-indirect
    title: 'Le discours indirect : il a dit que…'
    minutes: 8
    items:
      - id: etait
        type: multipleChoice
        prompt: '« Je suis fatigué. » → Il a dit qu’il ___ fatigué.'
        options:
          - { text: était, correct: true }
          - {
              text: est,
              feedback: 'Après *il a dit que*, le présent devient imparfait : *je suis → il était*.',
            }
          - {
              text: sera,
              feedback: '*Sera* est au futur. Le présent *suis* devient imparfait : *il était*.',
            }
      - id: partirait
        type: fillBlank
        prompt: 'Mets au discours indirect avec le verbe *partir* : « Je partirai demain. »'
        text: Il a dit qu’il ___ le lendemain.
        blanks: [[partirait]]
      - id: expressions
        type: matching
        prompt: Associe chaque expression du discours direct à celle du discours indirect.
        pairs:
          - [aujourd’hui, ce jour-là]
          - [demain, le lendemain]
          - [hier, la veille]
          - [ici, là-bas]
          - [le mois prochain, le mois suivant]
      - id: musee
        type: multipleChoice
        prompt: 'Une semaine plus tard, tu rapportes ce titre : « Aujourd’hui, ils inaugurent un nouveau musée. » Quelle phrase est correcte ?'
        options:
          - {
              text: 'Ils ont dit que ce jour-là, ils inauguraient un nouveau musée.',
              correct: true,
            }
          - {
              text: 'Ils ont dit qu’aujourd’hui, ils inaugurent un nouveau musée.',
              feedback: 'Tu racontes un autre jour : *aujourd’hui* devient *ce jour-là*, et le présent devient imparfait (*inauguraient*).',
            }
          - {
              text: 'Ils ont dit que ce jour-là, ils inaugureront un nouveau musée.',
              feedback: '*Inaugureront* est au futur. Le présent *inaugurent* devient imparfait : *inauguraient*.',
            }
      - id: avait-fini
        type: fillBlank
        prompt: 'Mets au discours indirect, au plus-que-parfait : « J’ai fini mes devoirs. »'
        text: Il a dit qu’il ___ ses devoirs.
        blanks: [[avait fini]]
      - id: futur-conditionnel
        type: trueFalse
        prompt: 'Au discours indirect au passé, le futur simple devient conditionnel présent : « Il pleuvra. » → Ils ont dit qu’il pleuvrait.'
        answer: true
        feedback:
          correct: 'Bravo ! *Pleuvra* (futur) → *pleuvrait* (conditionnel).'
          incorrect: 'C’est vrai : le futur simple devient conditionnel présent. *« Il pleuvra »* → *Ils ont dit qu’il pleuvrait.*'
      - id: leur-equipe
        type: fillBlank
        prompt: 'Change le possessif : « Notre équipe gagne aujourd’hui. »'
        text: Ils ont dit que ___ équipe gagnait ce jour-là.
        blanks: [[leur]]
      - id: ordre-fatiguee
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Elle a dit qu’elle était fatiguée.

  - slug: nouvelles-recentes-temps
    title: 'Les temps mélangés : parler de l’actualité'
    minutes: 8
    items:
      - id: fonctions
        type: matching
        prompt: Associe chaque temps à sa fonction dans les nouvelles.
        pairs:
          - [passé composé, faits récents et événements ponctuels]
          - [imparfait, contexte ou description dans le passé]
          - [présent, ce qui se passe maintenant]
          - [futur simple, prédictions]
          - [conditionnel, hypothèse ou conséquence]
      - id: a-eu-lieu
        type: multipleChoice
        prompt: Hier, un accident ___ sur l’autoroute.
        options:
          - { text: a eu lieu, correct: true }
          - {
              text: aura lieu,
              feedback: '*Aura lieu* est au futur. *Hier* parle d’un événement ponctuel terminé : on utilise le passé composé, *a eu lieu*.',
            }
          - {
              text: aurait lieu,
              feedback: '*Aurait lieu* est au conditionnel (hypothèse). Pour un événement ponctuel terminé, on utilise le passé composé : *a eu lieu*.',
            }
      - id: etait-dense
        type: multipleChoice
        prompt: Hier, il y a eu un accident. La circulation ___ dense et il y avait beaucoup de monde.
        options:
          - { text: était, correct: true }
          - {
              text: sera,
              feedback: '*Sera* est au futur. Pour décrire le contexte dans le passé, on utilise l’imparfait : *était*.',
            }
          - {
              text: serait,
              feedback: '*Serait* est au conditionnel (hypothèse). Pour décrire le contexte dans le passé, on utilise l’imparfait : *était*.',
            }
      - id: aurons
        type: fillBlank
        prompt: Complète avec le verbe *avoir* au futur simple (une prédiction).
        text: Demain, nous ___ plus d’informations.
        blanks: [[aurons]]
      - id: seraient
        type: multipleChoice
        prompt: Les gens ___ plus tranquilles si on leur donnait plus de précisions.
        options:
          - { text: seraient, correct: true }
          - {
              text: seront,
              feedback: 'Avec *si* + imparfait (*si on leur donnait*), on utilise le conditionnel : *seraient*.',
            }
          - {
              text: étaient,
              feedback: '*Étaient* est à l’imparfait. Pour une hypothèse avec *si* + imparfait, on utilise le conditionnel : *seraient*.',
            }
      - id: ai-lu
        type: fillBlank
        prompt: Complète avec le verbe *lire* au passé composé.
        text: Cette semaine, j’___ une nouvelle importante.
        blanks: [[ai lu]]
      - id: imparfait-prediction
        type: trueFalse
        prompt: 'Pour une prédiction, on utilise l’imparfait : *Demain, il pleuvait.*'
        answer: false
        feedback:
          correct: 'Bravo ! Pour une prédiction, on utilise le futur : *Demain, il pleuvra.*'
          incorrect: 'L’imparfait décrit le contexte dans le passé (*La circulation était dense*). Pour une prédiction, on utilise le futur : *Demain, il pleuvra.*'
      - id: ordre-informations
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Demain, nous aurons plus d’informations.
