# Cycle "Nouvelles récentes", converted from the French level 3 digital notebook
# ("Cahier digital 2026 - français niveau 3", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-3
slug: nouvelles-recentes
title: Nouvelles récentes
goal: Rapporter ce que les autres ont dit au discours indirect et parler de l’actualité en mélangeant les temps.
position: 9
status: in_review

review:
  - >-
    The two workbook exercises ("Le discours indirect" and "Les temps mélangés") are NEW:
    the notebook has no self-study exercises. They were written from the cycle's summary
    rules, the headline examples and the vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Discours indirect rules (corrected, please confirm): the tense table said "Passé
    composé → passé composé ou plus-que-parfait"; the written norm after a past
    reporting verb is the PLUS-QUE-PARFAIT (« J’ai fini » → il a dit qu’il avait fini);
    keeping the passé composé is spoken usage only, now said in a note. The summary
    example "« Demain je vais voyager » → Il a annoncé que le lendemain il voyagerait"
    mixed up the futur proche and the futur simple: the futur proche becomes aller à
    l’imparfait + infinitif (il allait voyager); the futur simple becomes the conditionnel
    (« Je partirai » → il partirait). Rows for the futur proche were added to the table.
  - >-
    Time/place table: "ce → ce / celui-ci" is wrong; it now says "ce matin, cette semaine
    → ce matin-là, cette semaine-là". Added "le mois prochain → le mois suivant" (from the
    news text) and an example with "hier → la veille" (« Hier, il y a eu un accident » →
    la veille, il y avait eu un accident). Step 1 called « Demain commence la foire du
    livre » "futur": the verb is a present with future meaning; now "présent à valeur
    de futur" (it still becomes the imparfait: commençait).
  - >-
    Reporting verbs: "Elle a commenté que…" (commenter takes a direct object, not "que")
    → "Elle a ajouté que…"; "a informé que…" / "Ils ont informé que le lendemain il
    pleuvrait" (informer needs a person: informer quelqu’un que) → "a indiqué que…" /
    "Ils ont annoncé que le lendemain, il pleuvrait". The vocabulary items "commenter" and
    "informer" are kept.
  - >-
    Other corrections: warm-up "Qu’est-ce que pour toi la liberté d’expression ?" → "Pour
    toi, qu’est-ce que la liberté d’expression ?"; "Admirez-vous un journaliste ou une
    journaliste ?" (vous, while all other questions use tu) → "Admires-tu un ou une
    journaliste ?"; news text "Selon le Ministère des Transports" → "le ministère des
    Transports" (French capitalisation); debate dilemma "Fake news" → "Les fausses
    informations (fake news)"; survey "Vérifies-tu la météo ? Était-ce exact ?" →
    "Consultes-tu la météo ? La dernière prévision était-elle exacte ?"; the survey
    conclusion example was turned into reported speech (Six élèves ont dit qu’ils
    lisaient…). The warm-up items all numbered "1." and broken "**" marks were cleaned up.
  - >-
    Numbering: the source has two "Activité 1" (Lecture et compréhension, and Titres au
    discours indirect) followed by Activités 2–5. They are renumbered 1–6.
  - >-
    The reading text is not marked as a real news item; it is labelled "Nouvelle adaptée
    (niveau B1)". The answer key for the comprehension questions is in a teacher note.
    The intro example mentions Le Monde and France Info (names only, no links).
  - >-
    The third skill in the source (connecteurs pour exprimer une opinion et organiser
    l’information) has no rule in the source summary; a short rule with connectors from
    the news text and the debate (selon, car, cependant, c’est pourquoi, de plus) was
    added under the mixed-tenses skill.
  - >-
    Times: intro 5; warm-up has no time ("Le professeur choisit 3–4 questions"); reading
    activity: reading 2–3 → 3, comprehension 5, pair discussion 5–7 → 7, transition 3–5
    → 5 (20 minutes in total). The other activities have no times in the source. Left
    out: the "Niveau 3 : français extrême" line, "Date / Participants" lines and all
    "Réponse de l’élève 1/2/3" lines. No gamma.app link was found in this cycle.
  - >-
    Added (not in the source, please check): sentence frames for the warm-up, the
    comprehension and discussion questions, the survey and the good news; an example for
    the debate; "Corrige mes erreurs." at the end of Mori task 3; titles for the three
    Mori tasks.
  - >-
    Vocabulary: "déclarer / annonce – להצהיר / הודעה" split into "déclarer – להצהיר" and
    "annonce – הודעה / הכרזה"; "discours indirect – סגנון עקיף" → "דיבור עקיף" (the usual
    Hebrew grammar term); "hypothèse – הנחה / השערה" → "השערה" (הנחה also means
    "réduction", which is in the same list); "prévision / météo – תחזית" → "תחזית / תחזית
    מזג האוויר". Please confirm. The Quizlet link's tracking parameters (?i=…&x=…) were
    removed.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: nouvelles-recentes-classe
    title: 'Classe : Nouvelles récentes'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Nouvelles récentes
      - id: skills
        type: cycleOverview
        skills:
          - name: Le discours indirect au passé
            description: 'Rapporter ce que quelqu’un a dit : *Il a dit qu’il était fatigué. Ils ont annoncé que le lendemain, il pleuvrait.*'
          - name: Les temps mélangés
            description: 'Passé composé, imparfait, présent, futur et conditionnel pour parler de l’actualité'
      - id: quizlet
        type: externalLink
        label: Nouvelles récentes sur Quizlet
        url: https://quizlet.com/il/1144014902/extreme-french-2026-nouvelles-recentes-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. Quand je veux m’informer, je ___.
        example: Je m’appelle Lévanah. Quand je veux m’informer, je consulte Le Monde sur mon téléphone ou j’écoute France Info.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup
        type: discussionQuestions
        items:
          - question: À quelle fréquence penses-tu qu’une personne doit regarder ou écouter les nouvelles ?
            frame: Je pense qu’une personne doit regarder les nouvelles ___ parce que ___.
          - question: Pour toi, qu’est-ce que la liberté d’expression ?
            frame: Pour moi, la liberté d’expression, c’est ___.
          - question: Une manifestation, une crise ou un événement dramatique a-t-il eu lieu récemment dans ta région ?
            frame: Oui, récemment, il y a eu ___. / Non, il ne s’est rien passé.
          - question: Comment les réseaux sociaux ont-ils changé la façon dont nous recevons les nouvelles ?
            frame: Avec les réseaux sociaux, ___.
          - question: Admires-tu un ou une journaliste ? Pourquoi ?
            frame: J’admire ___ parce que ___.
          - question: Selon toi, les enfants sont-ils trop exposés aux nouvelles ?
            frame: Selon moi, ___ parce que ___.
          - question: As-tu déjà vu une information ou une prévision météo erronée ? Que s’est-il passé ?
            frame: Oui, une fois, ils ont annoncé que ___, mais ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Lecture et compréhension'
        skills: [Les temps mélangés, Le discours indirect au passé]
        minutes: 20
        steps:
          - '**Lecture individuelle (3 minutes) :** lis la nouvelle ci-dessous.'
          - '**Compréhension guidée (5 minutes) :** réponds aux questions de compréhension.'
          - '**Discussion en binômes (7 minutes) :** parlez des questions de discussion.'
          - '**Transition vers le discours indirect (5 minutes) :** raconte au groupe ce qu’a dit ton / ta partenaire : *Mon camarade a dit que… / Elle a ajouté que… / Il a expliqué que…*'
      - id: act1-news
        type: callout
        tone: info
        title: 'Nouvelle adaptée (niveau B1) : La France annonce de nouvelles mesures pour améliorer les transports publics'
        text: |-
          Le gouvernement français a annoncé cette semaine un plan pour améliorer les transports publics dans plusieurs villes. Le projet inclut de nouvelles lignes de bus, des trains plus rapides et des tarifs réduits pour les étudiants et les seniors. Selon le ministère des Transports, les mesures commenceront le mois prochain et auront un impact positif sur la mobilité quotidienne.

          Des villes comme Paris, Lyon et Marseille ont accueilli la nouvelle avec enthousiasme, car le trafic a beaucoup augmenté ces dernières années. Cependant, certains usagers ont souligné qu’il fallait encore améliorer la fréquence aux heures de pointe.

          Une porte-parole du ministère a déclaré : *« Nous voulons que davantage de personnes choisissent les transports publics et réduisent l’usage de la voiture individuelle. »*
      - id: act1-comprehension
        type: discussionQuestions
        title: Compréhension
        items:
          - question: Qu’a annoncé le gouvernement cette semaine ?
            frame: Le gouvernement a annoncé ___.
          - question: Quelles mesures comprend le plan ?
            frame: Le plan comprend ___.
          - question: Quand commenceront-elles ?
            frame: Elles commenceront ___.
          - question: Quelle a été la réaction des villes mentionnées ?
            frame: Les villes ont accueilli la nouvelle ___.
          - question: Quel problème certains usagers ont-ils signalé ?
            frame: Certains usagers ont dit qu’il fallait ___.
          - question: Que dit la porte-parole sur l’objectif du plan ?
            frame: Elle a déclaré qu’ils voulaient que ___.
      - id: act1-discussion
        type: discussionQuestions
        title: Discussion en binômes
        items:
          - question: Ta ville a-t-elle besoin d’un plan similaire ?
            frame: Je pense que ma ville ___ parce que ___.
          - question: Quel transport utilises-tu le plus ?
            frame: J’utilise surtout ___.
          - question: Existe-t-il des réductions ou des avantages là où tu habites ?
            frame: Oui, il y a des réductions pour ___. / Non, il n’y en a pas.
          - question: Les nouvelles sur les transports sont-elles plutôt positives ou négatives ?
            frame: Elles sont plutôt ___ parce que ___.
          - question: Comment les transports affectent-ils ta vie quotidienne ?
            frame: Les transports ___.
      - id: act2
        type: classActivity
        title: 'Activité 2 : Titres au discours indirect'
        skills: [Le discours indirect au passé]
        steps:
          - '**Étape 1, identifie le temps du verbe :** présent, passé ou futur ? *« Le gouvernement annonce de nouvelles mesures »* (présent). *« Hier, il y a eu un accident »* (passé composé). *« Demain commence la foire du livre »* (présent à valeur de futur).'
          - '**Étape 2, choisis le verbe pour rapporter :** *a dit que…, a indiqué que…, a annoncé que…, a expliqué que…*'
          - '**Étape 3, change le temps du verbe :** présent → imparfait ; futur simple → conditionnel présent ; futur proche → *aller* à l’imparfait + infinitif ; passé composé → plus-que-parfait ; l’imparfait ne change pas (tableau du résumé).'
          - '**Étape 4, change les expressions de temps et de lieu** (tableau ci-dessous).'
          - '**Étape 5, ajuste les pronoms et les possessifs :** *« Notre équipe gagne aujourd’hui »* → *Ils ont dit que leur équipe gagnait ce jour-là.*'
          - '**Niveau 1, transformation guidée :** le professeur montre un titre ; tu identifies le temps, tu changes le verbe, l’expression de temps, le lieu et les pronoms, puis tu transformes le titre au discours indirect.'
          - '**Niveau 2, échange de titres :** écris 2 titres (inventés ou réels) et échange-les avec un(e) camarade. Transforme les titres reçus au discours indirect et partage les résultats avec le groupe.'
        example: |-
          *« Aujourd’hui, ils inaugurent un nouveau musée. »* → *Ils ont dit que ce jour-là, ils inauguraient un nouveau musée.*
          *« Aujourd’hui commencent les cours. »* → *Ils ont dit que ce jour-là, les cours commençaient.*
          *« Demain, il pleuvra. »* → *Ils ont annoncé que le lendemain, il pleuvrait.*
          *« Hier, il y a eu un accident. »* → *Ils ont dit que la veille, il y avait eu un accident.*
      - id: act2-table
        type: table
        caption: Expressions de temps et de lieu
        header: [Discours direct, Discours indirect]
        rows:
          - [aujourd’hui, ce jour-là]
          - [demain, le lendemain]
          - [hier, la veille]
          - [le mois prochain, le mois suivant]
          - [ici, là-bas]
          - ['ce matin, cette semaine', 'ce matin-là, cette semaine-là']
      - id: act2-headlines
        type: discussionQuestions
        title: Mes titres (niveau 2)
        items:
          - question: 'Titre 1 :'
            frame: Ils ont dit que ___.
          - question: 'Titre 2 :'
            frame: Ils ont annoncé que ___.
      - id: act3
        type: classActivity
        title: 'Activité 3 : Sondage. Comment consommes-tu les nouvelles ?'
        skills: [Le discours indirect au passé]
        steps:
          - '**Démonstration :** le professeur interviewe un élève et rapporte ses réponses.'
          - '**En binômes :** pose les questions ci-dessous à ton / ta partenaire.'
          - '**Rapport en groupe :** chaque élève présente les réponses de son / sa partenaire au discours indirect.'
          - '**Conclusion (facultatif) :** résumez les réponses de tout le groupe.'
        example: '*Six élèves ont dit qu’ils lisaient les nouvelles en ligne, mais plusieurs ont ajouté qu’ils utilisaient aussi les réseaux sociaux.*'
      - id: act3-questions
        type: discussionQuestions
        title: Questions du sondage
        items:
          - question: À quelle fréquence consommes-tu des nouvelles ?
            frame: Mon / Ma partenaire a dit qu’il / elle ___.
          - question: Où ? (chaîne de télévision, journal, réseau social)
            frame: Il / Elle a expliqué qu’il / elle ___.
          - question: Nouvelles locales ou internationales ?
            frame: Il / Elle a dit qu’il / elle préférait ___.
          - question: Quel titre retiens-tu de cette semaine ?
            frame: Il / Elle a dit qu’il / elle se souvenait de ___.
          - question: Consultes-tu la météo ? La dernière prévision était-elle exacte ?
            frame: Il / Elle m’a raconté que ___.
      - id: act4
        type: classActivity
        title: 'Activité 4 : Nouvelles nationales et internationales'
        skills: [Le discours indirect au passé, Les temps mélangés]
        steps:
          - 'En binômes, choisissez **une nouvelle nationale** et **une nouvelle internationale**.'
          - 'Préparez-les avec ce format : type d’événement, thème, où et quand, titre résumé, source et une courte citation inventée (*Le porte-parole a affirmé que…*).'
          - Changez de binôme et racontez ce que vous avez entendu **au discours indirect**.
      - id: act5
        type: classActivity
        title: 'Activité 5 : Débat. La liberté d’expression'
        skills: [Les temps mélangés]
        steps:
          - 'Choisissez un dilemme : **A. Vie privée des célébrités :** les médias devraient-ils publier des informations médicales ? **B. Couverture électorale inégale :** des règles devraient-elles réguler le temps d’antenne ? **C. Les fausses informations (fake news) :** faut-il contrôler ce qui se publie sur les réseaux sociaux ?'
          - 'Préparez vos arguments en groupe avec le passé, le présent, le futur, le conditionnel et des connecteurs logiques.'
          - Débattez avec l’autre groupe.
        example: '*L’année dernière, beaucoup de fausses informations ont circulé (passé composé). Aujourd’hui, tout le monde peut publier (présent). S’il y avait des règles, il y aurait moins de désinformation (conditionnel) ; cependant, il y aurait aussi moins de liberté.*'
      - id: act6
        type: classActivity
        title: 'Activité 6 : La chaîne des bonnes nouvelles'
        skills: [Les temps mélangés]
        steps:
          - 'Invente une nouvelle positive avec : un titre, ce qui s’est passé jusqu’à présent (passé composé), ce qui se passe maintenant (présent) et ce qui se passera ensuite (futur).'
          - Présente ta nouvelle comme un(e) journaliste de « La chaîne des bonnes nouvelles ».
      - id: act6-frames
        type: discussionQuestions
        title: Ma bonne nouvelle
        items:
          - question: Titre
            frame: ___
          - question: Qu’est-ce qui s’est passé jusqu’à présent ?
            frame: Jusqu’à présent, ___ a / ont ___.
          - question: Qu’est-ce qui se passe maintenant ?
            frame: Maintenant, ___.
          - question: Qu’est-ce qui se passera ensuite ?
            frame: Dans le futur, ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Deux compétences dans ce cycle : **le discours indirect au passé** (activités 1,
          2, 3 et 4) et **les temps mélangés** (activités 1, 4, 5 et 6). On travaille aussi
          la compréhension écrite, le débat et les connecteurs pour exprimer une opinion et
          organiser l’information. Seules les premières parties ont une durée dans le
          cahier : choisis les activités selon le temps du groupe.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: >-
          Deux phrases par élève, 30 secondes maximum par élève et pour toi. Si les élèves
          se connaissent déjà, passe directement aux questions d’échauffement.
      - id: n-warmup
        anchor: warmup
        text: Choisis 3 ou 4 questions. Pose au moins deux questions à chaque élève.
      - id: n-act1
        anchor: act1-comprehension
        minutes: 20
        text: >-
          Réponses : 1. Un plan pour améliorer les transports publics dans plusieurs
          villes. 2. De nouvelles lignes de bus, des trains plus rapides et des tarifs
          réduits pour les étudiants et les seniors. 3. Le mois prochain. 4. Elles l’ont
          accueillie avec enthousiasme, car le trafic a beaucoup augmenté. 5. Il faut
          encore améliorer la fréquence aux heures de pointe. 6. Ils veulent que davantage
          de personnes choisissent les transports publics et réduisent l’usage de la
          voiture. Cette lecture sert de modèle avant que les élèves produisent leurs
          propres nouvelles : elle active le vocabulaire et prépare le discours indirect.
      - id: n-act2
        anchor: act2
        text: >-
          Niveau 1 : écris des titres au tableau (par exemple *« Aujourd’hui, ils
          inaugurent un nouveau musée »*) et fais faire la transformation étape par étape.
          Niveau 2 : les élèves échangent leurs propres titres. À l’oral, beaucoup de
          francophones gardent le passé composé (*il a dit qu’il a fini*) ; à l’écrit,
          demande le plus-que-parfait (*qu’il avait fini*).
      - id: n-act3
        anchor: act3
        text: Fais toi-même la démonstration avec un élève. Si l’information est toujours vraie, accepte aussi le présent dans le rapport (*il a dit qu’il lit Le Monde tous les jours*).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: nouvelles-recentes-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: rules-indirect
        type: ruleSummary
        skill: Le discours indirect au passé
        rules:
          - text: 'Le **discours indirect** sert à rapporter ce que quelqu’un a dit. On utilise un verbe comme *a dit, a expliqué, a annoncé, a indiqué, a déclaré, a affirmé, a ajouté* + **que**, et on change les **temps**, les **pronoms** et les **expressions de temps et de lieu**.'
            examples:
              - '« Je suis fatigué. » → Il a dit qu’il était fatigué.'
              - '« Demain, je vais voyager. » → Il a annoncé que le lendemain, il allait voyager.'
          - text: 'Quand le verbe qui introduit est au passé (*il a dit*), le temps du verbe rapporté change (voir le tableau).'
            examples:
              - '« Je mange. » → Il a dit qu’il mangeait.'
              - '« Je partirai demain. » → Il a dit qu’il partirait le lendemain.'
              - '« J’ai fini mes devoirs. » → Il a dit qu’il avait fini ses devoirs.'
          - text: 'Les **pronoms et possessifs** changent aussi (*je → il / elle, notre → leur*).'
            examples:
              [
                '« Notre équipe gagne aujourd’hui. » → Ils ont dit que leur équipe gagnait ce jour-là.',
              ]
          - text: 'Les **expressions de temps et de lieu** changent : *aujourd’hui → ce jour-là, demain → le lendemain, hier → la veille, le mois prochain → le mois suivant, ici → là-bas, ce matin → ce matin-là*.'
            examples:
              [
                '« Aujourd’hui commencent les cours. » → Ils ont dit que ce jour-là, les cours commençaient.',
              ]
      - id: indirect-table
        type: table
        caption: Les temps au discours indirect (verbe introducteur au passé)
        header: [Discours direct, Discours indirect, Exemple]
        rows:
          - [présent, imparfait, '« Je mange. » → Il a dit qu’il mangeait.']
          - [
              futur simple,
              conditionnel présent,
              '« Je partirai demain. » → Il a dit qu’il partirait le lendemain.',
            ]
          - [
              futur proche (aller + infinitif),
              aller à l’imparfait + infinitif,
              '« Je vais voyager. » → Il a dit qu’il allait voyager.',
            ]
          - [
              passé composé,
              plus-que-parfait,
              '« J’ai fini mes devoirs. » → Il a dit qu’il avait fini ses devoirs.',
            ]
          - [
              imparfait,
              imparfait (ne change pas),
              '« Le trafic était dense. » → Il a dit que le trafic était dense.',
            ]
      - id: rules-temps
        type: ruleSummary
        skill: Les temps mélangés
        rules:
          - text: 'Pour parler de l’actualité, on combine plusieurs temps selon leur fonction.'
          - text: '**Passé composé :** faits récents et événements ponctuels.'
            examples: [J’ai lu une nouvelle importante., 'Hier, un accident est survenu.']
          - text: '**Imparfait :** contexte ou description dans le passé.'
            examples: [La circulation était dense.]
          - text: '**Présent :** ce qui se passe maintenant.'
            examples: [Le gouvernement annonce de nouvelles mesures.]
          - text: '**Futur simple :** prédictions.'
            examples: ['Demain, nous aurons plus d’informations.']
          - text: '**Conditionnel :** hypothèse ou conséquence. Avec *si* + imparfait, on utilise le conditionnel présent.'
            examples: [Les gens seraient plus tranquilles si on leur donnait plus de précisions.]
          - text: '**Connecteurs** pour donner une opinion et organiser l’information : *selon* (la source), *car* (la cause), *cependant* (l’opposition), *c’est pourquoi* (la conséquence), *de plus* (l’ajout).'
            examples:
              - Selon le ministère, les mesures commenceront le mois prochain.
              - Les villes sont contentes, car le trafic a beaucoup augmenté. Cependant, il faut encore améliorer la fréquence.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Révise les deux compétences. Demande à chaque élève de rapporter au discours indirect un titre de la semaine et d’ajouter une prédiction au futur.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: nouvelles-recentes-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie un message et envoie-le. Mori va te poser des questions ; réponds à toutes.
      - id: mori-indirect
        type: aiTutorPrompt
        title: 'Tâche 1 : Pratiquer le discours indirect'
        message: >-
          Salut Mori, je veux pratiquer comment rapporter ce que les gens disent. Peux-tu
          me poser des questions sur des nouvelles récentes et corriger mes erreurs ?
      - id: mori-nouvelle
        type: aiTutorPrompt
        title: 'Tâche 2 : Répéter une nouvelle au discours indirect'
        intro: 'Objectif : faire attention aux changements de temps, de pronoms et d’expressions de temps.'
        message: >-
          Mori, donne-moi une nouvelle courte et je la répéterai au discours indirect.
          Vérifie mes changements de temps, de pronoms et d’expressions temporelles.
      - id: mori-meteo
        type: aiTutorPrompt
        title: 'Tâche 3 : Prévisions météo (passé, présent, futur et conditionnel)'
        intro: 'Objectif : mélanger les temps : passé (*il a plu, il faisait*), présent (*il fait*), futur (*il fera*) et conditionnel (*il pourrait*).'
        message: >-
          Mori, pose-moi des questions pour que je décrive le temps de la semaine dernière,
          d’aujourd’hui et de demain, et ce qui pourrait arriver si la prévision était
          fausse. Corrige mes erreurs.
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          Tu veux plus de questions ? Envoie : **S’il te plaît, pose-moi encore des questions !**
          Tu ne comprends pas une explication ? Envoie : **Peux-tu m’expliquer en hébreu, mais avec la phrase en français ?**

