vocabulary:
  - slug: mindfulness-et-relaxation
    title: Mindfulness et relaxation
    items: *mindfulness-et-relaxation-words

activities:
  - slug: mindfulness-et-relaxation-temps
    title: 'Raconter avec différents temps : hier, aujourd’hui, demain'
    minutes: 8
    items:
      - id: hier-ressenti
        type: multipleChoice
        prompt: Hier, j’___ de l’anxiété avant une réunion.
        options:
          - { text: ai ressenti, correct: true }
          - {
              text: ressentirai,
              feedback: '*Ressentirai* est au futur. Avec *hier* et une émotion passée, on utilise le passé composé : *j’ai ressenti*.',
            }
          - {
              text: ressentirais,
              feedback: '*Ressentirais* est au conditionnel. Avec *hier*, on utilise le passé composé : *j’ai ressenti*.',
            }
      - id: concentre
        type: fillBlank
        prompt: Complète avec le verbe *se concentrer* au présent.
        text: Aujourd’hui, je me ___ sur ma respiration.
        blanks: [[concentre]]
      - id: partirai
        type: fillBlank
        prompt: Complète avec le verbe *partir* au futur simple.
        text: Demain, je ___ à la montagne.
        blanks: [[partirai]]
      - id: faisait-sombre
        type: multipleChoice
        prompt: Quand je suis arrivé(e) dans la forêt, il ___ sombre.
        options:
          - { text: faisait, correct: true }
          - {
              text: fera,
              feedback: '*Fera* est au futur. Pour une description au passé, on utilise l’imparfait : *il faisait sombre*.',
            }
          - {
              text: ferait,
              feedback: '*Ferait* est au conditionnel. Pour une description au passé, on utilise l’imparfait : *il faisait sombre*.',
            }
      - id: temps-usages
        type: matching
        prompt: Associe chaque temps à son usage.
        pairs:
          - [le passé composé, expériences et émotions passées]
          - [l’imparfait, description au passé]
          - [le présent, actions et états actuels]
          - [le futur simple, plans et intentions]
          - [le conditionnel, 'hypothèses, désirs, imagination']
      - id: futur-pas-conditionnel
        type: trueFalse
        prompt: 'La phrase *Demain, je marcherai dans la forêt.* est au conditionnel.'
        answer: false
        feedback:
          correct: 'Bravo ! *Je marcherai* est au futur simple (-ai). Au conditionnel, on dirait *je marcherais* (-ais).'
          incorrect: 'Attention : *je marcherai* (-ai) est au futur simple. Le conditionnel, c’est *je marcherais* (-ais).'
      - id: entendu
        type: fillBlank
        prompt: Complète avec le verbe *entendre* au passé composé.
        text: Hier, j’___ beaucoup de bruit.
        blanks: [[ai entendu]]
      - id: ordre-respire
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Aujourd’hui, je respire profondément.

  - slug: mindfulness-et-relaxation-conditionnel
    title: 'Le conditionnel : si + imparfait'
    minutes: 8
    items:
      - id: serais-tranquille
        type: multipleChoice
        prompt: Si je pouvais vivre à la plage, je ___ plus tranquille.
        options:
          - { text: serais, correct: true }
          - {
              text: serai,
              feedback: '*Serai* est au futur. Après *si* + imparfait (*pouvais*), on utilise le conditionnel : *je serais*.',
            }
          - {
              text: suis,
              feedback: '*Suis* est au présent. Après *si* + imparfait (*pouvais*), on utilise le conditionnel : *je serais*.',
            }
      - id: mediterais
        type: fillBlank
        prompt: Complète avec le verbe *méditer* au conditionnel.
        text: Si j’avais une semaine libre, je ___ tous les jours.
        blanks: [[méditerais]]
      - id: si-venais
        type: multipleChoice
        prompt: Si tu ___ à notre retraite, tu apprendrais à respirer.
        options:
          - { text: venais, correct: true }
          - {
              text: viendrais,
              feedback: 'Après *si*, on n’utilise jamais le conditionnel. On dit *si tu venais* (imparfait).',
            }
          - {
              text: viens,
              feedback: 'Avec *si* + présent, on utilise le futur (*tu apprendras*). Ici, il y a le conditionnel (*apprendrais*) : *si tu venais*.',
            }
      - id: irreguliers
        type: matching
        prompt: Associe chaque verbe à sa forme au conditionnel.
        pairs:
          - [être, je serais]
          - [avoir, j’aurais]
          - [faire, je ferais]
          - [pouvoir, je pourrais]
          - [aller, j’irais]
      - id: si-serais
        type: trueFalse
        prompt: 'On peut dire : *Si je serais riche, je voyagerais.*'
        answer: false
        feedback:
          correct: 'Bravo ! Après *si*, on utilise l’imparfait : *Si j’étais riche, je voyagerais.*'
          incorrect: 'Attention : après *si*, jamais de conditionnel. On dit : *Si j’étais riche, je voyagerais.*'
      - id: entendrais
        type: fillBlank
        prompt: Complète avec le verbe *entendre* au conditionnel.
        text: Si j’étais là, j’___ la mer.
        blanks: [[entendrais]]
      - id: passerait
        type: multipleChoice
        prompt: Que se ___-il si tu y allais avec un ami ?
        options:
          - { text: passerait, correct: true }
          - {
              text: passera,
              feedback: '*Passera* est au futur. Avec *si* + imparfait (*allais*), on utilise le conditionnel : *se passerait-il*.',
            }
          - {
              text: passait,
              feedback: '*Passait* est à l’imparfait. L’imparfait va après *si* ; dans l’autre partie, on met le conditionnel : *se passerait-il*.',
            }
      - id: ordre-verrais
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Si j’étais là, je verrais la mer.
