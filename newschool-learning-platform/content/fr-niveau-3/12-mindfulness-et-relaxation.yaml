# Cycle "Mindfulness et relaxation", converted from the French level 3 digital notebook
# ("Cahier digital 2026 - français niveau 3", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-3
slug: mindfulness-et-relaxation
title: Mindfulness et relaxation
goal: Raconter au passé, au présent et au futur, et imaginer des situations hypothétiques avec si + imparfait et le conditionnel.
position: 12
status: in_review

review:
  - >-
    The two workbook exercises ("Raconter avec différents temps" and "Le conditionnel :
    si + imparfait") are NEW: the notebook has no self-study exercises. They were
    written from the cycle's summary table, the activity models and the vocabulary.
    Please check level, wording and every right answer before students see them.
  - >-
    GRAMMAR FIX: the "Futur" examples used the present of vouloir ("Demain, je veux
    retourner à la plage", "Demain, je veux me déconnecter à la montagne", Mori "Demain…
    je veux marcher dans la forêt et sentir les arbres"). That is a present tense, not a
    future. They now use the futur simple: "Demain, je retournerai à la plage…",
    "Demain, je me déconnecterai à la montagne", "Demain, je marcherai dans la forêt et
    je sentirai l'odeur des arbres". If you prefer to keep the futur proche (je vais
    retourner…), say so.
  - >-
    Summary additions (not in the source, please confirm): how to form the futur simple
    (infinitive + -ai, -as, -a, -ons, -ez, -ont) and the conditionnel présent
    (infinitive + -ais, -ais, -ait, -ions, -iez, -aient), the shared irregular stems
    (ser-, aur-, fer-, pourr-, ir-, verr-), the hypothesis rule si + imparfait →
    conditionnel (never conditionnel after si) and si + présent → futur, and a
    conjugation table. The source has only the five-tense table, which is kept.
  - >-
    Corrections: Activity 1 model "j'ai ressenti de la sérénité dans mes muscles" → "j'ai
    senti mes muscles se détendre" (unnatural); Mori example "je respire profondément
    et sens le calme dans mes muscles" → "et je sens le calme dans tout mon corps"; "Hier…
    j'ai ressenti de la tension et entendu beaucoup de bruit" → "et j'ai entendu…";
    "dirais‑tu", "Mini‑réflexion" (non-breaking hyphens) → normal hyphens; "Que penses-tu
    du mindfulness" → "…du mindfulness (la pleine conscience)"; broken bold marks
    removed throughout.
  - >-
    The Mori homework in the source is a task list, not messages. Mori messages were
    written from its parts (intro round, practice questions, mini-journal, "Devine mon
    lieu de relaxation", advanced reflection questions). The advanced reflection
    questions repeat three warm-up questions; they are kept in one Mori message.
  - >-
    Activities 3 and 4 are very short in the source (no times except "Présentation en
    15 min" for Activity 4, no example for Activity 4). Activity 4 "coût" kept. A
    sentence frame in the conditionnel was added to both. Activity 1 needs four images
    chosen by the teacher (forêt, plage, montagne, ville tranquille); they are not in
    the notebook. Activity variants are in teacher notes.
  - >-
    Times given as ranges are recorded as the upper value (5–7 → 7, 2–3 → 3, 5–6 → 6,
    6–7 → 7). Activity 1 adds up to 27 minutes, Activity 5 to 27 minutes; the notebook
    gives no total time, so the plan note asks the teacher to choose.
  - >-
    Left out: the "Date / Participants" lines and the "Réponse de l'élève 1/2/3" lines
    (the platform has answer boxes). The Quizlet link is kept without its tracking
    parameters (?i=…&x=…).
  - >-
    Vocabulary: "Méditer – למדוט" → "לעשות מדיטציה"; "Esprit – מחשבה / תודעה" → "נפש /
    תודעה"; "Bien-être – רווחה" → "רווחה / הרגשה טובה"; "Odorat – ריח" → "חוש הריח";
    "Toucher – מגע" → "מגע / חוש המישוש"; "Vue – ראייה" → "ראייה / מראה"; "Ouïe –
    שמיעה" → "חוש השמיעה"; "Conditionnel – תנאי" → "משפט / דרך התנאי". Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: mindfulness-et-relaxation-classe
    title: 'Classe : Mindfulness et relaxation'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Mindfulness et relaxation
      - id: skills
        type: cycleOverview
        skills:
          - name: Raconter avec différents temps
            description: 'Passé, présent et futur (*Hier, j’ai ressenti… Aujourd’hui, je respire… Demain, je partirai…*)'
          - name: 'Le conditionnel : situations hypothétiques'
            description: '*Si je pouvais vivre à la plage, je serais plus tranquille.*'
      - id: quizlet
        type: externalLink
        label: Mindfulness et relaxation sur Quizlet
        url: https://quizlet.com/il/1144025243/extreme-french-2026-mindfulness-et-relaxation-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. Si je pouvais être maintenant dans un endroit relaxant, je serais ___.
        example: Je m’appelle Lévanah. Si je pouvais être maintenant dans un endroit relaxant, je serais à la plage.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup
        type: discussionQuestions
        items:
          - question: Que fais-tu quand tu as besoin de te relaxer ?
            frame: Quand j’ai besoin de me relaxer, je…
          - question: Te sens-tu plus calme en ville ou à la campagne ? Pourquoi ?
            frame: Je me sens plus calme… parce que…
          - question: Préfères-tu te relaxer seul(e) ou accompagné(e) ? Quels sont les avantages de chacune de ces options ?
            frame: Je préfère… L’avantage, c’est que…
          - question: Quel rôle jouent les réseaux sociaux dans ton niveau de stress ? Aident-ils à se calmer ou aggravent-ils la situation ?
            frame: À mon avis, les réseaux sociaux…
          - question: Que penses-tu du mindfulness (la pleine conscience) comme pratique ? Est-ce une mode ou peut-il vraiment changer la vie ?
            frame: Je pense que le mindfulness…
          - question: Quelle importance ont les habitudes (sommeil, alimentation, exercice) dans ton bien-être émotionnel ?
            frame: Pour mon bien-être, le / la… est très important(e) parce que…
          - question: Si tu devais recommander une pratique de relaxation à un ami très stressé, que lui dirais-tu et pourquoi ?
            frame: Je lui dirais de… parce que…
          - question: Si les entreprises proposaient des ateliers de mindfulness au travail, quels effets positifs ou négatifs pourraient-ils avoir ?
            frame: Les employés seraient… / Ils pourraient…
          - question: Si tu pouvais inventer une machine pour réduire le stress, comment fonctionnerait-elle et qui l’utiliserait ?
            frame: Ma machine… Les gens qui l’utiliseraient seraient…
          - question: Que ferais-tu si tu avais un mois libre, sans travail ni obligations, pour te consacrer à ton bien-être ?
            frame: Si j’avais un mois libre, je…
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Histoires sensorielles en quatre temps'
        skills: [Raconter avec différents temps, 'Le conditionnel : situations hypothétiques']
        minutes: 27
        steps:
          - '**Images (3 minutes) :** le professeur montre 4 images (forêt, plage, montagne, ville tranquille). Laquelle transmet le plus de calme ? Laquelle transmet le plus d’énergie ? Réponds en un mot.'
          - '**Modèle guidé (2 minutes) :** écoute l’exemple du professeur pour une image (voir ci-dessous).'
          - '**Travail individuel (5 minutes) :** choisis une image et écris 4 phrases, une par temps : passé, présent, futur, conditionnel. Utilise au moins 2 mots du vocabulaire (*sérénité, énergie, méditer, respirer, forêt…*).'
          - '**En binômes (7 minutes) :** l’élève A lit ses quatre phrases. L’élève B pose une question au conditionnel (*Que se passerait-il si tu y allais avec un ami ?*). Puis on inverse les rôles.'
          - '**En groupe (7 minutes) :** chaque binôme choisit sa phrase préférée et la partage. Le professeur note les phrases au tableau en quatre colonnes : passé, présent, futur, conditionnel.'
          - '**Mini-réflexion (3 minutes) :** quel temps a été le plus facile ? le plus difficile ? Quels nouveaux mots tes camarades ont-ils utilisés ?'
        example: |-
          *Passé : L’été dernier, j’étais à la plage et j’ai senti mes muscles se détendre.*
          *Présent : Aujourd’hui, quand je pense à cet endroit, je me concentre sur ma respiration et je sens le calme.*
          *Futur : Demain, je retournerai à la plage pour me déconnecter du stress.*
          *Conditionnel : Si je pouvais y vivre, je relâcherais toute la tension chaque jour.*
      - id: act1-sentences
        type: discussionQuestions
        title: Mon histoire en quatre temps
        items:
          - question: Passé
            frame: L’été dernier / Hier, j’étais… et j’ai…
          - question: Présent
            frame: Aujourd’hui, quand je pense à cet endroit, je…
          - question: Futur
            frame: Demain, je…
          - question: Conditionnel
            frame: Si je pouvais…, je…
      - id: act2
        type: classActivity
        title: 'Activité 2 : Devine où je veux me relaxer'
        skills: ['Le conditionnel : situations hypothétiques']
        steps:
          - Décris ce que tu ressens dans ton lieu idéal de relaxation, avec les phrases ci-dessous. Ne dis pas le nom du lieu !
          - Les autres élèves doivent deviner le lieu.
          - Le gagnant est celui qui fait deviner son lieu le plus vite.
        example: '*Si j’étais là, je verrais des arbres très hauts, j’entendrais les oiseaux et je sentirais l’odeur de la terre.* → *C’est une forêt !*'
      - id: act2-sentences
        type: discussionQuestions
        title: Mon lieu idéal
        items:
          - question: Si j’étais là, je verrais ___.
          - question: Si j’étais là, j’entendrais ___.
          - question: Si j’étais là, je sentirais ___.
          - question: Si j’étais là, je mangerais ___.
          - question: Si j’étais là, je ressentirais ___.
          - question: Si j’étais là, je serais avec ___, et je lui dirais ___.
      - id: act3
        type: classActivity
        title: 'Activité 3 : Crée ta retraite de relaxation'
        skills: ['Le conditionnel : situations hypothétiques']
        steps:
          - 'Par petits groupes, créez une retraite idéale : lieu, activités, public cible, prix, bénéfices.'
          - Présentez votre retraite à la classe en 3 ou 4 phrases persuasives au conditionnel.
          - Votez pour la retraite la plus attractive.
        example: '*Si tu venais à notre retraite, tu apprendrais à respirer profondément. Tu dormirais face à la mer et tu te déconnecterais du stress.*'
      - id: act3-sentences
        type: discussionQuestions
        title: Notre retraite
        items:
          - question: Où serait votre retraite ? Combien coûterait-elle ?
            frame: Notre retraite serait à… Elle coûterait…
          - question: Qu’est-ce qu’on y ferait ? Pour qui ?
            frame: On y ferait… / Elle serait idéale pour…
          - question: Pourquoi est-ce que quelqu’un viendrait ?
            frame: Si tu venais à notre retraite, tu apprendrais à…
      - id: act4
        type: classActivity
        title: 'Activité 4 : Décris ton atelier de mindfulness parfait'
        skills: ['Le conditionnel : situations hypothétiques']
        minutes: 15
        steps:
          - 'Conçois un atelier de mindfulness : le lieu, le public cible, le coût et l’activité principale.'
          - Présente ton atelier à la classe.
          - Votez pour le meilleur atelier.
      - id: act4-sentences
        type: discussionQuestions
        title: Mon atelier
        items:
          - question: Lieu
            frame: Mon atelier aurait lieu…
          - question: Public cible
            frame: Il serait pour…
          - question: Coût
            frame: Il coûterait…
          - question: Activité principale
            frame: Les participants…
      - id: act5
        type: classActivity
        title: 'Activité 5 : Mini-journal de mindfulness en quatre temps'
        skills: [Raconter avec différents temps, 'Le conditionnel : situations hypothétiques']
        minutes: 27
        steps:
          - '**Introduction (3 minutes) :** quatre rubriques : *Hier…* (passé), *Aujourd’hui…* (présent), *Demain…* (futur), *Si je pouvais…* (conditionnel).'
          - '**Écriture individuelle (6 minutes) :** écris un mini-journal de 8 à 10 phrases, au moins 2 par temps, avec un détail sensoriel.'
          - '**En groupes de 3 (7 minutes) :** partagez vos journaux. Notez les émotions, les lieux et les actions. Quelle est l’émotion dominante dans le groupe ?'
          - '**Création collective (6 minutes) :** chaque groupe écrit 4 phrases (passé, présent, futur, conditionnel).'
          - '**Questions de suivi (3 minutes) :** posez des questions avec une hypothèse : *Que se passerait-il si… ?*'
          - '**Clôture (2 minutes) :** quel temps avez-vous le plus utilisé ? Quel mot revient le plus ? Quelle partie était la plus difficile ?'
        example: |-
          *Hier, j’ai ressenti de l’anxiété avant une réunion.*
          *Aujourd’hui, je me concentre sur ma respiration pour relâcher la tension.*
          *Demain, je me déconnecterai à la montagne.*
          *Si je pouvais méditer tous les jours, je serais plus serein(e).*
      - id: act5-sentences
        type: discussionQuestions
        title: Mon mini-journal
        items:
          - question: Hier… (passé)
            frame: Hier, j’ai… / Il faisait…
          - question: Aujourd’hui… (présent)
            frame: Aujourd’hui, je…
          - question: Demain… (futur)
            frame: Demain, je…
          - question: Si je pouvais… (conditionnel)
            frame: Si je pouvais…, je…
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Deux compétences : **raconter avec différents temps** (activités 1 et 5) et
          **le conditionnel dans des situations hypothétiques** (échauffement, activités
          1 à 5). Les activités 1 et 5 durent chacune environ 27 minutes ; le cahier ne
          donne pas de durée totale : choisis les activités selon le temps.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: >-
          Deux phrases par élève, 30 secondes maximum par élève et pour toi. Si les élèves
          se connaissent déjà, passe directement aux questions d’échauffement.
      - id: n-warmup
        anchor: warmup
        text: >-
          Pose au moins deux questions à chaque élève. Les quatre dernières questions
          pratiquent le conditionnel : vérifie *si + imparfait → conditionnel*.
      - id: n-act1
        anchor: act1
        minutes: 27
        text: >-
          Prépare quatre images contrastantes avant le cours (forêt, plage, montagne,
          ville tranquille). Variantes : voter pour l’histoire la plus relaxante, la plus
          drôle ou la plus convaincante ; mélanger les phrases d’un binôme pour créer une
          mini-histoire ; refaire l’exercice avec un seul sens (vue, ouïe, odorat,
          toucher, goût).
      - id: n-act2
        anchor: act2
        text: Vérifie le conditionnel (*je verrais, j’entendrais, je sentirais*) et l’imparfait après *si*.
      - id: n-act3
        anchor: act3
        text: Le cahier ne donne pas de durée pour cette activité. Vérifie *si + imparfait* et le conditionnel dans les présentations.
      - id: n-act4
        anchor: act4
        minutes: 15
        text: Le cahier indique 15 minutes pour les présentations, puis un vote.
      - id: n-act5
        anchor: act5
        minutes: 27
        text: Pendant le travail en groupe, note les erreurs de temps et corrige-les à la clôture.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: mindfulness-et-relaxation-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: tenses-table
        type: table
        caption: Les temps du récit
        header: [Temps, Usage, Exemple]
        rows:
          - [
              Passé composé,
              Expériences et émotions passées,
              'Hier, j’ai ressenti de l’anxiété avant une réunion.',
            ]
          - [Imparfait, Description au passé, Il faisait sombre.]
          - [Présent, Actions et états actuels, 'Aujourd’hui, je me concentre sur ma respiration.']
          - [Futur simple, Plans et intentions, 'Demain, je partirai à la montagne.']
          - [
              Conditionnel,
              'Hypothèses, désirs, imagination',
              'Si je pouvais vivre à la plage, je serais plus tranquille.',
            ]
      - id: rules-temps
        type: ruleSummary
        skill: Raconter avec différents temps
        rules:
          - text: 'Pour raconter, on combine les temps avec des **marqueurs** : *hier, l’été dernier* (passé) ; *aujourd’hui, maintenant* (présent) ; *demain, la semaine prochaine* (futur).'
            examples:
              - Hier, j’ai ressenti de la tension et j’ai entendu beaucoup de bruit.
              - Aujourd’hui, je respire profondément et je sens le calme dans tout mon corps.
              - Demain, je marcherai dans la forêt et je sentirai l’odeur des arbres.
          - text: '**Futur simple :** infinitif + **-ai, -as, -a, -ons, -ez, -ont** (les verbes en *-re* perdent le *-e* : *prendre* → *je prendrai*).'
            examples: [je respirerai, tu partiras, nous nous reposerons]
      - id: rules-conditionnel
        type: ruleSummary
        skill: 'Le conditionnel : situations hypothétiques'
        rules:
          - text: '**Conditionnel présent :** infinitif + terminaisons de l’imparfait **-ais, -ais, -ait, -ions, -iez, -aient**.'
            examples: [je méditerais, tu partirais, nous nous reposerions]
          - text: 'Les verbes irréguliers ont le **même radical** au futur et au conditionnel.'
            examples:
              [
                être → je serais,
                avoir → j’aurais,
                faire → je ferais,
                pouvoir → je pourrais,
                aller → j’irais,
                voir → je verrais,
              ]
          - text: '**Hypothèse :** *si* + **imparfait** → **conditionnel**. Après *si*, jamais de conditionnel.'
            examples:
              - Si je pouvais méditer tous les jours, j’aurais plus de sérénité.
              - Si tu venais à notre retraite, tu apprendrais à respirer.
              - Que se passerait-il si tu y allais avec un ami ?
          - text: 'Pour une situation possible ou probable : *si* + **présent** → **futur**.'
            examples: ['Si j’ai du temps demain, je méditerai.']
      - id: futur-cond-table
        type: table
        caption: Futur simple et conditionnel présent
        header:
          [Personne, respirer (futur), respirer (conditionnel), être (futur), être (conditionnel)]
        rows:
          - [je / j’, respirerai, respirerais, serai, serais]
          - [tu, respireras, respirerais, seras, serais]
          - [il / elle, respirera, respirerait, sera, serait]
          - [nous, respirerons, respirerions, serons, serions]
          - [vous, respirerez, respireriez, serez, seriez]
          - [ils / elles, respireront, respireraient, seront, seraient]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Demande à chaque élève une phrase par temps sur sa façon de se relaxer, puis une hypothèse avec *si*.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: mindfulness-et-relaxation-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie un message et envoie-le. Mori va te poser des questions ; réponds à toutes.
      - id: mori-intro
        type: aiTutorPrompt
        title: 'Message 1 : Ronde d’introduction'
        intro: 'Exemple : *Je suis Dana. Si je pouvais être dans un lieu relaxant, je serais à la montagne.*'
        message: Bonjour Mori, je vais me présenter en deux phrases, une au présent (« Je suis… ») et une au conditionnel (« Si je pouvais être dans un lieu relaxant, je serais à… »). Corrige mes phrases.
      - id: mori-questions
        type: aiTutorPrompt
        title: 'Message 2 : Questions pratiques'
        message: |-
          Bonjour Mori, pose-moi ces 4 questions, une par une. Je vais répondre en 2 ou 3 phrases à chaque question. Corrige les temps après chaque réponse.
          Que fais-tu normalement pour te relaxer ? (présent)
          Quel lieu t’a apporté du calme dans le passé ? (passé)
          Que feras-tu demain pour plus de tranquillité ? (futur)
          Si tu avais une semaine libre, que ferais-tu pour te relaxer ? (conditionnel)
      - id: mori-journal
        type: aiTutorPrompt
        title: 'Message 3 : Mini-journal de mindfulness'
        intro: 'Ensuite, écris ton journal. Exemple : *Hier, j’ai ressenti de la tension et j’ai entendu beaucoup de bruit. Aujourd’hui, je respire profondément et je sens le calme dans tout mon corps. Demain, je marcherai dans la forêt et je sentirai l’odeur des arbres. Si je pouvais méditer tous les jours, j’aurais plus de sérénité.*'
        message: Bonjour Mori, je vais écrire un mini-journal de mindfulness de 8 à 10 phrases, avec au moins 2 phrases au passé, 2 au présent, 2 au futur et 2 au conditionnel, et un détail sensoriel. Corrige mes phrases et pose-moi une question sur mon journal.
      - id: mori-devine
        type: aiTutorPrompt
        title: 'Message 4 : Devine mon lieu de relaxation'
        intro: 'Utilise les cinq sens : *Si j’étais là, je verrais… j’entendrais… je sentirais… je goûterais… je ressentirais…*'
        message: Bonjour Mori, on joue à « Devine mon lieu de relaxation ». Je vais décrire mon lieu idéal avec des phrases au conditionnel (voir, entendre, sentir, goûter, ressentir), sans dire son nom. Essaie de deviner le lieu, puis corrige mes phrases.
      - id: mori-reflexion
        type: aiTutorPrompt
        title: 'Message 5 : Réflexion avancée'
        message: |-
          Bonjour Mori, je veux donner mon opinion sur ces questions. Pose-les-moi une par une, corrige mes réponses et pose-moi une question de suivi.
          Quel rôle jouent les réseaux sociaux dans ton stress ?
          Que penses-tu du mindfulness ? Est-ce une mode ou une vraie transformation ?
          Quelle importance ont les habitudes (sommeil, alimentation, exercice) pour ton bien-être ?
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          Tu veux plus de questions ? Envoie : **S’il te plaît, pose-moi encore des questions !**
          Tu ne comprends pas une explication ? Envoie : **Peux-tu m’expliquer en hébreu, mais avec la phrase en français ?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: mindfulness-et-relaxation-pratique
    book: workbook
    title: 'Pratique : Mindfulness et relaxation'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Pratique les deux compétences du cycle. Chaque réponse est corrigée tout de suite, et tu peux réessayer.
      - id: ex-temps
        type: activity
        activity: mindfulness-et-relaxation-temps
      - id: ex-conditionnel
        type: activity
        activity: mindfulness-et-relaxation-conditionnel

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: mindfulness-et-relaxation-vocabulaire
    title: Vocabulaire
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Les mots du bien-être
        glossLang: he
        link: https://quizlet.com/il/1144025243/extreme-french-2026-mindfulness-et-relaxation-flash-cards/
        items: &mindfulness-et-relaxation-words
          - { term: Sérénité, gloss: שלווה }
          - { term: Calme, gloss: רוגע }
          - { term: Anxiété, gloss: חרדה }
          - { term: Tension, gloss: מתח }
          - { term: Énergie, gloss: אנרגיה }
          - { term: Concentration, gloss: ריכוז }
