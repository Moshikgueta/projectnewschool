activities:
  - slug: intelligence-artificielle-futur
    title: 'Le futur simple : actions et prédictions'
    minutes: 8
    items:
      - id: remplacera
        type: multipleChoice
        prompt: Dans 10 ans, l’IA ___ certains emplois.
        options:
          - { text: remplacera, correct: true }
          - {
              text: remplacerait,
              feedback: '*Remplacerait* est au conditionnel (une hypothèse). Pour une prédiction, on utilise le futur simple : *remplacera*.',
            }
          - {
              text: remplaçait,
              feedback: '*Remplaçait* est à l’imparfait (passé). Avec *dans 10 ans*, on utilise le futur : *remplacera*.',
            }
      - id: sera
        type: fillBlank
        prompt: Complète avec le verbe *être* au futur simple.
        text: L’apprentissage du français avec l’IA ___ plus facile.
        blanks: [[sera]]
      - id: irreguliers
        type: matching
        prompt: Associe chaque verbe à sa forme au futur simple (je).
        pairs:
          - [être, je serai]
          - [avoir, j’aurai]
          - [aller, j’irai]
          - [faire, je ferai]
          - [pouvoir, je pourrai]
      - id: terminaison-nous
        type: multipleChoice
        prompt: Dans le futur, nous ___ avec des robots. (vivre)
        options:
          - { text: vivrons, correct: true }
          - {
              text: vivrions,
              feedback: '*-ions* est la terminaison du conditionnel. Au futur simple, *nous* prend *-ons* : *vivrons*.',
            }
          - {
              text: vivreons,
              feedback: 'Les verbes en *-re* perdent le *e* final : *vivre* → *vivr-* → *nous vivrons*.',
            }
      - id: cours
        type: fillBlank
        prompt: Complète avec les verbes *être* et *avoir* au futur simple.
        text: Les cours ___ plus personnalisés et les élèves ___ plus de temps libre.
        blanks: [[seront], [auront]]
      - id: futur-proche
        type: trueFalse
        prompt: '*L’IA va changer le monde* est une phrase correcte au futur proche (*aller* + infinitif).'
        answer: true
        feedback:
          correct: 'Bravo ! Le futur proche se forme avec *aller* au présent + infinitif. Au futur simple, on dit : *L’IA changera le monde.*'
          incorrect: 'La phrase est correcte : le futur proche se forme avec *aller* au présent + infinitif (*va changer*).'
      - id: verrons
        type: fillBlank
        prompt: Complète avec le verbe *voir* (nous) au futur simple.
        text: Dans 10 ans, nous ___ des robots dans toutes les écoles.
        blanks: [[verrons]]
      - id: ordre-ia
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: L’IA sera plus rapide que les professeurs.

  - slug: intelligence-artificielle-conditionnel
    title: 'Le conditionnel présent : situations possibles et hypothèses'
    minutes: 8
    items:
      - id: perdraient
        type: multipleChoice
        prompt: Si l’IA enseignait seule, les apprenants ___ leur motivation.
        options:
          - { text: perdraient, correct: true }
          - {
              text: perdront,
              feedback: 'Après *si* + imparfait (*enseignait*), on utilise le conditionnel présent : *perdraient*.',
            }
          - {
              text: perdaient,
              feedback: '*Perdaient* est à l’imparfait. Dans l’autre partie de la phrase, on met le conditionnel : *perdraient*.',
            }
      - id: avait
        type: multipleChoice
        prompt: S’il y ___ une dystopie, je serais le meilleur médecin.
        options:
          - { text: avait, correct: true }
          - {
              text: aurait,
              feedback: 'Après *si*, on n’utilise jamais le conditionnel. On dit : *s’il y avait* (imparfait).',
            }
          - {
              text: aura,
              feedback: 'Après *si*, on n’utilise jamais le futur. Pour une hypothèse : *s’il y avait* (imparfait).',
            }
      - id: aurais
        type: fillBlank
        prompt: Complète avec le verbe *avoir* au conditionnel présent.
        text: J’___ plus de temps libre si les robots faisaient tout le travail.
        blanks: [[aurais]]
      - id: formation
        type: trueFalse
        prompt: 'Le conditionnel présent se forme avec le radical du futur + les terminaisons de l’imparfait (*-ais, -ait, -ions…*).'
        answer: true
        feedback:
          correct: 'Bravo ! *je serai* (futur) → *je serais* (conditionnel).'
          incorrect: 'C’est vrai : radical du futur + terminaisons de l’imparfait. *je pourrai* → *je pourrais*.'
      - id: futur-conditionnel
        type: matching
        prompt: Associe chaque forme du futur à la forme du conditionnel.
        pairs:
          - [je serai, je serais]
          - [tu auras, tu aurais]
          - [elle pourra, elle pourrait]
          - [nous ferons, nous ferions]
          - [ils changeront, ils changeraient]
      - id: si-etais
        type: fillBlank
        prompt: Complète avec *être* à l’imparfait et *pouvoir* au conditionnel présent.
        text: Si j’___ médecin, je ___ aider les autres à survivre.
        blanks: [[étais], [pourrais]]
      - id: hypothese
        type: multipleChoice
        prompt: Quelle phrase parle de quelque chose d’imaginaire ?
        options:
          - { text: La vie serait plus ennuyeuse si nous n’avions pas l’IA., correct: true }
          - {
              text: L’IA créera de nouvelles professions.,
              feedback: 'Cette phrase est au futur : on pense que ça va vraiment se passer. L’hypothèse est au conditionnel : *serait*.',
            }
          - {
              text: L’IA va changer le monde.,
              feedback: 'Cette phrase est au futur proche : c’est une prédiction. L’hypothèse est au conditionnel : *serait*.',
            }
      - id: ordre-medecin
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Je serais le meilleur médecin du groupe.
