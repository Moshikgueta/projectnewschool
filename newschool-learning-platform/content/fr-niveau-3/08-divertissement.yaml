# Cycle "Divertissement", converted from the French level 3 digital notebook
# ("Cahier digital 2026 - français niveau 3", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-3
slug: divertissement
title: Divertissement
goal: Parler de ses expériences culturelles au passé composé et donner une opinion argumentée avec des connecteurs logiques.
position: 8
status: published

review:
  - >-
    The two workbook exercises ("Le passé composé" and "Une opinion argumentée") are NEW:
    the notebook has no self-study exercises. They were written from the cycle's summary
    rules, the activity examples and the vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Rules carried over from the English/Spanish notebooks (rewritten, please confirm):
    the summary said the passé composé is used for "une expérience vécue, un événement
    récent, un changement qui a eu un impact" (the uses of the English present perfect).
    In French the passé composé is ALSO the normal tense for any finished event at a
    precise time (Hier, j’ai vu un film); a rule was added. "depuis" was listed as a
    passé composé marker: for an action that continues now, French uses the PRESENT
    with depuis (Je regarde cette série depuis 2020); a rule was added and "depuis" was
    removed from the markers. The être verbs with agreement (le film est sorti, elle est
    allée) and the participles découvert, reçu, eu, été were added.
  - >-
    Spanish leftovers in the summary examples: "J’ai vu La Casa de Papel trois fois",
    "Tu as déjà assisté à un concert de Rosalía ?", "Shakira a collaboré avec de
    nombreux artistes" → "J’ai vu Intouchables trois fois", "…un concert de Stromae ?",
    "Stromae a collaboré avec de nombreux artistes" (references from this cycle's own
    lists).
  - >-
    English words: Activity 3 "le divertissement « cheap »" → "le divertissement « bas
    de gamme »" (also in its guide question); "contenus TikTok ou YouTube centrés sur le
    drama" → "…centrés sur les conflits et les polémiques"; podcast question "Une de tes
    œuvres a-t-elle été nominée…" → "nommée" (nominé is an anglicism for awards). "mainstream
    / indie" in the warm-up are kept in brackets after the French words, as in the
    source.
  - >-
    Facts about a real person: the Stromae model answer said he collaborated with
    "Angèle, Orelsan, Christine and the Queens et Damso" and the podcast model said he
    "a reçu plusieurs prix internationaux récemment". I could not check all of these; the
    answer now names only Orelsan (La Pluie, 2013) and the podcast model says
    "plusieurs prix". The models are marked "comme si tu étais Stromae". Please check.
  - >-
    Reported speech in the podcast model: "Il m’a expliqué qu’il a travaillé… et qu’il a
    reçu…", "Il a aussi dit que ses expériences… l’ont beaucoup inspiré" → plus-que-parfait
    (qu’il avait travaillé, qu’il avait reçu, l’avaient inspiré), the written norm after
    a past reporting verb (the passé composé is heard in speech). "Je l’ai choisi parce
    qu’il a été l’un des artistes francophones les plus influents dans le monde entier"
    → "parce que c’est l’un des artistes francophones les plus influents au monde".
  - >-
    Other fixes: intro model "…le film / la série ___ ; assister au spectacle / au concert
    de ___" → "…ou assister au spectacle / au concert de ___."; debate topic "Les gens
    ont davantage utilisé leur téléphone…" → "Ces dernières années, les gens ont
    davantage utilisé…"; Mori "Bonjour Mori \!" escapes removed; the summary items
    wrapped in broken "*\*…\*\*" marks were cleaned up. "Formule recommandée pour
    répondre à l’oral" is kept as a summary rule.
  - >-
    Activity 1 (Note-le !) has only a list and criteria in the source; steps were written
    (choose 6, rate with a criterion, justify with passé composé + opinion + connector).
    Activities 2–4 got sentence frames; the warm-up got frames. The source gives times
    only for the debate (5 + 7 + 8 minutes); the intro is 5 minutes.
  - >-
    Left out: the "Niveau 3 : français extrême" line, the "Date / Participants" lines and
    all "Réponse de l’élève 1/2/3" lines. No gamma.app link was found in this cycle.
  - >-
    Vocabulary: "provocateur – מעורר מחשבה / פרובוקטיבי" → "פרובוקטיבי / מתגרה" (מעורר
    מחשבה means thought-provoking, "qui fait réfléchir"); "sortie / première – בכורה" →
    "יציאה (לאקרנים) / בכורה"; "monter / éditer – לערוך" → "monter (un film) – לערוך
    (וידאו)" (éditer means to publish in French). Please confirm. The Quizlet link's
    tracking parameters (?i=…&x=…) were removed.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: divertissement-classe
    title: 'Classe : Divertissement'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Divertissement
      - id: skills
        type: cycleOverview
        skills:
          - name: Le passé composé
            description: 'Expériences, événements récents et changements : *j’ai vu, tu as découvert, elle a gagné, le film est sorti*'
          - name: Une opinion argumentée
            description: '*Je pense que…, à mon avis…* + *parce que, donc, cependant, c’est pourquoi* + adjectifs'
      - id: quizlet
        type: externalLink
        label: Divertissement sur Quizlet
        url: https://quizlet.com/il/1144012311/extreme-french-2026-divertissement-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. Je pense que tout le monde devrait voir le film / la série ___ ou assister au spectacle / au concert de ___.
        example: Je m’appelle Lévanah. Je pense que tout le monde devrait voir le film *Forrest Gump*.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup-hint
        type: callout
        tone: info
        text: Réponds avec des **phrases complètes**, utilise le **passé composé** et justifie ton opinion.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Qu’est-ce que le divertissement représente pour toi ?
            frame: Pour moi, le divertissement, c’est ___.
          - question: Quelle série, quel podcast, quel musicien ou quel créateur as-tu découvert récemment et pourquoi cela t’a intéressé(e) ?
            frame: Récemment, j’ai découvert ___. Ça m’a intéressé(e) parce que ___.
          - question: 'Quelle forme de divertissement as-tu le plus consommée cette année : télévision, réseaux sociaux, podcasts ou événements en direct ? Pourquoi ?'
            frame: Cette année, j’ai surtout ___ parce que ___.
          - question: As-tu déjà quitté un événement culturel parce que tu t’es ennuyé(e) ? Que s’est-il passé ?
            frame: Oui, une fois, j’ai quitté ___ parce que ___. / Non, je n’ai jamais quitté ___.
          - question: Quel concert ou spectacle en direct as-tu le plus apprécié ces dernières années ? Qu’est-ce qui l’a rendu spécial ?
            frame: J’ai beaucoup apprécié ___. Ce qui l’a rendu spécial, c’est ___.
          - question: Quel film, quelle série ou quel artiste as-tu regardé ou écouté plusieurs fois ? Pourquoi cela en valait-il la peine ?
            frame: J’ai regardé / écouté ___ plusieurs fois parce que ___.
          - question: 'Décris ton style de divertissement : préfères-tu le grand public (mainstream) ou l’indépendant (indie) ?'
            frame: Je préfère ___ parce que ___.
          - question: Y a-t-il un type de divertissement que tu trouves sous-estimé ? Pourquoi ?
            frame: À mon avis, ___ est sous-estimé parce que ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Note-le !'
        skills: [Une opinion argumentée, Le passé composé]
        steps:
          - 'Regarde la liste de références (culture francophone et internationale). Choisis-en **6** à noter.'
          - 'Note chacune avec un critère : *surévalué, innovant, inoubliable, qui fait réfléchir, plein de sens* ou un critère libre.'
          - 'Justifie ton opinion : commence au **passé composé** (*J’ai regardé…, J’ai écouté…*), donne ton opinion (*Je pense que…*) et explique avec un connecteur (*parce que, mais, donc*).'
          - Compare tes notes avec celles de tes camarades. Êtes-vous d’accord ?
        example: '*J’ai regardé Titanic plusieurs fois et je l’ai trouvé inoubliable, mais aussi un peu trop dramatique.*'
        wordBank:
          - Intouchables
          - Le Fabuleux Destin d’Amélie Poulain
          - Astérix et Obélix
          - La Haine
          - Les Choristes
          - Édith Piaf
          - Stromae
          - Daft Punk
          - Céline Dion
          - Mylène Farmer
          - Orelsan
          - Les Misérables
          - Le Petit Prince
          - Lupin (série Netflix)
          - Beyoncé
          - Titanic
          - Le Roi Lion
          - Forrest Gump
          - Game of Thrones
          - The Office
      - id: act1-ratings
        type: discussionQuestions
        title: Mes 6 notes
        items:
          - question: Note 1
            frame: J’ai regardé / écouté ___ et je pense que c’est ___ parce que ___.
          - question: Note 2
            frame: J’ai regardé / écouté ___ et je pense que c’est ___ parce que ___.
          - question: Note 3
            frame: J’ai regardé / écouté ___ et je pense que c’est ___ parce que ___.
          - question: Note 4
            frame: J’ai regardé / écouté ___ et je pense que c’est ___ parce que ___.
          - question: Note 5
            frame: J’ai regardé / écouté ___ et je pense que c’est ___ parce que ___.
          - question: Note 6
            frame: J’ai regardé / écouté ___ et je pense que c’est ___ parce que ___.
      - id: act2
        type: classActivity
        title: 'Activité 2 : Interview de podcast'
        skills: [Le passé composé]
        steps:
          - 'Tu crées une mini-interview professionnelle pour un podcast : des questions au **passé composé** sur la carrière, les collaborations, les récompenses, les difficultés et l’inspiration. Tu réponds aussi en jouant un rôle.'
          - '**Étape 1 :** choisis une personnalité du divertissement, francophone (Stromae, Céline Dion, Marion Cotillard, Jean Dujardin, Omar Sy, Juliette Binoche, Angèle, Daft Punk, Zaz, Édith Piaf) ou internationale (Beyoncé, Zendaya, Billie Eilish, Taylor Swift, Christopher Nolan, Timothée Chalamet). Écris : *J’ai choisi ___ parce que ___.*'
          - '**Étape 2 :** écris **5 questions au passé composé** sur la carrière, les collaborations, les récompenses, les défis et la vie personnelle ou l’inspiration (idées ci-dessous).'
          - '**Étape 3 :** deviens la célébrité et réponds à **2 questions** au passé composé.'
          - '**Étape 4 :** présente ton invité(e) à un(e) camarade, comme dans un vrai podcast.'
        example: |-
          **Question :** *Avec quels artistes as-tu collaboré au cours de ta carrière ?*
          **Réponse (comme si tu étais Stromae) :** *J’ai collaboré avec beaucoup d’artistes incroyables, comme Orelsan. Ces collaborations m’ont permis d’explorer différents styles et de toucher un public plus large.*
      - id: act2-ideas
        type: examples
        title: Idées de questions
        items:
          - text: Quels projets importants **as-tu réalisés** ces dernières années ? Avec quels producteurs ou réalisateurs **as-tu travaillé** récemment ? Quel rôle ou quelle œuvre **a marqué** ta carrière ?
            gloss: Carrière
          - text: Avec quels artistes **as-tu collaboré** jusqu’à présent ? Quelle collaboration **t’a** le plus **surpris(e)** ?
            gloss: Collaborations
          - text: Quelles récompenses importantes **as-tu reçues** dans ta carrière ? Une de tes œuvres **a-t-elle été nommée** cette année ?
            gloss: Récompenses
          - text: Quels défis personnels ou professionnels **as-tu affrontés** ? Comment **as-tu surmonté** les moments difficiles ?
            gloss: Défis
          - text: Quelles nouvelles habitudes **as-tu adoptées** pour progresser ? Quels lieux **as-tu visités** qui t’ont inspiré(e) ?
            gloss: Vie personnelle / inspiration
      - id: act2-questions
        type: discussionQuestions
        title: Mes 5 questions
        items:
          - question: 'Question 1 (modèle : Quels projets importants as-tu lancés récemment ?)'
            frame: Quels ___ as-tu ___ ?
          - question: 'Question 2 (modèle : Avec quels artistes as-tu collaboré au cours de ta carrière ?)'
            frame: Avec quels ___ as-tu ___ ?
          - question: 'Question 3 (modèle : Quelles récompenses as-tu reçues ces dernières années ?)'
            frame: Quelles ___ as-tu ___ ?
          - question: 'Question 4 (modèle : Quels défis personnels as-tu dû affronter ?)'
            frame: Quels ___ as-tu ___ ?
          - question: 'Question 5 (modèle : Quelles expériences ont influencé ton style artistique ?)'
            frame: Quelles ___ ont ___ ?
      - id: act2-presentation
        type: callout
        tone: info
        title: Modèle de présentation (mini podcast)
        text: >-
          *Aujourd’hui dans mon podcast, j’accueille Stromae. Je l’ai choisi parce que c’est
          l’un des artistes francophones les plus influents au monde. Je lui ai posé des
          questions sur ses collaborations, ses récompenses et les expériences qui ont
          marqué sa carrière. Il m’a expliqué qu’il avait travaillé avec Orelsan et qu’il
          avait reçu plusieurs prix. Il a aussi dit que ses expériences personnelles
          l’avaient beaucoup inspiré dans ses derniers projets.*
      - id: act3
        type: classActivity
        title: 'Activité 3 : Le divertissement « bas de gamme »'
        skills: [Une opinion argumentée, Le passé composé]
        steps:
          - 'Le **divertissement « bas de gamme »** désigne un contenu exagéré, polémique ou superficiel, souvent créé pour faire des vues. Exemples : émissions de téléréalité, contenus TikTok ou YouTube centrés sur les conflits et les polémiques, presse people et sensationnalisme, scandales médiatiques.'
          - '**Étape 1, remue-méninges :** quels adjectifs décrivent ce divertissement ? (*superficiel, exagéré, sensationnaliste, polémique, répétitif…*)'
          - '**Étape 2, étudie un exemple réel** avec les questions-guides ci-dessous.'
          - '**Étape 3, présentation orale :** présente ton exemple avec des phrases au **passé composé** et ton opinion.'
        example: |-
          *Cette émission est devenue très populaire parce qu’elle montre des conflits tout le temps.*
          *Les producteurs ont utilisé des scandales pour attirer le public.*
          *À mon avis, c’est une émission superficielle et sensationnaliste.*
      - id: act3-questions
        type: discussionQuestions
        title: Questions-guides
        items:
          - question: De quel type de divertissement s’agit-il ?
            frame: Il s’agit de ___.
          - question: Quel est le public cible ?
            frame: Le public cible, ce sont ___.
          - question: Pourquoi est-ce devenu populaire ?
            frame: C’est devenu populaire parce que ___.
          - question: Quels éléments « bas de gamme » y a-t-il ?
            frame: Il y a ___.
          - question: Comment le décrire avec des adjectifs ?
            frame: Je pense que c’est ___ et ___.
      - id: act4
        type: classActivity
        title: 'Activité 4 : Débat. Le divertissement traditionnel est-il en train de disparaître ?'
        skills: [Une opinion argumentée, Le passé composé]
        minutes: 20
        steps:
          - '**Sujet :** Ces dernières années, les gens ont davantage utilisé leur téléphone et ont moins fréquenté les lieux culturels. Est-ce que le divertissement traditionnel est en train de mourir ?'
          - '**Discussion libre (5 minutes) :** parlez du cinéma, des concerts, du théâtre, des musées, des événements culturels et de Netflix / YouTube / TikTok.'
          - '**Préparation (7 minutes) :** le **groupe A** défend *oui, le divertissement traditionnel est en train de disparaître* ; le **groupe B** défend *non, il évolue mais ne disparaît pas*. Écrivez 4 ou 5 arguments au **passé composé**.'
          - '**Débat guidé (8 minutes) :** A présente un argument et B répond ; puis B présente un argument et A répond. Utilisez les phrases d’accord et de désaccord du résumé.'
          - '**Questions finales (facultatif) :** Comment la technologie a-t-elle changé le divertissement ? Quelles activités culturelles ont survécu malgré tout ?'
        example: |-
          *La fréquentation des cinémas a diminué ces dernières années.*
          *Les plateformes numériques ont créé de nouvelles formes de divertissement.*
      - id: act4-arguments
        type: discussionQuestions
        title: Mes arguments
        items:
          - question: Argument 1
            frame: Ces dernières années, ___ a / ont ___. C’est pourquoi ___.
          - question: Argument 2
            frame: Je pense que ___ parce que ___.
          - question: Argument 3
            frame: ___. Cependant, ___.
          - question: Argument 4
            frame: De plus, ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Deux compétences dans ce cycle : **le passé composé** (échauffement, activités 2,
          3 et 4) et **une opinion argumentée** avec des connecteurs logiques (activités 1,
          3 et 4). Le cahier ne donne des durées que pour le débat (20 minutes) : choisis
          les activités selon le temps du groupe.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: >-
          Deux phrases par élève, 30 secondes maximum par élève et pour toi. Si les élèves
          se connaissent déjà, passe directement aux questions d’échauffement.
      - id: n-warmup
        anchor: warmup
        text: Demande des réponses complètes au passé composé. Pose au moins deux questions à chaque élève.
      - id: n-act1
        anchor: act1
        text: Écris les critères au tableau. Demande à chaque élève de justifier au moins deux notes avec *J’ai regardé / J’ai écouté* + opinion + connecteur.
      - id: n-act2
        anchor: act2
        text: >-
          Vérifie que les questions utilisent *as-tu* + participe et que les réponses « en
          célébrité » utilisent *j’ai* + participe. À l’étape 4, l’élève raconte à la
          troisième personne (*Il m’a expliqué qu’il avait travaillé…*). Si l’élève garde
          le passé composé (*qu’il a travaillé*), accepte-le à l’oral.
      - id: n-act3
        anchor: act3
        text: L’étape 2 peut se faire avec le téléphone, en cherchant des informations sur l’émission choisie.
      - id: n-act4
        anchor: act4
        minutes: 20
        text: Divise la classe en deux groupes. Écris au tableau les phrases pour exprimer l’accord et le désaccord poliment.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: divertissement-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: rules-passe-compose
        type: ruleSummary
        skill: Le passé composé
        rules:
          - text: 'Le **passé composé** raconte une **action terminée** : un événement à un moment précis du passé, une **expérience vécue**, un **événement récent** ou un **changement** qui a eu un impact.'
            examples:
              - Hier soir, j’ai regardé un film.
              - J’ai vu *Intouchables* trois fois.
              - Tu as déjà assisté à un concert de Stromae ?
              - Stromae a collaboré avec de nombreux artistes.
          - text: 'Marqueurs fréquents pour les expériences : *déjà, jamais, souvent, plusieurs fois, récemment, ce mois-ci*.'
          - text: '**Actions récentes** et **changements** qui influencent encore aujourd’hui. Marqueurs : *ces dernières années, récemment, dernièrement*.'
            examples:
              - Cette année, j’ai commencé à écouter de nouveaux podcasts.
              - Ce film a eu beaucoup de succès récemment.
              - L’industrie musicale a complètement changé avec le streaming.
              - Beaucoup de gens ont arrêté d’aller au cinéma.
          - text: 'Attention : pour une action qui **continue aujourd’hui**, on utilise le **présent** + *depuis*.'
            examples:
              [Je regarde cette série depuis 2020., Il travaille dans le cinéma depuis dix ans.]
          - text: 'Structure : **sujet + auxiliaire (avoir / être) au présent + participe passé**.'
            examples: [j’ai vu, tu as découvert, elle a gagné, nous avons regardé, ils ont produit]
          - text: 'On utilise **être** avec les verbes de mouvement (*aller, venir, revenir, sortir, partir, arriver…*) et les verbes pronominaux. Le participe s’accorde avec le sujet.'
            examples: [Le film est sorti en 2011., Elle est allée au concert., Ils se sont ennuyés.]
      - id: participles-table
        type: table
        caption: Participes passés irréguliers fréquents
        header: [Infinitif, Participe passé]
        rows:
          - [voir, vu]
          - [faire, fait]
          - [écrire, écrit]
          - [dire, dit]
          - [mettre, mis]
          - [ouvrir, ouvert]
          - [découvrir, découvert]
          - [prendre, pris]
          - [recevoir, reçu]
          - [revenir, revenu]
          - [avoir, eu]
          - [être, été]
      - id: rules-opinion
        type: ruleSummary
        skill: Une opinion argumentée
        rules:
          - text: '**Introduire une opinion :** *Je pense que… / Je crois que… / À mon avis… / Selon moi… / Personnellement, je dirais que…*'
          - text: '**Être d’accord :** *Je suis d’accord parce que… / C’est vrai que… / Tu as raison, car…*'
          - text: '**Ne pas être d’accord (poliment) :** *Je ne suis pas totalement d’accord, parce que… / Je comprends ton point de vue, mais… / Je ne vois pas les choses comme ça…*'
          - text: '**Connecteurs utiles :** cause (*parce que, car, puisque*), conséquence (*donc, c’est pourquoi*), opposition (*cependant, pourtant, en revanche*), ajout (*de plus*).'
            examples:
              - J’ai trouvé cette série superficielle parce que les personnages n’ont pas de profondeur.
              - Les plateformes ont créé de nouveaux contenus. C’est pourquoi le divertissement ne disparaît pas.
          - text: '**Formule recommandée pour répondre à l’oral :** 1. passé composé (*J’ai regardé / j’ai découvert / j’ai écouté…*) → 2. opinion (*Je pense que c’est…*) → 3. justification (*parce que…*) → 4. exemple concret (*Par exemple…*) → 5. conclusion (*Donc… / C’est pourquoi…*).'
            examples:
              - J’ai découvert Lupin l’année dernière. Je pense que c’est une série captivante, parce que l’histoire est originale. Par exemple, chaque épisode a une surprise. C’est pourquoi je la recommande.
      - id: adjectives-table
        type: table
        caption: Adjectifs utiles pour parler de divertissement
        header: [Positifs, Négatifs, Neutres / analytiques]
        rows:
          - [captivant, superficiel, iconique]
          - [inspirant, exagéré, classique]
          - [profond, polémique, expérimental]
          - [original, prévisible, significatif]
          - [innovant, surévalué, provocateur]
          - [marquant, '', '']
          - [inoubliable, '', '']
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Révise les deux compétences. Demande à chaque élève une réponse orale avec la formule en 5 étapes sur un film, une série ou un concert.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: divertissement-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie un message et envoie-le. Mori va te poser des questions ; réponds à toutes.
      - id: mori-convaincs
        type: aiTutorPrompt
        title: 'Activité 1 : « Convaincs-moi ! » (opinions et passé composé)'
        intro: 'Objectifs : le passé composé (*j’ai vu, j’ai écouté, j’ai découvert…*), l’opinion (*je pense que, à mon avis…*), les connecteurs (*parce que, cependant, donc…*) et les adjectifs (*innovant, superficiel, inoubliable…*).'
        message: >-
          Bonjour Mori ! Fais-moi des affirmations fortes ou surprenantes sur le
          divertissement (films, séries, célébrités, tendances). Je dois être d’accord ou pas
          d’accord et expliquer mon opinion avec des arguments et des adjectifs. Après chaque
          réponse, pose-moi une question de relance pour approfondir ma réflexion. Corrige
          mes erreurs et aide-moi à améliorer mes phrases.
      - id: mori-types
        type: aiTutorPrompt
        title: 'Activité 2 : Types de divertissement (passé composé et questions)'
        intro: 'Objectif : répondre et poser des questions au passé composé.'
        message: >-
          Bonjour Mori ! Parlons de différents types de divertissement (cinéma, concerts,
          musées, spectacles, événements culturels ou Netflix / YouTube / TikTok). Pour
          chaque thème, pose-moi des questions au passé composé sur mes expériences. Je
          répondrai et je devrai aussi te poser une question au passé composé. Corrige mes
          erreurs et pousse-moi à donner plus de détails.
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          Tu veux plus de questions ? Envoie : **S’il te plaît, pose-moi encore des questions !**
          Tu ne comprends pas une explication ? Envoie : **Peux-tu m’expliquer en hébreu, mais avec la phrase en français ?**

