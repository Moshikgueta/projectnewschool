    title: Divertissement
    items: *divertissement-words

activities:
  - slug: divertissement-passe-compose
    title: 'Le passé composé : mes expériences culturelles'
    minutes: 8
    items:
      - id: ai-vu
        type: multipleChoice
        prompt: J’___ *Intouchables* trois fois.
        options:
          - { text: ai vu, correct: true }
          - {
              text: ai voir,
              feedback: 'Au passé composé, on utilise le participe passé. Le participe de *voir* est *vu* : *j’ai vu*.',
            }
          - { text: suis vu, feedback: 'Le verbe *voir* se conjugue avec *avoir* : *j’ai vu*.' }
      - id: as-tu-decouvert
        type: fillBlank
        prompt: Complète la question avec le verbe *découvrir* au passé composé (tu, avec inversion).
        text: Quel podcast ___ récemment ?
        blanks: [[as-tu découvert]]
      - id: participes
        type: matching
        prompt: Associe chaque verbe à son participe passé.
        pairs:
          - [voir, vu]
          - [faire, fait]
          - [écrire, écrit]
          - [mettre, mis]
          - [prendre, pris]
      - id: est-sorti
        type: multipleChoice
        prompt: Ce film ___ au cinéma la semaine dernière.
        options:
          - { text: est sorti, correct: true }
          - {
              text: a sorti,
              feedback: 'Ici, *sortir* est un verbe de mouvement sans complément d’objet : il se conjugue avec *être*, *le film est sorti*.',
            }
          - {
              text: sortira,
              feedback: '*Sortira* est au futur. *La semaine dernière* parle du passé : *le film est sorti*.',
            }
      - id: depuis
        type: trueFalse
        prompt: 'Pour une action qui continue aujourd’hui, on dit : *Je regarde cette série depuis 2020.*'
        answer: true
        feedback:
          correct: 'Bravo ! Avec *depuis*, pour une action qui continue, on utilise le présent.'
          incorrect: 'C’est correct : pour une action qui continue aujourd’hui, on utilise le présent + *depuis* (*Je regarde cette série depuis 2020*).'
      - id: a-change
        type: fillBlank
        prompt: Complète avec le verbe *changer* au passé composé (l’auxiliaire, puis le participe).
        text: L’industrie musicale ___ complètement ___ avec le streaming.
        blanks: [[a], [changé]]
      - id: a-collabore
        type: multipleChoice
        prompt: Stromae ___ avec de nombreux artistes.
        options:
          - { text: a collaboré, correct: true }
          - {
              text: est collaboré,
              feedback: 'Le verbe *collaborer* se conjugue avec *avoir* : *il a collaboré*.',
            }
          - {
              text: a collaborer,
              feedback: 'Après l’auxiliaire, on met le participe passé (*collaboré*), pas l’infinitif.',
            }
      - id: ordre-producteurs
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Les producteurs ont utilisé des scandales.

  - slug: divertissement-opinion
    title: 'Une opinion argumentée : je pense que…'
    minutes: 8
    items:
      - id: connecteurs
        type: matching
        prompt: Associe chaque connecteur à sa fonction.
        pairs:
          - [parce que, la cause]
          - [donc, la conséquence]
          - [cependant, l’opposition]
          - [de plus, ajouter un argument]
          - [par exemple, donner un exemple concret]
      - id: desaccord
        type: multipleChoice
        prompt: Quelle phrase exprime un désaccord poli ?
        options:
          - { text: 'Je comprends ton point de vue, mais…', correct: true }
          - {
              text: 'Tu as raison, car…',
              feedback: '*Tu as raison* exprime l’accord. Pour un désaccord poli : *Je comprends ton point de vue, mais…*',
            }
          - {
              text: C’est vrai que…,
              feedback: '*C’est vrai que* exprime l’accord. Pour un désaccord poli : *Je comprends ton point de vue, mais…*',
            }
      - id: inoubliable
        type: multipleChoice
        prompt: J’ai vu ce film il y a dix ans et je m’en souviens encore. Il est ___.
        options:
          - { text: inoubliable, correct: true }
          - {
              text: superficiel,
              feedback: '*Superficiel* est négatif : un contenu sans profondeur. Un film dont on se souvient toujours est *inoubliable*.',
            }
          - {
              text: prévisible,
              feedback: '*Prévisible* veut dire qu’on sait la fin à l’avance. Un film dont on se souvient toujours est *inoubliable*.',
            }
      - id: cause
        type: fillBlank
        prompt: Complète avec un connecteur de cause.
        text: J’ai trouvé cette série superficielle ___ les personnages n’ont pas de profondeur.
        blanks: [[parce que, car, puisque]]
      - id: introduire
        type: trueFalse
        prompt: '*Je pense que* et *À mon avis* servent à introduire une opinion.'
        answer: true
        feedback:
          correct: 'Bravo ! On peut dire aussi *Je crois que…, Selon moi…, Personnellement, je dirais que…*'
          incorrect: 'C’est vrai : *Je pense que…* et *À mon avis…* introduisent une opinion, comme *Selon moi…*'
      - id: c-est-pourquoi
        type: multipleChoice
        prompt: Les plateformes ont créé de nouveaux contenus. ___ le divertissement ne disparaît pas.
        options:
          - { text: C’est pourquoi, correct: true }
          - {
              text: Cependant,
              feedback: '*Cependant* exprime une opposition. Ici, la deuxième phrase est une conséquence : *C’est pourquoi*.',
            }
          - {
              text: Parce que,
              feedback: '*Parce que* introduit une cause. Ici, la deuxième phrase est une conséquence : *C’est pourquoi*.',
            }
      - id: avis
        type: fillBlank
        prompt: Complète l’expression d’opinion.
        text: À mon ___, cette émission est exagérée.
        blanks: [[avis]]
      - id: ordre-surevalue
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Je pense que ce film est surévalué.
