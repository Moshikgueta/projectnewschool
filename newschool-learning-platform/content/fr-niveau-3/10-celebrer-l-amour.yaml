# Cycle "Célébrer l'amour", converted from the French level 3 digital notebook
# ("Cahier digital 2026 - français niveau 3", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-3
slug: celebrer-l-amour
title: Célébrer l’amour
goal: Exprimer des désirs, des émotions, des conseils et des doutes avec le subjonctif, et rapporter des paroles au discours indirect.
position: 10
status: published

review:
  - >-
    The two workbook exercises ("Le subjonctif" and "Le discours indirect") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's summary
    rules, the activity examples and the vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    The notebook lists four skills: (1) comparatifs et superlatifs, (2) subjonctif
    (désir, émotion, recommandation, doute), (3) discours indirect, (4) connecteurs
    logiques (parce que, puisque, bien que, donc). The cycle overview keeps (2) and (3)
    as the cycle's two skills, because all the class activities and the summary practise
    them. Comparatifs and superlatifs appear only in Mori part 3: a short revision rule
    was added to the summary. The connectors have no activity: one summary rule was
    added (bien que + subjonctif; parce que / puisque + indicatif; donc). Please confirm.
  - >-
    GRAMMAR FIX: the summary put "J'espère que nous pourrons voyager ensemble" under the
    subjunctive ("après un verbe de désir, d'espoir…"). Espérer que takes the
    INDICATIVE (here the futur). The rule now says so; on the Activity 2 board "J'espère
    que…" was replaced by "J'aimerais que…" (+ subjonctif), and Activity 2 and Mori part 1
    point it out; the example is kept as an indicative example.
  - >-
    GRAMMAR FIX: Activity 3 "Je te conseille que…" is not natural French (conseiller à
    quelqu'un DE + infinitif). Replaced by "Il vaut mieux que… / Il faut que…" (+
    subjonctif), with "Je te conseille de + infinitif" mentioned. "Ça me fait plaisir
    que… / Ça me déplaît que…" kept; "Je suis content(e) que…" added.
  - >-
    GRAMMAR FIX (discours indirect table): "Passé composé → passé composé ou
    plus-que-parfait" → passé composé → plus-que-parfait when the reporting verb is in
    the past (the source's own example uses the plus-que-parfait). The time-expression
    table "ce → ce/celui-ci" was wrong: replaced by "ce soir → ce soir-là", and "ici →
    là-bas" by "ici → là / là-bas"; "maintenant → à ce moment-là" and "la semaine
    prochaine → la semaine suivante" were added. A rule that the tenses only change when
    the reporting verb is in the past was added.
  - >-
    "a commenté que" (summary and Mori part 2, a calque of Spanish "comentó que") →
    "a ajouté que / a confié que" in the summary; Mori example "Il a commenté qu'il
    voulait se marier avec moi" → "Il a dit qu'il voulait se marier avec moi".
  - >-
    Summary additions (not in the source, please confirm): how to form the subjonctif
    présent (stem of "ils" in the present + -e, -es, -e, -ions, -iez, -ent) and a table
    of common irregular forms (être, avoir, aller, faire, pouvoir, vouloir, venir). The
    three source tables (parler, finir, partir) were merged into one table.
  - >-
    Activity 1, suggested holidays: "Saint-Valentin (États-Unis / Brésil)" → Brazil
    celebrates the Dia dos Namorados on 12 June, not Saint-Valentin. Now "Saint-Valentin
    (États-Unis, France…)" and "Dia dos Namorados (Brésil)". Please confirm. Students
    need internet access for the research step (teacher note).
  - >-
    The Mori homework in the source is a task list, not messages. Mori messages were
    written from parts 1–3; part 4 ("Réflexion écrite") is a reflection box. The Mori
    examples of part 2 are kept in the message intro.
  - >-
    Small fixes: broken bold marks and doubled asterisks removed throughout; warm-up
    "Imagine que ton/ta meilleur(e) ami(e) te dit…" kept, with a frame using the
    imparfait; Activity 2 "Pourvu que nous ne nous disputions jamais pour des bêtises"
    kept; activity variants moved to teacher notes.
  - >-
    Left out: the "Date / Participants" lines and the "Réponse de l'élève 1/2/3" lines
    (the platform has answer boxes). Times given as ranges are recorded as the upper
    value (4–5 → 5, 3–4 → 4, 8–10 → 10, 7–8 → 8, 5–7 → 7). The notebook gives no total
    time. The Quizlet link is kept without its tracking parameters (?i=…&x=…).
  - >-
    Vocabulary: "Partenaire – זוג" → "בן / בת זוג"; "Amour / Tendresse – אהבה / חיבה"
    → "אהבה / רוך" (חיבה is already the gloss of "Affection"); "Intimité – קרבה" →
    "אינטימיות / קרבה"; "Fête – חג" → "חג / מסיבה"; "Déclaration – הצהרה" → "הצהרה
    (הצהרת אהבה)". Articles were not added. Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: celebrer-l-amour-classe
    title: 'Classe : Célébrer l’amour'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Célébrer l’amour
      - id: skills
        type: cycleOverview
        skills:
          - name: Le subjonctif
            description: 'Désir, émotion, conseil et doute (*Je veux que tu m’écoutes. Je doute qu’il vienne.*)'
          - name: Le discours indirect
            description: '*« Je t’aime. » → Il a dit qu’il m’aimait.*'
      - id: quizlet
        type: externalLink
        label: Célébrer l’amour sur Quizlet
        url: https://quizlet.com/il/1144017825/extreme-french-2026-celebrer-lamour-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. Je pense que l’amour est ___.
        example: Je m’appelle Lévanah. Je pense que l’amour est vital, il est aussi important que l’air qu’on respire.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup
        type: discussionQuestions
        items:
          - question: Penses-tu que l’amour est plus important que l’argent ? Pourquoi ?
            frame: Je pense que l’amour est plus / moins important que l’argent parce que…
          - question: Quelle est pour toi la plus belle preuve d’amour ?
            frame: Pour moi, la plus belle preuve d’amour, c’est…
          - question: Complète avec le subjonctif.
            frame: Je veux que mon / ma partenaire… (+ subjonctif)
          - question: Qu’est-ce qui te rend heureux / heureuse dans une relation ?
            frame: Dans une relation, ce qui me rend heureux / heureuse, c’est…
          - question: 'Imagine que ton meilleur ami / ta meilleure amie te dit : « Je suis amoureux / amoureuse. » Comment le raconterais-tu au style indirect ?'
            frame: Mon ami(e) m’a dit qu’il / elle était amoureux / amoureuse.
          - question: Dans ta culture, quelle coutume amoureuse ou relationnelle est différente des autres cultures ?
            frame: Dans ma culture, on a l’habitude de… Ailleurs, on…
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Découvrons différentes manières de célébrer l’amour'
        skills: []
        minutes: 10
        steps:
          - '**Recherche en groupes (10 minutes) :** chaque groupe reçoit une fête de l’amour à chercher : son nom, la culture ou le pays, la date, son origine historique et comment on la célèbre aujourd’hui.'
          - 'Fêtes suggérées : Holi (Inde), la Saint-Valentin (États-Unis, France…), le Dia dos Namorados (Brésil), Tu B’Av (Israël), la Sant Jordi (Catalogne), la Journée blanche (Corée, Japon), le Festival des lanternes (Taïwan).'
          - '**Présentation rapide (2 minutes par groupe) :** présentez votre fête à la classe.'
        example: |-
          *Le nom de cette fête est… et elle se célèbre en / au…*
          *Elle a commencé en… Aujourd’hui, les gens célèbrent…*
      - id: act1-questions
        type: discussionQuestions
        title: Notre fête
        items:
          - question: Comment s’appelle la fête ? Où et quand se célèbre-t-elle ?
            frame: Le nom de cette fête est… et elle se célèbre en / au… le…
          - question: Quelle est son origine ?
            frame: Elle a commencé en…
          - question: Comment la célèbre-t-on aujourd’hui ?
            frame: Aujourd’hui, les gens…
      - id: act2
        type: classActivity
        title: 'Activité 2 : Désirs et subjonctif'
        skills: [Le subjonctif]
        minutes: 17
        steps:
          - '**Oral rapide (3 minutes) :** le professeur écrit au tableau *Je veux que…*, *J’aimerais que…* et *Pourvu que…*. Complète oralement ces phrases.'
          - '**Écriture individuelle (5 minutes) :** écris 5 désirs pour une relation idéale.'
          - '**Échange en binômes (5 minutes) :** lis 2 ou 3 phrases à ton / ta partenaire, qui corrige le subjonctif si nécessaire.'
          - '**Jeu « Match de désirs » (4 minutes) :** chaque élève partage un désir. Qui veut la même chose ? Qui a un désir opposé ?'
        example: |-
          *Je veux que mon partenaire m’écoute.*
          *Pourvu que nous ne nous disputions jamais pour des bêtises.*
          *J’espère que nous pourrons voyager ensemble.* (Attention : après *espérer que*, on utilise l’indicatif.)
      - id: act2-sentences
        type: discussionQuestions
        title: Mes désirs pour une relation idéale
        items:
          - question: Je veux que ___.
          - question: J’aimerais que ___.
          - question: Pourvu que ___.
          - question: Je souhaite que ___.
          - question: J’espère que ___ (+ indicatif).
      - id: act3
        type: classActivity
        title: 'Activité 3 : Situations romantiques et subjonctif'
        skills: [Le subjonctif]
        minutes: 17
        steps:
          - '**Préparation (2 minutes) :** chaque binôme reçoit une carte de situation (voir ci-dessous).'
          - '**En binômes (10 minutes) :** réagissez à la situation avec le subjonctif : un désir, une recommandation, une émotion et un doute.'
          - '**Partage rapide (5 minutes) :** chaque binôme présente ses phrases au groupe ; le professeur corrige.'
        example: |-
          *Ton partenaire est en retard à un rendez-vous.*
          *Je veux qu’il m’appelle. Il vaut mieux qu’il prenne un taxi. Ça me déplaît qu’il soit toujours en retard. Je doute qu’il ait une bonne excuse.*
      - id: act3-situations
        type: table
        caption: Cartes de situations et expressions
        header: [Situations, Pour réagir (+ subjonctif)]
        rows:
          - [Ton partenaire est en retard à un rendez-vous., 'Désir : *Je veux que… / Pourvu que…*']
          - [
              Quelqu’un t’offre des fleurs au travail.,
              'Recommandation : *Il vaut mieux que… / Il faut que…*',
            ]
          - [
              Ton meilleur ami veut déclarer sa flamme mais il a peur.,
              'Émotion : *Ça me fait plaisir que… / Ça me déplaît que… / Je suis content(e) que…*',
            ]
          - [Une dispute dans un restaurant., 'Doute : *Je ne crois pas que… / Je doute que…*']
          - [La préparation d’une surprise d’anniversaire., '']
      - id: act3-sentences
        type: discussionQuestions
        title: Ma situation
        items:
          - question: Un désir
            frame: Je veux que… / Pourvu que…
          - question: Une recommandation
            frame: Il vaut mieux que… / Il faut que…
          - question: Une émotion
            frame: Ça me fait plaisir que… / Ça me déplaît que…
          - question: Un doute
            frame: Je ne crois pas que… / Je doute que…
      - id: act4
        type: classActivity
        title: 'Activité 4 : Le téléphone de l’amour (jeu de rôles)'
        skills: [Le discours indirect]
        steps:
          - Le professeur distribue des cartes avec des phrases au style direct (*« Je t’aime. »*, *« Je veux me marier avec toi. »*…).
          - Le premier élève lit la phrase ; l’élève suivant la transforme au style indirect.
          - La chaîne continue sur 5 ou 6 élèves.
          - À la fin, comparez la première et la dernière phrase, et corrigez les temps et les pronoms.
        example: '*« Je t’aime. »* → *Il a dit qu’il m’aimait.*'
      - id: act5
        type: classActivity
        title: 'Activité 5 : Les journalistes du cœur (interview et reportage)'
        skills: [Le discours indirect]
        minutes: 20
        steps:
          - '**Jeu de rôles (8 minutes) :** l’élève A joue un personnage célèbre ou fictif. L’élève B est journaliste et lui pose 3 ou 4 questions romantiques.'
          - '**Transformation écrite (7 minutes) :** écris un petit article au style indirect sur l’interview.'
          - '**Lecture (5 minutes) :** lisez les articles en groupe ; corrigez les temps et le style indirect.'
        example: '*L’acteur a raconté qu’il avait offert des fleurs à sa partenaire et qu’il lui avait dit qu’elle était sa vie.*'
      - id: act5-sentences
        type: discussionQuestions
        title: Mon article
        items:
          - question: Qu’est-ce que le personnage a dit ?
            frame: Il / Elle a dit que…
          - question: Qu’est-ce qu’il / elle a raconté ?
            frame: Il / Elle a raconté que…
          - question: Qu’est-ce qu’il / elle a expliqué ?
            frame: Il / Elle a expliqué que…
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Le cahier liste quatre compétences : comparatifs et superlatifs, subjonctif,
          discours indirect et connecteurs logiques (*parce que, puisque, bien que,
          donc*). Les activités pratiquent surtout le **subjonctif** (activités 2 et 3,
          échauffement) et le **discours indirect** (activités 4 et 5, échauffement).
          Les comparatifs reviennent dans les devoirs avec Mori. Le cahier ne donne pas de
          durée totale : choisis les activités selon le temps.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: >-
          Deux phrases par élève, 30 secondes maximum par élève et pour toi. Si les élèves
          se connaissent déjà, passe directement aux questions d’échauffement.
      - id: n-warmup
        anchor: warmup
        text: Pose au moins deux questions à chaque élève. Vérifie le subjonctif après *je veux que* et l’imparfait au style indirect.
      - id: n-act1
        anchor: act1
        minutes: 10
        text: >-
          Attribue une fête à chaque groupe. Les élèves ont besoin d’un accès à internet
          pour la recherche. Compte en plus 2 minutes de présentation par groupe.
      - id: n-act2
        anchor: act2
        minutes: 17
        text: >-
          Rappelle qu’après *espérer que* on utilise l’indicatif (*J’espère que nous
          pourrons…*), mais après *souhaiter que* et *vouloir que*, le subjonctif.
          Variantes : écrire un « contrat de couple idéal » avec 3 phrases au subjonctif,
          ou voter pour le désir le plus original ou le plus drôle.
      - id: n-act3
        anchor: act3
        minutes: 17
        text: >-
          Prépare les cinq cartes de situations avant le cours. Si un élève dit *Je te
          conseille que…*, corrige : *Je te conseille de + infinitif* ou *Il vaut mieux
          que + subjonctif*. Variante : chaque binôme invente une situation romantique et
          2 ou 3 phrases au subjonctif.
      - id: n-act4
        anchor: act4
        text: >-
          Prépare les cartes avant le cours (par exemple : *« Je t’aime. »*, *« Je veux
          me marier avec toi. »*, *« Je t’attendrai demain ici. »*, *« Je t’ai acheté un
          cadeau. »*). À la fin, vérifie les temps (présent → imparfait, futur →
          conditionnel, passé composé → plus-que-parfait), les pronoms et les expressions
          de temps (*demain → le lendemain*).
      - id: n-act5
        anchor: act5
        minutes: 20
        text: Pendant la lecture, corrige les temps et les verbes introducteurs (*a dit, a raconté, a expliqué, a ajouté*).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: celebrer-l-amour-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: rules-subjonctif
        type: ruleSummary
        skill: Le subjonctif
        rules:
          - text: 'On utilise le **subjonctif** après un verbe de **désir** ou de **volonté** : *vouloir que, souhaiter que, aimer que, pourvu que*.'
            examples:
              [
                Je veux que mon partenaire m’écoute.,
                Pourvu que nous ne nous disputions jamais pour des bêtises.,
              ]
          - text: 'Après une **recommandation** : *il vaut mieux que, il faut que*. (Avec *conseiller*, on dit : *Je te conseille de + infinitif*.)'
            examples: [Il vaut mieux qu’il prenne un taxi., Il faut que tu lui parles.]
          - text: 'Après une **émotion** : *ça me fait plaisir que, ça me déplaît que, je suis content(e) que*.'
            examples:
              [Ça me fait plaisir que tu sois là., Ça me déplaît qu’il soit toujours en retard.]
          - text: 'Après un **doute** : *je doute que, je ne crois pas que*.'
            examples: [Je doute qu’il vienne ce soir., Je ne crois pas qu’elle soit en colère.]
          - text: '**Attention :** après *espérer que*, on utilise l’**indicatif**, pas le subjonctif.'
            examples: [J’espère que nous pourrons voyager ensemble., J’espère qu’il viendra.]
          - text: '**Formation :** on prend le radical de *ils* au présent (*ils parlent* → *parl-*, *ils finissent* → *finiss-*, *ils partent* → *part-*) et on ajoute **-e, -es, -e, -ions, -iez, -ent**.'
          - text: '**Connecteurs :** *bien que* + subjonctif (contraste) ; *parce que* et *puisque* + indicatif (cause) ; *donc* (conséquence).'
            examples:
              - Bien qu’il soit timide, il a déclaré sa flamme.
              - Puisque tu es amoureux, dis-le-lui !
              - Il est en retard, donc elle est fâchée.
      - id: subj-table
        type: table
        caption: Le subjonctif présent des verbes réguliers
        header: [Personne, Terminaison, parler, finir, partir]
        rows:
          - [que je, -e, parle, finisse, parte]
          - [que tu, -es, parles, finisses, partes]
          - [qu’il / qu’elle, -e, parle, finisse, parte]
          - [que nous, -ions, parlions, finissions, partions]
          - [que vous, -iez, parliez, finissiez, partiez]
          - [qu’ils / qu’elles, -ent, parlent, finissent, partent]
      - id: subj-irreg-table
        type: table
        caption: Quelques subjonctifs irréguliers
        header: [Infinitif, que je / j’, que nous]
        rows:
          - [être, que je sois, que nous soyons]
          - [avoir, que j’aie, que nous ayons]
          - [aller, que j’aille, que nous allions]
          - [faire, que je fasse, que nous fassions]
          - [pouvoir, que je puisse, que nous puissions]
          - [vouloir, que je veuille, que nous voulions]
          - [venir, que je vienne, que nous venions]
      - id: rules-indirect
        type: ruleSummary
        skill: Le discours indirect
        rules:
          - text: 'Verbes introducteurs : *a dit que, a raconté que, a expliqué que, a ajouté que, a confié que*.'
          - text: 'Quand le verbe introducteur est **au passé**, les temps changent. (S’il est au présent, *il dit que…*, ils ne changent pas.)'
            examples:
              - « Je mange. » → Il a dit qu’il mangeait.
              - « Je partirai demain. » → Il a dit qu’il partirait le lendemain.
              - « J’ai fini mes devoirs. » → Il a dit qu’il avait fini ses devoirs.
          - text: 'On adapte aussi les **pronoms** et les **possessifs** à la personne qui raconte.'
            examples:
              - « Je t’aime. » → Elle a dit qu’elle m’aimait.
              - « Je veux me marier avec toi. » → Il a dit qu’il voulait se marier avec moi.
              - « Nous ne t’oublierons jamais. » → Ils ont expliqué qu’ils ne m’oublieraient jamais.
      - id: tenses-table
        type: table
        caption: Les temps au discours indirect (verbe introducteur au passé)
        header: [Style direct, Style indirect, Exemple]
        rows:
          - [Présent, Imparfait, « Je mange. » → Il a dit qu’il **mangeait**.]
          - [
              Futur simple,
              Conditionnel présent,
              « Je partirai demain. » → Il a dit qu’il **partirait** le lendemain.,
            ]
          - [
              Passé composé,
              Plus-que-parfait,
              « J’ai fini mes devoirs. » → Il a dit qu’il **avait fini** ses devoirs.,
            ]
          - [
              Imparfait,
              Imparfait (pas de changement),
              « J’étais fatigué. » → Il a dit qu’il **était** fatigué.,
            ]
      - id: time-table
        type: table
        caption: Les expressions de temps et de lieu
        header: [Style direct, Style indirect]
        rows:
          - [aujourd’hui, ce jour-là]
          - [demain, le lendemain]
          - [hier, la veille]
          - [maintenant, à ce moment-là]
          - [ce soir, ce soir-là]
          - [la semaine prochaine, la semaine suivante]
          - [ici, là / là-bas]
      - id: rules-comparatifs
        type: ruleSummary
        skill: 'Révision : comparatifs et superlatifs'
        rules:
          - text: 'Comparatif : **plus… que**, **moins… que**, **aussi… que**.'
            examples:
              [
                La Saint-Valentin est plus connue que Tu B’Av.,
                L’amour est aussi important que l’air qu’on respire.,
              ]
          - text: 'Superlatif : **le / la / les plus…**, **le / la / les moins…**.'
            examples: [Holi est la fête la plus colorée.]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Révise les deux compétences et demande un nouvel exemple pour chaque règle. Insiste sur *espérer que* + indicatif.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: celebrer-l-amour-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie un message et envoie-le. Mori va te poser des questions ; réponds à toutes.
      - id: mori-subjonctif
        type: aiTutorPrompt
        title: 'Partie 1 : Le subjonctif'
        intro: 'Ensuite, écris tes phrases. Exemple : *Je veux que mon partenaire m’écoute. Pourvu que nous ne nous disputions jamais.* Attention : *J’espère que nous pourrons voyager ensemble* (indicatif).'
        message: Bonjour Mori, je veux pratiquer le subjonctif. Je vais t’écrire 3 phrases avec « Je veux que… », 2 phrases avec « J’espère que… » et 2 phrases avec « Pourvu que… » sur ma relation idéale. Corrige mes phrases et explique-moi quand il faut le subjonctif et quand il faut l’indicatif.
      - id: mori-indirect
        type: aiTutorPrompt
        title: 'Partie 2 : Le discours indirect'
        intro: 'Exemples : *« Je t’aime. » → Elle a dit qu’elle m’aimait. « Je veux me marier avec toi. » → Il a dit qu’il voulait se marier avec moi. « Nous ne t’oublierons jamais. » → Ils ont expliqué qu’ils ne m’oublieraient jamais.*'
        message: Bonjour Mori, je veux pratiquer le discours indirect. Donne-moi 6 déclarations d’amour au style direct, une par une. Je vais les transformer au style indirect avec « il / elle a dit que… ». Corrige les temps et les pronoms après chacune de mes réponses.
      - id: mori-comparatifs
        type: aiTutorPrompt
        title: 'Partie 3 : Comparatifs et superlatifs'
        intro: 'Exemple : *Holi est plus colorée que la Saint-Valentin. Holi est la fête la plus colorée.*'
        message: Bonjour Mori, je veux comparer deux fêtes de l’amour. Je vais écrire 4 phrases avec des comparatifs (plus… que, moins… que, aussi… que) et 2 phrases avec des superlatifs (le plus…, la moins…). Corrige mes phrases et pose-moi une question sur chaque fête.
      - id: reflection-title
        type: heading
        level: 3
        text: 'Partie 4 : Réflexion écrite'
      - id: reflection
        type: reflection
        prompt: Quelle partie était la plus facile ? Laquelle était la plus difficile ? Donne un exemple concret de ce que tu as écrit.
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          Tu veux plus de questions ? Envoie : **S’il te plaît, pose-moi encore des questions !**
          Tu ne comprends pas une explication ? Envoie : **Peux-tu m’expliquer en hébreu, mais avec la phrase en français ?**

