vocabulary:
  - slug: celebrer-l-amour
    title: Célébrer l’amour
    items: *celebrer-l-amour-words

activities:
  - slug: celebrer-l-amour-subjonctif
    title: 'Le subjonctif : désirs, émotions, conseils et doutes'
    minutes: 8
    items:
      - id: veux-ecoute
        type: multipleChoice
        prompt: Je veux que mon partenaire ___.
        options:
          - { text: m’écoute, correct: true }
          - {
              text: m’écouter,
              feedback: 'Après *je veux que*, il faut un verbe conjugué au subjonctif : *qu’il m’écoute*.',
            }
          - {
              text: m’écoutera,
              feedback: '*M’écoutera* est au futur. Après *vouloir que*, on utilise le subjonctif : *qu’il m’écoute*.',
            }
      - id: vaut-mieux-partes
        type: fillBlank
        prompt: Complète avec le verbe *partir* au subjonctif.
        text: Il vaut mieux que tu ___ avant huit heures.
        blanks: [[partes]]
      - id: esperer
        type: trueFalse
        prompt: 'Après *espérer que*, on utilise le subjonctif : *J’espère que nous puissions voyager ensemble.*'
        answer: false
        feedback:
          correct: 'Bravo ! Après *espérer que*, on utilise l’indicatif : *J’espère que nous pourrons voyager ensemble.*'
          incorrect: 'Attention : après *espérer que*, on utilise l’indicatif. On dit : *J’espère que nous pourrons voyager ensemble.*'
      - id: irreguliers
        type: matching
        prompt: Associe chaque verbe à sa forme au subjonctif.
        pairs:
          - [être, que je sois]
          - [avoir, que j’aie]
          - [aller, que j’aille]
          - [faire, que je fasse]
          - [pouvoir, que je puisse]
      - id: doute-vienne
        type: fillBlank
        prompt: Complète avec le verbe *venir* au subjonctif.
        text: Je doute qu’il ___ ce soir.
        blanks: [[vienne]]
      - id: pourvu-disputions
        type: multipleChoice
        prompt: Pourvu que nous ne nous ___ jamais pour des bêtises.
        options:
          - { text: disputions, correct: true }
          - {
              text: disputons,
              feedback: '*Disputons* est au présent de l’indicatif. Au subjonctif, *nous* prend la terminaison *-ions* : *que nous disputions*.',
            }
          - {
              text: disputerons,
              feedback: '*Disputerons* est au futur. Après *pourvu que*, on utilise le subjonctif : *que nous disputions*.',
            }
      - id: plaisir-finissiez
        type: fillBlank
        prompt: Complète avec le verbe *finir* au subjonctif.
        text: Ça me fait plaisir que vous ___ ce projet ensemble.
        blanks: [[finissiez]]
      - id: ordre-crois
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Je ne crois pas qu’il soit en retard.

  - slug: celebrer-l-amour-indirect
    title: 'Le discours indirect : il a dit que…'
    minutes: 8
    items:
      - id: aimait
        type: multipleChoice
        prompt: '« Je t’aime. » → Elle a dit qu’elle m’___.'
        options:
          - { text: aimait, correct: true }
          - {
              text: aime,
              feedback: 'Le verbe introducteur (*a dit*) est au passé : le présent devient imparfait, *elle m’aimait*.',
            }
          - {
              text: aimera,
              feedback: '*Aimera* est au futur. Au discours indirect au passé, le présent devient imparfait : *elle m’aimait*.',
            }
      - id: partirait
        type: fillBlank
        prompt: Transforme le verbe au discours indirect.
        text: '« Je partirai demain. » → Il a dit qu’il ___ le lendemain.'
        blanks: [[partirait]]
      - id: expressions
        type: matching
        prompt: Associe chaque expression du style direct à son équivalent au style indirect.
        pairs:
          - [aujourd’hui, ce jour-là]
          - [demain, le lendemain]
          - [hier, la veille]
          - [maintenant, à ce moment-là]
          - [la semaine prochaine, la semaine suivante]
      - id: avait-fini
        type: multipleChoice
        prompt: '« J’ai fini mes devoirs. » → Il a dit qu’il ___ ses devoirs.'
        options:
          - { text: avait fini, correct: true }
          - {
              text: finissait,
              feedback: 'L’action est terminée : le passé composé devient plus-que-parfait, *il avait fini*.',
            }
          - {
              text: finirait,
              feedback: '*Finirait* est au conditionnel (pour un futur). Le passé composé devient plus-que-parfait : *il avait fini*.',
            }
      - id: futur-conditionnel
        type: trueFalse
        prompt: Quand le verbe introducteur est au passé, le futur simple devient conditionnel présent.
        answer: true
        feedback:
          correct: 'Bravo ! *« Je partirai. »* → *Il a dit qu’il partirait.*'
          incorrect: 'C’est vrai : le futur devient conditionnel. *« Je partirai. »* → *Il a dit qu’il partirait.*'
      - id: oublieraient
        type: fillBlank
        prompt: Transforme le verbe au discours indirect.
        text: '« Nous ne t’oublierons jamais. » → Ils ont expliqué qu’ils ne m’___ jamais.'
        blanks: [[oublieraient]]
      - id: pronom-moi
        type: multipleChoice
        prompt: 'Ton partenaire t’a dit : « Je veux me marier avec toi. » Tu racontes : Il a dit qu’il voulait se marier avec ___.'
        options:
          - { text: moi, correct: true }
          - {
              text: toi,
              feedback: 'C’est toi qui racontes : *toi* devient *moi*. *Il a dit qu’il voulait se marier avec moi.*',
            }
          - {
              text: lui,
              feedback: '*Lui* est une autre personne. C’est toi qui racontes : *avec moi*.',
            }
      - id: ordre-heureuse
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Elle a dit qu’elle était heureuse.
