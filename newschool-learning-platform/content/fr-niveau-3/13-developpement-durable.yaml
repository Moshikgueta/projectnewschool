activities:
  - slug: developpement-durable-hypotheses
    title: 'Les hypothèses avec si : si + imparfait, conditionnel'
    minutes: 8
    items:
      - id: vivrais
        type: multipleChoice
        prompt: Si je vivais dans la nature, je ___ dans une forêt au Canada.
        options:
          - { text: vivrais, correct: true }
          - {
              text: vivrai,
              feedback: '*Vivrai* est au futur. Après *si* + imparfait, on utilise le conditionnel : *je vivrais*.',
            }
          - {
              text: vivais,
              feedback: '*Vivais* est à l’imparfait. L’imparfait va après *si* ; dans l’autre partie, on met le conditionnel : *je vivrais*.',
            }
      - id: utilisait
        type: multipleChoice
        prompt: Que se passerait-il si toute la ville ___ les transports en commun ?
        options:
          - { text: utilisait, correct: true }
          - {
              text: utiliserait,
              feedback: 'Jamais de conditionnel juste après *si*. On utilise l’imparfait : *si toute la ville utilisait*.',
            }
          - {
              text: utilise,
              feedback: 'Avec *se passerait* (conditionnel), on met l’imparfait après *si* : *utilisait*.',
            }
      - id: etais
        type: fillBlank
        prompt: Complète avec le verbe *être* à l’imparfait.
        text: Si j’___ président(e), j’interdirais le plastique jetable.
        blanks: [[étais]]
      - id: changerions
        type: trueFalse
        prompt: 'Cette phrase est correcte : *Si nous changerions nos habitudes, la planète irait mieux.*'
        answer: false
        feedback:
          correct: 'Bravo ! Après *si*, on met l’imparfait : *Si nous changions nos habitudes, la planète irait mieux.*'
          incorrect: 'Attention : jamais de conditionnel après *si*. On dit : *Si nous changions nos habitudes, la planète irait mieux.*'
      - id: radicaux
        type: matching
        prompt: Associe chaque verbe à sa forme au conditionnel présent.
        pairs:
          - [faire, je ferais]
          - [être, je serais]
          - [avoir, j’aurais]
          - [aller, j’irais]
          - [vivre, je vivrais]
      - id: planterait
        type: fillBlank
        prompt: Complète avec le verbe *planter* au conditionnel présent.
        text: Si le gouvernement écoutait nos idées, il ___ plus d’arbres.
        blanks: [[planterait]]
      - id: faisions
        type: multipleChoice
        prompt: Si nous ne ___ rien, la pollution augmenterait.
        options:
          - { text: faisions, correct: true }
          - {
              text: ferions,
              feedback: '*Ferions* est au conditionnel. Après *si*, on utilise l’imparfait : *si nous ne faisions rien*.',
            }
          - {
              text: faisons,
              feedback: '*Faisons* est au présent. Avec *augmenterait* (conditionnel), on met l’imparfait après *si* : *faisions*.',
            }
      - id: ordre-eau
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Si je vivais dans la nature, je protégerais l’eau.

  - slug: developpement-durable-modaux
    title: 'Les verbes modaux au conditionnel : pouvoir, devoir, vouloir'
    minutes: 8
    items:
      - id: devrions
        type: multipleChoice
        prompt: Pour améliorer la planète, nous ___ réduire notre consommation de viande.
        options:
          - { text: devrions, correct: true }
          - {
              text: devriez,
              feedback: '*Devriez* est pour *vous*. Pour *nous*, on dit *nous devrions*.',
            }
          - {
              text: devrais,
              feedback: '*Devrais* est pour *je* ou *tu*. Pour *nous*, on dit *nous devrions*.',
            }
      - id: pourrais
        type: fillBlank
        prompt: Complète avec le verbe *pouvoir* au conditionnel présent.
        text: Je ___ utiliser moins de plastique.
        blanks: [[pourrais]]
      - id: pouvoir-personnes
        type: matching
        prompt: Associe chaque sujet à la bonne forme de *pouvoir* au conditionnel.
        pairs:
          - [je, pourrais]
          - [on, pourrait]
          - [nous, pourrions]
          - [vous, pourriez]
          - [ils, pourraient]
      - id: souhait
        type: multipleChoice
        prompt: 'La phrase *Je voudrais vivre à la campagne.* exprime :'
        options:
          - { text: un souhait, correct: true }
          - {
              text: une obligation morale,
              feedback: 'L’obligation morale ou le conseil, c’est *devoir* (*je devrais*). *Vouloir* (*je voudrais*) exprime un souhait.',
            }
          - {
              text: une possibilité,
              feedback: 'La possibilité, c’est *pouvoir* (*je pourrais*). *Vouloir* (*je voudrais*) exprime un souhait.',
            }
      - id: pourrions-sens
        type: trueFalse
        prompt: '*Nous pourrions* exprime une obligation morale.'
        answer: false
        feedback:
          correct: 'Bravo ! *Nous pourrions* exprime une possibilité. L’obligation morale ou le conseil, c’est *nous devrions*.'
          incorrect: 'Non : *nous pourrions* exprime une possibilité. L’obligation morale ou le conseil, c’est *nous devrions*.'
      - id: devriez
        type: fillBlank
        prompt: Donne un conseil. Complète avec le verbe *devoir* au conditionnel présent.
        text: Vous ___ recycler davantage.
        blanks: [[devriez]]
      - id: infinitif
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - { text: Nous pourrions planter plus d’arbres., correct: true }
          - {
              text: Nous pourrions plantons plus d’arbres.,
              feedback: 'Après *pouvoir*, on met l’infinitif : *nous pourrions planter*.',
            }
          - {
              text: Nous pourrions de planter plus d’arbres.,
              feedback: 'Après *pouvoir*, *devoir* et *vouloir*, pas de *de* : *nous pourrions planter*.',
            }
      - id: ordre-velo
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Nous devrions utiliser le vélo.
