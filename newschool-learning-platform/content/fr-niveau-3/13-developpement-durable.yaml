# Cycle "Développement durable", converted from the French level 3 digital notebook
# ("Cahier digital 2026 - français niveau 3", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-3
slug: developpement-durable
title: Développement durable
goal: Faire des hypothèses avec si et le conditionnel, et proposer des solutions avec pouvoir, devoir et vouloir au conditionnel.
position: 13
status: published

review:
  - >-
    The two workbook exercises ("Les hypothèses avec si" and "Les verbes modaux au
    conditionnel") are NEW: the notebook has no self-study exercises. They were written
    from the cycle's summary rules, the activity examples and its vocabulary. Please
    check level, wording and every right answer before students see them.
  - >-
    The notebook lists three skills: (1) conditionnel et structures avec si, (2) verbes
    modaux, (3) expression écrite. The cycle overview keeps the first two as the cycle's
    two skills; written expression (Activity 2, the campaign, and Activity 4, the formal
    letter) is named in the plan note and practised in the Mori homework.
  - >-
    Summary additions (not in the source, please confirm): the conditionnel présent is
    formed on the future stem, with the irregular stems of the cycle (pouvoir → pourr-,
    devoir → devr-, vouloir → voudr-, faire → fer-, être → ser-, avoir → aur-, aller →
    ir-); a rule that the conditionnel never comes right after "si" (Si nous changions…,
    not *Si nous changerions…*); a conjugation table (vivre, pouvoir, devoir, vouloir);
    the gérondif (en + participe présent) used in Activity 3 (en recyclant, en plantant).
  - >-
    Corrections: summary example "Si j’étais président, j’interdirais les plastiques." →
    "Si j’étais président(e), j’interdirais le plastique jetable." ("les plastiques" is
    odd); warm-up 4 double space removed ("la protection de l’environnement"); Activity 2
    "Quels sont les indicateurs de réussite (KPI) ?" → "Quels sont les indicateurs de
    réussite ?" (English acronym removed); Activity 3 "(gérondif -ant)" → "(gérondif :
    en + participe présent)"; Activity 4 polite formula list kept, broken italics
    ("Madame la Députée…**") fixed. Stray "**", "\*\*" and markdown "###" marks were
    removed throughout.
  - >-
    The Mori homework in the source is a list of five steps (presentation, four practice
    questions, three "nous devrions" sentences, a mini formal e-mail, the "Si j’étais
    président(e)" sentences). Each step is now a message to Mori, written from the step's
    instructions; please check the wording.
  - >-
    Left out: the "Date / Participants" lines and the "Réponse de l’élève 1/2/3" lines
    (the platform has answer boxes). Activity 3, step 2 asks students to search for
    information and images online: no link is given in the source. The "Variante
    numérique" of Activity 4 (formal e-mail template) has no template in the source.
  - >-
    Times: the source gives no total. Activities add up to much more than one lesson
    (Activity 1 about 14 min, Activity 2 30 min + presentations, Activity 4 about 35,
    Activity 5 about 32); the plan note asks the teacher to choose. Ranges are recorded
    as the upper value (5–7 → 7, 10–12 → 12, 3–5 → 5).
  - >-
    Vocabulary: "Développement durable – קיימות" → "פיתוח בר־קיימא / קיימות"; "Terre –
    אדמה" → "כדור הארץ / אדמה" (with a capital, la Terre is the planet); "Déchets /
    Ordures – אשפה" → "פסולת / אשפה"; "Prendre soin de – לטפל" → "לטפל ב־ / לדאוג ל־";
    "Nous devrions – היינו צריכים" → "כדאי שנ… / היינו צריכים" (היינו צריכים alone can
    read as past "we had to"). The header row "Français / Hébreu" was dropped. The
    Quizlet link is kept without its tracking parameters (?i=…&x=…). Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: developpement-durable-classe
    title: 'Classe : Développement durable'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Développement durable
      - id: skills
        type: cycleOverview
        skills:
          - name: Les hypothèses avec si
            description: 'Si + imparfait, conditionnel présent (*Si je vivais dans la nature, je protégerais l’eau.*)'
          - name: Les verbes modaux au conditionnel
            description: '*Je pourrais, nous devrions, je voudrais* + infinitif pour proposer des solutions'
      - id: quizlet
        type: externalLink
        label: Développement durable sur Quizlet
        url: https://quizlet.com/il/1144346786/extreme-french-2026-developpement-durable-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. Pour protéger l’environnement, je pourrais ___.
        example: Je m’appelle Lévanah. Pour protéger l’environnement, je pourrais utiliser moins de plastique.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup
        type: discussionQuestions
        items:
          - question: Dans ton monde idéal, tu vivrais à la campagne ou en ville ? Pourquoi ?
            frame: Dans mon monde idéal, je vivrais… parce que…
          - question: Comment pourrait-on mieux protéger l’environnement ? Donne un exemple.
            frame: On pourrait… Par exemple, …
          - question: Est-ce qu’il y a quelque chose que tu pourrais faire à ton niveau ?
            frame: À mon niveau, je pourrais + infinitif…
          - question: Que dirais-tu à quelqu’un qui pense que la protection de l’environnement n’est pas une priorité ?
            frame: Je lui dirais que…
          - question: Que ferais-tu pour convaincre les gens de recycler davantage ?
            frame: Pour convaincre les gens, je ferais…
          - question: Que ferait le gouvernement s’il écoutait tes idées ?
            frame: S’il écoutait mes idées, le gouvernement…
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Nous devrions mieux faire'
        skills: [Les verbes modaux au conditionnel, Les hypothèses avec si]
        minutes: 14
        steps:
          - '**Brainstorming individuel (2 minutes) :** écris **3 actions** que nous devrions tous faire pour améliorer la situation environnementale.'
          - '**Mise en commun (5 minutes) :** en groupes de 3 ou 4, partagez vos idées et choisissez les **3 meilleures** (les plus réalistes ou les plus originales). Écrivez-les avec la structure *Pour améliorer la planète, nous devrions + infinitif.*'
          - '**Mini-débat (7 minutes) :** chaque groupe présente ses trois propositions. Les autres élèves posent une question avec *Que se passerait-il si… + imparfait ?*'
          - '**Variante ludique :** la classe vote pour la proposition la plus réaliste, la plus créative et la plus urgente.'
        example: |-
          *Pour améliorer la planète, nous devrions utiliser plus souvent les transports en commun.*
          *Pour améliorer la planète, nous devrions réduire notre consommation de viande.*
          *Que se passerait-il si toute la ville utilisait les transports en commun ?*
      - id: act1-sentences
        type: discussionQuestions
        title: Mes trois actions
        items:
          - question: Pour améliorer la planète, nous devrions ___.
          - question: Pour améliorer la planète, nous devrions ___.
          - question: Pour améliorer la planète, nous devrions ___.
      - id: act2
        type: classActivity
        title: 'Activité 2 : Créer une campagne « Sauvons la planète »'
        skills: [Les verbes modaux au conditionnel]
        minutes: 30
        steps:
          - '**Consignes :** en groupes, rédigez une proposition écrite complète pour une campagne intitulée **« Sauvons la planète »**. Temps de travail : **30 minutes**. (Un élève seul peut travailler seul ou avec le professeur.)'
          - 'À la fin, vous avez un document écrit prêt et vous êtes capables de le présenter. Chaque membre participe à la préparation et à la présentation.'
          - 'Votre campagne répond aux questions ci-dessous.'
          - '**Présentation orale (3 à 10 minutes par groupe) :** tout le monde parle. Chacun présente une partie différente, ou vous présentez ensemble, mais chacun intervient.'
          - '**Vote et conclusion :** après toutes les présentations, votez pour la meilleure campagne. La campagne qui a le plus de votes gagne.'
      - id: act2-questions
        type: discussionQuestions
        title: Notre campagne
        items:
          - question: Quel est l’objectif de la campagne ?
            frame: L’objectif de notre campagne est de…
          - question: Quel est le public cible ?
            frame: Notre campagne s’adresse à…
          - question: Quel est le thème et quelle est la stratégie ?
            frame: Le thème est… Nous pourrions…
          - question: Y a-t-il un slogan ? Si oui, lequel ? Sinon, comment la campagne fonctionne-t-elle ?
            frame: Notre slogan est « … »
          - question: Où la campagne sera-t-elle diffusée ?
            frame: La campagne sera diffusée…
          - question: Qu’est-ce qui la rend efficace ?
            frame: Elle est efficace parce que…
          - question: Quels sont les indicateurs de réussite ?
            frame: Nous saurons que la campagne a réussi si…
      - id: act3
        type: classActivity
        title: 'Activité 3 : Vivre dans la nature'
        skills: [Les hypothèses avec si]
        steps:
          - '**Question de départ :** *Si tu vivais dans la nature, où vivrais-tu ?*'
          - '**Recherche guidée (5 minutes) :** choisis un endroit magnifique dans un pays francophone ou ailleurs dans le monde. Cherche des informations et des images.'
          - '**Présentation :** montre ton image et décris l’endroit avec les structures ci-dessous. Pour la deuxième phrase, utilise le gérondif (*en* + participe présent : *en recyclant*).'
        example: |-
          *Si je vivais dans la nature, je vivrais dans une forêt au Canada parce que j’aime le calme.*
          *Je prendrais soin de mon environnement en recyclant et en plantant des arbres.*
      - id: act3-sentences
        type: discussionQuestions
        title: Mon endroit dans la nature
        items:
          - question: Si je vivais dans la nature, je vivrais à / au / en ___ parce que ___.
          - question: Je prendrais soin de mon environnement en ___.
            frame: en + participe présent (en recyclant, en plantant…)
      - id: act4
        type: classActivity
        title: 'Activité 4 : Une lettre pour une cause'
        skills: [Les verbes modaux au conditionnel, Les hypothèses avec si]
        minutes: 35
        steps:
          - '**Introduction (3 minutes) :** écris une lettre formelle à un élu (maire, député, ministre, responsable local) pour proposer une action écologique.'
          - '**Rédaction (15 minutes) :** ta lettre contient une formule d’appel (*Monsieur le Maire, / Madame la Députée,*), le problème environnemental, une proposition claire (*Nous devrions… / Nous pourrions… / Je vous propose de…*), un argument persuasif (*parce que… / puisque…*) et une formule de fin (*Je vous prie d’agréer… / Veuillez agréer… / Cordialement / Respectueusement*).'
          - '**Échange de lettres (10 minutes) :** donne ta lettre à un(e) camarade, qui répond comme s’il / si elle était l’élu(e). La réponse contient des expressions de politesse et une réaction (solution, accord ou commentaire).'
          - '**Lecture en classe (7 minutes) :** quelques élèves lisent la lettre et la réponse devant la classe.'
          - '**Variante numérique :** écrivez un mail formel au lieu d’une lettre.'
        example: |-
          *Monsieur le Maire,*
          *Je vous écris afin de vous proposer d’installer davantage de points de recyclage dans notre ville, car il y en a actuellement très peu. S’il y en avait plus, les citoyens pourraient recycler plus facilement et réduire les déchets.*
          *Je vous prie d’agréer, Monsieur le Maire, l’expression de mes salutations distinguées.*
          *Signature*
      - id: act4-letter
        type: discussionQuestions
        title: Ma lettre
        items:
          - question: Formule d’appel
            frame: Monsieur le Maire, / Madame la Députée,
          - question: Le problème environnemental
            frame: Je vous écris au sujet de…
          - question: Ma proposition
            frame: Je vous propose de… / Nous devrions… / Nous pourrions…
          - question: Mon argument
            frame: … parce que… / puisque… / S’il y avait…, les citoyens pourraient…
          - question: Formule de fin
            frame: Je vous prie d’agréer, Monsieur le Maire, l’expression de mes salutations distinguées.
      - id: act5
        type: classActivity
        title: 'Activité 5 : Débat écologique – « Si j’étais président(e)… »'
        skills: [Les hypothèses avec si, Les verbes modaux au conditionnel]
        minutes: 32
        steps:
          - '**Préparation individuelle (5 minutes) :** complète les 3 phrases ci-dessous.'
          - '**Travail en groupe (10 minutes) :** en groupes de 3 ou 4, partagez vos idées et choisissez une mesure prioritaire à défendre. Préparez un argumentaire : *Quel problème cette mesure résout-elle ? Que se passerait-il si elle était appliquée ? Que se passerait-il si elle n’était pas appliquée ?*'
          - '**Débat en classe (12 minutes) :** chaque groupe présente sa mesure avec des phrases au conditionnel. Les autres posent des questions critiques : *Que se passerait-il si les gens ne respectaient pas la loi ? Comment convaincre les citoyens ?*'
          - '**Vote (5 minutes) :** votez pour la mesure la plus efficace, la plus réaliste et la plus créative.'
      - id: act5-sentences
        type: discussionQuestions
        title: Si j’étais président(e)…
        items:
          - question: Si j’étais président(e), je pourrais ___.
          - question: Si j’étais président(e), je ferais ___.
          - question: Si j’étais président(e), j’interdirais ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Deux compétences dans ce cycle : **les hypothèses avec si** (si + imparfait,
          conditionnel présent ; activités 1, 3, 4 et 5) et **les verbes modaux au
          conditionnel** (*je pourrais, nous devrions, je voudrais* ; activités 1, 2, 4 et
          5). Le cahier travaille aussi l’**expression écrite** (activité 2 : la campagne ;
          activité 4 : la lettre formelle). Les activités dépassent largement la durée d’un
          cours : choisis-en deux ou trois selon le temps et le groupe.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: >-
          Deux phrases par élève, 30 secondes maximum par élève et pour toi. Si les élèves
          se connaissent déjà, passe directement aux questions d’échauffement. Cette phase
          ne dépasse pas 5 minutes.
      - id: n-warmup
        anchor: warmup
        text: >-
          Pour la question 3, la structure attendue est *Je pourrais + infinitif*. Pose au
          moins deux questions à chaque élève et vérifie le conditionnel dans les réponses.
      - id: n-act1
        anchor: act1
        minutes: 14
        text: >-
          Objectif : pratiquer *nous devrions* et le conditionnel présent dans un contexte
          écologique. Pendant le mini-débat, vérifie l’imparfait après *si* (*si toute la
          ville utilisait…*), jamais le conditionnel.
      - id: n-act2
        anchor: act2
        minutes: 30
        text: >-
          Objectif : l’expression écrite structurée et la présentation orale. Les 30 minutes
          sont pour l’écriture ; prévois en plus le temps des présentations (3 à 10 minutes
          par groupe) et du vote. Si un élève est seul, travaille avec lui.
      - id: n-act3
        anchor: act3
        text: >-
          Objectif : *si + imparfait / conditionnel* et le vocabulaire de la nature. Pour la
          recherche, les élèves utilisent leur téléphone ou un ordinateur (le cahier ne donne
          pas de lien). Adaptation culturelle possible : un endroit en Israël ou dans un pays
          francophone.
      - id: n-act4
        anchor: act4
        minutes: 35
        text: >-
          Objectif : écrire une lettre formelle et persuasive. Introduction 3 minutes,
          rédaction 15, échange 10, lecture 7. Vérifie la formule d’appel et la formule de
          fin, et une phrase avec *si* dans l’argument (*S’il y en avait plus, les citoyens
          pourraient…*).
      - id: n-act5
        anchor: act5
        minutes: 32
        text: >-
          Objectif : les hypothèses avec *si* + imparfait, le conditionnel présent et les
          verbes modaux. Préparation 5 minutes, groupes 10, débat 12, vote 5.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: developpement-durable-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: rules-conditionnel
        type: ruleSummary
        skill: Les hypothèses avec si
        rules:
          - text: 'Le **conditionnel présent** sert à exprimer une **hypothèse**, un **souhait** ou une **proposition**.'
            examples:
              - Je pourrais utiliser moins de plastique.
              - Que ferais-tu pour convaincre les gens ?
              - Le gouvernement écouterait nos idées.
          - text: 'Formation : le **radical du futur** + les terminaisons de l’imparfait **-ais, -ais, -ait, -ions, -iez, -aient**. Pour les verbes réguliers, le radical est l’infinitif (*protéger → je protégerais* ; *vivre → je vivrais*).'
          - text: 'Radicaux irréguliers utiles :'
            examples:
              - 'pouvoir → je pourrais'
              - 'devoir → je devrais'
              - 'vouloir → je voudrais'
              - 'faire → je ferais'
              - 'être → je serais'
              - 'avoir → j’aurais'
              - 'aller → j’irais'
          - text: 'Phrase hypothétique : **Si + imparfait, conditionnel présent**. On peut aussi commencer par le conditionnel : *Que se passerait-il si… + imparfait ?*'
            examples:
              - Si je vivais dans la nature, je protégerais l’eau.
              - Si j’étais président(e), j’interdirais le plastique jetable.
              - Que se passerait-il si toute la ville utilisait les transports en commun ?
          - text: 'Attention : **jamais de conditionnel juste après *si***. On dit *Si nous changions nos habitudes…*, pas *Si nous changerions…*'
            examples:
              - Si nous ne faisions rien, la pollution augmenterait.
              - Si nous changions nos habitudes, la planète irait mieux.
          - text: 'Le **gérondif** (*en* + participe présent) dit **comment** on fait quelque chose.'
            examples:
              [Je prendrais soin de mon environnement en recyclant et en plantant des arbres.]
      - id: conditionnel-table
        type: table
        caption: Le conditionnel présent
        header: [Personne, vivre, pouvoir, devoir, vouloir]
        rows:
          - [je / j’, vivrais, pourrais, devrais, voudrais]
          - [tu, vivrais, pourrais, devrais, voudrais]
          - [il / elle / on, vivrait, pourrait, devrait, voudrait]
          - [nous, vivrions, pourrions, devrions, voudrions]
          - [vous, vivriez, pourriez, devriez, voudriez]
          - [ils / elles, vivraient, pourraient, devraient, voudraient]
      - id: rules-modaux
        type: ruleSummary
        skill: Les verbes modaux au conditionnel
        rules:
          - text: '**Pouvoir** → *je pourrais* : une **possibilité**.'
            examples:
              [Je pourrais utiliser moins de plastique., Nous pourrions planter plus d’arbres.]
          - text: '**Devoir** → *je devrais, nous devrions* : une **obligation morale** ou un **conseil**.'
            examples:
              ['Pour améliorer la planète, nous devrions réduire notre consommation de viande.']
          - text: '**Vouloir** → *je voudrais* : un **souhait**.'
            examples: [Je voudrais vivre à la campagne.]
          - text: 'Après ces verbes, on met directement l’**infinitif** (sans *de*).'
            examples: [Nous devrions utiliser le vélo au lieu de la voiture.]
          - text: '**Donner des solutions :**'
            examples:
              - Pour améliorer la planète, nous devrions + infinitif.
              - Je pourrais + infinitif.
              - Nous pourrions + infinitif.
          - text: '**Persuader** (lettre, campagne) :'
            examples: [Je vous propose de…, Il est important de…, Nous devrions envisager de…]
          - text: '**Argumenter, débattre :**'
            examples:
              [
                Que se passerait-il si… ?,
                'Si nous ne faisions rien, …',
                'Si nous changions nos habitudes, …',
              ]
      - id: vocab-key
        type: callout
        tone: info
        title: Vocabulaire essentiel
        text: 'l’environnement, la nature, la pollution, le recyclage, l’énergie, l’eau, l’air pur, la biodiversité, les ressources, les habitudes, les déchets, les transports en commun, réutiliser, réduire, planter, protéger, conserver'
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Révise les deux compétences avec le groupe et demande un nouvel exemple pour chaque règle, sur un geste écologique de chaque élève.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: developpement-durable-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie un message et envoie-le. Mori va te poser des questions ; réponds à toutes.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Étape 1 : Présentation'
        intro: 'Complète le message avec ton prénom et une chose que tu pourrais faire pour protéger l’environnement. Exemple : *Je m’appelle Ana. Je pourrais utiliser moins de sacs en plastique.*'
        message: Bonjour Mori, comment ça va ? Je m’appelle ___. Pour protéger l’environnement, je pourrais ___. Corrige ma phrase, s’il te plaît, et pose-moi une question sur mon idée.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Étape 2 : Questions de pratique'
        intro: 'Réponds avec *je vivrais…*, *nous pourrions* + infinitif, *je ferais…* et *le gouvernement ferait…*'
        message: |-
          Bonjour Mori, je veux pratiquer le conditionnel présent. Pose-moi ces questions une par une :
          1. Dans ton monde idéal, tu vivrais à la campagne ou en ville ? Pourquoi ?
          2. Comment pourrait-on mieux protéger l’environnement ?
          3. Que ferais-tu pour convaincre les gens de recycler davantage ?
          4. Que ferait le gouvernement s’il écoutait tes idées ?
          Après chaque réponse, corrige mes erreurs et pose-moi une question de suivi.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Étape 3 : Nous devrions être meilleurs'
        intro: 'Ensuite, écris tes 3 phrases. Exemple : *Pour améliorer la planète, nous devrions planter plus d’arbres. Pour améliorer la planète, nous devrions utiliser le vélo au lieu de la voiture.*'
        message: Bonjour Mori, je vais t’écrire 3 phrases avec le modèle « Pour améliorer la planète, nous devrions + infinitif ». Corrige mes phrases et dis-moi ce qui se passerait si tout le monde le faisait.
      - id: mori-4
        type: aiTutorPrompt
        title: 'Étape 4 : Lettre pour une cause'
        intro: 'Ton mini-mail contient : une formule d’appel (*Monsieur / Madame…*), un problème environnemental, une proposition (*nous devrions / nous pourrions / je vous propose de…*), un argument (*parce que / puisque…*) et une formule de fin (*Cordialement / salutations distinguées…*).'
        message: Bonjour Mori, je vais t’écrire un mini-mail formel à un maire pour proposer une action écologique. Vérifie qu’il contient une formule d’appel, un problème, une proposition, un argument et une formule de fin. Corrige mes erreurs, puis réponds-moi comme si tu étais le maire.
      - id: mori-5
        type: aiTutorPrompt
        title: 'Étape 5 : Débat vert'
        intro: 'Complète d’abord : *Si j’étais président(e), je pourrais… / je ferais… / j’interdirais…*'
        message: |-
          Bonjour Mori, je vais t’écrire trois phrases qui commencent par « Si j’étais président(e) ». Corrige-les, puis pose-moi ces deux questions :
          Que se passerait-il si les gens ne respectaient pas la loi ?
          Comment convaincrais-tu les citoyens ?
          Vérifie que j’utilise l’imparfait après « si » et le conditionnel dans l’autre partie de la phrase.
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
