activities:
  - slug: education-passe
    title: 'Passé composé et imparfait : mon parcours scolaire'
    minutes: 8
    items:
      - id: avais-peur
        type: multipleChoice
        prompt: Quand j’étais au collège, j’___ souvent peur de parler en classe.
        options:
          - { text: avais, correct: true }
          - {
              text: ai eu,
              feedback: '*Quand j’étais au collège* et *souvent* parlent d’une habitude : on utilise l’imparfait, *j’avais*.',
            }
          - {
              text: aurai,
              feedback: '*J’aurai* est au futur. Pour une habitude dans le passé, on utilise l’imparfait : *j’avais*.',
            }
      - id: avez-propose
        type: multipleChoice
        prompt: En 2020, vous ___ de participer à un concours de langues.
        options:
          - { text: m’avez proposé, correct: true }
          - {
              text: me proposiez,
              feedback: '*En 2020* est un moment précis et l’action est terminée : on utilise le passé composé, *vous m’avez proposé*.',
            }
          - {
              text: me proposez,
              feedback: '*Vous me proposez* est au présent. Pour un événement précis du passé, on dit *vous m’avez proposé*.',
            }
      - id: ai-participe
        type: fillBlank
        prompt: Complète avec le verbe *participer* au passé composé.
        text: L’année dernière, j’___ à un projet en groupe.
        blanks: [[ai participé]]
      - id: imparfait-usage
        type: trueFalse
        prompt: L’imparfait sert à décrire une situation, une habitude ou un contexte dans le passé.
        answer: true
        feedback:
          correct: 'Bravo ! Par exemple : *Le professeur expliquait très bien. Nous travaillions souvent en groupe.*'
          incorrect: 'Si, c’est vrai : l’imparfait décrit le contexte ou une habitude (*Nous travaillions souvent en groupe*). Le passé composé raconte un événement précis.'
      - id: participes
        type: matching
        prompt: Associe chaque verbe à son participe passé.
        pairs:
          - [avoir, eu]
          - [être, été]
          - [apprendre, appris]
          - [comprendre, compris]
          - [faire, fait]
      - id: est-entree
        type: multipleChoice
        prompt: En 2019, ma sœur ___ à l’université.
        options:
          - { text: est entrée, correct: true }
          - {
              text: a entré,
              feedback: 'Le verbe *entrer* se conjugue avec *être* au passé composé : *elle est entrée*.',
            }
          - {
              text: est entré,
              feedback: 'Avec *être*, le participe s’accorde avec le sujet. *Ma sœur* est féminin : *elle est entrée*.',
            }
      - id: aimais
        type: fillBlank
        prompt: Complète avec le verbe *aimer* à l’imparfait (une habitude, une description).
        text: Quand j’étais enfant, j’___ beaucoup l’école.
        blanks: [[aimais]]
      - id: ordre-professeur
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: J’ai eu un professeur formidable.

  - slug: education-futur
    title: 'Futur proche et futur simple : projets et prédictions'
    minutes: 8
    items:
      - id: vais-etudier
        type: multipleChoice
        prompt: L’année prochaine, je ___ étudier la psychologie.
        options:
          - { text: vais, correct: true }
          - { text: vas, feedback: '*Vas* est pour *tu*. Pour *je*, on dit *je vais* + infinitif.' }
          - {
              text: va,
              feedback: '*Va* est pour *il / elle*. Pour *je*, on dit *je vais* + infinitif.',
            }
      - id: sera
        type: fillBlank
        prompt: Complète avec le verbe *être* au futur simple (une prédiction).
        text: Dans le futur, l’école ___ plus numérique.
        blanks: [[sera]]
      - id: futurs-irreguliers
        type: matching
        prompt: Associe chaque verbe à sa forme au futur simple.
        pairs:
          - [être (l’école), sera]
          - [avoir (les jeunes), auront]
          - [devoir (les professeurs), devront]
          - [devenir (l’éducation), deviendra]
          - [apprendre (les élèves), apprendront]
      - id: projet-prediction
        type: trueFalse
        prompt: 'On utilise le futur proche (*aller* + infinitif) pour un projet ou une intention, et le futur simple pour une prédiction.'
        answer: true
        feedback:
          correct: 'Bravo ! *Je vais commencer un cours* (projet). *L’éducation changera beaucoup* (prédiction).'
          incorrect: 'C’est vrai : *Je vais commencer un cours* (projet, futur proche). *L’éducation changera beaucoup* (prédiction, futur simple).'
      - id: prediction
        type: multipleChoice
        prompt: Quelle phrase est une prédiction au futur simple ?
        options:
          - { text: L’éducation changera beaucoup., correct: true }
          - {
              text: Je vais commencer un cours.,
              feedback: 'Cette phrase est au futur proche (*aller* + infinitif) : c’est un projet. Le futur simple, c’est *changera, sera, apprendront*…',
            }
          - {
              text: 'Quand j’étais au lycée, j’aimais l’histoire.',
              feedback: 'Cette phrase est à l’imparfait (passé). Le futur simple, c’est *changera, sera, apprendront*…',
            }
      - id: allons
        type: fillBlank
        prompt: Complète avec le verbe *aller* au présent (futur proche).
        text: Nous ___ moderniser les écoles.
        blanks: [[allons]]
      - id: ameliorera
        type: multipleChoice
        prompt: Je vais faire une formation et cela ___ mes compétences.
        options:
          - { text: améliorera, correct: true }
          - {
              text: améliorait,
              feedback: '*Améliorait* est à l’imparfait (passé). La formation est un projet et le résultat est au futur simple : *améliorera*.',
            }
          - {
              text: améliorer,
              feedback: 'Ici, il faut un verbe conjugué au futur simple : *cela améliorera*.',
            }
      - id: ordre-en-ligne
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Les élèves apprendront davantage en ligne.
