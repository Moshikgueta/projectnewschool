activities:
  - slug: ecriture-creative-recit
    title: 'Les temps du récit : passé composé, imparfait, plus-que-parfait, conditionnel'
    minutes: 8
    items:
      - id: nuit-pluvieuse
        type: multipleChoice
        prompt: ___ une nuit pluvieuse et tout le monde était silencieux.
        options:
          - { text: C’était, correct: true }
          - {
              text: Ça a été,
              feedback: 'Pour décrire le contexte (le temps qu’il fait, l’ambiance), on utilise l’imparfait : *c’était*.',
            }
          - {
              text: C’est,
              feedback: '*C’est* est au présent. Dans un récit au passé, la description est à l’imparfait : *c’était*.',
            }
      - id: ombre
        type: multipleChoice
        prompt: Hier soir, j’___ une ombre dans la bibliothèque.
        options:
          - { text: ai vu, correct: true }
          - {
              text: avais vu,
              feedback: 'Le plus-que-parfait sert à une action antérieure à une autre action passée. Ici, c’est un fait ponctuel : *j’ai vu*.',
            }
          - {
              text: voyais,
              feedback: 'L’imparfait sert aux descriptions et aux habitudes. Ici, c’est un fait ponctuel : *j’ai vu*.',
            }
      - id: avait-disparu
        type: fillBlank
        prompt: Complète avec le verbe *disparaître* au plus-que-parfait.
        text: Quand je suis arrivé(e), l’objet ___ déjà ___.
        blanks: [[avait], [disparu]]
      - id: s-etait-eteinte
        type: fillBlank
        prompt: Complète avec le verbe *s’éteindre* au plus-que-parfait.
        text: Quand je suis arrivé(e), la lumière ___ déjà éteinte.
        blanks: [[s’était, s'était]]
      - id: temps-usages
        type: matching
        prompt: Associe chaque temps à son usage.
        pairs:
          - [passé composé, un fait ponctuel]
          - [imparfait, une description ou le contexte]
          - [plus-que-parfait, une action antérieure à une autre action passée]
          - [conditionnel, une hypothèse ou une information non confirmée]
          - [présent de narration, un récit plus vivant]
      - id: serait-entre
        type: trueFalse
        prompt: 'Dans *Le voleur serait entré par la fenêtre*, le détective présente une information **sûre**.'
        answer: false
        feedback:
          correct: 'Bravo ! Le conditionnel (*serait entré*) présente une hypothèse ou une information non confirmée.'
          incorrect: 'Attention : le conditionnel (*serait entré*) présente une hypothèse ou une information non confirmée, pas une information sûre.'
      - id: traces
        type: fillBlank
        prompt: Complète avec *laisser* au conditionnel passé.
        text: S’il avait forcé la porte, il ___ des traces.
        blanks: [[aurait laissé]]
      - id: perspective
        type: multipleChoice
        prompt: 'Phrase à la 1ʳᵉ personne : *J’ai vu le voleur entrer par la fenêtre.* Quelle phrase raconte la même chose à la 3ᵉ personne ?'
        options:
          - { text: Le témoin a vu le voleur entrer par la fenêtre., correct: true }
          - {
              text: Nous avons vu le voleur entrer par la fenêtre.,
              feedback: '*Nous* est la 1ʳᵉ personne du pluriel. À la 3ᵉ personne, on dit *il / elle* ou *le témoin*.',
            }
          - {
              text: Tu as vu le voleur entrer par la fenêtre.,
              feedback: '*Tu* est la 2ᵉ personne. À la 3ᵉ personne, on dit *il / elle* ou *le témoin*.',
            }

  - slug: ecriture-creative-connecteurs
    title: 'Les connecteurs narratifs'
    minutes: 8
    items:
      - id: fonctions
        type: matching
        prompt: Associe chaque connecteur à sa fonction.
        pairs:
          - [cependant, contraste]
          - [ensuite, chronologie]
          - [puisque, cause]
          - [à condition que, condition]
          - [afin de, but]
      - id: fatigue
        type: fillBlank
        prompt: Complète avec un connecteur de contraste.
        text: J’étais fatigué(e) ; ___, je n’arrivais pas à dormir.
        blanks: [[cependant, pourtant, néanmoins]]
      - id: sequence
        type: fillBlank
        prompt: Complète avec *d’abord*, *ensuite* et *finalement*.
        text: ___, j’ai entendu un bruit. ___, la lumière s’est éteinte. ___, tout est devenu silencieux.
        blanks: [[D’abord, d’abord, D'abord, d'abord], [Ensuite, ensuite], [Finalement, finalement]]
      - id: afin-de
        type: multipleChoice
        prompt: J’écris tous les jours ___ progresser en français.
        options:
          - { text: afin de, correct: true }
          - {
              text: pour que,
              feedback: '*Pour que* est suivi d’un verbe conjugué (au subjonctif). Avec un infinitif (*progresser*), on dit *afin de* ou *pour*.',
            }
          - {
              text: puisque,
              feedback: '*Puisque* exprime la cause, pas le but. Pour le but + infinitif : *afin de progresser*.',
            }
      - id: puisque
        type: multipleChoice
        prompt: ___ la porte était fermée, le voleur est entré par la fenêtre.
        options:
          - { text: Puisque, correct: true }
          - {
              text: Cependant,
              feedback: '*Cependant* exprime un contraste. Ici, la porte fermée est la cause : *Puisque…*',
            }
          - {
              text: Finalement,
              feedback: '*Finalement* marque la fin d’une séquence. Ici, on explique la cause : *Puisque…*',
            }
      - id: en-cas-de
        type: trueFalse
        prompt: '*En cas de* est suivi d’un nom : *En cas de problème, appelle la police.*'
        answer: true
        feedback:
          correct: 'Bravo ! *En cas de* + nom (*en cas de problème, en cas d’orage*).'
          incorrect: 'C’est vrai : *en cas de* est suivi d’un nom (*en cas de problème, en cas d’orage*).'
      - id: par-consequent
        type: multipleChoice
        prompt: Il pleuvait très fort ; ___, la bibliothèque était vide.
        options:
          - { text: par conséquent, correct: true }
          - {
              text: malgré le fait que,
              feedback: '*Malgré le fait que* exprime un contraste. La bibliothèque vide est une conséquence de la pluie : *par conséquent*.',
            }
          - {
              text: d’abord,
              feedback: '*D’abord* commence une séquence. Ici, on exprime une conséquence : *par conséquent*.',
            }
      - id: ordre-opinion
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Pour moi, écrire est une manière de m’exprimer.
