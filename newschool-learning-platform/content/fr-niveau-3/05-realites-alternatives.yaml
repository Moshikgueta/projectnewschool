# Cycle "Réalités alternatives", converted from the French level 3 digital notebook
# ("Cahier digital 2026 - français niveau 3", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-3
slug: realites-alternatives
title: Réalités alternatives
goal: Faire des hypothèses sur le présent avec si + imparfait et le conditionnel présent, et sur le passé avec si + plus-que-parfait et le conditionnel passé.
position: 5
status: published

review:
  - >-
    The two workbook exercises ("Si + imparfait, conditionnel présent" and "Si +
    plus-que-parfait, conditionnel passé") are NEW: the notebook has no self-study
    exercises. They were written from the cycle's summary rules, the activity models and
    the vocabulary. Please check level, wording and every right answer before students
    see them.
  - >-
    Summary, common mistake 1 was wrong: it gave "Si je suis riche, je voyagerai" as
    INCORRECT. That sentence is correct French (si + présent, futur: a real
    possibility). The mistake is now "Si je serais riche, je voyagerais" (conditionnel
    after si) → "Si j’étais riche, je voyagerais", with a note that "Si je suis riche,
    je voyagerai" is correct but means something possible, not imaginary.
  - >-
    Summary, skill 2: "Conditionnel passé : j’aurais + participe passé" was incomplete.
    Now: avoir OR être au conditionnel présent + participe passé (j’aurais voyagé, je
    serais allé(e), nous serions parti(e)s), with agreement after être. Added (please
    confirm): the formation of the plus-que-parfait (avoir / être à l’imparfait +
    participe passé), two conjugation tables, and a rule on mixed hypotheses (si +
    plus-que-parfait, conditionnel présent: "Si j’avais accepté le travail à New York,
    je travaillerais maintenant à Wall Street"; "Si ___ ne s’était pas produit, le monde
    serait complètement différent aujourd’hui"), which the notebook uses in Activity 3
    and the warm-up without explaining. Common mistake 2 "Si j’avais étudié, j’aurais
    aller → je serais allé" now says why (participle + être with aller) and completes the
    sentence: "je serais allé(e) à l’université".
  - >-
    Corrections: "La classe vote pour quel monde serait" → "La classe vote pour le monde
    qui serait" (Activity 2); "Moi aussi j’aurais choisi" → "Moi aussi, j’aurais
    choisi"; "la Guerre froide", "la chute du Mur de Berlin" → "la guerre froide", "la
    chute du mur de Berlin"; "je serais plus détendu" → "détendu(e)"; Mori model "Si j’avais plus pratiqué,
    j’aurais gagné le match" → "Si je m’étais plus entraîné(e)" (pratiquer needs an
    object here). "étudiants" and "élèves" were both used for the
    learners; student-facing text says "élèves". Straight apostrophes and quotes were
    made typographic.
  - >-
    The skill names were shortened: "Hypothèse éventuellement réalisable + situation
    irréelle" → "Hypothèses sur le présent et le futur"; "Hypothèse non réalisée dans le
    passé, regrets, situations irréelles du passé" → "Hypothèses sur le passé et
    regrets". The repeated "Structure : …" headers before each warm-up block and
    activity are kept once in each activity's steps and in the summary.
  - >-
    Homework: in this cycle the source speaks of "Question du professeur" and "audio pour
    le professeur" under "Devoirs avec Mori". It was turned into Mori messages (like the
    other cycles), with the teacher’s question and model in the intro. The empty
    "À toi maintenant 1–3" lines are left out (the student writes in the Mori chat).
    Please confirm, or tell us if this homework should go to the teacher instead.
  - >-
    "Pour les élèves plus avancés" extra sentences (Activities 1 and 3) are kept in a
    "Pour aller plus loin" list. The creative variations A / B / C (Activities 1, 3, 4)
    and the vote (Activity 2) are kept in callouts. The "Objectifs" lists are summed up
    in the teacher notes. The "Réponse de l’élève 1/2/3" lines and the empty "Date /
    Participants" lines were left out.
  - >-
    Times (ranges recorded as the upper value): Activity 1 = 5 + 7 + 8 = 20; Activity 2
    = 8 + 6 + 6 = 20; Activity 3 = 5 + 7 + 8 = 20; Activity 4 = 5 + 8 + 8 + 5
    (optional) = 26. Intro 5 minutes. The notebook does not say how many activities to
    choose.
  - >-
    Vocabulary: "Intelligence artificielle" was left out (it belongs to the previous
    cycle). "Conditionnel – מותנה" → "דרך התנאי"; "Conséquence" and "Résultat" were both
    "תוצאה": "Conséquence" is now "השלכה / תוצאה"; "Modifier / changer – להחליף" →
    "לשנות" (להחליף = to replace); "Réinventer – לדמיין מחדש" → "להמציא מחדש"; "Faux –
    מזויף" → "לא נכון / מזויף"; "Récit – נרטיב" → "סיפור / נרטיב". The Quizlet link is
    kept without its tracking parameters. Please confirm the glosses.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: realites-alternatives-classe
    title: 'Classe : Réalités alternatives'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Réalités alternatives
      - id: skills
        type: cycleOverview
        skills:
          - name: 'Hypothèses sur le présent et le futur : si + imparfait, conditionnel présent'
            description: '*Si j’avais des ailes, je voyagerais dans le monde entier.*'
          - name: 'Hypothèses sur le passé et regrets : si + plus-que-parfait, conditionnel passé'
            description: '*Si j’avais plus étudié, j’aurais réussi l’examen.*'
      - id: quizlet
        type: externalLink
        label: Réalités alternatives sur Quizlet
        url: https://quizlet.com/il/1132128525/extreme-french-2026-realites-alternatives-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. Si je ___, ma vie serait plus / moins ___.
        example: Je m’appelle Lévanah. Si je pouvais voyager gratuitement, ma vie serait plus agréable.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup-1-rule
        type: callout
        tone: info
        title: '1. Hypothèses sur le présent et le futur : si + imparfait, conditionnel présent'
        text: |-
          *Si j’avais des ailes, je voyagerais dans le monde entier.*
          *Si tu étais président, tu changerais beaucoup de choses.*
          **Conseil :** imagine des choses qui ne sont pas réelles maintenant.
      - id: warmup-1
        type: discussionQuestions
        items:
          - question: Si tu pouvais changer une chose dans ta vie, qu’est-ce que ce serait ?
            frame: Si je pouvais changer une chose, ce serait ___.
          - question: Si tu pouvais échanger ta vie avec quelqu’un pour une journée, qui serait cette personne et pourquoi ?
            frame: Si je pouvais échanger ma vie, ce serait avec ___ parce que ___.
          - question: Si tu pouvais vivre dans un livre, une série télévisée ou un film, lequel choisirais-tu et pourquoi ?
            frame: Je choisirais ___ parce que ___.
          - question: Si tu pouvais inventer une nouvelle technologie, qu’est-ce que ce serait et comment changerait-elle le monde ?
            frame: J’inventerais ___. Le monde ___.
          - question: Si tu devais déménager dans un autre pays demain, où irais-tu et que ferais-tu là-bas ?
            frame: J’irais en / au ___ et je ___.
          - question: Si tu pouvais éliminer un problème mondial (pauvreté, pollution, guerres), lequel choisirais-tu et pourquoi ?
            frame: J’éliminerais ___ parce que ___.
      - id: warmup-2-rule
        type: callout
        tone: info
        title: '2. Hypothèses sur le passé et regrets : si + plus-que-parfait, conditionnel passé'
        text: |-
          On parle de situations qui se sont déjà produites et qu’on ne peut pas changer : on imagine seulement comment elles auraient été différentes.
          *Si j’avais plus étudié, j’aurais réussi l’examen.*
          *Si nous étions partis plus tôt, nous n’aurions pas raté le train.*
          **Conseil :** tu ne peux pas modifier le passé, mais imagine ce qui aurait pu arriver si les choses s’étaient passées différemment.
      - id: warmup-2
        type: discussionQuestions
        items:
          - question: Si tu avais pu choisir de rencontrer une personne célèbre dans le passé, qui aurait été cette personne et que lui aurais-tu dit ?
            frame: J’aurais rencontré ___ et je lui aurais dit ___.
          - question: Si tu étais né(e) à une autre époque historique, en quoi ta vie aurait-elle été différente ?
            frame: Si j’étais né(e) au ___ siècle, j’aurais ___.
          - question: Si tu avais pris une décision différente à l’adolescence, que se serait-il passé ensuite ?
            frame: Si j’avais ___, je / j’ ___.
          - question: Si les smartphones n’avaient pas existé, qu’est-ce qui aurait été différent dans ta vie ?
            frame: Sans smartphone, j’aurais ___.
          - question: Complète la phrase.
            frame: Si ___ ne s’était pas produit, le monde serait complètement différent aujourd’hui.
          - question: Que signifie pour toi l’histoire alternative ?
            frame: Pour moi, l’histoire alternative, c’est ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : La vie parallèle'
        skills: ['Hypothèses sur le présent et le futur : si + imparfait, conditionnel présent']
        minutes: 20
        steps:
          - 'Imagine que tu peux changer un aspect de ta vie en ce moment. Structure : **si + imparfait, conditionnel présent**.'
          - '**Production individuelle (5 minutes) :** complète au moins trois phrases (ci-dessous).'
          - '**Entretiens en binômes (7 minutes) :** interviewez-vous : *Pourquoi changerais-tu cela ? Comment ta vie s’améliorerait-elle ? Quels problèmes rencontrerais-tu dans cette nouvelle réalité ? Comment serait ta vie si ce souhait se réalisait ? Que ferais-tu en premier ? Qui réagirait différemment dans ta vie ?*'
          - '**Variation créative (8 minutes) :** le professeur choisit une des options ci-dessous.'
        example: |-
          *Si j’avais plus de temps, j’étudierais une autre langue.*
          *Si j’étais Messi pour une journée, je jouerais au Camp Nou.*
          *Si je vivais au Japon, je mangerais des sushis tous les jours.*
      - id: act1-sentences
        type: discussionQuestions
        title: Ma vie parallèle
        items:
          - question: Si j’avais plus de temps, ___.
          - question: Si j’étais une autre personne pour une journée, ___.
          - question: Si je vivais dans un autre endroit, ___.
          - question: 'Pour aller plus loin : Si je pouvais apprendre n’importe quelle compétence, ___.'
          - question: 'Pour aller plus loin : Si je ne devais pas étudier / travailler, ___.'
      - id: act1-variations
        type: callout
        tone: info
        title: Variation créative (au choix)
        text: |-
          **A. Galerie de mondes alternatifs :** chaque binôme écrit sa phrase préférée sur une carte (*Si je vivais à Paris, je travaillerais dans la mode.*). On affiche les cartes au mur ; la classe se promène, lit et vote pour la plus originale.
          **B. Jeu du changement inattendu :** le professeur annonce une catégorie surprise (argent, profession, famille, super-pouvoir) et les élèves improvisent une phrase : *Si j’avais un super-pouvoir, je volerais vers… / Si je changeais de profession, je serais…*
          **C. Jeu de rôle parallèle :** deux élèves jouent comme s’ils vivaient déjà dans cette réalité parallèle : *— Si je vivais à la plage, je serais plus détendu(e). — Vraiment ? Alors je te rendrais visite tous les jours.*
      - id: act2
        type: classActivity
        title: 'Activité 2 : Réalité alternative collective'
        skills: ['Hypothèses sur le présent et le futur : si + imparfait, conditionnel présent']
        minutes: 20
        steps:
          - 'Imaginez en groupe un monde complètement différent. Structure : **si + imparfait, conditionnel présent**.'
          - '**Création en groupes (8 minutes) :** en groupes de 3 ou 4, inventez **trois changements radicaux** pour la réalité actuelle. Écrivez chaque changement au conditionnel. Idées : société (*Si les écoles n’existaient pas…*), technologie (*Si les robots gouvernaient…*), environnement (*Si le plastique n’existait pas…*), culture (*Si tous les films étaient des comédies musicales…*).'
          - '**Développement (6 minutes) :** organisez vos phrases dans un **mini-manifeste** de votre « nouveau monde ». Utilisez des comparatifs : *Le monde serait beaucoup plus propre. La vie serait moins compliquée.*'
          - '**Présentation (6 minutes) :** présentez votre réalité alternative à la classe : exposé oral, affiche ou mini-poster, ou jeu de rôle (*Dans notre monde, l’argent n’existe pas, donc j’échange une pizza contre des cours de français.*).'
        example: |-
          *Si l’argent n’existait pas, les gens échangeraient des biens.*
          *Si les humains volaient, les villes seraient plus petites.*
          *Si les animaux parlaient, les humains apprendraient leurs langues.*
      - id: act2-sentences
        type: discussionQuestions
        title: Notre nouveau monde
        items:
          - question: Changement 1
            frame: Si ___ (imparfait), ___ (conditionnel présent).
          - question: Changement 2
            frame: Si ___ (imparfait), ___ (conditionnel présent).
          - question: Changement 3
            frame: Si ___ (imparfait), ___ (conditionnel présent).
          - question: Dans notre monde, la vie serait…
            frame: Le monde serait beaucoup plus / moins ___.
      - id: act2-vote
        type: callout
        tone: info
        title: 'Variation : le vote des mondes alternatifs'
        text: La classe vote pour le monde qui serait **le plus amusant**, **le plus utopique** et **le plus dystopique**.
      - id: act3
        type: classActivity
        title: 'Activité 3 : L’effet papillon personnel'
        skills: ['Hypothèses sur le passé et regrets : si + plus-que-parfait, conditionnel passé']
        minutes: 20
        steps:
          - 'Réfléchis à des décisions passées qu’on ne peut pas changer, et imagine comment elles auraient modifié ta vie. Structure : **si + plus-que-parfait, conditionnel passé**.'
          - '**Production individuelle (5 minutes) :** complète au moins trois phrases (ci-dessous).'
          - '**Échange en petits groupes (7 minutes) :** en groupes de 3 ou 4, partagez vos phrases et cherchez des coïncidences ou des surprises (*Moi aussi, j’aurais choisi une autre carrière ! / Je n’aurais jamais fait ça !*). Posez des questions de suivi : *Pourquoi ne l’as-tu pas fait ? Comment ta vie aurait-elle changé exactement ?*'
          - '**Variation créative (8 minutes) :** le professeur choisit une des options ci-dessous.'
        example: |-
          *Si j’avais étudié la médecine, j’aurais été médecin.*
          *Si j’avais accepté ce travail, j’aurais vécu à Madrid.*
          *Si j’avais rencontré Messi, j’aurais pris une photo avec lui.*
      - id: act3-sentences
        type: discussionQuestions
        title: Mon effet papillon
        items:
          - question: Si j’avais pris une autre décision à l’école, j’aurais…
          - question: Si j’avais accepté une opportunité, j’aurais…
          - question: Si j’avais rencontré une certaine personne, ma vie aurait…
          - question: 'Pour aller plus loin : Si j’avais voyagé dans un autre pays quand j’étais jeune, j’aurais…'
          - question: 'Pour aller plus loin : Si j’avais étudié autre chose, j’aurais…'
          - question: 'Pour aller plus loin : Si j’avais fait quelque chose de différent la semaine dernière, j’aurais…'
      - id: act3-variations
        type: callout
        tone: info
        title: Variation créative (au choix)
        text: |-
          **A. Carte du destin :** chaque groupe écrit ses phrases les plus intéressantes sur des cartes. On les place au mur ou au tableau pour former une « ligne du temps alternative ».
          **B. Jeu du « et alors » :** un élève dit : *Si j’avais étudié l’art, j’aurais peint des tableaux.* Un autre continue : *Et si tu avais peint des tableaux, tu aurais exposé tes œuvres dans un musée.* On construit une chaîne de réalités alternatives.
          **C. Jeu de rôle historique personnel :** chaque élève parle comme s’il vivait maintenant cette vie alternative : *Si j’avais accepté le travail à New York, je travaillerais maintenant à Wall Street.*
      - id: act4
        type: classActivity
        title: 'Activité 4 : Histoire alternative mondiale'
        skills: ['Hypothèses sur le passé et regrets : si + plus-que-parfait, conditionnel passé']
        minutes: 26
        steps:
          - 'Imaginez en groupe comment le monde aurait changé si un événement historique s’était terminé autrement. Structure : **si + plus-que-parfait, conditionnel passé**.'
          - '**Choix de l’événement (5 minutes) :** choisissez un événement important. Découverte : la découverte de l’Amérique par Christophe Colomb, les premiers pas sur la Lune. Invention : l’électricité, Internet, l’imprimerie. Guerre et politique : la Seconde Guerre mondiale, la guerre froide, la chute du mur de Berlin.'
          - '**Production en groupe (8 minutes) :** écrivez **trois phrases** au conditionnel passé.'
          - '**Présentation (8 minutes) :** chaque groupe lit sa « réalité historique alternative ». Les autres posent des questions : *Et qu’est-ce qui se serait passé avec l’économie ? Comment la culture aurait-elle été différente ?*'
          - '**Variation créative (facultatif, 5 minutes) :** A. Exposition visuelle : chaque groupe dessine un symbole ou un mini-poster de son monde alternatif (par exemple, une carte de l’Europe sans l’Amérique). B. Journal télévisé alternatif : un élève présente les nouvelles comme s’il vivait dans cette réalité (*Aujourd’hui, en 2025, nous continuons à communiquer par lettres parce qu’Internet n’a jamais existé…*).'
        example: |-
          *Si l’Amérique n’avait pas été découverte, l’Europe aurait continué à commercer seulement avec l’Asie.*
          *Si Internet n’avait pas existé, la communication aurait été beaucoup plus lente.*
          *Si la Seconde Guerre mondiale s’était terminée autrement, la carte politique aurait complètement changé.*
      - id: act4-sentences
        type: discussionQuestions
        title: Notre histoire alternative
        items:
          - question: Phrase 1
            frame: Si ___ (plus-que-parfait), ___ (conditionnel passé).
          - question: Phrase 2
            frame: Si ___ (plus-que-parfait), ___ (conditionnel passé).
          - question: Phrase 3
            frame: Si ___ (plus-que-parfait), ___ (conditionnel passé).
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Deux compétences dans ce cycle : **si + imparfait, conditionnel présent**
          (hypothèses sur le présent et le futur : échauffement 1, activités 1 et 2) et
          **si + plus-que-parfait, conditionnel passé** (hypothèses sur le passé, regrets :
          échauffement 2, activités 3 et 4). Le cahier ne dit pas combien d’activités
          choisir : chaque activité dure environ 20 minutes. Rappelle souvent la règle : jamais
          de futur ni de conditionnel après *si*.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: >-
          Deux phrases par élève, 30 secondes maximum par élève et par enseignant. Si les
          élèves se connaissent déjà, passe directement aux questions d’échauffement.
      - id: n-warmup
        anchor: warmup-title
        text: >-
          Lis chaque règle avec le groupe avant les questions. La question « Si ___ ne
          s’était pas produit, le monde serait… aujourd’hui » mélange les deux temps (passé →
          conséquence présente) : explique-le si un élève pose la question.
      - id: n-act1
        anchor: act1
        minutes: 20
        text: >-
          Donne d’abord tes propres exemples. Les phrases « Pour aller plus loin » sont pour
          les élèves plus avancés. Tu peux distribuer les questions de l’entretien sur une
          mini-fiche. Objectifs : pratiquer *si* + imparfait, conditionnel présent ; encourager
          la créativité et l’interaction ; relier le personnel et l’imaginaire.
      - id: n-act2
        anchor: act2
        minutes: 20
        text: >-
          Donne les catégories (société, technologie, environnement, culture) aux groupes qui
          manquent d’idées. Objectifs : utiliser le conditionnel présent pour des hypothèses
          sur le présent et le futur ; pratiquer le vocabulaire abstrait (utopie, dystopie,
          changement, société, technologie) ; travailler en groupe et comparer les idées.
      - id: n-act3
        anchor: act3
        minutes: 20
        text: >-
          Les phrases « Pour aller plus loin » sont pour les élèves avancés. L’option C
          utilise une hypothèse mixte (*si* + plus-que-parfait, conditionnel présent) :
          voir le résumé. Objectifs : pratiquer le conditionnel passé à partir
          d’expériences personnelles et comparer des vies alternatives avec la réalité.
      - id: n-act4
        anchor: act4
        minutes: 26
        text: >-
          Tu peux donner la liste d’événements pour inspirer les groupes ou les laisser
          choisir librement. Objectifs : pratiquer le conditionnel passé dans des contextes
          culturels et historiques et relier la grammaire à l’histoire, à la politique, aux
          inventions et à la société.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: realites-alternatives-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: rules-present
        type: ruleSummary
        skill: 'Hypothèses sur le présent et le futur : si + imparfait, conditionnel présent'
        rules:
          - text: 'On l’utilise pour parler de situations **irréelles, peu probables ou imaginaires** dans le présent ou le futur. Structure : **si + imparfait, conditionnel présent**.'
            examples:
              - Si j’avais plus de temps, j’étudierais une autre langue.
              - Si je vivais au Japon, je mangerais des sushis tous les jours.
              - Si les humains volaient, les villes seraient plus petites.
          - text: 'Conditionnel présent : **radical du futur + -ais, -ais, -ait, -ions, -iez, -aient**.'
            examples: ['serais, aurais, pourrais, ferais, changerais']
          - text: 'Pour commencer : *si j’étais…, si j’avais…, si je pouvais…*'
          - text: '**Attention : jamais de futur ni de conditionnel après *si*.**'
            examples:
              [
                'Incorrect : Si je serais riche, je voyagerais.',
                'Correct : Si j’étais riche, je voyagerais.',
              ]
          - text: 'Ne confonds pas avec **si + présent, futur**, qui parle d’une situation **réelle et possible**.'
            examples:
              [
                'Si je suis riche un jour, je voyagerai. (possible)',
                'Si j’étais riche, je voyagerais. (imaginaire)',
              ]
      - id: present-table
        type: table
        caption: 'Si + imparfait, conditionnel présent'
        header: [Personne, avoir (imparfait), voyager (conditionnel présent)]
        rows:
          - [je / j’, si j’avais, je voyagerais]
          - [tu, si tu avais, tu voyagerais]
          - [il / elle, s’il / si elle avait, il / elle voyagerait]
          - [nous, si nous avions, nous voyagerions]
          - [vous, si vous aviez, vous voyageriez]
          - [ils / elles, s’ils / si elles avaient, ils / elles voyageraient]
      - id: rules-passe
        type: ruleSummary
        skill: 'Hypothèses sur le passé et regrets : si + plus-que-parfait, conditionnel passé'
        rules:
          - text: 'On l’utilise pour parler de situations **passées qui ne se sont pas produites**, mais qui auraient pu changer les choses (et pour les **regrets**). Structure : **si + plus-que-parfait, conditionnel passé**.'
            examples:
              - Si j’avais étudié la médecine, j’aurais été médecin.
              - Si nous étions partis plus tôt, nous n’aurions pas raté le train.
              - Si l’Amérique n’avait pas été découverte, l’Europe aurait continué à commercer seulement avec l’Asie.
          - text: 'Plus-que-parfait : **avoir** ou **être** à l’**imparfait** + **participe passé**.'
            examples:
              [si j’avais étudié, si tu avais pris, si nous étions partis, si elle était née]
          - text: 'Conditionnel passé : **avoir** ou **être** au **conditionnel présent** + **participe passé**. Avec *être* (aller, partir, naître, verbes pronominaux…), le participe s’accorde avec le sujet.'
            examples:
              [
                j’aurais voyagé,
                tu aurais changé,
                nous aurions étudié,
                je serais allé(e),
                elle serait partie,
              ]
          - text: '**Attention : jamais de futur ni de conditionnel après *si*.** N’oublie pas le participe passé et le bon auxiliaire.'
            examples:
              - 'Incorrect : Si j’avais étudié, j’aurais aller à l’université.'
              - 'Correct : Si j’avais étudié, je serais allé(e) à l’université.'
          - text: 'Pour commencer : *si cela s’était passé…, j’aurais changé… / si cela ne s’était pas produit…, j’aurais été… / si j’avais eu l’opportunité…, j’aurais fait…*'
          - text: '**Hypothèse mixte :** une condition dans le passé avec une conséquence dans le présent → **si + plus-que-parfait, conditionnel présent**.'
            examples:
              - Si j’avais accepté le travail à New York, je travaillerais maintenant à Wall Street.
              - Si Internet n’avait pas été inventé, nous communiquerions encore par lettres.
      - id: passe-table
        type: table
        caption: 'Si + plus-que-parfait, conditionnel passé'
        header:
          [
            Personne,
            étudier (plus-que-parfait),
            réussir (conditionnel passé),
            partir (conditionnel passé),
          ]
        rows:
          - [je / j’, si j’avais étudié, j’aurais réussi, je serais parti(e)]
          - [tu, si tu avais étudié, tu aurais réussi, tu serais parti(e)]
          - [
              il / elle,
              s’il / si elle avait étudié,
              il / elle aurait réussi,
              il serait parti / elle serait partie,
            ]
          - [nous, si nous avions étudié, nous aurions réussi, nous serions parti(e)s]
          - [vous, si vous aviez étudié, vous auriez réussi, vous seriez parti(e)(s)]
          - [
              ils / elles,
              s’ils / si elles avaient étudié,
              ils / elles auraient réussi,
              ils seraient partis / elles seraient parties,
            ]
      - id: key-table
        type: table
        caption: Conditionnel présent ou conditionnel passé ?
        header: [Temps, Pour parler de…, Exemple]
        rows:
          - [
              Si + imparfait → conditionnel présent,
              'choses irréelles maintenant, mais imaginables dans le présent ou le futur',
              'Si j’avais des ailes, je voyagerais dans le monde entier.',
            ]
          - [
              Si + plus-que-parfait → conditionnel passé,
              'choses qui ne peuvent plus changer, parce qu’elles se sont passées autrement',
              'Si j’avais eu des ailes, j’aurais voyagé dans le monde entier.',
            ]
      - id: applications
        type: table
        caption: Les réalités alternatives
        header: [Domaine, Conditionnel présent, Conditionnel passé]
        rows:
          - [
              Personnel,
              'Si je vivais dans un autre pays, j’apprendrais une autre langue.',
              'Si j’avais accepté ce travail, j’aurais vécu à Madrid.',
            ]
          - [
              Global / historique,
              'Si les animaux parlaient, les humains apprendraient leurs langues.',
              'Si Internet n’avait pas existé, la communication aurait été plus lente.',
            ]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Révise les deux structures et demande à chaque élève une hypothèse sur le présent et un regret sur le passé.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: realites-alternatives-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie un message et envoie-le. Mori va te poser des questions ; réponds à toutes.
      - id: mori-present
        type: aiTutorPrompt
        title: 'Partie 1 : Conditionnel présent (hypothèse sur le présent ou le futur)'
        intro: 'Question : *Imagine que tu gagnes à la loterie. Que ferais-tu avec l’argent ?* Exemple : *Si je gagnais à la loterie, j’achèterais une maison à la plage. Si je gagnais à la loterie, je voyagerais dans le monde entier. Si je gagnais à la loterie, j’aiderais ma famille.*'
        message: >-
          Bonjour Mori, je veux pratiquer « si + imparfait, conditionnel présent ».
          Pose-moi la question : « Si tu gagnais à la loterie, que ferais-tu avec
          l’argent ? » Je vais t’écrire 3 phrases. Corrige mes phrases et pose-moi une
          question de suivi sur chacune.
      - id: mori-passe
        type: aiTutorPrompt
        title: 'Partie 2 : Conditionnel passé (hypothèse sur le passé)'
        intro: 'Question : *Imagine 3 choses qui auraient pu changer dans ta vie si tu avais pris des décisions différentes dans le passé.* Exemple : *Si j’avais étudié la médecine, j’aurais été médecin. Si j’avais voyagé au Japon, j’aurais appris le japonais. Si je m’étais plus entraîné(e), j’aurais gagné le match.*'
        message: >-
          Bonjour Mori, je veux pratiquer « si + plus-que-parfait, conditionnel passé ».
          Je vais t’écrire 3 choses qui auraient pu changer dans ma vie si j’avais pris des
          décisions différentes dans le passé. Corrige mes phrases, vérifie le participe
          passé et l’auxiliaire, et pose-moi une question de suivi.
      - id: mori-bonus
        type: aiTutorPrompt
        title: 'Partie 3 : Bonus (facultatif)'
        intro: 'Si tu peux, réponds à l’oral pendant une minute : une hypothèse au conditionnel présent (*Si je pouvais…, je ferais…*), une hypothèse au conditionnel passé (*Si j’avais…, j’aurais…*) et ton opinion.'
        message: >-
          Bonjour Mori, pose-moi la question : « Est-il utile d’imaginer des réalités
          alternatives ? Pourquoi ? » Je vais répondre en une minute avec une hypothèse au
          conditionnel présent, une hypothèse au conditionnel passé et mon opinion.
          Ensuite, corrige mes erreurs.
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          Tu veux plus de questions ? Envoie : **S’il te plaît, pose-moi encore des questions !**
          Tu ne comprends pas une explication ? Envoie : **Peux-tu m’expliquer en hébreu, mais avec la phrase en français ?**

