activities:
  - slug: realites-alternatives-present
    title: 'Si + imparfait, conditionnel présent'
    minutes: 8
    items:
      - id: plus-de-temps
        type: multipleChoice
        prompt: Si j’avais plus de temps, j’___ une autre langue.
        options:
          - { text: étudierais, correct: true }
          - {
              text: étudierai,
              feedback: '*Étudierai* est au futur. Après *si* + imparfait, on utilise le conditionnel présent : *j’étudierais*.',
            }
          - {
              text: étudiais,
              feedback: '*Étudiais* est à l’imparfait. L’imparfait va après *si* ; l’autre partie est au conditionnel : *j’étudierais*.',
            }
      - id: si-vivais
        type: multipleChoice
        prompt: Si je ___ au Japon, je mangerais des sushis tous les jours.
        options:
          - { text: vivais, correct: true }
          - {
              text: vivrais,
              feedback: 'Jamais de conditionnel après *si*. On utilise l’imparfait : *si je vivais*.',
            }
          - {
              text: vivrai,
              feedback: 'Jamais de futur après *si*. Pour une hypothèse imaginaire : *si je vivais* (imparfait).',
            }
      - id: humains
        type: fillBlank
        prompt: Complète avec *voler* à l’imparfait et *être* au conditionnel présent.
        text: Si les humains ___, les villes ___ plus petites.
        blanks: [[volaient], [seraient]]
      - id: riche
        type: trueFalse
        prompt: 'La phrase *Si je serais riche, je voyagerais* est correcte.'
        answer: false
        feedback:
          correct: 'Bravo ! Après *si*, jamais de conditionnel : *Si j’étais riche, je voyagerais.*'
          incorrect: 'Attention : après *si*, jamais de conditionnel. On dit : *Si j’étais riche, je voyagerais.*'
      - id: hypotheses
        type: matching
        prompt: Associe le début et la fin de chaque phrase.
        pairs:
          - [Si l’argent n’existait pas, les gens échangeraient des biens.]
          - [Si les animaux parlaient, les humains apprendraient leurs langues.]
          - [Si j’avais des ailes, je voyagerais dans le monde entier.]
          - [Si tu étais président, tu changerais beaucoup de choses.]
      - id: argent
        type: fillBlank
        prompt: Complète avec le verbe *exister* à l’imparfait.
        text: Si l’argent n’___ pas, les gens échangeraient des biens.
        blanks: [[existait]]
      - id: loterie
        type: fillBlank
        prompt: Complète avec *gagner* à l’imparfait et *acheter* au conditionnel présent.
        text: Si je ___ à la loterie, j’___ une maison à la plage.
        blanks: [[gagnais], [achèterais]]
      - id: ordre-villes
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Les villes seraient plus petites.

  - slug: realites-alternatives-passe
    title: 'Si + plus-que-parfait, conditionnel passé'
    minutes: 8
    items:
      - id: examen
        type: multipleChoice
        prompt: Si j’avais plus étudié, j’___ l’examen.
        options:
          - { text: aurais réussi, correct: true }
          - {
              text: avais réussi,
              feedback: '*Avais réussi* est au plus-que-parfait : il va après *si*. Dans l’autre partie, on met le conditionnel passé : *j’aurais réussi*.',
            }
          - {
              text: réussirais,
              feedback: '*Réussirais* est au conditionnel présent. Pour le passé, on utilise le conditionnel passé : *j’aurais réussi*.',
            }
      - id: partis
        type: multipleChoice
        prompt: Si nous ___ plus tôt, nous n’aurions pas raté le train.
        options:
          - { text: étions partis, correct: true }
          - {
              text: avions partis,
              feedback: '*Partir* se conjugue avec *être* : *nous étions partis*.',
            }
          - {
              text: serions partis,
              feedback: 'Jamais de conditionnel après *si*. On utilise le plus-que-parfait : *si nous étions partis*.',
            }
      - id: medecine
        type: fillBlank
        prompt: Complète avec *étudier* au plus-que-parfait et *être* au conditionnel passé.
        text: Si j’___ la médecine, j’___ médecin.
        blanks: [[avais étudié], [aurais été]]
      - id: aller
        type: trueFalse
        prompt: 'La phrase *Si j’avais étudié, j’aurais aller à l’université* est correcte.'
        answer: false
        feedback:
          correct: 'Bravo ! Il faut le participe passé et l’auxiliaire *être* : *je serais allé(e) à l’université*.'
          incorrect: 'Attention : il faut le participe passé, et *aller* prend *être* : *Si j’avais étudié, je serais allé(e) à l’université.*'
      - id: internet
        type: fillBlank
        prompt: Complète avec *exister* au plus-que-parfait.
        text: Si Internet n’___ pas ___, la communication aurait été beaucoup plus lente.
        blanks: [[avait], [existé]]
      - id: present-ou-passe
        type: matching
        prompt: Associe chaque condition à sa conséquence.
        pairs:
          - [Si j’avais accepté ce travail, j’aurais vécu à Madrid.]
          - [Si j’avais voyagé au Japon, j’aurais appris le japonais.]
          - [Si j’avais rencontré Messi, j’aurais pris une photo avec lui.]
          - [Si j’avais étudié l’art, j’aurais peint des tableaux.]
      - id: ailes
        type: multipleChoice
        prompt: Quelle phrase parle d’une situation du passé qui ne peut plus changer ?
        options:
          - {
              text: 'Si j’avais eu des ailes, j’aurais voyagé dans le monde entier.',
              correct: true,
            }
          - {
              text: 'Si j’avais des ailes, je voyagerais dans le monde entier.',
              feedback: 'Cette phrase (*si* + imparfait, conditionnel présent) parle du présent. Pour le passé : *si j’avais eu…, j’aurais voyagé*.',
            }
          - {
              text: 'Si j’ai des ailes, je voyagerai dans le monde entier.',
              feedback: 'Cette phrase (*si* + présent, futur) parle d’une situation possible. Pour le passé : *si j’avais eu…, j’aurais voyagé*.',
            }
      - id: ordre-train
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Nous n’aurions pas raté le train.
