activities:
  - slug: identite-et-communaute-hypotheses
    title: 'Les hypothèses avec si : si + imparfait, conditionnel'
    minutes: 8
    items:
      - id: avais
        type: multipleChoice
        prompt: Si j’___ plus de temps, j’apprendrais une autre langue.
        options:
          - { text: avais, correct: true }
          - {
              text: aurais,
              feedback: '*Aurais* est au conditionnel. Jamais de conditionnel après *si* : on dit *si j’avais*.',
            }
          - {
              text: ai,
              feedback: '*Ai* est au présent. Avec *apprendrais* (conditionnel), on met l’imparfait après *si* : *si j’avais*.',
            }
      - id: aurait
        type: fillBlank
        prompt: Complète avec *il y a* au conditionnel présent (verbe *avoir*).
        text: Si ma communauté était plus inclusive, il y ___ plus d’opportunités pour tout le monde.
        blanks: [[aurait]]
      - id: changerais
        type: trueFalse
        prompt: 'Cette phrase est correcte : *Si je changerais de langue, ma vie serait différente.*'
        answer: false
        feedback:
          correct: 'Bravo ! Après *si*, on met l’imparfait : *Si je changeais de langue, ma vie serait différente.*'
          incorrect: 'Attention : jamais de conditionnel après *si*. On dit : *Si je changeais de langue, ma vie serait différente.*'
      - id: existait
        type: fillBlank
        prompt: Complète avec le verbe *exister* à l’imparfait.
        text: Si cette communauté n’___ pas, la société serait moins solidaire.
        blanks: [[existait]]
      - id: passerais
        type: multipleChoice
        prompt: Si je changeais mes loisirs, je ___ plus de temps avec mes amis.
        options:
          - { text: passerais, correct: true }
          - {
              text: passerai,
              feedback: '*Passerai* est au futur. Après *si* + imparfait, on utilise le conditionnel : *je passerais*.',
            }
          - {
              text: passais,
              feedback: '*Passais* est à l’imparfait. L’imparfait va après *si* ; dans l’autre partie, on met le conditionnel : *je passerais*.',
            }
      - id: conditionnel-formes
        type: matching
        prompt: Associe chaque verbe à sa forme au conditionnel présent.
        pairs:
          - [avoir, j’aurais]
          - [être, je serais]
          - [faire, je ferais]
          - [pouvoir, je pourrais]
          - [changer, je changerais]
      - id: phrase-correcte
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - {
              text: 'Si je pouvais changer un aspect de mon identité, je changerais ma langue.',
              correct: true,
            }
          - {
              text: 'Si je pourrais changer un aspect de mon identité, je changerais ma langue.',
              feedback: 'Après *si*, pas de conditionnel : on dit *si je pouvais*.',
            }
          - {
              text: 'Si je pouvais changer un aspect de mon identité, je changerai ma langue.',
              feedback: '*Changerai* est au futur. Après *si* + imparfait, on met le conditionnel : *je changerais*.',
            }
      - id: ordre-tolerant
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Si ma communauté était plus ouverte, je serais plus tolérant.

  - slug: identite-et-communaute-recit
    title: 'Raconter un changement : passé, présent, futur'
    minutes: 8
    items:
      - id: parlais
        type: multipleChoice
        prompt: Quand j’étais enfant, je ___ seulement hébreu.
        options:
          - { text: parlais, correct: true }
          - {
              text: parlerai,
              feedback: '*Parlerai* est au futur. Pour une habitude dans le passé (*quand j’étais enfant*), on utilise l’imparfait : *je parlais*.',
            }
          - {
              text: parle,
              feedback: '*Parle* est au présent. *Quand j’étais enfant* parle du passé : *je parlais*.',
            }
      - id: travaillerai
        type: fillBlank
        prompt: Complète avec le verbe *travailler* au futur simple.
        text: Dans 5 ans, je pense que je ___ dans un autre pays.
        blanks: [[travaillerai]]
      - id: connecteur-futur
        type: multipleChoice
        prompt: Quel connecteur parle du futur ?
        options:
          - { text: dans quelques années, correct: true }
          - {
              text: à cette époque,
              feedback: '*À cette époque* parle du passé (*À cette époque, je jouais…*). Pour le futur : *dans quelques années*.',
            }
          - {
              text: actuellement,
              feedback: '*Actuellement* parle du présent. Pour le futur : *dans quelques années*.',
            }
      - id: temps
        type: matching
        prompt: Associe chaque forme à son temps.
        pairs:
          - [je parlais, imparfait]
          - [j’étudie, présent]
          - [je travaillerai, futur simple]
          - [j’ai habité, passé composé]
          - [je serais, conditionnel présent]
      - id: habitude
        type: trueFalse
        prompt: 'Pour une habitude dans le passé (*À cette époque, je jouais souvent dans un club sportif.*), on utilise l’imparfait.'
        answer: true
        feedback:
          correct: 'Bravo ! L’imparfait décrit les habitudes et le contexte dans le passé : *je jouais souvent*.'
          incorrect: 'Si : pour une habitude dans le passé, on utilise l’imparfait. *À cette époque, je jouais souvent dans un club sportif.*'
      - id: jouais
        type: fillBlank
        prompt: Complète avec le verbe *jouer* à l’imparfait.
        text: Avant, je ___ souvent au football, mais maintenant je fais du yoga.
        blanks: [[jouais]]
      - id: appartiens
        type: multipleChoice
        prompt: Aujourd’hui, j’___ à plusieurs communautés en ligne.
        options:
          - { text: appartiens, correct: true }
          - {
              text: appartenais,
              feedback: '*Appartenais* est à l’imparfait. Avec *aujourd’hui*, on utilise le présent : *j’appartiens*.',
            }
          - {
              text: appartiendrai,
              feedback: '*Appartiendrai* est au futur. Avec *aujourd’hui*, on utilise le présent : *j’appartiens*.',
            }
      - id: ordre-pays
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Dans quelques années, je travaillerai dans un autre pays.
