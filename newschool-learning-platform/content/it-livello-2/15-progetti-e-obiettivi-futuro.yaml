# Cycle "Progetti e obiettivi: futuro", converted from the Italian level 2 digital
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-2
slug: progetti-e-obiettivi-futuro
title: 'Progetti e obiettivi: futuro'
goal: Parlare di progetti e obiettivi con il futuro semplice ed esprimere speranze e desideri con il congiuntivo presente.
position: 15
status: in_review

review:
  - >-
    The two workbook exercises ("Futuro semplice: progetti e obiettivi" and
    "Congiuntivo presente: spero che, voglio che") are NEW: the notebook has no
    self-study exercises. They were written from the cycle's summary, the activity
    models and the vocabulary, using only the subjunctive forms in the summary table.
    Please check level, wording and every right answer before students see them.
  - >-
    "Spero che io riesca a raggiungere il mio obiettivo" (warm-up question 4 and the
    summary's "Esempi per la lezione") is not natural Italian: when the subject is the
    same (io spero / io riesco) Italian uses di + infinitive. Changed to "Spero di
    riuscire a raggiungere il mio obiettivo", and a rule was ADDED to the summary
    (spero di / voglio + infinitive with the same subject; che + congiuntivo with a
    different subject). Please confirm.
  - >-
    Summary, futuro: the rule "for many verbs, use these endings -ò, -ai, -à, -emo,
    -ete, -anno" did not say how the stem changes. Rewritten: drop the final -e of the
    infinitive, -are verbs change a → e (parlare → parler-), then add the endings. A
    rule for the regular congiuntivo presente (-are → -i, -ere / -ire → -a: che io
    parli, prenda, parta) was ADDED. Please confirm.
  - >-
    Summary, "andare a + infinito": the source compares Italian with Spanish and
    English and quotes "I am going to study". The rule is correct and is kept, rewritten
    without the English quote: andare a + infinitive in Italian means moving to a place
    to do something (vado a studiare in biblioteca), not a plan for the future.
  - >-
    Summary, "Attenzione importante": "Non corretto: Quando tu arrivi, noi mangeremo".
    In everyday speech the present after "quando" is common, so "non corretto" is too
    strong. Now: after "quando" about the future we use the futuro semplice (not the
    congiuntivo); the present is heard in informal speech. Please confirm.
  - >-
    Activity 3, Fase 1: "Sei già dopo il momento in cui hai raggiunto il tuo
    obiettivo" (unnatural) → "Hai già raggiunto il tuo obiettivo". Homework reading,
    question 4 "Cosa spera che questa esperienza faccia?" → "Che cosa spera la persona
    da questa esperienza?".
  - >-
    Warm-up question 3 and Activity 3 use the futuro anteriore ("quando avrai
    raggiunto"), which is not taught in this cycle. Kept as a fixed phrase; please
    decide whether to explain it or change it to "quando raggiungerai".
  - >-
    The lesson presentation link (gamma.app) is not allowed on the platform and was
    left out; see the teacher note. The source has no introduction round, timings or
    recommended activity combination; the plan note suggests one.
  - >-
    Homework: the notebook gives written homework only (Parti 1–3) and no Mori
    message. The written parts are kept as answer boxes; ONE Mori message was written
    by the converter so the section matches the platform's homework pattern. Please
    confirm or remove. An answer key for the reading is in a teacher note.
  - >-
    The Quizlet link is kept without its "?new" parameter. The "Risposta dello
    studente 1/2/3" lines are replaced by the optional answer boxes (decision C2). The
    vocabulary is a list of example sentences, as in the source.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: progetti-e-obiettivi-futuro-classe
    title: 'In classe: Progetti e obiettivi (futuro)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Progetti e obiettivi: futuro'
      - id: skills
        type: cycleOverview
        skills:
          - name: 'Futuro semplice: progetti e obiettivi'
            description: '*Studierò di più. Raggiungerò il mio obiettivo. Quando lo raggiungerò, festeggerò.*'
          - name: 'Congiuntivo presente: speranze e desideri'
            description: '*Spero che il mio progetto vada bene. È importante che io sia costante.*'
      - id: quizlet
        type: externalLink
        label: 'Progetti e obiettivi: futuro su Quizlet'
        url: https://quizlet.com/br/1191221800/progetti-e-obiettivi-futuro-flash-cards/
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup-futuro-title
        type: heading
        level: 4
        text: 'Parte 1: Futuro semplice'
      - id: warmup-futuro
        type: discussionQuestions
        items:
          - question: Qual è il tuo obiettivo? Cosa farai quando lo raggiungerai?
            frame: Il mio obiettivo è ___. Quando lo raggiungerò, ___.
          - question: Cosa farai questa settimana per avvicinarti al tuo obiettivo?
            frame: Questa settimana ___. Il prossimo ___ andrò a ___ / studierò ___ / parlerò con ___.
          - question: Come ti sentirai quando avrai raggiunto il tuo obiettivo?
            frame: Mi sentirò ___ quando avrò raggiunto il mio obiettivo. (*Mi sentirò felice e orgoglioso / orgogliosa.*)
      - id: warmup-congiuntivo-title
        type: heading
        level: 4
        text: 'Parte 2: Congiuntivo presente'
      - id: warmup-congiuntivo
        type: discussionQuestions
        items:
          - question: Cosa speri che succeda nel futuro?
            frame: Spero che ___. (*Spero che il mio progetto vada bene. Spero che la mia famiglia mi sostenga. Spero di riuscire a raggiungere il mio obiettivo.*)
          - question: Che cosa è importante che tu faccia per raggiungere il tuo obiettivo?
            frame: È importante che io ___. (*È importante che io studi ogni settimana / che io sia costante / che io faccia pratica.*)
          - question: Cosa vuoi che gli altri facciano per aiutarti?
            frame: Voglio che ___. (*Voglio che i miei amici mi incoraggino. Voglio che il mio insegnante mi corregga.*)
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: La mia visione verso il mio obiettivo'
        skills: ['Futuro semplice: progetti e obiettivi']
        steps:
          - Scegli un obiettivo personale (studio, lavoro, salute, una lingua, un viaggio o un progetto creativo).
          - Scrivi 10 passi concreti con il futuro semplice. Ogni passo ha una data o un periodo.
          - Presenta la tua lista al gruppo.
        example: |-
          **Obiettivo:** imparare a suonare la chitarra.
          *1. Il 10 gennaio inizierò a imparare gli accordi di base.*
          *2. Dall'11 al 25 gennaio mi eserciterò sugli accordi per 15 minuti ogni giorno.*
          *3. Dal 26 al 31 gennaio imparerò una canzone semplice.*
          *4. Il 1° febbraio comprerò un libro per principianti o scaricherò un'app.*
          *5. A febbraio dedicherò 30 minuti due volte alla settimana agli esercizi per le dita.*
          *6. A marzo registrerò i miei progressi per vedere come migliorerò.*
          *7. Dal 16 al 30 marzo imparerò a leggere le tablature di base.*
          *8. Ad aprile suonerò due canzoni senza interruzioni.*
          *9. Mi unirò a un gruppo online per ricevere consigli e supporto.*
          *10. Il 1° maggio farò un piccolo concerto per i miei amici e la mia famiglia.*
      - id: act1-steps
        type: discussionQuestions
        title: 'Obiettivo: ___'
        items:
          - question: Il ___ inizierò a ___.
          - question: Il ___ studierò / farò / parlerò con ___.
          - question: Dal ___ al ___ mi eserciterò con ___.
          - question: Comprerò / Scaricherò / Cercherò ___.
          - question: Dedicherò ___ minuti al giorno a ___.
          - question: Chiederò aiuto a ___.
          - question: Mi concentrerò su ___.
          - question: Controllerò i miei progressi ogni ___.
          - question: Alla fine, presenterò / farò / finirò ___.
          - question: Quando raggiungerò il mio obiettivo, festeggerò con ___.
      - id: act2
        type: classActivity
        title: 'Attività 2: Il mio regalo per il tuo obiettivo, amico mio'
        skills:
          ['Futuro semplice: progetti e obiettivi', 'Congiuntivo presente: speranze e desideri']
        steps:
          - In coppie o piccoli gruppi, ascoltate l'obiettivo dell'altro gruppo.
          - Pensate a un'invenzione utile, divertente o creativa, e date un nome all'invenzione.
          - Spiegate come funzionerà, usando il futuro semplice.
          - Aggiungete almeno una frase con il congiuntivo presente.
          - Presentate l'invenzione all'altro gruppo.
        example: |-
          **Obiettivo:** viaggiare in Alaska.
          **Invenzione:** *creeremo il "Polar Explorer Penguin Drone".*
          *Questo robot pinguino volante aiuterà il viaggiatore a pianificare il viaggio, ricordare i vestiti caldi e scegliere i luoghi più belli da visitare.*
          *Il drone volerà vicino alla persona, controllerà il meteo e suggerirà attività sicure.*
          *Speriamo che questa invenzione renda il viaggio più facile e divertente.*
          *È importante che il viaggiatore ascolti i consigli del drone.*
      - id: act2-model
        type: discussionQuestions
        title: La nostra invenzione
        items:
          - question: "L'obiettivo del nostro amico / della nostra amica è ___."
          - question: Per questo obiettivo, creeremo ___.
          - question: Questa invenzione aiuterà a ___, ___ e ___.
          - question: 'Funzionerà così: ___.'
          - question: Speriamo che questa invenzione ___.
          - question: "È importante che l'utente ___."
      - id: act3
        type: classActivity
        title: 'Attività 3: Visualizziamo la nostra visione'
        skills:
          ['Futuro semplice: progetti e obiettivi', 'Congiuntivo presente: speranze e desideri']
        steps:
          - "**Fase 1 (facoltativa):** l'insegnante guida una breve visualizzazione. Chiudi gli occhi e immagina il tuo futuro: hai già raggiunto il tuo obiettivo."
          - '**Fase 2:** immagina di essere già quella versione futura di te stesso / stessa e rispondi alle domande qui sotto.'
          - "**Fase 3:** scrivi una lettera dal tuo io futuro al tuo io presente. Includi: come ti sentirai dopo aver raggiunto l'obiettivo, chi ti sosterrà, cosa farai per arrivare lì, cosa è importante che tu faccia e cosa speri che succeda."
      - id: act3-future-me
        type: discussionQuestions
        title: La mia versione futura
        items:
          - question: Come ti presenterai?
          - question: Come parlerai?
          - question: Come ti sentirai?
          - question: Chi sarà con te?
          - question: Cosa farai ogni giorno?
      - id: act3-letter
        type: discussionQuestions
        title: Caro io presente,
        items:
          - question: 'Voglio dirti una cosa importante: ce la farai. Nel futuro ti sentirai ___.'
          - question: Sarai circondato / circondata da ___.
          - question: Inizierai con ___.
          - question: Poi imparerai a ___.
          - question: Ti assicurerai di ___.
          - question: Ti concentrerai su ___.
          - question: Ricorderai sempre di ___.
          - question: È importante che tu ___.
          - question: Spero che tu ___.
          - question: Voglio che tu ___.
          - question: Quando raggiungerai il tuo obiettivo, sarai molto orgoglioso / orgogliosa di te. Continua così. Con affetto, il tuo io futuro.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Futuro semplice: progetti e obiettivi** (Parte 1
          del riscaldamento, Attività 1, 2 e 3) e **Congiuntivo presente: speranze e
          desideri** (Parte 2 del riscaldamento, Attività 2 e 3). Il quaderno non indica
          tempi né combinazioni: per esempio, Attività 1 + Attività 2, oppure Attività 3
          da sola. La presentazione della lezione (Gamma) non è sulla piattaforma.
      - id: n-warmup
        anchor: warmup-title
        text: >-
          Fai almeno due domande a ogni studente. Le risposte scritte qui compaiono sotto
          ogni domanda. Nella domanda 3, *quando avrai raggiunto* (futuro anteriore) si
          può presentare come espressione fissa.
      - id: n-act3
        anchor: act3
        text: >-
          Testo per la visualizzazione (facoltativa), da leggere lentamente: «Chiudi gli
          occhi e immagina il tuo futuro. Hai già raggiunto il tuo obiettivo. Dove sei?
          Come ti senti? Chi è con te? Com'è la tua vita? Cosa è cambiato? Cosa hai fatto
          per arrivare lì?»

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: progetti-e-obiettivi-futuro-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: rules-futuro
        type: ruleSummary
        skill: 'Futuro semplice: progetti e obiettivi'
        rules:
          - text: 'Usiamo il **futuro semplice** per parlare di azioni future, progetti, promesse, previsioni e decisioni per il futuro.'
            examples:
              - Domani studierò italiano.
              - Il mese prossimo inizierò un nuovo progetto.
              - Quando raggiungerò il mio obiettivo, festeggerò.
              - Sarà difficile, ma ce la farò.
              - Ti aiuterò con il tuo progetto.
          - text: "Verbi regolari: togliamo la *-e* finale dell'infinito (nei verbi in *-are* la *a* diventa *e*) e aggiungiamo **-ò, -ai, -à, -emo, -ete, -anno**."
            examples: ['parlare → parlerò', 'prendere → prenderò', 'partire → partirò']
          - text: 'Alcuni verbi importanti sono irregolari (vedi la tabella).'
            examples:
              - Sarò più sicuro.
              - Avrò più esperienza.
              - Farò pratica ogni giorno.
              - Andrò in Italia.
              - Verrò alla lezione.
              - Potrò parlare meglio.
              - Dovrò organizzare il mio tempo.
          - text: 'Per un piano possiamo usare anche **ho intenzione di + infinito**.'
            examples:
              [
                Ho intenzione di studiare italiano ogni giorno.,
                Ho intenzione di viaggiare in Italia.,
                Ho intenzione di migliorare la mia pronuncia.,
              ]
          - text: '**Attenzione:** in italiano *andare a + infinito* vuol dire andare in un luogo per fare qualcosa (*vado a studiare in biblioteca*), non un piano per il futuro. Per un piano diciamo *studierò*, *ho intenzione di studiare* o *voglio studiare*.'
            examples: [Vado a scuola., Vado al cinema., Studierò.]
          - text: 'Dopo **quando**, per parlare del futuro, usiamo il futuro semplice (non il congiuntivo). Nella lingua parlata si sente anche il presente.'
            examples:
              [
                'Quando arriverai, mangeremo insieme.',
                'Quando raggiungerò il mio obiettivo, festeggerò.',
              ]
      - id: futuro-table
        type: table
        caption: Il futuro semplice dei verbi regolari
        header: [Persona, parlare, prendere, partire]
        rows:
          - [io, parlerò, prenderò, partirò]
          - [tu, parlerai, prenderai, partirai]
          - [lui / lei, parlerà, prenderà, partirà]
          - [noi, parleremo, prenderemo, partiremo]
          - [voi, parlerete, prenderete, partirete]
          - [loro, parleranno, prenderanno, partiranno]
      - id: irregular-table
        type: table
        caption: Verbi irregolari importanti al futuro
        header: [Verbo, Futuro (io)]
        rows:
          - [essere, sarò]
          - [avere, avrò]
          - [fare, farò]
          - [andare, andrò]
          - [venire, verrò]
          - [potere, potrò]
          - [volere, vorrò]
          - [dovere, dovrò]
          - [vedere, vedrò]
          - [sapere, saprò]
      - id: rules-congiuntivo
        type: ruleSummary
        skill: 'Congiuntivo presente: speranze e desideri'
        rules:
          - text: 'Usiamo il **congiuntivo presente** dopo alcune espressioni di desiderio, speranza, dubbio, emozione o necessità: *spero che, voglio che, è importante che, è necessario che, è possibile che, ho paura che, sono felice che*.'
            examples:
              - Spero che il mio progetto vada bene.
              - Voglio che i miei amici mi aiutino.
              - È importante che io sia costante.
              - È necessario che tu faccia pratica.
              - È possibile che questo obiettivo richieda molto tempo.
              - Sono felice che tu studi italiano.
          - text: 'Verbi regolari: i verbi in *-are* prendono **-i**, i verbi in *-ere* e *-ire* prendono **-a** (per *io, tu, lui / lei*).'
            examples:
              ['parlare → che io parli', 'prendere → che io prenda', 'partire → che io parta']
          - text: "**Attenzione:** con *spero che* e *voglio che* le due persone sono diverse. Se il soggetto è lo stesso, usiamo l'infinito: *spero di* + infinito, *voglio* + infinito."
            examples:
              [
                'Spero che **tu** riesca. → Spero di riuscire.',
                'Voglio che **la mia famiglia** mi sostenga. → Voglio studiare di più.',
              ]
          - text: 'Futuro o congiuntivo? Il futuro dice cosa succederà; il congiuntivo viene dopo *spero che, è importante che, voglio che*.'
            examples:
              [
                'Studierò di più. / Spero che il mio progetto funzioni.',
                'Raggiungerò il mio obiettivo. / È importante che io sia costante.',
              ]
      - id: congiuntivo-table
        type: table
        caption: Verbi comuni al congiuntivo presente
        header: [Verbo, Congiuntivo presente]
        rows:
          - [essere, 'che io sia, che tu sia']
          - [avere, 'che io abbia, che tu abbia']
          - [fare, 'che io faccia, che tu faccia']
          - [andare, 'che io vada, che tu vada']
          - [potere, 'che io possa, che tu possa']
          - [volere, 'che io voglia, che tu voglia']
          - [riuscire, 'che io riesca, che tu riesca']
          - [migliorare, 'che io migliori, che tu migliori']
          - [raggiungere, 'che io raggiunga, che tu raggiunga']
          - [sostenere, 'che io sostenga, che tu sostenga']
      - id: lesson-examples
        type: callout
        tone: info
        title: Esempi per la lezione
        text: |-
          *Spero di riuscire a raggiungere il mio obiettivo.*
          *È importante che io faccia pratica.*
          *Voglio che la mia famiglia mi sostenga.*
          *Spero che il mio italiano migliori.*
          *È possibile che io abbia bisogno di più tempo.*
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le due abilità con la classe e chiedi un esempio nuovo per ogni regola.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: progetti-e-obiettivi-futuro-compiti
    title: Compiti
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti
      - id: part1-title
        type: heading
        level: 3
        text: 'Parte 1: Domande e risposte'
      - id: part1
        type: discussionQuestions
        title: Rispondi con frasi complete.
        items:
          - question: Cosa farai il prossimo fine settimana?
          - question: Cosa realizzerai entro la fine dell'anno?
          - question: Dove andrai per la tua prossima vacanza?
          - question: Cosa speri che succeda nel prossimo mese?
          - question: Che cosa è importante che tu faccia per migliorare?
          - question: Chi vuoi che ti aiuti con il tuo obiettivo?
      - id: part2-title
        type: heading
        level: 3
        text: 'Parte 2: Scrittura'
      - id: part2
        type: reflection
        prompt: >-
          Scrivi un breve paragrafo di 5–7 frasi sul tuo obiettivo per il mese prossimo.
          Usa almeno 3 frasi con il **futuro semplice**, 2 frasi con il **congiuntivo
          presente** e 2 connettori (*prima, poi, dopo, quando, alla fine*).
      - id: part2-example
        type: callout
        tone: info
        title: Modello
        text: >-
          *Il mese prossimo il mio obiettivo sarà studiare italiano con più costanza.
          Studierò tre volte alla settimana e farò esercizi di conversazione. Quando avrò
          più sicurezza, parlerò di più durante le lezioni. Spero che il mio italiano
          migliori velocemente. È importante che io faccia pratica anche fuori dalla
          classe. Alla fine del mese, controllerò i miei progressi e festeggerò il mio
          miglioramento.*
      - id: part3-title
        type: heading
        level: 3
        text: 'Parte 3: Lettura'
      - id: part3-text
        type: text
        text: >-
          L'anno prossimo andrò a studiare all'estero, in Spagna. Migliorerò il mio
          spagnolo e conoscerò meglio la cultura spagnola. Incontrerò nuove persone e farò
          nuove amicizie. Spero che questa esperienza mi aiuti a diventare più indipendente.
          È importante che io sia aperto a nuove esperienze e che parli con molte persone.
          Sono entusiasta di questa avventura e di tutto quello che vivrò.
      - id: part3
        type: discussionQuestions
        title: Leggi il testo e rispondi alle domande.
        items:
          - question: Dove studierà la persona l'anno prossimo?
          - question: Cosa migliorerà?
          - question: Chi incontrerà?
          - question: Che cosa spera la persona da questa esperienza?
          - question: Perché è importante che sia aperto a nuove esperienze?
          - question: Come si sentirà durante questa avventura?
      - id: mori-title
        type: heading
        level: 3
        text: Pratica con Mori
      - id: mori-obiettivo
        type: aiTutorPrompt
        title: Il mio prossimo obiettivo
        intro: Apri la chat con Mori, copia questo messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
        message: >-
          Ciao Mori! Voglio praticare il futuro semplice e il congiuntivo presente. Fammi
          domande, una alla volta, sul mio prossimo obiettivo: cosa farò per raggiungerlo,
          cosa spero che succeda e cosa è importante che io faccia. Correggi i miei
          errori, per favore.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**
    teacherNotes:
      - id: n-part3
        anchor: part3
        text: >-
          Risposte: 1. In Spagna, all'estero. 2. Il suo spagnolo. 3. Nuove persone (farà
          nuove amicizie). 4. Spera che l'esperienza lo aiuti a diventare più indipendente.
          5. Il testo non lo dice: accetta risposte personali (per esempio: per conoscere
          la cultura e parlare con molte persone). 6. Entusiasta.

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: progetti-e-obiettivi-futuro-pratica
    book: workbook
    title: 'Pratica: Progetti e obiettivi (futuro)'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Esercitati sulle due abilità del ciclo. Ogni risposta viene corretta subito e puoi riprovare.
      - id: ex-futuro
        type: activity
        activity: progetti-e-obiettivi-futuro-futuro
      - id: ex-congiuntivo
        type: activity
        activity: progetti-e-obiettivi-futuro-congiuntivo

