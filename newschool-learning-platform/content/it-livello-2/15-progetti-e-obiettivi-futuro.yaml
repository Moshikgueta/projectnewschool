vocabulary:
  - slug: progetti-e-obiettivi-futuro
    title: 'Progetti e obiettivi: futuro'
    items: *progetti-e-obiettivi-futuro-words

activities:
  - slug: progetti-e-obiettivi-futuro-futuro
    title: 'Futuro semplice: parlerò, farò, sarò'
    minutes: 8
    items:
      - id: irregolari
        type: matching
        prompt: Unisci ogni verbo alla sua forma di *io* al futuro.
        pairs:
          - [essere, sarò]
          - [avere, avrò]
          - [fare, farò]
          - [andare, andrò]
          - [venire, verrò]
      - id: parlero
        type: multipleChoice
        prompt: Domani io ___ con il mio insegnante.
        options:
          - { text: parlerò, correct: true }
          - {
              text: parlarò,
              feedback: 'Nei verbi in *-are*, la *a* diventa *e*: *parlare → parlerò*.',
            }
          - { text: parlerà, feedback: '*Parlerà* è per *lui / lei*. Per *io* diciamo *parlerò*.' }
      - id: prenderemo-partirete
        type: fillBlank
        prompt: Completa con il futuro di *prendere* e *partire*.
        text: Noi ___ il treno e voi ___ domani.
        blanks: [[prenderemo], [partirete]]
      - id: desinenze
        type: trueFalse
        prompt: 'Le desinenze del futuro sono *-ò, -ai, -à, -emo, -ete, -anno*: *parlerò, parlerai, parlerà…*'
        answer: true
        feedback:
          correct: 'Giusto! *parleremo, parlerete, parleranno*.'
          incorrect: 'Le desinenze del futuro sono *-ò, -ai, -à, -emo, -ete, -anno*: *parlerò, parlerai, parlerà, parleremo, parlerete, parleranno*.'
      - id: quando-raggiungero
        type: multipleChoice
        prompt: Quando ___ il mio obiettivo, festeggerò.
        options:
          - { text: raggiungerò, correct: true }
          - {
              text: raggiunga,
              feedback: 'Dopo *quando* per il futuro usiamo il futuro semplice, non il congiuntivo: *quando raggiungerò*.',
            }
          - {
              text: raggiungerai,
              feedback: '*Raggiungerai* è per *tu*. Qui il soggetto è *io* (*festeggerò*, *il mio obiettivo*): *raggiungerò*.',
            }
      - id: potro-avro
        type: fillBlank
        prompt: Completa con il futuro di *potere* e *avere*.
        text: Il mese prossimo ___ parlare meglio e ___ più esperienza.
        blanks: [[potrò, io potrò], [avrò]]
      - id: intenzione-di
        type: multipleChoice
        prompt: Ho intenzione ___ viaggiare in Italia.
        options:
          - { text: di, correct: true }
          - {
              text: a,
              feedback: 'Diciamo *ho intenzione di* + infinito: *Ho intenzione di viaggiare.*',
            }
          - {
              text: per,
              feedback: 'Diciamo *ho intenzione di* + infinito: *Ho intenzione di viaggiare.*',
            }
      - id: ordina-progetto
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Il mese prossimo inizierò un nuovo progetto.

  - slug: progetti-e-obiettivi-futuro-congiuntivo
    title: 'Congiuntivo presente: spero che, voglio che'
    minutes: 8
    items:
      - id: vada
        type: multipleChoice
        prompt: Spero che il mio progetto ___ bene.
        options:
          - { text: vada, correct: true }
          - {
              text: va,
              feedback: "*Va* è l'indicativo presente. Dopo *spero che* usiamo il congiuntivo: *vada*.",
            }
          - {
              text: vado,
              feedback: "*Vado* è per *io*, all'indicativo. Dopo *spero che*, per *il progetto*, diciamo *vada*.",
            }
      - id: sia
        type: fillBlank
        prompt: Completa con il congiuntivo presente di *essere*.
        text: È importante che io ___ costante.
        blanks: [[sia]]
      - id: unisci-congiuntivo
        type: matching
        prompt: Unisci ogni verbo al suo congiuntivo presente.
        pairs:
          - [essere, che io sia]
          - [avere, che io abbia]
          - [fare, che io faccia]
          - [andare, che io vada]
          - [potere, che io possa]
      - id: dopo-spero-che
        type: trueFalse
        prompt: 'Dopo *spero che*, *voglio che* e *è importante che* usiamo il congiuntivo presente.'
        answer: true
        feedback:
          correct: 'Giusto! *Spero che il mio italiano migliori. Voglio che i miei amici mi aiutino.*'
          incorrect: 'Queste espressioni vogliono il congiuntivo: *Spero che il mio progetto vada bene.*'
      - id: corregga
        type: multipleChoice
        prompt: Voglio che il mio insegnante mi ___.
        options:
          - { text: corregga, correct: true }
          - {
              text: corregge,
              feedback: "*Corregge* è l'indicativo. Dopo *voglio che* usiamo il congiuntivo: *corregga*.",
            }
          - {
              text: correggerò,
              feedback: '*Correggerò* è il futuro di *io*. Dopo *voglio che* usiamo il congiuntivo: *corregga*.',
            }
      - id: faccia
        type: fillBlank
        prompt: Completa con il congiuntivo presente di *fare*.
        text: È necessario che tu ___ pratica.
        blanks: [[faccia]]
      - id: stesso-soggetto
        type: trueFalse
        prompt: 'Se il soggetto è lo stesso (io spero, io riesco), diciamo: *Spero di riuscire a raggiungere il mio obiettivo.*'
        answer: true
        feedback:
          correct: 'Giusto! Con lo stesso soggetto usiamo *di* + infinito. Con un soggetto diverso: *Spero che tu riesca.*'
          incorrect: "Con lo stesso soggetto usiamo *spero di* + infinito: *Spero di riuscire.* *Spero che* + congiuntivo è per un'altra persona: *Spero che tu riesca.*"
      - id: ordina-migliori
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Spero che il mio italiano migliori.
