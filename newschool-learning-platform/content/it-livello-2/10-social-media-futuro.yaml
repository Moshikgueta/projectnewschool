# Cycle "I social media e il futuro", converted from the Italian level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-2
slug: social-media-futuro
title: I social media e il futuro
goal: Parlare dei social media e dei programmi con il futuro semplice e fare confronti con più / meno.
position: 10
status: in_review

review:
  - >-
    The two workbook exercises ("Futuro semplice" and "Confronti") are NEW: the
    notebook has no self-correcting exercises. They were written from the cycle's
    summary rules, examples and vocabulary. Please check level, wording and every
    right answer before students see them.
  - >-
    Skills: the notebook lists five abilities (social media habits, futuro semplice,
    comparisons, opinions, healthier use of technology). The cycle overview keeps the
    two grammar skills, "Futuro semplice" and "Confronti"; opinions (Secondo me / Per
    me) and healthy habits are practised inside the activities and the summary.
  - >-
    The lesson slides are a gamma.app link, which is not allowed on the platform; the
    link was left out and a teacher note says so. The Quizlet link is kept without its
    "?new" parameter. The "Risposta (dello) studente 1/2/3" lines are replaced by the
    answer boxes.
  - >-
    The source summary is in Hebrew. It was rewritten in Italian (student-facing text
    is Italian); the Hebrew translations of the useful sentences are kept as glosses
    in an examples block.
  - >-
    Summary, futuro: the notebook only gives the forms. A short formation rule was
    ADDED (infinitive without the final -e + -ò, -ai, -à, -emo, -ete, -anno; -are verbs
    change a → e: usare → userò; -care / -gare add h: pubblicare → pubblicherò) and the
    forms were put in a table. Please confirm.
  - >-
    Summary, superlative: the notebook says "il più (masculine) / la più (feminine)",
    but its own examples put the article on the noun (l'app più popolare, il profilo più
    interessante). Rewritten as: article + noun + più / meno + adjective; il più / la
    più only when the noun is not repeated (TikTok è la più popolare). Please confirm.
  - >-
    Summary, opinions: the Hebrew note about "Penso che… + congiuntivo" is kept as a
    rule in Italian (at A2 use Secondo me / Per me + indicative).
  - >-
    Written homework, Part 3 item 3: "Per me WhatsApp è ___ importante applicazione"
    (answer "la più" before the noun, unusual) → "Per me WhatsApp è l'applicazione ___
    importante". Part 4: the list was numbered "1." six times; now six separate items.
    Part 5: capital letters in the list made consistent.
  - >-
    The notebook has no lesson plan and no activity times, so no minutes are recorded.
    The teacher note suggests choosing 2–3 of the 5 activities; please confirm.
  - >-
    The "Compiti classici" (written homework) are kept in the homework section as
    answer boxes before the Mori messages. The Mori messages ("Studente a Mori:"
    followed by several lines) are joined into one message per part.
  - >-
    Vocabulary: terms are written in lower case, and the verb rows as "infinitive
    (future forms)", e.g. "usare (userò / userai / useranno)", instead of "Usare -
    userò / userai / useranno"; the Hebrew glosses are unchanged.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: social-media-futuro-classe
    title: 'In classe: I social media e il futuro'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: I social media e il futuro
      - id: skills
        type: cycleOverview
        skills:
          - name: Futuro semplice
            description: Programmi e intenzioni (*userò, guarderò, pubblicherò, farò*)
          - name: Confronti
            description: '*più… di, meno… di, il più / la più* e le opinioni (*Secondo me…*)'
      - id: quizlet
        type: externalLink
        label: I social media e il futuro su Quizlet
        url: https://quizlet.com/br/1189024381/i-social-media-e-il-futuro-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Giro di presentazioni
      - id: intro
        type: sentenceFrame
        prompt: Ogni studente dice 3 frasi.
        frame: Mi chiamo ___. Uso spesso ___. Questa settimana userò ___ per ___.
        example: Mi chiamo Marco. Uso spesso Instagram. Questa settimana userò YouTube per guardare video in italiano.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di preparazione
      - id: warmup
        type: discussionQuestions
        items:
          - question: Quale social media usi di più?
            frame: Uso di più Instagram perché mi piace guardare foto e video brevi.
          - question: Quale applicazione userai meno questa settimana? Perché?
            frame: Userò meno Facebook perché non è molto interessante per me.
          - question: Che cosa guarderai su YouTube, Netflix o TikTok dopo la lezione?
            frame: Guarderò un video di cucina su YouTube.
          - question: Pubblicherai qualcosa sui social questa settimana?
            frame: Sì, pubblicherò una foto del fine settimana. / No, non pubblicherò niente.
          - question: Secondo te, quale applicazione è più utile per imparare una lingua?
            frame: Secondo me YouTube è più utile di Instagram perché ci sono molti video lunghi.
          - question: Che cosa farai per usare il telefono in modo più sano?
            frame: Passerò meno tempo sul telefono e farò più pause durante il giorno.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      # Activity 1
      - id: act1
        type: classActivity
        title: "Attività 1: Un contenuto per imparare l'italiano"
        skills: [Futuro semplice, Confronti]
        steps:
          - Lavorate in coppia o in piccoli gruppi.
          - 'Ogni studente sceglie un contenuto online in italiano: un video breve, un post, una pagina, un profilo, un canale YouTube, un account Instagram o TikTok.'
          - 'Il contenuto può parlare di musica, cucina, sport, viaggi, moda, cinema, libri, vita quotidiana o apprendimento delle lingue.'
          - Scrivi le 4 frasi qui sotto.
          - Presenta il contenuto al gruppo. Gli altri studenti fanno una domanda.
        example: |-
          *Ho scelto un video su Roma.*
          *Seguirò questo account perché voglio imparare parole nuove.*
          *Questo contenuto è più utile di un video senza sottotitoli.*
          *In futuro guarderò altri video sulla cucina italiana.*
      - id: act1-sentences
        type: discussionQuestions
        title: Le mie 4 frasi
        items:
          - question: Ho scelto un contenuto su ___.
          - question: Seguirò questo account perché ___.
          - question: Questo contenuto è più ___ di ___.
          - question: In futuro guarderò altri video su ___.
      - id: act1-questions
        type: callout
        tone: info
        title: Domande possibili
        text: |-
          Perché hai scelto questo contenuto?
          È facile o difficile da capire?
          Lo guarderai di nuovo?
          È più utile di altri contenuti che conosci?
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Attività 2: Il mio profilo social utile'
        skills: [Futuro semplice, Confronti]
        steps:
          - Immagina di creare un profilo social utile. Non devi aprirlo davvero.
          - Completa le informazioni del profilo.
          - Scrivi almeno 5 frasi con il futuro semplice.
          - Presenta il tuo profilo in 30–45 secondi.
          - 'La classe sceglie il profilo più utile, il profilo più creativo e il profilo più interessante.'
        example: |-
          *Il mio profilo si chiamerà ItalianoFacile.*
          *Pubblicherò video brevi con parole utili in italiano.*
          *Userò questo profilo per aiutare studenti di livello A2.*
          *Il mio profilo sarà più semplice di molti profili per studenti avanzati.*
          *Non pubblicherò video troppo lunghi perché molte persone non hanno tempo.*
      - id: act2-profile
        type: discussionQuestions
        title: Il mio profilo
        items:
          - question: 'Nome del profilo: ___'
          - question: 'Piattaforma: Il mio profilo sarà su ___.'
          - question: 'Tema: Il profilo parlerà di ___.'
          - question: 'Obiettivo: Userò questo profilo per ___.'
          - question: 'Pubblico: Il profilo sarà per persone che vogliono ___.'
      - id: act2-sentences
        type: discussionQuestions
        title: Frasi obbligatorie
        items:
          - question: Il mio profilo si chiamerà ___.
          - question: Pubblicherò contenuti su ___.
          - question: Userò questo profilo per ___.
          - question: Il mio profilo sarà più ___ di ___.
          - question: Non pubblicherò ___ perché ___.
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Attività 3: La mia settimana digitale'
        skills: [Futuro semplice, Confronti]
        steps:
          - Immagina la tua settimana digitale ideale. Scrivi una frase per ogni giorno.
          - In coppia, confrontate le vostre settimane con le strutture qui sotto.
          - Ogni coppia presenta una somiglianza e una differenza.
        example: |-
          *Lunedì userò YouTube per imparare l'italiano.*
          *Mercoledì guarderò una serie su Netflix perché voglio rilassarmi.*
          *Venerdì condividerò una foto del mio cane.*
          *Sabato ascolterò musica italiana su Spotify.*
          *Domenica passerò meno tempo su Instagram e più tempo con la mia famiglia.*
      - id: act3-sentences
        type: discussionQuestions
        title: La mia settimana
        items:
          - question: Lunedì userò ___ per ___.
          - question: Mercoledì guarderò ___ perché ___.
          - question: Venerdì condividerò ___.
          - question: Sabato ascolterò ___ su ___.
          - question: Domenica passerò meno tempo su ___ e più tempo a / con ___.
      - id: act3-compare
        type: callout
        tone: info
        title: Confronto a coppie
        text: |-
          Userò ___ più di te. / Userò ___ meno di te.
          Guarderò più video di te. / Pubblicherò meno foto di te.
          La mia settimana sarà più tranquilla della tua.
          La tua settimana sarà più digitale della mia.
          **Esempio:** *Tutti e due useremo YouTube per imparare qualcosa. Io userò Instagram più del mio compagno.*
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Attività 4: Usare i social in modo più sano'
        skills: [Futuro semplice, Confronti]
        steps:
          - Lavorate in piccoli gruppi.
          - Ogni gruppo prepara 5 consigli per usare i social media in modo più sano. Usate il futuro semplice.
          - Ogni gruppo presenta i suoi consigli.
          - 'La classe vota: il consiglio più utile, il consiglio più facile da seguire, il consiglio più difficile da seguire.'
        example: |-
          *Userò meno TikTok durante la settimana.*
          *Passerò meno tempo sul telefono prima di dormire.*
          *Farò più pause quando studio.*
          *Seguirò account più educativi.*
          *Spegnerò le notifiche la sera.*
        wordBank:
          - Userò meno…
          - Passerò meno tempo…
          - Farò più pause…
          - Non userò il telefono…
          - Seguirò account più…
          - Guarderò contenuti più…
          - Sceglierò meglio…
          - Spegnerò le notifiche…
      - id: act4-tips
        type: discussionQuestions
        title: I nostri 5 consigli
        items:
          - question: Consiglio 1
          - question: Consiglio 2
          - question: Consiglio 3
          - question: Consiglio 4
          - question: Consiglio 5
      # Activity 5
      - id: act5
        type: classActivity
        title: "Attività 5: Un'app per imparare meglio"
        skills: [Futuro semplice, Confronti]
        steps:
          - Lavorate in gruppi di 3 o 4 persone.
          - Immaginate una nuova app per imparare una lingua.
          - 'Decidete: come si chiamerà, a chi servirà, quali funzioni avrà, perché sarà utile e perché sarà diversa da altre app.'
          - Completate le frasi qui sotto.
          - Ogni gruppo presenta la propria app in 1 minuto. Gli altri studenti fanno domande.
        example: |-
          *La nostra app si chiamerà ParlaFacile.*
          *Servirà per praticare l'italiano ogni giorno.*
          *Gli studenti potranno ascoltare dialoghi brevi e rispondere a domande.*
          *L'app avrà video, audio e giochi.*
          *Sarà più semplice di molte app di grammatica.*
          *Sarà meno noiosa di un libro tradizionale.*
          *Aiuterà gli studenti a parlare con più sicurezza.*
      - id: act5-sentences
        type: discussionQuestions
        title: La nostra app
        items:
          - question: La nostra app si chiamerà ___.
          - question: Servirà per ___.
          - question: Gli studenti potranno ___.
          - question: "L'app avrà ___."
          - question: Sarà più ___ di ___.
          - question: Sarà meno ___ di ___.
          - question: Aiuterà gli studenti a ___.
      - id: act5-questions
        type: callout
        tone: info
        title: Domande dal pubblico
        text: |-
          Per chi sarà questa app?
          Sarà gratuita?
          Sarà facile da usare?
          La userai anche tu?
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Futuro semplice** e **Confronti** (più… di, meno…
          di, il più / la più). Tutte e cinque le attività le praticano insieme; scegli 2 o
          3 attività secondo il tempo e il gruppo. Il quaderno non indica i tempi.
      - id: n-slides
        anchor: null
        text: >-
          Il quaderno ha una presentazione della lezione su gamma.app. Questo tipo di
          link non è permesso nella piattaforma: se vuoi usarla, condividila tu sullo
          schermo.
      - id: n-intro
        anchor: intro
        text: Fai prima il tuo esempio e poi chiedi a ogni studente.
      - id: n-warmup
        anchor: warmup
        text: Fai almeno due domande a ogni studente. Le risposte scritte qui compaiono sotto ogni domanda.
      - id: n-act3
        anchor: act3
        text: Durante il confronto a coppie, fai notare *più di te / meno di te* e *della tua / della mia* (di + la).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: social-media-futuro-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: rules-futuro
        type: ruleSummary
        skill: Futuro semplice
        rules:
          - text: Usiamo il **futuro semplice** per parlare di programmi e intenzioni, di quello che faremo dopo.
            examples:
              - Domani userò Instagram.
              - Questa settimana guarderò un video in italiano.
              - Pubblicherò una foto.
              - In futuro passerò meno tempo sul telefono.
          - text: "Si forma con l'infinito senza la *-e* finale + **-ò, -ai, -à, -emo, -ete, -anno**. Nei verbi in **-are** la *a* diventa *e*: *usare → userò*, *guardare → guarderò*."
            examples: ['seguire → seguirò', 'condividere → condividerò', 'usare → userò']
          - text: 'I verbi in **-care** e **-gare** aggiungono una *h* per mantenere il suono: *pubblicare → pubblicherò*.'
            examples: [pubblicherò, pubblicherai, pubblicheranno]
          - text: 'Alcuni verbi importanti sono irregolari: *essere → sarò*, *avere → avrò*, *fare → farò*, *andare → andrò*, *potere → potrò*.'
            examples: [Questa app sarà molto utile., Avrò più tempo libero., Farò più pause.]
          - text: "Espressioni di tempo utili: *domani, stasera, questa settimana, il mese prossimo, in futuro, tra qualche anno*. Nell'italiano parlato si usa anche il presente con un'espressione di futuro (*Domani uso Instagram*), ma oggi pratichiamo il futuro (*Domani userò Instagram*)."
      - id: futuro-table
        type: table
        caption: Il futuro semplice
        header: [Persona, usare, guardare, pubblicare, seguire]
        rows:
          - [io, userò, guarderò, pubblicherò, seguirò]
          - [tu, userai, guarderai, pubblicherai, seguirai]
          - [lui / lei, userà, guarderà, pubblicherà, seguirà]
          - [noi, useremo, guarderemo, pubblicheremo, seguiremo]
          - [voi, userete, guarderete, pubblicherete, seguirete]
          - [loro, useranno, guarderanno, pubblicheranno, seguiranno]
      - id: irregular-table
        type: table
        caption: Verbi irregolari
        header: [Persona, essere, avere, fare, andare, potere]
        rows:
          - [io, sarò, avrò, farò, andrò, potrò]
          - [tu, sarai, avrai, farai, andrai, potrai]
          - [lui / lei, sarà, avrà, farà, andrà, potrà]
          - [noi, saremo, avremo, faremo, andremo, potremo]
          - [voi, sarete, avrete, farete, andrete, potrete]
          - [loro, saranno, avranno, faranno, andranno, potranno]
      - id: rules-confronti
        type: ruleSummary
        skill: Confronti
        rules:
          - text: "**più… di** (יותר… מ…) e **meno… di** (פחות… מ…) confrontano due cose. Con l'articolo, *di* diventa *del, della, dei*…"
            examples:
              - Instagram è più popolare di Facebook.
              - YouTube è più utile di TikTok.
              - Questa app è meno interessante di YouTube.
              - Questo profilo è meno utile del mio.
          - text: 'Anche con i verbi: verbo + **più di / meno di**. Senza confronto diciamo solo *più / meno* + nome.'
            examples:
              [
                Uso YouTube più di TikTok.,
                Uso Facebook meno di Instagram.,
                Passo meno tempo sul telefono.,
              ]
          - text: 'Per dire **הכי**: articolo + nome + **più** + aggettivo. Se non ripetiamo il nome: **il più / la più** + aggettivo.'
            examples:
              - "TikTok è l'app più popolare."
              - YouTube è la piattaforma più utile.
              - Questo è il profilo più interessante.
              - Secondo me TikTok è la più popolare.
          - text: 'Per dire **הכי פחות** usiamo **meno** allo stesso modo.'
            examples: ["Questa è l'app meno utile per me."]
      - id: rules-opinioni
        type: ruleSummary
        skill: Esprimere un'opinione
        rules:
          - text: 'Al livello A2 usiamo strutture semplici: **Secondo me…**, **Per me…**, **Mi piace… perché…**, **Non mi piace… perché…**'
            examples:
              - Secondo me Instagram è più divertente di Facebook.
              - Per me YouTube è più utile di TikTok.
              - Mi piace Spotify perché ascolto molta musica.
              - Non mi piace passare troppo tempo sul telefono.
          - text: 'Invece di *Penso che…* (che vuole il congiuntivo), per ora diciamo *Secondo me* / *Per me* + indicativo.'
            examples: [Secondo me i social media sono utili., Per me questa app è interessante.]
      - id: useful
        type: examples
        items:
          - { text: In futuro userò meno Instagram., gloss: בעתיד אשתמש פחות באינסטגרם. }
          - { text: Guarderò più video in italiano., gloss: אצפה ביותר סרטונים באיטלקית. }
          - { text: Pubblicherò una foto questa settimana., gloss: אפרסם תמונה השבוע. }
          - { text: Seguirò un account di cucina., gloss: אעקוב אחרי חשבון של בישול. }
          - { text: Passerò meno tempo sul telefono., gloss: אבלה פחות זמן בטלפון. }
          - { text: Farò più pause., gloss: אעשה יותר הפסקות. }
          - {
              text: Secondo me YouTube è più utile di TikTok.,
              gloss: לדעתי יוטיוב שימושי יותר מטיקטוק.,
            }
          - {
              text: "Per me Instagram è l'app più divertente.",
              gloss: בשבילי אינסטגרם היא האפליקציה הכי מהנה.,
            }
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le due abilità con la classe e chiedi un esempio nuovo per ogni regola.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: social-media-futuro-compiti
    title: Compiti
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti
      - id: written-title
        type: heading
        level: 3
        text: Compiti scritti
      - id: hw1
        type: discussionQuestions
        title: 'Parte 1: Futuro semplice. Completa con il verbo al futuro.'
        items:
          - question: Stasera io ___ un video in italiano. (guardare)
          - question: Domani noi ___ WhatsApp per parlare con il gruppo. (usare)
          - question: Tu ___ qualcosa su Instagram questa settimana? (pubblicare)
          - question: I miei amici ___ molte foto durante il viaggio. (condividere)
          - question: La prossima settimana io ___ un nuovo account italiano. (seguire)
          - question: In futuro le applicazioni ___ molto. (cambiare)
          - question: Domani io ___ una pausa dai social media. (fare)
          - question: Questa app ___ molto utile per gli studenti. (essere)
      - id: hw2
        type: discussionQuestions
        title: 'Parte 2: Risposte personali'
        items:
          - question: In futuro userò di più ___.
          - question: Userò di meno ___.
          - question: Questa settimana guarderò ___.
          - question: Pubblicherò ___.
          - question: Seguirò un account su ___.
          - question: Passerò meno tempo su ___.
          - question: "Per imparare l'italiano userò ___."
      - id: hw3
        type: discussionQuestions
        title: 'Parte 3: Confronti. Completa con più, meno, il più, la più, il meno o la meno.'
        items:
          - question: YouTube è ___ utile di TikTok per guardare video lunghi.
          - question: Instagram è ___ visivo di Twitter / X.
          - question: "Per me WhatsApp è l'applicazione ___ importante."
          - question: Facebook è ___ usato da molti giovani.
          - question: Questo video è ___ interessante di quello.
          - question: Questa app è ___ facile da usare.
      - id: hw4
        type: discussionQuestions
        title: 'Parte 4: Scrivi una frase per ogni struttura.'
        items:
          - question: più… di
          - question: meno… di
          - question: il più / la più
          - question: userò
          - question: guarderò
          - question: pubblicherò
      - id: hw5
        type: discussionQuestions
        title: 'Parte 5: Scrittura'
        items:
          - question: >-
              Come userai i social media la prossima settimana? Scrivi 6–8 frasi. Puoi
              parlare di: quali app userai, cosa guarderai, cosa pubblicherai, quali account
              seguirai, quanto tempo passerai online, cosa farai per usare il telefono in
              modo più sano.
      - id: mori-title
        type: heading
        level: 3
        text: Compiti con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia un messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Parte 1: Futuro semplice'
        message: |-
          Mori, fammi 10 domande usando il futuro semplice sul tema dei social media.
          Chiedimi cosa userò di più la prossima settimana, cosa guarderò su YouTube o Netflix e cosa pubblicherò sui social media.
          Correggi i miei errori e spiegami la forma corretta.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Parte 2: Confronti'
        message: |-
          Mori, fammi confrontare Instagram, TikTok, YouTube e WhatsApp.
          Fammi 10 domande con più… di e meno… di.
          Chiedimi quale app è la più utile per me e perché.
          Correggi tutti i miei errori in italiano.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Parte 3: Conversazione'
        message: |-
          Mori, facciamo una conversazione semplice sui social media.
          Chiedimi quali social media uso e perché, e come userò il telefono in modo più sano.
          Non passare alla domanda successiva finché non rispondo in italiano.
      - id: mori-4
        type: aiTutorPrompt
        title: 'Parte 4: Creatività'
        message: |-
          Mori, aiutami a creare una nuova app per imparare l'italiano.
          Fammi descrivere la mia app usando il futuro semplice e aiutami a usare più… di e meno… di.
          Correggi le mie frasi e dammi una versione più naturale.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**

