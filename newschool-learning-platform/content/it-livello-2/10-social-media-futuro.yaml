activities:
  - slug: social-media-futuro-futuro
    title: 'Futuro semplice: userò, guarderò, pubblicherò'
    minutes: 8
    items:
      - id: usero
        type: multipleChoice
        prompt: Domani io ___ Instagram.
        options:
          - { text: userò, correct: true }
          - {
              text: usarò,
              feedback: 'Nel futuro dei verbi in *-are* la *a* diventa *e*: *usare → userò*.',
            }
          - { text: userà, feedback: '*Userà* è per *lui / lei*. Per *io* diciamo *userò*.' }
      - id: guardero
        type: fillBlank
        prompt: Completa con il futuro di *guardare*.
        text: Stasera io ___ un video in italiano.
        blanks: [[guarderò]]
      - id: pubblicherai
        type: fillBlank
        prompt: Completa con il futuro di *pubblicare*.
        text: Tu ___ qualcosa su Instagram questa settimana?
        blanks: [[pubblicherai]]
      - id: irregolari
        type: matching
        prompt: Unisci ogni verbo alla sua forma di *io* al futuro.
        pairs:
          - [essere, sarò]
          - [avere, avrò]
          - [fare, farò]
          - [andare, andrò]
          - [potere, potrò]
      - id: sara
        type: multipleChoice
        prompt: Questa app ___ molto utile per gli studenti.
        options:
          - { text: sarà, correct: true }
          - { text: esserà, feedback: '*Essere* è irregolare al futuro: *sarò, sarai, sarà*…' }
          - { text: sarò, feedback: '*Sarò* è per *io*. Per *questa app* (lei) diciamo *sarà*.' }
      - id: care-cher
        type: trueFalse
        prompt: 'I verbi in *-care* aggiungono una *h* al futuro: *pubblicare → pubblicherò*.'
        answer: true
        feedback:
          correct: 'Giusto! La *h* mantiene il suono duro della *c*: *pubblicherò, pubblicherai*.'
          incorrect: 'I verbi in *-care* e *-gare* aggiungono una *h*: *pubblicare → pubblicherò*.'
      - id: condivideranno
        type: fillBlank
        prompt: Completa con il futuro di *condividere* e di *usare*.
        text: I miei amici ___ molte foto durante il viaggio. Domani noi ___ WhatsApp per parlare con il gruppo.
        blanks: [[condivideranno], [useremo]]
      - id: ordina-passero
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Passerò meno tempo sul telefono.

  - slug: social-media-futuro-confronti
    title: 'Confronti: più… di, meno… di, il più'
    minutes: 8
    items:
      - id: piu-di
        type: multipleChoice
        prompt: YouTube è più utile ___ TikTok.
        options:
          - { text: di, correct: true }
          - {
              text: che,
              feedback: 'Quando confrontiamo due cose (due nomi), usiamo *di*: *più utile di TikTok*.',
            }
          - { text: a, feedback: 'Dopo *più* + aggettivo usiamo *di*: *più utile di TikTok*.' }
      - id: del-mio
        type: multipleChoice
        prompt: Questo profilo è meno utile ___ mio.
        options:
          - { text: del, correct: true }
          - {
              text: di,
              feedback: 'Davanti a *il mio* uniamo *di + il = del*: *meno utile del mio*.',
            }
          - { text: dal, feedback: 'Nel confronto usiamo *di*, e *di + il = del*: *del mio*.' }
      - id: meno-popolare
        type: fillBlank
        prompt: Completa con *più* o *meno*.
        text: Molti giovani usano Instagram, ma pochi usano Facebook. Per i giovani, Facebook è ___ popolare di Instagram.
        blanks: [[meno]]
        wordBank: [più, meno]
      - id: articolo-nome
        type: trueFalse
        prompt: 'Per dire "הכי" con un nome usiamo articolo + nome + *più* + aggettivo: *l''app più popolare*.'
        answer: true
        feedback:
          correct: "Giusto! *L'app più popolare*, *il profilo più interessante*."
          incorrect: "L'articolo va con il nome e *più* va prima dell'aggettivo: *l'app più popolare*."
      - id: la-piattaforma
        type: multipleChoice
        prompt: YouTube è ___ piattaforma più utile.
        options:
          - { text: la, correct: true }
          - { text: il, feedback: '*Piattaforma* è femminile: *la piattaforma più utile*.' }
          - { text: le, feedback: '*Piattaforma* è singolare: *la piattaforma più utile*.' }
      - id: strutture
        type: matching
        prompt: Unisci ogni struttura al suo significato in ebraico.
        pairs:
          - [più… di, יותר… מ…]
          - [meno… di, פחות… מ…]
          - [il più / la più, הכי]
          - [il meno / la meno, הכי פחות]
          - [secondo me, לדעתי]
      - id: passero-meno
        type: fillBlank
        prompt: Completa con *più* o *meno*.
        text: Passo troppo tempo sul telefono. Da domani passerò ___ tempo sul telefono.
        blanks: [[meno]]
        wordBank: [più, meno]
      - id: ordina-facebook
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Facebook è meno usato di Instagram.
