vocabulary:
  - slug: la-mia-vita-nel-passato
    title: La mia vita nel passato
    items: *la-mia-vita-nel-passato-words

activities:
  - slug: la-mia-vita-nel-passato-tempi
    title: 'Passato prossimo e imperfetto: ho mangiato, mangiavo'
    minutes: 8
    items:
      - id: ieri-pizza
        type: multipleChoice
        prompt: Ieri ___ la pizza.
        options:
          - { text: ho mangiato, correct: true }
          - {
              text: mangiavo,
              feedback: "*Ieri* indica un'azione specifica e finita: usiamo il passato prossimo, *ho mangiato*.",
            }
          - {
              text: mangio,
              feedback: '*Mangio* è presente. Con *ieri* usiamo il passato: *ho mangiato*.',
            }
      - id: sabato-cinema
        type: multipleChoice
        prompt: Sabato ___ al cinema.
        options:
          - { text: sono andato, correct: true }
          - {
              text: ho andato,
              feedback: '*Andare* è un verbo di movimento: usa *essere*, *sono andato*.',
            }
          - {
              text: andavo,
              feedback: "*Sabato* indica un'azione specifica, una volta sola: usiamo il passato prossimo, *sono andato*.",
            }
      - id: sorella-andata
        type: multipleChoice
        prompt: Mia sorella ___ al mare.
        options:
          - { text: è andata, correct: true }
          - {
              text: è andato,
              feedback: 'Con *essere* il participio cambia come il soggetto: *mia sorella* è femminile, quindi *è andata*.',
            }
          - { text: ha andata, feedback: '*Andare* usa *essere*: *è andata*.' }
      - id: giocavo
        type: fillBlank
        prompt: Completa con il verbo *giocare* all'imperfetto.
        text: Quando ero bambino, ___ a calcio tutti i giorni.
        blanks: [[giocavo, io giocavo]]
      - id: quartiere-era
        type: trueFalse
        prompt: "Nella frase *Il mio quartiere era molto tranquillo* usiamo l'imperfetto perché è una descrizione."
        answer: true
        feedback:
          correct: "Giusto! Le descrizioni del passato vanno all'imperfetto: *era*."
          incorrect: "Le descrizioni del passato (come era un luogo, una persona) vanno all'imperfetto: *era molto tranquillo*."
      - id: unisci-participi
        type: matching
        prompt: Unisci ogni verbo alla forma di *io* al passato prossimo.
        pairs:
          - [mangiare, ho mangiato]
          - [andare, sono andato]
          - [vedere, ho visto]
          - [fare, ho fatto]
          - [bere, ho bevuto]
      - id: estate-mare
        type: fillBlank
        prompt: Completa con *andare* (passato prossimo) e *essere* (imperfetto).
        text: L'estate scorsa ___ al mare. Il mare ___ molto tranquillo.
        blanks: [[sono andato, sono andata, io sono andato, io sono andata], [era]]
      - id: ordina-calcio
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Da bambino giocavo a calcio con i miei amici.

  - slug: la-mia-vita-nel-passato-domande
    title: 'Domande al passato: Cosa hai fatto? Cosa facevi?'
    minutes: 8
    items:
      - id: studiato
        type: multipleChoice
        prompt: 'Risposta: *Ieri sera ho studiato italiano.* Qual è la domanda?'
        options:
          - { text: Cosa hai studiato ieri sera?, correct: true }
          - {
              text: Cosa ho studiato ieri sera?,
              feedback: "*Ho studiato* è per *io*. Per fare una domanda a un'altra persona (tu) usiamo *hai studiato*.",
            }
          - {
              text: Cosa studi ieri sera?,
              feedback: '*Studi* è presente. Con *ieri sera* usiamo il passato: *Cosa hai studiato?*',
            }
      - id: dove-sei-andato
        type: fillBlank
        prompt: Completa la domanda con il verbo *andare* al passato prossimo.
        text: Sabato sono andato al supermercato. → Dove ___ sabato?
        blanks: [[sei andato, sei andata, tu sei andato, tu sei andata]]
      - id: unisci-domande
        type: matching
        prompt: Unisci ogni domanda alla sua risposta.
        pairs:
          - [Con chi hai parlato ieri?, Ho parlato con la mia migliore amica.]
          - [Cosa hai bevuto al bar?, Ho bevuto un caffè.]
          - [Dove sei andato domenica?, Sono andato al parco.]
          - [Cosa hai comprato la settimana scorsa?, Ho comprato dei vestiti.]
          - [Com'era la tua scuola?, Era grande e moderna.]
      - id: report-serie
        type: multipleChoice
        prompt: 'Il tuo compagno dice: *Ieri sera ho guardato una serie.* Lo racconti al gruppo: Il mio compagno ___ una serie.'
        options:
          - { text: ha guardato, correct: true }
          - {
              text: ho guardato,
              feedback: '*Ho guardato* è per *io*. Per il tuo compagno (lui) usiamo *ha guardato*.',
            }
          - {
              text: hai guardato,
              feedback: '*Hai guardato* è per *tu*. Per il tuo compagno (lui) usiamo *ha guardato*.',
            }
      - id: facevi
        type: multipleChoice
        prompt: "Vuoi chiedere un'abitudine dell'infanzia. Quale domanda usi?"
        options:
          - { text: Cosa facevi quando eri bambino?, correct: true }
          - {
              text: Cosa hai fatto quando eri bambino?,
              feedback: "Per le abitudini del passato usiamo l'imperfetto: *Cosa facevi?*",
            }
          - {
              text: Cosa fai quando eri bambino?,
              feedback: "*Fai* è presente. Per un'abitudine del passato usiamo *facevi*.",
            }
      - id: report-nata
        type: fillBlank
        prompt: 'Completa il report sulla tua compagna con *nascere* (passato prossimo) e *vivere* (imperfetto).'
        text: La mia compagna ___ a Haifa. Da bambina ___ in un quartiere tranquillo.
        blanks: [[è nata, lei è nata], [viveva, lei viveva]]
      - id: seconda-persona
        type: trueFalse
        prompt: '*Dove sei andato?* è una domanda alla seconda persona (tu).'
        answer: true
        feedback:
          correct: Giusto! *Sei andato* = tu. *Sono andato* = io, *è andato* = lui.
          incorrect: '*Sei andato* è la seconda persona (tu). *Sono andato* = io, *è andato* = lui.'
      - id: ordina-mare
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Con chi sei andato al mare?
