vocabulary:
  - slug: musica
    title: Musica
    items: *musica-words

activities:
  - slug: musica-sociali
    title: 'Abilità sociali: domande sulla musica'
    minutes: 8
    items:
      - id: quando-ascolti
        type: multipleChoice
        prompt: 'Marta risponde: *Di solito ascolto musica quando cammino.* Qual è la domanda?'
        options:
          - { text: Quando ascolti musica di solito?, correct: true }
          - {
              text: Quando ascolto musica di solito?,
              feedback: '*Ascolto* è per *io*. Per fare una domanda a un compagno (tu) usiamo *ascolti*.',
            }
          - {
              text: Quando ascoltavi musica di solito?,
              feedback: 'La risposta è al presente (*ascolto*), quindi anche la domanda è al presente: *ascolti*.',
            }
      - id: unisci-domande
        type: matching
        prompt: Unisci ogni domanda alla sua risposta.
        pairs:
          - [Ti piace ballare?, 'Sì, mi piace ballare quando ascolto la salsa.']
          - [Hai ascoltato musica ieri?, 'Sì, ieri ho ascoltato musica pop.']
          - [Sei mai andato a un concerto?, 'No, non sono mai andato a un concerto.']
          - [Che musica ascoltavi da bambino?, Da bambino ascoltavo musica per bambini.]
          - [Sai suonare uno strumento?, 'Sì, so suonare la chitarra.']
      - id: sei-andata
        type: fillBlank
        prompt: Completa la domanda con il verbo *essere*.
        text: Marta, ___ mai andata a un concerto? — Sì, sono andata a un concerto di Marc Anthony.
        blanks: [[sei]]
      - id: mai-andata
        type: multipleChoice
        prompt: 'Marta risponde alla domanda *Hai mai visto un concerto dal vivo?* Quale risposta è giusta?'
        options:
          - { text: 'No, non sono mai andata a un concerto dal vivo.', correct: true }
          - {
              text: 'No, non ho mai andata a un concerto dal vivo.',
              feedback: 'Il verbo *andare* usa *essere*: *sono andata*.',
            }
          - {
              text: 'No, non sono mai andato a un concerto dal vivo.',
              feedback: 'Marta è una donna. Con *essere* il participio cambia: *sono andata*.',
            }
      - id: tu-domande
        type: trueFalse
        prompt: 'Per fare una domanda a un compagno usiamo la forma di *tu*: *Che musica ascolti?*'
        answer: true
        feedback:
          correct: 'Giusto! *Che musica ascolti? Sai cantare? Sei mai andato a un concerto?*'
          incorrect: 'A un compagno parliamo con *tu*: *ascolti, sai, sei andato*.'
      - id: presenta-ascolta
        type: multipleChoice
        prompt: 'Il tuo compagno dice: *Oggi ascolto il reggaeton.* Presentalo alla classe: Oggi ___ il reggaeton.'
        options:
          - { text: ascolta, correct: true }
          - {
              text: ascolto,
              feedback: '*Ascolto* è per *io*. Per parlare del compagno (lui / lei) usiamo *ascolta*.',
            }
          - {
              text: ascolti,
              feedback: '*Ascolti* è per *tu*. Per parlare del compagno (lui / lei) usiamo *ascolta*.',
            }
      - id: presenta-marta
        type: fillBlank
        prompt: Presenta Marta. Completa con *ascoltare* all'imperfetto e *andare* al passato prossimo.
        text: Questa è Marta. Oggi ascolta il reggaeton, ma prima ___ musica pop. L'anno scorso ___ a un concerto di Marc Anthony.
        blanks: [[ascoltava], [è andata, e andata]]
      - id: ordina-felice
        type: reorderSentence
        prompt: Metti le parole in ordine e fai la domanda.
        sentence: Che musica ascolti quando sei felice?

  - slug: musica-narrazione
    title: 'Narrazione mista: oggi ascolto, ieri ho ascoltato, prima ascoltavo'
    minutes: 8
    items:
      - id: ieri-ho-ascoltato
        type: multipleChoice
        prompt: Ieri ___ una canzone italiana.
        options:
          - { text: ho ascoltato, correct: true }
          - {
              text: ascoltavo,
              feedback: "*Ieri* + un'azione precisa e finita: usiamo il passato prossimo, *ho ascoltato*.",
            }
          - {
              text: ascolto,
              feedback: '*Ascolto* è presente. Con *ieri* usiamo il passato: *ho ascoltato*.',
            }
      - id: da-bambino
        type: multipleChoice
        prompt: Quando ero bambino, ___ musica con i miei genitori.
        options:
          - { text: ascoltavo, correct: true }
          - {
              text: ho ascoltato,
              feedback: "*Quando ero bambino* parla di un'abitudine del passato: usiamo l'imperfetto, *ascoltavo*.",
            }
          - {
              text: ascolto,
              feedback: "*Ascolto* è presente. Per un'abitudine del passato usiamo *ascoltavo*.",
            }
      - id: shakira-nata
        type: fillBlank
        prompt: Completa al passato prossimo con *nascere* e *diventare*.
        text: Shakira ___ a Barranquilla nel 1977 e ___ famosa in tutto il mondo.
        blanks: [[è nata, e nata], [è diventata, e diventata]]
      - id: essere-avere
        type: trueFalse
        prompt: 'Il verbo *andare* fa il passato prossimo con *avere*: *ho andato a un concerto*.'
        answer: false
        feedback:
          correct: 'Giusto! *Andare*, *nascere* e *diventare* usano *essere*: *sono andato / andata*.'
          incorrect: '*Andare* usa *essere*: *sono andato / andata a un concerto*.'
      - id: ieri-oggi
        type: matching
        prompt: Unisci il passato al presente.
        pairs:
          - [Ieri ho studiato tutta la notte., Oggi sono stanco.]
          - [Ieri ho ascoltato una canzone triste., Oggi mi sento nostalgico.]
          - [Da bambino ascoltavo questa canzone con mio padre., Oggi mi ricorda la mia famiglia.]
          - [Una volta ho cantato questa canzone a una festa., Oggi mi fa ridere.]
      - id: prima-oggi
        type: fillBlank
        prompt: Completa con *piacere* all'imperfetto e *preferire* al presente.
        text: Prima mi ___ il rock, ma oggi ___ il pop.
        blanks: [[piaceva], [preferisco]]
      - id: concerto-pausini
        type: multipleChoice
        prompt: L'anno scorso noi ___ a un concerto di Laura Pausini.
        options:
          - { text: siamo andati, correct: true }
          - {
              text: andavamo,
              feedback: "*L'anno scorso* + un'azione finita, una volta: usiamo il passato prossimo, *siamo andati*.",
            }
          - { text: abbiamo andato, feedback: 'Il verbo *andare* usa *essere*: *siamo andati*.' }
      - id: ordina-ricorda
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Oggi questa canzone mi ricorda la mia famiglia.
