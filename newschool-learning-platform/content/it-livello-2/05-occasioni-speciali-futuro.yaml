vocabulary:
  - slug: occasioni-speciali-futuro
    title: 'Occasioni speciali: futuro'
    items: *occasioni-speciali-futuro-words

activities:
  - slug: occasioni-speciali-futuro-semplice
    title: 'Futuro semplice: festeggerò, andremo, ci sarà'
    minutes: 8
    items:
      - id: festeggero
        type: multipleChoice
        prompt: Sabato ___ il mio compleanno.
        options:
          - { text: festeggerò, correct: true }
          - {
              text: festeggiarò,
              feedback: 'I verbi in *-are* cambiano la *a* in *e*: *festeggerò*.',
            }
          - {
              text: festeggierò,
              feedback: 'I verbi in *-giare* perdono la *i* al futuro: *festeggerò*, come *mangerò*.',
            }
      - id: mangeremo
        type: fillBlank
        prompt: Completa con il futuro di *mangiare* e *ballare*.
        text: Alla festa noi ___ la pizza e ___ tutta la sera.
        blanks: [[mangeremo], [balleremo]]
      - id: unisci-irregolari
        type: matching
        prompt: Unisci ogni verbo alla forma di *io* al futuro.
        pairs:
          - [andare, andrò]
          - [fare, farò]
          - [venire, verrò]
          - [bere, berrò]
          - [essere, sarò]
      - id: ci-sara
        type: multipleChoice
        prompt: Domani ___ una festa a casa mia.
        options:
          - { text: ci sarà, correct: true }
          - {
              text: ci saranno,
              feedback: '*Una festa* è singolare: *ci sarà*. *Ci saranno* è per il plurale (*ci saranno molti invitati*).',
            }
          - {
              text: c'era,
              feedback: "*C'era* è passato. Con *domani* usiamo il futuro: *ci sarà*.",
            }
      - id: senza-pronome
        type: trueFalse
        prompt: 'In italiano spesso non diciamo il pronome: *Festeggerò* invece di *Io festeggerò*.'
        answer: true
        feedback:
          correct: Giusto! La fine del verbo (*-ò*) dice già che sono io.
          incorrect: "Di solito non diciamo *io*: la fine del verbo (*-ò* in *festeggerò*) dice già chi fa l'azione."
      - id: preparera
        type: fillBlank
        prompt: Completa con il futuro di *preparare*.
        text: Mia madre ___ la torta per la festa.
        blanks: [[preparerà]]
      - id: verranno
        type: multipleChoice
        prompt: I miei amici ___ alla festa.
        options:
          - { text: verranno, correct: true }
          - {
              text: veniranno,
              feedback: '*Venire* è irregolare al futuro: *verrò, verrai, verrà… verranno*.',
            }
          - { text: verrà, feedback: '*I miei amici* è plurale (loro): usiamo *verranno*.' }
      - id: ordina-natale
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: A dicembre festeggerò il Natale con la mia famiglia.

  - slug: occasioni-speciali-futuro-domande
    title: 'Domande al futuro: Cosa farai? Chi verrà?'
    minutes: 8
    items:
      - id: dove-sara
        type: multipleChoice
        prompt: Dove ___ la festa sabato prossimo?
        options:
          - { text: sarà, correct: true }
          - {
              text: è stata,
