# Cycle "Occasioni speciali: futuro", converted from the Italian level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-2
slug: occasioni-speciali-futuro
title: 'Occasioni speciali: futuro'
goal: Parlare di feste e piani con il futuro semplice e fare domande al futuro.
position: 5
status: published

review:
  - >-
    The two workbook exercises ("Futuro semplice" and "Domande al futuro") are NEW:
    the notebook has no self-study exercises. They were written from the cycle's
    summary rules, its examples and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    The cycle's first heading is in Spanish in the notebook ("Ocasiones especiales
    Futuro"); the title is "Occasioni speciali: futuro".
  - >-
    Skills: the notebook's "Abilità da praticare" are general (speaking, listening,
    writing; moved to a teacher note). The two cycle skills come from its goals and
    summary: "Futuro semplice" and "Domande al futuro".
  - >-
    The lesson summary and the Mori homework are in Hebrew in the notebook. They are
    rewritten in Italian (the Hebrew translations of the examples are left out; the
    vocabulary keeps its Hebrew glosses). Please check.
  - >-
    Summary, grammar: the notebook's table gives only "io" and "noi" for three
    verbs. A full table (io… loro) for festeggiare, invitare, essere, andare and
    venire was ADDED, with rules the notebook does not give: -are verbs change -a-
    to -e- (invitare → inviterò), verbs in -giare / -ciare drop the -i- (festeggiare
    → festeggerò, mangiare → mangerò), and the irregular futures used in the cycle
    (andrò, sarò, farò, verrò, berrò). Please confirm.
  - >-
    Corrections: introduction frame "A una festa, vado sempre a ___ (ballare,
    cantare, mangiare, parlare con gli amici…)" → "A una festa, ___ sempre (ballo,
    canto, mangio, parlo con gli amici…)"; warm-up 4 "Perché preferirai questo
    metodo?" → "Perché preferisci questo metodo?"; Activity 1 example "Festeggerò il
    mio compleanno sabato sera. Ti inviterò alla festa." (odd inside an invitation)
    → "Sei invitato! Festeggerò il mio compleanno sabato sera a casa mia."
  - >-
    Mori: the general instruction "talk to Mori in English or Hebrew to start, but
    answer only in Italian" is now "write to Mori in Italian; you can ask for an
    explanation in Hebrew" (the tips callout). Part 4 "talk for 1–2 minutes" → "write
    5 or 6 sentences" (it is a written chat). Parts 1 and 3 are similar; both are
    kept.
  - >-
    The empty answer lines in Activities 2 and 4 (group presentation, three
    sentences) became answer boxes. Activity 3 needs pictures of celebrations chosen
    by the teacher (not in the notebook). The notebook gives no activity times, so no
    minutes are recorded.
  - >-
    Links: the gamma.app lesson slides link is not allowed and is left out (see the
    teacher note). The invitation template (Google Docs) is kept as the resource of
    Activity 1, without "?usp=sharing"; "?new" was removed from the Quizlet link.
    The "Risposta dello studente 1/2/3" lines are replaced by the answer boxes.
  - >-
    Vocabulary: "Viaggio – טיול" → "נסיעה / טיול"; "Partire – לצאת / לעזוב" → "לצאת
    לדרך / לעזוב". Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: occasioni-speciali-futuro-classe
    title: 'In classe: Occasioni speciali (futuro)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Occasioni speciali: futuro'
      - id: skills
        type: cycleOverview
        skills:
          - name: Futuro semplice
            description: '*-ò, -ai, -à, -emo, -ete, -anno*: Festeggerò il mio compleanno con gli amici.'
          - name: Domande al futuro
            description: '*Cosa farai? Dove sarà la festa? Chi verrà?*'
      - id: quizlet
        type: externalLink
        label: Occasioni speciali (futuro) su Quizlet
        url: https://quizlet.com/nl/1168204712/occasioni-speciali-futuro-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Giro di presentazioni
      - id: intro
        type: sentenceFrame
        prompt: "Di' il tuo nome e completa **una** di queste frasi: *Mi piace / Non mi piace organizzare feste perché ___. · A una festa, ___ sempre (ballo, canto, mangio, parlo con gli amici…). · In futuro, festeggerò ___. · Preferisco ___ (le feste grandi / le feste piccole). · Una festa senza ___ non è una vera festa.*"
        frame: Io sono ___. ___.
        example: Io sono Dana. In futuro, festeggerò la mia laurea con tutta la famiglia.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup
        type: discussionQuestions
        items:
          - question: Come festeggerai il tuo prossimo compleanno? Con chi sarai?
            frame: Festeggerò ___ (con la famiglia, con gli amici, al ristorante, a casa…). Sarò con ___.
          - question: Durante le prossime feste (Natale, Capodanno, Pasqua…), cosa farai? Con chi starai?
            frame: Durante le feste ___ (viaggerò, visiterò la famiglia, preparerò cibi speciali…). Starò con ___.
          - question: In futuro inviterai molte persone al tuo matrimonio o a un'altra festa importante? Perché?
            frame: Inviterò ___ (molte persone, solo la famiglia…) perché ___.
          - question: Come inviterai le persone alla tua festa? Perché preferisci questo metodo?
            frame: Inviterò le persone con ___ (WhatsApp, il telefono…) perché ___ (è veloce, è personale…).
          - question: Quale occasione speciale festeggerai l'anno prossimo?
            frame: L'anno prossimo festeggerò ___ (un compleanno, una laurea, un nuovo lavoro…).
          - question: Cosa farai per festeggiare l'occasione?
            frame: Per festeggiare ___ (organizzerò una festa, cenerò fuori, viaggerò, inviterò gli amici…).
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: Inviti'
        skills: [Futuro semplice]
        steps:
          - 'Scrivi **2 inviti** al futuro semplice: uno per una festa di compleanno e uno per un matrimonio. Puoi usare il modello.'
          - Leggi uno dei tuoi inviti alla classe.
        example: '*Sei invitato! Festeggerò il mio compleanno sabato sera a casa mia. Mangeremo, balleremo e ci divertiremo.*'
        resource:
          label: Modello di invito
          url: https://docs.google.com/document/d/1e4ppNQjM2z7Ec_NRDb1mbzdhnjdh7M-gaKJuUQmGJh8/edit
      - id: act1-invites
        type: discussionQuestions
        title: I miei inviti
        items:
          - question: Invito per una festa di compleanno
            frame: Sei invitato / invitata! Festeggerò ___. La festa sarà ___. Mangeremo ___ e ___.
          - question: Invito per un matrimonio
            frame: Siete invitati! Ci sposeremo ___. La festa sarà ___.
      - id: act2
        type: classActivity
        title: 'Attività 2: Gioco di ruolo. Organizziamo una festa!'
        skills: [Futuro semplice, Domande al futuro]
        steps:
          - Lavorate in coppia o in gruppi di 3.
          - "Scegliete un'occasione speciale: compleanno, matrimonio, laurea, festa a sorpresa, viaggio."
          - Rispondete alle domande qui sotto, al futuro.
          - Presentate la vostra festa alla classe.
      - id: act2-plan
        type: discussionQuestions
        title: La nostra festa
        items:
          - question: Quale evento avete scelto?
          - question: Dove sarà la festa?
          - question: Cosa mangerete e berrete?
          - question: Chi verrà alla festa?
          - question: Che musica o attività ci saranno?
          - question: Come decorerete il luogo?
      - id: act2-presentation
        type: discussionQuestions
        title: Presentazione del gruppo
        items:
          - question: La nostra festa ___.
          - question: ___.
          - question: ___.
      - id: act3
        type: classActivity
        title: 'Attività 3: Tradizioni e feste (immagini)'
        skills: [Domande al futuro, Futuro semplice]
        steps:
          - Guarda le immagini di feste che mostra l'insegnante (matrimonio, compleanno, Capodanno, laurea…).
          - Scegli 2 immagini.
          - Rispondi alle domande qui sotto.
          - Di' se parteciperai alla festa e perché.
      - id: act3-questions
        type: discussionQuestions
        title: Le mie immagini
        items:
          - question: Perché faranno una festa?
            frame: Faranno una festa perché ___.
          - question: Dove sarà la festa?
            frame: La festa sarà ___.
          - question: Quando sarà la festa?
            frame: La festa sarà ___.
          - question: Parteciperai alla festa? Perché?
            frame: Sì, parteciperò perché ___. / No, non parteciperò perché ___.
      - id: act4
        type: classActivity
        title: 'Attività 4: Calendario delle celebrazioni'
        skills: [Futuro semplice, Domande al futuro]
        steps:
          - Lavorate in gruppi di 3 o 4.
          - Scrivete almeno 5 celebrazioni per l'anno prossimo.
          - Scrivete 3 frasi complete al futuro.
          - 'Fate domande agli altri gruppi: *Chi verrà alla festa? Dove sarà la festa? Cosa farete per festeggiare?*'
      - id: act4-calendar
        type: discussionQuestions
        title: Il nostro calendario
        items:
          - question: 'A gennaio: ___'
          - question: 'A marzo: ___'
          - question: 'A luglio: ___'
          - question: 'A ottobre: ___'
          - question: 'A dicembre: ___'
      - id: act4-sentences
        type: discussionQuestions
        title: Tre frasi al futuro
        items:
          - question: ___.
            frame: A ___ festeggeremo ___.
          - question: ___.
          - question: ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Livello A2 (pratica di conversazione). Obiettivi: parlare di piani e feste
          future con il **futuro semplice** (*-ò, -ai, -à, -emo, -ete, -anno*) e usare il
          vocabolario di feste, inviti e occasioni speciali. Abilità: produzione orale
          (rispondere e fare domande al futuro), comprensione orale (capire compagni e
          insegnante) e produzione scritta (scrivere inviti e un calendario di feste). Le
          slide della lezione erano su gamma.app, che non è nella lista dei link
          permessi: se le usi, condividile tu dallo schermo.
      - id: n-intro
        anchor: intro-title
        text: Fai prima il tuo esempio e poi chiedi a ogni studente di dire 2 frasi.
      - id: n-warmup
        anchor: warmup-title
        text: Fai almeno due domande a ogni studente. Gli esempi tra parentesi aiutano a rispondere.
      - id: n-act1
        anchor: act1
        text: Condividi il modello di invito sullo schermo. Controlla che gli studenti usino il futuro semplice (*festeggerò, inviterò, mangeremo*).
      - id: n-act2
        anchor: act2
        text: Dividi la classe in coppie o gruppi di 3. Ogni gruppo presenta la festa con 3 frasi al futuro.
      - id: n-act3
        anchor: act3
        text: Prepara prima della lezione alcune immagini di feste (matrimonio, compleanno, Capodanno, laurea) e mostrale sullo schermo. Il quaderno non ha immagini.
      - id: n-act4
        anchor: act4
        text: Dividi la classe in gruppi di 3–4. Alla fine ogni gruppo fa almeno una domanda a un altro gruppo.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: occasioni-speciali-futuro-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: overview
        type: text
        text: Oggi abbiamo parlato di **eventi futuri** e di **feste** (festa, matrimonio, compleanno), abbiamo descritto piani e celebrazioni e abbiamo fatto domande sul futuro.
      - id: rules-futuro
        type: ruleSummary
        skill: Futuro semplice
        rules:
          - text: 'Per parlare del futuro usiamo il **futuro semplice**: prendiamo il verbo e cambiamo la fine.'
            examples: ['festeggiare → festeggerò', 'invitare → inviterò', 'partire → partirò']
          - text: 'I verbi in **-are** cambiano la *a* in *e* (*invitare → inviterò*). I verbi in **-giare** e **-ciare** perdono la *i* (*festeggiare → festeggerò, mangiare → mangerò*).'
          - text: 'Alcuni verbi sono irregolari:'
            examples:
              ['andare → andrò', 'essere → sarò', 'fare → farò', 'venire → verrò', 'bere → berrò']
          - text: 'Usiamo il futuro per i **piani**, le **decisioni** e gli **eventi futuri**.'
            examples:
              - Festeggerò il mio compleanno. (un piano)
              - Andrò al ristorante. (una decisione)
              - Ci sarà una festa. (un evento futuro)
          - text: "Di solito non diciamo il pronome (*io, tu…*): il verbo dice già chi fa l'azione."
            examples: ['Festeggerò (non è necessario: Io festeggerò)']
      - id: futuro-table
        type: table
        caption: Futuro semplice
        header: [Persona, festeggiare, invitare, essere, andare, venire]
        rows:
          - [io, festeggerò, inviterò, sarò, andrò, verrò]
          - [tu, festeggerai, inviterai, sarai, andrai, verrai]
          - [lui / lei, festeggerà, inviterà, sarà, andrà, verrà]
          - [noi, festeggeremo, inviteremo, saremo, andremo, verremo]
          - [voi, festeggerete, inviterete, sarete, andrete, verrete]
          - [loro, festeggeranno, inviteranno, saranno, andranno, verranno]
      - id: rules-domande
        type: ruleSummary
        skill: Domande al futuro
        rules:
          - text: 'Per parlare dei piani bisogna saper fare domande: parola interrogativa + verbo al futuro.'
            examples:
              - Cosa farai?
              - Dove sarà la festa?
              - Chi verrà?
              - Come festeggerai?
          - text: 'Rispondi con una frase completa, al futuro.'
            examples: [Festeggerò il mio compleanno con gli amici in un ristorante.]
      - id: words
        type: callout
        tone: info
        title: Parole importanti
        text: '*la festa, il compleanno, il matrimonio, invitare, organizzare, gli invitati*'
      - id: recap
        type: callout
        tone: tip
        title: Da ricordare
        text: |-
          Usa il futuro per parlare dei tuoi piani.
          Fai attenzione alla fine del verbo.
          Prova a parlare con frasi complete.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: occasioni-speciali-futuro-compiti
    title: Compiti con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia un messaggio e invialo. Mori ti farà delle domande e ti correggerà. Rispondi solo in italiano.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Parte 1: Piani per il futuro'
        intro: 'Rispondi ad almeno 5 domande. Prova a usare *festeggerò, andrò, inviterò, mangerò, farò*. Esempi: *Festeggerò il mio compleanno con gli amici. Andrò al ristorante. Inviterò la mia famiglia.*'
        message: Mori, voglio parlare dei miei piani per il futuro. Fammi delle domande e correggimi.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Parte 2: Organizzare una festa'
        intro: 'Rispondi alle domande di Mori (*Dove sarà la festa? Chi inviterai? Cosa mangerete? Che musica ci sarà?*) con risposte più lunghe: *Inviterò i miei amici e mangeremo pizza e pasta.*'
        message: Mori, voglio organizzare una festa. Fammi delle domande.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Parte 3: Domande'
        intro: Rispondi ad almeno 5 domande, con frasi complete e al futuro.
        message: Mori, fammi delle domande sulle feste e sul futuro.
      - id: mori-4
        type: aiTutorPrompt
        title: "Parte 4: I miei piani per l'anno prossimo"
        intro: 'Poi scrivi 5 o 6 frasi. Usa *A gennaio… A luglio… A dicembre…* Esempio: *A luglio andrò in vacanza. A dicembre festeggerò il Natale con la mia famiglia.*'
        message: Mori, ti racconterò i miei piani per l'anno prossimo. Correggimi.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Non sei sicuro? Prova lo stesso: Mori ti correggerà, ed è così che si impara.
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: occasioni-speciali-futuro-pratica
    book: workbook
    title: 'Pratica: Occasioni speciali (futuro)'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Esercitati sulle due abilità del ciclo. Ogni risposta viene corretta subito e puoi riprovare.
      - id: ex-semplice
        type: activity
        activity: occasioni-speciali-futuro-semplice
      - id: ex-domande
        type: activity
        activity: occasioni-speciali-futuro-domande

