# Cycle "Sostenibilità", converted from the Italian level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-2
slug: sostenibilita
title: Sostenibilità
goal: Parlare di progetti futuri con il futuro semplice e fare confronti con più, meno e quanto.
position: 16
status: published

review:
  - >-
    The two workbook exercises ("Futuro semplice e avere intenzione di" and "Confronti e
    superlativi") are NEW: the notebook has no self-study exercises. They were written
    from the cycle's two skills, its summary rules, the activity examples and its
    vocabulary. Please check level, wording and every right answer before students see
    them.
  - >-
    Summary, "Avere intenzione di + infinito": the notebook says "in italiano non usiamo
    ir a + infinito come in spagnolo", a note copied from the Spanish notebook that means
    nothing to Hebrew-speaking students. Rewritten as an Italian rule: for the future we do
    not say "vado a usare"; we use the futuro semplice (Userò meno plastica) or "avere
    intenzione di + infinito". Please confirm.
  - >-
    Summary, superlatives: the rule "il più / la più + aggettivo" does not match the
    examples (il mezzo di trasporto più ecologico). Rewritten as: article + noun + più +
    adjective (la soluzione più sostenibile), or il / la più + adjective when the noun is
    already clear (Questa soluzione è la più sostenibile), plus "uno dei / una delle… più".
  - >-
    Summary, comparatives: two points were ADDED from the cycle's own examples. (1) di +
    article joins (dell'auto, della borsa, del cibo), with a small table of the forms used.
    (2) In "tanto… quanto" the word "tanto" is usually left out (La mia città è verde
    quanto la tua), which is what all the notebook's examples do. Activity 3's model "ricicla
    più plastica che carta" uses "più… che" (two nouns compared), which the summary did not
    explain: a short rule was added. Please confirm.
  - >-
    Corrections: warm-up (A2 avanzato) frame "Per mantenere la mia casa / il mio quartiere
    più pulito" → "più pulita / più pulito" (agreement with casa); frame "è / sono più
    ecologico / ecologici" → "più ecologico / ecologica / ecologici / ecologiche"; Activity 1
    question "Cosa faremo se vogliamo salvare il pianeta?" → "Cosa faremo per salvare il
    pianeta?" (mixed tenses).
  - >-
    The lesson slides are a gamma.app link, which is not allowed on the platform: left out
    and mentioned in a teacher note.
  - >-
    The homework in the notebook is written work (5 parts) sent to the teacher "in un
    documento o in un'e-mail", with no Mori messages. It is kept as written tasks with answer
    boxes in the homework section (the teacher sees the answers); the "Consegna" line was
    adapted to say so. No Mori messages were invented.
  - >-
    The notebook has no lesson plan saying which activities to choose; the teacher note
    suggests one activity per skill (Activity 1 or 5 for the future, Activity 2 or 4 for
    comparisons; Activity 3 practises both). Activity 1 needs images and Activity 4 a world
    map or list of cities chosen by the teacher (not in the notebook).
  - >-
    Activity 5's three texts (Chile, Colombia, Mexico) are kept as in the notebook. Their
    facts (Atacama solar plants, electric buses in Bogotá, reforestation in Mexico) were
    not checked; please confirm they are still accurate.
  - >-
    Times: Activity 5 "20-25 minuti" recorded as 25; Activity 3 rounds (5 + 5 + 10) recorded
    as 20. The Quizlet link is kept without its "?new" parameter. The "Risposta dello
    studente 1/2/3" lines are replaced by the answer boxes. The empty "Data / Partecipanti"
    lines were left out.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: sostenibilita-classe
    title: 'In classe: Sostenibilità'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Sostenibilità
      - id: skills
        type: cycleOverview
        skills:
          - name: Futuro semplice
            description: '*Riciclerò, useremo, sarà*… e *avere intenzione di* + infinito'
          - name: Confronti
            description: '*più… di, meno… di, (tanto)… quanto* e il superlativo *il / la più*'
      - id: quizlet
        type: externalLink
        label: Sostenibilità su Quizlet
        url: https://quizlet.com/br/1191222314/sostenibilita-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Giro di presentazioni
      - id: intro
        type: sentenceFrame
        prompt: Presentati e di' se ricicli.
        frame: Mi chiamo ___. Riciclo / A volte riciclo / Non riciclo mai.
        example: Mi chiamo Marta. A volte riciclo.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup-basic-title
        type: heading
        level: 4
        text: A2 base
      - id: warmup-basic
        type: discussionQuestions
        items:
          - question: Cosa usi per trasportare la spesa e perché?
            frame: Uso ___ perché ___.
          - question: Come trasporti l'acqua quando esci di casa?
            frame: 'Quando esco di casa, uso ___. (una bottiglia di plastica, una bottiglia riutilizzabile, un thermos, un bicchiere)'
          - question: Cosa fai a casa per consumare meno elettricità?
            frame: A casa ___ per consumare meno elettricità.
          - question: Che tipo di rifiuti ricicli di più?
            frame: Riciclo di più ___. (plastica, carta, vetro, lattine)
          - question: Come preferisci spostarti nella tua città e perché?
            frame: Preferisco spostarmi in / con ___ perché ___.
          - question: Cosa fai con le bottiglie o le lattine quando sono vuote?
            frame: Quando una bottiglia o una lattina è vuota, io ___.
      - id: warmup-adv-title
        type: heading
        level: 4
        text: A2 avanzato
      - id: warmup-adv
        type: discussionQuestions
        items:
          - question: Come puoi usare meno acqua nella tua routine quotidiana?
            frame: Posso usare meno acqua quando ___.
          - question: Cosa fai per mantenere la tua casa o il tuo quartiere più puliti?
            frame: Per mantenere la mia casa più pulita / il mio quartiere più pulito, io ___.
          - question: Quali prodotti compri che sono migliori per l'ambiente?
            frame: Compro ___ perché è / sono più ecologico / ecologica / ecologici / ecologiche.
          - question: Cosa fai con i vestiti che non usi più?
            frame: 'Quando non uso più un vestito, io ___. (lo dono, lo vendo, lo regalo, lo riciclo)'
          - question: In futuro, quali cambiamenti vorresti fare nella tua vita per inquinare meno?
            frame: In futuro vorrei ___ per inquinare meno.
          - question: Quale mezzo di trasporto usi di più nella vita quotidiana? Quali vantaggi ha?
            frame: Uso di più ___. È comodo / economico / veloce / ecologico perché ___.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: Come salveremo il pianeta?'
        skills: [Futuro semplice]
        steps:
          - "Guarda le immagini dell'insegnante (inquinamento, riciclo, energia rinnovabile, plastica, foreste, mezzi di trasporto, città pulite e sporche) e rispondi: **Cosa faremo per salvare il pianeta?**"
          - 'In piccoli gruppi, create una mini campagna ecologica: uno slogan breve, tre frasi al futuro semplice e una frase di avvertimento con **se**.'
          - Ogni gruppo presenta la propria campagna in 1 minuto.
          - 'La classe vota la campagna più creativa, più realistica, più utile e più convincente.'
        example: |-
          **Slogan:** *Il riciclo è il futuro!*
          **Frasi al futuro:** *Ricicleremo di più. Useremo meno plastica. Cammineremo di più e useremo meno la macchina.*
          **Frase con se:** *Se non cambieremo le nostre abitudini, il pianeta soffrirà.*
      - id: act1-campaign
        type: discussionQuestions
        title: La nostra campagna
        items:
          - question: 'Slogan: ___'
          - question: 'Frase al futuro 1: ___'
          - question: 'Frase al futuro 2: ___'
          - question: 'Frase al futuro 3: ___'
          - question: 'Frase con se: Se ___, ___.'
      - id: act2
        type: classActivity
        title: 'Attività 2: Il mercato ecologico'
        skills: [Confronti]
        steps:
          - "L'aula diventa un mercato ecologico. Ogni gruppo riceve un prodotto o una coppia di prodotti da confrontare."
          - Ogni gruppo prepara una breve difesa del proprio prodotto con frasi di confronto.
          - 'Gioco di ruolo: i venditori devono convincere gli acquirenti; gli acquirenti fanno domande.'
          - 'La classe vota: quale prodotto è stato il più convincente?'
        example: |-
          *La nostra borsa è più ecologica della borsa di plastica.*
          *La bicicletta è meno inquinante dell'auto.*
          *Il cibo locale è più sostenibile del cibo importato.*
          *Una bottiglia riutilizzabile è migliore per l'ambiente.*
        wordBank:
          - borsa di stoffa / borsa di plastica
          - cibo locale / cibo importato
          - bicicletta / auto
          - bottiglia riutilizzabile / bottiglia di plastica
          - vestiti usati / vestiti nuovi
          - energia solare / energia tradizionale
      - id: act2-seller
        type: discussionQuestions
        title: Il venditore
        items:
          - question: Questo prodotto è più ecologico perché ___.
          - question: È meno inquinante di ___.
          - question: È anche più utile perché ___.
      - id: act2-buyer
        type: callout
        tone: info
        title: "L'acquirente: domande utili"
        text: |-
          *Perché questo prodotto è migliore?*
          *È più economico o più caro?*
          *È più ecologico di quello?*
          *Quanto dura?*
          *Perché dovrei comprarlo?*
      - id: act3
        type: classActivity
        title: 'Attività 3: Intervista ecologica'
        skills: [Futuro semplice, Confronti]
        minutes: 20
        steps:
          - 'Primo round (5 minuti): lavora in coppia. Scegli 3 domande qui sotto e intervista il compagno.'
          - 'Secondo round (5 minuti): cambia partner e fai nuove domande.'
          - 'Terzo round (10 minuti): presenta il tuo ultimo partner alla classe.'
        example: |-
          *La mia compagna ricicla più plastica che carta.*
          *In futuro userà di più la bicicletta.*
          *Vuole comprare meno plastica e usare più prodotti riutilizzabili.*
      - id: act3-questions
        type: discussionQuestions
        title: Domande per l'intervista
        items:
          - question: Cosa fai a casa per usare meno acqua?
          - question: Cosa farai domani per prenderti cura del pianeta?
          - question: "Cosa usi di più: la bicicletta o l'auto? Perché?"
          - question: 'Cosa preferisci: vestiti nuovi o vestiti usati?'
          - question: Quale prodotto inquina di più in casa tua?
          - question: 'Cosa ricicli di più: la plastica o la carta?'
          - question: In futuro, cosa vorresti cambiare nella tua vita per aiutare il pianeta?
          - question: Chi nella tua famiglia ricicla di più?
      - id: act4
        type: classActivity
        title: 'Attività 4: Mappa verde'
        skills: [Confronti]
        steps:
          - "Guarda la mappa del mondo o la lista di città e paesi dell'insegnante."
          - Confronta due città o due paesi che conosci.
          - 'Variante: create insieme la «mappa verde della classe». Ognuno dice una frase di confronto sulla propria città o sul proprio paese.'
        example: |-
          *Barcellona è più pulita di Buenos Aires.*
          *Tel Aviv è moderna quanto Madrid.*
          *Curitiba è più verde di molte città brasiliane.*
          *La mia città è meno rumorosa di San Paolo.*
          *Il trasporto pubblico di questa città è più organizzato di quello della mia città.*
      - id: act4-sentences
        type: discussionQuestions
        title: Le mie frasi
        items:
          - question: ___ è più ___ di ___.
          - question: ___ è meno ___ di ___.
          - question: ___ è ___ quanto ___.
      - id: act5
        type: classActivity
        title: 'Attività 5: Quale paese sarà più verde?'
        skills: [Futuro semplice, Confronti]
        minutes: 25
        steps:
          - 'La classe si divide in 3 gruppi. Gruppo 1: Cile. Gruppo 2: Colombia. Gruppo 3: Messico.'
          - Ogni gruppo legge il testo sul proprio paese e risponde alle domande guida.
          - Ogni gruppo prepara 2 confronti, 2 frasi al futuro e una breve presentazione.
          - Ogni gruppo presenta le sue frasi alla classe.
          - 'Dibattito finale: **Quale paese sarà il più verde in futuro e perché?** Votate e spiegate la vostra risposta.'
        example: |-
          **Frasi al futuro:** *Entro il 2050 il Messico avrà più foreste. Bogotà userà più autobus elettrici. Il Cile produrrà più energia rinnovabile.*
          **Confronti:** *Il Cile ha più energia solare della Colombia. La Colombia avrà trasporti più puliti di molte città. Il Messico avrà più alberi di oggi.*
      - id: act5-text1-title
        type: heading
        level: 4
        text: 'Testo 1: Cile, energia solare nel deserto di Atacama'
      - id: act5-text1
        type: text
        text: |-
          In Cile, nel deserto di Atacama, ci sono grandi progetti di energia solare. In questa zona il sole è molto forte e gli impianti solari producono molta elettricità pulita. Il Cile è già uno dei paesi con più energia solare dell'America Latina.
          In futuro, il Cile avrà più elettricità rinnovabile di molti paesi vicini. Entro il 2050, una grande parte dell'energia sarà solare o eolica.
      - id: act5-text1-questions
        type: discussionQuestions
        items:
          - question: Perché il Cile ha molta energia solare?
          - question: Cosa succederà all'elettricità in Cile in futuro?
          - question: Quale paese conosci che usa meno energia solare del Cile?
      - id: act5-text2-title
        type: heading
        level: 4
        text: 'Testo 2: Colombia, trasporto elettrico a Bogotà'
      - id: act5-text2
        type: text
        text: |-
          Bogotà ha un progetto per usare più autobus elettrici. La città vuole ridurre l'inquinamento dell'aria e migliorare la salute delle persone. Oggi ci sono già molti autobus elettrici in città.
          In futuro, Bogotà sarà una delle città con più trasporti elettrici dell'America Latina. Le strade saranno più pulite e ci sarà meno rumore e meno fumo.
      - id: act5-text2-questions
        type: discussionQuestions
        items:
          - question: Perché Bogotà vuole usare autobus elettrici?
          - question: Come sarà Bogotà in futuro con più trasporti elettrici?
          - question: Quale città conosci che ha un sistema di trasporti meno pulito di Bogotà?
      - id: act5-text3-title
        type: heading
        level: 4
        text: 'Testo 3: Messico, riforestazione nel sud del paese'
      - id: act5-text3
        type: text
        text: |-
          In Messico esiste un grande programma di riforestazione. Il progetto aiuta gli agricoltori a piantare alberi nelle zone rurali. Milioni di nuovi alberi stanno crescendo.
          In futuro, il Messico avrà più foreste di oggi e la terra sarà più fertile. Questo progetto aiuterà anche le comunità locali perché ci sarà più lavoro nelle zone rurali.
      - id: act5-text3-questions
        type: discussionQuestions
        items:
          - question: Perché il Messico sta piantando tanti alberi?
          - question: Cosa succederà in futuro se i progetti di riforestazione continueranno?
          - question: Quale paese ha meno foreste del Messico?
      - id: act5-table
        type: discussionQuestions
        title: Tabella di lavoro
        items:
          - question: 'Confronto 1 tra i paesi: ___'
          - question: 'Confronto 2 tra i paesi: ___'
          - question: 'Cile, 2 previsioni: ___'
          - question: 'Colombia, 2 previsioni: ___'
          - question: 'Messico, 2 previsioni: ___'
          - question: Quale paese sarà il più verde?
            frame: Secondo me, ___ sarà il paese più verde perché ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Futuro semplice** (con *avere intenzione di*) e
          **Confronti** (comparativi e superlativi). Il quaderno non indica quali attività
          scegliere: si consiglia un'attività per abilità, per esempio l'Attività 1 o 5 per il
          futuro e l'Attività 2 o 4 per i confronti. L'Attività 3 pratica tutte e due. La
          presentazione della lezione (gamma.app) non è disponibile sulla piattaforma.
      - id: n-objectives
        anchor: null
        text: >-
          Obiettivi: parlare di abitudini ecologiche quotidiane; dire cosa faranno in futuro
          per aiutare il pianeta; confrontare prodotti, abitudini, città e paesi; usare il
          futuro semplice e i comparativi e superlativi in un contesto pratico; presentare una
          mini campagna ecologica.
      - id: n-intro
        anchor: intro
        text: Fai prima il tuo esempio e poi chiedi a ogni studente.
      - id: n-warmup
        anchor: warmup-title
        text: Scegli le domande del livello del gruppo (A2 base o A2 avanzato) e fai almeno due domande a ogni studente.
      - id: n-act1
        anchor: act1
        text: >-
          Prima dell'attività prepara immagini di inquinamento, riciclo, energia rinnovabile,
          plastica, foreste, mezzi di trasporto, città pulite e sporche (non sono nel
          quaderno). Ogni gruppo ha 1 minuto per presentare la campagna.
      - id: n-act2
        anchor: act2
        text: Dai a ogni gruppo una coppia di prodotti dalla lista. Metà dei gruppi fa i venditori, l'altra metà gli acquirenti; poi cambiano ruolo.
      - id: n-act3
        anchor: act3
        minutes: 20
        text: 'Primo round: 5 minuti. Secondo round: 5 minuti. Terzo round (presentazioni): 10 minuti.'
      - id: n-act4
        anchor: act4
        text: Mostra sullo schermo una mappa del mondo o una lista di città e paesi (non è nel quaderno).
      - id: n-act5
        anchor: act5
        minutes: 25
        text: >-
          Formato: 3 gruppi in stanze separate (online) o gruppi in classe. Ogni gruppo
          lavora solo sul proprio testo; durante le presentazioni gli altri ascoltano e
          completano la tabella di lavoro.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: sostenibilita-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: rules-futuro
        type: ruleSummary
        skill: Futuro semplice
        rules:
          - text: 'Usiamo il **futuro semplice** per parlare di progetti futuri, previsioni, promesse e cambiamenti nel futuro.'
            examples:
              - Riciclerò più bottiglie.
              - Useremo meno plastica.
              - In futuro le città saranno più pulite.
              - Ci sarà meno inquinamento.
              - Il Messico avrà più foreste.
          - text: 'Le desinenze sono le stesse per tutti i verbi: **-ò, -ai, -à, -emo, -ete, -anno**. I verbi in *-are* cambiano la *a* in *e*: *usare → userò, riciclare → riciclerò*.'
      - id: futuro-table
        type: table
        caption: Il futuro semplice
        header: [Persona, riciclare, usare, avere, essere]
        rows:
          - [io, riciclerò, userò, avrò, sarò]
          - [tu, riciclerai, userai, avrai, sarai]
          - [lui / lei, riciclerà, userà, avrà, sarà]
          - [noi, ricicleremo, useremo, avremo, saremo]
          - [voi, riciclerete, userete, avrete, sarete]
          - [loro, ricicleranno, useranno, avranno, saranno]
      - id: rules-intenzione
        type: ruleSummary
        skill: Avere intenzione di + infinito
        rules:
          - text: 'Usiamo **avere intenzione di + infinito** per parlare di piani futuri.'
            examples:
              - Ho intenzione di usare meno plastica.
              - Ho intenzione di riciclare di più.
              - Ho intenzione di comprare una bottiglia riutilizzabile.
              - Abbiamo intenzione di fare una campagna ecologica.
          - text: 'Attenzione: per il futuro in italiano non diciamo *vado a usare*. Usiamo il futuro semplice oppure *avere intenzione di*.'
            examples:
              - Userò meno plastica.
              - Ho intenzione di usare meno plastica.
              - Domani userò la bicicletta.
      - id: rules-confronti
        type: ruleSummary
        skill: Confronti
        rules:
          - text: "**Più… di**: una cosa ha una qualità maggiore di un'altra."
            examples:
              - La bicicletta è più ecologica dell'auto.
              - La borsa di stoffa è più sostenibile della borsa di plastica.
              - Il vetro è più facile da riciclare della plastica.
          - text: "**Meno… di**: una cosa ha una qualità minore di un'altra."
            examples:
              - L'auto è meno ecologica della bicicletta.
              - Una bottiglia di plastica è meno sostenibile di una bottiglia riutilizzabile.
              - Il cibo importato è meno ecologico del cibo locale.
          - text: '**(Tanto)… quanto**: due cose sono uguali o simili. Di solito non diciamo *tanto*. In conversazione possiamo usare anche **come**.'
            examples:
              - La mia città è verde quanto la tua.
              - Il treno è comodo quanto l'autobus.
              - Questa borsa è utile quanto quella.
              - La mia città è verde come la tua.
          - text: "Davanti a un articolo, **di** si unisce all'articolo: *di + l' = dell'*, *di + la = della*, *di + il = del*."
            examples:
              [
                più ecologica dell'auto,
                più sostenibile della borsa di plastica,
                meno ecologico del cibo locale,
              ]
          - text: 'Quando confrontiamo due nomi dopo lo stesso verbo, usiamo **più… che**.'
            examples: [La mia compagna ricicla più plastica che carta.]
      - id: di-table
        type: table
        caption: di + articolo
        header: [di +, il, lo, l', la, i, gli, le]
        rows:
          - [=, del, dello, dell', della, dei, degli, delle]
      - id: rules-superlativi
        type: ruleSummary
        skill: Superlativi
        rules:
          - text: 'Per il livello massimo usiamo **articolo + nome + più + aggettivo**.'
            examples:
              - La bicicletta è il mezzo di trasporto più ecologico.
              - Questa è la soluzione più sostenibile.
          - text: 'Se il nome è già chiaro, diciamo **il più / la più / i più / le più + aggettivo**.'
            examples: [Questa soluzione è la più sostenibile.]
          - text: 'Con **uno dei / una delle… più** diciamo che una cosa è tra le più…'
            examples:
              - Il Cile è uno dei paesi più avanzati nell'energia solare.
              - La plastica è uno dei materiali più inquinanti.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le regole con la classe e chiedi un esempio nuovo per ogni regola.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: sostenibilita-compiti
    title: Compiti
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti
      - id: how
        type: text
        text: Pratica il futuro semplice e i confronti nel contesto della sostenibilità. Scrivi le tue frasi negli spazi qui sotto; l'insegnante le leggerà prima della prossima lezione.
      - id: part1-title
        type: heading
        level: 3
        text: 'Parte 1: Progetti futuri'
      - id: part1
        type: discussionQuestions
        title: Scrivi 3 frasi al futuro sulla tua vita e sull'ambiente.
        items:
          - question: 'Frase 1:'
            frame: Userò meno plastica.
          - question: 'Frase 2:'
            frame: Riciclerò più carta.
          - question: 'Frase 3:'
            frame: Camminerò di più e userò meno la macchina.
      - id: part2-title
        type: heading
        level: 3
        text: 'Parte 2: Previsioni sul pianeta nel 2050'
      - id: part2
        type: discussionQuestions
        title: Scrivi 3 previsioni con il futuro semplice.
        items:
          - question: 'Previsione 1:'
            frame: Ci saranno meno auto.
          - question: 'Previsione 2:'
            frame: L'energia solare sarà più economica.
          - question: 'Previsione 3:'
            frame: L'aria sarà più pulita.
      - id: part3-title
        type: heading
        level: 3
        text: 'Parte 3: Confronti'
      - id: part3
        type: discussionQuestions
        title: Scrivi 3 confronti tra prodotti, abitudini o mezzi di trasporto.
        items:
          - question: Una frase con **più… di**
            frame: La bicicletta è più ecologica dell'auto.
          - question: Una frase con **meno… di**
            frame: Una borsa di stoffa è meno inquinante di una borsa di plastica.
          - question: Una frase con **(tanto)… quanto**
            frame: La mia città è verde quanto la tua.
      - id: part4-title
        type: heading
        level: 3
        text: 'Parte 4: Superlativi'
      - id: part4
        type: discussionQuestions
        title: Scrivi 2 frasi con il superlativo sull'ambiente.
        items:
          - question: 'Frase 1:'
            frame: La bicicletta è il mezzo di trasporto più ecologico.
          - question: 'Frase 2:'
            frame: La plastica è uno dei materiali più inquinanti.
      - id: part5-title
        type: heading
        level: 3
        text: 'Parte 5: Gioco «Vero o falso»'
      - id: part5-how
        type: text
        text: 'Scrivi 4 frasi su di te: 2 frasi al futuro e 2 frasi con confronti. Una frase deve essere falsa. Nella prossima lezione, i compagni proveranno a indovinare qual è la frase falsa.'
      - id: part5-example
        type: callout
        tone: info
        title: Esempio
        text: |-
          *Domani riciclerò la plastica.*
          *Ho intenzione di comprare una bottiglia riutilizzabile.*
          *Mio fratello ricicla più di me.*
          *L'acqua è meno importante della plastica.*
      - id: part5
        type: discussionQuestions
        items:
          - question: 'Frase 1 (futuro):'
          - question: 'Frase 2 (futuro):'
          - question: 'Frase 3 (confronto):'
          - question: 'Frase 4 (confronto):'
    teacherNotes:
      - id: n-homework
        anchor: null
        text: Nel quaderno gli studenti mandavano i compiti in un documento o in un'e-mail; qui li scrivono negli spazi e tu li leggi prima della lezione successiva. Usa la Parte 5 come gioco all'inizio della prossima lezione.

