vocabulary:
  - slug: sostenibilita
    title: Sostenibilità
    items: *sostenibilita-words

activities:
  - slug: sostenibilita-futuro
    title: 'Futuro semplice: userò, ricicleremo, sarà'
    minutes: 8
    items:
      - id: saranno
        type: multipleChoice
        prompt: In futuro le città ___ più pulite.
        options:
          - { text: saranno, correct: true }
          - { text: sarà, feedback: '*Le città* è plurale (loro): usiamo *saranno*.' }
          - {
              text: saremo,
              feedback: '*Saremo* è per *noi*. Per *le città* (loro) usiamo *saranno*.',
            }
      - id: useremo
        type: fillBlank
        prompt: Completa con il futuro di *usare*.
        text: Noi ___ meno plastica.
        blanks: [[useremo]]
      - id: avra
        type: multipleChoice
        prompt: Il Messico ___ più foreste.
        options:
          - { text: avrà, correct: true }
          - { text: avranno, feedback: '*Il Messico* è singolare (lui): usiamo *avrà*.' }
          - { text: avrò, feedback: '*Avrò* è per *io*. Per *il Messico* usiamo *avrà*.' }
      - id: unisci-riciclare
        type: matching
        prompt: Unisci ogni persona alla forma giusta di *riciclare* al futuro.
        pairs:
          - [io, riciclerò]
          - [tu, riciclerai]
          - [lui / lei, riciclerà]
          - [noi, ricicleremo]
          - [loro, ricicleranno]
      - id: intenzione-vero
        type: trueFalse
        prompt: 'Per parlare di piani futuri possiamo dire *avere intenzione di* + infinito: *Ho intenzione di usare meno plastica.*'
        answer: true
        feedback:
          correct: Giusto! *Avere intenzione di* + infinito = un piano per il futuro.
          incorrect: 'È vero: *Ho intenzione di usare meno plastica* è un piano per il futuro.'
      - id: intenzione-di
        type: multipleChoice
        prompt: Quale frase è giusta?
        options:
          - { text: Ho intenzione di riciclare di più., correct: true }
          - {
              text: Ho intenzione riciclare di più.,
              feedback: 'Manca *di*: *avere intenzione di* + infinito.',
            }
          - {
              text: Ho intenzione di riciclo di più.,
              feedback: "Dopo *avere intenzione di* usiamo l'infinito: *riciclare*.",
            }
      - id: sara-sara
        type: fillBlank
        prompt: Completa con il futuro di *essere*.
        text: Nel 2050 ci ___ meno inquinamento e l'aria ___ più pulita.
        blanks: [[sarà], [sarà]]
      - id: ordina-intenzione
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Abbiamo intenzione di fare una campagna ecologica.

  - slug: sostenibilita-confronti
    title: 'Confronti: più… di, meno… di, quanto, il più'
    minutes: 8
    items:
      - id: dell-auto
        type: multipleChoice
        prompt: La bicicletta è più ecologica ___ auto.
        options:
          - { text: "dell'", correct: true }
          - { text: di, feedback: "Davanti all'articolo *l'*, *di* diventa *dell'*: *dell'auto*." }
          - {
              text: della,
              feedback: "*Auto* comincia con una vocale: l'articolo è *l'*, quindi *dell'auto*.",
            }
      - id: meno-ecologica
        type: multipleChoice
        prompt: "La bicicletta non inquina. L'auto è ___ ecologica della bicicletta."
        options:
          - { text: meno, correct: true }
          - {
              text: più,
              feedback: "L'auto inquina di più, quindi è *meno* ecologica della bicicletta.",
            }
          - {
              text: tanto,
              feedback: 'Usiamo *(tanto)… quanto* quando due cose sono uguali, non con *di*.',
            }
      - id: comodo-quanto
        type: fillBlank
        prompt: 'Le due cose sono uguali: completa con una parola.'
        text: Il treno è comodo ___ l'autobus.
        blanks: [[quanto, come]]
      - id: verde-quanto
        type: trueFalse
        prompt: '*La mia città è verde quanto la tua* vuol dire che le due città sono verdi allo stesso modo.'
        answer: true
        feedback:
          correct: Giusto! *(Tanto)… quanto* = uguale.
          incorrect: '*Quanto* dice che le due cose sono uguali: le due città sono verdi allo stesso modo.'
      - id: mezzo-piu
        type: multipleChoice
        prompt: La bicicletta è il mezzo di trasporto ___ ecologico.
        options:
          - { text: più, correct: true }
          - {
              text: il più,
              feedback: "L'articolo c'è già davanti al nome: *il mezzo di trasporto più ecologico*.",
            }
          - {
              text: di più,
              feedback: 'Davanti a un aggettivo diciamo solo *più*: *più ecologico*.',
            }
      - id: del-cibo
        type: fillBlank
        prompt: Completa con *di* + articolo.
        text: Il cibo locale è più sostenibile ___ cibo importato.
        blanks: [[del]]
      - id: unisci-di
        type: matching
        prompt: Unisci *di* + articolo alla forma giusta.
        pairs:
          - [di + il, del]
          - [di + la, della]
          - ["di + l'", "dell'"]
          - [di + i, dei]
          - [di + le, delle]
      - id: ordina-plastica
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: La plastica è uno dei materiali più inquinanti.
