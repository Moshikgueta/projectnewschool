# Cycle "Piani per il fine settimana", converted from the Italian level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-2
slug: piani-per-il-fine-settimana
title: Piani per il fine settimana
goal: Parlare dei piani per il fine settimana con il futuro e confrontare attività con comparativi e superlativi.
position: 2
status: in_review

review:
  - >-
    The two workbook exercises ("Il futuro" and "Comparativi e superlativi") are NEW:
    the notebook has no self-study exercises. They were written from the cycle's
    summary rules, the activity examples and its vocabulary. Please check level,
    wording and every right answer before students see them.
  - >-
    Summary, future: the notebook's first rule "Futuro con andare a + infinito" (like
    English "going to") was copied from the Spanish "ir a + infinitivo" and does not
    exist in Italian: "Vado a studiare" means "I go (somewhere) to study". The rule was
    REWRITTEN: for a plan already decided Italian uses the presente (Sabato vado al
    cinema) or "avere intenzione di + infinito" (which the notebook already uses in
    the introduction and warm-up); the futuro semplice is used for plans, predictions,
    promises and dreams. A warning about "andare a + infinito" was added. The
    "Confronto" example "Andrò in Messico a luglio (è un piano)" now reads "A luglio
    vado in Messico". Please confirm.
  - >-
    Summary, futuro semplice: "verbo + desinenze" was incomplete. Now: future stem
    (-are → -er-: studiare → studier-; -ere → -er-; -ire → -ir-) + -ò, -ai, -à, -emo,
    -ete, -anno, with the irregular forms used in the cycle (andrò, farò, sarò, avrò,
    berrò, plus avrò, potrò, dovrò in a callout) ADDED. The notebook examples "Io vado a
    studiare / Noi andiamo a mangiare / Loro vanno a visitare" were replaced by
    "Questo pomeriggio studio / Sabato mangiamo al ristorante / Il mese prossimo ho
    intenzione di visitare il museo". Please confirm.
  - >-
    Summary, superlatives: "il / la + più + aggettivo" → "il / la + nome + più +
    aggettivo (+ di)" (il weekend più divertente, il giorno più rilassante della
    settimana), as in the notebook's own examples. "migliore / peggiore" also as
    "miglior" before a noun (il miglior weekend). "meglio" (adverb, from bene) was added
    because it is in the vocabulary and Activity 4.
  - >-
    Activity 4 expression "Meglio di…" (for "il mio weekend è…") → "Migliore di…";
    "Meglio" stays in the vocabulary with "è meglio + infinito" in the debate frame.
    Quizlet label "Pianni" → "Piani"; link kept without "?new".
  - >-
    Introduction: "Preferisco festeggiare a ___ (casa, ristorante, spiaggia, montagna)"
    → "Preferisco festeggiare ___ (a casa, al ristorante, in spiaggia, in montagna…)",
    since the preposition changes. The warm-up questions have no frames in the source;
    short frames were ADDED, and an example for the introduction round. Please check.
  - >-
    Homework: the steps say to write plans "con la struttura andare a + verbo"
    (see the future rule above). Now: "con il presente o con avere intenzione di"; the
    example "Vado a fare shopping con mia sorella. Andiamo anche al cinema." is kept,
    since it is correct Italian (movement + purpose). "il chatbot" → "Mori". The
    lesson slides link (gamma.app) is not allowed and was left out (teacher note).
  - >-
    The cycle has no lesson plan in the source; a teacher note maps the activities to
    the two skills (future: Activities 1 and 3; comparisons: Activities 2 and 4).
    Activity 2: "5 minuti per ogni tema" with four themes → 20 minutes. No other times
    are given. The "Studente 1/2/3" lines are replaced by the optional answer boxes.
  - >-
    Vocabulary: "Guida – מדריך" → "מדריך / מדריכה"; otherwise kept as in the source.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: piani-per-il-fine-settimana-classe
    title: 'In classe: Piani per il fine settimana'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Piani per il fine settimana
      - id: skills
        type: cycleOverview
        skills:
          - name: Il futuro
            description: 'Parlare di piani e intenzioni: *Sabato vado al cinema. Domenica visiterò il museo.*'
          - name: Comparativi e superlativi
            description: '*più rilassante del tuo, migliore, il weekend più divertente*'
      - id: quizlet
        type: externalLink
        label: Piani per il fine settimana su Quizlet
        url: https://quizlet.com/br/1154891563/piani-per-il-fine-settimana-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Giro introduttivo
      - id: intro
        type: sentenceFrame
        frame: |-
          Ogni studente dice una frase su un piano futuro. Completa una di queste frasi:
          La prossima settimana andrò a ___.
          Il mese prossimo ho intenzione di ___.
          In futuro festeggerò ___.
          Preferisco festeggiare ___ (a casa, al ristorante, in spiaggia, in montagna…).
        example: Il mese prossimo ho intenzione di visitare mia sorella a Milano.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup
        type: discussionQuestions
        items:
          - question: Cosa hai intenzione di fare questo fine settimana?
            frame: Questo fine settimana ho intenzione di ___. / Sabato vado ___.
          - question: Qual è il miglior fine settimana che puoi immaginare?
            frame: Il miglior fine settimana per me è ___.
          - question: Qual è il peggior fine settimana che puoi immaginare?
            frame: Il peggior fine settimana per me è ___.
          - question: Passerai il tempo con amici o famiglia questo fine settimana?
            frame: Questo fine settimana passerò il tempo con ___.
          - question: Preferisci attività al chiuso o all'aperto? Perché?
            frame: Preferisco le attività ___ perché sono più ___.
          - question: Cosa ti piace di più del fine settimana?
            frame: Del fine settimana mi piace di più ___.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: "Attività 1: Un weekend all'estero"
        skills: [Il futuro]
        steps:
          - "Scegli una città reale o immaginaria e prepara l'itinerario perfetto per un fine settimana: trasporti, cibo, attrazioni turistiche, cultura, relax."
          - Lavorate in coppia. Uno studente è la guida turistica, l'altro è il turista.
          - 'La guida dà raccomandazioni per il viaggio con i verbi modali: *dovresti* (raccomandazione), *puoi / potresti* (possibilità o suggerimento), *devi* (raccomandazione forte), *si deve* (necessità).'
          - Dopo il primo giro, cambiate ruolo.
          - Ogni coppia presenta il proprio itinerario alla classe. La guida spiega che cosa consiglia; il turista spiega che cosa farà durante il viaggio, con il futuro.
        example: |-
          **Guida:** *Giovedì dovresti visitare il museo d'arte nel centro della città. Puoi anche pranzare in un bar locale. Venerdì potresti fare un giro in barca sul fiume. Sabato dovresti salire sulla montagna per vedere il panorama. Domenica puoi rilassarti nel giardino botanico.*
          **Turista:** *Giovedì visiterò il museo e pranzerò in un bar. Venerdì farò un giro in barca. Sabato andrò in montagna. Domenica mi rilasserò nel giardino botanico.*
        wordBank: [trasporti, cibo, attrazioni turistiche, cultura, relax]
      - id: act1-plan
        type: discussionQuestions
        title: Il mio itinerario
        items:
          - question: 'Città: ___'
          - question: Giovedì / Venerdì ___.
            frame: Venerdì dovresti visitare ___. / Venerdì visiterò ___.
          - question: Sabato ___.
            frame: Sabato puoi ___. / Sabato andrò ___.
          - question: Domenica ___.
            frame: Domenica potresti ___. / Domenica mi rilasserò ___.
      - id: act2
        type: classActivity
        title: 'Attività 2: Dibattito: il weekend perfetto'
        skills: [Comparativi e superlativi]
        minutes: 20
        steps:
          - L'insegnante presenta un tema.
          - Discutete per 5 minuti per ogni tema. Tutti partecipano alla discussione.
          - Usa i comparativi per dare la tua opinione.
        example: '*Secondo me è meglio restare a casa: è più rilassante e meno caro di un viaggio.*'
      - id: act2-topics
        type: discussionQuestions
        title: I temi
        items:
          - question: 'Weekend a casa o weekend fuori: è meglio restare a casa e rilassarsi oppure viaggiare ed esplorare nuovi posti?'
            frame: È meglio ___ perché è più ___ di ___.
          - question: 'Attività mattutine o attività serali: è meglio svegliarsi presto per fare attività oppure uscire la sera con amici o famiglia?'
            frame: Secondo me ___ è più ___ di ___.
          - question: "Avventura all'aperto o hobby al chiuso: è meglio fare escursioni, camminare in montagna o andare in bicicletta oppure restare a casa a leggere o cucinare?"
            frame: Preferisco ___ perché è meno ___ di ___.
          - question: 'Essere attivi o riposare: è meglio fare sport nel fine settimana oppure riposare e rilassarsi?'
            frame: È meglio ___ perché ___.
      - id: act3
        type: classActivity
        title: 'Attività 3: Cosa farà questa persona?'
        skills: [Il futuro]
        steps:
          - 'Scegli una persona: un amico, una persona famosa o un personaggio di un film o di un libro.'
          - Inventa il suo programma per il fine settimana. Usa il futuro.
          - Leggi il programma alla classe.
        example: |-
          **Mario lo chef**
          *Venerdì mattina andrà al mercato per comprare verdure fresche.*
          *Venerdì pomeriggio preparerà piatti speciali per il ristorante.*
          *Venerdì sera cucinerà la cena per i suoi ospiti.*
          *Sabato mattina dormirà fino a tardi e berrà un caffè.*
          *Sabato pomeriggio parteciperà a un corso di cucina.*
          *Sabato sera guarderà un film e si rilasserà sul divano.*
      - id: act3-plan
        type: discussionQuestions
        title: Cosa farà?
        items:
          - question: 'Venerdì mattina: ___'
          - question: 'Venerdì pomeriggio: ___'
          - question: 'Venerdì sera: ___'
          - question: 'Sabato mattina: ___'
          - question: 'Sabato pomeriggio: ___'
          - question: 'Sabato sera: ___'
      - id: act4
        type: classActivity
        title: 'Attività 4: Chi ha il miglior programma per il fine settimana?'
        skills: [Comparativi e superlativi]
        steps:
          - Confronta il tuo programma dell'Attività 3 con i programmi dei compagni.
          - Spiega perché il tuo weekend è migliore. Usa le espressioni della lista.
          - "Votazione finale: l'insegnante scrive le categorie e gli studenti votano."
          - Alla fine l'insegnante annuncia i vincitori.
        example: '*Il weekend di Mario è più rilassante del mio, ma il mio è più divertente!*'
        wordBank: [più divertente di, meno noioso di, più rilassante di, migliore di, peggiore di]
      - id: act4-categories
        type: discussionQuestions
        title: Le categorie
        items:
          - question: Il weekend più rilassante è ___.
          - question: Il weekend più divertente è ___.
          - question: Il weekend più attivo è ___.
          - question: Il miglior weekend in famiglia è ___.
          - question: Il weekend più sorprendente è ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Il futuro** (Attività 1 e 3) e **Comparativi e
          superlativi** (Attività 2 e 4). L'Attività 4 usa i programmi dell'Attività 3.
      - id: n-links
        anchor: null
        text: La presentazione della lezione (gamma.app) non è inclusa nella piattaforma.
      - id: n-intro
        anchor: intro
        text: Ogni studente sceglie una sola frase.
      - id: n-warmup
        anchor: warmup
        text: Fai almeno due domande a ogni studente. Le risposte scritte qui compaiono sotto ogni domanda.
      - id: n-act2
        anchor: act2
        minutes: 20
        text: Presenta un tema alla volta (5 minuti ciascuno) e assicurati che parlino tutti.
      - id: n-act4
        anchor: act4
        text: >-
          Scrivi le categorie alla lavagna (il weekend più rilassante, più divertente, più
          attivo, il miglior weekend in famiglia, il più sorprendente). Gli studenti
          votano e alla fine annunci i vincitori.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: piani-per-il-fine-settimana-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: rules-futuro
        type: ruleSummary
        skill: Il futuro
        rules:
          - text: "Per un **piano già deciso**, spesso in italiano usiamo il **presente** con un'espressione di tempo, oppure **avere intenzione di + infinito**."
            examples:
              - Questo pomeriggio studio.
              - Sabato mangiamo al ristorante.
              - Il mese prossimo ho intenzione di visitare il museo.
          - text: "**Attenzione:** *andare a + infinito* non è un futuro come l'inglese *going to*. Vuol dire andare in un posto per fare qualcosa."
            examples: [Vado a fare la spesa. (= vado al supermercato per fare la spesa)]
          - text: 'Il **futuro semplice** si usa per piani, previsioni, promesse, sogni e per il futuro lontano o incerto.'
            examples:
              [
                'Se avrò tempo, studierò domani.',
                Un giorno vivrò vicino al mare.,
                'Non preoccuparti, ti aiuterò con i compiti.',
              ]
          - text: 'Come si forma: radice del futuro + **-ò, -ai, -à, -emo, -ete, -anno**. I verbi in **-are** e **-ere** prendono **-er-**, i verbi in **-ire** prendono **-ir-**.'
            examples: ['studiare → studierò', 'prendere → prenderò', 'dormire → dormirò']
          - text: '**Suggerimento:** è un piano già deciso? Puoi usare il presente. È un sogno, una previsione o una promessa? Usa il futuro semplice.'
            examples:
              - A luglio vado in Messico. (Ho già il biglietto.)
              - Un giorno andrò in Messico. (È un sogno.)
      - id: futuro-table
        type: table
        caption: Il futuro semplice
        header: [Persona, studiare, andare, fare, essere]
        rows:
          - [io, studierò, andrò, farò, sarò]
          - [tu, studierai, andrai, farai, sarai]
          - [lui / lei, studierà, andrà, farà, sarà]
          - [noi, studieremo, andremo, faremo, saremo]
          - [voi, studierete, andrete, farete, sarete]
          - [loro, studieranno, andranno, faranno, saranno]
      - id: futuro-irregular
        type: callout
        tone: info
        title: Altri futuri irregolari del ciclo
        text: 'avere → **avrò**, bere → **berrò**, potere → **potrò**, dovere → **dovrò**'
      - id: rules-confronti
        type: ruleSummary
        skill: Comparativi e superlativi
        rules:
          - text: 'Il **comparativo** confronta **due cose**: **più / meno** + aggettivo + **di**. *Di* + articolo diventa *del, della, dei…*'
            examples:
              - Il mio weekend è più rilassante del tuo.
              - Questo film è più interessante di quello.
              - Sabato è più divertente di venerdì.
          - text: "Comparativi irregolari: buono → **migliore**, cattivo → **peggiore**. L'avverbio *bene* diventa **meglio**."
            examples:
              - Questo ristorante è migliore di quello.
              - Il traffico oggi è peggiore di ieri.
              - È meglio restare a casa.
          - text: 'Il **superlativo** indica il massimo in un gruppo: **il / la + nome + più + aggettivo** (+ **di / del / della**…).'
            examples:
              - Questo è il weekend più divertente.
              - Sabato è il giorno più rilassante della settimana.
          - text: 'Superlativi irregolari: **il migliore**, **il peggiore**. Davanti al nome si dice spesso *il miglior*.'
            examples:
              - È stato il miglior weekend dell'anno.
              - La domenica sera è la parte peggiore del weekend.
      - id: recap
        type: callout
        tone: info
        title: Riassunto
        text: |-
          **Futuro:** per piani, intenzioni e previsioni. Piano già deciso → presente o *avere intenzione di*; previsione, promessa o sogno → futuro semplice.
          **Comparativi e superlativi:** per confrontare due cose, dire quale è migliore o peggiore e descrivere il massimo o il minimo in un gruppo.
          *Il mio weekend sarà più rilassante del tuo, ma il tuo programma è il più divertente.*
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le due abilità con la classe e chiedi un esempio nuovo per ogni regola.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: piani-per-il-fine-settimana-compiti
    title: Compiti con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti con Mori
      - id: how
        type: text
        text: 'Parla con Mori dei tuoi programmi per il fine settimana. Apri la chat con Mori e inizia la conversazione con questo messaggio:'
      - id: mori-weekend
        type: aiTutorPrompt
        title: I tuoi programmi per il fine settimana
        message: Ciao Mori! Cosa fai questo fine settimana?
      - id: step-plans
        type: callout
        tone: info
        title: 'Poi: racconta i tuoi piani'
        text: |-
          Quando Mori risponde, scrivi i tuoi piani con il presente o con *avere intenzione di*.
          *Sabato vado a fare shopping con mia sorella. Andiamo anche al cinema.*
      - id: step-questions
        type: callout
        tone: info
        title: Fai a Mori altre tre domande con il futuro
        text: |-
          *Resterai a casa o uscirai questo fine settimana?*
          *Sabato o domenica andrai in un posto speciale?*
          *Hai intenzione di passare del tempo con amici o famiglia?*
          *Mangerai fuori o cucinerai a casa?*
          *Farai più cose sabato o domenica?*
      - id: step-compare
        type: callout
        tone: info
        title: Confronta i tuoi programmi con quelli di Mori
        text: |-
          *Il mio fine settimana sarà più emozionante del tuo.*
          *Farai attività più rilassanti di me.*
          *I nostri weekend sono diversi, ma tutti e due sembrano divertenti.*
      - id: step-summary
        type: text
        text: 'Alla fine scrivi un breve riassunto nel tuo quaderno o in un documento: Che cosa hai intenzione di fare questo fine settimana? Che cosa farà Mori? Che cosa avete in comune? Che cosa è diverso?'
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: piani-per-il-fine-settimana-pratica
    book: workbook
    title: 'Pratica: Piani per il fine settimana'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Esercitati sulle due abilità del ciclo. Ogni risposta viene corretta subito e puoi riprovare.
