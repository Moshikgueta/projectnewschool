vocabulary:
  - slug: piani-per-il-fine-settimana
    title: Piani per il fine settimana
    items: *piani-per-il-fine-settimana-words

activities:
  - slug: piani-per-il-fine-settimana-futuro
    title: 'Il futuro: visiterò, andrò, farò'
    minutes: 8
    items:
      - id: visitero
        type: multipleChoice
        prompt: Domani (io) ___ il museo.
        options:
          - { text: visiterò, correct: true }
          - {
              text: visiterà,
              feedback: '*Visiterà* è per *lui / lei*. Per *io* usiamo *visiterò*.',
            }
          - {
              text: ho visitato,
              feedback: '*Ho visitato* è passato. Con *domani* usiamo il futuro: *visiterò*.',
            }
      - id: andremo
        type: fillBlank
        prompt: Completa con il futuro di *andare*.
        text: Sabato noi ___ al mare.
        blanks: [[andremo]]
      - id: unisci-futuro
        type: matching
        prompt: Unisci ogni verbo alla sua forma di *io* al futuro.
        pairs:
          - [studiare, studierò]
          - [fare, farò]
          - [andare, andrò]
          - [essere, sarò]
          - [bere, berrò]
      - id: andare-a
        type: trueFalse
        prompt: "In italiano *Vado a studiare* è un futuro, come l'inglese *going to*."
        answer: false
        feedback:
          correct: 'Giusto! *Vado a studiare* vuol dire che vado in un posto per studiare.'
          incorrect: '*Andare a + infinito* non è un futuro: vuol dire andare in un posto per fare qualcosa. Per il futuro usiamo il presente (*Sabato studio*) o il futuro semplice (*studierò*).'
      - id: aiutero
        type: multipleChoice
        prompt: Non preoccuparti, ti ___ con i compiti.
        options:
          - { text: aiuterò, correct: true }
          - {
              text: aiuterai,
              feedback: '*Aiuterai* è per *tu*. Io faccio una promessa: *ti aiuterò*.',
            }
          - {
              text: aiutavo,
              feedback: '*Aiutavo* è imperfetto (passato). Per una promessa usiamo il futuro: *aiuterò*.',
            }
      - id: mario
        type: fillBlank
        prompt: Completa con il futuro di *andare* e *cucinare* (lui).
        text: Venerdì Mario ___ al mercato e la sera ___ la cena per i suoi ospiti.
        blanks: [[andrà], [cucinerà]]
      - id: resterai
        type: multipleChoice
        prompt: (Tu) ___ a casa o uscirai questo fine settimana?
        options:
          - { text: Resterai, correct: true }
          - { text: Resterò, feedback: '*Resterò* è per *io*. Per *tu* usiamo *resterai*.' }
          - { text: Resteranno, feedback: '*Resteranno* è per *loro*. Per *tu* usiamo *resterai*.' }
      - id: ordina-montagna
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Sabato andrò in montagna.

  - slug: piani-per-il-fine-settimana-confronti
    title: 'Comparativi e superlativi: più… di, il migliore'
    minutes: 8
    items:
      - id: del-tuo
        type: multipleChoice
        prompt: Il mio weekend è più rilassante ___ tuo.
        options:
          - { text: del, correct: true }
          - { text: di, feedback: '*Di* + *il* diventa *del*: *più rilassante del tuo*.' }
          - {
              text: che,
              feedback: 'Nel comparativo, prima di un nome o di un possessivo, usiamo *di*: *del tuo*.',
            }
      - id: migliore
        type: multipleChoice
        prompt: Questo ristorante è ___ di quello.
        options:
          - { text: migliore, correct: true }
          - {
              text: più migliore,
              feedback: '*Migliore* vuol già dire *più buono*: non usiamo *più* con *migliore*.',
            }
          - {
              text: buono più,
              feedback: "L'ordine è *più* + aggettivo. Il comparativo di *buono* è *migliore*.",
            }
      - id: piu-di
        type: fillBlank
        prompt: Completa con *più* e *di*.
        text: Sabato è ___ divertente ___ venerdì.
        blanks: [[più], [di]]
        wordBank: [più, di]
      - id: peggiore
        type: trueFalse
        prompt: 'Il comparativo di *cattivo* può essere *peggiore*: *Il traffico oggi è peggiore di ieri.*'
        answer: true
        feedback:
          correct: 'Giusto! buono → migliore, cattivo → peggiore.'
          incorrect: '*Peggiore* è il comparativo irregolare di *cattivo*: *Il traffico oggi è peggiore di ieri.*'
      - id: il-giorno
        type: multipleChoice
        prompt: Sabato è ___ giorno più rilassante della settimana.
        options:
          - { text: il, correct: true }
          - {
              text: un,
              feedback: "Il superlativo indica il massimo in un gruppo: usiamo l'articolo *il*.",
            }
          - {
              text: del,
              feedback: 'La struttura è *il* + nome + *più* + aggettivo: *il giorno più rilassante*.',
            }
      - id: unisci-irregolari
        type: matching
        prompt: Unisci ogni forma al comparativo o al superlativo giusto.
        pairs:
          - [buono (comparativo), migliore]
          - [cattivo (comparativo), peggiore]
          - [buono (superlativo), il migliore]
          - [cattivo (superlativo), il peggiore]
      - id: miglior-weekend
        type: fillBlank
        prompt: Completa con il superlativo di *buono*.
        text: "È stato ___ weekend dell'anno."
        blanks: [[il miglior, il migliore]]
      - id: ordina-rilassante
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Il mio weekend sarà più rilassante del tuo.
