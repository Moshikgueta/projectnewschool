vocabulary:
  - slug: salute
    title: Salute
    items: *salute-words

activities:
  - slug: salute-passato
    title: 'Passato prossimo: ho bevuto, sono andato, mi sono sentito'
    minutes: 8
    items:
      - id: ho-bevuto
        type: multipleChoice
        prompt: Ieri io ___ molta acqua.
        options:
          - { text: ho bevuto, correct: true }
          - {
              text: sono bevuto,
              feedback: '*Bere* forma il passato prossimo con *avere*: *ho bevuto*.',
            }
          - {
              text: bevo,
              feedback: '*Bevo* è presente. Con *ieri* usiamo il passato prossimo: *ho bevuto*.',
            }
      - id: e-andato
        type: multipleChoice
        prompt: Ieri Luca ___ dal medico.
        options:
          - { text: è andato, correct: true }
          - {
              text: ha andato,
              feedback: '*Andare* è un verbo di movimento: usa *essere*, *è andato*.',
            }
          - {
              text: è andata,
              feedback: 'Con *essere* il participio si accorda con il soggetto: Luca è maschile, quindi *è andato*.',
            }
      - id: abbiamo-fatto
        type: fillBlank
        prompt: Completa con il passato prossimo di *fare*.
        text: La settimana scorsa noi ___ una passeggiata nel parco.
        blanks: [[abbiamo fatto]]
      - id: ha-dormito
        type: fillBlank
        prompt: Completa con il passato prossimo di *dormire*.
        text: Marta ___ otto ore.
        blanks: [[ha dormito]]
      - id: sentita
        type: trueFalse
        prompt: '*Anna si è sentita bene* è giusto: con i verbi riflessivi usiamo *essere* e il participio si accorda con il soggetto.'
        answer: true
        feedback:
          correct: Giusto! Anna è femminile, quindi *si è sentita*.
          incorrect: 'La frase è giusta: con *essere* il participio si accorda, *Anna si è sentita bene*.'
      - id: participi
        type: matching
        prompt: Unisci ogni verbo al suo participio passato.
        pairs:
          - [bere, bevuto]
          - [fare, fatto]
          - [prendere, preso]
          - [mangiare, mangiato]
          - [dormire, dormito]
      - id: ha-preso
        type: fillBlank
        prompt: Completa con il passato prossimo di *prendere*.
        text: Ieri sera Luca ___ una medicina.
        blanks: [[ha preso]]
      - id: ordina-sport
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Questa settimana ho fatto sport due volte.

  - slug: salute-consigli
    title: 'Consigli: devi, puoi, dovresti'
    minutes: 8
    items:
      - id: deve
        type: multipleChoice
        prompt: Marco non dorme molto. Lui ___ dormire di più.
        options:
          - { text: deve, correct: true }
          - { text: devi, feedback: '*Devi* è per *tu*. Per *lui* usiamo *deve*.' }
          - {
              text: deve di,
              feedback: "Dopo *deve* va subito l'infinito, senza *di*: *deve dormire*.",
            }
      - id: tisana
        type: multipleChoice
        prompt: Hai mal di gola. Quale consiglio è giusto?
        options:
          - { text: Puoi bere una tisana calda., correct: true }
          - {
              text: Puoi bevi una tisana calda.,
              feedback: "Dopo *puoi* usiamo l'infinito: *puoi bere*.",
            }
          - {
              text: Puoi a bere una tisana calda.,
              feedback: "Dopo *puoi* va subito l'infinito, senza *a*: *puoi bere*.",
            }
      - id: devi
        type: fillBlank
        prompt: Completa con *dovere* per *tu*.
        text: Paolo, ___ bere più acqua!
        blanks: [[devi]]
      - id: puo
        type: fillBlank
        prompt: Completa con *potere* per *lei*.
        text: Anna è stanca. ___ andare a letto prima.
        blanks: [[Può, può, Lei può, lei può]]
      - id: infinito
        type: trueFalse
        prompt: "Dopo *devi* e *puoi* usiamo il verbo all'infinito: *Devi riposare.*"
        answer: true
        feedback:
          correct: Giusto! *Devi riposare, puoi bere, deve dormire.*
          incorrect: "Dopo *dovere* e *potere* il verbo è all'infinito: *Devi riposare.*"
      - id: unisci-consigli
        type: matching
        prompt: Unisci ogni problema al consiglio giusto.
        pairs:
          - [Ho sete., Devi bere un bicchiere d'acqua.]
          - [Mangio troppi dolci., Puoi mangiare più frutta.]
          - [Non faccio mai sport., Puoi fare una passeggiata ogni giorno.]
          - [Ho mal di gola., Puoi bere una tisana calda.]
      - id: dovresti
        type: multipleChoice
        prompt: Vuoi dare un consiglio gentile a un amico. Quale frase usi?
        options:
          - { text: Dovresti riposare., correct: true }
          - {
              text: Dovrei riposare.,
              feedback: '*Dovrei* è per *io*. Per un amico (tu) usiamo *dovresti*.',
            }
          - {
              text: Dovresti riposi.,
              feedback: "Dopo *dovresti* usiamo l'infinito: *Dovresti riposare.*",
            }
      - id: ordina-caffe
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Non devi bere troppo caffè.
