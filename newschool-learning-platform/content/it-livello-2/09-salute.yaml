# Cycle "Salute", converted from the Italian level 2 (conversational) digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-2
slug: salute
title: Salute
goal: Raccontare cosa abbiamo fatto per la salute con il passato prossimo e dare consigli con dovere e potere.
position: 9
status: in_review

review:
  - >-
    The two workbook exercises ("Passato prossimo" and "Consigli") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's two
    skills, its summary rules, the activity examples and its vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    Skills mismatch: the general information names the program's skills
    "Passato prossimo + imperfetto" and "Verbi modali e consigli (dovrei, potrei,
    sarebbe meglio, ti consiglierei)", but the activities and the summary practise
    only the passato prossimo and devi / deve / puoi / può. The skills are named
    "Passato prossimo (e imperfetto)" and "Dare consigli (dovere e potere)". To match
    the program, two short rules were ADDED to the summary: the imperfetto for a
    description in the past (avevo più energia, from the Activity 4 example) and the
    softer advice with dovresti / potresti / sarebbe meglio / ti consiglierei. The
    workbook has one item on dovresti. Please decide whether to keep them.
  - >-
    Summary, passato prossimo: added avere / essere + participle, the agreement with
    essere (sono andato / andata, mi sono sentito / sentita), and the irregular
    participles of the cycle (bevuto, fatto, preso, stato). Summary, consigli: added
    that dovere / potere are followed by the infinitive, with a table of devo / devi /
    deve… and posso / puoi / può….
  - >-
    Corrections: Activity 2 title "Appuntamento dal medico: Con il medico" → "Dal
    medico"; masculine-only forms made inclusive where the student speaks of
    themselves ("sei andato" → "sei andato / andata", "Mi sono sentito" → "Mi sono
    sentito / sentita"; in the Activity 4 examples two of the five sentences
    now use the feminine, "Mi sono sentita riposata / felice", to show both forms); a stray "ð" (broken emoji) at the end of the summary example
    was removed. The introduction frame "l'abitudine più sana che ho sviluppato" is
    kept.
  - >-
    The warm-up questions have no frames in the source; none were added. Activity 3
    has eight situations; they are answer boxes with the source's answer model
    (Deve… / Può… / È una buona idea… / Perché…) as frame.
  - >-
    The gamma.app slide link is not on the link allow-list and was left out; see the
    teacher note. The Quizlet link is kept without "?new".
  - >-
    Written homework ("Compiti tradizionali", parts 1–4) is kept in the homework
    section as answer boxes; the answer keys of parts 1–3 are in teacher notes. In
    part 3 some sentences accept both deve and può (see the note). The Mori section
    has one main message and three interactive messages; all four are kept.
  - >-
    Vocabulary: "Guarisci presto – החלמה מהירה" → "תחלים מהר!" ("guarisci" is an
    imperative); "Settimana scorsa" → "La settimana scorsa" (it is always used with
    the article); "Medicina – תרופה" was ADDED, since the activities say "medicina"
    and the list had only "farmaco". Please confirm.
  - >-
    The source gives no activity times, so no minutes are recorded. The "Risposta dello
    studente" lines are replaced by the optional answer boxes (decision C2).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: salute-classe
    title: 'In classe: Salute'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Salute
      - id: skills
        type: cycleOverview
        skills:
          - name: Passato prossimo (e imperfetto)
            description: '*Ho bevuto molta acqua. Sono andato dal medico. Mi sono sentito bene.*'
          - name: Dare consigli (dovere e potere)
            description: '*Devi riposare. Puoi bere una tisana.* (e anche *dovresti, potresti, sarebbe meglio*)'
      - id: quizlet
        type: externalLink
        label: Salute su Quizlet
        url: https://quizlet.com/br/1189020919/salute-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Giro introduttivo
      - id: intro
        type: sentenceFrame
        frame: Io sono ___ e l'abitudine più sana che ho sviluppato negli ultimi anni è ___.
        example: Io sono Marco e l'abitudine più sana che ho sviluppato è fare una passeggiata ogni mattina prima di lavorare.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup
        type: discussionQuestions
        items:
          - question: Come ti prendi cura della tua salute?
          - question: Quando è stata l'ultima volta che sei andato / andata dal medico? Cosa è successo?
          - question: Per te è più importante mangiare bene o fare esercizio fisico? Perché?
          - question: Fai esercizio fisico regolarmente? Che cosa fai e quanto spesso?
          - question: Cosa deve fare una persona che vuole vivere in modo più sano?
          - question: Cosa fai quando non ti senti bene?
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: "Attività 1: Nella sala d'attesa del medico"
        skills: [Dare consigli (dovere e potere), Passato prossimo (e imperfetto)]
        steps:
          - "Sei nella sala d'attesa del medico. Pensa a un problema semplice: raffreddore, mal di gola, mal di testa, mal di schiena o mal di stomaco."
          - "Di' il tuo problema: *Sono qui perché ho mal di gola.*"
          - 'Gli altri studenti fanno domande: *Da quanto tempo hai mal di gola? Hai preso una medicina? Hai la febbre? Hai bevuto qualcosa di caldo?*'
          - 'Gli studenti danno consigli: *Devi riposare. Devi bere molta acqua. Puoi bere una tisana. Puoi mangiare una zuppa.*'
        wordBank: [raffreddore, mal di gola, mal di testa, mal di schiena, mal di stomaco]
      - id: act2
        type: classActivity
        title: 'Attività 2: Dal medico'
        skills: [Passato prossimo (e imperfetto), Dare consigli (dovere e potere)]
        steps:
          - Lavorate in coppia. Uno studente è il medico, l'altro è il paziente.
          - 'Il paziente racconta un problema con il passato prossimo: *Ieri sono caduto. Ieri ho mangiato troppo. Ho avuto la febbre. Ho avuto mal di testa.*'
          - 'Il medico fa domande: *Quando è successo? Hai preso una medicina? Sei andato dal medico? Come ti senti oggi?*'
          - 'Il medico dà consigli: *Devi riposare. Devi bere più acqua. Puoi stare a casa oggi. Puoi mangiare qualcosa di leggero.*'
          - Poi cambiate ruolo.
      - id: act3
        type: classActivity
        title: 'Attività 3: Consigli per la salute'
        skills: [Dare consigli (dovere e potere)]
        steps:
          - Leggi una situazione su una persona che ha un'abitudine poco sana.
          - 'Dai **almeno due consigli**. Usa: *Deve… / Non deve… / Può… / È una buona idea… / Perché…*'
          - Dopo ogni risposta, gli altri studenti possono aggiungere un consiglio.
        example: |-
          **Situazione:** Marco beve molta Coca-Cola e non beve acqua.
          *Deve bere più acqua.*
          *Non deve bere troppa Coca-Cola.*
          *Può portare una bottiglia d'acqua al lavoro.*
          *È una buona idea bere un bicchiere d'acqua a ogni pasto.*
          *Perché l'acqua fa bene al corpo.*
      - id: act3-discussion
        type: dialogue
        lines:
          - { speaker: Studente A, text: Deve dormire di più. }
          - { speaker: Studente B, text: Può andare a letto prima. }
          - { speaker: Studente C, text: È una buona idea spegnere il telefono prima di dormire. }
          - { speaker: Studente A, text: 'Sì, perché il telefono può disturbare il sonno.' }
      - id: act3-situations
        type: discussionQuestions
        title: Cosa deve fare?
        items:
          - question: Il tuo amico mangia fast food cinque volte alla settimana.
            frame: Deve ___. Può ___. È una buona idea ___. Perché ___.
          - question: La tua amica non beve quasi mai acqua durante il giorno.
            frame: Deve ___. Può ___. È una buona idea ___. Perché ___.
          - question: Il tuo amico guarda la TV fino alle due di notte.
            frame: Deve ___. Può ___. È una buona idea ___. Perché ___.
          - question: La tua amica non fa mai esercizio fisico.
            frame: Deve ___. Può ___. È una buona idea ___. Perché ___.
          - question: Il tuo amico dorme solo cinque ore ogni notte.
            frame: Deve ___. Può ___. È una buona idea ___. Perché ___.
          - question: La tua amica passa tutto il giorno seduta davanti al computer.
            frame: Deve ___. Può ___. È una buona idea ___. Perché ___.
          - question: Il tuo amico mangia molti dolci ogni giorno.
            frame: Deve ___. Può ___. È una buona idea ___. Perché ___.
          - question: La tua amica si sente spesso stanca.
            frame: Deve ___. Può ___. È una buona idea ___. Perché ___.
      - id: act3-model
        type: callout
        tone: info
        title: Esempio completo
        text: |-
          Il mio amico mangia troppo fast food.
          *Deve mangiare più frutta e verdura.*
          *Può preparare il pranzo a casa.*
          *È una buona idea cucinare più spesso.*
          *Perché il fast food non è molto salutare.*
      - id: act4
        type: classActivity
        title: 'Attività 4: La mia ultima settimana in salute'
        skills: [Passato prossimo (e imperfetto)]
        steps:
          - "Pensa all'ultima settimana. Cosa hai fatto per prenderti cura della tua salute? La salute non è solo fare sport o mangiare bene: anche riposare, dormire abbastanza, parlare con gli amici o fare qualcosa che ti piace sono attività salutari."
          - Completa le frasi qui sotto con 3–5 attività della settimana.
          - "Lavora con un compagno e fai domande per avere più informazioni: *Quando l'hai fatto? Con chi l'hai fatto? Ti è piaciuto? Come ti sei sentito / sentita? Perché ti sei sentito / sentita così?*"
          - 'Racconta alla classe una cosa salutare che hai fatto, come ti sei sentito / sentita e se è stata utile per il corpo, per la mente o per entrambi.'
        example: |-
          *Ho fatto una passeggiata nel parco. Mi sono sentito rilassato.*
          *Ho dormito otto ore. Mi sono sentita riposata.*
          *Ho mangiato molta frutta. Mi sono sentito bene.*
          *Ho passato del tempo con gli amici. Mi sono sentita felice.*
          *Ho fatto sport due volte. Mi sono sentito energico.*
      - id: act4-frames
        type: discussionQuestions
        title: La mia settimana
        items:
          - question: Questa settimana ho ___.
            frame: Mi sono sentito / sentita ___.
          - question: Questa settimana ho ___.
            frame: Mi sono sentito / sentita ___.
          - question: Questa settimana ho ___.
            frame: Mi sono sentito / sentita ___.
      - id: act4-dialogue
        type: dialogue
        lines:
          - { speaker: Studente A, text: Questa settimana ho fatto una passeggiata nel parco. }
          - { speaker: Studente B, text: Quando hai fatto la passeggiata? }
          - { speaker: Studente A, text: Sabato mattina. }
          - { speaker: Studente B, text: Con chi? }
          - { speaker: Studente A, text: Con mia moglie. }
          - { speaker: Studente B, text: Come ti sei sentito? }
          - { speaker: Studente A, text: Mi sono sentito molto rilassato. }
      - id: act4-share
        type: callout
        tone: info
        title: Esempio per la classe
        text: '*Questa settimana ho dormito otto ore ogni notte. Mi sono sentito molto bene perché avevo più energia. È stato utile sia per il corpo sia per la mente.*'
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Passato prossimo** (Attività 2 e 4) e **Dare
          consigli con dovere e potere** (Attività 1 e 3). La presentazione del quaderno è
          su gamma.app, che non è nella piattaforma: se la usi, condividila tu sullo
          schermo.
      - id: n-intro
        anchor: intro
        text: Fai prima il tuo esempio e poi chiedi a ogni studente.
      - id: n-warmup
        anchor: warmup
        text: Fai almeno due domande a ogni studente. Le risposte scritte qui compaiono sotto ogni domanda.
      - id: n-act1
        anchor: act1
        text: "Spiega la situazione: «Ti trovi nella sala d'attesa del medico.» Ogni studente sceglie un problema semplice; gli altri fanno domande e poi danno consigli."
      - id: n-act3
        anchor: act3
        text: 'Obiettivo: usare *dovere* e *potere* per dare consigli semplici sulla salute. Leggi una situazione alla volta; ogni studente dà almeno due consigli e gli altri ne aggiungono uno.'

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: salute-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: intro
        type: text
        text: Abbiamo parlato di **salute**, di **abitudini sane** e di cosa fare quando non ci sentiamo bene. Abbiamo raccontato cose passate con il **passato prossimo** e abbiamo dato consigli con **dovere** e **potere**.
      - id: rules-passato
        type: ruleSummary
        skill: Passato prossimo (e imperfetto)
        rules:
          - text: 'Usiamo il **passato prossimo** per azioni cominciate e finite nel passato: **avere** o **essere** + participio passato.'
            examples: [Ho bevuto molta acqua., Ho fatto sport., Ho mangiato una cena sana.]
          - text: 'Con **essere** (verbi come *andare*, *cadere* e i verbi riflessivi come *sentirsi*) il participio si accorda con il soggetto.'
            examples:
              [
                Sono andato dal medico. / Sono andata dal medico.,
                Mi sono sentito bene. / Mi sono sentita bene.,
              ]
          - text: 'Alcuni participi sono irregolari.'
            examples: ['bere → bevuto', 'fare → fatto', 'prendere → preso', 'essere → stato']
          - text: 'Parole di tempo: *ieri* (אתמול), *ieri sera* (אתמול בערב), *stamattina* (הבוקר), *la settimana scorsa* (בשבוע שעבר).'
            examples:
              [Ieri sera ho preso una medicina., La settimana scorsa ho fatto una passeggiata.]
          - text: "Per **descrivere** com'era la situazione nel passato usiamo l'**imperfetto**."
            examples: [Mi sono sentito molto bene perché avevo più energia.]
      - id: rules-consigli
        type: ruleSummary
        skill: Dare consigli (dovere e potere)
        rules:
          - text: '**Dovere** (צריך) + infinito: una cosa necessaria.'
            examples: [Devi bere più acqua., Devi riposare., Devi fare sport.]
          - text: "**Potere** (יכול) + infinito: una possibilità, un'idea."
            examples:
              [Puoi fare una passeggiata., Puoi mangiare più frutta., Puoi andare a letto prima.]
          - text: "Per parlare di un'altra persona: *deve*, *può*. Per dire che una cosa non va bene: *non deve*."
            examples:
              [
                Marco deve dormire di più.,
                Anna può fare una passeggiata.,
                Non deve bere troppa Coca-Cola.,
              ]
          - text: 'Per un consiglio più gentile: **dovresti**, **potresti**, **sarebbe meglio**, **ti consiglierei di** + infinito.'
            examples:
              [
                Dovresti riposare.,
                Potresti bere una tisana.,
                Sarebbe meglio andare dal medico.,
                Ti consiglierei di dormire di più.,
              ]
      - id: modali-table
        type: table
        caption: Dovere e potere al presente
        header: [Pronome, dovere, potere]
        rows:
          - [io, devo, posso]
          - [tu, devi, puoi]
          - [lui / lei, deve, può]
          - [noi, dobbiamo, possiamo]
          - [voi, dovete, potete]
          - [loro, devono, possono]
      - id: phrases-table
        type: table
        caption: Frasi utili
        header: [Italiano, Ebraico]
        rows:
          - [Non mi sento bene., אני לא מרגיש טוב.]
          - [Ho mal di testa., יש לי כאב ראש.]
          - [Ho mal di gola., יש לי כאב גרון.]
          - [Ho il raffreddore., אני מצונן.]
          - [Quando è successo?, מתי זה קרה?]
          - [Hai preso una medicina?, לקחת תרופה?]
          - [Come ti senti oggi?, איך אתה מרגיש היום?]
          - [Puoi dormire di più., אתה יכול לישון יותר.]
      - id: next
        type: callout
        tone: info
        title: Per la prossima lezione
        text: |-
          Sai raccontare in breve cosa hai fatto nell'ultima settimana per la tua salute: se hai fatto sport, cosa hai mangiato, quante ore hai dormito e come ti sei sentito / sentita.
          *Questa settimana ho fatto sport due volte. Ho bevuto molta acqua. Mi sono sentito bene e pieno di energia.*
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le due abilità con la classe e chiedi un esempio nuovo per ogni regola.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: salute-compiti
    title: Compiti
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti
      - id: part1-title
        type: heading
        level: 3
        text: 'Parte 1: Completa le frasi'
      - id: part1-words
        type: wordBank
        words: [acqua, sport, medico, stanco, frutta, medicina]
      - id: part1
        type: discussionQuestions
        items:
          - question: Quando non mi sento bene, vado dal ___.
          - question: Ogni giorno bevo molta ___.
          - question: Mangiare ___ e verdura è salutare.
          - question: Quando ho mal di testa, prendo una ___.
          - question: Dopo il lavoro mi sento ___.
          - question: Faccio ___ tre volte alla settimana.
      - id: part2-title
        type: heading
        level: 3
        text: 'Parte 2: Passato prossimo'
      - id: part2
        type: discussionQuestions
        title: Completa le frasi con il verbo al passato prossimo.
        items:
          - question: Ieri io ___ (bere) molta acqua.
          - question: La settimana scorsa noi ___ (fare) una passeggiata.
          - question: Lui ___ (andare) dal medico.
          - question: Io ___ (mangiare) una cena sana.
          - question: Marta ___ (dormire) otto ore.
      - id: part3-title
        type: heading
        level: 3
        text: 'Parte 3: Consigli'
      - id: part3
        type: discussionQuestions
        title: Completa con *deve* o *può*.
        items:
          - question: Marco non dorme molto. Lui ___ dormire di più.
          - question: Anna è stressata. Lei ___ fare una passeggiata.
          - question: Paolo ha sete. Lui ___ bere più acqua.
          - question: Lucia non fa sport. Lei ___ fare esercizio fisico.
          - question: Giorgio ha il raffreddore. Lui ___ riposare.
      - id: part4-title
        type: heading
        level: 3
        text: 'Parte 4: Scrittura'
      - id: part4
        type: reflection
        prompt: >-
          Scrivi 5–6 frasi: **Come ti prendi cura della tua salute?** Parla di cosa mangi,
          quanto dormi, se fai sport e cosa fai quando non ti senti bene.
      - id: mori-title
        type: heading
        level: 3
        text: Compiti con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia un messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
      - id: mori-main
        type: aiTutorPrompt
        title: Parliamo di salute
        message: Ciao Mori! Vorrei parlare della salute. Fammi domande con il passato prossimo e chiedimi consigli con deve e può. Correggi tutti i miei errori e spiegami brevemente le correzioni.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Attività interattiva 1: Dal medico'
        message: Giochiamo al medico. Tu sei il paziente e hai un problema di salute. Io devo fare domande e darti consigli usando deve e può. Correggi i miei errori.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Attività interattiva 2: La mia ultima settimana'
        message: Fammi domande sulla mia ultima settimana. Chiedimi cosa ho fatto per la mia salute, cosa ho mangiato, se ho fatto sport e come mi sono sentito. Correggi tutti i miei errori e continua la conversazione come un insegnante di italiano di livello A2.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Attività interattiva 3: Abitudine sana o no?'
        message: Giochiamo a «Abitudine sana o no?». Dimmi un'abitudine e io devo dire se è salutare oppure no e spiegare perché. Poi fammi una domanda in più. Correggi tutti i miei errori.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**
    teacherNotes:
      - id: n-part1
        anchor: part1
        text: 'Soluzioni: 1. medico; 2. acqua; 3. frutta; 4. medicina; 5. stanco / stanca; 6. sport.'
      - id: n-part2
        anchor: part2
        text: 'Soluzioni: 1. ho bevuto; 2. abbiamo fatto; 3. è andato; 4. ho mangiato; 5. ha dormito.'
      - id: n-part3
        anchor: part3
        text: >-
          Soluzioni: 1. deve; 2. può; 3. deve (anche *può*); 4. deve; 5. deve (anche
          *può*). Accetta *può* dove il consiglio è solo un'idea.

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: salute-pratica
    book: workbook
    title: 'Pratica: Salute'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Esercitati sulle due abilità del ciclo. Ogni risposta viene corretta subito e puoi riprovare.
      - id: ex-passato
        type: activity
        activity: salute-passato
      - id: ex-consigli
        type: activity
        activity: salute-consigli

