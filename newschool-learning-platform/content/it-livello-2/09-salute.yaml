          - { term: Sano, gloss: בריא }
          - { term: Salutare, gloss: בריא / מועיל לבריאות }
          - { term: Abitudine, gloss: הרגל }
          - { term: Medico, gloss: רופא }
          - { term: Ospedale, gloss: בית חולים }
          - { term: Farmaco, gloss: תרופה }
          - { term: Medicina, gloss: תרופה }
          - { term: Dolore, gloss: כאב }
          - { term: Raffreddore, gloss: צינון }
          - { term: Mal di gola, gloss: כאב גרון }
          - { term: Mal di testa, gloss: כאב ראש }
          - { term: Mal di schiena, gloss: כאב גב }
