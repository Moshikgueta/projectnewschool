vocabulary:
  - slug: volontariato
    title: Volontariato e aiuto agli altri
    items: *volontariato-words

activities:
  - slug: volontariato-passato-prossimo
    title: 'Passato prossimo: ho aiutato, siamo andati'
    minutes: 8
    items:
      - id: ho-aiutato
        type: multipleChoice
        prompt: Ieri io ___ un amico.
        options:
          - { text: ho aiutato, correct: true }
          - { text: sono aiutato, feedback: '*Aiutare* vuole *avere*: *ho aiutato*.' }
          - {
              text: ha aiutato,
              feedback: '*Ha aiutato* è per *lui / lei*. Per *io* usiamo *ho aiutato*.',
            }
      - id: anna-andata
        type: fillBlank
        prompt: Completa con il participio di *andare*.
        text: Anna è ___ al centro comunitario.
        blanks: [[andata]]
      - id: sono-andati
        type: multipleChoice
        prompt: Marco e Luca ___ andati al rifugio.
        options:
          - { text: sono, correct: true }
          - {
              text: hanno,
              feedback: '*Andare* è un verbo di movimento: vuole *essere*. *Sono andati.*',
            }
          - { text: è, feedback: '*Marco e Luca* è plurale (loro): *sono andati*.' }
      - id: unisci-participi
        type: matching
        prompt: Unisci ogni verbo al suo participio passato.
        pairs:
          - [aiutare, aiutato]
          - [ricevere, ricevuto]
          - [offrire, offerto]
          - [fare, fatto]
          - [raccogliere, raccolto]
      - id: accordo-essere
        type: trueFalse
        prompt: 'Con *essere*, il participio cambia secondo genere e numero: *Anna e Sara sono andate.*'
        answer: true
        feedback:
          correct: Giusto! *Anna e Sara* = femminile plurale → *andate*.
          incorrect: 'È vero: con *essere* il participio cambia. *Anna e Sara sono andate.*'
      - id: abbiamo-raccolto
        type: fillBlank
        prompt: Completa con *avere*.
        text: Noi ___ raccolto vestiti per le famiglie.
        blanks: [[abbiamo]]
      - id: arrivate
        type: multipleChoice
        prompt: Anna e Sara sono ___ al centro.
        options:
          - { text: arrivate, correct: true }
          - {
              text: arrivati,
              feedback: '*Anna e Sara* sono due donne: femminile plurale, *arrivate*.',
            }
          - { text: arrivata, feedback: '*Anna e Sara* è plurale: *arrivate*.' }
      - id: ordina-preparato
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: I volontari hanno preparato cibo.

  - slug: volontariato-imperfetto
    title: 'Imperfetto: aiutavo, era, facevamo'
    minutes: 8
    items:
      - id: aiutavo
        type: multipleChoice
        prompt: Quando ero volontario, ___ ogni settimana.
        options:
          - { text: aiutavo, correct: true }
          - {
              text: ho aiutato,
              feedback: "*Ogni settimana* è un'abitudine nel passato: usiamo l'imperfetto, *aiutavo*.",
            }
          - { text: aiutavano, feedback: '*Aiutavano* è per *loro*. Per *io* usiamo *aiutavo*.' }
      - id: era
        type: fillBlank
        prompt: Completa con l'imperfetto di *essere*.
        text: La situazione ___ difficile, ma i volontari ___ molto motivati.
        blanks: [[era], [erano]]
      - id: unisci-fare
        type: matching
        prompt: Unisci ogni persona alla forma giusta di *fare* all'imperfetto.
        pairs:
          - [io, facevo]
          - [tu, facevi]
          - [lui / lei, faceva]
          - [noi, facevamo]
          - [loro, facevano]
      - id: lavoravano
        type: multipleChoice
        prompt: Mentre i volontari ___, è arrivata una famiglia.
        options:
          - { text: lavoravano, correct: true }
          - {
              text: hanno lavorato,
              feedback: "Con *mentre* parliamo di un'azione in corso: usiamo l'imperfetto, *lavoravano*.",
            }
          - { text: lavorava, feedback: '*I volontari* è plurale (loro): *lavoravano*.' }
      - id: azioni-finite
        type: trueFalse
        prompt: "Usiamo l'imperfetto per un'azione finita e specifica, per esempio: *Ho aiutato una famiglia.*"
        answer: false
        feedback:
          correct: "Giusto! Per un'azione finita usiamo il passato prossimo. L'imperfetto è per abitudini, descrizioni ed emozioni."
          incorrect: "*Ho aiutato* è passato prossimo: lo usiamo per azioni finite. L'imperfetto è per abitudini, descrizioni ed emozioni."
      - id: davamo
        type: fillBlank
        prompt: Cambia il verbo dal presente all'imperfetto (*diamo* → ?).
        text: Ogni giorno, noi ___ cibo ai senzatetto.
        blanks: [[davamo]]
      - id: ha-telefonato
        type: multipleChoice
        prompt: Mentre preparavamo il cibo, all'improvviso il coordinatore ___.
        options:
          - { text: ha telefonato, correct: true }
          - {
              text: telefonava,
              feedback: "*All'improvviso*: è un'azione specifica che interrompe. Usiamo il passato prossimo, *ha telefonato*.",
            }
          - {
              text: hanno telefonato,
              feedback: '*Il coordinatore* è singolare (lui): *ha telefonato*.',
            }
      - id: ordina-stanchi
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: I volontari erano stanchi, ma felici.
