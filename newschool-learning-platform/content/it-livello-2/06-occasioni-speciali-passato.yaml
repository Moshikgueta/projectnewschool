vocabulary:
  - slug: occasioni-speciali-passato
    title: 'Occasioni speciali: passato'
    items: *occasioni-speciali-passato-words

activities:
  - slug: occasioni-speciali-passato-racconto
    title: 'Raccontare al passato: ho festeggiato, sono andato'
    minutes: 8
    items:
      - id: sono-andato
        type: multipleChoice
        prompt: Io ___ andato alla festa di Marco.
        options:
          - { text: sono, correct: true }
          - { text: ho, feedback: '*Andare* è un verbo di movimento: usa *essere*, *sono andato*.' }
      - id: ballato-cantato
        type: fillBlank
        prompt: Completa con il passato prossimo di *ballare* e *cantare*.
        text: Alla festa noi ___ e ___ tutta la sera.
        blanks: [[abbiamo ballato], [cantato, abbiamo cantato]]
      - id: lei-arrivata
        type: multipleChoice
        prompt: Lei ___ tardi alla festa.
        options:
          - { text: è arrivata, correct: true }
          - {
              text: è arrivato,
              feedback: 'Con *essere* il participio cambia come il soggetto: *lei* è femminile, quindi *è arrivata*.',
            }
          - { text: ha arrivata, feedback: '*Arrivare* usa *essere*: *è arrivata*.' }
      - id: unisci-verbi
        type: matching
        prompt: Unisci ogni verbo alla forma di *io* al passato prossimo.
        pairs:
          - [festeggiare, ho festeggiato]
          - [ricevere, ho ricevuto]
          - [venire, sono venuto]
          - [bere, ho bevuto]
          - [fare, ho fatto]
      - id: negazione
        type: trueFalse
        prompt: 'Per la negazione mettiamo *non* prima del verbo: *Non sono andato alla festa.*'
        answer: true
        feedback:
          correct: Giusto! *Non* va prima di *sono* / *ho*.
          incorrect: '*Non* va prima del verbo: *Non sono andato*, *Non ho mangiato*.'
      - id: amici-venuti
        type: fillBlank
        prompt: Completa con il passato prossimo di *venire*.
        text: Per il mio compleanno ___ tutti i miei amici.
        blanks: [[sono venuti]]
      - id: non-sono-andato
        type: multipleChoice
        prompt: Ieri sera ___ alla festa, perché ero stanco.
        options:
          - { text: non sono andato, correct: true }
          - { text: sono non andato, feedback: '*Non* va prima del verbo: *non sono andato*.' }
          - { text: non ho andato, feedback: '*Andare* usa *essere*: *non sono andato*.' }
      - id: ordina-compleanno
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: L'anno scorso ho festeggiato il mio compleanno a casa.

  - slug: occasioni-speciali-passato-domande
    title: 'Domande sul passato: Cosa hai fatto? Chi è venuto?'
    minutes: 8
    items:
      - id: che-regalo
        type: multipleChoice
        prompt: 'Risposta: *Ho ricevuto un libro da mia sorella.* Qual è la domanda?'
        options:
          - { text: Che regalo hai ricevuto?, correct: true }
          - {
              text: Che regalo ho ricevuto?,
              feedback: "*Ho ricevuto* è per *io*. Per fare una domanda a un'altra persona (tu) usiamo *hai ricevuto*.",
            }
          - {
              text: Dove hai festeggiato?,
              feedback: 'La risposta non dice dove, dice quale regalo: *un libro*.',
            }
      - id: sei-andata
        type: fillBlank
        prompt: Fai una domanda a Sara. Completa con il passato prossimo di *andare*.
        text: Sara, dove ___ sabato sera? — Sono andata a un matrimonio.
        blanks: [[sei andata, tu sei andata]]
      - id: unisci-domande
        type: matching
        prompt: Unisci ogni domanda alla sua risposta.
        pairs:
          - [Chi è venuto alla festa?, Sono venuti i miei cugini.]
          - [Cosa avete mangiato?, Abbiamo mangiato la pizza.]
          - [Dove hai festeggiato?, Ho festeggiato in un ristorante.]
          - [Che musica c'era?, C'era musica pop.]
          - [Con chi hai ballato?, Ho ballato con mia sorella.]
      - id: chi-venuto
        type: multipleChoice
        prompt: Chi ___ alla tua festa?
        options:
          - { text: è venuto, correct: true }
          - { text: ha venuto, feedback: '*Venire* usa *essere*: *Chi è venuto?*' }
          - {
              text: sei venuto,
              feedback: '*Chi* vuole il verbo alla terza persona: *Chi è venuto?*',
            }
      - id: hai-fatto
        type: fillBlank
        prompt: Completa la domanda con il passato prossimo di *fare* (tu).
        text: Cosa ___ il primo giorno di scuola? — Ho conosciuto i miei compagni.
        blanks: [[hai fatto, tu hai fatto]]
      - id: essere-movimento
        type: trueFalse
        prompt: 'Nella domanda *Dove sei andato?* usiamo *essere* perché *andare* è un verbo di movimento.'
        answer: true
        feedback:
          correct: Giusto! *Andare, venire, arrivare* usano *essere*.
          incorrect: '*Andare* è un verbo di movimento e usa *essere*: *sei andato*.'
      - id: report-ballato
        type: multipleChoice
        prompt: 'Marco dice: *Ho ballato molto.* Lo racconti alla classe: Marco ___ molto.'
        options:
          - { text: ha ballato, correct: true }
          - {
              text: ho ballato,
              feedback: '*Ho ballato* è per *io*. Per Marco (lui) usiamo *ha ballato*.',
            }
          - { text: è ballato, feedback: '*Ballare* usa *avere*: *ha ballato*.' }
      - id: ordina-regalo
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Che regalo hai ricevuto per il tuo compleanno?
