vocabulary:
  - slug: trasferimento
    title: Trasferimento
    items: *trasferimento-words

activities:
  - slug: trasferimento-futuro
    title: 'Futuro semplice: mi trasferirò, cercherò, vivrò'
    minutes: 8
    items:
      - id: mi-trasferiro
        type: multipleChoice
        prompt: L'anno prossimo io ___ a Milano.
        options:
          - { text: mi trasferirò, correct: true }
          - {
              text: mi trasferirà,
              feedback: 'La desinenza *-à* è per *lui / lei*. Per *io*: *mi trasferirò*.',
            }
          - {
              text: mi sono trasferito,
              feedback: "*Mi sono trasferito* è passato. *L'anno prossimo* è futuro: *mi trasferirò*.",
            }
      - id: studiero
        type: fillBlank
        prompt: Completa con il futuro di *studiare* (io).
        text: Prima del trasferimento ___ italiano ogni giorno.
        blanks: [[studierò, io studierò]]
      - id: cercheremo
        type: fillBlank
        prompt: Completa con il futuro di *cercare*. Attenzione alla *h*!
        text: Noi ___ un appartamento in centro.
        blanks: [[cercheremo]]
      - id: unisci-irregolari
        type: matching
        prompt: Unisci ogni verbo alla sua forma per *io* al futuro.
        pairs:
          - [parlare, parlerò]
          - [vivere, vivrò]
          - [partire, partirò]
          - [essere, sarò]
          - [avere, avrò]
      - id: anno
        type: trueFalse
        prompt: 'Nel futuro semplice la desinenza per *loro* è *-anno*: *lavoreranno*.'
        answer: true
        feedback:
          correct: Giusto! *Loro lavoreranno, vivranno, partiranno.*
          incorrect: 'La desinenza per *loro* è *-anno*: *lavoreranno, vivranno, partiranno*.'
      - id: conoscerete
        type: multipleChoice
        prompt: Dopo il trasferimento voi ___ nuove persone.
        options:
          - { text: conoscerete, correct: true }
          - {
              text: conoscerai,
              feedback: '*Conoscerai* è per *tu*. Per *voi* la desinenza è *-ete*: *conoscerete*.',
            }
          - {
              text: conoscete,
              feedback: '*Conoscete* è presente. *Dopo il trasferimento* parla del futuro: *conoscerete*.',
            }
      - id: avra-saranno
        type: fillBlank
        prompt: Completa con il futuro di *avere* e *essere*.
        text: La mia nuova città ___ molti parchi. Ci ___ tante opportunità.
        blanks: [[avrà], [saranno]]
        wordBank: [avrà, avrò, sarà, saranno]
      - id: ordina-roma
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Mi trasferirò a Roma l'anno prossimo.

  - slug: trasferimento-socializzare
    title: 'Socializzare: domande, ragioni e consigli'
    minutes: 8
    items:
      - id: domanda-pratica
        type: multipleChoice
        prompt: Ti sei appena trasferito / trasferita in una nuova città e cerchi una zona dove vivere. Quale domanda è utile e pratica?
        options:
          - { text: Quali quartieri consigli?, correct: true }
          - {
              text: Ti piace vivere?,
              feedback: 'Questa domanda non ti dà informazioni pratiche. Chiedi in modo diretto: *Quali quartieri consigli?*',
            }
          - {
              text: Dove hai mangiato ieri?,
              feedback: 'Questa domanda non ti aiuta a trovare una zona dove vivere. Chiedi: *Quali quartieri consigli?*',
            }
      - id: dove-posso
        type: fillBlank
        prompt: Completa la domanda con il verbo *potere* (io).
        text: Dove ___ conoscere persone nuove?
        blanks: [[posso]]
      - id: dovresti
        type: multipleChoice
        prompt: Il tuo amico non sa come andare al lavoro. Quale consiglio è giusto?
        options:
          - { text: Dovresti usare la metropolitana., correct: true }
          - {
              text: Dovrei usare la metropolitana.,
              feedback: '*Dovrei* è per *io*. Per dare un consiglio a un amico (tu) usiamo *dovresti*.',
            }
          - {
              text: Ti consiglio usare la metropolitana.,
              feedback: 'Prima di un infinito diciamo *Ti consiglio di*: *Ti consiglio di usare la metropolitana.*',
            }
      - id: unisci-risposte
        type: matching
        prompt: Unisci ogni domanda alla risposta giusta.
        pairs:
          - [Quali quartieri consigli?, Ti consiglio Trastevere. È tranquillo.]
          - [È facile usare i mezzi pubblici?, 'Sì, la metropolitana è comoda.']
          - [Dove posso conoscere persone nuove?, Puoi andare a un corso di lingua.]
          - [Perché ti trasferisci?, Perché voglio cambiare vita.]
      - id: perche
        type: trueFalse
        prompt: 'Per dare una ragione usiamo *perché*: *Mi trasferirò a Roma perché voglio cambiare vita.*'
        answer: true
        feedback:
          correct: Giusto! *Perché* introduce la ragione.
          incorrect: 'La frase è giusta: *perché* introduce la ragione.'
      - id: emozionata
        type: fillBlank
        prompt: 'Giulia parla di sé. Completa con *emozionato* al femminile.'
        text: Sono ___ ma anche un po' nervosa.
        blanks: [[emozionata]]
      - id: ci-sono
        type: multipleChoice
        prompt: ___ posti interessanti per uscire la sera?
        options:
          - { text: Ci sono, correct: true }
          - {
              text: "C'è",
              feedback: "*Posti* è plurale: usiamo *ci sono*. *C'è* è per il singolare.",
            }
          - {
              text: Sono,
              feedback: 'Per chiedere se una cosa esiste usiamo *ci sono*: *Ci sono posti interessanti?*',
            }
      - id: ordina-persone
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Dove posso conoscere persone nuove?
