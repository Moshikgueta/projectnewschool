vocabulary:
  - slug: viaggi-futuro
    title: Viaggi e futuro
    items: *viaggi-futuro-words

activities:
  - slug: viaggi-futuro-frasi
    title: 'Il futuro semplice: viaggerò, visiterò, sarò'
    minutes: 8
    items:
      - id: viaggero
        type: multipleChoice
        prompt: Il prossimo anno (io) ___ in Italia.
        options:
          - { text: viaggerò, correct: true }
          - {
              text: viaggiarò,
              feedback: 'Nel futuro i verbi in *-are* prendono *-er-*, e *viaggiare* perde la *i*: *viaggerò*.',
            }
          - {
              text: viaggerà,
              feedback: '*Viaggerà* è per *lui / lei*. Per *io* usiamo *viaggerò*.',
            }
      - id: proveremo
        type: fillBlank
        prompt: Completa con il futuro di *provare*.
        text: Domani noi ___ il cibo locale.
        blanks: [[proveremo]]
      - id: unisci-persone
        type: matching
        prompt: Unisci ogni persona alla forma giusta di *viaggiare*.
        pairs:
          - [io, viaggerò]
          - [tu, viaggerai]
          - [lui / lei, viaggerà]
          - [noi, viaggeremo]
          - [loro, viaggeranno]
      - id: are-er
        type: trueFalse
        prompt: 'Nel futuro dei verbi in *-are*, la *a* diventa *e*: *visitare → visiterò*.'
        answer: true
        feedback:
          correct: 'Giusto! *visitare → visiterò*, *portare → porterò*.'
          incorrect: 'I verbi in *-are* prendono *-er-* nel futuro: *visitare → visiterò*, *portare → porterò*.'
      - id: sara-hotel
        type: multipleChoice
        prompt: L'hotel ___ grande e avrà una piscina.
        options:
          - { text: sarà, correct: true }
          - { text: sarò, feedback: "*Sarò* è per *io*. L'hotel è *lui*: *sarà*." }
          - {
              text: è stato,
              feedback: '*È stato* è passato. Parliamo del prossimo viaggio: usiamo il futuro, *sarà*.',
            }
      - id: compagno
        type: fillBlank
        prompt: Completa con il futuro di *vivere* e *essere*.
        text: Il mio compagno ___ a Barcellona. La sua casa ___ intelligente.
        blanks: [[vivrà], [sarà]]
      - id: vivro
        type: multipleChoice
        prompt: Tra 20 anni (io) ___ a Barcellona.
        options:
          - { text: vivrò, correct: true }
          - { text: viverò, feedback: '*Vivere* ha il futuro irregolare: *vivrò*.' }
          - {
              text: vivevo,
              feedback: '*Vivevo* è imperfetto (passato). Con *tra 20 anni* usiamo il futuro: *vivrò*.',
            }
      - id: ordina-giappone
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Un giorno visiterò il Giappone.

  - slug: viaggi-futuro-domande
    title: 'Domande al futuro: cosa visiterai?'
    minutes: 8
    items:
      - id: con-chi-vivrai
        type: multipleChoice
        prompt: 'A: *Tra 20 anni vivrò a Barcellona.* B: Qual è la domanda giusta?'
        options:
          - { text: Con chi vivrai a Barcellona?, correct: true }
          - {
              text: Con chi vivrò a Barcellona?,
              feedback: '*Vivrò* è per *io*. Per fare una domanda al compagno usiamo *tu*: *vivrai*.',
            }
          - {
              text: Con chi vivrà a Barcellona?,
              feedback: '*Vivrà* è per *lui / lei*. Parli con il compagno: usa *tu*, *vivrai*.',
            }
      - id: proverai
        type: fillBlank
        prompt: Completa la domanda con il futuro di *provare* (tu).
        text: Che cibo ___ in Italia?
        blanks: [[proverai]]
      - id: unisci-risposte
        type: matching
        prompt: Unisci ogni domanda alla sua risposta.
        pairs:
          - [Dove viaggerai?, Viaggerò in Italia.]
          - [Con chi viaggerai?, Viaggerò con mia sorella.]
          - [Quanto tempo resterai lì?, Resterò due settimane.]
          - [Cosa porterai in valigia?, Porterò vestiti estivi.]
          - [Come viaggerai?, Viaggerò in treno.]
      - id: visiterai
        type: multipleChoice
        prompt: Quale domanda fai a un compagno sul suo prossimo viaggio?
        options:
          - { text: Visiterai una grande città?, correct: true }
          - {
              text: Visiterò una grande città?,
              feedback: '*Visiterò* è per *io*. Per il compagno usiamo *tu*: *visiterai*.',
            }
          - {
              text: Hai visitato una grande città?,
              feedback: '*Hai visitato* è passato. Il viaggio è nel futuro: *visiterai*.',
            }
      - id: forma-tu
        type: trueFalse
        prompt: 'Per fare una domanda a un compagno al futuro usiamo la forma di *tu*: *Cosa farai lì?*'
        answer: true
        feedback:
          correct: 'Giusto! *farai, visiterai, viaggerai* finiscono in *-ai*.'
