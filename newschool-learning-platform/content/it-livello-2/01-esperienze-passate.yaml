# Cycle "Esperienze passate", converted from the Italian level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-2
slug: esperienze-passate
title: Esperienze passate
goal: Raccontare esperienze con il passato prossimo e descrivere il passato con l'imperfetto.
position: 1
status: published

review:
  - >-
    The two workbook exercises ("Passato prossimo" and "Imperfetto") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's summary
    rules, the activity examples and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    The notebook lists four abilities (passato prossimo sentences and questions;
    imperfetto; telling in 1st / 2nd / 3rd person; longer answers). They are grouped
    into the cycle's two skills: "Passato prossimo" (sentences and questions, 1st / 2nd
    / 3rd person) and "Imperfetto" (descriptions and habits, mostly for intermediate
    groups). Please confirm.
  - >-
    Links: the lesson slides (gamma.app) are not allowed and were left out. The
    "Quizlet" link in the notebook actually points to the same gamma.app page, so the
    cycle has NO Quizlet link: please add the real Quizlet set if there is one. Both
    are mentioned in a teacher note.
  - >-
    Activity 2 ("Non ho mai, mai…") was copied from the Spanish notebook: "passato
    remoto e passato prossimo", "passato indefinito" (base) and "preterito perfetto"
    (intermediate) do not apply to Italian, and both levels had the same example. Now:
    base level = passato prossimo ("Non ho mai mangiato il sushi"); intermediate level =
    the same sentence plus a reason in the imperfetto ("…perché da bambino non mi
    piaceva il pesce"). "Chiunque lo faccia riceve un punto negativo" → "Chi l'ha fatto
    riceve un punto negativo". Title → "Io non ho mai…". Please confirm.
  - >-
    Activity 3: "Ex allievo B" (mistranslation) → "Studente B"; "Incipit" → "Livello
    base"; "L'ultima volta che sono andato al cinema è stato sabato" → "è stata sabato"
    (agrees with "volta"), same fix in "L'ultima volta che ho viaggiato è stato…";
    "L'ultima volta che ho viaggiato è stata a Madrid" → "L'ultima volta che ho
    viaggiato, sono andato a Madrid" (also in the intermediate example, where "che sono
    andato" had no destination); "pone una o due domande di approfondimento per
    approfondire" → "fa una o due domande per sapere di più".
  - >-
    Summary: "Forme pratique in classe" → "Forme praticate in classe"; "Per uno
    studente ebraico" → "Per chi parla ebraico"; "Ieri ho mangiato pizza" → "Ieri ho
    mangiato la pizza". ADDED: a rule on when to use essere (movement and change verbs
    like andare, uscire, tornare, and reflexive verbs like svegliarsi, riposarsi) and
    when avere; the plural persons (noi / voi / loro) in the passato prossimo table; an
    imperfetto table (giocare, vivere, essere), which the notebook does not have. The
    intermediate passato prossimo examples and the beginner / intermediate recap are
    kept in shorter form. Please confirm.
  - >-
    Mori, intermediate message 2 asks for "3 al passato prossimo e 2 all'imperfetto",
    but the example has 2 in the passato prossimo (sono andato, è stato) and 3 in the
    imperfetto (vivevo, giocavo, era). The message now says 2 + 3 to match the
    example. Beginner message 1: "Dove sei andato" → "Dove sei andato / andata"; "Io
    risponderò alle domande e tu correggerai…" → "Io rispondo. Correggi le mie frasi se
    necessario." The example answers were moved into the intro line of each message.
  - >-
    Warm-up: the frames were kept. Question 6 of the intermediate list was a separate
    heading in the source; it is now in the same list.
  - >-
    The cycle has no lesson plan and no introduction round in the source, so none was
    added. A short teacher note maps the activities to the two skills. Activity 4 needs
    three pictures chosen by the teacher (not in the notebook).
  - >-
    Times given as ranges are recorded as the upper value (7–8 → 8, 3–4 → 4, 2–3 → 3).
    The "Studente 1/2/3" lines are replaced by the optional answer boxes.
  - >-
    Vocabulary: kept as in the source; "Sono uscito / Sei uscito / È uscito" etc. are
    shown in the masculine only. "Campagna – כפר / שדה" kept; please check.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: esperienze-passate-classe
    title: 'In classe: Esperienze passate'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Esperienze passate
      - id: skills
        type: cycleOverview
        skills:
          - name: Passato prossimo
            description: 'Frasi e domande su azioni concluse: *ho mangiato, sono andato / andata, che cosa hai fatto?*'
          - name: Imperfetto
            description: 'Descrizioni e abitudini nel passato: *era, faceva caldo, giocavo sempre*'
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di preparazione
      - id: warmup-basic-title
        type: heading
        level: 4
        text: Livello principiante
      - id: warmup-basic
        type: discussionQuestions
        items:
          - question: Che cosa hai fatto lo scorso fine settimana?
            frame: Lo scorso fine settimana sono andato / andata… / ho mangiato… / ho visto…
          - question: A che ora ti sei svegliato / svegliata ieri?
            frame: Ieri mi sono svegliato / svegliata alle…
          - question: Che cosa hai mangiato al tuo ultimo pasto?
            frame: All'ultimo pasto ho mangiato…
          - question: Quali luoghi hai visitato il mese scorso?
            frame: Il mese scorso ho visitato…
          - question: Che cosa hai comprato l'ultima volta che sei andato / andata in un negozio?
            frame: L'ultima cosa che ho comprato è stata…
          - question: Che cosa hai imparato a scuola o in un corso la settimana scorsa?
            frame: La settimana scorsa ho imparato…
      - id: warmup-inter-title
        type: heading
        level: 4
        text: Livello intermedio
      - id: warmup-inter
        type: discussionQuestions
        items:
          - question: Qual è stato l'ultimo film o l'ultima serie che hai visto? Che impressione ti ha fatto?
            frame: L'ultimo film che ho visto è stato… e mi è sembrato…
          - question: Che cosa hai fatto ieri sera e con chi sei stato / stata?
            frame: Ieri sera… Sono stato / stata con…
          - question: In quale paese sei stato / stata durante le tue ultime vacanze? Che cosa ti è piaciuto di più?
            frame: Sono stato / stata in… e la cosa che mi è piaciuta di più è stata…
          - question: Qual è stata la cosa più interessante che hai imparato recentemente?
            frame: Ho imparato… e mi è piaciuto perché…
          - question: Qual è stata la tua migliore esperienza dell'ultimo mese?
            frame: La mia migliore esperienza è stata… perché…
          - question: Qual è stata la cosa più divertente che hai fatto la settimana scorsa?
            frame: La settimana scorsa ho fatto… con… ed è stato molto divertente.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: E cosa hai fatto ieri…?'
        skills: [Passato prossimo]
        minutes: 17
        steps:
          - Scrivi tre cose che hai fatto ieri.
          - 'In coppia: lo studente A legge una frase. Lo studente B fa la domanda corrispondente.'
          - Ripetete con tutte le frasi.
          - Dite se avete fatto qualcosa di simile o di diverso.
          - Racconta alla classe, in terza persona, che cosa ha fatto il tuo compagno.
        example: |-
          *A: Ieri ho cucinato la pasta.*
          *B: Che cosa hai cucinato ieri?*
          *Anch'io ho visto un film. / Io invece sono andato al ristorante.*
          *Ieri il mio compagno ha cucinato la pasta e ha guardato un film.*
      - id: act1-sentences
        type: discussionQuestions
        title: Le mie tre frasi di ieri
        items:
          - question: Ieri ___.
            frame: Ieri ho cucinato la pasta.
          - question: Ieri ___.
            frame: Ieri ho visto un film.
          - question: Ieri ___.
            frame: Ieri ho parlato con un amico.
      - id: act2
        type: classActivity
        title: 'Attività 2: Io non ho mai…'
        skills: [Passato prossimo, Imperfetto]
        steps:
          - Di' una cosa che non hai mai fatto.
          - Chi l'ha fatto riceve un punto negativo.
          - Con due punti negativi sei eliminato. Vince l'ultimo che resta in gioco.
        example: |-
          *Non ho mai mangiato il sushi.* (livello base: passato prossimo)
          *Non ho mai mangiato il sushi perché da bambino non mi piaceva il pesce.* (livello intermedio: + imperfetto)
      - id: act2-sentences
        type: discussionQuestions
        title: Io non ho mai…
        items:
          - question: Non ho mai ___.
            frame: Non ho mai mangiato…
          - question: Non sono mai ___.
            frame: Non sono mai andato / andata a…
          - question: Non ho mai ___.
            frame: Non ho mai visto…
      - id: act3
        type: classActivity
        title: "Attività 3: L'ultima volta che…"
        skills: [Passato prossimo, Imperfetto]
        minutes: 17
        steps:
          - Completa le tre frasi qui sotto. Puoi aggiungere un breve dettaglio (luogo, cibo, persona).
          - 'In coppia: leggi le tue frasi. Il compagno fa una o due domande per sapere di più.'
          - Racconta alla classe, in terza persona, che cosa hai scoperto sul tuo compagno.
        example: |-
          *A: L'ultima volta che sono andato al cinema è stata sabato.*
          *B: Con chi sei andato? Che film hai visto?*
          *A: L'ultima volta che ho cucinato è stata ieri.*
          *B: Che cosa hai cucinato? Con chi hai mangiato?*
          *Sabato il mio amico è andato al cinema con suo fratello e ha visto un film d'azione.*
      - id: act3-sentences
        type: discussionQuestions
        title: "L'ultima volta che…"
        items:
          - question: "L'ultima volta che sono andato / andata al cinema è stata ___."
          - question: "L'ultima volta che ho cucinato è stata ___."
          - question: "L'ultima volta che ho viaggiato è stata ___."
      - id: act3-levels
        type: callout
        tone: info
        title: Per livello
        text: |-
          **Livello base:** frasi brevi con un'azione. *L'ultima volta che ho viaggiato, sono andato a Madrid.*
          **Livello intermedio:** aggiungi dettagli con l'imperfetto. *L'ultima volta che ho viaggiato, sono andato a Madrid. Il tempo era splendido e uscivamo sempre a fare passeggiate.*
      - id: act4
        type: classActivity
        title: 'Attività 4: Storie in tre foto'
        skills: [Passato prossimo, Imperfetto]
        steps:
          - Guarda le tre immagini che mostra l'insegnante.
          - Inventa una mini storia al passato che collega le tre immagini.
          - Usa almeno tre verbi al passato prossimo.
          - Racconta la tua storia alla classe.
        example: |-
          *L'estate scorsa sono andato al mare. Poi ho mangiato in un ristorante. Alla fine sono andato a una festa con i miei amici.*
      - id: act4-levels
        type: callout
        tone: info
        title: Per livello
        text: |-
          **Livello base:** tre frasi brevi al passato prossimo, come nell'esempio.
          **Livello intermedio:** aggiungi descrizioni con l'imperfetto. *L'estate scorsa sono andato al mare. Il tempo era bellissimo e il mare era molto caldo.*
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Passato prossimo** (frasi e domande in 1ª, 2ª e
          3ª persona), con le domande di preparazione e le Attività 1 e 3; e
          **Imperfetto** (descrizioni e abitudini), soprattutto per i gruppi intermedi,
          con le varianti delle Attività 2, 3 e 4. Scegli le domande di preparazione del
          livello del tuo gruppo.
      - id: n-links
        anchor: null
        text: >-
          La presentazione della lezione (gamma.app) non è inclusa nella piattaforma. Il
          link «Quizlet» del quaderno porta alla stessa presentazione: per ora questo
          ciclo non ha un set Quizlet.
      - id: n-warmup
        anchor: warmup-title
        text: Fai almeno due domande a ogni studente. Le risposte scritte qui compaiono sotto ogni domanda.
      - id: n-act1
        anchor: act1
        minutes: 17
        text: >-
          Preparazione individuale: 3 minuti. Lavoro a coppie: 8 minuti. Confronto: 3
          minuti. Chiusura: 3 minuti (alcuni studenti raccontano in terza persona che cosa
          ha fatto il compagno). Così praticano la 1ª persona (*Ho cucinato*), la 2ª
          (*Che cosa hai cucinato?*) e la 3ª (*Ha cucinato*).
      - id: n-act2
        anchor: act2
        text: >-
          Con i gruppi principianti basta il passato prossimo (*Non ho mai mangiato il
          sushi*). Con i gruppi intermedi chiedi di aggiungere un motivo o un dettaglio
          con l'imperfetto.
      - id: n-act3
        anchor: act3
        minutes: 17
        text: >-
          Preparazione individuale: 4 minuti. Lavoro in coppia: 8 minuti. Chiusura di
          gruppo: 5 minuti. Praticano la 1ª persona (*L'ultima volta che ho viaggiato…*),
          la 2ª (*Dove sei andato? Con chi hai viaggiato?*) e la 3ª (*Il mio compagno è
          andato a…*).
      - id: n-act4
        anchor: act4
        text: >-
          Prima della lezione scegli tre immagini legate a esperienze (per esempio:
          spiaggia, ristorante, festa) e mostrale sullo schermo. Fai prima l'esempio.
          Alla fine metti in evidenza l'uso corretto dei verbi al passato e degli
          indicatori temporali.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: esperienze-passate-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: basic-title
        type: heading
        level: 3
        text: Livello principiante
      - id: rules-passato
        type: ruleSummary
        skill: Passato prossimo
        rules:
          - text: 'Il **passato prossimo** si usa per parlare di azioni che sono successe **una volta** nel passato e sono **finite**: che cosa hai fatto ieri, la settimana scorsa o in un momento preciso.'
            examples:
              [
                Ieri ho mangiato la pizza.,
                Sabato sono andato al cinema.,
                La settimana scorsa ho visto un film.,
              ]
          - text: "Si forma con **avere** o **essere** + **participio passato**. Per chi parla ebraico è come אכלתי, הלכתי, ראיתי: un'azione completa nel passato."
            examples: [ho mangiato, sono andato, ho visto]
          - text: 'Usiamo **essere** con i verbi di movimento e di cambiamento (*andare, uscire, tornare, stare*) e con i verbi riflessivi (*svegliarsi, riposarsi*). Con **essere** il participio cambia con il genere e il numero. Con quasi tutti gli altri verbi usiamo **avere**, e il participio non cambia.'
            examples:
              - Marco è andato al mare. / Marta è andata al mare.
              - Ieri mi sono svegliata alle sette.
              - Ho studiato italiano. / Abbiamo studiato italiano.
          - text: 'Indicatori temporali comuni:'
            examples:
              - 'ieri, ieri sera, sabato scorso, la settimana scorsa, due giorni fa, il fine settimana scorso'
              - Due giorni fa ho parlato con un amico.
          - text: "Per fare una domanda a un'altra persona usiamo la forma di **tu** (*hai, sei*). Per raccontare che cosa ha fatto un'altra persona usiamo la forma di **lui / lei** (*ha, è*)."
            examples:
              - Ho cucinato la pasta. → Che cosa hai cucinato? → Il mio compagno ha cucinato la pasta.
              - Con chi sei andato al cinema?
          - text: '**Regola pratica:** usa il passato prossimo quando parli di qualcosa che è successo una volta, in un momento preciso, ed è già finito.'
            examples: [Ieri ho mangiato al ristorante., La settimana scorsa ho visitato Roma.]
      - id: passato-table
        type: table
        caption: Forme praticate in classe
        header: [Persona, avere + participio, essere + participio]
        rows:
          - [io, ho mangiato, sono andato / andata]
          - [tu, hai mangiato, sei andato / andata]
          - [lui / lei, ha mangiato, è andato / è andata]
          - [noi, abbiamo mangiato, siamo andati / andate]
          - [voi, avete mangiato, siete andati / andate]
          - [loro, hanno mangiato, sono andati / andate]
      - id: inter-title
        type: heading
        level: 3
        text: Livello intermedio
      - id: rules-imperfetto
        type: ruleSummary
        skill: Imperfetto
        rules:
          - text: 'Il **passato prossimo** racconta fatti concreti e conclusi: **cosa è successo**.'
            examples:
              [
                L'anno scorso sono stato in Italia.,
                Due giorni fa ho cenato con i miei amici.,
                Ieri ho studiato per un esame.,
              ]
          - text: "L'**imperfetto** si usa per le **abitudini** nel passato, per le **descrizioni** e per le situazioni che continuano. Per chi parla ebraico è come כשהייתי ילד הייתי משחק כדורגל."
            examples:
              - Quando ero bambino giocavo sempre a calcio.
              - Il mio quartiere era molto tranquillo.
              - A scuola avevamo sempre lezioni di musica.
          - text: "Indicatori temporali comuni dell'imperfetto:"
            examples:
              - 'quando ero bambino, nella mia infanzia, prima, sempre, di solito, normalmente'
              - Quando ero piccolo vivevo in una piccola città.
          - text: "Per raccontare una storia usiamo spesso i due tempi insieme: **passato prossimo** → che cosa è successo; **imperfetto** → com'era la situazione, che cosa succedeva prima."
            examples:
              - L'estate scorsa sono andato al mare. Il mare era molto calmo e faceva caldo.
              - Ieri sono andato al ristorante. Il ristorante era molto pieno.
      - id: imperfetto-table
        type: table
        caption: Imperfetto
        header: [Persona, giocare, vivere, essere]
        rows:
          - [io, giocavo, vivevo, ero]
          - [tu, giocavi, vivevi, eri]
          - [lui / lei, giocava, viveva, era]
          - [noi, giocavamo, vivevamo, eravamo]
          - [voi, giocavate, vivevate, eravate]
          - [loro, giocavano, vivevano, erano]
      - id: recap
        type: callout
        tone: info
        title: Riassunto
        text: |-
          **Principianti:** usano il passato prossimo per azioni finite, esperienze semplici ed eventi precisi. *Ieri ho mangiato la pizza.*
          **Livello intermedio:** usano passato prossimo + imperfetto per raccontare esperienze più complete. *Ieri sono andato al parco. Il tempo era bellissimo.*
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le regole del livello del tuo gruppo e chiedi un esempio nuovo per ogni regola.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: esperienze-passate-compiti
    title: Compiti con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia un messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
      - id: basic-title
        type: heading
        level: 3
        text: Livello principiante
      - id: basic-goal
        type: text
        text: 'Obiettivo: praticare il passato prossimo con frasi brevi, domande semplici e piccoli racconti in prima e terza persona.'
      - id: mori-basic-1
        type: aiTutorPrompt
        title: 'Messaggio 1: Domande e risposte'
        message: |-
          Ciao Mori, vorrei esercitarmi con il passato prossimo. Fammi 5 domande semplici, per esempio:
          Che cosa hai fatto ieri?
          Che cosa hai mangiato oggi?
          Dove sei andato / andata lo scorso fine settimana?
          Io rispondo. Correggi le mie frasi se necessario.
      - id: mori-basic-2
        type: aiTutorPrompt
        title: 'Messaggio 2: Mini diario'
        intro: 'Poi scrivi le tue quattro frasi. Esempio: *Ieri sono andato al supermercato. Ieri sera ho guardato una serie. Ho cucinato la pizza. Ho parlato al telefono con un mio amico.*'
        message: Ciao Mori, ti racconterò quattro cose che ho fatto ieri. Per favore, correggi le mie frasi e fammi una domanda su ciascuna.
      - id: mori-basic-3
        type: aiTutorPrompt
        title: 'Messaggio 3: Racconto in terza persona'
        intro: "Poi scrivi le tue frasi. Esempio: *Mia sorella ha studiato per un esame. Ha mangiato un'insalata. Ha guardato un film.*"
        message: Ciao Mori, ti racconterò che cosa ha fatto ieri una persona della mia famiglia. Per favore, correggi le mie frasi e fammi una domanda su questa persona.
      - id: inter-title
        type: heading
        level: 3
        text: Livello intermedio
      - id: inter-goal
        type: text
        text: "Obiettivo: usare insieme il passato prossimo (azioni precise) e l'imperfetto (descrizioni, abitudini e contesto)."
      - id: mori-inter-1
        type: aiTutorPrompt
        title: 'Messaggio 1: Intervista'
        intro: 'Esempio. Mori: *Qual è stato il tuo viaggio preferito?* Tu: *Il mio viaggio preferito è stato in Italia.* Mori: *Benissimo. Con chi sei andato in Italia?*'
        message: Ciao Mori, fammi 5 domande sul passato, 3 al passato prossimo e 2 all'imperfetto. Dopo ogni risposta, correggimi se necessario e fammi una domanda di approfondimento.
      - id: mori-inter-2
        type: aiTutorPrompt
        title: 'Messaggio 2: Mini biografia'
        intro: 'Poi scrivi le tue cinque frasi. Esempio: *Quando ero bambino vivevo in una piccola città. Giocavo sempre con i miei amici per strada. Nel 2005 sono andato a Madrid con la mia famiglia. Il viaggio è stato molto divertente. La mia scuola era grande.*'
        message: Ciao Mori, voglio scrivere una mini biografia della mia infanzia. Scriverò 5 frasi, 2 al passato prossimo e 3 all'imperfetto. Per favore, correggi le mie frasi e fammi una domanda sulla mia infanzia.
      - id: mori-inter-3
        type: aiTutorPrompt
        title: 'Messaggio 3: Diario della settimana'
        intro: 'Poi scrivi le tue frasi. Esempio: *Sabato sono andato in spiaggia. Faceva molto caldo. Domenica ho cenato con la mia famiglia. Il cibo era delizioso.*'
        message: Ciao Mori, ti racconterò che cosa ho fatto la settimana scorsa in sei frasi. In ogni frase aggiungerò un dettaglio con l'imperfetto. Per favore, correggimi se necessario e fammi una domanda su una delle mie frasi.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: esperienze-passate-pratica
    book: workbook
    title: 'Pratica: Esperienze passate'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Esercitati sulle due abilità del ciclo. Ogni risposta viene corretta subito e puoi riprovare.
      - id: ex-passato
        type: activity
        activity: esperienze-passate-passato
      - id: ex-imperfetto
        type: activity
        activity: esperienze-passate-imperfetto

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: esperienze-passate-vocabolario
    title: Vocabolario
