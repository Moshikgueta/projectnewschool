vocabulary:
  - slug: esperienze-passate
    title: Esperienze passate
    items: *esperienze-passate-words

activities:
  - slug: esperienze-passate-passato
    title: 'Passato prossimo: ho mangiato, sono andato'
    minutes: 8
    items:
      - id: ho-cucinato
        type: multipleChoice
        prompt: Ieri ___ la pasta.
        options:
          - { text: ho cucinato, correct: true }
          - {
              text: cucino,
              feedback: '*Cucino* è presente. Con *ieri* usiamo il passato prossimo: *ho cucinato*.',
            }
          - { text: sono cucinato, feedback: 'Il verbo *cucinare* usa *avere*: *ho cucinato*.' }
      - id: e-andata
        type: multipleChoice
        prompt: Sabato Marta ___ al cinema.
        options:
          - { text: è andata, correct: true }
          - {
              text: è andato,
              feedback: 'Con *essere* il participio cambia con il genere. Marta è femminile: *è andata*.',
            }
          - { text: ha andato, feedback: 'Il verbo *andare* usa *essere*: *è andata*.' }
      - id: visto-parlato
        type: fillBlank
        prompt: Completa con il passato prossimo di *vedere* e *parlare* (io).
        text: Ieri ___ un film e ___ con un amico.
        blanks: [[ho visto], [ho parlato]]
      - id: unisci-participi
        type: matching
        prompt: Unisci ogni verbo alla sua forma di *io* al passato prossimo.
        pairs:
          - [uscire, sono uscito]
          - [imparare, ho imparato]
          - [prendere, ho preso]
          - [ridere, ho riso]
          - [correre, ho corso]
      - id: domanda-tu
        type: multipleChoice
        prompt: 'A: *Ieri ho cucinato la pasta.* B: Qual è la domanda giusta?'
        options:
          - { text: Che cosa hai cucinato ieri?, correct: true }
          - {
              text: Che cosa ho cucinato ieri?,
              feedback: "*Ho* è la forma di *io*. Per fare una domanda a un'altra persona usiamo *hai*.",
            }
          - {
              text: Che cosa cucini ieri?,
              feedback: '*Cucini* è presente. Con *ieri* usiamo il passato prossimo: *hai cucinato*.',
            }
      - id: essere-genere
        type: trueFalse
        prompt: 'Con *essere* il participio cambia con il genere: *lui è andato*, *lei è andata*.'
        answer: true
        feedback:
          correct: Giusto! Con *essere* il participio cambia con il genere e il numero.
          incorrect: 'Con *essere* il participio cambia con il genere: *Marco è andato*, *Marta è andata*.'
      - id: terza-persona
        type: multipleChoice
        prompt: 'Il tuo compagno dice: *Ho guardato un film.* Racconta alla classe: Il mio compagno ___ un film.'
        options:
          - { text: ha guardato, correct: true }
          - {
              text: ho guardato,
              feedback: '*Ho guardato* è per *io*. Per il tuo compagno (lui) usiamo *ha guardato*.',
            }
          - {
              text: hai guardato,
              feedback: '*Hai guardato* è per *tu*. Per il tuo compagno (lui) usiamo *ha guardato*.',
            }
      - id: ordina-roma
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: La settimana scorsa ho visitato Roma.

  - slug: esperienze-passate-imperfetto
    title: 'Imperfetto: era, giocavo, faceva caldo'
    minutes: 8
    items:
      - id: giocavo
        type: multipleChoice
        prompt: Quando ero bambino, ___ sempre a calcio.
        options:
          - { text: giocavo, correct: true }
          - {
              text: ho giocato,
              feedback: "*Quando ero bambino* e *sempre* parlano di un'abitudine: usiamo l'imperfetto, *giocavo*.",
            }
          - {
              text: gioco,
              feedback: "*Gioco* è presente. Per un'abitudine nel passato usiamo *giocavo*.",
            }
      - id: era-tranquillo
        type: fillBlank
        prompt: "Completa con l'imperfetto di *essere*."
        text: Il mio quartiere ___ molto tranquillo.
        blanks: [[era]]
      - id: sono-andato
        type: multipleChoice
        prompt: Ieri ___ al ristorante. Il ristorante era molto pieno.
        options:
          - { text: sono andato, correct: true }
          - {
              text: andavo,
              feedback: "Ieri sei andato al ristorante una volta, ed è finito: è un'azione precisa, usiamo il passato prossimo.",
            }
          - {
              text: vado,
              feedback: '*Vado* è presente. Con *ieri* usiamo il passato prossimo: *sono andato*.',
            }
      - id: uso-imperfetto
        type: trueFalse
        prompt: "L'imperfetto si usa per le abitudini e le descrizioni nel passato: *Il tempo era bellissimo.*"
        answer: true
        feedback:
          correct: "Giusto! L'imperfetto descrive com'era la situazione."
          incorrect: "L'imperfetto si usa per abitudini e descrizioni: *Il tempo era bellissimo. Giocavo sempre a calcio.*"
      - id: vivevo-avevamo
        type: fillBlank
        prompt: "Completa con l'imperfetto di *vivere* (io) e *avere* (noi)."
        text: Quando ero piccolo ___ in una piccola città. A scuola ___ sempre lezioni di musica.
        blanks: [[vivevo, io vivevo], [avevamo, noi avevamo]]
      - id: unisci-imperfetto
        type: matching
        prompt: "Unisci ogni verbo alla sua forma di *io* all'imperfetto."
        pairs:
          - [giocare, giocavo]
          - [vivere, vivevo]
          - [essere, ero]
          - [avere, avevo]
          - [fare, facevo]
      - id: cibo-era
        type: multipleChoice
        prompt: Domenica ho cenato con la mia famiglia. Il cibo ___ delizioso.
        options:
          - { text: era, correct: true }
          - {
              text: è,
              feedback: "*È* è presente. Per descrivere una situazione nel passato usiamo l'imperfetto: *era*.",
            }
          - { text: ero, feedback: '*Ero* è la forma di *io*. Il cibo è *lui*: *era*.' }
      - id: ordina-quartiere
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Il mio quartiere era molto tranquillo.
