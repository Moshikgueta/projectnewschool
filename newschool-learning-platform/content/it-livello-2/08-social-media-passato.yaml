# Cycle "Social media – Passato", converted from the Italian level 2 (conversational)
# digital notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-2
slug: social-media-passato
title: Social media al passato
goal: Raccontare esperienze sui social media con il passato prossimo e fare confronti.
position: 8
status: published

review:
  - >-
    The two workbook exercises ("Passato prossimo" and "Confronti") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's two
    skills, its summary rules, the activity examples and its vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    Title "Social media - PASSATO" → "Social media al passato" (the slug stays
    social-media-passato).
  - >-
    Summary, passato prossimo: the notebook gives only "Avere / Essere + Participio
    Passato" and examples. Added: when to use essere (verbs of movement or change such
    as andare, entrare, and reflexive verbs: mi sono divertito) and that the participle
    then agrees with the subject (è entrato / è entrata); regular participles -ato,
    -uto, -ito; the irregular participles of the cycle (aperto, condiviso, fatto,
    visto, stato); and the agreement of "piacere" (mi è piaciuto il video, mi è
    piaciuta la pubblicità, mi sono piaciuti i commenti), which Activity 1 uses. A
    table of avere / essere was added. Please confirm.
  - >-
    Summary, comparisons: added that "di" joins the article (più popolare del tuo,
    della mia), that "di" + pronoun is "di me / di te", and how the superlative is
    built (il social più utile, l'app meno educativa). "Di più" (Quale app hai usato
    di più?) was added as an expression, since the questions use it.
  - >-
    Corrections: warm-up 2 frame "L'ultima cosa che ho pubblicato era…" (imperfetto)
    → "…è stata…"; warm-up 3 "Che tipo di musica o video hai guardato" → "hai
    ascoltato o guardato"; Activity 4 question "Quale app hai usato meno
    recentemente?" (unclear) → "Quale app hai usato di meno ultimamente?". The
    stray asterisks and backslashes of the export (*\*…\**) were removed.
  - >-
    Activities 2–6 have several phases; each phase is now a step of the class
    activity, and the "useful expressions" lists are in the example or in a callout.
    Activities 5 and 6 are kept although the plan names only Activities 1–4 in the
    source's general information (the source does not say which activities go with
    which skill). The teacher note suggests a choice. Please confirm.
  - >-
    The gamma.app slide link is not on the link allow-list and was left out; see the
    teacher note. The Quizlet link is kept without "?new".
  - >-
    Written homework (Hebrew "שיעורי בית קלאסיים", parts 1–4) is kept in the homework
    section as answer boxes, before the Mori messages; the answer key of part 1 is in
    a teacher note. The five Mori parts are kept as five messages; the Hebrew
    instructions for the student are translated into Italian as the intro of each
    message.
  - >-
    Vocabulary: Hebrew glosses made consistent with the masculine / feminine form
    ("צפה" → "צפה/תה", "השווה" → "השווה/תה"); "Follower – עוקב" → "עוקב / עוקבים"
    (the word is used for one or many). Please confirm.
  - >-
    The source gives no activity times, so no minutes are recorded. The "Risposta dello
    studente" lines are replaced by the optional answer boxes (decision C2).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: social-media-passato-classe
    title: 'In classe: Social media al passato'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Social media al passato
      - id: skills
        type: cycleOverview
        skills:
          - name: Passato prossimo
            description: '*Ho usato, ho pubblicato, mi sono divertito*: raccontare esperienze finite'
          - name: Confronti
            description: '*più… di, meno… di, il più, il meno*: Instagram è stato più utile di Facebook.'
      - id: quizlet
        type: externalLink
        label: Social media (passato) su Quizlet
        url: https://quizlet.com/br/1183931917/social-media-passato-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Giro introduttivo
      - id: intro
        type: sentenceFrame
        frame: Sono ___. Ieri ho usato ___. L'ultima volta che ho usato i social ho pubblicato ___.
        example: Sono Marta. Ieri ho usato Instagram. L'ultima volta ho pubblicato delle foto delle mie vacanze.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di preparazione
      - id: warmup
        type: discussionQuestions
        items:
          - question: Quale social network hai usato di più negli ultimi giorni? Perché ti piace?
            frame: Negli ultimi giorni ho usato soprattutto ___ perché…
          - question: Qual è stata l'ultima cosa interessante che hai pubblicato sui social?
            frame: L'ultima cosa che ho pubblicato è stata…
          - question: Che tipo di musica hai ascoltato o che video hai guardato recentemente online?
            frame: Recentemente ho ascoltato / ho guardato…
          - question: Qual è stato il contenuto più interessante o più strano che hai visto questa settimana?
            frame: Questa settimana ho visto…
          - question: Quale app hai usato più spesso l'anno scorso? Perché?
            frame: Ho usato soprattutto ___ perché…
          - question: Hai mai avuto un problema o una situazione imbarazzante sui social media?
            frame: Sì, una volta… / No, ma…
          - question: Con chi hai parlato o condiviso più contenuti recentemente?
            frame: Ho parlato soprattutto con…
          - question: Quale video, meme o post ti ha fatto ridere di più ultimamente?
            frame: Ho visto ___ e mi ha fatto molto ridere perché…
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: La mia settimana sui social'
        skills: [Passato prossimo]
        steps:
          - 'Scrivi 4–5 frasi al passato prossimo sulla tua esperienza recente sui social: quale app hai usato, cosa hai guardato, cosa hai pubblicato, cosa ti è piaciuto di più e cosa non ti è piaciuto.'
          - Fai domande ai compagni e confronta le vostre esperienze.
          - Presenta alla classe una frase del tuo compagno.
        example: |-
          *Ieri ho usato TikTok per un'ora.*
          *Ho guardato molti video divertenti.*
          *Poi ho pubblicato una storia su Instagram.*
          *Mi sono piaciuti i commenti dei miei amici.*
          *Non mi è piaciuta la pubblicità.*
      - id: act1-sentences
        type: discussionQuestions
        title: La mia settimana sui social
        items:
          - question: Ho usato ___.
          - question: Ho guardato ___.
          - question: Ho pubblicato ___.
          - question: Mi è piaciuto / Mi è piaciuta / Mi sono piaciuti ___.
          - question: Non mi è piaciuto / Non mi è piaciuta ___.
      - id: act2
        type: classActivity
        title: 'Attività 2: Dibattito. I social media hanno migliorato o peggiorato la vita delle persone?'
        skills: [Confronti, Passato prossimo]
        steps:
          - 'La classe si divide in due gruppi. **Gruppo A:** i social media hanno avuto un effetto positivo sulla vita delle persone. **Gruppo B:** i social media hanno creato più problemi che vantaggi.'
          - 'Preparazione: ogni gruppo discute le idee, sceglie 3–4 argomentazioni, prepara esempi al passato (reali o inventati) e decide chi presenterà ogni idea. Spiegate cosa è successo, perché è stato positivo o negativo e quale social network è stato più o meno utile.'
          - "Dibattito: i gruppi presentano le argomentazioni. Dopo ogni frase il gruppo opposto risponde, fa una domanda o dà un'opinione diversa. Usate *più… di, meno… di, il più, il meno*."
          - 'Discussione finale: quale gruppo ha dato gli esempi più convincenti? Quale argomentazione è stata più interessante? Quale social network è stato il più positivo? E il più problematico?'
          - "Votazione: la classe vota il gruppo più convincente, l'argomentazione migliore e lo studente che ha parlato nel modo più chiaro e naturale."
        example: |-
          *Instagram è stato più utile di Facebook per comunicare con gli amici.*
          *TikTok è stato meno educativo di YouTube.*
          *Molte persone hanno imparato nuove cose grazie ai social media.*
          *Alcuni utenti hanno passato troppo tempo online.*
          *I social network hanno aiutato le persone a rimanere in contatto.*
          *Molti ragazzi hanno confrontato la loro vita con quella degli influencer.*
      - id: act2-useful
        type: callout
        tone: info
        title: Esempi utili per il dibattito
        text: |-
          *Instagram è stato più popolare di Facebook.*
          *YouTube è stato il social più utile per imparare.*
          *TikTok è stata l'app meno educativa.*
      - id: act3
        type: classActivity
        title: 'Attività 3: La mia cronologia digitale'
        skills: [Passato prossimo, Confronti]
        steps:
          - "Disegna una linea del tempo con 3–4 momenti importanti della tua vita digitale dell'ultimo anno: un nuovo account, il primo post, un video con molte visualizzazioni, commenti o messaggi importanti, nuove amicizie online, un'esperienza divertente o imbarazzante, un post molto popolare…"
          - Per ogni momento scrivi una frase al passato prossimo con un'espressione di tempo e qualche dettaglio personale.
          - A coppie, confrontate le vostre esperienze digitali con i confronti.
          - 'Presenta alla classe un momento importante. Gli altri fanno domande, confrontano esperienze simili e dicono quale esperienza è stata la più interessante o sorprendente.'
        example: |-
          *A gennaio ho aperto un account TikTok.*
          *A marzo ho pubblicato il mio primo video.*
          *In estate ho ricevuto molti like e commenti.*
          *A dicembre ho parlato con nuove persone online.*
      - id: act3-useful
        type: callout
        tone: info
        title: Esempi utili per il confronto a coppie
        text: |-
          *Il mio video è stato più popolare del tuo.*
          *Tu hai pubblicato più foto di me.*
          *Io ho ricevuto meno commenti di te.*
          *TikTok è stato più interessante di Instagram.*
          *La mia esperienza è stata più divertente.*
      - id: act3-timeline
        type: discussionQuestions
        title: La mia cronologia digitale
        items:
          - question: A ___ ho ___.
          - question: A ___ ho ___.
          - question: In ___ ho ___.
          - question: A ___ ho ___.
      - id: act4
        type: classActivity
        title: 'Attività 4: Intervista tra compagni'
        skills: [Passato prossimo, Confronti]
        steps:
          - 'Preparazione: scegli 4–5 domande qui sotto, ripassa il passato prossimo e prepara altre domande.'
          - "A coppie: uno studente fa le domande, l'altro risponde con frasi complete, dettagli personali, esperienze reali e confronti quando è possibile. Chi fa le domande può chiedere dettagli e fare domande spontanee."
          - Cambiate ruolo e fate una seconda intervista.
          - Presenta alla classe una cosa interessante che hai scoperto sul tuo compagno.
        example: |-
          *Davvero? E dopo cosa hai fatto?*
          *Perché ti è piaciuto? È stata un'esperienza divertente?*
          *Hai usato questa app più di Instagram?*
          *Lui ha usato TikTok più di Instagram.*
          *Lei ha pubblicato molte foto durante le vacanze.*
          *La sua esperienza più divertente è stata…*
      - id: act4-questions
        type: discussionQuestions
        title: Domande possibili
        items:
          - question: Quale social network hai usato di più l'anno scorso?
          - question: Qual è stato il tuo post più interessante?
          - question: Hai mai pubblicato un video divertente?
          - question: Quale app hai usato di meno ultimamente?
          - question: Con chi hai parlato di più online?
          - question: Quale esperienza strana hai avuto sui social?
          - question: Hai mai cancellato un post? Perché?
          - question: Quale social network è stato il più utile per te?
          - question: Hai mai ricevuto molti like o commenti?
          - question: Quale video hai guardato recentemente?
      - id: act5
        type: classActivity
        title: 'Attività 5: Storia vera o falsa?'
        skills: [Passato prossimo, Confronti]
        steps:
          - 'Scrivi due storie sulle tue esperienze sui social media, una **vera** e una **falsa**, al passato prossimo. Aggiungi dettagli personali ed espressioni di tempo: cerca di rendere difficile capire quale è falsa.'
          - Leggi le storie alla classe o a un piccolo gruppo. Gli altri fanno domande, cercano dettagli strani e indovinano quale storia è falsa.
          - Alla fine di' quale storia era vera e quale falsa.
          - La classe vota la storia più divertente, la bugia più credibile e la storia più sorprendente.
        example: |-
          *L'anno scorso ho pubblicato un video che ha avuto mille visualizzazioni.*
          *Due anni fa ho cancellato tutte le mie foto da Instagram.*
          *Una volta un influencer famoso ha risposto a un mio commento.*
          *Ho aperto un account TikTok e dopo una settimana ho ricevuto molti follower.*
      - id: act5-useful
        type: callout
        tone: info
        title: Espressioni utili
        text: |-
          *Secondo me questa storia è vera.*
          *Questa esperienza sembra più realistica.*
          *Questa storia sembra meno possibile.*
          *Penso che la seconda storia sia falsa perché…*
      - id: act6
        type: classActivity
        title: 'Attività 6: Diario digitale'
        skills: [Passato prossimo, Confronti]
        steps:
          - 'Scrivi un mini diario della tua giornata online di ieri: quali app hai usato, con chi hai parlato, cosa hai guardato o pubblicato, quale esperienza è stata interessante o noiosa. Usa almeno 4 verbi al passato prossimo, i connettori di tempo, i nomi dei social network e le tue opinioni.'
          - 'Leggi il diario a un compagno. Fate domande, confrontate le vostre giornate digitali e dite quale attività è stata più interessante.'
          - 'Discussione finale: quale app è stata usata di più? Quale social network è stato il più utile? Quale attività online è stata la più divertente?'
        example: |-
          *Ieri ho parlato con mia madre su WhatsApp.*
          *Poi ho guardato alcuni video su TikTok.*
          *Dopo ho condiviso una foto su Instagram.*
          *La sera ho ascoltato musica su Spotify e ho parlato con i miei amici.*
        wordBank: [ieri, poi, dopo, più tardi, la sera, infine]
      - id: act6-useful
        type: callout
        tone: info
        title: Esempi utili per il confronto
        text: |-
          *Hai usato più app di me.*
          *Io ho passato meno tempo online.*
          *La tua giornata è stata più interessante della mia.*
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Passato prossimo** e **Confronti** (più… di, meno…
          di, il più, il meno). Il quaderno ha sei attività: scegline due o tre (per
          esempio Attività 1 per il passato prossimo e Attività 2 o 3 per i confronti).
          La presentazione del quaderno è su gamma.app, che non è nella piattaforma: se
          la usi, condividila tu sullo schermo.
      - id: n-intro
        anchor: intro
        text: Fai prima il tuo esempio e poi chiedi a ogni studente.
      - id: n-warmup
        anchor: warmup
        text: Fai almeno due domande a ogni studente. Le risposte scritte qui compaiono sotto ogni domanda.
      - id: n-act2
        anchor: act2
        text: Durante il dibattito incoraggia l'uso di *più… di, meno… di, il più, il meno*.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: social-media-passato-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: rules-passato
        type: ruleSummary
        skill: Passato prossimo
        rules:
          - text: 'Usiamo il **passato prossimo** per esperienze e azioni finite nel passato.'
            examples: [Ho usato Instagram., Ho pubblicato una foto., Ho guardato un video.]
          - text: 'Come si forma: **avere** o **essere** al presente + **participio passato**. I participi regolari finiscono in **-ato** (-are), **-uto** (-ere), **-ito** (-ire).'
            examples: ['usare → usato', 'ricevere → ricevuto', 'seguire → seguito']
          - text: 'Alcuni participi sono irregolari.'
            examples:
              [
                'aprire → aperto',
                'condividere → condiviso',
                'fare → fatto',
                'vedere → visto',
                'essere → stato',
              ]
          - text: 'Usiamo **essere** con i verbi di movimento o di cambiamento (*andare, entrare, uscire*) e con i verbi riflessivi. Con *essere* il participio si accorda con il soggetto (-o, -a, -i, -e).'
            examples:
              [
                Marco è entrato nel gruppo.,
                Marta è entrata nel gruppo.,
                Mi sono divertito molto. / Mi sono divertita molto.,
              ]
          - text: 'Con **piacere** il participio si accorda con la cosa che piace.'
            examples:
              [
                Mi è piaciuto il video.,
                Non mi è piaciuta la pubblicità.,
                Mi sono piaciuti i commenti.,
              ]
      - id: passato-table
        type: table
        caption: Il passato prossimo
        header: [Pronome, usare (avere), entrare (essere), divertirsi (essere)]
        rows:
          - [io, ho usato, sono entrato / entrata, mi sono divertito / divertita]
          - [tu, hai usato, sei entrato / entrata, ti sei divertito / divertita]
          - [lui / lei, ha usato, è entrato / entrata, si è divertito / divertita]
          - [noi, abbiamo usato, siamo entrati / entrate, ci siamo divertiti / divertite]
          - [voi, avete usato, siete entrati / entrate, vi siete divertiti / divertite]
          - [loro, hanno usato, sono entrati / entrate, si sono divertiti / divertite]
      - id: time-table
        type: table
        caption: Parole di tempo
        header: [Italiano, Ebraico]
        rows:
          - [ieri, אתמול]
          - [poi, אחר כך]
          - [dopo, אחרי]
          - [la settimana scorsa, בשבוע שעבר]
          - [recentemente, לאחרונה]
          - [infine, לבסוף]
      - id: time-example
        type: text
        text: '*Ieri ho usato WhatsApp, poi ho guardato TikTok.*'
      - id: rules-confronti
        type: ruleSummary
        skill: Confronti
        rules:
          - text: '**più… di** (יותר מ־) e **meno… di** (פחות מ־) confrontano due cose o persone.'
            examples:
              [
                Instagram è stato più interessante di Facebook.,
                TikTok è stato meno utile di YouTube.,
              ]
          - text: "*Di* si unisce all'articolo (*del, della, dei…*). Con i pronomi diciamo *di me, di te*."
            examples:
              [
                Il mio video è stato più popolare del tuo.,
                La tua giornata è stata più interessante della mia.,
                Tu hai pubblicato più foto di me.,
              ]
          - text: '**il più** (הכי) e **il meno** (הכי פחות): articolo + nome + *più / meno* + aggettivo.'
            examples:
              [
                YouTube è stato il social più utile per imparare.,
                TikTok è stata l'app meno educativa.,
              ]
          - text: '**di più / di meno** dopo un verbo: quanto abbiamo fatto una cosa.'
            examples: [Quale app hai usato di più?, Con chi hai parlato di più online?]
      - id: questions
        type: ruleSummary
        skill: Domande al passato
        rules:
          - text: Domande importanti al passato prossimo.
            examples:
              [
                Quale social network hai usato ieri?,
                Cosa hai pubblicato?,
                Quale video hai guardato?,
                Con chi hai parlato?,
              ]
      - id: expressions-table
        type: table
        caption: Espressioni utili
        header: [Italiano, Ebraico]
        rows:
          - [Mi è piaciuto, אהבתי]
          - [Non mi è piaciuto, לא אהבתי]
          - [Mi ha fatto ridere, זה הצחיק אותי]
          - [È stato interessante, זה היה מעניין]
      - id: important
        type: callout
        tone: info
        title: La cosa più importante
        text: |-
          Con il **passato prossimo** possiamo parlare delle nostre esperienze sui social, raccontare cosa abbiamo fatto e descrivere azioni finite.
          Con i **confronti** possiamo paragonare app ed esperienze diverse.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le due abilità con la classe e chiedi un esempio nuovo per ogni regola.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: social-media-passato-compiti
    title: Compiti
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti
      - id: part1-title
        type: heading
        level: 3
        text: 'Parte 1: Completa con il passato prossimo'
      - id: part1
        type: discussionQuestions
        items:
          - question: Ieri io ___ Instagram. (usare)
          - question: La settimana scorsa noi ___ molti video. (guardare)
          - question: Lui ___ una foto su Facebook. (pubblicare)
          - question: Tu ___ musica su Spotify. (ascoltare)
          - question: Loro ___ molti commenti. (ricevere)
      - id: part2-title
        type: heading
        level: 3
        text: 'Parte 2: Rispondi con frasi complete'
      - id: part2
        type: discussionQuestions
        items:
          - question: Quale social network hai usato ieri?
          - question: Cosa hai pubblicato recentemente?
          - question: Quale video hai guardato la settimana scorsa?
          - question: Quale app hai usato di più?
          - question: Hai avuto un'esperienza divertente online?
      - id: part3-title
        type: heading
        level: 3
        text: "Parte 3: Traduci dall'ebraico all'italiano"
      - id: part3
        type: discussionQuestions
        items:
          - question: אתמול השתמשתי בטיקטוק.
          - question: פרסמתי תמונה באינסטגרם.
          - question: צפיתי בהרבה סרטונים ביוטיוב.
          - question: דיברתי עם חברים בוואטסאפ.
          - question: טיקטוק היה יותר מעניין מפייסבוק.
      - id: part4-title
        type: heading
        level: 3
        text: 'Parte 4: Scrittura'
      - id: part4
        type: reflection
        prompt: >-
          Scrivi un paragrafo di 6–8 frasi: **«La mia giornata sui social media»**. Usa il
          passato prossimo, le parole di tempo, i nomi delle app e almeno un confronto.
      - id: mori-title
        type: heading
        level: 3
        text: Compiti con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia un messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Parte 1: Domande sul passato'
        message: |-
          Ciao Mori! Fammi domande sulle mie attività sui social media usando il passato prossimo. Correggi i miei errori. Per esempio:
          Quale social network hai usato ieri?
          Cosa hai pubblicato?
          Quale musica hai ascoltato?
          Con chi hai parlato?
          Quale app hai usato di più?
      - id: mori-2
        type: aiTutorPrompt
        title: 'Parte 2: Confronti'
        intro: Confronta le app, spiega perché un'app è migliore e usa frasi complete.
        message: Ciao Mori! Fammi confrontare diversi social network usando più, meno, il più e il meno. Correggi i miei errori.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Parte 3: Intervista personale'
        message: >-
          Ciao Mori! Intervistami sulle mie esperienze sui social media. Fai domande al
          passato, chiedi dettagli, fai confronti e reagisci in modo naturale. Correggi i
          miei errori.
      - id: mori-4
        type: aiTutorPrompt
        title: 'Parte 4: Storia vera o falsa'
        intro: Usa il passato prossimo, aggiungi dettagli e usa le parole di tempo.
        message: Ciao Mori! Chiedimi di raccontare due storie sui social media, una vera e una falsa. Prova a indovinare quale è falsa e correggi i miei errori.
      - id: mori-5
        type: aiTutorPrompt
        title: 'Parte 5: Parlare liberamente'
        intro: 'Parla di app, video, musica, messaggi, post ed esperienze divertenti o interessanti.'
        message: Ciao Mori! Fammi parlare per un minuto della mia esperienza sui social media di ieri. Correggimi solo quando è necessario.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**
    teacherNotes:
      - id: n-part1
        anchor: part1
        text: 'Soluzioni: 1. ho usato; 2. abbiamo guardato; 3. ha pubblicato; 4. hai ascoltato; 5. hanno ricevuto.'

