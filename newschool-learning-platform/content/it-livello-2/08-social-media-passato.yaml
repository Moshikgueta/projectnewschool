vocabulary:
  - slug: social-media-passato
    title: Social media al passato
    items: *social-media-passato-words

activities:
  - slug: social-media-passato-passato
    title: 'Passato prossimo: ho usato, ho pubblicato, mi sono divertito'
    minutes: 8
    items:
      - id: ho-usato
        type: multipleChoice
        prompt: Ieri io ___ Instagram.
        options:
          - { text: ho usato, correct: true }
          - {
              text: sono usato,
              feedback: '*Usare* forma il passato prossimo con *avere*: *ho usato*.',
            }
          - {
              text: uso,
              feedback: '*Uso* è presente. Con *ieri* usiamo il passato prossimo: *ho usato*.',
            }
      - id: abbiamo-guardato
        type: fillBlank
        prompt: Completa con il passato prossimo di *guardare*.
        text: La settimana scorsa noi ___ molti video.
        blanks: [[abbiamo guardato]]
      - id: participi
        type: matching
        prompt: Unisci ogni verbo al suo participio passato.
        pairs:
          - [aprire, aperto]
          - [condividere, condiviso]
          - [ricevere, ricevuto]
          - [fare, fatto]
          - [vedere, visto]
      - id: e-entrata
        type: multipleChoice
        prompt: Ieri Marta ___ in un nuovo gruppo online.
        options:
          - { text: è entrata, correct: true }
          - {
              text: è entrato,
              feedback: 'Con *essere* il participio si accorda con il soggetto: Marta è femminile, quindi *è entrata*.',
            }
          - {
              text: ha entrato,
              feedback: '*Entrare* è un verbo di movimento: usa *essere*, *è entrata*.',
            }
      - id: divertito-avere
        type: trueFalse
        prompt: "*Mi sono divertito* usa l'ausiliare *avere*."
        answer: false
        feedback:
          correct: 'Giusto! I verbi riflessivi usano *essere*: *mi **sono** divertito*.'
          incorrect: 'I verbi riflessivi usano *essere*: *mi **sono** divertito*, *ti sei divertito*.'
      - id: piaciuta
        type: fillBlank
        prompt: Completa con *piaciuto*, *piaciuta* o *piaciuti*.
        text: Non mi è ___ la pubblicità. Mi sono ___ i commenti dei miei amici.
        blanks: [[piaciuta], [piaciuti]]
        wordBank: [piaciuto, piaciuta, piaciuti]
      - id: ha-pubblicato
        type: multipleChoice
        prompt: Lui ___ una foto su Facebook.
        options:
          - { text: ha pubblicato, correct: true }
          - { text: ho pubblicato, feedback: '*Ho* è per *io*. Per *lui* usiamo *ha pubblicato*.' }
          - {
              text: hanno pubblicato,
              feedback: '*Hanno* è per *loro*. Per *lui* usiamo *ha pubblicato*.',
            }
      - id: ordina-storia
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Ieri ho pubblicato una storia su Instagram.

  - slug: social-media-passato-confronti
    title: 'Confronti: più… di, meno… di, il più, il meno'
    minutes: 8
    items:
      - id: piu-di
        type: multipleChoice
        prompt: Instagram è stato più utile ___ Facebook.
        options:
          - { text: di, correct: true }
          - {
              text: che,
              feedback: 'Per confrontare due cose usiamo *più… di*: *più utile di Facebook*.',
            }
          - { text: del, feedback: '*Facebook* è un nome senza articolo, quindi usiamo solo *di*.' }
      - id: del-tuo
        type: fillBlank
        prompt: Completa con *di* + articolo.
        text: Il mio video è stato più popolare ___ tuo.
        blanks: [[del]]
        wordBank: [di, del, della]
      - id: unisci-confronti
        type: matching
        prompt: Unisci le due parti di ogni frase.
        pairs:
          - [Tu hai pubblicato più foto, di me.]
          - [Io ho ricevuto meno commenti, di te.]
          - [Il mio video è stato più popolare, del tuo.]
          - [La tua giornata è stata più interessante, della mia.]
      - id: il-piu
        type: multipleChoice
        prompt: YouTube è stato ___ social più utile per imparare.
        options:
          - { text: il, correct: true }
          - {
              text: un,
              feedback: "Per dire *il più* usiamo l'articolo determinativo: *il social più utile*.",
            }
          - { text: di, feedback: "Per dire *il più* usiamo l'articolo: *il social più utile*." }
      - id: meno-utile
        type: trueFalse
        prompt: '*TikTok è stato meno utile di YouTube* significa che YouTube è stato più utile.'
        answer: true
        feedback:
          correct: Giusto! *Meno utile di YouTube* = YouTube è più utile.
          incorrect: 'Se TikTok è *meno utile di* YouTube, allora YouTube è *più utile*.'
      - id: piu-meno
        type: fillBlank
        prompt: 'TikTok: 3 ore. Instagram: 1 ora. Completa con *più* o *meno*.'
        text: Ho usato TikTok ___ di Instagram. Ho usato Instagram ___ di TikTok.
        blanks: [[più], [meno]]
        wordBank: [più, meno]
      - id: frase-giusta
        type: multipleChoice
        prompt: Quale frase è giusta?
        options:
          - { text: TikTok è stata l'app meno educativa., correct: true }
          - {
              text: TikTok è stata l'app più meno educativa.,
              feedback: "Usiamo *più* oppure *meno*, non tutti e due: *l'app meno educativa*.",
            }
          - {
              text: TikTok è stata meno educativa che YouTube.,
              feedback: 'Prima di un nome usiamo *di*: *meno educativa di YouTube*.',
            }
      - id: ordina-instagram
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Instagram è stato più utile di Facebook.
