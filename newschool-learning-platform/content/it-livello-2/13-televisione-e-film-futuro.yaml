# Cycle "Televisione e film: parlare del futuro", converted from the Italian level 2
# digital notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-2
slug: televisione-e-film-futuro
title: 'Televisione e film: il futuro'
goal: Parlare dei propri programmi su film e serie con il futuro semplice e fare previsioni sulla trama.
position: 13
status: published

review:
  - >-
    The two workbook exercises ("Futuro semplice: i miei programmi" and "Previsioni su
    film e serie") are NEW: the notebook has no self-study exercises. They were written
    from the cycle's summary, the activity models and the vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    Skills: the source lists six "abilità da praticare" (programmi futuri, futuro
    semplice, previsioni, serata cinema, inventare un film, domande e risposte). They
    were grouped into the platform's two skills: "Futuro semplice: i miei programmi"
    (warm-up, Activities 1 and 2) and "Previsioni su film e serie" (Activities 3, 4 and
    5). The source gives no lesson plan or timings; the plan note suggests a
    combination. Please confirm.
  - >-
    Summary: the grammar summary in the source is written in Hebrew. It is now in
    Italian (rules + examples), and the Hebrew translations of the example sentences,
    time expressions and useful phrases are kept as glosses. The source gives only the
    io / tu / lui forms: a full table of the regular future (guarderò… guarderanno) and
    two rules were ADDED, because the activities use forms the summary does not explain
    (noi / loro: guarderemo, porteranno; -are → -er-: guardare → guarderò; mangiare →
    mangerò, iniziare → inizierò without the i; bere → berrò, irregular). Please confirm.
  - >-
    The lesson presentation link (gamma.app) is not allowed on the platform and was
    left out; see the teacher note. Activity 3 suggests the official trailer of "Coco"
    but gives no link: the teacher finds it on YouTube (teacher note).
  - >-
    Small fixes: the introduction frame "Penso che sarà ___" is kept (spoken Italian
    accepts the future after "penso che"); the warm-up numbering (restarted three
    times in the source) is one list; Activity 3 guide questions were renumbered (the
    source had "1." twice); the empty "Data / Partecipanti" lines were removed.
  - >-
    Homework: the "Compiti classici" (Parti 1–4) are kept as answer boxes, followed by
    the five Mori messages. Mori Parte 4 ("correggi i miei errori") had no sentences to
    correct: an intro asking the student to write 5 sentences first was added.
  - >-
    Vocabulary: taken from the Quizlet list in the source. "L'ambientazione – הרקע,
    המקום והתקופה שבהם הסיפור מתרחש" was shortened to "הרקע (המקום והזמן של הסיפור)".
    Please confirm.
  - >-
    The Quizlet link is kept without its "?new" parameter. The "Risposta studente
    1/2/3" lines are replaced by the optional answer boxes (decision C2).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: televisione-e-film-futuro-classe
    title: 'In classe: Televisione e film (futuro)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Televisione e film: parlare del futuro'
      - id: skills
        type: cycleOverview
        skills:
          - name: 'Futuro semplice: i miei programmi'
            description: '*Questa settimana guarderò un film. Andrò al cinema con i miei amici.*'
          - name: Previsioni su film e serie
            description: '*Il protagonista scoprirà la verità. Secondo me, il film sarà emozionante.*'
      - id: quizlet
        type: externalLink
        label: 'Televisione e film: futuro su Quizlet'
        url: https://quizlet.com/br/1189999908/televisione-e-film-futuro-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Giro di presentazioni
      - id: intro
        type: sentenceFrame
        frame: Io sono ___. Questa settimana guarderò ___. Penso che sarà un film / una serie ___.
        example: Io sono Dana. Questa settimana guarderò Inside Out 2. Penso che sarà un film divertente.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup
        type: discussionQuestions
        items:
          - question: Quale film guarderai questa settimana?
            frame: Questa settimana guarderò ___.
          - question: Quale serie inizierai prossimamente?
            frame: Prossimamente inizierò una nuova serie su ___.
          - question: Andrai al cinema il prossimo fine settimana? Che film vedrai?
            frame: Sì, andrò al cinema e vedrò ___. / No, non andrò al cinema.
          - question: Con chi guarderai il tuo prossimo film o la tua prossima serie?
            frame: Lo guarderò con ___. / La guarderò con ___.
          - question: Dove guarderai il tuo prossimo film?
            frame: Lo guarderò a casa, sul divano. / Lo guarderò al cinema.
          - question: Quali snack mangerai durante la tua prossima serata cinema?
            frame: Mangerò ___ e ___.
          - question: Guarderai un film in un'altra lingua in futuro?
            frame: Sì, guarderò un film in italiano con i sottotitoli.
          - question: Quale genere cinematografico sceglierai la prossima volta?
            frame: Sceglierò una commedia / un film d'azione perché ___.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: La mia prossima serata cinema'
        skills: ['Futuro semplice: i miei programmi']
        steps:
          - Immagina una serata cinema che organizzerai nei prossimi giorni.
          - Completa le frasi qui sotto con il futuro semplice.
          - Leggi 2 frasi al gruppo. I compagni ti fanno le domande del gruppo.
        example: |-
          *La prossima serata cinema sarà sabato sera.*
          *Guarderò Coco.*
          *Lo guarderò con la mia famiglia.*
          *Mangerò popcorn e pizza.*
          *Berremo bibite.*
          *Dopo il film parleremo della storia.*
      - id: act1-sentences
        type: discussionQuestions
        title: La mia serata cinema
        items:
          - question: La prossima serata cinema sarà ___.
          - question: Guarderò ___.
          - question: Lo guarderò con ___.
          - question: Mangerò ___.
          - question: Berremo ___.
          - question: Dopo il film ___.
      - id: act1-questions
        type: discussionQuestions
        title: Domande per il gruppo
        answerable: false
        items:
          - question: Anche tu guarderai questo film?
          - question: Preferirai guardarlo a casa o al cinema?
          - question: Che cosa mangerai durante il film?
      - id: act2
        type: classActivity
        title: 'Attività 2: Organizziamo una serata cinema in gruppo'
        skills: ['Futuro semplice: i miei programmi']
        steps:
          - '**Fase 1:** in piccoli gruppi, decidete: quale film guarderete? Dove lo guarderete? Quando sarà la serata? Chi inviterete? Che cosa mangerete e berrete? Che cosa farete dopo il film? Che cosa porteranno gli ospiti?'
          - '**Fase 2:** ogni gruppo scrive un breve testo al futuro (con *noi*: guarderemo, inviteremo…).'
          - '**Fase 3:** ogni gruppo presenta la propria serata cinema. Gli altri fanno domande: *Perché avete scelto questo film? Chi parteciperà? La serata sarà divertente? Perché?*'
        example: |-
          *Venerdì sera guarderemo Harry Potter a casa di Daniel.*
          *Inviteremo tre amici.*
          *Mangeremo pizza e popcorn.*
          *Berremo bibite.*
          *Dopo il film parleremo della storia.*
          *Gli ospiti porteranno dolci e cuscini.*
      - id: act2-text
        type: discussionQuestions
        title: La nostra serata cinema
        items:
          - question: Venerdì / Sabato sera guarderemo ___ a casa di ___.
          - question: Inviteremo ___.
          - question: Mangeremo ___ e berremo ___.
          - question: Dopo il film ___.
          - question: Gli ospiti porteranno ___.
      - id: act3
        type: classActivity
        title: 'Attività 3: Guardiamo un trailer e facciamo previsioni'
        skills: [Previsioni su film e serie]
        steps:
          - "**Fase 1:** l'insegnante presenta il trailer. *Ti piace guardare i trailer prima di scegliere un film? Perché?*"
          - '**Fase 2:** guarda il trailer una prima volta, senza fermare il video, e scrivi due cose che hai capito.'
          - '**Fase 3:** guarda il trailer una seconda volta. Concentrati sui personaggi e sulla storia.'
          - '**Fase 4:** in coppia, rispondi alle domande guida con frasi complete al futuro.'
          - '**Fase 5:** la classe costruisce insieme una breve previsione sulla storia.'
          - "**Fase 6:** di' la tua opinione sul trailer."
        example: |-
          *Ho capito che il protagonista ama la musica. Ho capito che ci sarà un viaggio speciale.*
          *Miguel sarà il protagonista. Viaggerà in un mondo speciale. Incontrerà nuovi personaggi. Scoprirà un segreto di famiglia. Alla fine capirà l'importanza della musica e della famiglia. Il film sarà emozionante e colorato.*
      - id: act3-understood
        type: discussionQuestions
        title: Due cose che ho capito
        items:
          - question: Ho capito che ___.
          - question: Ho capito che ___.
      - id: act3-guide
        type: discussionQuestions
        title: Domande guida
        items:
          - question: Chi sarà il protagonista?
            frame: Il protagonista sarà ___.
          - question: Dove andrà il protagonista?
            frame: Andrà ___.
          - question: Che cosa farà?
            frame: Farà ___.
          - question: Chi incontrerà?
            frame: Incontrerà ___.
          - question: Che cosa scoprirà?
            frame: Scoprirà ___.
          - question: Come finirà la storia, secondo te?
            frame: Alla fine ___. Secondo me, il film sarà ___.
      - id: act3-opinion
        type: discussionQuestions
        title: Opinione finale
        items:
          - question: Ti è piaciuto il trailer? Perché?
            frame: Sì, mi è piaciuto perché era colorato ed emozionante.
          - question: Secondo te, il film sarà triste o divertente?
            frame: Secondo me, il film sarà ___.
          - question: Vorresti guardare questo film? Lo guarderai in italiano?
            frame: Vorrei guardarlo in italiano con i sottotitoli.
      - id: act4
        type: classActivity
        title: 'Attività 4: Inventiamo un nuovo film'
        skills: [Previsioni su film e serie, 'Futuro semplice: i miei programmi']
        steps:
          - '**Fase 1:** in piccoli gruppi, immaginate un nuovo film che uscirà la prossima settimana. Decidete: titolo, genere, luogo, protagonisti, storia, finale, e perché il pubblico lo amerà.'
          - '**Fase 2:** scrivete 6–8 frasi con il futuro semplice.'
          - '**Fase 3:** ogni gruppo presenta il proprio film alla classe.'
        example: |-
          *Il film si intitolerà La città segreta.*
          *Sarà un film d'avventura.*
          *La storia si svolgerà in una città misteriosa.*
          *I protagonisti saranno due fratelli.*
          *Un giorno troveranno una porta segreta.*
          *Entreranno in un mondo nuovo.*
          *Alla fine scopriranno la verità sulla loro famiglia.*
          *Il pubblico amerà questo film perché sarà emozionante.*
      - id: act4-film
        type: discussionQuestions
        title: Il nostro film
        items:
          - question: Il film si intitolerà ___.
          - question: Sarà un film di ___.
          - question: La storia si svolgerà ___.
          - question: I protagonisti saranno ___.
          - question: Nella storia ___.
          - question: Alla fine ___.
          - question: Il pubblico amerà questo film perché ___.
      - id: act4-questions
        type: discussionQuestions
        title: Domande per il gruppo
        answerable: false
        items:
          - question: Guarderai questo film?
          - question: Secondo te, avrà successo?
          - question: Quale personaggio sarà più interessante?
          - question: Il finale sarà felice o triste?
      - id: act5
        type: classActivity
        title: 'Attività 5: Riscrivi il finale'
        skills: [Previsioni su film e serie]
        steps:
          - '**Fase 1:** in coppia, scegliete un film famoso (*Titanic, Coco, Harry Potter, Frozen, Shrek, Toy Story*).'
          - '**Fase 2:** scrivete 2–3 frasi sul finale originale (al presente).'
          - '**Fase 3:** scrivete un nuovo finale con il futuro semplice.'
          - '**Fase 4:** presentate il vostro finale alternativo alla classe.'
        example: |-
          *Nel finale originale di Titanic, la nave affonda e Jack muore. Rose sopravvive e ricorda la sua storia.*
          *Nel nostro finale alternativo, Jack sopravvivrà. Lui e Rose arriveranno in America. Vivranno insieme e inizieranno una nuova vita. Rose racconterà la loro storia molti anni dopo.*
      - id: act5-ending
        type: discussionQuestions
        title: Il nostro finale
        items:
          - question: Nel finale originale di ___, ___.
          - question: Nel nostro finale alternativo, ___.
      - id: act5-questions
        type: discussionQuestions
        title: Domande per il gruppo
        answerable: false
        items:
          - question: Perché avete cambiato il finale?
          - question: Il nuovo finale sarà più felice?
          - question: Che cosa farà il protagonista dopo?
          - question: Secondo te, il pubblico preferirà questo finale?
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Futuro semplice: i miei programmi** (domande di
          riscaldamento, Attività 1 e 2) e **Previsioni su film e serie** (Attività 3, 4 e
          5). Il quaderno non indica una combinazione: per esempio, Attività 1 o 2 + una
          tra le Attività 3, 4 e 5. La presentazione della lezione (Gamma) non è sulla
          piattaforma.
      - id: n-intro
        anchor: intro
        text: Fai prima il tuo esempio e poi chiedi a ogni studente.
      - id: n-warmup
        anchor: warmup
        text: Fai almeno due domande a ogni studente. Le risposte scritte qui compaiono sotto ogni domanda.
      - id: n-act1
        anchor: act1
        text: Ogni studente legge 2 frasi al gruppo; poi gli altri fanno le tre domande per il gruppo.
      - id: n-act3
        anchor: act3
        text: >-
          Materiale: il trailer ufficiale di *Coco* in italiano o con i sottotitoli in
          italiano (cercalo su YouTube prima della lezione; il quaderno non dà il link).
          Frase per iniziare: «Oggi guarderemo un trailer e proveremo a immaginare che cosa
          succederà nella storia.» Nella Fase 5 scrivi la previsione della classe alla
          lavagna.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: televisione-e-film-futuro-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: rules-futuro
        type: ruleSummary
        skill: 'Futuro semplice: i miei programmi'
        rules:
          - text: 'Usiamo il **futuro semplice** per parlare di programmi, intenzioni e decisioni: quello che faremo.'
            examples:
              [Questa settimana guarderò un film., Andrò al cinema., Sceglierò una commedia.]
          - text: "Futuro dei verbi regolari: togliamo la *-e* finale dell'infinito e aggiungiamo **-ò, -ai, -à, -emo, -ete, -anno**. Nei verbi in **-are**, la *a* diventa **e**."
            examples: ['guardare → guarderò', 'scegliere → sceglierò', 'scoprire → scoprirò']
          - text: 'I verbi in **-iare** perdono la *i*: *mangiare → mangerò*, *iniziare → inizierò*.'
          - text: 'Alcuni verbi importanti sono irregolari.'
            examples:
              ['essere → sarò', 'avere → avrò', 'andare → andrò', 'vedere → vedrò', 'bere → berrò']
      - id: futuro-table
        type: table
        caption: Il futuro semplice
        header: [Persona, guardare, vedere, essere, avere]
        rows:
          - [io, guarderò, vedrò, sarò, avrò]
          - [tu, guarderai, vedrai, sarai, avrai]
          - [lui / lei, guarderà, vedrà, sarà, avrà]
          - [noi, guarderemo, vedremo, saremo, avremo]
          - [voi, guarderete, vedrete, sarete, avrete]
          - [loro, guarderanno, vedranno, saranno, avranno]
      - id: rules-previsioni
        type: ruleSummary
        skill: Previsioni su film e serie
        rules:
          - text: 'Usiamo il futuro semplice anche per le **previsioni**: quello che, secondo noi, succederà nella storia.'
            examples:
              [
                Il protagonista scoprirà la verità.,
                Il film avrà successo.,
                Alla fine capirà l'importanza della famiglia.,
              ]
          - text: 'Per dare la nostra opinione usiamo *secondo me* + futuro.'
            examples: [Secondo me sarà interessante., Secondo me il finale sarà felice.]
          - text: 'Per un finale alternativo: il finale originale al presente, il nostro finale al futuro.'
            examples: ['Nel finale originale Jack muore. → Nel nostro finale, Jack sopravvivrà.']
      - id: examples-title
        type: heading
        level: 3
        text: Espressioni e frasi utili
      - id: time-expressions
        type: examples
        items:
          - { text: questa settimana, gloss: השבוע }
          - { text: domani, gloss: מחר }
          - { text: stasera, gloss: הערב }
          - { text: il prossimo fine settimana, gloss: בסוף השבוע הבא }
          - { text: il mese prossimo, gloss: בחודש הבא }
          - { text: in futuro, gloss: בעתיד }
          - { text: alla fine, gloss: בסוף }
          - { text: secondo me, gloss: לדעתי }
      - id: phrases
        type: examples
        items:
          - { text: Questa settimana guarderò…, gloss: השבוע אצפה ב… }
          - { text: Andrò al cinema con…, gloss: אלך לקולנוע עם… }
          - { text: Sceglierò un film di…, gloss: אבחר סרט מסוג… }
          - { text: Il film parlerà di…, gloss: הסרט ידבר על… }
          - { text: Il protagonista scoprirà…, gloss: הדמות הראשית תגלה… }
          - { text: Alla fine succederà…, gloss: בסוף יקרה… }
          - { text: Secondo me sarà interessante., gloss: לדעתי זה יהיה מעניין. }
          - { text: Mi piacerà perché…, gloss: זה ימצא חן בעיניי כי… }
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le due abilità con la classe e chiedi un esempio nuovo per ogni regola.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: televisione-e-film-futuro-compiti
    title: Compiti
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti
      - id: part1-title
        type: heading
        level: 3
        text: 'Parte 1: Futuro semplice'
      - id: part1
        type: discussionQuestions
        title: Completa le frasi con informazioni personali.
        items:
          - question: Questa settimana guarderò ___.
          - question: Lo guarderò con ___.
          - question: Andrò al cinema con ___.
          - question: Sceglierò un film di ___.
          - question: Mangerò ___ durante il film.
          - question: Dopo il film ___.
      - id: part1-example
        type: callout
        tone: info
        title: Modello
        text: "*Questa settimana guarderò Coco. Lo guarderò con la mia famiglia. Sceglierò un film d'animazione. Mangerò popcorn durante il film. Dopo il film parlerò della storia.*"
      - id: part2-title
        type: heading
        level: 3
        text: 'Parte 2: La mia serata cinema'
      - id: part2
        type: reflection
        prompt: >-
          Scrivi 6–8 frasi sulla tua prossima serata cinema. Rispondi alle domande: Che
          film guarderai? Dove lo guarderai? Con chi lo guarderai? Che cosa mangerai? Che
          cosa berrai? Che cosa farai dopo il film?
      - id: part2-example
        type: callout
        tone: info
        title: Modello
        text: '*Sabato sera organizzerò una serata cinema. Guarderò Harry Potter con i miei amici. Lo guarderemo a casa mia. Mangeremo pizza e popcorn. Berremo bibite. Dopo il film parleremo dei personaggi.*'
      - id: part3-title
        type: heading
        level: 3
        text: 'Parte 3: Previsioni su un film'
      - id: part3
        type: discussionQuestions
        title: Scegli un trailer o un film che non hai ancora visto. Completa le frasi con il futuro semplice.
        items:
          - question: Il protagonista sarà ___.
          - question: La storia si svolgerà ___.
          - question: All'inizio ___.
          - question: Poi il protagonista ___.
          - question: Alla fine ___.
          - question: Secondo me, il film sarà ___.
      - id: part4-title
        type: heading
        level: 3
        text: 'Parte 4: Il mio nuovo film'
      - id: part4
        type: reflection
        prompt: >-
          Inventa un film nuovo e scrivi 6–8 frasi con il futuro semplice. Includi:
          titolo, genere, protagonisti, luogo, trama e finale. Puoi iniziare così: *Il film
          si intitolerà ___. Sarà un film di ___. I protagonisti saranno ___. La storia si
          svolgerà ___. Alla fine ___.*
      - id: mori-title
        type: heading
        level: 3
        text: Compiti con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia un messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Parte 1: Futuro semplice'
        message: Mori, fammi 8 domande sui film e sulle serie che guarderò in futuro. Aiutami a rispondere usando il futuro semplice.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Parte 2: Serata cinema'
        message: Mori, aiutami a organizzare una serata cinema in italiano. Fammi domande su film, luogo, persone, cibo e attività dopo il film.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Parte 3: Previsioni'
        message: Mori, mostrami il titolo di un film immaginario e fammi fare previsioni sulla storia usando il futuro semplice.
      - id: mori-4
        type: aiTutorPrompt
        title: 'Parte 4: Correzione'
        intro: Scrivi 5 frasi al futuro semplice dopo il messaggio, poi invialo.
        message: |-
          Mori, correggi i miei errori nel futuro semplice. Spiegami brevemente la correzione in modo semplice. Ecco le mie frasi:
          ___
      - id: mori-5
        type: aiTutorPrompt
        title: 'Parte 5: Creatività'
        message: Mori, aiutami a inventare un nuovo film. Fammi domande una alla volta su titolo, genere, personaggi, trama e finale.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**

