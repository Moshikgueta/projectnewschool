vocabulary:
  - slug: televisione-e-film-futuro
    title: 'Televisione e film: futuro'
    items: *televisione-e-film-futuro-words

activities:
  - slug: televisione-e-film-futuro-programmi
    title: 'Futuro semplice: guarderò, andrò, mangeremo'
    minutes: 8
    items:
      - id: guardero
        type: multipleChoice
        prompt: Questa settimana io ___ un film con i miei amici.
        options:
          - { text: guarderò, correct: true }
          - {
              text: guarderà,
              feedback: '*Guarderà* è per *lui / lei*. Per *io* diciamo *guarderò*.',
            }
          - {
              text: guardarò,
              feedback: 'Nei verbi in *-are*, la *a* diventa *e*: *guardare → guarderò*.',
            }
      - id: andro
        type: fillBlank
        prompt: Completa con il futuro di *andare*.
        text: Sabato io ___ al cinema.
        blanks: [[andrò]]
      - id: unisci-futuro
        type: matching
        prompt: Unisci ogni verbo alla sua forma di *io* al futuro.
        pairs:
          - [guardare, guarderò]
          - [vedere, vedrò]
          - [andare, andrò]
          - [scegliere, sceglierò]
          - [essere, sarò]
      - id: mangeremo
        type: multipleChoice
        prompt: Durante la serata cinema noi ___ pizza e popcorn.
        options:
          - { text: mangeremo, correct: true }
          - {
              text: mangieremo,
              feedback: 'I verbi in *-iare* perdono la *i*: *mangiare → mangeremo*.',
            }
          - { text: mangerò, feedback: '*Mangerò* è per *io*. Per *noi* diciamo *mangeremo*.' }
      - id: a-diventa-e
        type: trueFalse
        prompt: 'Al futuro, nei verbi in *-are* la *a* diventa *e*: *guardare → guarderò*.'
        answer: true
        feedback:
          correct: 'Giusto! *parlare → parlerò*, *guardare → guarderò*.'
          incorrect: 'Nei verbi in *-are*, la *a* diventa *e*: *guardare → guarderò*, non *guardarò*.'
      - id: porteranno-berremo
        type: fillBlank
        prompt: Completa con il futuro di *portare* e *bere*.
        text: Gli ospiti ___ i dolci e noi ___ bibite.
        blanks: [[porteranno], [berremo]]
        wordBank: [porteranno, porterà, berremo, beveremo]
      - id: guarderai
        type: multipleChoice
        prompt: Tu ___ il film in italiano?
        options:
          - { text: guarderai, correct: true }
          - { text: guarderò, feedback: '*Guarderò* è per *io*. Per *tu* diciamo *guarderai*.' }
          - {
              text: guarderanno,
              feedback: '*Guarderanno* è per *loro*. Per *tu* diciamo *guarderai*.',
            }
      - id: ordina-famiglia
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Lo guarderò con la mia famiglia.

  - slug: televisione-e-film-futuro-previsioni
    title: 'Previsioni: il film sarà emozionante'
    minutes: 8
    items:
      - id: sara
        type: multipleChoice
        prompt: Secondo me, il film ___ emozionante.
        options:
          - { text: sarà, correct: true }
          - { text: sarò, feedback: '*Sarò* è per *io*. Per *il film* (lui) diciamo *sarà*.' }
          - {
              text: avrà,
              feedback: '*Avrà* viene da *avere*. Con un aggettivo (*emozionante*) usiamo *essere*: *sarà*.',
            }
      - id: scoprira
        type: fillBlank
        prompt: Completa con il futuro di *scoprire*.
        text: Alla fine il protagonista ___ la verità.
        blanks: [[scoprirà]]
      - id: domande-risposte
        type: matching
        prompt: Unisci ogni domanda alla risposta.
        pairs:
          - [Chi sarà il protagonista?, Il protagonista sarà Miguel.]
          - [Dove andrà il protagonista?, Andrà in un mondo speciale.]
          - [Chi incontrerà?, Incontrerà nuovi personaggi.]
          - [Come finirà la storia?, "Alla fine capirà l'importanza della famiglia."]
          - [Il film avrà successo?, 'Sì, avrà successo.']
      - id: avra-successo
        type: multipleChoice
        prompt: Il nuovo film ___ successo.
        options:
          - { text: avrà, correct: true }
          - { text: sarà, feedback: 'Diciamo *avere successo*: *Il film avrà successo.*' }
          - { text: avrò, feedback: '*Avrò* è per *io*. Per *il film* (lui) diciamo *avrà*.' }
      - id: avere-irregolare
        type: trueFalse
        prompt: '*Avere* al futuro è irregolare: *io avrò, tu avrai, lui avrà*.'
        answer: true
        feedback:
          correct: 'Giusto! Anche *essere* è irregolare: *sarò, sarai, sarà*.'
          incorrect: 'Il futuro di *avere* è irregolare: *avrò, avrai, avrà* (non *averò*).'
      - id: finale-alternativo
        type: fillBlank
        prompt: Completa il finale alternativo con il futuro di *arrivare* e *iniziare*.
        text: Nel nostro finale, Jack e Rose ___ in America e ___ una nuova vita.
        blanks: [[arriveranno], [inizieranno]]
      - id: prevedibile
        type: multipleChoice
        prompt: Sappiamo già come finirà il film prima di vederlo. Il finale è ___.
        options:
          - { text: prevedibile, correct: true }
          - {
              text: coinvolgente,
              feedback: '*Coinvolgente* vuol dire che il film ci prende molto. Un finale che sappiamo già è *prevedibile*.',
            }
          - {
              text: emozionante,
              feedback: '*Emozionante* vuol dire che ci fa provare emozioni. Un finale che sappiamo già è *prevedibile*.',
            }
      - id: ordina-segreto
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Alla fine il protagonista scoprirà un segreto.
