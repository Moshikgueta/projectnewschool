vocabulary:
  - slug: identita-e-comunita
    title: Identità e comunità
    items: *identita-e-comunita-words

activities:
  - slug: identita-e-comunita-essere-stare
    title: 'Essere, stare e stare + gerundio'
    minutes: 8
    items:
      - id: sto-bene
        type: multipleChoice
        prompt: Oggi ___ bene.
        options:
          - { text: sto, correct: true }
          - { text: sono, feedback: 'Per dire come stiamo usiamo *stare*: *Sto bene.*' }
          - { text: ho, feedback: 'Per dire come stiamo usiamo *stare*: *Sto bene.*' }
      - id: sono-insegnante
        type: multipleChoice
        prompt: ___ insegnante.
        options:
          - { text: Sono, correct: true }
          - { text: Sto, feedback: 'Per la professione usiamo *essere*: *Sono insegnante.*' }
          - { text: Ho, feedback: 'Per la professione usiamo *essere*: *Sono insegnante.*' }
      - id: sto-studiando
        type: fillBlank
        prompt: Completa con *stare*.
        text: In questo momento ___ studiando italiano.
        blanks: [[sto, io sto]]
      - id: unisci-gerundio
        type: matching
        prompt: Unisci ogni verbo al suo gerundio.
        pairs:
          - [studiare, studiando]
          - [lavorare, lavorando]
          - [crescere, crescendo]
          - [cambiare, cambiando]
          - [organizzare, organizzando]
      - id: sono-studiando
        type: trueFalse
        prompt: '*Sono studiando italiano* è una frase corretta.'
        answer: false
        feedback:
          correct: 'Giusto! Con il gerundio usiamo *stare*: *Sto studiando italiano.*'
          incorrect: 'Con il gerundio usiamo *stare*, non *essere*: *Sto studiando italiano.*'
      - id: stiamo-stanno
        type: fillBlank
        prompt: Completa con *stare*.
        text: Noi ___ organizzando un evento. Loro ___ preparando una festa.
        blanks: [[stiamo], [stanno]]
      - id: sta-cambiando
        type: multipleChoice
        prompt: La mia comunità ___ cambiando.
        options:
          - { text: sta, correct: true }
          - { text: è, feedback: 'Con il gerundio usiamo *stare*: *sta cambiando*.' }
          - { text: stanno, feedback: '*La mia comunità* è singolare (lei): usiamo *sta*.' }
      - id: ordina-cucinando
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Mio fratello sta cucinando.

  - slug: identita-e-comunita-confronti
    title: 'Confronti: più… di, meno… di, quanto, il più'
    minutes: 8
    items:
      - id: della-tua
        type: multipleChoice
        prompt: La mia famiglia è più grande ___ tua.
        options:
          - { text: della, correct: true }
          - { text: di, feedback: 'Davanti a *la* (la tua), *di* diventa *della*.' }
          - {
              text: che,
              feedback: 'Con un aggettivo (*grande*) usiamo *più… di*: *più grande della tua*.',
            }
      - id: meno-rumoroso
        type: multipleChoice
        prompt: Il centro ha molto rumore. Il mio quartiere è ___ rumoroso del centro.
        options:
          - { text: meno, correct: true }
          - {
              text: più,
              feedback: 'Il centro ha più rumore, quindi il mio quartiere è *meno* rumoroso.',
            }
          - {
              text: tanto,
              feedback: 'Usiamo *(tanto)… quanto* quando due cose sono uguali, non con *di*.',
            }
      - id: importante-quanto
        type: fillBlank
        prompt: 'Le due cose sono uguali: completa con una parola.'
        text: La mia comunità è importante ___ la mia famiglia.
        blanks: [[quanto, come]]
      - id: senza-tanto
        type: trueFalse
        prompt: 'Possiamo dire *La mia città è interessante quanto la tua* anche senza la parola *tanto*.'
        answer: true
        feedback:
          correct: Giusto! Di solito non diciamo *tanto*.
          incorrect: 'È corretto: in *tanto… quanto* di solito non diciamo *tanto*.'
      - id: la-piu
        type: multipleChoice
        prompt: La comunità studentesca è ___ attiva.
        options:
          - { text: la più, correct: true }
          - { text: il più, feedback: '*Comunità* è femminile: *la più attiva*.' }
          - { text: più di, feedback: 'Per il livello massimo usiamo *la più*: *la più attiva*.' }
      - id: cara-di
        type: fillBlank
        prompt: Completa il confronto.
        text: Questa città è meno cara ___ Roma.
        blanks: [[di]]
      - id: unisci-frasi
        type: matching
        prompt: Unisci le due parti della frase.
        pairs:
          - [La mia famiglia è più grande, della tua.]
          - [Il mio quartiere è meno rumoroso, del centro.]
          - [La mia città è interessante, quanto la tua.]
          - [La comunità studentesca è la più, attiva.]
      - id: ordina-stanco
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Sono più stanco di ieri.

  - slug: identita-e-comunita-futuro
    title: 'Futuro semplice: sarò, avrò, aiuteremo'
    minutes: 8
    items:
      - id: vivro
        type: multipleChoice
        prompt: Tra cinque anni io ___ in un'altra città.
        options:
          - { text: vivrò, correct: true }
          - { text: vivrai, feedback: '*Vivrai* è per *tu*. Per *io* usiamo *vivrò*.' }
          - { text: vivranno, feedback: '*Vivranno* è per *loro*. Per *io* usiamo *vivrò*.' }
      - id: sara
        type: fillBlank
        prompt: Completa con il futuro di *essere*.
        text: Tra dieci anni la mia comunità ___ più grande.
        blanks: [[sarà]]
      - id: unisci-aiutare
        type: matching
        prompt: Unisci ogni persona alla forma giusta di *aiutare* al futuro.
        pairs:
          - [io, aiuterò]
          - [tu, aiuterai]
          - [lui / lei, aiuterà]
          - [noi, aiuteremo]
          - [loro, aiuteranno]
      - id: dimenticheremo
        type: multipleChoice
        prompt: Noi non ___ le nostre tradizioni.
        options:
          - { text: dimenticheremo, correct: true }
          - {
              text: dimenticeremo,
              feedback: 'I verbi in *-care* aggiungono una *h*: *dimenticheremo*.',
            }
          - {
              text: dimenticherete,
              feedback: '*Dimenticherete* è per *voi*. Per *noi* usiamo *dimenticheremo*.',
            }
      - id: avremo-essere
        type: trueFalse
        prompt: '*Avremo* è il futuro di *essere* per *noi*.'
        answer: false
        feedback:
          correct: 'Giusto! *Avremo* viene da *avere*. Il futuro di *essere* per *noi* è *saremo*.'
          incorrect: '*Avremo* viene da *avere*. Il futuro di *essere* per *noi* è *saremo*.'
      - id: saro-avro
        type: fillBlank
        prompt: Completa con il futuro di *essere* e di *avere*.
        text: Tra dieci anni io ___ più sicuro di me e ___ più progetti.
        blanks: [[sarò], [avrò]]
        wordBank: [sarò, avrò, saremo, avremo]
      - id: cresceranno
        type: multipleChoice
        prompt: I bambini della comunità ___.
        options:
          - { text: cresceranno, correct: true }
          - { text: crescerà, feedback: '*I bambini* è plurale (loro): usiamo *cresceranno*.' }
          - {
              text: cresceremo,
              feedback: '*Cresceremo* è per *noi*. Per *i bambini* (loro) usiamo *cresceranno*.',
            }
      - id: ordina-membri
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Aiuteremo i nuovi membri.
