# Cycle "Identità e comunità", converted from the Italian level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-2
slug: identita-e-comunita
title: Identità e comunità
goal: Parlare di sé con essere, stare e stare + gerundio, fare confronti e parlare del futuro.
position: 17
status: in_review

review:
  - >-
    The three workbook exercises ("Essere, stare e stare + gerundio", "Confronti" and
    "Futuro semplice") are NEW: the notebook has no self-study exercises. This cycle has
    THREE skills (not two), so there is one exercise per skill. They were written from the
    summary rules, the activity examples and the vocabulary. Please check level, wording
    and every right answer before students see them.
  - >-
    Summary, comparatives: "In conversazione possiamo anche dire come… come: La mia comunità
    è importante come la tua" is wrong: Italian has no "come… come". Rewritten as "we can
    also say just come" (the example is right). A line was ADDED saying that "tanto" in
    "tanto… quanto" is usually left out, which is what all the examples do, and that di
    joins the article (della tua, del centro). Please confirm.
  - >-
    Summary, futuro semplice: a note was ADDED that verbs in -care / -gare add h
    (dimenticare → dimenticheremo), because the examples use "dimenticheremo"; one workbook
    item tests it. The futuro tables (essere, avere, vivere, aiutare, crescere) were checked
    and are correct; they are merged into one table. The stare + gerundio tables are merged
    into one table too.
  - >-
    Corrections: warm-up Part 1, question 1 frame "gli aspetti più importanti della mia
    identità sono." had no blank → "sono ___."; Activity 4 "Istruzioni per la chat" →
    "Istruzioni per il gruppo" (the activity is group work, not a chat); "Sono a Curitiba" /
    "sono brasiliana" in the teacher's model kept as in the source (the introduction example
    says "argentina"; any nationality works).
  - >-
    Mori homework: the notebook gives six "Comando a Mori" tasks written as instructions to
    the student ("Presentati in 4 frasi…"), not as messages to send. Each was turned into a
    message the student sends to Mori, with the notebook's example kept as an intro. Please
    check the wording of the six messages.
  - >-
    The notebook's "Nota didattica" (identity can be personal; students choose what to
    share, religion, gender or citizenship are never compulsory) is kept as a callout for
    students and a teacher note. "Grammatica applicata nelle attività" (which activity
    practises which structure) is moved into the plan teacher note.
  - >-
    The lesson slides are a gamma.app link, which is not allowed on the platform: left out
    and mentioned in a teacher note. The notebook gives no times for the activities except
    "dopo 3 minuti" (Activity 1, phase 3), and no plan for choosing activities: the teacher
    note suggests one.
  - >-
    The Quizlet link is kept without its "?new" parameter. The "Risposta dello studente
    1/2/3" lines are replaced by the answer boxes. The empty "Data / Partecipanti" lines were
    left out. The vocabulary glosses are as in the notebook.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: identita-e-comunita-classe
    title: 'In classe: Identità e comunità'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Identità e comunità
      - id: skills
        type: cycleOverview
        skills:
          - name: Essere, stare e stare + gerundio
            description: '*Sono insegnante. Sto bene. Sto studiando italiano.*'
          - name: Confronti
            description: '*più… di, meno… di, (tanto)… quanto, il / la più*'
          - name: Futuro semplice
            description: '*Sarò, avremo, aiuteremo*: il futuro della mia identità e della mia comunità'
      - id: note
        type: callout
        tone: info
        title: Prima di cominciare
        text: Il tema dell'identità può essere personale. Puoi scegliere liberamente cosa condividere e cosa no. Non è obbligatorio parlare di religione, genere, cittadinanza o altri aspetti personali.
      - id: quizlet
        type: externalLink
        label: Identità e comunità su Quizlet
        url: https://quizlet.com/br/1191222587/identita-e-comunita-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Giro di presentazioni
      - id: intro
        type: sentenceFrame
        frame: Io sono ___. Sono ___. Oggi sono / sto ___. In questo momento sono a ___.
        example: Io sono Marta. Sono argentina e sono insegnante. Oggi sto bene, ma sono un po' stanca. In questo momento sono a lezione di italiano.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup1-title
        type: heading
        level: 4
        text: 'Parte 1: Essere, stare e stare + gerundio'
      - id: warmup1
        type: discussionQuestions
        items:
          - question: Quali aspetti della tua identità sono più importanti per te?
            frame: 'Per me, gli aspetti più importanti della mia identità sono ___. (Es.: la mia famiglia, la mia lingua e il mio lavoro.)'
          - question: In quali luoghi ti senti davvero te stesso / te stessa?
            frame: 'Mi sento davvero me stesso / me stessa quando sono a ___. (Es.: a casa con la mia famiglia.)'
          - question: Come stai in questo periodo della tua vita? Perché?
            frame: 'In questo periodo sto ___ perché ___. (Es.: sto abbastanza bene perché sto lavorando su progetti importanti.)'
          - question: Che ruolo hai nella tua famiglia, nel lavoro o nella tua comunità?
            frame: 'Nella mia famiglia / nel mio lavoro / nella mia comunità sono ___. (Es.: una persona che aiuta molto gli altri.)'
          - question: Cosa stai facendo ultimamente per migliorare te stesso / te stessa?
            frame: 'Ultimamente sto ___ per ___. (Es.: sto studiando italiano per comunicare meglio con altre persone.)'
          - question: La tua comunità sta cambiando in questo periodo? In che modo?
            frame: 'Sì, la mia comunità sta ___. / No, la mia comunità non sta cambiando molto, ma ___. (Es.: sta diventando più internazionale e sta usando più tecnologia.)'
      - id: warmup2-title
        type: heading
        level: 4
        text: 'Parte 2: Confronti'
      - id: warmup2
        type: discussionQuestions
        items:
          - question: In che cosa sei simile alla tua famiglia? In che cosa sei diverso / diversa?
            frame: 'Sono simile alla mia famiglia perché ___. Sono diverso / diversa perché ___. (Es.: sono molto legato alle tradizioni… sono più indipendente.)'
          - question: 'Quale comunità ti rappresenta di più: famiglia, amici, lavoro, classe o città? Perché?'
            frame: 'La comunità che mi rappresenta di più è ___ perché ___. (Es.: la mia classe di lingue, perché siamo persone curiose e aperte.)'
          - question: Confronta due comunità di cui fai parte.
            frame: 'La mia comunità ___ è più / meno ___ della mia comunità ___. (Es.: La mia comunità familiare è più tradizionale della mia comunità di amici.)'
          - question: Chi nella tua famiglia o nella tua comunità è più simile a te? In cosa?
            frame: '___ è più simile a me perché ___. (Es.: Mia sorella, perché anche lei è curiosa e ama viaggiare.)'
          - question: Quale comunità è importante quanto la famiglia per te?
            frame: 'Per me, ___ è importante quanto la famiglia perché ___. (Es.: la comunità degli amici, perché mi sostiene nei momenti difficili.)'
          - question: Qual è la comunità più presente nella tua vita oggi?
            frame: 'La comunità più presente nella mia vita oggi è ___. (Es.: il mio gruppo di lavoro, perché parlo con loro ogni giorno.)'
      - id: warmup3-title
        type: heading
        level: 4
        text: 'Parte 3: Futuro semplice'
      - id: warmup3
        type: discussionQuestions
        items:
          - question: Tra cinque anni, quali parti della tua identità saranno uguali e quali cambieranno?
            frame: 'Tra cinque anni, sarò ancora ___, ma forse cambierò ___. (Es.: una persona curiosa… città o lavoro.)'
          - question: In futuro, in quale comunità vorrai essere più attivo / attiva?
            frame: 'In futuro vorrei essere più attivo / attiva nella comunità ___. (Es.: culturale della mia città.)'
          - question: Come sarà la tua comunità tra dieci anni?
            frame: 'Tra dieci anni, la mia comunità sarà più ___ e meno ___. (Es.: più inclusiva e meno chiusa.)'
          - question: Quale tradizione, lingua o abitudine continuerà a far parte della tua identità?
            frame: 'Penso che ___ continuerà a far parte della mia identità. (Es.: la mia lingua.)'
          - question: Cosa farai per mantenere il legame con la tua comunità?
            frame: 'Per mantenere il legame con la mia comunità, io ___. (Es.: parlerò di più con la mia famiglia e parteciperò agli eventi.)'
          - question: Quale parte della tua identità non cambierà mai?
            frame: 'Una parte della mia identità che non cambierà mai è ___. (Es.: il legame con la mia famiglia.)'
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: Chi sono, dove sono e cosa sto facendo'
        skills: ['Essere, stare e stare + gerundio']
        steps:
          - "Ascolta la presentazione dell'insegnante e la spiegazione breve di **essere** e **stare**."
          - 'In coppia, fate le domande qui sotto.'
          - Dopo 3 minuti, cambia partner e ripeti alcune domande con una nuova persona.
          - 'Presenta il tuo compagno al gruppo. Fai un errore intenzionale con **essere**, **stare** o **stare + gerundio**: la classe ascolta e corregge.'
          - "Minigioco «Vero o falso»: di' 4 frasi su di te (2 con **essere**, 1 con **stare**, 1 con **stare + gerundio**). Una frase è falsa: gli altri fanno domande per scoprire quale."
        example: |-
          *Ciao, sono Marta. Sono insegnante e sono brasiliana. Adesso sono a Curitiba. Oggi sto bene, ma sono un po' stanca. In questo periodo sto lavorando a un nuovo progetto.*
          **Vero o falso:** *Sono israeliano. Sono insegnante. Oggi sto male. Sto studiando medicina.*
      - id: act1-rules
        type: table
        caption: Essere o stare?
        header: [Usiamo, Per, Esempi]
        rows:
          - [
              essere,
              'nome, nazionalità, professione, identità, caratteristiche, luogo',
              'Sono Marta. Sono brasiliana. Sono insegnante. Sono una persona tranquilla. Sono a Curitiba.',
            ]
          - [
              stare,
              'come stiamo, condizione, stare + gerundio',
              'Sto bene. Sto male. Sto studiando. Sto lavorando. La mia comunità sta cambiando.',
            ]
      - id: act1-errors
        type: table
        caption: Esempi di errori
        header: [Errore, Corretto]
        rows:
          - [Sto brasiliano., Sono brasiliano.]
          - [Sono bene., Sto bene.]
          - [Sono studiando italiano., Sto studiando italiano.]
          - [Sto insegnante., Sono insegnante.]
      - id: act1-questions
        type: discussionQuestions
        title: Domande
        items:
          - question: Da dove vieni?
          - question: Dove sei adesso?
          - question: Come stai oggi?
          - question: Che tipo di persona sei?
          - question: Qual è la tua professione o il tuo ruolo nella vita?
          - question: Cosa stai facendo in questo periodo?
          - question: Chi nella tua famiglia è più alto o più basso di te?
          - question: La tua comunità è più grande o più piccola di altre comunità che conosci?
          - question: Quale parte della tua identità non cambierà mai?
          - question: Cosa farai tra 10 anni?
      - id: act2
        type: classActivity
        title: 'Attività 2: Comunità a confronto'
        skills: [Confronti]
        steps:
          - 'In piccoli gruppi, parlate di una comunità: la famiglia, la città, la comunità religiosa, professionale, linguistica o culturale, gli amici, la classe, una comunità online.'
          - 'Scrivete almeno 4 frasi: una con **più… di**, una con **meno… di**, una con **(tanto)… quanto** e una con **il / la più**. Le domande guida vi aiutano.'
          - Ogni gruppo condivide 2 o 3 frasi con la classe e risponde alla domanda bonus dell'insegnante.
          - 'La classe vota: quale comunità è la più interessante? Giustifica la tua risposta con una frase di confronto.'
        example: |-
          *La mia comunità è più grande della tua.*
          *La mia comunità è meno numerosa della tua.*
          *La mia comunità è importante quanto la mia famiglia.*
          *La comunità studentesca è la più attiva.*
          **Voto:** *Secondo me, la comunità artistica è la più interessante perché è più creativa delle altre.*
      - id: act2-questions
        type: discussionQuestions
        title: Domande guida
        items:
          - question: Quale comunità è più grande?
          - question: Quale comunità è meno formale?
          - question: Quale comunità è importante quanto la famiglia?
          - question: Qual è la comunità più attiva?
          - question: Quale comunità è più internazionale?
          - question: Quale comunità è meno visibile nella società?
          - question: Quali differenze noti tra la tua comunità e altre comunità?
      - id: act2-model
        type: callout
        tone: info
        title: Modello per la presentazione
        text: |-
          *La nostra comunità linguistica è più internazionale della nostra comunità locale.*
          *La comunità della famiglia è importante quanto la comunità degli amici.*
          *Secondo noi, la comunità studentesca è la più attiva.*
      - id: act3
        type: classActivity
        title: 'Attività 3: La mia comunità nel futuro'
        skills: [Futuro semplice]
        steps:
          - 'Oggi immagineremo il futuro delle nostre comunità. Useremo il futuro semplice per parlare di piani, cambiamenti e previsioni.'
          - Ogni gruppo sceglie una comunità reale o inventata e risponde alle domande guida.
          - Ogni gruppo prepara 3 frasi al futuro semplice e le presenta alla classe.
          - "Dopo ogni presentazione, l'insegnante fa una domanda bonus."
          - 'La classe vota: quale comunità avrà il futuro più interessante?'
        example: |-
          *La nostra comunità sarà più inclusiva. Useremo più tecnologia. Aiuteremo le persone nuove a sentirsi parte del gruppo.*
          **Voto:** *Voterò per la comunità X perché sarà molto creativa e aiuterà molte persone.*
      - id: act3-questions
        type: discussionQuestions
        title: Domande guida
        items:
          - question: Cosa sarà più importante per la tua comunità nei prossimi 10 anni?
          - question: Quali cose cambieranno rapidamente?
          - question: Cosa non cambierà mai?
          - question: Quali problemi dovrà affrontare la tua comunità in futuro?
          - question: Quali soluzioni creerete?
          - question: Come sarà la vostra comunità tra 10 anni?
          - question: Chi aiuterà la comunità a crescere?
          - question: Quali tradizioni continueranno?
      - id: act3-sentences
        type: discussionQuestions
        title: Le nostre 3 frasi al futuro
        items:
          - question: 'Frase 1: ___'
          - question: 'Frase 2: ___'
          - question: 'Frase 3: ___'
      - id: act4
        type: classActivity
        title: 'Attività 4: La mia comunità: chi siamo, cosa stiamo facendo e cosa faremo'
        skills: ['Essere, stare e stare + gerundio', Confronti, Futuro semplice]
        steps:
          - 'Ripassa le quattro strutture: **essere** (identità, caratteristiche, luogo), **stare + gerundio** (azioni in corso), **confronti** (somiglianze e differenze), **futuro semplice** (piani e previsioni).'
          - Ogni gruppo sceglie una comunità reale o inventata e scrive 4 frasi, una per ogni struttura.
          - "Ogni gruppo presenta le sue 4 frasi. L'insegnante scrive buoni esempi alla lavagna e corregge gli errori comuni."
          - 'Domanda finale: quale parte della tua comunità non cambierà mai?'
        example: |-
          *La nostra comunità è una comunità studentesca.*
          *Stiamo organizzando lezioni online.*
          *Siamo più internazionali di molte comunità locali perché abbiamo persone di diversi paesi.*
          *Tra cinque anni saremo più grandi e aiuteremo più studenti.*
      - id: act4-sentences
        type: discussionQuestions
        title: Le nostre 4 frasi
        items:
          - question: Una frase con **essere**
            frame: La nostra comunità è internazionale.
          - question: Una frase con **stare + gerundio**
            frame: Stiamo organizzando un evento culturale.
          - question: Una frase con un **confronto**
            frame: Siamo più attivi della comunità locale.
          - question: Una frase con il **futuro semplice**
            frame: In futuro saremo più grandi e aiuteremo più persone.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Tre abilità in questo ciclo: **essere, stare e stare + gerundio** (Attività 1),
          **confronti** (Attività 2) e **futuro semplice** (Attività 3). L'Attività 4 integra
          tutte le strutture. Il quaderno non indica quali attività scegliere: per esempio
          Attività 1 + 2, oppure Attività 1 + 4. La presentazione della lezione (gamma.app)
          non è disponibile sulla piattaforma.
      - id: n-objectives
        anchor: null
        text: >-
          Obiettivi: presentarsi in modo più completo; parlare della propria identità e della
          propria comunità; distinguere tra essere, stare e stare + gerundio; descrivere cosa
          stanno facendo adesso; confrontare comunità, famiglie, città e gruppi; parlare di
          come cambierà la loro comunità; creare una breve presentazione sulla propria
          comunità.
      - id: n-note
        anchor: note
        text: Il tema può essere personale. Nessuno deve parlare di religione, genere, cittadinanza o altri aspetti personali se non si sente a suo agio; accetta anche comunità come la classe, gli amici o il lavoro.
      - id: n-intro
        anchor: intro
        text: Fai prima il tuo esempio e poi chiedi a ogni studente.
      - id: n-warmup
        anchor: warmup-title
        text: Scegli una o due parti secondo le abilità della lezione e fai almeno due domande a ogni studente.
      - id: n-act1
        anchor: act1
        text: >-
          Fase 1: presentati come nell'esempio e spiega brevemente essere e stare (tabella).
          Fase 2-3: interviste in coppia; dopo 3 minuti gli studenti cambiano partner.
          L'obiettivo è aumentare la fluidità e ripetere le strutture in modo naturale.
          Fase 4: errore intenzionale (vedi gli esempi di errori). Fase 5: «Vero o falso».
      - id: n-act2
        anchor: act2
        text: >-
          Scrivi alla lavagna le quattro strutture. Domande bonus dopo ogni presentazione:
          Perché questa comunità è più importante per voi? In che senso è meno formale?
          Perché è importante quanto la famiglia? Cosa rende questa comunità speciale?
      - id: n-act3
        anchor: act3
        text: >-
          Esempi da dare all'inizio: La mia comunità sarà più inclusiva. Aiuteremo i nuovi
          membri. La nostra comunità crescerà. Non dimenticheremo le nostre tradizioni.
          Domande bonus: Perché questo sarà importante per la vostra comunità? Cosa succederà
          se la comunità non cambierà? Quale tradizione non cambierà mai? Come aiuterete i
          nuovi membri?
      - id: n-act4
        anchor: act4
        text: >-
          Domande bonus: Perché la vostra comunità è più attiva di un'altra? Cosa farete se la
          comunità crescerà troppo velocemente? Cosa state facendo ora per prepararvi al
          futuro? Quale parte della vostra comunità non cambierà mai? Alla fine riassumi le
          quattro strutture.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: identita-e-comunita-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: rules-essere-stare
        type: ruleSummary
        skill: Essere, stare e stare + gerundio
        rules:
          - text: 'Usiamo **essere** per nome, identità, nazionalità, professione, caratteristiche, luogo e stati con aggettivi.'
            examples:
              - Sono Marta.
              - Sono brasiliana.
              - Sono insegnante.
              - Sono una persona curiosa.
              - Sono a Tel Aviv.
              - Sono felice.
              - Sono stanco.
          - text: 'Usiamo **stare** soprattutto per dire come stiamo e per parlare di condizione.'
            examples: [Sto bene., Sto male., Sto abbastanza bene., Oggi sto meglio., Come stai?]
          - text: 'Attenzione:'
            examples:
              - Sto bene. (non *Sono bene.*)
              - Sono israeliano. (non *Sto israeliano.*)
              - Sono insegnante. (non *Sto insegnante.*)
          - text: 'Usiamo **stare + gerundio** (verbo in *-ando* / *-endo*) per azioni che succedono adesso o in questo periodo. Verbi in *-are* → *-ando*; verbi in *-ere* e *-ire* → *-endo*.'
            examples:
              - Sto studiando italiano.
              - Stai lavorando molto.
              - La mia comunità sta cambiando.
              - Stiamo organizzando un evento.
              - Stanno preparando una festa.
      - id: gerundio-table
        type: table
        caption: Stare + gerundio
        header: [Persona, studiare, crescere]
        rows:
          - [io, sto studiando, sto crescendo]
          - [tu, stai studiando, stai crescendo]
          - [lui / lei, sta studiando, sta crescendo]
          - [noi, stiamo studiando, stiamo crescendo]
          - [voi, state studiando, state crescendo]
          - [loro, stanno studiando, stanno crescendo]
      - id: rules-confronti
        type: ruleSummary
        skill: Confronti
        rules:
          - text: '**Più… di**: una cosa ha di più.'
            examples:
              - La mia famiglia è più grande della tua.
              - La mia comunità è più internazionale della tua.
              - Sono più stanco di ieri.
          - text: '**Meno… di**: una cosa ha di meno.'
            examples:
              - Il mio quartiere è meno rumoroso del centro.
              - La mia comunità è meno formale della comunità del lavoro.
              - Questa città è meno cara di Roma.
          - text: '**(Tanto)… quanto**: due cose sono uguali. Di solito non diciamo *tanto*. In conversazione possiamo dire anche solo **come**.'
            examples:
              - La mia comunità è importante quanto la mia famiglia.
              - La mia città è interessante quanto la tua.
              - Questa tradizione è forte quanto quella.
              - La mia comunità è importante come la tua.
          - text: '**Il / la più**: il livello massimo.'
            examples:
              - La comunità studentesca è la più attiva.
              - La mia famiglia è la comunità più importante per me.
              - Questo gruppo è il più inclusivo.
          - text: "Davanti a un articolo, **di** si unisce all'articolo: *di + la = della* (della tua), *di + il = del* (del centro)."
      - id: rules-futuro
        type: ruleSummary
        skill: Futuro semplice
        rules:
          - text: 'Usiamo il **futuro semplice** per progetti, previsioni, cambiamenti, promesse e per il futuro personale e della comunità.'
            examples:
              - Tra cinque anni vivrò in un'altra città.
              - Sarò più sicuro di me.
              - La mia comunità sarà più grande.
              - Aiuteremo più persone.
              - Non dimenticheremo le nostre tradizioni.
          - text: 'I verbi in *-care* e *-gare* aggiungono una **h**: *dimenticare → dimenticheremo*.'
      - id: futuro-table
        type: table
        caption: Verbi utili al futuro
        header: [Persona, essere, avere, vivere, aiutare, crescere]
        rows:
          - [io, sarò, avrò, vivrò, aiuterò, crescerò]
          - [tu, sarai, avrai, vivrai, aiuterai, crescerai]
          - [lui / lei, sarà, avrà, vivrà, aiuterà, crescerà]
          - [noi, saremo, avremo, vivremo, aiuteremo, cresceremo]
          - [voi, sarete, avrete, vivrete, aiuterete, crescerete]
          - [loro, saranno, avranno, vivranno, aiuteranno, cresceranno]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le regole con la classe e chiedi un esempio nuovo per ogni regola.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: identita-e-comunita-compiti
    title: Compiti con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti con Mori
      - id: how
        type: text
        text: 'Apri la chat con Mori, copia un messaggio e invialo. Poi scrivi le tue frasi: Mori le corregge. Obiettivo: praticare essere, stare, stare + gerundio, i confronti e il futuro semplice.'
      - id: mori-1
        type: aiTutorPrompt
        title: 'Parte 1: Presentazione personale'
        intro: 'Usa **essere** per dire chi sei, la tua nazionalità o professione e dove sei, e **stare** per dire come stai oggi. Esempio: *Io sono Marta. Sono insegnante. Sono a Tel Aviv. Oggi sto bene.*'
        message: Ciao Mori! Voglio presentarmi in 4 frasi con essere e stare. Correggi le mie frasi, per favore, e poi fammi una domanda.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Parte 2: Stare + gerundio'
        intro: 'Scrivi cosa stai facendo adesso e cosa sta facendo una persona della tua famiglia o un tuo amico. Esempio: *Sto studiando italiano. Mio fratello sta cucinando.*'
        message: Ciao Mori! Ti scrivo 2 frasi con stare + gerundio. Correggi le mie frasi, per favore, e poi fammi una domanda su cosa sto facendo.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Parte 3: Confronti'
        intro: 'Usa una frase con **più… di**, una con **meno… di** e una con **(tanto)… quanto**. Esempio: *La mia città è più grande della tua. Il mio quartiere è meno rumoroso del centro. La mia famiglia è importante quanto i miei amici.*'
        message: Ciao Mori! Ti scrivo 3 confronti, con più… di, meno… di e quanto. Correggi le mie frasi, per favore.
      - id: mori-4
        type: aiTutorPrompt
        title: 'Parte 4: Futuro semplice'
        intro: 'Immagina la tua vita tra 10 anni. Esempio: *Tra 10 anni vivrò in un altro paese. Lavorerò in una scuola internazionale. La mia comunità sarà più inclusiva.*'
        message: Ciao Mori! Ti scrivo 3 frasi al futuro semplice sulla mia vita tra 10 anni. Correggi le mie frasi, per favore, e fammi una domanda sul mio futuro.
      - id: mori-5
        type: aiTutorPrompt
        title: 'Parte 5: Vero o falso'
        intro: 'Scrivi 2 frasi con **essere**, 1 con **stare** e 1 con **stare + gerundio**. Una frase deve essere falsa. Esempio: *Sono uno studente. Sono francese. Oggi sto molto bene. Sto studiando medicina.*'
        message: Ciao Mori! Facciamo un gioco. Ti scrivo 4 frasi su di me; una è falsa. Prova a indovinare quale, e poi correggi i miei errori.
      - id: mori-6
        type: aiTutorPrompt
        title: 'Parte 6: Riflessione finale'
        intro: 'Modello: *Una parte della mia identità che non cambierà mai è ___.*'
        message: Ciao Mori! Rispondo in una frase alla domanda «Quale parte della mia identità non cambierà mai?». Correggi la mia frase, per favore.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**

