vocabulary:
  - slug: televisione-e-film-passato
    title: 'Televisione e film: raccontare il passato'
    items: *televisione-e-film-passato-words

activities:
  - slug: televisione-e-film-passato-imperfetto
    title: 'Imperfetto: guardavo, era, mi piaceva'
    minutes: 8
    items:
      - id: guardavo
        type: multipleChoice
        prompt: Quando ero bambino ___ spesso *Toy Story*.
        options:
          - { text: guardavo, correct: true }
          - {
              text: ho guardato,
              feedback: "*Quando ero bambino* e *spesso* parlano di un'abitudine: usiamo l'imperfetto, *guardavo*.",
            }
          - {
              text: guardo,
              feedback: "*Guardo* è presente. Per un'abitudine del passato usiamo *guardavo*.",
            }
      - id: era
        type: fillBlank
        prompt: Completa con l'imperfetto di *essere*.
        text: Il mio film preferito ___ *Shrek*.
        blanks: [[era]]
      - id: piacevano
        type: fillBlank
        prompt: Completa con l'imperfetto di *piacere*.
        text: Da adolescente mi ___ le commedie.
        blanks: [[piacevano]]
      - id: forme
        type: matching
        prompt: Unisci ogni verbo alla sua forma di *io* all'imperfetto.
        pairs:
          - [guardare, guardavo]
          - [essere, ero]
          - [avere, avevo]
          - [preferire, preferivo]
          - [raccontare, raccontavo]
      - id: regola-imperfetto
        type: trueFalse
        prompt: "L'imperfetto si usa per le abitudini e le descrizioni nel passato: *Il film era divertente.*"
        answer: true
        feedback:
          correct: "Giusto! *Era* descrive com'era il film."
          incorrect: "L'imperfetto descrive abitudini e situazioni del passato: *guardavo*, *era*, *mi piaceva*."
      - id: ogni-sabato
        type: multipleChoice
        prompt: Lo ___ con mio fratello ogni sabato.
        options:
          - { text: guardavo, correct: true }
          - {
              text: ho guardato,
              feedback: "*Ogni sabato* indica un'abitudine: usiamo l'imperfetto, *guardavo*.",
            }
          - {
              text: guarderò,
              feedback: "*Guarderò* è futuro. Per un'abitudine del passato usiamo *guardavo*.",
            }
      - id: ero
        type: fillBlank
        prompt: Completa con l'imperfetto di *essere*.
        text: Quando ___ piccola, guardavo i cartoni animati.
        blanks: [[ero, io ero]]
      - id: ordina-piacevano
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Mi piacevano i film d'animazione.

  - slug: televisione-e-film-passato-passato-prossimo
    title: 'Passato prossimo: ho visto, sono andato, mi è piaciuto'
    minutes: 8
    items:
      - id: sono-andato
        type: multipleChoice
        prompt: 'Marco: «Ieri ___ al cinema.»'
        options:
          - { text: sono andato, correct: true }
          - {
              text: ho andato,
              feedback: '*Andare* forma il passato prossimo con *essere*: *sono andato*.',
            }
          - {
              text: andavo,
              feedback: "*Ieri* indica un'azione specifica e finita: usiamo il passato prossimo, *sono andato*.",
            }
      - id: ho-visto
        type: fillBlank
        prompt: Completa con il passato prossimo di *vedere* o *guardare*.
        text: "L'ultimo film che ___ è stato *Coco*."
        blanks: [[ho visto, ho guardato]]
      - id: piaciuta
        type: multipleChoice
        prompt: 'Ti è piaciuta la serie? — Sì, mi è ___ molto.'
        options:
          - { text: piaciuta, correct: true }
          - { text: piaciuto, feedback: '*La serie* è femminile: *mi è piaciuta*.' }
          - {
              text: piaceva,
              feedback: 'La domanda è al passato prossimo (*ti è piaciuta*): rispondiamo *mi è piaciuta*.',
            }
      - id: andata
        type: fillBlank
        prompt: Sara racconta. Completa con il participio di *andare*.
        text: Sono ___ al cinema con mia sorella.
        blanks: [[andata]]
      - id: ho-andato
        type: trueFalse
        prompt: 'Con *andare* usiamo *avere*: *Ho andato al cinema.*'
        answer: false
        feedback:
          correct: 'Giusto! *Andare* usa *essere*: *Sono andato / andata al cinema.*'
          incorrect: '*Andare* usa *essere*, non *avere*: *Sono andato / andata al cinema.*'
      - id: intervista
        type: matching
        prompt: Unisci ogni domanda alla sua risposta.
        pairs:
          - [Qual è stato l'ultimo film che hai visto?, Ho visto Titanic.]
          - [Dove l'hai visto?, L'ho visto al cinema.]
          - [Con chi l'hai guardato?, L'ho guardato con mia sorella.]
          - [Ti è piaciuto?, 'Sì, mi è piaciuto molto.']
          - [Che cosa è successo nella storia?, Una grande nave è partita e poi è affondata.]
      - id: un-giorno
        type: multipleChoice
        prompt: Quando ero bambino guardavo spesso *Shrek*. Un giorno ___ *Shrek* al cinema con mio padre.
        options:
          - { text: ho visto, correct: true }
          - {
              text: vedevo,
              feedback: "*Un giorno* indica un'azione specifica, successa una volta: usiamo il passato prossimo, *ho visto*.",
            }
          - { text: vedo, feedback: '*Vedo* è presente. Qui raccontiamo il passato: *ho visto*.' }
      - id: ordina-visto
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: L'ho visto a casa con mia sorella.
