course: it-livello-2
slug: progetti-e-obiettivi-passato
title: 'Progetti e obiettivi: passato'
goal: Raccontare obiettivi e risultati passati con il passato prossimo e descrivere emozioni e contesto con l'imperfetto.
position: 14
status: in_review

review:
  - >-
    The two workbook exercises ("Passato prossimo: ho raggiunto, sono andato" and
    "Imperfetto o passato prossimo?") are NEW: the notebook has no self-study
    exercises. They were written from the cycle's summary, the activity models and the
    vocabulary. Please check level, wording and every right answer before students
    see them.
  - >-
    Skills: the source lists "1. parlare di obiettivi, progetti e risultati nel
    passato" and "2. usare il passato prossimo e l'imperfetto". On the platform they
    are "Passato prossimo: obiettivi e risultati" and "Imperfetto: emozioni, abitudini
    e contesto" (with the connectors prima, poi, dopo, alla fine, mentre, quando).
    Please confirm.
  - >-
    Summary: the conjugation tables of studiare, raggiungere and imparare had no "voi"
    form; it was added (avete studiato…). The source gives no imperfetto forms: a short
    table (studiare, avere, essere) was ADDED, since the workbook uses them. The
    connector list from the lesson objectives is now a rule. Please confirm.
  - >-
    Warm-up: "Come ti sei sentito" → "Come ti sei sentito / sentita"; the frame "Ho
    festeggiato a ___" → "Ho festeggiato a / in ___" (a casa, in un ristorante).
  - >-
    The lesson presentation link (gamma.app) is not allowed on the platform and was
    left out; see the teacher note. The cycle has no introduction round, no timings and
    no recommended activity combination in the source; the plan note suggests one.
  - >-
    Homework: the notebook gives written homework only (Parte 1 questions, Parte 2
    writing, Parte 3 reading) and no Mori message. The written parts are kept as answer
    boxes; ONE Mori message was written by the converter so the section matches the
    platform's homework pattern. Please confirm or remove. An answer key for the
    reading is in a teacher note.
  - >-
    Vocabulary: "Anna si è concentrata sull'obiettivo – אנה התרכזתה במטרה" → "אנה
    התרכזה במטרה" (Hebrew typo). The vocabulary is a list of example sentences, as in
    the source.
  - >-
    The Quizlet link is kept without its tracking parameter (funnelUUID). The
    "Risposta dello studente 1/2/3" lines are replaced by the optional answer boxes
    (decision C2).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: progetti-e-obiettivi-passato-classe
    title: 'In classe: Progetti e obiettivi (passato)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Progetti e obiettivi: passato'
      - id: skills
        type: cycleOverview
        skills:
          - name: 'Passato prossimo: obiettivi e risultati'
            description: '*Ho studiato ogni giorno. Ho raggiunto il mio obiettivo. Mi sono sentito felice.*'
          - name: 'Imperfetto: emozioni, abitudini e contesto'
            description: '*Il mio obiettivo era difficile. Mi sentivo stanco, ma ho continuato.*'
      - id: quizlet
        type: externalLink
        label: 'Progetti e obiettivi: passato su Quizlet'
        url: https://quizlet.com/br/1191221525/progetti-e-obiettivi-passato-flash-cards/
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup
        type: discussionQuestions
        items:
          - question: Cosa hai fatto finora per avvicinarti al tuo obiettivo?
            frame: Finora ho ___.
          - question: Qual era il tuo ultimo obiettivo? L'hai raggiunto?
            frame: Il mio ultimo obiettivo era ___. L'ho raggiunto. / Non l'ho raggiunto.
          - question: Cosa hai fatto per raggiungere il tuo ultimo obiettivo?
            frame: Per raggiungere il mio obiettivo, ho ___. Poi ho ___. Alla fine ho ___.
          - question: Come ti sentivi mentre lavoravi per il tuo obiettivo?
            frame: Mentre lavoravo per il mio obiettivo, mi sentivo ___.
          - question: Come ti sei sentito / sentita quando hai raggiunto il tuo obiettivo?
            frame: Quando ho raggiunto il mio obiettivo, mi sono sentito / sentita ___.
          - question: Cosa hai fatto dopo aver raggiunto il tuo obiettivo?
            frame: Dopo aver raggiunto il mio obiettivo, ho ___.
          - question: Dove hai festeggiato?
            frame: Ho festeggiato a / in ___ con ___. Abbiamo mangiato ___ e abbiamo bevuto ___.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: Il mio modello di riferimento'
        skills:
          ['Passato prossimo: obiettivi e risultati', 'Imperfetto: emozioni, abitudini e contesto']
        steps:
          - Scegli una persona che ti ispira per un tuo obiettivo personale. Può essere una persona famosa, un familiare, un insegnante, un amico o qualcuno che conosci.
          - Completa il modello qui sotto. Usa il **passato prossimo** per quello che ha fatto e, quando possibile, l'**imperfetto** per com'era.
          - Presenta la persona al gruppo.
        example: |-
          *Ho scelto Greta Thunberg come mio modello.*
          *Questa persona ha iniziato un movimento globale per parlare dei cambiamenti climatici. Ha organizzato scioperi scolastici e ha parlato davanti a leader mondiali.*
          *Quando era molto giovane, era già molto determinata e non aveva paura di parlare in pubblico.*
          *Penso che questa persona sia un modello per me perché ha dimostrato coraggio, disciplina e determinazione per una causa importante.*
      - id: act1-model
        type: discussionQuestions
        title: Il mio modello
        items:
          - question: Ho scelto ___ come mio modello.
          - question: Questa persona ha fatto molte cose importanti. Per esempio, ha ___, ha ___ e ha ___.
          - question: Quando era giovane / quando lavorava / quando studiava, ___.
          - question: Penso che questa persona sia un modello per me perché ___.
      - id: act2
        type: classActivity
        title: 'Attività 2: Cosa avrei fatto senza di te?'
        skills: ['Passato prossimo: obiettivi e risultati']
        steps:
          - Scegli un'invenzione, uno strumento o una tecnologia che ti ha aiutato nella vita, nello studio o nel lavoro.
          - Completa il modello qui sotto.
          - Presenta la tua invenzione al gruppo.
        wordBank:
          - il telefono cellulare
          - Internet
          - il computer
          - Google Translate
          - YouTube
          - un'applicazione
          - un libro
          - un corso online
          - una bicicletta
          - un'agenda
          - uno strumento di lavoro
        example: |-
          *Questo è il telefono cellulare.*
          *È stato creato da Martin Cooper e dal suo team alla Motorola nel 1973.*
          *Ha aiutato le persone a comunicare velocemente, accedere alle informazioni e organizzare meglio la propria vita.*
          *Personalmente, mi ha aiutato a rimanere in contatto con la mia famiglia, imparare nuove competenze e gestire i miei impegni quotidiani.*
      - id: act2-model
        type: discussionQuestions
        title: La mia invenzione
        items:
          - question: Questo è / Questa è ___.
          - question: È stato creato / È stata creata da ___ nel ___.
          - question: Ha aiutato le persone a ___, ___ e ___.
          - question: Personalmente, mi ha aiutato / aiutata a ___, ___ e ___.
      - id: act3
        type: classActivity
        title: 'Attività 3: Lettera al mio io futuro'
        skills:
          ['Passato prossimo: obiettivi e risultati', 'Imperfetto: emozioni, abitudini e contesto']
        steps:
          - "**Fase 1 (facoltativa):** l'insegnante guida una breve visualizzazione. Chiudi gli occhi e immagina il tuo io futuro dopo aver raggiunto un grande obiettivo."
          - '**Fase 2:** scrivi una lettera al tuo io futuro. Parla di come speri che si sentirà, di chi lo ha aiutato, di cosa hai fatto nel passato per aiutarlo e di cosa stai facendo adesso.'
          - Completa il modello qui sotto. Se vuoi, leggi la tua lettera al gruppo.
      - id: act3-letter
        type: discussionQuestions
        title: Caro io futuro,
        items:
          - question: Spero che quando leggerai questa lettera, ti sentirai ___.
          - question: So che avrai raggiunto il tuo obiettivo e spero che ti ricorderai delle persone che ti hanno aiutato, come ___.
          - question: 'Guardando indietro, ecco cosa ho fatto per aiutarti ad arrivare dove sei ora: ho iniziato con ___.'
          - question: Ho imparato a ___.
          - question: Mi sono impegnato / impegnata a ___.
          - question: Mi sono concentrato / concentrata su ___.
          - question: Mi sono ricordato / ricordata di ___.
          - question: So che non era sempre facile. A volte mi sentivo ___, ma ho continuato perché questo obiettivo era importante per me.
          - question: Sono emozionato / emozionata di vedere cosa hai realizzato. So che tutto quello che sto facendo adesso ti sta aiutando a costruire un futuro migliore. Con affetto, il tuo io presente.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Passato prossimo: obiettivi e risultati**
          (domande di riscaldamento, Attività 1, 2 e 3) e **Imperfetto: emozioni,
          abitudini e contesto** (domande 2 e 4, Attività 1 e 3). Il quaderno non indica
          tempi né combinazioni: per esempio, Attività 1 o 2 + Attività 3. Durante le
          attività, fai usare i connettori *prima, poi, dopo, alla fine, mentre, quando*.
          La presentazione della lezione (Gamma) non è sulla piattaforma.
      - id: n-warmup
        anchor: warmup
        text: Fai almeno due domande a ogni studente. Le risposte scritte qui compaiono sotto ogni domanda.
      - id: n-act1
        anchor: act1
        text: Fai prima l'esempio di Greta Thunberg come modello.
      - id: n-act3
        anchor: act3
        text: >-
          Testo per la visualizzazione (facoltativa), da leggere lentamente: «Chiudi gli
          occhi e immagina il tuo io futuro dopo aver raggiunto un grande obiettivo. Dove
          sei? Come ti senti? Chi è con te? Com'è la tua vita? Cosa hai fatto per arrivare
          lì?»

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: progetti-e-obiettivi-passato-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: rules-pp
        type: ruleSummary
        skill: 'Passato prossimo: obiettivi e risultati'
        rules:
          - text: 'Usiamo il **passato prossimo** per parlare di azioni finite nel passato. Struttura: **avere / essere al presente + participio passato**.'
            examples:
              [
                Ho studiato italiano.,
                Ho raggiunto il mio obiettivo.,
                Abbiamo lavorato molto.,
                Ho iniziato un nuovo progetto.,
              ]
          - text: 'La maggior parte dei verbi usa **avere**.'
            examples:
              [
                Ho studiato ogni giorno per migliorare il mio italiano.,
                Abbiamo raggiunto un obiettivo importante.,
                Ho imparato molte parole nuove.,
              ]
          - text: 'Usiamo **essere** con molti verbi di movimento e di cambiamento e con i verbi riflessivi.'
            examples:
              [
                'Sono andato / andata.',
                'Sono arrivato / arrivata.',
                'Sono diventato / diventata.',
                'Mi sono sentito / sentita.',
                'Mi sono impegnato / impegnata.',
              ]
          - text: '**Attenzione:** con *essere*, il participio cambia secondo il genere e il numero del soggetto.'
            examples:
              [Marco è andato., Anna è andata., Marco e Luca sono andati., Anna e Sara sono andate.]
      - id: pp-table
        type: table
        caption: Passato prossimo con avere
        header: [Persona, studiare, raggiungere, imparare]
        rows:
          - [io, ho studiato, ho raggiunto, ho imparato]
          - [tu, hai studiato, hai raggiunto, hai imparato]
          - [lui / lei, ha studiato, ha raggiunto, ha imparato]
          - [noi, abbiamo studiato, abbiamo raggiunto, abbiamo imparato]
          - [voi, avete studiato, avete raggiunto, avete imparato]
          - [loro, hanno studiato, hanno raggiunto, hanno imparato]
      - id: rules-imperfetto
        type: ruleSummary
        skill: 'Imperfetto: emozioni, abitudini e contesto'
        rules:
          - text: "Usiamo l'**imperfetto** per descrivere com'era una situazione nel passato."
            examples:
              [Il mio obiettivo era difficile., Il mio obiettivo era importante., Non era facile.]
          - text: 'Per parlare di emozioni o stati.'
            examples:
              [
                "Mi sentivo motivato, ma anche un po' stanco.",
                Avevo molta motivazione.,
                Mi sentivo felice.,
              ]
          - text: 'Per parlare di abitudini nel passato.'
            examples: [Studiavo italiano ogni sera., Facevo pratica ogni giorno.]
          - text: 'Per dare il contesto di una storia.'
            examples: ['Quando lavoravo a quel progetto, avevo poco tempo libero.']
      - id: imperfetto-table
        type: table
        caption: Imperfetto
        header: [Persona, studiare, avere, essere]
        rows:
          - [io, studiavo, avevo, ero]
          - [tu, studiavi, avevi, eri]
          - [lui / lei, studiava, aveva, era]
          - [noi, studiavamo, avevamo, eravamo]
          - [voi, studiavate, avevate, eravate]
          - [loro, studiavano, avevano, erano]
      - id: rules-insieme
        type: ruleSummary
        skill: Passato prossimo o imperfetto?
        rules:
          - text: '**Passato prossimo** per azioni finite. **Imperfetto** per descrizioni, emozioni e abitudini.'
            examples:
              [
                'Ho finito il progetto. / Il progetto era difficile.',
                'Ho parlato con il mio insegnante. / Avevo bisogno di aiuto.',
                'Ho studiato ieri. / Studiavo ogni giorno.',
              ]
          - text: 'Spesso li usiamo insieme nella stessa frase.'
            examples:
              - Quando studiavo italiano, ho imparato molte parole nuove.
              - Mi sentivo nervoso, ma ho fatto la presentazione.
              - Il mio obiettivo era difficile, ma l'ho raggiunto.
              - Lavoravo molto, quindi ho deciso di organizzare meglio il mio tempo.
          - text: 'Usiamo i connettori **prima, poi, dopo, alla fine** per mettere in ordine i passi, e **mentre, quando** per collegare due azioni.'
            examples:
              [
                'Prima ho studiato, poi ho fatto pratica e alla fine ho raggiunto il mio obiettivo.',
                'Mentre lavoravo per il mio obiettivo, mi sentivo motivato.',
              ]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le due abilità con la classe e chiedi un esempio nuovo per ogni regola.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: progetti-e-obiettivi-passato-compiti
    title: Compiti
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti
      - id: part1-title
        type: heading
        level: 3
        text: 'Parte 1: Domande e risposte'
      - id: part1
        type: discussionQuestions
        title: Rispondi alle domande con frasi complete.
        items:
          - question: Cosa hai fatto lo scorso fine settimana?
          - question: Hai raggiunto un obiettivo il mese scorso? Come ci sei riuscito / riuscita?
          - question: Cosa hai fatto per imparare una lingua straniera l'anno scorso?
          - question: Come ti sentivi mentre studiavi?
          - question: Chi ti ha aiutato a raggiungere un obiettivo importante?
          - question: Quale strumento o applicazione ti ha aiutato a studiare o lavorare meglio?
      - id: part2-title
        type: heading
        level: 3
        text: 'Parte 2: Scrittura'
      - id: part2
        type: reflection
        prompt: >-
          Scrivi un breve paragrafo di 5–7 frasi sul tuo ultimo obiettivo. Usa almeno 3
          frasi con il **passato prossimo**, 2 frasi con l'**imperfetto** e 2 connettori
          (*prima, poi, dopo, alla fine, quando, mentre*).
      - id: part2-example
        type: callout
        tone: info
        title: Modello
        text: >-
          *Il mio ultimo obiettivo era migliorare il mio italiano. All'inizio studiavo solo
          una volta alla settimana, ma poi ho deciso di praticare di più. Ho guardato video,
          ho letto testi brevi e ho parlato con il mio insegnante. A volte mi sentivo
          stanco, ma ero motivato. Alla fine ho imparato molte parole nuove e mi sono
          sentito più sicuro.*
      - id: part3-title
        type: heading
        level: 3
        text: 'Parte 3: Lettura'
      - id: part3-text
        type: text
        text: >-
          L'anno scorso volevo migliorare la mia salute. All'inizio era difficile, perché
          non avevo molto tempo libero e mi sentivo spesso stanco. Poi ho deciso di cambiare
          alcune abitudini. Ho iniziato a camminare tre volte alla settimana, ho mangiato
          più verdure e ho dormito meglio. Dopo alcuni mesi, mi sono sentito più energico e
          ho raggiunto il mio obiettivo. Alla fine, ho festeggiato con la mia famiglia in un
          piccolo ristorante.
      - id: part3
        type: discussionQuestions
        title: Leggi il testo e rispondi alle domande.
        items:
          - question: Qual era l'obiettivo della persona?
          - question: Perché all'inizio era difficile?
          - question: Cosa ha fatto per raggiungere l'obiettivo?
          - question: Come si è sentita dopo alcuni mesi?
          - question: Dove ha festeggiato?
      - id: mori-title
        type: heading
        level: 3
        text: Pratica con Mori
      - id: mori-obiettivo
        type: aiTutorPrompt
        title: Il mio ultimo obiettivo
        intro: Apri la chat con Mori, copia questo messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
        message: >-
          Ciao Mori! Voglio praticare il passato prossimo e l'imperfetto. Fammi domande,
          una alla volta, su un obiettivo che ho raggiunto nel passato: cosa ho fatto per
          raggiungerlo, come mi sentivo, chi mi ha aiutato e dove ho festeggiato. Correggi
          i miei errori, per favore.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**
    teacherNotes:
      - id: n-part3
        anchor: part3
        text: >-
          Risposte: 1. Voleva migliorare la sua salute. 2. Perché non aveva molto tempo
          libero e si sentiva spesso stanco. 3. Ha camminato tre volte alla settimana, ha
          mangiato più verdure e ha dormito meglio. 4. Si è sentito più energico. 5. In un
          piccolo ristorante, con la sua famiglia. (Nella domanda 4, *sentita* si riferisce a
          *la persona*; nella risposta va bene *si è sentito*.)

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: progetti-e-obiettivi-passato-pratica
    book: workbook
    title: 'Pratica: Progetti e obiettivi (passato)'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Esercitati sulle due abilità del ciclo. Ogni risposta viene corretta subito e puoi riprovare.
      - id: ex-passato-prossimo
        type: activity
        activity: progetti-e-obiettivi-passato-passato-prossimo
      - id: ex-imperfetto
        type: activity
        activity: progetti-e-obiettivi-passato-imperfetto

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: progetti-e-obiettivi-passato-vocabolario
    title: Vocabolario
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Frasi utili su progetti e obiettivi
        glossLang: he
        link: https://quizlet.com/br/1191221525/progetti-e-obiettivi-passato-flash-cards/
        items: &progetti-e-obiettivi-passato-words
          - { term: Ho raggiunto un obiettivo, gloss: השגתי מטרה }
          - { term: "Non ho raggiunto l'obiettivo", gloss: לא השגתי את המטרה }
          - { term: Hai raggiunto il tuo obiettivo?, gloss: האם השגת את המטרה שלך? }
          - { term: Lei ha iniziato un progetto, gloss: היא התחילה פרויקט }
          - { term: Noi abbiamo lavorato molto, gloss: אנחנו עבדנו הרבה }
          - { term: Loro hanno studiato molto, gloss: הם / הן למדו הרבה }
          - { term: Io ho imparato molto, gloss: אני למדתי הרבה }
          - { term: Tu hai migliorato il tuo italiano, gloss: אתה / את שיפרת את האיטלקית שלך }
          - { term: Marco ha fatto pratica, gloss: מרקו תרגל }
          - { term: Anna ha guardato video, gloss: אנה צפתה בסרטונים }
          - { term: Abbiamo letto testi brevi, gloss: קראנו טקסטים קצרים }
          - {
              term: "Voi avete parlato con l'insegnante",
              gloss: אתם / אתן דיברתם / דיברתן עם המורה,
            }
          - { term: Ho deciso di studiare di più, gloss: החלטתי ללמוד יותר }
          - { term: Lei ha organizzato il suo tempo, gloss: היא ארגנה את הזמן שלה }
          - { term: "Abbiamo usato un'app", gloss: השתמשנו באפליקציה }
          - { term: "L'app mi ha aiutato", gloss: האפליקציה עזרה לי }
          - { term: Internet ci ha aiutato, gloss: האינטרנט עזר לנו }
          - { term: Il corso ha aiutato gli studenti, gloss: הקורס עזר לתלמידים }
          - { term: Ho scelto un modello, gloss: בחרתי מודל לחיקוי }
          - { term: Maria ha scelto sua madre come modello, gloss: מריה בחרה באמא שלה כמודל לחיקוי }
          - { term: Lui ha fatto cose importanti, gloss: הוא עשה דברים חשובים }
          - { term: Lei ha parlato in pubblico, gloss: היא דיברה בציבור }
          - { term: Questa persona ha dimostrato coraggio, gloss: האדם הזה הראה אומץ }
          - { term: Greta ha iniziato un movimento, gloss: גרטה התחילה תנועה }
          - { term: Ho avuto motivazione, gloss: הייתה לי מוטיבציה }
          - { term: Abbiamo avuto difficoltà, gloss: היו לנו קשיים }
          - { term: Tu hai ricevuto aiuto, gloss: אתה / את קיבלת עזרה }
          - { term: Loro hanno ricevuto sostegno, gloss: הם / הן קיבלו תמיכה }
          - { term: Io ho provato di nuovo, gloss: אני ניסיתי שוב }
          - { term: Noi abbiamo continuato, gloss: אנחנו המשכנו }
          - { term: Mi sono sentito / sentita felice, gloss: הרגשתי שמח / שמחה }
          - { term: Lei si è sentita stanca, gloss: היא הרגישה עייפה }
          - { term: Marco si è impegnato molto, gloss: מרקו התאמץ מאוד }
          - { term: "Anna si è concentrata sull'obiettivo", gloss: אנה התרכזה במטרה }
          - { term: Noi ci siamo ricordati del piano, gloss: אנחנו זכרנו את התוכנית }
          - { term: Abbiamo festeggiato insieme, gloss: חגגנו יחד }

vocabulary:
  - slug: progetti-e-obiettivi-passato
    title: 'Progetti e obiettivi: passato'
    items: *progetti-e-obiettivi-passato-words

activities:
  - slug: progetti-e-obiettivi-passato-passato-prossimo
    title: 'Passato prossimo: ho raggiunto, sono andato'
    minutes: 8
    items:
      - id: ho-raggiunto
        type: multipleChoice
        prompt: "L'anno scorso ___ il mio obiettivo."
        options:
          - { text: ho raggiunto, correct: true }
          - { text: sono raggiunto, feedback: '*Raggiungere* usa *avere*: *ho raggiunto*.' }
          - {
              text: ho raggiungito,
              feedback: 'Il participio di *raggiungere* è irregolare: *raggiunto*.',
            }
      - id: anna-andata
        type: fillBlank
        prompt: Completa con il passato prossimo di *andare*.
        text: Ieri Anna ___ al corso.
        blanks: [[è andata]]
      - id: unisci-avere
        type: matching
        prompt: Unisci ogni persona alla forma giusta di *studiare*.
        pairs:
          - [io, ho studiato]
          - [tu, hai studiato]
          - [lui / lei, ha studiato]
          - [noi, abbiamo studiato]
          - [loro, hanno studiato]
      - id: sono-andati
        type: multipleChoice
        prompt: Marco e Luca ___ in Italia.
        options:
          - { text: sono andati, correct: true }
          - {
              text: sono andato,
              feedback: 'Con *essere*, il participio cambia secondo il numero: Marco e Luca sono due persone, quindi *andati*.',
            }
          - {
              text: hanno andato,
              feedback: '*Andare* è un verbo di movimento: usa *essere*, *sono andati*.',
            }
      - id: accordo
        type: trueFalse
        prompt: 'Con *essere*, il participio cambia secondo il genere e il numero: *Anna è andata*.'
        answer: true
        feedback:
          correct: 'Giusto! *Marco è andato, Anna è andata, Anna e Sara sono andate.*'
          incorrect: 'Con *essere*, il participio cambia: *Marco è andato*, ma *Anna è andata*.'
      - id: si-e-sentita
        type: fillBlank
        prompt: Completa con il passato prossimo di *sentirsi*.
        text: Dopo alcuni mesi Sara si ___ più energica.
        blanks: [[è sentita]]
      - id: si-e-impegnato
        type: multipleChoice
        prompt: Marco ___ molto per il suo obiettivo.
        options:
          - { text: si è impegnato, correct: true }
          - {
              text: ha impegnato,
              feedback: '*Impegnarsi* è un verbo riflessivo: usa *essere*, *si è impegnato*.',
            }
          - {
              text: si è impegnata,
              feedback: '*Impegnata* è femminile. Marco è un uomo: *si è impegnato*.',
            }
      - id: ordina-festeggiato
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Abbiamo festeggiato con la nostra famiglia.

  - slug: progetti-e-obiettivi-passato-imperfetto
    title: 'Imperfetto o passato prossimo?'
    minutes: 8
    items:
      - id: mi-sentivo
        type: multipleChoice
        prompt: Mentre lavoravo per il mio obiettivo, mi ___ stanco.
        options:
          - { text: sentivo, correct: true }
          - {
              text: sentirò,
              feedback: "*Sentirò* è il futuro. Per un'emozione nel passato usiamo l'imperfetto: *mi sentivo*.",
            }
          - {
              text: sento,
              feedback: '*Sento* è il presente. La frase parla del passato (*lavoravo*): *mi sentivo*.',
            }
      - id: era-era
        type: fillBlank
        prompt: Completa con l'imperfetto di *essere*.
        text: Quando ___ molto giovane, Greta ___ già molto determinata.
        blanks: [[era], [era]]
      - id: usi
        type: matching
        prompt: Unisci ogni frase al suo uso.
        pairs:
          - [Studiavo italiano ogni sera., un'abitudine nel passato]
          - [Mi sentivo felice., un'emozione nel passato]
          - [Il progetto era difficile., la descrizione di una situazione]
          - [Ho finito il progetto., un'azione finita]
      - id: ho-studiato-ieri
        type: trueFalse
        prompt: "La frase *Ho studiato ieri* è all'imperfetto."
        answer: false
        feedback:
          correct: "Giusto! *Ho studiato* è il passato prossimo: un'azione finita."
          incorrect: "*Ho studiato* è il passato prossimo (*avere* + participio). L'imperfetto è *studiavo*."
      - id: studiavo-avevo
        type: fillBlank
        prompt: Completa con l'imperfetto di *studiare* e *avere*.
        text: All'inizio io ___ solo una volta alla settimana, perché non ___ molto tempo libero.
        blanks: [[studiavo], [avevo]]
      - id: ho-fatto
        type: multipleChoice
        prompt: Mi sentivo nervoso, ma ___ la presentazione.
        options:
          - { text: ho fatto, correct: true }
          - {
              text: facevo,
              feedback: "Qui è un'azione finita, una volta sola: usiamo il passato prossimo, *ho fatto*.",
            }
          - {
              text: faccio,
              feedback: '*Faccio* è il presente. La frase parla del passato: *ho fatto*.',
            }
      - id: quando
        type: multipleChoice
        prompt: ___ studiavo italiano, ho imparato molte parole nuove.
        options:
          - { text: Quando, correct: true }
          - {
              text: Alla fine,
              feedback: "*Alla fine* indica l'ultimo passo, non collega due azioni. Usiamo *Quando*.",
            }
          - {
              text: Poi,
              feedback: "*Poi* indica il passo dopo. Per collegare il contesto (*studiavo*) e l'azione (*ho imparato*) usiamo *Quando*.",
            }
      - id: ordina-difficile
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Il mio obiettivo era difficile, ma l'ho raggiunto.
