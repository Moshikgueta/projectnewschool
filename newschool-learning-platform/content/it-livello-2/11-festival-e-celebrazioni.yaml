vocabulary:
  - slug: festival-e-celebrazioni
    title: Festival e celebrazioni
    items: *festival-e-celebrazioni-words

activities:
  - slug: festival-e-celebrazioni-imperativo
    title: 'Imperativo: porta, assaggia, non dimenticare'
    minutes: 8
    items:
      - id: porta
        type: multipleChoice
        prompt: "___ una bottiglia d'acqua."
        options:
          - { text: Porta, correct: true }
          - {
              text: Porti,
              feedback: "Con *tu*, l'imperativo dei verbi in *-are* finisce in *-a*: *porta*.",
            }
          - {
              text: Portare,
              feedback: "L'infinito si usa solo nell'imperativo negativo (*Non portare…*). Qui diciamo *Porta*.",
            }
      - id: assaggia
        type: fillBlank
        prompt: Completa con l'imperativo di *assaggiare* (tu).
        text: ___ il cibo tipico del festival.
        blanks: [[Assaggia]]
      - id: non-dimenticare
        type: multipleChoice
        prompt: ___ il biglietto!
        options:
          - { text: Non dimenticare, correct: true }
          - {
              text: Non dimentica,
              feedback: "L'imperativo negativo con *tu* è *non* + infinito: *Non dimenticare*.",
            }
          - {
              text: Dimenticare non,
              feedback: '*Non* va prima del verbo: *Non dimenticare il biglietto.*',
            }
      - id: trasforma
        type: fillBlank
        prompt: 'Trasforma la frase con *non* + infinito: *Arriva in ritardo.*'
        text: ___ in ritardo.
        blanks: [[Non arrivare]]
      - id: regola-negativo
        type: trueFalse
        prompt: 'Per dire a un amico di non fare qualcosa usiamo *non* + infinito: *Non perdere la parata.*'
        answer: true
        feedback:
          correct: 'Giusto! *Non perdere, non dimenticare, non arrivare.*'
          incorrect: "L'imperativo negativo con *tu* è *non* + infinito: *Non perdere la parata.*"
      - id: situazioni
        type: matching
        prompt: Unisci ogni situazione al consiglio giusto.
        pairs:
          - [Piove durante il festival., Compra un ombrello.]
          - [Ti sei perso nel centro della città., Cerca un punto informazioni.]
          - ['Hai fame, ma non conosci il cibo locale.', Assaggia qualcosa di tipico.]
          - [C'è troppa folla., Trova un posto tranquillo.]
      - id: vieni
        type: multipleChoice
        prompt: ___ al festival! (venire)
        options:
          - { text: Vieni, correct: true }
          - { text: Veni, feedback: '*Venire* è irregolare: con *tu* diciamo *vieni*.' }
          - {
              text: Viene,
              feedback: '*Viene* è per *lui / lei*. Per dare un consiglio a un amico (tu) diciamo *vieni*.',
            }
      - id: ordina-prenota
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Prenota il biglietto in anticipo.

  - slug: festival-e-celebrazioni-tempi
    title: 'Passato, presente e futuro: ho partecipato, celebro, parteciperò'
    minutes: 8
    items:
      - id: ho-partecipato
        type: multipleChoice
        prompt: "L'anno scorso ___ al Carnevale."
        options:
          - { text: ho partecipato, correct: true }
          - {
              text: parteciperò,
              feedback: "*Parteciperò* è futuro. Con *l'anno scorso* usiamo il passato prossimo: *ho partecipato*.",
            }
          - {
              text: partecipo,
              feedback: "*Partecipo* è presente. Con *l'anno scorso* usiamo il passato prossimo: *ho partecipato*.",
            }
      - id: portero
        type: multipleChoice
        prompt: "L'anno prossimo ___ i miei amici al festival."
        options:
          - { text: porterò, correct: true }
          - {
              text: ho portato,
              feedback: "*Ho portato* è passato. Con *l'anno prossimo* usiamo il futuro: *porterò*.",
            }
          - { text: porterà, feedback: '*Porterà* è per *lui / lei*. Per *io* diciamo *porterò*.' }
      - id: vestita
        type: fillBlank
        prompt: Sara racconta il suo Purim. Completa con il participio di *vestirsi*.
        text: "L'anno scorso mi sono ___ da strega."
        blanks: [[vestita]]
      - id: celebro
        type: fillBlank
        prompt: Completa con il presente di *celebrare*.
        text: Ogni anno ___ Pesach con la mia famiglia.
        blanks: [[celebro, io celebro]]
      - id: presente-tradizioni
        type: trueFalse
        prompt: 'Per descrivere una tradizione (quello che le persone fanno di solito) usiamo il presente: *Le persone ballano nelle strade.*'
        answer: true
        feedback:
          correct: 'Giusto! Il presente descrive quello che succede di solito.'
          incorrect: 'Per le tradizioni e le abitudini usiamo il presente: *Le persone ballano nelle strade.*'
      - id: futuro-io
        type: matching
        prompt: Unisci ogni verbo alla sua forma di *io* al futuro.
        pairs:
          - [partecipare, parteciperò]
          - [celebrare, celebrerò]
          - [festeggiare, festeggerò]
          - [assaggiare, assaggerò]
          - [dimenticare, dimenticherò]
      - id: saranno
        type: multipleChoice
        prompt: "L'anno prossimo ci ___ molti concerti."
        options:
          - { text: saranno, correct: true }
          - { text: sarà, feedback: '*Concerti* è plurale: *ci saranno molti concerti*.' }
          - {
              text: sono stati,
              feedback: "*Sono stati* è passato. Con *l'anno prossimo* usiamo il futuro: *ci saranno*.",
            }
      - id: ordina-partecipero
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: "L'anno prossimo parteciperò a un festival."
