# Cycle "Festival e celebrazioni", converted from the Italian level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-2
slug: festival-e-celebrazioni
title: Festival e celebrazioni
goal: Dare consigli con l'imperativo e raccontare le feste al passato, al presente e al futuro.
position: 11
status: in_review

review:
  - >-
    The two workbook exercises ("Imperativo" and "Passato, presente e futuro") are
    NEW: the notebook has no self-correcting exercises. They were written from the
    cycle's summary rules, examples and vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Skills: the notebook lists five abilities and five grammar points. The cycle
    overview keeps two skills: "Imperativo" (tu, affirmative and negative) and
    "Passato, presente e futuro" (passato prossimo for experiences, presente for
    traditions, futuro for plans).
  - >-
    Summary, imperativo: the notebook gives examples but no rule for the affirmative
    form. A rule was ADDED: with tu, -are verbs end in -a (porta, assaggia), -ere / -ire
    verbs in -i (prendi, scopri); venire → vieni is irregular. The negative rule (non +
    infinitive) is kept. Please confirm.
  - >-
    Summary, passato prossimo: a short rule on avere / essere was ADDED (ho partecipato
    / sono andato, andata; with essere and reflexive verbs the participle agrees: mi
    sono vestito / vestita). Please confirm.
  - >-
    The "Preparazione grammaticale" block in class and the Hebrew summary repeat the
    same imperativo examples. The examples are kept once in class (with Hebrew glosses)
    and the rules once in the summary. The Hebrew summary was rewritten in Italian;
    Hebrew translations are kept as glosses.
  - >-
    Corrections: warm-up 2 "Come ti sei vestito / vestita l'ultima volta?" → "Da che
    cosa ti sei vestito / vestita l'ultima volta?" (the model answers are about
    costumes); Activity 5 "Festival Awards" (English) → "Premi dei festival"; Mori part
    2 "una domanda di follow-up" (English) → "un'altra domanda"; Mori part 4 "finché
    uso correttamente" → "finché non uso correttamente"; homework part 5 "Inventate…
    Scrivete" (plural, but it is individual homework) → "Inventa… Scrivi".
  - >-
    The lesson slides are a gamma.app link, which is not allowed on the platform; the
    link was left out and a teacher note says so. The Quizlet link is kept without its
    "?new" parameter. The "Risposta studente 1/2/3" lines and the empty answer lines
    are replaced by answer boxes.
  - >-
    The notebook has no lesson plan and no activity times, so no minutes are recorded
    (Activity 5 presentations "1-2 minuti" are written as 1–2 minutes in the steps).
    The teacher note suggests choosing 2–3 of the 5 activities; please confirm.
  - >-
    The notebook's "Note per l'insegnante" and the answer key for written homework
    parts 1–2 ("Risposte possibili per l'insegnante") are kept as teacher notes. The
    Mori messages ("Studente a Mori:" followed by several lines) are joined into one
    message per part.
  - >-
    Activity 4 (invitation) uses "Monaco" for Munich, as in the source; you may prefer
    "Monaco di Baviera" to avoid confusion with Monaco (the country).
  - >-
    Vocabulary: terms are written in lower case, and the verb rows as "infinitive
    (future forms)", e.g. "usare (userò / userai / useranno)", instead of "Usare -
    userò / userai / useranno"; the Hebrew glosses are unchanged.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: festival-e-celebrazioni-classe
    title: 'In classe: Festival e celebrazioni'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Festival e celebrazioni
      - id: skills
        type: cycleOverview
        skills:
          - name: Imperativo
            description: 'Consigli, istruzioni e inviti con *tu*: *Porta… Assaggia… Vieni…* / *Non dimenticare…*'
          - name: Passato, presente e futuro
            description: '*Ho partecipato…* (esperienze), *Ogni anno celebro…* (tradizioni), *Parteciperò…* (programmi)'
      - id: quizlet
        type: externalLink
        label: Festival e celebrazioni su Quizlet
        url: https://quizlet.com/br/1189032357/festival-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Giro di presentazioni
      - id: intro
        type: sentenceFrame
        prompt: Ogni studente dice 3 frasi.
        frame: Mi chiamo ___. Mi piace la festa di ___. Per il prossimo Purim / Halloween / Carnevale mi vestirò da ___.
        example: Mi chiamo Marco. Mi piace il Carnevale. Per il prossimo Carnevale mi vestirò da pirata.
      - id: grammar-title
        type: heading
        level: 3
        text: "Preparazione grammaticale: l'imperativo"
      - id: grammar-use
        type: text
        text: "Usiamo l'imperativo per dare consigli, dare istruzioni, invitare qualcuno, dire a una persona cosa fare e dare raccomandazioni pratiche. Per dire a una persona di **non** fare qualcosa usiamo **non + infinito**."
      - id: grammar-examples
        type: examples
        items:
          - { text: Vieni al festival!, gloss: בוא לפסטיבל! }
          - { text: "Porta una bottiglia d'acqua.", gloss: תביא בקבוק מים. }
          - { text: Assaggia il cibo tipico., gloss: תטעם את האוכל המסורתי. }
          - { text: Prenota il biglietto in anticipo., gloss: תזמין את הכרטיס מראש. }
          - { text: Arriva presto., gloss: תגיע מוקדם. }
          - { text: Non dimenticare il biglietto., gloss: אל תשכח את הכרטיס. }
          - { text: Non arrivare in ritardo., gloss: אל תאחר. }
          - { text: Non perdere la parata., gloss: אל תפספס את המצעד. }
          - { text: Non portare troppe cose., gloss: אל תביא יותר מדי דברים. }
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di preparazione
      - id: warmup
        type: discussionQuestions
        items:
          - question: A quale festa o festival hai partecipato?
            frame: Ho partecipato al Carnevale di Rio.
          - question: "Da che cosa ti sei vestito / vestita l'ultima volta?"
            frame: Mi sono vestito da vampiro. / Mi sono vestita da strega.
          - question: C'è una festa che celebri ogni anno?
            frame: Sì, ogni anno celebro Pesach con la mia famiglia.
          - question: A quale festival parteciperai in futuro?
            frame: In futuro parteciperò a un festival musicale in Italia.
          - question: "Che cosa hai mangiato o bevuto all'ultima festa?"
            frame: Ho mangiato dolci tradizionali e ho bevuto vino.
          - question: Qual è la festa più interessante che conosci?
            frame: Secondo me, il Carnevale di Venezia è molto interessante perché le maschere sono bellissime.
          - question: "Quali consigli puoi dare a una persona che va a un festival per la prima volta? Rispondi con l'imperativo."
            frame: Porta scarpe comode. Non dimenticare il biglietto.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Attività 1: Se vai a questo festival…'
        skills: [Imperativo, 'Passato, presente e futuro']
        steps:
          - Lavorate in coppia o in piccoli gruppi.
          - 'Fase 1: scegliete un festival: Carnevale di Venezia, Carnevale di Rio, Oktoberfest, Diwali, Capodanno cinese, Purim, Halloween, Festa della Musica, Festival di Sanremo o un altro festival che conoscete.'
          - 'Fase 2: completate le informazioni sul festival.'
          - "Fase 3: scrivete 5 consigli con l'imperativo per una persona che visita il festival per la prima volta."
          - 'Fase 4: ogni gruppo presenta il festival e i consigli alla classe.'
        example: |-
          *Il nostro festival è il Carnevale di Venezia.*
          *Si celebra in Italia.*
          *Durante il festival, le persone indossano maschere e costumi eleganti.*
          *Se vai a questo festival, porta scarpe comode.*
          *Prenota l'hotel in anticipo.*
          *Non dimenticare la macchina fotografica.*
          *Assaggia il cibo locale.*
          *Arriva presto per vedere la parata.*
        wordBank:
          - Porta scarpe comode.
          - Prenota il biglietto in anticipo.
          - Assaggia il cibo tipico.
          - Arriva presto.
          - Non perdere la parata.
          - Non dimenticare la macchina fotografica.
      - id: act1-info
        type: discussionQuestions
        title: Il nostro festival
        items:
          - question: 'Il nostro festival è: ___'
          - question: 'Si celebra in: ___'
          - question: "Il periodo dell'anno è: ___"
          - question: Che cosa fanno le persone durante questo festival? (3 cose)
          - question: Che cosa si mangia o si beve? (2 cose)
          - question: Che cosa è importante sapere? (2 cose)
      - id: act1-tips
        type: discussionQuestions
        title: I nostri consigli
        items:
          - question: Consiglio 1
          - question: Consiglio 2
          - question: Consiglio 3
          - question: Consiglio 4
          - question: Consiglio 5
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Attività 2: Situazioni impreviste al festival'
        skills: [Imperativo]
        steps:
          - "L'insegnante legge una situazione."
          - "Gli studenti danno uno o due consigli usando l'imperativo."
        wordBank:
          - Chiama un amico.
          - Cerca un punto informazioni.
          - Compra un ombrello.
          - Non andare da solo.
          - Non perdere il gruppo.
          - Chiedi aiuto.
          - Assaggia qualcosa di tipico.
          - Trova un posto tranquillo.
      - id: act2-situations
        type: discussionQuestions
        title: Situazioni
        items:
          - question: Hai dimenticato il biglietto a casa.
            frame: 'Consiglio: ___'
          - question: Piove durante il festival.
            frame: 'Consiglio: ___'
          - question: Ti sei perso / persa nel centro della città.
            frame: 'Consiglio: ___'
          - question: Hai dimenticato il portafoglio.
            frame: 'Consiglio: ___'
          - question: C'è troppa folla.
            frame: 'Consiglio: ___'
          - question: Hai fame, ma non conosci il cibo locale.
            frame: 'Consiglio: ___'
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Attività 3: Le mie feste speciali'
        skills: ['Passato, presente e futuro', Imperativo]
        steps:
          - 'Scegli una festa importante per te: una festa religiosa, nazionale, tradizionale o moderna, un compleanno, una festa di famiglia, un festival musicale.'
          - 'Parte 1: rispondi alle domande qui sotto.'
          - 'Parte 2: intervista un compagno. Usa almeno 5 domande utili.'
          - 'Parte 3: presenta alla classe la festa del tuo compagno.'
        example: |-
          *La festa preferita di David è Purim.*
          *Di solito la celebra con la famiglia e gli amici.*
          *L'anno scorso si è vestito da pirata.*
          *Ha mangiato dolci tradizionali.*
          *L'anno prossimo parteciperà a una festa con amici.*
          *Il suo consiglio è: porta un costume divertente!*
      - id: act3-general
        type: discussionQuestions
        title: Informazioni generali
        items:
          - question: Qual è la festa?
          - question: Quando si celebra?
          - question: Dove si celebra?
          - question: Con chi la celebri?
      - id: act3-traditions
        type: discussionQuestions
        title: Tradizioni (presente)
        items:
          - question: Che cosa fate di solito?
          - question: Che cosa mangiate?
          - question: Ci sono vestiti speciali?
          - question: C'è musica?
      - id: act3-past
        type: discussionQuestions
        title: Esperienza personale (passato)
        items:
          - question: "L'ultima volta, che cosa hai fatto?"
          - question: Che cosa hai mangiato?
          - question: Con chi eri?
          - question: Ti sei divertito / divertita?
      - id: act3-future
        type: discussionQuestions
        title: Futuro
        items:
          - question: "L'anno prossimo, come celebrerai questa festa?"
          - question: Che cosa porterai?
          - question: Chi inviterai?
      - id: act3-interview
        type: callout
        tone: info
        title: Domande utili per l'intervista
        text: |-
          Qual è la tua festa preferita?
          Quando si celebra?
          Con chi la celebri?
          Che cosa mangi di solito?
          Come hai celebrato questa festa l'anno scorso?
          Come la celebrerai l'anno prossimo?
          Quale consiglio puoi dare a una persona che partecipa per la prima volta?
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Attività 4: Crea un invito a un festival'
        skills: [Imperativo]
        steps:
          - Lavora da solo o con un compagno. Scegli un festival reale o inventato.
          - "L'invito deve avere: il nome del festival, il luogo, il periodo, le attività, il cibo o la musica e almeno 5 imperativi."
          - Scrivi il titolo e il testo dell'invito qui sotto.
          - Leggi il tuo invito alla classe. Gli altri studenti fanno domande.
        example: |-
          **Sei invitato all'Oktoberfest!**
          *Vieni a Monaco e scopri una festa famosa in tutto il mondo.*
          *Visita la città tra settembre e ottobre.*
          *Indossa un costume tradizionale.*
          *Assaggia i pretzel e il cibo tipico.*
          *Ascolta musica dal vivo.*
          *Porta i tuoi amici.*
          *Non perdere questa esperienza speciale!*
        wordBank:
          - Vieni a…
          - Scopri…
          - Visita…
          - Porta…
          - Indossa…
          - Assaggia…
          - Ascolta…
          - Partecipa a…
          - Prenota…
          - Non perdere…
          - Non dimenticare…
      - id: act4-invite
        type: discussionQuestions
        title: Il tuo invito
        items:
          - question: 'Titolo: ___'
          - question: "Testo dell'invito:"
      - id: act4-questions
        type: callout
        tone: info
        title: Domande possibili
        text: |-
          Dove si svolge il festival? Quando si svolge?
          Quanto costa il biglietto?
          Che cosa possiamo mangiare? Che musica ci sarà?
          È adatto alle famiglie?
          Perché dovrei partecipare?
      # Activity 5
      - id: act5
        type: classActivity
        title: 'Attività 5: Il mio festival ideale'
        skills: ['Passato, presente e futuro', Imperativo]
        steps:
          - Lavorate in gruppi e inventate un nuovo festival.
          - Completate le informazioni qui sotto.
          - "Scrivete almeno una frase al passato, una al presente, una al futuro e tre frasi con l'imperativo."
          - Ogni gruppo presenta il proprio festival in 1–2 minuti. La classe fa almeno 3 domande.
          - "Premi dei festival: la classe vota il festival più originale, più divertente, più interessante, il festival che vorrei visitare e il festival con l'idea migliore."
        example: |-
          *Il nostro festival si chiamerà ColorFest.*
          *Si svolgerà a Firenze in primavera.*
          *L'idea è nata dopo un viaggio in Brasile.*
          *Oggi il festival celebra musica, arte e cibo internazionale.*
          *L'anno prossimo parteciperanno molti artisti giovani.*
          *Ci saranno concerti, laboratori e cibo tipico.*
          *Vieni al nostro festival! Porta i tuoi amici. Non perdere la parata finale!*
      - id: act5-info
        type: discussionQuestions
        title: Il nostro festival
        items:
          - question: 'Nome del festival: ___'
          - question: 'Città / luogo: ___'
          - question: "Periodo dell'anno: ___"
          - question: 'Tema del festival: ___'
          - question: 'Tipo di musica: ___'
          - question: 'Cibo tipico: ___'
          - question: 'Attività principali (3): ___'
          - question: 'Il festival è per: ___'
      - id: act5-models
        type: callout
        tone: info
        title: Modelli
        text: |-
          **Passato:** *L'idea è nata dopo un viaggio in Italia. L'anno scorso abbiamo visitato un festival molto bello. Abbiamo scelto questo tema perché ci piace la musica.*
          **Presente:** *Oggi il festival celebra la cultura, la musica e il cibo. Le persone ballano, mangiano e ascoltano musica. Il festival è colorato e divertente.*
          **Futuro:** *L'anno prossimo molte persone parteciperanno. Ci saranno concerti e spettacoli. Inviteremo artisti di diversi paesi.*
          **Imperativo:** *Vieni al nostro festival! Porta i tuoi amici. Assaggia il cibo tipico. Non perdere il concerto principale. Prenota il biglietto in anticipo.*
      - id: act5-questions
        type: callout
        tone: info
        title: Domande dal pubblico
        text: |-
          Dove si svolgerà il festival?
          Quanto costerà il biglietto?
          Che tipo di musica ci sarà?
          Chi parteciperà?
          Perché avete scelto questa città?
          Qual è l'attività più interessante?
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Imperativo** (Attività 1, 2 e 4) e **Passato,
          presente e futuro** (Attività 3 e 5, che usano anche l'imperativo). Scegli 2 o
          3 attività secondo il tempo e il gruppo. Il quaderno non indica i tempi.
      - id: n-slides
        anchor: null
        text: >-
          Il quaderno ha una presentazione della lezione su gamma.app. Questo tipo di
          link non è permesso nella piattaforma: se vuoi usarla, condividila tu sullo
          schermo.
      - id: n-a2
        anchor: null
        text: >-
          Per il livello A2 è meglio mantenere le frasi brevi e pratiche. Evita domande
          troppo astratte (*Che valore culturale ha questa celebrazione nella società
          moderna?*) e usa domande concrete: *Che cosa fanno le persone? Che cosa
          mangiano? Che musica ascoltano? Che cosa hai fatto l'anno scorso? Che cosa farai
          l'anno prossimo? Quale consiglio puoi dare?*
      - id: n-imperativo
        anchor: grammar-examples
        text: >-
          Per l'imperativo concentrati sulla forma informale con **tu**: *porta, assaggia,
          vieni, guarda, compra, prenota, non dimenticare, non perdere, non arrivare*. Non
          è necessario introdurre l'imperativo formale con **Lei** in questa lezione.
      - id: n-intro
        anchor: intro
        text: Fai prima il tuo esempio e poi chiedi a ogni studente.
      - id: n-warmup
        anchor: warmup
        text: Fai almeno due domande a ogni studente. Le risposte scritte qui compaiono sotto ogni domanda.
      - id: n-act2
        anchor: act2
        text: Leggi una situazione alla volta. Gli studenti possono usare i modelli utili (Chiama un amico, Compra un ombrello…).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: festival-e-celebrazioni-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: rules-imperativo
        type: ruleSummary
        skill: Imperativo
        rules:
          - text: "Usiamo l'**imperativo** per dare istruzioni, consigli, inviti o raccomandazioni."
            examples:
              - Vieni al festival!
              - "Porta una bottiglia d'acqua."
              - Assaggia il cibo tipico.
              - Prenota il biglietto in anticipo.
          - text: 'Con **tu**, i verbi in **-are** finiscono in **-a**; i verbi in **-ere** e **-ire** finiscono in **-i**. *Venire* è irregolare: **vieni**.'
            examples:
              [
                'portare → porta',
                'assaggiare → assaggia',
                'prendere → prendi',
                'scoprire → scopri',
                'venire → vieni',
              ]
          - text: 'Per dire a una persona di **non** fare qualcosa usiamo **non + infinito**.'
            examples:
              [Non dimenticare il biglietto., Non arrivare in ritardo., Non perdere la parata.]
      - id: rules-tempi
        type: ruleSummary
        skill: Passato, presente e futuro
        rules:
          - text: "Il **passato prossimo** racconta un'esperienza che è già successa: *avere* o *essere* + participio. Con *essere* e con i verbi riflessivi il participio cambia (maschile / femminile)."
            examples:
              - "L'anno scorso ho partecipato al Carnevale."
              - Ho ascoltato musica dal vivo.
              - Mi sono vestito da pirata. / Mi sono vestita da strega.
          - text: 'Il **presente** descrive quello che succede di solito o adesso (le tradizioni).'
            examples:
              [
                Le persone ballano nelle strade.,
                Tutti festeggiano insieme.,
                Il festival è molto colorato.,
              ]
          - text: 'Il **futuro semplice** parla dei programmi.'
            examples:
              [
                "L'anno prossimo parteciperò a un festival.",
                Porterò i miei amici.,
                Ci saranno molti concerti.,
              ]
          - text: 'Possiamo raccontare una storia breve con i tre tempi.'
            examples:
              - "L'anno scorso ho visitato il Carnevale di Venezia. Oggi guardo le foto del festival. L'anno prossimo tornerò con i miei amici."
      - id: useful-title
        type: heading
        level: 3
        text: Frasi utili
      - id: useful
        type: examples
        items:
          - { text: Ho partecipato a…, gloss: השתתפתי ב… }
          - { text: Mi sono vestito / vestita da…, gloss: התחפשתי ל… }
          - { text: Ogni anno celebro…, gloss: כל שנה אני חוגג / חוגגת… }
          - { text: "L'anno prossimo parteciperò a…", gloss: בשנה הבאה אשתתף ב… }
          - { text: Vieni al festival!, gloss: בוא לפסטיבל! }
          - { text: Porta i tuoi amici!, gloss: תביא את החברים שלך! }
          - { text: Assaggia il cibo tipico!, gloss: תטעם את האוכל המסורתי! }
          - { text: Non perdere questo evento!, gloss: אל תפספס את האירוע הזה! }
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le due abilità con la classe e chiedi un esempio nuovo per ogni regola.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: festival-e-celebrazioni-compiti
    title: Compiti
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti
      - id: written-title
        type: heading
        level: 3
        text: Compiti scritti
      - id: hw1
        type: discussionQuestions
        title: "Parte 1: L'imperativo. Completa con portare, assaggiare, visitare, comprare, arrivare."
        items:
          - question: "___ una bottiglia d'acqua."
          - question: ___ il cibo tipico del festival.
          - question: ___ i biglietti in anticipo.
          - question: "___ presto all'evento."
          - question: ___ il centro storico della città.
      - id: hw2
        type: discussionQuestions
        title: 'Parte 2: Imperativo negativo. Trasforma le frasi con non + infinito.'
        items:
          - question: 'Esempio: Dimentica il biglietto. → Non dimenticare il biglietto.'
          - question: Arriva in ritardo.
          - question: Perdi il biglietto.
          - question: Porta troppe cose.
          - question: Dimentica il telefono.
          - question: Lascia il gruppo.
      - id: hw3
        type: discussionQuestions
        title: 'Parte 3: Passato, presente e futuro. Completa con una risposta personale.'
        items:
          - question: "Passato: L'ultima volta che ho partecipato a una festa, ___"
          - question: 'Presente: Ogni anno celebro ___'
          - question: "Futuro: L'anno prossimo parteciperò a ___"
          - question: 'Imperativo: A una persona che va a un festival per la prima volta, dirò: ___'
      - id: hw4
        type: discussionQuestions
        title: 'Parte 4: Scrittura'
        items:
          - question: >-
              Scrivi 6–8 frasi su una festa o un festival che ti piace. Usa almeno una
              frase al passato, una al presente, una al futuro e due frasi con
              l'imperativo. Puoi parlare di: dove si svolge, quando si celebra, cosa si
              mangia, che musica c'è, cosa hai fatto l'ultima volta, cosa farai la
              prossima volta, quali consigli dai a un visitatore.
      - id: hw5
        type: discussionQuestions
        title: 'Parte 5: Il mio festival ideale. Inventa un festival nuovo e scrivi:'
        items:
          - question: 'Nome del festival:'
          - question: 'Dove si svolge:'
          - question: 'Quando si svolge:'
          - question: 'Che musica ci sarà:'
          - question: 'Che cosa succederà:'
          - question: 'Tre consigli per i visitatori:'
      - id: mori-title
        type: heading
        level: 3
        text: Compiti con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia un messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Parte 1: Imperativo'
        message: |-
          Mori, fammi praticare l'imperativo con consigli per un festival.
          Dammi 10 situazioni e chiedimi di dare consigli usando l'imperativo.
          Correggi tutti i miei errori in italiano e spiegami brevemente perché la forma è corretta.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Parte 2: Festival e celebrazioni'
        message: |-
          Mori, fammi 10 domande sui festival che ho visitato in passato.
          Chiedimi quali feste celebro ogni anno e quale festival vorrei visitare in futuro.
          Dopo ogni mia risposta, fammi un'altra domanda.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Parte 3: Passato, presente e futuro'
        message: |-
          Mori, aiutami a raccontare una festa usando passato, presente e futuro.
          Fammi parlare per almeno 10 frasi.
          Correggi i miei errori, dammi una versione più naturale e fammi ripetere le frasi corrette.
      - id: mori-4
        type: aiTutorPrompt
        title: 'Parte 4: Conversazione libera'
        message: |-
          Mori, facciamo una conversazione semplice su festival e tradizioni.
          Fai finta di essere un organizzatore di eventi e invitami a un festival.
          Fammi domande finché non uso correttamente passato, presente, futuro e imperativo.
      - id: mori-5
        type: aiTutorPrompt
        title: 'Parte 5: Creatività'
        message: |-
          Mori, aiutami a creare un nuovo festival.
          Fammi descrivere il mio festival usando 3 frasi al passato, 3 frasi al presente, 3 frasi al futuro e 5 imperativi.
          Correggi i miei errori e dammi una versione più naturale delle mie frasi.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**
    teacherNotes:
      - id: n-key1
        anchor: hw1
        text: >-
          Risposte: 1. Porta una bottiglia d'acqua. 2. Assaggia il cibo tipico del
          festival. 3. Compra i biglietti in anticipo. 4. Arriva presto all'evento. 5.
          Visita il centro storico della città.
      - id: n-key2
        anchor: hw2
        text: >-
          Risposte: 1. Non arrivare in ritardo. 2. Non perdere il biglietto. 3. Non
          portare troppe cose. 4. Non dimenticare il telefono. 5. Non lasciare il gruppo.

