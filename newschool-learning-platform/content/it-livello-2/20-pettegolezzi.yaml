vocabulary:
  - slug: pettegolezzi
    title: Pettegolezzi e voci
    items: *pettegolezzi-words

activities:
  - slug: pettegolezzi-passato
    title: 'Passato prossimo: ho sentito, ho visto, è uscita'
    minutes: 8
    items:
      - id: ho-sentito
        type: multipleChoice
        prompt: Ieri io ___ un pettegolezzo interessante.
        options:
          - { text: ho sentito, correct: true }
          - {
              text: sento,
              feedback: '*Sento* è presente. Con *ieri* usiamo il passato prossimo: *ho sentito*.',
            }
          - { text: sono sentito, feedback: 'Il verbo *sentire* usa *avere*: *ho sentito*.' }
      - id: anna-uscita
        type: fillBlank
        prompt: Completa con *uscire* al passato prossimo.
        text: Ieri sera Anna ___ con le sue amiche.
        blanks: [[è uscita, e uscita]]
      - id: participi
        type: matching
        prompt: Unisci ogni verbo al suo participio passato.
        pairs:
          - [sentire, sentito]
          - [vedere, visto]
          - [leggere, letto]
          - [dire, detto]
          - [scoprire, scoperto]
      - id: participio-essere
        type: trueFalse
        prompt: "Con *essere* il participio cambia secondo chi fa l'azione: *Lei è uscita. Loro sono usciti.*"
        answer: true
        feedback:
          correct: 'Giusto! *Lui è uscito, lei è uscita, loro sono usciti / uscite.*'
          incorrect: 'Con *essere* il participio cambia (maschile / femminile, singolare / plurale): *lei è uscita*.'
      - id: ragazze-uscite
        type: multipleChoice
        prompt: Le ragazze ___ uscite insieme.
        options:
          - { text: sono, correct: true }
          - { text: hanno, feedback: 'Il verbo *uscire* usa *essere*: *sono uscite*.' }
          - { text: è, feedback: '*Le ragazze* sono loro (plurale): *sono uscite*.' }
      - id: sentito-scoperto
        type: fillBlank
        prompt: Completa al passato prossimo con *sentire* e *scoprire*.
        text: Ieri io ___ una voce falsa, ma poi noi ___ la verità.
        blanks: [[ho sentito], [abbiamo scoperto]]
      - id: amico-detto
        type: multipleChoice
        prompt: Un amico mi ___ un segreto.
        options:
          - { text: ha detto, correct: true }
          - {
              text: ho detto,
              feedback: '*Ho detto* è per *io*. Per *un amico* (lui) usiamo *ha detto*.',
            }
          - { text: è detto, feedback: 'Il verbo *dire* usa *avere*: *ha detto*.' }
      - id: ordina-uscito
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Ieri sera sono uscito con due amici.

  - slug: pettegolezzi-confronti
    title: 'Confronti: più… di, meno… di, quanto, il più'
    minutes: 8
    items:
      - id: ana-pedro
        type: multipleChoice
        prompt: Ana è più pettegola ___ Pedro.
        options:
          - { text: di, correct: true }
          - {
              text: che,
              feedback: 'Davanti a un nome di persona usiamo *di*: *più pettegola di Pedro*.',
            }
          - { text: del, feedback: '*Pedro* è un nome di persona, senza articolo: *di Pedro*.' }
      - id: dei-veri
        type: multipleChoice
        prompt: I pettegolezzi falsi sono più pericolosi ___ pettegolezzi veri.
        options:
          - { text: dei, correct: true }
          - { text: di, feedback: 'Davanti a *i pettegolezzi* usiamo *di + i = dei*.' }
          - {
              text: della,
              feedback: '*Della* = di + la. *Pettegolezzi* è maschile plurale: *dei*.',
            }
      - id: della-settimana
        type: fillBlank
        prompt: Completa con *del*, *della* o *dei*.
        text: Questa è la storia più strana ___ settimana.
        blanks: [[della]]
        wordBank: [del, della, dei]
      - id: meglio-che
        type: multipleChoice
        prompt: Leggere gossip è meglio ___ inventare gossip.
        options:
          - { text: che, correct: true }
          - {
              text: di,
              feedback: 'Tra due verbi (*leggere*, *inventare*) usiamo *che*: *meglio che inventare*.',
            }
          - { text: della, feedback: 'Tra due verbi usiamo *che*: *meglio che inventare*.' }
      - id: quanto
        type: trueFalse
        prompt: '*Questa storia è divertente quanto la tua* vuol dire che le due storie sono divertenti allo stesso modo.'
        answer: true
        feedback:
          correct: 'Giusto! *(tanto)… quanto* = כמו: le due cose sono uguali.'
          incorrect: '*(tanto)… quanto* vuol dire che le due cose sono uguali: la mia storia e la tua sono divertenti allo stesso modo.'
      - id: meno-pettegolo
        type: fillBlank
        prompt: Completa con *più* o *meno*.
        text: 'Io sono ___ pettegolo di mio fratello: lui parla di tutti, io no.'
        blanks: [[meno]]
        wordBank: [più, meno]
      - id: completa-frasi
        type: matching
        prompt: Unisci le due parti della frase.
        pairs:
          - [Mia zia è la persona più pettegola, della famiglia.]
          - [Questa storia è divertente, quanto la tua.]
          - [È meglio leggere, che parlare.]
          - [Questa voce era meno credibile, dell'altra.]
      - id: ordina-zia
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Mia zia è la persona più pettegola della famiglia.
