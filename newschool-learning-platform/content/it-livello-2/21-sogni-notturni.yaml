vocabulary:
  - slug: sogni-notturni
    title: Sogni notturni
    items: *sogni-notturni-words

activities:
  - slug: sogni-notturni-passato
    title: 'Passato prossimo e imperfetto: ero, ho visto, mi sono svegliato'
    minutes: 8
    items:
      - id: mentre-camminavo
        type: multipleChoice
        prompt: Mentre ___, ho visto una porta.
        options:
          - { text: camminavo, correct: true }
          - {
              text: ho camminato,
              feedback: "*Mentre* introduce un'azione in corso, lo sfondo: usiamo l'imperfetto, *camminavo*.",
            }
          - {
              text: cammino,
              feedback: '*Cammino* è presente. Il sogno è nel passato: *Mentre camminavo…*',
            }
      - id: improvviso-sentito
        type: multipleChoice
        prompt: All'improvviso ___ un rumore.
        options:
          - { text: ho sentito, correct: true }
          - {
              text: sentivo,
              feedback: "*All'improvviso* introduce un'azione precisa che succede: usiamo il passato prossimo, *ho sentito*.",
            }
          - {
              text: sento,
              feedback: '*Sento* è presente. Nel racconto del sogno usiamo il passato: *ho sentito*.',
            }
      - id: ero-sentivo
        type: fillBlank
        prompt: Completa all'imperfetto con *essere* e *sentirsi*.
        text: Nel sogno io ___ in una foresta. Mi ___ tranquilla.
        blanks: [[ero], [sentivo]]
      - id: imperfetto-descrive
        type: trueFalse
        prompt: "Per descrivere il posto e le emozioni in un sogno usiamo l'imperfetto: *La stanza era buia. Mi sentivo tranquillo.*"
        answer: true
        feedback:
          correct: "Giusto! L'imperfetto descrive la situazione; il passato prossimo racconta cosa è successo."
          incorrect: "L'imperfetto descrive luoghi, emozioni e atmosfera: *era buia, mi sentivo*."
      - id: marta-svegliata
        type: multipleChoice
        prompt: Marta ___ nel suo letto.
        options:
          - { text: si è svegliata, correct: true }
          - {
              text: si ha svegliata,
              feedback: 'I verbi riflessivi come *svegliarsi* usano *essere*: *si è svegliata*.',
            }
          - {
              text: si è svegliato,
              feedback: 'Marta è una donna. Con *essere* il participio cambia: *si è svegliata*.',
            }
      - id: imperfetto-io
        type: matching
        prompt: Unisci ogni verbo alla sua forma di *io* all'imperfetto.
        pairs:
          - [essere, ero]
          - [volare, volavo]
          - [camminare, camminavo]
          - [avere, avevo]
          - [sentirsi, mi sentivo]
      - id: cerano
        type: fillBlank
        prompt: Completa con *c'era* o *c'erano*.
        text: Intorno a me ___ animali strani.
        blanks: [["c'erano", 'c’erano', 'cerano']]
        wordBank: ["c'era", "c'erano"]
      - id: ordina-mentre
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Mentre camminavo, ho visto una porta.

  - slug: sogni-notturni-preposizioni
    title: 'Preposizioni: davanti a, dietro, intorno a, nonostante…'
    minutes: 8
    items:
      - id: sotto
        type: multipleChoice
        prompt: Come si dice *מתחת* in italiano?
        options:
          - { text: sotto, correct: true }
          - {
              text: sopra,
              feedback: '*Sopra* = מעל / על. *מתחת* = *sotto*: *La scatola è sotto la sedia.*',
            }
          - { text: dietro, feedback: '*Dietro* = מאחורי. *מתחת* = *sotto*.' }
      - id: unisci-luogo
        type: matching
        prompt: Unisci ogni preposizione al suo significato.
        pairs:
          - [dentro, בתוך]
          - [dietro, מאחורי]
          - [accanto a, ליד]
          - [tra / fra, בין]
          - [intorno a, מסביב ל…]
      - id: tra-montagne
        type: fillBlank
        prompt: Completa con una preposizione di luogo.
        text: 'Il castello era ___ due montagne: una a destra e una a sinistra.'
        blanks: [[tra, fra]]
      - id: intorno-casa
        type: multipleChoice
        prompt: 'Gli alberi sono ___ alla casa: davanti, dietro, a destra e a sinistra.'
        options:
          - { text: intorno, correct: true }
          - {
              text: dentro,
              feedback: 'Gli alberi sono fuori, da tutte le parti: *intorno alla casa*. (E diciamo *dentro la casa*, senza *a*.)',
            }
          - {
              text: sopra,
              feedback: 'Gli alberi sono da tutte le parti della casa: *intorno alla casa*. (E diciamo *sopra la casa*, senza *a*.)',
            }
      - id: a-causa-di
        type: trueFalse
        prompt: '*A causa di* vuol dire *במקום*.'
        answer: false
        feedback:
          correct: 'Giusto! *A causa di* = בגלל. *Invece di* = במקום.'
          incorrect: '*A causa di* = בגלל (*A causa del rumore, mi sono svegliato*). *Invece di* = במקום.'
      - id: nonostante
        type: fillBlank
        prompt: Completa con *nonostante*, *a causa di* o *invece di*.
        text: ___ la paura, ho aperto la porta.
        blanks: [[Nonostante, nonostante]]
        wordBank: [Nonostante, A causa di, Invece di]
      - id: a-causa-del
        type: multipleChoice
        prompt: ___ rumore, mi sono svegliato.
        options:
          - { text: A causa del, correct: true }
          - { text: A causa di il, feedback: '*di + il = del*: diciamo *a causa del rumore*.' }
          - {
              text: Invece del,
              feedback: '*Invece di* = במקום. Qui parliamo del motivo (בגלל): *a causa del rumore*.',
            }
      - id: ordina-invece
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Invece di scappare, ho aperto la porta.
