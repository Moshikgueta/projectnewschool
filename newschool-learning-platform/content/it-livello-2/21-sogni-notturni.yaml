# Cycle "Sogni notturni", converted from the Italian level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-2
slug: sogni-notturni
title: Sogni notturni
goal: Raccontare un sogno con il passato prossimo e l'imperfetto e descrivere luoghi con le preposizioni.
position: 21
status: in_review

review:
  - >-
    The two workbook exercises ("Passato prossimo e imperfetto" and "Preposizioni")
    are NEW: the notebook has no self-correcting exercises. They were written from
    the cycle's two skills, its summary rules, the activity examples and its
    vocabulary. Please check level, wording and every right answer before students
    see them.
  - >-
    The grammar summary ("סיכום דקדוקי", titled "Sogni strani" in the notebook) is
    in Hebrew. It was rewritten in Italian as rule summaries (passato prossimo,
    imperfetto, the two tenses together, preposizioni di luogo, nonostante / a
    causa di / invece di), with the Italian examples kept. The short student summary
    ("סיכום קצר לתלמידים") repeats the same examples, so it is kept once, as the
    "Cosa sappiamo fare adesso" callout. A full imperfetto table (essere, sentirsi,
    camminare, volare) was ADDED: the notebook lists only some forms.
  - >-
    Classic homework ("שיעורי בית קלאסיים", 8 parts) is kept in the homework
    section as written exercises, with the Hebrew instructions translated into
    Italian; the answer key is in the teacher notes. Corrections where the key did
    not fit the sentence: Part 4 item 1 key "Sopra / Sul" → "sopra (o sotto)" ("sul
    il tavolo" is wrong); item 3 "Il gatto era ___ la finestra" → "___ alla
    finestra" (key "accanto / vicino"); item 8 "Gli alberi erano ___ la casa" →
    "___ alla casa" (key "intorno"). Part 5 items 2, 6 and 8 ("___ il rumore", "___
    la pioggia", "___ la luce forte", key "A causa di") → "___ rumore", "___
    pioggia", "___ luce forte" with the key "A causa del / della" (di + article),
    as the summary itself teaches.
  - >-
    Activity 2: the notebook has no answers for the comprehension questions; a
    possible answer key was ADDED in the teacher note. Activities 1 and 3 need dream
    / house pictures that the notebook does not include.
  - >-
    Broken capitals from line breaks fixed in the models ("usando / Le preposizioni",
    "svegliata, / Mi sono sentito", "E c'erano", "Abbiamo dovuto", "Ci siamo
    divertiti", "Abbiamo deciso"); "Scrivere un breve testo" (objectives) lowercase.
  - >-
    Vocabulary: the source export is cut off after "Vuot"; it was completed as
    "vuoto – ריק". Please check whether more words followed. "Lucido – צלול" kept
    next to "sogno lucido – חלום צלול".
  - >-
    The Mori tasks (5 parts) are kept; the example questions are shown as an intro
    to each message. The tips callout was added as in the other cycles. The Quizlet
    link is kept without its "?new" parameter. The "Risposta dello studente 1/2/3"
    lines are replaced by the optional answer boxes. The introduction round says
    "massimo 30 secondi" per student; the notebook gives no other times, so none are
    recorded.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: sogni-notturni-classe
    title: 'In classe: Sogni notturni'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Sogni notturni
      - id: skills
        type: cycleOverview
        skills:
          - name: Passato prossimo e imperfetto
            description: "Raccontare sogni e storie brevi: *Ero in una foresta. All'improvviso ho sentito un rumore.*"
          - name: Preposizioni
            description: '*davanti a, dietro, accanto a, vicino a, tra / fra, sopra, sotto, intorno a* e *nonostante, a causa di, invece di*'
      - id: quizlet
        type: externalLink
        label: Sogni notturni su Quizlet
        url: https://quizlet.com/br/1191220287/sogni-notturni-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Giro di presentazioni
      - id: intro
        type: sentenceFrame
        prompt: Parla per massimo 30 secondi.
        frame: Mi chiamo ___. Di solito sogno in ___.
        example: Mi chiamo Florencia. Di solito sogno in ebraico, inglese e spagnolo.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di preparazione
      - id: warmup
        type: discussionQuestions
        items:
          - question: Ti ricordi i tuoi sogni quando ti svegli?
            frame: Sì, di solito mi ricordo i miei sogni. / No, di solito non mi ricordo i miei sogni. / A volte me li ricordo, ma dopo pochi minuti li dimentico.
          - question: 'Hai mai fatto uno di questi sogni? *Ho sognato che mi cadevano i denti. / Ho sognato che stavo volando. / Ho sognato che cadevo nel vuoto. / Ho sognato di non aver superato un esame. / Ho sognato che qualcuno mi inseguiva. / Ho sognato di arrivare in ritardo. / Ho sognato di parlare una lingua perfettamente.*'
            frame: Sì, una volta ho sognato che ___. / No, non ho mai fatto un sogno così.
          - question: Puoi raccontare brevemente un sogno che ricordi?
            frame: Una volta ho sognato che ___. Nel sogno ero ___ e vedevo ___.
          - question: Hai mai sognato di essere in un'altra epoca o in un altro paese?
            frame: 'Sì, ho sognato di essere ___. / No, non mi è mai successo. (Esempio: Ho sognato di essere in Italia nel Medioevo. Camminavo in una città antica e parlavo con persone strane.)'
          - question: Secondo te, cosa si può fare per avere meno incubi?
            frame: 'Secondo me, per avere meno incubi si può ___. (Esempio: Secondo me, si può dormire meglio, guardare meno notizie prima di dormire e rilassarsi.)'
          - question: 'Chi sogna di più secondo te: i bambini o gli adulti? Perché?'
            frame: Secondo me, ___ sognano di più perché ___.
          - question: 'Domanda bonus: perché pensi che le persone sognino?'
            frame: Penso che le persone sognino perché ___.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: Cosa hai sognato?'
        skills: [Passato prossimo e imperfetto, Preposizioni]
        steps:
          - 'Scegli una o due immagini di sogni (una stanza strana, una strada misteriosa, una foresta, una casa, una scala, una porta, una spiaggia, persone o animali strani).'
          - Scrivi un breve sogno al passato usando le preposizioni (qui sotto).
          - Racconta uno dei tuoi sogni alla classe.
          - 'Dopo ogni racconto, gli altri studenti provano a interpretare il sogno con le frasi utili.'
        wordBank:
          - Secondo me, questo sogno significa che…
          - Forse hai fatto questo sogno perché…
          - Penso che il / la … rappresenti…
          - È possibile che tu fossi preoccupato / preoccupata per…
      - id: act1-dream
        type: discussionQuestions
        title: Il mio sogno
        items:
          - question: La notte scorsa ho sognato che ___.
          - question: Nel sogno era mattina / pomeriggio / sera / notte.
          - question: Io ero ___.
          - question: Davanti a me ho visto ___.
          - question: Dietro ___ c'era ___.
          - question: Accanto a ___ c'era ___.
          - question: Vicino a ___ ho visto ___.
          - question: Tra ___ e ___ c'erano ___.
          - question: Sopra ___ c'era ___.
          - question: Sotto ___ c'era ___.
          - question: Intorno a ___ c'erano ___.
          - question: All'improvviso, ___.
          - question: 'Il sogno è finito così: ___.'
          - question: So che sembra un sogno folle, ma credo di averlo fatto a causa di ___.
      - id: act2
        type: classActivity
        title: 'Attività 2: I sogni più strani'
        skills: [Passato prossimo e imperfetto, Preposizioni]
        steps:
          - Leggiamo insieme il testo. Ogni studente legge una parte.
          - Rispondi alle domande di comprensione.
          - Discutiamo insieme le domande della discussione.
      - id: act2-text
        type: text
        text: |-
          La notte scorsa ho fatto un sogno stranissimo. Ero in una foresta gigantesca, circondata da alberi che brillavano di diversi colori. All'inizio mi sentivo calma, ma all'improvviso la terra ha iniziato a tremare.

          In mezzo alla foresta è apparsa un'enorme scalinata che portava a una stanza sotterranea. Sulle pareti della stanza c'erano dipinti di animali che danzavano e parlavano tra loro. Ho cercato di avvicinarmi ai dipinti, ma hanno iniziato a muoversi e uno degli animali è saltato fuori dalla cornice.

          Poi mi sono ritrovata in fondo alle scale con una chiave d'oro in mano. Mi sentivo come in un labirinto, e ogni porta che aprivo portava a un luogo strano e diverso. In una stanza c'erano enormi pezzi di torta che galleggiavano sul soffitto. In un'altra stanza c'era una spiaggia di sabbia viola.

          Ho provato a tornare indietro, ma non riuscivo a trovare la strada. Proprio quando mi sentivo completamente persa, ho sentito una sveglia accanto a me. Mi sono svegliata e ho capito che ero al sicuro nel mio letto.
      - id: act2-comprehension
        type: discussionQuestions
        title: Domande di comprensione
        items:
          - question: Dov'era la narratrice nel sogno?
          - question: Com'era la foresta?
          - question: Cosa è successo quando la terra ha iniziato a tremare?
          - question: Cosa c'era sulle pareti della stanza sotterranea?
          - question: Cosa ha trovato la narratrice in fondo alle scale?
          - question: Quali cose strane ha visto nelle stanze?
          - question: Come è finito il sogno?
      - id: act2-discussion
        type: discussionQuestions
        title: Discussione
        items:
          - question: Qual è il sogno più strano che ricordi?
          - question: Hai mai fatto un sogno ricorrente?
          - question: Pensi che i sogni possano dire qualcosa su di noi?
          - question: Hai mai avuto un incubo che sembrava molto reale?
          - question: Se potessi controllare i tuoi sogni, cosa sogneresti?
          - question: Secondo te, i sogni hanno un significato?
      - id: act3
        type: classActivity
        title: 'Attività 3: La casa dei tuoi sogni'
        skills: [Preposizioni]
        steps:
          - 'Immagina che un sogno diventi realtà: puoi vivere nella casa dei tuoi sogni.'
          - Trova o immagina un'immagine della casa dei tuoi sogni.
          - Descrivi la casa con le preposizioni di luogo (qui sotto) e presentala alla classe.
        example: |-
          *La casa dei miei sogni è a Beverly Hills.*
          *Ho scelto questa casa perché ho sempre desiderato vivere vicino alle celebrità.*
          *La mia famiglia vivrà con me in questa casa.*
          *Davanti alla casa c'è un grande cancello di sicurezza.*
          *Dietro la casa ci sono una piscina e una jacuzzi.*
          *Accanto alla casa c'è un grande giardino.*
          *Intorno alla casa ci sono alberi e piante enormi.*
          *Dentro la casa ci sono molte stanze luminose.*
      - id: act3-house
        type: discussionQuestions
        title: La casa dei miei sogni
        items:
          - question: La casa dei miei sogni è in / a ___.
          - question: Ho scelto questa casa perché ___.
          - question: ___ vivrà / vivranno con me in questa casa.
          - question: Davanti alla casa c'è ___.
          - question: Dietro la casa c'è / ci sono ___.
          - question: Accanto alla casa c'è / ci sono ___.
          - question: Vicino alla casa c'è / ci sono ___.
          - question: Intorno alla casa ci sono ___.
          - question: Dentro la casa c'è / ci sono ___.
          - question: Sopra / Sotto ___ c'è ___.
      - id: act4
        type: classActivity
        title: 'Attività 4: Questo fatto curioso è vero?'
        skills: [Passato prossimo e imperfetto, Preposizioni]
        steps:
          - Leggi i fatti curiosi sui sogni (qui sotto) e scegli il più interessante o il più strano.
          - Racconta una storia personale o inventata collegata a quel fatto (modello qui sotto).
      - id: act4-facts
        type: text
        text: |-
          **Fatti curiosi sui sogni**
          1. Tutti sognano, ma non tutti ricordano i sogni.
          2. Molti sogni durano pochi minuti.
          3. Una persona può fare più sogni in una notte.
          4. Alcune persone dicono di sognare in bianco e nero.
          5. I sogni possono essere collegati alle emozioni.
          6. Nei sogni lucidi, una persona sa che sta sognando.
          7. A volte dimentichiamo i sogni molto velocemente.
          8. I suoni o gli odori possono entrare nei sogni.
          9. Anche gli animali possono sognare.
          10. I sogni spesso mescolano idee, ricordi e persone.
      - id: act4-story
        type: discussionQuestions
        title: La mia storia
        items:
          - question: Ho scelto il fatto numero ___.
          - question: Una volta ho sognato che ___.
          - question: Nel sogno ero ___.
          - question: Intorno a me c'erano ___.
          - question: All'improvviso, ___.
          - question: Quando mi sono svegliato / svegliata, mi sono sentito / sentita ___.
      - id: act5
        type: classActivity
        title: 'Attività 5: Un giorno da ricordare'
        skills: [Passato prossimo e imperfetto, Preposizioni]
        steps:
          - Leggi la mini spiegazione di *nonostante*, *a causa di* e *invece di* (qui sotto).
          - Scrivi un breve testo su una giornata speciale, reale o inventata. Usa le domande guida e il modello.
          - "Domande guida: *Quando è stata questa giornata speciale? Dove eri? Con chi eri? Che cosa hai fatto quel giorno? Com'era il posto? C'è stato un problema? Come hai risolto il problema? Perché era una giornata speciale?*"
      - id: act5-explain
        type: callout
        tone: info
        title: Mini spiegazione
        text: |-
          **Nonostante:** qualcosa succede anche se c'è una difficoltà. *Nonostante la pioggia, siamo usciti. Nonostante la paura, ho continuato a camminare. Nonostante il traffico, siamo arrivati in tempo.*
          **A causa di:** il motivo, di solito negativo, o il problema. *A causa del traffico, siamo arrivati tardi. A causa della pioggia, abbiamo cambiato programma. A causa di un rumore strano, mi sono svegliato.*
          **Invece di:** scegliamo una cosa al posto di un'altra. *Invece di andare al cinema, siamo rimasti a casa. Invece di dormire, ho letto un libro. Invece di scappare, ho aperto la porta.*
      - id: act5-text
        type: discussionQuestions
        title: Il mio giorno speciale
        items:
          - question: Un giorno speciale per me è stato ___.
          - question: Ero a ___ con ___.
          - question: Quel giorno abbiamo ___.
          - question: Il posto era ___ e c'erano ___.
          - question: A causa di ___, abbiamo dovuto ___.
          - question: Nonostante ___, ci siamo divertiti molto.
          - question: Invece di ___, abbiamo deciso di ___.
          - question: Alla fine, è stata una giornata indimenticabile.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Passato prossimo e imperfetto** (Attività 1, 2,
          4 e 5) e **Preposizioni** (di luogo nelle Attività 1, 2 e 3; *nonostante, a
          causa di, invece di* nell'Attività 5). Il quaderno non dà i tempi: scegli una
          o due attività per lezione.
      - id: n-intro
        anchor: intro
        text: Questa parte deve essere molto breve. Ogni studente parla per massimo 30 secondi.
      - id: n-warmup
        anchor: warmup
        text: Fai almeno due domande a ogni studente. Le risposte scritte qui compaiono sotto ogni domanda.
      - id: n-act1
        anchor: act1
        text: Prepara alcune immagini di sogni (non sono nel quaderno). Dopo ogni racconto, invita la classe a interpretare il sogno.
      - id: n-act2
        anchor: act2-comprehension
        text: >-
          Risposte possibili: 1 In una foresta gigantesca. 2 Era circondata da alberi che
          brillavano di diversi colori. 3 In mezzo alla foresta è apparsa un'enorme
          scalinata che portava a una stanza sotterranea. 4 Dipinti di animali che
          danzavano e parlavano tra loro. 5 Una chiave d'oro. 6 Enormi pezzi di torta che
          galleggiavano sul soffitto e una spiaggia di sabbia viola. 7 Ha sentito una
          sveglia, si è svegliata e ha capito che era al sicuro nel suo letto.
      - id: n-act3
        anchor: act3
        text: Gli studenti possono cercare un'immagine su internet o immaginarla.
      - id: n-act4
        anchor: act4
        text: Presenta i fatti curiosi. Gli studenti scelgono il fatto più interessante o più strano e raccontano una storia personale o inventata.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: sogni-notturni-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: rules-passato
        type: ruleSummary
        skill: Passato prossimo
        rules:
          - text: 'Usiamo il **passato prossimo** per raccontare cosa è successo nel sogno o quando ci siamo svegliati (in ebraico: חלמתי, ראיתי, התעוררתי).'
            examples:
              - Ieri ho fatto un sogno strano.
              - Ho visto una porta enorme.
              - Ho sentito una sveglia.
              - Mi sono svegliato nel mio letto.
              - La terra ha iniziato a tremare.
          - text: '**avere** o **essere** al presente + **participio passato**.'
            examples:
              - 'con avere: ho sognato, ho visto, ho sentito, ho trovato, ho aperto'
              - 'con essere: sono andato / andata, sono caduto / caduta'
          - text: "I verbi riflessivi (*svegliarsi, ritrovarsi*) usano *essere*. Con *essere* il participio cambia secondo chi fa l'azione."
            examples:
              - Mi sono svegliato. (un uomo) / Mi sono svegliata. (una donna)
              - Mi sono ritrovato / ritrovata in una città vuota.
              - Ci siamo svegliati. (un gruppo con almeno un uomo)
              - Ci siamo svegliate. (solo donne)
      - id: rules-imperfetto
        type: ruleSummary
        skill: Imperfetto
        rules:
          - text: "Usiamo l'**imperfetto** per descrivere luoghi, emozioni, stati, l'atmosfera, azioni in corso e abitudini nel passato. In un sogno è molto importante, perché descriviamo il posto e l'atmosfera."
            examples:
              - Nel sogno ero in una foresta.
              - La stanza era buia.
              - C'erano animali strani.
              - Mi sentivo tranquillo.
              - Volavo sopra una città.
              - Camminavo in una strada misteriosa.
      - id: imperfetto-table
        type: table
        caption: Imperfetto
        header: [Chi?, essere, sentirsi, camminare, volare]
        rows:
          - [io, ero, mi sentivo, camminavo, volavo]
          - [tu, eri, ti sentivi, camminavi, volavi]
          - [lui / lei, era, si sentiva, camminava, volava]
          - [noi, eravamo, ci sentivamo, camminavamo, volavamo]
          - [voi, eravate, vi sentivate, camminavate, volavate]
          - [loro, erano, si sentivano, camminavano, volavano]
      - id: rules-insieme
        type: ruleSummary
        skill: Passato prossimo e imperfetto insieme
        rules:
          - text: "**Imperfetto** = com'era la situazione (lo sfondo, l'atmosfera). **Passato prossimo** = cosa è successo dentro questa situazione."
            examples:
              - Mentre camminavo, ho visto una porta.
              - Ero in una stanza buia quando ho sentito un rumore.
              - C'erano molte persone, ma nessuno parlava.
              - Mi sentivo perso, poi mi sono svegliato.
          - text: 'Parole che collegano i due tempi:'
            examples:
              - mentre (בזמן ש…), quando (כאשר), poi (אחר כך), all'improvviso (פתאום), alla fine (בסוף)
      - id: rules-preposizioni
        type: ruleSummary
        skill: Preposizioni di luogo
        rules:
          - text: 'Le preposizioni di luogo dicono dove si trova una cosa. Alcune vogliono *a* (*davanti a, accanto a, vicino a, intorno a*), e *a* + articolo diventa *al, alla…*'
            examples:
              - Il gatto è dentro la casa.
              - La chiave è sul tavolo.
              - La porta è davanti a me.
              - La scala è dietro la casa.
              - Il bambino è accanto alla finestra.
              - La donna è vicino alla strada.
              - Il castello è tra due montagne.
              - La luce è sopra il letto.
              - La scatola è sotto la sedia.
              - Gli alberi sono intorno alla casa.
      - id: preposizioni-table
        type: table
        caption: Preposizioni di luogo
        header: [Italiano, Ebraico]
        rows:
          - [dentro, בתוך]
          - [fuori da, מחוץ ל…]
          - [davanti a, מול / לפני]
          - [dietro, מאחורי]
          - [accanto a, ליד]
          - [vicino a, קרוב ל…]
          - [tra / fra, בין]
          - [sopra, מעל / על]
          - [sotto, מתחת]
          - [intorno a, מסביב ל…]
      - id: rules-avanzate
        type: ruleSummary
        skill: Nonostante, a causa di, invece di
        rules:
          - text: 'Queste parole collegano due idee. Sono molto utili per scrivere a livello A2 alto.'
          - text: '**nonostante** (למרות) + nome.'
            examples:
              - Nonostante la paura, ho continuato a camminare.
              - Nonostante il buio, ho aperto la porta.
          - text: '**a causa di** (בגלל) + nome. Attenzione: *di + il = del*, *di + la = della*.'
            examples:
              - A causa del rumore, mi sono svegliato.
              - A causa della pioggia, siamo rimasti a casa.
          - text: "**invece di** (במקום) + verbo all'infinito."
            examples:
              - Invece di scappare, ho parlato con l'uomo misterioso.
              - Invece di dormire, ho scritto il sogno sul telefono.
      - id: can-do
        type: callout
        tone: info
        title: Cosa sappiamo fare adesso
        text: |-
          Raccontare cosa è successo: *Ho fatto un sogno strano. Ho visto una porta enorme. Mi sono svegliato nel mio letto.*
          Descrivere la situazione: *Ero in una foresta. La stanza era buia. Mi sentivo tranquillo.*
          Usare i due tempi insieme: *Mentre camminavo, ho visto una porta. Mi sentivo perso, poi mi sono svegliato.*
          Dire dove sono le cose: *La chiave era sotto la scala. Intorno a me c'erano molte porte.*
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le regole con la classe e chiedi un esempio nuovo per ogni regola.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: sogni-notturni-compiti
    title: Compiti con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia un messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
      - id: mori-passato
        type: aiTutorPrompt
        title: 'Parte 1: Passato prossimo'
        intro: 'Domande possibili: *Che sogno hai fatto recentemente? Che cosa hai visto nel sogno? Che cosa hai sentito? Come ti sei svegliato / svegliata?*'
        message: Mori, fammi 4 domande al passato prossimo su un sogno vero o inventato. Aspetta la mia risposta, correggi i miei errori e fammi una breve domanda di approfondimento.
      - id: mori-imperfetto
        type: aiTutorPrompt
        title: 'Parte 2: Imperfetto'
        intro: "Domande possibili: *Dove eri nel sogno? Com'era il posto? Che cosa c'era intorno a te? Come ti sentivi?*"
        message: Mori, fammi 4 domande all'imperfetto per descrivere un sogno. Aiutami a usare ero, era, c'era, c'erano e mi sentivo.
      - id: mori-preposizioni
        type: aiTutorPrompt
        title: 'Parte 3: Preposizioni di luogo'
        intro: 'Esempi: *La chiave è sotto il tavolo. La porta è davanti a me.*'
        message: Mori, fammi praticare le preposizioni di luogo. Dammi una parola e chiedimi di creare una frase con dentro, fuori da, davanti a, dietro, accanto a, vicino a, tra, sopra, sotto o intorno a. Correggi i miei errori.
      - id: mori-insieme
        type: aiTutorPrompt
        title: 'Parte 4: Passato e descrizione insieme'
        intro: 'Esempio: *Mentre camminavo, ho visto una porta.*'
        message: Mori, chiedimi di scrivere 5 frasi su un sogno usando passato prossimo e imperfetto insieme. Correggi i miei errori e spiegami perché devo usare ogni tempo.
      - id: mori-paragrafo
        type: aiTutorPrompt
        title: 'Parte 5: Scrittura finale'
        message: Mori, aiutami a scrivere un breve paragrafo su un sogno. Devo usare passato prossimo, imperfetto, 5 preposizioni di luogo e una frase con nonostante, a causa di o invece di. Correggi tutto alla fine.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**
      - id: written-title
        type: heading
        level: 3
        text: Esercizi scritti
      - id: hw1
        type: discussionQuestions
        title: 'Parte 1: Completa al passato prossimo con il verbo tra parentesi'
        items:
          - question: Ieri io ___ un sogno molto strano. (fare)
          - question: Nel sogno io ___ una porta enorme. (vedere)
          - question: Luca ___ un rumore forte. (sentire)
          - question: Noi ___ una chiave sotto il letto. (trovare)
          - question: Tu ___ la porta misteriosa? (aprire)
          - question: Marta ___ nel suo letto. (svegliarsi)
          - question: Io ___ da una scala. (cadere)
          - question: Loro ___ in una città vuota. (ritrovarsi)
          - question: Voi ___ in una foresta? (andare)
          - question: La terra ___ a tremare. (iniziare)
      - id: hw2
        type: discussionQuestions
        title: "Parte 2: Completa all'imperfetto"
        items:
          - question: Nel sogno io ___ in una foresta. (essere)
          - question: La stanza ___ molto buia. (essere)
          - question: C'___ animali strani intorno a me. (essere)
          - question: Io ___ sopra una città. (volare)
          - question: Noi ___ in una strada misteriosa. (camminare)
          - question: Tu ___ paura? (avere)
          - question: Io mi ___ tranquillo / tranquilla. (sentire)
          - question: Le persone non ___. (parlare)
          - question: La porta ___ davanti a me. (essere)
          - question: Il gatto nero mi ___. (seguire)
      - id: hw3
        type: discussionQuestions
        title: 'Parte 3: Passato prossimo o imperfetto? Scegli la forma giusta'
        items:
          - question: Mentre io ___, ho visto una luce. (a. camminavo / b. ho camminato)
          - question: Ieri ___ un sogno strano. (a. facevo / b. ho fatto)
          - question: Nel sogno la casa ___ molto grande. (a. era / b. è stata)
          - question: All'improvviso, io ___ un rumore. (a. sentivo / b. ho sentito)
          - question: C'erano molte persone, ma nessuno ___. (a. ha parlato / b. parlava)
          - question: Poi io ___ nel mio letto. (a. mi sono svegliato / b. mi svegliavo)
          - question: Mi ___ perso, poi ho trovato una porta. (a. sono sentito / b. sentivo)
          - question: La città ___ vuota e silenziosa. (a. era / b. è stata)
      - id: hw4
        type: discussionQuestions
        title: 'Parte 4: Completa con una preposizione: dentro, fuori da, davanti a, dietro, accanto, vicino, tra, sopra, sotto, intorno'
        items:
          - question: La chiave era ___ il tavolo.
          - question: La porta era ___ me.
          - question: Il gatto era ___ alla finestra.
          - question: La scala era ___ la casa.
          - question: La luce volava ___ il letto.
          - question: La scatola era ___ la sedia.
          - question: Il castello era ___ due montagne.
          - question: Gli alberi erano ___ alla casa.
          - question: Il bambino era ___ la casa.
          - question: Io ero ___ una stanza buia.
      - id: hw5
        type: discussionQuestions
        title: 'Parte 5: Completa con nonostante, a causa del / della o invece di'
        items:
          - question: ___ la paura, ho continuato a camminare.
          - question: ___ rumore, mi sono svegliato.
          - question: ___ scappare, ho aperto la porta.
          - question: ___ il buio, ho trovato la chiave.
          - question: ___ dormire, ho scritto il sogno sul telefono.
          - question: ___ pioggia, siamo rimasti a casa.
          - question: ___ parlare, l'uomo misterioso ha sorriso.
          - question: ___ luce forte, ho chiuso gli occhi.
      - id: hw6-title
        type: text
        text: '**Parte 6:** traduci in italiano.'
      - id: hw6
        type: discussionQuestions
        lang: he
        items:
          - question: אתמול חלמתי חלום מוזר.
          - question: בחלום הייתי ביער.
          - question: ראיתי דלת אדומה מולי.
          - question: מאחורי הדלת שמעתי מוזיקה מסתורית.
          - question: ליד החלון היה חתול שחור.
          - question: בזמן שהלכתי, ראיתי אור קטן.
          - question: למרות הפחד, פתחתי את הדלת.
          - question: בגלל הרעש, התעוררתי.
          - question: במקום לברוח, דיברתי עם האיש המסתורי.
          - question: בסוף התעוררתי במיטה שלי.
      - id: hw7-text
        type: text
        text: |-
          **Parte 7:** leggi il testo e rispondi alle domande.

          La settimana scorsa ho fatto un sogno molto strano. Nel sogno ero in una casa antica. La stanza era buia e c'erano molte porte intorno a me. Davanti a me c'era una scala, e sotto la scala c'era una piccola chiave. Mentre camminavo, ho sentito una voce misteriosa. Nonostante la paura, ho preso la chiave e ho aperto una porta rossa. A causa di un rumore forte, mi sono svegliato nel mio letto.
      - id: hw7
        type: discussionQuestions
        items:
          - question: Quando ha fatto il sogno?
          - question: Dove era nel sogno?
          - question: Che cosa c'era intorno alla persona?
          - question: Dove era la chiave?
          - question: Che cosa ha sentito mentre camminava?
          - question: Perché si è svegliato?
      - id: hw8
        type: reflection
        prompt: >-
          **Parte 8:** scrivi un breve paragrafo su un sogno vero o inventato. Usa 2 frasi
          al passato prossimo, 2 frasi all'imperfetto, 5 preposizioni di luogo e 1 frase
          con *nonostante*, *a causa di* o *invece di*. Puoi cominciare così: *La
          settimana scorsa ho fatto un sogno strano. / Nel sogno ero… / Davanti a me
          c'era… / Mentre camminavo… / Alla fine mi sono svegliato / svegliata…*
    teacherNotes:
      - id: n-written
        anchor: written-title
        text: Gli esercizi scritti vengono dal quaderno («compiti classici»). Le soluzioni sono nelle note qui sotto.
      - id: n-hw1
        anchor: hw1
        text: >-
          Soluzioni: 1 ho fatto, 2 ho visto, 3 ha sentito, 4 abbiamo trovato, 5 hai
          aperto, 6 si è svegliata, 7 sono caduto / caduta, 8 si sono ritrovati /
          ritrovate, 9 siete andati / andate, 10 ha iniziato.
      - id: n-hw2
        anchor: hw2
        text: 'Soluzioni: 1 ero, 2 era, 3 erano, 4 volavo, 5 camminavamo, 6 avevi, 7 sentivo, 8 parlavano, 9 era, 10 seguiva.'
      - id: n-hw3
        anchor: hw3
        text: 'Soluzioni: 1 a (camminavo), 2 b (ho fatto), 3 a (era), 4 b (ho sentito), 5 b (parlava), 6 a (mi sono svegliato), 7 b (sentivo), 8 a (era).'
      - id: n-hw4
        anchor: hw4
        text: >-
          Soluzioni possibili: 1 sopra (o sotto), 2 davanti a, 3 accanto / vicino, 4
          dietro, 5 sopra, 6 sotto, 7 tra, 8 intorno, 9 dentro, 10 dentro.
      - id: n-hw5
        anchor: hw5
        text: >-
          Soluzioni: 1 Nonostante, 2 A causa del, 3 Invece di, 4 Nonostante, 5 Invece
          di, 6 A causa della, 7 Invece di, 8 A causa della.
      - id: n-hw6
        anchor: hw6
        text: >-
          Soluzioni possibili: 1 Ieri ho fatto un sogno strano. 2 Nel sogno ero in una
          foresta. 3 Ho visto una porta rossa davanti a me. 4 Dietro la porta ho sentito
          una musica misteriosa. 5 Accanto alla finestra c'era un gatto nero. 6 Mentre
          camminavo, ho visto una piccola luce. 7 Nonostante la paura, ho aperto la
          porta. 8 A causa del rumore, mi sono svegliato / svegliata. 9 Invece di
          scappare, ho parlato con l'uomo misterioso. 10 Alla fine mi sono svegliato /
          svegliata nel mio letto.
      - id: n-hw7
        anchor: hw7
        text: >-
          Soluzioni: 1 La settimana scorsa. 2 Era in una casa antica. 3 C'erano molte
          porte. 4 Era sotto la scala. 5 Ha sentito una voce misteriosa. 6 Si è svegliato
          a causa di un rumore forte.

