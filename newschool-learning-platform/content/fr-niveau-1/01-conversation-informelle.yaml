vocabulary:
  - slug: conversation-informelle
    title: Conversation informelle
    items: *conversation-informelle-words

activities:
  - slug: conversation-informelle-questions
    title: 'Poser des questions : où, quand, pourquoi, comment'
    minutes: 8
    items:
      - id: ou-habites
        type: multipleChoice
        prompt: ___ tu habites ? — J’habite à Tel-Aviv.
        options:
          - { text: Où, correct: true }
          - { text: Quand, feedback: '*Quand* demande le temps. Pour un lieu, on dit *où*.' }
          - { text: Pourquoi, feedback: '*Pourquoi* demande la raison. Pour un lieu, on dit *où*.' }
      - id: comment-vas
        type: multipleChoice
        prompt: ___ tu vas ? — Je vais bien, merci.
        options:
          - { text: Comment, correct: true }
          - { text: Où, feedback: '*Où* demande un lieu. Pour un sentiment, on dit *comment*.' }
          - {
              text: Quand,
              feedback: '*Quand* demande le temps. Pour un sentiment, on dit *comment*.',
            }
      - id: quand-anniversaire
        type: multipleChoice
        prompt: ___ est ton anniversaire ? — Le 9 février.
        options:
          - { text: Quand, correct: true }
          - {
              text: Comment,
              feedback: 'La réponse est une date : on demande le temps avec *quand*.',
            }
          - { text: Où, feedback: 'La réponse est une date, pas un lieu : on dit *quand*.' }
      - id: mots-interrogatifs
        type: matching
        prompt: Associe chaque mot interrogatif à son utilisation.
        pairs:
          - [Qu’est-ce que, choses]
          - [Où, lieux]
          - [Quand, temps]
          - [Pourquoi, raison]
          - [Comment, manière / sentiment]
      - id: pourquoi-francais
        type: fillBlank
        prompt: Complète la question avec le bon mot interrogatif.
        text: ___ tu apprends le français ? — Parce que j’aime la France.
        blanks: [[Pourquoi]]
      - id: deux-structures
        type: trueFalse
        prompt: '« Où tu habites ? » et « Où habites-tu ? » sont deux questions correctes.'
        answer: true
        feedback:
          correct: 'Oui ! *Où tu habites ?* est la forme de tous les jours, *Où habites-tu ?* est plus formelle.'
          incorrect: 'Les deux sont correctes : mot interrogatif + sujet + verbe, ou mot interrogatif + verbe + sujet (plus formel).'
      - id: ordre-aimes
        type: reorderSentence
        prompt: Remets les mots dans l’ordre pour faire une question.
        sentence: Qu’est-ce que tu aimes faire ?
      - id: plus-formelle
        type: multipleChoice
        prompt: Quelle question est la plus formelle ?
        options:
          - { text: Comment t’appelles-tu ?, correct: true }
          - {
              text: Comment tu t’appelles ?,
              feedback: 'Mot interrogatif + sujet + verbe : c’est la forme de tous les jours. La forme formelle met le verbe avant le sujet.',
            }

  - slug: conversation-informelle-descriptions
    title: 'Phrases descriptives : être et avoir'
    minutes: 8
    items:
      - id: elle-est
        type: multipleChoice
        prompt: Elle ___ gentille.
        options:
          - { text: est, correct: true }
          - { text: a, feedback: 'Pour décrire une personne, on utilise *être* : elle *est*.' }
          - { text: es, feedback: '*Es* va avec *tu* (tu es). Avec *elle*, on dit *est*.' }
      - id: nous-avons
        type: multipleChoice
        prompt: Nous ___ deux enfants.
        options:
          - { text: avons, correct: true }
          - {
              text: sommes,
              feedback: 'Pour parler de ce que l’on possède, on utilise *avoir* : nous *avons*.',
            }
          - { text: avez, feedback: '*Avez* va avec *vous*. Avec *nous*, on dit *avons*.' }
      - id: suis-as
        type: fillBlank
        prompt: Complète avec *être* ou *avoir* au présent.
        text: Je ___ heureux. Tu ___ un frère ?
        blanks: [[suis], [as]]
      - id: etre-personnes
        type: matching
        prompt: Associe chaque personne à la forme du verbe *être*.
        pairs:
          - [je, suis]
          - [tu, es]
          - [il / elle, est]
          - [nous, sommes]
          - [ils / elles, sont]
      - id: sont-avez
        type: fillBlank
        prompt: Complète avec *être* ou *avoir* au présent.
        text: Ils ___ grands. Vous ___ une voiture.
        blanks: [[sont], [avez]]
      - id: avoir-posseder
        type: trueFalse
        prompt: 'Pour parler de ce que l’on possède, on utilise le verbe *avoir* : J’ai un frère.'
        answer: true
        feedback:
          correct: Oui ! *Avoir* = ce que l’on possède.
          incorrect: 'On utilise *avoir* pour ce que l’on possède : j’ai, tu as, il a…'
      - id: ordre-voiture
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Elle a une voiture.
      - id: age-avoir
        type: trueFalse
        prompt: On dit « Je suis 30 ans. »
        answer: false
        feedback:
          correct: 'Bravo ! Pour l’âge, on utilise *avoir* : J’ai 30 ans.'
          incorrect: 'En français, l’âge se dit avec *avoir* : J’ai 30 ans.'
