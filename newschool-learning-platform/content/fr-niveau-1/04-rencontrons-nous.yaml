vocabulary:
  - slug: rencontrons-nous
    title: Rencontrons-nous
    items: *rencontrons-nous-words

activities:
  - slug: rencontrons-nous-jours
    title: Les jours, les dates et les nombres
    minutes: 8
    items:
      - id: le-premier
        type: multipleChoice
        prompt: Aujourd’hui, c’est ___ mai. (1er)
        options:
          - { text: le premier, correct: true }
          - {
              text: le un,
              feedback: 'Pour le premier jour du mois, on dit *le premier*, pas « le un ».',
            }
          - { text: en premier, feedback: 'Devant une date, on met *le* : *le premier mai*.' }
      - id: le-en
        type: fillBlank
        prompt: Complète avec *le* ou *en*.
        text: Mon anniversaire est ___ 21 mars. Je suis né ___ 2010.
        blanks: [[le], [en]]
        wordBank: [le, en]
      - id: le-lundi
        type: trueFalse
        prompt: '« Le lundi, je fais du yoga » veut dire : je fais du yoga tous les lundis.'
        answer: true
        feedback:
          correct: Oui ! *Le* devant un jour de la semaine = tous les…
          incorrect: '*Le* devant un jour de la semaine veut dire « tous les… » : le lundi = tous les lundis.'
      - id: nombres-31
        type: matching
        prompt: Associe les nombres.
        pairs:
          - ['13', treize]
          - ['21', vingt et un]
          - ['25', vingt-cinq]
          - ['30', trente]
          - ['31', trente et un]
      - id: apres-mardi
        type: multipleChoice
        prompt: Quel jour vient après mardi ?
        options:
          - { text: mercredi, correct: true }
          - {
              text: jeudi,
              feedback: 'Lundi, mardi, mercredi, jeudi : après mardi, c’est *mercredi*.',
            }
          - { text: lundi, feedback: '*Lundi* vient avant mardi. Après mardi, c’est *mercredi*.' }
      - id: jours-semaine
        type: fillBlank
        prompt: Complète les jours de la semaine.
        text: lundi, mardi, ___, jeudi, vendredi, samedi, ___
        blanks: [[mercredi], [dimanche]]
      - id: ordre-premier-mai
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Mon anniversaire est le premier mai.
      - id: le-samedi
        type: multipleChoice
        prompt: Je fais du sport ___ samedi. (= tous les samedis)
        options:
          - { text: le, correct: true }
          - {
              text: en,
              feedback: '*En* va devant un mois ou une année. Devant un jour : *le samedi*.',
            }
          - { text: à, feedback: 'Pour dire « tous les samedis », on met *le* : *le samedi*.' }

  - slug: rencontrons-nous-prepositions
    title: 'Les prépositions de base : à, en, de, avec'
    minutes: 8
    items:
      - id: a-ecole
        type: multipleChoice
        prompt: Je vais ___ l’école.
        options:
          - { text: à, correct: true }
          - {
              text: en,
              feedback: '*En* est pour un pays ou un moyen de transport. Pour une destination : *à l’école*.',
            }
          - {
              text: avec,
              feedback: '*Avec* est pour la compagnie ou un outil. Pour une destination : *à*.',
            }
      - id: en-train
        type: multipleChoice
        prompt: Nous voyageons ___ train.
        options:
          - { text: en, correct: true }
          - { text: à, feedback: 'Pour un moyen de transport, on utilise *en* : *en train*.' }
          - {
              text: de,
              feedback: '*De* est pour l’origine ou la possession. Transport : *en train*.',
            }
      - id: livre-de
        type: multipleChoice
        prompt: C’est le livre ___ Marie.
        options:
          - { text: de, correct: true }
          - { text: en, feedback: 'Pour la possession, on utilise *de* : le livre *de* Marie.' }
          - { text: avec, feedback: '*Avec* est pour la compagnie ou un outil. Possession : *de*.' }
      - id: a-avec
        type: fillBlank
        prompt: Complète avec la bonne préposition.
        text: Le cours est ___ 9 h. Je coupe la viande ___ un couteau.
        blanks: [[à], [avec]]
        wordBank: [à, en, de, avec]
      - id: utilisations
        type: matching
        prompt: Associe chaque préposition à son utilisation.
        pairs:
          - [à, 'direction, destination, heure']
          - [en, 'lieu, moyen de transport']
          - [de, 'origine, possession']
          - [avec, 'compagnie, outil']
      - id: heure-a
        type: trueFalse
        prompt: 'Pour dire l’heure, on utilise *à* : Le cours est à 9 h.'
