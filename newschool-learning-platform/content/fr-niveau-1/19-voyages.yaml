vocabulary:
  - slug: voyages
    title: Voyages
    items: *voyages-words

activities:
  - slug: voyages-questions
    title: 'Poser des questions : où, quand, comment, pourquoi'
    minutes: 8
    items:
      - id: quand-pars
        type: multipleChoice
        prompt: '___ pars-tu en vacances ? — En juillet.'
        options:
          - { text: Quand, correct: true }
          - {
              text: Où,
              feedback: '*Où* demande un lieu. *En juillet* est un moment : utilise *quand*.',
            }
          - {
              text: Qui,
              feedback: '*Qui* demande une personne. *En juillet* est un moment : utilise *quand*.',
            }
      - id: avec-qui
        type: multipleChoice
        prompt: '___ voyages-tu ? — Avec mes amis.'
        options:
          - { text: Avec qui, correct: true }
          - {
              text: Où,
              feedback: '*Où* demande un lieu. *Avec mes amis* parle de personnes : utilise *avec qui*.',
            }
          - {
              text: Pourquoi,
              feedback: '*Pourquoi* demande une raison (réponse : *parce que…*). Ici on parle de personnes : *avec qui*.',
            }
      - id: pourquoi
        type: multipleChoice
        prompt: 'Réponse : *Parce que j’aime découvrir le monde.* Quelle est la question ?'
        options:
          - { text: Pourquoi voyages-tu ?, correct: true }
          - {
              text: Comment voyages-tu ?,
              feedback: '*Comment* demande la manière (*en avion*). Une réponse avec *parce que* répond à *pourquoi*.',
            }
          - {
              text: Quand voyages-tu ?,
              feedback: '*Quand* demande un moment. Une réponse avec *parce que* répond à *pourquoi*.',
            }
      - id: comment-ou
        type: fillBlank
        prompt: Complète avec *comment* ou *où*.
        text: '___ voyages-tu ? — En avion. ___ dors-tu ? — Dans un hôtel.'
        blanks: [[Comment, comment], [Où, où]]
        wordBank: [Comment, Où]
      - id: associe
        type: matching
        prompt: Associe chaque question à sa réponse.
        pairs:
          - [Quand pars-tu en vacances ?, En juillet.]
          - [Où vas-tu en été ?, À la plage.]
          - [Qu’emportes-tu quand tu voyages ?, Un appareil photo.]
          - [Avec qui voyages-tu ?, Avec mes amis.]
          - [Comment voyages-tu ?, En avion.]
      - id: negative-vf
        type: trueFalse
        prompt: 'Cette question négative est correcte : *Qu’est-ce que tu n’aimes pas faire en vacances ?*'
        answer: true
        feedback:
          correct: 'Bravo ! On met *ne* (*n’* devant une voyelle) avant le verbe et *pas* après : *tu n’aimes pas*.'
          incorrect: 'Elle est correcte : *ne* (*n’* devant une voyelle) + verbe + *pas* : *tu n’aimes pas*.'
      - id: negative
        type: multipleChoice
        prompt: Qu’est-ce que tu ___ faire en vacances ?
        options:
          - { text: n’aimes pas, correct: true }
          - {
              text: ne aimes pas,
              feedback: 'Devant une voyelle, *ne* devient *n’* : *tu n’aimes pas*.',
            }
          - {
              text: pas aimes,
              feedback: 'La négation a deux mots autour du verbe : *ne* (*n’*) + verbe + *pas* : *tu n’aimes pas*.',
            }
      - id: ordonne-question
        type: reorderSentence
        prompt: Remets les mots dans l’ordre pour faire une question.
        sentence: Où dors-tu quand tu voyages ?

  - slug: voyages-directions
    title: 'Donner des directions : tu ou vous ?'
    minutes: 8
    items:
      - id: va-ami
        type: multipleChoice
        prompt: 'Tu parles à ton ami : « ___ tout droit. »'
        options:
          - { text: Va, correct: true }
          - {
              text: Allez,
              feedback: '*Allez* est pour une personne qu’on ne connaît pas (*vous*). Avec un ami, on dit *va*.',
            }
          - {
              text: Aller,
              feedback: '*Aller* est l’infinitif. Pour donner une direction à un ami, on dit *va*.',
            }
      - id: tournez-inconnu
        type: multipleChoice
        prompt: 'Tu parles à une personne que tu ne connais pas : « ___ à gauche. »'
        options:
          - { text: Tournez, correct: true }
          - {
              text: Tourne,
              feedback: '*Tourne* est pour un ami (*tu*). Avec une personne qu’on ne connaît pas, on dit *tournez*.',
            }
          - {
              text: Tourner,
              feedback: '*Tourner* est l’infinitif. Avec une personne qu’on ne connaît pas, on dit *tournez*.',
            }
      - id: tu-vous
        type: matching
        prompt: Associe la forme avec *tu* à la forme avec *vous*.
        pairs:
          - [Va, Allez]
          - [Tourne, Tournez]
          - [Marche, Marchez]
          - [Continue, Continuez]
      - id: etapes
        type: fillBlank
        prompt: Complète avec *d’abord* et *ensuite*.
        text: ___, tournez à gauche. ___, continuez tout droit.
        blanks: [[D’abord, "D'abord", d’abord, "d'abord"], [Ensuite, ensuite]]
        wordBank: [D’abord, Ensuite]
      - id: marchez-vf
        type: trueFalse
        prompt: '*Marchez 100 mètres* est une phrase pour une personne qu’on ne connaît pas.'
        answer: true
        feedback:
          correct: 'Bravo ! *Marchez* va avec *vous* : on l’utilise avec une personne qu’on ne connaît pas.'
          incorrect: 'C’est vrai : *marchez* va avec *vous*. Avec un ami, on dit *marche*.'
      - id: en-face-de
        type: multipleChoice
        prompt: Que veut dire *en face de* ?
        options:
          - { text: ממול, correct: true }
          - { text: ליד, feedback: '*ליד* se dit *à côté de*. *En face de* veut dire ממול.' }
          - { text: מאחורי, feedback: '*מאחורי* se dit *derrière*. *En face de* veut dire ממול.' }
      - id: en-face-du
        type: fillBlank
