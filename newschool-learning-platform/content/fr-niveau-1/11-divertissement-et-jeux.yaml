          - { term: voir, gloss: לראות }
          - { term: courir, gloss: לרוץ }
          - { term: dire, gloss: לומר }
          - { term: lever, gloss: להרים }
          - { term: applaudir, gloss: למחוא כפיים }
          - { term: fermer, gloss: לסגור }
          - { term: jeu, gloss: משחק }
          - { term: sport, gloss: ספורט }
          - { term: télévision, gloss: טלוויזיה }
          - { term: ordinateur, gloss: מחשב }
          - { term: téléphone, gloss: טלפון }
          - { term: 'mon, ma, mes', gloss: שלי }
          - { term: 'ton, ta, tes', gloss: שלך }
          - { term: 'son, sa, ses', gloss: שלו / שלה }
          - { term: 'notre, nos', gloss: שלנו }
          - { term: 'votre, vos', gloss: שלכם / שלכן }
          - { term: 'leur, leurs', gloss: שלהם / שלהן }
