vocabulary:
  - slug: divertissement-et-jeux
    title: Divertissement et jeux
    items: *divertissement-words

activities:
  - slug: divertissement-et-jeux-present
    title: Actions au présent
    minutes: 8
    items:
      - id: elle-joue
        type: multipleChoice
        prompt: Elle ___ au tennis.
        options:
          - { text: joue, correct: true }
          - {
              text: joues,
              feedback: '*Joues* est pour *tu* : tu joues. Avec *elle*, on dit *elle joue*.',
            }
          - {
              text: jouent,
              feedback: '*Jouent* est pour *ils / elles* (plusieurs personnes). Avec *elle*, on dit *elle joue*.',
            }
      - id: nous-parlons
        type: multipleChoice
        prompt: Nous ___ français en classe.
        options:
          - { text: parlons, correct: true }
          - {
              text: parlez,
              feedback: '*Parlez* est pour *vous*. Avec *nous*, le verbe finit en *-ons* : nous parlons.',
            }
          - {
              text: parle,
              feedback: '*Parle* est pour *je* ou *il / elle*. Avec *nous*, on dit *nous parlons*.',
            }
      - id: samedi
        type: fillBlank
        prompt: Complète avec le verbe au présent.
        text: Le samedi, je ___ (jouer) au football et mes amis ___ (regarder) le match.
        blanks: [[joue], [regardent]]
      - id: parler
        type: matching
        prompt: Associe chaque sujet à la bonne forme du verbe *parler*.
        pairs:
          - [je, parle]
          - [tu, parles]
          - [nous, parlons]
          - [vous, parlez]
          - [ils, parlent]
      - id: sans-auxiliaire
        type: trueFalse
        prompt: Pour dire « אני משחק », on dit « je suis joue ».
        answer: false
        feedback:
          correct: Bravo ! Au présent, le verbe est un seul mot, sans auxiliaire.
          incorrect: 'Au présent, le verbe est un seul mot : on dit *je joue*.'
      - id: finir-vendre
        type: fillBlank
        prompt: Complète avec le verbe au présent.
        text: Le film ___ (finir) à neuf heures. Mes parents ___ (vendre) leur voiture.
        blanks: [[finit], [vendent]]
      - id: ordre-copine
        type: reorderSentence
        prompt: Remets les mots dans l'ordre.
        sentence: Ma copine regarde des films.
      - id: mes-amis
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - { text: Mes amis jouent au Monopoly., correct: true }
          - {
              text: Mes amis joue au Monopoly.,
              feedback: '*Mes amis* = *ils* : le verbe finit en *-ent* (ils jouent).',
            }
          - {
              text: Mes amis jouons au Monopoly.,
              feedback: '*Jouons* est pour *nous*. *Mes amis* = *ils* : ils jouent.',
            }

  - slug: divertissement-et-jeux-possessifs
    title: Les adjectifs possessifs
    minutes: 8
    items:
      - id: mon-telephone
        type: multipleChoice
        prompt: C'est ___ téléphone. (à moi)
        options:
          - { text: mon, correct: true }
          - { text: ma, feedback: '*Téléphone* est masculin : on dit *mon téléphone*.' }
          - {
              text: mes,
              feedback: '*Mes* est pour un nom au pluriel. *Téléphone* est singulier : *mon*.',
            }
      - id: notre-maison
        type: multipleChoice
        prompt: ___ maison est grande. (à nous)
        options:
          - { text: Notre, correct: true }
          - {
              text: Nos,
              feedback: '*Nos* est pour un nom au pluriel. *Maison* est singulier : *notre maison*.',
            }
          - { text: Leur, feedback: '*Leur* est pour *ils / elles*. Pour *nous*, on dit *notre*.' }
      - id: sa-soeur
        type: multipleChoice
        prompt: Paul aime ___ sœur.
        options:
          - { text: sa, correct: true }
          - {
              text: son,
              feedback: 'On choisit selon le nom, pas selon Paul : *sœur* est féminin, donc *sa sœur*.',
            }
          - {
              text: ses,
              feedback: '*Ses* est pour un nom au pluriel. *Sœur* est singulier : *sa sœur*.',
            }
      - id: mon-amie
        type: trueFalse
        prompt: On dit « mon amie » (pas « ma amie »), parce que *amie* commence par une voyelle.
        answer: true
        feedback:
          correct: 'Oui ! Devant une voyelle, on utilise *mon, ton, son* : mon amie, ton avocate.'
          incorrect: 'Devant un nom féminin qui commence par une voyelle, on utilise *mon* : mon amie.'
      - id: paul-mere
        type: trueFalse
        prompt: Dans « Paul aime sa mère », on utilise *sa* parce que Paul est un garçon.
        answer: false
        feedback:
          correct: 'Exact ! On utilise *sa* parce que *mère* est féminin, pas à cause de Paul.'
