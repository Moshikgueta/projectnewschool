vocabulary:
  - slug: art-et-activites-manuelles
    title: Art et activités manuelles
    items: *art-words

activities:
  - slug: art-et-activites-manuelles-description
    title: Phrases descriptives
    minutes: 8
    items:
      - id: tableau-est
        type: multipleChoice
        prompt: Ce tableau ___ beau.
        options:
          - { text: est, correct: true }
          - { text: es, feedback: '*Es* est pour *tu* : tu es. *Ce tableau* = *il* : il est.' }
          - {
              text: sont,
              feedback: '*Sont* est pour *ils / elles* (pluriel). *Ce tableau* est singulier : *est*.',
            }
      - id: couleurs
        type: multipleChoice
        prompt: Les couleurs sont ___.
        options:
          - { text: brillantes, correct: true }
          - {
              text: brillant,
              feedback: '*Couleurs* est féminin et pluriel : on ajoute *-e* et *-s* (brillantes).',
            }
          - {
              text: brillants,
              feedback: '*Couleurs* est féminin : on ajoute *-e* avant le *-s* (brillantes).',
            }
      - id: il-y-a
        type: multipleChoice
        prompt: Dans ce musée, ___ de grandes sculptures.
        options:
          - { text: il y a, correct: true }
          - { text: il est, feedback: "Pour dire qu'une chose existe, on utilise *il y a*." }
          - {
              text: j'ai,
              feedback: "*J'ai* veut dire que je possède une chose. Pour dire qu'une chose existe dans un lieu : *il y a*.",
            }
      - id: image-feminin
        type: trueFalse
        prompt: On écrit « L'image est intéressante » avec un *-e*, parce que *image* est un nom féminin.
        answer: true
        feedback:
          correct: "Bravo ! L'adjectif s'accorde avec le nom : l'image est intéressante."
          incorrect: "*Image* est féminin, donc l'adjectif prend un *-e* : intéressante."
      - id: etre
        type: matching
        prompt: Associe chaque sujet à la bonne forme du verbe *être*.
        pairs:
          - [je, suis]
          - [tu, es]
          - [nous, sommes]
          - [vous, êtes]
          - [ils, sont]
      - id: negatif
        type: fillBlank
        prompt: 'Écris la phrase à la forme négative : « Ce tableau est moderne. »'
        text: Ce tableau ___ moderne.
        blanks: [["n'est pas"]]
      - id: parce-que
        type: fillBlank
        prompt: Complète avec *parce que* ou *parce qu'*.
        text: J'aime cette peinture ___ elle est colorée.
        blanks: [["parce qu'", car]]
      - id: ordre-tableau
        type: reorderSentence
        prompt: Remets les mots dans l'ordre.
        sentence: Ce tableau n'est pas moderne.

  - slug: art-et-activites-manuelles-actions
    title: Actions au présent
    minutes: 8
    items:
      - id: tu-dessines
        type: multipleChoice
        prompt: Tu ___ une ligne.
        options:
          - { text: dessines, correct: true }
          - {
              text: dessine,
              feedback: 'Avec *tu*, le verbe en *-er* finit en *-es* : tu dessines.',
            }
          - { text: dessinez, feedback: '*Dessinez* est pour *vous*. Avec *tu* : tu dessines.' }
      - id: ils-chantent
        type: multipleChoice
        prompt: Ils ___ une chanson.
        options:
          - { text: chantent, correct: true }
          - { text: chante, feedback: 'Avec *ils*, le verbe finit en *-ent* : ils chantent.' }
          - { text: chantons, feedback: '*Chantons* est pour *nous*. Avec *ils* : ils chantent.' }
      - id: marie
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - { text: Marie préfère dessiner des animaux., correct: true }
          - {
              text: Marie préfère dessine des animaux.,
              feedback: "Après *préférer*, le deuxième verbe est à l'infinitif : dessiner.",
            }
          - {
              text: Marie préfères dessiner des animaux.,
              feedback: '*Préfères* est pour *tu*. Avec *Marie* (elle) : elle préfère.',
            }
      - id: peindre-danser
        type: fillBlank
        prompt: Complète avec le verbe au présent.
        text: Je ___ (peindre) un tableau. Nous ___ (danser) le samedi.
        blanks: [[peins], [dansons]]
      - id: consigne
        type: fillBlank
        prompt: 'Donne une consigne à un ami avec le verbe *dessiner*.'
        text: ___ un cercle en haut de la page.
        blanks: [[Dessine]]
      - id: aimer-infinitif
        type: trueFalse
        prompt: "Dans « J'aime peindre », le deuxième verbe est à l'infinitif."
        answer: true
        feedback:
          correct: "Exact ! Après *aimer* ou *préférer*, le verbe est à l'infinitif : j'aime peindre."
          incorrect: "Après *aimer*, le deuxième verbe reste à l'infinitif : j'aime peindre, je préfère dessiner."
      - id: verbes
        type: matching
        prompt: Associe chaque verbe à sa traduction.
        pairs:
          - [dessiner, לצייר]
          - [chanter, לשיר]
          - [danser, לרקוד]
          - [visiter, לבקר]
          - [regarder, להסתכל]
      - id: ordre-animaux
        type: reorderSentence
        prompt: Remets les mots dans l'ordre.
        sentence: Je préfère dessiner des animaux.
