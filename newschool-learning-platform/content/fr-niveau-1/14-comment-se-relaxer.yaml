# Cycle "Comment se relaxer", converted from the French digital notebook
# ("Cahier digital 2026 – français niveau 1"; docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-1
slug: comment-se-relaxer
title: Comment se relaxer
goal: Parler de la détente avec les verbes pronominaux et les phrases descriptives.
position: 14
status: in_review

review:
  - >-
    The two workbook exercises ("Verbes pronominaux" and "Phrases descriptives") are
    NEW: the notebook has no self-study exercises. They were written from the cycle's
    two skills, its summary rules and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - The source gives no activity times for this cycle, so no times are recorded.
  - >-
    The plan says Activities 1 and 3 practise the pronominal verbs, but they use
    ordinary present-tense actions (je vois, j'entends, je mange; "Que fais-tu
    quand…?"); only the warm-up and "je me sens" use pronominal verbs. Activities 1, 3
    and 6 are tagged "Verbes pronominaux / actions". Please confirm.
  - >-
    Summary, pronominal verbs: a rule was ADDED on elision (me, te, se → m', t', s'
    before a vowel or a mute h), because the source examples use it (je m'étire, tu
    t'assieds, il s'allonge) without explaining it. The note "il faut également
    conjuguer le pronom se" is rewritten as "le pronom change avec le sujet".
  - >-
    Summary, descriptive sentences: the negation rule "Ajoutez ne … pas avant et après
    le verbe conjugué" is kept and completed with "ne → n' devant une voyelle" (l'eau
    n'est pas froide). A short rule on the agreement of the adjective (douce / douces)
    was added from the source examples.
  - >-
    Small corrections: "A quel moment" → "À quel moment"; "la présent à la classe" →
    "la présente à la classe"; the warm-up question 4 frame "Je me relaxe ___ (le matin
    / le soir)" → "Je me relaxe le matin / le soir."; the Hebrew words "חמשת החושים" in
    the Activity 1 title were removed (the word "sens" is in the vocabulary).
  - >-
    Activity 2: the list "… quand tu étudies le français ?" etc. is written out as full
    questions "Comment te sens-tu quand…?". A frame "Je me sens ___ parce que ___." was
    added.
  - >-
    Activity 5: the Wheel of Names link in the source is the site's home page
    (https://wheelofnames.com/), not a prepared wheel. It is kept as the activity's
    resource; the teacher still has to create the wheel with the situations listed.
  - >-
    Mori, extra activity 1: "Décrivons une routine relaxante et devine ce que je fais"
    (mixed "we" and "you") → "Je décris une routine relaxante et tu devines ce que je
    fais." The two "Ensuite, Mori décrit… et tu devines" steps are written as second
    messages to send ("À toi !").
  - >-
    Vocabulary: kept as in the source (Hebrew with niqqud). "sens" is glossed with the
    plural "חוּשִׁים" (the French word is the same in the singular and plural).
  - >-
    The "Réponse de l'élève 1/2/3" lines are replaced by the optional answer boxes:
    students may type, and the teacher sees the group's answers.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: comment-se-relaxer-classe
    title: 'Classe : Comment se relaxer'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Comment se relaxer
      - id: skills
        type: cycleOverview
        skills:
          - name: Verbes pronominaux
            description: '*je me relaxe, tu te relaxes, il se relaxe, nous nous relaxons…*'
          - name: Phrases descriptives
            description: 'Sujet + *être* + adjectif : *La musique est relaxante. Les lumières sont douces.*'
      - id: quizlet
        type: externalLink
        label: Se relaxer sur Quizlet
        url: https://quizlet.com/il/1076073051/basic-french-2025-se-relaxer-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. Je me relaxe avec ___.
        example: Je m’appelle Lévanah. Je me relaxe avec un livre.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup
        type: discussionQuestions
        items:
          - question: Quand te sens-tu relaxé(e) ?
            frame: Je me sens relaxé(e) quand ___.
          - question: Quand te sens-tu stressé(e) ?
            frame: Je me sens stressé(e) quand ___.
          - question: Que fais-tu pour te relaxer ?
            frame: Je ___ pour me détendre. Je le fais ___ fois par semaine.
          - question: À quel moment de la journée te relaxes-tu ? Le matin ou le soir ?
            frame: Je me relaxe le matin / le soir.
          - question: Préfères-tu te relaxer à la maison ou dans la nature ? Pourquoi ?
            frame: Je préfère ___ parce que ___.
          - question: Que fais-tu quand tu ne peux pas dormir ?
            frame: 'Je ___. Le / La ___ est ___. (Exemple : Je bois une tisane. La tisane est relaxante.)'
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Parler des 5 sens'
        skills: [Verbes pronominaux / actions]
        steps:
          - Révise le vocabulaire des cinq sens avec ton professeur.
          - Ton professeur donne deux exemples pour chaque sens.
          - Ensuite, chaque élève partage à son tour deux exemples.
        example: |-
          *Je vois un livre. Je vois une fenêtre.*
          *J’entends de la musique. Je touche ma main.*
          *Je sens l’odeur du café. Je mange une pomme.*
      - id: act1-sentences
        type: discussionQuestions
        title: Complète les phrases
        items:
          - question: Je vois ___ et ___.
          - question: J’entends ___ et ___.
          - question: Je touche ___ et ___.
          - question: Je sens ___ et ___.
          - question: Je mange ___ et ___.
      - id: act2
        type: classActivity
        title: 'Activité 2 : Comment te sens-tu quand… ?'
        skills: [Phrases descriptives]
        steps:
          - Travaillez en binômes.
          - Pose les questions ci-dessous à ton partenaire.
          - Chaque binôme partage certaines réponses avec la classe.
      - id: act2-questions
        type: discussionQuestions
        items:
          - question: Comment te sens-tu quand tu te réveilles tôt ? Pourquoi ?
            frame: Je me sens ___ parce que ___.
          - question: Comment te sens-tu quand tu étudies le français ? Pourquoi ?
            frame: Je me sens ___ parce que ___.
          - question: Comment te sens-tu quand tu manges ton plat préféré ?
            frame: Je me sens ___.
          - question: Comment te sens-tu quand tu vois ton meilleur ami / ta meilleure amie ?
            frame: Je me sens ___.
          - question: Comment te sens-tu quand tu regardes un film drôle ?
            frame: Je me sens ___.
          - question: Comment te sens-tu quand tu as un examen ?
            frame: Je me sens ___.
          - question: Comment te sens-tu quand tu joues à un jeu ?
            frame: Je me sens ___.
          - question: Comment te sens-tu quand tu as faim ?
            frame: Je me sens ___.
          - question: Comment te sens-tu quand tu reçois un cadeau ?
            frame: Je me sens ___.
          - question: Comment te sens-tu quand tu es à la maison ?
            frame: Je me sens ___.
          - question: Comment te sens-tu quand tu écoutes de la musique ?
            frame: Je me sens ___.
          - question: Comment te sens-tu quand tu vas à la plage ?
            frame: Je me sens ___.
          - question: Comment te sens-tu quand tu parles français ?
            frame: Je me sens ___.
      - id: act3
        type: classActivity
        title: 'Activité 3 : Que fais-tu quand… ?'
        skills: [Verbes pronominaux / actions]
        steps:
          - Travaillez en binômes. Pose les questions ci-dessous à ton partenaire.
          - Note les réponses de ton partenaire.
          - Partage avec la classe une phrase sur ton partenaire, à la troisième personne.
        example: |-
          *Maya mange du chocolat quand elle a faim.*
          *Daniel écoute de la musique quand il se sent stressé.*
          *Tomer promène son chien quand il va au parc.*
      - id: act3-questions
        type: discussionQuestions
        items:
          - question: Que fais-tu quand tu veux dormir mais tu es au travail ?
            frame: Quand je veux dormir au travail, je ___.
          - question: Que fais-tu quand tu te sens stressé(e) ?
            frame: Quand je me sens stressé(e), je ___.
          - question: Que fais-tu quand tu as faim ? Qu’est-ce que tu manges ?
            frame: Quand j’ai faim, je mange ___.
          - question: Que fais-tu quand tu veux te déconnecter ?
            frame: Quand je veux me déconnecter, je ___.
      - id: act4
        type: classActivity
        title: 'Activité 4 : Décris un lieu relaxant et fais-le deviner'
        skills: [Phrases descriptives]
        steps:
          - Pense à un lieu relaxant. Décris trois choses que tu vois ou que tu fais dans ce lieu.
          - Les autres élèves essaient de deviner de quel lieu il s’agit.
          - Dis la réponse.
          - La première personne qui devine juste décrit le lieu suivant.
        example: |-
          *Il y a de l’eau. Je mange une glace. Je porte un maillot de bain.*
          *— La plage !*
      - id: act4-sentences
        type: discussionQuestions
        title: Mon lieu relaxant
        items:
          - question: Il y a ___.
          - question: Je ___.
          - question: Je porte / Je vois ___.
          - question: Quel est ce lieu ? Je pense que c’est ___.
      - id: act5
        type: classActivity
        title: 'Activité 5 : La roue des émotions'
        skills: [Phrases descriptives]
        steps:
          - Ton professeur fait tourner la roue et choisit un élève.
          - Dis comment tu te sens dans cette situation, et pourquoi.
          - '**Règle :** chaque élève donne une réponse **différente**.'
        wordBank:
          [
            Se réveiller tôt,
            Manger une pizza,
            Écouter de la musique,
            Aller à la plage,
            Recevoir un cadeau,
            Avoir un examen,
            Regarder un film drôle,
            Parler français,
            Jouer à un jeu,
            Rester à la maison un dimanche,
          ]
        example: |-
          Situation : *avoir un examen*
          *Je me sens nerveux parce que je dois beaucoup étudier.*
          *Je me sens fatigué parce que je n’ai pas bien dormi.*
        resource:
          label: Roue des émotions (Wheel of Names)
          url: https://wheelofnames.com/
      - id: act5-sentences
        type: discussionQuestions
        title: Complète la phrase
        items:
          - question: Je me sens ___ parce que ___.
      - id: act6
        type: classActivity
        title: 'Activité 6 : Mon week-end relaxant'
        skills: [Verbes pronominaux / actions]
        steps:
          - Écris 3 phrases sur ce que tu fais pendant un week-end relaxant.
          - 'Travaillez en binômes. Demande à ton partenaire : *Que fais-tu pendant un week-end relaxant ?*'
          - Présente à la classe une phrase de ton partenaire.
        example: |-
          A : *Que fais-tu pendant un week-end relaxant ?*
          B : *Je marche dans le parc et j’écoute de la musique.*
          A : *Super ! La musique est relaxante.*
          *Maria boit du café et regarde un film. Pierre se repose à la maison parce qu’il est fatigué.*
      - id: act6-sentences
        type: discussionQuestions
        title: Mon week-end relaxant
        items:
          - question: Je ___. (Je dors beaucoup.)
          - question: Je ___. (Je bois du thé.)
          - question: J’écoute / Je regarde ___. (J’écoute de la musique calme.)
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Deux compétences dans ce cycle : **Verbes pronominaux** (questions
          d’échauffement et Activité 1 ou 3) et **Phrases descriptives** (Activité 2 ou
          4). Les Activités 5 et 6 sont des activités supplémentaires.
      - id: n-intro
        anchor: intro
        text: Donne ton propre exemple d’abord, puis interroge chaque élève.
      - id: n-warmup
        anchor: warmup
        text: Pose au moins deux questions à chaque élève. Les réponses écrites ici apparaissent sous chaque question.
      - id: n-act1
        anchor: act1
        text: >-
          Révise le vocabulaire des cinq sens (voir, entendre, toucher, sentir, goûter /
          manger). Donne deux exemples pour un sens ; ensuite, chaque élève donne ses deux
          exemples. Travaille un sens à la fois.
      - id: n-act3
        anchor: act3
        text: >-
          Si l’élève répond « je mange », il doit préciser quoi. À la fin, chaque élève
          partage une phrase sur son partenaire à la troisième personne.
      - id: n-act4
        anchor: act4
        text: La première personne qui devine juste passe à la description suivante.
      - id: n-act5
        anchor: act5
        text: >-
          Prépare la roue avant le cours sur Wheel of Names (le lien ouvre le site, pas
          une roue prête) avec les dix situations de la liste, puis présente-la à la
          classe. Fais tourner la roue et choisis un élève.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: comment-se-relaxer-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: rules-pronominaux
        type: ruleSummary
        skill: Verbes pronominaux
        rules:
          - text: 'On utilise un verbe pronominal quand **le sujet fait l’action sur lui-même**. À l’infinitif, ces verbes commencent par **se** : se relaxer, se détendre, se sentir, se reposer.'
          - text: 'Le pronom **change avec le sujet** : me, te, se, nous, vous, se.'
            examples:
              [
                Je **me** relaxe,
                Tu **te** relaxes,
                Il / Elle **se** relaxe,
                Nous **nous** relaxons,
                Vous **vous** relaxez,
                Ils / Elles **se** relaxent,
              ]
          - text: 'Devant une voyelle ou un h muet, **me, te, se** deviennent **m’, t’, s’**.'
            examples: [Je **m’**étire., Tu **t’**assieds., Il **s’**allonge.]
          - text: Exemples dans une routine relaxante.
            examples:
              [
                Je **m’étire** avant de dormir.,
                Tu **t’assieds** dans une position confortable.,
                Il **s’allonge** dans le hamac.,
                Nous **nous concentrons** sur notre respiration.,
                Ils **se baignent** dans l’eau chaude.,
              ]
      - id: rules-descriptives
        type: ruleSummary
        skill: Phrases descriptives
        rules:
          - text: 'On utilise les phrases descriptives pour décrire un lieu, une personne ou une situation, et pour donner des informations sur l’état ou l’apparence.'
            examples: [L’ambiance est calme., La musique est relaxante., Les lumières sont douces.]
          - text: 'Structure : **sujet + verbe être + adjectif ou nom**. Au singulier : **est** ; au pluriel : **sont**.'
            examples:
              [L’arôme est agréable., La pièce est silencieuse., Les serviettes sont douces.]
          - text: 'L’adjectif s’accorde avec le sujet : féminin (+ **e**), pluriel (+ **s**).'
            examples:
              [
                Le thé est chaud. · La tisane est chaude.,
                La lumière est douce. · Les lumières sont douces.,
              ]
          - text: 'Négation : **ne** avant le verbe conjugué et **pas** après. Devant une voyelle, **ne** devient **n’**.'
            examples:
              [
                L’eau **n’est pas** froide.,
                La musique **n’est pas** forte.,
                Les murs **ne sont pas** sombres.,
              ]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Révise les deux compétences avec le groupe et demande un nouvel exemple pour chaque règle.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: comment-se-relaxer-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie ce message et envoie-le. Mori va te poser des questions ; réponds à toutes.
      - id: mori-relaxer
        type: aiTutorPrompt
        title: Parler de la détente
        message: >-
          Bonjour Mori ! Je veux pratiquer mon français. Peux-tu me poser des questions
          sur la détente en utilisant des phrases descriptives et des verbes pronominaux
          au présent ? Merci de corriger mes erreurs.
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          Tu veux plus de questions ? Envoie : **S’il te plaît, pose-moi plus de questions !**
          Tu ne comprends pas une explication ? Envoie : **Peux-tu m’expliquer en hébreu mais avec la phrase en français ?**
      - id: extra-title
        type: heading
        level: 3
        text: Pratique supplémentaire
      - id: mori-routine
        type: aiTutorPrompt
        title: Une routine relaxante
        intro: >-
          Envoie ce message à Mori, puis décris une routine relaxante. Par exemple : *Je
          m’assieds dans un fauteuil confortable. Je bois du thé. Je lis un livre.
          J’écoute de la musique calme.* (Mori devine : *Tu te détends à la maison.*)
        message: Bonjour Mori ! Faisons une activité. Je décris une routine relaxante et tu devines ce que je fais.
      - id: mori-routine-tour
        type: aiTutorPrompt
        title: 'Une routine relaxante : à toi, Mori !'
        intro: Ensuite, envoie ce message.
        message: À toi ! Décris une routine relaxante et je devine ce que tu fais.
      - id: mori-lieu
        type: aiTutorPrompt
        title: Mon lieu de détente
        intro: >-
          Envoie ce message à Mori, puis décris ton lieu. Par exemple : *Il y a un grand
          arbre. Je m’assieds dessous et j’écris dans mon carnet. J’entends des oiseaux et
          je vois des fleurs.*
        message: Bonjour Mori ! Je vais décrire mon lieu préféré pour me détendre, et tu dois l’imaginer.
      - id: mori-lieu-tour
        type: aiTutorPrompt
        title: 'Mon lieu de détente : à toi, Mori !'
        intro: Ensuite, envoie ce message.
        message: À toi ! Décris ton lieu préféré pour te détendre et je devine où c’est.

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: comment-se-relaxer-pratique
    book: workbook
    title: 'Pratique : Comment se relaxer'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Pratique les deux compétences du cycle. Chaque réponse est corrigée tout de suite, et tu peux réessayer.
      - id: ex-pronominaux
        type: activity
        activity: comment-se-relaxer-pronominaux
      - id: ex-descriptives
        type: activity
        activity: comment-se-relaxer-descriptives

