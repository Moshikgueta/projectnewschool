vocabulary:
  - slug: comment-se-relaxer
    title: Comment se relaxer
    items: *relaxer-words

activities:
  - slug: comment-se-relaxer-pronominaux
    title: 'Verbes pronominaux : me, te, se, nous, vous'
    minutes: 8
    items:
      - id: je-me
        type: multipleChoice
        prompt: Je ___ relaxe avec un livre.
        options:
          - { text: me, correct: true }
          - { text: te, feedback: '*Te* va avec *tu*. Avec *je*, on dit *me* : *je me relaxe*.' }
          - { text: se, feedback: '*Se* va avec *il, elle, ils, elles*. Avec *je*, on dit *me*.' }
      - id: nous-nous
        type: multipleChoice
        prompt: Nous ___ concentrons sur notre respiration.
        options:
          - { text: nous, correct: true }
          - {
              text: se,
              feedback: '*Se* va avec *il, elle, ils, elles*. Avec *nous*, le pronom est aussi *nous*.',
            }
          - {
              text: vous,
              feedback: '*Vous* va avec le sujet *vous*. Avec *nous*, on dit *nous nous concentrons*.',
            }
      - id: une-relaxer
        type: matching
        prompt: Associe chaque sujet au verbe *se relaxer*.
        pairs:
          - [je, me relaxe]
          - [tu, te relaxes]
          - [nous, nous relaxons]
          - [vous, vous relaxez]
          - [ils / elles, se relaxent]
      - id: tu-te-ils-se
        type: fillBlank
        prompt: Complète avec le bon pronom.
        text: Tu ___ relaxes à la maison. Ils ___ reposent dans le parc.
