          - { term: heures, gloss: שעות }

vocabulary:
  - slug: les-professions
    title: Les professions
    items: *les-professions-words

activities:
  - slug: les-professions-present
    title: Les actions au présent
    minutes: 8
    items:
      - id: nous-travaillons
        type: multipleChoice
        prompt: Nous ___ dans un hôpital.
        options:
          - { text: travaillons, correct: true }
          - {
              text: travaillez,
              feedback: '*-ez* va avec *vous*. Avec *nous*, la terminaison est *-ons*.',
            }
          - {
              text: travaille,
              feedback: '*-e* va avec *je* ou *il / elle*. Avec *nous* : *travaillons*.',
            }
      - id: ils-finissent
        type: multipleChoice
        prompt: Ils ___ le travail à 17 heures.
        options:
          - { text: finissent, correct: true }
          - {
              text: finit,
              feedback: '*Finit* va avec *il / elle*. Avec *ils*, on dit *finissent*.',
            }
          - {
              text: finissons,
              feedback: '*Finissons* va avec *nous*. Avec *ils*, on dit *finissent*.',
            }
      - id: travaille-travailles
        type: fillBlank
        prompt: Conjugue le verbe *travailler* au présent.
        text: Je ___ dans une école. Tu ___ avec des enfants.
        blanks: [[travaille], [travailles]]
      - id: terminaisons-er
        type: matching
        prompt: Associe chaque personne à la forme du verbe *travailler*.
        pairs:
          - [je, travaille]
          - [tu, travailles]
          - [nous, travaillons]
          - [vous, travaillez]
          - [ils / elles, travaillent]
      - id: veux-cuisiner
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - { text: Je veux cuisiner., correct: true }
          - {
              text: Je veux cuisine.,
              feedback: 'Après *vouloir*, le verbe reste à l’infinitif : *cuisiner*.',
            }
          - {
              text: Je veux je cuisine.,
              feedback: 'Après *vouloir*, on met directement l’infinitif : Je veux *cuisiner*.',
            }
      - id: pouvoir-infinitif
        type: trueFalse
        prompt: 'Après *pouvoir*, le verbe reste à l’infinitif : Je peux aider mes collègues.'
        answer: true
        feedback:
          correct: Oui ! *Vouloir, pouvoir, devoir* + infinitif.
          incorrect: 'Avec *vouloir, pouvoir, devoir*, le verbe suivant reste à l’infinitif : Je peux *aider*.'
      - id: finit-finissons
        type: fillBlank
        prompt: Conjugue le verbe *finir* au présent.
        text: Elle ___ son rapport. Nous ___ à midi.
        blanks: [[finit], [finissons]]
      - id: ordre-rapport
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Je dois préparer un rapport.

  - slug: les-professions-nombres
    title: Les nombres
    minutes: 8
    items:
      - id: dizaines
        type: matching
        prompt: Associe les nombres.
        pairs:
          - ['30', trente]
          - ['40', quarante]
          - ['50', cinquante]
          - ['60', soixante]
          - ['100', cent]
      - id: soixante-dix
        type: multipleChoice
        prompt: Comment dit-on 70 ?
        options:
          - { text: soixante-dix, correct: true }
          - { text: sept-dix, feedback: '70 = 60 + 10 : on dit *soixante-dix*.' }
          - { text: dix-sept, feedback: '*Dix-sept*, c’est 17. 70 = 60 + 10 : *soixante-dix*.' }
      - id: quatre-vingts
        type: multipleChoice
        prompt: Comment dit-on 80 ?
        options:
          - { text: quatre-vingts, correct: true }
          - { text: huit-dix, feedback: '80 = 4 × 20 : on dit *quatre-vingts*.' }
          - { text: quatre-vingt-dix, feedback: '*Quatre-vingt-dix*, c’est 90 (4 × 20 + 10).' }
      - id: quarante-heures
        type: fillBlank
        prompt: Écris le nombre en lettres.
        text: 'Je travaille 40 heures par semaine : ___ heures.'
        blanks: [[quarante]]
      - id: vingt-employes
        type: fillBlank
        prompt: Écris le nombre en lettres.
        text: Dans mon entreprise, il y a ___ (20) employés.
        blanks: [[vingt]]
      - id: quatre-vingt-dix
        type: trueFalse
        prompt: 90 se dit « quatre-vingt-dix ».
        answer: true
        feedback:
          correct: Oui ! 90 = 4 × 20 + 10.
          incorrect: 90 = 4 × 20 + 10 = *quatre-vingt-dix*.
      - id: addition
        type: multipleChoice
        prompt: 30 € + 20 € = ?
        options:
          - { text: cinquante euros, correct: true }
          - { text: quarante euros, feedback: '*Quarante*, c’est 40. 30 + 20 = 50 : *cinquante*.' }
          - { text: soixante euros, feedback: '*Soixante*, c’est 60. 30 + 20 = 50 : *cinquante*.' }
      - id: ordre-heures
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Je travaille quarante heures par semaine.
