vocabulary:
  - slug: services-essentiels
    title: Services essentiels
    items: *services-essentiels-words

activities:
  - slug: services-essentiels-directions
    title: 'Les directions : tournez, continuez, se trouver'
    minutes: 8
    items:
      - id: tournez
        type: multipleChoice
        prompt: 'Tu parles à une personne que tu ne connais pas : « Pour aller à la banque, ___ à gauche. »'
        options:
          - { text: tournez, correct: true }
          - {
              text: tourne,
              feedback: '*Tourne* est pour un ami (*tu*). Avec une personne qu’on ne connaît pas, on dit *tournez* (*vous*).',
            }
          - {
              text: tourner,
              feedback: '*Tourner* est l’infinitif. Pour donner une direction, on utilise l’impératif : *tournez*.',
            }
      - id: mots-directions
        type: matching
        prompt: Associe chaque mot à sa traduction.
        pairs:
          - [tout droit, ישר]
          - [à gauche, שמאלה]
          - [à droite, ימינה]
          - [à pied, ברגל]
          - [l’arrêt de bus, תחנת אוטובוס]
      - id: se-trouve
        type: fillBlank
        prompt: Complète avec *trouve* ou *est*.
        text: La bibliothèque se ___ dans le centre-ville. Elle ___ entre le supermarché et le restaurant.
        blanks: [[trouve], [est, se trouve]]
        wordBank: [trouve, est]
      - id: allez
        type: trueFalse
        prompt: 'Pour donner une direction à une personne qu’on ne connaît pas, on dit : *Allez tout droit.*'
        answer: true
        feedback:
          correct: 'Bravo ! Avec une personne qu’on ne connaît pas, on utilise *vous* : *Allez tout droit.*'
          incorrect: 'C’est vrai : avec une personne qu’on ne connaît pas, on utilise l’impératif avec *vous* : *Allez tout droit.*'
      - id: comment-aller
        type: multipleChoice
        prompt: '« Comment aller à la bibliothèque ? » Quelle est la bonne réponse ?'
        options:
          - { text: Tu marches tout droit puis tu tournes à droite., correct: true }
          - {
              text: 'Oui, je vais à la bibliothèque.',
              feedback: 'La question *comment* demande le chemin, pas « oui » ou « non ». Donne des directions : *tu marches tout droit…*',
            }
          - {
              text: La bibliothèque est grande.,
              feedback: 'Cette phrase décrit la bibliothèque. La question demande le chemin : *tu marches tout droit, tu tournes à droite…*',
            }
      - id: imperatif
        type: fillBlank
        prompt: 'Écris le verbe à l’impératif avec *vous*.'
        text: ___ (continuer) tout droit, puis ___ (prendre) à gauche.
        blanks: [[Continuez, continuez], [prenez, Prenez]]
      - id: puis
        type: multipleChoice
        prompt: Tu marches 100 mètres, ___ tu tournes à droite.
        options:
          - { text: puis, correct: true }
          - {
              text: entre,
              feedback: '*Entre* est une préposition de lieu (*entre la banque et le parc*). Pour dire l’étape suivante, on utilise *puis*.',
            }
          - {
              text: devant,
              feedback: '*Devant* est une préposition de lieu (*devant le parc*). Pour dire l’étape suivante, on utilise *puis*.',
            }
      - id: ordonne-direction
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Tournez à droite après la banque.

  - slug: services-essentiels-prepositions
    title: 'Les prépositions : devant, entre, à côté de, en face de'
    minutes: 8
    items:
      - id: entre
        type: multipleChoice
        prompt: La banque est ___ l’école et le parc.
        options:
          - { text: entre, correct: true }
          - {
              text: devant,
              feedback: 'Il y a deux lieux (*l’école* et *le parc*) : on utilise *entre … et …*.',
            }
          - {
              text: à côté de,
              feedback: 'Il y a deux lieux (*l’école* et *le parc*) : on utilise *entre … et …*.',
            }
      - id: de-la
        type: multipleChoice
        prompt: Le métro est en face ___ bibliothèque.
        options:
          - { text: de la, correct: true }
          - {
              text: du,
              feedback: '*Bibliothèque* est féminin (*la bibliothèque*) : on dit *de la*. *Du* (= de + le) est pour le masculin.',
            }
          - {
              text: de le,
              feedback: 'On ne dit pas *de le* : de + le = *du*. Mais *bibliothèque* est féminin : *de la bibliothèque*.',
            }
      - id: du-l
        type: fillBlank
        prompt: Complète avec *du* ou *l’*.
        text: C’est à côté ___ restaurant. Je suis devant ___hôpital.
        blanks: [[du], [l’, "l'"]]
        wordBank: [du, l’]
      - id: cest-musee
        type: multipleChoice
        prompt: 'Le musée ? ___ dans le centre-ville.'
        options:
          - { text: C’est, correct: true }
          - {
              text: Il y a,
              feedback: 'On parle d’un lieu connu (*le musée*) et on dit où il est : *C’est dans le centre-ville.*',
            }
      - id: il-y-a
        type: trueFalse
        prompt: 'Pour dire qu’une chose existe à un endroit, on utilise *il y a* : *Il y a un arrêt de bus juste en face.*'
        answer: true
        feedback:
          correct: Bravo ! *Il y a* + un / une dit qu’une chose existe à un endroit.
          incorrect: 'C’est vrai : *il y a* + un / une dit qu’une chose existe à un endroit.'
      - id: prepositions-hebreu
        type: matching
        prompt: Associe chaque préposition à sa traduction.
        pairs:
          - [devant, לפני]
          - [derrière, מאחורי]
          - [à côté de, ליד]
          - [entre, בין]
          - [en face de, ממול]
      - id: de-l-ecole
        type: multipleChoice
        prompt: Le parc est à côté ___ école.
        options:
          - { text: de l’, correct: true }
          - { text: de la, feedback: 'Devant une voyelle, *la* devient *l’* : *de l’école*.' }
          - {
              text: du,
              feedback: '*École* est féminin, et commence par une voyelle : *de l’école*.',
            }
      - id: supermarche
        type: fillBlank
        prompt: Complète avec *du* ou *de la*.
        text: Le supermarché est à côté ___ banque et en face ___ musée.
        blanks: [[de la], [du]]
        wordBank: [du, de la]
