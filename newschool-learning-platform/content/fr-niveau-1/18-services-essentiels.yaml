# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-1
slug: services-essentiels
title: Services essentiels
goal: Demander et donner des directions dans la ville avec les prépositions de lieu.
position: 18
status: in_review

review:
  - >-
    The two workbook exercises ("Les directions" and "Les prépositions") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's two
    skills, its summary rules and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Summary, prepositions rule 1 said "Apprenez les différentes prépositions :" with
    an empty list. It is filled from the cycle's vocabulary and introduction (devant,
    derrière, à côté de, entre, en face de, près de, loin de). Rule 2 (c'est / il y
    a) had examples but no explanation; a one-line explanation was added. Rule 3
    (articles) got a short table de + le = du, de + la, de + l', de + les = des.
    Please confirm.
  - >-
    Activity 4 example: the student chose "l'école", but the last question was "Ce
    lieu est-il le musée ? – Oui". It now reads "Ce lieu est-il l'école ? – Oui".
  - >-
    Corrections: warm-up frame "(à côté / en face de)" → "(à côté de / en face de)";
    Activity 2 "Quel/le ___" → "Quel / Quelle ___"; summary "centre ville" →
    "centre-ville"; "Trois règles de  base" (double space) fixed; the summary's
    Hebrew word "ציווי" after "l'impératif" is kept in brackets as a gloss.
  - >-
    The city map used in Activities 1 and 4 is not linked in the notebook. The
    teacher shares it on screen (see the teacher notes); it should move into the
    course's own media.
  - >-
    Vocabulary glosses changed: "Bloc" (בלוק) is not used in French for a city
    block; the term is now "Pâté de maisons" (בלוק של בניינים). "Devant" מלפני →
    לפני; "Je sors" אני יוצא → אני יוצא/ת. The Quizlet link is kept without its
    tracking parameters (?i=…&x=…). Please confirm.
  - >-
    The source gives no times and no recommended activity combinations; the plan in
    the teacher note follows the skill named in each activity title (Activities 1–2
    directions, 3–4 prépositions). The Mori "Activité 1" lines are put into one
    message with blanks.
  - >-
    The "Réponse de l'élève 1/2/3" lines are replaced by the optional answer boxes:
    students may type, and the teacher sees the group's answers.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: services-essentiels-classe
    title: 'Classe : Services essentiels'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Services essentiels
      - id: skills
        type: cycleOverview
        skills:
          - name: Les directions
            description: '*Tournez à droite, continuez tout droit, marchez 10 minutes*'
          - name: Les prépositions
            description: '*devant, derrière, à côté de, entre, en face de*'
      - id: quizlet
        type: externalLink
        label: Services essentiels sur Quizlet
        url: https://quizlet.com/il/1076526767/basic-french-2025-services-essentiels-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. J’habite loin de / près de New School.
        example: Je m’appelle Lévanah. J’habite loin de New School.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup
        type: discussionQuestions
        items:
          - question: Quels lieux se trouvent à côté de chez toi ?
            frame: Le / La ___ est à côté de chez moi. / À côté de chez moi, il y a un / une ___.
          - question: Comment arrives-tu à ___ depuis chez toi ?
            frame: J’arrive à ___ en ___ (transport).
          - question: Quels sont les trois lieux importants dans ta ville ?
            frame: Il y a un ___, un ___ et un ___. / Il y a le / la ___ à ___, le / la ___ à ___ et le / la ___ à ___.
          - question: Comment vas-tu de chez toi à l’arrêt de bus ?
            frame: 'Exemple : Je sors de chez moi, je tourne à droite et je marche tout droit sur 100 mètres. L’arrêt de bus est en face du parc.'
          - question: Où se trouve le supermarché le plus proche de chez toi ?
            frame: Le supermarché le plus proche de chez moi est ___ (à côté de / en face de) ___.
          - question: Comment y arrives-tu ?
            frame: 'Exemple : Je marche tout droit sur 50 mètres puis je tourne à gauche. Le supermarché est à côté de la banque.'
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Le plan de la ville'
        skills: [Les directions]
        steps:
          - Révise les prépositions de direction avec ton professeur. Regarde le plan de la ville et trouve les lieux ensemble.
          - Apprends à demander et à donner des directions (regarde l’exemple).
          - Travaillez en binômes avec le plan. L’élève A demande comment aller à un lieu précis. L’élève B donne les directions avec les prépositions.
          - Après quelques tours, changez de rôle.
          - Discussion en groupe sur les difficultés.
        example: |-
          Élève A : « Comment aller à la bibliothèque ? »
          Élève B : « Tu marches tout droit puis tu tournes à droite. La bibliothèque est à côté de l’école. »
      - id: act2
        type: classActivity
        title: 'Activité 2 : L’office du tourisme'
        skills: [Les directions]
        steps:
          - Chaque élève a son propre office du tourisme.
          - L’élève 1 pose les questions ci-dessous à l’élève 2, qui répond.
          - Ensuite, l’élève suivant pose une question.
      - id: act2-dialogue
        type: discussionQuestions
        title: Demande et réponds
        items:
          - question: Quel / Quelle ___ (supermarché, bibliothèque, musée) me recommandes-tu ?
            frame: Je te recommande le / la ___ (nom).
          - question: Comment y aller ?
            frame: Tu peux y aller en bus / à pied. Il faut marcher ___ mètres, tourner à gauche, puis à droite.
      - id: act3
        type: classActivity
        title: 'Activité 3 : Parler d’un lieu important'
        skills: [Les prépositions]
        steps:
          - Choisis un lieu dans ta ville.
          - 'Décris où il se trouve avec les prépositions : **en, à côté de, entre, devant**.'
          - Complète les phrases ci-dessous et partage avec le groupe.
      - id: act3-sentences
        type: discussionQuestions
        title: Complète les phrases
        items:
          - question: Le lieu que je choisis est ___.
          - question: C’est un lieu important parce que ___.
          - question: Il se situe ___.
          - question: Il est à côté de ___.
          - question: Il est entre ___ et ___.
          - question: Il est devant ___.
      - id: act4
        type: classActivity
        title: 'Activité 4 : Devine le lieu'
        skills: [Les prépositions]
        steps:
          - Un élève choisit un lieu ou un objet sur le plan.
          - Les autres devinent avec des questions **oui / non**, en utilisant les prépositions.
          - L’élève qui a deviné choisit un nouveau lieu.
        example: |-
          (L’élève a choisi l’école.)
          « Ce lieu est-il à côté du cinéma ? » – Non.
          « Ce lieu est-il en face du parc ? » – Oui.
          « Ce lieu est-il l’école ? » – Oui !
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Deux compétences dans ce cycle : **Les directions** (Activités 1 et 2) et
          **Les prépositions** (Activités 3 et 4).
      - id: n-intro
        anchor: intro
        text: Donne ton exemple d’abord, puis demande à chaque élève.
      - id: n-warmup
        anchor: warmup
        text: Pose au moins deux questions à chaque élève. Les réponses écrites ici apparaissent sous chaque question.
      - id: n-act1
        anchor: act1
        text: >-
          Le plan de la ville n’est pas encore dans la plateforme : partage-le à l’écran
          (ou donne une copie à chaque binôme). Commence par réviser les prépositions de
          direction et par identifier les lieux du plan. Termine par une discussion de
          groupe pour clarifier les difficultés et renforcer l’usage correct des
          prépositions.
      - id: n-act4
        anchor: act4
        text: Utilise le même plan de la ville que dans l’Activité 1.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: services-essentiels-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: rules-directions
        type: ruleSummary
        skill: Les directions
        rules:
          - text: On utilise les verbes **se trouver** et **être** pour dire où se trouve un lieu et pour le décrire.
            examples:
              - La bibliothèque se trouve dans le centre-ville. Elle est entre le supermarché et le restaurant.
          - text: >-
              Utilisez des phrases simples pour donner des directions. Le plus souvent, on
              emploie l’impératif (ציווי).
            examples:
              - Continuez tout droit.
              - Tournez à droite.
              - Marchez 10 minutes.
              - Prenez à gauche.
          - text: Mentionnez des lieux à proximité et servez-vous-en comme points de repère.
            examples:
              - à côté du magasin
              - devant le parc
      - id: rules-prepositions
        type: ruleSummary
        skill: Les prépositions
        rules:
          - text: Apprenez les différentes prépositions (regardez le tableau).
          - text: >-
              Faites la différence entre **c’est** et **il y a**. On utilise *c’est* pour
              dire où est un lieu ou pour le décrire ; on utilise *il y a* + un / une pour
              dire qu’une chose existe à un endroit.
            examples:
              - C’est dans le deuxième arrondissement de Paris.
              - Il y a un arrêt de bus juste en face.
          - text: >-
              Utilisez le bon article, en faisant attention au masculin, au féminin et au
              pluriel. **de + le = du**, **de + les = des** ; *de la* et *de l’* ne
              changent pas.
            examples:
              - Je suis devant **l’**hôpital.
              - Le métro est en face **de la** bibliothèque.
              - C’est à côté **du** restaurant.
      - id: prepositions-table
        type: table
        caption: Les prépositions de lieu
        header: [Préposition, Hébreu, Exemple]
        rows:
          - [devant, לפני, Je suis devant l’hôpital.]
          - [derrière, מאחורי, Le parc est derrière l’école.]
          - [à côté de, ליד, C’est à côté du restaurant.]
          - [entre, בין, La banque est entre le musée et le parc.]
          - [en face de, ממול, Le métro est en face de la bibliothèque.]
          - [près de / loin de, קרוב ל / רחוק מ, J’habite près de New School.]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Révise les deux compétences avec le groupe et demande un nouvel exemple pour chaque règle.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: services-essentiels-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie ce message et envoie-le. Mori va te poser des questions ; réponds à chaque question.
      - id: mori-services
        type: aiTutorPrompt
        title: Les services essentiels
        message: >-
          Bonjour Mori ! Je veux pratiquer le français. Peux-tu me poser des questions
          sur les services essentiels en utilisant des directions et des prépositions ?
          Utilise seulement le présent et corrige mes erreurs.
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          Tu veux plus de questions ? Envoie : **Pose-moi plus de questions, s’il te plaît !**
          Tu ne comprends pas une explication en français ? Envoie : **Peux-tu me l’expliquer en hébreu mais avec la phrase en français ?**
      - id: extra-title
        type: heading
        level: 3
        text: Pratique supplémentaire
      - id: mori-lieu
        type: aiTutorPrompt
        title: Parler d’un lieu essentiel
        intro: Complète les blancs et envoie le message à Mori.
        message: |-
          Bonjour Mori. Je te parle d’un service essentiel dans ma ville. Pose-moi des questions avec des prépositions et des directions.
          Dans ma ville, il y a un / une ___.
          Il se trouve ___ (à côté de, devant, entre…).
          Beaucoup de gens y vont pour ___.
          J’y vais quand ___.
          J’aime ce lieu parce que ___.
      - id: mori-devine
        type: aiTutorPrompt
        title: Devine le service
        intro: >-
          Envoie ce message à Mori, puis donne tes indices. Exemple : Il est à côté du
          supermarché. Les gens y vont quand ils sont malades. Il y a des médecins et
          des lits. Mori pose des questions (Est-il près de chez toi ? Y vas-tu
          souvent ?) et devine ton lieu ; ensuite, tu devines le sien.
        message: >-
          Bonjour Mori ! Jouons. Je donne des indices sur un service essentiel et tu
          devines lequel. Pose-moi des questions avec des prépositions et des
          directions. Corrige mes erreurs, s’il te plaît.

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: services-essentiels-pratique
    book: workbook
    title: 'Pratique : Services essentiels'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Pratique les deux compétences du cycle. Chaque réponse est corrigée tout de suite, et tu peux réessayer.
      - id: ex-directions
        type: activity
        activity: services-essentiels-directions
      - id: ex-prepositions
        type: activity
        activity: services-essentiels-prepositions

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: services-essentiels-vocabulaire
    title: Vocabulaire
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Les mots de la ville
        glossLang: he
        link: https://quizlet.com/il/1076526767/basic-french-2025-services-essentiels-flash-cards/
        items: &services-essentiels-words
          - { term: Maison, gloss: בית }
