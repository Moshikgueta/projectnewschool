          - { term: Supermarché, gloss: סופרמרקט }
          - { term: Bibliothèque, gloss: ספרייה }
          - { term: Musée, gloss: מוזיאון }
          - { term: Parc, gloss: פארק }
          - { term: École, gloss: בית ספר }
          - { term: Théâtre, gloss: תיאטרון }
          - { term: Banque, gloss: בנק }
          - { term: Arrêt de bus, gloss: תחנת אוטובוס }
          - { term: Rue, gloss: רחוב }
          - { term: Pâté de maisons, gloss: בלוק של בניינים }
