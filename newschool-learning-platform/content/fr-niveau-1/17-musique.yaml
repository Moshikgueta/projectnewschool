course: fr-niveau-1
slug: musique
title: Musique
goal: Parler de musique en posant des questions et avec les verbes au présent.
position: 17
status: in_review

review:
  - >-
    The two workbook exercises ("Poser des questions" and "Les verbes au présent")
    are NEW: the notebook has no self-study exercises. They were written from the
    cycle's two skills, its summary rules and its vocabulary. Please check level,
    wording and every right answer before students see them.
  - >-
    Song lyrics are NOT copied into the platform (copyright). Activity 1 ("La vie en
    rose", Edith Piaf) keeps the YouTube link and the questions about the song, but
    not the printed lyrics; the teacher plays the song and shows the lyrics from the
    old notebook. Activity 4 ("Comme d'habitude") keeps only the verb bank; the
    gap-fill lyrics stay in the old notebook. The YouTube links are kept without
    their tracking parameters (list, start_radio, ab_channel).
  - >-
    Activity 4: the link label said "Claude Français"; corrected to "Claude
    François". The video is on a fan channel (MalabarMerlin), not an official one:
    please replace it with an official video or the Genius page if possible. In the
    verb bank "j'ai x2" is written "ai (x2)", because the gaps already show "J'".
  - >-
    Activity 3 title "devine la questions" → "devine la question". "Les chanteurs
    gagnent beaucoup d'argent" got its missing full stop; "1 er groupe" → "1er
    groupe".
  - >-
    Summary, questions: the notebook lists "5 main question words" including "est-ce
    que", right after saying that question-word questions cannot be answered with
    oui/non. "Est-ce que" is now a separate rule: it makes a yes/no question. The two
    structures are labelled "oral / courant" (Où tu écoutes…?) and "plus soutenu"
    (Où écoutes-tu…?). Please confirm.
  - >-
    Summary, present tense: a short warning was added that not every verb in -ir is
    in the 2nd group (sortir, dormir are learnt by heart), because the cycle uses
    "je sors". The -er / -ir endings are shown as a table. Please confirm.
  - >-
    Mori homework: the first message asked Mori to work on "les mots interrogatifs
    et les prépositions"; prepositions are not a skill of this cycle (it looks copied
    from another cycle), so it now says "les mots interrogatifs et les verbes au
    présent". The extra activity "Où se passe la scène ?" still practises
    prepositions; it is kept as it is. Please decide whether to keep it.
  - >-
    Vocabulary: "silence" was glossed "שתיקה" (keeping quiet); it is now "שקט".
    "concert" קונצרט → "קונצרט / הופעה". Please confirm.
  - >-
    The notebook gives no times except Activity 5 (2 minutes to prepare, 5 minutes
