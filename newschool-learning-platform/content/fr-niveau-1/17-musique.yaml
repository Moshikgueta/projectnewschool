vocabulary:
  - slug: musique
    title: Musique
    items: *musique-words

activities:
  - slug: musique-questions
    title: 'Poser des questions : quel, où, quand, qui'
    minutes: 8
    items:
      - id: ou-ecoutes
        type: multipleChoice
        prompt: '___ écoutes-tu de la musique ? — À la maison.'
        options:
          - { text: Où, correct: true }
          - {
              text: Quand,
              feedback: '*Quand* demande un moment. La réponse est un lieu (*à la maison*) : utilise *où*.',
            }
          - {
              text: Qui,
              feedback: '*Qui* demande une personne. La réponse est un lieu (*à la maison*) : utilise *où*.',
            }
      - id: qui-chante
        type: multipleChoice
        prompt: '___ chante bien dans ta famille ? — Ma sœur.'
        options:
          - { text: Qui, correct: true }
          - {
              text: Où,
              feedback: '*Où* demande un lieu. La réponse est une personne (*ma sœur*) : utilise *qui*.',
            }
          - {
              text: Quand,
              feedback: '*Quand* demande un moment. La réponse est une personne (*ma sœur*) : utilise *qui*.',
            }
      - id: quelle-musique
        type: multipleChoice
