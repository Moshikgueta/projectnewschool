              term: 'onze, douze, treize, quatorze, quinze',
              gloss: 'אחת עשרה, שתים עשרה, שלוש עשרה, ארבע עשרה, חמש עשרה',
            }
          - {
              term: 'seize, dix-sept, dix-huit, dix-neuf',
