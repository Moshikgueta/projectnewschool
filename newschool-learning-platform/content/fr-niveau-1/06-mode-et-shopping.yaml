vocabulary:
  - slug: mode-et-shopping
    title: Mode et shopping
    items: *mode-et-shopping-words

activities:
  - slug: mode-et-shopping-description
    title: Décrire des vêtements
    minutes: 8
    items:
      - id: robe-elegante
        type: multipleChoice
        prompt: La robe est ___.
        options:
          - { text: élégante, correct: true }
          - { text: élégant, feedback: '*Robe* est féminin : on ajoute un *e* → élégante.' }
          - { text: élégants, feedback: '*Robe* est féminin et singulier : élégante.' }
      - id: sont
        type: multipleChoice
        prompt: Ces chaussures ___ confortables.
        options:
          - { text: sont, correct: true }
          - { text: est, feedback: '*Ces chaussures* est pluriel (= elles) : elles **sont**.' }
          - {
              text: ont,
              feedback: 'Pour décrire, on utilise **être** : elles sont confortables. *Avoir* sert à parler de ce qu’on possède.',
            }
      - id: place-couleur
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - { text: J’ai une robe rouge., correct: true }
          - {
              text: J’ai une rouge robe.,
              feedback: 'En général, l’adjectif se place après le nom : une robe rouge.',
            }
          - {
              text: J’ai rouge une robe.,
              feedback: 'L’adjectif va avec le nom, après lui : une robe rouge.',
            }
      - id: belle-robe
        type: trueFalse
        prompt: 'On dit « une belle robe » : *belle* se place avant le nom.'
        answer: true
        feedback:
          correct: Oui ! *Beau / belle* est un des adjectifs courts qui se placent avant le nom.
          incorrect: 'C’est correct : *beau / belle*, *petit*, *grand*… se placent avant le nom.'
      - id: etre-avoir
        type: fillBlank
        prompt: Complète avec *être* ou *avoir* au présent.
        text: Elle ___ moderne. Elle ___ cinq paires de chaussures.
        blanks: [[est], [a]]
      - id: accord
        type: fillBlank
        prompt: Accorde l’adjectif entre parenthèses.
        text: La jupe est ___ (coloré). Les chaussures sont ___ (confortable).
        blanks: [[colorée], [confortables]]
      - id: masculin-feminin
        type: matching
        prompt: Associe le masculin et le féminin.
        pairs:
          - [élégant, élégante]
          - [léger, légère]
          - [doux, douce]
          - [formel, formelle]
          - [épais, épaisse]
      - id: ordre-plage
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Pour la plage, tu mets un short.

  - slug: mode-et-shopping-nombres
    title: Les nombres et les prix
    minutes: 8
    items:
      - id: dizaines
        type: matching
        prompt: Associe chaque nombre à son mot.
        pairs:
          - ['30', trente]
          - ['40', quarante]
          - ['50', cinquante]
          - ['60', soixante]
          - ['70', soixante-dix]
      - id: quatre-vingts
        type: multipleChoice
        prompt: Comment dit-on 80 ?
        options:
          - { text: quatre-vingts, correct: true }
          - { text: quatre-vingt-dix, feedback: '*Quatre-vingt-dix*, c’est 90 (80 + 10).' }
          - { text: soixante-dix, feedback: '*Soixante-dix*, c’est 70 (60 + 10).' }
      - id: vingt-sept
        type: multipleChoice
        prompt: Comment écrit-on 27 ?
        options:
          - { text: vingt-sept, correct: true }
          - { text: sept-vingt, feedback: 'D’abord la dizaine, puis l’unité : vingt-sept.' }
          - {
              text: vingt et sept,
              feedback: 'On dit *et* seulement avec *un* (vingt et un). Pour 27 : vingt-sept, avec un tiret.',
            }
      - id: vingt-et-un
        type: trueFalse
        prompt: Pour 21, on dit « vingt-un ».
        answer: false
        feedback:
          correct: 'Exact ! On dit **vingt et un**.'
          incorrect: 'Non : pour 21, 31, 41, 51, 61 et 71, on dit *et* : **vingt et un**.'
      - id: prix
        type: fillBlank
        prompt: Écris le prix en lettres.
        text: 'Le tee-shirt coûte 20 € : ___ euros. Le pantalon coûte 40 € : ___ euros.'
        blanks: [[vingt], [quarante]]
      - id: onze-seize
        type: fillBlank
        prompt: Écris le nombre en lettres.
        text: 'Le sac coûte 15 € : ___ euros. J’ai 16 tee-shirts : j’ai ___ tee-shirts.'
        blanks: [[quinze], [seize]]
      - id: total
        type: multipleChoice
        prompt: 'Une robe à 50 € et un tee-shirt à 20 € : le total est de…'
        options:
          - { text: soixante-dix euros, correct: true }
          - { text: soixante euros, feedback: '50 + 20 = 70, et 70 se dit *soixante-dix*.' }
          - {
              text: quatre-vingts euros,
              feedback: '50 + 20 = 70 (soixante-dix). *Quatre-vingts*, c’est 80.',
            }
      - id: ordre-depense
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: J’ai dépensé soixante euros pour des chaussures.
