vocabulary:
  - slug: amities
    title: Amitiés
    items: *amities-words

activities:
  - slug: amities-descriptives
    title: 'Phrases descriptives : est / sont + adjectif'
    minutes: 8
    items:
      - id: ami-est
        type: multipleChoice
        prompt: Mon meilleur ami ___ gentil.
        options:
          - { text: est, correct: true }
          - { text: sont, feedback: '*Mon meilleur ami* est singulier : on dit *est*.' }
          - { text: es, feedback: '*Es* va avec *tu*. Avec *il* ou *mon ami*, on dit *est*.' }
      - id: amis-sont
        type: multipleChoice
        prompt: Mes amis ___ drôles.
        options:
          - { text: sont, correct: true }
          - { text: est, feedback: '*Mes amis* est pluriel : on dit *sont*.' }
          - {
              text: sommes,
              feedback: '*Sommes* va avec *nous*. Avec *mes amis* (ils), on dit *sont*.',
            }
      - id: grossiers
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - { text: Mes amis ne sont pas grossiers., correct: true }
          - {
              text: Mes amis ne sont pas grossier.,
              feedback: 'Le sujet est pluriel : l’adjectif prend un *s* : *grossiers*.',
            }
          - {
              text: Mes amis n’est pas grossiers.,
              feedback: '*Mes amis* est pluriel : on dit *ne sont pas*.',
            }
      - id: negation
        type: fillBlank
        prompt: Complète à la forme négative.
        text: Mon ami ___ pas timide. Mes amis ___ ___ pas bruyants.
        blanks: [[n’est], [ne], [sont]]
      - id: est-ce-que
        type: trueFalse
        prompt: 'Pour poser une question, on peut dire : *Est-ce que ton ami est sympa ?*'
        answer: true
        feedback:
          correct: 'Bravo ! *Est-ce que* + sujet + *est* + adjectif + *?*'
          incorrect: 'C’est correct : *Est-ce que* + sujet + *est* + adjectif. *Est-ce que ton ami est sympa ?*'
      - id: question-sont
        type: multipleChoice
        prompt: Est-ce que tes amis ___ sympas ?
        options:
          - { text: sont, correct: true }
          - { text: est, feedback: '*Tes amis* est pluriel : on dit *sont*.' }
          - { text: es, feedback: '*Es* va avec *tu*. Avec *tes amis* (ils), on dit *sont*.' }
      - id: associe-accord
        type: matching
