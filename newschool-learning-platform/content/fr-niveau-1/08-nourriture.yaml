vocabulary:
  - slug: nourriture
    title: Nourriture
    items: *nourriture-words

activities:
  - slug: nourriture-present
    title: Les verbes au présent
    minutes: 8
    items:
      - id: nous-mangeons
        type: multipleChoice
        prompt: Nous ___ une pizza.
        options:
          - { text: mangeons, correct: true }
          - { text: mangons, feedback: 'Avec *nous*, *manger* garde le *e* : nous mangeons.' }
          - { text: mangez, feedback: '*Mangez* va avec *vous*. Avec *nous* : mangeons.' }
      - id: je-mets
        type: multipleChoice
        prompt: Je ___ du fromage sur le pain.
        options:
          - { text: mets, correct: true }
          - { text: mettre, feedback: 'Après *je*, on conjugue le verbe : je mets.' }
          - { text: suis mets, feedback: 'On n’utilise pas *être* avec un autre verbe : je mets.' }
      - id: suis-mange
        type: trueFalse
        prompt: 'Cette phrase est correcte : *Je suis mange une pizza.*'
        answer: false
        feedback:
          correct: 'Bravo ! On dit *Je mange une pizza.*, sans *être*.'
          incorrect: 'N’utilise pas *être* avec un autre verbe : *Je mange une pizza.*'
      - id: finir
        type: fillBlank
        prompt: Complète avec le verbe *finir* au présent.
        text: Tu ___ ton sandwich. Nous ___ le repas.
        blanks: [[finis, tu finis], [finissons, nous finissons]]
      - id: couper-ajouter
        type: fillBlank
        prompt: Complète avec le verbe entre parenthèses au présent.
        text: Je ___ le pain en deux. (couper) Vous ___ de la tomate. (ajouter)
        blanks: [[coupe, je coupe], [ajoutez, vous ajoutez]]
      - id: manger-pronoms
        type: matching
        prompt: Associe chaque pronom à la bonne forme du verbe *manger*.
        pairs:
          - [je, mange]
          - [tu, manges]
          - [nous, mangeons]
          - [vous, mangez]
          - [ils, mangent]
      - id: ordre-pain
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Je coupe le pain en deux.
      - id: vous-buvez
        type: multipleChoice
        prompt: 'Le serveur demande : « Vous ___ de l’eau ou du vin ? »'
        options:
          - { text: buvez, correct: true }
          - { text: boivez, feedback: '*Boire* est irrégulier (3e groupe) : vous buvez.' }
          - { text: boire, feedback: 'Après *vous*, on conjugue le verbe : vous buvez.' }

  - slug: nourriture-possessifs
    title: Les adjectifs possessifs
    minutes: 8
    items:
      - id: ma-pizza
        type: multipleChoice
        prompt: ___ pizza préférée est la margherita.
        options:
          - { text: Ma, correct: true }
          - { text: Mon, feedback: '*Pizza* est féminin et commence par une consonne : ma pizza.' }
          - { text: Mes, feedback: '*Mes* est pour le pluriel. *Pizza* est singulier : ma.' }
      - id: son-chocolat
        type: multipleChoice
        prompt: Ma sœur adore le chocolat. ___ chocolat préféré est le chocolat blanc.
        options:
          - { text: Son, correct: true }
          - {
              text: Sa,
              feedback: 'Le possessif s’accorde avec le nom, pas avec la personne. *Chocolat* est masculin : son.',
            }
          - { text: Ses, feedback: '*Chocolat* est singulier : son.' }
      - id: mon-amie
        type: trueFalse
        prompt: 'On dit *ma amie*, parce que *amie* est féminin.'
        answer: false
        feedback:
          correct: 'Bravo ! Devant une voyelle, on dit *mon amie*.'
          incorrect: '*Amie* commence par une voyelle : on dit *mon amie*.'
      - id: notre-nos
        type: fillBlank
        prompt: Complète avec *notre* ou *nos*.
        text: Mon mari et moi avons un restaurant. ___ restaurant est très grand. ___ gnocchis sont délicieux.
        blanks: [[notre], [nos]]
        wordBank: [notre, nos]
      - id: leur-votre
        type: fillBlank
        prompt: Complète avec *leur* ou *votre*.
        text: 'Mes amis se marient ! ___ mariage est magnifique. Monsieur et Madame Martin, quel est ___ plat préféré ?'
        blanks: [[leur], [votre]]
        wordBank: [leur, votre]
      - id: pronoms-possessifs
        type: matching
        prompt: Associe chaque personne au possessif (pour un nom masculin singulier).
        pairs:
          - [je, mon]
          - [tu, ton]
          - [il / elle, son]
          - [nous, notre]
          - [ils / elles, leur]
      - id: ordre-plat
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Mon plat préféré est la pizza.
      - id: leurs-enfants
        type: multipleChoice
        prompt: Paul et Marie ont deux enfants. ___ enfants mangent des pâtes.
        options:
          - { text: Leurs, correct: true }
          - { text: Leur, feedback: '*Enfants* est pluriel : leurs.' }
          - {
              text: Ses,
              feedback: 'Il y a deux personnes qui possèdent (Paul et Marie) : leur / leurs.',
            }
