vocabulary:
  - slug: la-meteo
    title: La météo
    items: *la-meteo-words

activities:
  - slug: la-meteo-description
    title: La description
    minutes: 8
    items:
      - id: il-fait-chaud
        type: multipleChoice
        prompt: Aujourd’hui, ___ chaud.
        options:
          - { text: il fait, correct: true }
          - {
              text: il est,
              feedback: 'Pour la météo, on utilise le verbe *faire* : il fait chaud.',
            }
          - {
              text: il y a,
              feedback: '*Il y a* va avec une chose (du soleil, des nuages). Avec *chaud* : il fait chaud.',
            }
      - id: il-y-a-nuages
        type: multipleChoice
        prompt: ___ des nuages.
        options:
          - { text: Il y a, correct: true }
          - {
              text: Il fait,
              feedback: 'Avec une chose concrète dans le ciel (nuages, soleil, vent), on utilise *il y a*.',
            }
          - {
              text: C’est,
              feedback: '*C’est* va avec un adjectif ou une opinion. Avec *des nuages* : il y a.',
            }
      - id: il-personne
        type: trueFalse
        prompt: 'Dans *il pleut*, le pronom *il* désigne une personne.'
        answer: false
        feedback:
          correct: Bravo ! Pour la météo, *il* ne désigne pas une personne.
          incorrect: 'Pour la météo (*il pleut, il fait beau*), *il* ne désigne pas une personne.'
      - id: cest-fait
        type: fillBlank
        prompt: Complète avec *c’est* ou *fait*.
        text: ___ une journée ensoleillée. Il ___ 25 degrés.
        blanks: [[c’est, c'est], [fait]]
        wordBank: [c’est, fait]
      - id: place-adjectif
        type: multipleChoice
        prompt: Quelle expression est correcte ?
        options:
          - { text: Un beau soleil, correct: true }
          - {
              text: Un soleil beau,
              feedback: '*Beau* est court et très courant : il se place avant le nom.',
            }
          - {
              text: Une ensoleillée journée,
              feedback: '*Ensoleillée* se place après le nom : une journée ensoleillée.',
            }
      - id: temps-journee
        type: matching
        prompt: Associe chaque phrase à la bonne description.
        pairs:
          - [Il y a du soleil., C’est une journée ensoleillée.]
          - [Il pleut., C’est une journée pluvieuse.]
          - [Il y a des nuages., C’est une journée nuageuse.]
          - [Il fait froid et il neige., C’est l’hiver.]
      - id: ordre-marseille
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Il fait beau à Marseille.
      - id: pleuvoir-neiger
        type: fillBlank
        prompt: Complète avec le verbe entre parenthèses au présent.
        text: À Paris, il ___ (pleuvoir). À la montagne, il ___ (neiger).
        blanks: [[pleut], [neige]]

  - slug: la-meteo-nombres
    title: Les nombres
    minutes: 8
    items:
      - id: dizaines
        type: matching
        prompt: Associe chaque nombre à son nom.
        pairs:
          - ['21', vingt-et-un]
          - ['31', trente-et-un]
          - ['40', quarante]
          - ['50', cinquante]
          - ['60', soixante]
      - id: quatre-vingt-un
        type: multipleChoice
        prompt: Comment écrit-on 81 ?
        options:
          - { text: quatre-vingt-un, correct: true }
          - {
              text: quatre-vingt-et-un,
              feedback: 'On ajoute *et* avant *un*, **sauf** pour 81 : quatre-vingt-un.',
            }
          - {
              text: quatre-vingt-onze,
              feedback: '*Quatre-vingt-onze*, c’est 91 (80 + 11). 81 = quatre-vingt-un.',
            }
      - id: quatre-vingt-onze
        type: multipleChoice
        prompt: Comment écrit-on 91 ?
        options:
          - { text: quatre-vingt-onze, correct: true }
          - { text: quatre-vingt-et-onze, feedback: 'Pas de *et* pour 91 : quatre-vingt-onze.' }
          - { text: quatre-vingt-dix-un, feedback: '91 = 80 + 11 : quatre-vingt-onze.' }
      - id: trente-et-un
        type: trueFalse
        prompt: 'Pour 31, on ajoute le mot *et* : *trente-et-un*.'
        answer: true
        feedback:
          correct: 'Bravo ! 21, 31, 41, 51 et 61 prennent *et*.'
          incorrect: 'On ajoute *et* avant *un* : trente-et-un (31).'
      - id: temperatures
        type: fillBlank
        prompt: Écris les nombres en lettres.
        text: La température maximale est de ___ degrés (30). La température minimale est de ___ degrés (17).
        blanks: [[trente], [dix-sept]]
      - id: vingt-et-un
        type: fillBlank
        prompt: Écris le nombre en lettres.
        text: Aujourd’hui, il fait ___ degrés (21).
        blanks: [[vingt-et-un, vingt et un]]
      - id: cinquante
        type: multipleChoice
        prompt: Comment écrit-on 50 ?
        options:
          - { text: cinquante, correct: true }
          - {
              text: cinquente,
              feedback: '40, 50 et 60 se terminent par *-ante* : quarante, cinquante, soixante. Seul 30 se termine par *-ente* : trente.',
            }
          - { text: cinqante, feedback: 'Attention à l’orthographe : cinquante, avec *qu*.' }
