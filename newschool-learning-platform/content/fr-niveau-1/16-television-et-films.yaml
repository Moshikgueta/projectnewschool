vocabulary:
  - slug: television-et-films
    title: Télévision et films
    items: *television-words

activities:
  - slug: television-et-films-questions
    title: Poser des questions
    minutes: 8
    items:
      - id: quelle-serie
        type: multipleChoice
        prompt: 'Réponse : *Ma série préférée est Lupin.* Quelle est la question ?'
        options:
          - { text: Quelle est ta série préférée ?, correct: true }
          - {
              text: Quel est ta série préférée ?,
              feedback: '*Série* est féminin : on dit *quelle* et *ta* : *Quelle est ta série préférée ?*',
            }
          - {
              text: Où est ta série préférée ?,
              feedback: '*Où* demande un lieu. Pour choisir une série, on dit *quelle* : *Quelle est ta série préférée ?*',
            }
      - id: mots-interrogatifs
        type: matching
        prompt: Associe chaque réponse au bon mot interrogatif.
        pairs:
          - [Au cinéma., Où ?]
          - [Le soir., Quand ?]
          - [Parce qu’il est drôle., Pourquoi ?]
          - [Omar Sy., Qui ?]
          - [Le film dure deux heures., Combien de temps ?]
      - id: pourquoi
        type: fillBlank
        prompt: 'Complète la question. Réponse : *Parce qu’il est drôle.*'
        text: ___ aimes-tu ce film ?
        blanks: [[Pourquoi]]
      - id: quelle-heure
        type: fillBlank
        prompt: 'Complète la question. Réponse : *À 20 heures.*'
        text: À ___ heure regardes-tu la série ?
        blanks: [[quelle]]
      - id: trois-facons
        type: trueFalse
        prompt: '*Est-ce que tu aimes ce film ?*, *Tu aimes ce film ?* et *Aimes-tu ce film ?* sont trois façons correctes de poser la même question.'
        answer: true
        feedback:
          correct: Bravo ! Les trois questions sont correctes ; *Aimes-tu… ?* est plus formel.
          incorrect: Les trois questions sont correctes. Elles changent seulement selon le niveau de langage.
      - id: question-fermee
        type: multipleChoice
        prompt: 'Quelle question est une question fermée (réponse : oui ou non) ?'
        options:
          - { text: Es-tu français ?, correct: true }
          - { text: Où vis-tu ?, feedback: '*Où* demande un lieu : c’est une question ouverte.' }
          - {
              text: Qui est ton acteur préféré ?,
              feedback: '*Qui* demande une personne : c’est une question ouverte.',
            }
      - id: inversion
        type: multipleChoice
        prompt: 'Transforme *Tu aimes les comédies.* en question avec l’inversion (verbe + sujet).'
        options:
          - { text: Aimes-tu les comédies ?, correct: true }
          - {
              text: Aime-tu les comédies ?,
              feedback: 'Le verbe garde sa terminaison : *tu aimes* → *aimes-tu*.',
            }
          - {
              text: Est-ce que aimes-tu les comédies ?,
              feedback: 'Avec *est-ce que*, on garde l’ordre normal : *Est-ce que tu aimes les comédies ?*',
            }
      - id: ordonne-film
        type: reorderSentence
        prompt: Remets les mots dans l’ordre pour faire une question.
        sentence: Quel est ton film préféré ?

  - slug: television-et-films-prepositions
    title: 'Les prépositions : en, à, avec, sur'
    minutes: 8
    items:
      - id: avec-amis
        type: multipleChoice
        prompt: Je regarde un film ___ mes amis.
        options:
          - { text: avec, correct: true }
          - {
              text: sur,
              feedback: '*Sur* veut dire « au sujet de ». Pour dire « en compagnie de », on dit *avec*.',
            }
          - {
              text: en,
              feedback: '*En* va avec les mois, les années, les pays… Pour les personnes, on dit *avec*.',
            }
      - id: a-heure
        type: multipleChoice
        prompt: Le film commence ___ 20 heures.
        options:
          - { text: à, correct: true }
          - {
              text: en,
              feedback: '*En* va avec les mois et les années. Pour une heure précise, on dit *à*.',
            }
          - { text: sur, feedback: 'Pour une heure précise, on dit *à* : *à 20 heures*.' }
      - id: en-france
        type: multipleChoice
        prompt: Le film se passe ___ France.
        options:
          - { text: en, correct: true }
          - {
              text: à,
              feedback: '*À* va avec les villes (à Paris). Pour un pays féminin, on dit *en*.',
            }
          - {
              text: au,
              feedback: '*Au* va avec les pays masculins (au Canada). *La France* est féminin : *en France*.',
            }
      - id: paris-cinema
        type: fillBlank
        prompt: Complète avec *à* ou *au*.
        text: Il vit ___ Paris. Nous allons ___ cinéma.
        blanks: [[à], [au]]
        wordBank: [à, au]
      - id: sur
        type: fillBlank
        prompt: Complète avec la bonne préposition.
        text: C’est un film ___ les animaux. Je regarde une série ___ mon ordinateur.
        blanks: [[sur], [sur]]
        wordBank: [sur, avec, en]
      - id: a-janvier
        type: trueFalse
        prompt: On dit *à janvier* et *à 2023*.
        answer: false
        feedback:
          correct: 'Exact ! Avec les mois et les années, on dit *en* : *en janvier*, *en 2023*.'
          incorrect: 'Avec les mois et les années, on dit *en* : *en janvier*, *en 2023*.'
      - id: questions-reponses
        type: matching
        prompt: Associe chaque question à sa réponse.
