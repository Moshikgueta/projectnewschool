          - { term: salle de bains, gloss: חדר אמבטיה }
          - { term: salle à manger, gloss: חדר אוכל }
          - { term: buanderie, gloss: חדר כביסה }
          - { term: garage, gloss: מוסך / חניה }
          - { term: jardin, gloss: גן }
