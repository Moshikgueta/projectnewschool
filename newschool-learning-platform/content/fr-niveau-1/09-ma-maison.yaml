vocabulary:
  - slug: ma-maison
    title: Ma maison
    items: *ma-maison-words

activities:
  - slug: ma-maison-description
    title: La description
    minutes: 8
    items:
      - id: il-y-a-four
        type: multipleChoice
        prompt: Dans ma cuisine, ___ un four et un évier.
        options:
          - { text: il y a, correct: true }
          - { text: est, feedback: 'Pour dire ce qui se trouve dans un lieu, on utilise *il y a*.' }
          - {
              text: sont,
              feedback: 'Pour dire ce qui se trouve dans un lieu, on utilise *il y a* (singulier et pluriel).',
            }
      - id: est-etage
        type: multipleChoice
        prompt: Mon appartement ___ au deuxième étage.
        options:
          - { text: est, correct: true }
          - {
              text: il y a,
              feedback: 'Pour situer quelque chose, on utilise *être* : mon appartement est au deuxième étage.',
            }
          - { text: sont, feedback: '*Mon appartement* est singulier : est.' }
      - id: couleurs
        type: trueFalse
        prompt: 'Les couleurs se placent toujours après le nom : *un canapé gris*.'
        answer: true
        feedback:
          correct: Bravo ! On dit *un canapé gris*.
          incorrect: 'Les couleurs sont toujours après le nom : *un canapé gris*.'
      - id: belle-maison
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - { text: C’est une belle maison., correct: true }
          - {
              text: C’est une maison belle.,
              feedback: '*Belle* est un adjectif court et très courant : il se place avant le nom.',
            }
          - {
              text: C’est une contemporaine maison.,
              feedback: '*Contemporaine* est un adjectif long : il se place après le nom.',
            }
      - id: formes
        type: fillBlank
        prompt: Écris l’adjectif entre parenthèses à la bonne forme.
        text: Ma cuisine est ___. (grand) Mes chambres sont ___. (petit)
        blanks: [[grande], [petites]]
      - id: pieces-elements
        type: matching
        prompt: Associe chaque pièce à un élément.
        pairs:
          - [la cuisine, le four]
          - [la salle de bain, la douche]
          - [la chambre, le lit]
          - [le salon, le canapé]
          - [le jardin, les fleurs]
      - id: ordre-salon
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Mon salon est très confortable.
      - id: deux-verbes
        type: fillBlank
        prompt: Complète avec le verbe entre parenthèses à la bonne forme.
        text: Dans mon salon, je peux ___ la télé. (regarder) Je veux ___ la cuisine. (nettoyer)
        blanks: [[regarder], [nettoyer]]

  - slug: ma-maison-present
    title: Les verbes au présent
    minutes: 8
    items:
      - id: premier-groupe
        type: multipleChoice
        prompt: Quel verbe est du 1er groupe ?
        options:
          - { text: regarder, correct: true }
          - {
              text: aller,
              feedback: '*Aller* se termine par -ER, mais il est irrégulier (3e groupe).',
            }
          - { text: finir, feedback: '*Finir* est un verbe du 2e groupe (nous finissons).' }
      - id: partir-venir
        type: trueFalse
        prompt: '*Partir* et *venir* sont des verbes du 2e groupe.'
        answer: false
        feedback:
          correct: 'Bravo ! *Partir* et *venir* sont du 3e groupe.'
          incorrect: 'Tous les verbes en -IR ne sont pas du 2e groupe : *partir* et *venir* sont du 3e groupe.'
      - id: nous-regardons
        type: multipleChoice
        prompt: Nous ___ la télévision dans le salon.
        options:
          - { text: regardons, correct: true }
          - { text: regardez, feedback: '*Regardez* va avec *vous*. Avec *nous* : regardons.' }
          - { text: regarder, feedback: 'Après *nous*, on conjugue le verbe : nous regardons.' }
      - id: routine-je
        type: fillBlank
        prompt: Complète la routine avec le verbe entre parenthèses au présent.
        text: Le matin, je me ___ à 7 heures. (lever) Ensuite, je ___ mon lit. (faire)
        blanks: [[lève], [fais]]
      - id: habiter
        type: matching
        prompt: Associe chaque pronom à la bonne forme du verbe *habiter*.
        pairs:
          - [j’, habite]
          - [tu, habites]
          - [nous, habitons]
          - [vous, habitez]
          - [elles, habitent]
      - id: question-polie
        type: multipleChoice
        prompt: Quelle question est la plus polie (soutenue) ?
        options:
          - { text: As-tu une grande maison ?, correct: true }
          - {
              text: Tu as une grande maison ?,
              feedback: 'Cette question est correcte, mais familière. La plus polie inverse le verbe et le pronom : *As-tu… ?*',
            }
          - {
              text: Est-ce que tu as une grande maison ?,
              feedback: 'Cette question est correcte et courante. La plus polie inverse le verbe et le pronom : *As-tu… ?*',
            }
      - id: ordre-petit-dejeuner
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
