vocabulary:
  - slug: decouvertes
    title: Découvertes
    items: *decouvertes-words

activities:
  - slug: decouvertes-present
    title: Actions au présent
    minutes: 8
    items:
      - id: oiseau-vole
        type: multipleChoice
        prompt: L'oiseau ___.
        options:
          - { text: vole, correct: true }
          - { text: voles, feedback: "*Voles* est pour *tu*. *L'oiseau* = *il* : il vole." }
          - {
              text: volent,
              feedback: "*Volent* est pour *ils / elles* (plusieurs). *L'oiseau* = *il* : il vole.",
            }
      - id: singes
        type: multipleChoice
        prompt: Les singes ___ à l'arbre.
        options:
          - { text: grimpent, correct: true }
          - { text: grimpe, feedback: '*Les singes* = *ils* (pluriel) : le verbe finit en *-ent*.' }
          - {
              text: grimpons,
              feedback: '*Grimpons* est pour *nous*. *Les singes* = *ils* : ils grimpent.',
            }
      - id: nous-chantons
        type: multipleChoice
        prompt: Mes amis et moi, nous ___ le week-end.
        options:
          - { text: chantons, correct: true }
          - {
              text: chantez,
              feedback: '*Chantez* est pour *vous*. Avec *nous*, le verbe finit en *-ons*.',
            }
          - {
              text: chantent,
              feedback: '*Chantent* est pour *ils / elles*. Avec *nous*, on dit *nous chantons*.',
            }
      - id: etudier-chanter
        type: fillBlank
        prompt: Complète avec le verbe au présent.
        text: Nous ___ (étudier) le français. Elle ___ (chanter) en classe.
        blanks: [[étudions], [chante]]
      - id: dana
        type: fillBlank
        prompt: Complète avec le verbe au présent.
        text: Dana ___ (compter) et ___ (organiser) quand elle est logique.
        blanks: [[compte], [organise]]
      - id: maintenant-habitude
        type: trueFalse
        prompt: On peut dire « Je marche maintenant » et aussi « Je marche tous les matins ».
        answer: true
        feedback:
          correct: 'Oui ! Le présent sert pour maintenant et pour une habitude.'
          incorrect: 'En français, le présent sert pour maintenant **et** pour une habitude : les deux phrases sont correctes.'
      - id: questions
        type: matching
        prompt: Associe chaque question à sa réponse.
        pairs:
          - [Que fait la girafe ?, La girafe mange.]
          - [Où vit le lion ?, Il vit en Afrique.]
          - [Qui chante ?, Shakira chante.]
          - [Quand marches-tu ?, Je marche le matin.]
      - id: ordre-singe
        type: reorderSentence
        prompt: Remets les mots dans l'ordre.
        sentence: Le singe grimpe à l'arbre.

  - slug: decouvertes-prepositions
    title: Les prépositions de lieu
    minutes: 8
    items:
      - id: avion
        type: multipleChoice
        prompt: L'avion passe ___ la ville.
        options:
          - { text: au-dessus de, correct: true }
          - {
              text: sous,
              feedback: "L'avion est dans le ciel, plus haut que la ville : *au-dessus de*.",
            }
          - {
              text: à côté,
              feedback: "Il manque *de* : on dit *à côté de*. Et l'avion est dans le ciel : *au-dessus de*.",
            }
      - id: bouche
        type: multipleChoice
        prompt: La bouche est ___ le nez.
        options:
          - { text: sous, correct: true }
          - {
              text: au-dessus de,
              feedback: 'La bouche est plus bas que le nez : elle est *sous* le nez.',
            }
          - { text: loin de, feedback: "La bouche n'est pas loin du nez : elle est *sous* le nez." }
      - id: japon
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - { text: Le Japon est loin d'Israël., correct: true }
          - {
              text: Le Japon est loin de Israël.,
              feedback: "Devant une voyelle, *de* devient *d'* : loin d'Israël.",
            }
          - {
              text: Le Japon est près d'Israël.,
              feedback: "Le Japon est en Asie, très loin : *loin d'Israël*.",
            }
      - id: du-de-la
        type: fillBlank
        prompt: Complète avec *du* ou *de la*.
        text: Les États-Unis sont à côté ___ Canada. L'Italie est près ___ France.
        blanks: [[du], [de la]]
        wordBank: [du, de la]
      - id: loin-d
        type: fillBlank
        prompt: "Complète avec le contraire de *près d'*."
        text: Le Japon n'est pas près d'Israël. Il est ___ Israël.
        blanks: [["loin d'"]]
      - id: de-le
        type: trueFalse
        prompt: 'On dit « Le chat est à côté du chien » parce que de + le = du.'
        answer: true
        feedback:
          correct: 'Exact ! de + le = *du*.'
          incorrect: 'On ne dit pas « de le » : de + le = *du*. Le chat est à côté du chien.'
      - id: sens
        type: matching
        prompt: Associe chaque préposition à sa traduction.
        pairs:
          - [au-dessus de, מעל]
          - [sous, מתחת]
          - [à côté de, ליד]
          - [près de, קרוב ל]
          - [loin de, רחוק מ]
      - id: ordre-chien
        type: reorderSentence
        prompt: Remets les mots dans l'ordre.
        sentence: Le chien est sous la table.
