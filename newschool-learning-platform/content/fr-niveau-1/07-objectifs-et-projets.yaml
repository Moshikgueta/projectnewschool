vocabulary:
  - slug: objectifs-et-projets
    title: Objectifs et projets
    items: *objectifs-et-projets-words

activities:
  - slug: objectifs-et-projets-verbes
    title: Les verbes au présent
    minutes: 8
    items:
      - id: nous-etudions
        type: multipleChoice
        prompt: Nous ___ ensemble.
        options:
          - { text: étudions, correct: true }
          - {
              text: étudiez,
              feedback: '*-ez* est pour *vous* : vous étudiez. Avec *nous* : **-ons**.',
            }
          - {
              text: étudient,
              feedback: '*-ent* est pour *ils / elles* : ils étudient. Avec *nous* : **-ons**.',
            }
      - id: tu-finis
        type: multipleChoice
        prompt: Tu ___ ton travail.
        options:
          - { text: finis, correct: true }
          - { text: finit, feedback: '*Finit* est pour *il / elle*. Avec *tu* : tu fin**is**.' }
          - { text: finissez, feedback: '*Finissez* est pour *vous*. Avec *tu* : tu fin**is**.' }
      - id: j-etudie
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - { text: J’étudie tous les jours., correct: true }
          - {
              text: Je étudie tous les jours.,
              feedback: 'Devant une voyelle, *je* devient *j’* : j’étudie.',
            }
          - {
              text: J’étudies tous les jours.,
              feedback: 'Avec *je*, la terminaison est *-e* : j’étudie. *-es* est pour *tu*.',
            }
      - id: vendre
        type: fillBlank
        prompt: Conjugue le verbe *vendre* au présent.
        text: Ils ___ des vêtements. Vous ___ des chaussures.
        blanks: [[vendent], [vendez]]
      - id: finir-paires
        type: matching
        prompt: Associe chaque pronom à la bonne forme de *finir*.
        pairs:
          - [il / elle, finit]
          - [nous, finissons]
          - [vous, finissez]
          - [ils / elles, finissent]
      - id: veux-infinitif
        type: multipleChoice
        prompt: Je veux ___ pour mon examen.
        options:
          - { text: étudier, correct: true }
          - {
              text: étudie,
              feedback: 'Après *je veux*, le deuxième verbe reste à l’infinitif : je veux étudier.',
            }
          - {
              text: étudies,
              feedback: 'Après *je veux*, le deuxième verbe reste à l’infinitif : je veux étudier.',
            }
      - id: besoin-de
        type: trueFalse
        prompt: '« Il a besoin de finir son travail. » : après *avoir besoin de*, le verbe reste à l’infinitif.'
        answer: true
        feedback:
          correct: 'Oui ! *Finir* est à l’infinitif.'
          incorrect: 'C’est correct : après *je veux / je peux / j’ai besoin de*, le deuxième verbe reste à l’infinitif.'
      - id: ordre-commencer
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Nous voulons commencer le cours demain.

  - slug: objectifs-et-projets-dates
    title: Les dates et les nombres
    minutes: 8
    items:
      - id: le-date
        type: multipleChoice
        prompt: Rachel commence son projet ___ 1er mars.
        options:
          - { text: le, correct: true }
          - {
              text: en,
              feedback: 'Pour une date précise (jour + mois), on dit *le* : le 1er mars. *En* est pour un mois ou une année seulement.',
            }
          - { text: à, feedback: 'Pour une date, on dit *le* + jour + mois : le 1er mars.' }
      - id: en-mois-annee
        type: fillBlank
        prompt: Complète avec *le* ou *en*.
        text: Je finis mon projet ___ décembre. Rachel commence ___ 2024. Mon examen est ___ 15 août.
        blanks: [[en], [en], [le]]
        wordBank: [le, en]
      - id: ordre-date
        type: multipleChoice
        prompt: Quelle date est correcte ?
        options:
          - { text: le 15 août 1999, correct: true }
          - { text: le août 15 1999, feedback: 'D’abord le jour, puis le mois : le 15 août 1999.' }
          - {
              text: en 15 août 1999,
              feedback: 'Pour une date précise, on dit *le* : le 15 août 1999.',
            }
      - id: en-aout
        type: trueFalse
        prompt: On dit « en août » et « en 1999 ».
        answer: true
        feedback:
          correct: 'Oui ! **En** + mois, **en** + année.'
          incorrect: 'C’est correct : on dit *en* + mois (en août) et *en* + année (en 1999).'
      - id: mois
        type: matching
        prompt: Associe chaque mois à sa traduction en hébreu.
        pairs:
          - [janvier, ינואר]
          - [mars, מרץ]
          - [juin, יוני]
          - [août, אוגוסט]
          - [décembre, דצמבר]
      - id: nombres
        type: fillBlank
        prompt: Écris le nombre en lettres.
        text: '12 : ___ · 14 : ___ · 19 : ___'
        blanks: [[douze], [quatorze], [dix-neuf, dix neuf]]
      - id: soixante-dix
        type: multipleChoice
        prompt: Comment dit-on 70 ?
        options:
          - { text: soixante-dix, correct: true }
          - {
              text: soixante-sept,
              feedback: '*Soixante-sept*, c’est 67 (60 + 7). 70 = 60 + 10 : soixante-dix.',
            }
          - { text: sept-dix, feedback: 'En français, 70 = 60 + 10 : soixante-dix.' }
      - id: ordre-rachel
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Rachel travaille trois heures chaque jour.
