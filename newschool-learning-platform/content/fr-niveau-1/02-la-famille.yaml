vocabulary:
  - slug: la-famille
    title: La famille
    items: *la-famille-words

activities:
  - slug: la-famille-possessifs
    title: 'Les adjectifs possessifs : mon, ma, mes…'
    minutes: 8
    items:
      - id: mon-frere
        type: multipleChoice
        prompt: ___ frère s’appelle Paul.
        options:
          - { text: Mon, correct: true }
          - { text: Ma, feedback: '*Frère* est masculin : on dit *mon*.' }
          - {
              text: Mes,
              feedback: '*Frère* est singulier : on dit *mon*. *Mes* est pour le pluriel.',
            }
      - id: ma-soeur
        type: multipleChoice
        prompt: C’est ___ sœur.
        options:
          - { text: ma, correct: true }
          - {
              text: mon,
              feedback: '*Sœur* est féminin et commence par une consonne : on dit *ma*.',
            }
          - { text: mes, feedback: '*Sœur* est singulier : on dit *ma*.' }
      - id: mon-amie
        type: multipleChoice
        prompt: ___ amie habite à Paris.
        options:
          - { text: Mon, correct: true }
          - {
              text: Ma,
              feedback: '*Amie* est féminin, mais commence par une voyelle : on dit *mon amie*.',
            }
          - { text: Mes, feedback: '*Amie* est singulier : on ne dit pas *mes*.' }
      - id: accord-nom
        type: trueFalse
        prompt: Le possessif s’accorde avec la personne qui possède.
        answer: false
        feedback:
          correct: 'Bravo ! Le possessif s’accorde avec le nom qui suit : Paul et *sa* mère.'
          incorrect: 'Le possessif s’accorde avec le nom qui le suit, pas avec la personne : Paul et *sa* mère.'
      - id: sa-mere
        type: multipleChoice
        prompt: Paul aime beaucoup ___ mère.
        options:
          - { text: sa, correct: true }
          - {
              text: son,
              feedback: 'Le possessif s’accorde avec *mère* (féminin), pas avec Paul : *sa mère*.',
            }
          - { text: ses, feedback: '*Mère* est singulier : on dit *sa*.' }
      - id: complete-possessifs
        type: fillBlank
        prompt: Complète avec le possessif de la personne entre parenthèses.
        text: (je) Ce sont ___ cousins. (nous) ___ maison est grande. (tu) C’est ___ histoire préférée ?
        blanks: [[mes], [notre], [ton]]
      - id: singulier-pluriel
        type: matching
        prompt: Associe chaque possessif singulier à son pluriel.
        pairs:
          - [mon, mes]
          - [ton, tes]
          - [son, ses]
          - [notre, nos]
          - [leur, leurs]
      - id: ordre-dvora
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Ma mère s’appelle Dvora.

  - slug: la-famille-dates
    title: Les dates et les nombres
    minutes: 8
    items:
      - id: ne-le
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - { text: Je suis né le 5 mars., correct: true }
          - {
              text: Je suis né en 5 mars.,
              feedback: 'Devant une date, on met *le* : le 5 mars. *En* va devant le mois ou l’année.',
            }
          - { text: Je suis né le mars 5., feedback: 'On dit le jour puis le mois : le 5 mars.' }
      - id: le-en
        type: fillBlank
        prompt: Complète avec *le* ou *en*.
        text: Mon anniversaire est ___ 4 juillet. Je suis né ___ 1998.
        blanks: [[le], [en]]
        wordBank: [le, en]
      - id: nombres
        type: matching
        prompt: Associe les nombres.
        pairs:
          - ['11', onze]
          - ['12', douze]
          - ['15', quinze]
          - ['17', dix-sept]
          - ['20', vingt]
      - id: jour-mois
        type: trueFalse
        prompt: 'En français, on dit le mois puis le jour : juillet 4.'
        answer: false
        feedback:
          correct: 'Bravo ! On dit le jour puis le mois : le 4 juillet.'
          incorrect: 'En français, on dit le jour puis le mois : le 4 juillet.'
      - id: ordre-avion
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Le 5 juillet, nous prenons l’avion.
      - id: seize
        type: fillBlank
        prompt: Écris le nombre en lettres.
        text: 'Mon frère a 16 ans : il a ___ ans.'
        blanks: [[seize]]
      - id: quatorze-dix-neuf
        type: fillBlank
        prompt: Écris les nombres en lettres.
        text: Ma sœur a ___ (14) ans et mon cousin a ___ (19) ans.
        blanks: [[quatorze], [dix-neuf]]
      - id: mon-anniversaire
        type: shortAnswer
        prompt: Quand est ton anniversaire ? Écris une phrase.
