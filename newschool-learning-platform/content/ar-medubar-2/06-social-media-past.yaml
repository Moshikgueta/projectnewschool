vocabulary:
  - slug: social-media-past
    title: רשתות חברתיות – עבר
    items: *social-media-past-words

activities:
  - slug: social-media-past-verbs
    title: 'עבר פשוט לפי הגוף'
    minutes: 8
    items:
      - id: verbs
        type: matching
        lang: he
        prompt: התאימו כל פועל לפירוש שלו.
        pairs:
          - ['נַשַר', 'פרסם']
          - ['שָאפ', 'ראה']
          - ['כַּתַב', 'כתב']
          - ['סַמִע', 'שמע']
          - ['אִסְתַעְמַל', 'השתמש']
      - id: i-wrote
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״אני כתבתי״?'
        options:
          - { text: 'אַנָא כַּתַבְת', correct: true }
          - { text: 'אַנָא כַּתַב', feedback: 'חסרה הסיומת ־ת. כַּתַב בלי תוספת פירושו ״הוא כתב״.' }
          - { text: 'אִחְנָא כַּתַבְנָא', feedback: 'זה ״אנחנו כתבנו״ (סיומת ־נָא).' }
      - id: she-wrote
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״היא כתבה״?'
        options:
          - { text: 'הִי כַּתַבַּת', correct: true }
          - { text: 'הוּ כַּתַב', feedback: 'זה ״הוא כתב״. לגוף היא מוסיפים ־ת: הִי כַּתַבַּת.' }
          - { text: 'הֻם כַּתַבּוּ', feedback: 'זה ״הם כתבו״ (סיומת ־וּ).' }
      - id: we-saw
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״אנחנו ראינו״?'
        options:
          - { text: 'אִחְנָא שֻפְנָא', correct: true }
          - { text: 'אַנָא שֻופת', feedback: 'זה ״אני ראיתי״ (סיומת ־ת).' }
          - { text: 'הוּוֵה שָאפ', feedback: 'זה ״הוא ראה״ (בלי תוספת).' }
      - id: they-ending
        type: multipleChoice
        lang: he
        prompt: 'איזו סיומת מקבל הפועל בעבר בגוף ״הם״ (הֻם)?'
        options:
          - { text: '־וּ', correct: true }
          - { text: '־נָא', feedback: '־נָא היא הסיומת של אִחְנָא (אנחנו).' }
          - { text: '־ת', feedback: '־ת היא הסיומת של אַנָא / אִנְתַ ושל הִי.' }
      - id: common-mistake
        type: trueFalse
        lang: he
        prompt: 'המשפט ״אַנָא כַּתַב פּוֹסְט אִמְבַּארֶח״ (אתמול כתבתי פוסט) נכון.'
        answer: false
        feedback:
          correct: 'נכון, הוא לא נכון! עם אַנָא אומרים כַּתַבְת: אַנָא כַּתַבְת פּוֹסְט אִמְבַּארֶח.'
          incorrect: 'המשפט לא נכון: עם אַנָא הפועל מקבל ־ת – אַנָא כַּתַבְת פּוֹסְט אִמְבַּארֶח.'
      - id: yesterday
        type: multipleChoice
        lang: he
        prompt: 'מה פירוש ״אִמְבַּארֶח״?'
        options:
          - { text: 'אתמול', correct: true }
          - { text: 'שנה שעברה', feedback: '״שנה שעברה״ זה סַנֶה אִלְלִי פַאתַת / סַנֵה מָאדִיֶה.' }
          - { text: 'לפני חודש', feedback: '״לפני חודש״ זה קַבֵּל שַהְר.' }
      - id: order-post
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״אתמול פרסמתי פוסט.״'
        sentence: 'אִמְבַּארֶח אַנָא נַשַרְת פּוֹסְט'

