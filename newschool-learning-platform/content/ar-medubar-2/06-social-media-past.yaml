# Cycle "רשתות חברתיות – עבר", converted from the spoken Arabic level 2 digital
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (spoken Arabic in Hebrew
# transliteration, apc-Hebr); Hebrew instructions carry `lang: he`.
course: ar-medubar-2
slug: social-media-past
title: "רשתות חברתיות – שׁבּכּאת אתַּואס'ול אֶלְאֶג'תמאעֶיֶּה"
goal: 'לספר על מה שעשינו ברשתות בעבר פשוט לפי הגוף, ולהשוות עם אַכְתַר מִן / אַקַל מִן / אַכְתַר שִי.'
position: 6
status: published

review:
  - >-
    The two workbook exercises ("social-media-past-verbs" and
    "social-media-past-comparisons") are NEW: the notebook has no self-study
    exercises. They were written only from this cycle's summary, conjugation table,
    examples and vocabulary. An Arabic teacher must check every right answer, every
    wrong option and every transliteration before students see them.
  - >-
    Homework: the notebook does not give messages for the student to send. It
    describes what Mori says and asks in four parts (Mori's opening line, the
    question list, how Mori corrects). Each part became one message for the student
    to copy, written in Hebrew by the converter, that asks Mori to open with the
    notebook's Arabic line and ask the notebook's questions. Please check the
    wording.
  - >-
    Clear typos fixed: "מַק'בּול או לא'!?" → "מַק'בּול או לא!?" (stray geresh, warm-up 3);
    "(אח'בּאר, טַבֶּח' , מוד'ה ,... )" → "(אח'בּאר, טַבֶּח', מוד'ה…)" (spacing, warm-up 2);
    stray bold markers and empty lines removed. The date and participants lines
    (empty) were left out.
  - >-
    Not corrected, please decide: the conjugation table writes "אִנְתי כַּתַבְת" for
    "you (masculine)", while the rules write "אִנְתַ"; "הִי כַּתַבַת" (table) /
    "הִי כַּתַבַּת" (examples); "הֻם נַזַלּוּ א-תַבִּיעָאת" – "תַבִּיעָאת" may be a
    typo for "תַטְבִּיקָאת" (apps, cf. "תַטְבּיק'" in warm-up 1); "שֻפְת" / "שֻׁופֶת" /
    "שֻופת"; "מֻתְעָה" / "מֻומתְעָה" (Activity 2); "אַקַל שִי" / "אַקַ'ל שִי"; "אַכְתַר
    שִי" / "אַכְתַר אשִי"; "סַבּוּע" / "אלוּסבוע"; "סַנֶה אִלְלִי פַאתַת" / "סַנֵה
    מָאדִיֶה"; "הַאלמֻשְכִּל כָּאנַת" (feminine verb with a masculine noun, Activity 4);
    "חַצַל" (vocabulary, received) / "אַחַ’דְת" (activities). The workbook uses
    "הִי כַּתַבַּת" and "אַקַל".
  - >-
    The warm-up title says "full answers in the past", but questions 1–5 are in
    the present (habits and opinions). Kept as in the notebook; please check.
  - >-
    Times: Activity 1 = 5 + 6 = 11 minutes; Activity 3 = 2 + 12 = 14 (10–12 → 12);
    Activity 4 = 2 + 10 + 8 = 20 (8–10 → 10, 7–8 → 8); Activity 2 has a time only for
    step 3 (2–3 → 3), so no total was set. Activity 3 has no step 3 (sharing); none
    was added.
  - >-
    Vocabulary glosses kept as in the notebook. "מִן – מ־ (בהשוואה)" and "מִין – מי"
    are both in the list; the workbook has an item on the difference. The Arabic
    title of the cycle was kept as written: "שׁבּכּאת אתַּואס'ול אֶלְאֶג'תמאעֶיֶּה".
  - >-
    Quizlet link: the tracking parameters "?i=…&x=…" were removed.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: social-media-past-class
    title: 'שיעור: רשתות חברתיות – עבר'
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: "רשתות חברתיות – שׁבּכּאת אתַּואס'ול אֶלְאֶג'תמאעֶיֶּה"
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: 'עבר פשוט לפי הגוף'
            description: 'אַנָא נַשַרְת, הוּ שָאפ, הִי כַּתַבַּת, אִחְנַא שָארַכְנָא, הֻם נַזַלּוּ – פעולות שהסתיימו ברשתות.'
          - name: 'השוואות'
            description: 'אַכְתַר מִן / אַקַל מִן / אַכְתַר שִי / אַקַל שִי'
      - id: quizlet
        type: externalLink
        lang: he
        label: רשתות חברתיות בקוויזלט
        url: https://quizlet.com/il/1144143255/%D7%A8%D7%A9%D7%AA%D7%95%D7%AA-%D7%97%D7%91%D7%A8%D7%AA%D7%99%D7%95%D7%AA-%D7%A8%D7%9E%D7%94-2-%D7%A9%D7%91%D7%9B%D7%90%D7%AA-%D7%90%D7%AA%D7%95%D7%90%D7%A1%D7%95%D7%9C-flash-cards/
      - id: focus
        type: callout
        lang: he
        tone: info
        title: מיקוד דקדוקי
        text: |-
          עבר פשוט אחד וברור (פעלים בעבר לפי הגוף).
          **השוואה לעברית:** כמו בעברית – ״כתבתי״, ״ראיתי״, ״שלחתי״ – גם בערבית המדוברת יש צורת עבר אחת לכל פעולה שהסתיימה.
      - id: intro-title
        type: heading
        lang: he
        level: 3
        text: 'פתיחה – סבב היכרות'
      - id: intro-how
        type: text
        lang: he
        text: כל תלמיד אומר שני משפטים בעבר.
      - id: intro
        type: sentenceFrame
        frame: |-
          אַנָא ___.
          אַנָא ___.
      - id: warmup-title
        type: heading
        lang: he
        level: 3
        text: 'שאלות חימום – תשובות מלאות בעבר'
      - id: warmup
        type: discussionQuestions
        items:
          - question: "שׁו אַוָּל תַטְבּיק' בּתֶפְתַחו אס'ובֶּח? וליש?"
          - question: >-
              שׁו נוע לֶחסאבּאת אלּי בתֶסְתַעְמֶלהא? (אח'בּאר, טַבֶּח', מוד'ה…) אעטיני אמְתֶלֶ'ה.
          - question: >-
              שׁו ראיָכּ בֶּל מושׁארכּאת לֶכּתירֶה עלא שׁבּכּאת אתַּואס'ול? מַק'בּול או לא!?
          - question: >-
              אנתי מן אַי נוע… אללי בתֶתְס'ל או אללי בֶּבְּעַת רסאיֶל? וליה?
          - question: >-
              הַל בֶּתְפַדּ'ל תכּון מותאבֶּע וַלּא ס'אנֶע מוחְתַוַא?
      - id: agree-title
        type: heading
        lang: he
        level: 4
        text: "מַע או דֶ'ד! מע אסַּבַּבְּ! – בעד או נגד, ולמה?"
      - id: agree
        type: discussionQuestions
        items:
          - question: "אֶלְחַ'ס'וס'יֶּה אַהַם מן אשְוהְרַה."
          - question: "מושׁארַכֶּת אֶלְאראא' אסֶּיאסיֶּה על שׁבּכּאת אתַּואס'ול אֶלְאֶג'תֶמאעי – פֶכְּרַה מניחה."
          - question: "אֶלְמואַתֶ'רין הֶנּי ק'ודְוֶה חַק'יק'יֶּה לג'יל אשּׁבּאבְּ."
          - question: 'נַשֶׁר אסּווָר אֶשׁי טביעי.'
      - id: activities-title
        type: heading
        lang: he
        level: 3
        text: פעילויות
      - id: act1
        type: classActivity
        lang: he
        title: 'פעילות 1: ״הרשתות שלי אתמול״ (עבר פשוט)'
        skills: ['עבר פשוט לפי הגוף']
        minutes: 11
        steps:
          - 'כתיבה אישית (5 דק׳): כל תלמיד כותב 4 משפטים בעבר על אתמול, לפי השאלות שלמטה.'
          - 'ראיון בזוגות (6 דק׳): התלמידים שואלים זה את זה את שאלות הראיון.'
      - id: act1-write-title
        type: heading
        lang: he
        level: 4
        text: כתיבה אישית
      - id: act1-write
        type: discussionQuestions
        items:
          - question: 'אֵי אַפְּלִיקֵיצְיָה אִסְתַעְמַלְת?'
          - question: 'שוּ שֻפְת אוּ נַשַרְת?'
          - question: 'שוּ אַעְגַ’בַּכּ אַכְתַר אֶשִי?'
          - question: 'שוּ מָא אַעְגַ’בַּכּ?'
      - id: act1-interview-title
        type: heading
        lang: he
        level: 4
        text: ראיון בזוגות
      - id: act1-interview
        type: discussionQuestions
        answerable: false
        items:
          - question: 'שוּ נַשַרְת?'
          - question: 'שוּ שֻׁופֶת?'
          - question: 'מע מִין חַכֵּית?'
          - question: 'אֵי אַפְּלִיקֵיצְיָה כָּאנַת מופידֶה?'
      - id: act2
        type: classActivity
        lang: he
        title: 'פעילות 2: ״הציר הדיגיטלי שלי״ (עבר + השוואות)'
        skills: ['עבר פשוט לפי הגוף', 'השוואות']
        steps:
          - 'יצירת ציר זמן אישי: כל תלמיד מצייר קו אופקי במחברת ומסמן עליו 3 רגעים חשובים מהשנה האחרונה ברשתות. רעיונות: מתי פתחת חשבון? מתי פרסמת משהו חשוב? מתי קיבלת הרבה לייקים או תגובות? מתי קרה משהו מפתיע?'
          - 'על כל נקודה כותבים משפט אחד בעבר. המורה עוזר בפעלים בסיסיים (בנק המילים).'
          - 'השוואה בזוגות: התלמידים מציגים זה לזה את הצירים ומשווים, בעזרת שאלות השיחה שלמטה.'
          - 'שיתוף קצר בכיתה (3 דק׳): כמה מתנדבים מספרים פרט אחד על בן הזוג.'
        wordBank:
          - פַתַחְת (פתחתי)
          - נַשַרְת (פרסמתי)
          - אַחַ’דְת (קיבלתי)
          - שֻפְת (ראיתי)
          - מַחֵית (מחקתי)
      - id: act2-questions-title
        type: heading
        lang: he
        level: 4
        text: שאלות שיחה
      - id: act2-questions
        type: discussionQuestions
        answerable: false
        items:
          - question: 'אַי לַחְזַה כָּאנַת אַכְתַר אשִי מֻומתְעָה?'
          - question: "אַי שַבַּכֶּה תַואס'ול אג'תמאעיה כָּאנַת אַכְתַר מֻפִידֵה אלַכ?"
      - id: act2-share
        type: examples
        items:
          - { text: 'מַרְיָאם אַחַ’דַת אַכְתַר תַעְלִיקַאת מִנִּי עַלַא אַוַּל צוּרַה.' }
          - { text: 'דָנִי פַתַח חִסַאב טִיקְטוֹק בִּיוּנְיוּ וְנַשַר וִידְיוֹ דַחִיק.' }
      - id: act3
        type: classActivity
        lang: he
        title: 'פעילות 3: ראיון – ״זיכרונות מהרשת״'
        skills: ['עבר פשוט לפי הגוף', 'השוואות']
        minutes: 14
        steps:
          - 'חלוקת תפקידים (2 דק׳): תלמיד A – עיתונאי; תלמיד B – יוצר רשת (יכול להיות הוא עצמו או דמות מוכרת).'
          - 'המורה אומר: ״אליום אִנְתָ מַשְהוּר עַלַא א-שַבַּכַּאת. אַחְכִי לַנָא עַן מַאדִי תַבְּעַכ!״'
          - 'ראיון בזוגות (12 דק׳): העיתונאי בוחר לפחות 4 שאלות מבנק השאלות וכותב את התשובות.'
      - id: act3-questions-title
        type: heading
        lang: he
        level: 4
        text: בנק שאלות
      - id: act3-questions
        type: discussionQuestions
        items:
          - question: 'שוּ כָּאן אַכְתַר פּוֹסְט אִלְלִי אִנְתָ שֻפְתּוּ סַנֶה אִלְלִי פַאתַת?'
          - question: 'שוּ כָּאלוּ נָאס בְּאַחְלַא תַעְלִיק גָ’אכ?'
          - question: 'מִין כָּאן אַוַּל מַשְהוּר תַאבַּעְתּו?'
          - question: 'שוּ עַמַלְת לַמָּא אַחַ’דְת כְּתִיר לַאיקאת?'
          - question: 'אַי שַבַּכֶּה אִסְתַעְמַלְת הַדיכְּ אסֶּנֶה?'
      - id: act4
        type: classActivity
        lang: he
        title: 'פעילות 4: דיבייט – ״הרשת עזרה או הזיקה לנו?״'
        skills: ['עבר פשוט לפי הגוף', 'השוואות']
        minutes: 20
        steps:
          - 'חלוקה לקבוצות (2 דק׳): קבוצה א – הרשת עזרה יותר; קבוצה ב – הרשת הזיקה יותר.'
          - 'חשיבה בקבוצה (10 דק׳): כל קבוצה כותבת 3–4 משפטים בעבר שתומכים בעמדה שלה, עם לפחות השוואה אחת.'
          - 'הדיבייט (8 דק׳): קבוצה א מקריאה משפט אחד, וקבוצה ב עונה במשפט נגדי. ממשיכים עד שכולם משתתפים.'
      - id: act4-question-title
        type: heading
        lang: he
        level: 4
        text: על הלוח
      - id: act4-question
        type: discussionQuestions
        items:
          - question: 'סַנֶה אִלְלִי פַאתַת – א-שַבַּכַּאת סאעדונא אַכְתַר אוּ דַרּוּנָא אַכְתַר?'
      - id: act4-phrases-title
        type: heading
        lang: he
        level: 4
        text: ביטויים שימושיים
      - id: act4-phrases
        type: examples
        items:
          - { text: 'אַנָא מַא בְּוַאאפִק לְאַנּוּ…' }
          - { text: 'הַאדַא כָּאן אַהַם מִן…' }
          - { text: 'הַאלמֻשְכִּל כָּאנַת אַכְבַּר מִן…' }
    teacherNotes:
      - id: n-plan
        anchor: null
        text: 'שתי מיומנויות במחזור: **עבר פשוט לפי הגוף** (פתיחה, פעילות 1, פעילות 3) ו**השוואות** (פעילות 2, פעילות 4). בכל פעילות דרשו משפטים מלאים בעבר.'
      - id: n-act1
        anchor: act1
        minutes: 11
        text: 'כתיבה אישית: 5 דקות. ראיון בזוגות: 6 דקות.'
      - id: n-act2
        anchor: act2
        text: 'מטרה: לדבר על רצף אירועים שהסתיימו בעבר ולשלב השוואות פשוטות (**אַכְתַר מִן / אַקַל מִן / אַכְתַר אשִי / אַקַל אשִי**). בשיתוף בכיתה הדגישו: עבר, גוף שלישי והשוואה ברורה.'
      - id: n-act3
        anchor: act3
        minutes: 14
        text: 'מטרה: לתרגל שאלות ותשובות בעבר דרך משחק תפקידים ולחזק שטף ודיבור טבעי. חלוקת תפקידים: 2 דקות. ראיון: 12 דקות.'
      - id: n-act4
        anchor: act4
        minutes: 20
        text: 'מטרה: לתרגל עבר + השוואות בדיבור חופשי דרך הבעת דעה. חלוקה: 2 דקות. חשיבה בקבוצה: 10 דקות. דיבייט: 8 דקות. כתבו על הלוח את השאלה ואת הביטויים השימושיים.'

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: social-media-past-summary
    title: סיכום השיעור
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'סיכום דקדוקי מורחב – עבר והשוואות בערבית מדוברת (A2)'
      - id: rules-past
        type: ruleSummary
        lang: he
        skill: 'עבר פשוט לפי הגוף'
        rules:
          - text: 'בערבית מדוברת משתמשים בצורה אחת עיקרית כדי לדבר על פעולה **שהסתיימה** בזמן ברור: אתמול, בשבוע שעבר, בשנה שעברה, לפני חודש, פעם אחת וכו׳. המבנה הבסיסי: **נושא + פועל בעבר**.'
            examples:
              - 'אַנָא נַשַרְת פּוֹסְט אִמְבַּארֶח.'
              - 'הוּ שָאפ וִידְיוֹ דַחִיק.'
              - 'הִי כַּתַבַּת תַעְלִיק עַלַא הַצוּרַה.'
              - 'אִחְנַא שָארַכְנָא וִידְיוֹ חִילוּ.'
              - 'הֻם נַזַלּוּ א-תַבִּיעָאת.'
          - text: 'כמו בעברית (״פרסמתי״, ״ראיתי״, ״כתבתי״, ״שיתפנו״), גם בערבית מדובר על פעולה **שנגמרה**. אין ״עזר״ כמו בעברית (״הייתי + פועל״): הפועל עצמו מראה שזה עבר.'
          - text: 'כל גוף מקבל סיומת קטנה:'
            examples:
              - 'אַנָא / אִנְתַ ← ־ת (אַנָא כַּתַבְת)'
              - 'הוּוֵה ← בלי תוספת (הוּ כַּתַב)'
              - 'הִיֵּה ← ־ת (הִי כַּתַבַּת)'
              - 'אִחְנָא ← ־נָא (אִחְנַא כַּתַבְנָא)'
              - 'הֻם ← ־וּ (הני כַּתַבּוּ)'
          - text: 'אותו דפוס עובד עם כל פועל מהשיעור:'
            examples:
              - 'אַנָא שֻופת / הוּוֵה שָאפ / אִחְנָא שֻפְנָא'
              - 'אַנָא נַשַׁרְת / הִיֵּה נַשַרַת / הֻם נַשַרוּ'
              - 'אַנָא סַמִעְת / הוּוֵה סַמִע / אִחְנָא סַמִעְנָא'
          - text: 'טעות נפוצה של דוברי עברית: לשכוח לשים פועל בעבר ולהשאיר הווה. ❌ אַנָא כַּתַב פּוֹסְט אִמְבַּארֶח ✅ **אַנָא כַּתַבְת פּוֹסְט אִמְבַּארֶח**'
      - id: conjugation
        type: table
        lang: he
        caption: 'הטיות עבר לפי גופים – כַּתַב (״כתב״)'
        header: [גוף, תעתיק בערבית מדוברת, משמעות בעברית]
        rows:
          - [אני, אַנָא כַּתַבְת, אני כתבתי]
          - [אתה (זכר), אִנְתי כַּתַבְת, אתה כתבת]
          - [הוא, הוּוֵה כַּתַב, הוא כתב]
          - [היא, הִי כַּתַבַת, היא כתבה]
          - [אנחנו, אִחְנָא כַּתַבְנָא, אנחנו כתבנו]
          - [הם, הני כַּתַבּוּ, הם כתבו]
      - id: rules-time
        type: ruleSummary
        lang: he
        skill: ביטויי זמן בעבר
        rules:
          - text: 'כמו בעברית, משתמשים במילים שמסמנות זמן שכבר עבר:'
            examples:
              - 'אִמְבַּארֶח – אתמול'
              - 'סַנֶה אִלְלִי פַאתַת – שנה שעברה'
              - 'סַבּוּע אִלְלִי פַאת – שבוע שעבר'
              - 'קַבֵּל שַהְר – לפני חודש'
              - 'מַרָּה – פעם אחת'
          - text: 'הביטוי יכול לבוא בתחילת המשפט או בסופו:'
            examples:
              - 'אִמְבַּארֶח אַנָא נַשַרְת פּוֹסְט.'
              - 'אַנָא נַשַרְת פּוֹסְט אִמְבַּארֶח.'
      - id: rules-compare
        type: ruleSummary
        lang: he
        skill: השוואות
        rules:
          - text: 'המבנים הבסיסיים:'
            examples:
              - 'אַכְתַר מִן – יותר מ…'
              - 'אַקַל מִן – פחות מ…'
              - 'אַכְתַר שִי – הכי'
              - "אַקַ'ל שִי – הכי פחות"
          - text: 'טעות נפוצה: לשכוח את **מִן** אחרי ״יותר / פחות״. ❌ אַכְתַר מֻתְעָה טִיקְטוֹק ✅ **טִיקְטוֹק אַכְתַר מֻתְעָה מִן…**'
      - id: main-idea
        type: callout
        lang: he
        tone: tip
        title: הרעיון המרכזי
        text: |-
          כשאני מדבר על משהו שכבר קרה – אני משתמש בפועל בעבר.
          כשאני רוצה להשוות – אני משתמש ב־**אַכְתַר מִן / אַקַל מִן / אַכְתַר שִי / אַקַל שִי**.
          בדיוק כמו בעברית: ״ראיתי סרטון אתמול״, ״טיקטוק יותר מעניין מאינסטגרם״ – פשוט, ישיר ודיבורי.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: 'עברו על הסיומות לפי הגוף עם הפועל כַּתַב, ואחר כך בקשו מכל תלמיד משפט אחד בעבר ומשפט אחד עם השוואה.'

  # ── after class ──────────────────────────────────────────────────────────
  - slug: social-media-past-homework
    title: שיעורי בית עם מורי
    phase: after_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'שיעורי בית – עם מוֹרי'
      - id: how
        type: text
        lang: he
        text: 'מטרה: מורי מפעיל אתכם, שואל, מאתגר ומוביל את השיחה. פתחו את הצ׳אט עם מורי, העתיקו הודעה אחת ושלחו אותה. כל התשובות שלכם בגֻ’מַל כָּאמְלֵה (משפטים מלאים), בעבר ובהשוואות.'
      - id: part1-title
        type: heading
        lang: he
        level: 3
        text: 'חלק 1 – עבר פשוט: חוויות מהרשתות'
      - id: mori-1
        type: aiTutorPrompt
        lang: he
        message: |-
          מורי, אני מתרגל עבר בערבית מדוברת (בתעתיק עברי). פתח כך: ״מרחבא! אליוֹם אנא רָאח אַסְאַלַכ עַלַא חַיָאתַכ עַלַא אלסוֹשְיָאל. בִּדִּי תְגִ’יב בִּגֻ’מַל כָּאמְלֵה בִּלְמָאדִי.״
          שאל אותי את השאלות האלה אחת־אחת וחכה לתשובה שלי:
          שו עַמַלְת אִמְבַּארֶח עַלַא אלסוֹשְיָאל?
          שו נַשַרְת אַחֵר מַרָּה?
          מִין חַכֵּית מַעַא אִמְבַּארֶח?
          שו אַכְתַר פּוֹסְט שֻפְתַה אַחֵר סַבּוּע?
          שו כָּאן אַכְתַר שִי מֻתְעָה וּשו כָּאן אַכְתַר שִי מֻזְעִ’ג?
          אחרי כל תשובה: הוסף פועל בעבר אם חסר, סדר את סדר המילים, וחזור על המשפט בצורה נכונה, למשל: ״אַחְסַן! קוּל: אִמְבַּארֶח אִסְתַעְמַלְת וָאטְסַאבּ וְחַכֵּית מַעַא עֵילְתִי.״
      - id: part2-title
        type: heading
        lang: he
        level: 3
        text: 'חלק 2 – השוואות בעבר'
      - id: mori-2
        type: aiTutorPrompt
        lang: he
        message: |-
          מורי, עכשיו רָאח נְקַארֵן. אני עונה בִּלְמָאדִי וּבִּאלמֻקָּארַנַאת. שאל אותי אחת־אחת:
          אַיְה אַפּ אִסְתַעְמַלְת אַכְתַר בַּאחֵר שַהְר – אִנְסְתַגְרָאם וְלָא טִיקְטוֹק? לֵיש?
          אַיְה כָּאן אַכְתַר מֻתְעָה לַכ – פּוֹסְט וְלָא וִידְיוֹ?
          מִין כָּאן אַכְתַר תְקַארֵן מַעַא – צַדִיקַכ וְלָא עֵילְתַכ?
          אַיְה כָּאן אַכְתַר מֻפִיד לַכ – אלסוֹשְיָאל וְלָא מֻחָאדַ’רַה?
          דרוש ממני מבנה ברור: הַאדַא כָּאן אַכְתַר … מִן … / הַאדַא כָּאן אַקַל … מִן … / הַאדַא כָּאן אַחְלַא שִי.
          תקן אותי מיד אם חסר ״מִן״, אם חסר עבר או אם המשפט קצר מדי.
      - id: part3-title
        type: heading
        lang: he
        level: 3
        text: 'חלק 3 – סיפור קצר בעבר'
      - id: mori-3
        type: aiTutorPrompt
        lang: he
        message: |-
          מורי, תגיד לי: ״בדִּי מִנַּכ חַכִּי לִי סִיפּוּר קַצִיר עַלַא יוֹם וָאחֵד עַלַא אלסוֹשְיָאל. חַמְס גֻ’מַל בִּלְמָאדִי.״
          אני אספר 5 משפטים. עצור אחרי כל משפט, תקן את צורת העבר ובקש הרחבה, למשל:
          טַיִּב, וּבַּעְדֵין שו עַמַלְת?
          מַע מִין כֻּנְת?
          כֵּיף כָּאן אִחְסַאסַכ?
      - id: part4-title
        type: heading
        lang: he
        level: 3
        text: 'חלק 4 – ראיון קצר'
      - id: mori-4
        type: aiTutorPrompt
        lang: he
        message: |-
          מורי, היכנס לתפקיד מראיין ותגיד לי: ״תַחַיַּל אִנַּכ מַשְהוּר עַלַא אלסוֹשְיָאל. אנא רָאח אַעְמַל מַעַכ מֻקַּאבַּלֵה.״
          שאל אותי:
          שו כָּאן אַכְתַר פּוֹסְט מַשְהוּר עִנְדַכ בַּאלסַּנֵה אלמָאדִי?
          שו כָּאלוּ אלנָּאס בִּאַחְלַא תַעְלִיק?
          מִין כָּאן אַוַּל שַחְ’ס מַשְהוּר תְבַּעְתֻה?
          שו עַמַלְת לַמָּא אַחַדְת כְּתִיר לַייקָאת?
          אני עונה בעבר. תקן, שפר ובקש ממני משפטים מלאים וברורים.

