# Cycle "סרטים וסדרות: הווה ועבר פשוט", converted from the spoken Arabic level 2
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (spoken Arabic in Hebrew
# transliteration, apc-Hebr); Hebrew instructions carry `lang: he`.
course: ar-medubar-2
slug: movies-and-series-past
title: 'סרטים וסדרות: הווה ועבר'
goal: 'לספר על סרט או סדרה שראיתי בעבר פשוט, ולהביע העדפה ודעה בהווה עם סיבה (עַלַשַאן).'
position: 1
status: in_review

review:
  - >-
    The two workbook exercises ("movies-and-series-past-story" and
    "movies-and-series-past-opinion") are NEW: the notebook has no self-study
    exercises. They were written only from this cycle's summary, examples and
    vocabulary. An Arabic teacher must check every right answer, every wrong option
    and every transliteration before students see them.
  - >-
    The notebook lists four lesson goals; the platform uses two skills. They were
    grouped as (1) past simple: telling about a film and a short story (goals 1 and
    3), and (2) present preferences and an opinion with a reason (goals 2 and 4).
    Please confirm.
  - >-
    Typo fixed: "בּחֵיבּ" → "בּחֵבּ" in the opening round template (every other place
    in the cycle has בּחֵבּ). The Activity 3 example "אנא בחיב האד אלפילֶם לאנו
    חק'יק'י ואתמת'יל מניח כתיר" was kept as written (unvocalised, with לאנו instead
    of עַלַשַאן); please check.
  - >-
    Not corrected, please decide. The verb "חד'רֶת / חַד’רֶת / חַצַ’רְת" is "watched" in
    the warm-up and the key structures ("איזה סרט חד'רֶת"), but the summary and the
    vocabulary translate it as "הגעתי" (I arrived), and the vocabulary spells it with
    צ' instead of ד'. The present "בּחְדַ'ר / בּחְדַר" (I watch) is written with and
    without geresh. The exercises do not use this verb.
  - >-
    Not corrected, spelling variants in the cycle: "ק'עַדְת / קַ'עַדֶת / כַּעַדְת"
    (I sat); "כּונֶת / כּנת" (I was); "שֻׁופֶת / שֻפְת" and "רֻוחֶת / רֻחְת" (two
    spellings of the same forms); "זְר'יר" (warm-up, opening) / "זְעִ’יר"
    (vocabulary); "בּאַחֵ’ר" / "בֶּלאַחֵ’ר" (Activity 4 template); "מֻסַלְסַל /
    מֻוסַלְסַל / מוסַלְסַל"; "פִילְם / פילֶם". The exercises use the summary spellings
    (שֻפְת, רֻחְת, ק'עַדְת, כּנת).
  - >-
    Please check: "שַחְצִיֵה" (character, vocabulary) is usually written with ח'
    (شخصية); "מֻדְחִ’יק" (funny) has ח' under ح; warm-up 5 "אַסְוָאְ'" (worst) has an
    odd geresh on the alef; Mori message 1 "מַע מִין שֻפְתוּ?" uses the plural "you".
  - >-
    Activity 2 has no pictures in the notebook ("scenes from famous films are
    shown"): the teacher must bring them. Its stages are numbered oddly in the
    notebook (it starts at "שלב 2"); they were renumbered as steps. Activity 4's
    "שלב 4" was also renumbered.
  - >-
    Hebrew glosses inside Arabic questions were moved to a teacher note: "(שפות
    זרות)" in warm-up 2. The notebook's "Date / Participants" lines and the Arabic
    script column of the vocabulary were left out (the course is written in
    transliteration).
  - >-
    The Quizlet link's share parameters (?i=…&x=…) were removed. Activity 1 writing
    time "4–5 minutes" is recorded as 5. The "תשובת תלמיד" lines are replaced by
    the optional answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: movies-and-series-past-class
    title: 'שיעור: סרטים וסדרות'
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'סרטים וסדרות: הווה ועבר פשוט'
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: עבר פשוט – לספר על סרט
            description: >-
              שֻפְת, רֻחְת, ק'עַדְת, כּנת; סיפור קצר עם אַוַל אִשִי / בּעְדֵין / בּאַחֵ’ר.
          - name: הווה ודעה עם סיבה
            description: >-
              בּחֵבּ, בּשֻוף, בּרֻוח; אנא בּחֵבּ… עַלַשַאן… / אנא מַא בּחֵבּ… עַלַשַאן…
      - id: quizlet
        type: externalLink
        lang: he
        label: סרטים וסדרות בקוויזלט
        url: https://quizlet.com/il/1132950813/%D7%A1%D7%A8%D7%98%D7%99%D7%9D-%D7%95%D7%A1%D7%93%D7%A8%D7%95%D7%AA-%D7%94%D7%95%D7%95%D7%94-%D7%95%D7%A2%D7%91%D7%A8-%D7%A4%D7%A9%D7%95%D7%98-%D7%A8%D7%9E%D7%94-2-%D7%A2%D7%A8%D7%91%D7%99%D7%AA-%D7%90%D7%A4%D7%9C%D7%90%D7%9D-%D7%95-%D7%9E%D7%95%D7%A1%D7%9C%D7%A1%D7%9C%D7%90%D7%AA-flash-cards/
      - id: goals
        type: callout
        lang: he
        tone: info
        title: מטרות השיעור
        text: |-
          לתרגל דיבור על חוויות מסרטים וסדרות בעבר פשוט.
          לתאר העדפות בהווה.
          לספר סיפור קצר וברור.
          להביע דעה פשוטה עם סיבה.
      - id: structures
        type: table
        lang: he
        caption: מבנים מרכזיים
        rows:
          - [עבר, "כּונֶת, שֻׁופֶת, חד'ֶרֶת, רֻוחֶת, קַ'עַדֶת"]
          - [הווה, "בּחֵבּ, בּשֻׁוף, בּחְדַ'ר, בּרֻוח"]
          - [דעה, 'בּחֵבּ… עַלַשַאן… / מַא בּחֵבּ… עַלַשַאן…']
      - id: intro-title
        type: heading
        lang: he
        level: 3
        text: 'סבב פתיחה: אז והיום'
      - id: intro-how
        type: text
        lang: he
        text: 'מטרה: חיבור בין עבר להווה. כל תלמיד אומר משפט לפי התבנית.'
      - id: intro
        type: sentenceFrame
        frame: |-
          לַמָּא כּונֶת אִזַא זְר'יר / זְר'ירֵה בּחֵבּ ___.
          איסא אֲנַא בּחֵבּ ___.
        example: "אנא כּונֶת אִזַא זְר'יר בּחֵבּ פִילֶם כַּרְתוּן. איסא אֲנַא בּחֵבּ מֻוסַלְסַל דְרָאמַא."
      - id: reminder
        type: ruleSummary
        lang: he
        skill: 'תזכורת קצרה: זמן עבר'
        rules:
          - text: 'בעברית, כשמדברים על מה שכבר קרה, משתמשים בזמן עבר: ראיתי, הלכתי, ישבתי, אכלתי. בערבית מדוברת זה עובד באותו היגיון: משנים את הפועל כדי לסמן עבר.'
            examples:
              - 'ראיתי → שֻפְת'
              - 'הלכתי → רֻחְת'
              - "ישבתי → ק'עַדְת"
              - 'הייתי → כּונֶת'
          - text: 'המבנה דומה מאוד לעברית: **אני + פועל בעבר + המשך המשפט**. ״אני ראיתי סרט בבית.״'
            examples:
              - 'אנא שֻפְת פִילְם פִי אל־בית.'
          - text: 'לכן, בכל תשובה לשאלות החימום התחילו ב־**אנא** ואז השתמשו בפועל בעבר.'
      - id: warmup-title
        type: heading
        lang: he
        level: 3
        text: שאלות חימום
      - id: warmup-how
        type: text
        lang: he
        text: 'מטרה: שימוש בעבר פשוט דרך שאלות אישיות. עונים במשפט מלא.'
      - id: warmup
        type: discussionQuestions
        items:
          - question: "אַיְ פִילֶם חד'רֶת כְּתִיר וְאַנְת זְר’יר? ען שו בֶּחכּי אלפילֶם?"
          - question: "בֶּתְחֶבְּ / י תֶחְד'ר / י אפלאם בֶּלור'את אג'נַבֶּיֶּה?"
          - question: "שו אחְלָא מֻוסַלְסַל חד'רְתו / י? שו אלק'ֶס'ה?"
          - question: "שו הו פילֶמַכְּ אלמופַד'ל? וליש?"
          - question: "שו אַסְוָאְ' פילֶם / מוסַלְסַל חד'רְתו / י?"
          - question: "לַוְ כּונֶת / י מוח'רֶג' / ת אַפְלאם – ען שו בתֶעְמַל / י פילֶם?"
      - id: activities-title
        type: heading
        lang: he
        level: 3
        text: פעילויות
      - id: act1
        type: classActivity
        lang: he
        title: 'פעילות 1: הסרט האחרון שראיתי'
        skills: [עבר פשוט – לספר על סרט]
        steps:
          - 'מודל של המורה: המורה כותב על הלוח את ארבע השאלות שלמטה וקורא אותן בקול. ״ארבעה משפטים. קצרים. כולם בזמן עבר.״'
          - 'כתיבה אישית: כל תלמיד כותב ארבעה משפטים משלו, תשובה לכל שאלה.'
          - 'תזכורת: עבר פשוט בלבד, משפט קצר, לא צריך הרבה פרטים.'
      - id: act1-questions
        type: discussionQuestions
        items:
          - question: 'שו אסם אלפילֶם?'
          - question: "וֵין חד'רְתו / י?"
          - question: 'מַע מִין?'
          - question: 'חַבֵּיתוּ? וְלֵיש?'
      - id: act2
        type: classActivity
        lang: he
        title: 'פעילות 2: סיפור מתמונה'
        skills: [עבר פשוט – לספר על סרט]
        steps:
          - 'המורה מציג סצנות מסרטים מפורסמים. כל תלמיד בוחר סצנה אחת.'
          - 'בניית שלד לסיפור: המורה כותב על הלוח את התבנית שלמטה. ״אנחנו בונים סיפור קצר בעבר. כל משפט מספר מה קרה.״'
          - 'עבודה בזוגות: כותבים יחד שלושה משפטים על התמונה, לפי התבנית.'
          - 'תזכורת: עבר פשוט בלבד, משפט קצר. לא צריך להיות ״נכון״ לפי הסרט, רק הגיוני.'
          - 'שיתוף: כל זוג מקריא את הסיפור שלו.'
      - id: act2-frame
        type: sentenceFrame
        frame: |-
          אַוַל אִשִי ___.
          בּעְדֵין ___.
          בּאַחֵ’ר ___.
      - id: act3
        type: classActivity
        lang: he
        title: 'פעילות 3: הדעה שלי'
        skills: [הווה ודעה עם סיבה]
        steps:
          - 'מודל של המורה: שני משפטים קצרים, אחד חיובי ואחד שלילי (בדוגמה). ״מה אני אומר כאן? דעה + סיבה. תמיד יש עַלַשַאן.״'
          - 'מילים לעזרה: קוראים בקול את הסיבות שבבנק המילים.'
          - 'חשיבה אישית (חצי דקה): בוחרים דבר אחד בלבד – סרט שאוהבים או סדרה שלא אוהבים.'
          - 'אמירה בעל פה, תלמיד אחרי תלמיד: כל אחד אומר **משפט אחד בלבד** לפי התבנית. אפשר לעודד שיחה ודעות של שאר המשתתפים.'
        wordBank:
          - 'מֻדְחִ’יק (מצחיק)'
          - 'מֻחְזִן (עצוב)'
          - 'מֻתְ’יר (מותח)'
          - 'גַ’מִיל (יפה)'
          - 'טַוִיל (ארוך)'
          - 'מומֶל (משעמם)'
        example: |-
          אנא בּחֵבּ הַאדַא אל־פִילְם עַלַשַאן כּאן מֻתְ’יר.
          אנא מַא בּחֵבּ הַאדַא אל־מֻסַלְסַל עַלַשַאן כּאן טַוִיל.
      - id: act3-frame
        type: sentenceFrame
        frame: |-
          אנא בּחֵבּ הַאדַא אל־פִילְם עַלַשַאן ___.
          אנא מַא בּחֵבּ הַאדַא אל־מֻסַלְסַל עַלַשַאן ___.
        example: "אנא בחיב האד אלפילֶם לאנו חק'יק'י ואתמת'יל מניח כתיר."
      - id: act4
        type: classActivity
        lang: he
        title: 'פעילות 4: יצירה עצמאית'
        skills: [עבר פשוט – לספר על סרט]
        steps:
          - 'כל קבוצה כותבת שלושה משפטים משלה על ״צפייה בסרט״, לפי התבנית, אבל בסדר מבולגן.'
          - 'החלפה וניחוש: כל קבוצה מעבירה את המשפטים לקבוצה אחרת. הקבוצה השנייה מסדרת אותם נכון ומקריאה בקול.'
      - id: act4-frame
        type: sentenceFrame
        frame: |-
          אַוַל אִשִי ___.
          בּעְדֵין ___.
          בֶּלאַחֵ’ר ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: "שתי מיומנויות: עבר פשוט (שאלות החימום, פעילויות 1, 2 ו־4) והווה + דעה עם סיבה (פעילות 3). מבנים מרכזיים: כּונֶת, שֻׁופֶת, רֻוחֶת, קַ'עַדֶת; בּחֵבּ, בּשֻׁוף, בּרֻוח; בּחֵבּ… עַלַשַאן…"
      - id: n-intro
        anchor: intro
        text: 'הדגימו משפט אחד על עצמכם (הדוגמה), ואחר כך כל תלמיד אומר משפט דומה.'
      - id: n-reminder
        anchor: reminder
        text: 'קראו את התזכורת עם התלמידים לפני שאלות החימום.'
      - id: n-warmup
        anchor: warmup
        text: "כתבו על הלוח שאלה אחת בכל פעם. כל תלמיד עונה במשפט מלא. בשאלה 2, ״בֶּלור'את אג'נַבֶּיֶּה״ פירושו ״בשפות זרות״."
      - id: n-act1
        anchor: act1
        text: 'תנו לתלמידים 5 דקות לכתוב את ארבעת המשפטים. עברו בין התלמידים, עזרו במילים חסרות ותקנו אם צריך.'
      - id: n-act2
        anchor: act2
        text: 'הכינו מראש כמה תמונות של סצנות מסרטים מפורסמים (לא נמצאות במחברת).'

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: movies-and-series-past-summary
    title: סיכום השיעור
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'סיכום דקדוקי – סרטים וסדרות (הווה + עבר פשוט)'
      - id: intro
        type: text
        lang: he
        text: בשיעור הזה אנחנו משתמשים בשני זמנים בלבד.
      - id: rules-past
        type: ruleSummary
        lang: he
        skill: '1. עבר פשוט – מה קרה כבר'
        rules:
          - text: 'כמו בעברית, משתמשים בעבר כדי לספר על חוויה שהסתיימה: ראיתי סרט. הלכתי לקולנוע. ישבתי בבית.'
            examples:
              - 'אנא שֻׁופֶת פִילְם.'
              - 'אנא רֻוחֶת עַלַא אל־סִינֵמַא.'
              - "אנא קַ'עַדֶת פִי אל־בית."
          - text: 'משתמשים בעבר כדי לספר איזה סרט ראיתי, לתאר מה קרה בסצנה, לבנות סיפור קצר ולענות על שאלות על חוויות.'
          - text: 'מבנה בסיסי: **אנא + פועל בעבר + המשך המשפט**'
            examples:
              - 'אנא שֻפְת פִילְם פִי אל־בית.'
              - 'אנא רֻחְת עַלַא אל־סִינֵמַא.'
      - id: past-verbs
        type: table
        lang: he
        caption: פעלים חשובים מהשיעור
        header: [עברית, ערבית מדוברת]
        rows:
          - [ראיתי, 'שֻׁופֶת / שֻפְת']
          - [הלכתי, 'רֻוחֶת / רֻחְת']
          - [ישבתי, "ק'עַדְת"]
          - [הייתי, 'כּונֶת / כּנת']
          - [הגעתי, 'חַד’רֶת / חַד’רְת']
      - id: rules-persons
        type: ruleSummary
        lang: he
        skill: איך מבטאים פועל בעבר
        rules:
          - text: 'בערבית מדוברת, כמו בעברית, הפועל משתנה לפי מי שעושה את הפעולה: אני, אתה, את, הוא, היא, אנחנו. בעברית מוסיפים סיומות (ראיתי, ראית, ראינו), וגם בערבית מוסיפים סיומות קבועות לפועל.'
      - id: persons
        type: table
        lang: he
        caption: 'ראיתי, ראית, ראה…'
        header: [עברית, ערבית מדוברת]
        rows:
          - [אני ראיתי, 'אנא **שֻפְת**']
          - [אתה ראית, 'אנתַ **שֻפְת**']
          - [את ראית, 'אנתִ **שֻפְתִי**']
          - [הוא ראה, 'הוּוֶה **שַאף**']
          - [היא ראתה, 'הִי **שַאפַת**']
          - [אנחנו ראינו, 'אִחְנַא **שֻפְנַא**']
      - id: rules-same
        type: ruleSummary
        lang: he
        skill: 'כמו בעברית: אני + פועל בעבר + המשך'
        rules:
          - text: "אותו עיקרון עובד עם פעלים אחרים: הלכתי – רֻחְת, ישבתי – ק'עַדְת, הייתי – כּנת, הגעתי – חַד’רְת. ״אני הלכתי לקולנוע.״"
            examples:
              - 'אנא רֻחְת עַלַא אל־סִינֵמַא.'
      - id: rules-present
        type: ruleSummary
        lang: he
        skill: '2. הווה – מה אני אוהב עכשיו'
        rules:
          - text: 'בהווה מדברים על העדפות והרגלים.'
            examples:
              - 'אנא בּחֵבּ פִילְם כַּרְתוּן.'
              - 'אנא בּשֻוף מֻסַלְסַל דַאימַן.'
              - 'אנא בּחְדַר טִלְפִיזְיוֹן בַּלֵיל.'
          - text: 'פעלים נפוצים: **בּחֵבּ** – אוהב, **בּשֻוף** – רואה, **בּחְדַר** – צופה, **בּרֻוח** – הולך.'
      - id: rules-opinion
        type: ruleSummary
        lang: he
        skill: '3. הבעת דעה עם סיבה'
        rules:
          - text: 'מבנה פשוט: אנא בּחֵבּ ___ עַלַשַאן ___. / אנא מַא בּחֵבּ ___ עַלַשַאן ___.'
            examples:
              - 'אנא בּחֵבּ הַאדַא אל־פִילְם עַלַשַאן כּאן מֻדְחִ’יק.'
              - 'אנא מַא בּחֵבּ הַאדַא אל־מֻסַלְסַל עַלַשַאן כּאן טַוִיל.'
          - text: 'תמיד יש: **דעה + עַלַשַאן + סיבה**'
      - id: recap
        type: callout
        lang: he
        tone: info
        title: כך בשיעור אנחנו משלבים
        text: |-
          **עבר** – לספר מה ראיתי ומה קרה.
          **הווה** – להגיד מה אני אוהב עכשיו.
          **דעה** – להגיד למה אהבתי או לא אהבתי.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: עברו על שלושת החלקים ובקשו מכל תלמיד משפט אחד בעבר ומשפט דעה אחד עם עַלַשַאן.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: movies-and-series-past-homework
    title: שיעורי בית עם Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'שיעורי בית – תרגול עם Mori'
      - id: how
        type: text
        lang: he
        text: >-
          פתחו את הצ'אט עם Mori ושלחו את ההודעות אחת־אחת. כל התשובות שלכם חייבות להיות
          **בערבית בתעתיק עברי** (לא בעברית רגילה).
      - id: mori-1
        type: aiTutorPrompt
        lang: he
        title: 'הודעה 1 – עבר פשוט: הסרט האחרון'
        message: Mori, זה לשיעור ערבית. תשאל אותי בערבית בתעתיק עברי על הסרט האחרון שראיתי. תקן אותי בעדינות אם אני טועה בעבר.
      - id: mori-1-asks
        type: text
        lang: he
        text: 'Mori ישאל למשל (ומתחת – דוגמה לתשובה שלכם):'
      - id: mori-1-questions
        type: discussionQuestions
        answerable: false
        items:
          - question: 'אֵיש שֻפְת?'
            frame: 'אנא שֻפְת פִילְם.'
          - question: 'וֵין שֻפְת?'
            frame: 'שֻפְתוּ פִי אל־בית.'
          - question: 'מַע מִין שֻפְתוּ?'
            frame: 'שֻפְתוּ מַע סַחְבִּי.'
          - question: 'חַבֵּיתוּ וְלֵיש?'
            frame: 'חַבֵּיתוּ עַלַשַאן כּאן מֻדְחִ’יק.'
      - id: mori-2
        type: aiTutorPrompt
        lang: he
        title: 'הודעה 2 – הווה: מה אני אוהב'
        message: מורי, זה לשיעור ערבית. תשאל אותי בערבית בתעתיק על סרטים או סדרות שאני אוהב בהווה. תקן אותי אם צריך.
      - id: mori-2-answers
        type: examples
        items:
          - text: 'אנא בּחֵבּ מֻסַלְסַל דְרָאמַא.'
          - text: 'אנא בּחְדַר טִלְפִיזְיוֹן בַּלֵיל.'
      - id: mori-3
        type: aiTutorPrompt
        lang: he
        title: 'הודעה 3 – דעה עם סיבה'
        message: Mori, זה לשיעור ערבית. בקש ממני משפט אחד עם "עַלַשַאן" על סרט או סדרה. תקן אותי בעדינות.
      - id: mori-3-answers
        type: examples
        items:
          - text: 'אנא בּחֵבּ הַאדַא אל־פִילְם עַלַשַאן כּאן גַ’מִיל.'
          - text: 'אנא מַא בּחֵבּ הַאדַא אל־מֻסַלְסַל עַלַשַאן כּאן טַוִיל.'
      - id: mori-4
        type: aiTutorPrompt
        lang: he
        title: 'הודעה 4 – מיני סיפור בעבר'
        message: Mori, זה לשיעור ערבית. בקש ממני לספר מיני סיפור בעבר, בשלושה משפטים בתעתיק. תקן את הפעלים.
      - id: mori-4-frame
        type: sentenceFrame
        frame: |-
          אַוַל אִשִי ___.
          בּעְדֵין ___.
          בּאַחֵ’ר ___.
        example: |-
          אַוַל אִשִי אנא רֻחְת עַלַא אל־בית.
          בּעְדֵין אנא שֻפְת פִילְם.
          בּאַחֵ’ר אנא כַּעַדְת וְנִמְת.
      - id: mori-returns
        type: callout
        lang: he
        tone: info
        text: Mori מחזיר את המשפטים בצורה נכונה, תמיד **בערבית בתעתיק עברי**.

