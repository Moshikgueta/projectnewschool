vocabulary:
  - slug: movies-and-series-past
    title: סרטים וסדרות
    items: *movies-and-series-past-words

activities:
  - slug: movies-and-series-past-story
    title: "עבר פשוט: שֻפְת, רֻחְת, ק'עַדְת"
    minutes: 8
    items:
      - id: past-verbs
        type: matching
        lang: he
        prompt: התאימו כל פועל בעבר לפירוש שלו.
        pairs:
          - ['שֻפְת', 'ראיתי']
          - ['רֻחְת', 'הלכתי']
          - ["ק'עַדְת", 'ישבתי']
          - ['כּנת', 'הייתי']
          - ['נִמְת', 'ישנתי']
      - id: saw-film
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״אני ראיתי סרט בבית.״?'
        options:
          - { text: 'אנא שֻפְת פִילְם פִי אל־בית.', correct: true }
          - {
              text: 'אנא בּשֻוף פִילְם פִי אל־בית.',
              feedback: 'בּשֻוף הוא הווה (״רואה״). בעבר אומרים שֻפְת.',
            }
          - {
              text: 'אנא שַאף פִילְם פִי אל־בית.',
              feedback: 'שַאף פירושו ״הוא ראה״. ל״אני״ אומרים שֻפְת.',
            }
      - id: she-saw
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״היא ראתה״?'
        options:
          - { text: 'הִי שַאפַת', correct: true }
          - { text: 'הוּוֶה שַאף', feedback: 'זה ״הוא ראה״.' }
          - { text: 'אִחְנַא שֻפְנַא', feedback: 'זה ״אנחנו ראינו״.' }
      - id: you-f-saw
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים לאישה ״את ראית״?'
        options:
          - { text: 'אנתִ שֻפְתִי', correct: true }
          - { text: 'אנתַ שֻפְת', feedback: 'זה ״אתה ראית״ – לגבר.' }
          - { text: 'אנא שֻפְת', feedback: 'זה ״אני ראיתי״.' }
      - id: went-cinema
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״אני הלכתי לקולנוע.״?'
        options:
          - { text: 'אנא רֻחְת עַלַא אל־סִינֵמַא.', correct: true }
          - {
              text: 'אנא בּרֻוח עַלַא אל־סִינֵמַא.',
              feedback: 'בּרֻוח הוא הווה (״הולך״). בעבר אומרים רֻחְת.',
            }
          - {
              text: "אנא ק'עַדְת עַלַא אל־סִינֵמַא.",
              feedback: "ק'עַדְת פירושו ״ישבתי״, לא ״הלכתי״.",
            }
      - id: first-then
        type: trueFalse
        lang: he
        prompt: '״אַוַל אִשִי״ פירושו ״קודם״, ו״בּעְדֵין״ פירושו ״אחר כך״.'
        answer: true
        feedback:
          correct: 'נכון! כך מתחילים סיפור קצר: אַוַל אִשִי…, בּעְדֵין…, בּאַחֵ’ר…'
          incorrect: 'זה נכון: אַוַל אִשִי = קודם, בּעְדֵין = אחר כך.'
      - id: story-then
        type: multipleChoice
        lang: he
        prompt: 'השלימו את הסיפור: אַוַל אִשִי אנא רֻחְת עַלַא אל־בית. ___ אנא שֻפְת פִילְם.'
        options:
          - { text: 'בּעְדֵין', correct: true }
          - {
              text: 'אַוַל אִשִי',
              feedback: 'אַוַל אִשִי (קודם) פותח את הסיפור. במשפט השני אומרים בּעְדֵין (אחר כך).',
            }
          - { text: 'עַלַשַאן', feedback: 'עַלַשַאן פירושו ״כי / בגלל״, לא ״אחר כך״.' }
      - id: order-cinema
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״אני הלכתי לקולנוע.״'
        sentence: 'אנא רֻחְת עַלַא אל־סִינֵמַא'

  - slug: movies-and-series-past-opinion
    title: 'הווה ודעה: בּחֵבּ… עַלַשַאן…'
    minutes: 8
    items:
      - id: reasons
        type: matching
        lang: he
        prompt: התאימו כל מילה לפירוש שלה.
        pairs:
          - ['מֻדְחִ’יק', 'מצחיק']
          - ['מֻחְזִן', 'עצוב']
          - ['מֻתְ’יר', 'מותח']
          - ['טַוִיל', 'ארוך']
          - ['מומֶל', 'משעמם']
      - id: because
        type: multipleChoice
        lang: he
        prompt: 'מה פירוש ״עַלַשַאן״?'
        options:
          - { text: 'כי / בגלל', correct: true }
          - { text: 'עם', feedback: '״עם״ זה מַע.' }
          - { text: 'עכשיו', feedback: '״עכשיו״ זה הַלַק.' }
      - id: not-like-long
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״אני לא אוהב את הסדרה הזאת כי היא הייתה ארוכה.״?'
        options:
          - { text: 'אנא מַא בּחֵבּ הַאדַא אל־מֻסַלְסַל עַלַשַאן כּאן טַוִיל.', correct: true }
          - {
              text: 'אנא בּחֵבּ הַאדַא אל־מֻסַלְסַל עַלַשַאן כּאן טַוִיל.',
              feedback: 'כאן חסר מַא: בּחֵבּ = אוהב, מַא בּחֵבּ = לא אוהב.',
            }
          - {
              text: 'אנא מַא בּחֵבּ הַאדַא אל־מֻסַלְסַל מַע כּאן טַוִיל.',
              feedback: 'את הסיבה מוסיפים עם עַלַשַאן (כי). מַע פירושו ״עם״.',
            }
      - id: funny
        type: multipleChoice
        lang: he
        prompt: '״אני אוהב את הסרט הזה כי הוא היה מצחיק.״ – אנא בּחֵבּ הַאדַא אל־פִילְם עַלַשַאן כּאן ___'
        options:
          - { text: 'מֻדְחִ’יק', correct: true }
          - { text: 'מֻחְזִן', feedback: 'מֻחְזִן פירושו ״עצוב״.' }
          - { text: 'מומֶל', feedback: 'מומֶל פירושו ״משעמם״.' }
      - id: watch-always
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״אני רואה סדרה תמיד.״?'
        options:
          - { text: 'אנא בּשֻוף מֻסַלְסַל דַאימַן.', correct: true }
          - {
              text: 'אנא שֻפְת מֻסַלְסַל דַאימַן.',
              feedback: 'שֻפְת הוא עבר (״ראיתי״). להרגל בהווה אומרים בּשֻוף.',
            }
          - { text: 'אנא בּחֵבּ מֻסַלְסַל דַאימַן.', feedback: 'בּחֵבּ פירושו ״אוהב״, לא ״רואה״.' }
      - id: present-past
        type: trueFalse
        lang: he
        prompt: '״בּחֵבּ״ (אוהב) הוא פועל בהווה, ו״שֻפְת״ (ראיתי) הוא פועל בעבר.'
        answer: true
        feedback:
          correct: 'נכון! בהווה מדברים על העדפות (בּחֵבּ, בּשֻוף), ובעבר על מה שקרה (שֻפְת, רֻחְת).'
          incorrect: 'זה נכון: בּחֵבּ = אוהב (הווה), שֻפְת = ראיתי (עבר).'
      - id: like-cartoon
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״אני אוהב סרט מצויר.״?'
        options:
