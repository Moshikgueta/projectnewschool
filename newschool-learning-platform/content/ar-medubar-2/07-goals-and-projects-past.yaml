review:
  - >-
    The two workbook exercises ("goals-and-projects-past-verbs" and
    "goals-and-projects-past-sequence") are NEW: the notebook has no self-study
    exercises. They were written only from this cycle's summary, examples and
    vocabulary. An Arabic teacher must check every right answer, every wrong option
    and every transliteration before students see them.
  - >-
    Clear typos fixed: Activity 2, teacher's explanation "בַּאלמָאדִ'יוהאי אלח'טוֶה"
    (two words run together, double space) → "בַּאלמָאדִ'י. והאי אלח'טוֶה"; Activity 2
    frame "האי אלח'טוֶ הי" → "האי אלח'טוֶה הִי"; teacher's letter model "תְתְעַלַּם
    תִכִּי בְּטַלַאקַה" → "תִחְכִּי" (ח missing). Warm-up 2 "ומא זֶבֶּט ! ?" and
    warm-up 5 "…ענדו הַדָף!" now end with "?" (they are questions). Activity 1 says
    "three points" but lists four; the Hebrew now says four.
  - >-
    Not corrected, please decide: the intro list writes "אַנָא כַּתַבֶּת / אִנְתָ
    כַּתַבֶּת" and "הֶני כַּתַבּוּ", but the summary table writes "אַנָא כַּתַבְת / אִנְתַ
    כַּתַבְת" and "הֻם כַּתַבּוּ". The verb "arrive" is written וַצַל / וַצַלְת and also
    תוּצַל / תְוַסַּל (with ס). "Letter" is מַכְתוּב and also מִכְתּוּב (homework part 3).
    "Last year" is "אסַנֶה אלמָאדִ'יֶה" in the summary and "סַנֵה מָאדִיֶה" in the
    vocabulary. "Last week" is "אֶלְאוסַבּוּע אִלְלִי פַאת" and "סַבּוּע אִלְלִי פַאת".
  - >-
    Please check: the summary calls "אַנָא כַּתַבּ אִמְבַּארֶח" "a verb left in the
    present", but כַּתַב is the past "he wrote" (the mistake is the missing ending).
    The Hebrew was kept. Vocabulary "תְעַב – התאמן / עבד קשה": תְעַב usually means "got
    tired"; please confirm the gloss. Homework part 3 starts Mori's Arabic line with
    the Hebrew word "עכשיו"; kept as in the notebook.
  - >-
    Please check the letter in Activity 3: it is written to "me in the future" with
    "you" (תְוַסַּל, הַדַף תַבַּעַכ) but the list of steps is in "I" (אַנָא תְדַרַּבְת…).
    Kept as in the notebook.
  - >-
    Activities 1 and 2 have only their first step in the notebook (choose and write);
    no sharing step was added. Activity 1 and 3 have no time; Activity 2 step 1 is 5
    minutes. The opening (level 2, 90 minutes, grammar focus) is in a teacher note.
  - >-
    Homework: the notebook describes what Mori does in four parts but has no message
    to copy. Each part became one Mori message (in Hebrew, with Mori's opening line
    and questions in Arabic as in the notebook). Please check the wording.
  - >-
    No Quizlet or other link in this cycle. The "36 words" list is the vocabulary;
    the summary sections (past by person, time expressions, time sequence) come from
    the notebook's grammar pages after Activity 3.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: goals-and-projects-past-class
    title: 'שיעור: מטרות ופרויקטים – עבר'
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'מטרות ופרויקטים – עבר'
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: פועל בעבר לפי הגוף
            description: 'אַנָא כַּתַבְת, הוּ כַּתַב, הִי כַּתַבַת, אִחְנַא כַּתַבְנָא, הֻם כַּתַבּוּ – הסיומת מראה מי עשה את הפעולה.'
          - name: ביטויי זמן ורצף זמן
            description: "אִמְבַּארֶח, סַבּוּע אִלְלִי פַאת, קַ'בֵּל שַהְר; אַוַּל שַי, בַּעְדֵין, בַּעְד הֵיך, בִּלְאַחֵר."
      - id: main-idea
        type: callout
        lang: he
        tone: info
        title: הרעיון המרכזי
        text: 'כמו בעברית: *״עשיתי״, ״ניסיתי״, ״הצלחתי״* – גם בערבית מדוברת משתמשים בצורה אחת פשוטה כדי לדבר על מה שכבר קרה.'
      - id: intro-title
        type: heading
        lang: he
        level: 3
        text: סבב היכרות
      - id: intro-how
        type: text
        lang: he
        text: כל תלמיד אומר שלושה משפטים קצרים לפי המבנה.
      - id: intro
        type: sentenceFrame
        frame: |-
          אַנָא אִסְמִי ___.
          הַדַפִי הוּ ___.
          אֶלְאוסַבּוּע אִלְלִי פַאת אַנָא ___.
          אַנָא חַסֵּית ___ לְאַנּוּ ___.
      - id: intro-forms
        type: table
        lang: he
        caption: 'הפועל כַּתַב (כתב) בעבר'
        rows:
          - [אַנָא כַּתַבֶּת, אני כתבתי]
          - [אִנְתָ כַּתַבֶּת, אתה כתבת]
          - [הוּ כַּתַב, הוא כתב]
          - [הִי כַּתַבַת, היא כתבה]
          - [אִחְנַא כַּתַבְנָא, אנחנו כתבנו]
          - [הֶני כַּתַבּוּ, הם כתבו]
      - id: warmup-title
        type: heading
        lang: he
        level: 3
        text: שאלות חימום
      - id: warmup
        type: discussionQuestions
        items:
          - question: "שוּ תְעַלָּמֶת בֶּ אַחֶ'ר עשֶׁר סנין (תַעְלים אקאדימי)?"
          - question: "שׁו אֶלהַדָף אלּי כּאן נֶפְסַכְּ תְחַק'ק'ו ומא זֶבֶּט?"
          - question: 'הַל נְדֶמֶת על מַשׁרוע בַּלָּשֶׁת פי?'
          - question: "שׁו אֶלמשׁרוע אלּי חסּית בֶּלְפַח'ר למּא חק'ק'תו?"
          - question: "שו מומֶכֶּן תֶעטי נס'יחָה ל שַׁחְ'ס' ענדו הַדָף?"
      - id: activities-title
        type: heading
        lang: he
        level: 3
        text: פעילויות
      - id: act1
        type: classActivity
        lang: he
        title: "פעילות 1 – מודל לחיקוי (עבר): ק'ודֶוְתי"
        skills: [פועל בעבר לפי הגוף]
        steps:
          - 'כל אחד בוחר אדם שהוא מעריץ או מעריך: אדם מפורסם או מישהו מהחיים האישיים (אמא, אבא, מורה, חבר, מאמן וכו׳).'
          - 'המטרה: לדבר על אדם אמיתי ולהסביר **מה הוא עשה בעבר** ולמה הוא מהווה השראה בשבילי.'
          - 'שלב 1 – בחירה וכתיבה: כל תלמיד בוחר דמות אחת וכותב ארבע נקודות (בטבלה שלמטה).'
        wordBank:
          - "ק'ודְוֶה (מודל לחיקוי)"
          - "ק'ודֶוְתי (המודל לחיקוי שלי)"
      - id: act1-points
        type: discussionQuestions
        items:
          - question: 'אִסְם (השם): ___'
          - question: 'שוּ בִּשְתַרֶ’ל (מה המקצוע שלו / שלה): ___'
          - question: 'שוּ עַמַל (מה הוא עשה בעבר): ___'
          - question: 'לֵיש הוּ מֻולְהִם (למה הוא מעורר השראה): ___'
      - id: act2
        type: classActivity
        lang: he
        title: 'פעילות 2 – ״הצעד הראשון שעשיתי״ (עבר)'
        skills: [פועל בעבר לפי הגוף]
        minutes: 5
        steps:
          - 'מטרה: לדבר על *פעולה אמיתית* שכבר עשיתם בדרך למטרה שלכם, ולהבין שהתקדמות בנויה מצעדים קטנים.'
          - 'כל תלמיד בוחר **פעולה אחת בעבר** שעזרה לו להתקדם: קורס שנרשם אליו, שיחה שעשה, החלטה שקיבל, פחד שהתגבר עליו, שינוי קטן שעשה בהרגלים.'
          - 'שלב 1 – כתיבה אישית (5 דקות): משלימים את התבנית שלמטה.'
      - id: act2-explain
        type: text
        text: "בִּדִּי תִפַכְּרוּ בּח'טוֶה עמלתוהא בַּאלמָאדִ'י. והאי אלח'טוֶה סַאעַדְתכּוּ תְקַרְּבוּ לְלהדף."
      - id: act2-frame
        type: sentenceFrame
        frame: "האי אלח'טוֶה הִי ___."
      - id: act3
        type: classActivity
        lang: he
        title: 'פעילות 3 – מכתב לעצמי אחרי שהגשמתי את המטרה (עבר)'
        skills: [פועל בעבר לפי הגוף, ביטויי זמן ורצף זמן]
        steps:
          - 'מטרה: לעצור, להסתכל אחורה ולנסח בעבר את הדרך שעשיתם עד שהגעתם למטרה. המכתב מחזק תחושת הישג ומארגן את החוויה בלשון פשוטה וברורה.'
          - 'המורה מסביר (למטה) ונותן מודל קצר.'
          - 'התלמידים כותבים מכתב קצר לפי התבנית.'
      - id: act3-explain
        type: text
        text: '״תַחַיַּל אִנַּכ כִּבַּרְת וְוַסַּלְת לְהַדַף תַבַּעְכ. הַאלְיוֹם אִנְתָ כְּתִב מַכְתוּב לְאַנָא בִּלְמֻסְתַקְבַּל, וּאִחְכִּי לוּ שׁוּ עַמַלְת בַּאלְמָאדִי כִּי תְוַסַּל.״'
      - id: act3-letter
        type: sentenceFrame
        frame: |-
          מַרְחַבָּא אַנָא בִּלְמֻסְתַקְבַּל,
          אַנָא בִּתְמַנָּא תְכּוּן ___.
          הַדַף תַבַּעַכ כָּאן ___.
          הַא-אִשְיַא אִלְלִי עַמַלְתְהָאן כִּי תְוַסַּל:
          אַנָא ___.
          אַנָא ___.
          אַנָא ___.
          כַּמָאן ___.
          מַא ___.
        example: |-
          מַרְחַבָּא אַנָא בִּלְמֻסְתַקְבַּל,
          אַנָא בִּתְמַנָּא תְכּוּן מַבְסוּט וּוָאתִ’ק בִּנַפְסַכ.
          הַדַף תַבַּעַכ כָּאן תְתְעַלַּם תִחְכִּי בְּטַלַאקַה.
          הַא-אִשְיַא אִלְלִי עַמַלְתְהָאן כִּי תְוַסַּל:
          אַנָא תְדַרַּבְת כֻּל סַבּוּע.
          אַנָא שֻפְת וִידְיוֹהַאת וְקַרֵאת.
          אַנָא חַכֵּית מַע נָאס.
          כַּמָאן חַפַזְת כַּלִמַאת גְ’דִידֵה.
          מַא וַקַפְת לַמָּא כָּאן סַעְבּ.
          אַנָא בִּוְתִ’ק פִיכ.
          אַנָא בְּעַרֶף אִנַּכ תְוַסַּל.
          מִן אַנָא הַאלְיוֹם.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: 'רמה 2, 90 דקות. מיקוד דקדוקי: עבר פשוט אחד וברור – פועל בעבר לפי הגוף. רעיון מרכזי לתלמיד: כמו ״עשיתי, ניסיתי, הצלחתי״ בעברית, גם בערבית מדוברת יש צורה אחת פשוטה למה שכבר קרה.'
      - id: n-intro
        anchor: intro
        text: 'כתבו את המבנה על הלוח (בתעתיק), יחד עם הטיות הפועל כַּתַב שלמטה.'
      - id: n-act2
        anchor: act2-explain
        text: 'זה ההסבר שהמורה אומר לכיתה לפני שלב הכתיבה.'
      - id: n-act3
        anchor: act3-letter
        text: 'קראו קודם את המודל הקצר (הדוגמה), ואחר כך התלמידים כותבים את המכתב שלהם.'

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: goals-and-projects-past-summary
    title: סיכום השיעור
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'סיכום השיעור – עבר פשוט ורצף זמן'
      - id: rules-past
        type: ruleSummary
        lang: he
        skill: פועל בעבר לפי הגוף
        rules:
          - text: 'הטיות עבר לפי גופים, עם אותו פועל לדוגמה: **כַּתַב** (כתב). הסיומות הקטנות הן שמראות מי עשה את הפעולה (בטבלה שלמטה).'
          - text: 'טעות נפוצה של דוברי עברית: להשאיר את הפועל בלי סיומת העבר כשיש מילת זמן.'
            examples:
              - '❌ אַנָא כַּתַבּ אִמְבַּארֶח'
              - '✅ אַנָא כַּתַבְת אִמְבַּארֶח'
          - text: 'כמו שלא נאמר בעברית ״אני כותב אתמול״, גם בערבית חייבים להפוך את הפועל לעבר.'
      - id: past-table
        type: table
        lang: he
        caption: 'הטיות עבר: כַּתַב – כתב'
        header: [גוף, דוגמה]
        rows:
          - [אַנָא – אני, אַנָא כַּתַבְת]
          - [אִנְתַ – אתה, אִנְתַ כַּתַבְת]
          - [הוּ – הוא, הוּ כַּתַב]
          - [הִי – היא, הִי כַּתַבַת]
          - [אִחְנַא – אנחנו, אִחְנַא כַּתַבְנָא]
          - [הֻם – הם, הֻם כַּתַבּוּ]
      - id: rules-time
        type: ruleSummary
        lang: he
        skill: ביטויי זמן בעבר
        rules:
          - text: 'כדי להבהיר שמדובר בעבר, משתמשים במילות זמן (בטבלה שלמטה).'
          - text: 'המיקום חופשי, כמו בעברית: ״אתמול כתבתי״ / ״כתבתי אתמול״.'
            examples:
              - 'אִמְבַּארֶח אַנָא כַּתַבְת.'
              - 'אַנָא כַּתַבְת אִמְבַּארֶח.'
      - id: time-table
        type: table
        lang: he
        caption: ביטויי זמן בעבר
        header: [ערבית, עברית]
        rows:
          - [אִמְבַּארֶח, אתמול]
          - [סַבּוּע אִלְלִי פַאת, שבוע שעבר]
          - ["אסַנֶה אלמָאדִ'יֶה", שנה שעברה]
          - ["קַ'בֵּל שַהְר", לפני חודש]
          - [מַרָּה, פעם]
      - id: rules-sequence
        type: ruleSummary
        lang: he
        skill: 'רצף זמן – לספר תהליך'
        rules:
          - text: 'כדי לספר דרך למטרה משתמשים בביטויים קבועים: **אַוַּל שַי** (קודם), **בַּעְדֵין** (אחר כך), **בַּעְד הֵיך** (ואז), **בִּלְאַחֵר** (בסוף).'
          - text: 'דוגמה – בדיוק כמו ״קודם נרשמתי. אחר כך תרגלתי. ואז דיברתי. בסוף הגעתי למטרה.״'
            examples:
              - 'אַוַּל שַי אַנָא תְסַגַּלְת לְדוֹרַה.'
              - 'בַּעְדֵין תְמַרַּנְת כֻּל יוֹם.'
              - 'בַּעְד הֵיך חַכֵּית מַע נָאס.'
              - 'בִּלְאַחֵר וַצַלְת לְהַדַף.'
      - id: learned
        type: callout
        lang: he
        tone: info
        title: הרעיון לקחת איתכם
        text: |-
          כשאני מדבר על משהו שכבר קרה – אני משתמש בפועל בעבר.
          עבר בערבית מדוברת הוא: ✔ פשוט ✔ קבוע ✔ דומה לעברית בהיגיון ✔ תלוי רק בסיומת של הפועל.
          אם זוכרים את הסיומות – אפשר לספר כל סיפור על מטרות ופרויקטים שהגשמנו.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: 'עברו על טבלת הסיומות, ובקשו מכל תלמיד ארבעה משפטים על הדרך למטרה שלו עם אַוַּל שַי, בַּעְדֵין, בַּעְד הֵיך, בִּלְאַחֵר.'

  # ── after class ──────────────────────────────────────────────────────────
  - slug: goals-and-projects-past-homework
    title: שיעורי בית עם מורי
    phase: after_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: שיעורי בית עם מורי
      - id: goal
        type: text
        lang: he
        text: 'מטרה: שמורי יפעיל אתכם בדיבור אמיתי, יאתגר, יתקן בזמן אמת ויעזור לכם לבנות משפטים מלאים בעבר וברצף זמן. פתחו את הצ׳אט עם מורי, העתיקו הודעה ושלחו אותה.'
      - id: rules
        type: callout
        lang: he
        tone: tip
        title: כל התשובות שלכם חייבות להיות
        text: |-
          ✔ בגֻ’מַל כָּאמְלֵה (משפטים מלאים)
          ✔ בעבר
          ✔ ברורות ופשוטות
      - id: part1-title
        type: heading
        lang: he
        level: 3
        text: 'חלק 1 – עבר פשוט: הדרך למטרה'
      - id: mori-part1
        type: aiTutorPrompt
        lang: he
        message: |-
          מורי, אני רוצה לתרגל עבר בערבית מדוברת (בתעתיק עברי). פתח כך:
          "מַרְחַבָּא! אליוֹם רָאח נְחְכִּי עַלַא אַהְדַאפַכ וְעַאמלַכ בִּלְמָאדִי. תְגִ’יב בִּגֻ’מַל כָּאמְלֵה."
          שאל אותי את השאלות האלה אחת-אחת, חכה לתשובה שלי ותקן אותי:
          1. שו כָּאן הַדַפַכ אַחֵר מַרָּה?
          2. שו עַמַלְת כִּדֵי תוּצַל לְהַדַף?
          3. אִמְתָא בַּלַּשְת?
          4. מִין סַאעַדַכ?
          5. שו כָּאן אַקְבַּר תַחַדִּי?
          אחרי כל תשובה: הוסף עבר אם חסר, סדר את סדר המילים, וחזור על המשפט בצורה נכונה, למשל: "אַחְסַן. קוּל: אַנָא בַּלַּשְת בְּיוֹם אֶלְתְּלָאת וְתְמַרַּנְת כֻּל יוֹם."
      - id: part2-title
        type: heading
        lang: he
        level: 3
        text: 'חלק 2 – רצף זמן: הסיפור הקצר'
      - id: mori-part2
        type: aiTutorPrompt
        lang: he
        message: |-
          מורי, תגיד לי: "בדִּי מִנַּכ סִיפּוּר קַצִיר עַלַא טַרִיקַכ לְהַדַף. אַרְבַּע גֻ’מַל."
          אני אספר בעזרת השלד: אַוַּל שַי אַנָא ___. בַּעְדֵין אַנָא ___. בַּעְד הֵיך אַנָא ___. בִּלְאַחֵר אַנָא ___.
          עצור אחרי כל משפט, תקן את העבר ובקש ממני הרחבה: מַע מִין? כֵּיף חַסֵּית? לֵיש הַאדַא כָּאן מֻהִם?
      - id: part2-frame
        type: sentenceFrame
        answerable: false
        frame: |-
          אַוַּל שַי אַנָא ___.
          בַּעְדֵין אַנָא ___.
          בַּעְד הֵיך אַנָא ___.
          בִּלְאַחֵר אַנָא ___.
      - id: part3-title
        type: heading
        lang: he
        level: 3
        text: 'חלק 3 – מכתב קצר לעצמי'
      - id: mori-part3
        type: aiTutorPrompt
        lang: he
        message: |-
          מורי, תגיד לי: "עכשיו תִכְּתֻב מִכְתּוּב קַצִיר לְאַנָא בִּלְמֻסְתַקְבַּל. כֻּלּוּ בִּלְמָאדִי."
          אני אגיד את המכתב לפי השלד שלמטה. תקן כל פועל, בקש ממני להפוך משפטים קצרים למשפטים מלאים, וחזק ניסיונות טובים.
          מַרְחַבָּא אַנָא בִּלְמֻסְתַקְבַּל. הַדַפִי כָּאן ___. אַנָא ___. אַנָא ___. כַּמָאן ___. מַא ___. אַנָא בִּוְתִ’ק פִיכ.
      - id: part3-frame
        type: sentenceFrame
        answerable: false
        frame: |-
          מַרְחַבָּא אַנָא בִּלְמֻסְתַקְבַּל.
          הַדַפִי כָּאן ___.
          אַנָא ___.
          אַנָא ___.
          כַּמָאן ___.
          מַא ___.
          אַנָא בִּוְתִ’ק פִיכ.
      - id: part4-title
        type: heading
        lang: he
        level: 3
        text: 'חלק 4 – אתגר סיום'
      - id: mori-part4
        type: aiTutorPrompt
        lang: he
        message: |-
          מורי, תגיד לי: "תַחַדִּי אַחֵר: גֻ’מְלַת וָאחְדֵה עַלַא מַשְרוּע חַ’לַצְתּוּ."
          אני אגיד משפט אחד בעבר, ברור ומלא, לפי התבנית: "אַנָא כַּמַּלְת מַשְרוּע ___ בְּ___ וְחַסֵּית ___."
          תקן אותי ובקש ממני לחזור על המשפט בדיוק.
      - id: part4-frame
        type: sentenceFrame
        frame: 'אַנָא כַּמַּלְת מַשְרוּע ___ בְּ___ וְחַסֵּית ___.'

