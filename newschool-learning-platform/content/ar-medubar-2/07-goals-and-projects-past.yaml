activities:
  - slug: goals-and-projects-past-verbs
    title: 'פועל בעבר לפי הגוף: כַּתַבְת, כַּתַב, כַּתַבַת'
    minutes: 8
    items:
      - id: persons
        type: matching
        lang: he
        prompt: התאימו כל משפט לפירוש שלו.
        pairs:
          - ['אַנָא כַּתַבְת', 'אני כתבתי']
          - ['הוּ כַּתַב', 'הוא כתב']
          - ['הִי כַּתַבַת', 'היא כתבה']
          - ['אִחְנַא כַּתַבְנָא', 'אנחנו כתבנו']
          - ['הֻם כַּתַבּוּ', 'הם כתבו']
      - id: she-wrote
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״היא כתבה״?'
        options:
          - { text: 'הִי כַּתַבַת', correct: true }
          - { text: 'הִי כַּתַבּוּ', feedback: 'הסיומת וּ (כַּתַבּוּ) היא של ״הם״.' }
          - {
              text: 'הִי כַּתַב',
              feedback: 'כַּתַב בלי סיומת הוא ״הוא כתב״. ל״היא״ מוסיפים את הסיומת ת: כַּתַבַת.',
            }
      - id: yesterday
        type: multipleChoice
        lang: he
        prompt: 'איזה משפט נכון: ״כתבתי אתמול״?'
        options:
          - { text: 'אַנָא כַּתַבְת אִמְבַּארֶח', correct: true }
          - {
              text: 'אַנָא כַּתַבּ אִמְבַּארֶח',
              feedback: 'זו הטעות הנפוצה: עם ״אַנָא״ הפועל בעבר צריך את הסיומת ת – כַּתַבְת.',
            }
          - { text: 'אַנָא כַּתַבְנָא אִמְבַּארֶח', feedback: 'הסיומת נָא היא של ״אנחנו״.' }
      - id: we-wrote
        type: multipleChoice
        lang: he
        prompt: 'השלימו: ״אנחנו כתבנו.״ – אִחְנַא ___'
        options:
          - { text: 'כַּתַבְנָא', correct: true }
          - { text: 'כַּתַבּוּ', feedback: 'כַּתַבּוּ פירושו ״הם כתבו״.' }
          - { text: 'כַּתַבְת', feedback: 'כַּתַבְת פירושו ״כתבתי / כתבת״.' }
      - id: ana-inta
        type: trueFalse
        lang: he
        prompt: 'בטבלה, ״אני כתבתי״ ו״אתה כתבת״ נכתבים באותה צורה: אַנָא כַּתַבְת, אִנְתַ כַּתַבְת.'
        answer: true
        feedback:
          correct: 'נכון! רק מילת הגוף (אַנָא / אִנְתַ) מראה מי עשה את הפעולה.'
          incorrect: 'זה נכון: אַנָא כַּתַבְת, אִנְתַ כַּתַבְת – אותה צורה.'
      - id: verbs
        type: matching
        lang: he
        prompt: התאימו כל פועל בעבר לפירוש שלו.
        pairs:
          - ['בַּלַּש', 'התחיל']
          - ['כַּמַּל', 'סיים']
          - ['נַגַ’ח', 'הצליח']
          - ['חַאוַל', 'ניסה']
          - ['סַאעַד', 'עזר']
      - id: i-finished
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״סיימתי פרויקט״?'
        options:
          - { text: 'אַנָא כַּמַּלְת מַשְרוּע', correct: true }
          - { text: 'הוּ כַּמַּל מַשְרוּע', feedback: 'זה ״הוא סיים פרויקט״.' }
          - { text: 'אַנָא כַּמַּל מַשְרוּע', feedback: 'עם ״אַנָא״ צריך את הסיומת ת: כַּמַּלְת.' }
      - id: order-spoke
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״דיברתי עם אנשים.״'
        sentence: 'אַנָא חַכֵּית מַע נָאס'

  - slug: goals-and-projects-past-sequence
    title: 'ביטויי זמן ורצף זמן: אִמְבַּארֶח, אַוַּל שַי, בִּלְאַחֵר'
    minutes: 8
    items:
      - id: time-words
        type: matching
        lang: he
        prompt: התאימו כל ביטוי זמן לפירוש שלו.
        pairs:
          - ['אִמְבַּארֶח', 'אתמול']
          - ['סַבּוּע אִלְלִי פַאת', 'שבוע שעבר']
          - ["אסַנֶה אלמָאדִ'יֶה", 'שנה שעברה']
          - ["קַ'בֵּל שַהְר", 'לפני חודש']
          - ['מַרָּה', 'פעם']
      - id: sequence-words
        type: matching
        lang: he
        prompt: התאימו כל מילת רצף לפירוש שלה.
        pairs:
          - ['אַוַּל שַי', 'קודם']
          - ['בַּעְדֵין', 'אחר כך']
          - ['בַּעְד הֵיך', 'ואז']
          - ['בִּלְאַחֵר', 'בסוף']
      - id: first
        type: multipleChoice
        lang: he
        prompt: '״קודם נרשמתי לקורס.״ – ___ אַנָא תְסַגַּלְת לְדוֹרַה.'
        options:
          - { text: 'אַוַּל שַי', correct: true }
          - { text: 'בִּלְאַחֵר', feedback: 'בִּלְאַחֵר פירושו ״בסוף״.' }
          - { text: 'בַּעְד הֵיך', feedback: 'בַּעְד הֵיך פירושו ״ואז״.' }
      - id: last
        type: multipleChoice
        lang: he
        prompt: '״בסוף הגעתי למטרה.״ – ___ וַצַלְת לְהַדַף.'
        options:
          - { text: 'בִּלְאַחֵר', correct: true }
          - { text: 'אַוַּל שַי', feedback: 'אַוַּל שַי פירושו ״קודם״.' }
          - { text: 'בַּעְדֵין', feedback: 'בַּעְדֵין פירושו ״אחר כך״.' }
      - id: position
        type: trueFalse
        lang: he
        prompt: 'אפשר לומר גם ״אִמְבַּארֶח אַנָא כַּתַבְת״ וגם ״אַנָא כַּתַבְת אִמְבַּארֶח״.'
        answer: true
        feedback:
          correct: 'נכון! המיקום של מילת הזמן חופשי, כמו ״אתמול כתבתי״ / ״כתבתי אתמול״.'
          incorrect: 'זה נכון: מילת הזמן יכולה לבוא בהתחלה או בסוף.'
      - id: when
        type: multipleChoice
        lang: he
        prompt: '״מתי התחלת?״ – ___ בַּלַּשְת?'
        options:
          - { text: 'אִמְתָא', correct: true }
          - { text: 'מִין', feedback: 'מִין פירושו ״מי״.' }
          - { text: 'לֵיש', feedback: 'לֵיש פירושו ״למה״.' }
      - id: how-felt
        type: multipleChoice
        lang: he
        prompt: 'מה פירוש ״כֵּיף חַסֵּית?״'
        options:
          - { text: 'איך הרגשת?', correct: true }
          - { text: 'עם מי?', feedback: '״עם מי?״ זה מַע מִין?' }
          - { text: 'למה זה היה חשוב?', feedback: '״למה זה היה חשוב?״ זה לֵיש הַאדַא כָּאן מֻהִם?' }
      - id: order-practised
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״אחר כך התאמנתי כל יום.״'
        sentence: 'בַּעְדֵין תְמַרַּנְת כֻּל יוֹם'
