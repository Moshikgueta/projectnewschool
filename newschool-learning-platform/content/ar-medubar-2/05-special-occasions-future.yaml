review:
  - >-
    The two workbook exercises ("special-occasions-future-plans" and
    "special-occasions-future-clauses") are NEW: the notebook has no self-study
    exercises. They were written only from this cycle's summary, examples,
    invitation template and vocabulary. An Arabic teacher must check every right
    answer, every wrong option and every transliteration before students see them.
  - >-
    Clear typos fixed: "מונאסַבּסה" → "מונאסַבֶּה" (warm-up 1) and "אלמונאסבּסה" →
    "אלמונאסַבֶּה" (warm-up 5); "בֶּּדָּכְּ" (double dagesh) → "בֶּדָּכְּ" (warm-up 3);
    "בדّي" (Arabic letters ّي inside the transliteration) → "בִּדִּי" (Mori message 1);
    "כּיף  כּונתו רח תְחְתֶפְלו ??" → "כּיף כּונתו רח תְחְתֶפְלו?" (Activity 3);
    "\\" between masculine / feminine forms → "/"; double spaces removed.
  - >-
    Left out: the broken character "ð" (a lost emoji) after "אַרְג'ו תַאְכּיד אֶלחוד'ור" in
    the invitation template and after "מְוַפָק'ין", and the Arabic-script word
    "موفقين" (the course is written in transliteration only).
  - >-
    Incomplete in the notebook, please complete: Activity 1 starts at "שלב 2" (the
    rules before it were turned into the first step); Activity 2, step 3 says "כל
    קבוצה מציגה 3–4 משפטים:" with no example after it; Activity 3 says "המורה מציג
    על הלוח 4 תמונות של חגיגות שונות, למשל:" with no examples. The teacher must
    choose the 4 pictures.
  - >-
    Mori: the notebook's second message holds two requests ("אסאלני עַן חֻ'וטַתי
    לְלהַדַף אלקָ'רִיב" and "אעטיני גֻ'מל עם אִדָ’א ובַּעְד מַא…"); they were split
    into messages 2 and 3. Message 2 asks about a near GOAL, the topic of the previous
    cycle; please check. Message 3 has the Hebrew words "ואני אכמל" inside the
    Arabic; kept, please decide.
  - >-
    Not corrected, please decide: several words have more than one spelling in the
    cycle: ראח / רַח / רח; אכַלֵּס / אכלֵּס / תֶכֶלַס'; מונאסַבֶּה / מֻנַאסַבֵּה /
    מֻונַאסַבֵּה; חֻדוּר (vocabulary) / חוד'ור (template); צַחָאב / ס'חאב; אִחְתַפַל
    (vocabulary) / אחְתַפֶל (examples); "זְוָאג" (wedding) is written with ג without
    geresh. The workbook uses ראח, אחְתַפֶל and אכלֵּס as in the summary.
  - >-
    Vocabulary glosses kept as in the notebook, please check: "נְדְעִי – להזמין",
    "נַרְקֻץ – לרקוד", "נַאכֻּל – לאכול", "נִשְרַבּ – לשתות", "נַסָאפֵר – לנסוע" are
    first-person plural forms (we will…) glossed as infinitives; "אִחְתַפַל – לחגוג"
    is the past form; "רַאח – עתיד". The summary example "הִי ראח תדְעִי" spells the
    invite verb as in the vocabulary.
  - >-
    Quizlet link: the tracking parameters "?i=…&x=…" were removed. Warm-up 6
    ("כַּמֶּל / י אֶלְג'ומַל!") became a list of sentences to complete.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: special-occasions-future-class
    title: 'שיעור: אירועים מיוחדים – עתיד'
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'אירועים מיוחדים – זמן עתיד בערבית מדוברת'
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: 'תכנון אירועים עם ראח + פועל'
            description: 'אנא ראח אחְתַפֶל, הִי ראח תדְעִי, אלחַפְלֵה ראח תכּוּן בְּ___ – הזמנות ותכנון מסיבה.'
          - name: 'משפטי זמן: אִדָ’א / בַּעְד מַא'
            description: 'אִדָ’א עִנְדִי וַקְת, אנא ראח אחְתַפֶל • בַּעְד מַא אכלֵּס, אנא ראח אחְתַפֶל'
      - id: quizlet
        type: externalLink
        lang: he
        label: אירועים מיוחדים בקוויזלט
        url: https://quizlet.com/il/1143595416/%D7%90%D7%99%D7%A8%D7%95%D7%A2%D7%99%D7%9D-%D7%9E%D7%99%D7%95%D7%97%D7%93%D7%99%D7%9D-%D7%A8%D7%9E%D7%94-2-%D7%A2%D7%A8%D7%91%D7%99%D7%AA-%D7%9E%D7%93%D7%95%D7%91%D7%A8%D7%AA-flash-cards/
      - id: focus
        type: callout
        lang: he
        tone: info
        title: 'רמה A2 (תרגול שיחה) – מיקוד דקדוקי'
        text: |-
          **רַח + פועל** (עתיד אחד ברור). משפטי זמן: **אִדָ’א** (כש / אם) • **בַּעְד מַא** (אחרי ש).
          כמו בעברית: ״אני אחגוג״, ״כשיהיה לי זמן אחגוג״, ״אחרי שאסיים – אחגוג״.
          בערבית מדוברת: **אנא רַח אחְתַפֶל** • **אִדָ’א עִנְדִי וַקְ'ת, אנא רַח אחְתַפֶל** • **בַּעְד מַא אכַלֵּס, אנא ראח אחְתַפֶל.**
      - id: warmup-title
        type: heading
        lang: he
        level: 3
        text: 'שאלות חימום (A2)'
      - id: warmup
        type: discussionQuestions
        items:
          - question: 'כּיף בּתֶסְתַעֶד / י למונאסַבֶּה מוהֶמֶּה?'
          - question: >-
              שו הו אֶלּחַדַת' אללי בּתֶתמַנָּא יס'יר בֶּלְפַתְרָה אֶלְק'ריבֶּה?
          - question: 'לַו בֶּדָּכְּ / בֶּדֶּכְּ תֶעְמַלְ / י מונאסַבֶּה – כיף רַח תכּון וען שו?'
          - question: >-
              אֶד'א ס'אר (לא סַמַחַאללה!) ח'לאפאת ו משׁאכֶּל בּהאי אלמונאסַבֶּה שו כּונֶת רַח תֶעמַל?!
          - question: >-
              שו אֶלחַדַת' או אלמונאסַבֶּה אללי בתֶתְמַנָּא תעישׁו / הא כּמאן מַרָּה!?
      - id: warmup-complete-title
        type: heading
        lang: he
        level: 4
        text: "כַּמֶּל / י אֶלְג'ומַל! – השלימו את המשפטים"
      - id: warmup-complete
        type: discussionQuestions
        items:
          - question: 'אלמונאסַבֶּה רח תכּון ען ___'
          - question: 'רַח אלבַּס ___'
          - question: 'רַח אַעְזֶם ___'
          - question: 'אֶלאַכֶּל רח יכּון ___'
          - question: "אלאג'ואא רח תכּון ___"
          - question: "אֶלמונאסַבֶּה רַח תֶכֶלַס' ___"
      - id: activities-title
        type: heading
        lang: he
        level: 3
        text: פעילויות
      - id: act1
        type: classActivity
        lang: he
        title: 'פעילות 1: הזמנות'
        skills: ['תכנון אירועים עם ראח + פועל']
        steps:
          - 'הכללים על הלוח: כל המשפטים בעתיד עם **ראח**; משפטים קצרים; בלי עבר, בלי הווה.'
          - 'כתיבה אישית: כל תלמיד כותב **שתי הזמנות**: (1) למסיבת יום הולדת; (2) לחתונה או לאירוע מיוחד אחר (סיום לימודים, בר מצווה, חינה, מסיבת הפתעה).'
          - 'כל הזמנה = 4–5 שורות, רק במבנים שעל הלוח. מוסיפים שם, יום ומקום. אפשר להוסיף אמוג׳י או קישוט קטן.'
          - 'קריאה בכיתה: כל תלמיד בוחר **הזמנה אחת** ומקריא אותה בקול.'
          - 'הכיתה מגיבה במשפטים קצרים (למטה).'
      - id: act1-template
        type: sentenceFrame
        frame: |-
          מרחבא ___!
          אנא ראח אחְתַפֶל ___ בְּ___.
          אלחַפְלֵה ראח תכּוּן בְּ___.
          אנא ראח אעְזֶם ___.
          אַרְג'ו תַאְכּיד אֶלחוד'ור.
      - id: act1-reactions-title
        type: heading
        lang: he
        level: 4
        text: תגובות הכיתה
      - id: act1-reactions
        type: examples
        items:
          - { text: 'מברוק!', gloss: 'מזל טוב!' }
          - { text: 'אנא ראח אג’י!', gloss: 'אני אבוא!' }
          - { text: "מְוַפָק'ין!", gloss: 'בהצלחה!' }
          - { text: "אסִף, ס'עֶבְּ אַתְוַאג'ד…", gloss: 'מצטער, קשה לי להגיע…' }
      - id: act2
        type: classActivity
        lang: he
        title: 'פעילות 2: תכנון מסיבה (ראח)'
        skills: ['תכנון אירועים עם ראח + פועל']
        steps:
          - 'המורה מחלק את הכיתה לזוגות או לשלשות. כל קבוצה בוחרת **אירוע אחד**: יום הולדת, חתונה, סיום לימודים, מסיבת הפתעה או חגיגת טיול.'
          - 'המורה אומר: ״עכשיו אתם מארגנים מסיבה. אתם תחליטו איפה היא תהיה, מי יבוא, מה אוכלים ומה עושים. כל המשפטים צריכים להיות בעתיד עם **ראח**.״'
          - 'תכנון בקבוצה: הקבוצה עונה יחד על השאלות שלמטה. כל תשובה מתחילה ב־**ראח** או **אחנא ראח**.'
          - 'הצגה קצרה: כל קבוצה מציגה 3–4 משפטים.'
      - id: act2-questions
        type: discussionQuestions
        items:
          - question: 'וֵין ראח תכּוּן אלחַפְלֵה?'
          - question: 'שו ראח תאַכְּלו ותִשְרַבּו?'
          - question: 'מִין ראח תעְזְמו?'
          - question: "שו אלמוּסִיקַ'א וֶל פַעַאלִיָּאת ראח תכּוּן?"
          - question: 'כֵּיף ראח תזַיְנּו אלמַכָּאן?'
      - id: act3
        type: classActivity
        lang: he
        title: 'פעילות 3: מסורות וחגיגות'
        skills: ['תכנון אירועים עם ראח + פועל', 'משפטי זמן: אִדָ’א / בַּעְד מַא']
        steps:
          - 'המורה מציג על הלוח 4 תמונות של חגיגות שונות.'
          - 'כל תלמיד בוחר שתי תמונות ומדבר על כל אחת: איך הייתם רוצים לחגוג?'
      - id: act3-question
        type: discussionQuestions
        items:
          - question: 'כּיף כּונתו רח תְחְתֶפְלו?'
    teacherNotes:
      - id: n-plan
        anchor: null
        text: 'מטרת השיעור: לתרגל עתיד בערבית מדוברת דרך אירועים אמיתיים – הזמנות, תכנון מסיבה וחגיגות – רק עם המבנה **ראח + פועל**, ולחבר משפטי זמן עם **אִדָ’א / בַּעְד מַא**.'
      - id: n-act1
        anchor: act1
        text: 'מטרה: לתרגל עתיד בצורה טבעית דרך כתיבת הזמנות אמיתיות. התלמידים משתמשים רק במבנה **ראח + פועל** ויוצרים טקסט קצר, ברור ושימושי.'
      - id: n-act2
        anchor: act2
        text: 'מטרה: דיבור חופשי על תכנון עתידי. עברו בין הקבוצות: הזכירו להוסיף **ראח**, עזרו למצוא פעלים פשוטים, ותקנו בקול רך בזמן אמת.'
      - id: n-act3
        anchor: act3
        text: 'מטרה: לדבר על אירועים עתידיים דרך תמונות ולחזק שימוש טבעי ב־**ראח + פועל**. הכינו מראש 4 תמונות של חגיגות שונות (המחברת לא מפרטת אילו).'

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: special-occasions-future-summary
    title: סיכום השיעור
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'סיכום דקדוקי – אירועים מיוחדים, עתיד בערבית מדוברת'
      - id: rules-rah
        type: ruleSummary
        lang: he
        skill: 'ראח + פועל'
        rules:
          - text: 'בשיעור הזה עבדנו עם צורת עתיד אחת ברורה ופשוטה: **ראח + פועל**. בערבית מדוברת אין הבחנה כמו בעברית בין ״אני אחגוג״, ״אני הולך לחגוג״ ו״אני עומד לחגוג״ – כל העתיד מתבטא באותה דרך.'
            examples:
              - 'אנא ראח אחְתַפֶל – אני אחגוג'
              - 'אִדָ’א עִנְדִי וַקְת, אנא ראח אחְתַפֶל – כשיהיה לי זמן, אני אחגוג'
              - 'בַּעְד מַא אכלֵּס, אנא ראח אחְתַפֶל – אחרי שאסיים, אני אחגוג'
          - text: 'המבנה הבסיסי: נושא + ראח + פועל'
            examples:
              - 'אנא ראח אחְתַפֶל – אני אחגוג'
              - 'הו ראח יג’י – הוא יבוא'
              - 'הִי ראח תדְעִי – היא תזמין'
              - 'אחנא ראח נחְתַפֶל – אנחנו נחגוג'
              - 'הֻם ראח יחְתַפֶלו – הם יחגגו'
          - text: 'שימו לב: הפועל עצמו לא ״מתכופף״ לזמן עתיד. העתיד נמצא רק במילה **ראח**, והפועל נשאר בצורה הרגילה שלו לפי הגוף.'
      - id: rules-clauses
        type: ruleSummary
        lang: he
        skill: 'משפטי זמן בעתיד'
        rules:
          - text: 'כמו בעברית, גם בערבית אפשר להתחיל משפט ב״כש…״ או ״אחרי ש…״. משתמשים בשתי מילים מרכזיות:'
            examples:
              - 'אִדָ’א – כש / אם'
              - 'בַּעְד מַא – אחרי ש'
          - text: 'החלק הראשון (״כש…״, ״אחרי ש…״) נשאר בהווה, והעתיד מופיע רק בחלק הראשי עם **ראח** – בדיוק כמו בעברית (״כשיהיה לי זמן – אחגוג״).'
      - id: mistakes
        type: ruleSummary
        lang: he
        skill: 'טעויות נפוצות של דוברי עברית'
        rules:
          - text: '1. לשכוח את ראח: ❌ אנא אחְתַפֶל ✅ **אנא ראח אחְתַפֶל**'
          - text: '2. לשים עתיד גם אחרי ״כש״ או ״אחרי ש״: ❌ אִדָ’א ראח יכון עִנְדִי וַקְת… ✅ **אִדָ’א עִנְדִי וַקְת, אנא ראח…**'
          - text: '3. לנסות ״להטות״ את הפועל לעתיד כמו בעברית: בערבית המדוברת לא משנים את צורת הפועל לעתיד. העתיד יושב רק על **ראח**.'
      - id: main-idea
        type: callout
        lang: he
        tone: tip
        title: הרעיון המרכזי
        text: 'כמו שבעברית אנחנו אומרים ״אחגוג״, בערבית מדוברת תמיד אומרים: **ראח + פועל**. אין עוד צורות עתיד. פשוט, קבוע וברור.'
    teacherNotes:
      - id: n-summary
        anchor: null
        text: 'עברו על שלוש הטעויות הנפוצות ובקשו מכל תלמיד משפט אחד עם אִדָ’א או בַּעְד מַא על אירוע שהוא מתכנן.'

  # ── after class ──────────────────────────────────────────────────────────
  - slug: special-occasions-future-homework
    title: שיעורי בית עם מורי
    phase: after_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'שיעורי בית – עם מוֹרי (בתעתיק)'
      - id: how
        type: text
        lang: he
        text: 'פתחו את הצ׳אט עם מורי, העתיקו הודעה אחת ושלחו אותה. ענו בתעתיק, עם ראח.'
      - id: mori-1
        type: aiTutorPrompt
        message: "מרחבא מוֹרי! בִּדִּי אחְכִי לַכ עַלַא חֻ'טַתי לַאלחַפְלֵאת אלג’איה. סאלני וסַחֶּחני."
      - id: mori-2
        type: aiTutorPrompt
        message: "מוֹרי, אסאלני עַן חֻ'וטַתי לְלהַדַף אלקָ'רִיב."
      - id: mori-3
        type: aiTutorPrompt
        intro: 'דוגמה: אִדָ’א עִנְדִי וַקְת, אנא ראח… / בַּעְד מַא…, אנא ראח…'
        message: "מוֹרי, אעטיני גֻ'מל עם אִדָ’א ובַּעְד מַא ואני אכמל. סַחֵּח לי."
      - id: mori-4
        type: aiTutorPrompt
        message: "מוֹרי, אסאלני עַן מֻונַאסַבֵּה חַ’אסּ'ה רַח אחְתַפֶל פיהַא."

