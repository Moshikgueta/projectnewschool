activities:
  - slug: special-occasions-future-plans
    title: 'תכנון אירועים עם ראח + פועל'
    minutes: 8
    items:
      - id: events
        type: matching
        lang: he
        prompt: התאימו כל מילה לפירוש שלה.
        pairs:
          - ['חַפְלֵה', 'מסיבה']
          - ['עִיד מִילַאד', 'יום הולדת']
          - ['זְוָאג', 'חתונה']
          - ['דַעְוֵה', 'הזמנה']
          - ['דֵיף', 'אורח']
      - id: i-celebrate
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״אני אחגוג״?'
        options:
          - { text: 'אנא ראח אחְתַפֶל', correct: true }
          - { text: 'אנא אחְתַפֶל', feedback: 'זו הטעות הנפוצה: חסרה המילה ראח, שמסמנת את העתיד.' }
          - { text: 'אחנא ראח נחְתַפֶל', feedback: 'אחנא ראח נחְתַפֶל פירושו ״אנחנו נחגוג״.' }
      - id: she-invites
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״היא תזמין״?'
        options:
          - { text: 'הִי ראח תדְעִי', correct: true }
          - { text: 'הו ראח יג’י', feedback: 'הו ראח יג’י פירושו ״הוא יבוא״.' }
          - { text: 'הִי תדְעִי', feedback: 'חסרה המילה ראח, שמסמנת את העתיד.' }
      - id: they-celebrate
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״הם יחגגו״?'
        options:
          - { text: 'הֻם ראח יחְתַפֶלו', correct: true }
          - { text: 'אחנא ראח נחְתַפֶל', feedback: 'זה ״אנחנו נחגוג״.' }
          - { text: 'הֻם יחְתַפֶלו', feedback: 'חסרה המילה ראח, שמסמנת את העתיד.' }
      - id: party-will-be
        type: multipleChoice
        lang: he
        prompt: 'השלימו את ההזמנה (״המסיבה תהיה בבית״): אלחַפְלֵה ראח ___ בְּבֵּית.'
        options:
          - { text: 'תכּוּן', correct: true }
          - { text: 'יכּון', feedback: 'חַפְלֵה היא נקבה, ולכן אומרים תכּוּן, כמו בתבנית ההזמנה.' }
          - { text: 'אחְתַפֶל', feedback: 'אחְתַפֶל פירושו ״אחגוג״. כאן צריך ״תהיה״: תכּוּן.' }
      - id: verb-changes
        type: trueFalse
        lang: he
        prompt: 'בערבית מדוברת משנים את צורת הפועל לעתיד, כמו בעברית.'
        answer: false
        feedback:
          correct: 'נכון! הפועל לא ״מתכופף״ לעתיד. העתיד נמצא רק במילה ראח.'
          incorrect: 'לא כך: הפועל נשאר בצורה הרגילה שלו לפי הגוף, והעתיד נמצא רק במילה ראח.'
      - id: reply
        type: multipleChoice
        lang: he
        prompt: 'קיבלתם הזמנה. איך עונים ״אני אבוא!״?'
        options:
          - { text: 'אנא ראח אג’י!', correct: true }
          - { text: 'מברוק!', feedback: 'מברוק פירושו ״מזל טוב!״.' }
          - { text: "אסִף, ס'עֶבְּ אַתְוַאג'ד", feedback: 'זה ״מצטער, קשה לי להגיע״.' }
      - id: order-where
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים לשאלה: ״איפה תהיה המסיבה?״'
        sentence: 'וֵין ראח תכּוּן אלחַפְלֵה'

  - slug: special-occasions-future-clauses
    title: 'משפטי זמן: אִדָ’א / בַּעְד מַא'
    minutes: 8
    items:
      - id: words
        type: matching
        lang: he
        prompt: התאימו כל מילה לפירוש שלה.
        pairs:
          - ['אִדָ’א', 'כש / אם']
          - ['בַּעְד מַא', 'אחרי ש']
          - ['וַקְת', 'זמן']
          - ['אִימְתָא', 'מתי']
          - ['מֻסְתַקְבַּל', 'עתיד']
      - id: ida
        type: multipleChoice
        lang: he
        prompt: 'מה פירוש ״אִדָ’א״?'
        options:
          - { text: 'כש / אם', correct: true }
          - { text: 'אחרי ש', feedback: '״אחרי ש״ זה בַּעְד מַא.' }
          - { text: 'מתי', feedback: '״מתי״ (בשאלה) זה אִימְתָא.' }
      - id: baad-ma
        type: multipleChoice
        lang: he
        prompt: 'מה פירוש ״בַּעְד מַא״?'
        options:
          - { text: 'אחרי ש', correct: true }
          - { text: 'כש / אם', feedback: '״כש / אם״ זה אִדָ’א.' }
          - { text: 'זמן', feedback: '״זמן״ זה וַקְת.' }
      - id: when-time
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״כשיהיה לי זמן, אני אחגוג״?'
        options:
          - { text: 'אִדָ’א עִנְדִי וַקְת, אנא ראח אחְתַפֶל', correct: true }
          - {
              text: 'אִדָ’א ראח יכון עִנְדִי וַקְת, אנא ראח אחְתַפֶל',
              feedback: 'זו טעות נפוצה: אחרי אִדָ’א לא שמים ראח. החלק הזה נשאר בהווה.',
            }
          - {
              text: 'אִדָ’א עִנְדִי וַקְת, אנא אחְתַפֶל',
              feedback: 'במשפט הראשי חסרה המילה ראח: אנא ראח אחְתַפֶל.',
            }
      - id: after-finish
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״אחרי שאסיים, אני אחגוג״?'
        options:
          - { text: 'בַּעְד מַא אכלֵּס, אנא ראח אחְתַפֶל', correct: true }
          - {
              text: 'אִדָ’א אכלֵּס, אנא ראח אחְתַפֶל',
              feedback: 'אִדָ’א פירושו ״כש / אם״. ל״אחרי ש״ אומרים בַּעְד מַא.',
            }
          - {
              text: 'בַּעְד מַא ראח אכלֵּס, אנא ראח אחְתַפֶל',
              feedback: 'אחרי בַּעְד מַא לא שמים ראח: החלק הזה נשאר בהווה (בַּעְד מַא אכלֵּס).',
            }
      - id: first-part
        type: trueFalse
        lang: he
        prompt: 'החלק שמתחיל ב־אִדָ’א או ב־בַּעְד מַא נשאר בהווה, והעתיד (ראח) בא רק בחלק הראשי.'
        answer: true
        feedback:
          correct: 'נכון! אִדָ’א עִנְדִי וַקְת, אנא ראח אחְתַפֶל.'
          incorrect: 'זה נכון: החלק הראשון נשאר בהווה, ו־ראח בא רק בחלק הראשי – אִדָ’א עִנְדִי וַקְת, אנא ראח אחְתַפֶל.'
      - id: wrong-sentence
        type: trueFalse
        lang: he
        prompt: 'המשפט ״אִדָ’א ראח יכון עִנְדִי וַקְת, אנא ראח אחְתַפֶל״ נכון.'
        answer: false
        feedback:
          correct: 'נכון, הוא לא נכון! אחרי אִדָ’א לא שמים עתיד: אִדָ’א עִנְדִי וַקְת, אנא ראח אחְתַפֶל.'
          incorrect: 'המשפט לא נכון: אחרי אִדָ’א לא שמים עתיד. אומרים: אִדָ’א עִנְדִי וַקְת, אנא ראח אחְתַפֶל.'
      - id: order-after
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״אחרי שאסיים, אני אחגוג.״'
        sentence: 'בַּעְד מַא אכלֵּס, אנא ראח אחְתַפֶל'
