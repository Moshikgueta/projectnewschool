        text: פתחו את הצ׳אט עם מורי, העתיקו כל הודעה ושלחו אותה.
      - id: mori-1
        type: aiTutorPrompt
        lang: he
        title: 'משימה 1: אתמול'
        message: 'מורי, תשאל אותי 8 שאלות על אתמול בערבית מדוברת בתעתיק. אני חייב לענות במשפט מלא. לפחות 4 מהתשובות שלי צריכות להיות בשלילה עם "מא + עבר". אם אני משתמש בהווה, תעצור ותתקן אותי.'
      - id: mori-2
        type: aiTutorPrompt
        lang: he
        title: 'משימה 2: כן או לא?'
        message: 'מורי, תן לי כל פעם פעולה אחת בעבר. תשאל אם עשיתי אותה אתמול. אני אענה או בחיוב או בשלילה. תוודא שבשלילה אני משתמש ב"מא + פועל בעבר".'
      - id: mori-3
        type: aiTutorPrompt
        lang: he
        title: 'משימה 3: היום של בן אדם אחר'
        message: 'מורי, תן לי דמות דמיונית וספר לי 5 דברים שהיא עשתה אתמול ו-3 דברים שהיא לא עשתה. אחר כך תשאל אותי שאלות עליה, ואני אענה בגוף שלישי.'
      - id: mori-3-example-title
        type: heading
        lang: he
        level: 4
        text: לדוגמה
      - id: mori-3-example
        type: sentenceFrame
        answerable: false
        frame: |-
          הִי מַא רַחַת עַאלְשֻעְ'ל.
          הִי מַא טַבַּחַת.

