activities:
  - slug: what-i-didnt-do-negation
    title: 'שלילה בעבר: מַא + עבר'
    minutes: 8
    items:
      - id: negatives
        type: matching
        lang: he
        prompt: התאימו כל משפט שלילי לפירוש שלו.
        pairs:
          - ['מַא רַחְת', 'לא הלכתי']
          - ['מַא שֻפְת', 'לא ראיתי']
          - ['מַא אַכַּלְת', 'לא אכלתי']
          - ['מַא חַכֵּית', 'לא דיברתי']
          - ['מַא סַאפַרְת', 'לא נסעתי']
      - id: didnt-go
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״אתמול לא הלכתי״?'
        options:
          - { text: 'מַא רַחְת אִמְבַּארֶח', correct: true }
          - {
              text: 'מַא בְּרוּח אִמְבַּארֶח',
              feedback: 'הפועל נשאר בעבר: מַא רַחְת, לא מַא בְּרוּח.',
            }
          - {
              text: 'רַחְת אִמְבַּארֶח',
              feedback: 'זה ״אתמול הלכתי״. לשלילה מוסיפים מַא לפני הפועל.',
            }
      - id: stays-past
        type: trueFalse
        lang: he
        prompt: 'בשלילה בעבר הופכים את הפועל להווה: מַא + פועל בהווה.'
        answer: false
        feedback:
          correct: 'נכון! הפועל נשאר בעבר: מַא רַחְת.'
          incorrect: 'הפועל נשאר בעבר: מַא + פועל בעבר (מַא רַחְת).'
      - id: coffee
        type: multipleChoice
        lang: he
        prompt: 'שְרִבְּת קַהְוֶה = שתיתי קפה. איך אומרים: ״לא שתיתי קפה״?'
        options:
          - { text: 'מַא שְרִבְּת קַהְוֶה', correct: true }
          - { text: 'שְרִבְּת מַא קַהְוֶה', feedback: 'מַא בא לפני הפועל: מַא שְרִבְּת.' }
          - {
              text: 'לַא שְרִבְּת קַהְוֶה',
              feedback: 'לַא היא התשובה ״לא״. את הפועל שוללים עם מַא: מַא שְרִבְּת.',
            }
      - id: studied
        type: multipleChoice
        lang: he
        prompt: 'מה פירוש ״מַא דַרַסְת״?'
        options:
          - { text: 'לא למדתי', correct: true }
          - { text: 'למדתי', feedback: '״למדתי״ זה דַרַסְת, בלי מַא.' }
          - { text: 'לא נסעתי', feedback: '״לא נסעתי״ זה מַא סַאפַרְת.' }
      - id: cook
        type: multipleChoice
        lang: he
        prompt: 'השלימו: אִמְבַּארֶח ___ טַבַּחְת. (אתמול לא בישלתי.)'
        options:
          - { text: 'מַא', correct: true }
          - { text: 'לַא', feedback: 'לַא היא התשובה ״לא״. לפני פועל בעבר שמים מַא.' }
          - { text: 'בַּס', feedback: 'בַּס פירושו ״אבל״.' }
      - id: bought
        type: multipleChoice
        lang: he
        prompt: 'איזה משפט אומר ״לא קניתי״?'
        options:
          - { text: 'מַא אִשְתַרֵית', correct: true }
          - { text: 'אִשְתַרֵית', feedback: 'זה ״קניתי״. לשלילה מוסיפים מַא.' }
          - { text: 'מַא סַאפַרְת', feedback: 'מַא סַאפַרְת פירושו ״לא נסעתי״.' }
      - id: order-film
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״אתמול לא ראיתי סרט.״'
        sentence: 'אִמְבַּארֶח מַא שֻפְת פִילֶם'

  - slug: what-i-didnt-do-questions
    title: 'שאלות, תשובות ודיווח בשלילה'
    minutes: 8
    items:
      - id: answer-no
        type: multipleChoice
        lang: he
        prompt: '״שֻפְת פִילֶם אִמְבַּארֶח?״ – ענו ״לא״ במשפט מלא.'
        options:
          - { text: 'לַא, מַא שֻפְת פִילֶם.', correct: true }
          - { text: 'לַא.', feedback: 'עונים במשפט מלא: לַא, מַא שֻפְת פִילֶם.' }
          - { text: 'לַא, שֻפְת פִילֶם.', feedback: 'חסרה מַא: בלי מַא המשפט אומר ״ראיתי סרט״.' }
      - id: answer-yes
