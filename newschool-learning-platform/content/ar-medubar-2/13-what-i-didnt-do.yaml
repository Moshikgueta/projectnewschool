          - 'אחר כך כל תלמיד מקריא.'
          - 'שאר הכיתה יכולה לשאול שאלה אחת: ״לֵיש?״ או ״שׁו עַמֵלְת בַּדַל הַאד?״'
      - id: act5-sentences
        type: discussionQuestions
        items:
          - question: 'אִמְבַּארֶח מַא ___.'
          - question: 'הַאד אלאוּסְבּוּע מַא ___.'
          - question: "אַחֶ'ר נִהַאיֶת אוּסְבּוּע מַא ___."
    teacherNotes:
      - id: n-plan
        anchor: null
        text: 'מיקוד דקדוקי: שלילה בעבר בלבד. מבנה מרכזי: מַא + פועל בעבר. משך: 90 דקות.'
      - id: n-opening
        anchor: opening-title
        minutes: 8
        text: 'כתבו על הלוח את שתי התבניות, תנו שתי דוגמאות על עצמכם ושאלו ״שו אלפַרֶק?״. המטרה היא שהתלמידים יגלו לבד ש־מַא הופכת את המשפט לשלילי.'
      - id: n-warmup
        anchor: warmup-title
        minutes: 15
        text: 'שאלו בערבית בלבד ככל האפשר. אם תלמיד עונה רק ״לא״, החזירו אותו למשפט מלא.'
      - id: n-grammar
        anchor: grammar-title
        minutes: 10
        text: הסבירו את הכלל עם הטבלה, והדגישו שהפועל נשאר בעבר.
      - id: n-act1
        anchor: act1
        minutes: 12
        text: 'המטרה: להפוך את מַא + עבר לאוטומטי. שמרו על קצב מהיר.'
      - id: n-breakout
        anchor: breakout
        minutes: 20
        text: 'שלחו לחדרים את ההודעה ״הַלַּק בַּדְּלוּ אלאדְוַאר!״ אחרי 8 דקות. כלל הפעילות על המסך הופך אותה למדידה ולא רק ״תדברו קצת״. בשלב 5 התלמידים משתמשים גם בגוף שלישי, בלי לפתוח נושא דקדוקי חדש.'
      - id: n-act4
        anchor: act4
        minutes: 10
        text: ככה מכניסים גם גוף שלישי בלי ללמד נושא חדש.
      - id: n-act5
        anchor: act5
        minutes: 8
        text: המוקד עדיין נשאר בשלילה בעבר.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: what-i-didnt-do-summary
    title: סיכום השיעור
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'סיכום דקדוקי – מה למדנו?'
      - id: rules
        type: ruleSummary
        lang: he
        skill: 'מַא + עבר'
        rules:
          - text: 'כדי לומר שפעולה קרתה בעבר: **פועל בעבר**.'
            examples: ['רַחְת.']
          - text: 'כדי לומר שהיא לא קרתה: **מַא + פועל בעבר**.'
            examples: ['מַא רַחְת.']
          - text: 'נוסחה אחת בלבד: **מַא + עבר**. זה כל המיקוד הדקדוקי של השיעור.'
      - id: summary-examples
        type: table
        lang: he
        caption: דוגמאות
        header: [חיובי, שלילי, עברית]
        rows:
          - [שֻפְת, מַא שֻפְת, 'ראיתי / לא ראיתי']
          - [אַכַּלְת, מַא אַכַּלְת, 'אכלתי / לא אכלתי']
          - [חַכֵּית, מַא חַכֵּית, 'דיברתי / לא דיברתי']
          - [סַאפַרְת, מַא סַאפַרְת, 'נסעתי / לא נסעתי']
      - id: persons-title
        type: heading
        lang: he
        level: 3
        text: תרגול לפי גופים
      - id: persons-intro
        type: text
        lang: he
        text: 'אתם כבר מכירים את העבר לפי גוף, לכן רק הופכים אותו לשלילי.'
      - id: persons
        type: examples
        items:
          - { text: 'אַנַא מַא כַּתַבְּת.', gloss: 'אני לא כתבתי.' }
          - { text: 'אִנְת מַא כַּתַבְּת.', gloss: 'אתה לא כתבת.' }
          - { text: 'הו מַא כַּתַב.', gloss: 'הוא לא כתב.' }
          - { text: 'הִי מַא כַּתַבַּת.', gloss: 'היא לא כתבה.' }
          - { text: 'אִחְנַא מַא כַּתַבְּנַא.', gloss: 'אנחנו לא כתבנו.' }
          - { text: 'הֻם מַא כַּתַבּוּ.', gloss: 'הם לא כתבו.' }
      - id: persons-rule
        type: callout
        lang: he
        tone: info
        text: '**מַא לא משתנה. הפועל משתנה לפי הגוף בדיוק כמו בעבר החיובי.**'
    teacherNotes:
      - id: n-summary
        anchor: null
        text: 'בקשו מכל תלמיד משפט שלילי אחד על עצמו ומשפט שלילי אחד על חבר לכיתה (גוף שלישי).'

