            frame: |-
              שַׁרִיכִי כַּאן בִּדֹו יְרוּח עַאלבַּחֶר, בַּס מַא רַאח.
              שַׁרִיכְתִי כַּאנֶת בִּדְהַא תְשׁוּף פִילֶם, בַּס מַא שַׁאפַת.
      - id: act4
        type: classActivity
        lang: he
        title: 'פעילות 4: מי בכיתה לא...?'
        skills: ['שאלות, תשובות ודיווח בשלילה']
        minutes: 10
        steps:
          - 'המורה שואל שאלה (למשל ״מִין מַא שְרִב קַהְוֶה אִלְיוֹם?״).'
          - 'מי שלא עשה את הפעולה מרים יד.'
          - 'תלמיד אחר אומר משפט בגוף שלישי על מי שהרים יד.'
        example: |-
          מִין מַא שְרִב קַהְוֶה אִלְיוֹם?
          דַנִי מַא שְרִב קַהְוֶה אִלְיוֹם.
