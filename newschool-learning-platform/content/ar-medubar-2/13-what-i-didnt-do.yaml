# Cycle "מה לא עשיתי", converted from the spoken Arabic level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (spoken Arabic in Hebrew
# transliteration, apc-Hebr); Hebrew instructions carry `lang: he`.
course: ar-medubar-2
slug: what-i-didnt-do
title: מה לא עשיתי
goal: 'לומר מה לא עשיתי בעבר עם מַא + פועל בעבר, ולשאול, לענות ולספר על אחרים בשלילה בעבר.'
position: 13
status: in_review

review:
  - >-
    The two workbook exercises ("what-i-didnt-do-negation" and
    "what-i-didnt-do-questions") are NEW: the notebook has no self-study exercises.
    They were written only from this cycle's grammar explanation, base table,
    summary and examples. An Arabic teacher must check every right answer, every
    wrong option and every transliteration before students see them.
  - >-
    The notebook has NO vocabulary list for this cycle and no Quizlet link. The
    vocabulary section was built from the base table (10 verbs, with their Hebrew
    meanings from the explanation and the Activity 2 list), "כַּתַבְּת" from the
    person table, and the time words and connectors used in the activities. These
    glosses were added by the converter, please check: כַּנְת בִּדִּי = רציתי,
    בַּס = אבל, בַּדַל הַאד = במקום זה, אִשְתַרֵית = קניתי, אַיוַה = כן,
    הַאד אלאוּסְבּוּע = השבוע, אִלְיוֹם = היום, טַבַּחְת = בישלתי.
  - >-
    The two skills were taken from the lesson goals: (1) negation in the past with
    מַא + past verb; (2) asking and answering yes / no about the past, plans that did
    not happen (כַּנְת בִּדִּי…, בַּס מַא…) and negation in other persons.
  - >-
    Not corrected, please decide: the 3rd person masculine of "went" is written
    "מַא רַח" in Activity 4 ("מִין מַא רַח עַאלְשֻעְ'ל?") but "מַא רַאח" in the breakout
    room report; the feminine in the Mori homework is "הִי מַא רַחַת". "הו" (person table)
    / "הוּ" elsewhere. "מִתְ'ל" (breakout title) is written with a geresh, unlike
    "מִתְל" in earlier cycles. The workbook avoids these forms.
  - >-
    Changed: the explanation line "מא רוחת" (breakout model) was written as "מַא רַחְת"
    to match the rest of the cycle. The author's notes "ואני הייתי קורא לפעילות בתוך
    המחברת:" (an unfinished sentence) and "כך אתה גם מכניס גוף שלישי…" were removed
    from the student view; the second is now a teacher note.
  - >-
    Times: the notebook adds up to about 113 minutes (8 + 15 + 10 + 12 + 15 + 15 +
    20 + 10 + 8) for a 90-minute lesson. The breakout activity "18–20 minutes" was
    recorded as 20. Please decide what to shorten; nothing was removed. The
    breakout activity has no number in the notebook (it comes between Activities 3
    and 4); the numbering was kept.
  - >-
    The notebook's last Mori task (task 3) ends with two example sentences
    ("הִי מַא רַחַת עַאלְשֻעְ'ל." / "הִי מַא טַבַּחַת."), the second with an unclosed
    bold mark; they were kept as an example under the message. The Mori messages are
    written in Hebrew, so they have lang he.
  - >-
    Hebrew translations under the Arabic examples (opening, explanation, summary,
    person table) were kept as glosses in examples blocks or tables. The Activity 2
    and Activity 3 lists are in Hebrew in the notebook and stay in Hebrew.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: what-i-didnt-do-class
    title: 'שיעור: מה לא עשיתי'
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'מה לא עשיתי? – שלילה בעבר בערבית מדוברת'
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: שלילה בעבר
            description: 'מַא + פועל בעבר: מַא רַחְת, מַא שֻפְת, מַא אַכַּלְת. הפועל נשאר בעבר.'
          - name: שאלות, תשובות ודיווח בשלילה
            description: 'לענות אַיוַה / לַא במשפט מלא, לספר על תכנית שלא קרתה (כַּנְת בִּדִּי…, בַּס מַא…), ולהשתמש בשלילה בכמה גופים.'
      - id: goals
        type: callout
        lang: he
        tone: info
        title: מטרות השיעור
        text: |-
          בסוף השיעור תוכלו:
          ✔ לומר מה עשיתם ומה לא עשיתם
          ✔ לענות בשלילה על שאלות בעבר
          ✔ לשאול שאלות על פעולות שלא קרו
          ✔ להשתמש בשלילה בעבר בכמה גופים
          ✔ לספר בקצרה על יום או סוף שבוע דרך דברים שקרו ולא קרו
          ✔ להגיב לדברים שתלמיד אחר לא עשה
      - id: opening-title
        type: heading
        lang: he
        level: 3
        text: פתיחה
      - id: opening-frame
        type: sentenceFrame
        answerable: false
        frame: |-
          אִמְבַּארֶח אַנַא ___.
          אִמְבַּארֶח אַנַא מַא ___.
      - id: opening-examples
        type: examples
        items:
          - { text: 'אִמְבַּארֶח שְרִבְּת קַהְוֶה.', gloss: 'אתמול שתיתי קפה.' }
          - { text: 'אִמְבַּארֶח מַא שֻפְת פִילֶם.', gloss: 'אתמול לא ראיתי סרט.' }
      - id: opening-question
        type: sentenceFrame
        answerable: false
        frame: 'שו אלפַרֶק?'
      - id: round-title
        type: heading
        lang: he
        level: 4
        text: סבב קצר
      - id: round-how
        type: text
        lang: he
        text: 'כל תלמיד אומר משפט אחד חיובי ומשפט אחד שלילי.'
      - id: round
        type: sentenceFrame
        frame: |-
          אִמְבַּארֶח ___.
          אִמְבַּארֶח מַא ___.
        example: |-
          אִמְבַּארֶח רַחְת עַאלְשֻעְ'ל.
          מַא טַבַּחְת.
      - id: warmup-title
        type: heading
        lang: he
        level: 3
        text: שאלות חימום
      - id: warmup
        type: discussionQuestions
        items:
          - question: 'שׁו עַמֵלְת אִמְבַּארֶח?'
          - question: 'שׁו מַא עַמֵלְת אִמְבַּארֶח?'
          - question: 'מַא שֻפְת פִילֶם אִמְבַּארֶח?'
          - question: 'מַא רַחְת עַלַא מַטְעַם הַאד אלאוּסְבּוּע?'
          - question: 'מַא אַכַּלְת בַּרַּא אִמְבַּארֶח?'
          - question: 'מַא חַכֵּית מַע צְחַאבַּכ אִמְבַּארֶח?'
          - question: 'מַא דַרַסְת אִמְבַּארֶח?'
          - question: 'מַא אִלְתַקֵית מַע חַד הַאד אלאוּסְבּוּע?'
          - question: 'מַא שְרִבְּת קַהְוֶה אִלְיוֹם אַלְסֻבְּח?'
          - question: 'מַא נִמְת מְנִיח אִמְבַּארֶח?'
      - id: warmup-rule
        type: callout
        lang: he
        tone: tip
        title: עונים במשפט מלא
        text: 'אם עונים רק ״לא״, חוזרים למשפט מלא: **מַא רַחְת.** / **מַא שֻפְת.** / **מַא אַכַּלְת.**'
      - id: grammar-title
        type: heading
        lang: he
        level: 3
        text: 'הסבר דקדוקי: שלילה בעבר'
      - id: grammar
        type: ruleSummary
        lang: he
        skill: 'שלילה בעבר: מַא + פועל בעבר'
        rules:
          - text: 'בערבית מדוברת, כשאנחנו רוצים להגיד שפעולה **לא קרתה**, בדרך כלל שמים **מַא + פועל בעבר**.'
            examples:
              - 'רַחְת – הלכתי / מַא רַחְת – לא הלכתי'
              - 'שֻפְת – ראיתי / מַא שֻפְת – לא ראיתי'
              - 'אַכַּלְת – אכלתי / מַא אַכַּלְת – לא אכלתי'
          - text: '**חשוב:** הפועל **נשאר בעבר**. אנחנו לא משנים אותו להווה.'
            examples:
              - '❌ מַא בְּרוּח אִמְבַּארֶח'
              - '✅ מַא רַחְת אִמְבַּארֶח'
          - text: 'בדיוק כמו שבעברית לא אומרים ״אתמול אני לא הולך״, אלא ״אתמול לא הלכתי״.'
      - id: base-table
        type: table
        lang: he
        caption: טבלת בסיס
        header: [חיובי, שלילי]
        rows:
          - [עַמֵלְת, מַא עַמֵלְת]
          - [רַחְת, מַא רַחְת]
          - [אַכַּלְת, מַא אַכַּלְת]
          - [שְרִבְּת, מַא שְרִבְּת]
          - [שֻפְת, מַא שֻפְת]
          - [חַכֵּית, מַא חַכֵּית]
          - [דַרַסְת, מַא דַרַסְת]
          - [אִשְתַרֵית, מַא אִשְתַרֵית]
          - [נִמְת, מַא נִמְת]
          - [סַאפַרְת, מַא סַאפַרְת]
      - id: activities-title
        type: heading
        lang: he
        level: 3
        text: פעילויות
      - id: act1
        type: classActivity
        lang: he
        title: 'פעילות 1: כן עשיתי / לא עשיתי'
        skills: [שלילה בעבר, 'שאלות, תשובות ודיווח בשלילה']
        minutes: 12
        steps:
          - 'המורה אומר פעולה.'
          - 'התלמיד עונה מיד במשפט חיובי או שלילי אמיתי.'
          - 'המורה ממשיך בקצב מהיר עם השאלות שלמטה.'
        example: |-
          שֻפְת פִילֶם אִמְבַּארֶח?
          אַיוַה, שֻפְת פִילֶם.
          לַא, מַא שֻפְת פִילֶם.
      - id: act1-questions
        type: discussionQuestions
        answerable: false
        items:
          - question: "רַחְת עַאלְשֻעְ'ל?"
          - question: 'אַכַּלְת פִיצַה?'
          - question: 'חַכֵּית מַע אִמַּכ?'
          - question: 'שְרִבְּת קַהְוֶה?'
          - question: 'דַרַסְת עַרַבִּי?'
          - question: 'אִשְתַרֵית אִשִי?'
          - question: 'נִמְת תַמַאן סַאעַאת?'
          - question: 'טַבַּחְת?'
          - question: 'סַאפַרְת הַאד אלשַּהֶר?'
      - id: act2
        type: classActivity
        lang: he
        title: 'פעילות 2: יום מוזר'
        skills: [שלילה בעבר]
        minutes: 15
        steps:
          - 'כל תלמיד מקבל רשימה של 8 פעולות (למשל: שתיתי קפה, הלכתי לעבודה, אכלתי ארוחת בוקר, דיברתי עם חבר, עשיתי ספורט, ראיתי טלוויזיה, בישלתי, למדתי ערבית).'
          - 'התלמיד מסמן ליד כל פעולה: ✔ עשיתי / ✘ לא עשיתי.'
          - 'אחר כך הוא מספר בערבית מה עשה ומה לא עשה (ראו דוגמה).'
          - 'עבודה בזוגות: A מספר, ו־B מזהה מה לא קרה ואומר את זה.'
        example: |-
          אִמְבַּארֶח שְרִבְּת קַהְוֶה.
          רַחְת עַאלְשֻעְ'ל.
          בַּס מַא עַמֵלְת רִיאַדַה.
          מַא שֻפְת טִלְפִזְיוֹן.
          וּמַא טַבַּחְת.
      - id: act2-pairs
        type: sentenceFrame
        answerable: false
        frame: 'אַה, אִנְת מַא ___ וּמַא ___.'
        example: 'אַה, אִנְת מַא טַבַּחְת וּמַא שֻפְת טִלְפִזְיוֹן.'
      - id: act3
        type: classActivity
        lang: he
        title: 'פעילות 3: חקירה'
        skills: ['שאלות, תשובות ודיווח בשלילה']
        minutes: 15
        steps:
          - 'המורה אומר: ״קרה משהו אתמול. אתם החוקרים.״'
          - 'תלמיד A מקבל כרטיס עם דברים שעשה ולא עשה (ראו דוגמה בטבלה).'
          - 'תלמיד B שואל שאלות כדי לגלות מה קרה, ו־A עונה אַיוַה / לַא במשפט מלא.'
          - 'אחרי 4 דקות מחליפים תפקידים.'
      - id: act3-card
        type: table
        lang: he
        caption: דוגמה לכרטיס
        header: [עשה, לא עשה]
        rows:
          - [הלך למסעדה, לא שתה קפה]
          - [פגש חבר, לא נסע במונית]
          - [אכל המבורגר, לא חזר הביתה מוקדם]
      - id: act3-questions
        type: discussionQuestions
        answerable: false
        items:
          - question: 'רַחְת עַלַא מַטְעַם?'
            frame: 'אַיוַה, רַחְת. / לַא, מַא רַחְת.'
          - question: 'אִלְתַקֵית מַע חַד?'
          - question: 'שְרִבְּת קַהְוֶה?'
          - question: 'רַכֶּבְת טַקְסִי?'
          - question: 'אַכַּלְת הַמְבּוּרְגֶר?'
      - id: breakout
        type: classActivity
        lang: he
        title: "פעילות בחדרים (Breakout Rooms): מַא צַאר מִתְ'ל מַא כַּנַּא מְחַ'טְּטִין"
        skills: [שלילה בעבר, 'שאלות, תשובות ודיווח בשלילה']
        minutes: 20
        steps:
          - 'מטרה: לדבר על תוכניות מהעבר שלא יצאו לפועל, תוך שימוש קבוע ב־מַא + פועל בעבר. מיומנויות: שאילת שאלות בעבר, שלילה בעבר, שאלות המשך, הסבר קצר של מה השתבש, דיווח על בן הזוג בגוף שלישי.'
          - 'שלב 1 – הכנה בכיתה (3 דקות): המורה מציג את המבנה ״כַּנְת בִּדִּי ___, בַּס מַא ___.״ ומדגיש: לא מדברים על העתיד, רק על תכנית שהייתה בעבר ולא קרתה.'
          - 'שלב 2 – שאלות חובה בחדר (8 דקות לכל סבב): תלמיד A שואל את תלמיד B לפחות 5 שאלות מתוך הרשימה. לא צריך לשאול את כולן.'
          - 'שלב 3 – שאלות המשך חובה: אחרי כל תשובה, בן הזוג שואל לפחות שאלה אחת נוספת, כדי שהשיחה לא תיעצר אחרי משפט אחד.'
          - 'שלב 4 – החלפת תפקידים: אחרי 8 דקות A הופך ל־B ו־B הופך ל־A.'
          - 'שלב 5 – משימת דיווח (5 דקות בכיתה הראשית): כל תלמיד זוכר דבר אחד מעניין על בן הזוג ומספר עליו בגוף שלישי.'
          - 'כלל הפעילות: כל תלמיד מייצר לפחות 3 משפטים עם מַא + עבר, 2 משפטים עם כַּנְת בִּדִּי… בַּס מַא…, ו־3 שאלות המשך.'
      - id: breakout-frame-title
        type: heading
        lang: he
        level: 4
        text: 'שלב 1 – המבנה'
      - id: breakout-frame
        type: sentenceFrame
        frame: 'כַּנְת בִּדִּי ___, בַּס מַא ___.'
        example: |-
          כַּנְת בִּדִּי אַרוּח עַאלבַּחֶר, בַּס מַא רַחְת.
          כַּנְת בִּדִּי אַשׁוּף פִילֶם, בַּס מַא שֻפְת.
          כַּנְת בִּדִּי אַלְתַקִי מַע צַאחְבִּי, בַּס מַא אִלְתַקֵית מַעו.
      - id: breakout-questions-title
        type: heading
        lang: he
        level: 4
        text: 'שלב 2 – שאלות חובה (בוחרים 5)'
      - id: breakout-questions
        type: discussionQuestions
        items:
          - question: 'שׁו כַּנְת בִּדַּכ תַעְמַל וּמַא עַמֵלְת?'
          - question: 'וֵין כַּנְת בִּדַּכ תְרוּח וּמַא רַחְת?'
          - question: 'מַע מִין כַּנְת בִּדַּכ תִלְתַקִי וּמַא אִלְתַקֵית?'
          - question: 'שׁו כַּנְת בִּדַּכ תֹאכֹּל וּמַא אַכַּלְת?'
          - question: 'שׁו כַּנְת בִּדַּכ תִשׁוּף וּמַא שֻפְת?'
          - question: 'פִי מוּנַאסַבֶּה כַּנְת בִּדַּכ תְרוּח עַלֵיהַא וּמַא רַחְת?'
          - question: 'פִי אִשִי כַּנְת בִּדַּכ תִשְתַרִי וּמַא אִשְתַרֵית?'
          - question: 'פִי אִשִי כַּנְת בִּדַּכ תִדְרוּס וּמַא דַרַסְת?'
      - id: breakout-followup-title
        type: heading
        lang: he
        level: 4
        text: 'שלב 3 – שאלות המשך'
      - id: breakout-followup
        type: examples
        items:
          - { text: 'לֵיש מַא ___?', gloss: 'למה לא ___?' }
          - { text: 'שׁו צַאר?', gloss: 'מה קרה?' }
