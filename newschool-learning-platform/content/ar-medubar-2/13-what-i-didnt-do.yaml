          - question: "מִין מַא רַח עַאלְשֻעְ'ל?"
          - question: 'מִין מַא שַׁאף טִלְפִזְיוֹן אִמְבַּארֶח?'
          - question: 'מִין מַא דַרַס הַאד אלאוּסְבּוּע?'
      - id: act5
