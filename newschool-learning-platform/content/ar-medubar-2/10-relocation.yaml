# Cycle "רילוקיישן", converted from the spoken Arabic level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (spoken Arabic in Hebrew
# transliteration, apc-Hebr); Hebrew instructions carry `lang: he`.
course: ar-medubar-2
slug: relocation
title: 'רילוקיישן – אִלִנְתִּקַאל'
goal: 'לדבר על תכניות לעתיד ועל מעבר דירה עם רַח + פועל בהווה, ולשאול שאלות מעשיות בעיר חדשה.'
position: 10
status: in_review

review:
  - >-
    The two workbook exercises ("relocation-future" and "relocation-questions") are
    NEW: the notebook has no self-study exercises. They were written only from this
    cycle's grammar summary, examples and vocabulary. An Arabic teacher must check
    every right answer, every wrong option and every transliteration before students
    see them. The exercise "relocation-questions" uses "אַנַא גְ'דִיד הוֹן" and the
    answer "לְוַחְדִי" for "מַע מִין רַח תִּסְכֻּן?"; please confirm.
  - >-
    The notebook lists four skills (plans with רַח, talking about moving, practical
    questions in a new city, fluency). They were grouped into two: "the future with רַח
    (plans and moving)" and "questions in a new city". Fluency is mentioned only in the
    teacher's plan note.
  - >-
    The cycle title is written two ways in the notebook: "אִלִנְתִּקַאל" (first heading,
    vocabulary, homework) and "אִלִאנְתִּקַ'אל" (second heading). The first was used.
  - >-
    Clear typos fixed: "בִּנְנִהַאיֶה" (double nun, homework exercise 3) → "בִּנִהַאיֶה", as
    in Activity 2; "אַכּוֹן.. ___" → "אַכּוֹן ___" (Activity 4 worksheet); the space before
    "?" and "." in several questions and in the first Mori message was removed; the
    bold markers (**) around the warm-up questions were removed.
  - >-
    Not corrected, please decide: several words have more than one spelling in the
    cycle: תִּנְתִּקֶל / תִּנְתִּקֶ'ל / יִנְתִּקֶ'ל / תֶּנְתקֶ'ל (ק with and without geresh);
    תִּסְכֻּן / תִּסְכֻּון / יִסְכֻּון; work: תִּשְתִּר'ל / יִשְתִּרֶ'ל / יִשְתִּעְ'ל and
    שֻור'ול / שֻעְ'ל (ר' and ע'); הוּ / הוּוַה (he); אִלסַּנֶה אִגַּאי / אִלשַּהֶר אִגַּאי /
    אִלשַּהֶר אִלְגַּאי; חֻ'וטַּת (Mori part 1) / חֻטַּת (Mori part 3) for "plan";
    אַחְ'טַא / אַחְטַא (mistakes); אַלַאק'י (summary) / יִלַאקִי (vocabulary); אַפְצַל
    (vocabulary, usually written with ד'); סַכַּן "גר" (vocabulary; the participle is
    usually סַאכֵּן). Warm-up 4 ends with "אשי או אשׁיאא'!"; the last word may be a typo.
  - >-
    Vocabulary: "יִסְכֻּן" appears twice ("לגור" and "הוא יגור"); the two rows were
    merged into one ("לגור / הוא יגור"). The glosses "אני אגור / הוא יגור / אני אעבור /
    הוא יעבור" for אַסְכֻּן, יִסְכֻּן, אַנְתִּקֶל, יִנְתִּקֶל were kept as in the notebook,
    although the summary says these are present forms and the future needs רַח. Please
    check. The "Arabic script" header of the vocabulary table was left out.
  - >-
    Activity 1 is labelled "full group discussion" but its steps are pair work; the
    pair-work steps were kept and the label left out. Its question list ends with
    "………", which was left out. Activity 4's worksheet line "שם של היעד: ___" (a Hebrew
    label inside the Arabic frame) became a step ("write the name of your city too").
  - >-
    The notebook gives no times except the 90-minute lesson and the 5-minute swap in
    Activity 1, so no other times were set. The Quizlet link keeps no tracking
    parameters ("?i=…&x=…" removed).
  - >-
    Homework: the Mori parts 1–4 and option 3 are Mori messages; option 2 (classic
    exercises) became answer boxes. The examples of what Mori will ask and of the
    answers are shown as examples, not as part of the message.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: relocation-class
    title: 'שיעור: רילוקיישן'
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'רילוקיישן – אִלִנְתִּקַאל'
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: 'העתיד עם רַח: תכניות ומעבר'
            description: "רַח + פועל בהווה: אַנַא רַח אַנְתִּקֶל, אַנַא רַח אַסְכֻּן בִּמַדִינֶה גְ'דִידֶה; שלילה עם מַא רַח."
          - name: שאלות מעשיות בעיר חדשה
            description: "לְוֵין / אֵימְתַא / לֵיש / וֵין / כֵּיף + רַח; אַנַא גְ'דִיד הוֹן, וֵין בִּלַאקִ'י ___?"
      - id: quizlet
        type: externalLink
        lang: he
        label: רילוקיישן בקוויזלט
        url: https://quizlet.com/il/1153335780/%D7%90%D7%9C%D7%90%D7%A0%D7%AA%D7%A7%D7%90%D7%9C-%D7%A8%D7%99%D7%9C%D7%95%D7%A7%D7%99%D7%A9%D7%99%D7%9F-%D7%A2%D7%A8%D7%91%D7%99%D7%AA-%D7%A8%D7%9E%D7%94-2-flash-cards/
      - id: grammar-goal
        type: ruleSummary
        lang: he
        skill: מטרה דקדוקית
        rules:
          - text: 'בעתיד בערבית מדוברת משתמשים במבנה **רַח + פועל בהווה**:'
            examples:
              - 'אַנַא רַח אַנְתִּקֶל = אני אעבור'
              - "אַנַא רַח אַסְכֻּן בִּמַדִינֶה גְ'דִידֶה = אני אגור בעיר חדשה"
      - id: intro-title
        type: heading
        lang: he
        level: 3
        text: סבב פתיחה
      - id: intro
        type: sentenceFrame
        frame: |-
          אַנַא ___
          אִלסַּנֶה אִגַּאי רַח ___
        example: |-
          אַנַא מַרְתַּא
          אִלסַּנֶה אִגַּאי רַח אַנְתִּקֶל לְמַדְרִיד
      - id: warmup-title
        type: heading
        lang: he
        level: 3
        text: שאלות חימום
      - id: warmup
        type: discussionQuestions
        items:
          - question: "הַל מומְכֶּן תֶּתְח'יָּל חאלַכְּ עאיֶּשׁ בדולֶה תאניֶּה?"
          - question: "מין בֶּתְפַד'ֶּל יכּון מעכ למּא תֶּנְתקֶ'ל?"
          - question: "אֵיש רַח תַּעְמַל קַ'בֶּל אֶּלְאנתֶק'אל?"
          - question: "שׁו אַוָּל אשי רח תֶעמַלו למּא תנתק'ל למחל ג'דיד? אשי או אשׁיאא'!"
          - question: "שׁו הי אלאסְבּאבְּ לַלְאֶנְתֶק'אל מן מכּאן למכּאן?"
      - id: activities-title
        type: heading
        lang: he
        level: 3
        text: פעילויות
      - id: act1
        type: classActivity
        lang: he
        title: 'פעילות 1: אנחנו עוברים לעיר חדשה'
        skills: [שאלות מעשיות בעיר חדשה, 'העתיד עם רַח: תכניות ומעבר']
        steps:
          - 'עובדים בזוגות. כל תלמיד שואל את בן הזוג שאלות על המעבר שלו לעיר חדשה: תלמיד א׳ שואל, תלמיד ב׳ עונה.'
          - המורה כותב את השאלות שלמטה על הלוח.
          - 'תלמיד א׳ שואל את כל השאלות, ותלמיד ב׳ עונה במשפטים מלאים. אחרי 5 דקות מתחלפים.'
          - 'דיווח לכיתה: כל תלמיד מציג את התשובות של השותף, לפי התבנית שלמטה.'
      - id: act1-questions
        type: discussionQuestions
        answerable: false
        items:
          - question: 'לְוֵין רַח תִּנְתִּקֶל?'
          - question: 'אֵימְתַא / וינתא רַח תִּנְתִּקֶל?'
          - question: 'לֵיש רַח תִּנְתִּקֶל?'
          - question: 'וֵין רַח תִּסְכֻּון?'
          - question: 'מַע מִין רַח תִּסְכֻּן?'
          - question: "אֵיש רַח תִּשְתִּר'ל?"
      - id: act1-report
        type: sentenceFrame
        frame: |-
          הוּ רַח יִנְתִּקֶל לְ___
          הוּ רַח יִסְכֻּון בִּ___
          הוּ רַח יִשְתִּרֶ'ל בִּ___
      - id: act2
        type: classActivity
        lang: he
        title: 'פעילות 2: תכנית מעבר מלאה'
        skills: ['העתיד עם רַח: תכניות ומעבר']
        steps:
          - 'תכנון אישי: כל תלמיד בונה תכנית מעבר לפי סדר זמנים ברור.'
          - המורה מציג את התבנית שלמטה.
          - כותבים לפחות 5 משפטים.
      - id: act2-plan
        type: discussionQuestions
        items:
          - question: 'אִלְיוֹם אַנַא ___'
          - question: 'אִלשַּהֶר אִגַּאי רַח ___'
          - question: 'בַּעְד סִתּ אשהור רַח ___'
          - question: 'בַּעְד סַנֶה רַח ___'
          - question: 'בִּנִהַאיֶה רַח ___'
      - id: act2-reason-how
        type: text
        lang: he
        text: 'דף עבודה: כתבו סיבה אחת.'
      - id: act2-reason
        type: sentenceFrame
        frame: 'אַנַא רַח אַנְתִּקֶל לַאִנּוֹ ___'
      - id: act3
        type: classActivity
        lang: he
        title: 'פעילות 3: אני חדש בעיר'
        skills: [שאלות מעשיות בעיר חדשה]
        steps:
          - 'סימולציה: התלמיד עבר לעיר חדשה. הוא צריך לשאול שאלות ולבקש מידע.'
          - המורה כותב על הלוח את המבנים שלמטה.
          - 'כל תלמיד כותב 3 שאלות ו־2 משפטים על עצמו.'
          - 'תרגול בזוגות: תלמיד אחד שואל, השני עונה.'
      - id: act3-frame
        type: sentenceFrame
        frame: |-
          אַנַא גְ'דִיד הוֹן
          בִּדִּי אַעְרַף ___
          וֵין בִּלַאקִ'י ___?
          כֵּיף בִּר'דַר ___?
      - id: act3-write
        type: discussionQuestions
        lang: he
        title: 3 שאלות ו־2 משפטים על עצמי
        items:
          - question: שאלה 1
          - question: שאלה 2
          - question: שאלה 3
          - question: משפט על עצמי 1
          - question: משפט על עצמי 2
      - id: act4
        type: classActivity
        lang: he
        title: 'פעילות 4: היום שלי בעיר החדשה'
        skills: ['העתיד עם רַח: תכניות ומעבר', שאלות מעשיות בעיר חדשה]
        steps:
          - כל תלמיד בוחר עיר.
          - 'התלמידים כותבים תיאור של יום מלא בעיר החדשה: לפחות 5 משפטים (דף העבודה שלמטה). כתבו גם את שם העיר.'
          - 'שאלות המשך: תלמידים אחרים שואלים לֵיש? מַע מִין? וינתא?'
      - id: act4-day-title
        type: heading
        lang: he
        level: 4
        text: כתבו יום מלא
      - id: act4-day
        type: discussionQuestions
        items:
          - question: "אסֻ'ובֻּח רַח ___"
          - question: 'בַּעְדֵין רַח ___'
          - question: 'אֶלמַסַא רַח ___'
          - question: 'אַנַא רַח אַכּוֹן ___'
      - id: third-title
        type: heading
        lang: he
        level: 4
        text: 'תרגול מתקדם – גוף שלישי'
      - id: third-how
        type: text
        lang: he
        text: כתבו על חבר.
      - id: third
        type: discussionQuestions
        items:
          - question: "הוּ רַח יִנְתִּקֶ'ל לְ___"
          - question: 'הוּ רַח יִסְכֻּון בִּ___'
          - question: "הוּ רַח יִשְתִּרֶ'ל בִּ___"
          - question: 'הוּ רַח ___'
    teacherNotes:
      - id: n-plan
        anchor: null
        minutes: 90
        text: 'משך השיעור: 90 דקות. מיומנויות: דיבור על תכניות לעתיד עם רַח, דיבור על מעבר דירה / מדינה, שאילת שאלות מעשיות בעיר חדשה ופיתוח שטף דיבור.'
      - id: n-intro
        anchor: intro
        text: 'כל תלמיד מציג את עצמו ואומר מה הוא יעשה בשנה הבאה. כתבו את התבנית על הלוח ותנו את הדוגמה.'
      - id: n-warmup
        anchor: warmup
        text: שאלו את התלמידים ועודדו תשובות מלאות.
      - id: n-act1
        anchor: act1
        text: 'חלקו לזוגות. כתבו את שש השאלות על הלוח. אחרי 5 דקות התלמידים מתחלפים. בסוף כל תלמיד מדווח בגוף שלישי (הוּ רַח…).'
      - id: n-act4
        anchor: act4
        text: 'אחרי שכל תלמיד מקריא את היום שלו, עודדו את האחרים לשאול שאלות המשך: לֵיש? מַע מִין? וינתא?'

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: relocation-summary
    title: סיכום השיעור
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'סיכום דקדוקי – העתיד בערבית מדוברת (אִלְמֻסְתַקְבַּל)'
      - id: rules-structure
        type: ruleSummary
        lang: he
        skill: '1. מבנה העתיד בערבית מדוברת'
        rules:
          - text: 'בעתיד משתמשים במילה **רַח + פועל בהווה**. זה המבנה המרכזי לתיאור תכניות, החלטות ופעולות בעתיד.'
          - text: 'מבנה כללי: **נושא + רַח + פועל בהווה**'
      - id: ex-lesson-title
        type: heading
        lang: he
        level: 4
        text: 'דוגמאות מהשיעור (מעבר דירה)'
      - id: ex-lesson
        type: examples
        items:
          - { text: "אַנַא רַח אַנְתִּקֶ'ל", gloss: 'אני אעבור ל…' }
          - { text: "אַנַא רַח אַסְכֻּון בִּמַדִינֶה גְ'דִידֶה", gloss: אני אגור בעיר חדשה }
          - { text: "אַנַא רַח אַלַאק'י שֻור'ול", gloss: אני אמצא עבודה }
          - { text: "אַנַא רַח אַתְעַרַּף עַלַא נַאס גְ'דַאד", gloss: אני אכיר אנשים חדשים }
      - id: conj
        type: table
        lang: he
        caption: '2. הטיית הפועל לפי גוף'
        header: [גוף, ערבית מדוברת, עברית]
        rows:
          - [אני, "אַנַא רַח אַנְתִּקֶ'ל", אני אעבור]
          - [אתה, אִנְתַּ רַח תִּנְתִּקֶל, אתה תעבור]
          - [הוא, הוּוַה רַח יִנְתִּקֶל, הוא יעבור]
          - [אנחנו, אִחְנַא רַח נִנְתִּקֶל, אנחנו נעבור]
      - id: conj-note
        type: callout
        lang: he
        tone: info
        title: שימו לב
        text: 'הפועל עצמו נשאר בצורת הווה. רק מוסיפים **רַח**.'
      - id: rules-questions
        type: ruleSummary
        lang: he
        skill: '3. שאלות בעתיד'
        rules:
          - text: 'כדי לשאול שאלה, משתמשים באותו מבנה: מילת שאלה + רַח + פועל בהווה.'
      - id: ex-questions
        type: examples
        items:
          - { text: 'לְוֵין רַח תִּנְתִּקֶל?', gloss: 'לאן תעבור?' }
          - { text: 'אֵימְתַא רַח תִּנְתִּקֶל?', gloss: 'מתי תעבור?' }
          - { text: 'וֵין רַח תִּסְכֻּן?', gloss: 'איפה תגור?' }
          - { text: "אֵיש רַח תִּשְתִּעְ'ל?", gloss: 'במה תעבוד?' }
      - id: rules-negation
        type: ruleSummary
        lang: he
        skill: '4. שלילה בעתיד'
        rules:
          - text: 'מבנה: **מַא + רַח + פועל**'
      - id: ex-negation
        type: examples
        items:
          - { text: אַנַא מַא רַח אַנְתִּקֶל, gloss: אני לא אעבור }
          - { text: אַנַא מַא רַח אַסְכֻּן הוֹן, gloss: אני לא אגור כאן }
      - id: rules-plans
        type: ruleSummary
        lang: he
        skill: '5. שימוש חשוב מאוד: דיבור על תכניות'
        rules:
          - text: 'משתמשים בעתיד כדי לדבר על מעבר דירה, עבודה חדשה, מגורים ותכניות אישיות.'
      - id: ex-plans
        type: examples
        items:
          - { text: "אַנַא רַח אַנְתִּקֶל עַשַאן אִלְשֻעְ'ל", gloss: אני אעבור בגלל העבודה }
          - { text: אַנַא רַח אַסְכֻּן בִּבֵּית אַכְּבַּר, gloss: אני אגור בבית גדול יותר }
          - { text: "אַנַא רַח אַבְלֵּש חַיַאת גְ'דִידֶה", gloss: אני אתחיל חיים חדשים }
      - id: compare
        type: table
        lang: he
        caption: '6. השוואה לעברית'
        header: [עברית, ערבית מדוברת]
        rows:
          - [אני אעבור, אַנַא רַח אַנְתִּקֶל]
          - [אני אגור, אַנַא רַח אַסְכֻּן]
          - [הוא יעבוד, "הוּוַה רַח יִשְתִּעְ'ל"]
          - [אנחנו נעבור, אִחְנַא רַח נִנְתִּקֶל]
          - ['איפה תגור?', 'וֵין רַח תִּסְכֻּן?']
      - id: hebrew-difference
        type: callout
        lang: he
        tone: warning
        title: '7. נקודה חשובה מאוד (הבדל מעברית)'
        text: |-
          בעברית משנים את הפועל: אני עובר ← אני אעבור.
          בערבית מדוברת: אַנַא אַנְתִּקֶל ← אַנַא רַח אַנְתִּקֶל.
          לא משנים את הפועל – רק מוסיפים **רַח**.
      - id: short-summary
        type: callout
        lang: he
        tone: tip
        title: סיכום קצר לתלמידים
        text: |-
          בעתיד בערבית מדוברת משתמשים ב־**רַח + פועל בהווה**:
          אַנַא רַח אַנְתִּקֶל · אַנַא רַח אַסְכֻּן · אַנַא רַח אַשְתִּעְ'ל
          זה המבנה המרכזי לתיאור תכניות לעתיד.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: 'עברו עם הקבוצה על המבנה רַח + פועל בהווה, ובקשו מכל תלמיד משפט אחד על תכנית שלו (חיובי או שלילה עם מַא רַח).'

  # ── after class ──────────────────────────────────────────────────────────
  - slug: relocation-homework
    title: שיעורי בית
    phase: after_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'שיעורי בית – אִלִנְתִּקַאל (מעבר דירה)'
      - id: opt1-title
        type: heading
        lang: he
        level: 3
        text: 'אופציה 1 – שיעורי בית אינטראקטיביים עם מורי'
      - id: opt1-how
        type: text
        lang: he
        text: 'מטרה: לתרגל דיבור, שאלות ועתיד עם **רַח + פועל**. פתחו את הצ׳אט עם מורי, העתיקו כל הודעה ושלחו אותה.'
      - id: part1-title
        type: heading
        lang: he
        level: 4
        text: 'חלק 1 – שאלות על תכניות מעבר'
      - id: mori-part1
        type: aiTutorPrompt
        message: |-
          אַנַא בִּדִּי אַחְכִּי עַן חֻ'וטַּת אִלִנְתִּקַאל.
          אִסְאַלְנִי אַסְאִלֶה וּסַחִּחְלִי אִדַ'א עַמַלְתּ אַחְ'טַא.
      - id: part1-how
        type: text
        lang: he
        text: 'מורי ישאל שאלות כמו אלה שלמטה. ענו במשפטים מלאים, כמו בדוגמה.'
      - id: part1-questions
        type: examples
        items:
          - { text: 'לְוֵין רַח תִּנְתִּקֶל?' }
          - { text: 'אֵימְתַא רַח תִּנְתִּקֶל?' }
          - { text: "לֵיש רַח תִּנְתִּקֶ'ל?" }
          - { text: 'וֵין רַח תִּסְכֻּון?' }
          - { text: "אֵיש רַח תִּשְתִּעְ'ל?" }
      - id: part1-example
        type: sentenceFrame
        answerable: false
        frame: |-
          אַנַא רַח אַנְתִּקֶל לְמַדְרִיד
          אַנַא רַח אַסְכֻּן בִּדִּירֶה גְ'דִידֶה
      - id: part2-title
        type: heading
        lang: he
        level: 4
        text: 'חלק 2 – סימולציה: אתה חדש בעיר'
      - id: mori-part2
        type: aiTutorPrompt
        message: |-
          אִעְמַל מַעִי מֻחַאכַּאה.
          אַנַא גְ'דִיד בִּמַדִינֶה גְ'דִידֶה.
          אִסְאַלְנִי אַסְאִלֶה.
      - id: part2-how
        type: text
        lang: he
        text: 'ענו על שאלות כמו:'
      - id: part2-questions
        type: examples
        items:
          - { text: 'וֵין רַח תִּסְכֻּן?' }
          - { text: 'אֵיש רַח תַּעְמַל?' }
          - { text: 'כֵּיף רַח תִּתְעַרַּף עַלַא נַאס?' }
      - id: part3-title
        type: heading
        lang: he
        level: 4
        text: 'חלק 3 – תכנית מעבר מלאה'
      - id: mori-part3
        type: aiTutorPrompt
        message: סַאעִדְנִי אַבְנִי חֻטַּת אִנְתִּקַאל בִּעַשְרֶה חַטַוַאת.
      - id: part3-how
        type: text
        lang: he
        text: 'כתבו יחד עם מורי תכנית, למשל:'
      - id: part3-example
        type: sentenceFrame
        answerable: false
        frame: |-
          אִלְיוֹם אַנַא בִּסְכֻּן בִּחֵיפַה
          אִלשַּהֶר אִלְגַּאי רַח אַדַוַּר עַלַא שֻעְ'ל
          בַּעְד סַנֶה רַח אַנְתִּקֶל
      - id: part4-title
        type: heading
        lang: he
        level: 4
        text: 'חלק 4 – כתיבה ותיקון'
      - id: mori-part4
        type: aiTutorPrompt
        message: |-
          בִּדִּי אַכְתֻּב 5 גֻ'מַל עַן אִלִנְתִּקַאל.
          סַחִּחְלִי אִדַ'א פִי אַחְטַא.
      - id: part4-how
        type: text
        lang: he
        text: 'אחר כך כתבו 5 משפטים, למשל:'
      - id: part4-example
        type: sentenceFrame
        answerable: false
        frame: |-
          אַנַא רַח אַנְתִּקֶל לְבַּרְשֶלוֹנַה
          אַנַא רַח אַסְכֻּן בִּדִּירֶה
          אַנַא רַח אַשְתִּעְ'ל
      - id: opt2-title
        type: heading
        lang: he
        level: 3
        text: 'אופציה 2 – שיעורי בית מסורתיים (תרגילי כתיבה)'
      - id: ex1-title
        type: heading
        lang: he
        level: 4
        text: 'תרגיל 1 – השלימו משפטים'
      - id: ex1-how
        type: text
        lang: he
        text: השלימו עם רַח + פועל.
      - id: ex1
        type: discussionQuestions
        items:
          - question: "אַנַא רַח ___ לְמַדִינֶה גְ'דִידֶה"
          - question: 'אַנַא רַח ___ בִּדִּירֶה'
          - question: "אַנַא רַח ___ שֻעְ'ל גְ'דִיד"
          - question: "אַנַא רַח ___ נַאס גְ'דַאד"
          - question: "אַנַא רַח ___ חַיַאת גְ'דִידֶה"
      - id: ex2-title
        type: heading
        lang: he
        level: 4
        text: 'תרגיל 2 – ענו על השאלות'
      - id: ex2-how
        type: text
        lang: he
        text: ענו במשפטים מלאים.
      - id: ex2
        type: discussionQuestions
        items:
          - question: 'לְוֵין רַח תִּנְתִּקֶל?'
          - question: 'אֵימְתַא רַח תִּנְתִּקֶל?'
          - question: 'לֵיש רַח תִּנְתִּקֶל?'
          - question: 'וֵין רַח תִּסְכֻּן?'
          - question: "אֵיש רַח תִּשְתִּעְ'ל?"
      - id: ex3-title
        type: heading
        lang: he
        level: 4
        text: 'תרגיל 3 – כתבו תכנית מעבר (לפחות 5 משפטים)'
      - id: ex3
        type: discussionQuestions
        items:
          - question: 'אִלְיוֹם אַנַא ___'
          - question: 'אִלשַּהֶר אִלְגַּאי רַח ___'
          - question: 'בַּעְד סַנֶה רַח ___'
          - question: 'בִּנִהַאיֶה רַח ___'
      - id: ex4-title
        type: heading
        lang: he
        level: 4
        text: 'תרגיל 4 – כתבו שאלות (לפחות 4)'
      - id: ex4-how
        type: text
        lang: he
        text: 'כתבו שאלות על מעבר דירה. דוגמה: לְוֵין רַח תִּנְתִּקֶל? עכשיו כתבו עוד 4 שאלות.'
      - id: ex4
        type: discussionQuestions
        lang: he
        items:
          - question: שאלה 1
          - question: שאלה 2
          - question: שאלה 3
          - question: שאלה 4
      - id: opt3-title
        type: heading
        lang: he
        level: 3
        text: 'אופציה 3 – שליחת שיעורי הבית למורי לתיקון'
      - id: opt3-how
        type: text
        lang: he
        text: 'אחרי שסיימתם את התרגילים, שלחו למורי את ההודעה ואת התשובות שלכם. מורי יתקן דקדוק, מבנה עתיד ושימוש נכון ב־רַח.'
      - id: mori-opt3
        type: aiTutorPrompt
        message: |-
          אַנַא כְתַבְתּ תַמַארִין עַן אִלִנְתִּקַאל.
          סַחִּחְלִי אִלְאַחְטַא וּשְרַחְלִי.

