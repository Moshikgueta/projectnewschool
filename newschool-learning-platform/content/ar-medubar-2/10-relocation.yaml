activities:
  - slug: relocation-future
    title: 'העתיד עם רַח: תכניות ומעבר'
    minutes: 8
    items:
      - id: persons
        type: matching
        lang: he
        prompt: התאימו כל משפט לפירוש שלו.
        pairs:
          - [אַנַא רַח אַנְתִּקֶל, אני אעבור]
          - [אִנְתַּ רַח תִּנְתִּקֶל, אתה תעבור]
          - [הוּוַה רַח יִנְתִּקֶל, הוא יעבור]
          - [אִחְנַא רַח נִנְתִּקֶל, אנחנו נעבור]
          - [אַנַא רַח אַסְכֻּן, אני אגור]
      - id: new-city
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״אני אגור בעיר חדשה״?'
        options:
          - { text: "אַנַא רַח אַסְכֻּן בִּמַדִינֶה גְ'דִידֶה", correct: true }
          - {
              text: "אַנַא אַסְכֻּן בִּמַדִינֶה גְ'דִידֶה",
              feedback: 'חסר רַח. בלי רַח זה הווה: ״אני גר בעיר חדשה״.',
            }
          - {
              text: "אַנַא מַא רַח אַסְכֻּן בִּמַדִינֶה גְ'דִידֶה",
              feedback: 'מַא רַח זו שלילה: ״אני לא אגור בעיר חדשה״.',
            }
      - id: we-move
        type: multipleChoice
        lang: he
        prompt: '״אנחנו נעבור״. השלימו: אִחְנַא רַח ___'
        options:
          - { text: נִנְתִּקֶל, correct: true }
          - { text: יִנְתִּקֶל, feedback: 'יִנְתִּקֶל זה ״הוא״: הוּוַה רַח יִנְתִּקֶל.' }
          - { text: תִּנְתִּקֶל, feedback: 'תִּנְתִּקֶל זה ״אתה״: אִנְתַּ רַח תִּנְתִּקֶל.' }
      - id: negation
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״אני לא אגור כאן״?'
        options:
          - { text: אַנַא מַא רַח אַסְכֻּן הוֹן, correct: true }
          - { text: אַנַא רַח מַא אַסְכֻּן הוֹן, feedback: 'הסדר הוא מַא + רַח + פועל.' }
          - { text: אַנַא רַח אַסְכֻּן הוֹן, feedback: 'זה משפט חיובי: ״אני אגור כאן״.' }
      - id: verb-stays
        type: trueFalse
        lang: he
        prompt: 'בעתיד בערבית מדוברת משנים את הפועל עצמו, כמו בעברית (עובר ← אעבור).'
        answer: false
        feedback:
          correct: 'נכון! הפועל נשאר בהווה, ורק מוסיפים רַח: אַנַא רַח אַנְתִּקֶל.'
          incorrect: 'לא משנים את הפועל – רק מוסיפים רַח: אַנַא אַנְתִּקֶל ← אַנַא רַח אַנְתִּקֶל.'
      - id: find-work
        type: multipleChoice
        lang: he
        prompt: "מה פירוש: אַנַא רַח אַלַאק'י שֻור'ול?"
        options:
          - { text: אני אמצא עבודה, correct: true }
          - {
              text: אני אחפש עבודה,
              feedback: "״לחפש״ זה יְדַוַּר עַלַא: אַנַא רַח אַדַוַּר עַלַא שֻעְ'ל.",
            }
          - { text: אני אכיר אנשים חדשים, feedback: "זה אַנַא רַח אַתְעַרַּף עַלַא נַאס גְ'דַאד." }
      - id: because-work
        type: multipleChoice
        lang: he
        prompt: "מה פירוש: אַנַא רַח אַנְתִּקֶל עַשַאן אִלְשֻעְ'ל?"
        options:
