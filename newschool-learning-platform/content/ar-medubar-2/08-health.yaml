activities:
  - slug: health-past
    title: 'עבר – אצל הרופא: נִמְתּ, רֻחְתּ, חַסֵּית'
    minutes: 8
    items:
      - id: past-verbs
        type: matching
        lang: he
        prompt: התאימו כל פועל בעבר לפירוש שלו.
        pairs:
          - ['נִמְתּ', 'ישנתי']
          - ['רֻחְתּ', 'הלכתי']
          - ['אַקַלְתּ', 'אכלתי']
          - ['שְרִבְּתּ', 'שתיתי']
          - ['וִקְעֶת', 'נפלתי']
      - id: felt
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״הרגשתי״?'
        options:
          - { text: 'חַסֵּית', correct: true }
          - { text: 'נִמְתּ', feedback: 'נִמְתּ פירושו ״ישנתי״.' }
          - { text: 'אִרְתַּחְתּ', feedback: 'אִרְתַּחְתּ פירושו ״נחתי״.' }
      - id: ending
        type: trueFalse
        lang: he
        prompt: 'בערבית מדוברת, הסיומת הנפוצה של הפועל בעבר בגוף ״אני״ היא תּ (כמו ״תי״ בעברית).'
        answer: true
        feedback:
          correct: 'נכון! נִמְתּ, רֻחְתּ, אַקַלְתּ – כמו ישנתי, הלכתי, אכלתי.'
          incorrect: 'זה נכון: בגוף ״אני״ הסיומת היא תּ – נִמְתּ, רֻחְתּ, אַקַלְתּ.'
      - id: patient
        type: multipleChoice
        lang: he
        prompt: 'אצל הרופא: ״שלום דוקטור, חליתי אתמול.״'
        options:
          - { text: 'אַסַּלַאם דֻּכְּתּוֹר, אַנַא מַרִדְתּ אִמְבַּארֶח.', correct: true }
          - {
              text: 'אַסַּלַאם דֻּכְּתּוֹר, אַנַא וִקְעֶת אִמְבַּארֶח.',
              feedback: 'וִקְעֶת פירושו ״נפלתי״. ״חליתי״ זה מַרִדְתּ.',
            }
          - {
              text: 'אַסַּלַאם דֻּכְּתּוֹר, אַנַא נִמְתּ אִמְבַּארֶח.',
              feedback: 'נִמְתּ פירושו ״ישנתי״. ״חליתי״ זה מַרִדְתּ.',
            }
      - id: when-happened
        type: multipleChoice
        lang: he
        prompt: 'הרופא שואל: ״אֵימְתַא צַּאר הַאדַא?״ מה הוא שואל?'
        options:
          - { text: 'מתי זה קרה?', correct: true }
          - { text: 'איפה היית?', feedback: '״איפה היית?״ זה וֵין כֻּנְתּ?' }
          - { text: 'איך זה קרה?', feedback: '״איך זה קרה?״ זה כֵּיף צַּאר הַאדַא?' }
      - id: pains
        type: matching
        lang: he
        prompt: התאימו כל מילה לפירוש שלה.
        pairs:
          - ["וַגַ'ע רַאס", 'כאב ראש']
          - ["וַגַ'ע דַּהֶר", 'כאב גב']
          - ["וַגַ'ע חַלַק", 'כאב גרון']
          - ['דַּוַא', 'תרופה']
          - ['תִּלְג', 'קרח']
      - id: went-doctor
