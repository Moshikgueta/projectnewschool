activities:
  - slug: identity-and-community-identity
    title: זהות, מצב ומיקום
    minutes: 8
    items:
      - id: states
        type: matching
        lang: he
        prompt: התאימו כל מילה לפירוש שלה.
        pairs:
          - ['מַבְסוּט', 'שמח']
          - ['תַעְבַּאן', 'עייף']
          - ['מֻתַוַתֶּר', 'מתוח']
          - ['מֻעַלֵּם', 'מורה']
          - ['אֻם', 'אמא']
      - id: student
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״אני תלמיד״?'
        options:
          - { text: 'אַנָא טָאלֶב', correct: true }
          - {
              text: 'אַנָא מִן טָאלֶב',
              feedback: 'מִן פירושו ״מ־״ (מאיפה אני). לזהות אומרים פשוט אַנָא + מילה.',
            }
          - {
              text: 'אַנָא בְּטָאלֶב',
              feedback: 'בְּ משמש למיקום (אַנָא סַאכֶּן בְּחֵיפָה). לזהות אומרים פשוט אַנָא + מילה.',
            }
      - id: from
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״אני מתל אביב״?'
        options:
          - { text: 'אַנָא מִן תֵל אַבִּיב', correct: true }
          - {
              text: 'אַנָא בְּתֵל אַבִּיב',
              feedback: 'בְּ פירושו ״ב־״ – זה ״אני בתל אביב״. למקור אומרים מִן.',
            }
          - { text: 'אַנָא תֵל אַבִּיב', feedback: 'חסרה המילה מִן (מ־).' }
      - id: lives
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״אני גר בחיפה״?'
        options:
          - { text: 'אַנָא סַאכֶּן בְּחֵיפָה', correct: true }
          - {
              text: 'אַנָא סַאכֶּן מִן חֵיפָה',
