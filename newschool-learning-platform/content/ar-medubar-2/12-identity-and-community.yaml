course: ar-medubar-2
slug: identity-and-community
title: זהות וקהילה
goal: 'לדבר על זהות, מצב ומיקום בלי ״להיות״, ולתאר את הקהילה בהשוואות פשוטות ובעתיד עם רָאח.'
position: 12
status: in_review

review:
  - >-
    The two workbook exercises ("identity-and-community-identity" and
    "identity-and-community-community") are NEW: the notebook has no self-study
    exercises. They were written only from this cycle's summary, examples and
    vocabulary. An Arabic teacher must check every right answer, every wrong option
    and every transliteration before students see them.
  - >-
    The notebook names THREE grammar points (identity / state / location without
    "to be"; simple comparisons; simple future with רָאח). The platform works with two
    skills per cycle, so comparisons and the future were grouped into one skill
    ("the community: comparisons and future"). The summary keeps all three rules.
    The second workbook exercise mixes comparisons (5 items) and the future (3 items).
  - >-
    Garbled frames rebuilt, please confirm: intro round "אַנָא הוּן בְּ. (מיקום)" and
    "הַאלְיוֹם אַנָא . (מצב)" (blank missing) → "בְּ___" / "אַנָא ___"; Activity 1
    step 3 "הוּ מִן **. הוּ סַאכֶּן בְּ**." → "הוּ מִן ___. / הוּ סַאכֶּן בְּ___.";
    Activity 2 board frames (broken bold and asterisks) → "___ מִתְל ___.",
    "___ מִש מִתְל / מֶש זַי ___.", "אַכְתַר אֶשִי בְּ___ — הוּ ___.". Stray "**"
    before the Activity 4 title and the "&#10;" codes in the summary were removed.
  - >-
    Not corrected, please decide: the word for "community" is written in many ways:
    קְמִיעֵה / קְמִיעָה / קְמִיעְתַכ / קְמִיעְתִנָא (vocabulary, summary, Activity 1, the
    Activity 4 teacher line), ג'מאעתי / ג'מאעתנא / ג'מאעתַכְּ (Activities 1, 3, 4,
    warm-up 7), מוג'תַמַעַכְּ (warm-up 4, 5, 7) and מג'מועתכּו / מג'מועתנא (Activity 4). "קְמִיעֵה"
    looks unusual; please check it. The workbook uses only phrases that appear as
    written in the summary.
  - >-
    Not corrected, please decide: other spelling variants in the cycle:
    אַכְתַר אֶשִי / אַכְתַר אישִי / אַכְתַר שִי ("the most"); טַלִבּ (Activity 1) /
    טָאלֶב (summary); רָאח נַעְמַל / רָאח נְעְמַל; הָאדִי / הָאדִיה (feminine, "הִי הָאדִי" in
    Activity 2 and "הִי אַכְתַר הָאדִיה" in Activity 4); "שַבָּאבּ וְעֵאאֶלאת" (Activity 4,
    the double א looks like a typo for עֵילאת, but it was left as written).
  - >-
    Please check: the grammar focus lists "אַקַל אֶשִי" and the future "חַא…", but
    neither is used or explained anywhere else in the cycle. The summary has no
    example for אַקַל … מִן and מִש מִתְל; none was invented. Warm-up 1 uses the
    feminine "מין אנתי?" while the rest of the question gives both forms
    (חאלַכְּ / חאלֶכְּ).
  - >-
    Warm-up questions are numbered 1–5 and 7 in the notebook (no 6); they were
    renumbered by order only. The Hebrew "(חלק)" in warm-up 2 was kept as a gloss.
  - >-
    Times: Activity 1 = 5 + 7 + 5 = 17 minutes (6–7 → 7, 4–5 → 5); Activity 2 =
    9 + 6 = 15 (8–9 → 9, 5–6 → 6); Activity 3 = 5 + 7 + 7 = 19; Activity 4 = 7 + 7 =
    14. The step times were kept inside the steps. Activity 4 uses breakout rooms.
  - >-
    Homework: the six Mori prompts are written in Hebrew in the notebook (with Arabic
    key words), so they are Mori messages with lang he. "ג’ומלה וחדה" (one sentence) in
    prompt 3 and "ג’ומלות" in prompt 6 were kept as written.
  - >-
    Quizlet link: the tracking parameters "?i=1b52po&x=1qqt" were removed. The
    vocabulary gloss "רָאח – (סמן עתיד)" was kept as "סמן עתיד".

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: identity-and-community-class
    title: 'שיעור: זהות וקהילה'
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: זהות וקהילה
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: זהות, מצב ומיקום
            description: 'בהווה לא משתמשים ב״להיות״: אַנָא מֻעַלֵּם, אַנָא תַעְבַּאן, אַנָא הוּן בְּתֵל־אָבִיב.'
          - name: 'הקהילה: השוואות ועתיד'
            description: 'אַכְתַר … מִן, אַקַל … מִן, מִתְל, מִש מִתְל, אַכְתַר שִי; עתיד פשוט עם רָאח + פועל.'
      - id: quizlet
        type: externalLink
        lang: he
        label: זהות וקהילה בקוויזלט
        url: https://quizlet.com/il/1151036763/%D7%94%D7%9F%D7%99%D7%94-%D7%95%D7%9E%D7%95%D7%92%D7%AA%D7%9E%D7%A2-%D7%96%D7%94%D7%95%D7%AA-%D7%95%D7%A7%D7%94%D7%99%D7%9C%D7%94-%D7%A2%D7%A8%D7%91%D7%99%D7%AA-%D7%A8%D7%9E%D7%94-2-flash-cards/
      - id: focus
        type: callout
        lang: he
        tone: info
        title: רעיון מרכזי
        text: |-
          **זהות קבועה:** אַנָא + מילה (אַנָא מֻעַלֵּם).
          **מצב זמני ומיקום:** משתמשים ב־בְּ… או בביטויי מצב פשוטים (הַאלְיוֹם אַנָא תַעְבַּאן, אַנָא הוּן בְּ…).
          **עתיד:** רָאח + פועל.
          **השוואות:** אַכְתַר מִן / אַקַל מִן / מִתְל / מִש מִתְל.
      - id: intro-title
        type: heading
        lang: he
        level: 3
        text: פתיחה – סבב היכרות
      - id: intro
        type: sentenceFrame
        frame: |-
          אַנָא אִסְמִי ___.
          אַנָא מִן ___.
          אַנָא ___.
          הַאלְיוֹם אַנָא ___.
          אַנָא הוּן בְּ___.
        example: |-
          אַנָא אִסְמִי מוֹרִי.
          אַנָא מִן תֵל אַבִּיב.
          אַנָא מֻעַלֵּם.
          הַאלְיוֹם אַנָא תַעְבַּאן שְוַי.
          אַנָא הוּן בְּאֶלְמַדְרַסֵה.
      - id: intro-hint
        type: text
        lang: he
        text: 'בשורות: 2 – מקום (מִן + מקום); 3 – תפקיד / זהות; 4 – מצב; 5 – מיקום.'
      - id: warmup-title
        type: heading
        lang: he
        level: 3
        text: שאלות חימום
      - id: warmup
        type: discussionQuestions
        items:
          - question: 'מין אנתי? כיף בּתְחֶבְּ תְעַרֶּף ען חאלַכְּ / חאלֶכְּ?'
          - question: "שׁו אלעאדאת אלּי בֶּתְחֶס אנהא ג'וזוא' (חלק) מֶנָּכְּ / מֶנֶּכְּ?"
          - question: "הַל פי אשי בֶּתחֶבְּ תר'ירו בשח'ס'יתַכְּ?"
          - question: "שו בֶּתחֶבְּ בּ מוג'תַמַעַכְּ?"
          - question: "כיף מומכֶּן תח'לּי מוג'תמַעַכְּ אחסן ואפְד'ל?"
          - question: "שו מא בתחֶבְּ בג'מאעתַכְּ ומוג'תַמַעַכְּ?"
      - id: activities-title
        type: heading
        lang: he
        level: 3
        text: פעילויות
      - id: act1
        type: classActivity
        lang: he
        title: 'פעילות 1: ״מי אני?״ (זהות, מקום, מצב)'
        skills: ['זהות, מצב ומיקום']
        minutes: 17
        steps:
          - 'מטרה: לבטא זהות בסיסית בערבית מדוברת – מי אני, מאיפה אני, איפה אני עכשיו ואיך אני מרגיש.'
          - 'שלב 1 – כתיבה אישית (5 דקות): כל תלמיד כותב ארבעה משפטים קצרים לפי התבניות שלמטה.'
          - 'שלב 2 – שיתוף בזוגות (7 דקות): כל תלמיד מקריא את ארבעת המשפטים שלו. בן הזוג שואל שתי שאלות קבועות, והעונה חייב להשיב במשפט מלא.'
          - 'הרחבה אופציונלית (רק אם הכיתה זורמת): בן הזוג שואל שאלה שלישית עם לֵיש, והעונה מוסיף סיבה קצרה עם לְאַנּוּ.'
          - 'שלב 3 – שיתוף כיתתי (5 דקות): המורה בוחר 3–4 תלמידים, וכל אחד אומר משפט אחד על השותף שלו.'
      - id: act1-write-title
        type: heading
        lang: he
        level: 4
        text: 'שלב 1 – ארבעה משפטים'
      - id: act1-write-hint
        type: text
        lang: he
        text: 'תפקיד / זהות בסיסית: מֻעַלֵּם, תַלְמִיד, טַלִבּ, אֻם, אַבּ… מצב: מַבְסוּט / תַעְבַּאן / מֻתַוַתֶּר / מִרְתָאח.'
      - id: act1-write
        type: sentenceFrame
        frame: |-
          אַנָא אִסְמִי ___.
          אַנָא מִן ___.
          אַנָא ___.
          הַאלְיוֹם אַנָא ___.
      - id: act1-pairs-title
        type: heading
        lang: he
        level: 4
        text: שלב 2 – שאלות בזוגות
      - id: act1-pairs
        type: discussionQuestions
        answerable: false
        items:
          - question: 'וֵין סַאכֶּן הַאלְיוֹם?'
            frame: 'אַנָא סַאכֶּן בְּ___.'
          - question: 'כֵּיף קְמִיעְתַכ?'
            frame: "ג'מאעתי ___."
          - question: 'לֵיש ___? (לֵיש מַבְסוּט? / לֵיש תַעְבַּאן?)'
            frame: |-
              אַנָא מַבְסוּט לְאַנּוּ ___.
              אַנָא תַעְבַּאן לְאַנּוּ ___.
      - id: act1-share-title
        type: heading
        lang: he
        level: 4
        text: שלב 3 – משפט על השותף
      - id: act1-share
        type: sentenceFrame
        frame: |-
          הוּ מִן ___.
          הוּ סַאכֶּן בְּ___.
      - id: act2
        type: classActivity
        lang: he
        title: 'פעילות 2: ״דומה או שונה?״ (השוואות פשוטות)'
        skills: ['הקהילה: השוואות ועתיד']
        minutes: 15
        steps:
          - 'מטרה: לתרגל השוואות בסיסיות בין אנשים ומקומות מוכרים דרך משימה של גילוי הדדי.'
          - 'המורה מדגים שני משפטים בקול (בדוגמה) ואומר: ״אנחנו לא ממציאים מבנים. רק ממלאים את התבנית.״'
          - 'שלב 1 – משימת גילוי בזוגות (9 דקות): מצאו שלושה דברים שאתם דומים בהם ודבר אחד שאתם שונים בו. קודם מדברים ושואלים שאלות פשוטות (מאיפה אתה, איפה אתה גר, מה אתה אוהב, איך המשפחה שלך), ורק אחר כך כותבים ארבעה משפטים בלבד לפי התבנית.'
          - 'חוקים: קודם מדברים, אחר כך כותבים; כל משפט חייב להיות אמיתי לגבי הזוג; משתמשים רק בתבניות שעל הלוח; ארבעה משפטים בלבד.'
          - 'שלב 2 – שיתוף כיתתי (6 דקות): כל זוג מקריא משפט אחד בלבד. הכיתה שואלת שאלה אחת בלבד (לֵיש? או כֵּיף?), והזוג עונה במשפט קצר.'
        example: |-
          מְדִינְתִי אַכְתַר כְּבִּירֵה מִן מְדִינְתַכ.
          חַארַתִי מִש מִתְל חַארַתַכ.
      - id: act2-board-title
        type: heading
        lang: he
        level: 4
        text: תבניות על הלוח
      - id: act2-board
        type: sentenceFrame
        answerable: false
        frame: |-
          ___ אַכְתַר … מִן ___.
          ___ אַקַל … מִן ___.
          ___ מִתְל ___.
          ___ מִש מִתְל / מֶש זַי ___.
          אַכְתַר אֶשִי בְּ___ — הוּ ___.
      - id: act2-write-title
        type: heading
        lang: he
        level: 4
        text: 'שלב 1 – ארבעה משפטים'
      - id: act2-write
        type: sentenceFrame
        frame: |-
          אִחְנַא מִתְל בְּ___.
          אִחְנַא מִתְל בְּ___.
          אִחְנַא מִתְל בְּ___.
          בַּס אַנָא ___ וְהוּ ___.
        example: |-
          אִחְנַא מִתְל בְּאַנַּנָּא מִן נַפְס אלבַּלַד.
          אִחְנַא מִתְל בְּאַנַּנָּא נֻחִבּ א-סַפַר.
          אִחְנַא מִתְל בְּאַנַּנָּא נִדְרֻס לוּעַ’ה גְ’דִידֵה.
          בַּס אַנָא מַבְסוּט אַכְתַר וְהוּ אַהְדַא.
      - id: act2-share-title
        type: heading
        lang: he
        level: 4
        text: שלב 2 – שאלה אחת מהכיתה
      - id: act2-share
        type: discussionQuestions
        answerable: false
        items:
          - question: 'לֵיש?'
            frame: 'לְאַנּוּ אִחְנַא כִּלְנָא נֻחִבּ א-סַפַר.'
          - question: 'כֵּיף?'
            frame: 'הִי הָאדִי וּפִיהַא חַדַאאֶק.'
      - id: act3
        type: classActivity
        lang: he
        title: 'פעילות 3: ״הקהילה שלנו״'
        skills: ['הקהילה: השוואות ועתיד']
        minutes: 19
        steps:
          - 'מטרה: לבנות יחד קהילה דמיונית אחת, תוך שימוש חוזר בעתיד פשוט.'
          - 'הסיטואציה: ״אתם צוות שמקים קהילה חדשה. אתם צריכים להחליט יחד איך היא תיראה ומה יקרה בה.״'
          - 'שלב 1 – חשיבה משותפת (5 דקות): קבוצות של 3–4 תלמידים מסכימות על שלושה דברים: איפה הקהילה תהיה, מי יחיה שם ומה יעשו שם האנשים. שלוש כותרות: מָכַּאן (מקום), נָאס (אנשים), פַעַלִיָּאת (פעילויות). מדברים בעברית רק כדי לבחור רעיונות, ואז עוברים לערבית.'
          - 'שלב 2 – כתיבה צוותית (7 דקות): הקבוצה כותבת יחד שלושה משפטים משותפים בלבד (בתבנית שלמטה).'
          - 'חוקים: כל משפט נכתב רק אחרי שכולם מסכימים; כל תלמיד אומר לפחות רעיון אחד; כל משפט מתחיל ב־רָאח או כולל אותו.'
          - 'שלב 3 – הצגה כצוות (7 דקות): כל תלמיד מקריא משפט אחד. הכיתה שואלת שאלה אחת (וֵין? / לֵיש? / כֵּיף?), והקבוצה עונה יחד במשפט אחד נוסף עם רָאח.'
      - id: act3-board-title
        type: heading
        lang: he
        level: 4
        text: 'על הלוח: רָאח + פועל'
      - id: act3-board
        type: sentenceFrame
        answerable: false
        frame: |-
          רָאח נִבְנִי…
          רָאח נַעְמַל…
          ג'מאעתנא רָאח תִכּוּן…
      - id: act3-write-title
        type: heading
        lang: he
        level: 4
        text: שלב 2 – שלושה משפטים משותפים
      - id: act3-write
        type: sentenceFrame
        frame: |-
          ג'מאעתנא רָאח תִכּוּן בְּ___.
          נָאס רָאח יִג’וּ מִן ___ וְ___.
          אִחְנַא רָאח ___ כֻּל יוֹם.
      - id: act4
        type: classActivity
        lang: he
        title: 'פעילות 4: ״לבנות קהילה אידיאלית״ (זהות, השוואות ועתיד – בשיתוף)'
        skills: ['זהות, מצב ומיקום', 'הקהילה: השוואות ועתיד']
        minutes: 14
        steps:
          - 'מטרה: לדבר זה עם זה, לא רק ״על עצמם״, ולשלב זהות, השוואות ועתיד במשימה משותפת.'
          - 'המורה אומר את המשפט שלמטה. התלמידים מתחלקים לחדרי זוגות או שלישיות.'
          - 'שלב 1 – בחירה משותפת (7 דקות): כל קבוצה מקבלת 4 ״קלפים״ (המורה מקריא או כותב בצ׳אט). הקבוצה מסכימה על תשובה אחת לכל קלף וכותבת 4–5 משפטים קצרים.'
          - 'שלב 2 – הצגה קצרה (7 דקות): כל קבוצה מציגה 3 משפטים בלבד.'
      - id: act4-teacher-title
        type: heading
        lang: he
        level: 4
        text: המורה אומר
      - id: act4-teacher
        type: sentenceFrame
        answerable: false
        frame: 'תַחַיַּלּוּ אִנַּכּוּ בִּדְּכּוּ תִבְנוּ קְמִיעָה גְ’דִידֵה. קְמִיעָה לְנָאס מִן מַכָּאנַאת מֻחְ’תַלְפֵה. אִנְתּוּ רָאח תִקַרְּרוּ כֵּיף רָאח תִכּוּן.'
      - id: act4-cards
        type: table
        lang: he
        caption: 'שלב 1 – ארבעה קלפים'
        header: [קלף, אפשרויות / שלד]
        rows:
          - ['מי האנשים בקהילה?', 'משפחות / צעירים / עולים חדשים / אמנים / סטודנטים']
          - ['מה הכי חשוב בקהילה?', 'עזרה הדדית / שקט / יצירתיות / מסורת / חדשנות']
          - [
              'איך הקהילה שונה מאיפה שאתם חיים עכשיו?',
              "ג'מאעתנא רָאח תִכּוּן אַכְתַר ___ מִן ___. / הִי מִש מִתְל ___.",
            ]
          - [
              'מה אתם הולכים לעשות בשנה הראשונה?',
              'אִחְנַא רָאח ___. / רָאח נְעְמַל ___ לְאַנּוּ ___.',
            ]
      - id: act4-present-title
        type: heading
        lang: he
        level: 4
        text: שלב 2 – הצגה קצרה
      - id: act4-present
        type: discussionQuestions
        items:
          - question: 'מִין אִנְתּוּ?'
            frame: "ג'מאעתנא רָאח תִכּוּן שַבָּאבּ וְעֵאאֶלאת."
          - question: "כֵּיף מג'מועתכּו מֻחְ’תַלְפֵה?"
            frame: "הִי אַכְתַר הָאדִיה מִן מג'מועתנא אלְיוֹם."
          - question: 'שוּ רָאח תִעְמַלּוּ אסַּנֵה?'
            frame: 'אִחְנַא רָאח נְפְתַח מַרְכַּז לִתְּעַלֻּם.'
    teacherNotes:
      - id: n-plan
        anchor: null
        text: 'מיקוד דקדוקי: (1) ״להיות״ בערבית מדוברת – זהות קבועה מול מצב זמני ומיקום; (2) השוואות פשוטות – אַכְתַר מִן, אַקַל מִן, מִתְל, מִש מִתְל, אַכְתַר אֶשִי, אַקַל אֶשִי; (3) עתיד פשוט – רָאח / חַא… + פועל (תכניות וניבויים פשוטים). משך השיעור: 90 דקות.'
      - id: n-intro
        anchor: intro
        text: 'תנו קודם את המודל שלכם (בדוגמה), ואחר כך כל תלמיד מציג את עצמו לפי התבנית.'
      - id: n-warmup
        anchor: warmup
        text: שאלו כל תלמיד לפחות שתי שאלות.
      - id: n-act1
        anchor: act1
        minutes: 17
        text: 'הדגישו בעברית קצרה: ״משפטים קצרים. אל תתרגמו מעברית. פשוט תגידו ׳אני X׳.״ בהרחבה הזכירו: ״מספיק מילה או שתיים אחרי לְאַנּוּ. לא סיפור ארוך.״ בשלב 3 תקנו בעדינות: מִן, בְּ, סדר משפט.'
      - id: n-act2
        anchor: act2
        minutes: 15
        text: 'עברו בין הזוגות ותקנו בעדינות: הזכירו ש־מִתְל ו־מִן חייבים להופיע, סדרו סדר מילים, ובקשו להפוך מילים בודדות למשפט מלא. בשיתוף הכיתתי שבחו שימוש נכון בהשוואה ותקנו רק נקודה אחת בכל פעם.'
      - id: n-act3
        anchor: act3
        minutes: 19
        text: 'תנו שלושה כרטיסים או שלוש כותרות על הדף (מָכַּאן, נָאס, פַעַלִיָּאת). עברו בין הקבוצות ותקנו בזמן אמת: הוסיפו רָאח כששוכחים, פשטו פעלים, והחזירו לצורות A2 ברורות.'
      - id: n-act4
        anchor: act4
        minutes: 14
        text: 'היכנסו לחדרים, הקשיבו ותקנו: רָאח + פועל; אַכְתַר… מִן; מִתְל / מִש מִתְל.'

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: identity-and-community-summary
    title: סיכום השיעור
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'סיכום דקדוקי – זהות וקהילה'
      - id: intro
        type: text
        lang: he
        text: בשיעור הזה עבדנו על שלושה כלים דקדוקיים מרכזיים שמאפשרים לדבר על עצמנו ועל הקהילה שלנו בצורה ברורה ופשוטה.
      - id: rules-identity
        type: ruleSummary
        lang: he
        skill: 'זהות, מצב ומיקום בהווה'
        rules:
          - text: 'בערבית מדוברת, כשמדברים על ההווה, **לא משתמשים בפועל ״להיות״**. פשוט אומרים: אני + מה שאני / איך שאני / איפה שאני.'
          - text: '**זהות**'
            examples:
              - 'אַנָא טָאלֶב – אני תלמיד'
              - 'אַנָא אֻם – אני אמא'
              - 'אַנָא מֻעַלֵּם – אני מורה'
          - text: '**מצב**'
            examples:
              - 'אַנָא מַבְסוּט – אני שמח'
              - 'אַנָא תַעְבַּאן – אני עייף'
              - 'הַאלְיוֹם אַנָא מֻתַוַתֶּר – היום אני מתוח'
          - text: '**מיקום**'
            examples:
              - 'אַנָא הוּן – אני כאן'
              - 'אַנָא הוּן בְּתֵל־אָבִיב – אני כאן בתל אביב'
              - 'אַנָא סַאכֶּן בְּחֵיפָה – אני גר בחיפה'
          - text: 'העיקרון פשוט: אומרים **אַנָא + מילה**, ולא מוסיפים שום פועל באמצע. כך בונים משפטים קצרים וברורים על מי אני, איך אני מרגיש ואיפה אני נמצא.'
      - id: rules-compare
        type: ruleSummary
        lang: he
        skill: השוואות פשוטות
        rules:
          - text: 'כדי להשוות בין אנשים ומקומות השתמשנו במבנים קבועים.'
          - text: '**אַכְתַר … מִן** – יותר מ…'
            examples: ['מְדִינְתִי אַכְתַר כְּבִּירֵה מִן מְדִינְתַכ']
          - text: '**אַקַל … מִן** – פחות מ…'
          - text: '**מִתְל** – כמו'
            examples: ['אִחְנַא מִתְל בְּאַנַּנָּא נֻחִבּ א־סַפַר']
          - text: '**מִש מִתְל** – לא כמו'
          - text: '**אַכְתַר אישִי** – הדבר שהכי…'
            examples: ['אַכְתַר שִי בְּקְמִיעְתִי הוּ אֶלְהֻדוּא']
          - text: 'כל השוואה צריכה להיות **משפט מלא**, ולא רק מילים בודדות.'
      - id: rules-future
        type: ruleSummary
        lang: he
        skill: 'עתיד פשוט – רָאח + פועל'
        rules:
          - text: 'כדי לדבר על תכניות וניבויים השתמשנו בעתיד הפשוט: **רָאח + פועל**.'
            examples:
              - 'רָאח אַעְמַל מַשְרוּע'
              - 'קְמִיעְתִנָא רָאח תִכּוּן אַכְתַר הָאדִי'
              - 'אִחְנַא רָאח נְפְתַח מַרְכַּז תַעְלִים'
          - text: '**רָאח** תמיד בא **לפני הפועל**.'
          - text: 'לא משתמשים בהווה כדי לדבר על עתיד.'
          - text: 'כל משפט עתיד מתחיל ב־**רָאח** או כולל אותו.'
    teacherNotes:
      - id: n-summary
        anchor: null
        text: 'עברו עם הקבוצה על שלושת הכלים, ובקשו מכל תלמיד משפט אחד לכל כלי: אחד עליו בהווה, השוואה אחת ומשפט אחד עם רָאח.'

  # ── after class ──────────────────────────────────────────────────────────
  - slug: identity-and-community-homework
    title: שיעורי בית עם מורי
    phase: after_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: שיעורי בית עם מורי
      - id: how
        type: text
        lang: he
        text: 'פתחו את הצ׳אט עם מורי ושלחו את ההודעות אחת־אחת. כל הודעה אומרת למורי בדיוק מה לעשות: לשאול, להפעיל, לעצור ולתקן.'
      - id: mori-1
        type: aiTutorPrompt
        lang: he
        title: 'הודעה 1 – זהות, מקום ומצב (בהווה)'
        message: |-
          מורי, תשאל אותי מי אני, מאיפה אני, איפה אני גר היום ואיך אני מרגיש.
          תכריח אותי לענות רק בערבית מדוברת, במשפטים מלאים.
          אם אני שוכח מבנה נכון (אַנָא / מִן / בְּ), תעצור ותתקן אותי ותבקש שאחזור בדיוק.
      - id: mori-2
        type: aiTutorPrompt
        lang: he
        title: 'הודעה 2 – הרחבה קצרה עם ״לֵיש״'
        message: |-
          מורי, תשאל אותי שוב על איך אני מרגיש היום, ואז תשאל "לֵיש?".
          תדרוש ממני תשובה קצרה עם לְאַנּוּ.
          אם אני עונה בעברית או במילה אחת – תעצור ותדרוש משפט מלא בערבית.
      - id: mori-3
        type: aiTutorPrompt
        lang: he
        title: 'הודעה 3 – השוואות (דומה ושונה)'
        message: |-
          מורי, תבקש ממני להשוות ביני לבין מישהו שאני מכיר.
          תדרוש:
          – שני משפטים עם "מִתְל"
          – ג’ומלה וחדה עם בַּס אַנָא… וְהוּ…
          – ג’ומלה וחדה עם אַכְתַר… מִן
          כל פעם שאני שוכח מִן או מִתְל – תתקן אותי ותבקש חזרה מדויקת.
      - id: mori-4
        type: aiTutorPrompt
        lang: he
        title: 'הודעה 4 – הקהילה שלי בעתיד (רָאח)'
        message: |-
          מורי, תשאל אותי על הקהילה שלי בעתיד.
          תשאל:
          – מה אני הולך לעשות השנה בקהילה
          – איך הקהילה שלי תהיה בעוד חמש שנים
          – עם מי אני הולך לעבוד
          תכריח אותי להשתמש ב־רָאח בכל משפט.
          אם אני שוכח רָאח או משתמש בהווה – תעצור, תתקן, ותבקש שאחזור.
      - id: mori-5
        type: aiTutorPrompt
        lang: he
        title: 'הודעה 5 – סבב קצר כמו בשיעור'
        message: |-
          מורי, תעשה איתי סבב קצר:
          1. מי אני
          2. איפה אני היום
          3. משהו שבו אני דומה למישהו אחר
          4. משהו שבו אני שונה
          5. משפט אחד על העתיד של הקהילה שלי
          אחרי כל תשובה – תתקן אותי מיד ותבקש שאגיד שוב נכון.
      - id: mori-6
        type: aiTutorPrompt
        lang: he
        title: 'הודעה 6 – אתגר סיום'
        message: |-
          מורי, תן לי אתגר:
          "שתי ג’ומלות בלבד - אחת עליי בהווה, ואחת על הקהילה שלי בעתיד."
          תתקן כל טעות קטנה ותבקש חזרה מושלמת.

