status: in_review

review:
  - >-
    The two workbook exercises ("goals-and-projects-future-rah" and
    "goals-and-projects-future-clauses") are NEW: the notebook has no self-study
    exercises. They were written only from this cycle's grammar explanation,
    summary, examples and word bank. An Arabic teacher must check every right
    answer, every wrong option and every transliteration before students see them.
  - >-
    The notebook has NO vocabulary list for this cycle. The vocabulary section was
    built by the converter from words of the cycle itself (grammar examples,
    Activity 1 time phrases, Activity 3 word bank). The Hebrew meanings of the word
    bank words (סעיד, ראחָה, פַח’וּר, חֻור, אחֶס, ארַכֵּז) are NOT in the notebook and
    were added by the converter. Please check every gloss.
  - >-
    Clear typos fixed: "בדّي" (Arabic letters ّي mixed into the transliteration) →
    "בִּדִּי" in Mori messages 1 and 2; "אוּסַ'ל" → "אוּס'ַל" (geresh placed after the
    vowel, Activity 3); "הם \ הֶני" → "הם / הֶני"; stray bold markers and empty
    lines removed.
  - >-
    Not corrected, please decide: several words have more than one spelling in the
    cycle: ראח / רַח / רח; אִדָ’א / אִזא / אִיזא; אוּצַל / אוּס'ַל / אוּס'ל;
    לְהַדַף / לֶלְהַדַף; אתעללם / אתעלָּם; בִּלְמֻסְתַקְבַּל / בִּלְמֻוסְתַקְבַּל;
    וַקְת / וַק'ֶת; אלוסבוע / אלוּסבוע / אלאוסבוע; אלג’אי / אלג’איי. The workbook uses
    ראח, אִדָ’א, אוּצַל, אתעלָּם and וַקְת.
  - >-
    Please check: the teacher model "אנא ראח אתרַנּן כל יום 10 דקַיֵק" – "אתרַנּן" may
    be a typo for "אתמַרַּן" (practise); not changed. "אנתי מומכֶּן ___" (Activity 2)
    is feminine although A may be speaking to a man.
  - >-
    Mori messages contain Hebrew words inside the Arabic: "ואני אכמל" (message 3),
    "בעתיד" (message 2). They were kept as in the notebook; please decide whether to
    replace them with Arabic (e.g. וַאנא בַּכַּמֶּל, בִּלְמֻסְתַקְבַּל). "אתני" (message
    3) may be a typo for "אעטיני" (give me), as in the next cycle.
  - >-
    Activity 2 is not a heading in the notebook (plain text "פעילות 2 - המטרה שלך,
    התכנית שלי ושלך..(זוגות)"); it was kept as Activity 2. No activity has a time in
    the notebook, so none was set.
  - >-
    Quizlet link: the tracking parameters "?i=…&x=…" were removed. The notebook line
    "כל הערבית בתעתיק עברי" was left out (the whole course is in transliteration).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: goals-and-projects-future-class
    title: 'שיעור: מטרות ופרויקטים – עתיד'
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'מטרות ופרויקטים – עתיד בערבית מדוברת'
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: 'עתיד עם ראח + פועל'
            description: 'אנא ראח אתעלָּם, אחנא ראח נסאפר – לדבר על מטרות ותכניות.'
          - name: 'משפטי זמן: אִדָ’א / בַּעְד מַא'
            description: 'אִדָ’א עִנְדִי וַקְת, אנא ראח אתעלָּם • בַּעְד מַא אוּצַל לְהַדַף, אנא ראח אחְתַפֶל'
      - id: quizlet
        type: externalLink
        lang: he
        label: מטרות ופרויקטים בקוויזלט
        url: https://quizlet.com/il/1140438880/%D7%9E%D7%98%D7%A8%D7%95%D7%AA-%D7%95%D7%A4%D7%A8%D7%95%D7%99%D7%A7%D7%98%D7%99%D7%9D-%D7%91%D7%96%D7%9E%D7%9F-%D7%A2%D7%AA%D7%99%D7%93-%D7%A8%D7%9E%D7%94-2-%D7%90%D7%94%D7%93%D7%90%D7%A3-%D7%95%D7%9E%D7%A9%D7%90%D7%A8%D7%99%D7%A2-flash-cards/
      - id: focus
        type: callout
        lang: he
        tone: info
        title: 'רמה A2 – מיקוד דקדוקי'
        text: |-
          **ראח + פועל** (עתיד). משפטי זמן: **אִדָ’א** (כש / אם) • **בַּעְד מַא** (אחרי ש).
          כמו בעברית: ״אני אלמד״, ״כשיהיה לי זמן אלמד״, ״אחרי שאסיים – אחגוג״.
          בערבית מדוברת: **אנא ראח אתעללם** • **אִדָ’א עִנְדִי וַקְת, אנא ראח אתעללם** • **בַּעְד מַא אוּצַל לְהַדַף, אנא ראח אחְתַפֶל**
      - id: intro-title
        type: heading
        lang: he
        level: 3
        text: 'פתיחה – סבב היכרות'
      - id: intro
        type: sentenceFrame
        frame: |-
          אנא אסמי ___.
          הַדַפִי הו ___.
          בִּלְמֻסְתַקְבַּל אנא ראח ___.
        example: |-
          אנא אסמי אנה.
          הַדַפִי הו אחכי ערבי אחסן.
          בִּלְמֻסְתַקְבַּל אנא ראח אתרַנּן כל יום 10 דקַיֵק.
      - id: grammar-title
        type: heading
        lang: he
        level: 3
        text: 'הסבר דקדוקי – ראח + פועל בערבית מדוברת'
      - id: grammar
        type: ruleSummary
        lang: he
        skill: 'עתיד עם ראח + פועל'
        rules:
          - text: 'בערבית מדוברת יש דרך אחת, פשוטה וברורה, לדבר על העתיד: **ראח + פועל**. המילה **ראח** פירושה ״הולך ל־ / עומד ל־ / עתיד ל־״. היא לא משתנה לפי גוף; מה שמשתנה הוא **הפועל שאחריה**.'
          - text: 'בעברית משנים את הפועל (אני אלמד, אתה תלמד, אנחנו נלמד). בערבית המדוברת שומרים על אותו פועל ורק מוסיפים לפניו **ראח**:'
            examples:
              - 'אנא ראח אתעלָּם – אני אלמד'
              - 'אנת ראח תֶתעלָּם – אתה תלמד'
              - 'הו ראח יתעלָּם – הוא ילמד'
              - 'אחנא ראח נתעלָּם – אנחנו נלמד'
          - text: 'המבנה קבוע: נושא + **ראח** + פועל בהווה. דוגמאות יומיומיות:'
            examples:
              - 'אנא ראח ארוח עלא אלשוגל. – אני אלך לעבודה'
              - 'היא ראח תדרוס. – היא תלמד'
              - 'אחנא ראח נסאפר. – אנחנו נטייל'
              - 'הם / הֶני ראח יג’ו. – הם יבואו'
          - text: 'בעברית העתיד ״נמצא בתוך הפועל״. בערבית המדוברת העתיד ״נמצא במילה אחת לפני הפועל״. כל עתיד = **ראח**: אין הבדל בין ״אני הולך לעשות״, ״אני אעשה״ ו״אני מתכנן לעשות״.'
          - text: 'לדוגמה:'
            examples:
              - '״מחר אני אלמד״ ← בוקרא אנא ראח אתעללם'
              - '״כשיהיה לי זמן, אלמד״ ← אִדָ’א עִנְדִי וַקְת, אנא ראח אתעללם'
              - '״אחרי שאגיע למטרה, אחגוג״ ← בַּעְד מַא אוּצַל לְהַדַף, אנא ראח אחְתַפֶל'
      - id: warmup-title
        type: heading
        lang: he
        level: 3
        text: 'שאלות חימום (A2)'
      - id: warmup
        type: discussionQuestions
        items:
          - question: 'שו הַדַפָכְּ בהאי אלמַרְחַלֶה מן חיאתַכְּ?'
          - question: >-
              בֶּשַׁכֶּל עאם הַל בֶּתְח'ַטֶּטְ לַאהדאפַכְּ או בֶּתְחַ'לִיהא "עַל בַּרַכֶּה"?
          - question: >-
              הַל רַח תְבַּלֶּשׁ מַשׁרוע ג'דיד ק'ריבָּן?
          - question: >-
              שׁו הו אֶלְהַדַף אללי רח תְחֶס בֶּלפַחֶ'ר למּא תְחַקֶ'ק'ו?
          - question: 'שׁו הו אלאשְי אללי מא רַח תֶעְמַלו כּמאן מַרָּה!?'
          - question: "בַּעד ח'מס סנין… וין רַח תכּון?!"
      - id: activities-title
        type: heading
        lang: he
        level: 3
        text: פעילויות
      - id: act1
        type: classActivity
        lang: he
        title: 'פעילות 1: החזון שלי למטרה (עתיד)'
        skills: ['עתיד עם ראח + פועל', 'משפטי זמן: אִדָ’א / בַּעְד מַא']
        steps:
          - 'המורה כותב את המבנה על הלוח.'
          - 'כל תלמיד משלים את המשפטים שלמטה על המטרה שלו.'
      - id: act1-frames
        type: discussionQuestions
        items:
          - question: 'הַדַפִי הו: ___.'
          - question: 'הַאד אלוסבוע אנא רַח ___.'
          - question: 'אלוּסבוע אלג’אי אנא רַח ___.'
          - question: 'בִּשַּהר אלג’אי אנא רַח ___.'
          - question: "אִזא עִנְדִי וַק'ֶת, אנא רַח ___."
          - question: "בַּעְד מַא אוּס'ַל לֶלְהַדַף, אנא רַח ___."
      - id: act2
        type: classActivity
        lang: he
        title: 'פעילות 2: המטרה שלך, התכנית שלי ושלך (זוגות)'
        skills: ['עתיד עם ראח + פועל']
        steps:
          - 'A שואל את B את שלוש השאלות שלמטה.'
          - 'B עונה במשפטים מלאים.'
          - 'A מציע איך אפשר לעזור: ״אנתי מומכֶּן ___.״'
          - מחליפים תפקידים.
      - id: act2-dialogue
        type: discussionQuestions
        answerable: false
        items:
          - question: 'שו הַדַפָכְּ?'
            frame: 'הַדַפִי הו ___.'
          - question: 'שו רַח תעמל אלוּסבוע אלג’אי?'
            frame: 'אלוּסבוע אלג’אי אנא רַח ___.'
          - question: 'כיף מומכֶּן אסאעדַכְּ?'
            frame: 'אנתי מומכֶּן ___.'
      - id: act3
        type: classActivity
        lang: he
        title: 'פעילות 3: לראות ולחזות את העתיד'
        skills: ['עתיד עם ראח + פועל', 'משפטי זמן: אִדָ’א / בַּעְד מַא']
        steps:
          - 'כתיבה: כל תלמיד כותב 6 משפטים לפי התבניות שלמטה, בעזרת בנק המילים.'
          - 'שיתוף: כל תלמיד מקריא משפט אחד.'
        wordBank:
          - סעיד
          - ראחָה
          - פַח’וּר
          - חֻור
          - עֵילתי
          - "ס'חאבי"
          - אחכּי אחסן
          - אתעלָּם אכְּתַר
          - הַדַפִי
          - אחלאמי
          - אסאפר
          - אחְתְפֶל
          - אסאעד אנּאס
      - id: act3-frames
        type: discussionQuestions
        items:
          - question: 'בִּלְמֻוסְתַקְבַּל אנא רַח ___.'
          - question: 'אנא רַח אחֶס ___.'
          - question: 'אנא רַח אכּוּן מע ___.'
          - question: 'אנא רַח אתעלָּם ___.'
          - question: 'אנא ראח ארַכֵּז עלא ___.'
          - question: "בַּעְד מַא אוּס'ַל לֶלְהַדַף, אנא רַח ___."
    teacherNotes:
      - id: n-plan
        anchor: null
        text: 'שתי מיומנויות במחזור: עתיד עם **ראח + פועל** (פתיחה, פעילות 2, פעילות 3) ומשפטי זמן עם **אִדָ’א / בַּעְד מַא** (פעילות 1, המשפט האחרון בפעילות 3). הזכירו שאחרי אִדָ’א / בַּעְד מַא הפועל נשאר בהווה, ו־ראח בא רק במשפט הראשי.'
      - id: n-intro
        anchor: intro
        text: 'כתבו את המבנה על הלוח ותנו קודם את הדוגמה שלכם. התלמידים עונים ב־2–3 משפטים.'
      - id: n-warmup
        anchor: warmup
        text: 'שאלו כל תלמיד לפחות שתי שאלות ובקשו תשובות מלאות עם ראח.'
      - id: n-act3
        anchor: act3
        text: 'בסוף, כל תלמיד מקריא משפט אחד לכיתה.'

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: goals-and-projects-future-summary
    title: סיכום השיעור
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'סיכום דקדוקי – בהשוואה לעברית'
      - id: rules-rah
        type: ruleSummary
        lang: he
        skill: 'עתיד עם ראח + פועל'
        rules:
          - text: 'בעברית משנים את הפועל: אלמד, אעבוד, אסע. בערבית מדוברת שמים מילה אחת לפני הפועל: **ראח + פועל**.'
            examples:
              - 'אנא ראח אתעלָּם – אני אלמד'
              - "אנא ראח אשׁתְרֶ'ל – אני אעבוד"
              - 'אנא ראח אסאפֶר – אני אסע'
      - id: rules-clauses
        type: ruleSummary
        lang: he
        skill: 'משפטי זמן: אִדָ’א / בַּעְד מַא'
        rules:
          - text: '**אִיזא** (אִדָ’א) = כש / אם'
            examples:
              - "אִיזא עִנְדִי וַק'ֶת, אנא ראח אתעלָּם."
          - text: '**בַּעְד מַא** = אחרי ש'
            examples:
              - "בַּעְד מַא אוּס'ל לֶלְהַדַף, אנא ראח אחְתַפֶל."
          - text: 'כמו בעברית: המשפט עם ״כש / אחרי ש״ מתאר מצב, והעתיד מופיע במשפט הראשי עם **ראח**.'
    teacherNotes:
      - id: n-summary
        anchor: null
        text: 'עברו על שני הכללים ובקשו מכל תלמיד משפט אחד עם ראח ומשפט אחד עם אִדָ’א או בַּעְד מַא על המטרה שלו.'

  # ── after class ──────────────────────────────────────────────────────────
  - slug: goals-and-projects-future-homework
    title: שיעורי בית עם מורי
    phase: after_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'שיעורי בית – עם מוֹרי (בתעתיק בלבד)'
      - id: how
        type: text
        lang: he
        text: 'פתחו את הצ׳אט עם מורי, העתיקו הודעה אחת ושלחו אותה. ענו בתעתיק בלבד, עם ראח.'
      - id: mori-1
        type: aiTutorPrompt
        message: 'מרחבא מוֹרי! סאלני על הַדַף תבעי ועל חֻטַתי ללמֻסְתַקְבַּל. בִּדִּי אענה עם ראח. סחח לי.'
      - id: mori-2
        type: aiTutorPrompt
        intro: 'דוגמה: אלוּסבוע אלג’איי אנא ראח אקרא כל יום 10 דקַיֵק.'
        message: 'מוֹרי, סאלני על אלוּסבוע אלג’איי. בִּדִּי אענה בעתיד. סאעדני.'
      - id: mori-3
        type: aiTutorPrompt
        intro: 'דוגמה: אִדָ’א עִנְדִי וַקְת, אנא ראח… / בַּעְד מַא אוּצַל לְהַדַף, אנא ראח…'
        message: 'מוֹרי, אתני גֻמל עם אִדָ’א ובַּעְד מַא, ואני אכמל. סחח לי.'
      - id: mori-4
        type: aiTutorPrompt
        message: 'מוֹרי, כון מֻחַאוֵר. סאלני: שו הַדַף? ליש מֻהִם? שו ראח תעמל? כיף ראח תחוּס?'
      - id: mori-5
        type: aiTutorPrompt
        message: "מוֹרי, סאעדני אבני חֻ'וטַּה סֶהְלֶה ללַהַדַף. אֶסאלני: האד אלאוסבוע? אלוּסבוע אלג’איי? וינתא? כיף? מע מין?"

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: goals-and-projects-future-practice
    book: workbook
    title: 'תרגול: מטרות ופרויקטים – עתיד'
    phase: after_class
    blocks:
      - id: intro
        type: text
        lang: he
        text: תרגלו את שתי המיומנויות של המחזור. כל תשובה נבדקת מיד, ואפשר לנסות שוב.
      - id: ex-rah
        type: activity
        activity: goals-and-projects-future-rah
      - id: ex-clauses
        type: activity
        activity: goals-and-projects-future-clauses

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: goals-and-projects-future-vocabulary
    title: אוצר מילים
    phase: review
    blocks:
