activities:
  - slug: goals-and-projects-future-rah
    title: 'עתיד עם ראח + פועל'
    minutes: 8
    items:
      - id: persons
        type: matching
        lang: he
        prompt: התאימו כל משפט לפירוש שלו.
        pairs:
          - ['אנא ראח אתעלָּם', 'אני אלמד']
          - ['אנת ראח תֶתעלָּם', 'אתה תלמד']
          - ['הו ראח יתעלָּם', 'הוא ילמד']
          - ['אחנא ראח נתעלָּם', 'אנחנו נלמד']
          - ['היא ראח תדרוס', 'היא תלמד']
      - id: work
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״אני אעבוד״?'
        options:
          - { text: "אנא ראח אשׁתְרֶ'ל", correct: true }
          - { text: "אנא אשׁתְרֶ'ל", feedback: 'חסרה המילה ראח: בלי ראח זה לא עתיד.' }
          - { text: 'אנא ראח אסאפֶר', feedback: 'אנא ראח אסאפֶר פירושו ״אני אסע״.' }
      - id: travel
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״אנחנו נטייל״?'
        options:
          - { text: 'אחנא ראח נסאפר', correct: true }
          - { text: 'אנא ראח אסאפֶר', feedback: 'זה ״אני אסע״. לאנחנו: אחנא ראח נסאפר.' }
          - { text: 'אחנא נסאפר', feedback: 'חסרה המילה ראח, שמסמנת את העתיד.' }
      - id: rah-fixed
        type: trueFalse
        lang: he
        prompt: 'המילה ראח משתנה לפי הגוף (אני, אתה, הוא, אנחנו).'
        answer: false
        feedback:
          correct: 'נכון! ראח לא משתנה. מה שמשתנה הוא הפועל שאחריה: אנא ראח אתעלָּם, הו ראח יתעלָּם.'
          incorrect: 'ראח לא משתנה לפי גוף. מה שמשתנה הוא הפועל שאחריה: אנא ראח אתעלָּם, הו ראח יתעלָּם.'
      - id: they-come
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״הם יבואו״?'
        options:
          - { text: 'הֶני ראח יג’ו', correct: true }
          - { text: 'הֶני יג’ו', feedback: 'חסרה המילה ראח, שמסמנת את העתיד.' }
          - { text: 'אנא ראח ארוח', feedback: 'אנא ראח ארוח פירושו ״אני אלך״.' }
      - id: next-week
        type: multipleChoice
        lang: he
        prompt: 'מה פירוש ״אלוּסבוע אלג’אי״?'
        options:
          - { text: 'השבוע הבא', correct: true }
          - { text: 'השבוע', feedback: '״השבוע״ זה הַאד אלוסבוע.' }
          - { text: 'בחודש הבא', feedback: '״בחודש הבא״ זה בִּשַּהר אלג’אי.' }
      - id: tomorrow
        type: multipleChoice
        lang: he
        prompt: '״בוקרא אנא ראח אתעלָּם.״ מה פירוש המשפט?'
        options:
          - { text: 'מחר אני אלמד.', correct: true }
          - {
              text: 'מחר אני אעבוד.',
              feedback: "״אעבוד״ זה ראח אשׁתְרֶ'ל. אתעלָּם פירושו ״ללמוד״.",
            }
          - { text: 'מחר אני אסע.', feedback: '״אסע״ זה ראח אסאפֶר. אתעלָּם פירושו ״ללמוד״.' }
      - id: order-work
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״אני אלך לעבודה.״'
        sentence: 'אנא ראח ארוח עלא אלשוגל'

  - slug: goals-and-projects-future-clauses
    title: 'משפטי זמן: אִדָ’א / בַּעְד מַא'
    minutes: 8
    items:
      - id: words
        type: matching
        lang: he
        prompt: התאימו כל מילה לפירוש שלה.
        pairs:
          - ['אִדָ’א', 'כש / אם']
          - ['בַּעְד מַא', 'אחרי ש']
          - ['וַקְת', 'זמן']
          - ['הַדַף', 'מטרה']
          - ['בוקרא', 'מחר']
      - id: ida
        type: multipleChoice
        lang: he
        prompt: 'מה פירוש ״אִדָ’א״?'
        options:
          - { text: 'כש / אם', correct: true }
          - { text: 'אחרי ש', feedback: '״אחרי ש״ זה בַּעְד מַא.' }
          - { text: 'זמן', feedback: '״זמן״ זה וַקְת.' }
      - id: when-time
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״כשיהיה לי זמן, אלמד״?'
        options:
          - { text: 'אִדָ’א עִנְדִי וַקְת, אנא ראח אתעלָּם', correct: true }
          - {
              text: 'אִדָ’א ראח יכון עִנְדִי וַקְת, אנא ראח אתעלָּם',
              feedback: 'אחרי אִדָ’א לא שמים ראח: החלק הזה נשאר בהווה. ראח בא רק במשפט הראשי.',
            }
          - {
              text: 'בַּעְד מַא עִנְדִי וַקְת, אנא ראח אתעלָּם',
              feedback: 'בַּעְד מַא פירושו ״אחרי ש״. ל״כש״ אומרים אִדָ’א.',
            }
      - id: after-goal
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״אחרי שאגיע למטרה, אחגוג״?'
        options:
          - { text: 'בַּעְד מַא אוּצַל לְהַדַף, אנא ראח אחְתַפֶל', correct: true }
          - {
              text: 'אִדָ’א אוּצַל לְהַדַף, אנא ראח אחְתַפֶל',
              feedback: 'אִדָ’א פירושו ״כש / אם״. ל״אחרי ש״ אומרים בַּעְד מַא.',
            }
          - {
              text: 'בַּעְד מַא אוּצַל לְהַדַף, אנא אחְתַפֶל',
              feedback: 'במשפט הראשי חסרה המילה ראח: אנא ראח אחְתַפֶל.',
            }
      - id: rule
        type: trueFalse
        lang: he
        prompt: 'במשפט עם אִדָ’א או בַּעְד מַא, העתיד (ראח) מופיע במשפט הראשי.'
        answer: true
        feedback:
          correct: 'נכון! החלק עם ״כש / אחרי ש״ מתאר מצב, והעתיד בא במשפט הראשי: אִדָ’א עִנְדִי וַקְת, אנא ראח אתעלָּם.'
          incorrect: 'זה נכון: אִדָ’א עִנְדִי וַקְת, אנא ראח אתעלָּם – ראח בא רק במשפט הראשי.'
      - id: complete-rah
        type: multipleChoice
        lang: he
        prompt: 'השלימו: אִדָ’א עִנְדִי וַקְת, אנא ___ אסאפֶר.'
        options:
          - { text: 'ראח', correct: true }
          - {
              text: 'בַּעְד מַא',
              feedback: 'בַּעְד מַא פותח את החלק של ״אחרי ש״. במשפט הראשי צריך ראח.',
            }
          - { text: 'אִדָ’א', feedback: 'אִדָ’א כבר פותח את המשפט. במשפט הראשי צריך ראח.' }
      - id: after-meaning
        type: multipleChoice
        lang: he
        prompt: 'מה פירוש ״בַּעְד מַא״?'
        options:
          - { text: 'אחרי ש', correct: true }
          - { text: 'כש / אם', feedback: '״כש / אם״ זה אִדָ’א.' }
          - { text: 'מחר', feedback: '״מחר״ זה בוקרא.' }
      - id: order-when
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״כשיהיה לי זמן, אלמד.״'
        sentence: 'אִדָ’א עִנְדִי וַקְת, אנא ראח אתעלָּם'
