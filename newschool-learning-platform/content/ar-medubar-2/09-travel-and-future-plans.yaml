course: ar-medubar-2
slug: travel-and-future-plans
title: "טיולים ותכניות לעתיד – אִסַּפַר וְחֻ'טַּט לִלְמֻסְתַּקְבַּל"
goal: 'לדבר על תכניות לעתיד עם רַח + פועל, ולשאול ולספר על טיול לפי סדר (לְוֵין, וֵין, אֵימְתַא; אַוַל אִשִּי, בַּעְדֵין, בִּנְנִהַאיֶה).'
position: 9
status: in_review

review:
  - >-
    The two workbook exercises ("travel-and-future-plans-future" and
    "travel-and-future-plans-questions") are NEW: the notebook has no self-study
    exercises. They were written only from this cycle's summary, examples and
    vocabulary. An Arabic teacher must check every right answer, every wrong option
    and every transliteration before students see them.
  - >-
    Please check: Activity 1's full example says "אִחְנַא רַח נִסַאפֶר לְיַוַאן" and then
    "נִסְכֻּן בִּטוֹקְיוֹ" (Tokyo, Japan), but Japan is usually "אליאבאן" and Greece
    "אליונאן". Activity 2 and the partner report also use "יַוַאן" (with temples), and
    Activity 3 / the homework use "ליַוַנאן" / "ליונאן". Kept as in the notebook.
  - >-
    The notebook lists four skills (future plans, trips, asking questions, describing
    future plans). They were grouped into the course's two skills: future with רַח +
    verb, and questions and order words about a trip.
  - >-
    Clear typos and formatting fixed: backslashes used as "or" became " / "
    ("אלעוטלה\ ארֶּחְלֶה", "נַאכּוֹל \נוכֶּל", "אֵימְתַא\ וינתא", "בִּפֻנְדֻּק\ אותיל");
    warm-up 7 ends with "?" instead of "!"; spaces before "?" and ":" removed.
  - >-
    Not corrected, please decide: "mistakes" is written אַחְטַאא (Mori messages 1–2)
    and אַחְ'טַאא (message 3); "explain" is written "וְסַרַּח" (with ס, maybe
    "וְשַרַּח"); the cycle word is אִסַּפַר (title) and אִלסַּפַר (homework, vocabulary);
    "my dream trip" is רִחְלֶת אַחְלאמי (Activity 2) and רִחְלֶת חֻלְמִי (vocabulary);
    "first" is אַוַל אִשִּי here and אַוַּל שַי in cycle 7; "he" is הוּוַה here and הוּ
    in earlier cycles.
  - >-
    Teacher-only steps (explain, write on the board, walk around and help) were
    moved into teacher notes; the board frames and examples stay for students. Only
    Activity 2 step 3 has a time (3–5 minutes → 5). Optional steps are marked "(לא
    חובה)".
  - >-
    Homework: option 1 (Mori conversation) and the two "check my exercise" / "give
    me an exercise" messages are Mori messages; option 2 (traditional exercises) is
    answer boxes. The Quizlet link keeps no tracking parameters ("?i=…&x=…" removed).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: travel-and-future-plans-class
    title: 'שיעור: טיולים ותכניות לעתיד'
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: "טיולים ותכניות לעתיד – אִסַּפַר וְחֻ'טַּט לִלְמֻסְתַּקְבַּל"
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: 'תכניות לעתיד עם רַח'
            description: 'רַח + פועל בהווה: אַנַא רַח אַסַאפֶר, הוּוַה רַח יִסַאפֶר, אִחְנַא רַח נִסַאפֶר.'
          - name: שאלות ומילות סדר על טיול
            description: 'לְוֵין? וֵין? אֵימְתַא? אֵיש? לֵיש? – ו־אַוַל אִשִּי, בַּעְדֵין, בַּעְד הַאדַא, בִּנְנִהַאיֶה.'
      - id: quizlet
        type: externalLink
        lang: he
        label: 'טיולים לחו״ל בקוויזלט'
        url: https://quizlet.com/il/1152159442/%D7%98%D7%99%D7%95%D7%9C%D7%99%D7%9D-%D7%95%D7%AA%D7%95%D7%9B%D7%A0%D7%99%D7%95%D7%AA-%D7%9C%D7%A2%D7%AA%D7%99%D7%93-%D7%A8%D7%97%D7%9C%D7%90%D7%AA-%D7%95%D7%97%D7%95%D7%98%D7%98-%D7%9E%D7%95%D7%A1%D7%AA%D7%A7%D7%91%D7%9C%D7%99%D7%94-%D7%A2%D7%A8%D7%91%D7%99%D7%AA-%D7%A8%D7%9E%D7%94-2-flash-cards/
      - id: grammar-goal
        type: callout
        lang: he
        tone: info
        title: מטרה דקדוקית
        text: |-
          בעתיד בערבית מדוברת משתמשים במבנה: **רַח + פועל בהווה**.
          אַנַא רַח אַסַאפֶר = אני אסע
          אַנַא רַח אַזוּר = אני אבקר
          אִחְנַא רַח נִסַאפֶר = אנחנו ניסע
      - id: intro-title
        type: heading
        lang: he
        level: 3
        text: סבב פתיחה
      - id: intro-how
        type: text
        lang: he
        text: כל תלמיד מציג את עצמו ואומר לאן הוא ייסע ומה הוא יעשה.
      - id: intro
        type: sentenceFrame
        frame: |-
          אַנַא ___.
          אַנַא רַח אַסַאפֶר לְ___.
          רַח ___.
        example: |-
          אַנַא יוּסֻף.
          אַנַא רַח אַסַאפֶר לְאִיטַלְיַא.
          רַח אַזוּר אַמַאקִן גְ'דִידֶה.
      - id: warmup-title
        type: heading
        lang: he
        level: 3
        text: שאלות הכנה
      - id: warmup
        type: discussionQuestions
        items:
          - question: 'לְוֵין רַח תִּסַאפֶר בִּלְעוטְלֶה אִגַּאי? ומע מין?'
          - question: "שׁו אַהַם אֶשׁי בֶּנֶּסְבֶּה אלכְּ פי אלעוטלה / ארֶּחְלֶה: ארּאחה, אלמור'אמרָה, אלמנאד'ר אטביעיה…"
          - question: 'אַי דולֶה בֶּתֶחלַם תסאפֶר עליהא? וליש?'
          - question: 'שׁו בֶּתֶעמַל בֶּשכֶּל עאם בֶּנֶהאיֶת אלאוסְבּוע?'
          - question: "וין בֶּתְחֶבְּ תסאפֶר דאח'ל אלאבּלאד?"
          - question: "שו אהַם אלאשׁיאא' אלי לאזֶם תחדֶ'רהא ק'בֶּל אסּפַר?"
          - question: "שו אק'רבְּ ס'ורה לעוטֶלתַכְּ אלמופד'לֶה?"
      - id: activities-title
        type: heading
        lang: he
        level: 3
        text: פעילויות
      # Activity 1
      - id: act1
        type: classActivity
        lang: he
        title: 'פעילות 1: תכנון טיול קבוצתי'
        skills: ['תכניות לעתיד עם רַח', שאלות ומילות סדר על טיול]
        steps:
          - 'אתם מתכננים טיול ביחד. צריך להחליט: לאן תיסעו, איפה תישנו, מה תאכלו, מה תקנו.'
          - 'הדגמה עם כל הכיתה: בוחרים יעד, המורה שואל והכיתה עונה.'
          - 'עבודה בקבוצות של 2–4: מתכננים טיול ביחד. כל תלמיד חייב להגיד לפחות משפט אחד.'
          - 'כתיבה: כל קבוצה כותבת 3–4 משפטים עם **אִחְנַא רַח ___**.'
          - 'הצגה מול הכיתה: כל קבוצה מציגה את הטיול שלה.'
          - 'שאלות המשך (לא חובה): המורה שואל את הקבוצה.'
        example: |-
          אִחְנַא רַח נִסַאפֶר לְיַוַאן.
          אִחְנַא רַח נִסְכֻּן בִּטוֹקְיוֹ.
          אִחְנַא רַח נַאכּוֹל אַכְּל מַחַלִּי.
          אִחְנַא רַח נִשְתִּרִי הַדַאיַא.
      - id: act1-words
        type: table
        lang: he
        caption: 'אִחְנַא רַח… (אנחנו נ…)'
        rows:
          - [אִחְנַא, אנחנו]
          - [רַח, עתיד]
          - [נִסַאפֶר, ניסע]
          - [נִסְכֻּן, נגור]
          - [נַאכּוֹל, נאכל]
          - [נִשְתִּרִי, נקנה]
      - id: act1-demo
        type: discussionQuestions
        answerable: false
        items:
          - question: 'לְוֵין רַח נִסַאפֶר?'
            frame: 'אִחְנַא רַח נִסַאפֶר לְאִיטַלְיַא.'
          - question: 'וֵין רַח נִסְכֻּן?'
            frame: 'אִחְנַא רַח נִסְכֻּן בִּרוֹמַא.'
          - question: 'אֵיש רַח נַאכּוֹל?'
            frame: 'אִחְנַא רַח נַאכּוֹל אַכְּל מַחַלִּי.'
      - id: act1-plan
        type: discussionQuestions
        items:
          - question: 'אִחְנַא רַח נִסַאפֶר לְ___.'
          - question: 'אִחְנַא רַח נִסְכֻּן בִּ___.'
          - question: 'אִחְנַא רַח נַאכּוֹל / נוכֶּל ___.'
          - question: 'אִחְנַא רַח נִשְתִּרִי ___.'
      - id: act1-followup
        type: discussionQuestions
        answerable: false
        items:
          - question: 'לֵיש רַח תִסַאפְרוּ לְהַאדַא אִלְמַכַּאן?'
          - question: 'אֵיש רַח תַעְמְלוּ הֻנַאק?'
          - question: 'הַל רַח תִנְבַּסְטוּ?'
      # Activity 2
      - id: act2
        type: classActivity
        lang: he
        title: 'פעילות 2: טיול החלומות שלי (רִחְלֶת אַחְלאמי)'
        skills: ['תכניות לעתיד עם רַח']
        steps:
          - 'חושבים על טיול החלומות שלכם ומתארים: לאן תיסעו, מה תעשו, מה תאכלו, איפה תישנו.'
          - 'הדגמה: המורה כותב דוגמה על הלוח וקורא אותה בקול.'
          - 'כתיבה אישית (5 דקות): כל תלמיד כותב 3–4 משפטים עם **אַנַא רַח ___**.'
          - 'עבודה בזוגות: תלמיד א׳ מקריא את הטיול שלו, תלמיד ב׳ שואל שאלות. אחר כך מתחלפים.'
          - 'הצגה מול הכיתה: כמה תלמידים מציגים את הטיול שלהם.'
          - 'דיווח על בן הזוג (לא חובה): מספרים על הטיול של בן הזוג בגוף שלישי.'
        example: |-
          אַנַא רַח אַסַאפֶר לְאִיטַלְיַא.
          רַח אַזוּר רוֹמַא.
          רַח אַכּוֹל אַכְּל מַחַלִּי.
          רַח אַסְכֻּן בִּפֻנְדֻּק.
      - id: act2-words
        type: table
        lang: he
        caption: 'אַנַא רַח… (אני א…)'
        rows:
          - [אַנַא, אני]
          - [רַח, עתיד]
          - [אַסַאפֶר, אסע]
          - [אַזוּר, אבקר]
          - [אַכּוֹל, אוכל]
          - [אַסְכֻּן, אגור]
      - id: act2-frame
        type: sentenceFrame
        frame: |-
          אַנַא רַח אַסַאפֶר לְ___.
          רַח אַזוּר ___.
          רַח אַכּוֹל ___.
          רַח אַסְכֻּן בִּ___.
        example: |-
          אַנַא רַח אַסַאפֶר לְיַוַאן.
          רַח אַזוּר מַעַאבֶּד.
      - id: act2-pairs
        type: discussionQuestions
        answerable: false
        items:
          - question: 'לְוֵין רַח תִּסַאפֶר?'
          - question: 'אֵיש רַח תַּעְמַל הֻנַאק?'
          - question: 'וֵין רַח תִּסְכֻּן?'
          - question: 'הַל רַח תִּנְבַּסֶט?'
      - id: act2-report
        type: sentenceFrame
        frame: |-
          הוּוַה רַח יִסַאפֶר לְ___.
          הוּוַה רַח יַזּוּר ___.
        example: |-
          הוּוַה רַח יִסַאפֶר לְיַוַאן.
          הוּוַה רַח יַזּוּר מַעַאבֶּד.
      # Activity 3
      - id: act3
        type: classActivity
        lang: he
        title: 'פעילות 3: סוכן נסיעות (משחק תפקידים)'
        skills: ['תכניות לעתיד עם רַח', שאלות ומילות סדר על טיול]
        steps:
          - 'זוגות: תלמיד א׳ – מטייל, תלמיד ב׳ – סוכן נסיעות. המטייל מתאר את הטיול שלו, והסוכן שואל שאלות.'
          - 'קוראים יחד את המבנה: המטייל אומר משפטים, הסוכן שואל שאלות.'
          - 'הדגמה: המורה הוא הסוכן, ותלמיד אחד הוא המטייל.'
          - 'עבודה בזוגות: המטייל אומר 2–3 משפטים, והסוכן שואל לפחות 3 שאלות.'
          - 'מחליפים תפקידים ועושים שיחה חדשה.'
          - 'הצגה מול הכיתה (לא חובה): 1–2 זוגות מציגים.'
        example: |-
          תלמיד: אַנַא רַח אַסַאפֶר לְליַוַנאן.
          מורה: אֵימְתַא / וינתא רַח תִּסַאפֶר?
      - id: act3-traveller
        type: sentenceFrame
        frame: |-
          אַנַא רַח אַסַאפֶר לְ___.
          רַח אַזוּר ___.
          רַח אַסְכֻּן בִּ___.
      - id: act3-agent
        type: discussionQuestions
        answerable: false
        items:
          - question: 'אֵימְתַא רַח תִּסַאפֶר?'
          - question: 'וֵין רַח תִּסְכֻּן?'
          - question: 'אֵיש רַח תַּעְמַל הֻנַאק?'
      # Activity 4
      - id: act4
        type: classActivity
        lang: he
        title: 'פעילות 4: ציר זמן של הטיול (תַסַלְסֻל אִלרִחְלֶה)'
        skills: ['תכניות לעתיד עם רַח', שאלות ומילות סדר על טיול]
        steps:
          - 'מתארים טיול עתידי לפי סדר: מה תעשו ראשון, אחר כך, ובסוף.'
          - 'קוראים יחד את המבנה עם מילות הסדר.'
          - 'כתיבה אישית: כל תלמיד כותב 3–4 משפטים על הטיול שלו, לפי המבנה.'
          - 'עבודה בזוגות: מקריאים את הטיול לבן הזוג, ובן הזוג שואל שאלת המשך (למשל: לְוֵין רַח תִּסַאפֶר?).'
          - 'הצגה מול הכיתה (לא חובה).'
        example: |-
          אַוַל אִשִּי רַח אַסַאפֶר.
          בַּעְדֵין רַח אַסְכֻּן בִּפֻנְדֻּק.
          בַּעְד הַאדַא רַח אַזוּר אַמַאקִן.
          בִּנְנִהַאיֶה רַח אַרְגַע לִלְבֵּית.
      - id: act4-frame
        type: sentenceFrame
        frame: |-
          אַוַל אִשִּי רַח ___.
          בַּעְדֵין רַח ___.
          בַּעְד הַאדַא רַח ___.
          בִּנְנִהַאיֶה רַח ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: 'מיומנויות המחזור: דיבור על תכניות לעתיד, דיבור על טיולים, שאילת שאלות ותיאור תכניות עתידיות. המבנה המרכזי: רַח + פועל בהווה.'
      - id: n-intro
        anchor: intro
        text: 'כתבו את המבנה על הלוח.'
      - id: n-act1
        anchor: act1
        text: 'מטרה דקדוקית: עתיד עם רַח + פועל, בעיקר בגוף אִחְנַא רַח (אנחנו נ…). כתבו על הלוח את ארבע התבניות ואת ההסבר (בטבלה). בהדגמה שאלו ״לְוֵין רַח נִסַאפֶר?״, עודדו תשובות וכתבו אותן על הלוח.'
      - id: n-act2
        anchor: act2
        minutes: 5
        text: 'מטרה דקדוקית: אַנַא רַח + פועל. כתבו את המבנה ואת הדוגמה על הלוח, קראו בקול והסבירו בקצרה שזה טיול בעתיד. בכתיבה האישית (3–5 דקות) עברו בין התלמידים ועזרו. בעבודה בזוגות כתבו על הלוח את שאלות העזר.'
      - id: n-act3
        anchor: act3
        text: 'מטרה דקדוקית: עתיד עם רַח + פועל, ושאלות בעתיד. כתבו את המשפטים על הלוח וקראו אותם עם התלמידים. בהדגמה אתם הסוכן.'
      - id: n-act4
        anchor: act4
        text: 'מטרה דקדוקית: רַח + פועל, ושימוש במילות סדר. כתבו את המבנה ואת הדוגמה המלאה על הלוח, והסבירו שאלה מילות סדר. תנו כמה דקות לכתיבה.'

