      - id: check-how
        type: text
        lang: he
        text: 'כתבו את התשובות שלכם, שלחו למורי את ההודעה, ואז הדביקו את התשובות. מורי יתקן ויסביר.'
      - id: mori-check
        type: aiTutorPrompt
        message: 'צַחֵּח לִי הַאדַא אִלְתַּמְרִין וְסַרַּח לִי אַלְאַחְטַאא.'
      - id: check-example
        type: examples
        items:
