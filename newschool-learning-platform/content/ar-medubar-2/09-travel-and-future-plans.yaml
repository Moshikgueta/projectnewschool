activities:
  - slug: travel-and-future-plans-future
    title: 'עתיד עם רַח: אַנַא רַח אַסַאפֶר'
    minutes: 8
    items:
      - id: verbs
        type: matching
        lang: he
        prompt: התאימו כל פועל לפירוש שלו.
        pairs:
          - ['אַסַאפֶר', 'אני אסע']
          - ['יִסַאפֶר', 'הוא יסע']
          - ['נִסַאפֶר', 'אנחנו ניסע']
          - ['אַזוּר', 'אני אבקר']
          - ['אַסְכֻּן', 'אני אגור']
      - id: i-will-travel
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״אני אסע לאיטליה״?'
        options:
          - { text: 'אַנַא רַח אַסַאפֶר לְאִיטַלְיַא', correct: true }
          - {
              text: 'אַנַא אַסַאפֶר לְאִיטַלְיַא',
              feedback: 'חסר רַח. בעתיד אומרים רַח לפני הפועל: אַנַא רַח אַסַאפֶר.',
            }
          - {
              text: 'אַנַא רַח נִסַאפֶר לְאִיטַלְיַא',
              feedback: 'נִסַאפֶר פירושו ״ניסע״ (אנחנו). עם אַנַא אומרים אַסַאפֶר.',
            }
      - id: we-will-stay
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״אנחנו נגור ברומא״?'
        options:
          - { text: 'אִחְנַא רַח נִסְכֻּן בִּרוֹמַא', correct: true }
          - {
              text: 'אִחְנַא רַח אַסְכֻּן בִּרוֹמַא',
              feedback: 'אַסְכֻּן פירושו ״אגור״ (אני). עם אִחְנַא אומרים נִסְכֻּן.',
            }
          - {
              text: 'אִחְנַא נִסְכֻּן רַח בִּרוֹמַא',
              feedback: 'רַח תמיד באה לפני הפועל: אִחְנַא רַח נִסְכֻּן.',
            }
      - id: rule
        type: trueFalse
        lang: he
        prompt: 'רַח תמיד באה לפני הפועל, והפועל נשאר בצורת הווה.'
        answer: true
        feedback:
          correct: 'נכון! רַח + פועל בהווה: אַנַא רַח אַסַאפֶר.'
          incorrect: 'זה נכון: רַח באה לפני הפועל, והפועל בהווה – אַנַא רַח אַסַאפֶר.'
      - id: he-will-visit
        type: multipleChoice
        lang: he
        prompt: '״הוא יבקר במקדשים.״ – הוּוַה רַח ___ מַעַאבֶּד.'
        options:
          - { text: 'יַזּוּר', correct: true }
          - { text: 'אַזוּר', feedback: 'אַזוּר פירושו ״אבקר״ (אני).' }
          - { text: 'תַּזּוּר', feedback: 'תַּזּוּר פירושו ״תבקר״ (אתה).' }
      - id: we-will-buy
        type: multipleChoice
        lang: he
        prompt: '״אנחנו נקנה מתנות.״ – אִחְנַא רַח ___ הַדַאיַא.'
        options:
          - { text: 'נִשְתִּרִי', correct: true }
          - { text: 'אַשְתִּרִי', feedback: 'אַשְתִּרִי פירושו ״אקנה״ (אני).' }
          - { text: 'נַאכּוֹל', feedback: 'נַאכּוֹל פירושו ״נאכל״.' }
      - id: after-verb
        type: trueFalse
        lang: he
        prompt: 'בערבית מדוברת שמים את רַח אחרי הפועל: אַנַא אַסַאפֶר רַח.'
        answer: false
        feedback:
          correct: 'נכון! המשפט שגוי: רַח באה לפני הפועל – אַנַא רַח אַסַאפֶר.'
          incorrect: 'לא נכון: רַח תמיד באה לפני הפועל – אַנַא רַח אַסַאפֶר.'
      - id: order-italy
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״אנחנו ניסע לאיטליה.״'
        sentence: 'אִחְנַא רַח נִסַאפֶר לְאִיטַלְיַא'

  - slug: travel-and-future-plans-questions
    title: 'שאלות ומילות סדר: לְוֵין? אֵימְתַא? בַּעְדֵין'
    minutes: 8
    items:
      - id: question-words
        type: matching
        lang: he
        prompt: התאימו כל מילת שאלה לפירוש שלה.
        pairs:
          - ['לְוֵין', 'לאן']
          - ['וֵין', 'איפה']
          - ['אֵימְתַא', 'מתי']
          - ['אֵיש', 'מה']
          - ['לֵיש', 'למה']
      - id: when-travel
        type: multipleChoice
        lang: he
        prompt: 'סוכן הנסיעות שואל: ״מתי תיסע?״'
        options:
          - { text: 'אֵימְתַא רַח תִּסַאפֶר?', correct: true }
          - { text: 'לְוֵין רַח תִּסַאפֶר?', feedback: 'לְוֵין פירושו ״לאן״.' }
