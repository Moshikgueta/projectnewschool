          בעדין רוחת עלשור'ל.
          בֶּלּיל חדרת מסלסל.
      - id: rules-habits
        type: ruleSummary
        lang: he
        skill: '5. הרגלים בעבר'
        rules:
          - text: 'כדי לדבר על דברים שעשינו **בעבר באופן קבוע**, משתמשים במבנה **כנת + פועל**.'
      - id: ex-habits
        type: examples
        items:
          - { text: "למא כנת זר'יר כּונת אלעב כורת קדם.", gloss: כשהייתי קטן הייתי משחק כדורגל. }
          - { text: כנת אדרס כל יום., gloss: הייתי לומד כל יום. }
          - { text: כנת אסכן פי חיפה., gloss: גרתי בחיפה. }
          - { text: כנת אסאפר מע אלעילה פי אלעטלה., gloss: הייתי נוסע עם המשפחה בחופש. }
      - id: rules-other
        type: ruleSummary
        lang: he
        skill: '6. לדבר על אדם אחר'
        rules:
          - text: 'כשמספרים על אדם אחר משתמשים לרוב ב־**שריכי** (בן הזוג שלי) וב־**שריכתי** (בת הזוג שלי).'
