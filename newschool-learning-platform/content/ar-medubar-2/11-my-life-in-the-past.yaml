course: ar-medubar-2
slug: my-life-in-the-past
title: החיים שלי בעבר
goal: 'לספר על פעולות, זיכרונות והרגלים בעבר (כּנת + פועל), ולשאול שאלות על העבר.'
position: 11
status: in_review

review:
  - >-
    The two workbook exercises ("my-life-in-the-past-actions" and
    "my-life-in-the-past-questions") are NEW: the notebook has no self-study exercises.
    They were written only from this cycle's grammar summary, examples and vocabulary.
    An Arabic teacher must check every right answer, every wrong option and every
    transliteration before students see them. The exercises use the summary spellings
    (עלשוגל, חכית, סחית, כנת אלעב כורת קדם).
  - >-
    The notebook lists four goals (past actions, questions in the past, simple
    memories, childhood). They were grouped into two skills: "actions, memories and
    habits in the past" and "questions in the past".
  - >-
    Clear typos fixed: "חזאאא גדיד" → "חזאא ג'דיד" (Activity 3, sentence 3);
    "בּסנהאיֶת" → "בּנהאיֶת" (Activity 1, question 6, as in warm-up 4); "ק'ַדם" (patah
    on the geresh) → "קַ'דם" (short explanation); the space before "?" in several
    questions was removed.
  - >-
    Warm-up questions 1–2 are written "עמֶלֶת\\ י" and "אכֶּלֶת\\ י" (masculine / feminine
    "you"). They were rendered "עמֶלֶת(י)" and "אכֶּלֶת(י)". Warm-up 6 had a colon list
    ("…מושׁתריאת : אואעי- אר'ראד' ללבית, …"); it became "…מושׁתריאת? (אואעי, אר'ראד'
    ללבית…)". Please check.
  - >-
    Not corrected, please decide: many words have several spellings in the cycle:
    work עלשוגל / עלשור'ל / עלשור'ול / עשור'ול; small זר'יר / זע'יר; was כנת / כּונת /
    כּונֶת; morning אלס'ובח / אלס'ובֶּח / אלצבח / אלס'בח; watched חד'רת / חדרת; friend
    ס'אחבי / סאחבי / צאחבי; series מסלסל / מוסלסל; week אלוסבוע / אלאוסבוע; past
    אלמאדי / אלמאד'י; bread ח'בז / ח'ובֶּז; at night בֶּלּיל / בֶּליל / באלליל; woke up סחית /
    ס'חית; then בעדין / באדין (both in the summary, "אחר כך" / "ואז"). The closing
    question "שו תעלמת אליום?" may be missing a letter or a shadda.
  - >-
    Vocabulary glosses kept as in the notebook, please check: "תעמל – עושה", "תלעב –
    משחק", "תעיש – גר", "תסאפר – נוסע / מטייל", "תחב – אוהב" are second-person (or
    she) forms, glossed like general verbs. "שריכי / שריכתי" (partner) are used in the
    activities and summary but are not in the vocabulary list; they were added at the
    end. Please confirm.
  - >-
    Times: opening 5 minutes in the activity (the lesson plan says 10), warm-up 15,
    each main activity 25 (with step times). The teacher chooses up to two main
    activities, as the notebook says. The "תלמיד 1/2/3" answer lines were removed (the
    platform has answer boxes). Quizlet link kept without its "?i=…&x=…" parameters.
  - >-
    Homework type 2 says "send all the answers to Mori" but gives no message to send;
    no Mori message was invented, only the instruction was kept. The type 1 Mori
    messages are in Hebrew in the notebook and were kept in Hebrew.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: my-life-in-the-past-class
    title: 'שיעור: החיים שלי בעבר'
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: החיים שלי בעבר
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: פעולות, זיכרונות והרגלים בעבר
            description: 'פועל בעבר (רוחת, אכלת, שרבת, חכית, חדרת), ביטויי זמן (אמבארח, זמאן, קבל יומין), רצף פעולות (בעדין, בֶּלּיל) והרגלים בעבר: כנת + פועל.'
          - name: שאלות בעבר
            description: 'מילת שאלה + פועל בעבר: שו עמלת אמבארח? וין רוחת? מע מין חכית? אימתא סחית?'
      - id: quizlet
        type: externalLink
        lang: he
        label: החיים שלי בעבר בקוויזלט
        url: https://quizlet.com/il/1161621806/%D7%94%D7%97%D7%99%D7%99%D7%9D-%D7%A9%D7%9C%D7%99-%D7%91%D7%A2%D7%91%D7%A8-%D7%97%D7%99%D7%90%D7%AA%D7%99-%D7%A4%D7%99-%D7%90%D7%9C%D7%9E%D7%90%D7%93%D7%99-%D7%A2%D7%A8%D7%91%D7%99%D7%AA-%D7%9E%D7%93%D7%95%D7%91%D7%A8%D7%AA-%D7%A8%D7%9E%D7%94-2-flash-cards/
      - id: intro-title
        type: heading
        lang: he
        level: 3
        text: 'פתיחה – סבב היכרות'
      - id: intro
        type: sentenceFrame
        frame: 'אנא ___, אמבארח ___'
        example: |-
          אנא אינאס, אמבארח אכֶּלת פיצה פי לבית
          אנא שרבת קהוה
          אנא רוחת עשור'ול
          אנא חכּית מע ס'אחבי
      - id: warmup-title
        type: heading
        lang: he
        level: 3
        text: שאלות חימום
      - id: warmup
        type: discussionQuestions
        items:
          - question: 'שו עמֶלֶת(י) אמבארח?'
          - question: "שו אכֶּלֶת(י) אאחֶ'ר וג'בֶּה?"
          - question: "שו חד'רֶת אלאוסבוע אלמאד'י? פילֶם / מוסלסל / ברנאמֶג'…"
          - question: 'שו עמלת בֶּנהאיֶת אלאוסְבּוע?'
          - question: 'מע מין חכּית אמבארח וען שו?'
          - question: "שו אשתַרית אחֶ'ר מרָּה למּא עמלֶת מושׁתריאת? (אואעי, אר'ראד' ללבית…)"
          - question: "שו הי אדֶ'כּרא אלי בּחיאתַכְּ ען אלעילֶה?"
      - id: explain-title
        type: heading
        lang: he
        level: 3
        text: 'הסבר קצר – עבר בערבית מדוברת'
      - id: explain-complete-how
        type: text
        lang: he
        text: השלימו את המשפטים הבאים.
      - id: explain-complete
        type: discussionQuestions
        items:
          - question: "רוחת עלג'אמעה ___"
          - question: 'אַכֶּלת פיצה ___'
          - question: 'שרבֶּת קהוה ___'
      - id: explain-build-how
        type: text
        lang: he
        text: הרכיבו משפט עם כל אחד מביטויי הזמן.
      - id: explain-build
        type: discussionQuestions
        items:
          - question: 'אמבארח ___'
          - question: "אלוסבוע אלמאד'י ___"
          - question: "ק'בֶּל יומין ___"
          - question: 'זמאן ___'
      - id: explain-habits
        type: ruleSummary
        lang: he
        skill: הרגלים בעבר
        rules:
          - text: 'מבנה: **כנת + פועל**'
            examples:
              - "למא כנת זר'יר כּונֶת אלעב כּורֶת קַ'דם"
      - id: activities-title
        type: heading
        lang: he
        level: 3
        text: פעילויות
      - id: act1
        type: classActivity
        lang: he
        title: 'פעילות 1: ראיון אישי'
        skills: [שאלות בעבר, 'פעולות, זיכרונות והרגלים בעבר']
        minutes: 25
        steps:
          - 'ראיון בזוגות (10 דקות): תלמיד א׳ שואל את בן הזוג **לפחות 5 שאלות** על העבר (מהרשימה שלמטה). אחר כך מחליפים תפקידים.'
          - 'שאלות המשך (5 דקות): מוסיפים **לפחות שתי שאלות המשך** עם שו, וין, אימתא, מע מין, ליש.'
          - 'דיווח לכיתה (10 דקות): כל תלמיד מספר **2–3 דברים על בן הזוג שלו**, עם שריכי / שריכתי.'
        example: |-
          שו עמלת אמבארח? – רוחת עלשוגל.
          אימתא רוחת עלשוגל? מע מין רוחת?
          שריכי ראח עלשור'ל אמבארח. בעדין אכַּל מע אלעילה. בלּיל חדֶ'ר מוסלסל.
      - id: act1-questions-title
        type: heading
        lang: he
        level: 4
        text: שאלות אפשריות
      - id: act1-questions
        type: discussionQuestions
        answerable: false
        items:
          - question: 'שו עמלת אמבארח?'
          - question: 'וין רוחת אמבארח?'
          - question: 'מע מין חכּית אמבארח?'
          - question: "שו אכּלֶת אאח'ר וג'בה?"
          - question: "שו חד'רת אלאוסבּוע אלמאד'י?"
          - question: "מע מין אלתק'ית בּנהאיֶת אלאוסבוע?"
          - question: "וינתא ס'חית אמבארח?"
          - question: 'מע מין סהרֶת אמבארח בלּיל?'
          - question: "שו אשׁתרית אחֶ'ר מרה רוחת עסּוק'?"
          - question: "וין אכלת אאח'ר וג'בה?"
      - id: act2
        type: classActivity
        lang: he
        title: 'פעילות 2: היומן של אתמול'
        skills: ['פעולות, זיכרונות והרגלים בעבר', שאלות בעבר]
        minutes: 25
        steps:
          - "כתיבה אישית (5 דקות): כל תלמיד כותב **4 משפטים קצרים על אתמול**, במבנה אמבארח + פעולה. אפשר להשתמש גם ב־בעדין, בֶּלּיל, אלס'ובֶּח."
          - 'ראיון בזוגות (10 דקות): כל תלמיד מקריא את היומן שלו, ובן הזוג שואל **לפחות שתי שאלות על כל משפט**.'
          - 'דיווח לכיתה (10 דקות): כל תלמיד מספר **3 דברים על בן הזוג שלו**, עם שריכי / שריכתי.'
        example: |-
          אמבארח שרבת קהוה. – וין שרבת אלקהוה? מע מין שרבת קהוה? וינתא שרבת אלקהוה?
          בֶּלּיל חדרת מסלסל. – שו אלמוסלסל? מע מין חדרת? ליש חדרת אלמוסלסל?
          שריכי שרב קהוה אלצבח. בעדין ראח עלשוגל. באלליל חדר מסלסל מע אלעילה.
      - id: act2-diary-title
        type: heading
        lang: he
        level: 4
        text: היומן שלי
      - id: act2-diary
        type: discussionQuestions
        items:
          - question: 'אמבארח ___'
            frame: 'אמבארח שרבת קהוה.'
          - question: 'בעדין ___'
            frame: 'בעדין רוחת עלשוגל.'
          - question: 'בעדין ___'
            frame: 'בעדין אכלת מע אלעילה.'
          - question: 'באלליל ___'
            frame: 'באלליל חדרת מסלסל.'
      - id: act3
        type: classActivity
        lang: he
        title: 'פעילות 3: משחק השאלות'
        skills: [שאלות בעבר]
        minutes: 25
        steps:
          - 'המורה קורא **משפט אחד בלבד** (התשובה) ובוחר תלמיד.'
          - 'התלמיד צריך להגיד **מה השאלה המתאימה למשפט**.'
          - 'אם התלמיד צדק – הוא בוחר את התלמיד הבא. אם לא הצליח – תלמיד אחר יכול לנסות.'
        example: |-
          אמבארח אכלת ח'ובֶּז וקהוה.
          שו אכלת אמבארח?
      - id: act3-sentences-title
        type: heading
        lang: he
        level: 4
        text: משפטים לתרגול
      - id: act3-sentences
        type: discussionQuestions
        items:
          - question: "אמבארח אכלת ח'בז וקהוה."
          - question: "חד'רת פילם מע אח'וי אלאוסבוע אלמאד'י."
          - question: "אשתרית חזאא ג'דיד יום אלג'ומעה."
          - question: 'דרסת אסבאני סאעתין אמבארח.'
          - question: "אלתקינא מע אס'חאבנא פי אלחדיקה."
          - question: 'סחית אסאעה סבעה אמבארח.'
          - question: "רוחת עלשור'ול ק'בֶּל תלת איּאם."
          - question: 'שרבת קהוה מע סאחבתי.'
          - question: 'חכית מע אמי בטלפון אמבארח.'
      - id: act4
        type: classActivity
        lang: he
        title: 'פעילות 4: כשהייתי ילד'
        skills: ['פעולות, זיכרונות והרגלים בעבר', שאלות בעבר]
        minutes: 25
        steps:
          - 'ראיון בזוגות (10 דקות): תלמיד א׳ שואל את כל השאלות שלמטה ותלמיד ב׳ עונה. אחר כך מחליפים תפקידים.'
          - 'שאלות המשך (5 דקות): שואלים **לפחות שתי שאלות נוספות** על כל תשובה, עם ליש, מע מין, וין, אימתא.'
          - 'דיווח לכיתה (10 דקות): כל תלמיד מספר **2–3 דברים על בן הזוג שלו**. אפשר להפוך את התשובות **לסיפור קטן על הילדות**.'
        example: |-
          שו כנת תעמל באלעוטלה למא כנת זע'יר?
          כנת אלעב כורת קדם.
          מע מין כנת תלעב? וין כנת תלעב? ליש כנת תחב כורת קדם?
      - id: act4-questions-title
        type: heading
        lang: he
        level: 4
        text: שאלות לראיון
      - id: act4-questions
        type: discussionQuestions
        answerable: false
        items:
          - question: 'וין סאפרת אול מרה בחיאתכ?'
          - question: "שו כאן אול פילם חד'רתו בסינמא?"
          - question: "שו כּונת תעמל באלעוטלה למא כנת זר'יר?"
          - question: 'וין כנת תרוח למּא כּונת תֶזעַל?'
          - question: 'שו כּונֶת תחֶב תעמל מע אלעילה?'
    teacherNotes:
      - id: n-plan
        anchor: null
        minutes: 90
        text: 'רמה A2, 90 דקות. בחרו **עד שתי פעילויות מרכזיות** מתוך הרשימה. מבנה השיעור: פתיחה 10 דקות, הסבר קצר 10 דקות, פעילות מרכזית 1 – 25 דקות, פעילות מרכזית 2 – 25 דקות, סיכום ודיבור חופשי 20 דקות.'
      - id: n-intro
        anchor: intro
        minutes: 5
        text: 'כל תלמיד אומר את שמו ודבר אחד שעשה אתמול.'
      - id: n-warmup
        anchor: warmup
        minutes: 15
        text: המורה שואל את התלמידים. שאלו כל תלמיד לפחות שתי שאלות.
      - id: n-act1
        anchor: act1
        text: "טיפ: כדי לעודד יותר דיבור, שאלו גם אם משהו ממה ששמעו היה **מפתיע או מעניין**. כך התלמידים מוסיפים משפט, למשל: ״שריכי ראח עלשור'ל אמבארח, והו כאן תעבאן שוי.״"
      - id: n-act2
        anchor: act2
        text: 'טיפ: בקשו מהתלמידים להשתמש במילות השאלה שו, וין, וינתא, מע מין, ליש – כך כל משפט יכול להפוך לשיחה קצרה.'
      - id: n-act3
        anchor: act3
        text: 'טיפ: עודדו מילות שאלה שונות (שו, מין, וין, וינתא, ליש). לאותה תשובה יכולה להיות **יותר משאלה נכונה אחת**. למשל, ל״שרבת קהוה מע סאחבתי.״ אפשר לשאול: שו שרבת? מע מין שרבת קהוה? אימתא שרבת קהוה?'

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: my-life-in-the-past-summary
    title: סיכום השיעור
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'סיכום דקדוקי – החיים שלי בעבר'
      - id: intro
        type: text
        lang: he
        text: 'בשיעור זה למדנו איך לדבר על **דברים שקרו בעבר** בערבית מדוברת. יש שתי דרכים מרכזיות לדבר על העבר.'
      - id: rules-past
        type: ruleSummary
        lang: he
        skill: '1. פועל בעבר'
        rules:
          - text: 'משתמשים בעבר כדי לדבר על פעולה **שהסתיימה**. מבנה בסיסי: פועל בעבר.'
      - id: ex-past
        type: examples
        items:
          - { text: "רוחת עלג'אמעה.", gloss: הלכתי לאוניברסיטה. }
          - { text: אכלת פיצה., gloss: אכלתי פיצה. }
          - { text: שרבת קהוה., gloss: שתיתי קפה. }
          - { text: חכית מע סאחבי., gloss: דיברתי עם חבר שלי. }
          - { text: חדרת מסלסל., gloss: ראיתי סדרה. }
      - id: rules-questions
        type: ruleSummary
        lang: he
        skill: '2. שאלות בעבר'
        rules:
          - text: 'כדי לשאול על פעולה בעבר משתמשים לרוב ב**מילת שאלה + פועל בעבר**.'
            examples:
              - 'שו = מה'
              - 'וין = איפה'
              - 'אימתא = מתי'
              - 'מע מין = עם מי'
              - 'ליש = למה'
      - id: ex-questions
        type: examples
        items:
          - { text: 'שו עמלת אמבארח?', gloss: 'מה עשית אתמול?' }
          - { text: 'וין רוחת אמבארח?', gloss: 'לאן הלכת אתמול?' }
          - { text: 'מע מין חכית אמבארח?', gloss: 'עם מי דיברת אתמול?' }
          - { text: 'אימתא סחית אמבארח?', gloss: 'מתי קמת אתמול?' }
      - id: time-words
        type: table
        lang: he
        caption: '3. ביטויי זמן בעבר'
        header: [ערבית מדוברת, עברית]
        rows:
          - [אמבארח, אתמול]
          - [אלוסבוע אלמאדי, שבוע שעבר]
          - [קבל יומין, לפני יומיים]
          - [זמאן, מזמן]
          - [סנת אלפין ועשרין, בשנת 2020]
      - id: ex-time
        type: examples
        items:
