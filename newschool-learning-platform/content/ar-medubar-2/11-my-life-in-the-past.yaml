activities:
  - slug: my-life-in-the-past-actions
    title: פעולות, זיכרונות והרגלים בעבר
    minutes: 8
    items:
      - id: verbs
        type: matching
        lang: he
        prompt: התאימו כל פועל בעבר לפירוש שלו.
        pairs:
          - [רוחת, הלכתי]
          - [אכלת, אכלתי]
          - [שרבת, שתיתי]
          - [חכית, דיברתי]
          - [אשתרית, קניתי]
      - id: time-words
        type: matching
        lang: he
        prompt: התאימו כל ביטוי זמן לפירוש שלו.
        pairs:
          - [אמבארח, אתמול]
          - [אלוסבוע אלמאדי, שבוע שעבר]
          - [קבל יומין, לפני יומיים]
          - [זמאן, מזמן]
          - [בֶּלּיל, בלילה]
      - id: coffee
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״אתמול שתיתי קפה.״?'
        options:
          - { text: אמבארח שרבת קהוה., correct: true }
          - { text: אמבארח אכלת קהוה., feedback: 'אכלת פירושו ״אכלתי״. ״שתיתי״ זה שרבת.' }
          - { text: זמאן שרבת קהוה., feedback: 'זמאן פירושו ״מזמן״. ״אתמול״ זה אמבארח.' }
      - id: habit-football
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״הייתי משחק כדורגל״ (הרגל בעבר)?'
        options:
          - { text: כנת אלעב כורת קדם, correct: true }
          - { text: אלעב כורת קדם, feedback: 'חסר כנת. הרגל בעבר: כנת + פועל.' }
          - { text: כנת אדרס כל יום, feedback: 'זה ״הייתי לומד כל יום״.' }
      - id: lived-haifa
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״גרתי בחיפה״?'
        options:
          - { text: כנת אסכן פי חיפה., correct: true }
          - { text: כנת אסאפר מע אלעילה., feedback: 'זה ״הייתי נוסע עם המשפחה״.' }
          - { text: כנת אדרס כל יום., feedback: 'זה ״הייתי לומד כל יום״.' }
      - id: habit-rule
        type: trueFalse
        lang: he
        prompt: 'כדי לדבר על דברים שעשינו בעבר באופן קבוע משתמשים במבנה כנת + פועל.'
        answer: true
        feedback:
          correct: 'נכון! למשל: כנת אדרס כל יום (הייתי לומד כל יום).'
          incorrect: 'זה נכון: הרגל בעבר = כנת + פועל, למשל כנת אסכן פי חיפה.'
      - id: partner
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״בן הזוג שלי הלך לעבודה אתמול״?'
        options:
          - { text: שריכי ראח עלשוגל אמבארח., correct: true }
          - { text: שריכתי ראח עלשוגל אמבארח., feedback: 'שריכתי פירושו ״בת הזוג שלי״.' }
          - {
              text: שריכי רוחת עלשוגל אמבארח.,
              feedback: 'רוחת פירושו ״הלכתי״. על אדם אחר אומרים ראח.',
            }
      - id: order-work
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״אתמול הלכתי לעבודה.״'
        sentence: אמבארח רוחת עלשוגל

