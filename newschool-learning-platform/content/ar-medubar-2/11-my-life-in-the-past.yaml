      - id: sequence
        type: table
        lang: he
        caption: '4. רצף פעולות בעבר'
        header: [ערבית מדוברת, עברית]
        rows:
          - [בעדין, אחר כך]
          - [באדין, ואז]
          - [באלליל, בלילה]
          - ["אלס'ובח", בבוקר]
      - id: ex-sequence
        type: sentenceFrame
        answerable: false
        frame: |-
