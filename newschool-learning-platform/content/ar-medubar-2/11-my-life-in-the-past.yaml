      - id: q-talked
        type: multipleChoice
        lang: he
        prompt: 'התשובה היא: חכית מע אמי בטלפון אמבארח. מה השאלה המתאימה?'
        options:
          - { text: 'מע מין חכית אמבארח?', correct: true }
          - { text: 'שו אכלת אמבארח?', feedback: 'התשובה אומרת עם מי דיברת, לא מה אכלת.' }
          - { text: 'וין רוחת אמבארח?', feedback: 'התשובה אומרת עם מי דיברת, לא לאן הלכת.' }
      - id: q-woke
        type: multipleChoice
        lang: he
        prompt: 'התשובה היא: סחית אסאעה סבעה אמבארח. מה השאלה המתאימה?'
        options:
          - { text: 'אימתא סחית אמבארח?', correct: true }
          - { text: 'וין רוחת אמבארח?', feedback: 'התשובה אומרת מתי קמת (בשבע), לא לאן הלכת.' }
          - { text: 'מע מין חכית אמבארח?', feedback: 'התשובה אומרת מתי קמת, לא עם מי דיברת.' }
      - id: imta
        type: trueFalse
