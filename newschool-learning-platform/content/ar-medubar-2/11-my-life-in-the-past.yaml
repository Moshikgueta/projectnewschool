          incorrect: 'לא נכון: אימתא = מתי. ״איפה״ זה וין.'
      - id: order-with-whom
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״עם מי דיברת אתמול?״'
        sentence: 'מע מין חכית אמבארח?'
