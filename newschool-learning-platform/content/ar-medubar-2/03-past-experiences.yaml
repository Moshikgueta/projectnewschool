activities:
  - slug: past-experiences-yesterday
    title: 'מה עשית אתמול? עבר ומילות זמן'
    minutes: 8
    items:
      - id: verbs
        type: matching
        lang: he
        prompt: התאימו כל פועל בעבר לפירוש שלו.
        pairs:
          - ['רחת', 'הלכתי']
          - ['אכלת', 'אכלתי']
          - ['טבּחת', 'בישלתי']
          - ['סאפרת', 'נסעתי']
          - ['כנת', 'הייתי']
      - id: went-work
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״אתמול הלכתי לעבודה.״?'
        options:
          - { text: 'אמבארח רחת עלא אלשוגל.', correct: true }
          - {
              text: 'אלוּסבוע אלמאדי רחת עלא אלשוגל.',
              feedback: 'אלוּסבוע אלמאדי פירושו ״שבוע שעבר״. ״אתמול״ זה אמבארח.',
            }
          - { text: 'אמבארח שאחדת פילם.', feedback: 'זה ״אתמול ראיתי סרט״.' }
      - id: last-week
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״שבוע שעבר״?'
        options:
          - { text: 'אלוּסבוע אלמאדי', correct: true }
          - { text: 'א-שהר אלמאדי', feedback: 'א-שהר אלמאדי פירושו ״חודש שעבר״.' }
          - { text: 'אמבארח', feedback: 'אמבארח פירושו ״אתמול״.' }
      - id: where-went
        type: multipleChoice
        lang: he
        prompt: 'בן הזוג אומר: ״אמבארח אנא רחת עלא אלשוגל.״ איך שואלים ״לאן הלכת?״'
        options:
          - { text: 'וֵין רחת?', correct: true }
          - { text: 'שו אכלת?', feedback: 'זה ״מה אכלת?״' }
          - { text: 'מע מין כנת?', feedback: 'זה ״עם מי היית?״' }
      - id: at-home
        type: multipleChoice
        lang: he
        prompt: 'שואלים אתכם: ״וֵין כנת?״ (איפה היית?). איך עונים ״הייתי בבית״?'
        options:
          - { text: 'כנת בלבית.', correct: true }
          - { text: 'רחת עלא אלבית.', feedback: 'זה ״הלכתי הביתה״.' }
          - { text: 'שאחדת בלבית.', feedback: 'זה ״ראיתי (צפיתי) בבית״.' }
      - id: then
        type: multipleChoice
        lang: he
        prompt: 'מה פירוש ״בעדין״?'
        options:
          - { text: 'ואז', correct: true }
          - { text: 'כי', feedback: '״כי״ זה לאן.' }
          - { text: 'אתמול', feedback: '״אתמול״ זה אמבארח.' }
      - id: me-too
        type: multipleChoice
        lang: he
        prompt: 'בן הזוג ראה סרט אתמול, וגם אתם. איך אומרים ״גם אני ראיתי סרט״?'
        options:
          - { text: 'אנא כמן שאחדת פילם.', correct: true }
          - { text: 'בס אנא מא אכלת פיצה.', feedback: 'זה ״אבל אני לא אכלתי פיצה״.' }
          - { text: 'אנא אכלת שי תאני.', feedback: 'זה ״אני אכלתי משהו אחר״.' }
      - id: order-pizza
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״אתמול אני אכלתי פיצה.״'
        sentence: 'אמבארח אנא אכלת פיצה'

  - slug: past-experiences-ever
    title: 'מררה, ולא מררה, אכר מררה'
    minutes: 8
    items:
      - id: words
        type: matching
        lang: he
        prompt: התאימו כל ביטוי לפירוש שלו.
        pairs:
          - ['מררה', 'פעם']
          - ['ולא מררה', 'אף פעם']
          - ['עומרי', 'בחיים שלי']
          - ['אכר מררה', 'הפעם האחרונה']
      - id: never-sushi
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״אף פעם לא אכלתי סושי.״?'
        options:
          - { text: 'אנא ולא מררה אכלת סושי.', correct: true }
          - { text: 'אנא מררה אכלת סושי.', feedback: 'מררה פירושו ״פעם״. ״אף פעם״ זה ולא מררה.' }
          - { text: 'אכר מררה אכלת סושי.', feedback: 'אכר מררה פירושו ״הפעם האחרונה״.' }
      - id: once-paris
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״פעם הייתי בפריז.״?'
        options:
          - { text: 'מררה כנת בפאריס.', correct: true }
          - { text: 'ולא מררה כנת בפאריס.', feedback: 'ולא מררה פירושו ״אף פעם״.' }
          - { text: 'אכר מררה כנת בפאריס.', feedback: 'אכר מררה פירושו ״הפעם האחרונה״.' }
      - id: last-film
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״הפעם האחרונה שראיתי סרט הייתה אתמול.״?'
        options:
          - { text: 'אכר מררה שאחדת פילם כאן אמבארח.', correct: true }
          - {
              text: 'אכר מררה שאחדת פילם כאן אלוּסבוע אלמאדי.',
              feedback: 'כאן כתוב ״שבוע שעבר״ (אלוּסבוע אלמאדי). ״אתמול״ זה אמבארח.',
            }
          - { text: 'אנא ולא מררה שאחדת פילם.', feedback: 'זה ״אף פעם לא ראיתי סרט״.' }
      - id: i-did
        type: multipleChoice
        lang: he
        prompt: 'חבר אומר: ״אנא ולא מרָּה אכלת סושי.״ אתם כן אכלתם סושי. מה אומרים?'
        options:
          - { text: 'אנא אכלת!', correct: true }
          - { text: 'ולא אנא!', feedback: 'זה ״גם אני לא!״ – כשגם אתם לא עשיתם.' }
          - { text: 'אנא כמן ולא מררה!', feedback: 'זה ״גם אני אף פעם לא!״ – כשגם אתם לא עשיתם.' }
      - id: no-new-tense
        type: trueFalse
        lang: he
        prompt: 'כדי לדבר על חוויות חיים (פעם / אף פעם / הפעם האחרונה) צריך בערבית מדוברת זמן חדש.'
        answer: false
        feedback:
          correct: 'נכון! אין זמן חדש: זה אותו עבר, רק עם המילים מררה / ולא מררה / אכר מררה.'
          incorrect: 'לא: אין זמן חדש. זה אותו עבר, רק עם מילים שמסבירות איך ומתי.'
      - id: last-year
        type: multipleChoice
        lang: he
        prompt: '״הפעם האחרונה שנסעתי הייתה בשנה שעברה.״ – אכר מררה סאפרת כאן ___'
        options:
          - { text: 'א-סנה אלמאדיה', correct: true }
          - { text: 'אמבארח', feedback: 'אמבארח פירושו ״אתמול״.' }
          - { text: 'א-שהר אלמאדי', feedback: 'א-שהר אלמאדי פירושו ״חודש שעבר״.' }
      - id: order-cooked
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״הפעם האחרונה שבישלתי הייתה אתמול.״'
        sentence: 'אכר מררה טבּחת כאן אמבארח'
