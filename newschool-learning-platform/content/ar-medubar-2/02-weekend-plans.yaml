activities:
  - slug: weekend-plans-future
    title: 'עתיד: רַח + פועל'
    minutes: 8
    items:
      - id: verbs
        type: matching
        lang: he
        prompt: התאימו כל פועל לפירוש שלו.
        pairs:
          - ['ארתאח', 'לנוח']
          - ['אנאם', 'לישון']
          - ['אאכל', 'לאכול']
          - ['אטלע', 'לצאת']
          - ['אחדר', 'לראות / לצפות']
      - id: will-travel
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״אני אסע״?'
        options:
          - { text: 'אנא רַח אסאפר', correct: true }
          - { text: 'אנא אסאפר', feedback: 'חסר רַח. בעתיד תמיד שמים רַח לפני הפועל.' }
          - { text: 'אחנא ראח נטלע', feedback: 'זה ״אנחנו נלך לצאת״.' }
      - id: he-sleep
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״הוא הולך לישון״?'
        options:
          - { text: 'הו ראח ינאם', correct: true }
          - { text: 'אנא ראח אנאם', feedback: 'זה ״אני הולך לישון״.' }
          - { text: 'הו ראח ירוח', feedback: 'ירוח פירושו ״ילך״, לא ״יישן״.' }
      - id: rule
        type: trueFalse
        lang: he
        prompt: 'בערבית מדוברת מבטאים עתיד בעזרת המילה ״רַח״ לפני הפועל, בלי לשנות את זמן הפועל.'
        answer: true
        feedback:
          correct: 'נכון! ראח + פועל: אנא ראח ארוח, הו ראח ינאם.'
          incorrect: 'זה נכון: כל עתיד עובד ככה – ראח + פועל.'
      - id: must
        type: multipleChoice
        lang: he
        prompt: 'מה פירוש ״לאזם״?'
        options:
          - { text: 'חייב', correct: true }
          - { text: 'אפשר', feedback: '״אפשר״ זה מומכן.' }
          - { text: 'כדאי', feedback: '״כדאי״ זה אחסן.' }
      - id: mountain
        type: multipleChoice
        lang: he
        prompt: '״ביום שבת אתה חייב לעלות להר.״ – יום אלסבת ___ תטלע עלא אלג׳בל.'
        options:
          - { text: 'לאזם', correct: true }
          - { text: 'מומכן', feedback: 'מומכן פירושו ״אפשר״. ״חייב״ זה לאזם.' }
          - { text: 'אחסן', feedback: 'אחסן פירושו ״כדאי״. ״חייב״ זה לאזם.' }
      - id: tourist
        type: multipleChoice
        lang: he
        prompt: 'התייר שואל: ״טוב, מה אני אעשה ביום חמישי?״'
        options:
          - { text: 'טייב, שו ראח אעמל יום אלח׳מיס?', correct: true }
          - {
              text: 'שו ראח תעמל יום אלסבת?',
              feedback: 'זה ״מה אתה תעשה ביום שבת?״ – גוף אחר ויום אחר.',
            }
          - { text: 'וליש לאזם ארוח הונאכ?', feedback: 'זה ״ולמה אני חייב ללכת לשם?״' }
      - id: order-rest
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״אני אנוח בבית.״'
        sentence: 'אנא ראח ארתאח בלבית'

  - slug: weekend-plans-compare
    title: 'השוואות: אחסן מן, אמתע מן'
    minutes: 8
    items:
      - id: words
        type: matching
        lang: he
        prompt: התאימו כל מילה לפירוש שלה.
        pairs:
          - ['אחסן מן', 'יותר טוב מ']
          - ['אמתע מן', 'יותר כיף מ']
          - ['אכתר', 'יותר']
          - ['אקל', 'פחות']
          - ['אהדא', 'הכי רגוע']
      - id: worst
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״זה הכי גרוע״?'
        options:
          - { text: 'האדה אסוא', correct: true }
          - { text: 'האדה אהדא', feedback: 'אהדא פירושו ״הכי רגוע״.' }
          - { text: 'האדה אחלא', feedback: 'אחלא פירושו ״הכי טוב״.' }
      - id: home-better
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״הבית יותר טוב מטיול.״?'
        options:
          - { text: 'אלבית אחסן מן אלסאפר.', correct: true }
          - {
              text: 'אלבית אמתע מן אלסאפר.',
              feedback: 'אמתע מן פירושו ״יותר כיף מ״. ״יותר טוב מ״ זה אחסן מן.',
            }
          - {
              text: 'אלסאפר אחסן מן אלבית.',
              feedback: 'זה ״הטיול יותר טוב מהבית״ – הפוך. קודם אומרים את הדבר שהוא יותר טוב.',
            }
      - id: evening-fun
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״הערב יותר כיף מהבוקר.״?'
        options:
          - { text: 'אלמסא אמתע מן א-סבח.', correct: true }
          - { text: 'אלמסא אהדא מן א-סבח.', feedback: 'אהדא פירושו ״רגוע יותר״, לא ״כיף יותר״.' }
          - { text: 'א-סבח אמתע מן אלמסא.', feedback: 'זה ״הבוקר יותר כיף מהערב״ – הפוך.' }
      - id: less-boring
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״זה פחות משעמם״?'
        options:
          - { text: 'האדה אקל מלל', correct: true }
          - { text: 'האדה אכתר מלל', feedback: 'אכתר פירושו ״יותר״. ״פחות״ זה אקל.' }
          - { text: 'האדה אסוא', feedback: 'אסוא פירושו ״הכי גרוע״.' }
      - id: more-less
        type: trueFalse
        lang: he
        prompt: '״אכתר״ פירושו ״פחות״.'
        answer: false
        feedback:
          correct: 'נכון! אכתר = יותר, ו״פחות״ זה אקל.'
          incorrect: 'לא בדיוק: אכתר = יותר, ו״פחות״ זה אקל.'
      - id: evening-more
        type: multipleChoice
        lang: he
        prompt: '״אני אוהב את הערב יותר מהבוקר.״ – אנא בחב אלמסא ___ מן א-סבח.'
        options:
          - { text: 'אכתר', correct: true }
          - { text: 'אקל', feedback: 'אקל פירושו ״פחות״.' }
          - { text: 'אחלא', feedback: 'אחלא פירושו ״הכי טוב״.' }
      - id: order-trip
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״הטיול יותר כיף מהבית.״'
        sentence: 'אלסאפר אמתע מן אלבית'
