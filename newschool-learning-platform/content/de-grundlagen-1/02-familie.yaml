vocabulary:
  - slug: familie
    title: Familie
    items: *familie-words

activities:
  - slug: familie-possessiv
    title: 'Possessivpronomen: mein, dein, sein, ihr, unser'
    minutes: 8
    items:
      - id: meine-mutter
        type: multipleChoice
        prompt: Das ist ___ Mutter. (ich)
        options:
          - { text: meine, correct: true }
          - { text: mein, feedback: '*Mutter* ist ein *die*-Wort: wir sagen *meine Mutter*.' }
          - { text: deine, feedback: '*deine* gehört zu *du*. Für *ich* sagen wir *mein / meine*.' }
      - id: sein-vater
        type: multipleChoice
        prompt: Sam kocht sehr gut. ___ Vater ist auch ein großartiger Koch.
        options:
          - { text: Sein, correct: true }
          - { text: Ihr, feedback: 'Sam ist ein Mann (er): wir sagen *sein*.' }
          - { text: Seine, feedback: '*Vater* ist ein *der*-Wort: wir sagen *sein Vater*.' }
      - id: ihre-mutter
        type: multipleChoice
        prompt: Hanna wohnt in Berlin. ___ Mutter macht die beste Lasagne.
        options:
          - { text: Ihre, correct: true }
          - { text: Seine, feedback: 'Hanna ist eine Frau (sie): wir sagen *ihr / ihre*.' }
          - { text: Ihr, feedback: '*Mutter* ist ein *die*-Wort: wir sagen *ihre Mutter*.' }
      - id: vor-nomen
        type: trueFalse
        prompt: 'Im Deutschen steht das Possessivpronomen vor dem Nomen: *meine Mutter*.'
        answer: true
        feedback:
          correct: Richtig! Zuerst *meine*, dann *Mutter*.
          incorrect: 'Anders als im Hebräischen steht das Possessivpronomen vor dem Nomen: *meine Mutter*.'
      - id: anna-sein
        type: trueFalse
        prompt: 'Der Satz *Anna und sein Bruder wohnen in Berlin.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! Anna ist eine Frau: *Anna und ihr Bruder*.'
          incorrect: 'Das Wort hängt von der Person ab. Anna ist eine Frau (sie): *ihr Bruder*.'
      - id: mein-meine
        type: fillBlank
        prompt: Ergänze *mein* oder *meine*.
        text: Das ist ___ Bruder. Das sind ___ Eltern.
        blanks: [[mein], [meine]]
        wordBank: [mein, meine]
      - id: person-possessiv
        type: matching
        prompt: Welches Possessivpronomen passt zu welcher Person?
        pairs:
          - [ich, mein / meine]
