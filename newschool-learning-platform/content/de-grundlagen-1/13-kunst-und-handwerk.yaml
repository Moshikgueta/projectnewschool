vocabulary:
  - slug: kunst-und-handwerk
    title: Kunst und Handwerk
    items: *kunst-und-handwerk-words

activities:
  - slug: kunst-und-handwerk-beschreiben
    title: 'Beschreibende Sätze: ist, sind und nicht'
    minutes: 8
    items:
      - id: bilder-sind
        type: multipleChoice
        prompt: Die Bilder ___ interessant.
        options:
          - { text: sind, correct: true }
          - { text: ist, feedback: '*Die Bilder* ist Plural: Man sagt *sind*.' }
          - { text: bin, feedback: '*bin* passt nur zu *ich*. *Die Bilder* ist Plural: *sind*.' }
      - id: katze-ist
        type: multipleChoice
        prompt: Die Katze ___ schwarz.
        options:
          - { text: ist, correct: true }
          - { text: sind, feedback: '*Die Katze* ist Einzahl: Man sagt *ist*.' }
          - { text: hat, feedback: 'Zum Beschreiben benutzt man *sein*: *Die Katze ist schwarz.*' }
      - id: nicht-wo
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Sie ist nicht müde., correct: true }
          - {
              text: Sie nicht ist müde.,
              feedback: '*nicht* steht nach *ist*: *Sie ist nicht müde.*',
            }
          - {
              text: Sie ist müde nicht.,
              feedback: '*nicht* steht nach *ist*, vor dem Adjektiv: *Sie ist nicht müde.*',
            }
      - id: ist-sind
        type: fillBlank
        prompt: Ergänze mit *ist* oder *sind*.
        text: Das Bild ___ dunkel. Die Farben ___ hell.
        blanks: [[ist], [sind]]
        wordBank: [ist, sind]
      - id: nicht
        type: fillBlank
        prompt: 'Sag „nein": Ergänze den Satz.'
        text: Der Himmel ist ___ blau.
        blanks: [[nicht]]
      - id: beschreiben-tun
        type: trueFalse
        prompt: '*Die Katze ist schwarz.* ist ein beschreibender Satz: Er sagt, wie die Katze ist.'
        answer: true
        feedback:
          correct: Richtig! Der Satz sagt nicht, was die Katze macht, sondern wie sie ist.
          incorrect: 'Der Satz beschreibt die Katze (*ist* + Adjektiv). Er sagt nicht, was sie macht.'
      - id: adjektive
        type: matching
        prompt: Verbinde jedes Adjektiv mit der Übersetzung.
        pairs:
          - [schön, יפה]
          - [dunkel, כהה]
          - [hell, בהיר]
          - [groß, גדול]
          - [alt, ישן]
      - id: ordne-bilder
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Die Bilder sind nicht modern.

  - slug: kunst-und-handwerk-praesens
    title: 'Handlungen im Präsens: ich male, du malst, er malt'
    minutes: 8
    items:
      - id: er-malt
        type: multipleChoice
        prompt: Er ___ ein Bild.
        options:
          - { text: malt, correct: true }
          - {
              text: male,
              feedback: '*male* passt zu *ich*. Mit *er* endet das Verb auf *-t*: *er malt*.',
            }
          - {
              text: malen,
              feedback: '*malen* passt zu *wir* oder *sie* (Plural). Mit *er* sagt man *malt*.',
            }
      - id: du-tanzt
        type: multipleChoice
        prompt: Du ___ sehr gut.
        options:
          - { text: tanzt, correct: true }
          - { text: tanze, feedback: '*tanze* passt zu *ich*. Mit *du* sagt man *tanzt*.' }
          - {
              text: tanzen,
              feedback: '*tanzen* passt zu *wir* oder *sie* (Plural). Mit *du* sagt man *tanzt*.',
            }
      - id: richtiger-satz
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Ich esse Pizza zu Hause., correct: true }
          - {
              text: Ich bin esse Pizza zu Hause.,
              feedback: 'Im Präsens brauchst du nur ein Verb, ohne *bin*: *Ich esse Pizza zu Hause.*',
            }
          - {
              text: Ich essen Pizza zu Hause.,
              feedback: 'Mit *ich* endet das Verb auf *-e*: *Ich esse Pizza zu Hause.*',
            }
      - id: endungen
        type: matching
        prompt: Verbinde die Person mit der richtigen Form von *malen*.
        pairs:
          - [ich, male]
          - [du, malst]
          - [er / sie / es, malt]
          - [wir, malen]
      - id: bilder-verben
        type: fillBlank
        prompt: Ergänze das Verb in der richtigen Form.
        text: Ein Mann ___ (trinken) Kaffee. Die Männer ___ (spielen) Karten.
        blanks: [[trinkt], [spielen]]
      - id: bauen-zeichnen
        type: fillBlank
        prompt: Ergänze das Verb in der richtigen Form.
        text: Du ___ (bauen) ein Haus. Wir ___ (zeichnen) einen Kreis.
        blanks: [[baust], [zeichnen]]
      - id: er-t
        type: trueFalse
        prompt: 'Mit *er / sie / es* endet das Verb auf *-t*: *Er malt. Sie tanzt.*'
        answer: true
        feedback:
          correct: Richtig! *er malt, sie tanzt, es spielt*.
          incorrect: 'Mit *er / sie / es* endet das Verb auf *-t*: *Er malt.*'
      - id: ordne-kaffee
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Ein Mann trinkt Kaffee.
