# Cycle "Wichtige Orte in der Stadt", converted from the German Foundations digital
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (German).
course: de-grundlagen-1
slug: wichtige-orte
title: Wichtige Orte in der Stadt
goal: Den Weg erklären und mit Präpositionen sagen, wo ein Ort ist.
position: 14
status: in_review

review:
  - >-
    The two workbook exercises ("Richtungen" and "Präpositionen") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's two
    skills, its summary rules and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Summary, skill 2: a rule was ADDED that after neben / vor / hinter / zwischen /
    in / an (question "Wo?") the article changes (der/das → dem, die → der), and
    that zum = zu dem, zur = zu der, im = in dem. The notebook only gives examples;
    the exercises use these forms, so please confirm the wording.
  - >-
    Warm-up question 2: the frame "Ich komme zu ___ mit ___" is not natural German;
    it is now "Ich fahre mit dem Bus / Auto zum / zur ___. / Ich gehe zu Fuß zum /
    zur ___."
  - >-
    Warm-up question 5: "Der nächste Supermarkt ist ___ (neben / vor) ___" is now
    "Der nächste Supermarkt ist neben / vor dem / der ___."
  - >-
    Activity 3: the frame "vor dem / vor der / vor dem …" (repeated "vor dem") is now
    "vor dem / vor der ___", and "Der Ort ist der/die/das ___" is now "Mein Ort ist
    der / die / das ___". "Tourismusbüro" in Activity 2 is now "Touristeninformation"
    (the activity's title).
  - >-
    Mori message: word order fixed ("Fragen über wichtige Orte stellen mit Richtungen
    und Präpositionen" → "Fragen über wichtige Orte mit Richtungen und Präpositionen
    stellen"). Extra practice 1 "Gib mir den Weg" (a literal translation) is now "Erklär
    mir den Weg"; both extra-practice tasks were written out as full messages to Mori.
  - >-
    Summary: "an = על" is kept but glossed "על (על הקיר)", because "an" is used for
    vertical surfaces (an der Wand). The Hebrew skill names in the summary headings
    were left out; the Hebrew glosses of geradeaus / links / rechts are kept.
  - >-
    Vocabulary: nouns now have their article (die Stadt, das Haus, …); "kommen" is
    glossed "לבוא / להגיע". Please confirm.
  - >-
    Activity 1 uses a town map ("Stadtplan") that is not in the notebook; the teacher
    shows one on screen (see the teacher note).
  - Activity times given as ranges (15–20 minutes) are recorded as 20 minutes.
  - >-
    The "Antwort Schüler 1/2/3" lines are replaced by the optional answer boxes
    (decision C2): students may type, and the teacher sees the group's answers.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: wichtige-orte-unterricht
    title: 'Unterricht: Wichtige Orte in der Stadt'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Wichtige Orte in der Stadt
      - id: skills
        type: cycleOverview
        skills:
          - name: Richtungen
            description: geradeaus, links, rechts · Wie komme ich zum / zur …?
          - name: Präpositionen
            description: in, an, neben, vor, hinter, zwischen
      - id: quizlet
        type: externalLink
        label: Wichtige Orte in der Stadt auf Quizlet
        url: https://quizlet.com/1114275346/%D7%A9%D7%99%D7%A8%D7%95%D7%AA%D7%99%D7%9D-%D7%97%D7%99%D7%95%D7%A0%D7%99%D7%99%D7%9D-%D7%9E%D7%A2%D7%95%D7%93%D7%9B%D7%9F-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Vorstellungsrunde
      - id: intro
        type: sentenceFrame
        frame: Ich bin ___. Ich wohne nah bei / weit von der New School.
        example: Ich bin Daniel. Ich wohne nah bei der New School.
      - id: warmup-title
        type: heading
        level: 3
        text: Aufwärmfragen
      - id: warmup
        type: discussionQuestions
        items:
          - question: Welche Orte sind neben deinem Haus?
            frame: |-
              Es gibt einen / eine / ein ___ neben meinem Haus.
              Es gibt ___ neben meinem Haus.
          - question: Wie kommst du von deinem Haus zu ___?
            frame: Ich fahre mit dem Bus / Auto zum / zur ___. / Ich gehe zu Fuß zum / zur ___.
          - question: Welche wichtigen Orte gibt es in deiner Stadt? (3 Orte)
            frame: Es gibt einen / eine / ein ___, einen / eine / ein ___ und einen / eine / ein ___.
          - question: Wie gehst du von deinem Haus zur Bushaltestelle?
            frame: Ich gehe aus dem Haus, gehe geradeaus, dann links. Die Bushaltestelle ist vor dem Park.
          - question: Wo ist der nächste Supermarkt?
            frame: Der nächste Supermarkt ist neben / vor dem / der ___.
          - question: Wie kommst du dorthin?
            frame: Ich gehe eine Straße geradeaus, dann links. Der Supermarkt ist neben der Bank.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Stadtplan'
        skills: [Richtungen]
        steps:
          - 'Wiederholung: Schau den Stadtplan an. Wir wiederholen die Wörter zusammen.'
          - 'Modell: Hör den Dialog.'
          - 'Partnerarbeit: Schüler A fragt nach einem Ort. Schüler B erklärt den Weg.'
          - Dann tauscht ihr die Rollen.
          - 'Klassengespräch: Was war schwierig? Welche Wörter waren neu?'
        wordBank: [geradeaus, links, rechts, neben, vor, hinter]
        example: |-
          **A:** Entschuldigung, wie komme ich zur Bibliothek?
          **B:** Geh geradeaus, dann links. Die Bibliothek ist neben dem Park.
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Touristeninformation'
        skills: [Richtungen]
        steps:
          - Du hast deine eigene Touristeninformation.
          - Schüler A fragt nach einem Ort. Schüler B empfiehlt einen Ort und erklärt den Weg.
          - Dann fragt Schüler B den nächsten Schüler.
        example: |-
          **A:** Welche Bibliothek empfiehlst du?
          **B:** Ich empfehle die Bibliothek im Zentrum.
          **A:** Wie komme ich dorthin?
          **B:** Du gehst zu Fuß. Du gehst geradeaus, dann nach links.
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Ein wichtiger Ort in meiner Stadt'
        skills: [Präpositionen]
        steps:
          - Wähle einen Ort in deiner Stadt.
          - Ergänze die Sätze unten.
          - Lies deine Sätze der Gruppe vor.
        example: |-
          *Mein Ort ist die Schule.*
          *Der Ort ist wichtig, weil ich dort lerne.*
          *Der Ort ist neben dem Park.*
      - id: act3-sentences
        type: discussionQuestions
        title: Ergänze die Sätze
        items:
          - question: Mein Ort ist der / die / das ___.
          - question: Er / Sie / Es ist wichtig, weil ___.
          - question: Der Ort ist in ___.
          - question: Er / Sie / Es ist neben ___.
          - question: Er / Sie / Es ist zwischen ___ und ___.
          - question: Er / Sie / Es ist vor dem / vor der ___.
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Errate den Ort'
        skills: [Präpositionen]
        steps:
          - Ein Schüler wählt heimlich einen Ort vom Stadtplan.
          - Die Klasse stellt Fragen. Der Schüler antwortet nur mit Ja oder Nein.
          - Wer richtig rät, wählt den nächsten Ort.
        example: |-
          *Ist der Ort neben dem Theater?*
          *Ist der Ort vor dem Park?*
          *Ist der Ort die Schule?*
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fähigkeiten in diesem Zyklus: **Richtungen** (Fragen + Aktivitäten 1 und 2)
          und **Präpositionen** (Fragen + Aktivitäten 3 und 4). Niveau A1.
      - id: n-intro
        anchor: intro
        minutes: 10
        text: Schreib das Modell an die Tafel, gib zuerst dein eigenes Beispiel und frag dann jeden Schüler.
      - id: n-warmup
        anchor: warmup
        minutes: 20
        text: Stell jedem Schüler mindestens zwei Fragen. Die geschriebenen Antworten erscheinen unter jeder Frage.
      - id: n-act1
        anchor: act1
        text: >-
          Zeig einen Stadtplan auf dem Bildschirm (im Heft ist kein Plan; bitte einen
          einfachen Plan mit Park, Schule, Bibliothek, Supermarkt, Bank, Post und Theater
          wählen). Phase 1: Wörter gemeinsam wiederholen. Phase 2: Dialog mit einem
          Schüler vorspielen. Phase 3: Partnerarbeit, dann Rollen tauschen. Phase 4: kurzes
          Klassengespräch.
      - id: n-act2
        anchor: act2
        text: Jeder Schüler ist eine „Touristeninformation“. Nach dem Dialog fragt Schüler B den nächsten Schüler, bis alle dran waren.
      - id: n-act4
        anchor: act4
        text: Nur Ja-/Nein-Antworten. Wer richtig rät, wählt den nächsten Ort vom Stadtplan aus Aktivität 1.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: wichtige-orte-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: rules-directions
        type: ruleSummary
        skill: Richtungen
        rules:
          - text: Wichtige Wörter für Richtungen.
            examples: [geradeaus – ישר, links – שמאל, rechts – ימין]
          - text: Wichtige Orte lernen.
            examples: [der Park, die Schule, die Bibliothek, der Supermarkt, die Bank]
          - text: Wichtige Fragen.
            examples: [Wo ist …?, Wie komme ich zum / zur …?, Ist es nah oder weit?]
          - text: '**zum** = zu dem (der Park, das Haus) · **zur** = zu der (die Bank, die Schule).'
            examples: [Wie komme ich **zum** Park?, Wie komme ich **zur** Bibliothek?]
      - id: rules-prepositions
        type: ruleSummary
        skill: Präpositionen
        rules:
          - text: '**in** = בתוך'
            examples: [Der Arzt ist **in** der Klinik.]
          - text: '**an** = על (על הקיר)'
            examples: [Die Karte ist **an** der Wand.]
          - text: '**neben** = ליד · **zwischen** = בין · **vor** = מול / לפני · **hinter** = מאחורי'
            examples:
              - Die Bank ist **neben** dem Supermarkt.
              - Die Bank ist **zwischen** der Post und dem Supermarkt.
              - Der Krankenwagen ist **vor** dem Krankenhaus.
          - text: 'Frage **Wo?** Nach diesen Präpositionen wird **der** und **das** zu **dem**, **die** wird zu **der**. **im** = in dem.'
            examples:
              - der Park → neben **dem** Park
              - das Theater → vor **dem** Theater
              - die Post → neben **der** Post
              - der Park → **im** Park
      - id: prepositions-table
        type: table
        caption: der / die / das nach neben, vor, hinter, zwischen, in, an (Wo?)
        header: [Wort, Wo?]
        rows:
          - [der Park, neben dem Park · im Park]
          - [das Theater, vor dem Theater · im Theater]
          - [die Schule, hinter der Schule · in der Schule]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die zwei Fähigkeiten mit der Gruppe und bitte um ein neues Beispiel für jede Regel.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: wichtige-orte-hausaufgaben
    title: Hausaufgaben mit Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben mit Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere diese Nachricht und schick sie ab. Mori stellt dir Fragen; beantworte alle.
      - id: mori-orte
        type: aiTutorPrompt
        title: Wichtige Orte
        message: >-
          Hallo Mori! Ich möchte Deutsch üben. Kannst du mir Fragen über wichtige Orte
          mit Richtungen und Präpositionen stellen? Bitte benutze nur Präsens und
          korrigiere meine Fehler.
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Du willst mehr Fragen? Schick: **Bitte frag mich mehr!**
          Du verstehst etwas nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem deutschen Satz?**
      - id: extra-title
        type: heading
        level: 3
        text: Zusatzübungen
      - id: mori-weg
        type: aiTutorPrompt
        title: Erklär mir den Weg
        message: >-
          Hallo Mori! Ich frage dich: Wie komme ich zur Post? Bitte erklär mir den Weg
          mit geradeaus, links und rechts. Jetzt bist du dran: Frag mich nach einem Ort,
          und ich erkläre dir den Weg.
      - id: mori-was-ist-wo
        type: aiTutorPrompt
        title: Was ist wo?
        message: >-
          Hallo Mori! Ich beschreibe einen Ort mit Präpositionen (neben, vor, hinter,
          zwischen). Du errätst den Ort. Dann beschreibst du einen Ort, und ich rate.

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: wichtige-orte-uebung
    book: workbook
    title: 'Übung: Wichtige Orte in der Stadt'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Übe die zwei Fähigkeiten des Zyklus. Jede Antwort wird sofort korrigiert, und du kannst es noch einmal versuchen.
      - id: ex-richtungen
        type: activity
        activity: wichtige-orte-richtungen
      - id: ex-praepositionen
        type: activity
        activity: wichtige-orte-praepositionen

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: wichtige-orte-wortschatz
    title: Wortschatz
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Wichtige Orte in der Stadt
        glossLang: he
        link: https://quizlet.com/1114275346/%D7%A9%D7%99%D7%A8%D7%95%D7%AA%D7%99%D7%9D-%D7%97%D7%99%D7%95%D7%A0%D7%99%D7%99%D7%9D-%D7%9E%D7%A2%D7%95%D7%93%D7%9B%D7%9F-flash-cards/
        items: &wichtige-orte-words
          - { term: geradeaus, gloss: ישר }
          - { term: links, gloss: שמאל }
          - { term: rechts, gloss: ימין }
          - { term: vor, gloss: מול / לפני }
          - { term: hinter, gloss: מאחורי }
          - { term: neben, gloss: ליד }
          - { term: zwischen, gloss: בין }
          - { term: in, gloss: בתוך }
          - { term: die Stadt, gloss: עיר }
          - { term: das Haus, gloss: בית }
          - { term: der Park, gloss: פארק }
          - { term: die Schule, gloss: בית ספר }
          - { term: die Bibliothek, gloss: ספרייה }
          - { term: der Supermarkt, gloss: סופרמרקט }
          - { term: die Bank, gloss: בנק }
          - { term: die Bushaltestelle, gloss: תחנת אוטובוס }
          - { term: gehen, gloss: ללכת }
          - { term: kommen, gloss: לבוא / להגיע }
          - { term: fragen, gloss: לשאול }
          - { term: empfehlen, gloss: להמליץ }
          - { term: nah, gloss: קרוב }
          - { term: weit, gloss: רחוק }
          - { term: der Ort, gloss: מקום }
          - { term: wichtig, gloss: חשוב }
          - { term: wo, gloss: איפה }
          - { term: wie, gloss: איך }

vocabulary:
  - slug: wichtige-orte
    title: Wichtige Orte in der Stadt
    items: *wichtige-orte-words

activities:
  - slug: wichtige-orte-richtungen
    title: 'Richtungen: Wie komme ich zum / zur …?'
    minutes: 8
    items:
      - id: wie-komme-ich
        type: multipleChoice
        prompt: Entschuldigung, ___ komme ich zur Bibliothek?
        options:
          - { text: wie, correct: true }
          - {
              text: wo,
              feedback: '*Wo* fragt nach dem Ort (Wo ist die Bibliothek?). Für den Weg fragen wir: *Wie komme ich …?*',
            }
          - { text: was, feedback: 'Für den Weg fragen wir: *Wie komme ich …?*' }
      - id: richtungen-he
        type: matching
        prompt: Verbinde die Wörter.
        pairs:
          - [geradeaus, ישר]
          - [links, שמאל]
          - [rechts, ימין]
          - [nah, קרוב]
          - [weit, רחוק]
      - id: zum-zur
        type: fillBlank
        prompt: Ergänze mit *zum* oder *zur*.
        text: Wie komme ich ___ Bibliothek? Wie komme ich ___ Park?
        blanks: [[zur], [zum]]
        wordBank: [zum, zur]
      - id: frage-weg
        type: trueFalse
        prompt: Mit der Frage *Wie komme ich zur Post?* frage ich nach dem Weg.
        answer: true
        feedback:
          correct: 'Richtig! *Wie komme ich …?* fragt nach dem Weg.'
          incorrect: '*Wie komme ich zur Post?* fragt nach dem Weg. *Wo ist die Post?* fragt nach dem Ort.'
      - id: ordne-weg
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Geh geradeaus, dann links.
      - id: antwort-wo
        type: multipleChoice
        prompt: Wo ist der Park?
        options:
          - { text: Der Park ist neben der Schule., correct: true }
          - {
              text: Ich gehe zu Fuß.,
              feedback: 'Das ist eine Antwort auf *Wie komme ich dorthin?* Die Frage *Wo?* fragt nach dem Ort.',
            }
          - {
              text: 'Ja, der Park ist nah.',
              feedback: 'Das ist eine Antwort auf *Ist der Park nah?*',
            }
      - id: nah-weit
        type: fillBlank
        prompt: Ergänze das Gegenteil von *nah*.
        text: 'Ist die Schule nah? – Nein, sie ist ___.'
        blanks: [[weit, weit weg]]
      - id: ordne-supermarkt
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Wie komme ich zum Supermarkt?

  - slug: wichtige-orte-praepositionen
    title: 'Präpositionen: neben, vor, zwischen, in'
    minutes: 8
    items:
      - id: neben
        type: multipleChoice
        prompt: Die Bank ist ___ dem Supermarkt. (ליד)
        options:
          - { text: neben, correct: true }
          - {
              text: zwischen,
              feedback: '*zwischen* = בין. Wir brauchen zwei Orte: zwischen der Post und dem Supermarkt.',
            }
          - { text: in, feedback: '*in* = בתוך. ליד ist *neben*.' }
      - id: der-dem
        type: fillBlank
        prompt: 'Ergänze *der* oder *dem*. (die Post, der Supermarkt)'
        text: Die Bank ist zwischen ___ Post und ___ Supermarkt.
        blanks: [[der], [dem]]
        wordBank: [der, dem]
      - id: praepositionen-he
        type: matching
        prompt: Verbinde die Präpositionen.
        pairs:
          - [in, בתוך]
          - [neben, ליד]
          - [zwischen, בין]
          - [hinter, מאחורי]
          - [vor, מול / לפני]
      - id: vor-dem
        type: multipleChoice
        prompt: Der Krankenwagen ist vor ___ Krankenhaus. (das Krankenhaus)
        options:
          - { text: dem, correct: true }
          - { text: der, feedback: '*das* Krankenhaus: nach *vor* wird *das* zu *dem*.' }
          - { text: das, feedback: 'Nach *vor* (Wo?) wird *das* zu *dem*: vor dem Krankenhaus.' }
      - id: regel-dem
        type: trueFalse
        prompt: 'Nach *neben* sagen wir: neben **dem** Park (der Park) und neben **der** Schule (die Schule).'
        answer: true
        feedback:
          correct: 'Richtig! *der* und *das* werden zu *dem*, *die* wird zu *der*.'
          incorrect: 'Das ist richtig: *der* und *das* werden zu *dem*, *die* wird zu *der*.'
      - id: an-der-wand
        type: fillBlank
        prompt: 'Ergänze die Präposition. (על הקיר)'
        text: Die Karte ist ___ der Wand.
        blanks: [[an]]
      - id: ordne-theater
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Ist der Ort neben dem Theater?
      - id: im-park
        type: multipleChoice
        prompt: Wo spielen die Kinder? (der Park)
        options:
          - { text: Im Park., correct: true }
          - {
              text: In der Park.,
              feedback: '*der* Park: nach *in* wird *der* zu *dem*. in dem = *im*: im Park.',
            }
          - { text: In Park., feedback: 'Wir brauchen den Artikel: in dem Park = *im* Park.' }
