          - { term: er, gloss: הוא }
          - { term: sie, gloss: היא / הם }
          - { term: der Lehrer, gloss: מורה }
          - { term: Deutsch, gloss: גרמנית }
          - { term: die Schule, gloss: בית ספר }
          - { term: die Hausaufgaben, gloss: שיעורי בית }
          - { term: sprechen, gloss: לדבר }
          - { term: üben, gloss: להתאמן / לתרגל }
          - { term: sich ausruhen, gloss: לנוח }
          - { term: nicht, gloss: לא (שלילת פועל) }
          - { term: kein, gloss: אין / לא (שלילת שם עצם) }

vocabulary:
  - slug: ziele-und-projekte
    title: Ziele und Projekte
    items: *ziele-und-projekte-words

activities:
  - slug: ziele-und-projekte-verben
    title: 'Verben im Präsens: ich lerne, er lernt'
    minutes: 8
    items:
      - id: er-lernt
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Er lernt Deutsch., correct: true }
          - {
              text: Er lern Deutsch.,
              feedback: 'Bei *er / sie / es* endet das Verb auf *-t*: *er lernt*.',
            }
          - {
              text: Er lernen Deutsch.,
              feedback: '*lernen* ist für *wir* und *sie* (Plural). Bei *er* sagt man *lernt*.',
            }
      - id: er-arbeitet
        type: multipleChoice
        prompt: Er ___ in einer Bank.
        options:
          - { text: arbeitet, correct: true }
          - {
              text: arbeit,
              feedback: 'Der Stamm *arbeit-* endet auf *-t*, darum *-et*: *er arbeitet*.',
            }
          - { text: arbeite, feedback: '*arbeite* ist für *ich*. Bei *er* sagt man *arbeitet*.' }
      - id: ich-du-wir
        type: fillBlank
        prompt: Schreib das Verb *lernen* in der richtigen Form.
        text: Ich ___ Deutsch. Du ___ Deutsch. Wir ___ Deutsch.
        blanks: [[lerne], [lernst], [lernen]]
      - id: endung-t
        type: trueFalse
        prompt: 'Bei *er / sie / es* endet das Verb im Präsens auf *-t*: *sie lernt*.'
        answer: true
        feedback:
          correct: Richtig! *er lernt, sie lernt, es regnet*.
          incorrect: Bei *er / sie / es* steht immer *-t* am Ende des Verbs.
      - id: formen
        type: matching
        prompt: Verbinde die Person mit dem Verb.
        pairs:
          - [ich, lerne]
          - [du, lernst]
          - [er, lernt]
          - [wir, lernen]
      - id: nicht-kein
        type: multipleChoice
        prompt: Wir arbeiten sonntags ___.
        options:
          - { text: nicht, correct: true }
          - {
              text: kein,
              feedback: '*kein* steht vor einem Nomen. Ein Verb verneint man mit *nicht*.',
            }
          - {
              text: keine,
              feedback: '*keine* steht vor einem Nomen. Ein Verb verneint man mit *nicht*.',
            }
      - id: ordne-lernt
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Sie lernt jeden Tag Deutsch.
      - id: laura-arbeitet
        type: fillBlank
        prompt: Schreib das Verb *arbeiten* in der richtigen Form.
        text: Laura ___ 2 Stunden am Tag.
        blanks: [[arbeitet]]

  - slug: ziele-und-projekte-daten
    title: 'Daten und Zahlen: am, im, eins, zwei'
    minutes: 8
    items:
      - id: am-datum
        type: multipleChoice
        prompt: Mein Geburtstag ist ___ 12. März.
        options:
          - { text: am, correct: true }
          - {
              text: im,
              feedback: '*im* steht nur vor einem Monat (*im März*). Mit Datum sagt man *am*.',
            }
          - { text: in, feedback: 'Mit einem Tag oder Datum sagt man *am*: *am 12. März*.' }
      - id: im-monat
        type: multipleChoice
        prompt: Laura lernt Deutsch ___ April.
        options:
          - { text: im, correct: true }
          - {
              text: am,
              feedback: '*am* steht vor einem Tag oder Datum. Vor einem Monat sagt man *im*.',
            }
          - { text: um, feedback: 'Vor einem Monat sagt man *im*: *im April*.' }
      - id: zahlen
        type: matching
        prompt: Verbinde die Zahlen.
        pairs:
          - ['2', zwei]
          - ['3', drei]
          - ['5', fünf]
          - ['7', sieben]
          - ['10', zehn]
      - id: zehn
        type: trueFalse
        prompt: 'Die Zahlen von 13 bis 19 enden auf *-zehn*: *dreizehn, vierzehn, neunzehn*.'
        answer: true
        feedback:
          correct: Richtig! 13 = dreizehn, 19 = neunzehn.
          incorrect: 13–19 enden auf *-zehn*, zum Beispiel *dreizehn* (13).
      - id: in-worten
        type: fillBlank
        prompt: Schreib die Zahlen in Wörtern.
        text: 13 = ___ · 20 = ___ · 30 = ___
        blanks: [[dreizehn], [zwanzig], [dreißig, dreissig]]
      - id: dritte
        type: multipleChoice
        prompt: 'Der 3. Mai: Wie sagt man das?'
        options:
          - { text: der dritte Mai, correct: true }
          - { text: der dreite Mai, feedback: '*3.* ist unregelmäßig: *der dritte*.' }
          - {
              text: der dreiste Mai,
              feedback: '*-ste* ist erst ab 20 (*der zwanzigste*). 3. = *der dritte*.',
            }
      - id: am-montag
        type: trueFalse
        prompt: 'Man sagt: *Im Montag lerne ich 20 Minuten.*'
        answer: false
        feedback:
          correct: 'Richtig! Mit einem Tag sagt man *am*: *Am Montag lerne ich 20 Minuten.*'
          incorrect: 'Mit einem Tag sagt man *am*, nicht *im*: *Am Montag lerne ich 20 Minuten.*'
      - id: ordne-montag
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Am Montag lerne ich 20 Minuten.
