sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: reisen-unterricht
    title: 'Unterricht: Reisen'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Reisen
      - id: skills
        type: cycleOverview
        skills:
          - name: Fragen stellen
            description: 'W-Fragen: *Wo? Wohin? Was? Wann? Mit wem? Wie?* Das Verb steht an Position 2.'
          - name: Wegbeschreibung
            description: '*geradeaus, links, rechts, neben, gegenüber*: den Weg Schritt für Schritt beschreiben'
      - id: quizlet
        type: externalLink
        label: Reisen auf Quizlet
        url: https://quizlet.com/br/1115836453/%D7%98%D7%99%D7%95%D7%9C%D7%99%D7%9D-%D7%91%D7%97%D7%95%D7%9C-%D7%9E%D7%A2%D7%95%D7%93%D7%9B%D7%9F-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Vorstellungsrunde
      - id: intro
        type: sentenceFrame
        frame: Ich heiße ___. Ich reise nach ___.
        example: Ich heiße Daniel. Ich reise nach Berlin.
      - id: warmup-title
        type: heading
        level: 3
        text: Aufwärmfragen
      - id: warmup
        type: discussionQuestions
        items:
          - question: Wohin reist du gern?
            frame: Ich reise nach ___.
          - question: 'Was magst du lieber: warm oder kalt? Warum?'
            frame: Ich mag warm. / Ich mag kalt.
          - question: Reist du lieber alleine oder mit Freunden?
            frame: Ich reise lieber alleine. / Ich reise lieber mit Freunden.
          - question: Was machst du im Urlaub?
            frame: Im Urlaub esse ich. / Im Urlaub schlafe ich. / Im Urlaub gehe ich spazieren.
          - question: Wo schläfst du im Urlaub?
            frame: Ich schlafe im Hotel. / Ich schlafe zu Hause.
          - question: Was isst du gern auf Reisen?
            frame: Auf Reisen esse ich gern ___.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Antwort → Frage'
        skills: [Fragen stellen]
        steps:
          - Du siehst nur die Antwort. Wie heißt die richtige Frage?
          - Sag die Frage. Dann wiederholt die Klasse die Frage zusammen.
          - Ein Schüler beantwortet die Frage noch einmal mit einem eigenen Satz.
          - 'Zu zweit: A liest eine Antwort, B sagt die Frage. Nach 3–4 Sätzen wechselt ihr die Rollen.'
        example: |-
          *Im Juli fahre ich in den Urlaub.* → **Wann fährst du in den Urlaub?**
          *Ich reise mit meinen Freunden.* → **Mit wem reist du?**
      - id: act1-answers
        type: discussionQuestions
        title: Schreib die Frage zur Antwort
        items:
          - question: Im Juli fahre ich in den Urlaub.
          - question: Im Sommer fahre ich an den Strand.
          - question: Für die Reise packe ich meinen Koffer.
          - question: Ich reise mit meinen Freunden.
          - question: Ich reise, weil ich neue Länder sehen möchte.
          - question: Ich reise mit dem Flugzeug in ein anderes Land.
          - question: Ich möchte nach Paris reisen.
          - question: Auf die Reise nehme ich eine Kamera mit.
          - question: Auf der Reise schlafe ich in einem Hotel.
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Mein Reiseziel'
        skills: [Fragen stellen]
        steps:
          - Arbeitet zu zweit. Wählt ein Reiseziel, zum Beispiel Berlin, Paris, Rom, London, Tel Aviv oder New York. Ihr müsst nicht dort gewesen sein.
          - Beantwortet die vier Fragen unten. Schreibt nur kurze Sätze, ein Satz pro Frage.
          - Jedes Paar sagt zwei Sätze laut vor der Klasse.
        example: |-
          **Reiseziel: Paris**
          Man isst Croissants.
          Man schläft im Hotel.
          Man reist im Sommer.
          Man sieht den Eiffelturm.
      - id: act2-questions
        type: discussionQuestions
        title: Unser Reiseziel
        items:
          - question: Was isst man in ___?
            frame: Man isst ___.
          - question: Wo schläft man in ___?
            frame: Man schläft im ___.
          - question: Wann reist man nach ___?
            frame: Man reist im ___.
          - question: Was sieht man in ___?
            frame: Man sieht ___.
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Im Reisebüro'
        skills: [Fragen stellen, Wegbeschreibung]
        steps:
          - Arbeitet zu zweit. Eine Person ist der **Reisende**, eine Person ist der **Reiseberater**.
          - Der Reisende stellt die vier Fragen unten. Der Reiseberater antwortet.
          - Nach 3–4 Minuten wechselt ihr die Rollen.
          - 'Sag der Klasse einen Satz aus eurem Dialog, zum Beispiel: *Ich soll nach Paris reisen.*'
        example: |-
          Reisender: *Wohin soll ich reisen?* – Berater: *Du sollst nach Rom reisen.*
          Reisender: *Was kann ich dort essen?* – Berater: *Du kannst Pizza essen.*
          Reisender: *Was soll ich einpacken?* – Berater: *Du sollst einen Pullover einpacken.*
          Reisender: *Wie komme ich zum Strand?* – Berater: *Geradeaus. Links.*
        wordBank: [essen, reisen, Koffer, Strand, Hotel, geradeaus, links, rechts]
      - id: act3-dialogue
        type: discussionQuestions
        title: Im Reisebüro
        items:
          - question: Wohin soll ich reisen?
            frame: Du sollst nach ___ reisen.
          - question: Was kann ich dort essen?
            frame: Du kannst ___ essen.
          - question: Was soll ich einpacken?
            frame: Du sollst ___ einpacken.
          - question: Wie komme ich zum Strand?
            frame: Geradeaus. / Links. / Rechts.
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Speed-Dating – Finde deinen Reisepartner'
        skills: [Fragen stellen]
        steps:
          - Arbeite mit einem Partner. Ihr habt **3 Minuten**.
          - Stellt euch die vier Fragen unten. Antwortet mit **Ich**. Schreib ein Wort pro Antwort auf.
          - 'Wechsel! Neuer Partner: gleiche Fragen, neue Antworten (2–3 Runden).'
          - 'Wer hat das Gleiche wie du? Sag zwei Sätze: *Wir reisen beide nach ___.* *Wir essen beide ___.* oder *Mein Reisepartner ist ___.*'
      - id: act4-questions
        type: discussionQuestions
        title: Speed-Dating-Fragen
        items:
          - question: Wohin möchtest du reisen?
            frame: Ich möchte nach ___ reisen.
          - question: Was packst du ein?
            frame: Ich packe ___ ein.
          - question: Was isst du auf der Reise?
            frame: Ich esse ___.
          - question: Reist du mit der Familie oder mit Freunden?
            frame: Ich reise mit der Familie. / Ich reise mit Freunden.
          - question: Wer ist dein Reisepartner?
            frame: Wir reisen beide nach ___. / Mein Reisepartner ist ___.
      - id: act5
        type: classActivity
        title: 'Aktivität 5: Das Reiserad'
        skills: [Fragen stellen]
        steps:
          - Dreh das Rad und lies die Frage laut.
          - 'Antworte laut mit einem Ich-Satz, zum Beispiel: *Ich reise nach Italien.* *Ich packe eine Kamera ein.* *Ich reise mit Freunden.*'
          - 'Leeres Feld? Dann stellst du eine Frage an einen anderen Schüler, zum Beispiel: *Wohin reist du?* *Was packst du ein?*'
        resource:
          label: Das Reiserad
          url: https://wheelofnames.com/sta-pmn
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: **Fragen stellen** (Aktivitäten 1, 2, 4
          und 5) und **Wegbeschreibung** (Aktivität 3). Aktivität 3 übt beide
          Fertigkeiten.
      - id: n-intro
        anchor: intro
        text: Schreib das Modell an die Tafel, gib dein eigenes Beispiel und frag dann jeden Schüler.
      - id: n-warmup
        anchor: warmup
        text: Stell jedem Schüler mindestens zwei Fragen.
      - id: n-act1
        anchor: act1
        text: >-
          Vorbereitung: Zeig zuerst nur die Antworten, die Fragen bleiben verdeckt.
          Schreib **Antwort → Frage** an die Tafel. Mach das erste Beispiel selbst vor
          („Im Juli fahre ich in den Urlaub." → „Wann fährst du in den Urlaub?"). Ist
          die Frage nicht korrekt, verbessere sanft; die Klasse wiederholt die korrekte
          Frage gemeinsam. In der Partnerarbeit hilfst du bei der Wortstellung und
          erinnerst an: **Wann** → Zeit, **Wo / Wohin** → Ort, **Was** → Sache, **Mit
          wem** → Person, **Warum** → Grund, **Wie** → Transport / Art und Weise. Zum
          Schluss: 2–3 Fragen an einzelne Schüler („Und du, wohin reist du?").
      - id: n-act1-key
        anchor: act1-answers
        text: >-
          Lösungen (nur für den Lehrer): 1. Wann fährst du in den Urlaub? 2. Wohin
          fährst du im Sommer? 3. Was packst du für die Reise? 4. Mit wem reist du? 5.
          Warum reist du? 6. Wie reist du in ein anderes Land? 7. Wohin möchtest du
          reisen? 8. Was nimmst du mit auf die Reise? 9. Wo schläfst du auf der Reise?
      - id: n-act2
        anchor: act2
        text: >-
          Schreib die vier Fragen und die Antwort-Modelle groß an die Tafel. Geh herum,
          hilf mit Wortschatz und korrigiere nur das Nötigste. Optional fragst du am
          Ende: „Paris oder Rom?" „Hotel oder Haus?"
      - id: n-act3
        anchor: act3
        text: >-
          Schreib **Reisender** und **Reiseberater**, die vier Fragen und die
          Antwort-Modelle an die Tafel. Spiel den Dialog zuerst mit einem Schüler vor.
          Geh herum, hör zu und hilf mit: essen, reisen, Koffer, Strand, Hotel,
          geradeaus, links, rechts. Nach 3–4 Minuten: „Rollen wechseln!" Lobe und
          korrigiere nur sanft.
      - id: n-act4
        anchor: act4
        text: >-
          Jede Runde dauert 3 Minuten. Dann: „Wechsel! Neuer Partner!" (Breakout-Räume
          oder Plätze wechseln). Die dritte Runde ist optional, je nach Zeit. Zurück im
          Plenum fragst du jeden Schüler: „Mit wem hast du das Gleiche? Wer ist dein
          Reisepartner?"
      - id: n-act5
        anchor: act5
        text: >-
          Jeder Schüler dreht das Rad, liest die Frage und antwortet laut. Bei einem
          leeren Feld sagst du: „Du machst jetzt eine Frage." Dann: „Nächster!" Hinweise
          für israelische A1-Lernende: nur kurze Fragen, nur Ich-Antworten, keine
          Warum-Fragen. Wenn ein Schüler blockiert, zeig zwei Beispiel-Fragen an der
          Tafel.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: reisen-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: rules-questions
        type: ruleSummary
        skill: Fragen stellen
        rules:
          - text: 'Eine W-Frage beginnt mit einem **Fragewort**: *Wo? Wohin? Was? Wann? Wer? Mit wem? Wie? Warum?*'
          - text: '**Fragewort + Verb + Subjekt + …** Das Verb steht an **Position 2**.'
            examples:
              - Wo wohnst du?
              - Wo ist der Park?
              - Wohin reist du im Urlaub?
              - Was isst du im Urlaub?
              - Wann reist du?
              - Mit wem reist du?
              - Wie kommst du zur Schule?
          - text: '**Wo?** fragt nach dem Ort (*im Hotel*). **Wohin?** fragt nach dem Ziel (*nach Berlin*).'
      - id: questions-table
        type: table
        caption: Die Fragewörter
        header: [Fragewort, Hebräisch, Beispiel]
        rows:
          - [Wo?, איפה?, Wo wohnst du?]
          - [Wohin?, לאן?, Wohin reist du im Urlaub?]
          - [Was?, מה?, Was isst du im Urlaub?]
          - [Wann?, מתי?, Wann reist du?]
          - [Wer?, מי?, Wer reist mit dir?]
          - [Mit wem?, עם מי?, Mit wem reist du?]
          - [Wie?, איך?, Wie kommst du zur Schule?]
          - [Warum?, למה?, Warum reist du?]
      - id: questions-he
        type: text
        lang: he
        text: 'מבנה השאלה בגרמנית: **מילת שאלה + פועל + נושא**. אין כאן Do/Does כמו באנגלית: הפועל בא במקום השני במשפט.'
      - id: rules-directions
        type: ruleSummary
        skill: Wegbeschreibung
        rules:
          - text: 'Sprich in **kurzen, klaren Sätzen**.'
            examples:
              - Geradeaus.
              - Links.
              - Rechts.
              - Geh geradeaus.
              - Geh nach links.
              - Geh nach rechts.
          - text: 'Wo ist etwas? Benutze **neben**, **gegenüber**, **links** und **rechts**.'
            examples:
              - Das Café ist neben der Schule.
              - Der Park ist gegenüber der Kirche.
              - Der Supermarkt ist links.
          - text: 'Beschreib den Weg **Schritt für Schritt**, in der richtigen Reihenfolge.'
            examples:
              - Geh zwei Straßen geradeaus. Dann nach rechts. Der Park ist links.
              - Geh zwei Straßen geradeaus. Geh an der Ampel nach rechts. Geh an der Bäckerei vorbei, der Park ist links.
      - id: directions-table
        type: table
        caption: Den Weg beschreiben
        header: [Deutsch, Hebräisch]
        rows:
          - [Geh geradeaus., לך ישר.]
          - [Geh nach links., פנה שמאלה.]
          - [Geh nach rechts., פנה ימינה.]
          - [Das Café ist neben der Schule., בית הקפה ליד בית הספר.]
          - [Der Park ist gegenüber der Kirche., הפארק מול הכנסייה.]
          - [Der Supermarkt ist links., הסופרמרקט משמאל.]
      - id: directions-he
        type: text
        lang: he
        text: 'כשנותנים כיוון, אומרים כל צעד בנפרד ולפי הסדר: קודם ישר, אחר כך ימינה או שמאלה, ואז איפה המקום נמצא.'
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die zwei Fertigkeiten mit der Klasse und bitte um ein neues Beispiel für jede Regel.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: reisen-hausaufgaben
    title: Hausaufgaben
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben
      - id: write-how
        type: text
        text: Schreib zu jeder Frage einen Satz.
      - id: write
        type: discussionQuestions
        title: Meine Reise
        items:
          - question: Wohin reist du im Urlaub?
            frame: Ich reise nach ___. (Beispiel *Ich reise nach Berlin.*)
          - question: Mit wem reist du?
            frame: Ich reise mit ___. (Beispiel *Ich reise mit Freunden.*)
          - question: Was isst du im Urlaub?
            frame: Ich esse ___. (Beispiel *Ich esse Pizza.*)
          - question: Wann reist du?
            frame: Ich reise im ___. (Sommer / Winter)
      - id: bonus
        type: discussionQuestions
        title: 'Bonus (freiwillig): Schreib zwei Sätze mit Wegbeschreibung'
        items:
          - question: Satz 1
            frame: Geh geradeaus. / Der Park ist rechts.
          - question: Satz 2
            frame: Dann nach links. / Das Café ist neben der Schule.
      - id: mori-title
        type: heading
        level: 3
        text: Mit Mori üben
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere diese Nachricht und schick sie ab. Mori stellt dir Fragen; beantworte alle.
      - id: mori-reisen
        type: aiTutorPrompt
        title: Über Reisen sprechen
        message: |-
          Hi Mori! Ich möchte Deutsch üben.
          Bitte stell mir Fragen über Reisen mit:
          Wo? Wohin? Wann? Was? Mit wem?
          Bitte nur Präsens und korrigiere meine Fehler.
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Möchtest du mehr Fragen? Schreib: **Bitte frag mich mehr!**
          Verstehst du eine Erklärung nicht? Schreib: **Kannst du mir das auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: reisen-uebung
    book: workbook
    title: 'Übung: Reisen'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Übe die zwei Fertigkeiten des Zyklus. Jede Antwort wird sofort korrigiert, und du kannst es noch einmal versuchen.
      - id: ex-fragen
        type: activity
        activity: reisen-fragen
      - id: ex-weg
        type: activity
        activity: reisen-wegbeschreibung

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: reisen-wortschatz
    title: Wortschatz
    phase: review
    blocks:
      - id: words
