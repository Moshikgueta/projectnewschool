vocabulary:
  - slug: reisen
    title: Reisen
    items: *reisen-words

activities:
  - slug: reisen-fragen
    title: 'Fragen stellen: Wo? Wohin? Wann? Mit wem?'
    minutes: 8
    items:
      - id: wohin-berlin
        type: multipleChoice
        prompt: '___ reist du im Urlaub? – Ich reise nach Berlin.'
        options:
          - { text: Wohin, correct: true }
