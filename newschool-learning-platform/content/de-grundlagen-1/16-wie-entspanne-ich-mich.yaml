vocabulary:
  - slug: wie-entspanne-ich-mich
    title: Wie entspanne ich mich?
    items: *entspannung-words

activities:
  - slug: wie-entspanne-ich-mich-aktionen
    title: 'Ich-Sätze mit Aktionen: Ich höre Musik.'
    minutes: 8
    items:
      - id: ich-hoere
        type: multipleChoice
        prompt: Ich ___ Musik.
        options:
          - { text: höre, correct: true }
          - { text: bin höre, feedback: 'Kein *bin* vor einem Verb: Ich höre Musik.' }
          - {
              text: hört,
              feedback: '*hört* passt zu er / sie. Mit *ich* endet das Verb auf -e: ich höre.',
            }
      - id: trinke-rieche
        type: fillBlank
        prompt: Ergänze die Verben in Klammern.
        text: Ich ___ Tee. (trinken) Ich ___ Kaffee. (riechen)
        blanks: [[trinke], [rieche]]
      - id: sinne-he
        type: matching
        prompt: Verbinde die Verben.
        pairs:
          - [sehen, לראות]
          - [hören, לשמוע]
          - [riechen, להריח]
          - [berühren, לגעת]
