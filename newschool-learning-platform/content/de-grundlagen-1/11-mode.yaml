vocabulary:
  - slug: mode
    title: Mode und Shopping
    items: *mode-words

activities:
  - slug: mode-beschreiben
    title: 'Beschreibende Sätze: sein, haben und Adjektive'
    minutes: 8
    items:
      - id: schuhe-sind
        type: multipleChoice
        prompt: Die Schuhe ___ cool.
        options:
          - { text: sind, correct: true }
          - { text: ist, feedback: '*Die Schuhe* ist Plural: Man sagt *sind*.' }
          - { text: bin, feedback: '*bin* passt nur zu *ich*: *Ich bin modisch.*' }
      - id: kleid-rot
        type: multipleChoice
        prompt: Das Kleid ist ___.
        options:
          - { text: rot, correct: true }
          - {
              text: rote,
              feedback: 'Nach *ist / sind* hat das Adjektiv keine Endung: *Das Kleid ist rot.*',
            }
          - {
              text: roten,
              feedback: 'Nach *ist / sind* hat das Adjektiv keine Endung: *Das Kleid ist rot.*',
            }
      - id: ich-bin
        type: multipleChoice
        prompt: Ich ___ modisch.
        options:
          - { text: bin, correct: true }
          - { text: ist, feedback: '*ist* passt zu *er / sie / es*. Mit *ich* sagt man *bin*.' }
          - { text: sind, feedback: '*sind* ist Plural. Mit *ich* sagt man *bin*.' }
      - id: haben
        type: fillBlank
        prompt: Ergänze mit *haben*.
        text: Ich ___ eine rote Tasche. Sie ___ fünf Paar Schuhe.
        blanks: [[habe], [hat]]
        wordBank: [habe, hat, haben]
      - id: ist-sind
        type: fillBlank
        prompt: Ergänze mit *ist* oder *sind*.
