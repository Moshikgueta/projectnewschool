vocabulary:
  - slug: routine
    title: Routine
    items: *routine-words

activities:
  - slug: routine-uhrzeiten
    title: 'Zahlen und Uhrzeiten: am, um, Uhr'
    minutes: 8
    items:
      - id: um-sieben
        type: multipleChoice
        prompt: Ich stehe ___ 7 Uhr auf.
        options:
          - { text: um, correct: true }
          - { text: am, feedback: '*am* steht vor einem Wochentag. Vor einer Uhrzeit steht *um*.' }
          - { text: im, feedback: 'Vor einer Uhrzeit steht *um*: *um 7 Uhr*.' }
      - id: am-montag
        type: multipleChoice
        prompt: ___ Montag gehe ich zur Arbeit.
        options:
          - { text: Am, correct: true }
          - { text: Um, feedback: '*um* steht vor einer Uhrzeit. Vor einem Wochentag steht *am*.' }
          - { text: Im, feedback: 'Vor einem Wochentag steht *am*: *am Montag*.' }
      - id: am-um
        type: fillBlank
        prompt: Ergänze mit *am* oder *um*.
        text: ___ Samstag spiele ich Fußball. Ich esse ___ 13 Uhr zu Mittag.
        blanks: [[am], [um]]
        wordBank: [am, um]
      - id: um-uhr
        type: trueFalse
        prompt: 'Für die Uhrzeit sagt man *um* + Zahl + *Uhr*: *um 8 Uhr*.'
        answer: true
        feedback:
          correct: Richtig! *Ich stehe um 8 Uhr auf.*
          incorrect: 'Doch: *um* + Zahl + *Uhr*, zum Beispiel *um 8 Uhr*.'
      - id: zahlen
        type: matching
        prompt: Verbinde die Zahlen mit den Wörtern.
        pairs:
          - ['7', sieben]
          - ['13', dreizehn]
          - ['19', neunzehn]
          - ['23', dreiundzwanzig]
          - ['25', fünfundzwanzig]
      - id: jahre-alt
        type: fillBlank
        prompt: Ergänze den Satz.
        text: Ich bin 25 Jahre ___.
        blanks: [[alt]]
      - id: ordne-frage
        type: reorderSentence
        prompt: Ordne die Wörter zu einer Frage.
        sentence: Um wie viel Uhr stehst du auf?
      - id: mein-morgen
        type: shortAnswer
        prompt: Um wie viel Uhr stehst du am Montag auf? Schreib einen ganzen Satz.

  - slug: routine-verben
    title: 'Verben im Präsens: ich lerne, er lernt'
    minutes: 8
    items:
      - id: er-arbeitet
        type: multipleChoice
        prompt: Er ___ von 9 Uhr bis 17 Uhr.
        options:
          - { text: arbeitet, correct: true }
          - {
              text: arbeite,
              feedback: '*arbeite* ist für *ich*. Bei *er* endet das Verb auf -et: *er arbeitet*.',
            }
          - {
              text: arbeiten,
              feedback: '*arbeiten* ist für *wir* oder *sie* (Plural). Bei *er*: *er arbeitet*.',
            }
      - id: sie-liest
        type: multipleChoice
        prompt: Am Abend ___ sie ein Buch.
        options:
          - { text: liest, correct: true }
          - { text: lest, feedback: '*lesen* ändert den Vokal: *er / sie liest*.' }
          - { text: lese, feedback: '*lese* ist für *ich*. Bei *sie* (eine Person): *sie liest*.' }
      - id: lernen-spielen
        type: fillBlank
        prompt: Ergänze die Verben *lernen* und *spielen* im Präsens.
        text: Ich ___ Deutsch. Mein Bruder ___ Fußball.
        blanks: [[lerne], [spielt]]
        wordBank: [lerne, spielt]
      - id: position-zwei
        type: trueFalse
        prompt: 'Dieser Satz ist richtig: *Ich Deutsch lerne.*'
        answer: false
        feedback:
