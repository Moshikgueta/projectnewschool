vocabulary:
  - slug: musik
    title: Musik
    items: *musik-words

activities:
  - slug: musik-fragen
    title: 'Fragen stellen: Was? Wo? Wann? Mit wem? Welche?'
    minutes: 8
    items:
      - id: wo-park
        type: multipleChoice
        prompt: '___ hörst du Musik? – Im Park.'
        options:
          - { text: Wo, correct: true }
          - { text: Wann, feedback: '*Wann?* fragt nach der Zeit. *Im Park* ist ein Ort: *Wo?*' }
          - {
              text: Mit wem,
              feedback: '*Mit wem?* fragt nach einer Person. *Im Park* ist ein Ort: *Wo?*',
            }
      - id: welche-musik
        type: multipleChoice
        prompt: '___ Musik hörst du? – Ich höre Pop.'
        options:
          - { text: Welche, correct: true }
          - {
              text: Wo,
              feedback: '*Wo?* fragt nach dem Ort. Für die Art von Musik fragst du *Welche Musik?*',
            }
          - {
              text: Wann,
              feedback: '*Wann?* fragt nach der Zeit. Für die Art von Musik fragst du *Welche Musik?*',
            }
      - id: mit-wem
        type: multipleChoice
        prompt: '___ hörst du Musik? – Mit meiner Freundin.'
        options:
          - { text: Mit wem, correct: true }
          - {
              text: Was,
              feedback: '*Was?* fragt nach einer Sache. Für eine Person fragst du *Mit wem?*',
            }
          - { text: Wo, feedback: '*Wo?* fragt nach dem Ort. Für eine Person fragst du *Mit wem?*' }
      - id: wann
        type: fillBlank
        prompt: Schreib das Fragewort.
        text: '___ hörst du Musik? – Am Morgen.'
        blanks: [[Wann]]
      - id: verb-zwei
        type: trueFalse
        prompt: 'In der Frage *Wo hörst du Musik?* steht das Verb an Position 2.'
        answer: true
        feedback:
          correct: 'Richtig! Fragewort + Verb + Subjekt: *Wo hörst du Musik?*'
          incorrect: 'Das Verb *hörst* steht direkt nach dem Fragewort, an Position 2.'
      - id: richtige-frage
        type: multipleChoice
        prompt: Welche Frage ist richtig?
        options:
          - { text: Was machst du?, correct: true }
          - { text: Was du machst?, feedback: 'Das Verb steht an Position 2: *Was machst du?*' }
          - {
              text: Machst was du?,
              feedback: 'Zuerst das Fragewort, dann das Verb: *Was machst du?*',
            }
      - id: frage-antwort
        type: matching
        prompt: Welche Frage passt zu welcher Antwort?
        pairs:
          - [Ich höre Musik im Bus., Wo hörst du Musik?]
          - [Ich höre Rockmusik., Welche Musik hörst du?]
          - [Ich höre Musik am Abend., Wann hörst du Musik?]
          - [Ich höre Musik mit meinen Freunden., Mit wem hörst du Musik?]
          - [Ich singe., Was machst du?]
      - id: ordne-mit-wem
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Mit wem hörst du Musik?

  - slug: musik-verben
    title: 'Verben im Präsens: ich höre, ich tanze'
    minutes: 8
    items:
      - id: ich-hoere
        type: multipleChoice
        prompt: 'Ich ___ Musik. (hören)'
        options:
          - { text: höre, correct: true }
          - {
              text: hört,
              feedback: '*hört* ist für *er / sie*. Mit *ich* endet das Verb auf -e: *ich höre*.',
            }
          - {
              text: hörst,
              feedback: '*hörst* ist für *du*. Mit *ich* endet das Verb auf -e: *ich höre*.',
            }
      - id: er-hoert
        type: multipleChoice
        prompt: 'Er ___ Pop. (hören)'
        options:
