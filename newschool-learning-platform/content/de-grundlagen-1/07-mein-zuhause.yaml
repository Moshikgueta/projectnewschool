          - { term: die Wohnung, gloss: דירה }
          - { term: das Zimmer, gloss: חדר }
          - { term: die Küche, gloss: מטבח }
          - { term: das Wohnzimmer, gloss: סלון }
          - { term: das Schlafzimmer, gloss: חדר שינה }
          - { term: das Badezimmer, gloss: חדר אמבטיה }
          - { term: der Tisch, gloss: שולחן }
          - { term: der Stuhl, gloss: כיסא }
          - { term: das Sofa, gloss: ספה }
          - { term: das Bett, gloss: מיטה }
          - { term: der Kühlschrank, gloss: מקרר }
