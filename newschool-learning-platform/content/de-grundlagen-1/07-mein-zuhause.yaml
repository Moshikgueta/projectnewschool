vocabulary:
  - slug: mein-zuhause
    title: Mein Zuhause
    items: *mein-zuhause-words

activities:
  - slug: mein-zuhause-es-gibt
    title: 'Beschreibende Sätze: es gibt'
    minutes: 8
    items:
      - id: einen-tisch
        type: multipleChoice
        prompt: Es gibt ___ Tisch in der Küche.
        options:
          - { text: einen, correct: true }
          - { text: ein, feedback: '*der Tisch* → nach *es gibt*: *einen Tisch*.' }
          - { text: eine, feedback: '*Tisch* ist maskulin (*der Tisch*): *Es gibt einen Tisch.*' }
      - id: ein-eine-einen
        type: fillBlank
        prompt: 'Ergänze mit *ein*, *eine* oder *einen*. (das Bett, die Dusche, der Stuhl)'
        text: Es gibt ___ Bett, ___ Dusche und ___ Stuhl.
        blanks: [[ein], [eine], [einen]]
        wordBank: [ein, eine, einen]
      - id: plural-gleich
        type: trueFalse
        prompt: '*Es gibt* bleibt im Plural gleich: *Es gibt zwei Stühle im Wohnzimmer.*'
        answer: true
        feedback:
          correct: 'Richtig! *Es gibt einen Stuhl. Es gibt zwei Stühle.*'
          incorrect: '*Es gibt* ändert sich nicht: *Es gibt einen Stuhl. Es gibt zwei Stühle.*'
      - id: raeume
        type: matching
        prompt: Was gibt es in welchem Raum? Verbinde.
        pairs:
          - [die Küche, der Kühlschrank]
          - [das Schlafzimmer, das Bett]
          - [das Badezimmer, die Dusche]
          - [das Wohnzimmer, das Sofa]
      - id: das-ist
        type: fillBlank
        prompt: Ergänze den Artikel.
        text: Das ist ___ Küche. Das ist ___ Wohnzimmer.
        blanks: [[die], [das]]
        wordBank: [der, die, das]
      - id: gemuetlich
        type: multipleChoice
        prompt: Das Wohnzimmer ist ___.
        options:
          - { text: gemütlich, correct: true }
          - {
              text: gemütliches,
              feedback: 'Nach *ist* hat das Adjektiv keine Endung: *Das Wohnzimmer ist gemütlich.*',
            }
          - {
              text: gemütlicher,
              feedback: 'Nach *ist* hat das Adjektiv keine Endung: *Das Wohnzimmer ist gemütlich.*',
            }
      - id: gibt-es-position
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: In der Küche gibt es einen Kühlschrank., correct: true }
          - {
              text: In der Küche es gibt einen Kühlschrank.,
              feedback: 'Das Verb steht an Position 2: *In der Küche **gibt** es…*',
            }
          - {
              text: Es gibt ein Kühlschrank in der Küche.,
              feedback: '*der Kühlschrank* → *Es gibt einen Kühlschrank.*',
            }
      - id: ordne-bett
        type: reorderSentence
        prompt: Ordne die Wörter zu einer Frage.
        sentence: Gibt es ein Bett?

  - slug: mein-zuhause-verben
    title: 'Verben im Präsens: zu Hause'
    minutes: 8
    items:
      - id: ich-koche
        type: multipleChoice
        prompt: Ich ___ in der Küche.
        options:
          - { text: koche, correct: true }
          - { text: kocht, feedback: '*kocht* ist für *er / sie / es*. Bei *ich*: *ich koche*.' }
          - {
              text: kochen,
              feedback: '*kochen* ist für *wir* oder *sie* (Plural). Bei *ich*: *ich koche*.',
            }
      - id: er-schlaeft
        type: multipleChoice
        prompt: Er ___ im Schlafzimmer.
        options:
