        title: Wörter für Berufe
        glossLang: he
        link: https://quizlet.com/br/1110976621/%D7%9E%D7%A7%D7%A6%D7%95%D7%A2%D7%95%D7%AA-%D7%9E%D7%A2%D7%95%D7%93%D7%9B%D7%9F-flash-cards/
