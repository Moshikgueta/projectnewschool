vocabulary:
  - slug: berufe
    title: Berufe
    items: *berufe-words

activities:
  - slug: berufe-praesens
    title: 'Präsens: ich arbeite, du arbeitest, er arbeitet'
    minutes: 8
    items:
      - id: er-kocht
        type: multipleChoice
        prompt: Er ___ im Restaurant.
        options:
          - { text: kocht, correct: true }
          - { text: koche, feedback: '*koche* passt zu *ich*. Für *er* sagen wir *er kocht*.' }
          - { text: kochst, feedback: '*kochst* passt zu *du*. Für *er* sagen wir *er kocht*.' }
      - id: du-arbeitest
        type: multipleChoice
        prompt: Du ___ im Krankenhaus.
        options:
          - { text: arbeitest, correct: true }
          - {
              text: arbeite,
              feedback: '*arbeite* passt zu *ich*. Für *du* sagen wir *du arbeitest*.',
            }
          - {
              text: arbeitet,
              feedback: '*arbeitet* passt zu *er / sie*. Für *du* sagen wir *du arbeitest*.',
            }
      - id: ich-arbeite
        type: fillBlank
        prompt: Ergänze das Verb *arbeiten*.
        text: Ich ___ in der Schule.
        blanks: [[arbeite]]
      - id: sie-schreibt
        type: fillBlank
        prompt: Ergänze das Verb *schreiben*.
        text: Sie ___ im Büro.
        blanks: [[schreibt]]
      - id: bin-arbeite
        type: trueFalse
        prompt: 'Der Satz *Ich bin arbeite.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! Im Präsens brauchst du nur ein Verb: *Ich arbeite.*'
          incorrect: 'Benutze *sein* nicht mit einem anderen Verb. Richtig ist: *Ich arbeite.*'
      - id: position-2
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Heute arbeite ich im Restaurant., correct: true }
          - {
              text: Heute ich arbeite im Restaurant.,
              feedback: 'Das Verb steht an Position 2: *Heute arbeite ich …*',
            }
          - {
              text: Heute arbeitet ich im Restaurant.,
              feedback: 'Für *ich* sagen wir *arbeite*: *Heute arbeite ich …*',
            }
      - id: wer-macht-was
        type: matching
        prompt: Was macht wer?
        pairs:
          - [Der Lehrer, unterrichtet in der Schule.]
          - [Der Arzt, hilft Menschen im Krankenhaus.]
          - [Der Kellner, serviert Essen.]
          - [Der Bäcker, arbeitet in der Bäckerei.]
          - [Der Kassierer, arbeitet im Geschäft.]
      - id: ordne-restaurant
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Ich arbeite im Restaurant.

  - slug: berufe-zahlen
    title: 'Zahlen: 1–20, Uhrzeiten, Stunden und Tage'
    minutes: 8
    items:
      - id: zahlen-1-20
        type: matching
        prompt: Welche Zahl passt?
        pairs:
          - ['3', drei]
          - ['7', sieben]
          - ['11', elf]
          - ['12', zwölf]
          - ['20', zwanzig]
      - id: sechzehn
        type: multipleChoice
        prompt: Wie schreibt man 16?
        options:
          - { text: sechzehn, correct: true }
          - { text: sechszehn, feedback: '16 ist kürzer: *sechzehn* (ohne -s).' }
          - { text: sechsundzehn, feedback: '13–19 sind Zahl + *zehn* in einem Wort: *sechzehn*.' }
      - id: siebzehn
        type: fillBlank
        prompt: Schreib die Zahl als Wort.
        text: 17 = ___
        blanks: [[siebzehn]]
      - id: zahl-uhr
        type: trueFalse
        prompt: 'Für die Uhrzeit sagen wir Zahl + *Uhr*: *Ich beginne um 9 Uhr.*'
        answer: true
        feedback:
          correct: Richtig! *9 Uhr*, *14 Uhr*.
          incorrect: 'Die Uhrzeit ist Zahl + *Uhr*: *um 9 Uhr*.'
      - id: um-uhr
        type: multipleChoice
        prompt: Ich beginne ___ 9 Uhr.
        options:
          - { text: um, correct: true }
          - {
              text: am,
              feedback: '*am* steht vor einem Datum (am 5. März). Vor einer Uhrzeit steht *um*.',
            }
          - {
              text: im,
              feedback: '*im* steht vor einem Monat (im März). Vor einer Uhrzeit steht *um*.',
            }
      - id: stunden-tage
        type: fillBlank
        prompt: Ergänze *Stunden* oder *Tage*.
        text: Ich arbeite acht ___ pro Tag und fünf ___ pro Woche.
        blanks: [[Stunden], [Tage]]
        wordBank: [Stunden, Tage]
      - id: ordne-uhr
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Ich gehe um 15 Uhr nach Hause.
      - id: meine-stunden
        type: shortAnswer
        prompt: Wie viele Stunden arbeitest du? Schreib einen Satz.
