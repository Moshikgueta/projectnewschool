vocabulary:
  - slug: wetter
    title: Wetter
    items: *wetter-words

activities:
  - slug: wetter-beschreiben
    title: 'Das Wetter beschreiben: Es ist, es gibt'
    minutes: 8
    items:
      - id: es-ist-warm
        type: multipleChoice
        prompt: Es ___ warm.
        options:
          - { text: ist, correct: true }
          - {
              text: gibt,
              feedback: '*Es gibt* steht vor einem Nomen (*Es gibt Regen*). Vor einem Adjektiv sagt man *Es ist*.',
            }
          - {
              text: sind,
              feedback: '*Es sind* ist für die Temperatur (*Es sind 20 Grad*). Vor einem Adjektiv sagt man *Es ist*.',
            }
      - id: es-gibt-regen
        type: multipleChoice
        prompt: Es gibt ___.
        options:
          - { text: Regen, correct: true }
          - {
              text: regnerisch,
              feedback: '*regnerisch* ist ein Adjektiv: *Es ist regnerisch.* Nach *Es gibt* kommt ein Nomen.',
            }
          - {
              text: kalt,
              feedback: '*kalt* ist ein Adjektiv: *Es ist kalt.* Nach *Es gibt* kommt ein Nomen.',
            }
      - id: ist-gibt
        type: fillBlank
        prompt: Ergänze *ist* oder *gibt*.
        text: Es ___ sonnig. Es ___ Wolken und Wind.
        blanks: [[ist], [gibt]]
        wordBank: [ist, gibt]
      - id: gibt-plural
        type: trueFalse
        prompt: '*Es gibt* ist gleich für Singular und Plural: *Es gibt Regen. Es gibt Wolken.*'
        answer: true
        feedback:
          correct: Richtig! *Es gibt* ändert sich nicht.
          incorrect: '*Es gibt* ändert sich nicht: *Es gibt Regen.* und *Es gibt Wolken.*'
      - id: wetterwoerter
        type: matching
        prompt: Verbinde das Wort mit der Übersetzung.
        pairs:
          - [sonnig, שמשי]
          - [regnerisch, גשום]
          - [bewölkt, מעונן]
          - [kalt, קר]
          - [heiß, חם]
      - id: gehe-schwimmen
        type: multipleChoice
        prompt: Es ist warm. Welcher Satz ist richtig?
        options:
          - { text: Ich gehe schwimmen., correct: true }
          - {
              text: Ich schwimmen gehe.,
              feedback: 'Das erste Verb (*gehe*) steht an Position 2, das zweite Verb (*schwimmen*) am Ende.',
            }
          - {
              text: Ich gehe schwimme.,
              feedback: 'Das zweite Verb bleibt im Infinitiv: *Ich gehe schwimmen.*',
            }
      - id: ordne-montag
        type: reorderSentence
        prompt: Ordne die Wörter.
