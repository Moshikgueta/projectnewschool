vocabulary:
  - slug: freundschaft
    title: Freundschaft
    items: *freundschaft-words

activities:
  - slug: freundschaft-beschreiben
    title: 'Beschreibende Sätze: Er ist nett.'
    minutes: 8
    items:
      - id: ist-nett
        type: multipleChoice
        prompt: Mein Freund ___ nett.
        options:
          - { text: ist, correct: true }
          - {
              text: bin,
              feedback: '*bin* geht nur mit *ich*: Ich bin nett. Mein Freund *ist* nett.',
            }
          - {
              text: sein,
              feedback: '*sein* ist die Grundform. Mit er / sie / mein Freund sagen wir *ist*.',
            }
      - id: ist-bin
        type: fillBlank
        prompt: Ergänze mit *ist* oder *bin*.
        text: Meine Freundin ___ lustig. Ich ___ ruhig.
        blanks: [[ist], [bin]]
        wordBank: [ist, bin]
      - id: adjektive-he
        type: matching
        prompt: Verbinde die Adjektive.
        pairs:
          - [nett, נחמד]
          - [lustig, מצחיק]
          - [stark, חזק]
          - [klug, חכם]
          - [schüchtern, ביישן]
      - id: er-gross
        type: trueFalse
        prompt: '*Er groß.* ist ein richtiger Satz.'
        answer: false
        feedback:
          correct: 'Richtig! Wir brauchen immer ein Verb: Er *ist* groß.'
          incorrect: 'Der Satz braucht ein Verb: Er *ist* groß.'
      - id: nicht-position
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Er ist nicht schüchtern., correct: true }
          - {
              text: Er nicht ist schüchtern.,
              feedback: '*nicht* steht nach *ist*: Er ist nicht schüchtern.',
            }
          - {
              text: Er ist schüchtern nicht.,
              feedback: '*nicht* steht nach *ist* und vor dem Adjektiv: Er ist nicht schüchtern.',
            }
      - id: ordne-frage
        type: reorderSentence
        prompt: Ordne die Wörter zu einer Frage.
        sentence: Ist dein Freund lustig?
      - id: ja-sie
        type: fillBlank
        prompt: Antworte mit *er* oder *sie*.
        text: 'Ist deine Freundin klug? – Ja, ___ ist klug.'
        blanks: [[sie]]
      - id: ordne-partner
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Der Freund meines Partners ist lustig.

