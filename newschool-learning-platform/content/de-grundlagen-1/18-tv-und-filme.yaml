          - { term: raten, gloss: לנחש }
          - { term: berühmt, gloss: מפורסם }

vocabulary:
  - slug: tv-und-filme
    title: TV & Filme
    items: *tv-und-filme-words

activities:
  - slug: tv-und-filme-fragen
    title: 'Fragen stellen: Was? Wo? Wann? Wer?'
    minutes: 8
    items:
      - id: wo-kino
        type: multipleChoice
        prompt: '___ siehst du Filme? – Im Kino.'
        options:
          - { text: Wo, correct: true }
          - { text: Wann, feedback: '*Wann?* fragt nach der Zeit. *Im Kino* ist ein Ort: *Wo?*' }
          - { text: Wer, feedback: '*Wer?* fragt nach einer Person. *Im Kino* ist ein Ort: *Wo?*' }
      - id: wann-abend
        type: multipleChoice
        prompt: '___ siehst du TV? – Am Abend.'
        options:
          - { text: Wann, correct: true }
          - { text: Wo, feedback: '*Wo?* fragt nach dem Ort. *Am Abend* ist eine Zeit: *Wann?*' }
          - {
              text: Was,
              feedback: '*Was?* fragt nach einer Sache. *Am Abend* ist eine Zeit: *Wann?*',
            }
      - id: wer-schauspieler
        type: multipleChoice
        prompt: '___ ist dein Lieblingsschauspieler? – Brad Pitt.'
        options:
          - { text: Wer, correct: true }
          - {
              text: Was,
              feedback: '*Was?* fragt nach einer Sache. Für eine Person fragst du *Wer?*',
            }
          - { text: Wo, feedback: '*Wo?* fragt nach dem Ort. Für eine Person fragst du *Wer?*' }
      - id: richtige-frage
        type: multipleChoice
        prompt: Welche Frage ist richtig?
        options:
          - { text: Was siehst du?, correct: true }
          - { text: Was du siehst?, feedback: 'Das Verb steht an Position 2: *Was siehst du?*' }
          - {
              text: Siehst was du?,
              feedback: 'Zuerst das Fragewort, dann das Verb: *Was siehst du?*',
            }
      - id: kein-do
        type: trueFalse
        prompt: Im Deutschen braucht man für eine Frage ein Hilfswort wie *do* im Englischen.
        answer: false
        feedback:
          correct: 'Richtig! Im Deutschen gibt es kein *do*: *Wann siehst du TV?*'
