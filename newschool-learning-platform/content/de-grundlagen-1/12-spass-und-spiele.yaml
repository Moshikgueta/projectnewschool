vocabulary:
  - slug: spass-und-spiele
    title: Spaß und Spiele
    items: *spass-und-spiele-words

activities:
  - slug: spass-und-spiele-praesens
    title: 'Handlungen im Präsens: ich spiele, du spielst, er spielt'
    minutes: 8
    items:
      - id: er-hoert
        type: multipleChoice
        prompt: Er ___ Musik.
        options:
          - { text: hört, correct: true }
          - {
              text: höre,
              feedback: '*höre* passt zu *ich*. Mit *er* endet das Verb auf *-t*: *er hört*.',
            }
          - {
              text: hören,
              feedback: '*hören* passt zu *wir* oder *sie* (Plural). Mit *er* sagt man *hört*.',
            }
      - id: du-trinkst
        type: multipleChoice
        prompt: Du ___ Tee.
        options:
          - { text: trinkst, correct: true }
          - {
              text: trinke,
              feedback: '*trinke* passt zu *ich*. Mit *du* endet das Verb auf *-st*.',
            }
          - {
              text: trinkt,
              feedback: '*trinkt* passt zu *er / sie / es*. Mit *du* endet das Verb auf *-st*.',
            }
      - id: richtiger-satz
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Ich lese ein Buch., correct: true }
          - {
              text: Ich ein Buch lesen.,
              feedback: 'Zuerst das Subjekt, dann das Verb mit Endung: *Ich lese ein Buch.*',
            }
          - {
              text: Ich bin lese ein Buch.,
              feedback: 'Im Präsens brauchst du nur ein Verb, ohne *bin*: *Ich lese ein Buch.*',
            }
      - id: endungen
        type: matching
        prompt: Verbinde die Person mit der richtigen Form von *spielen*.
        pairs:
          - [ich, spiele]
          - [du, spielst]
          - [er / sie / es, spielt]
          - [wir, spielen]
      - id: spielen-kochen
        type: fillBlank
        prompt: Ergänze das Verb in der richtigen Form.
        text: Ich ___ (spielen) Monopoly. Sie ___ (kochen) Suppe, und er ___ (hören) Musik.
        blanks: [[spiele], [kocht], [hört]]
      - id: gehen-trinken
        type: fillBlank
        prompt: Ergänze das Verb in der richtigen Form.
        text: Du ___ (gehen) in den Supermarkt. Wir ___ (trinken) Tee.
        blanks: [[gehst], [trinken]]
      - id: nur-ein-verb
        type: trueFalse
        prompt: 'Im Präsens sagt man: *Ich bin sehe fern.*'
        answer: false
        feedback:
          correct: Richtig! Man sagt nur *Ich sehe fern.*, ohne *bin*.
          incorrect: 'Im Präsens brauchst du nur ein Verb: *Ich sehe fern.*'
      - id: ordne-regen
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Es ist ein regnerischer Tag und ich sehe fern.

  - slug: spass-und-spiele-possessiv
    title: 'Possessivartikel: mein, dein, sein, ihr, unser'
    minutes: 8
    items:
      - id: sein-hund
        type: multipleChoice
        prompt: Das ist Tom. ___ Hund ist groß.
        options:
          - { text: Sein, correct: true }
          - {
              text: Ihr,
              feedback: 'Tom ist ein Mann: *sein* (שלו). *ihr* ist für eine Frau (שלה).',
            }
          - { text: Mein, feedback: '*mein* ist für *ich*. Hier sprechen wir über Tom: *sein*.' }
      - id: ihr-spiel
        type: multipleChoice
        prompt: Das ist Anna. ___ Lieblingsspiel ist Super Mario.
        options:
