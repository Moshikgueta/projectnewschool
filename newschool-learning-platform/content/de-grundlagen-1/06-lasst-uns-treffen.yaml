vocabulary:
  - slug: lasst-uns-treffen
    title: Lasst uns treffen!
    items: *lasst-uns-treffen-words

activities:
  - slug: lasst-uns-treffen-wochentage
    title: Wochentage und Daten
    minutes: 8
    items:
      - id: wochentage
        type: fillBlank
        prompt: Ergänze die Wochentage.
        text: Montag, Dienstag, ___, Donnerstag, Freitag, ___, Sonntag
        blanks: [[Mittwoch], [Samstag, Sonnabend]]
      - id: nach-freitag
        type: fillBlank
        prompt: Welcher Tag kommt nach Freitag?
        text: Nach Freitag kommt ___.
        blanks: [[Samstag, Sonnabend]]
      - id: wochenende
        type: multipleChoice
        prompt: Welcher Tag ist am Wochenende?
        options:
          - { text: Sonntag, correct: true }
          - {
              text: Montag,
              feedback: 'Das Wochenende ist Samstag und Sonntag. Montag ist ein Arbeitstag.',
            }
          - {
              text: Mittwoch,
              feedback: 'Das Wochenende ist Samstag und Sonntag. Mittwoch ist in der Mitte der Woche.',
            }
      - id: ordnungszahlen
        type: matching
        prompt: Verbinde die Zahl mit der Ordnungszahl.
        pairs:
          - ['1.', der erste]
          - ['3.', der dritte]
          - ['5.', der fünfte]
          - ['7.', der siebte]
          - ['12.', der zwölfte]
      - id: der-dritte
        type: multipleChoice
        prompt: 'Der 3. Mai ist der ___ Mai.'
        options:
          - { text: dritte, correct: true }
          - { text: dreite, feedback: '3 hat eine besondere Form: *der dritte*.' }
          - { text: drei, feedback: 'Im Datum benutzt man die Ordnungszahl: *der dritte Mai*.' }
      - id: auf-te
        type: trueFalse
        prompt: 'Von 4 bis 19 enden die Ordnungszahlen meistens auf *-te*: *der vierte, der fünfte, der sechste*.'
        answer: true
        feedback:
          correct: Richtig! Ab 20 enden sie auf *-ste*, zum Beispiel *der zwanzigste*.
          incorrect: 'Doch: *der vierte, der fünfte, der sechste*: Sie enden auf *-te*.'
      - id: geburtstag-am
        type: multipleChoice
        prompt: Mein Geburtstag ist ___ 12. März.
        options:
          - { text: am, correct: true }
          - { text: um, feedback: '*um* steht vor einer Uhrzeit. Vor einem Datum steht *am*.' }
          - {
              text: im,
              feedback: '*im* steht vor einem Monat ohne Tag (*im März*). Mit Tag: *am 12. März*.',
            }
      - id: ordne-geburtstag
        type: reorderSentence
        prompt: Ordne die Wörter zu einer Frage.
        sentence: Wann hast du Geburtstag?

  - slug: lasst-uns-treffen-praepositionen
    title: 'Präpositionen: am, um, im, an, auf'
    minutes: 8
    items:
      - id: um-uhr
        type: multipleChoice
        prompt: Wir treffen uns ___ 15 Uhr.
        options:
          - { text: um, correct: true }
          - {
              text: am,
              feedback: '*am* steht vor einem Tag. Vor einer genauen Uhrzeit steht *um*.',
            }
          - {
              text: im,
              feedback: '*im* ist für lange Zeiten (*im Juli*). Vor einer Uhrzeit steht *um*.',
            }
      - id: im-sommer
        type: multipleChoice
        prompt: ___ Sommer spiele ich Fußball.
        options:
          - { text: Im, correct: true }
          - { text: Am, feedback: '*am* ist für Tage. Für eine lange Zeit wie den Sommer: *im*.' }
          - { text: Um, feedback: '*um* ist für eine genaue Uhrzeit. Für den Sommer: *im*.' }
      - id: treffen-am-um-im
        type: fillBlank
        prompt: Ergänze mit *am*, *um* oder *im*.
        text: Wir treffen uns ___ Samstag ___ 16 Uhr ___ Café.
        blanks: [[am], [um], [im]]
        wordBank: [am, um, im]
      - id: zeit-ort
        type: matching
        prompt: Wann benutzt man das? Verbinde.
        pairs:
          - [am Montag, ein Tag]
          - [um 8 Uhr, eine genaue Uhrzeit]
          - [im Juli, eine lange Zeit]
          - [auf dem Tisch, auf einer Fläche]
      - id: auf-tisch
        type: multipleChoice
        prompt: Das Buch liegt ___ dem Tisch.
        options:
          - { text: auf, correct: true }
          - {
              text: an,
              feedback: '*an* ist für eine Grenze oder eine Wand (*an der Wand*). Auf einer Fläche: *auf*.',
            }
          - { text: um, feedback: '*um* ist für eine Uhrzeit. Auf einer Fläche: *auf dem Tisch*.' }
      - id: um-montag
        type: trueFalse
        prompt: 'Dieser Satz ist richtig: *Ich lerne um Montag Deutsch.*'
        answer: false
        feedback:
          correct: 'Richtig! Vor einem Tag steht *am*: *Ich lerne am Montag Deutsch.*'
          incorrect: 'Vor einem Tag steht *am*, nicht *um*: *Ich lerne am Montag Deutsch.*'
      - id: an-im
        type: fillBlank
        prompt: Ergänze mit *an* oder *im*.
        text: Ich stehe ___ der Haltestelle. Wir spielen ___ Park Fußball.
        blanks: [[an], [im]]
        wordBank: [an, im]
      - id: ordne-wen
        type: reorderSentence
        prompt: Ordne die Wörter zu einer Frage.
        sentence: Wen triffst du am Freitag?
