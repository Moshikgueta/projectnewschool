          - { term: Domingo, gloss: יום ראשון }

vocabulary:
  - slug: el-clima
    title: El clima
    items: *clima-words

activities:
  - slug: el-clima-numeros
    title: 'Números: temperaturas'
    minutes: 8
    items:
      - id: une-numeros
        type: matching
        prompt: Une los números.
        pairs:
          - ['15', quince]
          - ['21', veintiuno]
          - ['35', treinta y cinco]
          - ['40', cuarenta]
          - ['98', noventa y ocho]
      - id: treinta-y-dos
        type: multipleChoice
        prompt: 'La temperatura máxima es de 32 grados. ¿Cómo se dice 32?'
        options:
          - { text: treinta y dos, correct: true }
          - { text: tres y dos, feedback: '*Tres* es 3. El 30 es *treinta*: treinta + y + dos.' }
          - { text: trece y dos, feedback: '*Trece* es 13. El 32 es *treinta y dos*.' }
      - id: veintisiete
        type: multipleChoice
        prompt: 'Ahora hace 27 grados. ¿Cómo se dice 27?'
        options:
          - { text: veintisiete, correct: true }
          - {
              text: diecisiete,
              feedback: '*Diecisiete* es 17. Del 21 al 29 empezamos con *veinti-*: *veintisiete*.',
            }
          - { text: setenta y dos, feedback: '*Setenta y dos* es 72. El 27 es *veintisiete*.' }
      - id: cuarenta
        type: fillBlank
        prompt: Escribe el número en palabras.
        text: 'En el desierto hace 40 grados: hace ___ grados.'
        blanks: [[cuarenta]]
      - id: dieciseis
        type: fillBlank
        prompt: Escribe el número en palabras.
        text: 'Esta noche hace 16 grados: hace ___ grados.'
        blanks: [[dieciséis]]
      - id: once-quince
        type: trueFalse
        prompt: 'Los números del 11 al 15 (once, doce, trece, catorce, quince) son irregulares: hay que aprenderlos de memoria.'
        answer: true
        feedback:
          correct: '¡Correcto! Después, del 16 al 19, usamos *dieci-*: *dieciséis, diecisiete…*'
          incorrect: Once, doce, trece, catorce y quince no siguen un patrón. Hay que aprenderlos de memoria.
      - id: treinta-enta
        type: trueFalse
        prompt: '*Treinta* (30) termina en *-enta*, como *cuarenta* y *cincuenta*.'
        answer: false
        feedback:
          correct: ¡Correcto! *Treinta* termina en *-inta*. Desde el 40 terminan en *-enta*.
          incorrect: '*Treinta* termina en *-inta*. Desde el 40 terminan en *-enta*: cuarenta, cincuenta, sesenta…'
      - id: ordena-temperatura
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: La temperatura máxima es de treinta grados.
        alsoAccept: [La máxima temperatura es de treinta grados.]

  - slug: el-clima-describir
    title: Describir el clima
    minutes: 8
    items:
      - id: hoy-esta
        type: multipleChoice
        prompt: Hoy el cielo ___ nublado.
        options:
          - { text: está, correct: true }
          - {
              text: es,
              feedback: 'Hoy es algo temporal: usa *estar*. *Hoy el cielo está nublado.*',
            }
          - {
              text: hay,
              feedback: '*Hay* es para decir que algo existe: *hay nubes*. Con un adjetivo como *nublado* usa *está*.',
            }
      - id: hay-nubes
        type: multipleChoice
        prompt: ___ nubes en el cielo.
        options:
          - { text: Hay, correct: true }
          - { text: Es, feedback: 'Para decir que algo existe en un lugar, usa *hay*.' }
          - {
              text: Está,
              feedback: 'Para decir que algo existe en un lugar, usa *hay*: *Hay nubes en el cielo.*',
            }
      - id: hay-plural
        type: trueFalse
        prompt: Usamos *hay* solo con palabras en singular.
        answer: false
        feedback:
          correct: '¡Correcto! *Hay* es igual en singular y en plural: *hay una tormenta*, *hay nubes*.'
          incorrect: '*Hay* es igual en singular y en plural: *hay una tormenta*, *hay nubes*.'
      - id: es-esta
        type: fillBlank
        prompt: Completa con *es* o *está*.
        text: En Cartagena el clima ___ tropical. Hoy el día ___ lluvioso.
        blanks: [[es], [está]]
        wordBank: [es, está]
      - id: la-tarde
        type: multipleChoice
        prompt: La tarde está ___.
        options:
          - { text: soleada, correct: true }
          - {
              text: soleado,
              feedback: '*Tarde* es femenino: el adjetivo termina en *-a*: *soleada*.',
            }
          - { text: soleadas, feedback: '*La tarde* es singular: usa *soleada*.' }
      - id: une-clima
        type: matching
        prompt: Une cada palabra con su descripción.
        pairs:
          - [el verano, Hace calor.]
          - [el invierno, Hace frío.]
          - [un día soleado, Hay sol.]
          - [un día nublado, Hay nubes.]
      - id: hace-frio
        type: fillBlank
