vocabulary:
  - slug: comida
    title: Comida
    items: *comida-words

activities:
  - slug: comida-verbos
    title: 'Verbos en presente: yo y tú'
    minutes: 8
    items:
      - id: yo-como
        type: multipleChoice
        prompt: Yo ___ pizza en mi casa.
        options:
          - { text: como, correct: true }
          - { text: soy como, feedback: 'No uses *soy* si tienes un verbo: *Yo como pizza.*' }
          - {
              text: comes,
              feedback: '*Comes* es para *tú*. Con *yo*, el verbo termina en *-o*: *como*.',
            }
      - id: cocino-cocinas
        type: fillBlank
        prompt: Completa con el verbo *cocinar*.
        text: Yo ___ pasta. Tú ___ pescado.
        blanks: [[cocino], [cocinas]]
      - id: sandwich
        type: fillBlank
        prompt: Completa con el verbo en *yo*.
        text: Yo ___ (cortar) el pan por la mitad. Yo ___ (agregar) queso y tomate.
        blanks: [[corto], [agrego]]
      - id: infinitivo-yo
        type: matching
        prompt: Une cada verbo con su forma en *yo*.
        pairs:
          - [cortar, corto]
          - [abrir, abro]
          - [cerrar, cierro]
          - [poner, pongo]
          - [untar, unto]
      - id: soy-como
        type: trueFalse
        prompt: 'La frase *Yo soy como pizza.* es correcta.'
        answer: false
        feedback:
          correct: ¡Correcto! Decimos *Yo como pizza.*
          incorrect: 'No escribas *soy* si tienes un verbo. Decimos *Yo como pizza.*'
      - id: tu-bebes
        type: multipleChoice
        prompt: ¿Qué ___ tú?
        options:
          - { text: bebes, correct: true }
          - {
              text: bebo,
              feedback: '*Bebo* es para *yo*. Con *tú*, el verbo en *-er* termina en *-es*: *bebes*.',
            }
          - { text: beber, feedback: '*Beber* es el infinitivo. Con *tú* decimos *bebes*.' }
      - id: camarero
        type: fillBlank
        prompt: 'El camarero repite el pedido. Completa con *beber* y *comer* para *tú*.'
        text: Entonces tú ___ agua y ___ pizza.
        blanks: [[bebes], [comes]]
      - id: ordena-pago
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Yo pago con tarjeta de crédito.

  - slug: comida-posesivos
    title: 'Posesivos: mi, tu, su, nuestro'
    minutes: 8
    items:
      - id: mis-amigas
        type: multipleChoice
        prompt: Yo tengo dos amigas. ___ amigas comen en el restaurante.
        options:
          - { text: Mis, correct: true }
          - { text: Mi, feedback: '*Amigas* es plural: usa *mis*.' }
          - { text: Tus, feedback: '*Tus* es de *tú*. Son las amigas de *yo*: *mis amigas*.' }
      - id: nuestro-restaurante
        type: multipleChoice
        prompt: Mi esposo y yo tenemos un restaurante. ___ restaurante es muy grande.
        options:
          - { text: Nuestro, correct: true }
          - { text: Nuestra, feedback: '*Restaurante* es masculino: usa *nuestro*.' }
          - { text: Nuestros, feedback: '*Restaurante* es singular: usa *nuestro*.' }
      - id: nuestras-magdalenas
        type: multipleChoice
        prompt: Mi esposa y yo tenemos una panadería. ___ magdalenas son deliciosas.
        options:
          - { text: Nuestras, correct: true }
          - { text: Nuestros, feedback: '*Magdalenas* es femenino: usa *nuestras*.' }
          - { text: Nuestra, feedback: '*Magdalenas* es plural: usa *nuestras*.' }
      - id: su-sus
        type: fillBlank
        prompt: Completa con *su* o *sus*.
