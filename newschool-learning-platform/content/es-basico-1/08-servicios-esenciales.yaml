vocabulary:
  - slug: servicios-esenciales
    title: Servicios esenciales
    items: *servicios-esenciales-words

activities:
  - slug: servicios-esenciales-direcciones
    title: 'Direcciones: ser, estar y dar direcciones'
    minutes: 8
    items:
      - id: farmacia-esta
        type: multipleChoice
        prompt: La farmacia ___ al lado del banco.
        options:
          - { text: está, correct: true }
          - {
              text: es,
              feedback: 'Para decir dónde está un lugar, usa *estar*: *la farmacia está…*',
            }
          - {
              text: hay,
              feedback: 'Con un lugar específico (*la farmacia*) usa *está*. *Hay* es para algo no específico: *hay una farmacia*.',
            }
      - id: agua-es
        type: multipleChoice
        prompt: El agua potable ___ importante para todos.
        options:
          - { text: es, correct: true }
          - {
              text: está,
              feedback: 'Para una característica permanente usa *ser*: *es importante*.',
            }
          - { text: son, feedback: '*El agua* es singular: usa *es*.' }
      - id: ser-estar
        type: fillBlank
        prompt: Completa con *son* o *están*.
        text: Los hospitales ___ necesarios. Los médicos ___ en la sala de emergencias.
        blanks: [[son], [están]]
        wordBank: [son, están]
      - id: estar-lugar
        type: trueFalse
        prompt: 'Para decir dónde está un lugar, usamos *estar*: *La ambulancia está cerca del hospital.*'
        answer: true
        feedback:
          correct: ¡Correcto! *Estar* es para lugares y estados.
          incorrect: '*Estar* es para lugares y estados: *La ambulancia está cerca del hospital.*'
      - id: palabras
        type: matching
        prompt: Une cada palabra con su traducción.
        pairs:
          - [izquierda, שמאלה]
          - [derecha, ימינה]
          - [caminar, ללכת]
          - [girar, לפנות]
          - [a pie, ברגל]
      - id: sales-casa
        type: fillBlank
        prompt: 'Completa las direcciones. Usa la forma de *tú*: *caminas*, *giras*.'
        text: Sales de tu casa, ___ derecho dos cuadras y ___ a la izquierda.
        blanks: [[caminas, sigues], [giras, doblas]]
        wordBank: [caminas, giras]
      - id: como-llego
        type: multipleChoice
        prompt: —¿Cómo llego a la biblioteca? ¿Qué respuesta da direcciones?
        options:
          - { text: Caminas derecho y luego giras a la izquierda., correct: true }
          - {
              text: La biblioteca es grande.,
              feedback: 'Esta frase describe la biblioteca, pero no dice cómo llegar. Usa *caminar*, *girar*, *derecho*.',
            }
          - {
              text: Voy a la biblioteca los lunes.,
              feedback: 'Esta frase dice cuándo vas, no cómo llegar. Usa *caminar*, *girar*, *derecho*.',
            }
      - id: ordena-direcciones
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Caminas derecho y luego giras a la izquierda.

  - slug: servicios-esenciales-preposiciones
    title: 'Preposiciones: al lado de, entre, frente a'
    minutes: 8
    items:
      - id: hay-perro
        type: multipleChoice
        prompt: ___ un perro en el parque.
        options:
          - { text: Hay, correct: true }
          - { text: Está, feedback: 'Para algo nuevo o no específico (*un perro*) usa *hay*.' }
          - {
              text: Es,
              feedback: '*Es* describe una característica. Para algo nuevo o no específico usa *hay*.',
            }
      - id: pelota-esta
        type: fillBlank
        prompt: Completa con *hay* o *está*.
        text: La pelota de mi amigo ___ en el parque.
        blanks: [[está]]
        wordBank: [hay, está]
      - id: hay-hospital
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: En mi ciudad hay un hospital., correct: true }
          - {
              text: En mi ciudad está un hospital.,
              feedback: 'Con *un hospital* (no específico) usa *hay*.',
            }
          - {
              text: En mi ciudad hay el hospital.,
              feedback: 'Después de *hay* usa *un / una*: *hay un hospital*.',
            }
      - id: preposiciones
        type: matching
        prompt: Une cada preposición con su traducción.
        pairs:
          - [al lado de, ליד]
          - [entre, בין]
          - [frente a, מול]
          - [detrás de, מאחורי]
          - [en, ב]
      - id: de-la-escuela
        type: multipleChoice
        prompt: El banco está al lado ___ escuela.
        options:
          - { text: de la, correct: true }
          - {
              text: del,
              feedback: '*Escuela* es femenino: *de la escuela*. *Del* (de + el) es para palabras masculinas: *del parque*.',
            }
          - {
              text: de el,
              feedback: '*Escuela* es femenino: *de la escuela*. Y nunca decimos *de el*: decimos *del*.',
            }
      - id: del-de-la
        type: fillBlank
        prompt: Completa con *del* o *de la*.
        text: La parada de autobús está enfrente ___ parque. El museo está al lado ___ biblioteca.
        blanks: [[del], [de la]]
        wordBank: [del, de la]
      - id: hay-especifico
        type: trueFalse
        prompt: '*Hay* es para algo específico: *Hay la pelota de mi amigo en el parque.*'
        answer: false
        feedback:
          correct: ¡Correcto! Para algo específico usamos *está*.
          incorrect: 'Para algo específico usamos *está*: *La pelota de mi amigo está en el parque.* *Hay* es para algo nuevo o no específico.'
      - id: ordena-entre
