          - { term: Tres, gloss: שלוש }
          - { term: Cuatro, gloss: ארבע }
          - { term: Cinco, gloss: חמש }
          - { term: Seis, gloss: שש }
          - { term: Siete, gloss: שבע }
          - { term: Ocho, gloss: שמונה }
