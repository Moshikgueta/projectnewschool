vocabulary:
  - slug: familia
    title: Familia
    items: *familia-words

activities:
  - slug: familia-posesivos
    title: 'Posesivos: mi, tu, su, nuestro'
    minutes: 8
    items:
      - id: mis-padres
        type: multipleChoice
        prompt: ___ padres viven en Bogotá.
        options:
          - { text: Mis, correct: true }
          - { text: Mi, feedback: '*Padres* es plural: usa *mis*.' }
          - { text: Nuestra, feedback: '*Nuestra* es para una cosa femenina y singular.' }
      - id: su-padre
        type: multipleChoice
        prompt: Sam cocina muy bien. ___ padre es un gran cocinero.
        options:
          - { text: Su, correct: true }
          - { text: Sus, feedback: '*Padre* es singular: usa *su*.' }
          - { text: Mi, feedback: 'Hablamos del padre de Sam (de él): usa *su*.' }
      - id: nuestra-madre
        type: multipleChoice
        prompt: ___ madre cocina muy bien.
        options:
          - { text: Nuestra, correct: true }
          - { text: Nuestro, feedback: '*Madre* es femenino: usa *nuestra*.' }
          - { text: Nuestros, feedback: '*Madre* es singular: usa *nuestra*.' }
      - id: cambia-cosa
        type: trueFalse
        prompt: 'En español, el posesivo cambia según la cosa que viene después: *mi hermano*, *mis hermanos*.'
        answer: true
        feedback:
          correct: ¡Correcto! *Mis* porque *hermanos* es plural.
          incorrect: El posesivo cambia según la cosa (singular o plural), no según quién la tiene.
      - id: completa-posesivos
        type: fillBlank
        prompt: Completa con *mi*, *mis* o *sus*.
        text: Este es ___ hermano. Estos son ___ primos. Juan y Susana visitan a ___ tíos.
        blanks: [[mi], [mis], [sus]]
        wordBank: [mi, mis, sus]
      - id: une-posesivos
        type: matching
        prompt: Une cada persona con su posesivo (una cosa en singular).
        pairs:
          - [yo, mi]
          - [tú, tu]
          - [él / ella, su]
          - [nosotros, nuestro / nuestra]
          - [vosotros, vuestro / vuestra]
      - id: ordena-hermana
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Mi hermana se llama María.

  - slug: familia-fechas
    title: Fechas y números
    minutes: 8
    items:
      - id: naci-el
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: Nací el cinco de marzo., correct: true }
          - { text: Nací en cinco de marzo., feedback: 'Usa *el* antes del día y *en* antes del mes o del año.' }
          - { text: Nací el marzo cinco., feedback: 'Primero el día, después el mes: *el cinco de marzo*.' }
      - id: el-en
        type: fillBlank
        prompt: Completa con *el* o *en*.
        text: Mi cumpleaños es ___ 4 de julio. Nací ___ 1998.
        blanks: [[el], [en]]
      - id: numeros
        type: matching
        prompt: Une los números.
        pairs:
          - ['3', tres]
          - ['5', cinco]
          - ['7', siete]
          - ['9', nueve]
          - ['10', diez]
      - id: dia-primero
        type: trueFalse
        prompt: 'En español se escribe primero el día y después el mes: *4 de julio de 2024*.'
        answer: true
      - id: ordena-viaje
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Viajamos a París el cinco de julio.
      - id: seis
        type: fillBlank
        prompt: Escribe el número en palabras.
        text: 'Mi hermano tiene 6 años: tiene ___ años.'
        blanks: [[seis]]
      - id: mi-cumple
        type: shortAnswer
        prompt: ¿Cuándo es tu cumpleaños? Escribe una oración.
