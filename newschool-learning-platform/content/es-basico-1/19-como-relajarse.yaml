vocabulary:
  - slug: como-relajarse
    title: Cómo relajarse
    items: *relajarse-words

activities:
  - slug: como-relajarse-reflexivos
    title: 'Verbos reflexivos: me, te, se, nos'
    minutes: 8
    items:
      - id: yo-me
        type: multipleChoice
        prompt: Yo ___ relajo con música.
        options:
          - { text: me, correct: true }
          - { text: te, feedback: '*Te* es para *tú*. Con *yo* usa *me*: *yo me relajo*.' }
          - { text: se, feedback: '*Se* es para *él / ella / ellos*. Con *yo* usa *me*.' }
      - id: nosotros-nos
        type: multipleChoice
        prompt: Nosotros ___ concentramos en la respiración.
        options:
          - { text: nos, correct: true }
          - { text: se, feedback: '*Se* es para *él / ella / ellos*. Con *nosotros* usa *nos*.' }
          - { text: me, feedback: '*Me* es para *yo*. Con *nosotros* usa *nos*.' }
      - id: une-relajarse
        type: matching
        prompt: Une cada persona con el verbo *relajarse*.
        pairs:
          - [yo, me relajo]
          - [tú, te relajas]
          - [él / ella, se relaja]
          - [nosotros, nos relajamos]
          - [ellos / ellas, se relajan]
      - id: tu-te
        type: fillBlank
        prompt: Completa con el pronombre correcto (*me, te, se, nos*).
        text: Tú ___ sientas en una posición cómoda. Ellos ___ bañan con agua caliente.
        blanks: [[te], [se]]
      - id: ella-se-estira
