        type: multipleChoice
        prompt: Las luces ___ suaves.
        options:
          - { text: son, correct: true }
          - { text: es, feedback: '*Las luces* es plural: usa *son*.' }
          - { text: somos, feedback: '*Somos* es para *nosotros*. Para varias cosas usa *son*.' }
      - id: es-son
        type: fillBlank
        prompt: Completa con *es* o *son*.
