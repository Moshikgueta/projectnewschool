review:
  - >-
    The two workbook exercises ("Oraciones en presente" and "Posesivos") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's two
    skills, its summary rules and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    The notebook links a Gamma presentation (gamma.app), which is not on the link
    allow-list; it was left out and the teacher note mentions it.
  - >-
    The general information says Posesivos is practised with "actividad 2 o 4", but
    Activity 4 is about actions (presente) and Activity 5 (memory game) is the
    possessives one. The plan note now says: Presente – Activities 1, 3 and 4;
    Posesivos – Activities 2 and 5. Activity 1 (Simón dice) also uses possessives.
  - >-
    Summary table: the row "Nuestro – Nuestra casa es grande" is now "Nuestra"; the
    row "Su (de ellos) – Sus juegos son buenos" is now "Sus (de ellos)"; "Su juego
    favorito es dominó" is now "… es el dominó".
  - >-
    Summary rule "En tercera persona singular (él/ella) siempre cambia la
    terminación" was vague (the ending changes for every person); rewritten as: with
    *él / ella* the verb ends in *-a* (-ar verbs) or *-e* (-er, -ir verbs).
  - >-
    Warm-up: "¿Con quién juegas normalmente? Que juegan?" → "¿Con quién juegas
    normalmente? ¿A qué juegan?" (frame "Juego con ___. Jugamos a ___."); the
    favourite-game frame was punctuated as "Mi juego favorito es ___. Me gusta
    porque ___."
  - >-
    Mori, Activity 2: garbled emoji characters ("ð¨‍ð©…", "ð") were removed, and
    "pósters" is written "pósteres" (RAE plural).
  - >-
    Activity 4's "Versión interactiva" and "Ronda final" talk about finding "la
    mentira / la frase falsa", but the activity never asks students to include a
    false sentence. It is kept only as an optional variation in the teacher note,
    with the rule made explicit (one of the three sentences is false). Please
    confirm or remove.
  - >-
    Activity 2 (Adivina el concepto) uses possessive pronouns (*el mío, el tuyo, el
    de ella*), which the summary does not teach; kept as in the notebook. The
    exercises only use possessive adjectives (*mi, tu, su, nuestro*).
  - >-
    The memory game (Activity 5) Google Slides link is kept as the activity's
    resource (the notebook calls it a PowerPoint).
  - >-
    Vocabulary: "Sus" was glossed "שלהם/שלה"; now "שלו / שלה / שלהם (רבים)" to match
    "Su". Please confirm.
  - >-
    The notebook gives no times for this cycle's warm-up, activities or summary, so
    none are recorded (the introduction note keeps the usual 10 minutes).
  - >-
    The "Respuesta del estudiante 1/2/3" lines are replaced by the optional answer
    boxes (decision C2): students may type, and the teacher sees the group's answers.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: diversion-y-juegos-clase
    title: 'Clase: Diversión y juegos'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Diversión y juegos
      - id: skills
        type: cycleOverview
        skills:
          - name: Oraciones en presente
            description: 'Acciones en presente simple: *yo juego, tú lees, ella ve películas*'
          - name: Posesivos
            description: '*mi, tu, su, nuestro* y sus plurales (mi juego favorito)'
      - id: quizlet
        type: externalLink
        label: Diversión y juegos en Quizlet
        url: https://quizlet.com/br/1067940546/diversion-y-juegos-actualizado-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___. Mi actividad favorita durante la semana es ___.
        example: Soy Dana. Mi actividad favorita durante la semana es mi clase de yoga.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup
        type: discussionQuestions
        items:
          - question: ¿Qué te gusta hacer por la mañana?
            frame: Por la mañana me gusta ___.
          - question: ¿Qué te gusta hacer por la tarde o por la noche?
            frame: Por la tarde / noche me gusta ___.
          - question: ¿Qué hace tu hermano, hermana o amigo para divertirse?
            frame: Mi hermano / hermana / amigo / amiga ___. (*Mi hermano juega al fútbol. Mi amiga ve películas.*)
          - question: ¿Qué actividad haces en tu casa cuando llueve?
            frame: Cuando llueve, me quedo en mi casa y ___ con ___.
          - question: ¿Cuál es tu juego favorito? ¿Por qué te gusta?
            frame: Mi juego favorito es ___. Me gusta porque ___.
          - question: ¿Con quién juegas normalmente? ¿A qué juegan?
            frame: Juego con ___. Jugamos a ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Simón dice'
        skills: [Oraciones en presente, Posesivos]
        steps:
          - Escucha a tu profesor. Haz la acción solo si dice "Simón dice" y si la acción es para ti.
          - '¡Cuidado con los posesivos! *Levanta tu mano* es para ti; *levanta mi mano* no.'
          - Después, lee tú una frase y di a tus compañeros qué hacer.
        example: |-
          *Simón dice: "levanta tu mano derecha".*
          *Simón dice: "levanta mi mano derecha".*
          *Simón dice: "aplaude con tus manos".*
          *Simón dice: "golpea tus pies en el suelo".*
          *Simón dice: "tócate la nariz".*
          *Simón dice: "mueve tu cabello".*
          *Simón dice: "cierra tus ojos".*
      - id: act2
        type: classActivity
        title: 'Actividad 2: Adivina el concepto'
        skills: [Posesivos]
        steps:
          - Piensa en un concepto de la lista (por ejemplo, *cabello*). ¡No lo digas!
          - Da pistas con posesivos.
          - Los demás escuchan y adivinan el concepto.
        example: '*El mío es castaño. El tuyo es corto. El de ella es largo.* → **cabello**'
        wordBank:
          - cabello
          - ojos
          - ropa
          - zapatos
          - bolsa
          - casa
          - coche
          - teléfono
          - familia
          - mascota
      - id: act3
        type: classActivity
        title: 'Actividad 3: Escribimos una historia juntos'
        skills: [Oraciones en presente]
        steps:
          - Tu profesor dice la primera frase.
          - Cada estudiante añade una frase en presente para continuar la historia.
        example: |-
          *Profesor: Es un día lluvioso y yo…*
          *Estudiante 1: No me gusta.*
          *Estudiante 2: Voy al supermercado y yo…*
          *Estudiante 3: Me mojo.*
          *Fin.*
      - id: act3-starters
        type: discussionQuestions
        title: Primeras frases
        answerable: false
        items:
          - question: Es un día lluvioso y yo…
          - question: Juego al Monopoly con…
          - question: Limpio mi casa en un día lluvioso…
          - question: No me gustan los días lluviosos y yo…
          - question: Veo la televisión y…
      - id: act4
        type: classActivity
        title: 'Actividad 4: Tres acciones de mi día'
        skills: [Oraciones en presente]
        steps:
          - Elige 3 acciones que haces en tu día. Usa el presente simple.
          - Lee tus tres frases en voz alta. No es una historia, solo una lista.
          - Tus compañeros te hacen 1 pregunta sencilla (*¿A qué hora? ¿Dónde? ¿Con quién? ¿Con qué frecuencia?*).
          - Cambio de estudiante.
        example: |-
          *Yo escucho música por la mañana.*
          *Yo trabajo en una oficina.*
          *Yo cocino mi almuerzo.*
          Pregunta del grupo: *¿A qué hora cocinas tu almuerzo?*
      - id: act4-support
        type: table
        caption: Apoyo
        header: [Acciones comunes, Frecuencia]
        rows:
          - ['como, bebo, estudio, trabajo, camino, duermo', 'siempre, nunca, a veces']
          - [
              'escucho, veo, limpio, cocino, leo, hago ejercicio',
              'todos los días, los fines de semana',
            ]
      - id: act4-sentences
        type: discussionQuestions
        title: Mis tres acciones
        items:
          - question: 'Acción 1: Yo ___.'
          - question: 'Acción 2: Yo ___.'
          - question: 'Acción 3: Yo ___.'
      - id: act5
        type: classActivity
        title: 'Actividad 5: Juego de memoria'
        skills: [Posesivos]
        steps:
          - Tu profesor comparte la pantalla con las tarjetas. Cada tarjeta tiene un número.
          - Elige dos números (por ejemplo, "Quiero la 3 y la 12").
          - Tu profesor voltea las tarjetas. Detrás hay un posesivo (*mi, tu, su, nuestro, sus*) o un sustantivo (*hermano, perro, amigo, familia, coche, casa, profesor…*).
          - Si las dos tarjetas forman una pareja lógica (posesivo + sustantivo), di una frase completa en presente.
          - Si no forman pareja, se tapan otra vez y el turno pasa al siguiente estudiante.
        example: |-
          *Mi hermano → Mi hermano vive en Madrid.*
          *Tu madre → Tu madre cocina muy bien.*
          *Su padre → Su padre trabaja en un hospital.*
          *Nuestro amigo → Nuestro amigo toca la guitarra.*
        resource:
          label: Juego de memoria (tarjetas)
          url: https://docs.google.com/presentation/d/1tKMT0WwF2d4eUUbeHEK2Y_X0M-NscVaz/edit?usp=sharing&ouid=102507554103417656186&rtpof=true&sd=true
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Oraciones en presente** (preguntas de
          calentamiento, Actividades 1, 3 y 4) y **Posesivos** (Actividades 2 y 5; la
          Actividad 1 también usa posesivos). Elige la Actividad 1 o la 3 para el
          presente, y la 2 o la 5 para los posesivos. El cuaderno también tiene una
          presentación en Gamma para este ciclo (el enlace no está en la plataforma).
      - id: n-intro
        anchor: intro
        minutes: 10
        text: Da tu propio ejemplo primero ("Mi actividad favorita durante la semana es mi clase de yoga") y después pregunta a cada estudiante.
      - id: n-warmup
        anchor: warmup
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act1
        anchor: act1
        text: >-
          Da las instrucciones con posesivos. Los estudiantes solo hacen la acción si
          dices "Simón dice" y si la acción es para ellos (*tu mano* sí, *mi mano* no).
          Al final, los estudiantes pueden leer y decir las frases.
      - id: n-act4
        anchor: act4
        text: >-
          Variaciones opcionales: A. "Mi mañana en 3 frases" (solo acciones de la
          mañana). B. "Mi tarde en 3 frases". C. "Rutina de otra persona": el
          estudiante repite la rutina de un compañero en tercera persona (*Él escucha
          música. Ella cocina su almuerzo.*). D. "Clasificación": después de escuchar a
          5 compañeros, clasifican las acciones en comunes, raras e interesantes.
          Versión en parejas (una frase es falsa): A dice sus tres frases; B pregunta
          para verificar (*¿Estás seguro? ¿Dónde vive tu ___? ¿Por qué ___?*) y elige
          cuál es la mentira. Al final, cada estudiante dice cuál era la frase falsa.
      - id: n-act5
        anchor: act5
        text: Comparte la pantalla con la presentación y "voltea" las tarjetas que elige cada estudiante.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: diversion-y-juegos-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-present
        type: ruleSummary
        skill: Oraciones en presente
        rules:
          - text: 'Estructura básica: sujeto + verbo en presente + complemento.'
            examples: [Yo leo un libro., Ella juega al tenis.]
          - text: El verbo cambia según la persona.
            examples: [Yo camino., Tú caminas., Ellos caminan.]
          - text: Con *él / ella*, el verbo termina en *-a* (verbos en -ar) o en *-e* (verbos en -er e -ir).
            examples: [Él habla., Ella come., Él vive en Madrid.]
          - text: 'No hay verbos auxiliares: el verbo en presente va solo.'
            examples: [Yo juego al fútbol.]
      - id: present-table
        type: table
        caption: Verbos regulares en presente
        header: [Persona, '-ar: hablar', '-er: comer', '-ir: vivir']
        rows:
          - [yo, hablo, como, vivo]
          - [tú, hablas, comes, vives]
          - [él / ella, habla, come, vive]
          - [nosotros, hablamos, comemos, vivimos]
          - [ustedes / ellos, hablan, comen, viven]
      - id: rules-possessives
        type: ruleSummary
        skill: Posesivos
        rules:
          - text: 'El posesivo va **antes** del sustantivo: *mi juego favorito*, no *favorito juego mi*.'
            examples: [mi hermano, nuestra casa, sus amigos]
          - text: La frase dice qué es la cosa y de quién es.
          - text: El posesivo concuerda en **género y número** con el sustantivo, no con la persona.
            examples: [Nuestra casa (casa = femenino), Nuestro coche (coche = masculino)]
          - text: '*Su* puede ser de él, de ella, de usted, de ellos, de ellas o de ustedes. El contexto dice de quién es.'
      - id: possessives-table
        type: table
        caption: Los posesivos
        header: [Posesivo, Ejemplo]
        rows:
          - [Mi / Mis, 'Mi juego favorito es Monopoly. Mi casa, mis casas.']
          - [Tu / Tus, 'Tu juego favorito es Simón dice. Tu amigo, tus amigos.']
          - [Su (de él), Su juego favorito es el dominó.]
          - [Su (de ella), Su juego favorito es Mario Bros.]
          - [Sus (de ellos), Sus juegos son buenos.]
          - [
              Nuestro / Nuestra / Nuestros / Nuestras,
              'Nuestra casa es grande. Nuestro profesor, nuestros libros, nuestras casas.',
            ]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos habilidades con el grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: diversion-y-juegos-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia este mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: mori-juegos
        type: aiTutorPrompt
        title: Diversión y juegos
        message: >-
          ¡Hola, Mori! Quiero tener conversaciones cortas. Hazme preguntas sobre
          Diversión y Juegos usando posesivos y presente simple. Corrige mis errores,
          por favor.
      - id: mori-questions
        type: text
        text: |-
          Prepárate para responder con el **presente simple** y **posesivos** (*mi, tu, su, nuestro, sus*). Mori puede preguntarte:
          ¿Cuál es tu juego favorito? · ¿Juegas con tus amigos? · ¿Qué hace tu hermano o hermana para divertirse? · ¿Cuál es la actividad favorita de tu amigo o amiga?
          **Ejemplo de respuesta:** *Mi juego favorito es Monopoly. Juego con mis amigos todos los domingos.*
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Hazme más preguntas, por favor!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la frase en español?**
      - id: extra-title
        type: heading
        level: 3
        text: Práctica adicional
      - id: mori-adivina
        type: aiTutorPrompt
        title: Adivina el juego
        intro: Envía este mensaje a Mori.
        message: ¡Hola, Mori! Vamos a jugar. Pienso en un juego y tú tienes que adivinar cuál es.
      - id: mori-adivina-next
        type: text
        text: |-
          Dale pistas con el presente simple y posesivos. **Ejemplo:** *Es mi juego favorito. Juego en mi teléfono. A mi hermano no le gusta.*
          Cuando Mori adivine, escribe: «Ahora es tu turno. Piensa en un juego y yo lo adivinaré.»
      - id: mori-quien
        type: aiTutorPrompt
        title: ¿Quién lo hace?
        intro: Envía este mensaje a Mori.
        message: >-
          ¡Hola, Mori! Vamos a jugar. Te digo algo que alguien de mi familia hace para
          divertirse. Tú tienes que adivinar quién es. Voy a usar posesivos y presente
          simple.
      - id: mori-quien-next
        type: text
        text: |-
          **Ejemplos de frases:** *Ella juega al tenis todos los sábados. Es la hija de mi papá.* · *Él juega a la computadora después de la escuela. Es el hijo de mis padres.* · *Ella ve películas con su mejor amiga. Su habitación está llena de pósteres.*
          Mori adivina, por ejemplo: *¿Es tu hermana?*
          Después, escribe: «Ahora es tu turno. Dime algo que alguien de tu familia hace para divertirse y yo lo adivinaré.»

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: diversion-y-juegos-practica
    book: workbook
    title: 'Práctica: Diversión y juegos'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practica las dos habilidades del ciclo. Cada respuesta se corrige al momento, y puedes intentarlo otra vez.
      - id: ex-presente
        type: activity
        activity: diversion-y-juegos-presente
      - id: ex-posesivos
        type: activity
        activity: diversion-y-juegos-posesivos

