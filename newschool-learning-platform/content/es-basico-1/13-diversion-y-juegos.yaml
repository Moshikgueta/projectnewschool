vocabulary:
  - slug: diversion-y-juegos
    title: Diversión y juegos
    items: *diversion-y-juegos-words

activities:
  - slug: diversion-y-juegos-presente
    title: 'Oraciones en presente: acciones'
    minutes: 8
    items:
      - id: ella-juega
        type: multipleChoice
        prompt: Ella ___ al tenis.
        options:
          - { text: juega, correct: true }
          - { text: juego, feedback: '*Juego* es para *yo*. Con *ella* usa *juega*.' }
          - {
              text: juegan,
              feedback: '*Juegan* es para *ellos* o *ustedes*. Con *ella* usa *juega*.',
            }
      - id: ella-lee
        type: multipleChoice
        prompt: ¿Qué frase es correcta?
        options:
          - { text: Ella lee un libro., correct: true }
          - {
              text: Ella leo un libro.,
              feedback: '*Leo* es para *yo*. Con *ella*, el verbo termina en *-e*: *lee*.',
            }
          - { text: Ella lees un libro., feedback: '*Lees* es para *tú*. Con *ella*: *lee*.' }
      - id: nosotros-vivimos
        type: multipleChoice
        prompt: Nosotros ___ en Madrid. (vivir)
        options:
          - { text: vivimos, correct: true }
          - { text: vivemos, feedback: 'Vivir es un verbo en *-ir*: *nosotros vivimos*.' }
          - {
              text: viven,
              feedback: '*Viven* es para *ellos* o *ustedes*. Con *nosotros*: *vivimos*.',
            }
      - id: leo-escuchas
        type: fillBlank
        prompt: Completa con el verbo en presente.
        text: Yo ___ (leer) un libro y tú ___ (escuchar) música.
        blanks: [[leo], [escuchas]]
      - id: hermano-come
        type: fillBlank
        prompt: Completa con el verbo en presente.
        text: Mi hermano ___ (comer) pizza los sábados.
        blanks: [[come]]
      - id: cambia-persona
        type: trueFalse
        prompt: 'En español, el verbo cambia según la persona: *yo camino*, *tú caminas*, *ellos caminan*.'
        answer: true
        feedback:
          correct: ¡Correcto! Cada persona tiene su terminación.
          incorrect: 'El verbo sí cambia: *yo camino*, *tú caminas*, *ellos caminan*.'
      - id: hablar
        type: matching
        prompt: Une cada persona con el verbo *hablar*.
        pairs:
          - [yo, hablo]
          - [tú, hablas]
          - [él / ella, habla]
          - [nosotros, hablamos]
          - [ellos / ustedes, hablan]
      - id: ordena-futbol
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Mi hermano juega al fútbol.

  - slug: diversion-y-juegos-posesivos
    title: 'Posesivos: mi, tu, su, nuestro'
    minutes: 8
    items:
      - id: nuestra-casa
        type: multipleChoice
        prompt: ___ casa es grande. (de nosotros)
        options:
          - { text: Nuestra, correct: true }
          - { text: Nuestro, feedback: '*Casa* es femenino: usa *nuestra*.' }
          - { text: Nuestras, feedback: '*Casa* es singular: usa *nuestra*.' }
      - id: sus-perros
        type: multipleChoice
        prompt: Ana y Luis tienen dos perros. ___ perros son pequeños.
        options:
