vocabulary:
  - slug: profesiones
    title: Profesiones
    items: *profesiones-words

activities:
  - slug: profesiones-presente
    title: 'Acciones en presente: -ar, -er, -ir'
    minutes: 8
    items:
      - id: yo-trabajo
        type: multipleChoice
        prompt: Yo ___ en un hospital.
        options:
          - { text: trabajo, correct: true }
          - {
              text: trabaja,
              feedback: '*Trabaja* es para *él / ella*. Con *yo* el verbo termina en *-o*.',
            }
          - {
              text: trabajar,
              feedback: '*Trabajar* es el infinitivo. Con *yo* el verbo termina en *-o*: *trabajo*.',
            }
      - id: ella-escribe
        type: multipleChoice
        prompt: Ella ___ recetas para sus pacientes.
        options:
          - { text: escribe, correct: true }
          - { text: escribo, feedback: '*Escribo* es para *yo*. Con *ella* usa *escribe*.' }
          - {
              text: escriben,
              feedback: '*Escriben* es para *ellos / ellas*. Con *ella* usa *escribe*.',
            }
      - id: completa-grupos
        type: fillBlank
        prompt: Completa con el verbo en presente.
        text: Nosotros ___ (trabajar) en una empresa. Ustedes ___ (vender) pan. Tú ___ (escribir) informes.
        blanks: [[trabajamos], [venden], [escribes]]
      - id: quiero-ensenar
        type: multipleChoice
        prompt: Yo quiero ___ inglés.
        options:
          - { text: enseñar, correct: true }
          - {
              text: enseño,
              feedback: 'Después de *quiero*, el verbo va en infinitivo: *quiero enseñar*.',
            }
          - {
              text: enseña,
              feedback: 'Después de *quiero*, el verbo va en infinitivo: *quiero enseñar*.',
            }
      - id: necesito-infinitivo
        type: fillBlank
        prompt: Completa con el verbo correcto.
        text: Yo necesito ___ (preparar) una presentación.
        blanks: [[preparar]]
      - id: infinitivo-regla
        type: trueFalse
        prompt: 'Después de *quiero*, *necesito* o *puedo*, el verbo va en infinitivo: *Ellos pueden construir una casa.*'
        answer: true
        feedback:
          correct: ¡Correcto! *Pueden construir*, *quiero enseñar*, *necesito preparar*.
          incorrect: 'Después de *quiero / necesito / puedo* el verbo no cambia: *quiero enseñar*, no *quiero enseño*.'
      - id: une-ensenar
        type: matching
        prompt: Une cada persona con la forma del verbo *enseñar*.
        pairs:
          - [yo, enseño]
          - [tú, enseñas]
          - [él / ella, enseña]
          - [nosotros, enseñamos]
          - [ellos / ellas, enseñan]
      - id: ordena-construir
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Ellos pueden construir una casa.

  - slug: profesiones-numeros
    title: Números
    minutes: 8
    items:
      - id: decenas
        type: matching
        prompt: Une los números.
        pairs:
          - ['30', treinta]
          - ['40', cuarenta]
          - ['50', cincuenta]
          - ['60', sesenta]
          - ['90', noventa]
      - id: cuarenta-y-cinco
        type: multipleChoice
        prompt: ¿Cómo se dice 45?
        options:
          - { text: cuarenta y cinco, correct: true }
          - {
              text: cincuenta y cuatro,
              feedback: '*Cincuenta y cuatro* es 54. Primero la decena (40 = cuarenta), después *y* + cinco.',
            }
          - {
              text: cuatro cinco,
              feedback: 'Decimos la decena + *y* + el número: *cuarenta y cinco*.',
            }
