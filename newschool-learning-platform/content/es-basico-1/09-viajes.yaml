vocabulary:
  - slug: viajes
    title: Viajes
    items: *viajes-words

activities:
  - slug: viajes-preguntas
    title: 'Preguntas: qué, dónde, cuándo, cómo'
    minutes: 8
    items:
      - id: une-respuestas
        type: matching
        prompt: Une cada pregunta con su respuesta.
        pairs:
          - [¿Cuándo vas de vacaciones?, En julio.]
          - [¿Adónde vas en verano?, A la playa.]
          - [¿Con quién viajas?, Con mis amigos.]
          - [¿Cómo viajas a otro país?, En avión.]
          - [¿Dónde duermes cuando viajas?, En un hotel.]
      - id: por-que
        type: multipleChoice
        prompt: 'Respuesta: *Porque me gusta explorar.* ¿Cuál es la pregunta?'
        options:
          - { text: ¿Por qué viajas?, correct: true }
          - {
              text: ¿Cuándo viajas?,
              feedback: '*Cuándo* pregunta por el tiempo: *En julio.* Para *Porque…* la pregunta es *¿Por qué…?*',
            }
          - {
              text: ¿Con quién viajas?,
              feedback: '*Con quién* pregunta por personas: *Con mis amigos.* Para *Porque…* la pregunta es *¿Por qué…?*',
            }
      - id: donde-quien
        type: fillBlank
        prompt: Completa la pregunta.
        text: ¿___ duermes cuando viajas? — En un hotel. ¿Con ___ viajas? — Con mis amigos.
        blanks: [[Dónde], [quién]]
      - id: pregunta-correcta
        type: multipleChoice
        prompt: ¿Qué pregunta está bien escrita?
        options:
          - { text: ¿Cuándo vas de vacaciones?, correct: true }
          - {
              text: ¿Vas cuándo de vacaciones?,
              feedback: 'La palabra interrogativa va primero, y después el verbo: *¿Cuándo vas…?*',
            }
          - { text: ¿Cuando vas de vacaciones?, feedback: 'En una pregunta, *cuándo* lleva tilde.' }
      - id: signos
        type: trueFalse
        prompt: 'En español, una pregunta empieza con *¿* y termina con *?*.'
        answer: true
        feedback:
          correct: ¡Correcto! *¿Qué haces en vacaciones?*
          incorrect: 'En español escribimos los dos signos: *¿Qué haces en vacaciones?*'
      - id: acaso-no
        type: fillBlank
        prompt: Completa la pregunta negativa.
        text: ¿Acaso ___ hay un festival famoso cada año?
        blanks: [[no]]
      - id: ordena-comer
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: ¿Qué te gusta comer cuando viajas?
      - id: tu-pregunta
        type: shortAnswer
        prompt: 'Escribe una pregunta para esta respuesta: *En avión.*'

  - slug: viajes-direcciones
    title: 'Direcciones: sigue recto, gira a la izquierda'
    minutes: 8
    items:
      - id: une-ubicacion
        type: matching
        prompt: Une cada expresión con su traducción.
        pairs:
          - [al lado de, ליד]
          - [frente a, מול]
          - [a la derecha, ימינה]
          - [a la izquierda, שמאלה]
          - [recto, ישר]
      - id: llego-playa
        type: multipleChoice
        prompt: —¿Cómo llego a la playa? ¿Qué respuesta da direcciones?
        options:
          - { text: Sigue recto dos cuadras y gira a la izquierda., correct: true }
          - {
              text: Me gusta la playa.,
              feedback: 'Esta frase no dice cómo llegar. Usa frases como *sigue recto* o *gira a la izquierda*.',
            }
          - {
              text: En julio.,
              feedback: 'Esta respuesta dice cuándo, no cómo llegar. Usa frases como *sigue recto* o *gira a la izquierda*.',
            }
      - id: sigue-gira
        type: fillBlank
        prompt: Completa con *Sigue* o *Gira*.
        text: ___ recto dos cuadras. ___ a la derecha en el semáforo.
        blanks: [[Sigue, Camina, Ve], [Gira, Dobla]]
        wordBank: [Sigue, Gira]
      - id: derecha-izquierda
        type: fillBlank
        prompt: Completa con la palabra en español.
        text: Gira a la ___ (ימינה). El museo está a la ___ (שמאלה).
        blanks: [[derecha], [izquierda]]
      - id: frases-cortas
        type: trueFalse
        prompt: 'Para dar direcciones, es mejor usar frases cortas y claras: *Sigue recto. Gira a la izquierda.*'
        answer: true
        feedback:
          correct: ¡Correcto! Frases cortas y paso a paso.
          incorrect: 'Las direcciones son más claras con frases cortas y paso a paso: *Sigue recto. Gira a la izquierda.*'
      - id: frente-al
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: El museo está frente al parque., correct: true }
          - {
              text: El museo está frente a el parque.,
              feedback: 'Decimos *al* (a + el): *frente al parque*.',
            }
          - {
              text: El museo está frente la parque.,
              feedback: '*Parque* es masculino y necesitamos *a*: *frente al parque*.',
            }
      - id: ordena-panaderia
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Pasa la panadería, el museo está a la izquierda.
      - id: ordena-camina
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Camina dos cuadras y gira a la derecha.
