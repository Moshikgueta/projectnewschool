vocabulary:
  - slug: descubrimientos
    title: Descubrimientos
    items: *descubrimientos-words

activities:
  - slug: descubrimientos-acciones
    title: Acciones en presente
    minutes: 8
    items:
      - id: pajaro-vuela
        type: multipleChoice
        prompt: El pájaro ___.
        options:
          - { text: vuela, correct: true }
          - {
              text: volar,
              feedback: '*Volar* es el infinitivo. Con *el pájaro* (él), el verbo cambia: *vuela*.',
            }
          - {
              text: vuelan,
              feedback: '*Vuelan* es para muchos (ellos). *El pájaro* es uno: *vuela*.',
            }
      - id: animales
        type: fillBlank
        prompt: Escribe el verbo en presente.
        text: El elefante ___ (caminar). La jirafa ___ (comer). El mono ___ (trepar).
        blanks: [[camina], [come], [trepa]]
      - id: une-verbos
        type: matching
        prompt: Une cada verbo con su forma para *él / ella*.
        pairs:
          - [caminar, camina]
          - [comer, come]
          - [volar, vuela]
          - [trepar, trepa]
          - [sonreír, sonríe]
      - id: cambian-persona
        type: trueFalse
        prompt: 'En español, los verbos cambian según la persona: *yo camino*, *ella camina*.'
        answer: true
        feedback:
          correct: ¡Correcto! *Yo camino*, *tú caminas*, *él camina*…
          incorrect: 'Los verbos sí cambian según la persona: *yo camino*, *ella camina*.'
      - id: nosotros-estudiamos
        type: multipleChoice
        prompt: Nosotros ___ español.
        options:
          - { text: estudiamos, correct: true }
          - {
              text: estudia,
              feedback: '*Estudia* es para *él* o *ella*. Con *nosotros*: *estudiamos*.',
            }
          - { text: estudio, feedback: '*Estudio* es para *yo*. Con *nosotros*: *estudiamos*.' }
      - id: que-hace-jirafa
        type: multipleChoice
        prompt: ¿Qué hace la jirafa?
        options:
          - { text: La jirafa come., correct: true }
          - {
              text: La jirafa comer.,
              feedback: '*Comer* es el infinitivo. Con *la jirafa* (ella): *come*.',
            }
          - {
              text: La jirafa comes.,
              feedback: '*Comes* es para *tú*. Con *la jirafa* (ella): *come*.',
            }
      - id: creativo-logico
        type: fillBlank
        prompt: Escribe el verbo en presente.
        text: Cuando me siento creativa, yo ___ (dibujar) cosas nuevas. Dana ___ (contar) y ___ (resolver) problemas cuando es lógica.
        blanks: [[dibujo], [cuenta], [resuelve]]
      - id: ordena-clase
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Ella canta en la clase.

  - slug: descubrimientos-preposiciones
    title: Preposiciones de lugar
    minutes: 8
    items:
      - id: japon-lejos
        type: multipleChoice
        prompt: Japón está ___ Israel.
        options:
          - { text: lejos de, correct: true }
          - { text: cerca de, feedback: 'Japón está muy lejos de Israel: *lejos de*.' }
          - {
              text: al lado de,
              feedback: '*Al lado de* es muy cerca, sin nada entre los dos. Japón está *lejos de* Israel.',
            }
      - id: contrario
        type: multipleChoice
        prompt: ¿Cuál es lo contrario de *cerca de*?
        options:
          - { text: lejos de, correct: true }
          - {
              text: al lado de,
              feedback: '*Al lado de* también es cerca. Lo contrario es *lejos de*.',
            }
          - {
              text: debajo de,
              feedback: '*Debajo de* es lo contrario de *arriba de*. Lo contrario de *cerca de* es *lejos de*.',
            }
      - id: une-hebreo
        type: matching
        prompt: Une cada preposición con su traducción.
        pairs:
          - [arriba de, מעל ל]
          - [debajo de, מתחת]
          - [al lado de, ליד]
          - [cerca de, קרוב ל]
          - [lejos de, רחוק מ]
      - id: egipto-japon
        type: fillBlank
        prompt: Completa con *cerca*, *al lado* o *lejos*.
        text: Egipto está ___ de Israel. Japón está ___ de Israel.
        blanks: [[cerca, al lado], [lejos]]
        wordBank: [cerca, al lado, lejos]
      - id: cabeza-pies
        type: trueFalse
        prompt: La cabeza está arriba de los pies.
        answer: true
        feedback:
          correct: ¡Correcto! La cabeza está arriba; los pies están abajo.
          incorrect: 'La cabeza está **arriba de** los pies, y los pies están **debajo de** la cabeza.'
      - id: perro-mesa
        type: multipleChoice
        prompt: El perro no está arriba de la mesa. Está ___ la mesa.
        options:
          - { text: debajo de, correct: true }
          - {
              text: arriba de,
              feedback: 'El perro **no** está arriba. Lo contrario de *arriba de* es *debajo de*.',
            }
          - {
              text: encima de,
              feedback: '*Encima de* es lo mismo que *arriba de*. El perro está *debajo de* la mesa.',
            }
      - id: boca-cara
        type: multipleChoice
        prompt: ¿Está tu boca en la cara?
        options:
          - { text: 'Sí, está en la cara.', correct: true }
