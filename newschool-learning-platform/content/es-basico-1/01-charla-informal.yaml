vocabulary:
  - slug: charla-informal
    title: Charla informal
    items: *charla-informal-words

activities:
  - slug: charla-informal-preguntas
    title: 'Hacer preguntas: qué, dónde, cuándo, por qué, cómo'
    minutes: 8
    items:
      - id: vivo-en
        type: multipleChoice
        prompt: '*Vivo en Tel Aviv.* ¿Cuál es la pregunta?'
        options:
          - { text: ¿Dónde vives?, correct: true }
          - {
              text: ¿Cuándo vives?,
              feedback: '*Cuándo* pregunta por el tiempo. Tel Aviv es un lugar: usa *dónde*.',
            }
          - {
              text: ¿Qué vives?,
              feedback: '*Qué* pregunta por cosas. Tel Aviv es un lugar: usa *dónde*.',
            }
      - id: soy-de
        type: multipleChoice
        prompt: '*Soy de Francia.* ¿Cuál es la pregunta?'
        options:
          - { text: ¿De dónde eres?, correct: true }
          - {
              text: ¿Dónde vives?,
              feedback: 'La respuesta a *¿Dónde vives?* es *Vivo en…*. *Soy de…* responde a *¿De dónde eres?*',
            }
          - {
              text: ¿Cómo eres?,
              feedback: '*¿Cómo eres?* pregunta por tu forma de ser (alto, simpático…), no por tu país.',
            }
      - id: como-estas
        type: multipleChoice
        prompt: '¿___ estás hoy? — Estoy bien, gracias.'
        options:
          - { text: Cómo, correct: true }
          - { text: Dónde, feedback: '*Bien* no es un lugar. Para sentimientos usa *cómo*.' }
          - {
              text: Por qué,
              feedback: 'La respuesta no es una razón. Para sentimientos usa *cómo*.',
            }
      - id: palabras-uso
        type: matching
        prompt: Une cada palabra interrogativa con su uso.
        pairs:
          - [Qué, cosas]
          - [Dónde, lugares]
          - [Cuándo, el tiempo]
          - [Por qué, razones]
          - [Cómo, formas o sentimientos]
      - id: si-no
        type: trueFalse
        prompt: Usamos las palabras interrogativas para preguntas que se responden solo con «sí» o «no».
        answer: false
        feedback:
          correct: '¡Correcto! Las palabras interrogativas piden información: *¿Dónde vives? — En Tel Aviv.*'
          incorrect: 'Las palabras interrogativas piden información, no solo «sí» o «no»: *¿Dónde vives? — En Tel Aviv.*'
      - id: que-donde
        type: fillBlank
        prompt: Completa con la palabra interrogativa correcta.
        text: ¿___ te gusta hacer? — Me gusta bailar. ¿___ trabajas? — Trabajo en New School.
        blanks: [[Qué], [Dónde]]
        wordBank: [Qué, Dónde, Cuándo]
      - id: por-que
        type: fillBlank
        prompt: Completa la pregunta.
        text: ¿___ te gusta viajar? — Porque me gusta conocer nuevos lugares.
        blanks: [[Por qué]]
      - id: ordena-pregunta
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: ¿Cuándo es tu cumpleaños?

  - slug: charla-informal-descriptivas
    title: 'Oraciones descriptivas: ser y estar'
    minutes: 8
    items:
      - id: estoy-cansado
        type: multipleChoice
        prompt: Yo ___ cansado.
        options:
          - { text: estoy, correct: true }
          - { text: soy, feedback: '*Cansado* es un estado que cambia: usa *estar* (yo estoy).' }
          - { text: está, feedback: 'Con *yo* el verbo es *estoy*.' }
      - id: estan-playa
        type: multipleChoice
        prompt: Ellos ___ en la playa.
        options:
          - { text: están, correct: true }
          - { text: son, feedback: 'Para la ubicación (dónde estás) usa *estar*.' }
          - { text: estamos, feedback: '*Estamos* es para *nosotros*. Con *ellos* usa *están*.' }
      - id: completa-ser
        type: fillBlank
        prompt: Completa con el verbo *ser*.
        text: Yo ___ de Francia. Tú ___ alto. Ellas ___ agradables.
        blanks: [[soy], [eres], [son]]
      - id: completa-estar
        type: fillBlank
        prompt: Completa con el verbo *estar*.
        text: Nosotros no ___ tristes. ¿Cómo ___ tú hoy? Mi madre ___ en casa.
        blanks: [[estamos], [estás], [está]]
      - id: une-ser
        type: matching
        prompt: Une cada persona con la forma del verbo *ser*.
        pairs:
          - [yo, soy]
          - [tú, eres]
          - [él / ella, es]
          - [nosotros, somos]
          - [ellos / ellas, son]
      - id: negativa
        type: trueFalse
        prompt: 'Para la forma negativa, ponemos *no* antes del verbo: *Ellos no son altos.*'
        answer: true
        feedback:
          correct: ¡Correcto! *No* va antes del verbo.
          incorrect: '*No* va antes del verbo: *Ellos no son altos*, *Nosotros no estamos tristes*.'
      - id: emociones
        type: trueFalse
        prompt: 'Para una emoción de hoy usamos *ser*: *Soy triste hoy.*'
        answer: false
        feedback:
          correct: '¡Correcto! Las emociones que cambian van con *estar*: *Estoy triste hoy.*'
          incorrect: 'Las emociones que cambian van con *estar*: *Estoy triste hoy.*'
      - id: ordena-casa
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Mi hermana no está en casa.
