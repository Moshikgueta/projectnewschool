vocabulary:
  - slug: proyectos-y-metas
    title: Proyectos y metas
    items: *proyectos-words

activities:
  - slug: proyectos-y-metas-verbos
    title: Verbos en presente
    minutes: 8
    items:
      - id: nosotros-estudiamos
        type: multipleChoice
        prompt: Nosotros ___ juntos para el examen.
        options:
          - { text: estudiamos, correct: true }
          - {
              text: estudian,
              feedback: '*Estudian* es para *ellos* o *ustedes*. Con *nosotros*, el verbo termina en *-amos*: *estudiamos*.',
            }
          - {
              text: estudio,
              feedback: '*Estudio* es para *yo*. Con *nosotros*, el verbo termina en *-amos*: *estudiamos*.',
            }
      - id: completa-presente
        type: fillBlank
        prompt: Escribe el verbo en presente.
        text: Yo ___ (vivir) cerca de mi trabajo. Tú ___ (vender) tus ideas en el trabajo. Ellos ___ (estudiar) para progresar.
        blanks: [[vivo], [vendes], [estudian]]
      - id: une-vivir
        type: matching
        prompt: Une cada persona con la forma de *vivir*.
        pairs:
          - [yo, vivo]
          - [tú, vives]
          - [él / ella, vive]
          - [nosotros, vivimos]
          - [vosotros, vivís]
      - id: necesitas-organizar
        type: multipleChoice
        prompt: Tú necesitas ___ tu tiempo mejor.
        options:
          - { text: organizar, correct: true }
          - {
              text: organizas,
              feedback: 'Después de *necesitas*, el verbo va en infinitivo: *necesitas organizar*.',
            }
          - {
              text: organizo,
              feedback: 'Después de *necesitas*, el verbo va en infinitivo: *necesitas organizar*.',
            }
      - id: quiero-infinitivo
        type: trueFalse
        prompt: 'En la oración *Yo quiero estudiar*, el verbo *estudiar* está en infinitivo.'
        answer: true
        feedback:
          correct: ¡Correcto! Después de *quiero*, el verbo no cambia.
          incorrect: 'Después de *quiero*, *necesito* o *puedo*, el verbo va en infinitivo: *estudiar*.'
      - id: oraciones-correctas
        type: multipleChoice
        prompt: ¿Qué oraciones son correctas? Elige dos.
        options:
          - { text: Yo quiero viajar este verano., correct: true }
          - { text: Nosotros queremos empezar el curso mañana., correct: true }
          - {
              text: Yo puedo practico todos los días.,
              feedback: 'Después de *puedo*, usa el infinitivo: *Yo puedo practicar todos los días.*',
            }
          - {
              text: Él quiere termina su trabajo.,
              feedback: 'Después de *quiere*, usa el infinitivo: *Él quiere terminar su trabajo.*',
            }
      - id: necesitan-descansar
        type: fillBlank
        prompt: Escribe el verbo *necesitar* en presente.
        text: Ustedes ___ descansar después de la semana de trabajo.
        blanks: [[necesitan]]
      - id: ordena-ayudar
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Ella puede ayudar con el proyecto.

  - slug: proyectos-y-metas-fechas
    title: Fechas y números
    minutes: 8
    items:
      - id: decenas
        type: matching
        prompt: Une los números.
        pairs:
          - ['20', veinte]
          - ['30', treinta]
