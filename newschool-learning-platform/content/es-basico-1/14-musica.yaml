course: es-basico-1
slug: musica
title: Música
goal: Hablar de música con preguntas y verbos en presente.
position: 14
status: in_review

review:
  - >-
    The two workbook exercises ("Preguntas" and "Verbos en presente") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's two
    skills, its summary rules and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Activity 4 ("Vivir mi vida", Marc Anthony) is a gap-fill of the song lyrics. The
    lyrics are NOT copied into the platform (copyright). The activity links to a
    YouTube search for the song (the notebook has no link, and the official video
    URL could not be verified from here: please replace it with the official video
    or the Genius page). Only the verb bank is kept; the teacher shows the lyrics
    from the old notebook or from Genius with the verbs hidden. The artist's name
    is corrected from "Marc Antony" to "Marc Anthony".
  - >-
    Activity 1 ("Me gustas tú", Manu Chao) keeps the notebook's YouTube link; its
    questions are about the song, but no lyrics are copied.
  - >-
    Activity 2's title says "VERBOS - cambiar": "cambiar" looks like an author's note
    that the activity should be replaced. It is kept as it is (the poem is the
    notebook's own, not song lyrics); the solved poem is in a teacher note. Please
    decide whether to replace it.
  - >-
    Activity 1 had "Etapa 1" and "Etapa 3" but no "Etapa 2"; the steps are
    renumbered.
  - >-
    Activity 3: "Me gusta bailar con salsa" → "Me gusta bailar salsa", with the
    matching question "¿Qué te gusta bailar?" (was "¿Con qué música te gusta
    bailar?"). "¿Cómo escuchas música? (¿radio, teléfono, ordenador?)" →
    "(¿en la radio, en el teléfono, en el ordenador?)".
  - >-
    Summary, questions rule 1: "Los utilizamos para cualquier pregunta cuya
    respuesta sea no sí/no" → "Las usamos en las preguntas cuya respuesta no es sí o
    no". Rule 2 said "Palabra interrogativa + Sujeto + Verbo + Detalles"; in Spanish
    questions the subject normally follows the verb (¿Dónde toca Ana la guitarra?),
    so the structure is rewritten as "Palabra interrogativa + verbo + (sujeto) +
    detalles". Please confirm. "Cuando" → "Cuándo" in the list of question words.
  - >-
    Summary, present tense: the -ar/-er/-ir conjugations are shown as one table
    (tocar, vender, vivir) with a few of the notebook's example sentences, instead
    of all 21 sentences. The notebook's extra rule 4 (gustar) is kept as rule 4.
  - >-
    Homework: the notebook's homework is written work, not a Mori conversation, so
    the "Tarea" section has two answer boxes and no Mori prompt or tips. The example
    for the question task ("¿Cuál es tu canción favorita?") did not use the
    requested words qué / dónde / cuándo; it is replaced by "¿Qué música escuchas?".
  - >-
    Warm-up: "escucho música por la (parte del día)" → "Escucho música por la
    mañana / por la tarde / por la noche"; "Podcasts" → "podcasts".
  - >-
    Vocabulary: "Viajar" was glossed "לטוס" (to fly); it is now "לנסוע / לטייל".
    "Vivir" appeared twice; the duplicate is removed. "Poema" (was "שיר", the same as
    "Canción") is now "שיר (פואמה)". "Gustar" (was "לאהוב") is now "למצוא חן / לאהוב".
    Please confirm.
  - >-
    Activity 5 time (15–20 minutes) is recorded as 20 minutes. The other activities
    have no time in the notebook, so none is given.
  - >-
    The "pizarrón" (board) tally in Activity 5 and the timing advice for the
    introduction round are in teacher notes.
  - >-
    The notebook gives no recommended activity combinations for this cycle; the
    plan note lists which activities practise each skill (Activity 5 practises both).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: musica-clase
    title: 'Clase: Música'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Música
      - id: skills
        type: cycleOverview
        skills:
          - name: Preguntas
            description: 'Formar preguntas con *qué, dónde, cuándo, quién*'
          - name: Verbos en presente
            description: Los verbos en *-ar, -er, -ir* en presente simple (*toco, vendo, vivo*)
      - id: quizlet
        type: externalLink
        label: Música en Quizlet
        url: https://quizlet.com/il/994813811/music-basic-spanish-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___. Escucho música todos los días / ___ veces a la semana.
        example: Soy Dana. Escucho música todos los días.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup
        type: discussionQuestions
        items:
          - question: ¿Cuál es tu canción favorita?
            frame: Mi canción favorita es ___.
          - question: ¿Dónde escuchas música?
            frame: Escucho música en el / la / mi ___.
          - question: ¿Cuándo escuchas música?
            frame: Escucho música por la mañana / por la tarde / por la noche.
          - question: ¿La música es importante para ti? ¿Por qué?
            frame: Sí, la música es importante para mí porque ___. / No, la música no es importante para mí porque ___.
          - question: ¿Qué haces cuando escuchas tu canción favorita?
            frame: Yo ___ (bailo, canto, pienso, cocino) cuando escucho ___.
          - question: ¿Prefieres escuchar música o podcasts? ¿Por qué?
            frame: Prefiero escuchar ___ porque ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Hacemos preguntas a la canción'
        skills: [Preguntas]
        steps:
          - Escucha la canción «Me gustas tú» de Manu Chao.
          - Tu profesor explica el significado de la letra hasta el primer estribillo.
          - Responde a las preguntas de abajo. Busca las respuestas en la canción.
        resource:
          label: «Me gustas tú», Manu Chao (YouTube)
          url: https://www.youtube.com/watch?v=rs6Y4kZ8qtw
      - id: act1-questions
        type: discussionQuestions
        title: Preguntas sobre la canción
        items:
          - question: ¿Qué cosas le gusta **hacer** a Manu Chao? (Busca verbos.)
          - question: ¿Qué cosas le gustan a Manu Chao? (Busca sustantivos.)
          - question: ¿Qué preguntas hace?
          - question: ¿Qué nacionalidad le gusta a Manu Chao?
          - question: ¿Puedes hacer una frase con «me gusta» sobre algo que te gusta a ti?
            frame: Me gusta ___.
          - question: ¿Por qué te gusta (o no te gusta) esta canción?
            frame: Me gusta / No me gusta esta canción porque ___.
          - question: ¿Por qué esta canción es buena para aprender español?
            frame: Esta canción es buena para aprender español porque ___.
          - question: ¿Cuál es tu parte favorita de la canción?
            frame: Mi parte favorita es ___.
          - question: ¿Cuál es la palabra más importante en la canción?
            frame: La palabra más importante es ___.
      - id: act2
        type: classActivity
        title: 'Actividad 2: ¡Escribimos un poema!'
        skills: [Verbos en presente]
        steps:
          - Lee el poema. Los versos están desordenados.
          - 'Ordena el poema: cada estrofa habla de una persona (yo, tú, él, ella).'
          - Escribe los verbos que encuentras en cada estrofa.
        example: |-
          Yo hablo de amor al caminar,
          Tú cantas en la noche estrellada.
          Él come tranquilo al atardecer,
          y amas con alma iluminada.
          Tú vendes sueños para crecer,
          y escribe historias hasta el fin.
          Ella vive en su propio jardín,
          y bailo al ritmo del mar.
          Tú bebes la vida sin temer,
          y estudia para saber.
      - id: act2-verbs
        type: discussionQuestions
        title: Los verbos de cada estrofa
        items:
          - question: 'Estrofa 1: ___ y ___'
          - question: 'Estrofa 2: ___ y ___'
          - question: 'Estrofa 3: ___ y ___'
          - question: 'Estrofa 4: ___ y ___'
          - question: 'Estrofa 5: ___ y ___'
      - id: act3
        type: classActivity
        title: 'Actividad 3: Adivina la pregunta'
        skills: [Preguntas]
        steps:
          - Escribe 3 afirmaciones sobre tu gusto musical.
          - Lee una afirmación. Tus compañeros adivinan cuál es la pregunta.
          - Practica también con las afirmaciones de abajo.
        example: |-
          *Me gusta escuchar música en el parque.*
          Pregunta: *¿Dónde te gusta escuchar música?*
      - id: act3-mine
        type: discussionQuestions
        title: Mis afirmaciones
        items:
          - question: 'Afirmación 1: ___'
          - question: 'Afirmación 2: ___'
          - question: 'Afirmación 3: ___'
      - id: act3-statements
        type: discussionQuestions
        title: ¿Cuál es la pregunta?
        items:
          - question: Uso Spotify para escuchar música.
            frame: ¿___?
          - question: Escucho música tres veces por semana.
            frame: ¿___?
          - question: Me gusta bailar salsa.
            frame: ¿___?
          - question: Voy a conciertos en mi ciudad.
            frame: ¿___?
          - question: Comparto música con mis amigos.
            frame: ¿___?
          - question: Mi grupo favorito es Maná.
            frame: ¿___?
          - question: Escucho música en mi teléfono.
            frame: ¿___?
          - question: Mi instrumento favorito es la guitarra.
            frame: ¿___?
      - id: act4
        type: classActivity
        title: 'Actividad 4: Vivir mi vida'
        skills: [Verbos en presente]
        steps:
          - Escucha la canción «Vivir mi vida» de Marc Anthony.
          - Tu profesor muestra la letra con algunos verbos escondidos.
          - Completa los espacios con el verbo correcto del banco de palabras. Algunos verbos aparecen más de una vez.
        wordBank:
          [
            gozar,
            olvidar,
            limpiar,
            vivir,
            escuchar,
            reír,
            sufrir,
            encontrar,
            vencer,
            entender,
            llorar,
          ]
        resource:
          label: «Vivir mi vida», Marc Anthony (YouTube)
          url: https://www.youtube.com/results?search_query=Marc+Anthony+Vivir+Mi+Vida
      - id: act5
        type: classActivity
        title: 'Actividad 5: Entrevista musical'
        skills: [Preguntas, Verbos en presente]
        minutes: 20
        steps:
          - Lee las preguntas de abajo (2 minutos).
          - Trabajen en parejas. Haz las preguntas a tu compañero en voz alta y escribe sus respuestas (8 minutos).
          - Comparte con el grupo **un dato interesante** sobre tu compañero (5 minutos).
        example: |-
          A: *¿Qué instrumento te gusta más?*
          B: *Me gusta la guitarra.*
          *Ella escucha música en Spotify.* / *Él no comparte música con sus amigos.*
      - id: act5-questions
        type: discussionQuestions
        title: Entrevista
        items:
          - question: ¿Qué instrumento te gusta más?
            frame: Me gusta más el / la ___.
          - question: ¿Con qué aplicación escuchas música?
            frame: Escucho música con ___.
          - question: ¿Con qué frecuencia escuchas música?
            frame: Escucho música ___ veces por semana. / Escucho música todos los días.
          - question: ¿Qué tipo de música no te gusta?
            frame: No me gusta la música ___.
          - question: ¿Qué haces en un concierto?
            frame: En un concierto, yo ___.
          - question: ¿Quién canta bien en tu familia?
            frame: Mi ___ canta bien.
          - question: ¿Compartes música con tus amigos?
            frame: Sí, comparto música con mis amigos. / No, no comparto música con mis amigos.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Preguntas** (Actividades 1 y 3) y **Verbos en
          presente** (Actividades 2 y 4). La Actividad 5 practica las dos.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: >-
          Mantenlo muy corto: 2 oraciones por estudiante, no más de 30 segundos cada uno.
          Si ya se conocen, pasa directamente a las preguntas de calentamiento.
      - id: n-warmup
        anchor: warmup
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act1
        anchor: act1
        text: >-
          Pon la canción y explica el significado de la letra hasta el primer estribillo.
          Después los estudiantes relacionan las preguntas con las respuestas que están
          en la canción.
      - id: n-act2
        anchor: act2
        text: >-
          Poema resuelto: «Tú bebes la vida sin temer, / y vendes sueños para crecer. //
          Él come tranquilo al atardecer, / y estudia para saber. // Yo hablo de amor al
          caminar, / y bailo al ritmo del mar. // Tú cantas en la noche estrellada, / y
          amas con alma iluminada. // Ella vive en su propio jardín, / y escribe historias
          hasta el fin.» Pista: los dos verbos de cada estrofa tienen la misma persona.
      - id: n-act3
        anchor: act3-statements
        text: >-
          Respuestas: ¿Con qué aplicación escuchas música? · ¿Con qué frecuencia escuchas
          música? · ¿Qué te gusta bailar? · ¿Dónde vas a conciertos? · ¿Compartes música
          con tus amigos? · ¿Cuál es tu grupo favorito? · ¿Cómo escuchas música? (¿en la
          radio, en el teléfono, en el ordenador?) · ¿Qué instrumento te gusta más?
      - id: n-act4
        anchor: act4
        text: >-
          La letra con los espacios en blanco está en el cuaderno anterior; no se copia
          en la plataforma (derechos de autor). Muéstrala en pantalla con los verbos
          escondidos. Verbos y veces: gozar (x3), olvidar (x3), limpiar, vivir (x3),
          escuchar, reír (x2), sufrir (x2), encontrar, vencer, entender, llorar (x2).
      - id: n-act5
        anchor: act5
        text: >-
          Anota en el pizarrón las respuestas repetidas para ver qué es más común en la
          clase (por ejemplo: ¿cuántos prefieren la guitarra? ¿cuántos usan YouTube?).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: musica-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-questions
        type: ruleSummary
        skill: Preguntas
        rules:
          - text: >-
              Usamos palabras interrogativas para pedir información: un motivo, un lugar,
              una hora… Las usamos en las preguntas cuya respuesta **no** es *sí* o *no*.
          - text: >-
              Empieza con la palabra interrogativa (*qué, quién, dónde, cuándo, por qué,
              cómo*), sigue con el verbo y agrega detalles. **Palabra interrogativa +
              verbo + (sujeto) + detalles.**
            examples:
              - ¿Dónde escuchas música?
              - ¿Dónde toca Ana la guitarra?
          - text: 'Las 4 palabras interrogativas principales: **qué, dónde, cuándo, quién**.'
      - id: questions-table
        type: table
        caption: Las palabras interrogativas
        header: [Palabra, Pregunta, Respuesta]
        rows:
          - [Qué, ¿Qué música te gusta?, Me gusta el rock.]
          - [Dónde, ¿Dónde tocas la guitarra?, Toco la guitarra en mi casa.]
          - [Cuándo, ¿Cuándo empieza el concierto?, El concierto empieza en dos horas.]
          - [Quién, ¿Quién es tu cantante favorito?, Mi cantante favorito es Bruno Mars.]
      - id: rules-present
        type: ruleSummary
        skill: Verbos en presente
        rules:
          - text: Usamos el presente para hablar de acciones que ocurren ahora, hechos o hábitos. También para hablar de planes o metas.
            examples:
              - Yo **toco** la guitarra todos los días.
              - Tú **cantas** en el coro de la escuela.
              - Él **compone** canciones para su banda.
              - Nosotros **practicamos** en el estudio.
              - Ellos **ensayan** para el concierto.
          - text: 'Hay tres grupos de verbos según su terminación: **-ar**, **-er**, **-ir**. Cada grupo tiene sus formas (mira la tabla).'
            examples:
              - Él **toca** la batería en la banda.
              - Tú **vendes** discos de vinilo en la tienda.
              - Nosotros **vivimos** de la música.
          - text: 'Después de *quiero*, *necesito* o *puedo*, el verbo va en **infinitivo**: no cambia.'
            examples:
              - Yo **quiero** aprender a **tocar** el piano.
              - Yo **puedo cantar** todos los días.
              - Tú **necesitas practicar** más la guitarra.
              - Él **quiere grabar** su propio álbum.
              - Nosotros **queremos escribir** nuestra propia música.
              - Ustedes **necesitan practicar** la canción antes del show.
          - text: 'Usamos *gustar* para decir que algo nos agrada. No decimos «yo gusto el café», sino **me gusta el café**. *Me gusta* + una cosa o un infinitivo; *me gustan* + cosas en plural.'
            examples:
              - Me gusta el café. / Me gustan los libros.
              - me gusta (a mí), te gusta (a ti), le gusta (a él / ella), nos gusta (a nosotros), les gusta (a ellos / ellas)
      - id: present-table
        type: table
        caption: Verbos en presente
        header: [Persona, tocar (-ar), vender (-er), vivir (-ir)]
        rows:
          - [yo, toco, vendo, vivo]
          - [tú, tocas, vendes, vives]
          - [él / ella / usted, toca, vende, vive]
          - [nosotros / nosotras, tocamos, vendemos, vivimos]
          - [vosotros / vosotras, tocáis, vendéis, vivís]
          - [ellos / ellas / ustedes, tocan, venden, viven]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos habilidades con el grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: musica-tarea
    title: Tarea
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea
      - id: hw-questions
        type: reflection
        prompt: >-
          **Preguntas:** escribe 3 preguntas sobre música. Usa las palabras *qué*,
          *dónde* y *cuándo*. Ejemplo: *¿Qué música escuchas?*
      - id: hw-present
        type: reflection
        prompt: >-
          **Verbos en presente:** escribe 5 oraciones sobre tus hábitos musicales. Usa
          verbos como *tocar, escuchar, cantar* y *disfrutar*. Ejemplo: *Escucho música
          todas las noches.*

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: musica-practica
    book: workbook
    title: 'Práctica: Música'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practica las dos habilidades del ciclo. Cada respuesta se corrige al momento, y puedes intentarlo otra vez.
      - id: ex-preguntas
        type: activity
        activity: musica-preguntas
      - id: ex-verbos
        type: activity
        activity: musica-verbos

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: musica-vocabulario
    title: Vocabulario
    phase: review
    blocks:
      - id: words
        type: vocabulary
