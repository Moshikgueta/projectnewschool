vocabulary:
  - slug: musica
    title: Música
    items: *musica-words

activities:
  - slug: musica-preguntas
    title: 'Preguntas: qué, dónde, cuándo, quién'
    minutes: 8
    items:
      - id: donde-escuchas
        type: multipleChoice
        prompt: '¿___ escuchas música? —Escucho música en mi casa.'
        options:
          - { text: Dónde, correct: true }
          - {
              text: Cuándo,
              feedback: '*Cuándo* pregunta por el tiempo. La respuesta habla de un lugar (*en mi casa*): usa *dónde*.',
            }
          - {
              text: Quién,
              feedback: '*Quién* pregunta por una persona. La respuesta habla de un lugar: usa *dónde*.',
            }
      - id: quien-cantante
        type: multipleChoice
        prompt: '¿___ es tu cantante favorito? —Mi cantante favorito es Bruno Mars.'
        options:
          - { text: Quién, correct: true }
          - {
              text: Dónde,
              feedback: '*Dónde* pregunta por un lugar. Bruno Mars es una persona: usa *quién*.',
            }
          - {
              text: Cuándo,
              feedback: '*Cuándo* pregunta por el tiempo. Bruno Mars es una persona: usa *quién*.',
            }
      - id: completa-palabras
        type: fillBlank
        prompt: Completa con *qué*, *cuándo* o *dónde*.
        text: '¿___ música te gusta? —Me gusta el rock. ¿___ empieza el concierto? —En dos horas. ¿___ tocas la guitarra? —En mi casa.'
        blanks: [[Qué, qué], [Cuándo, cuándo], [Dónde, dónde]]
        wordBank: [Qué, Cuándo, Dónde]
      - id: si-no
        type: trueFalse
        prompt: 'Usamos las palabras interrogativas (*qué, dónde, cuándo, quién*) en preguntas con respuesta *sí* o *no*.'
        answer: false
        feedback:
          correct: ¡Correcto! Las usamos para pedir información, cuando la respuesta no es *sí* o *no*.
          incorrect: 'Las usamos cuando la respuesta **no** es *sí* o *no*: *¿Dónde escuchas música? —En mi casa.*'
      - id: une-respuestas
        type: matching
        prompt: Une cada pregunta con su respuesta.
        pairs:
          - ['¿Qué música te gusta?', Me gusta el rock.]
          - ['¿Dónde tocas la guitarra?', Toco la guitarra en mi casa.]
          - ['¿Cuándo empieza el concierto?', El concierto empieza en dos horas.]
          - ['¿Quién es tu cantante favorito?', Mi cantante favorito es Bruno Mars.]
          - ['¿Compartes música con tus amigos?', 'Sí, comparto música con mis amigos.']
      - id: cuando-noche
        type: multipleChoice
        prompt: 'Respuesta: *Escucho música por la noche.* ¿Cuál es la pregunta?'
        options:
          - { text: ¿Cuándo escuchas música?, correct: true }
          - {
              text: ¿Dónde escuchas música?,
              feedback: '*Por la noche* es un momento, no un lugar: usa *cuándo*.',
            }
          - {
              text: ¿Quién escucha música?,
              feedback: '*Quién* pregunta por una persona. *Por la noche* es un momento: usa *cuándo*.',
            }
      - id: ordena-guitarra
        type: reorderSentence
        prompt: Ordena las palabras para hacer una pregunta.
        sentence: ¿Dónde tocas la guitarra?
      - id: mi-pregunta
        type: shortAnswer
        prompt: Escribe una pregunta sobre música con *qué*, *dónde* o *cuándo*.

  - slug: musica-verbos
    title: Verbos en presente
    minutes: 8
    items:
      - id: yo-toco
        type: multipleChoice
        prompt: Yo ___ la guitarra todos los días.
        options:
          - { text: toco, correct: true }
          - {
              text: tocas,
              feedback: '*Tocas* es para *tú*. Con *yo*, el verbo termina en *-o*: *toco*.',
            }
          - {
              text: toca,
              feedback: '*Toca* es para *él* o *ella*. Con *yo*, el verbo termina en *-o*: *toco*.',
            }
      - id: completa-presente
        type: fillBlank
        prompt: Escribe el verbo en presente.
        text: Tú ___ (cantar) en el coro. Ellos ___ (vender) discos. Nosotros ___ (vivir) para la música.
        blanks: [[cantas], [venden], [vivimos]]
      - id: une-vender
        type: matching
        prompt: Une cada persona con la forma de *vender*.
        pairs:
          - [yo, vendo]
          - [tú, vendes]
          - [él / ella, vende]
          - [nosotros, vendemos]
          - [ellos / ustedes, venden]
      - id: puedo-cantar
        type: multipleChoice
        prompt: Yo puedo ___ todos los días.
        options:
          - { text: cantar, correct: true }
          - {
              text: canto,
              feedback: 'Después de *puedo*, el verbo va en infinitivo: *puedo cantar*.',
            }
          - {
              text: cantas,
              feedback: 'Después de *puedo*, el verbo va en infinitivo: *puedo cantar*.',
            }
      - id: quiero-infinitivo
        type: trueFalse
        prompt: 'Esta oración es correcta: *Yo quiero toco el piano.*'
        answer: false
        feedback:
          correct: '¡Correcto! Después de *quiero*, el verbo va en infinitivo: *Yo quiero tocar el piano.*'
          incorrect: 'Después de *quiero*, el verbo va en infinitivo: *Yo quiero tocar el piano.*'
      - id: me-gusta
        type: multipleChoice
        prompt: A mí ___ la música.
        options:
          - { text: me gusta, correct: true }
          - {
              text: me gustan,
              feedback: '*La música* es singular: usa *me gusta*. *Me gustan* es para cosas en plural.',
            }
          - {
              text: yo gusto,
              feedback: 'No decimos *yo gusto*. Decimos *me gusta*: *Me gusta la música.*',
            }
      - id: necesitan-practicar
        type: fillBlank
        prompt: Escribe los verbos. Cuidado con el infinitivo.
