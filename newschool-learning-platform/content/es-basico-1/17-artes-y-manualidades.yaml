              feedback: 'Después de *prefiero* usamos el infinitivo: *prefiero dibujar*.',
            }
          - {
              text: Prefiero dibujas animales.,
              feedback: 'Después de *prefiero* usamos el infinitivo: *prefiero dibujar*.',
