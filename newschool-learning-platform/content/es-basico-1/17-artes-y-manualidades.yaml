        type: fillBlank
        prompt: Escribe el verbo en presente.
        text: Nosotros ___ (bailar) en la clase. Ella ___ (tocar) la guitarra.
        blanks: [[bailamos], [toca]]
      - id: me-gusta-infinitivo
        type: trueFalse
        prompt: 'Después de *me gusta* usamos el verbo en infinitivo: *Me gusta pintar con mis manos.*'
