vocabulary:
  - slug: artes-y-manualidades
    title: Artes y manualidades
    items: *artes-words

activities:
  - slug: artes-y-manualidades-descriptivas
    title: 'Oraciones descriptivas: ser + adjetivo'
    minutes: 8
    items:
      - id: el-cuadro-es
        type: multipleChoice
        prompt: El cuadro ___ hermoso.
        options:
          - { text: es, correct: true }
          - { text: son, feedback: '*El cuadro* es singular: usa *es*.' }
          - { text: eres, feedback: '*Eres* es para *tú*. Para una cosa usa *es*.' }
      - id: los-colores-son
        type: multipleChoice
        prompt: Los colores ___ brillantes.
        options:
          - { text: son, correct: true }
          - { text: es, feedback: '*Los colores* es plural: usa *son*.' }
          - { text: soy, feedback: '*Soy* es para *yo*. Para varias cosas usa *son*.' }
      - id: es-son
        type: fillBlank
        prompt: Completa con *es* o *son*.
        text: La imagen ___ interesante. Las fotos ___ oscuras.
        blanks: [[es], [son]]
        wordBank: [es, son]
      - id: negativo
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: El cuadro no es moderno., correct: true }
          - { text: El cuadro es no moderno., feedback: 'El *no* va antes del verbo: *no es*.' }
          - {
              text: No el cuadro es moderno.,
              feedback: 'El *no* va justo antes del verbo: *El cuadro no es moderno*.',
            }
      - id: no-antes
        type: trueFalse
        prompt: 'Para hacer una oración negativa, ponemos *no* antes del verbo: *La foto no es oscura.*'
        answer: true
        feedback:
          correct: ¡Correcto! *No* va antes de *es* o *son*.
          incorrect: 'El *no* va antes del verbo: *La foto no es oscura.*'
      - id: une-descripciones
        type: matching
        prompt: Une cada sujeto con el final correcto. Mira si es masculino o femenino, singular o plural.
        pairs:
          - [El cuadro es, moderno.]
          - [La foto es, oscura.]
          - [Los cuadros son, viejos.]
          - [Las esculturas son, pequeñas.]
      - id: hay-esculturas
        type: multipleChoice
        prompt: En el museo ___ esculturas grandes.
        options:
          - { text: hay, correct: true }
          - { text: es, feedback: 'Para decir que algo existe en un lugar, usa *hay*.' }
          - {
              text: son,
              feedback: 'Para decir que algo existe en un lugar, usa *hay*: *En el museo hay esculturas.*',
            }
      - id: ordena-pintura
        type: reorderSentence
