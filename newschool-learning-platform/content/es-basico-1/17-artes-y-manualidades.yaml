        sentence: Me gusta la pintura porque es colorida.

  - slug: artes-y-manualidades-acciones
    title: Acciones en presente
    minutes: 8
    items:
      - id: yo-pinto
        type: multipleChoice
        prompt: Yo ___ un cuadro.
        options:
          - { text: pinto, correct: true }
          - {
              text: pintas,
              feedback: '*Pintas* es para *tú*. Con *yo* el verbo termina en *-o*: *pinto*.',
            }
          - { text: pinta, feedback: '*Pinta* es para *él / ella*. Con *yo* usa *pinto*.' }
      - id: ellos-cantan
        type: multipleChoice
        prompt: Ellos ___ una canción.
        options:
          - { text: cantan, correct: true }
          - {
              text: canta,
              feedback: '*Canta* es para *él / ella*. Con *ellos* el verbo termina en *-an*: *cantan*.',
            }
          - { text: cantamos, feedback: '*Cantamos* es para *nosotros*. Con *ellos* usa *cantan*.' }
      - id: une-dibujar
        type: matching
        prompt: Une cada persona con el verbo *dibujar* en presente.
        pairs:
          - [yo, dibujo]
          - [tú, dibujas]
          - [él / ella, dibuja]
          - [nosotros, dibujamos]
          - [ellos / ellas, dibujan]
      - id: tu-dibujas
