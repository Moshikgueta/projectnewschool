        feedback:
          correct: ¡Correcto! *Me gusta pintar*, *me gusta dibujar*, *me gusta cantar*.
          incorrect: 'Después de *me gusta* el verbo no cambia: *Me gusta pintar* (no *me gusta pinto*).'
