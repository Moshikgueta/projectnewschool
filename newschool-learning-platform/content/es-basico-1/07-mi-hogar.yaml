vocabulary:
  - slug: mi-hogar
    title: Mi hogar
    items: *mi-hogar-words

activities:
  - slug: mi-hogar-describir
    title: 'Describir: hay, ser y estar'
    minutes: 8
    items:
      - id: hay-sillas
        type: multipleChoice
        prompt: ___ dos sillas en la sala de estar.
        options:
          - { text: Hay, correct: true }
          - { text: Es, feedback: 'Para decir que algo existe en un lugar usamos *hay*.' }
          - {
              text: Está,
              feedback: '*Estar* es para el estado o el lugar de una cosa. Para decir que algo existe usamos *hay*.',
            }
      - id: esta-limpia
        type: multipleChoice
        prompt: Hoy la cocina ___ limpia.
        options:
          - { text: está, correct: true }
          - { text: es, feedback: '*Limpia* hoy es un estado temporal: usamos *estar*.' }
          - { text: hay, feedback: '*Hay* dice que algo existe; no describe cómo está.' }
      - id: es-grande
        type: multipleChoice
        prompt: La mesa ___ grande.
        options:
          - { text: es, correct: true }
          - { text: está, feedback: '*Grande* es una característica permanente: usamos *ser*.' }
          - {
              text: hay,
              feedback: '*Hay* dice que algo existe; para describir la mesa usamos *ser*.',
            }
      - id: hay-plural
        type: trueFalse
        prompt: 'Usamos *hay* en singular y en plural: *Hay una mesa. Hay dos sillas.*'
        answer: true
        feedback:
          correct: ¡Correcto! *Hay* no cambia.
          incorrect: '*Hay* es igual en singular y en plural: *hay una mesa*, *hay dos sillas*.'
      - id: esta-cerca
        type: fillBlank
        prompt: Completa con *es* o *está*.
        text: Mi casa ___ cerca de una panadería.
        blanks: [[está]]
        wordBank: [es, está]
      - id: hay-no-hay
        type: fillBlank
        prompt: Completa con *hay* o *no hay*.
        text: 'En el baño ___ una ducha, pero ___ bañera: ¡solo tenemos ducha!'
        blanks: [[hay], [no hay]]
        wordBank: [hay, no hay]
      - id: lugares
        type: matching
        prompt: Une cada lugar con una cosa que hay allí.
        pairs:
          - [cocina, horno]
          - [dormitorio, cama]
          - [baño, ducha]
          - [sala de estar, sofá]
          - [jardín, flores]
      - id: ordena-dormitorio
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: El dormitorio es tranquilo y cómodo
        alsoAccept: [El dormitorio es cómodo y tranquilo]

  - slug: mi-hogar-verbos
    title: 'Verbos en presente: -ar, -er, -ir'
    minutes: 8
    items:
      - id: vivimos
        type: multipleChoice
        prompt: Nosotros ___ en el centro.
        options:
          - { text: vivimos, correct: true }
          - { text: vivo, feedback: '*Vivo* es para *yo*. Con *nosotros*: *vivimos*.' }
          - {
              text: viven,
              feedback: '*Viven* es para *ellos* o *ustedes*. Con *nosotros*: *vivimos*.',
            }
      - id: limpias
        type: multipleChoice
        prompt: Tú ___ la cocina todos los días.
        options:
          - { text: limpias, correct: true }
          - { text: limpia, feedback: '*Limpia* es para *él / ella*. Con *tú*: *limpias*.' }
          - { text: limpio, feedback: '*Limpio* es para *yo*. Con *tú*: *limpias*.' }
      - id: vendo-vive
