          - { term: viernes, gloss: יום שישי }
          - { term: sábado, gloss: שבת }
          - { term: domingo, gloss: יום ראשון }
          - { term: hora (¿A qué hora…?), gloss: שעה (באיזו שעה…?) }

vocabulary:
  - slug: rutina
    title: Rutina
    items: *rutina-words

activities:
  - slug: rutina-numeros
    title: Números y días de la semana
    minutes: 8
    items:
      - id: siete-once
        type: fillBlank
        prompt: Escribe los números en palabras.
        text: Me despierto a las ___ (7) y me acuesto a las ___ (11).
        blanks: [[siete], [once]]
      - id: ocho
        type: multipleChoice
        prompt: Desayuno a las ___ (8).
        options:
          - { text: ocho, correct: true }
          - { text: seis, feedback: '*Seis* es 6. El 8 es *ocho*.' }
          - { text: dieciocho, feedback: '*Dieciocho* es 18. El 8 es *ocho*.' }
      - id: manana-martes
        type: multipleChoice
        prompt: Hoy es lunes. Mañana es ___.
        options:
          - { text: martes, correct: true }
          - { text: domingo, feedback: 'El domingo es el día **antes** del lunes.' }
          - { text: miércoles, feedback: 'El miércoles es dos días después del lunes.' }
      - id: dias-hebreo
        type: matching
        prompt: Une cada día con su nombre en hebreo.
        pairs:
          - [lunes, יום שני]
          - [martes, יום שלישי]
          - [miércoles, יום רביעי]
          - [sábado, שבת]
          - [domingo, יום ראשון]
      - id: miercoles
        type: fillBlank
        prompt: Completa los días de la semana.
        text: Lunes, martes, ___, jueves, viernes.
        blanks: [[miércoles]]
      - id: siete-dias
        type: trueFalse
        prompt: La semana tiene siete días.
        answer: true
        feedback:
          correct: '¡Correcto! Lunes, martes, miércoles, jueves, viernes, sábado y domingo: 7 días.'
          incorrect: 'Cuenta: lunes, martes, miércoles, jueves, viernes, sábado y domingo. Son 7.'
      - id: ordena-sabados
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Los sábados juego al fútbol a las diez
        alsoAccept: [Los sábados a las diez juego al fútbol]
      - id: mi-hora
        type: shortAnswer
        prompt: ¿A qué hora te despiertas los lunes? Escribe una oración.

  - slug: rutina-verbos
    title: 'Verbos reflexivos y preposiciones'
    minutes: 8
    items:
      - id: me-despierto
        type: multipleChoice
        prompt: Yo ___ despierto a las siete.
        options:
          - { text: me, correct: true }
          - { text: te, feedback: '*Te* es para *tú*: *tú te despiertas*. Con *yo* usamos *me*.' }
          - {
              text: se,
              feedback: '*Se* es para *él / ella*: *ella se despierta*. Con *yo* usamos *me*.',
            }
      - id: se-ducha
        type: multipleChoice
        prompt: Ella ___ ducha por la mañana.
        options:
          - { text: se, correct: true }
