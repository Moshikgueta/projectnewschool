vocabulary:
  - slug: nos-reunimos
    title: ¿Nos reunimos?
    items: *nos-reunimos-words

activities:
  - slug: nos-reunimos-dias
    title: 'Días de la semana y números'
    minutes: 8
    items:
      - id: el-sabado
        type: multipleChoice
        prompt: ___ sábado descanso.
        options:
          - { text: El, correct: true }
          - {
              text: Los,
              feedback: '*Sábado* es singular (un solo día): usa *el*. En plural es *los sábados*.',
            }
          - { text: En, feedback: 'Antes del día usamos *el*, no *en*.' }
      - id: los-lunes
        type: multipleChoice
        prompt: 'Todas las semanas: ___ lunes voy a la escuela.'
        options:
          - { text: Los, correct: true }
          - {
              text: El,
              feedback: '*El lunes* es un solo día. Para todas las semanas usamos *los lunes*.',
            }
          - { text: La, feedback: 'Decimos *el lunes* o *los lunes*, nunca *la lunes*.' }
      - id: plurales
        type: fillBlank
        prompt: Escribe el plural.
        text: El sábado → los ___. El martes → los ___.
        blanks: [[sábados], [martes]]
      - id: lunes-plural
        type: trueFalse
        prompt: '*Domingo* en plural es *domingos*, pero *lunes* en plural es *lunes*.'
        answer: true
        feedback:
          correct: ¡Correcto! De lunes a viernes el día ya termina en *s*.
          incorrect: 'De lunes a viernes el plural es igual (*los lunes*). *Sábado* y *domingo* llevan *s*: *los domingos*.'
      - id: numeros
        type: matching
        prompt: Une los números.
        pairs:
          - ['2', dos]
          - ['4', cuatro]
          - ['6', seis]
          - ['8', ocho]
          - ['16', dieciséis]
      - id: el-en
        type: fillBlank
        prompt: Completa con *el* o *en*.
        text: La reunión es ___ 9 de mayo. Mi cumpleaños es ___ abril.
        blanks: [[el], [en]]
        wordBank: [el, en]
      - id: ordena-cumple
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Mi cumpleaños es el diez de mayo.

  - slug: nos-reunimos-preposiciones
    title: 'Preposiciones básicas: a, en, de, con'
    minutes: 8
    items:
      - id: voy-a
        type: multipleChoice
        prompt: Voy ___ la escuela.
        options:
          - { text: a, correct: true }
          - {
              text: en,
              feedback: '*En* es para el lugar donde estás o el transporte. Para la dirección o el destino usamos *a*.',
            }
          - { text: con, feedback: '*Con* es para la compañía: *voy con mi amiga*.' }
      - id: en-tren
        type: multipleChoice
        prompt: Viajamos ___ tren.
        options:
          - { text: en, correct: true }
          - {
              text: a,
              feedback: 'Para el medio de transporte usamos *en*: *en tren*, *en autobús*.',
            }
          - { text: de, feedback: '*De* es para el origen o la posesión: *soy de México*.' }
      - id: reunion
        type: multipleChoice
        prompt: ¿Puedes reunirte el viernes ___ las 15:00 ___ la biblioteca?
        options:
          - { text: a / en, correct: true }
          - {
              text: en / a,
              feedback: 'Para la hora usamos *a las*; para el lugar donde estás, *en*.',
            }
          - {
              text: a / de,
              feedback: '*De* es para el origen o la posesión. Para el lugar usamos *en*.',
            }
      - id: de-de
        type: fillBlank
        prompt: Completa con una preposición.
        text: Soy ___ México. El libro es ___ Ana.
        blanks: [[de], [de]]
      - id: con
        type: fillBlank
        prompt: Completa con una preposición.
        text: Voy a la cafetería ___ mi amiga.
        blanks: [[con]]
      - id: une-usos
        type: matching
        prompt: Une cada preposición con su uso.
        pairs:
          - [a, 'dirección, destino u hora']
          - [en, lugar o medio de transporte]
          - [de, origen o posesión]
          - [con, compañía o instrumento]
      - id: a-las
        type: trueFalse
        prompt: 'Para decir la hora de algo usamos *a las*: *La clase es a las nueve.*'
        answer: true
        feedback:
          correct: ¡Correcto! *A* indica la hora.
          incorrect: 'Sí, usamos *a* para la hora: *La clase es a las nueve.*'
      - id: ordena-casa
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Estoy en casa con mi hermano
        alsoAccept: [Estoy con mi hermano en casa]
