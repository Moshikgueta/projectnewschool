# Cycle "Moda y compras", converted from the Spanish básico digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-basico-1
slug: moda-y-compras
title: Moda y compras
goal: Describir ropa y hablar de precios con oraciones descriptivas y números.
position: 11
status: in_review

review:
  - >-
    The two workbook exercises ("Oraciones descriptivas" and "Números") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's two
    skills, its summary rules and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Numbers summary, rule 2 said the tens "end in -enta or -enta/cuenta". This is
    wrong (veinte, treinta, cuarenta, cincuenta…). Rewritten as: 20 is *veinte*; 30
    to 90 end in *-nta*.
  - >-
    Numbers summary, rule 3 said 11 to 19 are all irregular. Rewritten: 11–15 have
    their own form (once … quince); 16–19 are built with *dieci-* (dieciséis …).
  - >-
    Numbers summary, rule 1 (21–99 join tens and units) now adds how: 21–29 are one
    word (*veintisiete*), from 31 on with *y* (*treinta y cinco*). The exercises use
    this. The summary examples in the past tense ("Compré…", "Gasté…") are now in
    the present ("Compro…", "Gasto…"), as the cycle works in the present.
  - >-
    Descriptive summary, rule 1 says "ser o estar" but every example uses *ser*; the
    rule text was kept, and the exercises only use *ser*. Please confirm.
  - >-
    Typos fixed: "¿Cuando te gusta…" → "¿Cuándo te gusta…"; "Compro ropa ___ veces al
    ___ (semana, mes, año)" → "… veces a la semana / al mes / al año". The Activity 1
    model answer mixed "te pones" and "usas"; both frames now use "te pones".
  - >-
    The Mori opening message named the skills "Acciones en presente" and "Números";
    it now names this cycle's skills, "Oraciones descriptivas" and "Números". The tip
    "explicármelo en hebreo pero con la oración en inglés" now says "en español".
  - >-
    The general information lists Números only with the warm-up and questions, but
    Activities 2 and 4 are labelled NÚMEROS; the plan note says Activities 2 and 4.
  - >-
    Activity 4 suggests online shops (ASOS, H&M, ZARA, UNIQLO, SHEIN) with links. Shop
    links are not on the link allow-list, so they were left out; the teacher note
    names the shops and the teacher opens one on screen.
  - >-
    Activity 1 says students see a picture of the clothes, but the picture is not in
    the exported notebook. The clothes list is kept as a word bank; the teacher
    shares the picture on screen until it is added to the course's media.
  - >-
    Activity 2 (Adivina el precio): the Google Slides link is kept as the activity's
    resource; the real prices are teacher-only (teacher note). The notebook gives
    no time for this activity, so none is recorded.
  - >-
    Vocabulary: "Gastar" is glossed as "להוציא (כסף)" instead of "להוציא"; the
    number rows are kept in groups as in the notebook. Please confirm.
  - Activity times given as ranges (15–20 minutes) are recorded as 20 minutes.
  - >-
    The "Respuesta del estudiante 1/2/3" lines are replaced by the optional answer
    boxes (decision C2): students may type, and the teacher sees the group's answers.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: moda-y-compras-clase
    title: 'Clase: Moda y compras'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Moda y compras
      - id: skills
        type: cycleOverview
        skills:
          - name: Oraciones descriptivas
            description: Describir la ropa y el estilo con *ser*, *tener* y adjetivos (el vestido es elegante)
          - name: Números
            description: Los números del 1 al 100 para hablar de precios y cantidades
      - id: quizlet
        type: externalLink
        label: Moda y compras en Quizlet
        url: https://quizlet.com/br/1065967286/compras-y-moda-actualizado-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___. Me gusta comprar ___.
        example: Soy Dana. Me gusta comprar libros.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup
        type: discussionQuestions
        items:
          - question: ¿Te gusta ir de compras? Si dices que sí, ¿qué cosas te gusta comprar? Si dices que no, ¿por qué?
            frame: Sí, me gusta comprar ___. / No, no me gusta ir de compras porque ___.
          - question: ¿Prefieres comprar por internet o ir a la tienda? ¿Por qué?
            frame: Prefiero ___ porque ___.
          - question: ¿Cuándo te gusta ir de compras?
            frame: Me gusta ir de compras los fines de semana / durante la semana. El ___ (día).
          - question: ¿Cuál es tu tienda favorita? ¿Por qué?
            frame: Mi tienda favorita es ___ porque ___.
          - question: ¿Con qué frecuencia compras ropa?
            frame: Compro ropa ___ veces a la semana / al mes / al año.
          - question: Cuando vas al centro comercial, ¿a cuántas tiendas entras? ¿Cuáles?
            frame: Entro en ___ tiendas. Entro en ___ y en ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: ¿Qué me pongo?'
        skills: [Oraciones descriptivas]
        minutes: 20
        steps:
          - Mira la imagen que comparte tu profesor y repasa el vocabulario de la ropa.
          - Tu profesor pregunta "¿Qué me pongo para…?". Responde con la ropa y un adjetivo del banco.
        example: |-
          *Profesor: ¿Qué me pongo para un cumpleaños?*
          *Estudiante: Para un cumpleaños, te pones un vestido porque es elegante.*
          *Profesor: ¿Qué me pongo para un viaje a la playa?*
          *Estudiante: Para un viaje a la playa, te pones pantalones cortos y una camiseta porque son cómodos.*
        wordBank:
          - vestido
          - pantalones cortos
          - falda
          - bolso
          - abrigo
          - camiseta
          - pantalón
          - zapatos
      - id: act1-adjectives
        type: wordBank
        words:
          - cómodo/a
          - elegante
          - casual
          - formal
          - cálido/a
          - fresco/a
          - moderno/a
          - sencillo/a
          - colorido/a
          - con estilo
          - suelto/a
          - ajustado/a
          - suave
          - grueso/a
          - fino/a
      - id: act1-questions
        type: discussionQuestions
        title: ¿Qué me pongo para…?
        items:
          - question: ¿Qué me pongo para un cumpleaños?
            frame: Para un cumpleaños, te pones ___ porque es ___.
          - question: ¿Qué me pongo para el trabajo?
            frame: Para el trabajo, te pones ___ porque es ___.
          - question: ¿Qué me pongo para un viaje a la playa?
            frame: Para un viaje a la playa, te pones ___ porque es ___.
          - question: ¿Qué me pongo para una reunión con amigos?
            frame: Para una reunión con amigos, te pones ___ porque es ___.
      - id: act2
        type: classActivity
        title: 'Actividad 2: Adivina el precio'
        skills: [Números]
        steps:
          - Mira la prenda en la presentación.
          - Adivina su precio. Di el número en español.
          - Tu profesor dice el precio real. ¡Quien más se acerque gana la ronda!
        example: '*Creo que el vestido cuesta cuarenta y cinco dólares.*'
        resource:
          label: Adivina el precio (diapositivas 1–10)
          url: https://docs.google.com/presentation/d/1uFqbDX8-ftLQBBJCfbx6Sna6zhKy-DBUeYQup7FSlq4/edit?usp=sharing
      - id: act3
        type: classActivity
        title: 'Actividad 3: Organiza tu tienda'
        skills: [Oraciones descriptivas]
        minutes: 20
        steps:
          - Crea tu propia tienda. Completa las respuestas de abajo.
          - Presenta tu tienda al grupo.
        example: |-
          **Nombre de la tienda:** Tendencias de Moda
          **¿Qué vendes?** Ropa, zapatos y accesorios.
          **¿Dónde está ubicada?** En el centro de la ciudad, cerca de un centro comercial.
          **¿Qué tiene tu tienda?** Variedad de ropa moderna para hombres y mujeres, probadores, una sección de descuentos y un área de espera cómoda.
          **¿Quién trabaja contigo?** Dos vendedores, un cajero y un asesor de moda.
      - id: act3-shop
        type: discussionQuestions
        title: Mi tienda
        items:
          - question: 'Nombre de la tienda: ___'
          - question: '¿Qué vendes? ___'
          - question: '¿Dónde está ubicada? ___'
          - question: '¿Qué tiene tu tienda? ___'
          - question: '¿Quién trabaja contigo? ___'
      - id: act4
        type: classActivity
        title: 'Actividad 4: Planificación del presupuesto'
        skills: [Números]
        minutes: 20
        steps:
          - Entra en la tienda en línea que elige tu profesor.
          - Compra ropa con un presupuesto de $100. Intenta acercarte lo más posible sin pasarte.
          - Elige artículos de categorías diferentes.
          - Di al grupo qué pusiste en el carrito y cuánto cuesta cada cosa.
          - Gana quien compra más artículos de categorías diferentes sin pasar de $100.
        example: '*En mi carrito hay una camiseta de veinte dólares, un pantalón de cuarenta dólares y un bolso de treinta y cinco dólares. En total, noventa y cinco dólares.*'
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Oraciones descriptivas** (preguntas de
          calentamiento, Actividades 1 y 3) y **Números** (preguntas de calentamiento,
          Actividades 2 y 4). Para las oraciones descriptivas, elige la Actividad 1 o la
          Actividad 3.
      - id: n-intro
        anchor: intro
        minutes: 10
        text: Da tu propio ejemplo primero ("Me gusta comprar libros") y después pregunta a cada estudiante.
      - id: n-warmup
        anchor: warmup
        minutes: 20
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act1
        anchor: act1
        text: >-
          Comparte en pantalla una imagen con la ropa (vestido, pantalones cortos, falda,
          bolso, abrigo, camiseta, pantalón, zapatos); la imagen del cuaderno todavía no
          está en la plataforma. Después pregunta "¿Qué me pongo para…?" con las cuatro
          situaciones.
      - id: n-act2
        anchor: act2
        text: >-
          Precios reales (solo para el profesor): vestido $50, falda $90, pantalón $40,
          pantalones cortos $30, abrigo $60, camiseta $20, zapatos $70, bolso $80.
          Muestra una prenda, deja que todos adivinen y después di el precio real.
      - id: n-act4
        anchor: act4
        text: >-
          Elige una tienda en línea y ábrela en tu pantalla. Tiendas sugeridas en el
          cuaderno: ASOS, H&M, ZARA, UNIQLO y SHEIN (los enlaces no están en la
          plataforma).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: moda-y-compras-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-descriptive
        type: ruleSummary
        skill: Oraciones descriptivas
        rules:
          - text: Usa *ser* o *estar* para describir la ropa y el estilo.
            examples: [Soy elegante., Ella es moderna., Estos zapatos son cómodos.]
          - text: Usa adjetivos para dar más información.
            examples: [El vestido es rojo., Su chaqueta es grande y cálida.]
          - text: Usa *tener* para hablar de lo que alguien tiene.
            examples: [Tengo un bolso rojo., Ella tiene cinco pares de zapatos.]
      - id: rules-numbers
        type: ruleSummary
        skill: Números
        rules:
          - text: >-
              Los números del 21 al 99 se forman con decenas y unidades. Del 21 al 29 se
              escriben en una palabra; desde el 31 se usa *y*.
            examples: [Compro veintisiete camisas., El abrigo cuesta treinta y cinco dólares.]
          - text: 'Las decenas: 20 es *veinte*; del 30 al 90 terminan en *-nta*.'
            examples:
              [
                'veinte, treinta, cuarenta, cincuenta, sesenta, setenta, ochenta, noventa',
                Gasto sesenta dólares en zapatos.,
              ]
          - text: Del 11 al 15 los números tienen forma propia; del 16 al 19 se forman con *dieci-*.
            examples:
              [
                'once, doce, trece, catorce, quince',
                'dieciséis, diecisiete, dieciocho, diecinueve',
                Compro quince pares de calcetines.,
              ]
    teacherNotes:
      - id: n-summary
        anchor: null
        minutes: 20
        text: Repasa las dos habilidades con el grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: moda-y-compras-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia este mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: mori-compras
        type: aiTutorPrompt
        title: De compras
        message: >-
          ¡Hola, Mori! Quiero ir de compras al centro comercial. ¿Puedes hacerme
          preguntas sobre compras usando las habilidades "Oraciones descriptivas" y
          "Números"? Por favor, usa solo el presente simple y corrige mis errores.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**
      - id: extra-title
        type: heading
        level: 3
        text: Práctica adicional
      - id: mori-lista
        type: aiTutorPrompt
        title: Mi lista de compras
        intro: >-
          Envía este mensaje a Mori. En tus respuestas, usa al menos 4 verbos de acción
          diferentes (comprar, ir, comer, vestir…), 5 artículos diferentes y 5 números o
          más (por ejemplo: tres plátanos, dos camisetas, una botella).
        message: ¡Hola, Mori! Quiero hablar sobre mi lista de compras. ¿Puedes hacerme preguntas usando números y el presente simple?
      - id: mori-precio
        type: aiTutorPrompt
        title: ¿Cuánto cuesta?
        intro: Envía este mensaje a Mori.
        message: ¡Hola, Mori! ¿Puedes hacerme preguntas sobre cuánto cuesta cada cosa usando números y acciones en presente simple?

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: moda-y-compras-practica
    book: workbook
    title: 'Práctica: Moda y compras'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practica las dos habilidades del ciclo. Cada respuesta se corrige al momento, y puedes intentarlo otra vez.
      - id: ex-descripcion
        type: activity
        activity: moda-y-compras-descripcion
      - id: ex-numeros
        type: activity
        activity: moda-y-compras-numeros

