vocabulary:
  - slug: moda-y-compras
    title: Moda y compras
    items: *moda-y-compras-words

activities:
  - slug: moda-y-compras-descripcion
    title: 'Oraciones descriptivas: ser, tener y adjetivos'
    minutes: 8
    items:
      - id: zapatos-son
        type: multipleChoice
        prompt: Estos zapatos ___ cómodos.
        options:
          - { text: son, correct: true }
          - { text: es, feedback: '*Zapatos* es plural: usa *son*.' }
          - {
              text: tienen,
              feedback: 'Para describir usamos *ser*: *son cómodos*. *Tener* es para lo que alguien tiene.',
            }
      - id: vestido-rojo
        type: multipleChoice
        prompt: El vestido es ___.
        options:
          - { text: rojo, correct: true }
          - { text: roja, feedback: '*Vestido* es masculino: usa *rojo*.' }
          - { text: rojos, feedback: '*Vestido* es singular: usa *rojo*.' }
      - id: chaqueta-calida
        type: multipleChoice
        prompt: Su chaqueta es grande y ___.
        options:
          - { text: cálida, correct: true }
          - { text: cálido, feedback: '*Chaqueta* es femenino: usa *cálida*.' }
          - { text: cálidas, feedback: '*Chaqueta* es singular: usa *cálida*.' }
      - id: pantalones-comodos
        type: multipleChoice
        prompt: Los pantalones cortos son ___.
        options:
          - { text: cómodos, correct: true }
          - { text: cómodo, feedback: '*Pantalones* es plural: usa *cómodos*.' }
          - { text: cómodas, feedback: '*Pantalones* es masculino: usa *cómodos*.' }
      - id: tener
        type: fillBlank
        prompt: Completa con el verbo *tener*.
        text: Yo ___ un bolso rojo. Ella ___ cinco pares de zapatos.
        blanks: [[tengo], [tiene]]
        wordBank: [tengo, tiene, tienen]
      - id: tener-posee
        type: trueFalse
        prompt: 'Usamos *tener* para hablar de lo que alguien tiene: *Tengo un bolso rojo.*'
        answer: true
        feedback:
          correct: ¡Correcto! *Tengo un bolso rojo* dice qué cosa tengo.
          incorrect: '*Tener* es para lo que alguien tiene: *Ella tiene cinco pares de zapatos.*'
      - id: ropa
        type: matching
        prompt: Une cada prenda con su traducción.
        pairs:
          - [vestido, שמלה]
          - [falda, חצאית]
          - [abrigo, מעיל]
          - [bolso, תיק]
          - [zapatos, נעליים]
      - id: ordena-falda
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: La falda es elegante y cómoda.
        alsoAccept: [La falda es cómoda y elegante.]

  - slug: moda-y-compras-numeros
    title: 'Números: precios y cantidades'
    minutes: 8
    items:
      - id: decenas
        type: matching
        prompt: Une los números.
        pairs:
          - ['15', quince]
          - ['20', veinte]
          - ['30', treinta]
          - ['60', sesenta]
          - ['90', noventa]
      - id: veintisiete
        type: multipleChoice
        prompt: La camiseta cuesta $27. ¿Cómo se dice *27*?
        options:
          - { text: veintisiete, correct: true }
          - {
              text: veinte y siete,
              feedback: 'Del 21 al 29 se escribe en una palabra: *veintisiete*.',
            }
          - { text: setenta y dos, feedback: '*Setenta y dos* es 72.' }
      - id: ochenta
        type: multipleChoice
        prompt: El bolso cuesta $80. ¿Cómo se dice *80*?
        options:
          - { text: ochenta, correct: true }
          - { text: ocho, feedback: '*Ocho* es 8.' }
          - { text: dieciocho, feedback: '*Dieciocho* es 18.' }
      - id: setenta
        type: fillBlank
        prompt: Escribe el número en palabras.
        text: Los zapatos cuestan ___ dólares. ($70)
        blanks: [[setenta]]
      - id: treinta-y-cinco
        type: fillBlank
        prompt: Escribe el número en palabras.
        text: El abrigo cuesta ___ dólares. ($35)
        blanks: [[treinta y cinco]]
      - id: quince
        type: fillBlank
        prompt: Escribe el número en palabras.
        text: Compro ___ pares de calcetines. (15)
        blanks: [[quince]]
      - id: veinte-nta
        type: trueFalse
        prompt: '*Veinte* termina en *-nta*, como *treinta* y *cuarenta*.'
        answer: false
        feedback:
          correct: ¡Correcto! *Veinte* es diferente; del 30 al 90 terminan en *-nta*.
          incorrect: '*Veinte* termina en *-e*. Solo del 30 al 90 terminan en *-nta*: *treinta, cuarenta, cincuenta…*'
      - id: ordena-falda
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: La falda cuesta noventa dólares.
