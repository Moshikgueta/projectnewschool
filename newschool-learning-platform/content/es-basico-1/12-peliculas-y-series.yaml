vocabulary:
  - slug: peliculas-y-series
    title: Películas y series
    items: *peliculas-y-series-words

activities:
  - slug: peliculas-y-series-preguntas
    title: 'Formar preguntas: qué, cuál, quién, dónde, cuándo, por qué'
    minutes: 8
    items:
      - id: donde-ves
        type: multipleChoice
        prompt: 'Respuesta: *Veo películas en el cine.* ¿Cuál es la pregunta?'
        options:
          - { text: ¿Dónde ves películas?, correct: true }
          - {
              text: ¿Cuándo ves películas?,
              feedback: '*Cuándo* pregunta por el tiempo. *En el cine* es un lugar: usa *dónde*.',
            }
          - {
              text: ¿Quién ve películas?,
              feedback: '*Quién* pregunta por una persona. *En el cine* es un lugar: usa *dónde*.',
            }
      - id: quien-actriz
        type: multipleChoice
        prompt: 'Respuesta: *Mi actriz favorita es Salma Hayek.* ¿Cuál es la pregunta?'
        options:
          - { text: ¿Quién es tu actriz favorita?, correct: true }
          - {
              text: ¿Dónde es tu actriz favorita?,
              feedback: '*Dónde* pregunta por un lugar. Salma Hayek es una persona: usa *quién*.',
            }
          - {
              text: ¿Por qué es tu actriz favorita?,
              feedback: '*Por qué* pregunta por una razón. La respuesta es una persona: usa *quién*.',
            }
      - id: pregunta-cerrada
        type: multipleChoice
        prompt: ¿Qué pregunta es cerrada (se responde con *sí* o *no*)?
        options:
          - { text: ¿Eres actor?, correct: true }
          - {
              text: ¿Dónde vives?,
              feedback: 'Es una pregunta abierta: la respuesta es un lugar, no *sí* o *no*.',
            }
          - {
              text: ¿Qué películas te gustan?,
              feedback: 'Es una pregunta abierta: la respuesta es un tipo de película, no *sí* o *no*.',
            }
      - id: cerrada-ciudad
        type: trueFalse
        prompt: '*¿Vives en la ciudad?* es una pregunta cerrada: se responde con *sí* o *no*.'
        answer: true
        feedback:
          correct: ¡Correcto! *Sí, vivo en la ciudad.* / *No, no vivo en la ciudad.*
          incorrect: 'La respuesta puede ser solo *sí* o *no*: es una pregunta cerrada.'
      - id: por-que
        type: fillBlank
        prompt: Completa la pregunta con una palabra interrogativa.
        text: ¿___ te gusta esta película? — Porque es divertida.
        blanks: [[Por qué]]
      - id: cuando
        type: fillBlank
        prompt: Completa la pregunta con una palabra interrogativa.
        text: ¿___ ves la serie? — Por la noche.
        blanks: [[Cuándo]]
      - id: interrogativas
        type: matching
        prompt: Une cada palabra con su traducción.
        pairs:
          - [qué, מה]
          - [quién, מי]
          - [dónde, איפה]
          - [cuándo, מתי]
          - [por qué, למה]
      - id: ordena-favorita
        type: reorderSentence
        prompt: Ordena las palabras para formar una pregunta.
        sentence: ¿Cuál es tu película favorita?

  - slug: peliculas-y-series-preposiciones
    title: 'Preposiciones: en, a, con, sobre'
    minutes: 8
    items:
      - id: a-las-ocho
        type: multipleChoice
        prompt: Veo la película ___ las ocho.
        options:
          - { text: a, correct: true }
          - { text: en, feedback: 'Con las horas usamos *a*: *a las ocho*.' }
          - {
              text: con,
              feedback: '*Con* es para la compañía (con quién). Con las horas usamos *a*.',
            }
      - id: en-1995
        type: multipleChoice
        prompt: La película pasa ___ 1995.
        options:
          - { text: en, correct: true }
          - { text: a, feedback: '*A* es para las horas. Con los años usamos *en*: *en 1995*.' }
          - { text: sobre, feedback: '*Sobre* es para el tema. Con los años usamos *en*.' }
      - id: sobre-pez
        type: multipleChoice
        prompt: Es una película ___ un pez pequeño.
        options:
          - { text: sobre, correct: true }
          - { text: con, feedback: '*Con* es para la compañía. Para el tema usamos *sobre*.' }
          - {
              text: a,
              feedback: '*A* es para las horas o el destino. Para el tema usamos *sobre*.',
            }
      - id: en-las-5
        type: trueFalse
        prompt: 'Para decir una hora, decimos *en las 5*.'
        answer: false
        feedback:
          correct: '¡Correcto! Con las horas usamos *a*: *a las 5*.'
          incorrect: 'Con las horas usamos *a*: *a las 5*. *En* es para meses, años y lugares.'
      - id: nemo
        type: fillBlank
        prompt: Completa con una preposición.
        text: Nemo vive ___ el mar ___ su padre.
        blanks: [[en, bajo], [con]]
        wordBank: [en, a, con, sobre]
      - id: casa-amigo
        type: fillBlank
        prompt: Completa con una preposición.
        text: Voy ___ la casa de mi amigo.
        blanks: [[a, hacia]]
        wordBank: [en, a, con, sobre]
      - id: usos
        type: matching
        prompt: Une cada preposición con su uso.
        pairs:
          - [en, 'meses, años y lugares']
          - [a, horas y destino]
          - [con, compañía (con quién)]
          - [sobre, tema (de qué trata)]
      - id: ordena-familia
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Está con su familia en la ciudad.
        alsoAccept: [Está en la ciudad con su familia.]
