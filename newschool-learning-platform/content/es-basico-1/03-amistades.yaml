            }
          - {
              text: nadan,
              feedback: '*Nadan* es para *ellos / ellas*. Con *nosotros* el verbo termina en *-amos*.',
            }
      - id: completa-ar
        type: fillBlank
        prompt: Completa con el verbo en presente.
        text: Yo ___ (visitar) a mi amigo cada fin de semana. Él me ___ (invitar) a sus fiestas. Ellos ___ (hablar) todos los días.
        blanks: [[visito], [invita], [hablan]]
      - id: completa-er-ir
        type: fillBlank
        prompt: Completa con el verbo en presente.
        text: Mi amigo ___ (comer) pizza. Nosotros ___ (compartir) secretos.
        blanks: [[come], [compartimos]]
      - id: tercera-s
        type: trueFalse
        prompt: 'Para *él / ella* añadimos *-s* al verbo: *Ella ayudas.*'
        answer: false
        feedback:
          correct: '¡Correcto! *-s* es para *tú* (tú ayudas). Con *ella*: *ella ayuda*.'
          incorrect: '*-s* es para *tú* (tú ayudas). Con *ella*: *ella ayuda*.'
      - id: une-hablar
        type: matching
        prompt: Une cada persona con la forma del verbo *hablar*.
        pairs:
          - [yo, hablo]
