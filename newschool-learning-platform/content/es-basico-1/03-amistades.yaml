vocabulary:
  - slug: amistades
    title: Amistades
    items: *amistades-words

activities:
  - slug: amistades-descriptivos
    title: 'Oraciones descriptivas: es y son'
    minutes: 8
    items:
      - id: amigo-es
        type: multipleChoice
        prompt: Mi mejor amigo ___ amable.
        options:
          - { text: es, correct: true }
          - { text: son, feedback: '*Mi mejor amigo* es una persona (singular): usa *es*.' }
          - { text: soy, feedback: '*Soy* es para *yo*. Con *mi amigo* usa *es*.' }
      - id: amigos-son
        type: multipleChoice
        prompt: Mis amigos ___ divertidos.
        options:
          - { text: son, correct: true }
          - { text: es, feedback: '*Mis amigos* es plural: usa *son*.' }
          - { text: eres, feedback: '*Eres* es para *tú*. Con *mis amigos* usa *son*.' }
      - id: amiga-alta
        type: multipleChoice
        prompt: Mi amiga es ___.
        options:
          - { text: alta, correct: true }
          - { text: alto, feedback: '*Amiga* es femenino: el adjetivo termina en *-a* (alta).' }
          - { text: altas, feedback: '*Mi amiga* es una persona (singular): usa *alta*.' }
      - id: negativo-orden
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: Mi amigo no es grosero., correct: true }
          - { text: Mi amigo es no grosero., feedback: '*No* va antes del verbo: *no es*.' }
          - {
              text: No mi amigo es grosero.,
              feedback: '*No* va justo antes del verbo: *Mi amigo no es grosero*.',
            }
      - id: es-son
        type: fillBlank
        prompt: Completa con *es* o *son*.
        text: Mi amigo ___ tranquilo. Mis amigos no ___ egoístas. ¿___ generosos tus amigos?
        blanks: [[es], [son], [Son]]
        wordBank: [es, son]
      - id: une-ser
        type: matching
        prompt: Une cada sujeto con la forma correcta del verbo *ser*.
        pairs:
          - [Yo, soy]
          - [Tú, eres]
          - [Mi amigo, es]
          - [Nosotros, somos]
          - [Mis amigos, son]
      - id: plural-adjetivo
        type: trueFalse
        prompt: 'En plural, el adjetivo también va en plural: *Mis amigos son simpáticos.*'
        answer: true
        feedback:
          correct: ¡Correcto! *Amigos* es plural, y *simpáticos* también.
          incorrect: 'El adjetivo cambia como la persona: *mi amigo simpático*, *mis amigos simpáticos*.'
      - id: ordena-amigo
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Mi mejor amigo es alto y simpático
        alsoAccept: [Mi mejor amigo es simpático y alto]

  - slug: amistades-presente
    title: Verbos en presente
    minutes: 8
    items:
      - id: ella-ayuda
        type: multipleChoice
