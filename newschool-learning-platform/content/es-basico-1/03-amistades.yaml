  - slug: amistades-vocabulario
    title: Vocabulario
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Palabras de la amistad
        glossLang: he
        link: https://quizlet.com/br/1060083398/amistades-flash-cards/
