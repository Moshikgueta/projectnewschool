    title: Vocabolario
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Le parole della scrittura creativa
        glossLang: he
        link: https://quizlet.com/br/1171532696/scrittura-creativa-flash-cards/
        items: &scrittura-creativa-words
          - { term: Storia, gloss: סיפור }
