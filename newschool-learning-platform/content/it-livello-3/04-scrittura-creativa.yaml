vocabulary:
  - slug: scrittura-creativa
    title: Scrittura creativa
    items: *scrittura-creativa-words

activities:
  - slug: scrittura-creativa-tempi
    title: 'Tempi narrativi: ho visto, era buio'
    minutes: 8
    items:
      - id: cera-silenzio
        type: multipleChoice
        prompt: Era buio e c'___ silenzio.
        options:
          - { text: era, correct: true }
          - {
              text: è,
              feedback: "*È* è presente. Per descrivere l'ambiente in una storia al passato usiamo l'imperfetto: *c'era*.",
            }
          - { text: ero, feedback: "*Ero* è la forma di *io*. Il silenzio è *lui*: *c'era*." }
      - id: ho-sentito
        type: multipleChoice
        prompt: Mentre camminavo, ___ un rumore.
        options:
          - { text: ho sentito, correct: true }
          - {
              text: sento,
              feedback: "*Sento* è presente. L'azione che succede durante la situazione va al passato prossimo: *ho sentito*.",
            }
          - {
              text: sono sentito,
              feedback: 'Qui *sentire* (sentire un rumore) usa *avere*: *ho sentito*.',
            }
      - id: entrato-visto
        type: fillBlank
        prompt: Completa con il passato prossimo di *entrare* e *vedere* (io).
        text: Prima ___ nella stanza, poi ___ una luce.
        blanks: [[sono entrato, sono entrata, io sono entrato, io sono entrata], [ho visto]]
      - id: uso-imperfetto
        type: trueFalse
        prompt: "L'imperfetto si usa per raccontare le azioni principali della storia: *Entravo nella stanza.*"
        answer: false
        feedback:
          correct: "Giusto! Le azioni vanno al passato prossimo (*Sono entrato nella stanza*); l'imperfetto descrive lo sfondo (*Era buio*)."
          incorrect: "Le azioni vanno al passato prossimo (*Sono entrato nella stanza*). L'imperfetto descrive la situazione e l'ambiente (*Era buio, c'era silenzio*)."
      - id: unisci-forme
        type: matching
        prompt: Unisci ogni verbo alla forma giusta.
        pairs:
          - ['entrare (io, passato prossimo)', sono entrato]
          - ['vedere (io, passato prossimo)', ho visto]
          - ['essere (lui, imperfetto)', era]
          - ['avere (io, imperfetto)', avevo]
          - ['camminare (io, imperfetto)', camminavo]
      - id: si-sono-spente
        type: multipleChoice
        prompt: Poi, all'improvviso, le luci ___.
        options:
          - { text: si sono spente, correct: true }
          - {
              text: si spegnevano,
              feedback: "È un'azione improvvisa, un evento della storia: usiamo il passato prossimo, *si sono spente*.",
            }
          - {
              text: hanno spento,
              feedback: '*Spegnersi* è riflessivo e usa *essere*: *le luci si sono spente*.',
            }
      - id: erano-vuoti
        type: fillBlank
        prompt: "Completa con l'imperfetto di *essere*."
        text: I corridoi ___ vuoti e silenziosi.
        blanks: [[erano]]
      - id: ordina-mentre
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Mentre camminavo, ho sentito un rumore.

  - slug: scrittura-creativa-connettori
    title: 'Connettori e struttura: prima, poi, ma, quindi'
    minutes: 8
    items:
      - id: prima
        type: multipleChoice
        prompt: ___ sono entrato, poi ho visto una luce.
        options:
          - { text: Prima, correct: true }
          - {
              text: Alla fine,
              feedback: "*Alla fine* indica l'ultima azione. Qui è la prima azione (dopo viene *poi*): *Prima*.",
            }
          - {
              text: Quindi,
              feedback: '*Quindi* introduce una conseguenza. Qui mettiamo le azioni in ordine: *Prima… poi…*',
            }
      - id: quindi
        type: multipleChoice
        prompt: Era tardi, ___ sono tornato a casa.
        options:
          - { text: quindi, correct: true }
          - {
              text: ma,
              feedback: "*Ma* introduce un contrasto. Qui tornare a casa è la conseguenza dell'ora tarda: *quindi*.",
            }
          - {
              text: perché,
              feedback: '*Perché* introduce la causa, non la conseguenza: *Sono tornato a casa perché era tardi.*',
            }
      - id: ma
        type: multipleChoice
        prompt: Avevo paura, ___ sono entrato lo stesso.
        options:
          - { text: ma, correct: true }
          - {
              text: quindi,
              feedback: '*Lo stesso* indica un contrasto: avevo paura e sono entrato comunque. Usiamo *ma*.',
            }
          - {
              text: prima,
              feedback: "*Prima* serve a mettere le azioni in ordine. Qui c'è un contrasto: *ma*.",
            }
      - id: unisci-connettori
        type: matching
        prompt: Unisci ogni connettore alla sua funzione.
        pairs:
          - [prima, la prima azione]
          - [alla fine, l'ultima azione]
          - [perché, la causa]
          - [quindi, la conseguenza]
          - [ma, il contrasto]
      - id: struttura
        type: trueFalse
        prompt: 'Una storia ha tre parti: inizio, sviluppo e fine.'
        answer: true
        feedback:
          correct: 'Giusto! Inizio = la situazione; sviluppo = il problema e gli eventi; fine = il risultato.'
          incorrect: 'Ogni storia ha tre parti: inizio (la situazione), sviluppo (il problema, gli eventi) e fine (il risultato).'
      - id: perche-buio
        type: fillBlank
        prompt: Completa con il connettore giusto.
        text: Non sono uscito ___ era molto buio.
        blanks: [[perché]]
        wordBank: [perché, quindi, ma, prima]
      - id: sviluppo
        type: multipleChoice
        prompt: In quale parte della storia ci sono il problema e gli eventi?
        options:
          - { text: Nello sviluppo, correct: true }
          - {
              text: "All'inizio",
              feedback: "L'inizio presenta la situazione. Il problema e gli eventi sono nello sviluppo.",
            }
          - {
              text: Alla fine,
              feedback: 'La fine racconta il risultato. Il problema e gli eventi sono nello sviluppo.',
            }
      - id: ordina-prima-poi
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Prima sono entrato, poi ho visto una luce.
