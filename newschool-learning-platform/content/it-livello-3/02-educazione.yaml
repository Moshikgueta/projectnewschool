# Cycle "Educazione", converted from the Italian level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-3
slug: educazione
title: Educazione
goal: Parlare di esperienze di studio con il passato prossimo e l'imperfetto, e del futuro dell'educazione con il futuro semplice.
position: 2
status: in_review

review:
  - >-
    The two workbook exercises ("Passato prossimo e imperfetto" and "Futuro semplice")
    are NEW: the notebook has no self-study exercises. They were written from the
    cycle's summary rules, the activity models and the vocabulary. Please check level,
    wording and every right answer before students see them.
  - >-
    The notebook lists three grammar goals (passato prossimo vs imperfetto; futuro
    semplice; opinions, causes and consequences). The cycle overview keeps the first
    two as the cycle's two skills; the connectors (perché, anche se, per questo,
    quindi) are practised in Activities 2 and 4, in the summary and in one workbook
    item.
  - >-
    Left out: the gamma.app lesson slides (slide links are not allowed; mentioned in a
    teacher note), the "Data / Partecipanti" lines and the "Risposte: Studente 1/2/3"
    lines (the platform has answer boxes). The "Abilità sviluppate" list and each
    activity's "Obiettivo" / "Abilità" lines are summed up in the teacher notes.
    "Instruzione" → "Istruzioni" (now the plan note).
  - >-
    Warm-up: question 2 had two versions of the follow-up ("Che cosa facevi
    esattamente per migliorare? / Che cosa hai fatto per migliorare?"); kept as "Che
    cosa facevi per migliorare? E che cosa hai fatto alla fine?" so both tenses are
    practised. "Ti sei mai pentito" → "pentito / pentita". Broken bold marks were
    removed. Sentence frames were added to every question and an example to the
    introduction round (not in the source).
  - >-
    Model letter (Activity 1): "Lei era una delle persone più importanti" → "Lei è
    stata…" (a finished period seen as a whole); "Ho capito finalmente" → "Finalmente
    ho capito"; "Cordiali saluti" (business closing) → "Con affetto". Activity 2 model
    "Formeremo insegnanti digitali" → "Formeremo gli insegnanti alla didattica
    digitale"; "predizioni" → "previsioni" throughout.
  - >-
    Summary corrections: "ho migliorato molto / rapidamente" without an object →
    "sono migliorato / migliorata" (intransitive migliorare takes essere); contrast
    example "Era difficile, anche se ho imparato molto" (illogical) → "Ho imparato
    molto, anche se era difficile"; lines that started with a capital after a comma
    were fixed. The short first "Riassunto grammaticale" repeats the longer one and the
    final table; kept once. ADDED (please confirm): how the futuro is formed (infinitive
    without -e, -are → -er-, endings -ò, -ai, -à, -emo, -ete, -anno) with the
    irregulars sarò, avrò, farò, andrò, potrò; imperfetto endings -avo / -evo / -ivo;
    a note that "penso che" + present needs the congiuntivo (penso che sia), while
    "penso che + futuro" is fine for the future. "Intenzioni formali" → "piani e
    intenzioni".
  - >-
    Homework, Option 1 part 4: the question "Come ha influenzato la tua educazione, la
    tua vita e che cosa studierai…" was broken → "Come ha influenzato la tua vita
    l'educazione che hai ricevuto? Che cosa studierai o farai in futuro?". Option 2
    part 1: "…ma ___ (superare) l'esame con successo" (repeats "esame") → "ma lo ___
    (superare) con successo". The answer keys of the mini activity and of Option 2 part
    1 are teacher notes.
  - >-
    Times: the notebook says 90 minutes and asks the teacher to choose up to 2 of the
    4 activities (kept in the plan note). Mini activity "3-5 min" → 5, its parts "1-2"
    → 2 and "2-3" → 3. Activity 2's steps (2 + 10 + 3 per group + 5) can exceed 20
    minutes with many groups.
  - >-
    Activity 3 step 1 says students choose their learning style, but the Italian
    notebook lists no styles (the Spanish notebook has six channels); none were added.
    Please add a list if you use one.
  - >-
    Vocabulary: "Vocabulo" → "Vocabolario". "Imparare" appeared twice: kept once.
    "Imparare" and "Studiare" were both glossed ללמוד: now "ללמוד (לרכוש ידע)" and
    "ללמוד (לעיין, לשנן)". "Imparato – למדתי / נלמד" and "Studiato – למדתי" → "ho
    imparato" / "ho studiato" with glosses "למדתי (רכשתי ידע)" / "למדתי (עיינתי)".
    "Perché – כי / בגלל ש" → "כי / בגלל ש / למה". Please check.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: educazione-classe
    title: 'In classe: Educazione'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Educazione
      - id: skills
        type: cycleOverview
        skills:
          - name: Passato prossimo e imperfetto
            description: 'Azioni specifiche (*ho fatto un esame, mi ha aiutato*) e descrizioni o abitudini (*ero studente, studiavo molto*)'
          - name: Futuro semplice
            description: "Previsioni e progetti: *studierò pedagogia, l'educazione cambierà molto*"
      - id: quizlet
        type: externalLink
        label: Educazione su Quizlet
        url: https://quizlet.com/il/1147961627/educazione-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Giro di introduzione
      - id: intro
        type: sentenceFrame
        frame: Io sono ___. La mia materia preferita a scuola era ___ perché ___.
        example: Io sono Marco. La mia materia preferita a scuola era la storia perché la professoressa raccontava storie incredibili.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup-hint
        type: callout
        tone: info
        text: Rispondi con frasi **complete e sviluppate**. Usa il **passato prossimo** per le azioni e l'**imperfetto** per le descrizioni e le abitudini.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Hai avuto un'esperienza di apprendimento che ha segnato la tua vita? Quando è successo? Perché è stata importante?
            frame: Sì, ___. È successo quando ___. È stata importante perché ___.
          - question: Hai studiato una materia che era molto difficile per te? Che cosa facevi per migliorare? E che cosa hai fatto alla fine?
            frame: Per me ___ era molto difficile. Per migliorare ___. Alla fine ___.
          - question: Hai fatto un corso fuori dalla scuola o dall'università? Che cosa hai imparato lì che non hai imparato a scuola?
            frame: Ho fatto un corso di ___. Lì ho imparato ___.
          - question: Hai lavorato in gruppo ed è stata una brutta esperienza? Che cosa è successo esattamente?
            frame: Sì, una volta ___. Il problema era che ___.
          - question: Quale materia pensi che sparirà dal sistema educativo in futuro? Perché?
            frame: Penso che ___ sparirà perché ___.
          - question: Ti sei mai pentito / pentita di non aver studiato qualcosa prima? Che cosa facevi in quel periodo? Che cosa hai fatto dopo?
            frame: Sì, mi sono pentito / pentita di non aver studiato ___. In quel periodo ___. Dopo ___.
          - question: Che cosa studierai il prossimo anno o che cosa ti piacerebbe studiare? Perché sarà utile per te?
            frame: Il prossimo anno studierò ___. Sarà utile perché ___.
          - question: Se potessi cambiare una cosa del sistema educativo del tuo paese, che cosa cambieresti e perché?
            frame: Cambierei ___ perché ___.
      - id: mini-title
        type: heading
        level: 3
        text: 'Mini attività: passato prossimo o imperfetto?'
      - id: mini
        type: discussionQuestions
        title: Completa le frasi con il tempo corretto
        items:
          - question: Quando ero studente, ___ molto. (studiare)
          - question: Ieri ___ un esame difficile. (fare)
          - question: Il professore ___ molto gentile. (essere)
          - question: Un giorno mi ___ molto. (aiutare)
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: Lettera a una persona che ha segnato la tua educazione'
        skills: [Passato prossimo e imperfetto]
        minutes: 20
        steps:
          - '**Preparazione (5 minuti):** pensa alle domande qui sotto e prendi appunti brevi. Non scrivi ancora la lettera: organizzi solo le idee.'
          - "**Scrittura (10 minuti):** scrivi una lettera di 10-12 frasi. Usa l'**imperfetto** per descrivere persone e situazioni e il **passato prossimo** per le azioni specifiche."
          - "Struttura suggerita: saluto (*Cara professoressa…*); chi è questa persona; com'era; che cosa faceva; un momento specifico del passato; che cosa ha fatto per aiutarti; come ha cambiato la tua vita; ringraziamento finale; saluto finale e nome."
          - '**Lettura (5 minuti):** leggi la tua lettera a un compagno, o ad alta voce alla classe.'
          - 'Dopo ogni lettura il compagno fa **una domanda di approfondimento**: *Come ti sentivi in quel periodo? Sei ancora in contatto con questa persona? Vorresti essere come questa persona in futuro?*'
        example: |-
          *Cara professoressa Laura,*
          *Lei è stata una delle persone più importanti nella mia educazione. Era sempre gentile e paziente. Mi spiegava tutto con calma e mi incoraggiava a partecipare. Quando ero studente, avevo difficoltà con la grammatica. Un giorno mi ha aiutato a capire una lezione molto difficile. Finalmente ho capito e mi sono sentito più sicuro. Grazie per tutto quello che ha fatto per me.*
          *Con affetto,*
          *Andrea*
      - id: act1-questions
        type: discussionQuestions
        title: Preparazione della lettera
        items:
          - question: Chi è questa persona importante per te? (insegnante, allenatore, familiare…)
            frame: È ___.
          - question: Com'era questa persona? (gentile, severa, paziente…)
            frame: Era ___.
          - question: Che cosa faceva per aiutarti? (mi aiutava, mi spiegava, mi incoraggiava…)
            frame: Mi ___.
          - question: Ricordi un momento specifico con questa persona? Quando è successo? Che cosa è successo esattamente?
            frame: Un giorno ___.
          - question: Come ha cambiato la tua vita questa persona?
            frame: Grazie a questa persona ___.
          - question: Perché vuoi ringraziarla oggi?
            frame: Voglio ringraziarla perché ___.
      - id: act2
        type: classActivity
        title: 'Attività 2: Il sistema educativo del futuro'
        skills: [Futuro semplice]
        minutes: 20
        steps:
          - "Siete il **Ministero dell'Istruzione del 2050**. La vostra missione: creare un nuovo **sistema educativo inclusivo** per tutti gli studenti."
          - '**Gruppi (2 minuti):** formate gruppi di 3-4 studenti. Ogni gruppo è un team del Ministero. Compito: *progettare il sistema educativo del futuro per il 2050.*'
          - '**Piano (10 minuti):** scrivete un piano con almeno **4 idee** al **futuro semplice** e almeno **due connettori** (*perché, anche se, per questo*). Usate le frasi qui sotto.'
          - '**Presentazione (3 minuti per gruppo):** presentate il vostro sistema educativo con il futuro semplice e i connettori.'
          - '**Domanda critica (5 minuti):** un altro gruppo fa una domanda, per esempio: *Pensate che questo sistema funzionerà in tutti i paesi? Che cosa succederà agli insegnanti?* Il gruppo risponde usando il futuro semplice.'
        example: |-
          *Formeremo gli insegnanti alla didattica digitale perché la tecnologia sarà molto importante.*
          *L'educazione sarà più inclusiva.*
          *Gli studenti studieranno in modo più flessibile.*
      - id: act2-ideas
        type: discussionQuestions
        title: Il nostro piano per il 2050
        items:
          - question: Idea 1
            frame: L'educazione sarà ___ perché ___.
          - question: Idea 2
            frame: Gli studenti studieranno ___.
          - question: Idea 3
            frame: Gli insegnanti useranno ___, anche se ___.
          - question: Idea 4
            frame: Le scuole cambieranno ___. Per questo ___.
      - id: act3
        type: classActivity
        title: 'Attività 3: Come impari meglio?'
        skills: [Passato prossimo e imperfetto]
        minutes: 15
        steps:
          - "**Presentazione (5 minuti):** l'insegnante spiega con esempi. Pensa al tuo stile di apprendimento."
          - "**In coppia (8 minuti):** fate le domande qui sotto e rispondete con il passato prossimo e l'imperfetto. Poi scambiatevi i ruoli."
          - '**Discussione finale (2 minuti):** condividete alcune risposte con la classe.'
        example: |-
          *Quando studiavo all'università, guardavo molti video.*
          *Ho imparato molto con questi video.*
      - id: act3-questions
        type: discussionQuestions
        title: Domande per il compagno
        items:
          - question: Come studiavi normalmente?
            frame: Normalmente studiavo ___.
          - question: Hai imparato qualcosa guardando video?
            frame: Sì, ho imparato ___ guardando ___. / No, non ho mai ___.
          - question: Hai studiato in gruppo?
            frame: Sì, quando ___, studiavo in gruppo con ___.
          - question: Hai usato applicazioni per studiare?
            frame: Sì, ho usato ___ e mi ha aiutato a ___.
      - id: act4
        type: classActivity
        title: 'Attività 4: Sono un insegnante nel 2050'
        skills: [Futuro semplice]
        minutes: 15
        steps:
          - '*Siamo nel 2050. Voi siete gli insegnanti del futuro.*'
          - '**Scelta (3 minuti):** scegli tre materie nuove.'
          - '**Creazione (5 minuti):** completa le frasi qui sotto per ogni materia.'
          - '**Presentazione (7 minuti):** presenta le tue materie alla classe.'
        example: |-
          *Insegnerò educazione digitale perché sarà importante.*
          *Gli studenti impareranno nuove competenze.*
          *L'educazione cambierà molto.*
      - id: act4-frames
        type: discussionQuestions
        title: Le mie materie
        items:
          - question: La materia
            frame: Insegnerò ___.
          - question: Perché sarà importante?
            frame: Sarà importante perché ___.
          - question: Che cosa impareranno gli studenti?
            frame: Gli studenti impareranno ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Durata: 90 minuti. Due abilità: **Passato prossimo e imperfetto** (introduzione,
          riscaldamento, mini attività, Attività 1 e 3) e **Futuro semplice** (Attività 2
          e 4), con i connettori per esprimere opinioni, cause e conseguenze. Dopo
          l'introduzione e il riscaldamento scegli **al massimo 2 attività principali**
          tra le Attività 1-4, in base al livello, ai bisogni e al tempo. Abilità
          sviluppate: espressione orale, scrittura guidata, dibattito, pensiero critico.
          La presentazione della lezione (gamma.app) non è inclusa nella piattaforma (i
          link alle presentazioni non sono permessi).
      - id: n-intro
        anchor: intro
        minutes: 5
        text: Incoraggia l'uso dell'imperfetto per descrivere il passato (*era, mi piaceva*).
      - id: n-warmup
        anchor: warmup
        minutes: 15
        text: Chiedi risposte complete e sviluppate, con passato prossimo + imperfetto.
      - id: n-mini
        anchor: mini
        minutes: 5
        text: >-
          Scrivi le frasi alla lavagna. Lavoro individuale: 2 minuti. Controllo con tutta la
          classe: 3 minuti. Soluzioni: *studiavo, ho fatto, era, ha aiutato*. Chiedi:
          Perché *studiavo*? → è una situazione abituale. Perché *ho fatto*? → è un'azione
          specifica e completata.
      - id: n-act1
        anchor: act1
        minutes: 20
        text: >-
          Proietta o scrivi le domande di preparazione. Controlla che lo studente: usi
          almeno 3 verbi all'imperfetto e 3 al passato prossimo, esprima gratitudine e
          spieghi un cambiamento personale.
      - id: n-act2
        anchor: act2
        minutes: 20
        text: >-
          Obiettivo: il futuro semplice per fare previsioni e i connettori per
          giustificare le idee (*perché, anche se, per questo*); si sviluppano anche il
          dibattito, il pensiero critico e le presentazioni orali. Circola, correggi gli
          errori e aiuta.
      - id: n-act3
        anchor: act3
        minutes: 15
        text: >-
          Obiettivo: lo studente identifica il proprio stile di apprendimento, usa il
          passato prossimo e l'imperfetto, esprime opinioni e mantiene una conversazione.
          Dai prima un esempio personale (*Quando studiavo all'università, guardavo molti
          video. Ho imparato molto con questi video.*).
      - id: n-act4
        anchor: act4
        minutes: 15
        text: >-
          Obiettivo: usare il futuro per fare previsioni, giustificare le idee e parlare con
          sicurezza (espressione orale estesa, argomentazione, creatività, pensiero
          critico).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: educazione-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Riassunto grammaticale
      - id: rules-passato
        type: ruleSummary
        skill: Passato prossimo e imperfetto
        rules:
          - text: "Il **passato prossimo** si usa per le **azioni completate** nel passato, le esperienze specifiche e gli eventi con un inizio e una fine chiari. È il tempo principale per raccontare eventi passati nell'italiano parlato. Struttura: **avere / essere (presente) + participio passato**."
            examples:
              - Ho avuto un insegnante molto importante.
              - Ho fatto un esame difficile.
              - Ho partecipato a un corso di formazione.
              - Sono andato all'università.
          - text: "L'**imperfetto** si usa per **descrivere** persone, situazioni e contesto nel passato, per le **abitudini**, per gli stati emotivi o mentali e per le azioni continue o ripetute. Non indica un'azione conclusa. Desinenze: **-avo** (studiare → studiavo), **-evo** (avere → avevo), **-ivo** (capire → capivo)."
            examples:
              - Quando ero studente, studiavo ogni giorno.
              - Il professore spiegava molto bene.
              - Avevo difficoltà con la grammatica.
              - La scuola era molto esigente.
          - text: '**Contrasto:** imperfetto → contesto, descrizione, situazione in corso; passato prossimo → azione specifica e completata.'
            examples:
              - Quando ero studente (contesto), ho fatto un esame importante (azione).
              - Quando studiavo all'università, ho incontrato un insegnante molto importante.
              - Il professore spiegava con pazienza e mi ha aiutato a capire la grammatica.
              - Avevo difficoltà, ma sono migliorato molto.
      - id: avere-essere-table
        type: table
        caption: 'Passato prossimo: avere / essere'
        header: [Soggetto, avere, essere]
        rows:
          - [io, ho studiato, sono andato / andata]
          - [tu, hai studiato, sei andato / andata]
          - [lui / lei, ha studiato, è andato / andata]
          - [noi, abbiamo studiato, siamo andati / andate]
          - [voi, avete studiato, siete andati / andate]
          - [loro, hanno studiato, sono andati / andate]
      - id: imperfetto-table
        type: table
        caption: Imperfetto
        header: [Soggetto, parlare, studiare, essere]
        rows:
          - [io, parlavo, studiavo, ero]
          - [tu, parlavi, studiavi, eri]
          - [lui / lei, parlava, studiava, era]
          - [noi, parlavamo, studiavamo, eravamo]
          - [voi, parlavate, studiavate, eravate]
          - [loro, parlavano, studiavano, erano]
      - id: contrast-table
        type: table
        caption: Schema riassuntivo
        header: [Imperfetto, Passato prossimo]
        rows:
          - [descrizione, azione]
          - [contesto, evento]
          - [abitudine, fatto specifico]
          - [situazione in corso, azione completata]
      - id: rules-futuro
        type: ruleSummary
        skill: Futuro semplice
        rules:
          - text: 'Il **futuro semplice** si usa per fare **previsioni**, per parlare del futuro, per esprimere **conseguenze** e per piani e intenzioni.'
            examples:
              - Studierò pedagogia.
              - L'educazione cambierà molto.
              - Gli studenti useranno più tecnologia.
              - Le scuole saranno diverse.
          - text: "Si forma dall'**infinito senza la -e finale** + **-ò, -ai, -à, -emo, -ete, -anno**. Nei verbi in **-are** la *a* diventa **e**: studiare → studier-ò."
            examples:
              - 'lavorare → lavorerò, prendere → prenderò, capire → capirò'
          - text: 'Alcuni verbi sono irregolari.'
            examples:
              - 'essere → sarò, avere → avrò, fare → farò, andare → andrò, potere → potrò'
      - id: futuro-table
        type: table
        caption: Futuro semplice
        header: [Soggetto, studiare, essere]
        rows:
          - [io, studierò, sarò]
          - [tu, studierai, sarai]
          - [lui / lei, studierà, sarà]
          - [noi, studieremo, saremo]
          - [voi, studierete, sarete]
          - [loro, studieranno, saranno]
      - id: rules-connettori
        type: ruleSummary
        skill: Opinioni, cause e conseguenze
        rules:
          - text: '**Opinioni:** *penso che, credo che, secondo me*. Per il futuro usiamo *penso che* + futuro; per il presente *penso che* vuole il congiuntivo (*penso che sia importante*).'
            examples:
              [Penso che l'educazione cambierà molto., Secondo me la tecnologia è importante.]
          - text: '**Cause:** *perché, dato che*.'
            examples: [Studio italiano perché è importante.]
          - text: '**Conseguenze:** *quindi, per questo*.'
            examples: ['È molto importante, quindi studierò molto.']
          - text: '**Contrasto:** *anche se*.'
            examples: ['Ho imparato molto, anche se era difficile.']
      - id: model
        type: callout
        tone: info
        title: 'Modello completo (passato + futuro)'
        text: |-
          Quando ero studente, avevo difficoltà con la grammatica. Un giorno ho incontrato un insegnante molto bravo. Mi ha aiutato molto e sono migliorato rapidamente.
          In futuro studierò pedagogia perché voglio diventare insegnante. L'educazione cambierà molto nei prossimi anni.
      - id: key-table
        type: table
        caption: Riassunto finale
        header: [Tempo, Uso, Esempio]
        rows:
          - [Passato prossimo, azioni completate, Ho studiato italiano.]
          - [Imperfetto, 'descrizioni, abitudini', Studiavo molto.]
          - [Futuro semplice, 'previsioni, futuro', Studierò pedagogia.]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le due abilità e chiedi un esempio nuovo per ogni regola, sull'educazione di ogni studente.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: educazione-compiti
    title: Compiti con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti
      - id: goal
        type: text
        text: "Dopo questi compiti saprai descrivere il passato con l'imperfetto e il passato prossimo, parlare di esperienze personali, parlare del futuro con il futuro semplice ed esprimere opinioni e giustificazioni."
      - id: opt1-title
        type: heading
        level: 3
        text: 'Opzione 1: Compito con Mori'
      - id: how
        type: text
        text: Apri la chat con Mori, copia un messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Parte 1: Le mie esperienze di educazione (passato)'
        intro: "Obiettivo: praticare il passato prossimo e l'imperfetto."
        message: >-
          Ciao Mori. Voglio parlare delle mie esperienze di educazione. Per favore, fammi
          almeno 6 domande sulla mia scuola, i miei insegnanti e i miei studi. Voglio usare
          l'imperfetto per descrivere situazioni e il passato prossimo per azioni
          specifiche. Dopo ogni risposta, fammi una domanda di approfondimento. Per
          favore, correggi i miei errori e aiutami a migliorare le mie frasi.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Parte 2: Come studiavo e che cosa ho imparato (passato)'
        intro: 'Obiettivo: il contrasto tra imperfetto e passato prossimo.'
        message: >-
          Ciao Mori. Voglio parlare di come studiavo in passato e di quello che ho
          imparato. Per favore, fammi domande sulle mie abitudini di studio e su esperienze
          specifiche. Voglio usare frasi come «Quando studiavo…» e «Ho imparato…». Per
          favore, correggi i miei errori e aiutami a usare il tempo verbale corretto.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Parte 3: Il futuro della mia educazione (futuro)'
        intro: 'Obiettivo: praticare il futuro semplice.'
        message: >-
          Ciao Mori. Voglio parlare del mio futuro. Per favore, fammi domande sui miei
          piani di studio e sul mio futuro professionale. Voglio usare il futuro semplice.
          Dopo ogni risposta, chiedimi «Perché?» per aiutarmi a spiegare le mie idee. Per
          favore, correggi i miei errori.
      - id: final-title
        type: heading
        level: 4
        text: 'Parte 4: Produzione finale (passato + futuro)'
      - id: final-rules
        type: callout
        tone: info
        title: La tua risposta deve avere 5-6 frasi, con
        text: |-
          - almeno 2 verbi all'**imperfetto**
          - almeno 2 verbi al **passato prossimo**
          - almeno 2 verbi al **futuro semplice**
      - id: final
        type: reflection
        prompt: "Come ha influenzato la tua vita l'educazione che hai ricevuto? Che cosa studierai o farai in futuro?"
      - id: opt2-title
        type: heading
        level: 3
        text: 'Opzione 2: Compito scritto'
      - id: written-1
        type: reflection
        prompt: |-
          **Parte 1: imperfetto o passato prossimo?** Scrivi il testo completo con il tempo corretto.
          Quando ero studente, ___ (studiare) molto ogni giorno. La mia insegnante ___ (essere) molto gentile e mi ___ (aiutare) spesso. Un giorno ___ (fare) un esame molto difficile, ma lo ___ (superare) con successo.
      - id: written-2
        type: reflection
        prompt: "**Parte 2: scrittura guidata (passato).** Scrivi un paragrafo di 8-10 frasi su un insegnante o un'esperienza che è stata importante nella tua educazione. Usa almeno 4 verbi all'imperfetto e almeno 4 verbi al passato prossimo."
      - id: written-3
        type: reflection
        prompt: '**Parte 3: il tuo futuro educativo.** Scrivi 6-8 frasi con il futuro semplice (*studierò, imparerò, userò, lavorerò*). Che cosa studierai in futuro? Perché sarà importante? Come userai quello che imparerai?'
      - id: written-4
        type: reflection
        prompt: "**Parte 4: opinioni.** Scrivi 5 frasi con *penso che, perché, quindi, anche se*. Esempio: *Penso che l'educazione cambierà molto perché la tecnologia è importante.*"
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**
    teacherNotes:
      - id: n-written-1
        anchor: written-1
        text: 'Soluzioni della Parte 1: *studiavo, era, aiutava, ho fatto, ho superato*.'

