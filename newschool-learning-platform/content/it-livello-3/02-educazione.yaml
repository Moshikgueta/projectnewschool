activities:
  - slug: educazione-passato
    title: 'Passato prossimo e imperfetto: studiavo, ho fatto'
    minutes: 8
    items:
      - id: studiavo
        type: multipleChoice
        prompt: Quando ero studente, ___ molto.
        options:
          - { text: studiavo, correct: true }
          - {
              text: ho studiato,
              feedback: "*Quando ero studente* descrive un'abitudine nel passato: usiamo l'imperfetto, *studiavo*.",
            }
          - {
              text: studio,
              feedback: "*Studio* è presente. Per un'abitudine nel passato usiamo l'imperfetto: *studiavo*.",
            }
      - id: ho-fatto
        type: multipleChoice
        prompt: Ieri ___ un esame difficile.
        options:
          - { text: ho fatto, correct: true }
          - {
              text: facevo,
              feedback: "Ieri è un momento preciso e l'esame è un'azione specifica e completata: usiamo il passato prossimo, *ho fatto*.",
            }
          - {
              text: faccio,
              feedback: '*Faccio* è presente. Con *ieri* usiamo il passato prossimo: *ho fatto*.',
            }
      - id: era-spiegava
        type: fillBlank
        prompt: "Completa con l'imperfetto di *essere* e *spiegare*."
        text: Il professore ___ molto gentile e ___ con pazienza.
        blanks: [[era], [spiegava]]
      - id: ha-aiutato
        type: fillBlank
        prompt: Completa con il passato prossimo di *aiutare*.
        text: Avevo difficoltà con la grammatica, ma un giorno la professoressa mi ___ a capire una lezione difficile.
        blanks: [[ha aiutato, ha aiutata]]
      - id: unisci-imperfetto
        type: matching
        prompt: "Unisci ogni verbo alla sua forma di *io* all'imperfetto."
        pairs:
          - [studiare, studiavo]
          - [essere, ero]
          - [avere, avevo]
          - [parlare, parlavo]
          - [fare, facevo]
      - id: uso-imperfetto
        type: trueFalse
        prompt: "L'imperfetto si usa per le azioni specifiche e completate."
        answer: false
        feedback:
          correct: "Giusto! Per le azioni specifiche e completate usiamo il passato prossimo. L'imperfetto è per descrizioni, abitudini e contesto."
          incorrect: "L'imperfetto è per descrizioni, abitudini e contesto (*La scuola era molto esigente*). Le azioni completate vanno al passato prossimo (*Ho fatto un esame*)."
      - id: ho-incontrato
        type: multipleChoice
        prompt: "Quando studiavo all'università, ___ un insegnante molto importante."
        options:
          - { text: ho incontrato, correct: true }
          - {
              text: incontro,
              feedback: '*Incontro* è presente. Qui raccontiamo un evento del passato: *ho incontrato*.',
            }
          - {
              text: incontrerò,
              feedback: '*Incontrerò* è futuro. Qui raccontiamo un evento del passato: *ho incontrato*.',
            }
      - id: ordina-grammatica
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Quando ero studente, avevo difficoltà con la grammatica.

  - slug: educazione-futuro
    title: 'Futuro semplice: studierò, sarà'
    minutes: 8
    items:
      - id: studiero
        type: multipleChoice
        prompt: Il prossimo anno ___ pedagogia. (io)
        options:
          - { text: studierò, correct: true }
          - {
              text: studiavo,
              feedback: '*Studiavo* è imperfetto (passato). Con *il prossimo anno* usiamo il futuro: *studierò*.',
            }
          - {
              text: ho studiato,
              feedback: '*Ho studiato* è passato prossimo. Con *il prossimo anno* usiamo il futuro: *studierò*.',
            }
      - id: useranno
        type: fillBlank
        prompt: Completa con il futuro semplice di *usare*.
        text: In futuro gli studenti ___ più tecnologia.
        blanks: [[useranno]]
      - id: unisci-futuro
        type: matching
        prompt: Unisci ogni verbo alla sua forma di *io* al futuro semplice.
        pairs:
          - [essere, sarò]
          - [avere, avrò]
          - [fare, farò]
          - [andare, andrò]
          - [lavorare, lavorerò]
      - id: sara
        type: multipleChoice
        prompt: "Nel 2050 l'educazione ___ più inclusiva."
        options:
          - { text: sarà, correct: true }
          - {
              text: era,
              feedback: '*Era* è imperfetto (passato). Per una previsione sul 2050 usiamo il futuro: *sarà*.',
            }
          - {
              text: è stata,
              feedback: '*È stata* è passato prossimo. Per una previsione usiamo il futuro: *sarà*.',
            }
      - id: are-ere
        type: trueFalse
        prompt: 'Nel futuro dei verbi in *-are*, la *a* diventa *e*: studiare → studierò.'
        answer: true
        feedback:
          correct: 'Giusto! *studiare → studierò, lavorare → lavorerò, cambiare → cambierà*.'
          incorrect: 'Nei verbi in *-are* la *a* diventa *e*: *studiare → studierò*, non *studiarò*.'
      - id: cambieranno
        type: fillBlank
        prompt: Completa con il futuro semplice di *cambiare*.
        text: Nei prossimi anni le scuole ___ molto.
        blanks: [[cambieranno]]
      - id: quindi
        type: multipleChoice
        prompt: È molto importante, ___ studierò molto.
        options:
          - { text: quindi, correct: true }
          - {
              text: anche se,
              feedback: '*Anche se* esprime un contrasto. Qui la seconda frase è una conseguenza: usiamo *quindi*.',
            }
          - {
              text: perché,
              feedback: '*Perché* introduce una causa. Qui la seconda frase è una conseguenza: usiamo *quindi*.',
            }
      - id: ordina-insegnero
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Insegnerò educazione digitale perché sarà importante.
