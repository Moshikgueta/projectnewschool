        type: vocabulary
        title: Le parole delle notizie
        glossLang: he
        link: https://quizlet.com/br/1153912677/notizie-recenti-flash-cards/
        items: &notizie-recenti-words
          - { term: notizia, gloss: חדשה / ידיעה }
          - { term: titolo, gloss: כותרת }
          - { term: articolo, gloss: כתבה / מאמר }
          - { term: giornalista, gloss: עיתונאי }
          - { term: reporter, gloss: כתב }
          - { term: canale, gloss: ערוץ }
          - { term: fonte, gloss: מקור }
          - { term: informazione, gloss: מידע }
          - { term: commento, gloss: תגובה / פרשנות }
          - { term: intervista, gloss: ראיון }
          - { term: dichiarazione, gloss: הצהרה }
          - { term: voce (diceria), gloss: שמועה }
          - { term: governo, gloss: ממשלה }
          - { term: presidente, gloss: נשיא }
          - { term: primo ministro, gloss: ראש ממשלה }
          - { term: politica, gloss: פוליטיקה }
          - { term: elezione, gloss: בחירות }
          - { term: protesta, gloss: מחאה }
          - { term: crisi, gloss: משבר }
          - { term: disastro, gloss: אסון }
          - { term: economia, gloss: כלכלה }
          - { term: cultura, gloss: תרבות }
          - { term: scienza, gloss: מדע }
          - { term: clima, gloss: אקלים }
          - { term: trasmettere, gloss: לשדר }
