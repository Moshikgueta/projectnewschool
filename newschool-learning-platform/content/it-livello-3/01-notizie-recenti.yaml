vocabulary:
  - slug: notizie-recenti
    title: Notizie recenti
    items: *notizie-recenti-words

activities:
  - slug: notizie-recenti-discorso
    title: 'Discorso indiretto: ha detto che…'
    minutes: 8
    items:
      - id: giorno-dopo
        type: multipleChoice
        prompt: 'Il giornalista ha detto: «Domani ci sarà una protesta». → Il giornalista ha detto che ___ ci sarebbe stata una protesta.'
        options:
          - { text: il giorno dopo, correct: true }
          - { text: domani, feedback: 'Nel discorso indiretto *domani* diventa *il giorno dopo*.' }
          - {
              text: il giorno prima,
              feedback: '*Il giorno prima* corrisponde a *ieri*. *Domani* diventa *il giorno dopo*.',
            }
      - id: era-stanca
        type: multipleChoice
        prompt: 'Ieri Anna ha detto: «Oggi sono molto stanca». → Ieri Anna ha detto che quel giorno ___ molto stanca.'
        options:
          - { text: era, correct: true }
          - {
              text: ero,
              feedback: 'Nel discorso indiretto *io* diventa *lei*: non *ero* ma *era*.',
            }
          - {
              text: sarebbe stata,
              feedback: "Il condizionale passato corrisponde al futuro. Qui c'è un presente (*sono*), che diventa imperfetto: *era*.",
            }
      - id: aveva-approvato
        type: fillBlank
        prompt: 'Completa con il verbo *approvare*. Il governo ha detto: «Abbiamo approvato una nuova legge».'
        text: Il governo ha detto che ___ una nuova legge.
        blanks: [[aveva approvato]]
      - id: parole-tempo
        type: matching
        prompt: Unisci ogni parola del discorso diretto alla parola del discorso indiretto.
        pairs:
          - [oggi, quel giorno]
          - [domani, il giorno dopo]
          - [ieri, il giorno prima]
          - [qui, lì]
          - [la settimana prossima, la settimana dopo]
      - id: futuro-condizionale
        type: trueFalse
        prompt: 'Dopo *ha detto che*, il futuro (*ci sarà*) diventa condizionale passato (*ci sarebbe stata*).'
        answer: true
        feedback:
          correct: 'Giusto! «Domani ci sarà una protesta». → Ha detto che il giorno dopo ci sarebbe stata una protesta.'
          incorrect: 'Con il verbo introduttivo al passato, il futuro diventa condizionale passato: *ci sarà* → *ci sarebbe stata*.'
      - id: avrebbe-fatto
        type: fillBlank
        prompt: 'Completa con il verbo *fare*. Il giornalista ha detto: «Domani il governo farà un annuncio».'
        text: Il giornalista ha detto che il giorno dopo il governo ___ un annuncio.
        blanks: [[avrebbe fatto]]
      - id: dice-che
        type: trueFalse
        prompt: 'Se il verbo introduttivo è al presente (*dice che*), il tempo della frase cambia sempre.'
        answer: false
        feedback:
          correct: 'Giusto! Con *dice che* il tempo non cambia: *Il giornalista dice che domani ci sarà una protesta.*'
          incorrect: 'Con il verbo introduttivo al presente il tempo non cambia: *Il giornalista dice che domani ci sarà una protesta.*'
      - id: ordina-sindaco
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Il sindaco ha spiegato che la strada era chiusa.

  - slug: notizie-recenti-tempi
    title: 'Passato, presente e futuro nelle notizie'
    minutes: 8
    items:
      - id: ce-stata
        type: multipleChoice
        prompt: Ieri ___ una protesta in città.
        options:
          - { text: "c'è stata", correct: true }
          - {
              text: "c'è",
              feedback: "*C'è* è presente. Con *ieri* parliamo di un evento già successo: *c'è stata*.",
            }
          - {
              text: ci sarà,
              feedback: "*Ci sarà* è futuro. Con *ieri* usiamo il passato: *c'è stata*.",
            }
      - id: fara
        type: multipleChoice
        prompt: Domani il governo ___ un annuncio.
        options:
          - { text: farà, correct: true }
          - {
              text: ha fatto,
              feedback: '*Ha fatto* è passato. Con *domani* parliamo di un evento che succederà: *farà*.',
            }
          - {
              text: faceva,
              feedback: '*Faceva* è imperfetto (passato). Con *domani* usiamo il futuro: *farà*.',
            }
      - id: parlano
        type: fillBlank
        prompt: Completa con il presente di *parlare*.
        text: Oggi molte persone ___ della notizia.
        blanks: [[parlano]]
      - id: iniziera
        type: fillBlank
        prompt: Completa con il futuro semplice di *iniziare*.
        text: La prossima settimana ___ una nuova legge.
        blanks: [[inizierà]]
      - id: futuri
        type: matching
        prompt: Unisci ogni verbo alla sua forma al futuro (lui / lei).
        pairs:
          - [fare, farà]
          - [essere, sarà]
          - [iniziare, inizierà]
          - [aprire, aprirà]
          - [parlare, parlerà]
      - id: passato-uso
        type: trueFalse
        prompt: Per parlare di eventi che sono già successi usiamo il futuro.
        answer: false
        feedback:
          correct: "Giusto! Per gli eventi già successi usiamo il passato: *Ieri c'è stata una protesta.*"
          incorrect: "Per gli eventi già successi usiamo il passato (*Ieri c'è stata una protesta*). Il futuro è per le previsioni."
      - id: visitano
        type: multipleChoice
        prompt: "Il comune ha iniziato il progetto l'anno scorso. Adesso molte persone ___ la biblioteca."
        options:
          - { text: visitano, correct: true }
          - {
              text: visiteranno,
              feedback: '*Visiteranno* è futuro. Con *adesso* parliamo della situazione attuale: usiamo il presente, *visitano*.',
            }
          - {
              text: visitavano,
              feedback: '*Visitavano* è imperfetto (passato). Con *adesso* usiamo il presente: *visitano*.',
            }
      - id: ordina-biblioteche
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: La città aprirà altre biblioteche.
