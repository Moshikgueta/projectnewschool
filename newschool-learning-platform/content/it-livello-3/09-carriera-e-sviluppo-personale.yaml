# Cycle "Carriera e sviluppo personale", converted from the Italian level 3 digital
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-3
slug: carriera-e-sviluppo-personale
title: Carriera e sviluppo personale
goal: Raccontare la propria carriera al passato, al presente e al futuro e parlare di situazioni immaginarie con il periodo ipotetico.
position: 9
status: published

review:
  - >-
    The two workbook exercises ("Narrazione professionale" and "Periodo ipotetico") are
    NEW: the notebook has no self-correcting exercises. They were written from the cycle's
    summary rules, the activity examples and its vocabulary. Please check level, wording
    and every right answer before students see them.
  - >-
    The notebook lists four abilities (professional narration in past / present / future;
    presenting yourself at work; opinions and motivations; the "secondo periodo
    ipotetico"). They are grouped into the cycle's two skills: "Narrazione professionale"
    (past, present, future, self-presentation; Activities 1, 2, 4, 5) and "Periodo
    ipotetico" (secondo tipo; opinions in Activities 3 and 6). Please confirm.
  - >-
    Grammar fix: the structure "Se + imperfetto → condizionale" (Activity 3, Activity 6,
    summary and key table) is WRONG: the verb after "se" is the congiuntivo imperfetto
    (avessi, guadagnassi, fosse), not the indicativo imperfetto. Now "se + congiuntivo
    imperfetto, condizionale presente" everywhere. The rule "Non si usa il presente dopo
    se" is too general (se + presente is right in real conditions: "Se ho tempo, studio");
    it now says the present is not used after "se" in this type of sentence. A congiuntivo
    imperfetto / condizionale table was ADDED. Please confirm.
  - >-
    Corrections: Activity 1 "Mi parli del tuo lavoro attuale" (mixes formal Lei with "tuo")
    → "Parlami del tuo lavoro attuale" (tu, like the other questions); "di cui sei
    orgoglioso" → "orgoglioso / orgogliosa"; Activity 4 "La persona più interessante è
    stato Paolo" → "è stata Paolo" (agrees with "persona"); Mori message "chiedimi altre
    domande" → "fammi altre domande"; "Vocabulario" (Spanish) → "Vocabolario"; broken bold
    marks in the key table removed.
  - >-
    Left out: the gamma.app slides link (not allowed; mentioned in a teacher note), the
    "Data / Partecipanti" lines and all "Studente 1/2/3" lines (the platform has answer
    boxes). The Quizlet link is kept without "?new". The source's teacher note ("Scegli 2
    o 3 attività…") is kept in the plan note. The names in the examples (Marta, Luca,
    Paolo) are model characters, not students.
  - >-
    Activity 3 contains its own grammar explanation: it is kept as a callout inside the
    activity (with the fix above); the "Esempi possibili" for the guided sentences are in a
    teacher note as an answer key. Activity 3 step 3 "Se lavorassi quattro giorni alla
    settimana" in the possible answers → "solo quattro giorni" to match the prompt.
  - >-
    Warm-up questions had no frames; frames were added. Times: giro di presentazione 5;
    Activity 4 preparation 2 + first round 4; Activity 5 preparation 3, talks max 2 minutes
    each; Activity 6 preparation 5. Activities with no time in the source have none.
  - >-
    The Mori part had one message plus a "Struttura suggerita" (frames for past, present,
    future and imaginary situations): the frames are in a callout under the message.
  - >-
    Vocabulary: "Azienda – חברה" → "חברה (עסק)"; "Risultato – תוצאה" → "תוצאה / הישג" (as
    in "un risultato di cui sei orgoglioso"); "Diventare – להפוך ל־" kept. Please check.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: carriera-e-sviluppo-personale-classe
    title: 'In classe: Carriera e sviluppo personale'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Carriera e sviluppo personale
      - id: skills
        type: cycleOverview
        skills:
          - name: Narrazione professionale
            description: 'Passato, presente e futuro per raccontare la propria carriera: *ho iniziato a lavorare nel 2018, quando ero giovane volevo…, adesso lavoro come…, in futuro vorrei…*'
          - name: Periodo ipotetico
            description: 'Situazioni immaginarie nel lavoro, con se + congiuntivo imperfetto e condizionale: *se avessi più tempo, studierei di più*'
      - id: quizlet
        type: externalLink
        label: Carriera e sviluppo personale su Quizlet
        url: https://quizlet.com/br/1153904514/carriera-e-sviluppo-personale-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Giro di presentazione
      - id: intro
        type: sentenceFrame
        frame: Mi chiamo ___. Quando ero più giovane volevo fare ___. Adesso lavoro / studio ___. In futuro vorrei ___.
        example: Mi chiamo Marta. Quando ero più giovane volevo fare la giornalista. Adesso lavoro come insegnante. In futuro vorrei aprire una scuola di lingue.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup-hint
        type: callout
        tone: info
        text: Rispondi con **frasi complete**.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Di cosa ti occupi attualmente?
            frame: Attualmente mi occupo di ___.
          - question: Perché hai scelto questo lavoro o questo percorso di studi?
            frame: Ho scelto ___ perché ___.
          - question: Qual è una competenza che hai sviluppato negli ultimi anni?
            frame: Negli ultimi anni ho sviluppato ___.
          - question: Cosa facevi prima che ti ha aiutato nel tuo lavoro attuale?
            frame: Prima ___, e questo mi ha aiutato a ___.
          - question: Qual è una situazione difficile che hai affrontato nel lavoro?
            frame: Una volta ___. Ho ___.
          - question: Cosa vorresti migliorare nel futuro?
            frame: In futuro vorrei migliorare ___.
          - question: Se potessi cambiare lavoro domani, cosa faresti?
            frame: Se potessi cambiare lavoro domani, ___.
          - question: Per te è più importante lo stipendio o la soddisfazione personale? Perché?
            frame: Per me è più importante ___ perché ___.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: Simulazione di colloquio'
        skills: [Narrazione professionale]
        steps:
          - '**Lavoro a coppie:** lo studente A è il selezionatore, lo studente B è il candidato.'
          - '**Colloquio:** il selezionatore fa le domande qui sotto e può fare **una domanda di approfondimento**. Il candidato racconta la propria esperienza con i tempi del passato, il presente e il futuro.'
          - '**Cambio dei ruoli:** gli studenti cambiano ruolo.'
          - '**Feedback:** ogni studente dice **un commento positivo** al partner.'
          - "**Condivisione con la classe:** ogni coppia racconta brevemente l'esperienza."
        example: |-
          *A: Perché hai scelto questa professione?*
          *B: Quando ero giovane mi piaceva aiutare le persone, così ho studiato psicologia. Adesso lavoro in una scuola.*
      - id: act1-questions
        type: discussionQuestions
        title: Domande possibili
        items:
          - question: Parlami del tuo lavoro attuale.
            frame: Lavoro come ___. Mi occupo di ___.
          - question: Perché hai scelto questa professione?
            frame: Ho scelto questa professione perché ___.
          - question: Qual è un risultato di cui sei orgoglioso / orgogliosa?
            frame: Sono orgoglioso / orgogliosa di ___.
          - question: Cosa hai imparato dal tuo lavoro precedente?
            frame: Dal mio lavoro precedente ho imparato ___.
          - question: Qual è un tuo punto forte?
            frame: Un mio punto forte è ___.
          - question: Cosa vuoi migliorare nel futuro?
            frame: In futuro voglio / vorrei migliorare ___.
      - id: act2
        type: classActivity
        title: 'Attività 2: La mia ispirazione professionale'
        skills: [Narrazione professionale]
        steps:
          - "**Scelta dell'ispirazione:** può essere una persona, una frase o un'esperienza."
          - '**Struttura guidata:** prepara la tua presentazione in tre parti: passato, presente e futuro (frasi qui sotto).'
          - '**Presentazione orale:** al massimo 2 minuti. Dopo ogni presentazione, un compagno fa una domanda.'
        example: |-
          *Quando ho iniziato a lavorare, la mia prima capa mi ha insegnato a organizzarmi. Adesso penso che l'organizzazione sia la cosa più importante. In futuro vorrei aiutare i nuovi colleghi come lei ha aiutato me.*
      - id: act2-frames
        type: discussionQuestions
        title: Struttura guidata
        items:
          - question: Passato
            frame: Quando ho iniziato ___.
          - question: Presente
            frame: Adesso penso che ___.
          - question: Futuro
            frame: In futuro vorrei ___.
      - id: act3
        type: classActivity
        title: 'Attività 3: Il lavoro ideale'
        skills: [Periodo ipotetico]
        steps:
          - "**Spiegazione grammaticale:** l'insegnante presenta la struttura (qui sotto)."
          - "**Esempi guidati:** l'insegnante scrive le frasi alla lavagna. Completale."
          - '**Lavoro a coppie:** discutete le situazioni (qui sotto) con **una frase completa**. Dopo ogni risposta, il partner fa una domanda: *Perché? Da quanto tempo pensi così? Cosa cambierebbe nella tua vita?*'
          - "**Condivisione con la classe:** ogni studente dice **una frase**. Chi è d'accordo alza la mano. L'insegnante può chiedere: *Chi pensa la stessa cosa? Perché?*"
        example: |-
          *Se avessi il lavoro ideale, lavorerei in un ambiente creativo.*
          *Se lavorassi meno ore, passerei più tempo con la mia famiglia.*
      - id: act3-grammar
        type: callout
        tone: info
        title: 'Periodo ipotetico: se + congiuntivo imperfetto, condizionale'
        text: |-
          *Se avessi più tempo, studierei di più.*
          *Se guadagnassi di più, viaggerei molto.*
          *Se lavorassi meno ore, farei più sport.*
          *Se il mio capo fosse più organizzato, lavorerei meglio.*
          **Errore comune:** ❌ *Se ho più tempo, studierei.* ✅ *Se avessi più tempo, studierei.*
      - id: act3-guided
        type: discussionQuestions
        title: Esempi guidati
        items:
          - question: Se avessi il lavoro ideale, ___.
          - question: Se guadagnassi il doppio dello stipendio, ___.
          - question: Se lavorassi solo quattro giorni alla settimana, ___.
          - question: Se potessi lavorare da qualsiasi paese, ___.
      - id: act3-pairs
        type: discussionQuestions
        title: Situazioni per il lavoro a coppie
        items:
          - question: Se avessi il lavoro ideale…
          - question: Se guadagnassi molto di più…
          - question: Se lavorassi meno ore…
          - question: Se avessi un capo perfetto…
          - question: Se potessi cambiare carriera domani…
      - id: act4
        type: classActivity
        title: 'Attività 4: Speed networking'
        skills: [Narrazione professionale]
        steps:
          - '**Preparazione (2 minuti):** prepara una breve presentazione (circa 30 secondi): nome, professione, cosa fai abitualmente nel lavoro, un obiettivo per il futuro.'
          - '**Primo giro (4 minuti):** a coppie, ognuno presenta brevemente il proprio lavoro. Dopo la presentazione, il partner fa **una domanda**: *Perché hai scelto questo lavoro? Da quanto tempo fai questo lavoro? Ti piace il tuo lavoro? Qual è la parte più interessante del tuo lavoro?*'
          - "**Cambio coppie:** cambia partner e ripeti l'attività. L'obiettivo è parlare con **2 o 3 persone diverse**."
          - '**Condivisione scritta:** completa la frase qui sotto.'
        example: |-
          *Mi chiamo Luca. Lavoro come designer. Mi occupo di progetti digitali. In futuro vorrei lavorare all'estero.*
      - id: act4-frame
        type: sentenceFrame
        prompt: Struttura suggerita per la presentazione
        frame: Mi chiamo ___. Lavoro come ___. Mi occupo di ___. In futuro vorrei ___.
      - id: act4-share
        type: sentenceFrame
        prompt: Condivisione scritta
        frame: La persona più interessante è stata ___ perché ___.
        example: La persona più interessante è stata Marta perché lavora con i videogiochi. / La persona più interessante è stata Paolo perché vuole aprire una scuola.
      - id: act5
        type: classActivity
        title: 'Attività 5: Linea del tempo professionale'
        skills: [Narrazione professionale]
        steps:
          - '**Preparazione (3 minuti):** scrivi brevi appunti su tre momenti della tua vita professionale: passato (il primo lavoro, cosa volevi fare quando eri più giovane), presente (cosa fai adesso, dove lavori o studi) e futuro (cosa vuoi fare, i tuoi obiettivi).'
          - '**Presentazione:** presenta la tua linea del tempo professionale (al massimo 2 minuti): *Prima… Adesso… In futuro…*'
          - '**Domande dei compagni:** uno o due studenti fanno una domanda: *Perché hai scelto questo lavoro? Ti piace il tuo lavoro attuale? Quando vuoi cambiare lavoro? Cosa ti piacerebbe fare in futuro?*'
          - "**Discussione finale:** l'insegnante chiede alla classe: *Cosa avete in comune? Quali lavori sono più popolari nella classe? È stato difficile parlare per due minuti? Qual è il lavoro più interessante che avete sentito?*"
        example: |-
          *Il mio primo lavoro è stato in un bar. Adesso lavoro in un ufficio. In futuro vorrei cambiare lavoro e lavorare nel turismo.*
      - id: act5-notes
        type: discussionQuestions
        title: I miei appunti
        items:
          - question: 'Passato: il mio primo lavoro e cosa volevo fare quando ero più giovane'
            frame: Il mio primo lavoro è stato ___. Quando ero giovane volevo diventare ___.
          - question: 'Presente: cosa faccio adesso, dove lavoro o studio'
            frame: Adesso lavoro come ___. / Studio ___.
          - question: 'Futuro: cosa voglio fare e i miei obiettivi professionali'
            frame: In futuro vorrei ___.
      - id: act6
        type: classActivity
        title: 'Attività 6: Dibattito sulla settimana lavorativa di quattro giorni'
        skills: [Periodo ipotetico]
        steps:
          - '**Divisione della classe:** due gruppi. **Gruppo A:** la settimana lavorativa di 4 giorni è migliore. **Gruppo B:** la settimana lavorativa di 5 giorni è migliore.'
          - '**Preparazione degli argomenti (5 minuti):** ogni gruppo prepara **tre argomenti** con il periodo ipotetico (se + congiuntivo imperfetto, condizionale).'
          - "**Dibattito:** un gruppo presenta un argomento alla volta; l'altro gruppo risponde con un altro argomento. Il dibattito continua alternando i gruppi."
          - "**Opinione finale:** l'insegnante chiede: *Chi preferisce lavorare 4 giorni alla settimana? E 5 giorni?* Ognuno risponde con **una frase con «se»**."
        example: |-
          *Gruppo A: Se lavorassimo quattro giorni, avremmo più tempo per la famiglia.*
          *Opinione finale: Se lavorassi quattro giorni, sarei più felice. / Se lavorassi cinque giorni, guadagnerei di più.*
      - id: act6-examples
        type: table
        caption: Esempi di argomenti
        header: [Gruppo A (4 giorni), Gruppo B (5 giorni)]
        rows:
          - [
              'Se lavorassimo quattro giorni, avremmo più tempo libero.',
              'Se lavorassimo solo quattro giorni, le aziende perderebbero soldi.',
            ]
          - [
              'Se lavorassimo meno giorni, saremmo più felici.',
              'Se lavorassimo meno giorni, sarebbe difficile finire tutto il lavoro.',
            ]
          - [
              "Se riducessimo l'orario di lavoro, saremmo più produttivi.",
              'Se le aziende lavorassero solo quattro giorni, i clienti avrebbero problemi.',
            ]
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Scegli 2 o 3 attività in base al tempo disponibile e al profilo del gruppo: non è
          necessario svolgere tutte le attività nella stessa lezione. Due abilità in questo
          ciclo: **Narrazione professionale** (passato, presente, futuro; Attività 1, 2, 4 e
          5) e **Periodo ipotetico** (Attività 3 e 6, anche per esprimere opinioni).
      - id: n-links
        anchor: null
        text: >-
          La presentazione della lezione (gamma.app) non è inclusa nella piattaforma (i link
          alle presentazioni non sono permessi); usala dal tuo materiale se vuoi.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: Scrivi il modello alla lavagna. Gli studenti si presentano brevemente.
      - id: n-act3
        anchor: act3-guided
        text: >-
          Esempi possibili: Se avessi il lavoro ideale, lavorerei viaggiando. Se guadagnassi
          il doppio dello stipendio, comprerei una casa. Se lavorassi solo quattro giorni
          alla settimana, riposerei di più. Se potessi lavorare da qualsiasi paese, vivrei in
          Italia.
      - id: n-act4
        anchor: act4
        minutes: 6
        text: >-
          Preparazione: 2 minuti. Primo giro: 4 minuti, poi uno o due cambi di coppia. Alla
          fine chiedi ad alcuni studenti di leggere la loro frase alla classe.
      - id: n-act5
        anchor: act5
        text: Preparazione 3 minuti; ogni presentazione dura al massimo 2 minuti.
      - id: n-act6
        anchor: act6
        text: >-
          Preparazione: 5 minuti. Controlla che ogni argomento usi se + congiuntivo
          imperfetto (*lavorassimo, riducessimo*) e il condizionale (*avremmo, saremmo*).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: carriera-e-sviluppo-personale-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: learned
        type: text
        text: 'Questa lezione lavora su quattro punti grammaticali che ci permettono di parlare della nostra **vita professionale**, raccontare esperienze e discutere situazioni immaginarie.'
      - id: rules-narrazione
        type: ruleSummary
        skill: Narrazione professionale
        rules:
          - text: 'Il **passato prossimo** si usa per le **azioni concluse** nel passato. Struttura: **avere / essere (presente) + participio passato**.'
            examples:
              - Ho iniziato a lavorare nel 2018.
              - Ho lavorato in un ristorante per due anni.
              - "Ho cambiato lavoro l'anno scorso."
              - Sono diventato manager nel 2022.
          - text: "L'**imperfetto** si usa per **descrivere situazioni** nel passato, abitudini o il contesto."
            examples:
              - Quando ero giovane volevo diventare medico.
              - Quando lavoravo in ufficio, avevo più tempo libero.
              - Prima lavoravo molte ore.
          - text: "Spesso **imperfetto** (il contesto) e **passato prossimo** (l'azione conclusa) si usano nella stessa frase."
            examples:
              - Quando lavoravo in un bar, ho imparato a parlare con i clienti.
              - "Quando studiavo all'università, ho fatto uno stage."
          - text: 'Il **presente indicativo** si usa per parlare della vita professionale attuale.'
            examples:
              - Lavoro come insegnante.
              - "Studio economia all'università."
              - Mi occupo di marketing digitale.
              - "Lavoro in un'azienda internazionale."
          - text: 'Il **futuro semplice** si usa per parlare di **progetti o previsioni**.'
            examples:
              - "Cambierò lavoro l'anno prossimo."
              - Aprirò una mia azienda.
              - "Lavorerò all'estero."
          - text: '**Vorrei + infinito** si usa per esprimere **desideri o obiettivi personali**. È molto comune nel linguaggio professionale.'
            examples:
              - "Vorrei lavorare all'estero."
              - Vorrei cambiare settore.
              - Vorrei aprire una scuola.
      - id: rules-ipotetico
        type: ruleSummary
        skill: Periodo ipotetico
        rules:
          - text: 'Il **periodo ipotetico di secondo tipo** (della possibilità) si usa per parlare di situazioni **immaginarie o poco probabili**. Struttura: **se + congiuntivo imperfetto, condizionale presente**.'
            examples:
              - Se avessi più tempo, studierei di più.
              - Se guadagnassi di più, viaggerei molto.
              - Se lavorassi meno ore, sarei più felice.
              - Se il mio capo fosse più organizzato, lavorerei meglio.
          - text: '**Errore comune:** in questo tipo di frase dopo **se** non si usa il presente (e nemmeno il condizionale).'
            examples:
              - 'Se ho più tempo, studierei. ❌'
              - 'Se avessi più tempo, studierei. ✔️'
      - id: ipotetico-table
        type: table
        caption: Congiuntivo imperfetto e condizionale presente
        header:
          [
            Persona,
            lavorare (congiuntivo imperfetto),
            essere (congiuntivo imperfetto),
            lavorare (condizionale),
            essere (condizionale),
          ]
        rows:
          - [io, lavorassi, fossi, lavorerei, sarei]
          - [tu, lavorassi, fossi, lavoreresti, saresti]
          - [lui / lei, lavorasse, fosse, lavorerebbe, sarebbe]
          - [noi, lavorassimo, fossimo, lavoreremmo, saremmo]
          - [voi, lavoraste, foste, lavorereste, sareste]
          - [loro, lavorassero, fossero, lavorerebbero, sarebbero]
      - id: language
        type: callout
        tone: info
        title: Linguaggio per parlare della carriera
        text: |-
          **Presentarsi professionalmente:** *Mi chiamo Luca. Lavoro come designer. Mi occupo di progetti digitali.*
          **Parlare delle competenze:** *Ho sviluppato buone capacità di comunicazione. Ho imparato a lavorare in team. Ho migliorato le mie competenze tecniche.*
          **Parlare degli obiettivi:** *In futuro vorrei cambiare lavoro. Vorrei lavorare in un ambiente internazionale. Il mio obiettivo è aprire una mia azienda.*
      - id: key-table
        type: table
        caption: Strutture chiave della lezione
        header: [Funzione, Struttura, Esempio]
        rows:
          - [Raccontare il passato, Passato prossimo, Ho iniziato a lavorare nel 2018.]
          - [Descrivere il passato, Imperfetto, Quando lavoravo in ufficio…]
          - [Parlare del presente, Presente, Lavoro come designer.]
          - [Parlare dei progetti, Futuro / vorrei + infinito, "Vorrei lavorare all'estero."]
          - [
              Situazioni immaginarie,
              'se + congiuntivo imperfetto, condizionale',
              'Se lavorassi meno, viaggerei.',
            ]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le regole con il gruppo e chiedi a ogni studente una frase nuova per ogni struttura, sulla propria carriera.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: carriera-e-sviluppo-personale-compiti
    title: Compiti con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti con Mori
      - id: goal
        type: text
        text: "Obiettivo: praticare la **narrazione professionale** con il passato prossimo, l'imperfetto, il presente, il futuro e il periodo ipotetico. Parla della tua carriera e dei tuoi progetti professionali."
      - id: how
        type: text
        text: Apri la chat con Mori, copia il messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
      - id: mori
        type: aiTutorPrompt
        title: La mia vita professionale
        message: |-
          Ciao Mori!
          Voglio parlare della mia vita professionale.
          Fammi domande su: il mio primo lavoro, cosa facevo prima, cosa faccio adesso, cosa vorrei fare in futuro.
          Fammi usare queste strutture: passato prossimo, imperfetto, presente, futuro.
          Fammi usare anche il periodo ipotetico, per esempio: Se avessi il lavoro ideale, lavorerei ___.
          Correggi i miei errori e fammi altre domande per continuare la conversazione.
      - id: frames
        type: callout
        tone: info
        title: Struttura suggerita
        text: |-
          **Passato:** *Il mio primo lavoro è stato ___. Quando ero giovane volevo ___. Ho lavorato in ___ per ___ anni.*
          **Presente:** *Adesso lavoro come ___. Mi occupo di ___. Mi piace / Non mi piace il mio lavoro perché ___.*
          **Futuro:** *In futuro vorrei ___. Il mio obiettivo è ___. Tra cinque anni penso che ___.*
          **Situazioni immaginarie:** *Se avessi il lavoro ideale, ___. Se guadagnassi di più, ___. Se lavorassi meno ore, ___.*
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**

