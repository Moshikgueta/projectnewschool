activities:
  - slug: carriera-e-sviluppo-personale-narrazione
    title: 'Narrazione professionale: prima, adesso, in futuro'
    minutes: 8
    items:
      - id: sono-diventato
        type: multipleChoice
        prompt: Nel 2022 ___ manager.
        options:
          - { text: sono diventato, correct: true }
          - { text: ho diventato, feedback: 'Il verbo *diventare* usa *essere*: *sono diventato*.' }
          - {
              text: diventavo,
              feedback: "*Nel 2022* indica un'azione conclusa in un momento preciso: usiamo il passato prossimo, *sono diventato*.",
            }
      - id: volevo
        type: multipleChoice
        prompt: Quando ero giovane ___ diventare medico.
        options:
          - { text: volevo, correct: true }
          - {
              text: ho voluto,
              feedback: "*Quando ero giovane* descrive una situazione nel passato: usiamo l'imperfetto, *volevo*.",
            }
          - {
              text: voglio,
              feedback: "*Voglio* è presente. Parliamo di quando eri giovane: usiamo l'imperfetto, *volevo*.",
            }
      - id: lavoravo
        type: fillBlank
        prompt: "Completa con l'imperfetto di *lavorare* (io)."
        text: Quando ___ in un bar, ho imparato a parlare con i clienti.
        blanks: [[lavoravo, io lavoravo]]
      - id: adesso-lavoro
        type: fillBlank
        prompt: Completa con il presente di *lavorare* (io).
        text: Adesso ___ come insegnante.
        blanks: [[lavoro, io lavoro]]
      - id: vorrei
        type: multipleChoice
        prompt: In futuro ___ aprire una scuola di lingue.
        options:
          - { text: vorrei, correct: true }
          - {
              text: volevo,
              feedback: '*Volevo* è imperfetto (passato). Per un desiderio per il futuro usiamo *vorrei* + infinito.',
            }
          - {
              text: vorrei di,
              feedback: "Dopo *vorrei* viene subito l'infinito, senza *di*: *vorrei aprire*.",
            }
      - id: futuro
        type: matching
        prompt: Unisci ogni verbo alla sua forma di *io* al futuro semplice.
        pairs:
          - [cambiare, cambierò]
          - [aprire, aprirò]
          - [lavorare, lavorerò]
          - [diventare, diventerò]
          - [essere, sarò]
      - id: contesto
        type: trueFalse
        prompt: "Nella frase *Quando studiavo all'università, ho fatto uno stage* l'imperfetto descrive il contesto e il passato prossimo l'azione conclusa."
        answer: true
        feedback:
          correct: "Giusto! *Studiavo* = il contesto (imperfetto); *ho fatto* = l'azione conclusa (passato prossimo)."
          incorrect: "*Studiavo* descrive il contesto (imperfetto); *ho fatto uno stage* è l'azione conclusa (passato prossimo)."
      - id: ordina-lavoro
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: "Ho cambiato lavoro l'anno scorso."

  - slug: carriera-e-sviluppo-personale-ipotetico
    title: 'Periodo ipotetico: se avessi il lavoro ideale…'
    minutes: 8
    items:
      - id: avessi
        type: multipleChoice
        prompt: Se ___ più tempo, studierei di più.
        options:
          - { text: avessi, correct: true }
          - {
              text: ho,
              feedback: 'Con il condizionale *studierei*, dopo *se* non usiamo il presente ma il congiuntivo imperfetto: *avessi*.',
            }
          - {
              text: avrei,
              feedback: 'Dopo *se* non usiamo il condizionale. Usiamo il congiuntivo imperfetto: *avessi*.',
            }
      - id: farei
        type: multipleChoice
        prompt: Se lavorassi meno ore, ___ più sport.
        options:
          - { text: farei, correct: true }
          - {
              text: faccio,
              feedback: 'Con *se* + congiuntivo imperfetto (*lavorassi*) la conseguenza va al condizionale: *farei*.',
            }
          - {
              text: farò,
              feedback: '*Farò* è futuro. In una situazione immaginaria usiamo il condizionale: *farei*.',
            }
      - id: guadagnassi
        type: fillBlank
        prompt: Completa con il congiuntivo imperfetto di *guadagnare* (io).
        text: Se ___ di più, viaggerei molto.
        blanks: [[guadagnassi, io guadagnassi]]
      - id: fosse
        type: fillBlank
        prompt: Completa con il congiuntivo imperfetto di *essere*.
        text: Se il mio capo ___ più organizzato, lavorerei meglio.
        blanks: [[fosse]]
      - id: avremmo
        type: fillBlank
        prompt: Completa con il condizionale di *avere* (noi).
        text: Se lavorassimo quattro giorni, ___ più tempo libero.
        blanks: [[avremmo, noi avremmo]]
      - id: condizionale
        type: matching
        prompt: Unisci ogni verbo alla sua forma di *io* al condizionale presente.
        pairs:
          - [studiare, studierei]
          - [viaggiare, viaggerei]
          - [fare, farei]
          - [essere, sarei]
          - [vivere, vivrei]
      - id: se-ho
        type: trueFalse
        prompt: 'La frase *Se ho più tempo, studierei.* è corretta.'
        answer: false
        feedback:
          correct: 'Giusto! La forma corretta è: *Se avessi più tempo, studierei.*'
          incorrect: 'Con il condizionale *studierei* serve il congiuntivo imperfetto dopo *se*: *Se avessi più tempo, studierei.*'
      - id: ordina-capo
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Se avessi un capo perfetto, lavorerei meglio.
