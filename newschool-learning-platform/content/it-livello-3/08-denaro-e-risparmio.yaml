# Cycle "Denaro e risparmio", converted from the Italian level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-3
slug: denaro-e-risparmio
title: Denaro e risparmio
goal: Parlare di denaro con la forma passiva e con il periodo ipotetico.
position: 8
status: in_review

review:
  - >-
    The two workbook exercises ("Forma passiva" and "Periodo ipotetico") are NEW: the
    notebook has no self-correcting exercises. They were written from the cycle's summary
    rules, the activity examples and its vocabulary. Please check level, wording and every
    right answer before students see them.
  - >-
    Grammar terms translated from the English notebook: "Zero / First / Second
    Conditional" are not Italian categories. They are now "periodo ipotetico della realtà"
    (verità generale: se + presente, presente; futuro possibile: se + presente / futuro,
    futuro) and "periodo ipotetico della possibilità" (se + congiuntivo imperfetto,
    condizionale presente). The summary said "Se + imperfetto, condizionale": WRONG, the
    verb after "se" is the congiuntivo imperfetto (avessi, vincessi), not the indicativo
    imperfetto (avevo). Fixed and flagged. The class activities keep the three groups of
    questions under the new Italian names. Please confirm.
  - >-
    COPYRIGHT: Activity 3 introduces the five tips as a text "di Daniel Roberts,
    consulente finanziario" with a quote and a line about him. The name and the quote were
    left out (it looks taken from a real advisor's article) and replaced with a neutral
    line ("Cinque consigli di un consulente finanziario"). The five short tips are generic
    advice and were kept. Please check.
  - >-
    Corrections: Activity 1 title "Si avessi soldi" (Spanish "si") → "Se avessi soldi";
    Activity 4 "Come possono essere cambiati le abitudini di consumo?" → "cambiate" (agrees
    with "abitudini"); Mori message "Hi Mori!" → "Ciao Mori!"; broken bold marks
    ("**\*\*…\*\***") in the warm-up removed.
  - >-
    Summary (in Hebrew in the source) is now in Italian with the Hebrew translations of the
    examples. ADDED (not in the source, please confirm): the passive with "venire" in simple
    tenses, participle agreement with the subject, the passive in the passato prossimo
    (sono stati rubati), the "si passivante" (used in Activity 4: "Dove si spreca più
    denaro?"), a congiuntivo imperfetto table and a periodo ipotetico table. The source's
    "שימושים מרכזיים" and "טיפים להצלחה" are kept in short form.
  - >-
    The "classic" homework (completion, passive transformation, writing, error correction)
    is kept in the Compiti section as answer boxes, with an answer key in a teacher note.
    Part 1 items 4 and 5 accept two answers (realtà or possibilità); Part 4 sentence 2
    ("Se risparmi, avrai più sicurezza") is already correct: the note says so. Please
    check.
  - >-
    Left out: the gamma.app slides link (not allowed; mentioned in a teacher note), the
    "Data / Partecipanti" lines and all "Risposte: Studente 1/2/3" lines (the platform has
    answer boxes). The Quizlet link is kept without "?new". The cycle has no timings in the
    source; none were added.
  - >-
    The intro had no example and the warm-up had examples but no frames: the examples are
    now the frames' model (short frames added). Activity 2 situations were turned into
    discussion questions with a passive frame.
  - >-
    Vocabulary: "Spendere – לבזבז" → "להוציא (כסף) / לבזבז"; "Ridurre i costi – לצמצם
    הוצאות" → "לצמצם עלויות"; "Contabile – רואה חשבון" → "מנהל חשבונות" (a רואה חשבון is
    a "commercialista"); "Interesse" → "Interessi" (plural, as used for bank interest).
    Please check.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: denaro-e-risparmio-classe
    title: 'In classe: Denaro e risparmio'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Denaro e risparmio
      - id: skills
        type: cycleOverview
        skills:
          - name: Forma passiva
            description: 'Essere / venire + participio passato, anche con i verbi modali: *i costi possono essere ridotti, più soldi dovrebbero essere risparmiati*'
          - name: Periodo ipotetico
            description: 'Verità generali, possibilità reali e situazioni immaginarie: *se risparmi, hai più sicurezza; se avessi più soldi, viaggerei di più*'
      - id: quizlet
        type: externalLink
        label: Denaro e risparmio su Quizlet
        url: https://quizlet.com/br/1170748206/denaro-e-risparmio-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduzione
      - id: intro
        type: sentenceFrame
        frame: Io sono ___. Penso che la salute finanziaria sia importante perché ___.
        example: Io sono Dana. Penso che la salute finanziaria sia importante perché ci dà più tranquillità.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup-hint
        type: callout
        tone: info
        text: Rispondi con **frasi complete**. Prova a usare la **forma passiva** e il **periodo ipotetico**, come negli esempi.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Quanti soldi pensi che i giovani dovrebbero risparmiare ogni mese?
            frame: Penso che una parte dello stipendio dovrebbe essere risparmiata ogni mese.
          - question: Pensi che il risparmio sia insegnato bene a scuola o dovrebbe essere insegnato di più?
            frame: Secondo me, l'educazione finanziaria dovrebbe essere insegnata di più.
          - question: Cosa faresti se il tuo stipendio fosse ridotto del 20%?
            frame: Se il mio stipendio fosse ridotto, spenderei meno.
          - question: Cosa dovrebbe essere fatto se i risparmi di qualcuno fossero persi per un errore della banca?
            frame: I soldi dovrebbero essere restituiti immediatamente.
          - question: Come possono essere imparate buone abitudini di risparmio dai giovani?
            frame: Buone abitudini possono essere insegnate a scuola e in famiglia.
          - question: Se ricevessi un milione di euro, come lo spenderesti?
            frame: Se ricevessi un milione, lo investirei.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: Se avessi soldi'
        skills: [Periodo ipotetico]
        steps:
          - "**Lavoro a coppie:** discutete e rispondete a **4 domande** (le sceglie l'insegnante in base al livello)."
          - '**Condivisione in classe:** parlate delle risposte. Riferisci che cosa ha detto il tuo compagno usando il discorso indiretto.'
        example: |-
          *Se risparmi soldi ogni mese, hai più sicurezza.*
          *Se ricevo un bonus quest'anno, lo userò per un viaggio.*
          *Se vincessi 10.000 euro domani, li investirei.*
          *Il mio compagno ha detto che, se vincesse 10.000 euro, li investirebbe.*
      - id: act1-realta
        type: discussionQuestions
        title: 'Verità generali (se + presente, presente)'
        items:
          - question: Se risparmi soldi ogni mese, cosa succede?
            frame: Se risparmio soldi ogni mese, ___.
          - question: Se le persone non pianificano le loro spese, cosa succede di solito ai loro soldi?
            frame: Se le persone non pianificano le spese, ___.
          - question: Se qualcuno spende più di quello che guadagna, quali problemi ha?
            frame: Se qualcuno spende più di quello che guadagna, ___.
          - question: Se compri sempre la cosa più economica, come influisce sul tuo stile di vita?
            frame: Se compro sempre la cosa più economica, ___.
      - id: act1-futuro
        type: discussionQuestions
        title: 'Possibilità reali nel futuro (se + presente, futuro)'
        items:
          - question: "Se ricevi un bonus quest'anno, come lo userai?"
            frame: "Se ricevo un bonus quest'anno, lo userò per ___."
          - question: Se trovi un appartamento più economico, come spenderai i soldi extra?
            frame: Se trovo un appartamento più economico, ___.
          - question: Se apri un conto di risparmio il mese prossimo, quanto risparmierai?
            frame: Se apro un conto di risparmio, risparmierò ___.
          - question: "Se le tue spese aumentano l'anno prossimo, cosa taglierai per primo?"
            frame: Se le mie spese aumentano, taglierò ___.
      - id: act1-possibilita
        type: discussionQuestions
        title: 'Situazioni immaginarie (se + congiuntivo imperfetto, condizionale)'
        items:
          - question: Se vincessi 10.000 euro domani, cosa faresti?
            frame: Se vincessi 10.000 euro, ___.
          - question: Se potessi vivere in un posto più economico, dove andresti?
            frame: Se potessi vivere in un posto più economico, andrei ___.
          - question: Se dovessi risparmiare il 50% del tuo stipendio, cosa smetteresti di comprare?
            frame: Se dovessi risparmiare il 50% del mio stipendio, smetterei di comprare ___.
          - question: Se potessi cambiare una cosa nel modo in cui le persone risparmiano, cosa cambieresti?
            frame: Se potessi, cambierei ___.
      - id: act2
        type: classActivity
        title: 'Attività 2: Cosa dovrebbe essere fatto?'
        skills: [Forma passiva]
        steps:
          - "**Risposte individuali:** l'insegnante presenta le situazioni qui sotto. Rispondi con **una frase breve**, usando la **forma passiva**."
          - "**Condivisione:** leggi la tua risposta. L'insegnante controlla la forma passiva e corregge se necessario."
          - '**Discussione in gruppo:** in piccoli gruppi scegliete una situazione e sviluppate una soluzione più completa. Dovete aggiungere almeno 2 idee, usare la forma passiva e spiegare perché la soluzione è utile.'
        example: |-
          *Un bonus dovrebbe essere risparmiato o investito con attenzione.*
          *Più educazione finanziaria dovrebbe essere insegnata nelle scuole perché i giovani non imparano a risparmiare abbastanza.*
      - id: act2-situations
        type: discussionQuestions
        title: Situazioni
        items:
          - question: Un grande bonus viene ricevuto al lavoro. Cosa dovrebbe essere fatto?
            frame: Il bonus dovrebbe essere ___.
          - question: I soldi di un amico sono stati rubati dal conto bancario. Cosa dovrebbe essere fatto?
            frame: La banca dovrebbe essere ___. / I soldi dovrebbero essere ___.
          - question: Troppi soldi vengono spesi per cose non necessarie. Cosa potrebbe essere cambiato?
            frame: ___ potrebbe essere cambiato / cambiata.
          - question: Pochi soldi vengono risparmiati dai giovani oggi. Cosa dovrebbe essere fatto per migliorare la situazione?
            frame: ___ dovrebbe essere insegnato / insegnata ___.
      - id: act3
        type: classActivity
        title: 'Attività 3: Consigli per risparmiare'
        skills: [Periodo ipotetico]
        steps:
          - '**Lettura di gruppo:** tutta la classe legge insieme i cinque consigli qui sotto.'
          - "**Lavoro a coppie:** ogni coppia riceve un consiglio e risponde alle domande (le sceglie l'insegnante in base al livello). Se conoscete i tre tipi di frase ipotetica, rispondete almeno a una domanda di ogni tipo."
          - '**Condivisione in classe:** ogni coppia presenta le proprie risposte. Confrontate le idee e spiegate le vostre scelte con esempi personali.'
        example: |-
          *Se risparmio una parte dei soldi per prima, non li spendo per cose inutili.*
          *Se inizio a risparmiare questo mese, avrò un fondo di emergenza.*
          *Se potessi risparmiare metà del mio stipendio, comprerei una casa.*
      - id: act3-text
        type: callout
        tone: info
        title: Cinque consigli di un consulente finanziario
        text: |-
          1. **Risparmia prima di spendere.** Quando ricevi soldi, metti da parte una parte prima di spenderli. Anche una piccola quantità è utile.
          2. **Controlla dove vanno i tuoi soldi.** Scrivi tutte le tue spese per una settimana. Vedrai meglio dove puoi cambiare.
          3. **Fissa un obiettivo.** È più facile risparmiare quando hai un obiettivo, come un viaggio o un acquisto importante.
          4. **Spendi meno per piccole cose.** Piccole spese quotidiane possono diventare grandi nel tempo.
          5. **Inizia ora, non dopo.** Molte persone aspettano il momento giusto per iniziare, ma risparmiare è un'abitudine.
      - id: act3-q1
        type: discussionQuestions
        title: '1. Risparmia prima di spendere'
        items:
          - question: Se risparmi una parte dei tuoi soldi per prima, cosa succede?
          - question: Se inizi a risparmiare questo mese, come ti aiuterà?
          - question: Se potessi risparmiare metà del tuo stipendio, cosa faresti con quei soldi?
      - id: act3-q2
        type: discussionQuestions
        title: '2. Controlla dove vanno i tuoi soldi'
        items:
          - question: Se scrivi le tue spese, cosa noti?
          - question: Se controlli le tue spese questa settimana, cosa imparerai?
          - question: Se potessi vedere tutte le tue spese in un unico posto, come ti sentiresti?
      - id: act3-q3
        type: discussionQuestions
        title: '3. Fissa un obiettivo'
        items:
          - question: Se hai un obiettivo, risparmi più facilmente?
          - question: Se stabilisci un obiettivo questo mese, quanto risparmierai?
          - question: Se potessi scegliere qualsiasi obiettivo, quale sceglieresti?
      - id: act3-q4
        type: discussionQuestions
        title: '4. Spendi meno per piccole cose'
        items:
          - question: Se compri meno cose piccole, cosa succede ai tuoi risparmi?
          - question: Se smetti di comprare snack ogni giorno, quanto risparmierai questo mese?
          - question: Se potessi evitare una spesa ogni giorno, come cambierebbe la tua vita?
      - id: act3-q5
        type: discussionQuestions
        title: '5. Inizia ora, non dopo'
        items:
          - question: Se aspetti troppo per iniziare, cosa succede?
          - question: Se inizi a risparmiare oggi, cosa farai in futuro?
          - question: Se potessi darti un consiglio sul risparmio, cosa diresti?
      - id: act4
        type: classActivity
        title: 'Attività 4: Come si può risparmiare?'
        skills: [Forma passiva]
        steps:
          - '**Discussione in classe:** rispondi con esempi personali. Dove si spreca più denaro nella vita quotidiana? Quali abitudini potrebbero essere cambiate per risparmiare di più?'
          - '**Lavoro a coppie:** scegliete **3 temi** (qui sotto) e pensate a possibili soluzioni, usando la **forma passiva**.'
          - "**Presentazione:** ogni coppia presenta una soluzione alla classe. Un'altra coppia fa una domanda per approfondire la risposta."
        example: |-
          *L'acqua può essere risparmiata con docce più brevi.*
          *Lo spreco di cibo può essere ridotto se la spesa viene pianificata.*
      - id: act4-topics
        type: discussionQuestions
        title: Temi
        items:
          - question: "Come può essere risparmiata l'acqua in casa?"
            frame: "L'acqua può essere risparmiata ___."
          - question: Come può essere ridotto lo spreco di cibo?
            frame: Lo spreco di cibo può essere ridotto ___.
          - question: Come possono essere ridotti i costi quotidiani?
            frame: I costi quotidiani possono essere ridotti ___.
          - question: Come possono essere cambiate le abitudini di consumo?
            frame: Le abitudini di consumo possono essere cambiate ___.
          - question: Come può essere risparmiato denaro nei trasporti?
            frame: Il denaro può essere risparmiato ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Periodo ipotetico** (domande di riscaldamento,
          Attività 1 e 3) e **Forma passiva** (domande di riscaldamento, Attività 2 e 4). Il
          quaderno non indica i tempi: scegli le attività secondo il tempo disponibile.
      - id: n-links
        anchor: null
        text: >-
          La presentazione della lezione (gamma.app) non è inclusa nella piattaforma (i link
          alle presentazioni non sono permessi); usala dal tuo materiale se vuoi.
      - id: n-act1
        anchor: act1
        text: >-
          Scegli 4 domande in base al livello del gruppo: le verità generali sono le più
          facili, le situazioni immaginarie (congiuntivo imperfetto + condizionale) le più
          difficili. Nella condivisione gli studenti usano il discorso indiretto (*Ha detto
          che…*).
      - id: n-act3
        anchor: act3
        text: >-
          In ogni gruppo di domande, la prima è una verità generale (se + presente,
          presente), la seconda una possibilità reale nel futuro (se + presente, futuro) e la
          terza una situazione immaginaria (se + congiuntivo imperfetto, condizionale).
          Scegli le domande in base al livello.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: denaro-e-risparmio-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: rules-ipotetico
        type: ruleSummary
        skill: Periodo ipotetico
        rules:
          - text: 'Usiamo le **frasi ipotetiche** (con **se**) per parlare di situazioni reali, di possibilità nel futuro e di situazioni immaginarie.'
          - text: '**Verità generale** (fatti e abitudini): **se + presente, presente**.'
            examples: ['Se risparmi soldi, hai più sicurezza. (אם אתה חוסך כסף, יש לך יותר ביטחון)']
          - text: '**Possibilità reale nel futuro:** **se + presente** (o futuro), **futuro**.'
            examples:
              ['Se risparmi questo mese, avrai più soldi. (אם תחסוך החודש, יהיה לך יותר כסף)']
          - text: '**Situazione immaginaria** (non reale o poco probabile): **se + congiuntivo imperfetto, condizionale presente**. Attenzione: dopo *se* non usiamo il condizionale.'
            examples:
              - Se avessi più soldi, viaggerei di più. (אם היה לי יותר כסף, הייתי מטייל יותר)
              - Se vincessi 10.000 euro, investirei i soldi. (אם הייתי זוכה, הייתי משקיע)
              - 'Se io ho più soldi, viaggerei di più. ❌ → Se io avessi più soldi, viaggerei di più. ✔️'
      - id: ipotetico-table
        type: table
        caption: Periodo ipotetico
        header: [Tipo, Struttura, Esempio]
        rows:
          - [Verità generale, 'se + presente, presente', 'Se risparmi soldi, hai più sicurezza.']
          - [
              Possibilità reale nel futuro,
              'se + presente, futuro',
              'Se risparmi questo mese, avrai più soldi.',
            ]
          - [
              Situazione immaginaria,
              'se + congiuntivo imperfetto, condizionale',
              'Se avessi più soldi, viaggerei di più.',
            ]
      - id: congiuntivo-table
        type: table
        caption: Congiuntivo imperfetto e condizionale presente
        header: [Persona, avere, potere, risparmiare (condizionale), avere (condizionale)]
        rows:
          - [io, avessi, potessi, risparmierei, avrei]
          - [tu, avessi, potessi, risparmieresti, avresti]
          - [lui / lei, avesse, potesse, risparmierebbe, avrebbe]
          - [noi, avessimo, potessimo, risparmieremmo, avremmo]
          - [voi, aveste, poteste, risparmiereste, avreste]
          - [loro, avessero, potessero, risparmierebbero, avrebbero]
      - id: rules-passiva
        type: ruleSummary
        skill: Forma passiva
        rules:
          - text: "Usiamo la **forma passiva** quando **l'azione** è più importante di chi la fa. Struttura: **essere + participio passato**. Il participio si accorda con il soggetto."
            examples:
              - I soldi sono risparmiati. (הכסף נחסך)
              - "L'acqua è risparmiata."
          - text: "Nei tempi semplici possiamo usare anche **venire** al posto di *essere*. Chi fa l'azione si introduce con **da**."
            examples:
              - Troppi soldi vengono spesi per cose non necessarie.
              - Pochi soldi vengono risparmiati dai giovani.
          - text: 'Al **passato prossimo**: **essere** (passato prossimo) **+ stato / stata / stati / state + participio**.'
            examples: [I soldi di un amico sono stati rubati dal conto bancario.]
          - text: 'Con i **verbi modali**: **modale + essere + participio passato**.'
            examples:
              - I costi possono essere ridotti. (אפשר לצמצם עלויות)
              - Più soldi dovrebbero essere risparmiati. (צריך לחסוך יותר כסף)
              - Il denaro può essere risparmiato. (אפשר לחסוך כסף)
          - text: 'Anche il **si passivante** ha un senso passivo: **si + verbo alla 3ª persona** (singolare o plurale, come il soggetto).'
            examples:
              [Dove si spreca più denaro?, Si risparmiano molti soldi con una buona pianificazione.]
      - id: passiva-table
        type: table
        caption: Forma passiva
        header: [Forma attiva, Forma passiva]
        rows:
          - [Le persone risparmiano più soldi., Più soldi sono / vengono risparmiati dalle persone.]
          - [Le famiglie riducono i costi., I costi sono / vengono ridotti dalle famiglie.]
          - [Qualcuno ha rubato i soldi., I soldi sono stati rubati.]
          - [Possiamo ridurre i costi., I costi possono essere ridotti.]
      - id: uses
        type: callout
        tone: info
        title: Usi principali della lezione
        text: |-
          **Parlare di soldi:** *risparmiare, spendere, investire*.
          **Dare consigli:** *Dovresti risparmiare di più.*
          **Situazioni immaginarie:** *Se vincessi 10.000 euro, investirei i soldi.*
          **Forma passiva:** *Il denaro può essere risparmiato.*
      - id: tips
        type: callout
        tone: tip
        title: Consigli per riuscire
        text: |-
          Usa le frasi ipotetiche per sviluppare le tue risposte.
          Usa la forma passiva per sembrare più naturale.
          Prova a dare esempi personali.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le regole con il gruppo e chiedi a ogni studente un esempio nuovo per ogni tipo di frase ipotetica e per la forma passiva.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: denaro-e-risparmio-compiti
    title: Compiti
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti
      - id: classic-title
        type: heading
        level: 3
        text: Esercizi scritti
      - id: part1
        type: discussionQuestions
        title: '1. Frasi ipotetiche: completa le frasi con la forma corretta'
        items:
          - question: Se risparmi soldi, ___ (avere) più sicurezza.
          - question: Se risparmi questo mese, ___ (avere) più soldi.
          - question: Se io ___ (avere) più tempo, ___ (risparmiare) di più.
          - question: Se lui ___ (spendere) meno, ___ (avere) più soldi.
          - question: Se noi ___ (vivere) con meno spese, ___ (risparmiare) di più.
      - id: part2
        type: discussionQuestions
        title: '2. Forma passiva: trasforma le frasi'
        items:
          - question: Le persone risparmiano più soldi.
            frame: → Più soldi ___.
          - question: I giovani spendono troppo denaro.
            frame: → Troppo denaro ___.
          - question: Molte persone non controllano le spese.
            frame: → Le spese ___.
          - question: Le famiglie riducono i costi.
            frame: → I costi ___.
      - id: part3-hint
        type: callout
        tone: info
        title: '3. Scrittura: Come posso risparmiare più denaro'
        text: |-
          Scrivi 6–8 frasi. Devi usare:
          - 2 frasi ipotetiche (almeno una con *se* + congiuntivo imperfetto)
          - 2 frasi alla forma passiva
          - un esempio personale
      - id: part3
        type: reflection
        prompt: Come posso risparmiare più denaro
      - id: part4
        type: discussionQuestions
        title: '4. Correggi le frasi (attenzione: una frase è già corretta)'
        items:
          - question: Se io ho più soldi, viaggerei di più.
          - question: Se risparmi, avrai più sicurezza.
          - question: I soldi risparmia ogni mese.
          - question: Più soldi devono risparmiare.
      - id: mori-title
        type: heading
        level: 3
        text: Compiti con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia un messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
      - id: mori-1
        type: aiTutorPrompt
        title: '1. Inizia la conversazione'
        message: Ciao Mori! Voglio praticare le frasi ipotetiche e la forma passiva. Fammi domande sul denaro, sul risparmio e sulle abitudini finanziarie.
      - id: mori-task
        type: callout
        tone: info
        title: '2. Durante la conversazione'
        text: |-
          Dai almeno **5 risposte complete**. Usa:
          - 2 frasi ipotetiche
          - 1 frase con *se* + congiuntivo imperfetto (*Se avessi…, comprerei…*)
          - 1 frase alla forma passiva
      - id: mori-3
        type: aiTutorPrompt
        title: '3. Approfondimento'
        intro: 'Rispondi con un esempio personale, una frase ipotetica e un motivo (*perché*).'
        message: Fammi una domanda più difficile.
      - id: mori-4
        type: aiTutorPrompt
        title: '4. Correzione'
        intro: Alla fine scrivi a Mori.
        message: Correggi le mie frasi e spiegami gli errori.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**
    teacherNotes:
      - id: n-key
        anchor: part1
        text: >-
          Soluzioni. Parte 1: 1. hai; 2. avrai; 3. avessi, risparmierei; 4. spendesse,
          avrebbe (oppure spende, avrà); 5. vivessimo, risparmieremmo (oppure viviamo,
          risparmiamo / risparmieremo). Parte 2: 1. Più soldi sono (vengono) risparmiati
          dalle persone. 2. Troppo denaro è (viene) speso dai giovani. 3. Le spese non sono
          (vengono) controllate da molte persone. 4. I costi sono (vengono) ridotti dalle
          famiglie. Parte 4: 1. Se io avessi più soldi, viaggerei di più. 2. Corretta. 3. I
          soldi sono (vengono) risparmiati ogni mese. 4. Più soldi devono essere
          risparmiati.

