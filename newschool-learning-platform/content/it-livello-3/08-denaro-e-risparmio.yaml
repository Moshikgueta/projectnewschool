activities:
  - slug: denaro-e-risparmio-passiva
    title: 'Forma passiva: i costi possono essere ridotti'
    minutes: 8
    items:
      - id: sono-risparmiati
        type: multipleChoice
        prompt: I soldi ___ ogni mese.
        options:
          - { text: sono risparmiati, correct: true }
          - {
              text: risparmia,
              feedback: "I soldi non fanno l'azione: la ricevono. Usiamo la forma passiva, *essere* + participio: *sono risparmiati*.",
            }
          - {
              text: sono risparmiato,
              feedback: 'Il participio si accorda con il soggetto. *I soldi* è maschile plurale: *sono risparmiati*.',
            }
      - id: possono-essere
        type: fillBlank
        prompt: Completa la forma passiva con il verbo modale.
        text: I costi possono ___ ridotti.
        blanks: [[essere]]
      - id: dovrebbero
        type: multipleChoice
        prompt: Più soldi ___ essere risparmiati.
        options:
          - { text: dovrebbero, correct: true }
          - {
              text: dovrebbe,
              feedback: 'Il soggetto *più soldi* è plurale: il verbo modale è *dovrebbero*.',
            }
          - {
              text: dovresti,
              feedback: '*Dovresti* è la forma di *tu*. Il soggetto è *più soldi* (loro): *dovrebbero*.',
            }
      - id: accordo
        type: trueFalse
        prompt: "Nella forma passiva il participio si accorda con il soggetto: *L'acqua è risparmiata.*"
        answer: true
        feedback:
          correct: "Giusto! *L'acqua è risparmiata. I costi sono ridotti. Le spese sono controllate.*"
          incorrect: "Il participio si accorda con il soggetto: *l'acqua* è femminile singolare, quindi *risparmiata*."
      - id: trasforma-costi
        type: fillBlank
        prompt: 'Trasforma alla forma passiva: *Le famiglie riducono i costi.*'
        text: I costi ___ dalle famiglie.
        blanks: [[sono ridotti, vengono ridotti]]
      - id: participi
        type: matching
        prompt: Unisci ogni verbo al suo participio passato.
        pairs:
          - [ridurre, ridotto]
          - [spendere, speso]
          - [investire, investito]
          - [perdere, perso]
          - [fare, fatto]
      - id: spreco-ridotto
        type: multipleChoice
        prompt: Come può essere ___ lo spreco di cibo?
        options:
          - { text: ridotto, correct: true }
          - {
              text: ridotta,
              feedback: '*Lo spreco* è maschile singolare: il participio è *ridotto*.',
            }
          - {
              text: ridurre,
              feedback: 'Dopo *essere* nella forma passiva usiamo il participio passato: *ridotto*.',
            }
      - id: ordina-denaro
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Il denaro può essere risparmiato.

  - slug: denaro-e-risparmio-ipotetico
    title: 'Periodo ipotetico: se avessi più soldi…'
    minutes: 8
    items:
      - id: viaggerei
        type: multipleChoice
        prompt: Se avessi più soldi, ___ di più.
        options:
          - { text: viaggerei, correct: true }
          - {
              text: viaggio,
              feedback: 'Con *se* + congiuntivo imperfetto (*avessi*) la conseguenza va al condizionale: *viaggerei*.',
            }
          - {
              text: viaggerò,
              feedback: '*Viaggerò* è futuro. Per una situazione immaginaria usiamo il condizionale: *viaggerei*.',
            }
      - id: vincessi
        type: multipleChoice
        prompt: Se ___ 10.000 euro domani, cosa faresti?
        options:
          - { text: vincessi, correct: true }
          - {
              text: vincerei,
              feedback: 'Dopo *se* non usiamo il condizionale. Usiamo il congiuntivo imperfetto: *vincessi*.',
            }
          - {
              text: vincevo,
              feedback: '*Vincevo* è indicativo imperfetto. Dopo *se* in una situazione immaginaria usiamo il congiuntivo imperfetto: *vincessi*.',
            }
      - id: avrai
        type: fillBlank
        prompt: Completa con il futuro di *avere* (possibilità reale nel futuro).
        text: Se risparmi questo mese, ___ più soldi.
        blanks: [[avrai, tu avrai]]
      - id: spendesse
        type: fillBlank
        prompt: Completa con il congiuntivo imperfetto di *spendere* (situazione immaginaria).
        text: Se lui ___ meno, avrebbe più soldi.
        blanks: [[spendesse]]
      - id: io-ho
        type: trueFalse
        prompt: 'La frase *Se io ho più soldi, viaggerei di più.* è corretta.'
        answer: false
        feedback:
          correct: 'Giusto! Con il condizionale *viaggerei* serve il congiuntivo imperfetto: *Se io avessi più soldi, viaggerei di più.*'
          incorrect: 'La frase non è corretta: con il condizionale *viaggerei* serve il congiuntivo imperfetto: *Se io avessi più soldi…*'
      - id: congiuntivo
        type: matching
        prompt: Unisci ogni verbo alla sua forma di *io* al congiuntivo imperfetto.
        pairs:
          - [avere, avessi]
          - [essere, fossi]
          - [potere, potessi]
          - [vincere, vincessi]
          - [dovere, dovessi]
      - id: immaginaria
        type: multipleChoice
        prompt: Quale frase parla di una situazione immaginaria?
        options:
          - { text: 'Se avessi un milione, lo investirei.', correct: true }
          - {
              text: 'Se ricevo un bonus, lo userò per un viaggio.',
              feedback: 'Questa è una possibilità reale nel futuro (se + presente, futuro).',
            }
          - {
              text: 'Se risparmi, hai più sicurezza.',
              feedback: 'Questa è una verità generale (se + presente, presente).',
            }
      - id: ordina-viaggerei
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Se avessi più soldi, viaggerei di più.
