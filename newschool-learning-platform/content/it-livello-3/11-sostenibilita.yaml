# Cycle "Sostenibilità", converted from the Italian level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-3
slug: sostenibilita
title: Sostenibilità
goal: Immaginare soluzioni per l'ambiente con il periodo ipotetico del secondo tipo e dare consigli con i verbi modali.
position: 11
status: in_review

review:
  - >-
    The two workbook exercises ("Periodo ipotetico del secondo tipo" and "Verbi
    modali") are NEW: the notebook has no self-study exercises. They were written from
    the cycle's summary rules, the activity models and its vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    The lesson summary and the Mori homework instructions are in Hebrew in the source.
    They were translated into Italian (student-facing text is in Italian); short Hebrew
    comparisons ("אם הייתי… הייתי…") are kept inside the rules. The wrong examples
    "Dobbiamo protezione / Possiamo sostenibili" are kept as "non si dice". Please check
    the translation.
  - >-
    Summary additions (not in the source, please confirm): the condizionale presente of
    dovere / potere / volere (dovrei, potrei, vorrei…), since the activities use
    dovrebbero / potrebbe all the time and the source only conjugates the presente; the
    regular endings of the congiuntivo imperfetto (-assi, -essi, -issi) with
    riciclassero / investissero from the examples. The source's note "in English
    modals hardly change" was turned into "in Italian the modals change with the
    person". "bisognerebbe, si dovrebbe, è importante, è necessario" are presented as
    other ways to give advice (they are not modal verbs).
  - >-
    Links: the lesson slides (gamma.app) are not allowed and were left out (mentioned
    in a teacher note). The Quizlet link's "?new" parameter was removed. The
    "Data / Partecipanti" lines and the "Risposta dello studente 1/2/3" lines were
    removed (the platform has answer boxes).
  - >-
    Corrections: Activity 1 "rispondere usando verbi modali, non solo con accordi
    semplici" (a literal translation of "simple agreement") → "non solo con «sono
    d'accordo»"; Activity 1 phase 3 "la classe vota di nuovo" → "tutta la classe vota";
    Activity 2 "Se non fossi coinvolto" → "coinvolto / coinvolta"; "Nelle breakout
    rooms" → "nelle stanze separate (breakout rooms)". The vocabulary heading
    "Vocabulario:" (Spanish) and "Sustainability - Quizlet (Top 36 Words)" (English)
    were dropped.
  - >-
    Teacher-only material moved to teacher notes: Activity 2 phase 1 ("Chiedi agli
    studenti…"), the protest cards (the teacher must prepare 2 cards per group, one
    peaceful and one aggressive protest; they are not in the notebook), and Activity 3's
    "Nota per l'insegnante" about the visual support (the "Supporto visivo" itself is
    not in the notebook, probably in the slides).
  - >-
    Added: sentence frames for the warm-up questions (the source has only "Usa: Potrei +
    infinito" for question 3). Kept the model name "Dina" in the introduction example.
    Times: only the introduction (max 5 minutes) and the 2-minute presentations in
    Activity 3 are given; the cycle has 5 activities, so the plan note asks the teacher
    to choose.
  - >-
    Mori: task 1 is the message; its "what to do" (at least 5 answers, 2 modal verbs,
    2 sentences with Se) is a callout. Task 2 (3 short questions) is an answer box list;
    task 3 (mini speech "Se fossi presidente…") is a reflection box with its
    requirements and example in a callout.
  - >-
    Vocabulary: "Impronta ecologica – טביעת רגל פחמנית" (carbon footprint) → "טביעת רגל
    אקולוגית"; "Risorse limitate – משאבים מתכלים" → "משאבים מוגבלים / מתכלים"; capital
    letters inside the terms ("Impatto Ambientale", "Cambiamento Climatico"…) were
    lowercased, as in Italian. Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: sostenibilita-classe
    title: 'In classe: Sostenibilità'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Sostenibilità
      - id: skills
        type: cycleOverview
        skills:
          - name: Periodo ipotetico del secondo tipo
            description: 'Situazioni immaginarie e le loro conseguenze: *se le persone riciclassero di più, ci sarebbero meno rifiuti*'
          - name: Verbi modali
            description: 'Obblighi, possibilità e consigli: *dobbiamo, possiamo, le persone dovrebbero…, potrei…*'
      - id: quizlet
        type: externalLink
        label: Sostenibilità su Quizlet
        url: https://quizlet.com/nl/1168396657/sostenibilita-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Giro introduttivo
      - id: intro
        type: sentenceFrame
        frame: Io sono ___. Potrei ___ per proteggere l'ambiente.
        example: Sono Dina. Potrei usare meno acqua quando lavo i piatti per proteggere l'ambiente.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup
        type: discussionQuestions
        items:
          - question: Qual è un'abitudine sostenibile che esiste in un altro paese o in un'altra comunità e che, secondo te, anche le persone in Israele dovrebbero adottare?
            frame: In ___ le persone ___. Secondo me, anche in Israele dovremmo ___.
          - question: Che cosa potrebbe impedire alle persone di riciclare? Questo influisce anche su di te? Perché?
            frame: Le persone potrebbero non riciclare perché ___.
          - question: C'è qualcosa che personalmente potresti fare di più per aiutare l'ambiente? Perché non lo fai adesso?
            frame: Potrei ___, ma adesso non lo faccio perché ___.
          - question: Che cosa diresti a una persona che pensa che l'ambiente non sia importante?
            frame: Le direi che ___.
          - question: Che cosa faresti per convincere più persone a riciclare?
            frame: Per convincere più persone, farei ___.
          - question: Che cosa dovrebbero fare i comuni e le amministrazioni locali per rendere le città più sostenibili?
            frame: I comuni dovrebbero ___.
          - question: Se potessi approvare una legge per rendere l'ambiente più verde, quale sarebbe?
            frame: Se potessi approvare una legge, ___.
          - question: Quale prodotto dovrebbe essere vietato perché dannoso per l'ambiente? Fai degli esempi per spiegare la tua risposta.
            frame: Secondo me, ___ dovrebbe essere vietato perché ___.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: Potremmo fare di più'
        skills: [Verbi modali]
        steps:
          - "**Fase 1, brainstorming individuale:** pensa alla sostenibilità nella vita quotidiana, nelle imprese e nel governo. Scrivi **4 frasi** con i verbi modali su che cosa tu, la tua comunità o il tuo paese potreste fare di più per aiutare l'ambiente. Usa i modelli qui sotto."
          - "**Fase 2, discussione di gruppo (stanze separate):** condividi **2 idee** e spiega perché le hai scelte. I compagni rispondono **con i verbi modali**, non solo con «sono d'accordo», e fanno almeno **una domanda di approfondimento** per ogni idea (domande guida qui sotto)."
          - "Alla fine ogni gruppo sceglie **tre idee**, una per categoria: la più realistica, la soluzione più efficace a lungo termine, l'idea più controversa."
          - "**Fase 3, presentazione in classe:** ogni gruppo presenta le sue 3 idee con i verbi modali. Poi tutta la classe vota: la più realistica, la soluzione più efficace a lungo termine, l'idea più controversa."
        wordBank:
          - Per proteggere il pianeta, le persone dovrebbero…
          - Un cambiamento realistico che gli individui potrebbero fare è…
          - I governi o le grandi aziende devono…
          - Questa soluzione potrebbe aiutare, ma…
          - Se alle persone importasse davvero, farebbero…
          - Non dovremmo aspettarci…
      - id: act1-sentences
        type: discussionQuestions
        title: Le mie 4 frasi
        items:
          - question: Io
            frame: Per proteggere il pianeta, potrei ___.
          - question: La mia comunità
            frame: La mia comunità dovrebbe ___.
          - question: Il mio paese
            frame: Il governo deve ___.
          - question: Una soluzione con un limite
            frame: Questa soluzione potrebbe aiutare, ma ___.
      - id: act1-questions
        type: discussionQuestions
        title: Domande guida
        answerable: false
        items:
          - question: Perché pensi che questo funzionerebbe?
          - question: Chi dovrebbe esserne responsabile?
          - question: Che cosa potrebbe andare storto?
          - question: Le persone potrebbero davvero cambiare questa abitudine?
          - question: È qualcosa che devono fare gli individui o i governi?
      - id: act2
        type: classActivity
        title: 'Attività 2: Supereresti il limite?'
        skills: [Periodo ipotetico del secondo tipo, Verbi modali]
        steps:
          - In tutto il mondo molte persone cercano di convincere gli altri a riciclare di più e a vivere in modo più sostenibile. Alcune manifestazioni sono pacifiche, altre includono vandalismo o azioni aggressive.
          - '**Fase 1, in classe:** hai sentito parlare di manifestazioni ambientaliste, pacifiche o aggressive, in Israele o nel resto del mondo?'
          - "**Fase 2, role-play (gruppi di 2–4):** il gruppo riceve **2 carte**: una manifestazione pacifica e una aggressiva. Ognuno sceglie un ruolo e lo tiene per tutti e due i role-play: attivista ambientale, funzionario del governo, cittadino comune, turista che osserva dall'esterno."
          - 'Per ogni protesta, il gruppo discute e recita una breve scena che risponde alla domanda: **Se questa manifestazione avvenisse nel nostro paese, convincerebbe più persone a riciclare?**'
          - '**Regole:** ognuno usa almeno **un periodo ipotetico del secondo tipo** e almeno **un verbo modale**.'
          - '**Fase 3, condivisione in classe:** ogni gruppo condivide una frase su ciascuna protesta. Poi discutiamo le domande qui sotto.'
        wordBank:
          - Se le persone vedessero questa protesta, reagirebbero…
          - Questo potrebbe sensibilizzare l'opinione pubblica, ma potrebbe anche…
          - Se gli attivisti si comportassero così, il pubblico non…
          - I governi dovrebbero / non dovrebbero rispondere…
          - Se riciclare fosse più facile, le persone…
      - id: act2-questions
        type: discussionQuestions
        title: Domande di approfondimento
        items:
          - question: Quale manifestazione sarebbe più efficace? Perché?
            frame: Secondo me, sarebbe più efficace ___ perché ___.
          - question: Quale potrebbe avere l'effetto contrario?
            frame: ___ potrebbe avere l'effetto contrario perché ___.
          - question: Se non fossi coinvolto / coinvolta emotivamente, quale tipo di protesta ti convincerebbe di più?
            frame: Se non fossi coinvolto / coinvolta, mi convincerebbe di più ___.
      - id: act3
        type: classActivity
        title: 'Attività 3: Campagna per un futuro più verde'
        skills: [Periodo ipotetico del secondo tipo, Verbi modali]
        steps:
          - "**Fase 1, dal generale allo specifico (gruppi di 2–3):** il vostro gruppo riceve un tema generale (riciclo, riduzione dell'uso della plastica, risparmio idrico, moda sostenibile, riduzione dello spreco alimentare). Trasformatelo in un obiettivo di campagna molto specifico: chi volete cambiare esattamente? Quale comportamento volete modificare? Scrivete una frase chiara con il modello qui sotto."
          - '**Fase 2, progettazione:** costruite la campagna in tre parti (obiettivo e pubblico; strategia e messaggio; visibilità e impatto) con i verbi modali e il periodo ipotetico. Usate le domande e i modelli qui sotto.'
          - '**Fase 3, presentazione in gruppi misti:** ognuno ha **2 minuti** per presentare la propria campagna: focus, pubblico di riferimento, strategia, perché funzionerebbe. Poi il gruppo fa **2 domande di approfondimento** con il periodo ipotetico o i verbi modali.'
          - '**Fase 4, discussione finale (facoltativa):** *Se realizzassi davvero questa campagna, quale parte sarebbe la più difficile? Se la campagna non avesse pieno successo, quale piccolo cambiamento potrebbe renderla più efficace?*'
        example: "*La nostra campagna si concentra sull'educazione delle giovani generazioni al riciclo delle bottiglie nelle città israeliane.*"
      - id: act3-focus
        type: sentenceFrame
        prompt: Il focus della campagna
        frame: La nostra campagna si concentra su ___ in ___.
      - id: act3-plan
        type: discussionQuestions
        title: La nostra campagna
        items:
          - question: "Obiettivo e pubblico: qual è l'obiettivo della campagna? Quale cambiamento volete vedere?"
            frame: La nostra campagna ha l'obiettivo di ___. Il nostro pubblico di riferimento è ___. Se il nostro pubblico cambiasse questa abitudine, ___.
          - question: "Strategia e messaggio: qual è l'idea principale? Come convincerete le persone?"
            frame: Convinceremmo le persone attraverso ___. Questa strategia potrebbe funzionare perché ___. Le persone potrebbero cambiare comportamento se ___.
          - question: 'Visibilità e impatto: dove vedrebbero la campagna le persone? Come si potrebbe misurare il successo?'
            frame: Le persone vedrebbero questa campagna ___. Il successo potrebbe essere misurato attraverso ___. Se la campagna avesse successo, vedremmo ___.
      - id: act3-questions
        type: discussionQuestions
        title: Domande possibili per i compagni
        answerable: false
        items:
          - question: Che cosa faresti se le persone ignorassero la campagna?
          - question: Come potresti adattare questa campagna a un altro gruppo?
          - question: Che cosa potrebbe andare storto?
          - question: Funzionerebbe ancora senza finanziamenti?
      - id: act4
        type: classActivity
        title: 'Attività 4: Una lettera per una causa'
        skills: [Periodo ipotetico del secondo tipo, Verbi modali]
        steps:
          - '**Fase 1, scrittura individuale:** scegli un problema ambientale che ti sta a cuore (riciclo, rifiuti di plastica, trasporto pubblico, spazi verdi) e una persona con potere decisionale (il sindaco, un consigliere comunale, il preside di una scuola, un leader della comunità). Scrivi una **lettera formale** o una **e-mail formale**.'
          - "La lettera deve avere: una formula iniziale formale (*Gentile…*); la descrizione del problema; una soluzione concreta e perché aiuterebbe; che cosa succederebbe se la situazione restasse com'è oggi; una formula finale formale (*Cordiali saluti*, *La ringrazio per il suo tempo*…)."
          - '**Fase 2, a coppie:** leggi la tua lettera ad alta voce. Il compagno fa **2 domande** come se fosse il destinatario, su chiarezza, efficacia e possibili conseguenze. Poi vi scambiate i ruoli.'
          - '**Fase 3, in classe:** ogni coppia condivide qualcosa di memorabile emerso dalle lettere, poi discutiamo le domande qui sotto.'
      - id: act4-letter
        type: reflection
        prompt: 'La mia lettera: Gentile ___, …'
      - id: act4-questions
        type: discussionQuestions
        title: Discussione
        items:
          - question: Se inviassi davvero questa lettera, come risponderebbe la persona? Perché?
            frame: Se inviassi questa lettera, la persona ___ perché ___.
          - question: "Durante la scrittura o l'ascolto c'è stato un momento in cui hai pensato: «Non ci avevo mai riflettuto in questo modo»?"
          - question: Se più persone scrivessero lettere di questo tipo, pensi che ci sarebbe davvero un cambiamento? Perché?
            frame: Se più persone scrivessero lettere così, ___.
      - id: act5
        type: classActivity
        title: 'Attività 5: La natura dovrebbe essere lasciata in pace?'
        skills: [Verbi modali, Periodo ipotetico del secondo tipo]
        steps:
          - 'In tutto il mondo governi e gruppi ambientalisti discutono su quanto gli esseri umani debbano intervenire nella natura. Alcuni pensano che la natura debba essere lasciata completamente in pace; altri credono che gli esseri umani debbano gestirla attivamente per proteggerla. **Se gli esseri umani smettessero di gestire le aree naturali, la natura si riprenderebbe da sola oppure la situazione peggiorerebbe?**'
          - '**Gruppo 1:** la natura dovrebbe essere lasciata in pace il più possibile. **Gruppo 2:** gli esseri umani dovrebbero gestire e controllare attivamente la natura.'
          - "**Fase 1, brainstorming in gruppi:** pensate ad argomenti per la vostra posizione, anche se non siete del tutto d'accordo. Cercate di convincere l'altra squadra con il periodo ipotetico del secondo tipo e i verbi modali (domande guida qui sotto)."
          - '**Fase 2, dibattito:** il gruppo A presenta un argomento, il gruppo B risponde; poi il gruppo B presenta un argomento e il gruppo A risponde.'
          - '**Fase 3, discussione finale in classe:** vedi le domande qui sotto.'
      - id: act5-guide
        type: discussionQuestions
        title: Domande guida
        answerable: false
        items:
          - question: Che cosa succederebbe se gli esseri umani smettessero completamente di gestire foreste o fauna selvatica?
          - question: Gli esseri umani dovrebbero controllare le popolazioni animali o lasciare decidere alla natura?
          - question: Se una specie in pericolo minacciasse le comunità locali, che cosa si dovrebbe fare?
          - question: L'intervento umano potrebbe causare più danni nel lungo periodo?
      - id: act5-final
        type: discussionQuestions
        title: Discussione finale
        items:
          - question: Pensando alla natura in Israele, esiste un luogo in cui la natura crea problemi alle persone o in cui le persone creano problemi alla natura? Che cosa si dovrebbe fare lì?
            frame: A ___, ___. Si dovrebbe ___.
          - question: Riesci a pensare a un esempio reale in cui l'intervento umano abbia aiutato la natura oppure l'abbia peggiorata? Che cosa faresti diversamente se accadesse di nuovo?
            frame: Se accadesse di nuovo, farei ___.
          - question: Guardando al futuro, che cosa dovrebbero fare governi o comunità per proteggere la natura senza danneggiare le persone?
            frame: I governi dovrebbero ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Periodo ipotetico del secondo tipo** e **Verbi
          modali** (Attività 1: solo modali; Attività 2–5: tutte e due). Il quaderno ha
          cinque attività e non indica i tempi, tranne il giro introduttivo: scegli le
          attività in base alla durata della lezione. La presentazione della lezione
          (gamma.app) non è inclusa nella piattaforma (i link alle presentazioni non sono
          permessi); usala dal tuo materiale se vuoi.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: Massimo 5 minuti. Dai prima il tuo esempio con *potrei* + infinito.
      - id: n-warmup
        anchor: warmup
        text: Chiedi frasi complete con il condizionale (*potrei, dovrebbero, farei*) e almeno una frase con *se*.
      - id: n-act1
        anchor: act1
        text: Individuale + stanze separate (breakout rooms). Controlla che le risposte dei compagni usino i verbi modali e non solo «sono d'accordo».
      - id: n-act2
        anchor: act2
        text: >-
          Fase 1: chiedi agli studenti se hanno sentito parlare di manifestazioni
          ambientaliste, pacifiche o aggressive, in Israele o nel resto del mondo. Prima
          della lezione prepara le carte (materiale non incluso nel quaderno): per ogni
          gruppo una manifestazione ambientalista pacifica e una aggressiva.
      - id: n-act3
        anchor: act3
        text: >-
          Gruppi misti. Assegna un tema a ogni gruppo. Lavora con un supporto visivo per
          aiutare gli studenti a costruire la campagna passo per passo: il supporto
          visivo non è nel quaderno (forse è nella presentazione). La Fase 4 è
          facoltativa.
      - id: n-act3-time
        anchor: act3-questions
        minutes: 2
        text: 2 minuti di presentazione per ogni studente, poi 2 domande del gruppo.
      - id: n-act4
        anchor: act4
        text: Scrittura individuale + lavoro a coppie. Ricorda la differenza tra lettera formale (*Gentile…, La ringrazio…*) e informale.
      - id: n-act5
        anchor: act5
        text: Dibattito di gruppo. Ogni gruppo difende la sua posizione anche se non è del tutto d'accordo.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: sostenibilita-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: intro
        type: text
        text: 'Oggi abbiamo parlato di **sostenibilità**, **ambiente**, **soluzioni ecologiche** e **responsabilità personale e pubblica**. Abbiamo espresso opinioni, consigli, possibilità e situazioni immaginarie.'
      - id: rules-modali
        type: ruleSummary
        skill: Verbi modali
        rules:
          - text: "I verbi modali principali sono **dovere** (obbligo, necessità), **potere** (possibilità, capacità, permesso) e **volere** (desiderio, intenzione). Li usiamo per dire che cosa le persone, i comuni, le aziende e i governi devono o possono fare per l'ambiente."
            examples:
              - Le persone devono riciclare.
              - I cittadini possono usare meno plastica.
              - Vogliamo una città più pulita.
          - text: "Il verbo modale va **prima di un altro verbo all'infinito**. Non si dice *Dobbiamo protezione* o *Possiamo sostenibili*."
            examples: [Dobbiamo proteggere la natura., Possiamo ridurre l'inquinamento.]
          - text: 'In italiano i modali **cambiano con la persona** (vedi la tabella).'
            examples: [io devo, noi dobbiamo, lui può, loro vogliono]
          - text: 'Per dare un **consiglio** in modo gentile usiamo il **condizionale presente**: *dovrei, dovresti, dovrebbe, dovrebbero; potrei, potrebbe*.'
            examples:
              - I governi dovrebbero investire nell'energia pulita.
              - Questa soluzione potrebbe aiutare.
          - text: 'Altri modi naturali per dare consigli: **bisognerebbe**, **si dovrebbe**, **è importante**, **è necessario** + infinito.'
            examples: [Bisognerebbe usare di più i mezzi pubblici., È importante ridurre i rifiuti.]
      - id: modali-table
        type: table
        caption: Verbi modali (presente)
        header: [Persona, dovere, potere, volere]
        rows:
          - [io, devo, posso, voglio]
          - [tu, devi, puoi, vuoi]
          - [lui / lei, deve, può, vuole]
          - [noi, dobbiamo, possiamo, vogliamo]
          - [voi, dovete, potete, volete]
          - [loro, devono, possono, vogliono]
      - id: modali-cond-table
        type: table
        caption: Verbi modali (condizionale presente)
        header: [Persona, dovere, potere, volere]
        rows:
          - [io, dovrei, potrei, vorrei]
          - [tu, dovresti, potresti, vorresti]
          - [lui / lei, dovrebbe, potrebbe, vorrebbe]
          - [noi, dovremmo, potremmo, vorremmo]
          - [voi, dovreste, potreste, vorreste]
          - [loro, dovrebbero, potrebbero, vorrebbero]
      - id: rules-ipotetico
        type: ruleSummary
        skill: Periodo ipotetico del secondo tipo
        rules:
          - text: 'Usiamo il **periodo ipotetico del secondo tipo** per parlare di una situazione **non reale** o **immaginaria**, e della sua conseguenza possibile. Per chi parla ebraico è come אם הייתי… הייתי…'
            examples:
              - Se i governi investissero di più nelle energie rinnovabili, l'inquinamento diminuirebbe.
              - Se le persone riciclassero di più, ci sarebbero meno rifiuti.
              - Se fossi sindaco, migliorerei il trasporto pubblico.
          - text: 'Struttura: **se + congiuntivo imperfetto**, **condizionale presente**. Dopo *se* non usiamo mai il condizionale.'
            examples: [Se avessimo più piste ciclabili, più persone andrebbero in bicicletta.]
          - text: 'Congiuntivo imperfetto dei verbi regolari: *-are* → **-assi** (riciclassi), *-ere* → **-essi** (vedessi), *-ire* → **-issi** (investissi). Le terminazioni sono: *-ssi, -ssi, -sse, -ssimo, -ste, -ssero*. Alcuni verbi frequenti sono irregolari: *essere → fossi, fare → facessi*.'
            examples:
              [
                se le persone riciclassero,
                se i governi investissero,
                se la plastica costasse di più,
              ]
          - text: 'Nella seconda parte della frase usiamo il **condizionale presente**: *farei, direi, potrei, dovrei, avrei, sarebbe*.'
            examples:
              - Se fossi presidente, farei nuove leggi ambientali.
              - Se la plastica costasse di più, la gente ne userebbe meno.
          - text: 'Invece di una frase semplice (*È importante riciclare.*) possiamo presentare una situazione immaginaria e spiegare la conseguenza: è un italiano più ricco.'
            examples: [Se tutti riciclassero di più, la città sarebbe più pulita.]
      - id: congiuntivo-table
        type: table
        caption: Congiuntivo imperfetto (dopo se)
        header: [Persona, essere, avere, fare, potere]
        rows:
          - [se io, fossi, avessi, facessi, potessi]
          - [se tu, fossi, avessi, facessi, potessi]
          - [se lui / lei, fosse, avesse, facesse, potesse]
          - [se noi, fossimo, avessimo, facessimo, potessimo]
          - [se voi, foste, aveste, faceste, poteste]
          - [se loro, fossero, avessero, facessero, potessero]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le due abilità e chiedi a ogni studente una frase con *se* e una con un verbo modale sul tema dell'ambiente.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: sostenibilita-compiti
    title: Compiti con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia il messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
      - id: mori-chat
        type: aiTutorPrompt
        title: 'Compito 1: Una breve conversazione'
        message: >-
          Ciao Mori! Parliamo di sostenibilità. Fammi domande sull'ambiente e aiutami a
          usare dovere, potere e il periodo ipotetico (Se fossi…, farei…). Correggi i miei
          errori.
      - id: mori-chat-rules
        type: callout
        tone: info
        title: Che cosa fare
        text: |-
          Rispondi ad almeno **5 domande** e cerca di usare:
          - **2 verbi modali**
          - **2 frasi con *se…***
      - id: short-title
        type: heading
        level: 3
        text: 'Compito 2: Risposte brevi'
      - id: short
        type: discussionQuestions
        title: Rispondi a voce o per scritto. Scrivi 2 o 3 frasi per ogni risposta.
        items:
          - question: Che cosa dovrebbero fare le persone per aiutare l'ambiente?
            frame: Le persone dovrebbero ___.
          - question: Che cosa potresti fare tu?
            frame: Io potrei ___.
          - question: Se fossi sindaco, che cosa cambieresti?
            frame: Se fossi sindaco, ___.
      - id: speech-title
        type: heading
        level: 3
        text: 'Compito 3: Mini discorso'
      - id: speech-rules
        type: callout
        tone: info
        title: 'Tema: Se fossi presidente…'
        text: |-
          Scrivi 4 o 5 frasi. Devi usare:
          - **1 verbo modale**
          - **1 frase con *se***
          *Esempio: Se fossi presidente, investirei nell'energia pulita. Le persone dovrebbero usare meno plastica.*
      - id: speech
        type: reflection
        prompt: Se fossi presidente…
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**

