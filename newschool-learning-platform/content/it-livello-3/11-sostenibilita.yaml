vocabulary:
  - slug: sostenibilita
    title: Sostenibilità
    items: *sostenibilita-words

activities:
  - slug: sostenibilita-ipotetico
    title: 'Periodo ipotetico del secondo tipo: se fossi…, farei…'
    minutes: 8
    items:
      - id: riciclassero
        type: multipleChoice
        prompt: Se le persone ___ di più, ci sarebbero meno rifiuti.
        options:
          - { text: riciclassero, correct: true }
          - {
              text: riciclerebbero,
              feedback: 'Dopo *se* non usiamo il condizionale: usiamo il congiuntivo imperfetto, *riciclassero*.',
            }
          - {
              text: riciclano,
              feedback: '*Riciclano* è presente. Per una situazione immaginaria usiamo *se* + congiuntivo imperfetto: *riciclassero*.',
            }
      - id: fossi-sindaco
        type: fillBlank
        prompt: Completa con il congiuntivo imperfetto di *essere* (io).
        text: Se ___ sindaco, migliorerei il trasporto pubblico.
        blanks: [[fossi, io fossi]]
      - id: userebbe
        type: multipleChoice
        prompt: Se la plastica costasse di più, la gente ne ___ meno.
        options:
          - { text: userebbe, correct: true }
          - {
              text: usasse,
              feedback: 'Il congiuntivo va dopo *se*. Nella seconda parte della frase usiamo il condizionale: *userebbe*.',
            }
          - {
              text: userà,
              feedback: '*Userà* è futuro. Nel periodo ipotetico del secondo tipo la conseguenza va al condizionale: *userebbe*.',
            }
      - id: unisci-congiuntivo
        type: matching
        prompt: Unisci ogni verbo alla sua forma di congiuntivo imperfetto.
        pairs:
          - [essere (io), fossi]
          - [avere (noi), avessimo]
          - [fare (loro), facessero]
          - [potere (tu), potessi]
          - [essere (loro), fossero]
      - id: se-sarei
        type: trueFalse
        prompt: 'La frase *Se sarei sindaco, migliorerei il trasporto pubblico* è corretta.'
        answer: false
        feedback:
          correct: 'Giusto! Dopo *se* usiamo il congiuntivo imperfetto: *Se fossi sindaco, migliorerei…*'
          incorrect: 'Dopo *se* non usiamo mai il condizionale. La forma giusta è *Se fossi sindaco, migliorerei il trasporto pubblico.*'
      - id: investissero
        type: fillBlank
        prompt: Completa con *investire* (congiuntivo imperfetto) e *diminuire* (condizionale presente).
        text: Se i governi ___ di più nelle energie rinnovabili, l'inquinamento ___.
        blanks: [[investissero], [diminuirebbe]]
      - id: frase-corretta
        type: multipleChoice
        prompt: Quale frase è corretta?
        options:
          - { text: 'Se tutti riciclassero di più, la città sarebbe più pulita.', correct: true }
          - {
              text: 'Se tutti riciclerebbero di più, la città sarebbe più pulita.',
              feedback: 'Dopo *se* usiamo il congiuntivo imperfetto: *se tutti riciclassero*.',
            }
          - {
              text: 'Se tutti riciclassero di più, la città fosse più pulita.',
              feedback: 'Nella seconda parte usiamo il condizionale presente: *la città sarebbe più pulita*.',
            }
      - id: ordina-presidente
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Se fossi presidente, farei nuove leggi ambientali.

  - slug: sostenibilita-modali
    title: 'Verbi modali: dovere, potere, volere'
    minutes: 8
    items:
      - id: dovrebbero
        type: multipleChoice
        prompt: Per proteggere il pianeta, le persone ___ usare meno plastica.
        options:
          - { text: dovrebbero, correct: true }
          - { text: dovrebbe, feedback: '*Le persone* è plurale (loro): *dovrebbero*.' }
          - {
              text: dovere,
              feedback: 'Il verbo modale si coniuga con la persona: *le persone dovrebbero*.',
            }
      - id: possiamo
        type: fillBlank
        prompt: Completa con il presente di *potere* (noi).
        text: ___ ridurre l'inquinamento.
        blanks: [[Possiamo, possiamo, Noi possiamo, noi possiamo]]
      - id: unisci-modali
        type: matching
        prompt: Unisci ogni verbo alla sua forma al presente.
        pairs:
          - [dovere (io), devo]
          - [potere (lui / lei), può]
          - [volere (tu), vuoi]
          - [dovere (noi), dobbiamo]
          - [volere (loro), vogliono]
      - id: infinito
        type: trueFalse
        prompt: "Dopo un verbo modale usiamo un verbo all'infinito: *Dobbiamo proteggere la natura.*"
        answer: true
        feedback:
          correct: "Giusto! Modale + infinito: *Possiamo ridurre l'inquinamento.*"
          incorrect: "Dopo il verbo modale viene un infinito: *Dobbiamo proteggere la natura. Possiamo ridurre l'inquinamento.*"
      - id: proteggere
        type: multipleChoice
        prompt: Quale frase è corretta?
        options:
          - { text: Dobbiamo proteggere la natura., correct: true }
          - {
              text: Dobbiamo protezione la natura.,
              feedback: "Dopo il verbo modale serve un verbo all'infinito, non un nome: *dobbiamo proteggere*.",
            }
          - {
              text: Dobbiamo proteggiamo la natura.,
              feedback: "Solo il modale si coniuga; il secondo verbo resta all'infinito: *dobbiamo proteggere*.",
            }
      - id: governi
        type: fillBlank
        prompt: Completa con il condizionale presente di *dovere*.
        text: I governi ___ investire nell'energia pulita.
        blanks: [[dovrebbero]]
      - id: consiglio
        type: multipleChoice
        prompt: Vuoi dare un consiglio gentile. Quale frase usi?
        options:
          - { text: Le persone dovrebbero riciclare di più., correct: true }
          - {
              text: Le persone devono riciclare di più.,
              feedback: '*Devono* esprime un obbligo, è più forte. Per un consiglio gentile usiamo il condizionale: *dovrebbero*.',
            }
          - {
              text: Le persone vogliono riciclare di più.,
              feedback: '*Volere* esprime un desiderio, non un consiglio. Per consigliare usiamo *dovrebbero*.',
            }
      - id: ordina-plastica
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: I cittadini possono usare meno plastica.
