activities:
  - slug: social-media-passato
    title: 'Passato prossimo: ho visto, ho condiviso'
    minutes: 8
    items:
      - id: ho-visto
        type: multipleChoice
        prompt: Ieri ___ molti video.
        options:
          - { text: ho visto, correct: true }
          - { text: sono visto, feedback: "Il verbo *vedere* usa l'ausiliare *avere*: *ho visto*." }
          - {
              text: vedo,
              feedback: '*Vedo* è presente. Con *ieri* usiamo il passato prossimo: *ho visto*.',
            }
      - id: ho-condiviso
        type: fillBlank
        prompt: Completa con il passato prossimo di *condividere* (io).
        text: ___ una foto delle mie vacanze.
        blanks: [[Ho condiviso, ho condiviso, Io ho condiviso, io ho condiviso]]
      - id: l-ho-cambiata
        type: multipleChoice
        prompt: "*Hai cambiato la tua routine?* Sì, l'___ perché passo più tempo sul telefono la sera."
        options:
          - { text: ho cambiata, correct: true }
          - {
              text: ho cambiato,
              feedback: "Con il pronome *la* (la routine) il participio si accorda: *l'ho cambiata*.",
            }
          - {
              text: hai cambiata,
              feedback: "*Hai* è la forma di *tu*. Rispondi per te (io): *l'ho cambiata*.",
            }
      - id: momento-preciso
        type: trueFalse
        prompt: 'In italiano non possiamo usare il passato prossimo con *ieri*.'
        answer: false
        feedback:
          correct: 'Giusto! Il passato prossimo va bene anche con un momento preciso: *Ieri ho visto molti video.*'
          incorrect: 'Il passato prossimo si usa anche con un momento preciso: *Ieri ho visto molti video.*'
      - id: unisci-participi
        type: matching
        prompt: Unisci ogni verbo alla sua forma di *io* al passato prossimo.
        pairs:
          - [guardare, ho guardato]
          - [condividere, ho condiviso]
          - [scoprire, ho scoperto]
          - [perdere, ho perso]
          - [seguire, ho seguito]
      - id: abbiamo-passato
        type: fillBlank
        prompt: Completa con il passato prossimo di *passare* (noi).
        text: Negli ultimi anni ___ troppo tempo online.
        blanks: [[abbiamo passato, noi abbiamo passato]]
      - id: ha-scoperto
        type: multipleChoice
        prompt: Anna ___ una persona nuova su TikTok.
        options:
          - { text: ha scoperto, correct: true }
          - {
              text: è scoperta,
              feedback: "Il verbo *scoprire* usa l'ausiliare *avere*: *ha scoperto*.",
            }
          - { text: ha scoprito, feedback: 'Il participio di *scoprire* è irregolare: *scoperto*.' }
      - id: ordina-abitudini
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Ho notato un cambiamento nelle mie abitudini.

  - slug: social-media-passiva
    title: 'Forma passiva: il video è stato condiviso'
    minutes: 8
    items:
      - id: e-stato-condiviso
        type: multipleChoice
        prompt: Il video ___ da milioni di utenti.
        options:
          - { text: è stato condiviso, correct: true }
          - {
              text: ha stato condiviso,
              feedback: 'La forma passiva usa *essere*: *è stato condiviso*.',
            }
          - {
              text: è stata condivisa,
              feedback: 'Il participio si accorda con il soggetto. *Il video* è maschile: *è stato condiviso*.',
            }
      - id: sono-stati-raccolti
        type: fillBlank
        prompt: Completa con il passato prossimo passivo di *raccogliere*.
        text: I dati ___ attraverso le app.
        blanks: [[sono stati raccolti]]
      - id: accordo
        type: trueFalse
        prompt: 'Nella forma passiva il participio si accorda con il soggetto: *Le foto sono state condivise.*'
        answer: true
        feedback:
          correct: 'Giusto! *Il video è stato condiviso, la foto è stata condivisa, le foto sono state condivise.*'
          incorrect: 'Il participio si accorda con il soggetto: *le foto* è femminile plurale, quindi *sono state condivise*.'
      - id: attivo-passivo
        type: multipleChoice
        prompt: '*Gli utenti condividono i video.* → I video ___ dagli utenti.'
        options:
          - { text: sono condivisi, correct: true }
          - {
              text: hanno condiviso,
              feedback: '*Hanno condiviso* è attivo. La forma passiva usa *essere* + participio: *sono condivisi*.',
            }
          - { text: è condiviso, feedback: '*I video* è plurale: *sono condivisi*.' }
      - id: funzione
        type: fillBlank
        prompt: Completa con l'ausiliare del passato prossimo passivo.
        text: Una nuova funzione ___ introdotta.
        blanks: [[è stata]]
      - id: unisci-soggetti
        type: matching
        prompt: Unisci ogni soggetto alla forma passiva giusta.
        pairs:
          - [Il video, è stato condiviso]
          - [La notizia, è stata letta]
          - [I dati, sono stati raccolti]
          - [Le foto, sono state pubblicate]
      - id: vengono-diffuse
        type: multipleChoice
        prompt: Le fake news ___ molto velocemente online.
        options:
          - { text: vengono diffuse, correct: true }
          - {
              text: vengono diffusi,
              feedback: '*Le fake news* è femminile plurale: *vengono diffuse*.',
            }
          - {
              text: vengono diffondere,
              feedback: 'Dopo *venire* serve il participio passato: *vengono diffuse*.',
            }
      - id: ordina-dati
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: I dati sono stati raccolti dalle app.
