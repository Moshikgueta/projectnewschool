# Cycle "Social media", converted from the Italian level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-3
slug: social-media
title: Social media
goal: Raccontare esperienze sui social con il passato prossimo e descrivere che cosa viene fatto online con la forma passiva.
position: 12
status: in_review

review:
  - >-
    The two workbook exercises ("Passato prossimo" and "Forma passiva") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's summary
    rules, the activity examples and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Activity 1, phase 3 asks for "almeno 1 frase al passato semplice passivo": "passato
    semplice" is the English simple past, which has no equivalent here (the English
    "has been introduced / was implemented in 2025" are both passato prossimo passivo
    in Italian, as the example "Nel 2025, una nuova regola è stata implementata"
    shows). Rewritten: at least 3 sentences in the passato prossimo passivo and at
    least 1 in the presente passivo (è / viene + participio), which the warm-up
    already uses (viene promossa, vengono diffuse). Please confirm.
  - >-
    The lesson summary and the "classic" homework are in Hebrew in the source; they
    were translated into Italian. Summary fixes: the passato prossimo structure gave
    only "avere + participio" (essere added); "use it when the exact time is not
    important" is the English present perfect rule and is wrong for Italian (the
    passato prossimo is also used with ieri, nel 2025…), rewritten. Passive: ADDED the
    agreement of the participle with the subject, the agent with "da" (dagli utenti),
    the presente passivo with essere / venire and the passato prossimo passivo
    (è stato / è stata / sono stati / sono state + participio), and a table. Please
    confirm.
  - >-
    Corrections: introduction "penso che i social media hanno migliorato…" → "abbiano
    migliorato" (congiuntivo after "penso che"), also in the example; warm-up 2
    "qualcuno importante" → "qualcuno di importante"; Activity 1 presentation rule "Non
    usare nomi (focus sulle azioni)" → "Non dire chi ha fatto l'azione"; Activity 3
    "Hai mai perso tempo senza accorgerti?" → "senza accorgertene"; Activity 4 "Ti senti
    sovraccarico" → "sovraccarico / sovraccarica"; Mori message "domande di follow-up"
    → "domande di approfondimento"; Mori task 3 example "ma io ho guardato solo alcuni"
    → "ma io ne ho guardati solo alcuni"; Activity 2 example lines got final
    punctuation.
  - >-
    Missing in the source: Activity 3 phase 2 says students read "two texts (passive vs
    active use)", but the texts are not in the notebook (maybe in the slides). The
    teacher must provide them; a teacher note says so. Activity 4 has no example; none
    was added.
  - >-
    Links: the lesson slides (gamma.app) are not allowed and were left out (mentioned
    in a teacher note). The Quizlet link's "?new" parameter was removed. The
    "Data / Partecipanti" lines and the "Risposta studente 1/2/3" lines were removed.
    The model name "Marta" in the introduction example was kept.
  - >-
    Homework: the "classic" homework (5 sentences in the passato prossimo; 5 active →
    passive transformations; a 4–5 sentence paragraph) is kept as answer boxes in the
    homework section, with the answer key of the transformations in a teacher note
    (presente passivo: "I video sono condivisi / vengono condivisi dagli utenti"…).
    The Mori message is kept once; the three Mori tasks ("Mori will ask…") are a
    callout under it. Part 1's hint "ho / hai / ha / abbiamo / hanno" now also names
    sono / è.
  - >-
    Times: introduction max 5 minutes and Activity 1's presentation (3 minutes) are
    the only times in the source.
  - >-
    Vocabulary: "Social – רשתות חברתיות" → "i social (media)"; "Notizia – חדשות" →
    "ידיעה / חדשה (חדשות)" since notizia is singular. Title: "Social Media" → "Social
    media" (Italian capitalisation). Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: social-media-classe
    title: 'In classe: Social media'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Social media
      - id: skills
        type: cycleOverview
        skills:
          - name: Passato prossimo
            description: "Le mie esperienze sui social: *ho visto, ho condiviso, ho notato, l'ho cambiata*"
          - name: Forma passiva
            description: 'Che cosa viene fatto online, senza dire chi lo fa: *il video è stato condiviso, i dati vengono raccolti*'
      - id: quizlet
        type: externalLink
        label: Social media su Quizlet
        url: https://quizlet.com/br/1171313727/social-media-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduzione
      - id: intro
        type: sentenceFrame
        frame: Mi chiamo ___ e penso che i social media abbiano migliorato / peggiorato / cambiato la nostra vita.
        example: Mi chiamo Marta e penso che i social media abbiano cambiato la nostra vita in modo positivo e negativo.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup
        type: discussionQuestions
        items:
          - question: Hai cambiato la tua routine quotidiana a causa dei social media?
            frame: Sì, l'ho cambiata perché ___. / No, non l'ho cambiata perché ___.
          - question: Hai conosciuto qualcuno di importante grazie ai social media? Racconta.
            frame: Sì, ho conosciuto ___ su ___ e ora ___.
          - question: Che tipo di contenuti hai condiviso recentemente?
            frame: Ho condiviso ___.
          - question: Come viene promossa l'inclusione sui social media?
            frame: L'inclusione viene promossa attraverso ___.
          - question: Come vengono diffuse le fake news? Come possono essere fermate?
            frame: Le fake news vengono diffuse ___ e possono essere fermate ___.
          - question: Come vengono raccolti i dati personali? Che cosa ne pensi?
            frame: I dati vengono raccolti attraverso ___ e penso che ___.
          - question: Quali contenuti vengono mostrati più spesso, secondo te?
            frame: Vengono mostrati soprattutto ___.
          - question: Pensi che si faccia abbastanza per proteggere i giovani online? Perché?
            frame: Sì / No, penso che ___ perché ___.
      - id: warmup-examples
        type: callout
        tone: info
        title: Esempi di risposta
        text: |-
          1. *Sì, l'ho cambiata perché passo più tempo sul telefono la sera.*
          2. *Sì, ho conosciuto un amico su Instagram e ora parliamo spesso.*
          3. *Ho condiviso una foto delle mie vacanze.*
          4. *L'inclusione viene promossa attraverso campagne social.*
          5. *Le fake news vengono diffuse molto velocemente online e possono essere fermate verificando le fonti.*
          6. *I dati vengono raccolti attraverso le app e penso che non sia sempre sicuro.*
          7. *Vengono mostrati soprattutto video brevi e contenuti virali.*
          8. *No, penso che non si faccia abbastanza perché i contenuti pericolosi sono ancora presenti.*
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: Tendenze del secolo'
        skills: [Forma passiva]
        steps:
          - 'I social media cambiano continuamente e le piattaforme competono per essere più innovative. **Fase 1:** ogni gruppo riceve una piattaforma (Instagram, TikTok, YouTube, X / Twitter) e lavora come un team di analisi.'
          - '**Fase 2, idee:** pensate a 5 tendenze o cambiamenti recenti (reali o inventati ma realistici): nuove funzioni, contenuti popolari, regole della piattaforma, trend virali, uso della tecnologia (intelligenza artificiale, algoritmo, moderazione).'
          - '**Fase 3, scrittura:** scrivete 5 frasi con la **forma passiva**: almeno 3 al **passato prossimo passivo** (*è stata introdotta*) e almeno 1 al **presente passivo** (*viene usata, sono mostrati*).'
          - "**Fase 4, presentazione (3 minuti):** non leggete tutto, parlate lentamente, usate la forma passiva e non dite chi ha fatto l'azione (il focus è sulle azioni)."
          - '**Fase 5, ascolto attivo:** mentre ascolti gli altri gruppi, scrivi una frase passiva che hai sentito e indica il tempo verbale.'
          - '**Fase 6, discussione:** Quale piattaforma è cambiata di più? Perché usiamo la forma passiva nelle notizie? Come cambia il messaggio nella forma attiva?'
        example: |-
          *Una nuova funzione è stata introdotta.*
          *Un video è stato condiviso da milioni di utenti.*
          *Nel 2025 una nuova regola è stata implementata.*
          *L'intelligenza artificiale è stata usata per personalizzare i contenuti.*
          **Apertura:** *Oggi presentiamo le nuove tendenze su Instagram. Negli ultimi mesi sono stati introdotti diversi cambiamenti…*
      - id: act1-sentences
        type: discussionQuestions
        title: Le nostre 5 frasi
        items:
          - question: Frase 1 (passato prossimo passivo)
            frame: ___ è stato / è stata ___.
          - question: Frase 2 (passato prossimo passivo)
            frame: ___ sono stati / sono state ___.
          - question: Frase 3 (passato prossimo passivo)
            frame: Negli ultimi mesi ___.
          - question: Frase 4 (presente passivo)
            frame: ___ viene / vengono ___.
          - question: Frase 5
            frame: ___.
      - id: act2
        type: classActivity
        title: 'Attività 2: Cose che ho notato'
        skills: [Passato prossimo]
        steps:
          - 'I social media fanno parte della nostra vita quotidiana. **Fase 1, individuale:** scegli 2 idee e costruisci una frase per ognuna (vedi sotto).'
          - '**Fase 2, condivisione (gruppi di 2–3):** A dice una frase; B risponde con il passato prossimo; C fa una domanda.'
          - '**Fase 3, in classe:** 3 studenti parlano davanti alla classe.'
        example: |-
          *A: Ho notato che i video brevi sono molto popolari.*
          *B: Ho visto la stessa cosa su YouTube.*
          *C: Hai notato anche che le persone guardano meno video lunghi?*
      - id: act2-sentences
        type: discussionQuestions
        title: Scegli 2 idee
        items:
          - question: Ho notato qualcosa di molto popolare.
            frame: Ho notato che ___.
          - question: Ho sentito parlare spesso di qualcosa.
            frame: Ho sentito parlare spesso di ___.
          - question: Ho visto qualcosa che mi ha fatto ridere / pensare.
            frame: Ho visto ___ e mi ha fatto ___.
          - question: Ho evitato qualcosa di negativo.
            frame: Ho evitato ___ perché ___.
          - question: Ho scoperto una persona nuova.
            frame: Ho scoperto ___ su ___.
          - question: Ho notato un cambiamento nelle mie abitudini.
            frame: Ho notato che ___.
      - id: act3
        type: classActivity
        title: 'Attività 3: Scrolling passivo vs scelta attiva'
        skills: [Forma passiva]
        steps:
          - '**Fase 1, discussione in gruppo:** vedi le domande qui sotto.'
          - "**Fase 2, lettura:** leggete i due testi dell'insegnante (uso passivo e uso attivo dei social)."
          - '**Fase 3, confronto a coppie:** lo studente A racconta il testo 1, lo studente B il testo 2. Usate la forma passiva.'
          - "**Fase 4, discussione:** Che cosa è stato perso con lo scrolling passivo? Che cosa è stato guadagnato con l'uso attivo? Che cosa è stato incoraggiato dalle piattaforme? Che cosa non è stato protetto abbastanza?"
        wordBank:
          - Il tempo è stato perso.
          - Il controllo è stato perso / mantenuto.
          - I contenuti sono stati mostrati.
          - Le abitudini sono state influenzate.
      - id: act3-questions
        type: discussionQuestions
        title: 'Fase 1: discussione'
        items:
          - question: I contenuti sono scelti dagli utenti o dall'algoritmo?
            frame: Secondo me, i contenuti sono scelti ___.
          - question: Hai mai perso tempo senza accorgertene?
            frame: Sì, ho perso ___ quando ___.
          - question: Scegli che cosa guardare o scrolli automaticamente?
            frame: Di solito ___.
      - id: act4
        type: classActivity
        title: 'Attività 4: Dibattito. Dove informarsi?'
        skills: [Passato prossimo]
        steps:
          - 'Oggi le notizie sono ovunque. I social media sono veloci, ma a volte poco affidabili. **Gruppo 1:** i social media sono migliori. **Gruppo 2:** i media tradizionali sono migliori.'
          - '**Fase 1, preparazione:** pensate a idee con il passato prossimo. Perché le persone si fidano? Come vengono condivise le informazioni? Che effetto hanno le emozioni e la velocità? I social causano stress?'
          - '**Fase 2, dibattito:** il Gruppo A parla, il Gruppo B risponde.'
          - '**Fase 3, discussione finale:** vedi le domande qui sotto.'
      - id: act4-questions
        type: discussionQuestions
        title: Discussione finale
        items:
          - question: La fiducia è cambiata negli ultimi anni?
            frame: Secondo me, negli ultimi anni la fiducia ___.
          - question: Ti senti sovraccarico / sovraccarica di informazioni?
            frame: Sì / No, ___.
          - question: Quale fonte preferisci?
            frame: Preferisco ___ perché ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Passato prossimo** (domande di riscaldamento
          1–3, Attività 2 e 4) e **Forma passiva** (domande 4–7, Attività 1 e 3). Il
          quaderno indica solo i tempi dell'introduzione (5 minuti) e della presentazione
          dell'Attività 1 (3 minuti). La presentazione della lezione (gamma.app) non è
          inclusa nella piattaforma (i link alle presentazioni non sono permessi); usala
          dal tuo materiale se vuoi.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: Massimo 5 minuti. Fai notare il congiuntivo dopo *penso che* (*abbiano cambiato*).
      - id: n-act1
        anchor: act1
        minutes: 3
        text: >-
          Gruppi / stanze separate. Assegna una piattaforma a ogni gruppo. I 3 minuti sono
          per la presentazione di ogni gruppo. Durante l'ascolto attivo ogni studente
          scrive una frase passiva e identifica il tempo verbale.
      - id: n-act3
        anchor: act3
        text: >-
          I due testi della Fase 2 (uso passivo e uso attivo dei social) non sono nel
          quaderno: preparali tu o usali dalla presentazione. Lo studente A legge il
          testo 1, lo studente B il testo 2.
      - id: n-act4
        anchor: act4
        text: Dividi la classe in due gruppi e ricorda di usare il passato prossimo per gli esempi.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: social-media-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: rules-passato
        type: ruleSummary
        skill: Passato prossimo
        rules:
          - text: 'Usiamo il **passato prossimo** per parlare di **esperienze** e di **cose successe di recente**, anche con un momento preciso (*ieri, la settimana scorsa*).'
            examples:
              - Ho visto molti video.
              - Abbiamo passato troppo tempo online.
              - Ieri ho condiviso una foto.
          - text: 'Struttura: **avere** o **essere** (al presente) + **participio passato**. Con *essere* il participio si accorda con il soggetto.'
            examples:
              - io ho visto, lui ha visto
              - La mia routine è cambiata.
          - text: 'Con i pronomi *lo, la, li, le* il participio si accorda con il pronome.'
            examples:
              [Hai cambiato la tua routine? Sì, l'ho cambiata., Hai visto i video? Sì, li ho visti.]
      - id: rules-passiva
        type: ruleSummary
        skill: Forma passiva
        rules:
          - text: "Usiamo la **forma passiva** per mettere al centro **l'azione** o il risultato, quando non è importante chi ha fatto l'azione."
            examples: [Il video è stato condiviso., I dati sono stati raccolti.]
          - text: 'Struttura: soggetto + **essere** + **participio passato**. Il participio si accorda con il soggetto (maschile / femminile, singolare / plurale).'
            examples:
              - Il video è condiviso. / La foto è condivisa.
              - I dati sono raccolti. / Le notizie sono lette.
          - text: "**Presente passivo:** *è / sono* + participio, oppure *viene / vengono* + participio (con *venire* il significato è più chiaramente un'azione)."
            examples:
              - L'inclusione viene promossa attraverso campagne social.
              - Le fake news vengono diffuse molto velocemente.
          - text: '**Passato prossimo passivo:** *è stato / è stata / sono stati / sono state* + participio.'
            examples:
              - Una nuova funzione è stata introdotta.
              - Negli ultimi mesi sono stati introdotti diversi cambiamenti.
          - text: "Per dire chi ha fatto l'azione usiamo **da** (+ articolo: *dal, dalla, dagli, dalle*)."
            examples:
              - Un video è stato condiviso da milioni di utenti.
              - I dati sono raccolti dalle piattaforme.
          - text: "**Attivo e passivo:** nella forma attiva mettiamo al centro la persona che fa l'azione; nella forma passiva l'azione e il risultato."
            examples:
              - 'Attivo: Ho condiviso il video.'
              - 'Passivo: Il video è stato condiviso.'
      - id: passiva-table
        type: table
        caption: Forma passiva di condividere
        header: [Soggetto, presente, passato prossimo]
        rows:
          - [il video, è / viene condiviso, è stato condiviso]
          - [la foto, è / viene condivisa, è stata condivisa]
          - [i dati, sono / vengono condivisi, sono stati condivisi]
          - [le notizie, sono / vengono condivise, sono state condivise]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le due abilità. Chiedi agli studenti di trasformare una frase attiva in passiva e di raccontare una propria esperienza al passato prossimo.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: social-media-compiti
    title: Compiti con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia il messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
      - id: mori
        type: aiTutorPrompt
        title: Parliamo di social media
        message: >-
          Ciao Mori! Voglio parlare dei social media. Per favore, fammi domande così posso
          rispondere usando il passato prossimo e la forma passiva. Fammi parlare delle mie
          esperienze e anche di ciò che è stato fatto o condiviso online. Fammi anche
          domande di approfondimento per aiutarmi a spiegare meglio e a dare la mia
          opinione.
      - id: mori-tasks
        type: callout
        tone: info
        title: Che cosa ti chiederà Mori
        text: |-
          **Compito 1, esperienze personali:** *Che cosa hai visto recentemente? Hai condiviso qualcosa?* Rispondi con il **passato prossimo** e dai risposte lunghe.
          **Compito 2, la forma passiva:** *Come sono condivise le notizie? Come sono raccolti i dati?* Rispondi con la **forma passiva**.
          **Compito 3, tutte e due:** usa il passato prossimo e la forma passiva nella stessa risposta. *Esempio: Molti video sono stati condivisi, ma io ne ho guardati solo alcuni.*
      - id: written-title
        type: heading
        level: 3
        text: Compiti scritti
      - id: part1
        type: discussionQuestions
        title: 'Parte 1: Passato prossimo. Scrivi 5 frasi sul tuo uso dei social. Usa ho / hai / ha / abbiamo / hanno (o sono / è).'
        items:
          - question: Frase 1
            frame: Ho visto molti video ieri.
          - question: Frase 2
            frame: Ho condiviso una foto.
          - question: Frase 3
          - question: Frase 4
          - question: Frase 5
      - id: part2
        type: discussionQuestions
        title: 'Parte 2: Forma passiva. Trasforma le frasi dalla forma attiva alla forma passiva.'
        items:
          - question: Gli utenti condividono i video.
            frame: I video ___.
          - question: Le piattaforme raccolgono i dati.
            frame: I dati ___.
          - question: Gli influencer promuovono i prodotti.
            frame: I prodotti ___.
          - question: Le persone leggono le notizie.
            frame: Le notizie ___.
          - question: Le aziende creano contenuti.
            frame: I contenuti ___.
      - id: part3-rules
        type: callout
        tone: info
        title: 'Parte 3: Scrittura'
        text: |-
          Scrivi un breve paragrafo (4–5 frasi) sui social media, con:
          - almeno **2 frasi al passato prossimo**
          - almeno **2 frasi con la forma passiva**
          Puoi cominciare così: *Negli ultimi anni, i social media…*
      - id: part3
        type: reflection
        prompt: Negli ultimi anni, i social media…
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**
    teacherNotes:
      - id: n-part2-key
        anchor: part2
        text: >-
          Soluzioni (presente passivo, con *essere* o *venire*): I video sono / vengono
          condivisi dagli utenti. I dati sono / vengono raccolti dalle piattaforme. I
          prodotti sono / vengono promossi dagli influencer. Le notizie sono / vengono
          lette dalle persone. I contenuti sono / vengono creati dalle aziende.

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: social-media-pratica
    book: workbook
    title: 'Pratica: Social media'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Esercitati sulle due abilità del ciclo. Ogni risposta viene corretta subito e puoi riprovare.
      - id: ex-passato
        type: activity
        activity: social-media-passato
      - id: ex-passiva
        type: activity
        activity: social-media-passiva

  # ── vocabulary ───────────────────────────────────────────────────────────
