          - { term: algoritmo, gloss: אלגוריתם }
          - { term: influenza, gloss: השפעה }
          - { term: opinione, gloss: דעה }
          - { term: condivisione, gloss: שיתוף }
          - { term: controllo, gloss: שליטה }
          - { term: tempo, gloss: זמן }
          - { term: abitudine, gloss: הרגל }
          - { term: cambiamento, gloss: שינוי }
          - { term: esperienza, gloss: חוויה }
