vocabulary:
  - slug: intelligenza-artificiale
    title: Intelligenza artificiale (IA)
    items: *intelligenza-artificiale-words

activities:
  - slug: intelligenza-artificiale-ipotetico
    title: "Secondo periodo ipotetico: se l'IA fosse…, cambierebbe…"
    minutes: 8
    items:
      - id: fosse-avanzata
        type: multipleChoice
        prompt: Se l'IA ___ più avanzata, cambierebbe tutto.
        options:
          - { text: fosse, correct: true }
          - {
              text: sarebbe,
              feedback: 'Dopo *se* non usiamo mai il condizionale. Usiamo il congiuntivo imperfetto: *fosse*.',
            }
          - {
              text: è,
              feedback: 'Con *è* (presente) la seconda parte sarebbe *cambia*. Con *cambierebbe* usiamo il congiuntivo imperfetto: *fosse*.',
            }
      - id: usassero-imparerebbero
        type: fillBlank
        prompt: Completa con *usare* (congiuntivo imperfetto) e *imparare* (condizionale presente).
        text: Se le persone ___ l'IA ogni giorno, ___ più velocemente.
        blanks: [[usassero], [imparerebbero]]
      - id: dovrebbero-traduttori
        type: multipleChoice
        prompt: Se l'IA sostituisse i traduttori, molte persone ___ imparare nuove competenze.
        options:
          - { text: dovrebbero, correct: true }
          - {
              text: devono,
              feedback: 'Con *se* + congiuntivo imperfetto (*sostituisse*) la seconda parte va al condizionale: *dovrebbero*.',
            }
          - {
              text: dovessero,
              feedback: '*Dovessero* è congiuntivo imperfetto: va dopo *se*. Nella seconda parte usiamo il condizionale: *dovrebbero*.',
            }
      - id: avrei-tempo
        type: trueFalse
        prompt: 'La frase *Se io avrei più tempo, studierei di più* è corretta.'
        answer: false
        feedback:
          correct: 'Giusto! Dopo *se* usiamo il congiuntivo imperfetto: *Se io avessi più tempo, studierei di più.*'
          incorrect: 'Dopo *se* non usiamo il condizionale. La frase corretta è: *Se io avessi più tempo, studierei di più.*'
      - id: unisci-ipotesi
        type: matching
        prompt: Unisci le due parti di ogni frase.
        pairs:
          - [Se le scuole insegnassero l'IA…, …gli studenti sarebbero più preparati.]
          - [Se le aziende usassero solo l'IA…, …perderebbero il contatto umano.]
          - [Se io avessi più tempo…, …studierei come funziona l'IA.]
          - [Se l'IA non esistesse…, …la mia routine cambierebbe.]
      - id: fosse-potrebbero
        type: fillBlank
        prompt: Completa con *essere* (congiuntivo imperfetto) e *potere* (condizionale presente).
        text: Se l'IA ___ usata troppo, le persone ___ diventare meno indipendenti.
        blanks: [[fosse], [potrebbero]]
      - id: quale-ipotetico
        type: multipleChoice
        prompt: Quale frase usa il secondo periodo ipotetico?
        options:
          - { text: "Se l'IA fosse più avanzata, cambierebbe tutto.", correct: true }
          - {
              text: "L'IA cambierà il lavoro.",
              feedback: "*Cambierà* è futuro semplice: è una previsione, non un'ipotesi con *se*.",
            }
          - {
              text: "L'IA può aiutare le persone.",
              feedback: 'Questa frase usa il verbo modale *potere* al presente, senza *se* + congiuntivo.',
            }
      - id: ordina-tempo
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Se avessi più tempo, studierei come funziona l'IA.

  - slug: intelligenza-artificiale-modali
    title: 'Verbi modali: devo, posso, voglio, dovrei'
    minutes: 8
    items:
      - id: devono
        type: multipleChoice
        prompt: Le scuole ___ insegnare l'IA. (obbligo)
        options:
          - { text: devono, correct: true }
          - {
              text: deve,
              feedback: '*Deve* è la forma di *lui / lei*. *Le scuole* sono *loro*: *devono*.',
            }
          - {
              text: dovono,
              feedback: 'Questa forma non esiste. Il presente di *dovere* per *loro* è *devono*.',
            }
      - id: potrebbero-dipendenti
        type: multipleChoice
        prompt: Gli studenti ___ diventare troppo dipendenti dalla tecnologia. (rischio, possibilità)
        options:
          - { text: potrebbero, correct: true }
          - {
              text: dovrebbero,
              feedback: '*Dovrebbero* dà un consiglio. Qui parliamo di un rischio, una possibilità: *potrebbero*.',
            }
          - {
              text: potrebbe,
              feedback: '*Potrebbe* è la forma di *lui / lei*. *Gli studenti* sono *loro*: *potrebbero*.',
            }
      - id: dovrebbero-governi
        type: fillBlank
        prompt: Completa con *dovere* al condizionale (un consiglio).
        text: I governi ___ controllare l'uso dell'IA.
        blanks: [[dovrebbero]]
      - id: consiglio
        type: trueFalse
        prompt: '*Dovrebbe* si usa per dare un consiglio ed è più gentile di *deve*.'
        answer: true
        feedback:
          correct: "Giusto! *Le scuole devono insegnare l'IA* (obbligo). *Le scuole dovrebbero insegnare l'IA* (consiglio)."
          incorrect: "*Dovrebbe* (condizionale) è un consiglio, più gentile di *deve* (obbligo): *Le persone dovrebbero imparare a usare l'IA.*"
      - id: unisci-modali
        type: matching
        prompt: Unisci ogni verbo alla sua forma di *io*.
        pairs:
          - [dovere (presente), devo]
          - [potere (presente), posso]
          - [volere (presente), voglio]
          - [dovere (condizionale), dovrei]
          - [volere (condizionale), vorrei]
      - id: puoi-creare
        type: fillBlank
        prompt: Completa la richiesta all'IA con *potere* (tu), al presente o al condizionale.
        text: ___ creare un programma giornaliero con orari e luoghi?
        blanks: [[Puoi, puoi, Potresti, potresti]]
      - id: possono
        type: multipleChoice
        prompt: Gli studenti ___ usare l'IA per studiare.
        options:
          - { text: possono, correct: true }
          - {
              text: può,
              feedback: '*Può* è la forma di *lui / lei*. *Gli studenti* sono *loro*: *possono*.',
            }
          - {
              text: potono,
              feedback: 'Questa forma non esiste. Il presente di *potere* per *loro* è *possono*.',
            }
      - id: ordina-persone
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Le persone dovrebbero imparare a usare l'IA.
