# Cycle "Intelligenza artificiale (IA)", converted from the Italian level 3 digital
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-3
slug: intelligenza-artificiale
title: Intelligenza artificiale (IA)
goal: Parlare dell'intelligenza artificiale con il secondo periodo ipotetico e con i verbi modali (dovere, potere, volere).
position: 14
status: in_review

review:
  - >-
    The two workbook exercises ("Secondo periodo ipotetico" and "Verbi modali") are
    NEW: the notebook has no self-study exercises. They were written from the cycle's
    summary rules, the class examples and its vocabulary. Please check level, wording
    and every right answer before students see them.
  - >-
    Grammar (wrong rule): the notebook gives "Se + imperfetto, condizionale". In
    standard Italian the verb after "se" is the congiuntivo imperfetto (se l'IA fosse,
    se le aziende usassero), not the indicative imperfetto. The rule now says so, the
    Hebrew note about "imperfetto" refers to the congiuntivo imperfetto, and tables of
    the congiuntivo imperfetto and the condizionale presente were ADDED, plus the rule
    that the condizionale never goes after "se". "secondo condizionale" (English
    "second conditional") → "secondo periodo ipotetico" in the tips, the homework and
    Mori.
  - >-
    Modal verbs: the notebook calls them "פעלי עזר" (auxiliary verbs) and gives no
    forms. The skill lists "dovere, potere, volere" but the summary has no volere. ADDED:
    a table of the present and condizionale of dovere, potere and volere, the rule that
    a modal is followed by the infinitive, and examples with volere taken from the
    Activity 1 prompt (Voglio organizzare…, Non voglio spendere troppo). Hebrew
    glosses in the summary were checked: "Gli studenti potrebbero usare l'AI meglio –
    התלמידים יכולים…" → "יוכלו / היו יכולים…"; "Le persone dovrebbero imparare… –
    אנשים צריכים…" → "כדאי שאנשים ילמדו…". Please confirm.
  - >-
    Name: the cycle title is "Intelligenza artificiale (IA)"; the notebook writes
    "AI" throughout. "IA" is the usual Italian abbreviation, so student text uses
    "l'IA" everywhere (both are used in Italy; change back if you prefer "AI").
  - >-
    The lesson summary ("סיכום השיעור") is in Hebrew in the source; it was rewritten in
    Italian as rule summaries, keeping the Italian examples, with the Hebrew
    translations of the key examples in an examples block.
  - >-
    Corrections: introduction example "cercare parole in inglese" → "cercare parole in
    italiano" (left from another course; please confirm); Activity 1 rules list
    capitalisation unified ("può indicare", "deve chiedere"); "Dovrebbe spiegare
    preferenze personali" → "Dovrebbe spiegare le preferenze personali"; Activity 1
    asks for "almeno 3 verbi modali: devo, posso, dovrei" → "almeno 3 verbi modali
    (per esempio devo, posso, vorrei, dovrei)"; "Hi Mori!" → "Ciao Mori!";
    "Vocabulario" → "Vocabolario".
  - >-
    Homework Part 2 (wrong word bank): "deve / devono / dovrebbe / potrebbero / può"
    has three singular forms, but four of the five sentences have a plural subject
    (le scuole, i governi, gli studenti, le persone). The bank is now "devono /
    dovrebbero / può / potrebbero" (each can be used more than once); the key gives
    the possible answers. The answer key for all parts (not in the source) was ADDED in
    the teacher notes.
  - >-
    Activity 3 "AI e crimine": the guide questions and examples are about the general
    use of AI, not crime, and the "breve audio o podcast" is not given in the notebook.
    The title is kept; the teacher note asks you to choose an audio (on an allowed
    host, e.g. YouTube or Spotify) and to align the title with it. Activity 2 has no
    skills line (its phase 3 uses both skills). No times are given for any part.
  - >-
    The definition of AI in the warm-up is kept as an info callout. The Mori steps are
    kept as three messages plus a callout with the conversation requirements. Left
    out: the gamma.app lesson presentation (slide links are not allowed; mentioned in
    a teacher note), the "Data / Studenti" fields and the "Studente 1/2/3" answer
    lines. The Quizlet link is kept without "?new". The example name in the
    introduction (Ofir) is a model, not a student.
  - >-
    Vocabulary: "Regolazione – רגולציה" → "regolamentazione" (regolazione = adjustment);
    "Controllare – לשלוט" → "לבדוק / לפקח"; "Sicurezza – ביטחון" → "ביטחון / בטיחות";
    "Intelligenza artificiale" → "intelligenza artificiale (IA)". Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: intelligenza-artificiale-classe
    title: 'In classe: Intelligenza artificiale (IA)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Intelligenza artificiale (IA)
      - id: skills
        type: cycleOverview
        skills:
          - name: Secondo periodo ipotetico
            description: "Situazioni immaginarie: *Se l'IA sostituisse i traduttori, molte persone dovrebbero imparare nuove competenze.*"
          - name: Verbi modali (dovere, potere, volere)
            description: "Obbligo, possibilità, consiglio e desiderio: *L'IA può aiutare. Le scuole dovrebbero insegnare l'IA. Voglio organizzare un viaggio.*"
      - id: quizlet
        type: externalLink
        label: Intelligenza artificiale (IA) su Quizlet
        url: https://quizlet.com/br/1171518947/intelligenza-artificiale-ai-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduzione
      - id: intro
        type: sentenceFrame
        frame: Io sono ___. Uso l'IA ogni giorno / alcune volte a settimana / raramente.
        example: Sono Ofir. Uso l'IA alcune volte a settimana, soprattutto per cercare parole in italiano.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup-hint
        type: text
        text: Rispondi con frasi complete. Usa il secondo periodo ipotetico e i verbi modali.
      - id: definition
        type: callout
        tone: info
        title: Che cosa deve fare una tecnologia per essere considerata intelligenza artificiale?
        text: |-
          L'intelligenza artificiale è la capacità della tecnologia di imitare l'intelligenza umana. Per farlo, deve:
          - imparare nuove informazioni
          - risolvere problemi
          - capire il linguaggio umano
      - id: warmup
        type: discussionQuestions
        items:
          - question: L'IA è solo ChatGPT? Quali altri strumenti conosci?
            frame: No, l'IA non è solo ChatGPT. Conosco anche ___.
          - question: La vita senza l'IA sarebbe migliore o peggiore? Perché?
            frame: Secondo me, la vita senza l'IA sarebbe ___ perché ___.
          - question: Se l'IA non esistesse, come cambierebbe la tua routine?
            frame: Se l'IA non esistesse, io ___.
          - question: I governi dovrebbero regolamentare l'IA? Perché?
            frame: Secondo me, i governi dovrebbero / non dovrebbero ___ perché ___.
          - question: Le persone possono fidarsi dell'IA?
            frame: Le persone possono / non possono fidarsi dell'IA perché ___.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: Come scrivere un prompt'
        skills: ['Verbi modali (dovere, potere, volere)']
        steps:
          - "**Fase 1 – Introduzione:** un prompt è l'istruzione che diamo all'IA per ottenere una risposta. Se il prompt è chiaro, anche la risposta sarà più utile. Hai mai usato un chatbot? Che cosa hai scritto? Hai ricevuto la risposta che volevi?"
          - "**Fase 2 – Regole:** leggi le regole di un buon prompt (qui sotto) e l'esempio."
          - '**Fase 3 – In coppia:** fai 3–4 domande al compagno (preferenze, budget, interessi). Poi scrivi un prompt completo per organizzare un viaggio ideale per lui o per lei. Usa almeno 3 verbi modali (per esempio *devo, posso, vorrei, dovrei*).'
          - '**Fase 4 – Presentazione:** leggi o riassumi il tuo prompt. La classe risponde: il prompt è chiaro? Manca qualche informazione?'
        example: |-
          *Voglio organizzare un viaggio di tre giorni a Roma.*
          *Sarò lì da venerdì a domenica.*
          *Preferisco attività culturali e cibo locale.*
          *Non voglio spendere troppo.*
          *Puoi creare un programma giornaliero con orari e luoghi?*
      - id: act1-rules
        type: callout
        tone: info
        title: Un buon prompt…
        text: |-
          - **deve** spiegare chiaramente l'obiettivo
          - **deve** dare il contesto (dove, quando, con chi)
          - **può** includere dettagli pratici (tempo, budget, durata)
          - **dovrebbe** spiegare le preferenze personali
          - **può** indicare limiti o condizioni
          - **deve** chiedere un formato chiaro (lista, piano, ecc.)
      - id: act1-questions
        type: discussionQuestions
        title: Il prompt per il mio compagno
        items:
          - question: Domande per il compagno (preferenze, budget, interessi)
            frame: Dove vorresti andare? Quanto puoi spendere? Che cosa ti piace fare?
          - question: Il mio prompt
            frame: Il mio compagno vuole ___. Deve ___. Può ___. Puoi creare ___?
      - id: act2
        type: classActivity
        title: 'Attività 2: IA e lavoro'
        skills: [Secondo periodo ipotetico, 'Verbi modali (dovere, potere, volere)']
        steps:
          - "**Fase 1 – Brainstorming in classe:** l'intelligenza artificiale può sostituire alcuni lavori? Hai già visto esempi nella vita reale? Quali lavori sono più a rischio? Il tuo lavoro potrebbe cambiare? Rispondi con esempi semplici."
          - "**Fase 2 – Scelta dello scenario:** in piccoli gruppi, scegliete uno scenario: l'IA sostituisce i traduttori, gli autisti o i giornalisti."
          - '**Fase 3 – Discussione in gruppo:** discutete lo scenario con il secondo periodo ipotetico e i verbi modali (dovere, potere). Usate le domande guida qui sotto.'
          - '**Fase 4 – Presentazione:** ogni gruppo presenta le proprie idee alla classe. La classe può fare domande o aggiungere opinioni.'
        example: |-
          *Se l'IA sostituisse i traduttori, molte persone dovrebbero imparare nuove competenze.*
          *Le aziende potrebbero assumere meno lavoratori.*
      - id: act2-questions
        type: discussionQuestions
        title: Domande guida
        items:
          - question: Che cosa succederebbe se questo accadesse?
            frame: Se l'IA sostituisse ___, ___.
          - question: Che cosa dovrebbe cambiare nella società?
            frame: La società dovrebbe ___.
          - question: Che cosa potrebbero fare le persone per adattarsi?
            frame: Le persone potrebbero ___.
          - question: Quali sarebbero i vantaggi e i problemi?
            frame: Un vantaggio sarebbe ___. Un problema sarebbe ___.
      - id: act3
        type: classActivity
        title: 'Attività 3: IA e crimine'
        skills: [Secondo periodo ipotetico, 'Verbi modali (dovere, potere, volere)']
        steps:
          - "**Fase 1 – Ascolto:** ascolta un breve audio o podcast sull'uso dell'IA. Cerca di capire l'idea generale e trova 2 vantaggi e 2 problemi."
          - '**Fase 2 – In coppia:** discutete il contenuto. Rispondete alle domande guida con il secondo periodo ipotetico e i verbi modali (*deve, può, potrebbe, dovrebbe*).'
          - '**Fase 3 – Discussione in classe:** ogni coppia condivide 1–2 idee principali. Quale idea è più interessante? Quale problema è più importante?'
        example: |-
          *L'IA può aiutare a risolvere problemi più velocemente.*
          *Se l'IA fosse usata troppo, le persone potrebbero diventare meno indipendenti.*
          *I governi dovrebbero controllare l'uso dell'IA.*
      - id: act3-questions
        type: discussionQuestions
        title: Domande guida
        items:
          - question: "Perché l'IA può essere utile?"
            frame: "L'IA può essere utile perché ___."
          - question: Quali problemi potrebbero esistere?
            frame: Un problema potrebbe essere ___.
          - question: "Se l'IA fosse usata di più, che cosa cambierebbe?"
            frame: "Se l'IA fosse usata di più, ___."
          - question: "Le persone dovrebbero fidarsi dell'IA?"
            frame: Secondo me, le persone dovrebbero / non dovrebbero ___ perché ___.
      - id: act4
        type: classActivity
        title: 'Attività 4: IA ed educazione'
        skills: ['Verbi modali (dovere, potere, volere)', Secondo periodo ipotetico]
        steps:
          - "**Gruppi:** Gruppo 1: l'IA deve essere insegnata a scuola. Gruppo 2: l'IA non dovrebbe essere insegnata a scuola."
          - "**Fase 1 – Preparazione in gruppi:** preparate argomenti per difendere la vostra posizione. Usate *dovrebbe, potrebbe, deve* e almeno una frase con il secondo periodo ipotetico. Domande guida: quali sono i vantaggi di usare l'IA a scuola? Quali sono i rischi? Come cambierebbe l'apprendimento?"
          - "**Fase 2 – Dibattito:** il gruppo A presenta un'idea e il gruppo B risponde; poi il gruppo B presenta un'idea e il gruppo A risponde."
          - "**Fase 3 – Discussione in classe:** quale posizione è più convincente? È possibile trovare un equilibrio? Come dovrebbe essere usata l'IA nell'educazione?"
        example: |-
          *Le scuole dovrebbero insegnare l'IA per preparare gli studenti al futuro.*
          *Gli studenti potrebbero diventare troppo dipendenti dalla tecnologia.*
          *Se le scuole usassero troppo l'IA, gli studenti imparerebbero meno.*
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **secondo periodo ipotetico** e **verbi modali**
          (dovere, potere, volere). L'Attività 1 lavora sui modali; le Attività 2, 3 e 4
          uniscono le due abilità. Il quaderno non indica i tempi né quante attività
          scegliere. La presentazione della lezione (gamma.app) non è inclusa nella
          piattaforma: usala dal tuo materiale, se vuoi.
      - id: n-warmup
        anchor: warmup-title
        text: Leggi prima la definizione con il gruppo. Fai almeno due domande a ogni studente.
      - id: n-act1
        anchor: act1
        text: Presenta il concetto di prompt e le regole. Alla fine correggi gli errori e migliora alcuni esempi insieme alla classe.
      - id: n-act2
        anchor: act2
        text: Durante le presentazioni correggi e aiuta a migliorare l'uso delle strutture.
      - id: n-act3
        anchor: act3
        text: >-
          Il quaderno non indica l'audio o il podcast: sceglilo tu (per esempio su
          YouTube o Spotify). Le domande del quaderno parlano dell'uso dell'IA in
          generale, non del crimine: scegli un audio sull'IA e il crimine (per esempio
          riconoscimento facciale, truffe con voci false) oppure cambia il titolo. Dopo
          l'ascolto verifica la comprensione con alcune domande semplici.
      - id: n-act4
        anchor: act4
        text: Guida la discussione finale e correggi gli errori principali.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: intelligenza-artificiale-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: rules-ipotetico
        type: ruleSummary
        skill: Secondo periodo ipotetico
        rules:
          - text: 'Si usa per parlare di situazioni **immaginarie nel presente o nel futuro** e di possibilità non sicure.'
          - text: 'Struttura: **se + congiuntivo imperfetto, condizionale presente**.'
            examples:
              - Se l'IA sostituisse molti lavori, le persone dovrebbero imparare nuove competenze.
              - Se l'IA fosse più avanzata, cambierebbe tutto.
              - Se le scuole usassero troppo l'IA, gli studenti imparerebbero meno.
          - text: '**Importante:** il congiuntivo imperfetto sembra un tempo passato (*fosse, usassero*), ma il significato è ipotetico, nel presente o nel futuro.'
          - text: '**Attenzione:** dopo *se* non usiamo mai il condizionale.'
            examples:
              [
                'Se io avrei più tempo, studierei di più. ✗',
                'Se io avessi più tempo, studierei di più. ✓',
              ]
      - id: ipotetico-table
        type: table
        caption: Congiuntivo imperfetto e condizionale presente
        header: [Persona, essere → fosse, usare → usasse, cambiare → cambierebbe, dovere → dovrebbe]
        rows:
          - [io, fossi, usassi, cambierei, dovrei]
          - [tu, fossi, usassi, cambieresti, dovresti]
          - [lui / lei, fosse, usasse, cambierebbe, dovrebbe]
          - [noi, fossimo, usassimo, cambieremmo, dovremmo]
          - [voi, foste, usaste, cambiereste, dovreste]
          - [loro, fossero, usassero, cambierebbero, dovrebbero]
      - id: rules-modali
        type: ruleSummary
        skill: Verbi modali (dovere, potere, volere)
        rules:
          - text: "I verbi modali servono per dare consigli, parlare di possibilità, esprimere un obbligo o un desiderio. Dopo un verbo modale va l'**infinito**."
            examples: [L'IA può aiutare le persone., Le scuole devono insegnare l'IA.]
          - text: '**dovere** (presente) = obbligo, necessità.'
            examples: [Le scuole devono insegnare l'IA.]
          - text: '**potere** (presente) = possibilità, capacità.'
            examples: [L'IA può aiutare le persone.]
          - text: '**volere** (presente) = desiderio, intenzione.'
            examples:
              [Voglio organizzare un viaggio di tre giorni a Roma., Non voglio spendere troppo.]
          - text: '**dovere** al condizionale (*dovrebbe*) = consiglio, più gentile di *deve*.'
            examples:
              [Le scuole dovrebbero insegnare l'IA., Le persone dovrebbero imparare a usare l'IA.]
          - text: '**potere** al condizionale (*potrebbe*) = possibilità meno sicura, rischio.'
            examples: [Gli studenti potrebbero usare meglio l'IA., L'IA potrebbe creare problemi.]
          - text: '**volere** al condizionale (*vorrei*) = desiderio espresso in modo gentile.'
            examples: [Vorrei un programma con orari e luoghi.]
      - id: modali-table
        type: table
        caption: Verbi modali
        header: [Persona, dovere, potere, volere, dovere (cond.), potere (cond.), volere (cond.)]
        rows:
          - [io, devo, posso, voglio, dovrei, potrei, vorrei]
          - [tu, devi, puoi, vuoi, dovresti, potresti, vorresti]
          - [lui / lei, deve, può, vuole, dovrebbe, potrebbe, vorrebbe]
          - [noi, dobbiamo, possiamo, vogliamo, dovremmo, potremmo, vorremmo]
          - [voi, dovete, potete, volete, dovreste, potreste, vorreste]
          - [loro, devono, possono, vogliono, dovrebbero, potrebbero, vorrebbero]
      - id: rules-usi
        type: ruleSummary
        skill: Usi importanti della lezione
        rules:
          - text: 'Parlare del futuro (futuro semplice):'
            examples: [L'IA cambierà il lavoro.]
          - text: 'Parlare di situazioni ipotetiche:'
            examples: ["Se l'IA fosse più avanzata, cambierebbe tutto."]
          - text: 'Dare consigli:'
            examples: [Le persone dovrebbero imparare a usare l'IA.]
          - text: 'Parlare di possibilità:'
            examples: [L'IA potrebbe creare problemi.]
      - id: hebrew-examples
        type: examples
        items:
          - text: Se l'IA sostituisse molti lavori, le persone dovrebbero imparare nuove competenze.
            gloss: אם הבינה המלאכותית הייתה מחליפה הרבה עבודות, אנשים היו צריכים ללמוד מיומנויות חדשות.
          - text: Le scuole devono insegnare l'IA.
            gloss: בתי הספר חייבים ללמד בינה מלאכותית.
          - text: Le scuole dovrebbero insegnare l'IA.
            gloss: כדאי שבתי הספר ילמדו בינה מלאכותית.
          - text: L'IA può aiutare le persone.
            gloss: הבינה המלאכותית יכולה לעזור לאנשים.
          - text: Gli studenti potrebbero usare meglio l'IA.
            gloss: התלמידים היו יכולים להשתמש בבינה המלאכותית טוב יותר.
          - text: L'IA potrebbe creare problemi.
            gloss: הבינה המלאכותית עלולה ליצור בעיות.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Usa il **secondo periodo ipotetico** per esprimere idee e opinioni.
          Usa i **verbi modali** per parlare in modo più naturale.
          Aggiungi esempi personali e parla con frasi complete e chiare.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: >-
          Il riassunto del quaderno è in ebraico; qui è in italiano con le traduzioni
          ebraiche degli esempi principali. Le tabelle dei verbi sono state aggiunte.
          Chiedi a ogni studente una frase nuova con *dovrebbe*, una con *potrebbe* e una
          con il secondo periodo ipotetico.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: intelligenza-artificiale-compiti
    title: Compiti con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia un messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
      - id: mori-1
        type: aiTutorPrompt
        title: "Messaggio 1: L'IA, il lavoro e l'educazione"
        message: Ciao Mori! Voglio praticare il secondo periodo ipotetico e i verbi modali. Fammi domande sull'intelligenza artificiale, sul lavoro e sull'educazione.
      - id: mori-rules
        type: callout
        tone: info
        title: Durante la conversazione
        text: |-
          Dai almeno **5 risposte complete**. Usa:
          - 2 frasi con il **secondo periodo ipotetico** (*Se l'IA fosse…, …*)
          - 2 **verbi modali** (*deve, può, dovrebbe, potrebbe…*)
      - id: mori-2
        type: aiTutorPrompt
        title: 'Messaggio 2: Una domanda più difficile'
        intro: 'Rispondi con la tua opinione, una condizione (*se…*) e una ragione (*perché*).'
        message: Fammi una domanda più difficile.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Messaggio 3: Correzione'
        intro: Alla fine della conversazione scrivi questo messaggio.
        message: Correggi le mie frasi e spiegami gli errori.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**
      - id: written-title
        type: heading
        level: 3
        text: Esercizi scritti
      - id: hw1
        type: discussionQuestions
        title: 'Parte 1: Completa le frasi (secondo periodo ipotetico)'
        items:
          - question: Se l'IA ___ (essere) più avanzata, ___ (cambiare) il mondo.
          - question: Se le persone ___ (usare) l'IA ogni giorno, ___ (imparare) più velocemente.
          - question: Se io ___ (avere) più tempo, ___ (studiare) come funziona l'IA.
          - question: Se le scuole ___ (insegnare) l'IA, gli studenti ___ (essere) più preparati.
          - question: Se le aziende ___ (usare) solo l'IA, ___ (perdere) il contatto umano.
      - id: hw2
        type: discussionQuestions
        title: 'Parte 2: Completa con un verbo modale: devono / dovrebbero / può / potrebbero (puoi usarli più di una volta)'
        items:
          - question: Le scuole ___ insegnare l'IA.
          - question: I governi ___ controllare l'uso dell'IA.
          - question: L'IA ___ aiutare le persone nel lavoro.
          - question: Gli studenti ___ diventare troppo dipendenti dalla tecnologia.
          - question: Le persone ___ usare l'IA con responsabilità.
      - id: hw3
        type: reflection
        prompt: >-
          **Parte 3:** scrivi 6–8 frasi sul tema «Come l'IA cambierà la mia vita». Usa 2
          frasi con il secondo periodo ipotetico, 2 verbi modali e un esempio personale.
      - id: hw4
        type: discussionQuestions
        title: 'Parte 4: Correggi le frasi'
        items:
          - question: Se l'IA è più avanzata, cambierebbe tutto.
          - question: Le persone deve usare l'IA meglio.
          - question: Se io avrei più tempo, studierei di più.
          - question: Gli studenti può usare l'IA.
    teacherNotes:
      - id: n-written
        anchor: written-title
        text: Gli esercizi scritti vengono dal quaderno («compiti classici»). Il quaderno non ha le soluzioni; quelle qui sotto sono state aggiunte.
      - id: n-hw1
        anchor: hw1
        text: >-
          Soluzioni: 1 fosse, cambierebbe; 2 usassero, imparerebbero; 3 avessi,
          studierei; 4 insegnassero, sarebbero; 5 usassero, perderebbero.
      - id: n-hw2
        anchor: hw2
        text: >-
          Soluzioni possibili: 1 devono / dovrebbero, 2 dovrebbero / devono, 3 può, 4
          potrebbero, 5 dovrebbero / devono. Il quaderno dava «deve / devono / dovrebbe /
          potrebbero / può», ma quattro soggetti sono plurali: le forme sono state
          cambiate.
      - id: n-hw4
        anchor: hw4
        text: >-
          Soluzioni: 1 Se l'IA fosse più avanzata, cambierebbe tutto. 2 Le persone devono
          (o dovrebbero) usare meglio l'IA. 3 Se io avessi più tempo, studierei di più. 4
          Gli studenti possono usare l'IA.

