activities:
  - slug: famiglia-e-generazioni-connettivi
    title: 'Connettivi logici: tuttavia, sebbene, quindi'
    minutes: 8
    items:
      - id: ma
        type: multipleChoice
        prompt: La mia famiglia è unita, ___ discutiamo spesso.
        options:
          - { text: ma, correct: true }
          - {
              text: quindi,
              feedback: '*Quindi* esprime una conseguenza. Qui le due idee sono in contrasto: *ma*.',
            }
          - {
              text: perché,
              feedback: '*Perché* esprime una causa. Qui le due idee sono in contrasto: *ma*.',
            }
      - id: sebbene-siano
        type: multipleChoice
        prompt: Sebbene i miei genitori ___ tradizionali, io sono piuttosto indipendente.
        options:
          - { text: siano, correct: true }
          - {
              text: sono,
              feedback: 'Dopo *sebbene* usiamo sempre il congiuntivo: *sebbene siano*.',
            }
          - {
              text: sarebbero,
              feedback: 'Dopo *sebbene* non usiamo il condizionale, ma il congiuntivo: *sebbene siano*.',
            }
      - id: conseguenza
        type: fillBlank
        prompt: Completa con un connettivo di conseguenza.
        text: La famiglia è molto unita, ___ ci vediamo spesso.
        blanks: [[quindi, perciò, di conseguenza]]
      - id: funzioni
        type: matching
        prompt: Unisci ogni connettivo alla sua funzione.
        pairs:
          - [inoltre, aggiunta]
          - [tuttavia, contrasto]
          - [poiché, causa]
          - [di conseguenza, conseguenza]
          - [infine, sequenza]
      - id: anche-se
        type: trueFalse
        prompt: '*Anche se* vuole il congiuntivo, come *sebbene*.'
        answer: false
        feedback:
          correct: "Giusto! *Anche se* vuole l'indicativo: *Anche se discutiamo spesso, ci sosteniamo.*"
          incorrect: "*Anche se* vuole l'indicativo (*anche se discutiamo*); solo *sebbene* vuole il congiuntivo (*sebbene siano*)."
      - id: perche
        type: multipleChoice
        prompt: Ho scelto questa carriera ___ i miei genitori mi hanno sostenuto.
        options:
          - { text: perché, correct: true }
          - {
              text: tuttavia,
              feedback: '*Tuttavia* esprime un contrasto. Qui la seconda parte dà la causa: *perché*.',
            }
          - {
              text: sebbene,
              feedback: '*Sebbene* esprime un contrasto e vuole il congiuntivo. Qui diamo la causa: *perché*.',
            }
      - id: prima-poi
        type: fillBlank
        prompt: Completa con un connettivo di sequenza.
        text: ___ abbiamo discusso, poi abbiamo trovato una soluzione.
        blanks: [[Prima, prima]]
      - id: ordina-sosteniamo
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Anche se discutiamo spesso, ci sosteniamo.

  - slug: famiglia-e-generazioni-aggettivi
    title: 'Aggettivi descrittivi: accordo e posizione'
    minutes: 8
    items:
      - id: organizzata
        type: multipleChoice
        prompt: Mia madre è molto ___.
        options:
          - { text: organizzata, correct: true }
          - {
              text: organizzato,
              feedback: "L'aggettivo concorda con *madre* (femminile singolare): *organizzata*.",
            }
          - {
              text: organizzate,
              feedback: '*Madre* è singolare: *organizzata*, non il plurale *organizzate*.',
            }
      - id: severi
        type: fillBlank
        prompt: Completa con l'aggettivo *severo* nella forma giusta.
        text: I miei genitori sono molto ___.
        blanks: [[severi]]
      - id: tradizionali
        type: fillBlank
        prompt: Completa con l'aggettivo *tradizionale* nella forma giusta.
        text: Le famiglie dei miei amici sono ___.
        blanks: [[tradizionali]]
      - id: significati
        type: matching
        prompt: Unisci ogni aggettivo al suo significato.
        pairs:
          - [esigente, chiede molto agli altri]
          - [testardo, non cambia mai idea]
          - [solidale, aiuta e sostiene gli altri]
          - [flessibile, si adatta facilmente ai cambiamenti]
          - [protettivo, difende le persone che ama]
      - id: due-forme
        type: trueFalse
        prompt: 'Gli aggettivi in *-e* (*tradizionale, indipendente*) hanno la stessa forma al maschile e al femminile.'
        answer: true
        feedback:
          correct: 'Giusto! *Un padre indipendente, una madre indipendente*; al plurale: *indipendenti*.'
          incorrect: 'Gli aggettivi in *-e* non cambiano con il genere: *un padre indipendente, una madre indipendente*.'
      - id: indipendenti
        type: multipleChoice
        prompt: Quale frase è corretta?
        options:
          - { text: Le mie sorelle sono molto indipendenti., correct: true }
          - {
              text: Le mie sorelle sono molto indipendente.,
              feedback: "*Sorelle* è plurale: anche l'aggettivo va al plurale, *indipendenti*.",
            }
          - {
              text: Le mie sorelle sono molto indipendenta.,
              feedback: 'Gli aggettivi in *-e* non hanno una forma in *-a*: al plurale diventano *indipendenti*.',
            }
      - id: posizione
        type: multipleChoice
        prompt: Quale frase è corretta?
        options:
          - { text: Mia madre è una donna organizzata., correct: true }
          - {
              text: Mia madre è una organizzata donna.,
              feedback: "Di solito l'aggettivo descrittivo va dopo il nome: *una donna organizzata*.",
            }
          - {
              text: Mia madre è una donna organizzato.,
              feedback: "L'aggettivo concorda con *donna* (femminile): *organizzata*.",
            }
      - id: ordina-responsabile
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Mio padre è estremamente responsabile.
