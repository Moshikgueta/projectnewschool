activities:
  - slug: salute-e-benessere-passato
    title: 'Abitudini e stati nel passato: prima… adesso…'
    minutes: 8
    items:
      - id: mangiavo
        type: multipleChoice
        prompt: Prima ___ molto zucchero, ma adesso mangio meglio.
        options:
          - { text: mangiavo, correct: true }
          - {
              text: ho mangiato,
              feedback: "*Prima* parla di un'abitudine nel passato: usiamo l'imperfetto, *mangiavo*.",
