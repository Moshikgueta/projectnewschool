    blocks:
      - id: intro
        type: text
        text: Esercitati sulle due abilità del ciclo. Ogni risposta viene corretta subito e puoi riprovare.
      - id: ex-passato
        type: activity
        activity: salute-e-benessere-passato
      - id: ex-modali
        type: activity
        activity: salute-e-benessere-modali

