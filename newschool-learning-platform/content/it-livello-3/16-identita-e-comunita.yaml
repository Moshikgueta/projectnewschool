# Cycle "Identità e comunità", converted from the Italian level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-3
slug: identita-e-comunita
title: Identità e comunità
goal: Fare ipotesi con il secondo periodo ipotetico e fare confronti tra persone e comunità.
position: 16
status: published

review:
  - >-
    The two workbook exercises ("Secondo periodo ipotetico" and "Confronti") are NEW:
    the notebook has no self-study exercises. They were written from the cycle's
    summary rules, the activity examples and its vocabulary. Please check level,
    wording and every right answer before students see them.
  - >-
    The notebook lists three skills: (1) secondo periodo ipotetico, (2) confronti,
    (3) narrazione con tempi diversi. The cycle overview keeps the first two as the
    cycle's two skills (they are in four of the five activities); the narrative
    tenses are practised in Activity 3 and the homework and keep their own rule
    block in the summary. Please confirm.
  - >-
    WRONG RULE fixed: the summary (and homework Part 2) gave the structure "Se +
    imperfetto, condizionale". In Italian the secondo periodo ipotetico is "se +
    congiuntivo imperfetto + condizionale presente" (Se fossi ricco, viaggerei).
    The Hebrew note "although we use a past tense (imperfetto)…" now speaks of the
    congiuntivo imperfetto. ADDED: a rule that the condizionale never goes after
    "se" (*se avrei → se avessi), and tables of the congiuntivo imperfetto and the
    condizionale presente (not in the source).
  - >-
    Summary, narrative tenses: "Passato prossimo / passato semplice" → "passato
    prossimo" ("passato semplice" is not an Italian tense; it comes from the English
    "simple past"). ADDED: the trapassato prossimo and "stavo + gerundio", which
    Activity 3 asks for. Activity 3, Fase 2: "2 frasi passato semplice, 1 frase
    passato continuo, 1 frase trapassato" (English categories) → "2 frasi al passato
    prossimo, 1 frase all'imperfetto o con stavo + gerundio, 1 frase al trapassato
    prossimo".
  - >-
    Summary, comparisons: the rule "-er (più + aggettivo)" is the English comparative
    and was removed; "più di / meno di" and "più… di" were merged. ADDED: di +
    article (del, della, dei…), "più… che" with two verbs or adjectives, and
    "tanto… quanto" next to "così… come". The summary was in Hebrew; it is now in
    Italian like the other cycles.
  - >-
    Homework Part 3 had wrong blanks: "La vita in campagna è ___ (tranquilla) ___ la
    vita in città" and "Il mio lavoro è ___ (interessante) ___ il tuo" would give
    *"di la vita" / *"di il tuo". Now "___ vita in città" and "___ tuo", so the
    answers are "della" and "del". The homework instructions were in Hebrew and are
    now in Italian. Answer key in a teacher note.
  - >-
    Corrections: warm-up 6 "Sei più simile o diverso dai tuoi genitori?" → "Sei più
    simile ai tuoi genitori o più diverso da loro?" (simile a / diverso da); warm-up
    1 had stray "**" marks; Activity 1 "Quale è più sostenibile?" → "Qual è…";
    Activity 2 "Speed Identity" (English) → "Identità lampo"; Activity 3 "Se questa
    esperienza non esistesse, io…" → "Se questa esperienza non facesse parte della
    mia vita, oggi io…"; Activity 5 used both "Gruppo 1 / 2" and "Gruppo A / B": now
    always 1 / 2. Mori "Hi Mori!" (English) → "Ciao Mori!". The intro frame now says
    "adulto / adulta" and has an example (the source has none).
  - >-
    Left out: the gamma.app lesson slides (not allowed; mentioned in a teacher note).
    NOTE: that link is titled "Vita Urbana vs Vita Rurale", so it is probably the
    slides of another cycle. The "Data / Partecipanti" lines and the "Risposte:
    Studente 1/2/3" lines (the platform has answer boxes). "?new" was removed from
    the Quizlet link.
  - >-
    Mori: the four steps were in Hebrew; they are now three messages in Italian
    (start, harder question, correction) with the requirements (5 full answers, two
    tenses, one hypothesis, one comparison) in the intro lines.
  - >-
    Vocabulary: "Self-perception" (English) → "Percezione di sé"; "Appartenenza"
    appeared twice (שייכות / תחושת שייכות), kept once as "שייכות / תחושת שייכות";
    "Inclusione – הכללה" → "הכלה" (הכללה means generalisation); "Eredità culturale –
    מורשת" → "מורשת תרבותית". "Anziano – זקן מכובד" kept; please check.
  - >-
    The source gives no times for this cycle, so no minutes are recorded. Activity 4
    needs short information on the communities (Amish, Maasai, Auroville, nomadi
    digitali, kibbutz) and students may need phones to search: see the teacher note.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: identita-e-comunita-classe
    title: 'In classe: Identità e comunità'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Identità e comunità
      - id: skills
        type: cycleOverview
        skills:
          - name: Secondo periodo ipotetico
            description: 'Situazioni immaginarie: *se + congiuntivo imperfetto + condizionale* (*Se vivessi in un altro paese, sarei più aperto*)'
          - name: Confronti
            description: '*più… di, meno… di, così… come, mentre* (*Sono più formale al lavoro, mentre con gli amici sono più rilassato*)'
      - id: quizlet
        type: externalLink
        label: Identità e comunità su Quizlet
        url: https://quizlet.com/br/1170304543/identita-e-comunita-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Giro di presentazione
      - id: intro
        type: sentenceFrame
        frame: Mi chiamo ___. Da adulto / adulta sono più ___ di quando ero bambino / bambina.
        example: Mi chiamo Dana. Da adulta sono più paziente di quando ero bambina.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup-hint
        type: callout
        tone: info
        text: Rispondi con frasi complete. Usa i **confronti** (*più… di, meno… di*) e il **secondo periodo ipotetico** (*Se fossi…, sarei…*).
      - id: warmup
        type: discussionQuestions
        items:
          - question: Oltre al nome e alla nazionalità, quale parte della tua identità è più importante oggi? Fai un esempio.
            frame: Secondo me, la parte più importante della mia identità è la mia mentalità, che è più aperta di prima.
          - question: Se dovessi descriverti senza parlare di lavoro o famiglia, come definiresti la tua identità?
            frame: Direi che sono una persona creativa, che è più curiosa della maggior parte delle persone.
          - question: Pensa a un momento in cui hai sentito «questo sono io». Che cosa è successo?
            frame: Quando ho viaggiato da solo / da sola, ho capito che sono più indipendente di quanto pensassi.
          - question: La tua identità è cambiata negli ultimi anni? Che cosa è cambiato?
            frame: Sì, sono più sicuro / sicura di prima perché ho avuto più esperienze.
          - question: Ti comporti in modo diverso con comunità diverse (famiglia, lavoro, amici)?
            frame: Sono più formale al lavoro, mentre con gli amici sono più rilassato / rilassata.
          - question: Sei più simile ai tuoi genitori o più diverso / diversa da loro?
            frame: Sono più simile a mia madre, che è più calma di mio padre.
          - question: Ti senti libero / libera di esprimere le tue opinioni al lavoro?
            frame: Se mi sentissi più sicuro / sicura, parlerei di più durante le riunioni.
          - question: Se ti trasferissi in un altro paese, che cosa cambierebbe della tua identità?
            frame: Se vivessi in un altro paese, sarei più aperto / aperta a nuove culture.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: Il mio ruolo nella comunità'
        skills: [Confronti, Secondo periodo ipotetico]
        steps:
          - '**Fase 1, brainstorming:** quali ruoli esistono nei gruppi? Per esempio: leader, organizzatore, mediatore, ascoltatore.'
          - '**Fase 2, creare una comunità:** in gruppi, scegliete una comunità (un gruppo di hobby, una comunità su Marte, una comunità ecologica, una comunità religiosa) e decidete il suo obiettivo, i suoi valori, chi può entrare e i ruoli.'
          - '**Fase 3, ipotesi:** ogni studente dice quale ruolo avrebbe e quale ruolo NON avrebbe in questa comunità, e perché.'
          - '**Fase 4, presentazione:** ogni gruppo presenta la sua comunità. Poi discutete: quale comunità è più inclusiva? Qual è più sostenibile? Quale crea più identità?'
        example: |-
          *Se fossi parte di questa comunità, sarei il leader perché ho esperienza.*
          *Non sarei il tesoriere perché sono meno organizzato degli altri.*
      - id: act1-frames
        type: discussionQuestions
        title: La nostra comunità
        items:
          - question: Obiettivo e valori della comunità
            frame: La nostra comunità vuole ___. I valori più importanti sono ___.
          - question: Chi può entrare?
            frame: Può entrare chi ___.
          - question: Quale ruolo avresti?
            frame: Se fossi parte di questa comunità, sarei ___ perché ___.
          - question: Quale ruolo NON avresti?
            frame: Non sarei ___ perché sono meno ___ di ___.
          - question: Quale comunità è più inclusiva o più sostenibile?
            frame: La comunità ___ è più ___ della comunità ___, perché ___.
      - id: act2
        type: classActivity
        title: 'Attività 2: Identità lampo'
        skills: [Confronti, Secondo periodo ipotetico]
        steps:
          - '**Fase 1:** scrivi 5 elementi della tua identità (per esempio: creativo, introverso, sportivo).'
          - '**Fase 2, in coppia:** trovate una somiglianza e una differenza. Fai al compagno una domanda con «perché» e una domanda ipotetica: *Che cosa cambierebbe se scambiassi un elemento?*'
          - '**Fase 3, con la classe:** presenta 2 elementi della tua identità, 1 confronto con il tuo compagno e 1 elemento che cambieresti.'
        example: |-
          *Io sono più introverso di Luca, ma tutti e due siamo sportivi.*
          *Se fossi meno timido, parlerei di più in classe.*
      - id: act2-sentences
        type: discussionQuestions
        title: La mia identità
        items:
          - question: I miei 5 elementi
            frame: Sono ___, ___, ___, ___ e ___.
          - question: Una somiglianza e una differenza con il compagno
            frame: Tutti e due siamo ___. Io sono più ___ di lui / lei, mentre lui / lei è più ___.
          - question: Un elemento che cambieresti
            frame: Se fossi meno / più ___, ___.
      - id: act3
        type: classActivity
        title: 'Attività 3: Che cosa succederebbe oggi?'
        skills: [Secondo periodo ipotetico]
        steps:
          - "**Fase 1, esperienza:** scegli un'esperienza importante della tua vita."
          - "**Fase 2, racconto:** scrivi 2 frasi al **passato prossimo**, 1 frase all'**imperfetto** (o con *stavo* + gerundio), 1 frase al **trapassato prossimo** e 1 frase sui tuoi sentimenti."
          - '**Fase 3, ipotesi:** immagina la tua vita senza questa esperienza.'
          - "**Fase 4, discussione:** l'identità è influenzata più dai momenti importanti o dai piccoli eventi?"
        example: |-
          *Tre anni fa mi sono trasferito a Tel Aviv. Ho trovato un lavoro nuovo. Non conoscevo nessuno. Prima non avevo mai vissuto da solo. Mi sentivo libero ma un po' solo.*
          *Se questa esperienza non facesse parte della mia vita, oggi sarei meno indipendente.*
      - id: act3-frames
        type: discussionQuestions
        title: La mia esperienza
        items:
          - question: Che cosa è successo? (passato prossimo)
            frame: ___ anni fa ho ___. Poi ___.
          - question: Com'era la situazione? (imperfetto)
            frame: In quel periodo ___.
          - question: Che cosa era successo prima? (trapassato prossimo)
            frame: Prima non avevo mai ___.
          - question: Come ti sentivi?
            frame: Mi sentivo ___.
          - question: Se questa esperienza non facesse parte della tua vita, come saresti oggi?
            frame: Se questa esperienza non facesse parte della mia vita, oggi io ___. La mia vita sarebbe diversa perché ___.
      - id: act4
        type: classActivity
        title: 'Attività 4: Comunità nel mondo'
        skills: [Confronti]
        steps:
          - "**Fase 1:** l'insegnante presenta brevemente alcune comunità nel mondo: gli Amish, i Maasai, Auroville, i nomadi digitali, il kibbutz."
          - '**Fase 2:** in gruppi, scegliete 2 comunità e cercate informazioni su di esse.'
          - '**Fase 3:** rispondete alle domande qui sotto con frasi complete.'
          - '**Fase 4:** confrontate le due comunità con *più… di, meno… di, così… come*.'
          - '**Fase 5, presentazione:** ogni gruppo presenta le sue risposte alla classe.'
        example: |-
          *L'identità degli Amish è definita dalla religione e dalla tradizione.*
          *I Maasai valorizzano la famiglia, la terra e la tradizione.*
          *Il kibbutz è più collettivo rispetto ai nomadi digitali.*
          *Gli Amish sono più tradizionali dei nomadi digitali.*
          *I nomadi digitali sono meno legati a un luogo rispetto ai Maasai.*
      - id: act4-questions
        type: discussionQuestions
        title: Le nostre due comunità
        items:
          - question: Che cosa definisce l'identità di questa comunità?
            frame: L'identità di ___ è definita da ___.
          - question: Quali valori sono più importanti?
            frame: ___ valorizzano ___.
          - question: L'identità è più individuale o collettiva?
            frame: ___ è più collettivo / individuale rispetto a ___.
          - question: Confrontate le due comunità.
            frame: ___ sono più / meno ___ di ___. / ___ sono così ___ come ___.
      - id: act5
        type: classActivity
        title: 'Attività 5: Dibattito. Tradizione o cambiamento?'
        skills: [Confronti, Secondo periodo ipotetico]
        steps:
          - "**Gruppo 1:** la tradizione protegge l'identità. **Gruppo 2:** l'identità cambia nel tempo."
          - '**Fase 1, preparazione:** in gruppi, pensate ad argomenti per sostenere la vostra posizione. Ogni argomento deve avere un confronto (*più di, meno di, così… come*) e una frase con il secondo periodo ipotetico.'
          - '**Fase 2, dibattito:** il Gruppo 1 presenta un argomento e il Gruppo 2 risponde; poi il Gruppo 2 presenta un argomento e il Gruppo 1 risponde. Continuate così, un argomento alla volta.'
          - '**Fase 3, discussione finale:** quale argomento è stato più convincente? È meglio cambiare o mantenere la tradizione? Perché? Esiste un equilibrio tra tradizione e cambiamento?'
        example: |-
          *Se i giovani avessero più potere, la comunità cambierebbe più velocemente.*
          *Le comunità tradizionali sono più stabili di quelle moderne.*
      - id: act5-arguments
        type: discussionQuestions
        title: I nostri argomenti
        items:
          - question: 'Argomento 1:'
            frame: ___ sono più ___ di ___. Se ___, ___.
          - question: 'Argomento 2:'
            frame: ___ sono meno ___ di ___. Se ___, ___.
          - question: 'Argomento 3:'
            frame: ___ è così ___ come ___. Se ___, ___.
          - question: Esiste un equilibrio tra tradizione e cambiamento?
            frame: Secondo me, ___ perché ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Secondo periodo ipotetico** (Attività 1, 2, 3 e
          5) e **Confronti** (Attività 1, 2, 4 e 5). L'Attività 3 pratica anche i tempi
          del racconto (passato prossimo, imperfetto, trapassato prossimo). Il quaderno
          non indica i tempi: scegli le attività secondo il tempo della lezione. Il
          quaderno ha un link a una presentazione su gamma.app che non è inclusa nella
          piattaforma (il sito non è permesso); il suo titolo è «Vita Urbana vs Vita
          Rurale», quindi controlla che sia quella giusta.
      - id: n-intro
        anchor: intro
        text: Dai prima il tuo esempio. Ricorda la preposizione *di* nel confronto (*più paziente di quando ero bambino*).
      - id: n-warmup
        anchor: warmup
        text: Fai almeno due domande a ogni studente. Le frasi in corsivo sotto ogni domanda sono esempi di risposta.
      - id: n-act1
        anchor: act1
        text: >-
          Scrivi alla lavagna i ruoli del brainstorming. Nella Fase 3 controlla che dopo
          *se* usino il congiuntivo imperfetto (*se fossi*) e nella frase principale il
          condizionale (*sarei, avrei*).
      - id: n-act2
        anchor: act2
        text: Lavoro individuale → coppie → classe. Nella Fase 3 ogni studente presenta in meno di un minuto.
      - id: n-act3
        anchor: act3
        text: >-
          Ripassa prima la differenza tra passato prossimo (che cosa è successo),
          imperfetto (com'era la situazione) e trapassato prossimo (un'azione prima di
          un'altra nel passato).
      - id: n-act4
        anchor: act4
        text: >-
          Prepara prima della lezione una breve presentazione (foto e 2–3 frasi) di ogni
          comunità: Amish, Maasai, Auroville, nomadi digitali, kibbutz. Nella Fase 2 gli
          studenti possono cercare informazioni con il telefono.
      - id: n-act5
        anchor: act5
        text: Dividi la classe in due gruppi. Alla fine correggi i confronti e le frasi ipotetiche che hai sentito.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: identita-e-comunita-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: rules-ipotetico
        type: ruleSummary
        skill: Secondo periodo ipotetico
        rules:
          - text: 'Usiamo il **secondo periodo ipotetico** per parlare di situazioni **immaginarie** o poco probabili, nel presente o nel futuro.'
            examples:
              [
                Se fossi ricco,
                viaggerei di più.,
                Se vivessi in un altro paese,
                sarei più aperto a nuove culture.,
              ]
          - text: 'Struttura: **se + congiuntivo imperfetto**, **condizionale presente**. Il congiuntivo imperfetto sembra un passato, ma il significato è immaginario, non passato. In ebraico è come אם הייתי עשיר, הייתי מטייל יותר.'
            examples:
              - Se avessi più tempo, viaggerei di più.
              - Se mi sentissi più sicuro, parlerei di più durante le riunioni.
              - Se i giovani avessero più potere, la comunità cambierebbe più velocemente.
          - text: 'Dopo **se** non usiamo mai il condizionale.'
            examples: ['Se avessi tempo… (non: *se avrei tempo*)']
          - text: 'Possiamo anche cominciare con il condizionale: la frase con **se** va dopo.'
            examples: [Viaggerei di più se avessi più tempo.]
      - id: congiuntivo-table
        type: table
        caption: Congiuntivo imperfetto (dopo se)
        header: [Persona, parlare, vivere, avere, essere]
        rows:
          - [io, parlassi, vivessi, avessi, fossi]
          - [tu, parlassi, vivessi, avessi, fossi]
          - [lui / lei, parlasse, vivesse, avesse, fosse]
          - [noi, parlassimo, vivessimo, avessimo, fossimo]
          - [voi, parlaste, viveste, aveste, foste]
          - [loro, parlassero, vivessero, avessero, fossero]
      - id: condizionale-table
        type: table
        caption: Condizionale presente
        header: [Persona, viaggiare, cambiare, essere, avere]
        rows:
          - [io, viaggerei, cambierei, sarei, avrei]
          - [tu, viaggeresti, cambieresti, saresti, avresti]
          - [lui / lei, viaggerebbe, cambierebbe, sarebbe, avrebbe]
          - [noi, viaggeremmo, cambieremmo, saremmo, avremmo]
          - [voi, viaggereste, cambiereste, sareste, avreste]
          - [loro, viaggerebbero, cambierebbero, sarebbero, avrebbero]
      - id: rules-confronti
        type: ruleSummary
        skill: Confronti
        rules:
          - text: '**più + aggettivo + di** / **meno + aggettivo + di**: per dire che una cosa ha una qualità di più o di meno.'
            examples:
              [
                Questa città è più grande di quella.,
                Non sarei il tesoriere perché sono meno organizzato.,
              ]
          - text: '**di + articolo** diventa una sola parola: *di + il = del, di + la = della, di + i = dei, di + gli = degli, di + le = delle*.'
            examples:
              - Gli Amish sono più tradizionali dei nomadi digitali.
              - Il mio lavoro è più interessante del tuo.
              - La vita in campagna è più tranquilla della vita in città.
          - text: '**più… che**: quando confrontiamo due verbi o due aggettivi.'
            examples: [È più facile cambiare che mantenere la tradizione.]
          - text: '**così… come** / **tanto… quanto**: per dire che due cose sono uguali.'
            examples:
              [Questa città è così interessante come Roma., Roma è tanto bella quanto Milano.]
          - text: '**rispetto a** e **mentre** aiutano a confrontare due persone o due situazioni.'
            examples:
              - I nomadi digitali sono meno legati a un luogo rispetto ai Maasai.
              - Sono più formale al lavoro, mentre con gli amici sono più rilassato.
      - id: rules-narrazione
        type: ruleSummary
        skill: Narrazione con tempi diversi
        rules:
          - text: '**Passato prossimo**: azioni finite nel passato.'
            examples: [Ho visitato Roma.]
          - text: "**Imperfetto**: abitudini, descrizioni e situazioni nel passato. Per un'azione in corso usiamo anche **stavo + gerundio**."
            examples:
              [Da bambino giocavo molto., Mentre camminavo (stavo camminando) ho visto un amico.]
          - text: "**Trapassato prossimo** (*avevo / ero* + participio): un'azione successa **prima** di un'altra azione nel passato."
            examples:
              [
                Prima di trasferirmi non avevo mai vissuto da solo.,
                Quando sono arrivato la festa era già finita.,
              ]
          - text: '**Presente**: la realtà di oggi. **Futuro**: piani e previsioni.'
            examples: [Vivo a Tel Aviv., Domani studierò italiano.]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le regole con il gruppo e chiedi a ogni studente un esempio nuovo sulla sua identità o sulla sua comunità.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: identita-e-comunita-compiti
    title: Compiti
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti
      - id: classic-title
        type: heading
        level: 3
        text: Versione classica
      - id: hw-1
        type: discussionQuestions
        title: 'Parte 1: I tempi del racconto. Completa con il verbo nella forma giusta.'
        items:
          - question: Ieri io ___ (visitare) un museo.
          - question: Quando ero piccolo, ___ (giocare) sempre al parco.
          - question: Adesso io ___ (lavorare) in ufficio.
          - question: Domani ___ (studiare) italiano.
          - question: Mentre io ___ (camminare), ho visto un amico.
      - id: hw-2
        type: discussionQuestions
        title: 'Parte 2: Secondo periodo ipotetico. Completa con se + congiuntivo imperfetto e il condizionale.'
        items:
          - question: Se io ___ (avere) più tempo, ___ (viaggiare) di più.
          - question: Se noi ___ (vivere) in Italia, ___ (parlare) meglio italiano.
          - question: Se lui ___ (studiare) di più, ___ (avere) risultati migliori.
          - question: Se io ___ (essere) te, ___ (cambiare) lavoro.
      - id: hw-3
        type: discussionQuestions
        title: 'Parte 3: Confronti. Completa le frasi.'
        items:
          - question: Questa città è ___ (grande) ___ quella.
          - question: La vita in campagna è ___ (tranquilla) ___ vita in città.
          - question: Il mio lavoro è ___ (interessante) ___ tuo.
          - question: Roma è ___ (bella) ___ Milano.
      - id: hw-4
        type: reflection
        prompt: 'Parte 4: Scrivi 6–8 frasi sul tema «La mia identità oggi e come è cambiata». Usa 2 tempi diversi (passato + presente o futuro), 1 frase con il secondo periodo ipotetico e 2 confronti.'
      - id: mori-title
        type: heading
        level: 3
        text: Compiti con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia un messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Passo 1: Conversazione'
        intro: 'Durante la conversazione dai almeno **5 risposte complete**. Usa 2 tempi diversi (passato + presente), 1 frase ipotetica e 1 confronto.'
        message: Ciao Mori! Voglio praticare i tempi del racconto, i confronti e il secondo periodo ipotetico. Fammi domande sulla mia identità, sul mio passato e sul mio futuro.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Passo 2: Una domanda più difficile'
        intro: 'Rispondi con una breve storia al passato, un confronto e una frase ipotetica.'
        message: Fammi una domanda più difficile.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Passo 3: Correzione'
        intro: Alla fine della conversazione invia questo messaggio.
        message: Correggi le mie frasi e spiegami gli errori.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**
    teacherNotes:
      - id: n-key
        anchor: hw-1
        text: >-
          Soluzioni. Parte 1: ho visitato; giocavo; lavoro; studierò; camminavo / stavo
          camminando. Parte 2: avessi, viaggerei; vivessimo, parleremmo; studiasse,
          avrebbe; fossi, cambierei. Parte 3: più (meno) grande di; più (meno) tranquilla
          della; più (meno) interessante del; più (meno) bella di / così bella come.

