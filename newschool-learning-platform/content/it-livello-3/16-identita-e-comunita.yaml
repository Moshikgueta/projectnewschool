activities:
  - slug: identita-e-comunita-ipotetico
    title: 'Secondo periodo ipotetico: se fossi, sarei'
    minutes: 8
    items:
      - id: avessi
        type: multipleChoice
        prompt: Se ___ più tempo, viaggerei di più.
        options:
          - { text: avessi, correct: true }
          - {
              text: avrei,
              feedback: 'Dopo *se* non usiamo il condizionale. Usiamo il congiuntivo imperfetto: *se avessi*.',
            }
          - {
              text: ho,
              feedback: '*Ho* è presente indicativo. Per una situazione immaginaria usiamo *se* + congiuntivo imperfetto: *se avessi*.',
            }
      - id: fossi-cambierei
        type: fillBlank
        prompt: Completa con *essere* (congiuntivo imperfetto) e *cambiare* (condizionale).
        text: Se io ___ te, ___ lavoro.
        blanks: [[fossi], [cambierei, io cambierei]]
      - id: parleremmo
        type: multipleChoice
        prompt: Se vivessimo in Italia, ___ meglio italiano.
        options:
          - { text: parleremmo, correct: true }
          - {
              text: parlassimo,
              feedback: '*Parlassimo* è congiuntivo imperfetto: va dopo *se*. Nella frase principale usiamo il condizionale: *parleremmo*.',
            }
          - {
              text: parlavamo,
              feedback: "*Parlavamo* è imperfetto: parla del passato. Per il risultato di un'ipotesi usiamo il condizionale: *parleremmo*.",
            }
      - id: se-avrei
        type: trueFalse
        prompt: 'La frase *Se avrei più tempo, viaggerei di più* è corretta.'
        answer: false
        feedback:
          correct: 'Giusto! Dopo *se* non usiamo il condizionale: *Se avessi più tempo, viaggerei di più.*'
          incorrect: 'Dopo *se* usiamo il congiuntivo imperfetto, non il condizionale: *Se avessi più tempo…*'
      - id: forme
        type: matching
        prompt: Unisci ogni verbo alla sua forma di *io* al congiuntivo imperfetto.
        pairs:
          - [avere, avessi]
          - [essere, fossi]
          - [vivere, vivessi]
          - [parlare, parlassi]
          - [sentirsi, mi sentissi]
      - id: studiasse-avrebbe
        type: fillBlank
        prompt: Completa con *studiare* (congiuntivo imperfetto) e *avere* (condizionale).
        text: Se lui ___ di più, ___ risultati migliori.
        blanks: [[studiasse], [avrebbe]]
      - id: significato
        type: multipleChoice
        prompt: '*Se fossi ricco, viaggerei di più.* Che cosa significa questa frase?'
        options:
          - { text: Non sono ricco. È una situazione immaginaria., correct: true }
          - {
              text: Ero ricco nel passato.,
              feedback: '*Fossi* sembra un passato, ma qui il significato è immaginario: oggi non sono ricco.',
            }
          - {
              text: Sono ricco e viaggio molto.,
              feedback: 'Il secondo periodo ipotetico parla di una situazione non reale: non sono ricco e non viaggio molto.',
            }
      - id: ordina-paese
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Se vivessi in un altro paese, sarei più aperto.

  - slug: identita-e-comunita-confronti
    title: 'Confronti: più… di, meno… di, così… come'
    minutes: 8
    items:
      - id: dei-nomadi
        type: multipleChoice
        prompt: Gli Amish sono più tradizionali ___ nomadi digitali.
        options:
          - { text: dei, correct: true }
          - {
              text: di,
              feedback: 'Davanti a *i nomadi* usiamo *di + i = dei*: *più tradizionali dei nomadi digitali*.',
            }
          - {
              text: che,
              feedback: 'Con due persone o due gruppi usiamo *di* (+ articolo): *dei nomadi digitali*.',
            }
      - id: di-quella
        type: fillBlank
        prompt: Completa il confronto.
        text: Questa città è più grande ___ quella.
        blanks: [[di]]
      - id: mentre
        type: multipleChoice
        prompt: Sono più formale al lavoro, ___ con gli amici sono più rilassato.
        options:
          - { text: mentre, correct: true }
          - {
              text: perché,
              feedback: '*Perché* dà una causa. Qui confrontiamo due situazioni diverse: *mentre*.',
            }
          - {
              text: così,
              feedback: '*Così… come* dice che due cose sono uguali. Qui le situazioni sono diverse: *mentre*.',
            }
      - id: cosi-come
        type: trueFalse
        prompt: '*Così… come* dice che due cose sono uguali: *Questa città è così interessante come Roma.*'
        answer: true
        feedback:
          correct: Giusto! Le due città sono interessanti nello stesso modo.
          incorrect: '*Così… come* (o *tanto… quanto*) esprime uguaglianza: le due città sono interessanti nello stesso modo.'
      - id: che-verbi
        type: multipleChoice
        prompt: È più facile cambiare ___ mantenere la tradizione.
        options:
          - { text: che, correct: true }
          - {
              text: di,
              feedback: 'Quando confrontiamo due verbi (*cambiare*, *mantenere*) usiamo *più… che*.',
            }
          - {
              text: come,
              feedback: "*Come* va con *così* per l'uguaglianza. Con *più* e due verbi usiamo *che*.",
            }
      - id: del-tuo
        type: multipleChoice
        prompt: Quale frase è corretta?
        options:
          - { text: Il mio lavoro è più interessante del tuo., correct: true }
          - {
              text: Il mio lavoro è più interessante di il tuo.,
              feedback: '*Di + il* diventa una sola parola: *del*. *Più interessante del tuo.*',
            }
          - {
              text: Il mio lavoro è più interessante che il tuo.,
              feedback: 'Confrontiamo due cose (il mio lavoro e il tuo): usiamo *di* + articolo, *del tuo*.',
            }
      - id: di-articolo
        type: matching
        prompt: Unisci *di* + articolo alla sua forma.
        pairs:
          - [di + il, del]
          - [di + la, della]
          - [di + i, dei]
          - [di + gli, degli]
          - [di + le, delle]
      - id: ordina-mentalita
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: La mia mentalità è più aperta di prima.
