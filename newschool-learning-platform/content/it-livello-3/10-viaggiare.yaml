activities:
  - slug: viaggiare-passato
    title: 'Passato prossimo: sono stato, ho perso, non ho mai…'
    minutes: 8
    items:
      - id: e-stata
        type: multipleChoice
        prompt: "L'estate scorsa Marta ___ in Giappone."
        options:
          - { text: è stata, correct: true }
          - { text: ha stata, feedback: "Il verbo *essere* usa l'ausiliare *essere*: *è stata*." }
          - {
              text: è stato,
              feedback: 'Con *essere* il participio si accorda con il soggetto. Marta è femminile: *è stata*.',
            }
      - id: hai-mai-visitato
        type: fillBlank
        prompt: Completa con il passato prossimo di *visitare* (tu).
        text: ___ mai ___ Parigi?
        blanks: [[Hai, hai, Tu hai, tu hai], [visitato]]
      - id: con-ieri
        type: trueFalse
        prompt: 'In italiano il passato prossimo si può usare con un momento preciso: *ieri, la settimana scorsa, nel 2020*.'
        answer: true
        feedback:
          correct: 'Giusto! *Nel 2025 mi sono perso a Venezia.* Il passato prossimo va bene anche con un momento preciso.'
          incorrect: "In italiano il passato prossimo si usa anche con un momento preciso: *Ieri ho prenotato l'albergo. Nel 2025 mi sono perso a Venezia.*"
      - id: unisci-participi
        type: matching
        prompt: Unisci ogni verbo alla sua forma di *io* al passato prossimo.
        pairs:
          - [perdere, ho perso]
          - [prendere, ho preso]
          - [vedere, ho visto]
          - [rimanere, sono rimasto]
          - [fare, ho fatto]
      - id: sono-arrivato
        type: multipleChoice
        prompt: "Luca racconta: Quando ___ all'aeroporto, ho preso un taxi."
        options:
          - { text: sono arrivato, correct: true }
          - {
              text: ho arrivato,
              feedback: 'Il verbo *arrivare* è un verbo di movimento: usa *essere*, *sono arrivato*.',
            }
          - {
              text: arrivato,
              feedback: "Il passato prossimo ha bisogno dell'ausiliare: *sono arrivato*.",
            }
      - id: sono-partiti
        type: fillBlank
        prompt: Completa con il passato prossimo di *partire*.
        text: Ieri i miei amici ___ per Roma.
        blanks: [[sono partiti]]
      - id: non-ho-mai
        type: multipleChoice
        prompt: '*Hai mai perso il volo?* Qual è la risposta giusta?'
        options:
          - { text: 'No, non ho mai perso il volo.', correct: true }
          - {
              text: 'No, ho mai perso il volo.',
              feedback: 'Nella negazione serve *non* prima del verbo: *Non ho mai perso…*',
            }
          - {
              text: 'No, non mai ho perso il volo.',
              feedback: "*Mai* va tra l'ausiliare e il participio: *non ho mai perso*.",
            }
      - id: ordina-passaporto
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Non ho mai perso il passaporto.

  - slug: viaggiare-trapassato
    title: 'Trapassato prossimo: avevo già…'
    minutes: 8
    items:
      - id: avevo-dimenticato
        type: multipleChoice
        prompt: "Quando sono arrivato all'aeroporto, ___ già il passaporto."
        options:
          - { text: avevo dimenticato, correct: true }
          - {
              text: ho dimenticato,
              feedback: "Dimenticare il passaporto è successo **prima** di arrivare: per l'azione precedente usiamo il trapassato prossimo, *avevo dimenticato*.",
            }
          - {
              text: dimenticavo,
              feedback: "*Dimenticavo* è imperfetto. Per un'azione successa prima di un'altra usiamo *avevo dimenticato*.",
            }
      - id: era-partito
        type: fillBlank
        prompt: "Completa con l'ausiliare giusto al trapassato prossimo."
        text: Quando siamo arrivati alla stazione, il treno ___ già partito.
        blanks: [[era]]
      - id: stessa-forma
        type: trueFalse
        prompt: Il trapassato prossimo ha la stessa forma per tutti i soggetti.
        answer: false
        feedback:
          correct: "Giusto! L'ausiliare cambia con la persona: *avevo, avevi, aveva, avevamo, avevate, avevano*."
          incorrect: "In italiano l'ausiliare cambia con la persona: *io avevo prenotato, tu avevi prenotato, noi avevamo prenotato…*"
      - id: unisci-persone
        type: matching
        prompt: Unisci ogni persona alla forma giusta del trapassato prossimo.
        pairs:
          - [io, avevo prenotato]
          - [tu, avevi prenotato]
          - [lui / lei, aveva prenotato]
          - [noi, avevamo prenotato]
          - [loro, avevano prenotato]
      - id: prima-dopo
        type: multipleChoice
        prompt: "*Quando Sara è arrivata a Venezia, aveva già prenotato l'albergo.* Quale azione è successa prima?"
        options:
          - { text: "prenotare l'albergo", correct: true }
          - {
              text: arrivare a Venezia,
              feedback: "*È arrivata* è al passato prossimo: è l'azione successiva. Il trapassato (*aveva prenotato*) indica l'azione precedente.",
            }
      - id: non-avevo-mai
        type: fillBlank
        prompt: Completa con il trapassato prossimo di *mangiare* (io).
        text: Prima di questo viaggio, non ___ mai ___ insetti fritti.
        blanks: [[avevo], [mangiato]]
      - id: era-stata
        type: multipleChoice
        prompt: Quando è cominciato il corso, Marta ___ in Italia tre volte.
        options:
          - { text: era già stata, correct: true }
          - {
              text: aveva già stata,
              feedback: "Il verbo *essere* usa l'ausiliare *essere* anche nel trapassato: *era stata*.",
            }
          - {
              text: era già stato,
              feedback: 'Con *essere* il participio si accorda. Marta è femminile: *era già stata*.',
            }
      - id: ordina-albergo
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Avevo già prenotato l'albergo.
