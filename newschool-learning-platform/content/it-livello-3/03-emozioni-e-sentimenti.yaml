vocabulary:
  - slug: emozioni-e-sentimenti
    title: Emozioni e sentimenti
    items: *emozioni-e-sentimenti-words

activities:
  - slug: emozioni-e-sentimenti-aggettivi
    title: 'Aggettivi per le emozioni: felice, nervoso, deluso'
    minutes: 8
    items:
      - id: nervosa
        type: multipleChoice
        prompt: Marta ha perso il telefono. Si è sentita molto ___.
        options:
          - { text: nervosa, correct: true }
          - {
              text: nervoso,
              feedback: "L'aggettivo si accorda con la persona. Marta è femminile: *nervosa*.",
            }
          - {
              text: nervosi,
              feedback: '*Nervosi* è plurale. Marta è una persona sola, femminile: *nervosa*.',
            }
      - id: soddisfatti
        type: fillBlank
        prompt: Completa con l'aggettivo *soddisfatto* nella forma giusta.
        text: Gli studenti sono ___ perché hanno superato l'esame.
        blanks: [[soddisfatti]]
      - id: situazioni
        type: matching
        prompt: Unisci ogni situazione all'emozione.
        pairs:
