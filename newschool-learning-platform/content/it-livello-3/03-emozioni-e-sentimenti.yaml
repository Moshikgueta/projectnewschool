# Cycle "Emozioni e sentimenti", converted from the Italian level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-3
slug: emozioni-e-sentimenti
title: Emozioni e sentimenti
goal: Descrivere le emozioni con gli aggettivi e raccontare esperienze con il passato prossimo.
position: 3
status: published

review:
  - >-
    The two workbook exercises ("Aggettivi per le emozioni" and "Passato prossimo:
    esperienze") are NEW: the notebook has no self-study exercises. They were written
    from the cycle's summary rules, the activity examples and its vocabulary. Please
    check level, wording and every right answer before students see them.
  - >-
    Left out: the gamma.app lesson slides (slide links are not allowed; mentioned in a
    teacher note), the "Data / Partecipanti" lines and all "Studente 1/2/3" lines (the
    platform has answer boxes). The Quizlet link's "?new" parameter was removed.
    Privacy: the introduction example "Sono Shachar" was changed to "Sono Marco".
  - >-
    The lesson summary ("סיכום השיעור"), the classic homework and the Mori homework
    are written in HEBREW in the source. They were translated into Italian, like the
    rest of the course (the adjective list keeps the Hebrew glosses in a table). "Hi
    Mori!" → "Ciao Mori!". Please check the translations.
  - >-
    Summary correction: the source says adjectives go "before the noun" (לפני שם עצם)
    with the example "una situazione difficile", where the adjective comes AFTER the
    noun. Now: "di solito dopo il nome". ADDED (please confirm): agreement of
    adjectives (nervoso / nervosa / nervosi / nervose; felice / felici); "mi sono
    sentito / sentita" with essere for sentirsi; "mai" between the auxiliary and the
    participle (Hai mai viaggiato?); irregular participles from the lesson (perso,
    visto, fatto, preso, successo). The "טיפים להצלחה" (tips) became a callout.
  - >-
    Warm-up: the instruction "Rispondi … usando il passato prossimo" does not fit
    questions 1, 6 and 7 (present tense); now "Usa il passato prossimo quando racconti
    un'esperienza". Masculine-only forms got the feminine (orgoglioso / orgogliosa,
    grato / grata, sentito / sentita). Frames were added to every question (only
    question 2 had one).
  - >-
    Classic homework (now "Compito scritto"): part 1 (fill in the participle) and part 4
    (correct the mistakes) are reflection boxes; their answer keys are teacher notes.
    Part 4 "Hai mai vai in Italia" is corrected as "Sei mai andato / andata in
    Italia?"; "Mi sento nervoso ieri" → "Ieri mi sono sentito / sentita nervoso /
    nervosa". Mori steps 2 and 4 of the source are instructions, now in the intro of
    the messages.
  - >-
    The source cycle has no timings and no lesson plan; none were invented. Activity 1
    uses the film "Inside Out" (title only, no link). Activity 1, phase 3: "almeno 3-5
    aggettivi" → "da 3 a 5 aggettivi".
  - >-
    Vocabulary: "Calmarsi" and "Rilassarsi" were both glossed להירגע: now "להירגע
    (אחרי כעס או לחץ)" and "להירגע, לנוח". "Nervoso – עצבני" → "לחוץ / עצבני" (in
    Italian nervoso is mostly "nervous, tense"). "Provare – לחוות" → "לחוות / להרגיש
    (רגש)". "All'improvviso – בפתאומיות" → "לפתע". "Sentimento – תחושה" → "רגש /
    תחושה". Please check.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: emozioni-e-sentimenti-classe
    title: 'In classe: Emozioni e sentimenti'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Emozioni e sentimenti
      - id: skills
        type: cycleOverview
        skills:
          - name: Aggettivi per le emozioni
            description: 'Descrivere come ci sentiamo: *sono felice, mi sento nervoso / nervosa, una situazione difficile*'
          - name: 'Passato prossimo: esperienze'
            description: 'Raccontare esperienze e fare domande: *Hai mai perso qualcosa? Sì, ho perso il telefono. Mi sono sentito molto nervoso.*'
      - id: quizlet
        type: externalLink
        label: Emozioni e sentimenti su Quizlet
        url: https://quizlet.com/br/1171536089/emozioni-e-sentimenti-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduzione
      - id: intro
        type: sentenceFrame
        frame: Io sono ___. Quando parlo italiano mi sento ___.
        example: Sono Marco. Quando parlo italiano mi sento nervoso.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup-hint
        type: callout
        tone: info
        text: Rispondi con **frasi complete**. Usa il **passato prossimo** quando racconti un'esperienza.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Ti senti a tuo agio a parlare delle tue emozioni? Perché?
            frame: Sì / No, (non) mi sento a mio agio perché ___.
          - question: Ti è mai capitato di sentirti orgoglioso / orgogliosa di te stesso / stessa? Quando?
            frame: Ho provato orgoglio quando ___.
          - question: Hai mai provato gelosia verso un amico? Che cosa è successo?
            frame: Sì, una volta ___. / No, non mi è mai successo.
          - question: Hai mai nascosto i tuoi sentimenti a qualcuno? Perché?
            frame: Sì, ho nascosto ___ perché ___.
          - question: Hai mai provato senso di colpa per qualcosa di piccolo?
            frame: Sì, una volta ho ___ e mi sono sentito / sentita in colpa.
          - question: Come ti senti dopo una lunga giornata di lavoro? Usa almeno 3 aggettivi.
            frame: Dopo una lunga giornata di lavoro mi sento ___, ___ e ___.
          - question: Qual è una cosa semplice che ti rende felice?
            frame: Mi rende felice ___.
          - question: Ti è mai capitato di sentirti grato / grata verso qualcuno?
            frame: Sì, mi sono sentito / sentita grato / grata verso ___ quando ___.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: Le nostre emozioni'
        skills: [Aggettivi per le emozioni]
        steps:
          - '**Introduzione:** parliamo del film *Inside Out*. Lo conosci? Quali emozioni conosci?'
          - '**Discussione in classe:** rispondi con frasi complete alle domande qui sotto.'
          - '**Attività creativa:** inventa una nuova emozione e descrivila con 3-5 aggettivi. Usa la struttura qui sotto.'
          - "**Condivisione:** presenta la tua emozione alla classe. I compagni possono fare una domanda o dare un'opinione."
        example: |-
          *Questa emozione si chiama «confusione felice».*
          *È strana, leggera e imprevedibile.*
          *Quando una persona prova questa emozione, non capisce tutto ma si sente bene.*
          *È importante perché aiuta a vedere le cose in modo diverso.*
      - id: act1-discussion
        type: discussionQuestions
        title: Discussione in classe
        items:
          - question: Quale emozione ti rappresenta di più? Perché?
            frame: L'emozione che mi rappresenta di più è ___ perché ___.
          - question: Secondo te, c'è un'emozione più forte nella tua personalità?
            frame: Secondo me, nella mia personalità ___ è più forte.
          - question: Questa emozione cambia in situazioni diverse?
            frame: Sì, quando ___, ___. / No, ___.
      - id: act1-create
        type: discussionQuestions
        title: La mia nuova emozione
        items:
          - question: Come si chiama?
            frame: Questa emozione si chiama ___.
          - question: Com'è? (3-5 aggettivi)
            frame: È ___, ___ e ___.
          - question: Che cosa succede quando una persona prova questa emozione?
            frame: Quando una persona prova questa emozione, ___.
          - question: Perché è importante?
            frame: Questa emozione è importante perché ___.
      - id: act2
        type: classActivity
        title: "Attività 2: Indovina l'emozione"
        skills: [Aggettivi per le emozioni, 'Passato prossimo: esperienze']
        steps:
          - Lavorate in coppie o in piccoli gruppi.
          - "**Preparazione:** scegli un'emozione (senza dirla) e pensa a una situazione reale o inventata."
          - "**Racconto:** racconta l'esperienza con il passato prossimo, senza dire il nome dell'emozione. Usa almeno 2 aggettivi per descrivere come ti sei sentito / sentita."
          - '**Indovinare:** gli altri fanno domande o cercano di indovinare: *Hai provato delusione? Hai provato vergogna? Ti sei sentito nervoso o triste?*'
          - '**Conferma e cambio turno:** confermi la risposta corretta. Poi tocca a un altro studente.'
          - '**Estensione (facoltativa):** dopo aver indovinato, fate una domanda: *Quando ti è successo? Perché ti sei sentito / sentita così?*'
        example: |-
          *Ho provato questa emozione quando non ho superato un esame. Mi sono sentito molto triste e deluso.*
          *Hai provato delusione?*
      - id: act2-story
        type: discussionQuestions
        title: La mia esperienza
        items:
          - question: Che cosa è successo?
            frame: Ho provato questa emozione quando ___.
          - question: Come ti sei sentito / sentita?
            frame: Mi sono sentito / sentita ___ e ___.
      - id: act3
        type: classActivity
        title: 'Attività 3: Ricordi importanti'
        skills: ['Passato prossimo: esperienze', Aggettivi per le emozioni]
        steps:
          - "**Discussione in classe:** che cos'è un ricordo importante per te? Secondo te, tutti i ricordi sono importanti o solo alcuni? Perché? Rispondi con esempi semplici."
          - '**In coppia:** racconta **due esperienze importanti della tua vita**. Usa il passato prossimo per gli eventi e 2-3 aggettivi per descrivere emozioni o situazioni.'
          - '**Rotazione:** cambia partner e racconta di nuovo le tue esperienze. Prova a parlare in modo più chiaro e aggiungi un dettaglio in più.'
          - '**Condivisione in classe:** racconta alla classe un ricordo interessante del tuo partner.'
        example: |-
          *Ho fatto un viaggio importante con la mia famiglia. All'inizio ero molto emozionato, poi mi sono sentito rilassato. È stato un momento speciale perché eravamo tutti insieme.*
      - id: act3-memories
        type: discussionQuestions
        title: I miei due ricordi importanti
        items:
          - question: Primo ricordo
            frame: Prima ___. Poi ___. Alla fine ___. Mi sono sentito / sentita ___ perché ___.
          - question: Secondo ricordo
            frame: Prima ___. Poi ___. Alla fine ___. Mi sono sentito / sentita ___ perché ___.
      - id: act4
        type: classActivity
        title: 'Attività 4: Hai mai…?'
        skills: ['Passato prossimo: esperienze']
        steps:
          - "**Spiegazione:** *Hai mai + participio passato* si usa per parlare di esperienze nella vita, senza dire quando. Esempi: *Hai mai viaggiato all'estero? Hai mai dimenticato un compleanno?*"
          - '**In gruppo o in cerchio:** scegli un compagno e fagli una domanda con *Hai mai…?*'
          - '**Risposta completa:** il compagno risponde con il passato prossimo e un aggettivo: *Sì, mi è successo. Mi sono sentito in imbarazzo.* Oppure: *No, non mi è mai successo.*'
          - '**Continuazione:** chi ha risposto aggiunge un breve dettaglio (facoltativo) e fa una nuova domanda a un altro compagno.'
          - '**Estensione (facoltativa):** aggiungete una domanda di approfondimento: *Quando è successo? Perché è successo?*'
        example: |-
          *Hai mai perso qualcosa di importante?*
          *Sì, ho perso il telefono. Mi sono sentito molto nervoso.*
      - id: act4-questions
        type: discussionQuestions
        title: Le mie domande
        items:
          - question: La mia domanda
            frame: Hai mai ___?
          - question: La mia risposta
            frame: Sì, ___. Mi sono sentito / sentita ___. / No, non mi è mai successo.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Aggettivi per le emozioni** (introduzione,
          Attività 1 e 2) e **Passato prossimo: esperienze** (riscaldamento, Attività 2, 3
          e 4). Il quaderno non indica i tempi: scegli le attività in base al tempo
          disponibile. La presentazione della lezione (gamma.app) non è inclusa nella
          piattaforma (i link alle presentazioni non sono permessi).
      - id: n-act1
        anchor: act1
        text: >-
          Chiedi chi conosce il film *Inside Out*; se serve, spiega brevemente l'idea (le
          emozioni sono personaggi). Durante la condivisione correggi e aiuta a migliorare
          l'uso degli aggettivi (accordo maschile / femminile).
      - id: n-act3
        anchor: act3
        text: Durante la condivisione correggi e aiuta a migliorare le frasi.
      - id: n-act4
        anchor: act4
        text: Ascolta, correggi e aiuta a migliorare le frasi.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: emozioni-e-sentimenti-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Riassunto della lezione: emozioni e passato prossimo'
      - id: rules-aggettivi
        type: ruleSummary
        skill: Aggettivi per le emozioni
        rules:
          - text: 'Usiamo gli **aggettivi** per descrivere emozioni e persone: dopo **essere**, dopo **sentirsi** e, di solito, **dopo il nome**.'
            examples:
              - Sono felice.
              - Mi sento nervoso.
              - È una situazione difficile.
          - text: "L'aggettivo si accorda con la persona: **-o / -a / -i / -e**. Gli aggettivi in **-e** hanno una forma per il maschile e il femminile (*-e*) e una per il plurale (*-i*)."
            examples:
              - Marco è nervoso. / Marta è nervosa.
              - I miei amici sono delusi. / Le mie amiche sono deluse.
              - Lui è felice. / Lei è felice. / Loro sono felici.
      - id: adj-table
        type: table
        caption: Aggettivi della lezione
        header: [Italiano, עברית]
        rows:
          - [felice, שמח]
          - [triste, עצוב]
          - [nervoso / nervosa, לחוץ / עצבני]
          - [rilassato / rilassata, רגוע]
          - [deluso / delusa, מאוכזב]
          - [imbarazzato / imbarazzata, נבוך]
      - id: rules-passato
        type: ruleSummary
        skill: 'Passato prossimo: esperienze'
        rules:
          - text: 'Il **passato prossimo** si usa per parlare di esperienze successe nel passato. Struttura: **avere / essere + participio passato**.'
            examples: [Ho visto., Ho parlato., Sono andato / andata.]
          - text: 'Con *sentirsi* usiamo **essere**, e il participio si accorda con la persona.'
            examples: [Mi sono sentito nervoso. / Mi sono sentita nervosa.]
          - text: 'Alcuni participi della lezione sono irregolari.'
            examples:
              [
                'perdere → perso, vedere → visto, fare → fatto, prendere → preso, succedere → successo',
              ]
          - text: "Per chiedere di un'esperienza nella vita, senza dire quando: **Hai mai + participio passato?** *Mai* va tra l'ausiliare e il participio."
            examples:
              - Hai mai viaggiato all'estero?
              - Hai mai perso qualcosa?
              - Sei mai andato in Italia?
          - text: 'Risposte possibili:'
            examples: ['Sì, mi è successo.', 'No, non mi è mai successo.']
          - text: "**Nella lezione:** descrivere un'esperienza, descrivere un'emozione, fare domande."
            examples:
              - Ho perso il telefono.
              - Mi sono sentito nervoso.
              - Hai mai fatto qualcosa di difficile?
      - id: success-tips
        type: callout
        tone: tip
        title: Consigli per riuscire
        text: |-
          Usa gli aggettivi per aggiungere un'emozione.
          Prova a dare risposte complete.
          Aggiungi un piccolo esempio.
          Esercitati con le domande con *Hai mai…?*
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa le due abilità e chiedi a ogni studente una domanda con *Hai mai…?* e una risposta con un aggettivo.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: emozioni-e-sentimenti-compiti
    title: Compiti con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti
      - id: mori-title
        type: heading
        level: 3
        text: Compiti con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia i messaggi uno alla volta e inviali.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Passo 1: Le domande'
        intro: Poi rispondi ad almeno 5 domande. Usa il passato prossimo e gli aggettivi.
        message: Ciao Mori! Fammi domande con «Hai mai…?» sulle esperienze e sulle emozioni.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Passo 2: Una domanda più difficile'
        intro: "Rispondi con un'esperienza, un'emozione e una ragione."
        message: Fammi una domanda più difficile.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Passo 3: Correzione'
        intro: Alla fine, invia questo messaggio.
        message: Correggi le mie frasi e spiegami gli errori.
      - id: written-title
        type: heading
        level: 3
        text: Compito scritto
      - id: written-1
        type: reflection
        prompt: |-
          **Parte 1: completa le frasi con il participio passato.** Scrivi le frasi complete.
          1. Ho ___ (perdere) il telefono ieri.
          2. Mi sono ___ (sentire) molto nervoso.
          3. Ho ___ (incontrare) un amico.
          4. Sono ___ (andare) a casa presto.
      - id: written-2
        type: discussionQuestions
        title: 'Parte 2: Hai mai…? Scrivi risposte complete.'
        items:
          - question: Hai mai perso qualcosa di importante?
            frame: Sì, ho perso ___. Mi sono sentito / sentita ___. / No, non mi è mai successo.
          - question: Hai mai provato vergogna?
            frame: Sì, quando ___.
          - question: Hai mai fatto qualcosa di difficile?
            frame: Sì, ho ___. È stato ___.
      - id: written-3
        type: reflection
        prompt: "**Parte 3: «Un'esperienza importante».** Scrivi 5-7 frasi. Usa il passato prossimo, almeno 2 aggettivi e un'emozione."
      - id: written-4
        type: reflection
        prompt: |-
          **Parte 4: correggi gli errori.** Scrivi le frasi corrette.
          1. Ho perde il telefono.
          2. Mi sento nervoso ieri.
          3. Hai mai vai in Italia?
          4. Sono mangiato pizza.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**
    teacherNotes:
      - id: n-written-1
        anchor: written-1
        text: 'Soluzioni della Parte 1: *perso, sentito / sentita, incontrato, andato / andata*.'
      - id: n-written-4
        anchor: written-4
        text: >-
          Soluzioni della Parte 4: 1. *Ho perso il telefono.* 2. *Ieri mi sono sentito /
          sentita nervoso / nervosa.* 3. *Sei mai andato / andata in Italia?* 4. *Ho
          mangiato la pizza.*

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: emozioni-e-sentimenti-pratica
    book: workbook
