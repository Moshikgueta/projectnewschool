    blocks:
      - id: intro
        type: text
        text: Esercitati sulle due abilità del ciclo. Ogni risposta viene corretta subito e puoi riprovare.
      - id: ex-aggettivi
        type: activity
        activity: emozioni-e-sentimenti-aggettivi
      - id: ex-passato
        type: activity
        activity: emozioni-e-sentimenti-passato

