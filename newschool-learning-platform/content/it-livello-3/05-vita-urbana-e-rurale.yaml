# Cycle "Vita urbana vs vita rurale", converted from the Italian level 3 digital
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-3
slug: vita-urbana-e-rurale
title: Vita urbana vs vita rurale
goal: Descrivere luoghi con le frasi relative (che, cui, dove) ed esprimere opinioni sulla vita in città e in campagna.
position: 5
status: published

review:
  - >-
    The two workbook exercises ("Frasi relative" and "Esprimere opinioni") are NEW:
    the notebook has no self-correcting exercises. They were written from the cycle's
    summary rules, the class examples and its vocabulary. Please check level, wording
    and every right answer before students see them.
  - >-
    Summary (rules translated from English, wrong for Italian): the relative-pronoun
    table was labelled "Who (che)", "Which (che)", "That (che)", "Where (dove)". In
    Italian there is one pronoun, "che", for people and things (subject or object,
    it never changes), and "dove" for places. The rule is rewritten that way. The
    skills name "che / cui / dove", but "cui" was never explained: a rule was ADDED
    (preposition + cui: in cui, con cui, di cui; "in cui" = "dove" for places), with
    one workbook item. "Definenti / non definenti" (a calque of "defining /
    non-defining") → "relative restrittive (senza virgole) / esplicative (con le
    virgole)". Please confirm.
  - >-
    Summary, opinions: ADDED that "penso che / credo che" take the congiuntivo (the
    notebook's own examples use it: "Penso che la vita nei borghi sia…") while
    "secondo me / dal mio punto di vista" take the indicativo; "da una parte" is now
    "da una parte… dall'altra". The summary was in Hebrew and is now in Italian; the
    Hebrew translations of the examples were left out.
  - >-
    Corrections: warm-up 1 "Preferiresti vivere in una zona urbana o rurale che offre
    una migliore qualità della vita per te?" → "Preferiresti vivere in una zona urbana
    o in una zona rurale? Quale ti offre una qualità della vita migliore?"; warm-up 5
    example "Sceglierei un posto dove sono cresciuto" → "il posto dove sono
    cresciuto"; Activity 1 "un quartiere che ha già alta densità" → "un'alta
    densità"; Activity 3 "Bosco Verticale è un edificio…" → "Il Bosco Verticale…";
    Activity 4 "Gruppo 1 / 2" and "Gruppo A / B" → "Gruppo 1 / 2" throughout. The
    homework example arrow "ð" was removed. The warm-up example answers are in the
    frames and in a teacher note.
  - >-
    Missing in the notebook: the flyer for Activity 1 ("Leggi il volantino ricevuto")
    and the story of Activity 4 ("Il topo di città e il topo di campagna", Aesop's
    fable; the final questions ask about "la storia"). The teacher has to prepare the
    flyer and tell or show the fable; both are in teacher notes. The source's Activity
    3 optional phase needs pictures chosen by the teacher.
  - >-
    The classic homework (che / dove, joining sentences, writing, error correction) is
    kept in the homework section with answer boxes; the answer key is in a teacher
    note. Part 1, sentences 2 and 4 also accept "in cui". Part 4, sentence 3 ("Questo è
    un posto che è molto tranquillo, è piccolo") has more than one possible
    correction; the key gives one.
  - >-
    Mori: "Hi Mori!" → "Ciao Mori!". The four Hebrew steps are three messages plus a
    callout with the requirements (5 full answers, 3 relative clauses, 2 opinion
    phrases, personal examples), in Italian.
  - >-
    PRIVACY / left out: the line "Studenti: Scrivi i nomi degli studenti", the "Data /
    Partecipanti" lines and the "Studente 1/2/3" lines (the platform has answer
    boxes). The gamma.app lesson-slides link is not allowed and is mentioned in a
    teacher note. "?new" was removed from the Quizlet link. The YouTube video on the
    borghi is kept. The notebook gives no times, so no minutes are recorded.
  - >-
    Added (not in the source): an example for the introduction frame ("Io sono Dana…
    in un quartiere dove ci sono molti negozi"), an example for Activity 4, sentence
    frames for every discussion question, and the summary example "Marco è l'amico
    con cui vado al parco". Please confirm.
  - >-
    Vocabulary: "Via – כביש / דרך" → "רחוב / דרך" (via is a street name, not a road
    for cars); "Edificio verde – בנייה ירוקה" → "בניין ירוק". Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: vita-urbana-e-rurale-classe
    title: 'In classe: Vita urbana vs vita rurale'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Vita urbana vs vita rurale
      - id: skills
        type: cycleOverview
        skills:
          - name: Frasi relative
            description: "Unire due idee con *che*, *dove* e *in cui*: *Vivo in un posto dove c'è natura.*"
          - name: Esprimere opinioni
            description: '*Penso che, credo che, secondo me, dal mio punto di vista* + una spiegazione con *perché, siccome, però, anche se*'
      - id: quizlet
        type: externalLink
        label: Vita urbana vs vita rurale su Quizlet
        url: https://quizlet.com/br/1170219985/vita-urbana-vs-vita-rurale-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduzione
      - id: intro
        type: sentenceFrame
        frame: Io sono ___. La mia casa si trova in un ambiente urbano / rurale.
        example: Io sono Dana. La mia casa si trova in un ambiente urbano, in un quartiere dove ci sono molti negozi.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup-hint
        type: callout
        tone: info
        text: Rispondi con frasi complete. Quando puoi, usa il passato o racconta un'esperienza personale.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Preferiresti vivere in una zona urbana o in una zona rurale? Quale ti offre una qualità della vita migliore?
            frame: Preferirei vivere in una zona ___ che offre ___, perché ___.
          - question: Descrivi un quartiere dove ti è piaciuto vivere o che hai visitato. Quali servizi aveva?
            frame: Mi è piaciuto vivere in ___ che aveva ___.
          - question: Parla della tua situazione abitativa attuale. Vuoi cambiare qualcosa? Perché?
            frame: Vivo in ___. Vorrei ___ perché ___.
          - question: Hai mai cambiato appartamento? La tua qualità della vita è cambiata?
            frame: Sì. Quando mi sono trasferito / trasferita, ___.
          - question: Se potessi scegliere dove vivere in futuro, che cosa sceglieresti?
            frame: Sceglierei il posto dove ___, perché ___.
          - question: Che tipo di comunità è migliore per te? Perché?
            frame: Preferisco una comunità ___ che ___.
          - question: C'è natura nella tua città? Hai tempo per apprezzarla?
            frame: Nella mia città c'è ___ dove ___.
          - question: Pensi che i progetti di rinnovamento urbano siano una buona soluzione? Perché?
            frame: Penso che siano ___ perché ___.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: Demolizione nel nostro quartiere'
        skills: [Frasi relative, Esprimere opinioni]
        steps:
          - 'In Israele ci sono molti progetti di demolizione e rinnovamento urbano. A volte la comunità partecipa alle decisioni, a volte no.'
          - Leggi il volantino che hai ricevuto.
          - '**Ruoli (in gruppo):** ricevi un ruolo: un **residente da molti anni** (preoccupato per il rumore e la qualità della vita), un **giovane professionista** (favorevole ai grattacieli e ai servizi), un **genitore** (preoccupato per la sicurezza e gli spazi aperti) o un **rappresentante della comunità** (cerca un compromesso).'
          - Discutete le domande qui sotto dal punto di vista del vostro ruolo. Usate frasi relative ed espressioni di opinione.
          - '**Decisione finale:** come gruppo, decidete: sostenete il progetto, siete contrari o sostenete il progetto con condizioni.'
        example: '*Sosteniamo il progetto, che migliora le infrastrutture, ma vogliamo limiti alla demolizione.*'
      - id: act1-questions
        type: discussionQuestions
        title: Domande di discussione
        items:
          - question: Come influenzerà la demolizione le persone che vivono qui, soprattutto chi vive qui da molti anni?
            frame: Secondo me, le persone che ___.
          - question: Pensi che il rinnovamento urbano sia una buona soluzione per un quartiere che ha già un'alta densità? Perché?
            frame: Penso che sia ___ perché ___.
          - question: Quali sono le tue preoccupazioni principali (rumore, traffico, sicurezza, isolamento)? Fai un esempio personale.
            frame: La mia preoccupazione principale è ___. Per esempio, ___.
          - question: Quali benefici vedi negli edifici moderni e nelle nuove infrastrutture?
            frame: Dal mio punto di vista, gli edifici moderni ___.
          - question: Come cambierà il carattere del quartiere dove vivi? È positivo o negativo?
            frame: Il quartiere dove vivo ___. Da una parte ___, dall'altra ___.
          - question: 'La decisione del nostro gruppo:'
            frame: Sosteniamo / Non sosteniamo il progetto, che ___, perché ___.
      - id: act2
        type: classActivity
        title: 'Attività 2: Una comunità italiana, i borghi'
        skills: [Esprimere opinioni]
        steps:
          - Guarda i primi minuti del video sui borghi italiani.
          - 'I borghi sono una parte importante della cultura italiana: piccoli paesi storici, spesso lontani dalle grandi città, con uno stile di vita più lento e tradizionale.'
          - Discuti le domande qui sotto. Usa le espressioni di opinione degli esempi.
        example: |-
          *Penso che la vita nei borghi sia più tranquilla perché c'è meno traffico.*
          *Secondo me, i borghi sono luoghi dove le persone si conoscono meglio.*
          *Credo che la vita urbana, che è più veloce, sia anche più stressante.*
        resource:
          label: "ITALIA NASCOSTA: 50 borghi tra i più belli ma meno conosciuti d'Italia (YouTube)"
          url: https://www.youtube.com/watch?v=WgExJl44nTU
      - id: act2-questions
        type: discussionQuestions
        title: Discussione
        items:
          - question: Che cosa ti ha sorpreso di più della vita nei borghi italiani?
            frame: Mi ha sorpreso ___.
          - question: In che cosa è diversa la vita nei borghi rispetto alla vita urbana moderna?
            frame: Secondo me, nei borghi ___, mentre in città ___.
          - question: Che ruolo hanno la tecnologia e i trasporti nella tua vita quotidiana? Potresti vivere in un posto dove i servizi sono limitati?
            frame: Credo che ___. Non potrei / Potrei vivere in un posto dove ___.
          - question: Quali aspetti della vita nei borghi potrebbero migliorare la vita nelle città moderne?
            frame: Penso che ___ possa migliorare la vita in città perché ___.
      - id: act3
        type: classActivity
        title: 'Attività 3: Gara di natura urbana'
        skills: [Frasi relative]
        steps:
          - 'La **natura urbana** sono gli spazi verdi dentro le città, come parchi, fiumi, giardini e tetti verdi, che aiutano a migliorare la qualità della vita, ridurre lo stress e creare un equilibrio tra città e natura.'
          - '**Brainstorming:** in gruppo, pensate a città del mondo che hanno esempi di natura urbana.'
          - '**Ricerca:** in coppia o da solo, cerca **3 luoghi di natura urbana** in **3 continenti diversi**. Descrivi ogni luogo con **almeno una frase relativa**.'
          - '**Presentazione:** ogni gruppo presenta i suoi esempi alla classe. Vince il gruppo che ha trovato i luoghi più originali e interessanti.'
          - "**Attività opzionale:** l'insegnante mostra immagini di natura urbana di diverse città del mondo. Per ogni immagine crea una frase con una frase relativa."
        example: |-
          *Central Park, che si trova a New York, è uno dei parchi più famosi del mondo.*
          *Gardens by the Bay è un esempio di natura urbana che combina tecnologia e ambiente naturale.*
          *Il Bosco Verticale è un edificio dove le persone vivono circondate da piante e alberi.*
      - id: act3-places
        type: discussionQuestions
        title: I nostri tre luoghi
        items:
          - question: 'Luogo 1: ___'
            frame: ___, che si trova a ___, è ___.
          - question: 'Luogo 2: ___'
            frame: ___ è un luogo dove ___.
          - question: 'Luogo 3: ___'
            frame: ___ è un esempio di natura urbana che ___.
      - id: act4
        type: classActivity
        title: 'Attività 4: Il topo di città e il topo di campagna'
        skills: [Frasi relative, Esprimere opinioni]
        steps:
          - 'Ascolta la storia del topo di città e del topo di campagna. Quale vita è migliore? Gruppo 1: la vita urbana. Gruppo 2: la vita rurale.'
          - '**Preparazione:** ogni gruppo prepara i suoi argomenti. Ogni argomento deve avere almeno 3 parole nuove, una frase relativa e un esempio personale.'
          - '**Dibattito:** il Gruppo 1 parla, il Gruppo 2 risponde. Poi si cambia.'
          - '**Discussione finale:** quale parte della storia ti ha colpito? Con quale topo ti identifichi? Esiste un equilibrio tra città e campagna?'
        example: '*Secondo me, la città è il posto dove ci sono più servizi pubblici, però il pendolarismo è molto stressante.*'
      - id: act4-questions
        type: discussionQuestions
        title: I miei argomenti
        items:
          - question: 'Il mio argomento:'
            frame: Penso che ___ perché ___. Per esempio, ___.
          - question: Con quale topo ti identifichi?
            frame: Mi identifico con il topo di ___, perché ___.
          - question: Esiste un equilibrio tra città e campagna?
            frame: Da una parte ___, dall'altra ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Frasi relative** (che, cui, dove), soprattutto
          nelle Attività 1, 3 e 4, ed **Esprimere opinioni**, nelle Attività 1, 2 e 4. Il
          quaderno non indica i tempi. La presentazione della lezione (gamma.app) non è
          inclusa nella piattaforma: usala dal tuo materiale, se vuoi.
      - id: n-intro
        anchor: intro
        text: Dai prima il tuo esempio. Chiedi di aggiungere una frase relativa (*in un quartiere dove…*).
      - id: n-warmup
        anchor: warmup
        text: >-
          Scegli 8 domande. Esempi di risposta del quaderno: 1. *Preferirei vivere in una
          zona rurale che offre buone opportunità di lavoro e trasporto, perché mi piace
          la tranquillità ma devo anche lavorare.* 2. *Mi è piaciuto vivere in una strada
          principale che aveva banche, farmacie, piccoli negozi e bar, che rendevano tutto
          facile.* 3. *Vivo in un appartamento in affitto con il mio partner. Vorrei un
          appartamento più grande perché è un po' piccolo e il mio ufficio è anche il
          soggiorno.* 4. *Sì. Quando mi sono trasferito, la qualità della vita è cambiata
          perché avevamo meno soldi.* 5. *Sceglierei il posto dove sono cresciuto, perché
          ho molti ricordi.* 6. *Preferisco una comunità urbana che è tranquilla, ma ha
          tutto vicino.*
      - id: n-act1
        anchor: act1
        text: >-
          Prima della lezione prepara un volantino (non è nel quaderno): per esempio, un
          avviso del comune su un progetto di demolizione e ricostruzione nel quartiere,
          con nuovi grattacieli, parcheggi e un parco. Dividi la classe in gruppi e
          assegna i quattro ruoli. Alla fine ogni gruppo legge la sua decisione con una
          frase relativa.
      - id: n-act2
        anchor: act2
        text: Mostra i primi minuti del video. Poi scrivi alla lavagna le tre frasi d'esempio e chiedi di usarle come modello.
      - id: n-act3
        anchor: act3
        text: >-
          Gli studenti possono cercare i luoghi su internet. Per la fase opzionale prepara
          alcune immagini di natura urbana di città diverse (non sono nel quaderno).
      - id: n-act4
        anchor: act4
        text: >-
          Il quaderno non contiene la storia: racconta brevemente la favola di Esopo «Il
          topo di città e il topo di campagna» (o mostrane una versione illustrata) prima
          di dividere la classe in due gruppi. Controlla che ogni argomento abbia 3 parole
          nuove, una frase relativa e un esempio personale.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: vita-urbana-e-rurale-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: rules-relative
        type: ruleSummary
        skill: Frasi relative
        rules:
          - text: 'Le **frasi relative** uniscono due idee e aggiungono informazioni a un nome. Invece di due frasi ne facciamo una.'
            examples:
              [
                'Vivo in una città. La città ha molti parchi. → Vivo in una città che ha molti parchi.',
              ]
          - text: '**Che** si usa per le **persone** e per le **cose**, come soggetto o come oggetto. Non cambia mai (maschile, femminile, singolare, plurale).'
            examples:
              - Le persone che vivono in città lavorano molto.
              - Ho incontrato una persona che lavora come architetto.
              - Una casa che ha il giardino è migliore.
          - text: '**Dove** si usa per i **luoghi**.'
            examples:
              [
                "Vivo in un posto dove c'è natura.",
                Questo è un quartiere dove la natura è importante.,
              ]
          - text: 'Dopo una **preposizione** usiamo **cui** (*in cui, con cui, di cui, a cui*). Per i luoghi *in cui* = *dove*.'
            examples:
              - Questo è il quartiere in cui sono cresciuto. (= dove sono cresciuto)
              - Marco è l'amico con cui vado al parco.
          - text: "**Relative restrittive**: l'informazione è necessaria per capire di chi o di che cosa parliamo. **Senza virgole.**"
            examples: [La casa che ha il balcone è costosa.]
          - text: "**Relative esplicative**: l'informazione è in più, si può togliere. **Con le virgole.**"
            examples:
              [
                'Tel Aviv, che è molto popolata, ha pochi spazi verdi.',
                'Il progetto, che migliora la città, è utile.',
              ]
      - id: relative-table
        type: table
        caption: Che, dove, cui
        header: [Pronome, Per…, Esempio]
        rows:
          - [che, persone e cose, Ho un amico che lavora in ufficio.]
          - [dove, luoghi, È un posto dove puoi rilassarti.]
          - [
              preposizione + cui,
              dopo in / con / di / a…,
              Questo è il quartiere in cui sono cresciuto.,
            ]
      - id: rules-opinioni
        type: ruleSummary
        skill: Esprimere opinioni
        rules:
          - text: "Per esprimere un'opinione usiamo: **penso che**, **credo che**, **secondo me**, **dal mio punto di vista**."
          - text: 'Dopo **penso che** e **credo che** usiamo il **congiuntivo** (*sia, siano, abbia, possa*).'
            examples:
              - Penso che la vita nei borghi sia più tranquilla perché c'è meno traffico.
              - 'Credo che la vita urbana, che è più veloce, sia anche più stressante.'
          - text: "Dopo **secondo me** e **dal mio punto di vista** usiamo l'**indicativo**."
            examples: ['Secondo me, i borghi sono luoghi dove le persone si conoscono meglio.']
          - text: "Per spiegare l'opinione usiamo: **perché** (la causa), **siccome** (la causa, all'inizio della frase), **però** (= ma), **anche se** (una concessione), **da una parte… dall'altra…** (due aspetti)."
            examples:
              - "Siccome c'è meno traffico, la vita in campagna è più tranquilla."
              - "Mi piace la città, però c'è troppo rumore."
              - "Da una parte la città ha molti servizi, dall'altra è molto cara."
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa il riepilogo e chiedi a ogni studente una frase sul suo quartiere con *che* o *dove* e un'opinione con *penso che*.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: vita-urbana-e-rurale-compiti
    title: Compiti
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti
      - id: classic-title
        type: heading
        level: 3
        text: Versione classica
      - id: hw-1
        type: discussionQuestions
        title: 'Parte 1: Completa con che o dove.'
        items:
          - question: Vivo in una città ___ ha molti parchi.
          - question: Questo è il quartiere ___ sono cresciuto.
          - question: Ho un amico ___ lavora in ufficio.
          - question: È un posto ___ puoi rilassarti.
          - question: La casa ___ ha il balcone è molto bella.
      - id: hw-2
        type: discussionQuestions
        title: 'Parte 2: Unisci le due frasi con una frase relativa. Esempio: Vivo in una città. La città è tranquilla. → Vivo in una città che è tranquilla.'
        items:
          - question: Ho visto un parco. Il parco è molto grande.
          - question: Conosco una persona. Lavora come medico.
          - question: Questo è un quartiere. È molto moderno.
          - question: Ho visitato una città. La città ha molti musei.
      - id: hw-3
        type: discussionQuestions
        title: 'Parte 3: Scrivi 5–6 frasi sul tema «Preferisco vivere in città o in campagna».'
        items:
          - question: Usa almeno 2 frasi relative, 2 espressioni di opinione (*penso che, secondo me…*) e 2 connettori (*perché, però…*).
      - id: hw-4
        type: discussionQuestions
        title: 'Parte 4: Correggi le frasi.'
        items:
          - question: Vivo in una città dove ha molti parchi.
          - question: Ho incontrato una persona dove lavora in banca.
          - question: Questo è un posto che è molto tranquillo, è piccolo.
          - question: Tel Aviv che è grande ha molti problemi.
      - id: mori-title
        type: heading
        level: 3
        text: Con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia il primo messaggio e invialo. Rispondi alle domande di Mori, poi invia il secondo e il terzo messaggio.
      - id: mori-rules
        type: callout
        tone: info
        title: Nella conversazione
        text: |-
          Dai almeno **5 risposte complete**.
          Usa almeno **3 frasi relative** (*che / dove*) e **2 espressioni di opinione**.
          Aggiungi esempi personali.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Messaggio 1: La mia città'
        message: Ciao Mori! Voglio praticare le frasi relative e le opinioni in italiano. Fammi domande sulla mia città, sulla natura urbana e sul posto dove vivo. Aiutami a usare «che» e «dove» e a esprimere opinioni con esempi personali.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Messaggio 2: Una domanda più difficile'
        intro: 'Rispondi con una risposta più lunga: fai un confronto tra città e campagna e spiega il motivo (*perché / siccome*).'
        message: Fammi una domanda più difficile.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Messaggio 3: Correzione'
        message: Correggi le mie frasi e spiegami gli errori.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**
    teacherNotes:
      - id: n-key
        anchor: hw-1
        text: >-
          Soluzioni. Parte 1: che · dove (in cui) · che · dove (in cui) · che. Parte 2: Ho
          visto un parco che è molto grande. · Conosco una persona che lavora come medico.
          · Questo è un quartiere che è molto moderno. · Ho visitato una città che ha molti
          musei. Parte 4: Vivo in una città che ha molti parchi (oppure: dove ci sono molti
          parchi). · Ho incontrato una persona che lavora in banca. · Questo posto, che è
          piccolo, è molto tranquillo. · Tel Aviv, che è grande, ha molti problemi.

