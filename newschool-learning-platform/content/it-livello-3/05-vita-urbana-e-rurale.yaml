activities:
  - slug: vita-urbana-e-rurale-relative
    title: 'Frasi relative: che, dove, cui'
    minutes: 8
    items:
      - id: citta-che
        type: multipleChoice
        prompt: Vivo in una città ___ ha molti parchi.
        options:
          - { text: che, correct: true }
          - {
              text: dove,
              feedback: "La città fa l'azione di *ha*: è il soggetto, quindi usiamo *che*. Con *dove* diciamo: *una città dove ci sono molti parchi*.",
            }
          - {
              text: cui,
              feedback: "*Cui* si usa dopo una preposizione (*in cui, con cui*). Qui non c'è preposizione: *che*.",
            }
      - id: quartiere-dove
        type: multipleChoice
        prompt: Questo è il quartiere ___ sono cresciuto.
        options:
          - { text: dove, correct: true }
          - {
              text: che,
              feedback: 'Parliamo di un luogo (sono cresciuto **in** questo quartiere): usiamo *dove* oppure *in cui*.',
            }
          - {
              text: cui,
              feedback: '*Cui* da solo non va bene: serve la preposizione, *in cui*. Oppure usiamo *dove*.',
            }
      - id: amico-che
        type: fillBlank
        prompt: Completa con il pronome relativo.
        text: Ho un amico ___ lavora in ufficio.
        blanks: [[che]]
      - id: virgole
        type: trueFalse
        prompt: "Quando l'informazione è in più (relativa esplicativa), usiamo le virgole: *Tel Aviv, che è molto popolata, ha pochi spazi verdi.*"
        answer: true
        feedback:
          correct: "Giusto! L'informazione in più va tra due virgole. Senza virgole l'informazione è necessaria: *La casa che ha il balcone è costosa.*"
          incorrect: "L'informazione in più (esplicativa) va tra due virgole: *Tel Aviv, che è molto popolata, ha pochi spazi verdi.*"
      - id: unisci-frasi
        type: matching
        prompt: Unisci l'inizio e la fine di ogni frase.
        pairs:
          - [Vivo in un posto, "dove c'è molta natura."]
          - [Ho incontrato una persona, che lavora come architetto.]
          - [La casa che ha il balcone, è costosa.]
          - [Questo è il quartiere in cui, sono cresciuto.]
      - id: con-cui
        type: multipleChoice
        prompt: Marco è l'amico con ___ vado al parco.
        options:
          - { text: cui, correct: true }
          - {
              text: che,
              feedback: 'Dopo una preposizione (*con*) non usiamo *che*, ma *cui*: *con cui*.',
            }
          - {
              text: dove,
              feedback: '*Dove* è per i luoghi. Marco è una persona, e dopo *con* usiamo *cui*.',
            }
      - id: unisci-parco
        type: multipleChoice
        prompt: 'Unisci le frasi: *Ho visto un parco. Il parco è molto grande.*'
        options:
          - { text: Ho visto un parco che è molto grande., correct: true }
          - {
              text: Ho visto un parco dove è molto grande.,
              feedback: 'Il parco è il soggetto di *è molto grande*: usiamo *che*, non *dove*.',
            }
          - {
              text: Ho visto un parco cui è molto grande.,
              feedback: '*Cui* si usa solo dopo una preposizione. Qui usiamo *che*.',
            }
      - id: ordina-parchi
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Vivo in una città che ha molti parchi.

  - slug: vita-urbana-e-rurale-opinioni
    title: 'Esprimere opinioni: penso che, secondo me'
    minutes: 8
    items:
      - id: penso-sia
        type: multipleChoice
        prompt: Penso che la vita nei borghi ___ più tranquilla.
        options:
          - { text: sia, correct: true }
          - { text: è, feedback: 'Dopo *penso che* usiamo il congiuntivo: *sia*.' }
          - {
              text: essere,
              feedback: 'Dopo *penso che* serve un verbo coniugato al congiuntivo: *sia*.',
            }
      - id: secondo-me-sono
        type: multipleChoice
        prompt: Secondo me, i borghi ___ luoghi dove le persone si conoscono meglio.
        options:
          - { text: sono, correct: true }
          - {
              text: siano,
              feedback: "Dopo *secondo me* usiamo l'indicativo: *sono*. Il congiuntivo va dopo *penso che* e *credo che*.",
            }
          - { text: è, feedback: '*I borghi* è plurale: *sono*.' }
      - id: credo-sia
        type: fillBlank
        prompt: Completa con il congiuntivo di *essere*.
        text: Credo che la vita urbana ___ anche più stressante.
        blanks: [[sia]]
      - id: unisci-espressioni
        type: matching
        prompt: Unisci ogni espressione al suo significato.
        pairs:
          - [secondo me, per me / a mio parere]
          - [perché, introduce la causa]
          - [però, = ma]
          - [anche se, = nonostante il fatto che]
          - [da una parte, presenta il primo di due aspetti]
      - id: secondo-me-cong
        type: trueFalse
        prompt: 'Dopo *secondo me* usiamo il congiuntivo: *Secondo me la città sia più stressante.*'
        answer: false
        feedback:
          correct: "Giusto! Dopo *secondo me* usiamo l'indicativo: *Secondo me la città è più stressante.*"
          incorrect: "Dopo *secondo me* usiamo l'indicativo: *Secondo me la città è più stressante.* Il congiuntivo va dopo *penso che*: *Penso che la città sia più stressante.*"
      - id: siccome
        type: multipleChoice
        prompt: ___ c'è meno traffico, la vita in campagna è più tranquilla.
        options:
          - { text: Siccome, correct: true }
          - {
              text: Però,
              feedback: '*Però* introduce un contrasto (= ma). Qui la prima parte è la causa: *Siccome*.',
            }
          - {
              text: Anche se,
              feedback: '*Anche se* introduce una concessione. Qui la prima parte è la causa della seconda: *Siccome*.',
            }
      - id: pero
        type: fillBlank
        prompt: Completa con il connettore giusto.
        text: Mi piace la città, ___ c'è troppo rumore.
        blanks: [[però, ma]]
        wordBank: [però, perché, siccome, secondo me]
      - id: ordina-borghi
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Penso che la vita nei borghi sia più tranquilla.
