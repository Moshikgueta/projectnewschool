vocabulary:
  - slug: mindfulness-e-rilassamento
    title: Mindfulness e rilassamento
    items: *mindfulness-e-rilassamento-words

activities:
  - slug: mindfulness-e-rilassamento-aggettivi
    title: 'Aggettivi e tempi narrativi: tranquillo, rilassante, mi sentivo'
    minutes: 8
    items:
      - id: posto-calmo
        type: multipleChoice
        prompt: Il posto è molto ___.
        options:
          - { text: calmo, correct: true }
          - { text: calma, feedback: "*Posto* è maschile singolare: l'aggettivo è *calmo*." }
          - { text: calmi, feedback: '*Calmi* è plurale. *Il posto* è singolare: *calmo*.' }
      - id: rilassato
        type: multipleChoice
        prompt: Mi sento molto ___. (Marco)
        options:
          - { text: rilassato, correct: true }
          - {
              text: relax,
              feedback: '*Relax* è un nome, non un aggettivo. Diciamo *Mi sento rilassato*.',
            }
          - {
              text: rilassante,
              feedback: '*Rilassante* descrive una cosa che ti rilassa (*un posto rilassante*). Per come ti senti usiamo *rilassato*.',
            }
      - id: rumorosa
        type: fillBlank
        prompt: Completa con l'aggettivo *rumoroso* nella forma giusta.
        text: La città è molto ___.
        blanks: [[rumorosa]]
      - id: aggettivi-in-e
        type: trueFalse
        prompt: 'Gli aggettivi in *-e* hanno la stessa forma al maschile e al femminile: *un posto rilassante, una stanza rilassante*.'
        answer: true
        feedback:
          correct: 'Giusto! Cambiano solo al plurale: *posti rilassanti, stanze rilassanti*.'
          incorrect: 'Gli aggettivi in *-e* non cambiano con il genere: *un posto rilassante, una stanza rilassante*. Al plurale finiscono in *-i*.'
      - id: unisci-aggettivi
        type: matching
        prompt: Unisci ogni aggettivo semplice a un aggettivo più preciso.
        pairs:
          - [bello, armonioso]
          - [buono, efficiente]
          - [calmo, sereno]
          - [moderno, minimalista]
      - id: usavo
        type: multipleChoice
        prompt: Quando ero piccolo, ___ sempre la musica per rilassarmi.
        options:
          - { text: usavo, correct: true }
          - {
              text: ho usato,
              feedback: "*Quando ero piccolo* e *sempre* parlano di un'abitudine nel passato: usiamo l'imperfetto, *usavo*.",
            }
          - {
              text: uso,
              feedback: "*Uso* è presente. Per un'abitudine nel passato usiamo l'imperfetto: *usavo*.",
            }
      - id: cambiero
        type: fillBlank
        prompt: Completa con il futuro semplice di *cambiare* (io).
        text: Il prossimo anno ___ le mie abitudini.
        blanks: [[cambierò, io cambierò]]
      - id: ordina-oggi
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Oggi mi sento più calmo.

  - slug: mindfulness-e-rilassamento-ipotetico
    title: 'Secondo periodo ipotetico: se fossi…, sarei…'
    minutes: 8
    items:
      - id: fossi-calmo
        type: multipleChoice
        prompt: Se io ___ più calmo, dormirei meglio.
        options:
          - { text: fossi, correct: true }
          - {
              text: sono,
              feedback: 'Con *sono* (presente) la seconda parte sarebbe *dormo*. Con *dormirei* usiamo il congiuntivo imperfetto: *fossi*.',
            }
          - {
              text: sarei,
              feedback: 'Dopo *se* non usiamo mai il condizionale. Usiamo il congiuntivo imperfetto: *fossi*.',
            }
      - id: facessero
        type: fillBlank
        prompt: Completa con *fare* (congiuntivo imperfetto) e *sentirsi* (condizionale presente).
        text: Se le persone ___ più mindfulness, ___ meno stressate.
        blanks: [[facessero], [si sentirebbero]]
      - id: vivessi-saresti
        type: fillBlank
        prompt: Completa con *vivere* (congiuntivo imperfetto) e *essere* (condizionale presente).
        text: Se tu ___ nella natura, ___ più felice.
        blanks: [[vivessi, tu vivessi], [saresti]]
      - id: lavoreremmo
        type: multipleChoice
        prompt: Se avessimo meno stress, ___ meglio.
        options:
          - { text: lavoreremmo, correct: true }
          - {
              text: lavoreremo,
              feedback: '*Lavoreremo* (una *m*) è futuro. Con *se* + congiuntivo imperfetto usiamo il condizionale: *lavoreremmo* (due *m*).',
            }
          - {
              text: lavorassimo,
              feedback: '*Lavorassimo* è congiuntivo imperfetto: va dopo *se*. Nella seconda parte usiamo il condizionale: *lavoreremmo*.',
            }
      - id: avevo-stress
        type: trueFalse
        prompt: 'La frase *Se avevo meno stress, lavorerei meglio* è italiano corretto.'
        answer: false
        feedback:
          correct: 'Giusto! Dopo *se* usiamo il congiuntivo imperfetto: *Se avessi meno stress, lavorerei meglio.*'
          incorrect: "Nell'italiano corretto dopo *se* usiamo il congiuntivo imperfetto: *Se avessi meno stress, lavorerei meglio.*"
      - id: unisci-ipotesi
        type: matching
        prompt: Unisci le due parti di ogni frase.
        pairs:
          - [Se la luce fosse troppo forte…, …le persone si sentirebbero stressate.]
          - [Se gli studenti praticassero la mindfulness ogni giorno…, …sarebbero più concentrati.]
          - [Se la mindfulness fosse obbligatoria…, …alcuni studenti si sentirebbero a disagio.]
          - [Se vivessi nella natura…, …sarei più felice.]
      - id: consiglieresti
        type: multipleChoice
        prompt: Se conoscessi una persona sempre stressata, le ___ di rallentare.
        options:
          - { text: consiglierei, correct: true }
          - {
              text: consiglio,
              feedback: '*Consiglio* è presente. Con *se* + congiuntivo imperfetto (*conoscessi*) usiamo il condizionale: *consiglierei*.',
            }
          - {
              text: consigliassi,
              feedback: '*Consigliassi* è congiuntivo imperfetto: va dopo *se*. Nella seconda parte usiamo il condizionale: *consiglierei*.',
            }
      - id: ordina-rilassato
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Se fossi più rilassato, vivrei meglio.
