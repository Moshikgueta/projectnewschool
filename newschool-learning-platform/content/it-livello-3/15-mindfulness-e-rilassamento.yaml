# Cycle "Mindfulness e rilassamento", converted from the Italian level 3 digital
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-3
slug: mindfulness-e-rilassamento
title: Mindfulness e rilassamento
goal: Descrivere luoghi, emozioni ed esperienze con aggettivi precisi e tempi diversi, e immaginare situazioni con il secondo periodo ipotetico.
position: 15
status: published

review:
  - >-
    The two workbook exercises ("Aggettivi e tempi narrativi" and "Secondo periodo
    ipotetico") are NEW: the notebook has no self-study exercises. They were written
    from the cycle's summary rules, the class examples and its vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    The notebook lists three skills (secondo periodo ipotetico, aggettivi, narrazione
    con tempi diversi). They are grouped into the cycle's two skills: "Aggettivi e
    tempi narrativi" (describing places, emotions and experiences in past, present and
    future) and "Secondo periodo ipotetico". Please confirm.
  - >-
    Grammar (wrong rule): the summary gives "Se + imperfetto, condizionale". In
    standard Italian the verb after "se" is the congiuntivo imperfetto (se fossi, se
    vivessi), not the indicative imperfetto; the rule now says so and a table of the
    congiuntivo imperfetto and condizionale presente was ADDED. "Secondo condizionale"
    (English "second conditional") → "secondo periodo ipotetico" in Activity 1, the
    homework and Mori.
  - >-
    Summary, narrative tenses: the "future" example "Voglio cambiare le mie abitudini"
    is the present of volere + infinitive. The rule now says that for the future we use
    the futuro semplice (Cambierò le mie abitudini) and, for intentions, voglio /
    vorrei + infinitive. The tenses are now named (passato prossimo, imperfetto,
    presente, futuro). ADDED: a rule and table on adjective agreement (calmo / calma /
    calmi / calme; rilassante / rilassanti; caotico / caotici / caotiche), needed by
    homework Part 4 ("Il posto è molto calma").
  - >-
    The lesson summary ("סיכום השיעור") is in Hebrew in the source; it was rewritten in
    Italian as rule summaries, keeping the Italian examples, with the Hebrew
    translations of the adjectives in the table and of the key example.
  - >-
    Corrections: Activity 2 "Iuminoso" → "luminoso"; "Iuminoso → illuminato
    naturalmente / luce soffusa" (not adjectives) → "luminoso → soleggiato / con luce
    naturale o soffusa"; "sei stato assunto" → "sei stato assunto / sei stata
    assunta"; warm-up and Activity 3 "ti sei sentito" → "ti sei sentito / sentita";
    "praticassero mindfulness" / "praticare mindfulness" → "praticassero la
    mindfulness" (with the article, as elsewhere in the notebook); "Hi Mori!" → "Ciao
    Mori!"; "Vocabulario" → "Vocabolario"; full stops added to the examples.
  - >-
    Links: the YouTube video of Activity 3 is kept without its tracking parameters
    (time_continue, source_ve_path, embeds_referring_euri). The gamma.app lesson
    presentation was left out (slide links are not allowed; mentioned in a teacher
    note). The Quizlet link is kept without "?new". Activity 1 needs pictures of
    relaxing places, and Activity 2 phase 3 needs an image-generating AI tool; neither
    is in the notebook (teacher notes).
  - >-
    Classic homework ("שיעורי בית - גרסה קלאסית", 4 parts) is kept in the homework
    section as written exercises, with the Hebrew instructions translated into
    Italian; the answer key (not in the source) was ADDED in the teacher notes. Part 2
    items 1–3 have more than one possible answer (item 1 offers "rumorosa /
    tranquilla", both correct); the key says so.
  - >-
    The Mori steps are kept as three messages plus a callout with the conversation
    requirements. Left out: the "Data / Partecipanti" fields and the "Studente 1/2/3"
    answer lines. No times are given for any part. The example name in the
    introduction (Amit) is a model, not a student.
  - >-
    Vocabulary: "Respirazione" and "Respiro" were both "נשימה": now "נשימה (התהליך)" and
    "נשימה (אחת)"; "Mente – מחשבה / תודעה" → "שכל / תודעה"; "Controllare – לשלוט" →
    "לשלוט / לבדוק"; "Benessere – רווחה" → "רווחה / הרגשה טובה". Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: mindfulness-e-rilassamento-classe
    title: 'In classe: Mindfulness e rilassamento'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Mindfulness e rilassamento
      - id: skills
        type: cycleOverview
        skills:
          - name: Aggettivi e tempi narrativi
            description: 'Descrivere luoghi ed emozioni e raccontare con tempi diversi: *Ho visitato un posto tranquillo. Usavo la musica per rilassarmi. Oggi mi sento più sereno.*'
          - name: Secondo periodo ipotetico
            description: '*Se* + congiuntivo imperfetto, condizionale presente: *Se vivessi nella natura, sarei più felice.*'
      - id: quizlet
        type: externalLink
        label: Mindfulness e rilassamento su Quizlet
        url: https://quizlet.com/br/1171527272/mindfulness-e-rilassamento-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduzione
      - id: intro
        type: sentenceFrame
        frame: Io sono ___. Se potessi essere in un posto rilassante adesso, sarei ___.
        example: Sono Amit. Se potessi essere in un posto rilassante adesso, sarei in India a meditare.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup
        type: discussionQuestions
        items:
          - question: Pensa a un momento in cui ti sei sentito / sentita davvero rilassato / rilassata. Che cosa è successo? Perché ti sei sentito / sentita così calmo / calma?
            frame: Una volta ___. Mi sono sentito / sentita calmo / calma perché ___.
          - question: Secondo te, che cosa rende un'attività veramente rilassante e non solo divertente? Fai un esempio.
            frame: "Secondo me, un'attività è rilassante quando ___. Per esempio, ___."
          - question: Se dovessi creare una giornata perfetta senza stress, che cosa includerebbe? Dove saresti? Che cosa faresti?
            frame: La mia giornata perfetta includerebbe ___. Sarei ___ e farei ___.
          - question: Che ruolo ha la tecnologia nello stress moderno? Ti aiuta o ti crea più stress? Perché?
            frame: Secondo me, la tecnologia ___ perché ___.
          - question: Se dovessi cambiare un'abitudine quotidiana per sentirti più calmo / calma, quale cambieresti? Come cambierebbe la tua giornata?
            frame: Cambierei ___. La mia giornata sarebbe ___.
          - question: Se potessi rivivere un momento rilassante del passato, quale sceglieresti? Che cosa lo ha reso speciale?
            frame: Sceglierei ___. Era speciale perché ___.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: Il luogo che ti cambia'
        skills: [Aggettivi e tempi narrativi, Secondo periodo ipotetico]
        steps:
          - '**Fase 1 – Brainstorming in classe:** guarda le immagini di luoghi rilassanti (natura e città). Quale luogo sembra più rilassante? Perché? Quale luogo sembra calmo, ma potrebbe essere scomodo o stressante? Quale luogo sarebbe rilassante per alcune persone ma non per altre?'
          - "**Fase 2 – Scrittura guidata:** scegli un luogo (dalle immagini o personale) e scrivi un breve testo con la struttura qui sotto. Usa aggettivi per descrivere le emozioni e l'ambiente."
          - '**Fase 3 – In coppia:** racconta la tua storia a un compagno. Il compagno ascolta e fa almeno una domanda di approfondimento.'
          - "**Fase 4 – Con la classe:** condividi un'idea interessante della tua storia o di quella del compagno. Quali descrizioni erano più vivide? Quali aggettivi erano più efficaci?"
      - id: act1-writing
        type: discussionQuestions
        title: Il mio luogo
        items:
          - question: "Passato (3–4 frasi): descrivi un'esperienza reale o immaginaria in quel luogo."
            frame: "L'anno scorso sono andato / andata… Il posto era… Mi sentivo…"
          - question: Presente (2–3 frasi) — come ti senti quando pensi a questo luogo?
            frame: Quando penso a questo luogo, mi sento…
          - question: Futuro (2 frasi) — che cosa vorresti fare lì in futuro?
            frame: In futuro vorrei… / Tornerò…
          - question: Secondo periodo ipotetico (2 frasi) — se vivessi lì ogni giorno, come cambierebbe la tua vita?
            frame: Se vivessi lì ogni giorno, sarei… / la mia vita sarebbe…
      - id: act2
        type: classActivity
        title: 'Attività 2: Spazio di lavoro rilassante'
        skills: [Aggettivi e tempi narrativi, Secondo periodo ipotetico]
        steps:
          - '**Fase 1 – Introduzione e ripasso degli aggettivi:** immagina di essere stato assunto / stata assunta per progettare uno spazio di lavoro rilassante per professionisti stressati e distratti. Prima rivediamo alcuni aggettivi e come migliorarli (tabella qui sotto). Prova a usarli in frasi semplici.'
          - '**Fase 2 – Pianificazione in gruppi:** progettate uno spazio di lavoro che deve ridurre lo stress, migliorare la concentrazione, essere rilassante ma non noioso e funzionare per circa 20 persone. Pensate a: illuminazione (naturale, calda, soffusa), colori, materiali (legno, vetro, piante), ambiente sonoro, disposizione dei mobili, condizioni di lavoro e una caratteristica speciale legata alla mindfulness. Durante la discussione usate il secondo periodo ipotetico.'
          - "**Fase 3 – Un prompt per creare un'immagine:** ogni gruppo scrive una breve descrizione per creare un'immagine del proprio spazio. Il testo deve descrivere chiaramente l'ambiente, usare aggettivi e spiegare l'atmosfera."
          - '**Fase 4 – Presentazione e previsione:** ogni gruppo presenta il proprio progetto. La classe risponde: *Se lavorassi lì ogni giorno, come cambierebbe il tuo comportamento?*'
          - "**Fase 5 – Revisione in classe:** l'immagine corrisponde agli aggettivi usati? Mancano dettagli importanti? Come si può migliorare la descrizione?"
        example: |-
          *Se la luce fosse troppo forte, le persone si sentirebbero stressate.*
          *Crea un'immagine di uno spazio di lavoro sereno e minimalista, con luce naturale soffusa, mobili in legno caldo, grandi piante verdi e pareti che assorbono il suono. L'atmosfera è tranquilla, luminosa e rilassante. Ci sono sedie comode, colori naturali e uno spazio per la meditazione.*
      - id: act2-adjectives
        type: table
        caption: Aggettivi più precisi
        header: [Aggettivo semplice, Aggettivo migliore]
        rows:
          - [bello, rilassante / armonioso]
          - [buono, funzionale / efficiente]
          - [calmo, tranquillo / sereno / rigenerante]
          - [luminoso, soleggiato / con luce naturale o soffusa]
          - [moderno, minimalista / elegante / contemporaneo]
      - id: act2-plan
        type: discussionQuestions
        title: Il nostro spazio di lavoro
        items:
          - question: 'Illuminazione e colori:'
            frame: La luce è… I colori sono…
          - question: 'Materiali e mobili:'
            frame: I mobili sono in… Ci sono…
          - question: 'Ambiente sonoro:'
            frame: Lo spazio è silenzioso / tranquillo perché…
          - question: 'La caratteristica speciale legata alla mindfulness:'
            frame: "C'è uno spazio per…"
          - question: "Il nostro prompt per l'immagine:"
            frame: "Crea un'immagine di uno spazio di lavoro…"
      - id: act3
        type: classActivity
        title: 'Attività 3: Mindfulness in azione'
        skills: [Aggettivi e tempi narrativi, Secondo periodo ipotetico]
        steps:
          - '**Fase 1 – Brainstorming in classe:** che cosa significa per te la parola *mindfulness*? Pensa a un momento in cui ti sei sentito / sentita stressato / stressata. Che cosa fai di solito per calmarti? Rispondi con esempi personali.'
          - "**Fase 2 – Video sulla mindfulness:** guarda il breve video (link qui sotto). Poi rispondi: quali parole usa il video per descrivere la paura e l'ansia? Come può la mindfulness aiutare le persone a pensare in modo diverso? Qual è un esempio di scelta consapevole che tutti possono fare?"
          - '**Fase 3 – Discussione in gruppi:** parlate di situazioni reali e ipotetiche con le domande guida qui sotto. Usate aggettivi, il secondo periodo ipotetico ed esempi personali.'
          - "**Fase 4 – Condivisione e correzione:** ogni studente condivide un'idea della discussione."
        resource:
          label: Cosa è la Mindfulness... e a cosa serve!
          url: https://www.youtube.com/watch?v=LHhEv7hW_ME
      - id: act3-questions
        type: discussionQuestions
        title: Domande guida
        items:
          - question: Se conoscessi una persona sempre stressata e di fretta, che cosa le consiglieresti di fare?
            frame: Le consiglierei di ___.
          - question: Se reagissi in modo diverso allo stress, come cambierebbe la situazione?
            frame: Se reagissi con calma, ___.
          - question: Quali sensazioni nel corpo puoi osservare per sentirti più rilassato / rilassata durante la giornata?
            frame: Posso osservare ___.
          - question: Se potessi scegliere un'attività quotidiana da fare in modo più consapevole, quale sceglieresti e perché?
            frame: Sceglierei ___ perché ___.
      - id: act3-final
        type: discussionQuestions
        title: Discussione finale
        items:
          - question: Se tutte le persone praticassero la mindfulness regolarmente, come cambierebbero le scuole o i luoghi di lavoro?
            frame: Se tutti praticassero la mindfulness, le scuole ___.
          - question: Quale potrebbe essere uno svantaggio di praticare la mindfulness troppo spesso?
            frame: Uno svantaggio potrebbe essere ___.
      - id: act4
        type: classActivity
        title: 'Attività 4: Mindfulness a scuola'
        skills: [Secondo periodo ipotetico, Aggettivi e tempi narrativi]
        steps:
          - '**Gruppi:** Gruppo 1: tutti dovrebbero praticare la mindfulness a scuola. Gruppo 2: la mindfulness è una scelta personale e non dovrebbe essere obbligatoria.'
          - '**Fase 1 – Preparazione in gruppi:** pensate a 2–3 argomenti principali, usate almeno una frase con il secondo periodo ipotetico e aggiungete un esempio personale o reale. Domande guida: se la mindfulness fosse introdotta ogni giorno a scuola, che cosa cambierebbe? Come cambierebbe il comportamento degli studenti? Quali sarebbero i vantaggi e gli svantaggi?'
          - "**Fase 2 – Dibattito:** il gruppo A presenta un'idea e il gruppo B risponde; poi il gruppo B presenta un'idea e il gruppo A risponde."
          - '**Fase 3 – Discussione in classe:** quale posizione è più convincente? È possibile trovare un equilibrio tra le due idee? Come dovrebbe essere usata la mindfulness a scuola?'
        example: |-
          *Se gli studenti praticassero la mindfulness ogni giorno, sarebbero più concentrati.*
          *Se la mindfulness fosse obbligatoria, alcuni studenti si sentirebbero a disagio.*
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **aggettivi e tempi narrativi** (Attività 1 e 2)
          e **secondo periodo ipotetico** (introduzione, Attività 3 e 4); tutte le attività
          usano un po' tutte e due. Il quaderno non indica i tempi né quante attività
          scegliere. La presentazione della lezione (gamma.app) non è inclusa nella
          piattaforma: usala dal tuo materiale, se vuoi.
      - id: n-warmup
        anchor: warmup-title
        text: Fai almeno due domande a ogni studente. Le risposte scritte qui compaiono sotto ogni domanda.
      - id: n-act1
        anchor: act1
        text: >-
          Prima della lezione prepara alcune immagini di luoghi rilassanti (natura e
          città), anche luoghi che sembrano calmi ma potrebbero essere scomodi: non sono
          nel quaderno. Alla fine guida una breve riflessione sulle descrizioni e sugli
          aggettivi.
      - id: n-act2
        anchor: act2
        text: >-
          Per la fase 3 serve uno strumento di IA che crea immagini (a tua scelta): i
          gruppi incollano il loro prompt e confrontano l'immagine con gli aggettivi.
          Senza strumento, i gruppi possono leggere il prompt e la classe immagina lo
          spazio.
      - id: n-act3
        anchor: act3
        text: Nella fase 4 correggi gli errori principali e aiuta a migliorare l'uso degli aggettivi e delle strutture.
      - id: n-act4
        anchor: act4
        text: Guida la discussione finale e correggi gli errori principali.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: mindfulness-e-rilassamento-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cosa abbiamo imparato oggi
      - id: rules-aggettivi
        type: ruleSummary
        skill: Aggettivi
        rules:
          - text: 'Usiamo gli aggettivi per descrivere **emozioni**, **luoghi** e **atmosfera**.'
          - text: "L'aggettivo va dopo *essere* e dopo verbi come *sentirsi, sembrare, diventare*. Di solito va **dopo** il nome."
            examples: [Il posto è tranquillo., Mi sento calmo., Un ambiente rilassante.]
          - text: "L'aggettivo cambia con il **genere** e il **numero** del nome. Gli aggettivi in **-e** hanno una sola forma per maschile e femminile."
            examples:
              [
                Il posto è calmo. / La città è calma.,
                Un posto rilassante. / Una stanza rilassante.,
                I parchi sono tranquilli. / Le spiagge sono tranquille.,
              ]
          - text: 'Invece di parole semplici, usa aggettivi più precisi. Puoi aggiungere **molto, davvero, estremamente**.'
            examples:
              [
                calmo → sereno / tranquillo,
                bello → armonioso / rilassante,
                Il posto è davvero sereno.,
              ]
          - text: '**Attenzione:** *relax* è un nome, non un aggettivo.'
            examples: ['Mi sento molto relax. ✗', 'Mi sento molto rilassato / rilassata. ✓']
      - id: aggettivi-table
        type: table
        caption: Aggettivi del ciclo
        header:
          [Maschile singolare, Femminile singolare, Maschile plurale, Femminile plurale, Ebraico]
        rows:
          - [tranquillo, tranquilla, tranquilli, tranquille, רגוע]
          - [calmo, calma, calmi, calme, רגוע]
          - [caotico, caotica, caotici, caotiche, כאוטי]
          - [stressante, stressante, stressanti, stressanti, מלחיץ]
          - [rilassante, rilassante, rilassanti, rilassanti, מרגיע]
      - id: rules-narrazione
        type: ruleSummary
        skill: Tempi narrativi
        rules:
          - text: "Per raccontare un'esperienza usiamo tempi diversi."
          - text: '**Passato prossimo:** un fatto preciso nel passato.'
            examples: [Ho visitato un posto tranquillo., Mi sono sentito molto tranquillo.]
          - text: "**Imperfetto:** un'abitudine o una descrizione nel passato."
            examples: [Usavo la musica per rilassarmi., Il posto era silenzioso.]
          - text: '**Presente:** come stai e che cosa fai adesso.'
            examples: [Oggi mi sento più calmo.]
          - text: "**Futuro semplice:** che cosa farai. Per un'intenzione o un desiderio usiamo anche *voglio / vorrei* + infinito."
            examples:
              [
                Cambierò le mie abitudini.,
                Voglio cambiare le mie abitudini.,
                Vorrei tornare in montagna.,
              ]
      - id: rules-ipotetico
        type: ruleSummary
        skill: Secondo periodo ipotetico
        rules:
          - text: 'Si usa per parlare di situazioni **immaginarie** e di idee ipotetiche.'
          - text: 'Struttura: **se + congiuntivo imperfetto, condizionale presente**.'
            examples:
              - Se fossi più rilassato, vivrei meglio.
              - Se vivessi nella natura, sarei più felice.
              - Se la luce fosse troppo forte, le persone si sentirebbero stressate.
          - text: "**Attenzione:** dopo *se* non usiamo il condizionale né, nell'italiano corretto, l'imperfetto indicativo."
            examples:
              [
                'Se avevo meno stress, lavorerei meglio. ✗',
                'Se avessi meno stress, lavorerei meglio. ✓',
              ]
          - text: 'Per dare un consiglio usiamo il condizionale di *dovere*.'
            examples: [Dovresti rilassarti di più.]
      - id: ipotetico-table
        type: table
        caption: Congiuntivo imperfetto e condizionale presente
        header: [Persona, essere, vivere, sentirsi (condizionale), essere (condizionale)]
        rows:
          - [io, fossi, vivessi, mi sentirei, sarei]
          - [tu, fossi, vivessi, ti sentiresti, saresti]
          - [lui / lei, fosse, vivesse, si sentirebbe, sarebbe]
          - [noi, fossimo, vivessimo, ci sentiremmo, saremmo]
          - [voi, foste, viveste, vi sentireste, sareste]
          - [loro, fossero, vivessero, si sentirebbero, sarebbero]
      - id: hebrew-examples
        type: examples
        items:
          - text: Se fossi più rilassato, vivrei meglio.
            gloss: אם הייתי יותר רגוע, הייתי חי טוב יותר.
          - text: Mi sono sentito molto tranquillo.
            gloss: הרגשתי מאוד רגוע.
          - text: Dovresti rilassarti di più.
            gloss: כדאי לך להירגע יותר.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Usa aggettivi diversi e precisi.
          Racconta un'esperienza con più tempi.
          Aggiungi una frase con *se* per rendere le risposte più lunghe.
          Parla con frasi complete e chiare.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: >-
          Il riassunto del quaderno è in ebraico; qui è in italiano con le traduzioni
          ebraiche degli esempi principali. La regola sull'accordo degli aggettivi e le
          tabelle sono state aggiunte. Chiedi a ogni studente una breve storia con tre
          tempi e una frase con *se*.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: mindfulness-e-rilassamento-compiti
    title: Compiti con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia un messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Messaggio 1: Mindfulness e rilassamento'
        message: Ciao Mori! Voglio parlare di mindfulness e rilassamento. Fammi domande e aiutami a usare aggettivi, tempi narrativi e il secondo periodo ipotetico.
      - id: mori-rules
        type: callout
        tone: info
        title: Durante la conversazione
        text: |-
          Dai almeno **5 risposte complete**. Usa:
          - 2 **aggettivi**
          - 2 **tempi diversi** (per esempio passato prossimo e presente)
          - 1 frase con il **secondo periodo ipotetico** (*Se fossi…, sarei…*)
      - id: mori-2
        type: aiTutorPrompt
        title: 'Messaggio 2: Una domanda più difficile'
        intro: "Rispondi con un'esperienza del passato, la tua opinione e una condizione (*se…*)."
        message: Fammi una domanda più difficile.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Messaggio 3: Correzione'
        intro: Alla fine della conversazione scrivi questo messaggio.
        message: Correggi le mie frasi e spiegami gli errori.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**
      - id: written-title
        type: heading
        level: 3
        text: Esercizi scritti
      - id: hw1
        type: discussionQuestions
        title: 'Parte 1: Completa le frasi (secondo periodo ipotetico)'
        items:
          - question: Se io ___ (essere) più calmo, ___ (dormire) meglio.
          - question: Se le persone ___ (fare) più mindfulness, ___ (sentirsi) meno stressate.
          - question: Se tu ___ (vivere) nella natura, ___ (essere) più felice.
          - question: Se noi ___ (avere) meno stress, ___ (lavorare) meglio.
      - id: hw2
        type: discussionQuestions
        title: 'Parte 2: Completa con un aggettivo adatto'
        items:
          - question: La città è molto ___. (rumorosa / tranquilla)
          - question: Questo posto è ___ e rilassante.
          - question: Mi sento molto ___ oggi.
          - question: "L'ambiente è troppo ___. (caotico / sereno)"
      - id: hw3
        type: reflection
        prompt: >-
          **Parte 3:** scrivi 6–8 frasi sul tema «Il mio luogo rilassante». Usa 3
          aggettivi, 2 tempi diversi e una frase con il secondo periodo ipotetico.
      - id: hw4
        type: discussionQuestions
        title: 'Parte 4: Correggi le frasi'
        items:
          - question: Se io sono più calmo, dormirei meglio.
          - question: Mi sento molto relax.
          - question: Se avevo meno stress, lavorerei meglio.
          - question: Il posto è molto calma.
    teacherNotes:
      - id: n-written
        anchor: written-title
        text: Gli esercizi scritti vengono dal quaderno («compiti classici»). Il quaderno non ha le soluzioni; quelle qui sotto sono state aggiunte.
      - id: n-hw1
        anchor: hw1
        text: 'Soluzioni: 1 fossi, dormirei; 2 facessero, si sentirebbero; 3 vivessi, saresti; 4 avessimo, lavoreremmo.'
      - id: n-hw2
        anchor: hw2
        text: >-
          Soluzioni possibili: 1 rumorosa o tranquilla (tutte e due corrette, cambia il
          significato); 2 tranquillo / sereno / calmo; 3 risposta libera, con l'accordo
          giusto (calmo / calma, stanco / stanca, rilassato / rilassata…); 4 caotico
          (*troppo* indica qualcosa di negativo).
      - id: n-hw4
        anchor: hw4
        text: >-
          Soluzioni: 1 Se io fossi più calmo, dormirei meglio. 2 Mi sento molto rilassato
          / rilassata. 3 Se avessi meno stress, lavorerei meglio. 4 Il posto è molto
          calmo.

