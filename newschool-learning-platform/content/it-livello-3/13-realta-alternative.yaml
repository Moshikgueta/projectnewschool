vocabulary:
  - slug: realta-alternative
    title: Realtà alternative
    items: *realta-alternative-words

activities:
  - slug: realta-alternative-secondo
    title: 'Secondo periodo ipotetico: se avessi…, farei…'
    minutes: 8
    items:
      - id: viaggerei
        type: multipleChoice
        prompt: Se avessi più tempo, ___ di più.
        options:
          - { text: viaggerei, correct: true }
          - {
              text: viaggerò,
              feedback: '*Viaggerò* è futuro. Con *se* + congiuntivo imperfetto (*avessi*) la seconda parte va al condizionale: *viaggerei*.',
            }
          - {
              text: viaggiassi,
              feedback: '*Viaggiassi* è congiuntivo imperfetto: va dopo *se*. Nella seconda parte usiamo il condizionale: *viaggerei*.',
            }
      - id: vivessi
        type: fillBlank
        prompt: Completa con il congiuntivo imperfetto di *vivere* (io).
        text: Se ___ in un altro paese, imparerei un'altra lingua.
        blanks: [[vivessi, io vivessi]]
      - id: fossi-ricco
        type: multipleChoice
        prompt: Se ___ ricco, comprerei una casa.
        options:
          - { text: fossi, correct: true }
          - {
              text: sarei,
              feedback: 'Dopo *se* non usiamo mai il condizionale. Usiamo il congiuntivo imperfetto: *fossi*.',
            }
          - {
              text: sono,
              feedback: 'Con *sono* (presente) la seconda parte sarebbe *compro*. Con *comprerei* usiamo il congiuntivo imperfetto: *fossi*.',
            }
      - id: se-condizionale
        type: trueFalse
        prompt: 'La frase *Se avrei più tempo, viaggerei di più* è corretta.'
        answer: false
        feedback:
          correct: 'Giusto! Dopo *se* non usiamo il condizionale: *Se avessi più tempo, viaggerei di più.*'
          incorrect: 'Dopo *se* non usiamo mai il condizionale. La frase corretta è: *Se avessi più tempo, viaggerei di più.*'
      - id: unisci-mondo
        type: matching
        prompt: Unisci le due parti di ogni frase.
        pairs:
          - [Se non esistesse il denaro…, …le persone scambierebbero prodotti.]
          - [Se tutti studiassero gratis…, …ci sarebbe meno violenza.]
          - [Se fossi in te…, …non lo farei.]
          - [Se potessi vivere in un libro…, …sceglierei Harry Potter.]
      - id: vivessimo
        type: fillBlank
        prompt: Completa con *vivere* (congiuntivo imperfetto) e *imparare* (condizionale presente).
        text: Se noi ___ in Italia, ___ meglio la lingua.
        blanks: [[vivessimo, noi vivessimo], [impareremmo]]
      - id: frase-corretta
        type: multipleChoice
        prompt: Quale frase è corretta?
        options:
          - { text: 'Se avessi più tempo, viaggerei di più.', correct: true }
          - {
              text: 'Se ho più tempo, viaggerei di più.',
              feedback: 'Con il condizionale (*viaggerei*) dopo *se* usiamo il congiuntivo imperfetto: *Se avessi…*',
            }
          - {
              text: 'Se avrei più tempo, viaggerei di più.',
              feedback: 'Dopo *se* non usiamo il condizionale: *Se avessi…*',
            }
      - id: ordina-ricco
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Se fossi ricco, comprerei una casa.

  - slug: realta-alternative-terzo
    title: 'Terzo periodo ipotetico: se avessi avuto…, avrei fatto…'
    minutes: 8
    items:
      - id: avrei-superato
        type: multipleChoice
        prompt: Se avessi studiato di più, ___ l'esame.
        options:
          - { text: avrei superato, correct: true }
          - {
              text: supererei,
              feedback: 'La condizione è nel passato (*avessi studiato*): anche il risultato è nel passato, con il condizionale passato: *avrei superato*.',
            }
          - {
              text: avrei superare,
              feedback: "Dopo *avrei* va il participio, non l'infinito: *avrei superato*.",
            }
      - id: avessi-saputo
        type: fillBlank
        prompt: Completa con il congiuntivo trapassato di *sapere* (io).
        text: Se ___ prima, avrei fatto una scelta diversa.
        blanks: [[avessi saputo, io avessi saputo]]
      - id: avessi-studiato
        type: multipleChoice
        prompt: Se ___ di più, avrei passato l'esame.
        options:
          - { text: avessi studiato, correct: true }
          - {
              text: avrei studiato,
              feedback: 'Dopo *se* non usiamo il condizionale. Usiamo il congiuntivo trapassato: *avessi studiato*.',
            }
          - {
              text: avevo studiato,
              feedback: "*Avevo studiato* è trapassato prossimo (indicativo): si sente nella lingua parlata, ma nell'italiano corretto dopo *se* usiamo il congiuntivo: *avessi studiato*.",
            }
      - id: uso-terzo
        type: trueFalse
        prompt: Il terzo periodo ipotetico parla di situazioni nel passato che non possiamo più cambiare.
        answer: true
        feedback:
          correct: "Giusto! *Se avessi studiato di più, avrei superato l'esame* (ma non ho studiato)."
          incorrect: "Il terzo periodo ipotetico parla del passato: *Se avessi studiato di più, avrei superato l'esame* (ma non ho studiato)."
      - id: unisci-condizionale-passato
        type: matching
        prompt: Unisci ogni verbo al suo condizionale passato (io).
        pairs:
          - [fare, avrei fatto]
          - [andare, sarei andato]
          - [essere, sarei stato]
          - [vedere, avrei visto]
          - [avere, avrei avuto]
      - id: sarebbe-cambiata
        type: fillBlank
        prompt: Completa con il condizionale passato di *cambiare*. Attenzione al soggetto (*la mia vita*).
        text: Se avessi fatto una scelta diversa, la mia vita ___.
        blanks: [[sarebbe cambiata]]
      - id: treno
        type: multipleChoice
        prompt: Se fossimo partiti prima, non ___ il treno.
        options:
          - { text: avremmo perso, correct: true }
          - {
              text: perderemmo,
              feedback: 'La condizione è nel passato (*fossimo partiti*): il risultato va al condizionale passato, *avremmo perso*.',
            }
          - {
              text: abbiamo perso,
              feedback: '*Abbiamo perso* racconta un fatto reale. Per immaginare un passato diverso usiamo *avremmo perso*.',
            }
      - id: ordina-esame
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Se avessi studiato di più, avrei superato l'esame.
