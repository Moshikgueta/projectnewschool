# Cycle "Cucina", converted from the Italian level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Italian).
course: it-livello-3
slug: cucina
title: Cucina
goal: Parlare di esperienze con il cibo con il passato prossimo e dare consigli e opinioni con i verbi modali.
position: 6
status: in_review

review:
  - >-
    The two workbook exercises ("Verbi modali" and "Passato prossimo") are NEW: the
    notebook has no self-correcting exercises. They were written from the cycle's
    summary rules, the class examples and its vocabulary. Please check level,
    wording and every right answer before students see them.
  - >-
    Summary, passato prossimo (rule translated from English, wrong for Italian):
    "Si usa per parlare di esperienze senza specificare quando sono avvenute" is the
    English present-perfect rule. In Italian the passato prossimo is used for any
    finished action, also with a precise time (ieri, l'anno scorso). The rule is
    rewritten. "Con for e since in italiano: Da + periodo / Da + momento" → an
    Italian rule: for something that started in the past and is still true, Italian
    uses the PRESENT + da (Lavoro come chef da dieci anni), not the passato prossimo.
    ADDED: essere / avere with the passato prossimo (diventare → sono diventati) and
    "mai / già" in the sentence.
  - >-
    Summary, verbi modali: "Il verbo non cambia forma dopo il modale" (from English)
    → the modal is conjugated and the second verb stays in the infinitive. ADDED
    (not in the source, please confirm): a table of dovere / potere / volere in the
    present and in the condizionale; the condizionale (dovresti, potrebbe,
    vorrei) for advice and polite requests, which the class examples use all the
    time; the position of the pronoun (lo posso mangiare / posso mangiarlo).
  - >-
    Activity 2, Fase 3 asked for "cinque verbi modali diversi", but Italian has three
    (dovere, potere, volere). Now: "5 frasi con i verbi modali (dovere, potere,
    volere), al presente o al condizionale". The fifth example "Il ristorante
    trarrebbe beneficio dall'introduzione di piatti stagionali" has no modal verb →
    "Il ristorante dovrebbe introdurre piatti stagionali".
  - >-
    Corrections: broken markdown (\*\*, &#10;) in warm-up questions 1, 4 and 5;
    "Esempi di risposte del cameriere" had broken numbering (1., then 1.–5.), now one
    list. Activity 3 "Fase finale" had the heading line as the first bullet; now one
    step. Mori: "Attività 1 / 2" → "Messaggio 2 / 3", written as messages the student
    sends.
  - >-
    Added (not in the source): an example for the "Giro di presentazione" frame and
    sentence frames for the warm-up questions; the source's three example answers are
    in the warm-up teacher note. Activity 4 had no example; one was added ("Una
    volta ho restituito un piatto perché era freddo…"). The warm-up says to choose 6
    questions.
  - >-
    Left out: the gamma.app lesson-slides link (not allowed; mentioned in a teacher
    note), the "Data / Partecipanti" lines and the "Risposta dello studente 1/2/3"
    lines (the platform has answer boxes). "?new" was removed from the Quizlet link.
    The cycle has no classic homework and no times in the source, so none are
    recorded.
  - >-
    Vocabulary: "Prenotazione – הזמנה" → "הזמנת מקום" (so it is not confused with
    "Ordinare – להזמין"); "Bollire – לבשל במים" → "להרתיח / לבשל במים"; "Grigliare –
    לצלות" → "לצלות על הגריל"; "Cucina – מטבח" → "מטבח (חדר / סגנון בישול)" (the
    lesson uses both meanings: "la cucina etiope", "ho controllato in cucina").
    Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: cucina-classe
    title: 'In classe: Cucina'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Cucina
      - id: skills
        type: cycleOverview
        skills:
          - name: Verbi modali
            description: 'Consigli, possibilità e necessità: *devi, dovresti, puoi, potrebbe, vorrei* + infinito'
          - name: Passato prossimo
            description: 'Esperienze con il cibo: *ho provato, hai mai mangiato, non ho mai ordinato*'
      - id: quizlet
        type: externalLink
        label: Cucina su Quizlet
        url: https://quizlet.com/br/1149537205/cucina-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Giro di presentazione
      - id: intro
        type: sentenceFrame
        frame: Mi chiamo ___. Il venerdì sera la mia famiglia mangia ___.
        example: Mi chiamo Dana. Il venerdì sera la mia famiglia mangia il pollo con il riso.
      - id: warmup-title
        type: heading
        level: 3
        text: Domande di riscaldamento
      - id: warmup-hint
        type: callout
        tone: info
        text: Rispondi con frasi complete e usa il **passato prossimo**.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Che tipo di cucina hai provato che, secondo te, tutti dovrebbero provare almeno una volta? Perché?
            frame: Ho provato la cucina ___ e penso che tutti dovrebbero provarla perché ___.
          - question: Hai mai mangiato qualcosa di insolito che forse non avresti provato se qualcuno non ti avesse incoraggiato? Com'è stato?
            frame: Ho mangiato ___. È stato ___.
          - question: Qual è un piatto che hai sempre voluto cucinare ma non sei ancora riuscito / riuscita a preparare? Che cosa ti ha impedito di farlo?
            frame: Ho sempre voluto preparare ___, ma non ne ho avuto l'occasione perché ___.
          - question: Qual è un piatto tradizionale della tua infanzia che non hai mai dimenticato e che ti piacerebbe condividere con altre persone?
            frame: Non ho mai dimenticato ___. Mi piacerebbe condividerlo perché ___.
          - question: Qual è la ricetta più difficile che hai mai preparato?
            frame: La ricetta più difficile che ho preparato è stata ___.
          - question: Quale tipo di cucina pensi che i ristoranti israeliani dovrebbero includere di più nei loro menù? Perché?
            frame: Penso che dovrebbero includere più cucina ___ perché ___.
          - question: Qual è un cibo che hai assaggiato e che non mangerai mai più? Descrivilo e spiega il motivo.
            frame: Ho assaggiato ___ e non lo mangerò mai più perché ___.
          - question: Quale piatto potrebbe essere considerato il piatto nazionale di Israele? Spiega la tua opinione.
            frame: Secondo me, il piatto nazionale potrebbe essere ___ perché ___.
      - id: activities-title
        type: heading
        level: 3
        text: Attività
      - id: act1
        type: classActivity
        title: 'Attività 1: Hai mai assaggiato il mio comfort food?'
        skills: [Passato prossimo, Verbi modali]
        steps:
          - 'I **comfort food** sono cibi che ci fanno sentire meglio, che mangiamo quando vogliamo consolarci o coccolarci.'
          - Pensa a un tuo comfort food e mandalo all'insegnante in modo anonimo.
          - Uno studente è il parlante. Gli altri fanno domande con risposta sì o no per indovinare il suo comfort food.
          - Chi fa le domande usa solo il passato prossimo. Il parlante risponde al passato prossimo.
          - '**Versione più complessa:** ogni 3 o 4 domande, chi indovina deve usare un verbo modale. Puoi fare anche domande con aggettivi, confronti culturali o ricordi (vedi gli esempi).'
        example: |-
          *Hai mai mangiato questo piatto durante una festa di famiglia?*
          *Si possono aggiungere spezie a questo piatto?* (verbo modale)
          *Le persone dovrebbero mangiarlo caldo?* (verbo modale)
          *Potrebbe essere un piatto tipico di un altro paese?* (verbo modale)
          *È un piatto cremoso e saporito?* (aggettivi)
          *Le persone in Giappone hanno mai mangiato un piatto simile?* (confronto culturale)
      - id: act2
        type: classActivity
        title: 'Attività 2: Critica del ristorante'
        skills: [Verbi modali]
        steps:
          - Pensa a ristoranti o catene di ristorazione famosi che hai visitato negli anni. Immagina di essere un critico gastronomico che parla con altri critici.
          - '**Fase 1:** scegli un ristorante e scrivi una breve descrizione: che cosa ti è piaciuto e che cosa non ti è piaciuto, che cosa dovrebbe cambiare e che cosa non dovrebbe cambiare.'
          - '**Fase 2:** incontra gli altri critici e discuti le domande qui sotto con i verbi modali.'
          - '**Fase 3:** scegli un ristorante e crea un piano di miglioramento con 5 punti. Usa i verbi modali (*dovere, potere, volere*), al presente o al condizionale.'
        example: |-
          *Il ristorante dovrebbe ridurre il livello di rumore nelle ore di punta.*
          *Potrebbe rinnovare l'arredamento per renderlo più moderno.*
          *Potrebbe attirare più clienti offrendo opzioni vegane.*
          *Il personale deve offrire un servizio più cordiale e veloce.*
          *Il ristorante dovrebbe introdurre piatti stagionali.*
      - id: act2-questions
        type: discussionQuestions
        title: Discussione tra critici
        items:
          - question: Che cosa dovrebbe migliorare il ristorante?
            frame: Il ristorante dovrebbe ___.
          - question: Quali aspetti non dovrebbero cambiare?
            frame: Non dovrebbe cambiare ___ perché ___.
          - question: Quali elementi potrebbero attirare o scoraggiare i clienti?
            frame: ___ potrebbe attirare / scoraggiare i clienti.
          - question: Quali cambiamenti potrebbero rendere il ristorante più di successo?
            frame: Il ristorante potrebbe ___.
          - question: Quali aggiunte ti farebbero tornare più spesso?
            frame: Tornerei più spesso se ___.
      - id: act2-plan
        type: discussionQuestions
        title: Il mio piano di miglioramento
        items:
          - question: '1. ___'
          - question: '2. ___'
          - question: '3. ___'
          - question: '4. ___'
          - question: '5. ___'
      - id: act3
        type: classActivity
        title: 'Attività 3: Gioco di ruolo, posso ordinare ciò di cui ho bisogno?'
        skills: [Passato prossimo, Verbi modali]
        steps:
          - "Simulazione al ristorante. Uno studente è il **cliente** con esigenze alimentari specifiche, l'altro è il **cameriere**."
          - '**Obiettivo del cliente:** ordinare un pasto sicuro e piacevole, facendo domande chiare ed esprimendo i propri bisogni.'
          - '**Obiettivo del cameriere:** aiutare il cliente spiegando il menù, chiarendo gli ingredienti e dando consigli con i verbi modali.'
          - Nella conversazione usate almeno una volta il passato prossimo e almeno una volta un verbo modale.
          - "**Fase finale:** cliente e cameriere spiegano alla classe che cosa hanno ordinato e perché, che cosa dovrebbero evitare e che cosa potrebbe essere migliorato nel menù. Se c'è tempo, scambiate i ruoli."
      - id: act3-clients
        type: table
        caption: Tipi di cliente
        header: [Cliente, La tua storia]
        rows:
          - [
              Cliente vegano,
              In passato hai avuto brutte esperienze perché un piatto dichiarato vegano non lo era.,
            ]
          - [Cliente kosher, Hai letto una raccomandazione su un blog di viaggi ebraico.]
          - [
              Cliente vegetariano,
              'Non hai mai provato questo ristorante, ma hai sentito dire che è adatto ai vegetariani.',
            ]
          - [
              Cliente con allergie,
              Non sei riuscito / riuscita a mangiare fuori per mesi a causa della tua allergia.,
            ]
      - id: act3-examples
        type: table
        caption: Esempi di frasi
        header: [Cliente, Cameriere]
        rows:
          - [Dovrei ordinare questo piatto?, Dovrebbe evitare questo piatto perché contiene noci.]
          - [
              Potrebbe dirmi se questo piatto contiene lattosio?,
              Potrebbe provare il piatto di verdure grigliate.,
            ]
          - [
              Ho avuto problemi con questo ingrediente in passato.,
              Lo chef potrebbe adattarlo per lei.,
            ]
          - [Non ho mangiato latticini da anni., Abbiamo già preparato la pasta senza glutine.]
          - [Mi consiglierebbe qualcosa di vegano?, Ho controllato in cucina e non contiene noci.]
          - [
              Potrebbe essere cucinato con burro?,
              Dobbiamo fare attenzione alla contaminazione incrociata.,
            ]
      - id: act4
        type: classActivity
        title: 'Attività 4: Dibattito, dovrei restituire il mio piatto?'
        skills: [Verbi modali, Passato prossimo]
        steps:
          - "Domande per cominciare: i clienti dovrebbero poter restituire un piatto al ristorante? Che cosa succede se il piatto non piace? L'hai mai fatto? Che cosa dovrebbe fare il cliente? Qual è la responsabilità del ristorante?"
          - '**Squadra A:** restituire il cibo è ragionevole e importante. **Squadra B:** non si dovrebbe mai restituire un piatto ordinato.'
          - 'Ogni argomento deve avere un verbo modale o il passato prossimo. Aggiungi esempi personali.'
          - 'Temi da includere: il tipo di ristorante (elegante, informale, da asporto), le norme culturali e le differenze tra paesi, il motivo della restituzione, il servizio clienti e la responsabilità del ristorante.'
          - '**Fase finale:** discussione di classe (domande qui sotto).'
        example: '*Una volta ho restituito un piatto perché era freddo. Secondo me, un ristorante elegante dovrebbe sempre cambiarlo.*'
      - id: act4-questions
        type: discussionQuestions
        title: Discussione finale
        items:
          - question: Come dovrebbero i ristoranti trovare un equilibrio tra un buon servizio ed evitare gli sprechi alimentari?
            frame: I ristoranti dovrebbero ___.
          - question: Quali norme culturali dovrebbero cambiare o non cambiare con la globalizzazione?
            frame: Secondo me, ___ dovrebbe / non dovrebbe cambiare perché ___.
          - question: Quali regole potrebbero aiutare clienti e personale a gestire meglio i reclami?
            frame: Una regola utile potrebbe essere ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Due abilità in questo ciclo: **Verbi modali** (Attività 2, 3 e 4) e **Passato
          prossimo** (riscaldamento, Attività 1, 3 e 4). Il quaderno non indica i tempi.
          La presentazione della lezione (gamma.app) non è inclusa nella piattaforma:
          usala dal tuo materiale, se vuoi.
      - id: n-warmup
        anchor: warmup
        text: >-
          Scegli 6 domande. Controlla che gli studenti rispondano con frasi complete e
          usino il passato prossimo. Esempi di risposta del quaderno: 1. *Ho provato la
          cucina etiope e penso che tutti dovrebbero provarla almeno una volta perché ha
          sapori interessanti che non sono molto comuni nella cucina occidentale.* 2. *Ho
          mangiato il coniglio e non credo che lo avrei mangiato se non fosse stato
          durante un tour organizzato, perché mi sembrava strano mangiare un animale così
          carino.* 3. *Ho sempre voluto preparare una cheesecake basca, ma non ne ho avuto
          l'occasione perché il mio forno non è abbastanza buono.*
      - id: n-act1
        anchor: act1
        text: >-
          Raccogli i comfort food in privato (per esempio in chat). Controlla che le
          domande siano al passato prossimo (*Hai mai mangiato…? L'hai cucinato tu?*).
          Con i gruppi più forti usa la versione più complessa.
      - id: n-act3
        anchor: act3
        text: Assegna i tipi di cliente. Alla fine ogni coppia racconta alla classe che cosa ha ordinato il cliente.
      - id: n-act4
        anchor: act4
        text: Dividi la classe in due squadre. Incoraggia esempi personali e chiudi con la discussione di classe.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: cucina-riepilogo
    title: Riepilogo
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Riassunto grammaticale
      - id: rules-passato
        type: ruleSummary
        skill: Passato prossimo
        rules:
          - text: 'Il **passato prossimo** si usa per azioni ed esperienze **finite** nel passato, con o senza un momento preciso. Si forma con **avere** o **essere** + **participio passato**.'
            examples:
              - Non ho mai mangiato in un ristorante vegano.
              - Hai mai restituito un piatto?
              - "Ho provato il sushi, ma non l'ho mai ordinato in Israele."
          - text: "Con **mai** (*hai mai…?, non ho mai…*) e **già** parliamo di esperienze. *Mai* e *già* vanno tra l'ausiliare e il participio."
            examples:
              [Hai mai assaggiato la cucina etiope?, Abbiamo già preparato la pasta senza glutine.]
          - text: 'Si usa anche per **cambiamenti** o **tendenze recenti**, con espressioni come *di recente, ultimamente, negli ultimi anni*. I verbi di cambiamento come *diventare* usano **essere**.'
            examples:
              - Negli ultimi anni i clienti sono diventati più esigenti.
              - I ristoranti hanno iniziato a offrire più opzioni per le allergie.
          - text: "Per un'azione che è cominciata nel passato e **continua ancora oggi**, l'italiano usa il **presente + da** (non il passato prossimo): *da* + un periodo (*da dieci anni*) o *da* + un momento preciso (*dal 1998*)."
            examples:
              - Lavoro come chef da dieci anni.
              - Questo ristorante serve piatti kosher dal 1998.
      - id: rules-modali
        type: ruleSummary
        skill: Verbi modali
        rules:
          - text: '**Dovere** = necessità; **potere** = possibilità; **volere** = volontà.'
            examples:
              [
                Devi evitare questo piatto perché contiene noci.,
                Puoi scegliere un dolce.,
                Voglio provare la cucina etiope.,
              ]
          - text: "Il verbo modale cambia secondo la persona; il verbo dopo il modale resta all'**infinito**."
            examples: [Devi evitare…, Il personale deve offrire…, Possiamo aggiungere…]
          - text: 'Per dare un **consiglio** o fare una **richiesta gentile** usiamo il modale al **condizionale**: *dovresti, potresti, potrebbe, vorrei*.'
            examples:
              - Dovresti provare il piatto del giorno.
              - "Potresti scegliere l'opzione vegetariana."
              - Potrebbe dirmi se questo piatto contiene lattosio?
          - text: "Il pronome può andare prima del modale o attaccato all'infinito."
            examples:
              [Lo posso mangiare. / Posso mangiarlo., Le persone dovrebbero mangiarlo caldo?]
      - id: modali-table
        type: table
        caption: Verbi modali
        header: [Persona, dovere, potere, volere, condizionale]
        rows:
          - [io, devo, posso, voglio, 'dovrei, potrei, vorrei']
          - [tu, devi, puoi, vuoi, 'dovresti, potresti, vorresti']
          - [lui / lei / Lei, deve, può, vuole, 'dovrebbe, potrebbe, vorrebbe']
          - [noi, dobbiamo, possiamo, vogliamo, 'dovremmo, potremmo, vorremmo']
          - [voi, dovete, potete, volete, 'dovreste, potreste, vorreste']
          - [loro, devono, possono, vogliono, 'dovrebbero, potrebbero, vorrebbero']
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Ripassa il riepilogo e chiedi a ogni studente un'esperienza al passato prossimo e un consiglio con un verbo modale su un ristorante che conosce.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: cucina-compiti
    title: Compiti con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Compiti con Mori
      - id: how
        type: text
        text: Apri la chat con Mori, copia un messaggio e invialo. Mori ti farà delle domande; rispondi a tutte.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Messaggio 1: Le mie esperienze nei ristoranti'
        message: Ciao Mori! Parliamo delle mie esperienze nei ristoranti. Fammi domande che mi facciano usare il passato prossimo e i verbi modali per dare consigli e opinioni.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Messaggio 2: Il menù dei miei sogni'
        intro: 'Crea per Mori un menù completo: 1 antipasto, 1 piatto principale, 1 dolce e 1 bevanda.'
        message: Ciao Mori! Voglio creare per te il menù dei miei sogni, con un antipasto, un piatto principale, un dolce e una bevanda. Prima dimmi le tue preferenze. Io farò suggerimenti con i verbi modali (dovresti, potresti, puoi…) e adatterò il menù per te. Correggi i miei errori, per favore.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Messaggio 3: Le mie esperienze culinarie'
        intro: 'Usa il passato prossimo e aggettivi per descrivere sapori, consistenze e preferenze (*saporito, piccante, delicato…*). Fai anche tu domande a Mori, per rendere la conversazione più naturale.'
        message: Ciao Mori! Voglio parlare dei piatti che ho provato e di quelli che non ho ancora provato. Fammi domande e correggi i miei errori. Anch'io ti farò qualche domanda.
      - id: tips
        type: callout
        tone: tip
        title: Consigli
        text: |-
          Vuoi altre domande? Scrivi: **Per favore, fammi altre domande!**
          Non capisci una spiegazione? Scrivi: **Me lo puoi spiegare in ebraico ma con la frase in italiano?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: cucina-pratica
    book: workbook
    title: 'Pratica: Cucina'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Esercitati sulle due abilità del ciclo. Ogni risposta viene corretta subito e puoi riprovare.
      - id: ex-modali
        type: activity
        activity: cucina-modali
      - id: ex-passato
        type: activity
        activity: cucina-passato

