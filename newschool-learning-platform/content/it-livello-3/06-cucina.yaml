vocabulary:
  - slug: cucina
    title: Cucina
    items: *cucina-words

activities:
  - slug: cucina-modali
    title: 'Verbi modali: devi, dovresti, potrebbe'
    minutes: 8
    items:
      - id: dovresti-provare
        type: multipleChoice
        prompt: Dovresti ___ il piatto del giorno.
        options:
          - { text: provare, correct: true }
          - { text: provi, feedback: "Dopo un verbo modale usiamo l'infinito: *dovresti provare*." }
          - {
              text: provato,
              feedback: "*Provato* è il participio. Dopo un verbo modale usiamo l'infinito: *provare*.",
            }
      - id: unisci-modali
        type: matching
        prompt: Unisci ogni verbo o frase al suo significato.
        pairs:
          - [dovere, necessità]
          - [potere, possibilità]
          - [volere, volontà]
          - [Dovresti provare il tiramisù., un consiglio]
          - [Potrebbe dirmi il prezzo?, una richiesta gentile]
      - id: dovrebbe-ridurre
        type: fillBlank
        prompt: Completa con il condizionale di *dovere* (il ristorante).
        text: Il ristorante ___ ridurre il livello di rumore nelle ore di punta.
        blanks: [[dovrebbe]]
      - id: potrebbe-dirmi
        type: fillBlank
        prompt: Completa con il condizionale di *potere* (Lei, forma di cortesia).
        text: ___ dirmi se questo piatto contiene lattosio?
        blanks: [[Potrebbe, potrebbe]]
      - id: infinito
        type: trueFalse
        prompt: "Dopo un verbo modale il secondo verbo va all'infinito: *Devi evitare questo piatto.*"
        answer: true
        feedback:
          correct: "Giusto! Il modale cambia secondo la persona (*devo, devi, deve…*), il secondo verbo resta all'infinito."
          incorrect: "Il secondo verbo resta all'infinito: *Devi evitare*, *Possiamo aggiungere*, *Dovresti provare*."
      - id: devi-evitare
        type: multipleChoice
        prompt: Questo piatto contiene noci e tu sei allergico. ___ evitarlo.
        options:
          - { text: Devi, correct: true }
          - {
              text: Vuoi,
              feedback: '*Volere* esprime una volontà. Qui è una necessità (sei allergico): *Devi*.',
            }
          - { text: Deve, feedback: '*Deve* è per lui / lei / Lei. Qui parliamo a *tu*: *Devi*.' }
      - id: consiglio
        type: multipleChoice
        prompt: Quale frase dà un consiglio con un verbo modale al condizionale?
        options:
          - { text: "Potresti scegliere l'opzione vegetariana.", correct: true }
          - {
              text: "Hai scelto l'opzione vegetariana.",
              feedback: 'Questa frase è al passato prossimo e non ha un verbo modale. Il condizionale è *potresti, dovresti*.',
            }
          - {
              text: "Puoi scegli l'opzione vegetariana.",
              feedback: "Dopo il modale serve l'infinito (*puoi scegliere*), e il consiglio gentile usa il condizionale: *potresti scegliere*.",
            }
      - id: ordina-piatto
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Dovresti provare il piatto del giorno.

  - slug: cucina-passato
    title: 'Passato prossimo: ho provato, hai mai mangiato'
    minutes: 8
    items:
      - id: sono-diventati
        type: multipleChoice
        prompt: Negli ultimi anni i clienti ___ più esigenti.
        options:
          - { text: sono diventati, correct: true }
          - { text: hanno diventato, feedback: '*Diventare* usa *essere*: *sono diventati*.' }
          - {
              text: diventano,
              feedback: '*Diventano* è presente. Con *negli ultimi anni* parliamo di un cambiamento già avvenuto: *sono diventati*.',
            }
      - id: ho-mai-mangiato
        type: fillBlank
        prompt: Completa con il passato prossimo di *mangiare* (io).
        text: Non ___ mai ___ in un ristorante vegano.
        blanks: [[ho], [mangiato]]
      - id: hai-restituito
        type: multipleChoice
        prompt: ___ mai restituito un piatto? (tu)
        options:
          - { text: Hai, correct: true }
          - { text: Sei, feedback: '*Restituire* usa *avere*: *Hai mai restituito…?*' }
          - { text: Ha, feedback: '*Ha* è per lui / lei / Lei. Per *tu* usiamo *hai*.' }
      - id: hanno-iniziato
        type: fillBlank
        prompt: Completa con il passato prossimo di *iniziare*.
        text: I ristoranti ___ a offrire più opzioni per le allergie.
        blanks: [[hanno iniziato]]
      - id: presente-da
        type: trueFalse
        prompt: "Per un'azione che continua ancora oggi usiamo il presente + *da*: *Lavoro come chef da dieci anni.*"
        answer: true
        feedback:
          correct: 'Giusto! Lavoro ancora come chef: usiamo il presente + *da*.'
          incorrect: "Se l'azione continua ancora oggi, l'italiano usa il presente + *da*: *Lavoro come chef da dieci anni* (non *ho lavorato*)."
      - id: participi
        type: matching
        prompt: Unisci ogni verbo al suo participio passato.
        pairs:
          - [assaggiare, assaggiato]
          - [restituire, restituito]
          - [scegliere, scelto]
          - [fare, fatto]
          - [provare, provato]
      - id: lho-ordinato
        type: multipleChoice
        prompt: Ho provato il sushi, ma non ___ mai ordinato in Israele.
        options:
          - { text: "l'ho", correct: true }
          - {
              text: lo,
              feedback: "Manca l'ausiliare *avere*: *non l'ho mai ordinato* (lo + ho = l'ho).",
            }
          - { text: "l'ha", feedback: "*Ha* è per lui / lei. La frase parla di *io*: *l'ho*." }
      - id: ordina-restituito
        type: reorderSentence
        prompt: Metti le parole in ordine.
        sentence: Hai mai restituito un piatto?
