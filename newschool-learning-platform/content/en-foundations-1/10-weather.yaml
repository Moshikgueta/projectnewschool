vocabulary:
  - slug: weather
    title: Weather
    items: *weather-words

activities:
  - slug: weather-describing
    title: 'Describing the weather: there is, there are, adjectives'
    minutes: 8
    items:
      - id: there-is-storm
        type: multipleChoice
        prompt: ___ a storm today.
        options:
          - { text: There is, correct: true }
          - {
              text: There are,
              feedback: '*There are* is for more than one thing. *A storm* is one thing: *there is*.',
            }
      - id: there-are-clouds
        type: multipleChoice
        prompt: ___ heavy clouds in the sky.
        options:
          - { text: There are, correct: true }
          - {
              text: There is,
              feedback: '*There is* is for one thing. *Clouds* is more than one: *there are*.',
            }
      - id: windy-day
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: It is a windy day., correct: true }
          - {
              text: It is a day windy.,
              feedback: 'The adjective goes before the noun: *a windy day*.',
            }
      - id: adjective-before
        type: trueFalse
        prompt: 'Adjectives go before the noun: *a rainy afternoon*.'
        answer: true
        feedback:
          correct: 'Right! *A windy day, a rainy afternoon, a sunny morning.*'
          incorrect: 'In English, the adjective goes before the noun: *a rainy afternoon*.'
      - id: cabin-trees
        type: fillBlank
        prompt: Complete with *there is* or *there are*.
        text: In the mountains, ___ a cozy cabin and ___ many trees.
        blanks: [[there is, there's], [there are]]
      - id: you-can
        type: fillBlank
        prompt: Complete with one word.
        text: The sky is clear and sunny. You ___ go swimming.
        blanks: [[can]]
      - id: weather-words
        type: matching
        prompt: Match each word with its meaning.
        pairs:
          - [Sunny, שטוף שמש]
          - [Rainy, גשום]
          - [Cloudy, מעונן]
          - [Snowy, מושלג]
          - [Cold, קר]
      - id: heavy-clouds
        type: reorderSentence
        prompt: Put the words in order.
        sentence: There are heavy clouds.

  - slug: weather-numbers
    title: Dates and numbers
    minutes: 8
    items:
      - id: numbers
        type: matching
        prompt: Match the numbers.
        pairs:
          - ['15', fifteen]
          - ['21', twenty-one]
          - ['35', thirty-five]
          - ['60', sixty]
          - ['98', ninety-eight]
      - id: forty
        type: multipleChoice
        prompt: How do you write 40?
        options:
          - { text: forty, correct: true }
          - { text: fourty, feedback: 'Careful: *four*, but *forty* (no *u*).' }
          - { text: fourteen, feedback: '*Fourteen* is 14. Tens end in *-ty*: 40 is *forty*.' }
      - id: nineteen
        type: multipleChoice
        prompt: It is 19 degrees now. How do you say 19?
        options:
          - { text: nineteen, correct: true }
          - { text: ninety, feedback: '*Ninety* is 90. Numbers 13–19 end in *-teen*: *nineteen*.' }
          - { text: nine-ten, feedback: 'Numbers 13–19 end in *-teen*: *nineteen*.' }
      - id: twenty-seven
        type: fillBlank
        prompt: Write the number in words.
        text: 'It is 27 degrees now: it is ___ degrees.'
        blanks: [[twenty-seven, twenty seven]]
      - id: ty-rule
        type: trueFalse
        prompt: 'The tens 20, 30, 40… end in *-ty*: twenty, thirty, forty.'
        answer: true
        feedback:
          correct: 'Right! *Twenty, thirty, forty, fifty, sixty…*'
          incorrect: 'The tens end in *-ty*: *twenty, thirty, forty…*'
      - id: eleven-rule
        type: trueFalse
        prompt: '*Eleven* is made like *twenty-one*: a tens word + a number.'
        answer: false
        feedback:
          correct: 'Right! *Eleven* and *twelve* are irregular: learn them by heart.'
          incorrect: '*Eleven* (11) and *twelve* (12) are irregular. Learn them by heart.'
      - id: days
        type: fillBlank
        prompt: Write the day of the week.
        text: Today is Monday. Tomorrow is ___. Friday comes after ___.
        blanks: [[Tuesday], [Thursday]]
      - id: thirty-sunday
        type: reorderSentence
        prompt: Put the words in order.
        sentence: It is thirty degrees on Sunday.
