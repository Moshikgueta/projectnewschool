vocabulary:
  - slug: discoveries
    title: Discoveries
    items: *discoveries-words

activities:
  - slug: discoveries-actions
    title: Actions in the present
    minutes: 8
    items:
      - id: elephant-walks
        type: multipleChoice
        prompt: The elephant ___.
        options:
          - { text: walks, correct: true }
          - {
              text: walk,
              feedback: '*The elephant* is one animal (*it*). Like *he* and *she*, add **s**: *walks*.',
            }
          - {
              text: is walk,
              feedback: 'Do not write *am, is, are* when you have a verb: *The elephant walks.*',
            }
      - id: giraffe-monkey
        type: fillBlank
        prompt: Write the verb in the present.
        text: The giraffe ___ (eat) leaves. The monkey ___ (climb) the tree.
        blanks: [[eats], [climbs]]
      - id: study-science
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: I study science., correct: true }
          - {
              text: I am study science.,
              feedback: 'Do not write *am, is, are* when you have a verb. Write the person and the verb: *I study science.*',
            }
          - {
              text: I studies science.,
              feedback: 'With *I*, the verb does not change: *I study science.*',
            }
      - id: lions-eat
        type: trueFalse
        prompt: '*Lions eats meat.* is a correct sentence.'
        answer: false
        feedback:
          correct: 'Right! *Lions* is *they*, so there is no *s*: *Lions eat meat.*'
          incorrect: '*Lions* is *they*, so the verb has no *s*: *Lions eat meat.*'
      - id: he-she-forms
        type: matching
        prompt: Match each verb with its form for *he / she*.
        pairs:
          - [walk, walks]
          - [climb, climbs]
          - [eat, eats]
          - [draw, draws]
          - [think, thinks]
      - id: yosi-dana
        type: fillBlank
        prompt: Write the verb in the present.
        text: Yosi ___ (draw) when he is creative. Dana ___ (count) when she is logical.
        blanks: [[draws], [counts]]
      - id: giraffes-eat
        type: multipleChoice
        prompt: Giraffes ___ leaves.
        options:
          - { text: eat, correct: true }
          - {
              text: eats,
              feedback: '*Giraffes* is more than one (*they*). With *they*, the verb does not change: *eat*.',
            }
          - {
              text: are eat,
              feedback: 'Do not write *am, is, are* when you have a verb: *Giraffes eat leaves.*',
            }
      - id: scientist-stars
        type: reorderSentence
        prompt: Put the words in order.
        sentence: The scientist looks at the stars.

  - slug: discoveries-prepositions
    title: 'Prepositions: where is it?'
    minutes: 8
    items:
      - id: japan-far
        type: multipleChoice
        prompt: Japan is ___ Israel.
        options:
          - { text: far from, correct: true }
          - { text: near, feedback: '*Near* means close. Japan is very far away: *far from*.' }
          - {
              text: next to,
              feedback: '*Next to* means very close, beside. Japan is very far away: *far from*.',
            }
      - id: birdcages-above
        type: multipleChoice
        prompt: The birdcages are higher than the animal pens. The birdcages are ___ the animal pens.
        options:
          - { text: above, correct: true }
          - { text: below, feedback: '*Below* means lower. Higher than another thing is *above*.' }
          - {
              text: far from,
              feedback: '*Far from* is for distance. Higher than another thing is *above*.',
            }
      - id: hebrew
        type: matching
        prompt: Match each preposition with its translation.
        pairs:
          - [above, מעל ל]
          - [below, מתחת]
          - [next to, ליד]
          - [near, קרוב ל]
          - [far from, רחוק מ]
      - id: in-on
        type: fillBlank
        prompt: Complete with *in* or *on*.
        text: The rabbit is ___ its cage (inside it). The sample is ___ the table (on its surface).
        blanks: [[in], [on]]
        wordBank: [in, on]
      - id: near-far
        type: trueFalse
        prompt: '*Near* means very far away.'
        answer: false
        feedback:
          correct: 'Right! *Near* means close. *Far from* means far away.'
          incorrect: '*Near* means close, but not right beside. *Far from* means far away.'
      - id: above-higher
        type: trueFalse
        prompt: '*Above* means higher than another thing.'
        answer: true
        feedback:
          correct: 'Right! *The birdcages are above the animal pens.*'
          incorrect: '*Above* means higher than another thing. *Below* means lower.'
      - id: nose-mouth
        type: multipleChoice
        prompt: Your nose is ___ your mouth.
        options:
          - { text: above, correct: true }
          - {
              text: below,
              feedback: 'Your nose is higher than your mouth, so it is *above* your mouth.',
            }
          - { text: far from, feedback: 'Your nose is close to your mouth, and higher: *above*.' }
      - id: thailand
        type: reorderSentence
        prompt: Put the words in order.
        sentence: Thailand is far from Israel.
