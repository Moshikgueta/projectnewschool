# Cycle "Goals and projects", converted from the English Foundations digital
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-foundations-1
slug: goals-and-projects
title: Goals and projects
goal: Talk about your goals and plans, using verbs in the present simple, dates and numbers.
position: 7
status: in_review

review:
  - >-
    The two workbook exercises ("Verbs in the present simple" and "Dates and
    numbers") are NEW: the notebook has no self-study exercises. They were written
    from the cycle's two skills, its summary rules and its vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    Plan: the notebook labels the activities (1 and 3: dates; 2 and 4: verbs) but
    gives no recommended combinations; the teacher note suggests Activities 1 and 2,
    or Activities 3 and 4. Please confirm.
  - >-
    Small corrections: warm-up "Which are they?" → "What are they?"; Activity 2
    "Student 1 will tell student 2 which is their goal" → "what their goal is", and
    "My goal is to speak in English fluently" → "to speak English fluently";
    Activity 3 title "My friend´s Goal cards" → "My friend's goal cards"; in the
    Rachel example the missing closing quote and the extra comma ("every day,
    from March 5") were fixed.
  - >-
    Added examples (not in the notebook, please check): Activity 1 has a short
    example plan ("I want to run 5 kilometers…"); Activity 2 has a sample answer
    from Student 2; summary rule 1 has "We study English on Mondays." and the
    example "She reads a book before bed." moved to rule 2 (he / she / it).
  - >-
    Activity 3: the cards link (Google Docs) lost its "?tab=t.0" parameter. The note
    that online students must make a copy of the document (and that the teacher
    prints the cards in a face-to-face class) is a teacher note.
  - >-
    Summary, Dates and numbers: rule 2 "Numbers over 20 need teen or ty" was
    rewritten as "Numbers 13–19 end in -teen; the tens (20, 30, 40…) end in -ty".
    Rule 3 "The bigger the number, the easier it is… Numbers after 10 are usually
    numerals" was rewritten as "In dates and prices we usually write big numbers
    as numerals (March 15, 2024; $100)". Rule 1 now gives 1st, 21st and 31st. A
    small -teen / -ty table was added. Please confirm all three rules.
  - >-
    Mori: the first message asked for the skills "Actions in Present and
    Dates&Numbers"; it now says "Verbs in the Present and Dates & Numbers" (the
    cycle's skills). Extra activity 1 began "“Hi Mori” I will tell you…"; it is now
    "Hi Mori! I will tell you details about my goal. Please ask me questions about
    it." The sentence "He will ask you questions about your goal and will try to
    guess what it is!" is the intro of extra activity 2.
  - >-
    Vocabulary: "Help" was glossed "עזרה" (the noun); the cycle uses it as a verb,
    so it is "לעזור / עזרה". The day list has no Sunday (as in the notebook);
    add it?
  - >-
    Activity times given as ranges (15–20 minutes) are recorded as 20 minutes; the
    introduction (5–10 minutes) as 10. The Quizlet link lost its "?new" parameter.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: goals-and-projects-class
    title: 'Class: Goals and projects'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Goals and projects
      - id: skills
        type: cycleOverview
        skills:
          - name: Verbs in the present simple
            description: "*I work, she works*; *don't / doesn't* + verb"
          - name: Dates and numbers
            description: 'Months, dates and numbers: *I start on March 1st. I study for 3 hours.*'
      - id: quizlet
        type: externalLink
        label: Goals and projects on Quizlet
        url: https://quizlet.com/il/986612605/goals-and-projects-basic-english-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I am ___. I want to begin a new ___.
        example: I am Dana. I want to begin a new personal project.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: Do you have a goal? What is it?
            frame: My goal is to ___ by ___ (date).
          - question: How many goals do you have for this month / year? What are they?
            frame: For this year, I have ___ goals. They are ___, ___ and ___.
          - question: What do you do to get to your goal?
            frame: I ___ to get to my goal.
          - question: How do you feel about your progress?
            frame: I feel ___ about my progress.
          - question: Why is this goal important to you?
            frame: This goal is important to me because ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      - id: act1
        type: classActivity
        title: 'Activity 1: My new goal'
        skills: [Dates and numbers]
        minutes: 20
        steps:
          - Write your goal.
          - Write 10 steps to get to your goal. Every step has a start date.
          - Share your 10-step list with the group.
        example: |-
          **Goal:** *I want to run 5 kilometers.*
          *On May 1st, I walk for 30 minutes.*
          *On May 15th, I run for 10 minutes.*
          *On June 30th, I did it!*
      - id: act1-steps
        type: discussionQuestions
        title: My 10 steps
        items:
          - question: 'Goal:'
          - question: On ___ (date), I ___ for ___ minutes / hours / days / weeks.
          - question: On ___ (date), I ___ for ___ minutes / hours / days / weeks.
          - question: On ___ (date), I ___ for ___ minutes / hours / days / weeks.
          - question: On ___ (date), I ___ for ___ minutes / hours / days / weeks.
          - question: On ___ (date), I ___ for ___ minutes / hours / days / weeks.
          - question: On ___ (date), I ___ for ___ minutes / hours / days / weeks.
          - question: On ___ (date), I ___ for ___ minutes / hours / days / weeks.
          - question: On ___ (date), I ___ for ___ minutes / hours / days / weeks.
          - question: On ___ (date), I ___ for ___ minutes / hours / days / weeks.
          - question: On ___ (date), I did it!
      - id: act2
        type: classActivity
        title: 'Activity 2: Two brains work better than one!'
        skills: [Verbs in the present simple]
        minutes: 20
        steps:
          - Work in pairs.
          - 'Student 1: say your goal for this year. You can choose one from the bank.'
          - 'Student 2: say what Student 1 can do to make the goal happen. Give at least 3 pieces of advice.'
          - Switch and do it again.
        wordBank:
          [
            Speak English fluently.,
            Get better grades in school.,
            Make new friends.,
            Save money for something special.,
            'Learn a new hobby (painting, dancing, playing an instrument).',
            Eat healthier and exercise regularly.,
            Be more organized with my time.,
            Read more books.,
            Travel to a new place.,
            Improve my writing skills.,
            Get a part-time job.,
            Spend more time with family.,
            Learn to cook.,
            Reduce stress and relax more.,
            Help someone in need.,
          ]
        example: |-
          **Student 1:** *My goal is to speak English fluently.*
          **Student 2:** *You can watch movies in English, talk with Mori every day and read short books.*
      - id: act2-frames
        type: discussionQuestions
        items:
          - question: 'Student 1:'
            frame: My goal is to ___.
          - question: 'Student 2:'
            frame: You can ___, ___ and ___.
      - id: act3
        type: classActivity
        title: "Activity 3: My friend's goal cards"
        skills: [Dates and numbers, Verbs in the present simple]
        minutes: 20
        steps:
          - 'Open the cards: 5 verb cards (start, work, help, learn, finish), 10 number cards (1–10) and 12 month cards.'
          - Your partner gives you 5 key words about their goal.
          - Use the cards to write a goal plan for your partner in 5 sentences. Use **he / she** (third person).
          - Read your plan to the group.
        resource:
          label: Goal cards
          url: https://docs.google.com/document/d/1iziuxd5n2vWP-1pmeMgB_LRWjENW56iXQYzfXGras3g/edit
        example: |-
          **Cards:** Start, Work, Learn, Help, Finish · 3, 5, 7, 9, 10 · March, April, June, September, December
          **Key words from the partner:** English, computer, hours, teacher, certificate
          *Rachel starts the project on March 1, 2024.*
          *Rachel works for 3 hours every day from March 5, 2024.*
          *Rachel learns English and computer skills with her teacher on April 10, 2024.*
          *The teacher helps Rachel study for a certificate from June 15, 2024.*
          *Rachel finishes the project on December 20, 2024.*
      - id: act3-plan
        type: discussionQuestions
        title: My partner's goal plan
        items:
          - question: ___ starts the project on ___.
          - question: He / She works ___ from ___.
          - question: He / She learns ___ on ___.
          - question: ___ helps him / her ___ from ___.
          - question: He / She finishes the project on ___.
      - id: act4
        type: classActivity
        title: 'Activity 4: Do you do that…?'
        skills: [Verbs in the present simple]
        minutes: 20
        steps:
          - One student picks a secret verb from the list and doesn't tell the group.
          - The others ask yes / no questions to guess the verb. The student answers only *Yes* or *No*.
          - 'When you think you know the verb, ask: *Is it ___?*'
          - If the guess is right, the round is over. Then a new student picks a secret verb.
        wordBank: [study, exercise, work, rest, learn]
        example: |-
          **Student 2:** *Do you do that at work?*
          **Student 1:** *No.*
          **Student 3:** *Do you do that at school?*
          **Student 1:** *Yes.*
          **Student 2:** *Is it "study"?*
          **Student 1:** *Yes! You guessed it!*
      - id: act4-frames
        type: discussionQuestions
        items:
          - question: Do you do that ___?
          - question: Is it ___?
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: **Verbs in the present simple** (Activities 2 and 4)
          and **Dates and numbers** (Activities 1 and 3). Suggested combinations:
          Activities 1 and 2, or Activities 3 and 4.
      - id: n-intro
        anchor: intro
        minutes: 10
        text: 'Give your own example first ("I am ___. I want to begin a new personal project."), then go around the group.'
      - id: n-warmup
        anchor: warmup
        minutes: 20
        text: Ask each student at least two questions. Answers typed here are visible to you below each question.
      - id: n-act1
        anchor: act1
        text: Each step must have a start date. Students then share their 10-step list with the whole group.
      - id: n-act3
        anchor: act3
        text: >-
          Online: every student must make a copy of the cards document before using
          it. Face to face: print the cards. Each student gets 5 verb cards, 10 number
          cards and 12 month cards, plus 5 key words from their partner. Students
          speak in the third person.
      - id: n-act4
        anchor: act4
        text: Write the 5 verbs on the board (or give each group the list) before the first round.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: goals-and-projects-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-verbs
        type: ruleSummary
        skill: Verbs in the present simple
        rules:
          - text: >-
              Use the present simple for habits, routines and things that are always
              true. With *I, you, we* and *they*, use the base form of the verb.
            examples: [I go to the gym every day., We study English on Mondays.]
          - text: 'With *he, she* and *it*, add **-s** or **-es** to the verb.'
            examples: [He works at a bank., It rains a lot in winter., She reads a book before bed.]
          - text: >-
              Negative: with *I, you, we, they* use **don't** + base form. With *he,
              she, it* use **doesn't** + base form.
            examples:
              - "I don't like broccoli."
              - "We don't work on Sundays."
              - "She doesn't enjoy running."
              - "It doesn't make sense."
      - id: rules-dates
        type: ruleSummary
        skill: Dates and numbers
        rules:
          - text: '*First* is special: write **-st** after 1, 21 and 31.'
            examples: [1st = first, 21st = twenty-first, 31st = thirty-first]
          - text: 'Numbers 13–19 end in **-teen**. The tens (20, 30, 40…) end in **-ty**.'
            examples:
              [thirteen (13) – thirty (30), fourteen (14) – forty (40), fifteen (15) – fifty (50)]
          - text: In dates and prices, we usually write big numbers as numerals.
            examples: ['March 15, 2024', $100]
    teacherNotes:
      - id: n-summary
        anchor: null
        minutes: 20
        text: Go through both skills with the group and ask for one new example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: goals-and-projects-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy this message and send it. Mori will ask you questions; answer every one.
      - id: mori-goal
        type: aiTutorPrompt
        title: My new goal
        message: >-
          Hi Mori! I have a new goal. Can you ask me questions about my goal using the
          skills Verbs in the Present and Dates & Numbers? Use only present simple, and
          please correct my mistakes.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**
      - id: extra-title
        type: heading
        level: 3
        text: Extra practice
      - id: mori-details
        type: aiTutorPrompt
        title: Telling Mori about my goal
        intro: Fill in the blanks, then send the message to Mori.
        message: |-
          Hi Mori! I will tell you details about my goal. Please ask me questions about it.
          My goal is to ___.
          I want to start on ___.
          To get to my goal, I ___.
          This goal is important to me because ___.
          My steps:
          1. ___
          2. ___
          3. ___
          4. ___
          5. ___
          6. ___
          7. ___
          8. ___
          9. ___
          10. I made it!
      - id: mori-guess
        type: aiTutorPrompt
        title: Guess the goal!
        intro: Send this message to Mori. Mori asks you questions about your goal and tries to guess what it is!
        message: >-
          Hi Mori! I want to play a game. I give you clues about my goal and you guess
          what my goal is. Please ask me questions using actions, dates and numbers in
          present simple. Correct my mistakes.

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: goals-and-projects-practice
    book: workbook
    title: 'Practice: Goals and projects'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. You can try each question again.
      - id: ex-verbs
        type: activity
        activity: goals-and-projects-verbs
      - id: ex-dates
        type: activity
        activity: goals-and-projects-dates

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: goals-and-projects-vocabulary
    title: Vocabulary
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Goals and projects words
        glossLang: he
        link: https://quizlet.com/il/986612605/goals-and-projects-basic-english-flash-cards/
        items: &goals-and-projects-words
          - { term: Goal, gloss: מטרה }
          - { term: Start, gloss: להתחיל }
          - { term: Plan, gloss: לתכנן }
          - { term: Work, gloss: לעבוד }
          - { term: Help, gloss: לעזור / עזרה }
          - { term: Time, gloss: זמן }
          - { term: Week, gloss: שבוע }
          - { term: Day, gloss: יום }
          - { term: Month, gloss: חודש }
          - { term: Finish, gloss: לסיים }
          - { term: Study, gloss: ללמוד }
          - { term: Practice, gloss: לתרגל }
          - { term: Talk, gloss: לדבר }
