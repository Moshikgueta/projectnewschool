vocabulary:
  - slug: goals-and-projects
    title: Goals and projects
    items: *goals-and-projects-words

activities:
  - slug: goals-and-projects-verbs
    title: Verbs in the present simple
    minutes: 8
    items:
      - id: he-works
        type: multipleChoice
        prompt: He ___ at a bank.
        options:
          - { text: works, correct: true }
          - { text: work, feedback: 'With *he, she, it*, add -s: *he works*.' }
          - { text: working, feedback: 'In the present simple, say *he works*.' }
      - id: i-go
        type: multipleChoice
        prompt: I ___ to the gym every day.
        options:
          - { text: go, correct: true }
          - { text: goes, feedback: 'With *I, you, we, they*, use the base form: *I go*.' }
          - { text: going, feedback: 'In the present simple, say *I go*.' }
      - id: dont-doesnt
        type: fillBlank
        prompt: "Complete with *don't* or *doesn't*."
        text: We ___ work on Sundays. She ___ enjoy running.
        blanks: [["don't", do not], ["doesn't", does not]]
        wordBank: ["don't", "doesn't"]
      - id: broccoli
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: "She doesn't like broccoli.", correct: true }
          - {
              text: "She doesn't likes broccoli.",
              feedback: "After *doesn't*, use the base form: *doesn't like*.",
            }
          - {
              text: "She don't like broccoli.",
              feedback: "With *he, she, it*, use *doesn't*: *She doesn't like broccoli*.",
            }
      - id: finishes
        type: fillBlank
        prompt: Write the verb in the right form (add -s or -es).
        text: Rachel ___ (finish) the project on December 20th.
        blanks: [[finishes]]
      - id: habits
        type: trueFalse
        prompt: 'We use the present simple for habits and routines: *I study English every day*.'
        answer: true
        feedback:
          correct: Right! The present simple is for habits, routines and things that are always true.
          incorrect: The present simple is for habits, routines and things that are always true, like *I study English every day*.
      - id: he-she-form
        type: matching
        prompt: Match each verb with its form for *he / she*.
        pairs:
          - [start, starts]
          - [work, works]
          - [help, helps]
          - [learn, learns]
          - [finish, finishes]
      - id: order-works
        type: reorderSentence
        prompt: Put the words in order.
        sentence: He works for three hours every day.

  - slug: goals-and-projects-dates
    title: Dates and numbers
    minutes: 8
    items:
      - id: on-march
        type: multipleChoice
        prompt: Rachel starts the project ___ March 1st.
        options:
          - { text: on, correct: true }
          - { text: in, feedback: 'Say *on* before a date: *on March 1st*.' }
          - { text: at, feedback: 'Say *on* before a date: *on March 1st*.' }
      - id: after-april
        type: multipleChoice
        prompt: Which month comes after April?
        options:
          - { text: May, correct: true }
          - { text: March, feedback: 'March comes **before** April.' }
          - { text: June, feedback: 'June comes after May: April, May, June.' }
      - id: march
        type: fillBlank
        prompt: Complete the months.
        text: January, February, ___, April.
        blanks: [[March]]
      - id: teen-ty
        type: matching
        prompt: Match the numbers.
        pairs:
          - ['13', thirteen]
          - ['30', thirty]
          - ['14', fourteen]
          - ['40', forty]
          - ['21st', twenty-first]
      - id: fifty
        type: trueFalse
        prompt: '*Fifty* is the number 15.'
        answer: false
        feedback:
          correct: 'Right! 15 is *fifteen* (-teen). *Fifty* is 50 (-ty).'
          incorrect: 'Numbers 13–19 end in -teen: 15 is *fifteen*. *Fifty* is 50.'
      - id: three-five
        type: fillBlank
        prompt: Write the numbers in words.
        text: I work for ___ (3) hours, ___ (5) days a week.
        blanks: [[three], [five]]
      - id: twenty-first
        type: multipleChoice
        prompt: How do you say *21st*?
        options:
          - { text: twenty-first, correct: true }
          - {
              text: twenty-one,
              feedback: '*Twenty-one* is 21. For a date like the 21st, say *twenty-first*.',
            }
          - { text: twenty-oneth, feedback: '*First* is special: 21st is *twenty-first*.' }
      - id: order-start
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I start my project on May 1st.
