# Cycle "TV and Movies", converted from the English Foundations digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-foundations-1
slug: tv-and-movies
title: TV and Movies
goal: Talk about TV and movies, building questions and using the prepositions in, on and at.
position: 16
status: in_review

review:
  - >-
    The two workbook exercises ("Building questions" and "Prepositions") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's two
    skills, its summary rules and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    The source gives no times for the introduction, the warm-up, the activities or
    the summary, so no minutes are recorded. (Activity 4 has one-minute turns; that is
    in its steps.)
  - >-
    Summary, Building questions, rule 3 says "For a negative question, *doesn't* comes
    after the subject", but in the example (*What doesn't she like to eat?*) it comes
    before the subject. The rule is rewritten: "put *don't / doesn't* before the
    subject". Please confirm.
  - >-
    Activity 1 answer key: "Brad Bitt" → "Brad Pitt"; "Natalie Fortman" → "Natalie
    Portman"; "the Titanic" → "Titanic"; "in the cinema.." → "in the cinema."; capital
    letters added to "why do you like…" and "what is the longest…". The answers are
    shown to the students so they can type their questions; the correct questions are
    only in the teacher note.
  - >-
    Warm-up: "With whom do you like to watch movies?" → "Who do you like to watch
    movies with?"; the "why" question was split into a "like" and a "don't like"
    question; frames were added to the last two questions ("I like to watch movies
    with my ___." / "I like to watch TV in the ___ / at ___.").
  - >-
    Activity 2: the teacher's explanation of *in / at* (Stage 1) is the same as the
    summary, so it is in a teacher note pointing to the summary. Answer frames were
    added to the interview questions.
  - >-
    Activity 3: "someone famous who speaks the language they practice" → "a famous
    person who speaks English"; "closed ended questions" → "yes / no questions".
  - >-
    Activity 4 is marked *Prepositions* in the source, but the template uses only *in*
    ("They live in…"). You may want to add a clue with *at* or *on* (e.g. "They meet
    at ___.").
  - >-
    Homework: "Open the school chatbot" → "Open the chat with Mori"; "Now is your
    turn!" → "Now it's your turn!" (twice).
  - >-
    Vocabulary glosses changed: Because "בגלל" → "כי / בגלל"; Like "לאהוב" → "לאהוב
    / לחבב" (term written "To like"). Please confirm.
  - >-
    The "Answer of student 1/2/3" lines are replaced by the optional answer boxes
    (decision C2): students may type, and the teacher sees the group's answers.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: tv-and-movies-class
    title: 'Class: TV and Movies'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: TV and Movies
      - id: skills
        type: cycleOverview
        skills:
          - name: Building questions
            description: '*What, Where, When, Who* + *do / does*: *Where do you watch movies?*'
          - name: Prepositions
            description: '*in, on, at* for time and place: *at night, in the summer, on the sofa*'
      - id: quizlet
        type: externalLink
        label: TV and movie words on Quizlet
        url: https://quizlet.com/il/854810897/basic-english-tv-shows-movies-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I am ___. I like to watch movies / TV shows.
        example: I am Dana. I like to watch TV shows.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: Which movie or TV series do you like?
            frame: I like the movie / TV series ___.
          - question: Why do you like this movie / TV series?
            frame: I like this movie / TV series because it is ___ (fun, interesting, educational, important). / … because it has good actors in it.
          - question: If you don't like movies, why not?
            frame: I do not like movies because they are ___ (boring, annoying, long, stupid).
          - question: Where do you like to watch movies?
            frame: I like to watch movies in / on / at the ___.
          - question: Who do you like to watch movies with?
            frame: I like to watch movies with my ___.
          - question: When do you like to watch TV?
            frame: I like to watch TV in the ___ / at ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      - id: act1
        type: classActivity
        title: 'Activity 1: Jeopardy (What is the question?)'
        skills: [Building questions]
        steps:
          - Your teacher writes a number from 1 to 100. Guess the number! The closest student plays first.
          - Your teacher reads an answer. Say the correct question and get a point.
          - When you are wrong, the next closest student plays. Nobody plays more than 3 times.
          - When everyone has played, the student with the most points wins.
        example: '*I like the movie Titanic.* → **Which** movie do you like?'
      - id: act1-answers
        type: discussionQuestions
        title: What is the question?
        items:
          - question: The best actor in the world is Brad Pitt.
          - question: Yes, I like movies and TV series.
          - question: I like to watch TV on the sofa in my living room.
          - question: I like to watch movies in the cinema.
          - question: I think the most beautiful actress is Natalie Portman.
          - question: The genre of movies I like is action movies.
          - question: I like action movies because of the action.
          - question: I was 13 (thirteen) years old when I went to the cinema for the first time.
          - question: The longest movie I know is Titanic.
          - question: I like to watch TV at night.
      - id: act2
        type: classActivity
        title: 'Activity 2: Favorite movie interview'
        skills: [Prepositions]
        steps:
          - Listen to your teacher explain *in* and *at* for time and place.
          - Work in pairs. Interview your partner about their favorite movie with the questions below.
          - Share your partner's answers with the group.
      - id: act2-questions
        type: discussionQuestions
        items:
          - question: When does the movie happen?
            frame: The movie happens in ___ (a year, a month, a season).
          - question: Where does the movie happen?
            frame: The movie happens in / at ___.
          - question: What time do you like to watch this movie?
            frame: I like to watch it at ___ / in the ___.
          - question: Who is your favorite character in the movie? Where is he / she in the movie?
            frame: My favorite character is ___. He / She is in / at ___.
          - question: Do you remember a moment at a special place in the movie?
          - question: Do you remember a season or a year in the movie?
      - id: act3
        type: classActivity
        title: 'Activity 3: 21 questions'
        skills: [Building questions]
        steps:
          - One student thinks of a famous person who speaks English.
          - The group asks up to 21 yes / no questions to guess who it is.
        example: |-
          *Are you a man?*
          *Are you an actor / an actress / a director?*
          *Are you Israeli / American / Spanish?*
      - id: act4
        type: classActivity
        title: 'Activity 4: Movie and TV series taboo'
        skills: [Prepositions]
        steps:
          - Your teacher gives you the name of a movie or a TV series. Do not say it!
          - You have one minute to describe it with simple words. Use the clues below.
          - If the group guesses in one minute, you get one point. The student with the most points wins.
        example: >-
          *Finding Nemo*: This is a movie. It is about a fish. He is small and orange.
          He gets lost, and his father looks for him. It is fun and beautiful. Can you
          guess?
      - id: act4-clues
        type: discussionQuestions
        title: My clues
        items:
          - question: This is a ___ (movie / TV series).
          - question: It is about a ___ (boy, girl, man, woman…).
          - question: They live in ___ (a house, a city, a school…).
          - question: They ___ (work, study, travel, fight, sing…).
          - question: It is ___ (funny, scary, interesting, exciting…).
          - question: Can you guess?
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: **Building questions** (warm-up questions, Activity 1
          or 3) and **Prepositions** (Activity 2 or 4). Choose one activity for each
          skill.
      - id: n-intro
        anchor: intro
        text: Say your own introduction first ("I like to watch TV shows."); everyone repeats it with their own answer.
      - id: n-warmup
        anchor: warmup
        text: Ask each student at least two questions. Answers typed here are visible to you below each question.
      - id: n-act1
        anchor: act1
        text: >-
          Write the number on a piece of paper before the students guess. Read the
          answers one by one and write the correct question for everyone after each
          turn. At the end, explain the rules for building questions (summary).
      - id: n-act1-key
        anchor: act1-answers
        text: |-
          Correct questions (1 point each), in the order of the list:
          1. **Who** is the best actor in the world?
          2. **Do** you like movies or TV series?
          3. **Where** do you like to watch TV?
          4. **Where** do you like to watch movies?
          5. **Who** do you think is the most beautiful actress?
          6. **Which** movie genre do you like?
          7. **Why** do you like action movies?
          8. **How old** were you when you went to the cinema for the first time?
          9. **What** is the longest movie you know?
          10. **When** do you like to watch TV?
          The first answer of the source (*I like the movie Titanic.* → **Which** movie do you like?) is the example above.
      - id: n-act2
        anchor: act2
        text: >-
          Explain *in* and *at* first, with the rules and examples of the summary: *in*
          for long periods (*in January, in 2023, in the summer*) and bigger places (*in
          the room, in the park*); *at* for exact times (*at 5 o'clock, at noon, at
          night*) and exact places (*at the bus stop, at the door, at the office*).
      - id: n-act3
        anchor: act3
        text: The student who guesses right chooses the next famous person.
      - id: n-act4
        anchor: act4
        text: Send each student the name of a movie or TV series in a private message, so the others do not see it.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: tv-and-movies-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-questions
        type: ruleSummary
        skill: Building questions
        rules:
          - text: The most common question words are *What, Where, When* and *Who* (see the table).
          - text: 'Question word + *do / does* + subject + main verb.'
            examples:
              - What do you like to do in your free time?
              - Where does she live?
          - text: "In a negative question, put *don't / doesn't* before the subject."
            examples:
              - What doesn't she like to eat?
              - Does she like this movie or doesn't she?
      - id: questions-table
        type: table
        caption: Question words
        header: [Question word, Question, Answer]
        rows:
          - [What, What is your favorite color?, My favorite color is blue.]
          - [Where, Where do you live?, I live in New York.]
          - [When, When is your birthday?, My birthday is on July 15th.]
          - [Who, Who is your best friend?, My best friend is Sarah.]
      - id: rules-prepositions
        type: ruleSummary
        skill: Prepositions
        rules:
          - text: '*In* or *at* for time: *in* for long periods (months, years, seasons), *at* for exact times.'
            examples: ['in January, in 2023, in the summer', "at 5 o'clock, at noon, at night"]
          - text: '*In* or *at* for place: *in* for bigger places or areas, *at* for exact places.'
            examples:
              [
                'in the room, in the park, in the country',
                'at the bus stop, at the door, at the office',
              ]
          - text: '*On* is for days and surfaces.'
            examples: ['on Monday, on the table']
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both skills with the group and ask for one new example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: tv-and-movies-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy this message and send it. Mori will ask you questions; answer every one.
      - id: mori-tv
        type: aiTutorPrompt
        title: Talk about TV and movies
        message: >-
          Hi Mori! I want to practice English. Can you ask me questions about TV and
          movies using the skills Building questions and Prepositions? Please use only
          present simple, and correct my mistakes.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**
      - id: extra-title
        type: heading
        level: 3
        text: Extra practice
      - id: mori-scene
        type: aiTutorPrompt
        title: Where is the scene?
        intro: >-
          Send this message to Mori and describe a scene. For example: *There is a table
          in the middle of the room. The characters sit on the chairs. One man hides
          under the table.* (Mori guesses: *In a restaurant?*) Then write: **Now it's
          your turn! Describe a scene and I will guess where it is.**
        message: >-
          Hi Mori! Let's do an activity. I will describe a scene from a movie or TV show
          using prepositions. You guess where the scene takes place.
      - id: mori-questions
        type: aiTutorPrompt
        title: Movie question maker
        intro: >-
          Send this message to Mori and write a sentence. For example: *The girl runs
          after the bus.* (Mori writes: *Who runs after the bus? / What does the girl
          run after?*) Then write: **Now it's your turn! Write a sentence, and I
          will make a question.**
        message: >-
          Hey Mori! Let's play a game. I will tell you a sentence about a movie or TV
          show, and you make a question using a question word (like who, what, where,
          when).

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: tv-and-movies-practice
    book: workbook
    title: 'Practice: TV and Movies'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. You can try each question again.
      - id: ex-questions
        type: activity
        activity: tv-and-movies-questions
      - id: ex-prepositions
        type: activity
        activity: tv-and-movies-prepositions

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: tv-and-movies-vocabulary
    title: Vocabulary
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: TV and movie words
        glossLang: he
        link: https://quizlet.com/il/854810897/basic-english-tv-shows-movies-flash-cards/
        items: &tv-words
          - { term: Movie, gloss: סרט }
          - { term: TV series, gloss: סדרת טלוויזיה }
          - { term: Actor, gloss: שחקן }
          - { term: Actress, gloss: שחקנית }
          - { term: Character, gloss: דמות }
          - { term: To watch, gloss: לצפות }
          - { term: To like, gloss: לאהוב / לחבב }
          - { term: Because, gloss: כי / בגלל }
          - { term: Fun, gloss: כיף }
          - { term: Interesting, gloss: מעניין }
          - { term: Important, gloss: חשוב }
          - { term: Boring, gloss: משעמם }
          - { term: Annoying, gloss: מעצבן }
          - { term: Long, gloss: ארוך }
          - { term: Stupid, gloss: טיפשי }
          - { term: Cinema, gloss: קולנוע }
          - { term: Sofa, gloss: ספה }
          - { term: Living room, gloss: סלון }
          - { term: Night, gloss: לילה }
          - { term: Question, gloss: שאלה }
          - { term: Answer, gloss: תשובה }
          - { term: To guess, gloss: לנחש }
          - { term: Famous, gloss: מפורסם }
          - { term: Time, gloss: זמן }
          - { term: Place, gloss: מקום }
          - { term: Season, gloss: עונה }
          - { term: Year, gloss: שנה }
          - { term: Genre, gloss: "סוגה (ז'אנר)" }
          - { term: To describe, gloss: לתאר }
          - { term: Moment, gloss: רגע }

vocabulary:
  - slug: tv-and-movies
    title: TV and Movies
    items: *tv-words

activities:
  - slug: tv-and-movies-questions
    title: 'Building questions: what, where, when, who'
    minutes: 8
    items:
      - id: where-live
        type: multipleChoice
        prompt: '___ do you live? — I live in New York.'
        options:
          - { text: Where, correct: true }
          - { text: When, feedback: '*When* asks about a time. New York is a place: use *Where*.' }
          - { text: Who, feedback: '*Who* asks about a person. New York is a place: use *Where*.' }
      - id: who-friend
        type: multipleChoice
        prompt: '___ is your best friend? — My best friend is Sarah.'
        options:
          - { text: Who, correct: true }
          - { text: What, feedback: '*What* asks about a thing. Sarah is a person: use *Who*.' }
          - { text: Where, feedback: '*Where* asks about a place. Sarah is a person: use *Who*.' }
      - id: when-birthday
        type: multipleChoice
        prompt: '___ is your birthday? — My birthday is on July 15th.'
        options:
          - { text: When, correct: true }
          - {
              text: Where,
              feedback: '*Where* asks about a place. July 15th is a time: use *When*.',
            }
          - { text: Who, feedback: '*Who* asks about a person. July 15th is a time: use *When*.' }
      - id: question-words
        type: matching
        prompt: Match each question word with what it asks about.
        pairs:
          - [What, a thing]
          - [Where, a place]
          - [When, a time]
          - [Who, a person]
      - id: does-she-live
        type: multipleChoice
        prompt: Which question is correct?
        options:
          - { text: Where does she live?, correct: true }
          - {
              text: Where she lives?,
              feedback: 'Use question word + *does* + subject + verb: *Where does she live?*',
            }
          - {
              text: Where does she lives?,
              feedback: 'After *does*, the verb has no *-s*: *Where does she live?*',
            }
      - id: do-does
        type: fillBlank
        prompt: Complete with *do* or *does*.
        text: What ___ you like to do in your free time? Where ___ she live?
        blanks: [[do], [does]]
        wordBank: [do, does]
      - id: doesnt-before
        type: trueFalse
        prompt: "In a negative question, *doesn't* comes before the subject: *What doesn't she like to eat?*"
        answer: true
        feedback:
          correct: "Right! *What doesn't she like…?*"
          incorrect: "*doesn't* comes before the subject: *What doesn't she like to eat?*"
      - id: what-watch
        type: reorderSentence
        prompt: Put the words in order to make a question.
        sentence: What do you like to watch?

  - slug: tv-and-movies-prepositions
    title: 'Prepositions: in, on, at'
    minutes: 8
    items:
      - id: at-night
        type: multipleChoice
        prompt: I watch TV ___ night.
        options:
          - { text: at, correct: true }
          - { text: in, feedback: 'Night is an exact time: we say *at night*.' }
          - { text: on, feedback: '*On* is for days and surfaces: *on Monday*. We say *at night*.' }
      - id: in-summer
        type: multipleChoice
        prompt: The movie happens ___ the summer.
        options:
          - { text: in, correct: true }
          - {
              text: at,
              feedback: '*At* is for exact times. A season is a long period: *in the summer*.',
            }
          - {
              text: on,
              feedback: '*On* is for days and surfaces. A season is a long period: *in the summer*.',
            }
      - id: at-bus-stop
        type: multipleChoice
        prompt: We meet ___ the bus stop.
        options:
          - { text: at, correct: true }
          - {
              text: in,
              feedback: '*In* is for bigger places. A bus stop is an exact place: *at the bus stop*.',
            }
          - {
              text: on,
              feedback: '*On* is for days and surfaces. A bus stop is an exact place: *at the bus stop*.',
            }
      - id: in-on-at
        type: fillBlank
        prompt: Complete with *in*, *on* or *at*.
        text: My birthday is ___ January. The movie starts ___ 5 o'clock. I see my friends ___ Monday.
        blanks: [[in], [at], [on]]
        wordBank: [in, on, at]
      - id: sofa-room
        type: fillBlank
        prompt: Complete with *in* or *on*.
        text: The remote control is ___ the sofa. My family is ___ the living room.
        blanks: [[on], [in]]
        wordBank: [in, on]
      - id: at-long
        type: trueFalse
        prompt: We use *at* for long periods, like months and years.
        answer: false
        feedback:
          correct: 'Right! For months and years, use *in*: *in January, in 2023*.'
          incorrect: '*At* is for exact times (*at noon*). For months and years, use *in*: *in January, in 2023*.'
      - id: on-days
        type: trueFalse
        prompt: '*On* is for days and surfaces: *on Monday, on the table*.'
        answer: true
        feedback:
          correct: Right! *on Monday, on the table*.
          incorrect: '*On* is for days and surfaces: *on Monday, on the table*.'
      - id: tv-night
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I like to watch TV at night.
