vocabulary:
  - slug: lets-meet
    title: "Let's meet!"
    items: *lets-meet-words

activities:
  - slug: lets-meet-days-numbers
    title: Days of the week and numbers
    minutes: 8
    items:
      - id: after-tuesday
        type: multipleChoice
        prompt: Which day comes right after Tuesday?
        options:
          - { text: Wednesday, correct: true }
          - {
              text: Monday,
              feedback: 'Monday comes **before** Tuesday: Monday, Tuesday, Wednesday.',
            }
          - {
              text: Thursday,
              feedback: 'Thursday comes after Wednesday: Tuesday, Wednesday, Thursday.',
            }
      - id: missing-days
        type: fillBlank
        prompt: Write the missing days.
        text: Sunday, Monday, ___, Wednesday, ___, Friday, Saturday
        blanks: [[Tuesday], [Thursday]]
      - id: right-order
        type: multipleChoice
        prompt: Which days are in the right order?
        options:
          - { text: 'Thursday, Friday, Saturday', correct: true }
          - { text: 'Friday, Thursday, Saturday', feedback: 'Thursday comes before Friday.' }
          - { text: 'Thursday, Saturday, Friday', feedback: 'Friday comes before Saturday.' }
      - id: ordinal-words
        type: matching
        prompt: Match the numbers with the words.
        pairs:
          - [1st, first]
          - [2nd, second]
          - [3rd, third]
          - [4th, fourth]
      - id: twelfth
        type: multipleChoice
        prompt: My birthday is on the 12___ of March.
        options:
          - { text: th, correct: true }
          - { text: nd, feedback: 'After 3rd, most numbers use *th*: *12th*.' }
          - {
              text: rd,
              feedback: 'Use *rd* for 3 (*3rd*). After 3rd, most numbers use *th*: *12th*.',
            }
      - id: endings
        type: fillBlank
        prompt: Write *st*, *nd*, *rd* or *th*.
        text: January 1___, February 2___, March 3___, April 4___
        blanks: [[st, 1st], [nd, 2nd], [rd, 3rd], [th, 4th]]
      - id: after-third
        type: trueFalse
        prompt: 'After 3rd, most numbers just use *th*: 5th, 6th, 7th.'
        answer: true
        feedback:
          correct: Right! 4th, 5th, 6th, 7th…
          incorrect: 'After 3rd, most numbers use *th*: 4th, 5th, 6th, 7th…'
      - id: order-birthday
        type: reorderSentence
        prompt: Put the words in order.
        sentence: My birthday is on the 12th of March.

  - slug: lets-meet-prepositions
    title: 'Basic prepositions: in, on, at'
    minutes: 8
    items:
      - id: at-time
        type: multipleChoice
        prompt: "Let's meet ___ 3 PM for coffee."
        options:
          - { text: at, correct: true }
          - {
              text: in,
              feedback: 'Use *in* for long periods (*in July*). For an exact time, use *at*.',
            }
          - { text: on, feedback: 'Use *on* for days (*on Monday*). For an exact time, use *at*.' }
      - id: on-day
        type: multipleChoice
        prompt: "Let's meet ___ Monday."
        options:
          - { text: on, correct: true }
          - { text: in, feedback: 'Use *in* for long periods (*in July*). For a day, use *on*.' }
          - { text: at, feedback: 'Use *at* for an exact time (*at 3 PM*). For a day, use *on*.' }
      - id: in-month
        type: multipleChoice
        prompt: "Let's meet ___ July for summer vacation."
        options:
          - { text: in, correct: true }
          - {
              text: on,
              feedback: 'Use *on* for days (*on Friday*). A month is a long period: use *in*.',
            }
          - {
              text: at,
              feedback: 'Use *at* for an exact time (*at 6 PM*). A month is a long period: use *in*.',
            }
      - id: my-day
        type: fillBlank
        prompt: Complete with *in* or *at*.
        text: I wake up ___ the morning. I work ___ noon.
        blanks: [[in], [at]]
        wordBank: [in, at]
      - id: why-preposition
        type: matching
        prompt: Match each example with the rule.
        pairs:
          - [in July, a long period]
          - [in the park, a big area]
          - [at 3 PM, an exact time]
          - [on Monday, a specific day]
          - [on the balcony, the surface of a place]
      - id: at-july
        type: trueFalse
        prompt: "*Let's meet at July.* is correct."
        answer: false
        feedback:
          correct: "Right! A month is a long period: *Let's meet in July.*"
          incorrect: "Use *in* for long periods like months: *Let's meet in July.*"
      - id: mall
        type: fillBlank
        prompt: Complete with one preposition.
        text: "Let's meet ___ the entrance of the mall ___ 6 PM."
        blanks: [[at], [at]]
      - id: order-morning
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I wake up in the morning.
