vocabulary:
  - slug: music
    title: Music
    items: *music-words

activities:
  - slug: music-questions
    title: 'Building questions: what, where, when, who'
    minutes: 8
    items:
      - id: when-listen
        type: multipleChoice
        prompt: '___ do you listen to music? — In the morning.'
        options:
          - { text: When, correct: true }
          - {
              text: Where,
              feedback: '*Where* asks about a place. *In the morning* is a time: use *when*.',
            }
          - {
              text: Who,
              feedback: '*Who* asks about a person. *In the morning* is a time: use *when*.',
            }
      - id: who-singer
        type: multipleChoice
        prompt: '___ is your favorite singer? — Pharrell Williams.'
        options:
          - { text: Who, correct: true }
          - {
              text: Where,
              feedback: '*Where* asks about a place. A singer is a person: use *who*.',
            }
          - { text: When, feedback: '*When* asks about a time. A singer is a person: use *who*.' }
      - id: do-you
        type: multipleChoice
        prompt: Which question is correct?
        options:
          - { text: Where do you play the guitar?, correct: true }
          - {
              text: Where you play the guitar?,
              feedback: 'Remember *do*: question word + **do** + subject + verb.',
            }
          - {
              text: Where does you play the guitar?,
              feedback: 'With *you*, use *do*. Use *does* only with *he, she, it*.',
            }
      - id: not-yes-no
        type: trueFalse
        prompt: We use question words (*what, where, when, who*) for questions with a *yes* or *no* answer.
        answer: false
        feedback:
          correct: Right! Question words ask for information, like a place or a time.
          incorrect: 'Question words ask for information (a place, a time, a person), not for *yes* or *no*.'
      - id: do-does
        type: fillBlank
        prompt: Complete with *do* or *does*.
        text: Where ___ you listen to music? When ___ the concert start?
        blanks: [[do], [does]]
        wordBank: [do, does]
      - id: words-hebrew
        type: matching
        prompt: Match the question word with the Hebrew.
        pairs:
          - [What, מה]
          - [Where, איפה]
          - [When, מתי]
          - [Who, מי]
      - id: order-what
        type: reorderSentence
        prompt: Put the words in order.
        sentence: What music do you like?
      - id: on-the-bus
        type: multipleChoice
        prompt: 'The answer is: *I listen to music on the bus.* What is the question?'
        options:
          - { text: Where do you listen to music?, correct: true }
          - {
              text: When do you listen to music?,
              feedback: '*On the bus* is a place, not a time: use *where*.',
            }
          - {
              text: Who do you listen to music with?,
              feedback: '*Who* asks about a person. *On the bus* is a place: use *where*.',
            }

  - slug: music-present
    title: Actions in the present simple
    minutes: 8
    items:
      - id: she-listens
        type: multipleChoice
        prompt: She ___ to classical music.
        options:
          - { text: listens, correct: true }
          - { text: listen, feedback: 'With *he, she, it*, add **-s**: she listen**s**.' }
          - {
              text: listening,
              feedback: 'In the present simple, use the verb + **-s** with *she*: she listens.',
            }
      - id: they-sing
        type: multipleChoice
        prompt: They ___ beautifully in the choir.
        options:
          - { text: sing, correct: true }
          - {
              text: sings,
              feedback: 'With *they*, use the verb as it is, without **-s**: they sing.',
            }
          - {
              text: singing,
              feedback: 'In the present simple, use the base form with *they*: they sing.',
            }
      - id: play-practices
        type: fillBlank
        prompt: Write the verb in the right form.
        text: I ___ (play) the drums every day. He ___ (practice) the violin every evening.
        blanks: [[play], [practices]]
      - id: he-she-form
        type: matching
        prompt: Match each verb with its *he / she* form.
        pairs:
          - [listen, listens]
          - [sing, sings]
          - [play, plays]
          - [watch, watches]
          - [go, goes]
      - id: dont-play
        type: multipleChoice
        prompt: I ___ play the trumpet.
        options:
          - { text: "don't", correct: true }
          - {
              text: "doesn't",
              feedback: "Use *doesn't* only with *he, she, it*. With *I*, use *don't*.",
            }
          - {
              text: not,
              feedback: "In the present simple, the negative needs *do*: I **don't** play.",
            }
      - id: does-do
        type: fillBlank
        prompt: Complete the questions with *Do* or *Does*.
        text: ___ he enjoy rock concerts? ___ you like pop music?
        blanks: [[Does], [Do]]
        wordBank: [Do, Does]
      - id: order-sister
        type: reorderSentence
        prompt: Put the words in order.
        sentence: My sister sings in the car.
      - id: s-rule
        type: trueFalse
        prompt: 'With *he, she* and *it*, we add **-s** or **-es** to the verb: *He sings.*'
        answer: true
        feedback:
          correct: 'Right! *I sing*, but *he sings*.'
          incorrect: 'With *he, she, it*, add **-s** or **-es**: *I sing*, but *he sings*.'
