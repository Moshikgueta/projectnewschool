vocabulary:
  - slug: how-to-relax
    title: How to relax
    items: *relax-words

activities:
  - slug: how-to-relax-actions
    title: 'Sentences with actions: I relax, she relaxes'
    minutes: 8
    items:
      - id: he-listens
        type: multipleChoice
        prompt: He ___ to music when he is stressed.
        options:
          - { text: listens, correct: true }
          - { text: listen, feedback: 'With *he* and *she*, add *-s* to the verb: *he listens*.' }
          - { text: is listen, feedback: 'Do not write *am, is, are* before a verb: *he listens*.' }
      - id: watch-tv
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: I watch TV to relax., correct: true }
          - {
              text: I am watch TV to relax.,
              feedback: 'Do not write *am, is, are* before a verb: *I watch*.',
            }
          - {
              text: I watches TV to relax.,
              feedback: 'Add *-s* only for *he* and *she*. With *I*, write *I watch*.',
            }
      - id: she-s
        type: trueFalse
        prompt: 'With *she*, we add *-s* to the verb: *She cooks soup on cold days.*'
        answer: true
        feedback:
          correct: Right! *he* and *she* + verb + *-s*.
          incorrect: 'With *he* and *she*, we add *-s*: *she cooks*, *he rests*.'
      - id: is-drinks
        type: trueFalse
        prompt: '*She is drinks tea before bed.* is a correct sentence.'
        answer: false
        feedback:
          correct: 'Right! Do not write *is* before a verb: *She drinks tea before bed.*'
          incorrect: 'Do not write *is* before a verb. The correct sentence is: *She drinks tea before bed.*'
      - id: read-rests
        type: fillBlank
        prompt: Complete with the verb in brackets.
        text: I ___ (read) a book when I want to relax. Tom ___ (rest) on the couch after work.
        blanks: [[read], [rests]]
      - id: watch-drinks
        type: fillBlank
        prompt: Complete with the verb in brackets.
        text: They ___ (watch) a movie to feel calm. She ___ (drink) chamomile tea before bed.
        blanks: [[watch], [drinks]]
      - id: verbs-hebrew
        type: matching
        prompt: Match each verb with its meaning in Hebrew.
        pairs:
          - [to sleep, לישון]
          - [to drink, לשתות]
          - [to listen, להקשיב]
          - [to smell, להריח]
          - [to touch, לגעת]
      - id: drink-tea
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I drink tea to relax.

  - slug: how-to-relax-descriptive
    title: 'Descriptive sentences: am, is, are'
    minutes: 8
    items:
      - id: tea-is
        type: multipleChoice
        prompt: The tea ___ warm.
        options:
          - { text: is, correct: true }
          - { text: are, feedback: '*The tea* is one thing: use *is*.' }
          - { text: am, feedback: '*am* is only for *I*: *I am relaxed*.' }
      - id: not-stressed
        type: multipleChoice
        prompt: Which negative sentence is correct?
        options:
          - { text: He is not stressed., correct: true }
          - { text: He not is stressed., feedback: 'Put *not* after *is*: *He is not stressed.*' }
          - {
              text: He does not stressed.,
              feedback: 'A descriptive sentence uses *am, is, are* + *not*: *He is not stressed.*',
            }
      - id: to-be
        type: trueFalse
        prompt: 'Descriptive sentences use the verb *to be*: *am, is, are*.'
        answer: true
        feedback:
          correct: 'Right! *The couch is comfortable.*'
          incorrect: 'Descriptive sentences use *am, is, are*: *The couch is comfortable.*'
      - id: not-before
        type: trueFalse
        prompt: '*The room not is noisy.* is a correct negative sentence.'
        answer: false
        feedback:
          correct: 'Right! *not* comes after *is*: *The room is not noisy.*'
          incorrect: '*not* comes after *is*. The correct sentence is: *The room is not noisy.*'
      - id: am-is-are
        type: fillBlank
        prompt: Complete with *am*, *is* or *are*.
        text: I ___ relaxed. The couch ___ comfortable. The candles ___ calming.
        blanks: [[am], [is], [are]]
        wordBank: [am, is, are]
      - id: make-negative
        type: fillBlank
        prompt: 'Complete with a negative: *is not* or *are not*.'
        text: The blanket is warm. It ___ cold. The lights are soft. They ___ too bright.
        blanks: [[is not, isn't], [are not, aren't]]
      - id: feelings
        type: matching
        prompt: Match each word with its meaning in Hebrew.
        pairs:
          - [relaxed, רגוע]
          - [stressed, לחוץ]
          - [tired, עייף]
          - [hungry, רעב]
          - [comfortable, נוח]
      - id: couch
        type: reorderSentence
        prompt: Put the words in order.
        sentence: The couch is very comfortable.
