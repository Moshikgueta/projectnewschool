vocabulary:
  - slug: my-home
    title: My home
    items: *my-home-words

activities:
  - slug: my-home-describing
    title: 'Describing your home: there is, there are, adjectives'
    minutes: 8
    items:
      - id: there-is-table
        type: multipleChoice
        prompt: ___ a table in the kitchen.
        options:
          - { text: There is, correct: true }
          - {
              text: There are,
              feedback: '*There are* is for more than one thing. *A table* is one thing: *there is*.',
            }
          - { text: It is, feedback: 'To say that something is in a place, use *there is*.' }
      - id: there-are-chairs
        type: multipleChoice
        prompt: ___ two chairs in the living room.
        options:
          - { text: There are, correct: true }
          - {
              text: There is,
              feedback: '*There is* is for one thing. *Two chairs* is more than one: *there are*.',
            }
          - { text: They are, feedback: 'To say that things are in a place, use *there are*.' }
      - id: bed-lamps
        type: fillBlank
        prompt: Complete with *there is* or *there are*.
        text: In my bedroom, ___ a big bed and ___ two lamps.
        blanks: [[there is, there's], [there are]]
      - id: adjective-before
        type: trueFalse
        prompt: 'Adjectives go before the noun: *a comfortable sofa*.'
        answer: true
        feedback:
          correct: 'Right! *A small table, a cozy room, a comfortable sofa.*'
          incorrect: 'In English, the adjective goes before the noun: *a comfortable sofa*.'
      - id: cozy-room
        type: multipleChoice
        prompt: Which is correct?
        options:
          - { text: a cozy room, correct: true }
          - { text: a room cozy, feedback: 'The adjective goes before the noun: *a cozy room*.' }
      - id: you-can
        type: fillBlank
        prompt: Complete with one word.
        text: The bedroom is quiet and comfortable. You ___ sleep and relax there.
        blanks: [[can]]
      - id: rooms-things
        type: matching
        prompt: Match each room with a thing you find there.
        pairs:
          - [Kitchen, fridge]
          - [Bathroom, shower]
          - [Bedroom, bed]
          - [Living room, sofa]
          - [Garden, flowers]
      - id: small-table
        type: reorderSentence
        prompt: Put the words in order.
        sentence: There is a small table.

  - slug: my-home-actions
    title: 'Actions in the present: I clean, she washes'
    minutes: 8
    items:
      - id: she-washes
        type: multipleChoice
        prompt: She ___ the dishes after lunch.
        options:
          - { text: washes, correct: true }
          - { text: wash, feedback: 'With *he, she, it*, add **-s** or **-es**: *she washes*.' }
          - { text: washs, feedback: 'After *sh*, add **-es**: *wash → washes*.' }
      - id: they-cook
        type: multipleChoice
        prompt: They ___ dinner together in the kitchen.
        options:
          - { text: cook, correct: true }
          - { text: cooks, feedback: 'With *they*, use the verb as it is: *they cook*.' }
          - { text: are cook, feedback: 'Do not write *are* with a verb: *they cook*.' }
      - id: clean-vacuums
        type: fillBlank
        prompt: Write the verb in the right form.
        text: I ___ (clean) the living room every Saturday. He ___ (vacuum) the carpet on Sundays.
        blanks: [[clean], [vacuums]]
      - id: does-she
        type: multipleChoice
        prompt: ___ she sweep the floor every day?
        options:
          - { text: Does, correct: true }
          - { text: Do, feedback: 'With *he, she, it*, use *does* in questions: *Does she…?*' }
          - { text: Is, feedback: 'Questions with a verb use *do / does*: *Does she sweep…?*' }
      - id: dont-make
        type: fillBlank
        prompt: Make the sentence negative. Use *do*.
        text: I ___ make my bed in the morning.
        blanks: [[don't, do not]]
      - id: es-rule
        type: trueFalse
        prompt: 'With *I*, *you*, *we* and *they*, we add **-s** to the verb: *They cleans.*'
        answer: false
        feedback:
          correct: 'Right! With *I, you, we, they*, use the verb as it is: *They clean.*'
          incorrect: 'Only *he, she, it* add **-s**. With *they*, use the verb as it is: *They clean.*'
      - id: he-dont
        type: trueFalse
        prompt: "*He don't water the plants.* is a correct sentence."
        answer: false
        feedback:
          correct: "Right! With *he, she, it*, use *does*: *He doesn't water the plants.*"
          incorrect: "With *he, she, it*, use *does*, not *do*: *He doesn't water the plants.*"
      - id: brushes-teeth
        type: reorderSentence
        prompt: Put the words in order.
        sentence: She brushes her teeth.
