vocabulary:
  - slug: shopping-for-fashion
    title: Shopping for fashion
    items: *shopping-for-fashion-words

activities:
  - slug: shopping-for-fashion-descriptive
    title: 'Descriptive sentences: am, is, are, have, has'
    minutes: 8
    items:
      - id: shoes-are
        type: multipleChoice
        prompt: These shoes ___ cool.
        options:
          - { text: are, correct: true }
          - { text: is, feedback: '*Shoes* is more than one thing: use *are*.' }
          - { text: am, feedback: '*Am* is only for *I*: *I am stylish*.' }
      - id: i-am
        type: multipleChoice
        prompt: I ___ stylish.
        options:
          - { text: am, correct: true }
          - { text: is, feedback: 'With *I*, use *am*: *I am stylish*.' }
          - { text: are, feedback: 'With *I*, use *am*: *I am stylish*.' }
      - id: is-are
        type: fillBlank
        prompt: Complete with *am*, *is* or *are*.
        text: The dress ___ red. The jeans ___ new.
        blanks: [[is], [are]]
        wordBank: [am, is, are]
      - id: she-has
        type: multipleChoice
        prompt: She ___ five pairs of shoes.
        options:
          - { text: has, correct: true }
          - {
              text: have,
              feedback: 'With *he, she, it*, use *has*: *She has five pairs of shoes*.',
            }
          - { text: is, feedback: 'To say what someone has, use *have* or *has*, not *is*.' }
      - id: have-has
        type: fillBlank
        prompt: Complete with *have* or *has*.
        text: I ___ a red bag. He ___ a new T-shirt.
        blanks: [[have], [has]]
        wordBank: [have, has]
      - id: adjectives
        type: trueFalse
        prompt: 'In *My coat is soft and green*, the words *soft* and *green* are adjectives.'
        answer: true
        feedback:
          correct: Right! *Soft* and *green* tell us more about the coat.
          incorrect: '*Soft* and *green* tell us more about the coat, so they are adjectives.'
      - id: clothes-hebrew
        type: matching
        prompt: Match the clothes with the Hebrew words.
        pairs:
          - [Dress, שמלה]
          - [Skirt, חצאית]
          - [Coat, מעיל]
          - [Shoes, נעליים]
          - [Pants, מכנסיים]
      - id: order-jacket
        type: reorderSentence
        prompt: Put the words in order.
        sentence: His jacket is big and warm.
        alsoAccept: [His jacket is warm and big]

  - slug: shopping-for-fashion-numbers
    title: 'Numbers: prices from 11 to 99'
    minutes: 8
    items:
      - id: eighty
        type: multipleChoice
        prompt: The bag costs ___ dollars. (80)
        options:
          - { text: eighty, correct: true }
          - { text: eighteen, feedback: '*Eighteen* is 18. Tens end in *-ty*: 80 is *eighty*.' }
          - { text: eight, feedback: '*Eight* is 8. 80 is *eighty*.' }
      - id: twenty
        type: fillBlank
        prompt: Write the number in words.
        text: The T-shirt costs ___ dollars. (20)
        blanks: [[twenty]]
      - id: teen-ty
        type: matching
        prompt: Match the numbers.
        pairs:
          - ['13', thirteen]
          - ['30', thirty]
          - ['15', fifteen]
          - ['50', fifty]
          - ['19', nineteen]
      - id: thirty-five
        type: fillBlank
        prompt: Write the number in words.
        text: She has ___ pairs of socks. (35)
        blanks: [[thirty-five, thirty five]]
      - id: ty-rule
        type: trueFalse
        prompt: 'The tens end in *-ty*: forty, fifty, sixty.'
        answer: true
        feedback:
          correct: 'Right! Twenty, thirty, forty, fifty, sixty…'
          incorrect: 'The tens end in *-ty*: twenty, thirty, forty, fifty, sixty…'
      - id: ninety-eight
        type: multipleChoice
        prompt: Which word is 98?
        options:
          - { text: ninety-eight, correct: true }
          - {
              text: eighty-nine,
              feedback: '*Eighty-nine* is 89. First the tens (90 = ninety), then the 8.',
            }
          - {
              text: nineteen-eight,
              feedback: '*Nineteen* is 19. 90 is *ninety*, so 98 is *ninety-eight*.',
            }
      - id: eleven
        type: multipleChoice
        prompt: Which word is 11?
        options:
          - { text: eleven, correct: true }
          - {
              text: oneteen,
              feedback: "Numbers 11–19 don't follow a clear pattern: 11 is *eleven*.",
            }
          - {
              text: ten-one,
              feedback: "Numbers 11–19 don't follow a clear pattern: 11 is *eleven*.",
            }
      - id: order-coat
        type: reorderSentence
        prompt: Put the words in order.
        sentence: The coat costs sixty dollars.
