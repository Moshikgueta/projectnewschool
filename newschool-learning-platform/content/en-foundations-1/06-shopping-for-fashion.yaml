sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: shopping-for-fashion-class
    title: 'Class: Shopping for fashion'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Shopping for fashion
      - id: skills
        type: cycleOverview
        skills:
          - name: Descriptive sentences
            description: '*am / is / are* + adjective, and *have / has*: *The dress is red. She has a new bag.*'
          - name: Numbers
            description: 'Numbers 11–99 and prices: *The coat costs sixty dollars.*'
      - id: quizlet
        type: externalLink
        label: Fashion words on Quizlet
        url: https://quizlet.com/il/1060769930/basic-english-fashion-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I am ___. I like to buy ___.
        example: I am Dana. I like to buy books.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: Do you like to go shopping? If yes, what do you like to buy? If no, why not?
            frame: Yes, I like to buy ___. / No, because ___.
          - question: Do you prefer online shopping or going to the store? Why?
            frame: I prefer ___ because ___.
          - question: When do you like to go shopping?
            frame: I like to go shopping on weekends / during the week, on ___.
          - question: What is your favorite store? Why?
            frame: My favorite store is ___ because ___.
          - question: How often do you buy clothes?
            frame: I buy clothes ___ times a week / month / year.
          - question: When you go to the mall, how many stores do you go to? Which ones?
            frame: I go to ___ stores, ___ and ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      - id: act1
        type: classActivity
        title: 'Activity 1: What do I wear?'
        skills: [Descriptive sentences]
        minutes: 20
        steps:
          - 'Look at the pictures and review the clothes: *dress, shorts, skirt, bag, coat, T-shirt, pants, shoes*.'
          - 'Your teacher asks: *What do I wear for a birthday / work / a trip to the beach / a meeting with friends?*'
          - Answer with the clothes and an adjective from the bank.
        wordBank:
          [
            comfortable,
            elegant,
            casual,
            formal,
            warm,
            cool,
            trendy,
            simple,
            colorful,
            stylish,
            loose,
            tight,
            soft,
            thick,
            thin,
          ]
        example: |-
          **Teacher:** *What do I wear for a birthday?*
          **Student:** *For a birthday, you wear a dress because it is elegant.*
          **Teacher:** *What do I wear for a trip to the beach?*
          **Student:** *For a trip to the beach, you wear shorts and a T-shirt because they are comfortable.*
      - id: act1-answers
        type: discussionQuestions
        title: What do I wear?
        items:
          - question: For a birthday, you wear ___ because it is / they are ___.
          - question: For work, you wear ___ because it is / they are ___.
          - question: For a trip to the beach, you wear ___ because it is / they are ___.
          - question: For a meeting with friends, you wear ___ because it is / they are ___.
      - id: act2
        type: classActivity
        title: 'Activity 2: Guess the price'
        skills: [Numbers]
        minutes: 20
        steps:
          - Look at the item on the screen.
          - Guess the price. Say the number in words.
          - Your teacher says the real price. The closest guess wins the round!
        resource:
          label: Guess the price (slides 1–10)
          url: https://docs.google.com/presentation/d/1uFqbDX8-ftLQBBJCfbx6Sna6zhKy-DBUeYQup7FSlq4/edit
        example: '*I think the coat costs fifty-five dollars.*'
      - id: act2-guess
        type: discussionQuestions
        title: My guess
        items:
          - question: I think the ___ costs ___ dollars.
      - id: act3
        type: classActivity
        title: 'Activity 3: Organize your store'
        skills: [Descriptive sentences]
        minutes: 20
        steps:
          - Create your own store. Complete the chart below.
          - Present your store to the group.
        example: |-
          **Name of the store:** Fashion Trends
          **What do you sell?** Clothes, shoes and accessories.
          **Where is it?** In the city center, near a shopping mall.
          **What does your store have?** A lot of stylish clothes for men and women, a fitting room, a special discount section and a comfortable waiting area.
          **Who works with you?** Two sales assistants, a cashier and a fashion advisor to help customers choose outfits.
      - id: act3-store
        type: discussionQuestions
        title: My store
        items:
          - question: 'Name of the store:'
            frame: My store is ___.
          - question: What do you sell?
            frame: We sell ___.
          - question: Where is it?
            frame: It is in ___, near ___.
          - question: What does your store have?
            frame: My store has ___, ___ and ___.
          - question: Who works with you?
            frame: ___ and ___ work with me.
      - id: act4
        type: classActivity
        title: 'Activity 4: Budget planning'
        skills: [Numbers]
        minutes: 20
        steps:
          - Go to the online store your teacher chooses.
          - You have **$100**. "Buy" clothes in 10 minutes. Get as close as possible to $100, but don't go over it!
          - Choose items from different categories (T-shirts, pants, shoes, bags…).
          - Tell the group what is in your cart and how much each item costs.
          - The winner buys the most items in different categories for $100.
        example: |-
          *I buy a T-shirt for twenty dollars, pants for thirty-five dollars and a bag for forty dollars.*
          *In total, I spend ninety-five dollars.*
      - id: act4-cart
        type: discussionQuestions
        title: My cart
        items:
          - question: I buy a / an ___ for ___ dollars.
          - question: I buy a / an ___ for ___ dollars.
          - question: I buy a / an ___ for ___ dollars.
          - question: In total, I spend ___ dollars.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: **Descriptive sentences** (Activity 1 or 3) and
          **Numbers** (Activity 2 or 4). Both skills are also practised in the warm-up
          questions. Recommended combinations: Activities 1 and 2, or Activities 3 and 4.
      - id: n-intro
        anchor: intro
        minutes: 10
        text: 'Give your own example first ("I am ___. I like to buy books."), then go around the group.'
      - id: n-warmup
        anchor: warmup
        minutes: 20
        text: Ask each student at least two questions. Answers typed here are visible to you below each question.
      - id: n-act1
        anchor: act1
        text: >-
          Show pictures of the clothes on screen (dress, shorts, skirt, bag, coat,
          T-shirt, pants, shoes); the notebook picture is not in the platform yet.
          Review the words, then ask each student about one occasion.
      - id: n-act2
        anchor: act2
        text: >-
          Show one item at a time; everyone guesses, then reveal the price. Prices
          (teacher's eyes only): dress $50, skirt $90, pants $40, shorts $30, coat
          $60, T-shirt $20, shoes $70, bag $80.
      - id: n-act4
        anchor: act4
        text: >-
          Choose an online clothes store with a website in English and guide the
          students there (for example ASOS, H&M, ZARA, UNIQLO or SHEIN; the links
          are in the old notebook). Students have 10 minutes to fill their cart.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: shopping-for-fashion-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-descriptive
        type: ruleSummary
        skill: Descriptive sentences
        rules:
          - text: Use **am**, **is** or **are** to say how someone or something looks.
            examples:
              - I **am** stylish.
              - She **is** trendy.
              - These shoes **are** cool.
              - The jeans **are** new.
          - text: Use **adjectives** (long, beautiful, old, black, expensive…) to give more information about clothes.
            examples:
              - The dress is **red**.
              - His jacket is **big** and **warm**.
              - These pants are **short** and **blue**.
              - My coat is **soft** and **green**.
          - text: Use **have** or **has** to say what someone has (*he, she, it* → **has**).
            examples:
              - I **have** a red bag.
              - She **has** five pairs of shoes.
              - They **have** three jackets.
              - He **has** a new T-shirt.
      - id: rules-numbers
        type: ruleSummary
        skill: Numbers
        rules:
          - text: 'Numbers 21–99 join a tens word and a number from 1–9 with a hyphen: twenty-one (21), thirty-five (35), ninety-eight (98).'
            examples:
              - I bought **twenty-seven** shirts yesterday.
              - She has **thirty-five** pairs of socks.
              - There are **ninety-eight** items in the sale.
          - text: 'Tens (20, 30, 40…) end in **-ty**: twenty, thirty, forty, fifty…'
            examples:
              - I spent **sixty** dollars on shoes last week.
              - The jacket costs **eighty** dollars this season.
              - There are **fifty** dresses in the store.
          - text: Numbers 11–19 don't follow a clear pattern, so learn them by heart.
            examples:
              - I bought **fifteen** pairs of socks this month.
              - There are **nineteen** hats on sale today.
              - She ordered **eleven** T-shirts online.
      - id: numbers-table
        type: table
        caption: Numbers 11–19 and the tens
        header: [Number, Word, Number, Word]
        rows:
          - ['11', eleven, '20', twenty]
          - ['12', twelve, '30', thirty]
          - ['13', thirteen, '40', forty]
          - ['14', fourteen, '50', fifty]
          - ['15', fifteen, '60', sixty]
          - ['16', sixteen, '70', seventy]
          - ['17', seventeen, '80', eighty]
          - ['18', eighteen, '90', ninety]
          - ['19', nineteen, '', '']
    teacherNotes:
      - id: n-summary
        anchor: null
        minutes: 20
        text: Go through both skills with the group and ask for one new example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: shopping-for-fashion-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy this message and send it. Mori will ask you questions; answer every one.
      - id: mori-shopping
        type: aiTutorPrompt
        title: Shopping at the mall
        message: >-
          Hi Mori! I want to go shopping at the mall. Can you ask me questions about
          shopping using the skills Descriptive sentences and Numbers? Please use only
          present simple, and correct my mistakes.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**
      - id: extra-title
        type: heading
        level: 3
        text: Extra practice
      - id: mori-list
        type: aiTutorPrompt
        title: My shopping list
        intro: >-
          Send this message to Mori. In your answers, use at least 4 different
          action verbs (buy, go, eat, wear…), 5 different items and 5 numbers (three
          bananas, two shirts, one bottle…).
        message: Hi Mori! I want to talk about my shopping list. Can you ask me questions using numbers and present simple?
      - id: mori-cost
        type: aiTutorPrompt
        title: How much does it cost?
        intro: Send this message to Mori.
        message: Hi Mori! Can you ask me questions about how much each thing costs, using numbers and the present simple?

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: shopping-for-fashion-practice
    book: workbook
    title: 'Practice: Shopping for fashion'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. You can try each question again.
      - id: ex-descriptive
        type: activity
        activity: shopping-for-fashion-descriptive
      - id: ex-numbers
        type: activity
        activity: shopping-for-fashion-numbers

