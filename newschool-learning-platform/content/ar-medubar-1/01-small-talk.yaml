vocabulary:
  - slug: small-talk
    title: שיחת חולין
    items: *small-talk-words

activities:
  - slug: small-talk-questions
    title: שאלות ותשובות בהווה
    minutes: 8
    items:
      - id: where
        type: multipleChoice
        lang: he
        prompt: 'איזו מילת שאלה פירושה ״איפה״?'
        options:
          - { text: 'וֵין', correct: true }
          - { text: 'שׁוּ', feedback: 'שׁוּ פירושה ״מה״.' }
          - { text: 'לֵיש', feedback: 'לֵיש פירושה ״למה״.' }
          - { text: 'כִּיף', feedback: 'כִּיף פירושה ״איך״.' }
      - id: question-words
        type: matching
        lang: he
        prompt: התאימו כל מילת שאלה לפירוש שלה.
        pairs:
          - ['שׁוּ', 'מה']
          - ['וֵין', 'איפה']
          - ['לֵיש', 'למה']
          - ['כִּיף', 'איך']
          - ['אֵימְתַא', 'מתי']
      - id: name-question
        type: multipleChoice
        lang: he
        prompt: 'התשובה היא: ״אִסְמִי נָאדֶר.״ מה הייתה השאלה?'
        options:
          - { text: 'שׁוּ אִסְמַכּ?', correct: true }
          - { text: 'וֵין אַנְתַ סַאכֵּן?', feedback: 'זו שאלה על מקום מגורים: ״איפה אתה גר?״' }
          - { text: "כַּם אִחְ' וְאִחְ'ת עִנְדַכּ?", feedback: 'זו שאלה על אחים ואחיות.' }
      - id: live-question
        type: multipleChoice
        lang: he
        prompt: 'התשובה היא: ״אַנא סַאכֵּן בְּתֵל אַבִיבּ.״ מה הייתה השאלה?'
        options:
          - { text: 'וֵין אַנְתַ סַאכֵּן?', correct: true }
          - {
              text: "וֵין אַנְתַ בַּתְשְׁתִעְ'ל?",
              feedback: 'זו שאלה על מקום העבודה: ״איפה אתה עובד?״',
            }
          - { text: 'שׁוּ בַּתְחִבּّ תַעְמַל?', feedback: 'זו שאלה על מה אתה אוהב לעשות.' }
      - id: work-question
        type: multipleChoice
        lang: he
        prompt: "התשובה היא: ״אַנא בַּשְׁתִרֶ'ל בְּמַדְרַסֵה.״ מה הייתה השאלה?"
        options:
          - { text: "וֵין אַנְתַ בַּתְשְׁתִעְ'ל?", correct: true }
          - { text: 'וֵין אַנְתַ סַאכֵּן?', feedback: 'זו שאלה על מקום מגורים: ״איפה אתה גר?״' }
          - {
              text: 'כַּם מַרַּה בְּתִדְרֻס עַרַבִּי?',
              feedback: 'זו שאלה על כמה פעמים אתה לומד ערבית.',
            }
      - id: yes-no
        type: trueFalse
        lang: he
        prompt: "בשאלת כן/לא אין מילת שאלה: רק הטון עולה. למשל: ״אַנְתַ מֻתְגַ'וֵז?״ – אתה נשוי?"
        answer: true
        feedback:
          correct: 'נכון! בשאלת כן/לא אין מילת שאלה, רק טון עולה.'
          incorrect: "בשאלת כן/לא אין מילת שאלה: ״אַנְתַ מֻתְגַ'וֵז?״ היא שאלה רק בגלל הטון העולה."
      - id: every-day
        type: multipleChoice
        lang: he
        prompt: 'איך שואלים גבר: ״מה אתה עושה כל יום?״'
        options:
          - { text: 'שׁוּ אַנְתַ בַּתְעְמַל כֻּל יוֹם?', correct: true }
          - { text: 'וֵין אַנְתַ בַּתְעְמַל כֻּל יוֹם?', feedback: 'וֵין פירושה ״איפה״.' }
          - { text: 'לֵיש אַנְתַ בַּתְעְמַל כֻּל יוֹם?', feedback: 'לֵיש פירושה ״למה״.' }
      - id: order-why
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים לשאלה: ״למה אתה אוהב לרקוד?״'
        sentence: 'לֵיש אַנְתַ בַּתְחִבּّ תִּרְקֻדּ?'

  - slug: small-talk-describing
    title: משפטי תיאור בהווה
    minutes: 8
    items:
      - id: i-live
        type: multipleChoice
        lang: he
        prompt: '״אני גר בתל אביב״ – השלימו: אַנַא ___ בְּתֵל אַבִיבּ.'
        options:
          - { text: 'סַאכֵּן', correct: true }
          - { text: 'סַאכְּנֵה', feedback: 'סַאכְּנֵה היא הצורה לנקבה: ״גרה״.' }
          - { text: 'בַּחִבּّ', feedback: 'בַּחִבּّ פירושו ״אני אוהב״.' }
      - id: she-lives
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״היא גרה בחיפה״?'
        options:
          - { text: 'הִי סַאכְּנֵה בְּחֵיפָא.', correct: true }
          - { text: 'הֻוא סַאכֵּן בְּחֵיפָא.', feedback: 'זה ״הוא גר בחיפה״.' }
          - { text: 'אַנַא סַאכֵּן בְּחֵיפָא.', feedback: 'זה ״אני גר בחיפה״.' }
      - id: she-likes
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״היא אוהבת לרקוד״?'
        options:
          - { text: 'הִי בְּתִחִבּّ תִּרְקֻדּ.', correct: true }
          - {
              text: 'הִי בַּחִבּّ תִּרְקֻדּ.',
              feedback: 'עם הִי הפועל מקבל ת׳ בתחילתו: בְּתִחִבּّ.',
            }
          - { text: 'הֻו בַּחִבּّ תִּרְקֻדּ.', feedback: 'הֻו פירושו ״הוא״.' }
      - id: pronouns
        type: matching
        lang: he
        prompt: התאימו כל כינוי גוף לפירוש שלו.
        pairs:
          - ['אַנַא', 'אני']
          - ['אַנְתַ', 'אתה']
          - ['אַנְתִי', 'את']
          - ['הֻוֵ', 'הוא']
          - ['הִיֵ', 'היא']
      - id: have-children
        type: multipleChoice
        lang: he
        prompt: 'שואלים גבר: ״יש לך ילדים?״'
        options:
          - { text: 'עִנְדַכּ וַלַאד?', correct: true }
          - { text: 'עִנְדִי וַלַאד?', feedback: 'עִנְדִי פירושו ״יש לי״.' }
          - { text: 'עִנְדִכּ וַלַאד?', feedback: 'עִנְדִכּ פירושו ״יש לך״ – לאישה.' }
      - id: you-feminine
        type: trueFalse
        lang: he
        prompt: 'כשמדברים אל אישה, מוסיפים י בסוף הפועל: בַּתְחִבּّ ← בַּתְחִבִּי (את אוהבת).'
        answer: true
        feedback:
          correct: 'נכון! בַּתְ + פועל + י: בַּתְחִבִּי, בַּתְעְמַלִי, בַּתְדְרֻסִי.'
          incorrect: 'לאישה מוסיפים י בסוף: בַּתְחִבִּי – את אוהבת.'
      - id: he-works
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״הוא עובד בחנות בגדים״?'
        options:
          - { text: "הֻוֵ בִּשְׁתִרֶ'ל בְּמַחַלّ אואעי.", correct: true }
          - {
              text: "הִי בְּתִשְׁתִרֶ'ל בְּמַחַלّ אואעי.",
              feedback: 'הִי פירושו ״היא״: ״היא עובדת בחנות בגדים״.',
            }
          - { text: "אַנַא בַּשְׁתִרֶ'ל בְּמַחַלّ אואעי.", feedback: 'זה ״אני עובד בחנות בגדים״.' }
      - id: order-siblings
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״יש לי שני אחים ואחות.״'
        sentence: "עִנְדִי תֵּין אִחְ'וַאן וּאִחְ'ת"
