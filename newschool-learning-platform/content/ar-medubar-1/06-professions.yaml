# Cycle "Professions", converted from the spoken Arabic level 1 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (spoken Arabic in Hebrew letters);
# Hebrew instructions carry `lang: he`.
course: ar-medubar-1
slug: professions
title: "מקצועות – וד'אֶיף ואעמאל"
goal: לספר מה המקצוע שלי, איפה אני עובד ומה אני עושה בעבודה, עם פעולות בהווה ומספרים בסיסיים.
position: 6
status: in_review

review:
  - >-
    The two workbook exercises ("Actions at work" and "Professions, places and
    numbers") are NEW: the notebook has no self-study exercises. They were written only
    from this cycle's vocabulary, summary and examples. An Arabic teacher must check
    every right answer, every wrong option and every transliteration before students see
    them.
  - >-
    The cycle's two skills are "actions in the present" and "basic numbers", but the
    cycle has almost no number material (only תַלָתֶה and אַרְבַּעַה). The second exercise
    therefore practises professions and workplaces, with two number items. Please
    confirm, or add number material.
  - >-
    The exercises use the gloss פִיה = "there is / it has" (פִיה אַרְבַּעַה מֻעַלְמִין),
    which the notebook implies but does not state.
  - >-
    Typos fixed: the Arabic shadda sign on Hebrew letters (מַחַלّ → מַחַל); double dagesh
    in "בְּחִיבּּ" (→ בְּחִיבּ); a stray backslash after "חֻ'בֶז"; Mori interview question
    "בלבי או בל מכתב" → "בלבית או בל מכתב". Please confirm.
  - >-
    Left out: the summary example "אני נגר, אני עובד עם עץ" (Hebrew only, no Arabic: please
    add the Arabic); the Arabic-script duplicates in the vocabulary; the empty "תַארִיך /
    מֻשְׁתַרְכִּין" headings. Warm-up question 4 ("choose a picture") refers to pictures that
    are not in the exported notebook: the teacher shows them (see the teacher note).
  - >-
    Activity 3: four of the nine questions are in Hebrew only (how many people you work
    with, how you get to work, when you come back, what you do after work). They are
    kept in a separate Hebrew list; please add the Arabic.
  - >-
    Inconsistent frames kept as in the notebook: "אַנַא בַּעְמַל בִּ___. בַּעְמַל ___."
    (Activity 4 and Mori step 5) next to "אַנַא בִּשְתַרֶ'ל בִּ___. בַּעְמַל ___." (summary and
    Mori step 2). Should the first one be בִּשְתַרֶ'ל too? The summary also uses
    בִּשְתַרֶ'ל for "I" while Activity 4 uses בַּשתְר'ל; please choose.
  - >-
    Questions about the material: "עֵסֶק" (Activity 2) is a Hebrew word; is that
    intended, or should it be מַשְרוּע? "רוֹפֶה" in the summary pattern list looks Hebrew
    (רופא); the Arabic list has דוקטור. "ק'די אל מעאש؟" (perfect-job activity) may be
    "ק'דֵּיש אל מעאש؟". "בִּשֻּעֻ'ל" in Activity 1 is spelled differently from בִּשֻּור'ול.
    "בְּתִלְבַּס זֶיְ؟" (Activity 1): is "זֶיְ" (uniform) complete?
  - >-
    Spelling variants kept (teacher's call): בִּשְתַרֶ'ל / בִּשְתַעְ'ל / בִּשְתרֶל, בִּשֻּור'ול /
    בִּשֻּורול, מֻעַלֶם / מעַלֶם, סַאאֶק / סַוָאק' (both kept in the vocabulary), ס'חַפי /
    סַ'חָפִי, בַּעְלֵם / בַּעַלֶם / בַּעְלֶּם.
  - >-
    The Hebrew glosses of the Activity 4 example sentences were added (the summary
    translates similar sentences). The vocabulary "מַחַטֶת בּאס'את" is glossed "תחנת
    אוטובוסים" only: the notebook's "/ מוניות" has only Arabic script (تاكسيات).
  - >-
    The unnumbered "perfect job" activity before Activity 1 is kept as "פעילות פתיחה".
    The "תשובת תלמיד" lines are replaced by the optional answer boxes. The Quizlet link's
    tracking parameters (?i=…&x=…) were removed.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: professions-class
    title: 'שיעור: מקצועות'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        lang: he
        text: "מקצועות – וד'אֶיף ואעמאל (תפקידים ועבודה)"
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: פעולות בהווה
            description: "אַנַא בִּשְתַרֶ'ל בִּ… / בַּעְמַל… / בַּעְלֵם, בַּטבּוח', בַּכְּתֶבּ…"
          - name: מספרים בסיסיים
            description: "כמה שעות, כמה אנשים: בִּשְתַעְ'ל תַלָתֶה סָאעַאת"
      - id: quizlet
        type: externalLink
        lang: he
        label: מקצועות בקוויזלט
        url: https://quizlet.com/il/1119911360/%D7%9E%D7%A7%D7%A6%D7%95%D7%A2%D7%95%D7%AA-%D7%95%D7%93%D7%90%D7%99%D7%A3-%D7%95-%D7%90%D7%A2%D7%9E%D7%90%D7%9C-%D7%A2%D7%91%D7%95%D7%93%D7%95%D7%AA-%D7%95%D7%AA%D7%A4%D7%A7%D7%99%D7%93%D7%99%D7%9D-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        lang: he
        text: סיבוב פתיחה
      - id: intro
        type: sentenceFrame
        frame: |-
          אִסְמִי ___.
          אַנַא ___.
        example: אַנַא מֻעַלֶם / מֻעַלְמֶה.
      - id: warmup-title
        type: heading
        level: 3
        lang: he
        text: שאלות חימום
      - id: warmup
        type: discussionQuestions
        items:
          - question: "שוּ בְּתִעְמַל / בְּתִעְמַלִי בִּשֻּור'ול؟ (בּעַלֶּם, בּעאלֶג', בַּחְכִּי מע אנּאס, בעמל משרוע…) *(מה אתה עושה בעבודה?)*"
            frame: |-
              בלשור'ול אנא:
              1. ___
              2. ___
          - question: "שוּ בְּתִחִבּ / בְּתִחִבִּי בִּשֻּור'ול؟ (אלג'ו, אלנאס, אלמס'ארי, אלתַקְ'דיר…) *(מה אתה אוהב בעבודה?)*"
            frame: בְּחִיבּ ___.
          - question: "שוּ מַא בְּתִחִבּ / בְּתִחִבִּי בִּשֻּור'ול؟ ליש؟ (סאעאת טוילֶה, דַ'רֶ'ט, מעאש ק'ליל, אלג'ו…)"
            frame: מַא בְּחִיבּ ___.
          - question: "שו בֶּתְפַכֶּר לַמּא תֶחְכּי ען אל שור'ול؟ אֶח'תאר / י ס'ורָה…"
            frame: וליש؟ ___
          - question: "כַּם סָאעַה בְּתִשְתַרֶ'ל / בְּתִשְתַרְ'לִי בֶּלאֻסְבּוּע؟ *(כמה שעות בשבוע?)*"
            frame: "בִּשְתַרֶ'ל ___ סָאעַאת."
          - question: "שו בֶּדַכְּ / בֶּדֶכְּ תֶחְ'תאר / י… וליש؟"
            frame: "אנא בַּחְ'תאר ___ (מהנדס, מוחאמי, דכּתור, טבּאח', מורַ'נּי, מוס'מֶּם)."
      - id: activities-title
        type: heading
        level: 3
        lang: he
        text: פעילויות
      - id: act0
        type: classActivity
        lang: he
        title: "פעילות פתיחה: העבודה המושלמת – אלשור'ול אלמֶת'אלי"
        skills: [פעולות בהווה, מספרים בסיסיים]
        steps:
          - כל משתתף כותב על דף בצד את העבודה המושלמת בעיניו, לפי השאלות.
          - בסוף, כל תלמיד קורא את התנאים שלו לעבודה מושלמת.
      - id: act0-questions
        type: discussionQuestions
        items:
          - question: "שו אלשור'ול؟"
          - question: כַּם סאעה בליום؟
          - question: "ק'די אל מעאש؟"
          - question: לחאלַכְּ או מע שריכְּ؟
          - question: וין, בלבית או בל מַכְּתַבְּ؟
      - id: act1
        type: classActivity
        lang: he
        title: "פעילות 1: נַחְ'מִן אִל שור'ול (נחשו את העבודה)"
        skills: [פעולות בהווה]
        steps:
          - תלמיד בוחר מקצוע סודי.
          - השאר שואלים שאלות פשוטות מהשיעור (ראו את השאלות המוכנות).
          - ממשיכים עד שמישהו שואל את השאלה הנכונה, למשל "אַנְתַא מעלם؟".
      - id: act1-questions
        type: examples
        items:
          - text: "בְּתִשְתַרֶ'ל בִּ–___?"
          - text: "בְּתִעְמַל ___ בִּשֻּעֻ'ל?"
          - text: בְּתִשְתַרֶל מַעְ נַאס?
          - text: בְּתִלְבַּס זֶיְ?
          - text: בְּתִסָאפֶר?
          - text: אַנְתַא ___؟ (מעלם? דוקטור? גרסון?)
      - id: act2
        type: classActivity
        lang: he
        title: 'פעילות 2: נַעְמַל עֵסֶק (עסק)'
        skills: [מספרים בסיסיים]
        steps:
          - "לכל זוג יש עסק פשוט, למשל: עֵסֶק קַהְוֶה (בית קפה), עֵסֶק מַחְ'בַּזֶ (מאפייה), עֵסֶק מַדְרַסֶה (בית ספר קטן)."
          - 'בוחרים: שם לעסק, מה מוכרים, 3 מקצועות שהעסק צריך, וכמה אנשים עובדים בו.'
          - חוזרים לכיתה ומציגים את העסק לפי התבנית.
      - id: act2-frame
        type: sentenceFrame
        frame: |-
          עֵסֶקִי ___.
          פִיה ___ מֻעַלְמִין.
          פִיה ___ גרסון.
          פִיה ___ עֻומַאל.
      - id: act3
        type: classActivity
        lang: he
        title: "פעילות 3: מוחאדַתֶ'ה ען אלשור'ול (שיחה על עבודה)"
        skills: [פעולות בהווה, מספרים בסיסיים]
        steps:
          - מתחלקים לחדרים, ושואלים אחד את השני את השאלות.
          - עונים לפי תבנית התשובה.
          - חוזרים לכיתה ומספרים בגוף שלישי מה החבר אמר.
      - id: act3-questions
        type: discussionQuestions
        items:
          - question: וֵין בְּתִשְתרֶל؟
          - question: "כַּם סָאעַה בְּתִשְתַעְ'ל בְּאֻסְבּוּע؟"
          - question: שוּ בְּתִעְמַל בִּשֻּורול؟
          - question: וינתא בתרווח בִּשֻּרול؟
          - question: "בְּתִשְתַר'ל גֻוָּה וַלַא בַּרָה؟"
      - id: act3-more
        type: discussionQuestions
        lang: he
        title: עוד שאלות (שאלו אותן בערבית)
        items:
          - question: עם כמה אנשים אתה עובד?
          - question: איך אתה הולך לעבודה?
          - question: מתי אתה חוזר מהעבודה?
          - question: מה אתה עושה אחרי העבודה?
      - id: act3-frame
        type: sentenceFrame
        frame: |-
          בִּשְתרֶל בִּ___.
          בִּשְתַרֶל ___ סָאעַאת.
          בַּעְמַל ___.
      - id: act4
        type: classActivity
        lang: he
        title: 'פעילות 4: פעולה וּמַחַל (פעולה + מקום עבודה)'
        skills: [פעולות בהווה]
        steps:
          - שלב 1 – המורה נותן רשימת מקומות עבודה.
          - שלב 2 – המורה נותן רשימת פעולות קלות.
          - שלב 3 – התאמה – המורה אומר פעולה, והתלמידים בוחרים מקום מתאים.
          - שלב 4 – בונים משפט קצר לפי התבנית.
      - id: act4-places
        type: examples
        items:
          - { text: מֶדְרַסֶה, gloss: בית ספר }
          - { text: מַטְעַם, gloss: מסעדה }
          - { text: "מַחְ'בַּז", gloss: מאפייה }
          - { text: מוסְתַשְפא, gloss: בית חולים }
          - { text: מַכְּתַבּ, gloss: משרד }
          - { text: שַרִכֶּה, gloss: חברה }
          - { text: סוּק, gloss: שוק }
          - { text: מַחַל, gloss: חנות }
      - id: act4-actions
        type: examples
        items:
          - { text: בַּעַלֶם, gloss: מלמד }
          - { text: "בַּטבּוח'", gloss: מבשל }
          - { text: בֶּתְעַלָּם, gloss: לומד }
          - { text: "בִּשְתַרֶ'ל עַל כֻּמבִּיוּתֵר", gloss: עובד על מחשב }
          - { text: "בִּסֻוּק'", gloss: נוהג }
          - { text: בַּכְּתֶבּ, gloss: כותב }
          - { text: "בֶּק'רא", gloss: קורא }
      - id: act4-frame
        type: sentenceFrame
        frame: אַנַא בַּעְמַל בִּ___. בַּעְמַל ___.
      - id: act4-examples
        type: examples
        items:
          - text: "אַנַא בַּשתְר'ל בִּלמַטבח. בטבוח' אַכֶּל."
            gloss: אני עובד במטבח. אני מבשל אוכל.
          - text: אַנַא בשתרֶל בִּלמדרסה. בַּעְלֵם עַרָבִּי.
            gloss: אני עובד בבית הספר. אני מלמד ערבית.
          - text: "אַנַא בַּשתר'ל בִּלמַחְ'בַּז. בחבֶז חֻ'בֶז."
            gloss: אני עובד במאפייה. אני אופה לחם.
          - text: "אַנַא בַּשתר'ל בִּלשַרִכֶּה. בִּשְתַרֶ'ל עַל כֻּמבִּיוּתֵר."
            gloss: אני עובד בחברה. אני עובד על מחשב.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: 'שתי מיומנויות: פעולות בהווה ומספרים בסיסיים. רמה: יסודות.'
      - id: n-intro
        anchor: intro
        text: התלמידים עונים בתבנית בלבד.
      - id: n-warmup
        anchor: warmup
        text: >-
          תשובות קצרות. בשאלה 4 ("אֶח'תאר ס'ורָה") התלמידים בוחרים תמונה: התמונות לא
          נמצאות בפלטפורמה, ולכן המורה משתף אותן במסך.
      - id: n-act3
        anchor: act3
        text: >-
          חלקו את המשתתפים לחדרים (Breakout Rooms). כשהם חוזרים לכיתה, כל תלמיד מספר בגוף
          שלישי מה החבר שלו אמר.
      - id: n-act4
        anchor: act4
        text: 'מיומנויות: פעולות בהווה, מקומות עבודה, משפטים קצרים (A1), חיזוק של וֵין / בִּ (איפה).'

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: professions-summary
    title: סיכום
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        lang: he
        text: מה למדנו היום?
      - id: overview
        type: text
        lang: he
        text: >-
          בשיעור התמקדנו בפעולות בהווה (פעלים בסיסיים), במספרים בסיסיים, במקצועות נפוצים
          ובמקומות עבודה, ובבניית משפט פשוט ונכון בערבית: **אַנַא + פועל + (מקום / מקצוע)**.
          כך אפשר לספר מי אנחנו, מה המקצוע שלנו, איפה אנחנו עובדים ומה אנחנו עושים בעבודה –
          הכול בהווה.
      - id: rules-sentences
        type: ruleSummary
        lang: he
        skill: משפטים בסיסיים עם אַנַא
        rules:
          - text: 'מבנה בסיסי של משפט פעולה: **אַנַא + בַּעְמַל + ___** (אני עושה…)'
          - text: 'מבנה עם עבודה: **אַנַא בִּשְתַרֶל בִּ___** (אני עובד ב־…)'
          - text: 'שילוב שניהם: **אַנַא בִּשְתַרֶל בִּ___. בַּעְמַל ___.** (אני עובד ב־… ואני עושה…)'
            examples:
              - אַנַא בִּשְתַר'ל בִּלמדרסה. בעלם עַרָבִּי. (אני עובד בבית ספר. אני מלמד ערבית.)
              - "אַנַא בִּשְתַר'ל בִּלמטעם. בַּטבוח' אַכְּל. (אני עובד במסעדה. אני מבשל אוכל.)"
              - "אַנַא בִּשְתַר'ל בִּשַרִכֶּה. בִּשְתַר'ל עַל כֻּמבִּיוּתֵר. (אני עובד בחברה. אני עובד על מחשב.)"
      - id: verbs-table
        type: table
        lang: he
        caption: פעלים חשובים בהווה
        header: [ערבית, עברית]
        rows:
          - [בַּעְמַל, אני עושה / מבצע]
          - ["בִּשְתַרֶ'ל", אני עובד]
          - [בַּעְלֵֶּם, אני מלמד]
          - [בַּכְּתֶבּ, אני כותב]
          - ["בַּטבּוח'", אני מבשל]
          - ["בַּחַ'דֵם", אני משרת]
          - [בַּבִּיע, אני מוכר]
          - [בַּרסִום, אני מצייר]
          - [בַּאכֻּול / בּוכֶּל, אני אוכל]
          - ["בִּסֻוּק'", אני נוהג]
      - id: verbs-example
