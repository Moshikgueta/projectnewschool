        type: table
        lang: he
        caption: מקומות עבודה
        header: [ערבית, עברית]
        rows:
          - [מדְרַסֶה, בית ספר]
          - [מַטְעָם, מסעדה]
          - [מוסתַשְפא, בית חולים]
          - ["מַחְ'בַּז", מאפייה]
          - [מַכְּתַבּ, משרד]
          - [שַרִכֶּה, חברה]
          - ["מַחַטֶת בּאס'את", תחנת אוטובוסים / מוניות]
      - id: places-examples
        type: examples
        items:
          - text: "אַנַא בִּשְתַעְ'ל בִּל מַחְ'בַּזֶ."
            gloss: אני עובד במאפייה.
          - text: "אַנַא בִּשְתַעְ'ל בִּשַרִכֶּה."
            gloss: אני עובד בחברה.
          - text: "בִּשְתַעְ'ל תַלָתֶה סָאעַאת."
            gloss: אני עובד שלוש שעות.
          - text: פִיה אַרְבַּעַה מֻעַלְמִין.
            gloss: יש בו ארבעה מורים.
      - id: rules-patterns
        type: ruleSummary
        lang: he
        skill: 4 תבניות מרכזיות לחזרה
        rules:
          - text: 'הצגת מקצוע: **אַנַא ___.**'
            examples: ["מֻעַלֶם, רוֹפֶה, מֻמַרְד', מְהַנְדֵס…"]
          - text: "איפה אני עובד: **אַנַא בִּשְתַעְ'ל בִּ–___.**"
          - text: 'מה אני עושה בעבודה: **בַּעְמַל ___.**'
          - text: "כמה שעות: **בִּשְתַעְ'ל ___ סָאעַאת.**"
      - id: next
        type: callout
        lang: he
        tone: info
        title: מה עכשיו?
        text: |-
          בדיבור בסיסי בערבית על מקצועות, צריך לדעת:
          ✔ להגיד מה המקצוע שלי
          ✔ להגיד איפה אני עובד
          ✔ להגיד 2–3 פעולות שאני עושה בעבודה
          ✔ להשתמש ב־3–4 פעלים בהווה
          ✔ לענות על כמה שאלות פשוטות
          ✔ להשתמש במספרים 1–10
          האימון ממשיך דרך תבניות וחזרה על אותן מילים.
      - id: one-line
        type: text
        lang: he
        text: '**היום למדנו איך לספר מי אנחנו, מה העבודה שלנו, איפה אנחנו עובדים ומה אנחנו עושים שם – הכול בערבית פשוטה וברורה.**'
    teacherNotes:
      - id: n-summary
        anchor: null
        text: עברו על התבניות עם הקבוצה ובקשו מכל תלמיד משפט על העבודה שלו.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: professions-homework
    title: שיעורי בית עם מורי
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        lang: he
        text: 'שיעורי בית: מקצועות'
      - id: step1-title
        type: heading
        level: 3
        lang: he
        text: 'שלב 1: פתיחת שיחה עם מורי'
      - id: mori-start
        type: aiTutorPrompt
        lang: he
        intro: שלחו למורי.
        message: היי מורי! אני רוצה לתרגל ערבית (מדוברת). תשאל אותי שאלות על מקצועות, רק בזמן הווה, ותקן לי את הטעויות.
      - id: step2-title
        type: heading
        level: 3
        lang: he
        text: 'שלב 2: עונים על השאלות של מורי'
      - id: step2-text
        type: text
        lang: he
        text: 'מורי ישאל שאלות כמו אלה. ענו לו בתבנית מהשיעור.'
      - id: step2-questions
        type: examples
        items:
          - text: "שוּ בשתר'ל?"
          - text: "וֵין בִּתִשְתַר'ל?"
          - text: "שוּ בְּתִעְמַל בִּל שֻּור'ל?"
          - text: "כַּם סָאעַה בִּתִשְתַרֶ'ל בְּאֻסְבּוּע?"
          - text: "שוּ בְּתִעְמַל בַּעְד אֶשֻּור'ל?"
      - id: step2-frame
        type: sentenceFrame
        frame: "אַנַא בִּשְתַרֶ'ל בִּ–___. בַּעְמַל ___."
        answerable: false
      - id: step3-title
        type: heading
        level: 3
        lang: he
        text: 'שלב 3: נחש את המקצוע'
      - id: mori-guess
        type: aiTutorPrompt
        lang: he
        intro: שלחו למורי, ואחר כך תנו 2–3 רמזים בערבית (ראו דוגמאות).
        message: מורי, בוא נשחק משחק. אני חושב על מקצוע ואתה צריך לנחש. תשאל אותי שאלות.
      - id: step3-hints
        type: examples
        items:
          - text: בַּעְמַל מַעְ נַאס.
          - text: בַּכְּתֻבּ.
          - text: בִּשְתַרֶ'ל בִּמַכְתַבּ.
      - id: mori-your-turn
        type: aiTutorPrompt
        lang: he
        intro: ואז כתבו למורי.
        message: עכשיו תורך, מורי. תחשוב על מקצוע ואני אנחש.
      - id: step4-title
        type: heading
        level: 3
        lang: he
        text: 'שלב 4: ראיון עבודה (A1)'
      - id: mori-interview
        type: aiTutorPrompt
        lang: he
        intro: שלחו למורי, ואחר כך שאלו 4–5 שאלות בערבית.
        message: מורי, אני רוצה לתרגל ראיון עבודה בערבית. אני המראיין ואתה העובד.
      - id: step4-questions
        type: examples
        items:
          - text: שוּ בֶּנְאסְבַּכּ؟
          - text: "וֵין בִּתִשְתַרֶ'ל؟"
          - text: "כַּם סָאעַה בִּתִשְתַרֶ'ל בְּאֻסְבּוּע؟"
          - text: "שוּ בְּתִעְמַל בִּשֻּור'ול؟"
          - text: "בְּתִשְתַרֶ'ל בלבית או בל מכתב؟"
      - id: step4-end-text
        type: text
        lang: he
        text: בסוף כתבו לו אם הוא מתקבל או לא, ומשפט קצר למה.
      - id: step4-end
        type: examples
        items:
          - text: אִנְתַא מַקְבּוּל
            gloss: אתה מתקבל
          - text: אִנְתַא מִשּ מַקְבּוּל
            gloss: אתה לא מתקבל
      - id: step5-title
        type: heading
        level: 3
        lang: he
        text: 'שלב 5: תרגול בניית משפטים'
      - id: mori-sentences
        type: aiTutorPrompt
        lang: he
        intro: 'שלחו למורי. הוא ייתן לכם זוגות כמו "בַּעְלֵם + בֵּית סֵפֶר" או "בַּטבּוח'' + מַטעם", ואתם כותבים משפט לפי התבנית.'
        message: מורי, תן לי 10 פעלים ו־10 מקומות עבודה, ואני אבנה משפטים קצרים בערבית.
      - id: step5-frame
        type: sentenceFrame
        frame: אַנַא בַּעְמַל בִּ–___. בַּעְמַל ___.
        answerable: false

