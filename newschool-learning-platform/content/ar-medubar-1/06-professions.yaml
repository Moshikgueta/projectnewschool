activities:
  - slug: professions-actions
    title: פעולות בעבודה
    minutes: 8
    items:
      - id: match-verbs
        type: matching
        lang: he
        prompt: התאימו כל פועל לתרגום שלו.
        pairs:
          - [בַּעְמַל, אני עושה]
          - [בַּכְּתֶבּ, אני כותב]
          - ["בַּטבּוח'", אני מבשל]
          - [בַּבִּיע, אני מוכר]
          - ["בִּסֻוּק'", אני נוהג]
      - id: teach-arabic
        type: multipleChoice
        lang: he
        prompt: איך אומרים "אני מלמד ערבית"?
        options:
          - { text: בַּעְלֵם עַרָבִּי, correct: true }
          - { text: "בַּטבּוח' עַרָבִּי", feedback: 'בַּטבּוח'' פירושו "אני מבשל".' }
          - { text: "בִּסֻוּק' עַרָבִּי", feedback: 'בִּסֻוּק'' פירושו "אני נוהג".' }
      - id: restaurant
        type: multipleChoice
        lang: he
        prompt: איך אומרים "אני עובד במסעדה. אני מבשל אוכל."?
        options:
          - { text: "אַנַא בִּשְתַר'ל בִּלמטעם. בַּטבוח' אַכְּל.", correct: true }
          - {
              text: "אַנַא בִּשְתַר'ל בִּלמדרסה. בַּטבוח' אַכְּל.",
              feedback: מדרסה פירושה "בית ספר". "מסעדה" זה מַטְעַם.,
            }
          - {
              text: "אַנַא בִּשְתַר'ל בִּלמטעם. בַּבִּיע אַכְּל.",
              feedback: בַּבִּיע פירושו "אני מוכר".,
            }
      - id: place-teach
        type: multipleChoice
        lang: he
        prompt: איפה הכי מתאים לעבוד אם אתם אומרים "בַּעְלֵם" (אני מלמד)?
        options:
          - { text: מדְרַסֶה, correct: true }
          - { text: "מַחְ'בַּז", feedback: "מַחְ'בַּז זו מאפייה." }
          - { text: מוסתַשְפא, feedback: מוסתַשְפא זה בית חולים. }
      - id: place-cook
        type: multipleChoice
        lang: he
        prompt: 'איפה הכי מתאים לעבוד אם אתם אומרים "בַּטבּוח''" (אני מבשל)?'
        options:
          - { text: מַטְעַם, correct: true }
          - { text: מדְרַסֶה, feedback: מדְרַסֶה זה בית ספר. }
          - { text: מַכְּתַבּ, feedback: מַכְּתַבּ זה משרד. }
      - id: aamal
        type: trueFalse
        lang: he
        prompt: בַּעְמַל פירושו "אני עושה".
        answer: true
      - id: aktob
        type: trueFalse
        lang: he
        prompt: בַּכְּתֶבּ פירושו "אני קורא".
