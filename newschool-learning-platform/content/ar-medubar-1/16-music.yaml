          - { term: "ס'אחב", gloss: חבר }
          - { term: "אח'", gloss: אח }
          - { term: בית, gloss: בית }

vocabulary:
  - slug: music
    title: מוזיקה
    items: *music-words

activities:
  - slug: music-questions
    title: 'בניית שאלות: מוזיקה'
    minutes: 8
    items:
      - id: question-words
        type: matching
        lang: he
        prompt: התאימו כל מילת שאלה לפירוש שלה.
        pairs:
          - [שו, מה]
          - [וֵין, איפה]
          - [וינתא, מתי]
          - [מין, מי]
          - [ליש, למה]
      - id: garden
        type: multipleChoice
        lang: he
        prompt: >-
          התשובה: **אנא בַּסְמע מוסיק'א פי אלחדיק'ה.** (בגינה) באיזו מילת שאלה מתחילה
          השאלה?
        options:
          - { text: וֵין, correct: true }
          - { text: וינתא, feedback: 'וינתא = מתי. התשובה אומרת איפה: בגינה.' }
          - { text: מין, feedback: 'מין = מי. התשובה אומרת איפה: בגינה.' }
      - id: once-a-day
        type: multipleChoice
        lang: he
        prompt: >-
          התשובה: **אנא בסמע מוסיק'א מַרָּה פי אליום.** (פעם ביום) באיזו מילת שאלה מתחילה
          השאלה?
        options:
          - { text: "ק'דיש", correct: true }
          - { text: וֵין, feedback: "וֵין = איפה. התשובה אומרת כמה פעמים, ולכן שואלים ק'דיש." }
          - { text: ליש, feedback: "ליש = למה. התשובה אומרת כמה פעמים, ולכן שואלים ק'דיש." }
      - id: classical
        type: multipleChoice
        lang: he
        prompt: >-
          התשובה: **אחלא נוע מוסיק'א הו אלקלאסיקיה.** (הסוג הכי טוב הוא קלאסית) באיזו מילת
          שאלה מתחילה השאלה?
        options:
          - { text: שו, correct: true }
          - { text: וינתא, feedback: 'וינתא = מתי. התשובה אומרת מה: איזה סוג מוזיקה.' }
          - { text: וֵין, feedback: 'וֵין = איפה. התשובה אומרת מה: איזה סוג מוזיקה.' }
      - id: with-friends
        type: multipleChoice
        lang: he
        prompt: >-
          התשובה: **אנא בסמע מוסיקה מע צחבי.** (עם החברים שלי) באיזו מילת שאלה מתחילה
          השאלה?
        options:
          - { text: מין, correct: true }
          - { text: ליש, feedback: 'ליש = למה. התשובה אומרת עם מי, ולכן שואלים מע מין.' }
          - { text: וינתא, feedback: 'וינתא = מתי. התשובה אומרת עם מי, ולכן שואלים מע מין.' }
      - id: where-question
        type: multipleChoice
        lang: he
        prompt: איזו שאלה פירושה **איפה אתה שומע מוזיקה?**
        options:
          - { text: "וֵין בתסמע מוסיק'א?", correct: true }
          - { text: "וינתא בתסמע מוסיק'א?", feedback: 'זאת השאלה "מתי אתה שומע מוזיקה?".' }
          - { text: "ק'דיש בתסמע מוסיק'א?", feedback: 'זאת השאלה "כמה אתה שומע מוזיקה?".' }
      - id: order-what-do
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים לשאלה: מה אתה עושה כשאתה שומע מוזיקה?'
        sentence: "שו בתעמַל למָּא תסמע מוסיק'א"
      - id: wenta-meaning
        type: trueFalse
        lang: he
        prompt: 'המילה **וינתא** פירושה **איפה**.'
        answer: false
        feedback:
          correct: 'נכון! וינתא = מתי. איפה = וֵין.'
          incorrect: 'וינתא = מתי. איפה = וֵין.'

  - slug: music-present
    title: 'פעולות בהווה: מוזיקה'
    minutes: 8
    items:
      - id: verbs
        type: matching
        lang: he
        prompt: התאימו כל פועל לפירוש שלו.
        pairs:
          - [בַּסְמַע, שומע]
          - [בַּרַ׳נּי, שר]
          - ["בַּרק'וס'", רוקד]
          - [בַּתְבַּסָּם, מחייך]
          - [בפכר, חושב]
      - id: listen-every-day
        type: multipleChoice
