vocabulary:
  - slug: goals-and-projects
    title: מטרות ופרויקטים
    items: *goals-words

activities:
  - slug: goals-and-projects-verbs
    title: פעלים בזמן הווה
    minutes: 8
    items:
      - id: verbs
        type: matching
        lang: he
        prompt: התאימו כל פועל לפירוש שלו.
        pairs:
          - [אַתְעַלָּם, לומד]
          - [אַשְׁתְרֶ׳ל, עובד]
          - [אַבָּלֶּשׁ, מתחיל]
          - [אַנְהִי, מסיים]
          - [אַסאעֶד, עוזר]
      - id: not-working
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: "אני לא עובד"?'
        options:
          - { text: אנא מא אשתע׳ל, correct: true }
          - { text: מא אנא אשתע׳ל, feedback: '*מא* באה מיד לפני הפועל: אנא **מא** אשתע׳ל.' }
          - { text: אנא אשתע׳ל מא, feedback: '*מא* באה לפני הפועל, לא אחריו.' }
      - id: negation-rule
        type: trueFalse
        lang: he
        prompt: 'כדי לשלול פועל בהווה שמים *מא* לפני הפועל: אנא מא אתעלם אל־יום.'
        answer: true
        feedback:
          correct: נכון! כמו "אני **לא** לומד" בעברית.
      - id: learn-arabic
        type: multipleChoice
        lang: he
        prompt: 'מה הפירוש של: *אנא אתעלם ערבי*?'
        options:
          - { text: אני לומד ערבית, correct: true }
          - { text: אני מדבר ערבית, feedback: 'לדבר = *אַחְכִּי*. *אתעלם* = לומד.' }
          - { text: אני לא לומד ערבית, feedback: 'אין כאן *מא*, אז המשפט חיובי.' }
      - id: every-day
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: "אני עובד כל יום".'
        sentence: אנא אשתע׳ל כל יום
      - id: new-goal
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: "אני מתחיל מטרה חדשה"?'
        options:
          - { text: אנא אבלש הדף ג׳דיד, correct: true }
          - text: "אנא אַח'לֶּס' הדף ג׳דיד"
            feedback: "*אַח'לֶּס'* = מסיים. מתחיל = *אבלש*."
          - text: אנא מא אבלש הדף ג׳דיד
            feedback: '*מא* = לא. המשפט הזה אומר "אני **לא** מתחיל".'
      - id: lazem
        type: multipleChoice
        lang: he
        prompt: 'מה הפירוש של *לאזֶם*?'
        options:
          - { text: צריך, correct: true }
          - { text: חשוב, feedback: 'חשוב = *מוהֶם*.' }
          - { text: חדש, feedback: "חדש = *ג'דיד*." }
      - id: anhi
        type: trueFalse
        lang: he
        prompt: '*אַנְהִי* פירושו "להתחיל".'
        answer: false
        feedback:
          correct: 'נכון! *אַנְהִי* = לסיים. להתחיל = *אַבָּלֶּשׁ*.'
          incorrect: '*אַנְהִי* = לסיים. להתחיל = *אַבָּלֶּשׁ*.'

  - slug: goals-and-projects-months
    title: 'תאריכים ומספרים: שַׁהָר + מספר'
    minutes: 8
    items:
      - id: months
        type: matching
        lang: he
        prompt: התאימו כל חודש לשם שלו בעברית.
        pairs:
          - [שַׁהָר ואחָד, ינואר]
          - [שַׁהָר תנין, פברואר]
          - [שַׁהָר תלאתֶה, מרץ]
          - [שַׁהָר ארבַּעָה, אפריל]
      - id: start-march
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: "אני מתחיל במרץ"?'
        options:
          - { text: אנא אבלש פי שַׁהָר תלאתֶה, correct: true }
          - { text: אנא אבלש פי שַׁהָר תנין, feedback: 'שַׁהָר תנין = פברואר (החודש השני).' }
          - {
              text: אנא אבלש פי שַׁהָר ארבַּעָה,
              feedback: 'שַׁהָר ארבַּעָה = אפריל (החודש הרביעי).',
            }
      - id: al-yom
        type: trueFalse
        lang: he
        prompt: '*אל־יום* פירושו "היום".'
        answer: true
        feedback:
          correct: 'נכון! למשל: אנא מא אתעלם אל־יום.'
      - id: wenta
        type: multipleChoice
        lang: he
        prompt: 'מה הפירוש של: *וינתא בֶּדַּכּ תְבַּלֶּש?*'
        options:
          - { text: מתי אתה רוצה להתחיל?, correct: true }
          - { text: מה המטרה שלך?, feedback: 'מה המטרה? = *שוּ הוּ אל־הַדף?*' }
          - { text: עם מי אתה מתחיל?, feedback: 'עם מי? = *מע מין?*' }
      - id: ma-min
        type: multipleChoice
        lang: he
        prompt: 'מה הפירוש של *מע מין?*'
        options:
          - { text: עם מי?, correct: true }
          - { text: מתי?, feedback: 'מתי = *וינתא*.' }
          - { text: מה?, feedback: 'מה = *שוּ*.' }
      - id: finish-april
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: "אני מסיים באפריל"?'
        options:
          - { text: אנא אַנְהִי פי שַׁהָר ארבַּעָה, correct: true }
          - { text: אנא אבלש פי שַׁהָר ארבַּעָה, feedback: '*אבלש* = מתחיל. מסיים = *אַנְהִי*.' }
          - { text: אנא אַנְהִי פי שַׁהָר ואחָד, feedback: 'שַׁהָר ואחָד = ינואר.' }
      - id: start-feb
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: "אני מתחיל בפברואר".'
        sentence: אנא אבלש פי שַׁהָר תנין
      - id: may
        type: trueFalse
        lang: he
        prompt: '*שַׁהָר ארבַּעָה* פירושו מאי.'
        answer: false
        feedback:
          correct: 'נכון! *שַׁהָר ארבַּעָה* = החודש הרביעי, אפריל.'
          incorrect: '*שַׁהָר ארבַּעָה* = החודש הרביעי, אפריל.'
