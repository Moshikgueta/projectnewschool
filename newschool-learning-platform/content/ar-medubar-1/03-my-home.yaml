          - { text: "שו פי בּעֻ'רְפֶת נומַכּ?", feedback: 'זו השאלה ״מה יש בחדר השינה שלך?״' }
          - { text: 'וין בתחֶבּ תקעד בל בית?', feedback: 'זו השאלה ״איפה אתה אוהב לשבת בבית?״' }
      - id: two-parts
        type: trueFalse
        lang: he
        prompt: 'בריאיון ״מה אתה עושה בבית?״ כל תשובה היא שני חלקים בלבד: פועל + חדר / מקום בבית.'
        answer: true
        feedback:
          correct: "נכון! למשל: בַּשְרַבּ בִּלְמַטְבַּח'."
          incorrect: 'התשובה היא שני חלקים בלבד: פועל + חדר. למשל: בַּקְרַא בִּסַּלון.'
