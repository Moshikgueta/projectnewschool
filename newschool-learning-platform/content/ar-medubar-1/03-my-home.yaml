activities:
  - slug: my-home-questions
    title: שאלות ותשובות על הבית
    minutes: 8
    items:
      - id: rooms
        type: matching
        lang: he
        prompt: התאימו כל מקום בבית לפירוש שלו.
        pairs:
          - ["מַטְבַּח'", 'מטבח']
          - ["עֻ'רְפֶת נוּם", 'חדר שינה']
          - ['חַמַּאם', 'חדר רחצה']
          - ["ג'נינֶה", 'גינה']
          - ['בּרנדה', 'מרפסת']
      - id: coffee
        type: multipleChoice
        lang: he
        prompt: "״וֵין בְּתִשְרַבּ ק'הְוֶה?״ – בחרו את התשובה המתאימה."
        options:
          - { text: "בַּשְרַבּ ק'הְוֶה בִּלְמַטְבַּח'.", correct: true }
          - { text: "בָּנָאם בִּעְ'רְפֶת נוּם.", feedback: 'זו תשובה לשאלה ״איפה אתה ישן?״' }
          - { text: 'בַּקְרַא בִּסַּלון.', feedback: 'זו תשובה לשאלה ״איפה אתה קורא?״' }
      - id: eat-meaning
        type: multipleChoice
        lang: he
        prompt: 'מה פירוש השאלה ״וֵין בְּתַאכּוֹל?״'
        options:
          - { text: 'איפה אתה אוכל?', correct: true }
          - { text: 'מה אתה אוכל?', feedback: '״מה״ זה שוּ. וֵין פירושו ״איפה״.' }
          - { text: 'איפה אתה ישן?', feedback: '״לישון״ זה בָּנָאם; בְּתַאכּוֹל – אתה אוכל.' }
      - id: sleep
        type: multipleChoice
        lang: he
        prompt: 'איך עונים על ״וֵין בְּתִנַאם?״'
        options:
          - { text: "בָּנָאם בִּעְ'רְפֶת נוּם.", correct: true }
          - { text: "בָּאכּוֹל בִּלְמַטְבַּח'.", feedback: 'זה ״אני אוכל במטבח״.' }
          - { text: 'בַּשּוּף תַלַפְזְיוֹן בִּל סלון.', feedback: 'זה ״אני רואה טלוויזיה בסלון״.' }
      - id: verbs
        type: matching
        lang: he
        prompt: התאימו כל פועל לפירוש שלו.
        pairs:
          - ['בַּשְרַבּ', 'לשתות']
          - ['בָּנָאם', 'לישון']
          - ['בַּקְרַא', 'לקרוא']
          - ['בַּשּוּף', 'לראות']
          - ['בַּרַתֶּבְּ', 'לסדר']
      - id: how-many-rooms
        type: multipleChoice
