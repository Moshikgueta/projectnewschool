activities:
  - slug: friendships-description
    title: משפטי תיאור ומילות קישור
    minutes: 8
    items:
      - id: match-adjectives
        type: matching
        lang: he
        prompt: התאימו כל תואר בערבית לתרגום שלו.
        pairs:
          - [לַטִיף, נחמד]
          - ["רַאיֶק'", רגוע]
          - ["מְודַ'חֶכּ", מצחיק]
          - [טְוִיל, גבוה]
          - ["עַס'בִּי", עצבני]
      - id: she-smart
        type: multipleChoice
        lang: he
        prompt: איך אומרים "היא חכמה"?
        options:
          - { text: הִיֵּ זְכִּיֶּה, correct: true }
          - { text: הִיֵּ זְכִּי, feedback: זְכִּי הוא לזכר. לנקבה אומרים זְכִּיֶּה. }
          - { text: הֻוֵ זְכִּיֶּה, feedback: הֻוֵ זה "הוא". "היא" זה הִיֵּ. }
      - id: tall-nervous
        type: multipleChoice
        lang: he
        prompt: איך אומרים "הוא גבוה ועצבני"?
        options:
          - { text: "הֻוֵ טְוִיל וּעס'בִּי", correct: true }
          - { text: "הִיֵּ טְוִיל וּעס'בִּי", feedback: הִיֵּ זה "היא". "הוא" זה הֻוֵ. }
          - { text: "הֻוֵ קס’יר וּעס'בִּי", feedback: קס’יר זה "נמוך". "גבוה" זה טְוִיל. }
      - id: then
        type: multipleChoice
        lang: he
        prompt: איזו מילה פירושה "ואז"?
        options:
          - { text: בַּעְדֵין, correct: true }
          - { text: כַּמַאן, feedback: כַּמַאן פירושה "גם". }
          - { text: וּ, feedback: וּ היא מילת החיבור (ו־). }
      - id: also
        type: multipleChoice
        lang: he
        prompt: איזו מילה פירושה "גם"?
        options:
          - { text: כַּמַאן, correct: true }
          - { text: בַּעְדֵין, feedback: בַּעְדֵין פירושה "ואז". }
          - { text: וּ, feedback: וּ היא מילת החיבור (ו־). }
      - id: shater
        type: trueFalse
        lang: he
        prompt: שַׁאטֶּר פירושו "עצבני".
        answer: false
        feedback:
          incorrect: 'שַׁאטֶּר פירושו "תותח". "עצבני" זה עַס''בִּי.'
      - id: rayek
        type: trueFalse
        lang: he
        prompt: 'רַאיֶק'' פירושו "רגוע".'
        answer: true
      - id: order-description
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: הוא גבוה ועצבני ולפעמים מצחיק.'
        sentence: "הֻוֵ טְוִיל וּעס'בִּי וּמַרַּאת מְודַ'חֶכּ"

  - slug: friendships-actions
    title: פעולות בהווה
    minutes: 8
    items:
      - id: match-verbs
        type: matching
        lang: he
        prompt: התאימו כל פועל לתרגום שלו.
        pairs:
          - [בִּישְרַבּ, שותה]
          - [בִּיקְרַא, קורא]
          - [בִּסְמַע, שומע]
          - [בִּשוּף, רואה]
          - [בִּטלַע, יוצא]
      - id: she-reads
        type: multipleChoice
        lang: he
        prompt: איך אומרים "היא קוראת ספר"?
        options:
          - { text: הִיֵּ בְּתִקְרַא כִּתֶאבּ, correct: true }
          - { text: הֻוֵ בִּיקְרַא כִּתֶאבּ, feedback: זה "הוא קורא ספר". }
          - { text: הִיֵּ בְּתִלְעַבּ כִּתֶאבּ, feedback: בְּתִלְעַבּ פירושו "משחקת". }
      - id: he-walks
        type: multipleChoice
        lang: he
        prompt: איך אומרים "הוא הולך הרבה"?
        options:
          - { text: הֻוֵ בִּימְשִי כְּתִיר, correct: true }
          - { text: הֻוֵ בִּישְרַבּ כְּתִיר, feedback: בִּישְרַבּ פירושו "שותה". }
          - { text: הֻוֵ בִּיקְרַא כְּתִיר, feedback: בִּיקְרַא פירושו "קורא". }
      - id: she-plays
        type: multipleChoice
        lang: he
        prompt: איך אומרים "היא משחקת כדורסל"?
        options:
          - { text: הִיֵּ בְּתִלְעַבּ כּורַת סַלֶּה, correct: true }
          - { text: הֻוֵ בִּילְעַבּ כּורַת סַלֶּה, feedback: הֻוֵ זה "הוא". "היא" זה הִיֵּ. }
          - {
              text: הִיֵּ בִּילְעַבּ כּורַת סַלֶּה,
              feedback: 'עם הִיֵּ הפועל מתחיל ב־בְּתִ, כמו בְּתִלְעַבּ.',
            }
      - id: we-drink
        type: trueFalse
        lang: he
        prompt: אַנַא וּס'אחְבִּי מְנִשְרַבּ קַהְוֶה פירושו "אני והחבר שלי שותים קפה".
        answer: true
      - id: then-sea
        type: trueFalse
        lang: he
        prompt: בַּעְדֵין מְנִמְשִי עַל־בַּחֵר פירושו "ואז אנחנו שותים קפה".
        answer: false
        feedback:
          incorrect: 'מְנִמְשִי פירושו "אנחנו הולכים": ואז אנחנו הולכים לים.'
      - id: order-basketball
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: הוא משחק כדורסל ואז שותה מיץ.'
        sentence: "הֻוֵ בִּילְעַבּ כּורַת אלסלֶּה וּבַּעְדֵין בִּישְרַבּ עס'יר"
      - id: order-morning
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: בבוקר אנחנו שותים קפה.'
        sentence: "אסַּ'ובֶּח מְנִשְרַבּ קַהְוֶה"
