# Cycle "Friendships", converted from the spoken Arabic level 1 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (spoken Arabic in Hebrew letters);
# Hebrew instructions carry `lang: he`.
course: ar-medubar-1
slug: friendships
title: "חברויות – ס'דאק'ה"
goal: לתאר חבר או חברה ולספר מה הם עושים בהווה, עם מילות קישור.
position: 5
status: in_review

review:
  - >-
    The two workbook exercises ("Describing a friend" and "Actions in the present")
    are NEW: the notebook has no self-study exercises. They were written only from this
    cycle's vocabulary, summary and examples. An Arabic teacher must check every right
    answer, every wrong option and every transliteration before students see them.
  - >-
    The notebook lists three skills (simple descriptions in the third person, actions in
    the present, linking words וּ / בַּעְדֵין / כַּמַאן). The cycle overview shows all
    three; the linking words are practised inside the "Describing a friend" exercise.
  - >-
    The exercises use two glosses that the notebook implies but never states: מְנִ… =
    "we …" (מְנִשְרַבּ קַהְוֶה = we drink coffee) and מַרַּאת = "sometimes" (in the summary
    example). Please confirm.
  - >-
    Typos fixed: the Arabic shadda sign on Hebrew letters (בִּיחִבּّ → בִּיחִבּ); doubled
    vowel signs (בשַַכֶּל → בשַכֶּל, בֶּדַַחֶ’כּ → בֶּדַחֶ’כּ); stray closing quotation marks after
    two examples; a missing opening bracket in warm-up question 3; "וְאַנַא מִא בק'רא"
    → "וְאַנַא מַא בק'רא" (Activity 5); the garbled emoji before Activity 6, step 1.
  - >-
    Vocabulary "ס'ְחאאבְּ – חברים" (Arabic اصحاب) looks garbled; it is written here as
    "אס'חאבּ". Please give the right transliteration.
  - >-
    Spelling variants kept as in the notebook (teacher's call): ס'אחֵב / סאחֵבי / צַאחְבִּי
    (Activity 2's title uses צ), אִסְמַו / אסמו, עֻמְרַהּא, כַּתִיר / כְּתִיר, אַחְלא / אַחְסַן
    ס'ֶפָה, מְנִתְלַק'י / מְנִלתק'י, עשרין / עֶשְׂרִין. In the Mira example the age is
    "טמנטאש" while cycle 4 has "תמנטאש" for 18; please check.
  - >-
    The four qualities in Activity 1 (אֶחְתֶראם, ס'ֶדֶק', עטאא, תַק'ַבּול) have no Hebrew
    translation in the notebook; none was added.
  - >-
    The teacher's sentence in Activity 6 ("מִכֻּל הַתַּאוּרִים — תִּבְחַרוּ אַלִּי בִּנְסַבּוּ…")
    mixes Hebrew niqqud spelling and Arabic; it is kept in the teacher note as written.
    The notebook calls step 2 of Activity 6 homework; it is kept in class with answer
    boxes, and the teacher may assign it as homework.
  - >-
    Removed: the Arabic-script duplicates in the vocabulary, the Arabic word "فراغ" in
    warm-up question 4, and the empty "תַארִיך / מֻשְׁתַרְכִּין" (date / participants) headings.
    The notebook has no Mori homework for this cycle, so there is no homework section.
  - >-
    Activity 3 asks for "4–5 sentences" in its title and "4 sentences" in its text; 4
    is used (the frame has four lines). Activity 4 time "5–7 minutes" → 7.
  - >-
    The "תשובת תלמיד" lines are replaced by the optional answer boxes. The Quizlet
    link's tracking parameter (?new) was removed.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: friendships-class
    title: 'שיעור: חברויות'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        lang: he
        text: "ס'דאק'ה – חברות"
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: משפטי תיאור
            description: 'משפטי תיאור פשוטים בגוף שלישי: הֻוֵ / הִיֵּ + תואר'
          - name: פעולות בהווה
            description: הֻוֵ בִּ… / הִיֵּ בְּתִ… + פעולה
          - name: מילות קישור
            description: וּ / בַּעְדֵין / כַּמַאן
      - id: quizlet
        type: externalLink
        lang: he
        label: חברויות בקוויזלט
        url: https://quizlet.com/br/1120172063/%D7%97%D7%91%D7%A8%D7%95%D7%99%D7%95%D7%AA-%D7%9E%D7%A2%D7%95%D7%93%D7%9B%D7%9F-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        lang: he
        text: סיבוב פתיחה
      - id: intro
        type: sentenceFrame
        frame: |-
          אִסְמִי ___.
          סאחֵבי / סאחְבְּתִי אִסְמַו / אִסְמַהּא ___.
          בַּעֶרְפו / בַּערֶפְהא מן ___ (סֶנֶה, סנתין, תַלַת סְנין…).
          וין סאכֶּן / ה؟ הו / הי מן ___.
        example: |-
          אִסְמִי מֻשִׁיק.
          סאחְבְּתִי אִסְמַהּא נעמה.
          בערֶפהא מן ח'מס סנין – הי מן רמת גן.
      - id: intro-words
        type: callout
        lang: he
        tone: tip
        title: שתי מילים לחבר
        text: "ס'דיק' – חבר / ידיד. סאחֶבּ – חבר."
      - id: warmup-title
        type: heading
        level: 3
        lang: he
        text: שאלות חימום
      - id: warmup
        type: discussionQuestions
        items:
          - question: "שו אֶסֶם ס'אחְבַּכְּ אל ק'ַריבְּ؟ ו קדֵיש עֻמְרוֹ / עֻמְרַהּא؟"
            frame: אסמו / אסמהא ___ ועומרו / ועומרהא ___.
          - question: "וֵין בְּתִשׁוּף (רואה) / בּתֶלְתְק'י (ניפגש) ב סאחְבַּכּ בשַכֶּל עאם (בדרך כלל)؟"
            frame: "אנא בשוף / בַּלְתְק'י בֶּ סאחבי / סאחבתי ___ (פי אלמטעם, פי אלשור'ול, פי אלמכתב, פי אל קהוֶה…)."
          - question: אֵימתא / וינתא אָחֵ’ר מַרָּה שׁוּפְתּוֹ / שופתהא؟ וין؟
            frame: "אח'ֶר מרּה שופתו / שופתהא ___ (אמבארח, ק'בֶּל יומין, ק'בל שהר, ק'בל שהרין…)."
          - question: "שׁוֹ בִּיחִבּ יִעְמֵל בִּוַּקְתְ’ אַל־פַרַאר'؟"
            frame: |-
              הוא ביחב ___ (יטלע משואר, יטבּוח' (יבשל), ימשי בלטביעה…).
              היא בֶּתְחֶבְּ ___.
          - question: "שו בֶּשְתְר'ֶל؟ שו בּתֶשְתְר'ֶל؟"
            frame: |-
              הוא בשתרֶ'ל ___ (מהנדס, מעלֶּם, מוחאמי, מודיר (מנהל)…).
              היא בתשתרֶ'ל ___.
          - question: "בִּיחִבּ יִמְשִי אַו יִורְכּוד'؟"
            frame: |-
              ביחב ___.
              בתחב ___.
          - question: "שׁוֹ אַחְלא ס'ֶפָה (תכונה) פיו / פיהא؟"
            frame: |-
              אַחְלָא ס'ֶפָה פיו הי ___ (יסאעֶד (אוהב לעזור), לטיף, שאטֶר בשור'לו (טוב בעבודתו)…).
              אחְלָא ס'ֶפָה פיהא הי ___ (לטיפֶה מע אלכול (נחמדה עם כולם), חנונֶה, זכּיֶּה…).
      - id: activities-title
        type: heading
        level: 3
        lang: he
        text: פעילויות
      - id: act1
        type: classActivity
        lang: he
        title: 'פעילות 1: התכונה הכי חשובה בחבר'
        skills: [משפטי תיאור]
        steps:
          - כל משתתף בוחר תכונה אחת שלדעתו היא החשובה ביותר בחבר.
          - "ענו על השאלה במשפט קצר: אֶח'תאר סֶפָה!"
        wordBank: [אֶחְתֶראם, "ס'ֶדֶק'", עטאא, "תַק'ַבּול"]
      - id: act1-question
        type: discussionQuestions
        items:
          - question: "שו אַהַם סֶפָה לאזֶם תכּון עֶנד אל ס'דיק'؟"
      - id: act2
        type: classActivity
        lang: he
        title: 'פעילות 2: צַאחְבִּי / צַאחְבְּתִי'
        skills: [משפטי תיאור, פעולות בהווה]
        steps:
          - עובדים בזוגות. כל אחד חושב על חבר או חברה.
          - שואלים אחד את השני את 7 השאלות, ועונים במשפט קצר.
          - משתמשים בתבנית התשובה ובדוגמאות.
          - כל זוג בוחר תשובה אחת ומציג אותה לכיתה במשפט קצר.
      - id: act2-questions
        type: discussionQuestions
        items:
          - question: מִין סאחְבַּכּ؟
            frame: סאחְבִּי אסמו ___.
          - question: "ק'דֵיש עֻמְרוֹ / עֻמְרַהּא؟"
            frame: עֻמְרוֹ ___ / עֻמְרַהּא ___.
          - question: "וֵין בְּתִשׁוּפוּ בַּעָד'؟"
            frame: "מְנִתְלַק'י בְּ ___."
          - question: 'כִּיף הֻוֵ / הִיֵּ؟ כיף שכּלו / שכּלהא؟ (שַכֶּל: "צורה", "מראֶה")'
            frame: "הֻוֵ / הִיֵּ ___ (טַוִיל / ק'ס’יר / אסְמַר (בעל צבע עור שחום) / ד'עיף (רזֶה))."
          - question: שׁוֹ בִּיחִבּ יִעְמֵל؟
            frame: בִּיחִבּ ___.
          - question: בִּיחִבּ יִמְשִי ולּא יֶסְבַּח؟
            frame: בִּיחִבּ ___.
          - question: "אַחְלא ס'ֶפָה פיו / פיהא؟"
            frame: "אַחְלא ס'ֶפָה ___."
      - id: act2-model
        type: sentenceFrame
        frame: "ס'אחְבִּי אִסְמַו ___. עֻמְרוֹ ___. מְנִלתק'י בְּ ___. הֻוֵ ___. בִּיחִבּ ___. אַחְלא ס'ֶפָה פיו ___."
      - id: act2-examples
        type: examples
        items:
          - text: "ס'אחְבִּי אִסְמַו סַמִיר. עֻמְרוֹ עֶשְׂרִין. מְנִלתק'י בִּקַּהְוֶה. הֻוֵ בֶּדַחֶ’כּ. בִּיחִבּ יִלְעַבּ פוטבול. אַחְלא ס'ֶפָה פיו אנו ג'דִּי (רציני)."
          - text: "סאחְבְּתִי מִירָא. עֻמְרַהּא טמנטאש. מְנִלתק'י בִּמֻול. הִיֵּ נַשִׁיטַה. בְּתִחִיבּ תִמְשִי. אַחְלא ס'ֶפָה פיהא אנהא חנונֶה (רחמנית)."
          - text: "הֻוֵ ס'אחֵב סַמִיר. בִּיחִבּ יִלְעַבּ פוטבול וּאַחְסַן ס'ֶפָה פיו אנו ג'דּי."
      - id: act3
        type: classActivity
        lang: he
        title: "פעילות 3: יוֹם ג'מיל מַעְ ס'אחְבִּי"
        skills: [פעולות בהווה, מילות קישור]
        steps:
          - כל משתתף כותב 4 משפטים על "יום מושלם" עם חבר קרוב, לפי התבנית.
          - קוראים את המשפטים לכיתה.
      - id: act3-frame
        type: sentenceFrame
        frame: |-
          אסַּובֶּח ___.
          בַּעְדֵין ___.
          בִּל־מַסַא ___.
          וּבַּאחֵ’ר אִלְיוֹם ___.
        example: |-
          אסַּ'ובֶּח מְנִשְרַבּ קַהְוֶה מע בעד' / סַוַא.
          בַּעְדֵין מְנִמְשִי עַל־בַּחֵר.
          בִּל־מַסַא מְנִשׁוּף פילֶם (סֶרֶט).
          וּבַּאחֵ’ר אִלְיוֹם מְנִתְעַשַׁא בִּל מַטְעַם.
      - id: act4
        type: classActivity
        lang: he
        title: 'פעילות 4: משפט בגוף שלישי על חבר / חברה'
        skills: [פעולות בהווה]
        minutes: 7
        steps:
          - המורה מציג את הפעלים. כל תלמיד מקבל שני פעלים וכותב שני משפטים בגוף שלישי.
          - כל תלמיד אומר משפט אחד על חבר או חברה שלו, בגוף שלישי.
        wordBank:
          - יִמְשִי
          - יִלְעַבּ
          - יִישְרַבּ
          - יִאכֻּול / יוכֶּל
          - יִקְרַא
          - יִסְמַע
          - יִשׁוּף
          - יִרְכַּבּ על בסכּלית (ירכב על האופניים)
          - יִשתַר’ל
      - id: act4-examples
        type: examples
        items:
          - text: הֻוֵ בִּישְרַבּ קַהְוֶה.
          - text: "ס'אחבתי לילא בתחיב תשרב ק'הוה מע סוכר."
          - text: הִיֵּ בְּתִלְעַבּ כּורַת סַלֶּה (כדורסל).
          - text: הֻוֵ בִּימְשִי כְּתִיר.
          - text: הִיֵּ בְּתִקְרַא כִּתֶאבּ.
      - id: act5
        type: classActivity
        lang: he
        title: 'פעילות 5: זַי וּמוּחְ’תַלֶף (זַי = מֶתֶל)'
        skills: [פעולות בהווה, מילות קישור]
        steps:
          - המורה נותן רשימת פעולות.
          - 'כל תלמיד ממיין: מה אני וחבר שלי עושים אותו דבר, ובמה אנחנו שונים.'
          - מציגים לכיתה, כמו בדוגמה.
        wordBank: [יִשְרַבּ קַהְוֶה, יִלְעַבּ פוטבול, יִקְרַא, "יִסְמַע מֻוסיק'א", יִשׁוּף פֶלֶם]
      - id: act5-table
        type: table
        header: ["זַי בַּעְד'", מוּחְ’תַלְפִין]
        rows:
          - [מְנִשְרַבּ קַהְוֶה, הֻוֵ בִּיקְרַא וְאַנַא לַא]
      - id: act5-example
        type: examples
        items:
          - text: "אַנַא וּס'אחְבִּי מְנִשְרַבּ קַהְוֶה כֻּל־יוֹם. בַּס הֻוֵ בִּיקְרַא כַּתִיר וְאַנַא מַא בק'רא כתיר."
      - id: act6
        type: classActivity
        lang: he
        title: 'פעילות 6: מַפַּת הַחֲבֵר / הַחֲבֵרָה שֶׁלִּי'
        skills: [משפטי תיאור]
        steps:
          - שלב 1 – המורה משתף מסך עם "מפת התארים" (הטבלה למטה) ומבקש לבחור את התארים שמתאימים לחבר או לחברה.
          - שלב 2 – כל תלמיד בוחר בדיוק 3 תכונות שמתארות חבר אמיתי או דמיוני.
      - id: act6-map
        type: table
        lang: he
        caption: מפת התארים
        header: [תואר, תעתיק]
        rows:
          - [נחמד, לטיף]
          - [מצחיק, "מְודַ'חֶכּ"]
          - [רגוע, "רַאיֶק'"]
          - [פעיל / חרוץ, נְשִׁיט]
          - [גבוה, טְוִיל]
          - [נמוך, קס’יר]
          - [חביב, חַבּוּב / חַבּוּבַּה]
          - [חכם, זְכִּי / זְכִּיֶּה]
          - [תותח, שַׁאטֶּר / שַׁאטְּרַה]
          - [עצבני, "עַס'בִּי / עַס'בּיֶּה"]
      - id: act6-choice
        type: discussionQuestions
        lang: he
        title: 3 התכונות של החבר / החברה שלי
        items:
          - question: תכונה 1
          - question: תכונה 2
          - question: תכונה 3
    teacherNotes:
      - id: n-plan
        anchor: null
        text: 'שלוש מיומנויות: משפטי תיאור פשוטים בגוף שלישי, תיאור פעולות בהווה, ומילות קישור (וּ / בַּעְדֵין / כַּמַאן).'
      - id: n-intro
        anchor: intro
        text: תנו תבנית מעט עשירה יותר מבמחזורים הקודמים. הדגימו קודם עם הדוגמה.
      - id: n-act2
        anchor: act2
        text: 'אמרו לתלמידים: "עכשיו עובדים בזוגות. כל אחד חושב על חבר או חברה. אתם שואלים אחד את השני את השאלות, ועונים במשפט קצר." בסוף: "כל זוג בוחר תשובה אחת ומציג אותה לכיתה במשפט קצר."'
      - id: n-act6
        anchor: act6
        text: 'המשפט של המורה במחברת: "מִכֻּל הַתַּאוּרִים — תִּבְחַרוּ אַלִּי בִּנְסַבּוּ לַס''אחְבּכּ / ס''אחְבְּתְכֹּו." במחברת שלב 2 הוא עבודת בית; אפשר לתת אותו כעבודת בית.'

