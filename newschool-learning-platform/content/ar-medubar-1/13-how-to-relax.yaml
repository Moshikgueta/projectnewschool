activities:
  - slug: how-to-relax-actions
    title: משפטי פעולה בהווה
    minutes: 8
    items:
      - id: drink-tea
        type: multipleChoice
        lang: he
        prompt: איך אומרים "אני שותה תה"?
        options:
          - text: אנא בַּשְׁרַב שאי
            correct: true
          - text: אנא שאי
            feedback: חסר הפועל. במשפט פעולה יש נושא + פועל + המשך המשפט.
          - text: אנא הו בַּשְׁרַב שאי
            feedback: לא מוסיפים "הו" (הוא) לפני הפועל. פשוט אומרים מי + מה עושה.
      - id: read-book
        type: multipleChoice
        lang: he
        prompt: איך אומרים "אני קורא ספר"?
        options:
          - text: אנא בַּק'רא כתאב
            correct: true
          - text: אנא בַּסְמַע כתאב
            feedback: בַּסְמַע פירושו "שומע". "קורא" הוא בַּק'רא.
          - text: אנא כתאב
            feedback: חסר הפועל בַּק'רא (קורא).
      - id: verbs
        type: matching
        lang: he
        prompt: התאימו כל פועל לפירוש שלו.
        pairs:
          - [בַּק'רא, קורא]
          - [בַּשְׁרַב, שותה]
          - [בֶּסְמַע, שומע / מקשיב]
          - [בוכּל, אוכל]
          - [ביחדר, צופה]
      - id: b-prefix
        type: trueFalse
        lang: he
        prompt: ברוב הפעלים בהווה בערבית מדוברת יש תחילית ב־ לפני הפועל, כמו בַּק'רא ובַּשְׁרַב.
        answer: true
        feedback:
          correct: נכון! ה־ב מסמנת פעולה שקורה עכשיו או בדרך כלל.
          incorrect: ברוב הפעלים בהווה יש תחילית ב־, למשל בַּק'רא (קורא) ובַּשְׁרַב (שותה).
      - id: no-yesh
        type: trueFalse
        lang: he
        prompt: כדי להגיד "אני קורא" בערבית מדוברת צריך להוסיף "יש" או "הוא" לפני הפועל.
        answer: false
        feedback:
          correct: נכון! זו טעות נפוצה. פשוט אומרים אנא בַּק'רא.
          incorrect: לא מוסיפים "יש" או "הוא" לפני הפועל. פשוט אומרים מי + מה עושה, אנא בַּק'רא.
      - id: listen-music
        type: multipleChoice
        lang: he
        prompt: השלימו את המשפט "אני שומע מוזיקה". אנא ___ מוסיקה
        options:
          - text: בַּסְמַע
            correct: true
          - text: בוכּל
            feedback: בוכּל פירושו "אוכל".
          - text: בַּשְׁרַב
            feedback: בַּשְׁרַב פירושו "שותה".
      - id: order-winter
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: "אתה שותה תה בחורף".'
        sentence: אנת בתשרב שאי פאלשיתא
      - id: order-film
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: "הם צופים בסרט כדי להירגע".'
        sentence: הנה ביתחדרו פילם עאשאן ירתאחו

  - slug: how-to-relax-describing
    title: משפטי תיאור בלי פועל
    minutes: 8
    items:
      - id: tea-hot
        type: multipleChoice
        lang: he
        prompt: איך אומרים "התה חם"?
        options:
          - text: אלשאי סאחֶ'ן
            correct: true
          - text: אלשאי הו סאחֶ'ן
            feedback: במשפט תיאור לא אומרים "הו" (הוא). פשוט נושא + תיאור.
          - text: אלשאי בארד
            feedback: בארד פירושו "קר".
      - id: chair-negative
        type: multipleChoice
        lang: he
        prompt: איך אומרים "הכיסא לא נוח"?
        options:
          - text: אלכורסי מש מריח
            correct: true
          - text: אלכורסי מריח
            feedback: זה אומר "הכיסא נוח". חסרה מילת השלילה מש.
          - text: מש אלכורסי מריח
            feedback: 'המבנה הוא נושא + מש + תיאור: אלכורסי מש מריח.'
      - id: feelings
        type: matching
        lang: he
        prompt: התאימו כל מילה לפירוש שלה.
        pairs:
          - [מרתאח, רגוע]
          - [מדר'וט, לחוץ]
          - [ג'ועאן, רעב]
          - [מבסוט, שמח]
          - [תעבאן, מותש]
      - id: no-to-be
        type: trueFalse
        lang: he
        prompt: במשפטי תיאור בהווה אין פועל "להיות". אומרים אלשאי סאחֶ'ן (התה חם).
        answer: true
        feedback:
          correct: נכון! נושא + תיאור, בלי "הוא" ובלי "להיות".
          incorrect: אין פועל "להיות" בהווה. המבנה הוא נושא + תיאור.
      - id: state-not-action
        type: trueFalse
        lang: he
        prompt: במשפט "אנא מרתאח" המילה מרתאח מתארת פעולה, כמו בַּק'רא.
        answer: false
        feedback:
          correct: נכון! מרתאח מתאר מצב (רגוע), לא פעולה.
          incorrect: מרתאח מתאר מצב (רגוע), לא פעולה. לכן אין לפניו תחילית ב־.
      - id: room-negative
        type: multipleChoice
        lang: he
        prompt: השלימו את המשפט "החדר לא מסודר". אלע'רפה ___ מרַתַבֶּה
        options:
          - text: מש
            correct: true
          - text: ליש
            feedback: ליש פירושו "למה". השלילה היא מש.
          - text: לאנו
            feedback: לאנו פירושו "כי". השלילה היא מש.
      - id: hungry
        type: multipleChoice
        lang: he
        prompt: איך אומרים "אני רעב"? אנא ___
        options:
          - text: ג'ועאן
            correct: true
          - text: מומֶּל
            feedback: מומֶּל פירושו "משעמם".
          - text: מבסוט
            feedback: מבסוט פירושו "שמח".
      - id: order-yoga
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: "אני רגוע אחרי יוגה".'
        sentence: אנא מרתאח בעד אליוגה
