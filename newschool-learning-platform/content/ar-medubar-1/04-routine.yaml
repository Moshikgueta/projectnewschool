activities:
  - slug: routine-numbers
    title: מספרים וימים
    minutes: 8
    items:
      - id: match-numbers
        type: matching
        lang: he
        prompt: התאימו כל מספר למילה בערבית.
        pairs:
          - ['3', תַלַאתֶה]
          - ['5', חַ’מְסֶה]
          - ['7', סַבְּעַה]
          - ['9', תִסְעַה]
          - ['10', עַשַרַה]
      - id: match-days
        type: matching
        lang: he
        prompt: התאימו כל יום בערבית ליום בעברית.
        pairs:
          - [יוֹם אֶלאחד, יום ראשון]
          - [יוֹם אתְנֵין, יום שני]
          - [יוֹם תַּלָאתָא, יום שלישי]
          - [יוֹם אל חַ’מִיס, יום חמישי]
          - [יוֹם אסַבְּת, יום שבת]
      - id: tuesday
        type: multipleChoice
        lang: he
        prompt: איך אומרים "יום שלישי"?
        options:
          - { text: יוֹם תַּלָאתָא, correct: true }
          - { text: יוֹם אתְנֵין, feedback: יוֹם אתְנֵין הוא יום שני. }
          - { text: יוֹם אַרְבַּעַא, feedback: יוֹם אַרְבַּעַא הוא יום רביעי. }
      - id: wake-eight
        type: multipleChoice
        lang: he
        prompt: איך אומרים "אני מתעורר בשעה שמונה"?
        options:
          - { text: אַנא בס'חא אסָּאעַה תְמַאנֶה, correct: true }
          - { text: אַנא בס'חא אסָּאעַה תִסְעַה, feedback: תִסְעַה זה תשע. }
          - { text: אַנא בס'חא אסָּאעַה סִתֶּה, feedback: סִתֶּה זה שש. }
      - id: seven
        type: multipleChoice
        lang: he
        prompt: איזה מספר זה סַבְּעַה?
        options:
          - { text: '7', correct: true }
          - { text: '6', feedback: 6 זה סִתֶּה. }
          - { text: '9', feedback: 9 זה תִסְעַה. }
      - id: eleven
        type: trueFalse
        lang: he
        prompt: חדאש זה המספר 11.
        answer: true
      - id: twenty
        type: trueFalse
        lang: he
        prompt: עשרין זה המספר 12.
        answer: false
        feedback:
          incorrect: עשרין זה 20. המספר 12 הוא טנאש.
      - id: order-tuesday
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ביום שלישי אני לומד.'
        sentence: יוֹם תַּלָאתָא אַנא בַּדְרֵוס
        alsoAccept: [אַנא בַּדְרֵוס יוֹם תַּלָאתָא]

  - slug: routine-verbs
    title: פעלים בהווה
    minutes: 8
    items:
      - id: ana
        type: multipleChoice
        lang: he
        prompt: 'השלימו: אַנא ___ (אני מתעורר).'
        options:
          - { text: בַּסחַא, correct: true }
          - { text: בִּסחַא, feedback: 'בִּ היא התחילית של "הוא".' }
          - { text: בְּתִסחַא, feedback: 'בְּתִ היא התחילית של "אתה" ושל "היא".' }
      - id: hu
        type: multipleChoice
        lang: he
        prompt: 'השלימו: הוּ ___ (הוא מתעורר).'
        options:
          - { text: בִּסחַא, correct: true }
          - { text: בַּסחַא, feedback: 'בַּ היא התחילית של "אני".' }
          - { text: בְּתִסחַא, feedback: 'בְּתִ היא התחילית של "אתה" ושל "היא".' }
      - id: hi
        type: multipleChoice
        lang: he
        prompt: 'השלימו: הִי ___ (היא מתעוררת).'
        options:
          - { text: בְּתִסחַא, correct: true }
          - { text: בִּסחַא, feedback: 'בִּ היא התחילית של "הוא".' }
          - { text: בַּסחַא, feedback: 'בַּ היא התחילית של "אני".' }
      - id: match-persons
        type: matching
        lang: he
        prompt: התאימו כל משפט לתרגום שלו.
        pairs:
          - [אַנא בַּסחַא, אני מתעורר]
          - [אִנְתַא בְּתִסחַא, אתה מתעורר]
          - [הוּ בִּסחַא, הוא מתעורר]
          - [הִי בְּתִסחַא, היא מתעוררת]
      - id: not-study
        type: multipleChoice
        lang: he
        prompt: איך אומרים "אני לא לומד"?
        options:
          - { text: מַא בַּדְרֵס, correct: true }
          - {
              text: מַא בְּתִדרוס,
              feedback: 'בְּתִ היא התחילית של "אתה" או "היא": זה "אתה לא לומד".',
            }
          - { text: בַּדְרֵוס, feedback: 'זה "אני לומד", בלי שלילה. לשלילה מוסיפים מַא.' }
      - id: negation
        type: trueFalse
        lang: he
        prompt: 'בשלילה בהווה שמים מַא לפני הפועל: מַא בַּדְרֵס.'
        answer: true
      - id: question
        type: trueFalse
        lang: he
        prompt: כדי לשאול שאלה בהווה, משנים את הפועל.
        answer: false
        feedback:
          incorrect: 'בשאלה הפועל נשאר אותו פועל, רק הטון עולה.'
      - id: order-six
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: היא מתעוררת בשעה שש.'
        sentence: הִי בְּתִס'חַא אסָּאעַה סִתֵּה
