vocabulary:
  - slug: essential-services
    title: שירותים חיוניים
    items: *essential-services-words
activities:
  - slug: essential-services-directions
    title: כיוונים
    minutes: 8
    items:
      - id: match-directions
        type: matching
        prompt: התאימו כל מילה לפירוש שלה.
        pairs:
          - - דֻע’רי
            - ישר
          - - יסאר
            - שמאל
          - - לִפּ
            - לפנות
          - - וָרא
            - מאחורה
          - - בַּעד
            - אחרי
        lang: he
      - id: straight
        type: multipleChoice
        prompt: איך אומרים "ישר"?
        options:
          - text: דֻע’רי
            correct: true
          - text: יסאר
            feedback: יסאר = שמאל.
          - text: לִפּ
            feedback: לִפּ = לפנות.
        lang: he
      - id: how-get
        type: multipleChoice
        prompt: איך שואלים "איך מגיעים ל…?"
        options:
          - text: כיף בּוֹוצַל לַ–…?
            correct: true
          - text: וֵין?
            feedback: וֵין? = איפה?
          - text: קריב וַלַّא בעיד?
            feedback: קריב וַלַّא בעיד? = קרוב או רחוק?
        lang: he
      - id: turn-right
        type: multipleChoice
        prompt: '"בטלע מן אלבֵּית, בליף ימין, ובמשי דֻע’רי." מה עושים מיד אחרי שיוצאים מהבית?'
        options:
          - text: פונים ימינה
            correct: true
          - text: פונים שמאלה
            feedback: 'בליף ימין: פונים ימינה (ימין), לא שמאלה (יסאר).'
          - text: הולכים אחורה
            feedback: 'בליף ימין: פונים ימינה.'
        lang: he
      - id: near
        type: trueFalse
        prompt: קריב פירושו "רחוק".
        answer: false
        feedback:
          correct: נכון! קריב = קרוב, בעיד = רחוק.
          incorrect: קריב = קרוב, ובעיד = רחוק.
        lang: he
      - id: recommend
        type: multipleChoice
        prompt: מה פירוש המשפט בִּנְס'חַכּ תְרוּח עַ–___?
        options:
          - text: אני ממליץ לך ללכת ל–___
            correct: true
          - text: איך מגיעים ל–___?
            feedback: '"איך מגיעים" זה כיף בּוֹוסל לַ–___? (אַנְס''ח = להמליץ).'
          - text: איזה ___ אתה ממליץ לי?
            feedback: זו השאלה אַיַּ ___ בתנְס'חְנִי?
        lang: he
      - id: match-places
        type: matching
        prompt: התאימו כל מקום לפירוש שלו.
        pairs:
          - - שארֶע
            - רחוב
          - - זָאוִיֵּה
            - פינה
          - - מַכְּתַבֶּה
            - ספרייה
