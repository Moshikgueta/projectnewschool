activities:
  - slug: food-biddi
    title: '"אני רוצה" – בִּדִּי + פועל'
    minutes: 8
    items:
      - id: want-water
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: "אני רוצה לשתות מים"?'
        options:
          - { text: אָנַא בִּדִּי אַשְרַבּ מַיּ, correct: true }
          - text: אָנַא בִּדִּי אַכֻּל מַיּ
            feedback: '*אַכֻּל* = לאכול. לשתות = *אַשְרַבּ*.'
          - text: אָנַא בַּחֵבּ אַשְרַבּ מַיּ
            feedback: '*בַּחֵבּ* = אני אוהב. אני רוצה = *בִּדִּי*.'
      - id: falafel
        type: multipleChoice
        lang: he
        prompt: 'מה הפירוש של: *אַנַא בִּדִּי אוכֶּל פַלָאפֵל*?'
        options:
          - { text: אני רוצה לאכול פלאפל, correct: true }
          - { text: אני אוהב פלאפל, feedback: 'אוהב = *בַּחֵבּ*. כאן יש *בִּדִּי* = אני רוצה.' }
          - { text: אני רוצה לשתות פלאפל, feedback: '*אוכֶּל* = לאכול. לשתות = *אַשְרַבּ*.' }
      - id: waiter
        type: multipleChoice
        lang: he
        prompt: 'המלצר שואל את הלקוח: "אתה רוצה לשתות תה?" מה הוא אומר?'
        options:
          - { text: בִּדַּכּ תִשְרַבּ שַאי?, correct: true }
          - text: בִּדִּי אַשְרַבּ שַאי.
            feedback: '*בִּדִּי אַשְרַבּ* = אני רוצה לשתות. המלצר פונה ללקוח בגוף שני: *בִּדַּכּ תִשְרַבּ*.'
          - text: בִּדּוֹ יַאכֻּל שַאי?
            feedback: '*בִּדּוֹ* = הוא רוצה, ו*יַאכֻּל* = לאכול.'
      - id: mother
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: "אמא שלי רוצה לאכול מעכרונה"?'
        options:
          - { text: אִמִי בִּדְּהָא תָאכֻּל מַעַכְּרוֹנֵה, correct: true }
          - text: אִמִי בִּדּוֹ יַאכֻּל מַעַכְּרוֹנֵה
            feedback: '*בִּדּוֹ יַאכֻּל* הוא לזכר (אַבּוּי בִּדּוֹ...). לאמא: *בִּדְּהָא תָאכֻּל*.'
          - text: אִמִי בִּדִּי אַכֻּל מַעַכְּרוֹנֵה
            feedback: '*בִּדִּי אַכֻּל* = אני רוצה לאכול.'
      - id: who-wants
        type: matching
        lang: he
        prompt: התאימו כל מילה לפירוש שלה.
        pairs:
          - [בִּדִּי, אני רוצה]
          - [בִּדַּכּ, אתה רוצה]
          - [בִּדּוֹ, הוא רוצה]
          - [בִּדְּהָא, היא רוצה]
      - id: no-infinitive
        type: trueFalse
        lang: he
        prompt: 'בערבית מדוברת אין צורת מקור. "אני רוצה לאכול" = *בִּדִּי אַכֻּל* (בִּדִּי + הפועל בגוף ראשון).'
        answer: true
        feedback:
          correct: נכון! בִּדִּי + אַשְרַבּ / אַכֻּל = "אני רוצה ל...".
          incorrect: 'זה נכון: אין מקור, ומשתמשים בפועל בגוף ראשון: *בִּדִּי אַכֻּל*.'
      - id: market-order
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: "אני רוצה קילו עגבניות וחצי קילו מלפפונים".'
        sentence: "בִּדִּי כִּילו בַּנְדוֹרַה וּנֻס כִּילו חִ'יָאר"
      - id: father
        type: multipleChoice
        lang: he
        prompt: 'מה הפירוש של: *אַבּוּי בִּדּוֹ יַאכֻּל סּאנדויש חומוס*?'
        options:
          - { text: "אבא שלי רוצה לאכול סנדוויץ' חומוס", correct: true }
          - text: "אני רוצה לאכול סנדוויץ' חומוס"
            feedback: 'אני רוצה = *בִּדִּי*. כאן: *אַבּוּי בִּדּוֹ* = אבא שלי רוצה.'
          - text: "אבא שלי מכין סנדוויץ' חומוס"
            feedback: '*בִּדּוֹ יַאכֻּל* = הוא רוצה לאכול.'

  - slug: food-greetings
    title: ברכות במסעדה
    minutes: 8
    items:
      - id: replies
        type: matching
        lang: he
        prompt: התאימו כל ברכה לתשובה שלה.
        pairs:
          - [יְסַלּמוּ אִידֵכּ, וְאִידֵכּ]
          - [יַעְטִיכּ אִלְעָאפְיֶה, אַללָּה יְעַאפִֿיכּ]
          - [סַחַּה וּהַנָּא, עַלַא קַלְבַּכּ]
          - [לַו סַמַחְת, תְפַדַּל]
      - id: meanings
        type: matching
        lang: he
        prompt: התאימו כל ביטוי לפירוש שלו.
        pairs:
          - [יַעְטִיכּ אִלְעָאפְיֶה, ישר כוח]
          - [יְסַלּמוּ אִידֵכּ, יבורכו ידיך]
          - [סַחַּה וּהַנָּא, בתיאבון]
          - [לַו סַמַחְת, בבקשה / סליחה]
          - [מֻמְכֵּן?, אפשר?]
      - id: bon-appetit
        type: multipleChoice
        lang: he
        prompt: 'המלצר מגיש את האוכל ואומר "בתיאבון". מה הוא אומר?'
        options:
          - { text: סַחַּה וּהַנָּא, correct: true }
          - { text: יְסַלּמוּ אִידֵכּ, feedback: 'זה "יבורכו ידיך" – אומרים למי שהכין או הגיש.' }
          - { text: לַו סַמַחְת, feedback: 'זה "בבקשה / סליחה" – כשפונים למישהו.' }
      - id: reply-appetit
        type: multipleChoice
        lang: he
        prompt: 'אומרים לכם *סַחַּה וּהַנָּא*. מה עונים?'
        options:
          - { text: עַלַא קַלְבַּכּ, correct: true }
          - { text: וְאִידֵכּ, feedback: 'עונים *וְאִידֵכּ* ל*יְסַלּמוּ אִידֵכּ*.' }
          - {
              text: אַללָּה יְעַאפִֿיכּ,
              feedback: 'עונים *אַללָּה יְעַאפִֿיכּ* ל*יַעְטִיכּ אִלְעָאפְיֶה*.',
            }
      - id: thank-chef
        type: multipleChoice
        lang: he
        prompt: 'הטבח הכין לכם אוכל טעים. איך אומרים לו "יבורכו ידיך"?'
        options:
          - { text: יְסַלּמוּ אִידֵכּ, correct: true }
          - { text: עַלַא קַלְבַּכּ, feedback: 'זו התשובה ל*סַחַּה וּהַנָּא*.' }
          - { text: תְפַדַּל, feedback: '*תְפַדַּל* = בבקשה (כשנותנים משהו).' }
      - id: tfaddal
        type: trueFalse
        lang: he
        prompt: '*תְפַדַּל* פירושו "בבקשה".'
        answer: true
        feedback:
          correct: 'נכון! למשל, המוכר אומר: *תְפַדַּל, הַאדָא בְּ... שֵקֶל*.'
      - id: may-i
        type: multipleChoice
        lang: he
        prompt: 'איך שואלים "אפשר?"'
        options:
          - { text: מֻמְכֵּן?, correct: true }
          - { text: וְאִידֵכּ, feedback: '*וְאִידֵכּ* = גם ידיך (תשובה ל*יְסַלּמוּ אִידֵכּ*).' }
          - { text: עַלַא קַלְבַּכּ, feedback: 'זו התשובה ל*סַחַּה וּהַנָּא*.' }
      - id: wrong-reply
        type: trueFalse
