# Cycle "אוכל – אִלְאַכֵּל", converted from the spoken Arabic level 1 notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (spoken Arabic in Hebrew
# transliteration); Hebrew instructions carry `lang: he`.
course: ar-medubar-1
slug: food
title: אוכל – אִלְאַכֵּל
goal: להגיד מה אני רוצה לאכול ולשתות עם בִּדִּי + פועל, ולהשתמש בברכות של מסעדה.
position: 10
status: in_review

review:
  - >-
    The two workbook exercises ("בִּדִּי + verb" and "Restaurant greetings") are NEW:
    the notebook has no self-correcting exercises. They were written only from this
    cycle's activities, summary and vocabulary. An Arabic teacher must check every
    right answer, every wrong option and every transliteration before students see
    them.
  - >-
    The notebook lists three skills (בִּדִּי + verb, simple food questions and answers,
    restaurant greetings). The cycle overview keeps all three; the two exercises cover
    בִּדִּי + verb and the greetings.
  - >-
    The notebook says to choose 2 of 3 main activities, but it has 4 activities
    (Activity 4, the market, was added later). The teacher note says "2 of the 4".
    Please confirm.
  - >-
    The introduction note says to add "עֻמְרִי…" only for a strong class, but the frame
    already contains "עומְרִי ___ סַנֵה". The line is kept in the frame; the teacher
    note says it is optional.
  - >-
    Small fixes: "סִֶעְר" (two vowels on one letter) → "סִעְר"; "ו וין" → "ווין"; the
    double full stop after "בִּדִּי לֵימוֹן" removed; the market activity's stages
    jump from 3/4 to 6, renumbered as stage 5; the Arabic shadda written on Hebrew
    letters ("מַיّ") is written with a Hebrew dagesh ("מַיּ"); Arabic-script words
    in the vocabulary were left out (terms are in transliteration only); the
    Quizlet "?new" parameter was removed.
  - >-
    Dialect / spelling doubts, NOT changed (teacher's call): the warm-up frame
    "בִּחֶבְּ אוכֶּל" (elsewhere "בַּחֵבּ", 1st person); "I eat" is written both
    "אַכֻּל" and "אוכֶּל"; "I add" is written "בַּדִיף", "בַּדִּיף" and "בַּדִ'יף"
    (ض); "מִין בֻּוכֵּל" (Activity 3 title); "פִיה אַחַ׳אנִי?" in the market dialogue
    (meaning unclear: "anything else?"); "הַאדִי רִשֶׁת אִלְקַנַא" (shopping list);
    "אַסְלָאם עַלֵכֻּם"; "קַהְוֶה" (homework) vs "ק'הְוֶה" (vocabulary); the spellings
    "ח'יָאר / חִ'יָאר / חְ'יָאר" are kept as each place has them.
  - >-
    Vocabulary: the row "دكانة – סופר / מכולת" has no transliteration in the notebook;
    it is written here as "דֻכַּאנֶה" (NEW transliteration, please check). The words
    "ח'ובֶּז – לחם" appeared twice; kept once. The fruit/vegetable and quantity words
    of Activity 4 were added to the vocabulary list. "אני אוכֶל" (verb) and
    "אַכְּלֶה / אַכֶּל" (noun) are kept as two rows.
  - >-
    The homework ("שיעורי בית") is a written worksheet, not Mori messages. It is kept
    as answer boxes; a line tells the student to send the answers to Mori for
    correction. The greeting-matching task (task 5) also appears as a self-correcting
    exercise in the workbook.
  - >-
    The "תשובות תלמידים 1-3" lines are replaced by the optional answer boxes; time
    ranges are rounded up.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: food-class
    title: 'שיעור: אוכל'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        lang: he
        text: אוכל – אִלְאַכֵּל
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: '"אני רוצה" – בִּדִּי + פועל'
            description: בִּדִּי אַכֻּל, בִּדִּי אַשְרַבּ, בִּדִּי אַטְלֻבּ
          - name: שאלות ותשובות על אוכל ושתייה
            description: מה אוהבים לאכול, מה מזמינים במסעדה
          - name: ברכות במסעדה
            description: יַעְטִיכּ אִלְעָאפְיֶה, יְסַלּמוּ אִידֵכּ, סַחַּה וּהַנָּא, לַו סַמַחְת
      - id: quizlet
        type: externalLink
        lang: he
        label: אוכל בקוויזלט
        url: https://quizlet.com/br/1122963562/%D7%90%D7%95%D7%9B%D7%9C-%D7%9E%D7%A2%D7%95%D7%93%D7%9B%D7%9F-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        lang: he
        text: תעָארֻף – סבב פתיחה
      - id: intro
        type: sentenceFrame
        frame: |-
          אִסְמִי ___.
          עומְרִי ___ סַנֵה.
          אַנַא סָאכֵּן / סָאכְּנֶה פִי ___.
          בַּחֵבּ אַכֻּל ___.
        example: |-
          אִסְמִי אינאס.
          עֻמְרִי סֶתֶּה ותלאתין סַנֵה.
          אַנַא סָאכְּנֶה פִי עין מאהל.
          בַּחֵבּ אַכֻּל משָׁאוִי.
      - id: warmup-title
        type: heading
        level: 3
        lang: he
        text: אסא'לה – שאלות חימום
      - id: warmup
        type: discussionQuestions
        items:
          - question: שוּ בִּתְחֶבְּ תוכֶּל על ר'דָא?
            frame: |-
              בִּחֶבְּ אוכֶּל ___.
              (מַעַכְּרוֹנֵה, סאנדויש טונה, שוֹרַבַּה, כַּעְכֶּה, סלטָה...)
          - question: שו בֶּתְפַדֶּ'ל, אלאַכֶּל אלאמאלֶח או אלחלו? מע אַמְתֶלֶה!
          - question: שו בּתֶח'תאר אַכֶּל, עַרַבִּי, איטָאלי או אַסּיָוי? וליש?
          - question: בֶּשַׁכֶּל עאם, שו בתוטְלובְּ בֶּל מַטְעָם? אַיְ וַגְ'בֶּה?
          - question: שו אַזְכָּא אַכְּלֶה אַכַּלֶתְהא? ווין?
          - question: פי אַכֶּל מא בֶּתְחֶבּו?
            frame: אֶד'א אה.. שו הו? ___
      - id: activities-title
        type: heading
        level: 3
        lang: he
        text: פעילויות
      - id: act1
        type: classActivity
        lang: he
        title: 'פעילות 1: מַטְעַם פִי אִסּֿף (מסעדה בכיתה)'
        skills: ['"אני רוצה" – בִּדִּי + פועל', ברכות במסעדה]
        minutes: 20
        steps:
          - "מחלקים תפקידים: **נאדֶל** (מלצר), **טַבַּאח'** (טבח) ו**זְבּון** (לקוח)."
          - 'שלב ההזמנה: הלקוח מזמין לפי התבנית שלמטה.'
          - 'המלצר חוזר על ההזמנה בגוף שני ושואל: *מֻמְכֵּן תְעִיד?*'
          - 'הטבח "מכין" ומסביר (אפשר בעברית, עם מילת מפתח בערבית): *בַּבַשֵל פַּטַאטַא, בַּדִּיף זַעְתַר...*'
          - 'מעגל ברכות: כל אחד משתמש בברכה אחת מבנק המילים.'
        wordBank:
          - יַעְטִיכּ אִלְעָאפְיֶה
          - יְסַלּמוּ אִידֵכּ
          - תְפַדַּל
          - לַו סַמַחְת
          - סַחַּה וּהַנָּא
      - id: act1-customer
        type: sentenceFrame
        prompt: זְבּון
        frame: |-
          בִּדִּי אַטְלֻבּ ___.
          בִּדִּי אַכֻּל ___.
          בִּדִּי אַשְרַבּ ___.
      - id: act1-waiter
        type: sentenceFrame
        prompt: נאדֶל
        frame: |-
          בִּדַּכּ תֻטְלֻבּ ___?
          בִּדַּכּ תִשְרַבּ ___?
          מֻמְכֵּן תְעִיד?
        answerable: false
      - id: act2
        type: classActivity
        lang: he
        title: "פעילות 2: סּאנדוישי (הסנדוויץ' שלי)"
        skills: ['"אני רוצה" – בִּדִּי + פועל']
        minutes: 20
        steps:
          - "כל תלמיד בוחר סנדוויץ' שהוא אוהב."
          - "ממלאים את התבנית: שם הסנדוויץ' ושלושה מרכיבים."
          - 'מסבירים איך מכינים אותו, עם הפעלים בגוף ראשון: *בַּקַטֵּע, בַּדַּהִן, בַּדִיף, בַּסַכֵּר*.'
        wordBank:
          - חֻ'בֵּז
          - בַּנְדוֹרַה
          - חִ'יָאר
          - חַ'ס
          - חומוס
          - זִבְּדֶה
          - טַחִינֵה
          - חִ'יָאר מַכְּבּוּס
          - פִלְפֵל אַחְמַר
          - שַטַּה
      - id: act2-sandwich
        type: discussionQuestions
        title: הַאדָא סּאנדוישִי אִלְמֻפַדַּל
        items:
          - question: 'אִסֶם אִלְסּאנדויש: ___'
          - question: 'מֻכַּוִּנַאת אִלְסּאנדויש: 1) ___ 2) ___ 3) ___'
          - question: |-
              בַּקַטֵּע ___.
              בַּדַּהִן ___.
              בַּדִיף ___.
              בַּסַכֵּר אִלְסּאנדויש.
              סַחַּה וְהַנָּא!
      - id: act3
        type: classActivity
        lang: he
        title: 'פעילות 3: מִין בֻּוכֵּל וּשוּ? (מי אוכל מה)'
        skills: ['"אני רוצה" – בִּדִּי + פועל']
        minutes: 15
        steps:
          - 'כל תלמיד כותב לעצמו 3 אנשים: *אִמִי, אַבּוּי, סַאחְבִּי, סַאחְבְּתִי...*'
          - כותבים מה כל אחד רוצה לאכול ולשתות, לפי הדוגמה.
          - 'סבב: כל תלמיד מקריא 2–3 משפטים.'
      - id: act3-example
        type: examples
        items:
          - text: אִמִי בִּדְּהָא תָאכֻּל מַעַכְּרוֹנֵה וּתִשְרַבּ שַאי.
            gloss: אמא שלי רוצה לאכול מעכרונה ולשתות תה.
          - text: אַבּוּי בִּדּוֹ יַאכֻּל סּאנדויש חומוס.
            gloss: אבא שלי רוצה לאכול סנדוויץ' חומוס.
          - text: אַנַא בִּדִּי אוכֶּל פַלָאפֵל.
            gloss: אני רוצה לאכול פלאפל.
      - id: act3-sentences
        type: discussionQuestions
        items:
          - question: ___ בִּדּוֹ / בִּדְּהָא ___.
          - question: ___ בִּדּוֹ / בִּדְּהָא ___.
          - question: אַנַא בִּדִּי ___.
      - id: act4
        type: classActivity
        lang: he
        title: 'פעילות 4: בִּשּׁוּק (בשוק)'
        skills: ['"אני רוצה" – בִּדִּי + פועל', שאלות ותשובות על אוכל ושתייה]
        minutes: 20
        steps:
          - 'חוזרים על המילים: פירות, ירקות וכמויות (קילו / חצי קילו).'
          - 'עובדים בזוגות: אחד **בַּיָּאע** (מוכר), אחד **זְבּוּן** (לקוח). אחרי 2 דקות מחליפים.'
          - 'מקימים בכיתה "דוכנים": דוכן פירות, דוכן ירקות, דוכן לימונדה, דוכן זיתים.'
          - קונים ומוכרים לפי התבניות והדוגמה.
          - 'רשימת הקניות שלי: כל תלמיד כותב 3 דברים ואומר אותם בקול.'
      - id: act4-words
        type: vocabulary
        glossLang: he
        items:
          - { term: בַּנְדוֹרַה, gloss: עגבנייה }
          - { term: "ח'יָאר", gloss: מלפפון }
          - { term: בַּטַאטַא, gloss: תפוח אדמה }
          - { term: "בִּסָ'ל", gloss: בצל }
          - { term: "חַ'ס", gloss: חסה }
          - { term: תופַאח, gloss: תפוח }
          - { term: מוז, gloss: בננה }
          - { term: לֵימוֹן, gloss: לימון }
          - { term: פִלְפֵל אַחְמַר, gloss: פלפל אדום }
          - { term: זַיִיתוּן, gloss: זיתים }
          - { term: נֻס כִּילו, gloss: חצי קילו }
          - { term: כִּילו, gloss: קילו }
      - id: act4-customer
        type: sentenceFrame
        prompt: זְבּוּן
        frame: |-
          בִּדִּי ___.
          שו סִעְר הַאדָא?
          נֻס כִּילו / כִּילו
        answerable: false
      - id: act4-seller
        type: sentenceFrame
        prompt: בַּיָּאע
        frame: |-
          תְפַדַּל / תְפַדַּלִי.
          הַאדָא בְּ___ שֵקֶל.
        answerable: false
      - id: act4-dialogue
        type: dialogue
        lines:
          - speaker: זְבּוּן
            text: אַסְלָאם עַלֵכֻּם. בִּדִּי כִּילו בַּנְדוֹרַה וּנֻס כִּילו חִ'יָאר.
          - speaker: בַּיָּאע
            text: תְפַדַּלִי. הַאדָא בְּחַ׳מְסַה שֵקֶל. פִיה אַחַ׳אנִי?
          - speaker: זְבּוּן
            text: אַיְוַה, בִּדִּי לֵימוֹן.
      - id: act4-list
        type: sentenceFrame
        prompt: רשימת הקניות שלי
        frame: 'הַאדִי רִשֶׁת אִלְקַנַא: בִּדִּי כִּילו ___, וּבִּדִּי ___, וּנֻס כִּילו ___.'
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          בוחרים לפי מצב הכיתה 2 פעילויות עיקריות מתוך 4. מומלץ: פעילות 1 + פעילות 2
          בשיעור הראשון; פעילות 3 או 4 לשיעור המשך או לחיזוק.
      - id: n-intro
        anchor: intro
        minutes: 10
        text: >-
          מטרה: היכרות וחיבור לנושא האוכל בתבנית ברורה. המורה מדגים לאט, ואז כל תלמיד
          עונה באותה תבנית. השורה "עומְרִי..." – רק אם הכיתה חזקה.
      - id: n-warmup
        anchor: warmup
        minutes: 20
        text: שואלים כל תלמיד לפחות שתי שאלות. התשובות שהתלמידים מקלידים מופיעות כאן מתחת לכל שאלה.
      - id: n-act1
        anchor: act1
        text: >-
          סימולציה של שיחה בין לקוח, מלצר וטבח. המלצר חוזר על ההזמנה בגוף שני
          (בִּדַּכּ...). בסוף, מעגל ברכות שירות עם בנק המילים.
      - id: n-act3
        anchor: act3
        text: פעילות לחיזוק בִּדִּי עם אנשים שונים (בִּדּוֹ, בִּדְּהָא) ואוצר מילים של אוכל.
      - id: n-act4
        anchor: act4
        text: >-
          מטרות: בִּדִּי, פירות וירקות, כמויות בסיסיות (קילו / חצי קילו), שאלות ותשובות
          קצרות וסימולציה של שוק אמיתי. המורה מחלק תפקידים.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: food-summary
    title: סיכום השיעור
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        lang: he
        text: מה למדנו היום
      - id: rules-want
        type: ruleSummary
        lang: he
        skill: '"אני רוצה" בערבית'
        rules:
          - text: 'ביטוי מפתח: **אָנַא בִּדִּי** – אני רוצה.'
          - text: >-
              בערבית מדוברת **אין צורת מקור** ("לשתות", "לאכול"). במקום המקור משתמשים
              בצורת הפועל בגוף ראשון:
            examples:
              - אַשְרַבּ – אני שותה / לשתות
              - אַכֻּל – אני אוכל / לאכול
          - text: 'בעברית: אני רוצה לשתות מים. בערבית:'
            examples:
              - אָנַא בִּדִּי אַשְרַבּ מַיּ.
          - text: 'בִּדִּי + אַשְרַבּ / אַכֻּל / אַרֻוח = "אני רוצה ל..."'
      - id: greetings
        type: table
        lang: he
        caption: ברכות – מינימום הכרחי
        header: [ברכה, משמעות, תשובה]
        rows:
          - [יַעְטִיכּ אִלְעָאפְיֶה, שיתן לך בריאות (ישר כוח), אַללָּה יְעַאפִֿיכּ]
          - [יְסַלּמוּ אִידֵכּ, יבורכו ידיך, וְאִידֵכּ (גם ידיך)]
          - [סַחַּה וּהַנָּא, בתיאבון, עַלַא קַלְבַּכּ]
          - [לַו סַמַחְת, בבקשה / סליחה, תְפַדַּל (בבקשה)]
          - [מֻמְכֵּן / בִּנְפַע?, אפשר?, 'אַיְוַה, מֻמְכֵּן / בִּנְפַע']
      - id: one-line
        type: callout
        tone: info
        lang: he
        title: סיכום בשורה אחת
        text: >-
          היום למדנו לדבר על אוכל: מה אנחנו רוצים לאכול ולשתות, איך מזמינים במסעדה,
          ואיך אומרים "אני רוצה" בערבית בצורה פשוטה וברורה.
    teacherNotes:
      - id: n-summary
        anchor: null
        minutes: 15
        text: עוברים עם הכיתה על שתי המיומנויות ומבקשים דוגמה חדשה לכל כלל ולכל ברכה.

