        type: examples
        items:
          - text: אַנָא רַאיֵחּ עַ(לַ)מַדְרַסֵהּ
            gloss: אני הולך לבית הספר
          - text: הֻוֵּ גַ'אי עַ(לַ)דַּרְס
            gloss: הוא בא לשיעור
          - text: אַ(ל)טֻּלַּאבּ טָאלֵעִין מִן א(ל)סַֿףּ
            gloss: התלמידים יוצאים מהכיתה
          - text: אַנָא סַאמֵעּ א(ל)-רִיַאח
            gloss: אני שומע את הרוח
