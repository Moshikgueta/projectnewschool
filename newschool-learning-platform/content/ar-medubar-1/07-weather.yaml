activities:
  - slug: weather-words
    title: מזג האוויר
    minutes: 8
    items:
      - id: match-weather
        type: matching
        lang: he
        prompt: התאימו כל מילה למשמעות שלה.
        pairs:
          - - חַאר
            - חם
          - - בָּארֵד
            - קר
          - - מֻמְטִר
            - גשום
          - - מֻשְׁמִס
            - שמשי
          - - מֻעְ'יֵּם
            - מעונן
      - id: atta2s
        type: multipleChoice
        lang: he
        prompt: איך אומרים "מזג האוויר"?
        options:
          - text: אִטַּקְס
            correct: true
          - text: רִיח
            feedback: רִיח = רוח.
          - text: דַרַגֶ'ת חַרַארַה
            feedback: דַרַגֶ'ת חַרַארַה = טמפרטורה.
      - id: cold-today
        type: multipleChoice
        lang: he
        prompt: 'השלימו: אִטַּקְס אִלְיום ___ (היום קר).'
        options:
          - text: בָּארֵד
            correct: true
          - text: חַאר
            feedback: חַאר = חם.
          - text: מֻשְׁמִס
            feedback: מֻשְׁמִס = שמשי.
      - id: im-cold
        type: multipleChoice
        lang: he
        prompt: דני אומר "קר לי". מה הוא אומר בערבית?
        options:
          - text: אַנָא בַּרְדָאן
            correct: true
          - text: אַנָא בָּארֵד
            feedback: בָּארֵד מתאר את מזג האוויר. על אדם אומרים בַּרְדָאן ("אני קר").
          - text: אַנָא בַּרְדָאנֶה
            feedback: בַּרְדָאנֶה היא צורת הנקבה. דני הוא זכר.
      - id: range
        type: multipleChoice
        lang: he
        prompt: "השלימו: דַרַגֶ'ת אִלְחרָארַה ___ תִסְעַה לַ אַרְבּעטַאש."
        options:
          - text: בִּין
            correct: true
          - text: כִּיף
            feedback: כִּיף = איך. לטווח טמפרטורות אומרים בִּין ___ לַ ___.
          - text: פִי
            feedback: לטווח טמפרטורות אומרים בִּין ___ לַ ___.
      - id: range-rule
        type: trueFalse
        lang: he
        prompt: 'כדי לתאר טווח טמפרטורות אומרים: בִּין ___ לַ ___.'
        answer: true
        feedback:
          correct: 'נכון! למשל: בִּין תִסְעַה לַ אַרְבּעטַאש.'
          incorrect: המבנה הוא בִּין ___ לַ ___ (בין … עד …).
      - id: ask-weather
        type: multipleChoice
        lang: he
        prompt: איך שואלים "איך מזג האוויר היום בחיפה?"
        options:
          - text: כִּיף אִטַּקְס אִלְיום בְּחֵיפָה؟
            correct: true
          - text: וֵין אִטַּקְס אִלְיום בְּחֵיפָה؟
            feedback: וֵין = איפה. שואלים עם כִּיף (איך).
          - text: לֵיש אִטַּקְס אִלְיום בְּחֵיפָה؟
            feedback: לֵיש = למה. שואלים עם כִּיף (איך).
      - id: order-rishon
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: "מזג האוויר היום בראשון מעונן".'
        sentence: אִטַּקְס אִלְיום בְּרִישׁוֹן מֻעְ'יֵּם
  - slug: weather-participle
    title: בינוני פועל
    minutes: 8
    items:
      - id: match-participle
        type: matching
        lang: he
        prompt: התאימו כל צורת בינוני למשמעות שלה.
        pairs:
          - - רַאיֵח
            - הולך
          - - גַ’אי
            - בא
          - - שַאיֵף
            - רואה
          - - סַאמֵע
            - שומע
          - - כָּאתֵב
            - כותב
      - id: katab
        type: multipleChoice
        lang: he
        prompt: מהי צורת הבינוני (פָאעֵל) של כַּתַבּ?
        options:
          - text: כָּאתֵב
            correct: true
          - text: כַּתַבּ
            feedback: "זה הפועל עצמו. בבינוני מוסיפים א' אחרי פ' הפועל: כָּאתֵב."
          - text: רַאיֵח
            feedback: רַאיֵח = הולך (מהפועל רָח).
      - id: now-or-always
        type: multipleChoice
        lang: he
        prompt: איך אומרים "אני הולך לבית הספר (עכשיו)"?
        options:
          - text: אַנַא רָאיֵח עַלְמַדְרַסֶה
            correct: true
          - text: אַנַא בַּרוח עַלְמַדְרַסֶה כֻּל יוֹם
            feedback: בַּרוח … כֻּל יוֹם מתאר הרגל (כל יום), לא פעולה של עכשיו.
          - text: אַנַא גַ'אי עַלְמַדְרַסֶה
            feedback: גַ'אי = בא, לא הולך.
      - id: baruh-now
        type: trueFalse
        lang: he
        prompt: '"אַנַא בַּרוח" מתאר פעולה שקורה ברגע זה ממש.'
        answer: false
        feedback:
          correct: נכון! בַּרוח (הווה כללי) הוא הרגל; עכשיו אומרים רָאיֵח.
          incorrect: 'בַּרוח (הווה כללי) מתאר הרגל. פעולה של עכשיו: רָאיֵח (בינוני).'
      - id: see-rain
        type: multipleChoice
        lang: he
        prompt: 'השלימו: אַנָא ___ מַטַר (אני רואה גשם).'
        options:
          - text: שָאיֵף
            correct: true
          - text: סַאמֵע
            feedback: סַאמֵע = שומע.
          - text: לָאבֵּס
            feedback: לָאבֵּס = לובש.
      - id: she-wears
        type: multipleChoice
        lang: he
        prompt: דנה אומרת "אני לובשת צעיף". מה היא אומרת?
        options:
          - text: אַנָא לַאבְּסֶה לַפְחַה
            correct: true
          - text: אַנָא לָאבֵּס לַפְחַה
            feedback: לָאבֵּס היא צורת הזכר. דנה אומרת לַאבְּסֶה.
          - text: אַנָא לַאבְּסֶה כְּפוף
            feedback: כְּפוף = כפפות. צעיף = לַפְחַה.
      - id: plural
        type: multipleChoice
        lang: he
        prompt: 'לפי טבלת הנטייה: מהי צורת הרבים (זכר) של עָארֵף (יודע)?'
        options:
          - text: עָארְפִין
            correct: true
          - text: עָארְפֶה
            feedback: עָארְפֶה היא צורת היחידה.
          - text: עָארְפָאת
            feedback: עָארְפָאת היא צורת הרבות.
      - id: order-jacket
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: "אני לובש ג''קט".'
        sentence: אַנָא לָאבֵּס גַ’אכִּית
