status: in_review

review:
  - >-
    The two workbook exercises ("Questions" and "Prepositions") are NEW: the notebook
    has no self-study exercises. They were written from the cycle's summary, its
    activities and its vocabulary. An Arabic teacher must check every right answer,
    every distractor and every transliteration before students see them.
  - >-
    Verb forms to check (kept as in the notebook, not corrected): the summary and the
    Mori example answers use "אנא תחד'ר" (I watch), while the opening frame uses
    "אנא בַּחְד'ר"; "אִנְת בִּחִבּ" / "אִנְתִי בִּחִבּי" (summary 2 and 3) and "אנא בִּחִבּ
    אחד'ר" (Activity 1) may need the forms בִּתְחִבּ / בִּתְחִבִּּי / בַּחִבּ. The
    exercises avoid these doubtful verb forms on purpose.
  - >-
    Inconsistent spellings kept as in the notebook: "אה" (Activity 3) vs "אֵי" (summary)
    for "yes"; "בִּשְתַר'ל" (Activity 4) vs "בִּשְתַעְ'ל" (summary and vocabulary);
    "אלכנבאי" (Activity 1) vs "אלכנבאיה" (vocabulary); "אלמֻפַדְּלֶה" (Activity 2,
    probably ד') vs "אלמופַד'ָל" (warm-up); "עלתלוזיון" (warm-up 2). Activity 3 example
    "אִנְת מַרַה?" probably needs "אִנְתִי". Please confirm.
  - >-
    Taboo example: please check the words "מֻחַ'שִּש" and "מֻחַ'תִיר" (meaning not
    clear from the notebook).
  - >-
    Vocabulary corrections: "הליומ" → "הליום" (final letter). The row "בדרך כלל – בדרך
    כלל" was left out: its Arabic side is Hebrew. "בעד אלש'ע'ל" kept as written; it
    probably should be "בעד אלשע'ל". Please confirm.
  - >-
    The question word "כַּם" (how much) appears in the summary but not in the vocabulary list; it
    was not added.
  - >-
    The Quizlet link was cleaned of its tracking parameters (?i=…&x=…). The interview
    stage (8–10 minutes) is recorded as 10 minutes.
  - >-
    The empty answer lines of the warm-up questions are replaced by the optional answer
    boxes (decision C2).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: movies-and-tv-class
    title: 'שיעור: סרטים וטלוויזיה'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        lang: he
        text: סרטים וטלוויזיה
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: בניית שאלות עם פעלים בהווה
            description: מילת שאלה + משפט. שו, ווין, אימתא, מִין, לֵיש, כַּם
          - name: מילות יחס בסיסיות
            description: מקום, זמן ועם מי. פי, ענד, מע
      - id: quizlet
        type: externalLink
        lang: he
        label: סרטים וטלוויזיה ב-Quizlet
        url: https://quizlet.com/il/1126177409/%D7%98%D7%9C%D7%99%D7%95%D7%95%D7%99%D7%96%D7%99%D7%94-%D7%95%D7%A1%D7%A8%D7%98%D7%99%D7%9D-%D7%AA%D7%9C%D7%A4%D7%96%D7%99%D7%95%D7%9F-%D7%95-%D7%90%D7%A4%D7%9C%D7%90%D7%9D-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        lang: he
        text: סבב פתיחה
      - id: intro
        type: sentenceFrame
        frame: |-
          אנא ___.
          אנא בַּחְד'ר ___.
        example: |-
          אנא מורי.
          אנא בַּחד'ר מסלסלאת טלוויזיון.
      - id: warmup-title
        type: heading
        level: 3
        lang: he
        text: שאלות חימום
      - id: warmup
        type: discussionQuestions
        items:
          - question: "שו בֶּתְחְדַ'ר בֶּשַׁכֶּל עאם? (פילֶם, מוסַלסַל, אַח'בּאר..) ו מע מין?"
          - question: "שו אַח'ֶר בַּרְנאמֶג' חד'רתו עלתלוזיון?"
          - question: "הַל בֶּתְפַד'ֶל פילֶם קומידיה, דרמה, אקשֶׁן, רועובְּ או תאריח'י?"
          - question: "שׁו אַחְלא פילֶם חד'רְתו?"
          - question: "וין בֶּתְחֶבְּ תֶחְחְד'ר פילֶם בלבית או בל סינמה?"
          - question: "מין הו אלמומַתֶּל אלמופַד'ָל עֶנְדָכְּ? וליש?"
          - question: "לַוְ כּונֶת מוח'רֶג' אפלאם - ען שו בתֶעְמַל אלפילֶם?"
      - id: activities-title
        type: heading
        level: 3
        lang: he
        text: פעילויות
      - id: act1
        type: classActivity
        lang: he
        title: 'פעילות 1: שו אלסואל? מהי השאלה'
        skills: [בניית שאלות עם פעלים בהווה]
        steps:
          - המורה מקריא תשובה.
          - חושבים איזו מילת שאלה מתאימה לתשובה.
          - מנחשים מה הייתה השאלה ואומרים אותה בערבית מדוברת.
          - אפשר יותר משאלה אחת נכונה, כל עוד מילת השאלה מתאימה לתשובה.
      - id: act1-answers-title
        type: heading
        level: 4
        lang: he
        text: 'חלק א: התשובות'
      - id: act1-answers
        type: discussionQuestions
        items:
          - question: אֶמבּארֶח חד'רנא פילֶם מינייונים. אסאעה סבעה אלמסא.
          - question: אחסַן מֻומַתֵּל פי אלעאלַם הו דנזל וושנטון.
          - question: "לא', אנא מא בַּחֶבְּ אלמוסַלְסַלאת אלתורְכֶּיֶּה."
          - question: אנא בִּחִבּ אחד'ר טלפיזיון עלא אלכנבאי פי אלבית.
          - question: אנא בִּחִבּ אחד'ר אפלאם פי אלסינמא.
          - question: בְּרַאְיִּי, אחסן מֻמַתֵּלֶה הִי נטלי פורטמן.
          - question: נוע אלאפלאם אללי אנא בִּחִבּהא הי אפלאם אכּשן.
          - question: אנא בִּחִיבּ אפלאם אכּשן עשאן פיהא חַרַכֶּה.
          - question: כּאן עומרי תלאתאשַׁר סַנֶה לַמָּא רֻוחְת עלא אלסינמא אַוַּל מַרֶה.
          - question: אַחְלָא פילם בִּעְרִפו הו טיטאניק.
          - question: אנא בִּחִבּ אַחד'ר טלפיזיון בֶּלְלִּיל.
      - id: act2
        type: classActivity
        lang: he
        title: 'פעילות 2: ראיון – הסרט האהוב'
        skills: [בניית שאלות עם פעלים בהווה, מילות יחס בסיסיות]
        minutes: 10
        steps:
          - עובדים בזוגות. כל זוג בוחר **סרט אחד אהוב**.
          - אחד שואל את השאלות שלמטה, השני עונה.
          - אחר כך מחליפים תפקידים.
          - בסוף כל אחד משתף את הכיתה בתשובות של השותף.
      - id: act2-questions
        type: discussionQuestions
        items:
          - question: אַי סֶנֶה אלפילֶם?
          - question: "וין אלפילם ס'אר (קרה)?"
          - question: "וין בֶּתְחִבּ תחדַ'ר האלפילם?"
          - question: "מִין אלשח'סיה (דמות) אלמֻפַדְּלֶה פי אלפילם?"
          - question: שו אַחְלָא מַשְׁהָד (סצנה) פי אלפילֶם?
      - id: act3
        type: classActivity
        lang: he
        title: 'פעילות 3: 21 שאלות'
        skills: [בניית שאלות עם פעלים בהווה]
        steps:
          - תלמיד אחד בוחר **אדם מפורסם** שמדבר בערבית, ולא אומר מי הוא.
          - שאר התלמידים שואלים אותו **עד 21 שאלות**, רק שאלות **כן / לא**.
          - כל שאלה מתחילה ב־**אִנְת / אִנְתִי**. שאלה אחת בכל תור, בלי מילת שאלה, ומדברים ישירות אל הדמות.
          - התלמיד שהוא הדמות עונה רק **אה** (כן) או **לַא'** (לא).
          - כשחושבים שיודעים מי הדמות, אומרים את השם.
      - id: act3-examples
        type: examples
        items:
          - text: אִנְת זַלַמֶה?
          - text: אִנְת מַרַה?
          - text: אִנְת מֻמַתֵּל / מֻמַתֵּלֶה?
          - text: אִנְת עַרַבִּי?
          - text: אִנְת בְּריטאני?
          - text: אִנְת אַמְרִיקַאנִי?
      - id: act4
        type: classActivity
        lang: he
        title: 'פעילות 4: טאבּוּ – סרטים וסדרות'
        skills: [מילות יחס בסיסיות]
        steps:
          - כל תלמיד מקבל מהמורה **שם של סרט או סדרה**. **אסור להגיד** את השם.
          - יש לך **דקה אחת** לתאר את הסרט או הסדרה במילים פשוטות, לפי התבנית שלמטה.
          - משתמשים במילות יחס (**פי / ענד**).
          - אם הכיתה מנחשת נכון בתוך דקה, מקבלים **נקודה אחת**. מי שיש לו הכי הרבה נקודות מנצח.
      - id: act4-frame
        type: sentenceFrame
        frame: |-
          האדא פילם / מסלסל.
          הו ען ___ (ולד / בנת / זלמֶה / מרה).
          הוּ בִּעִיש פי ___.
          הוּ בִּדְרֻס / בִּשְתַר'ל / בִּסַאפֶר ..
          הו ___ (מדחק / מחז'ן..)
          שו הו?
        example: |-
          האדא פילם.
          הו ען וַלַד.
          הוּ סַעִ'יר.
          הוּ בִּעִיש פי מדרסה ח'אסֶּה.
          הוּ בִּדְרֻס סִחְר.
          פִי אלפילם פִי אַסְחַאבּ.
          הו מֻחַ'שִּש וּ מֻחַ'תִיר.
          שו הו?
          (הכיתה עונה: הארי פוטר!)
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          שתי מיומנויות במחזור: **בניית שאלות עם פעלים בהווה** (פעילויות 1, 2 ו־3) ו**מילות
          יחס בסיסיות** (פעילויות 2 ו־4).
      - id: n-intro
        anchor: intro
        text: כל תלמיד אומר מי הוא ומה הוא רואה, עד שני משפטים. תנו קודם דוגמה משלכם.
      - id: n-act1
        anchor: act1
        text: >-
          מקריאים כל תשובה, והתלמידים מנחשים את השאלה. מקבלים כל שאלה שמילת השאלה שלה
          מתאימה לתשובה.
      - id: n-act4
        anchor: act4
        text: >-
          הכינו מראש שמות של סרטים וסדרות מוכרים, אחד לכל תלמיד. הדגימו קודם את דוגמת הארי
          פוטר.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: movies-and-tv-summary
    title: סיכום
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        lang: he
        text: 'סיכום דקדוקי: סרטים וטלוויזיה'
      - id: rules-questions
        type: ruleSummary
        lang: he
        skill: בניית שאלות בערבית מדוברת
        rules:
          - text: >-
              בערבית מדוברת **לא הופכים את סדר המילים**. לוקחים משפט רגיל ומוסיפים **מילת
              שאלה בהתחלה**: מילת שאלה + משפט.
            examples:
              - "אנא תחד'ר פילם. → שו אנת תחד'ר?"
              - "אנא תחד'ר טלפיזיון אללֵיל. → אימתא אנת תחד'ר טלפיזיון?"
          - text: מילות השאלה שלמדנו
            examples:
              - שו – מה
              - ווין – איפה
              - אימתא – מתי
              - מִין – מי
              - לֵיש – למה
              - כַּם – כמה
          - text: 'כששואלים שאלה, **פונים ישירות לאדם**: **אִנְת** לזכר, **אִנְתִי** לנקבה.'
            examples:
              - אִנְת בִּחִבּ אפלאם?
              - אִנְתִי בִּחִבּי מסלסלאת?
          - text: >-
              בשאלות **כן / לא** לא משתמשים במילת שאלה, והקול עולה בסוף המשפט. עונים **אֵי**
              (כן) או **לַא** (לא).
            examples:
              - "אִנְת תחד'ר אפלאם?"
              - אִנְת בִּחִבּ טלפיזיון?
      - id: rules-verbs
        type: ruleSummary
        lang: he
        skill: פעלים בהווה (מדוברת)
        rules:
          - text: פעלים יומיומיים שלמדנו
            examples:
              - "תחד'ר – רואה / צופה"
              - בִּחִבּ – אוהב
              - בִּפַדֵּל – מעדיף
              - בִּעִיש – גר
              - בִּדְרֻס – לומד
              - "בִּשְתַעְ'ל – עובד"
          - text: דוגמה
            examples:
              - אנא בִּחִבּ אפלאם.
              - "אנא תחד'ר מסלסלאת."
      - id: rules-prepositions
        type: ruleSummary
        lang: he
        skill: מילות יחס – מקום וזמן
        rules:
          - text: '**פי** – מקום כללי או גדול: בית, חדר, עיר, מדינה.'
            examples: [פי אלבית, פי אלמדינה, פי אלמדרסה]
          - text: '**ענד** – מקום מדויק, נקודה ספציפית או אדם.'
            examples: [ענד אלבאב, ענד אלמכתב, ענד אלסינמא]
          - text: '**פי** גם לזמן כללי או ארוך.'
            examples: [פי ינאייר, פי אלסֵיף, פי סַנֶת 2023]
          - text: 'זמן ספציפי: **אללֵיל** (בלילה), **אלסאעה** (בשעה), **אלדֻּהְר** (בצהריים).'
            examples:
              - "אנא תחד'ר טלפיזיון אללֵיל."
              - "אנא תחד'ר פילם פי אלסֵיף."
      - id: connect
        type: callout
        lang: he
        tone: tip
        title: משפט סיכום
        text: >-
          בשיעור שמענו **תשובה**, בנינו ממנה **שאלה**, ודיברנו על **זמן, מקום ואנשים**. בערבית
          מדוברת: משפט פשוט + מילת שאלה = שאלה טובה.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: השתמשנו בדקדוק כדי לתקשר, לא כדי לנתח. בקשו מכל תלמיד שאלה חדשה אחת לכל מילת שאלה.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: movies-and-tv-homework
    title: שיעורי בית עם מורי
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        lang: he
        text: 'שיעורי בית עם Mori: סרטים וטלוויזיה'
      - id: how
        type: text
        lang: he
        text: פתחו את הצ׳אט עם Mori, העתיקו את ההודעה הזאת ושלחו אותה.
      - id: mori-movies
        type: aiTutorPrompt
        lang: he
        title: טלוויזיה וסרטים
        message: |-
          שלום Mori,
          אני רוצה לדבר בערבית על טלוויזיה וסרטים.
          תשאל אותי שאלות עם
          שו / ווין / אימתא / מין / לֵיש
          על זמן, מקום ואנשים,
          ותתקן אותי.
      - id: what-mori-does
        type: text
        lang: he
        text: |-
          **מה Mori יעשה איתך:** ישאל שאלה אחת בכל פעם, תמיד בערבית מדוברת: מה אתה רואה, איפה, מתי, עם מי ולמה.
          **Mori יתקן:** מילת שאלה, מילת יחס (פי / ענד), גוף (אִנְת / אִנְתִי) ופועל בהווה.
      - id: answers-title
        type: heading
        level: 3
        lang: he
        text: דוגמאות לתשובות
      - id: answers
        type: examples
        items:
          - text: "אנא תחד'ר פילם."
          - text: "אנא תחד'ר מסלסל על נטפליקס."
          - text: "אנא תחד'ר טלפיזיון אללֵיל."
          - text: "אנא תחד'ר אפלאם פי אלבית."
          - text: "אנא תחד'ר אפלאם מע סחאבי."
          - text: אנא בִּחִבּ אפלאם מדחק.
      - id: challenge
        type: callout
        lang: he
        tone: tip
        title: אתגר קטן (רשות)
        text: |-
          ענו **בלי לעצור בעברית**.
          בנו **משפט מלא**, אפילו קצר.
          תקנו את עצמכם אם Mori עוצר אתכם.

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: movies-and-tv-practice
    book: workbook
    title: 'תרגול: סרטים וטלוויזיה'
    phase: after_class
    blocks:
      - id: intro
        type: text
        lang: he
        text: תרגלו את שתי המיומנויות של המחזור. כל תשובה נבדקת מיד, ואפשר לנסות שוב.
      - id: ex-questions
        type: activity
        activity: movies-and-tv-questions
      - id: ex-prepositions
        type: activity
        activity: movies-and-tv-prepositions

