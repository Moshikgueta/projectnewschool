course: ar-medubar-1
slug: movies-and-tv
title: סרטים וטלוויזיה · אַפְלַאם וּטַלְפִיזְיוֹן
goal: לשאול שאלות עם פעלים בהווה ולהשתמש במילות יחס של מקום, זמן ועם מי.
position: 15
status: in_review

review:
  - >-
    The two workbook exercises ("Questions" and "Prepositions") are NEW: the
    notebook has no self-study exercises. They were written only from this cycle's
    summary, activities and vocabulary. An Arabic teacher must check every right
    answer, every wrong option and every transliteration before students see them.
  - >-
    Verb forms are inconsistent and were NOT changed (dialect and grammar are the
    teacher's call). The intro frame has "אנא בַּחְד'ר" (I watch), but the summary,
    homework examples and vocabulary use "אנא תחד'ר" for "I watch" and also "שו אנת
    תחד'ר?" for "you". The summary also has "אִנְת בִּחִבּ אפלאם?" (2nd person with
    the 1st-person form). The exercises reuse the summary's own examples; please
    check them.
  - >-
    Spelling variants kept as in the notebook, please confirm: "וין" / "ווין";
    "בִּשְתַר'ל" (Activity 4) / "בִּשְתַעְ'ל" (summary); "בִּחִבּ" / "בִּחִיבּ"
    (Activity 1, answer 8); "עלא אלכנבאי" (Activity 1) / "עלא אלכנבאיה" (vocabulary);
    "עלתלוזיון" (warm-up 2) / "טלפיזיון"; "מסלסל" / "מוסַלסַל"; "רועובְּ" (horror,
    warm-up 3); "פי אלסֵיף" (summer, usually with צ); "בעד אלש'ע'ל" (vocabulary 23,
    the first geresh looks like a typo).
  - >-
    Yes/no answers differ: Activity 3 uses "אה / לַא'", the summary and vocabulary
    use "אֵי / לַא". Both kept where they appear.
  - 'Typo fixed: vocabulary "הליומ" → "הליום" (final mem).'
  - >-
    Vocabulary row 25 "בדרך כלל – בדרך כלל" was left out: it has no Arabic term.
    Please add the Arabic for "usually".
  - >-
    The Harry Potter example words "מֻחַ'שִּש וּ מֻחַ'תִיר" are kept as written;
    please check their spelling and meaning.
  - >-
    The Quizlet link's share parameters (?i=…&x=…) were removed. The "Date /
    Participants" lines of the notebook were left out.
  - Activity 2 interview time (8–10 minutes) is recorded as 10 minutes.
  - >-
    The "תשובת תלמיד" lines are replaced by the optional answer boxes: students may
    type, and the teacher sees the group's answers. In Activity 1 the box under each
    answer is where students write the question.
  - >-
    The notebook does not say which activity practises which skill. The plan note
    assumes: Activities 1 and 3 – questions; Activities 2 and 4 – prepositions.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: movies-and-tv-class
    title: 'שיעור: סרטים וטלוויזיה'
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: סרטים וטלוויזיה
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: בניית שאלות עם פעלים בהווה
            description: שו, וין, אימתא, מִין, לֵיש, כַּם + משפט רגיל
          - name: מילות יחס בסיסיות
            description: מקום, זמן ועם מי – פי, ענד, מע
      - id: quizlet
        type: externalLink
        lang: he
        label: סרטים וטלוויזיה ב-Quizlet
        url: https://quizlet.com/il/1126177409/%D7%98%D7%9C%D7%99%D7%95%D7%95%D7%99%D7%96%D7%99%D7%94-%D7%95%D7%A1%D7%A8%D7%98%D7%99%D7%9D-%D7%AA%D7%9C%D7%A4%D7%96%D7%99%D7%95%D7%9F-%D7%95-%D7%90%D7%A4%D7%9C%D7%90%D7%9D-flash-cards/
      - id: intro-title
        type: heading
        lang: he
        level: 3
        text: סבב פתיחה
      - id: intro
        type: sentenceFrame
        frame: |-
          אנא ___.
          אנא בַּחְד'ר ___.
        example: |-
          אנא מורי.
          אנא בַּחד'ר מסלסלאת טלוויזיון.
      - id: warmup-title
        type: heading
        lang: he
        level: 3
        text: שאלות חימום
      - id: warmup
        type: discussionQuestions
        items:
          - question: שו בֶּתְחְדַ'ר בֶּשַׁכֶּל עאם? (פילֶם, מוסַלסַל, אַח'בּאר…) ו מע מין?
          - question: שו אַח'ֶר בַּרְנאמֶג' חד'רתו עלתלוזיון?
          - question: הַל בֶּתְפַד'ֶל פילֶם קומידיה, דרמה, אקשֶׁן, רועובְּ או תאריח'י?
          - question: שׁו אַחְלא פילֶם חד'רְתו?
          - question: וין בֶּתְחֶבְּ תֶחְחְד'ר פילֶם, בלבית או בל סינמה?
          - question: מין הו אלמומַתֶּל אלמופַד'ָל עֶנְדָכְּ? וליש?
          - question: לַוְ כּונֶת מוח'רֶג' אפלאם – ען שו בתֶעְמַל אלפילֶם?
      - id: activities-title
        type: heading
        lang: he
        level: 3
        text: פעילויות
      - id: act1
        type: classActivity
        lang: he
        title: 'פעילות 1: שו אלסואל? (מהי השאלה?)'
        skills:
          - בניית שאלות עם פעלים בהווה
        steps:
          - המורה מקריא תשובה מהרשימה שלמטה.
          - חושבים איזו מילת שאלה מתאימה לתשובה.
          - בונים את השאלה בערבית מדוברת, עם פועל בהווה, וכותבים אותה מתחת לתשובה.
          - אפשר יותר משאלה אחת נכונה, כל עוד מילת השאלה מתאימה לתשובה.
      - id: act1-answers-title
        type: heading
        lang: he
        level: 4
        text: 'חלק א: התשובות'
      - id: act1-answers
        type: discussionQuestions
        items:
          - question: אֶמבּארֶח חד'רנא פילֶם מינייונים. אסאעה סבעה אלמסא.
          - question: אחסַן מֻומַתֵּל פי אלעאלַם הו דנזל וושנטון.
          - question: לא', אנא מא בַּחֶבְּ אלמוסַלְסַלאת אלתורְכֶּיֶּה.
          - question: אנא בִּחִבּ אחד'ר טלפיזיון עלא אלכנבאי פי אלבית.
          - question: אנא בִּחִבּ אחד'ר אפלאם פי אלסינמא.
          - question: בְּרַאְיִּי, אחסן מֻמַתֵּלֶה הִי נטלי פורטמן.
          - question: נוע אלאפלאם אללי אנא בִּחִבּהא הי אפלאם אכּשן.
          - question: אנא בִּחִיבּ אפלאם אכּשן עשאן פיהא חַרַכֶּה.
          - question: כּאן עומרי תלאתאשַׁר סַנֶה לַמָּא רֻוחְת עלא אלסינמא אַוַּל מַרֶה.
          - question: אַחְלָא פילם בִּעְרִפו הו טיטאניק.
          - question: אנא בִּחִבּ אַחד'ר טלפיזיון בֶּלְלִּיל.
      - id: act2
        type: classActivity
        lang: he
        title: 'פעילות 2: ראיון – הסרט האהוב'
        skills:
          - בניית שאלות עם פעלים בהווה
          - מילות יחס בסיסיות
        minutes: 10
        steps:
          - עובדים בזוגות. כל זוג בוחר **סרט אחד אהוב**.
          - אחד שואל את השאלות שלמטה, השני עונה.
          - אחר כך מחליפים תפקידים.
          - בסוף, כל אחד משתף את הכיתה בתשובות של השותף.
      - id: act2-questions
        type: discussionQuestions
        items:
          - question: אַי סֶנֶה אלפילֶם?
          - question: וין אלפילם ס'אר? (קרה)
          - question: וין בֶּתְחִבּ תחדַ'ר האלפילם?
          - question: מִין אלשח'סיה (דמות) אלמֻפַדְּלֶה פי אלפילם?
          - question: שו אַחְלָא מַשְׁהָד (סצנה) פי אלפילֶם?
      - id: act3
        type: classActivity
        lang: he
        title: 'פעילות 3: 21 שאלות'
        skills:
          - בניית שאלות עם פעלים בהווה
        steps:
          - תלמיד אחד בוחר **אדם מפורסם** שמדבר בערבית, ולא אומר מי הוא.
          - שאר התלמידים שואלים אותו **עד 21 שאלות**, רק שאלות **כן / לא**.
          - כל שאלה מתחילה ב־**אִנְת / אִנְתִי**, ומדברים ישירות אל הדמות.
          - שאלה אחת בכל תור. לא שואלים שאלות פתוחות ולא משתמשים במילת שאלה.
          - "התלמיד שהוא הדמות עונה רק: **אה** (כן) או **לַא'** (לא)."
          - כשחושבים שיודעים מי הדמות – אומרים את השם.
      - id: act3-examples-title
        type: heading
        lang: he
        level: 4
        text: דוגמאות לשאלות
      - id: act3-examples
        type: examples
        items:
          - text: אִנְת זַלַמֶה?
          - text: אִנְת מַרַה?
          - text: אִנְת מֻמַתֵּל / מֻמַתֵּלֶה?
          - text: אִנְת עַרַבִּי?
          - text: אִנְת בְּריטאני?
          - text: אִנְת אַמְרִיקַאנִי?
      - id: act4
        type: classActivity
        lang: he
        title: 'פעילות 4: טאבּוּ – סרטים וסדרות'
        skills:
          - מילות יחס בסיסיות
        steps:
          - כל תלמיד מקבל מהמורה **שם של סרט או סדרה**. **אסור להגיד** את השם.
          - יש לך **דקה אחת** לתאר את הסרט או הסדרה במילים פשוטות, לפי התבנית שלמטה.
          - משתמשים במילות יחס (**פי / ענד**).
          - אם הכיתה מנחשת נכון בתוך דקה – מקבלים **נקודה אחת**. מי שיש לו הכי הרבה נקודות – מנצח.
      - id: act4-frame
        type: sentenceFrame
        frame: |-
          האדא פילם / מסלסל.
          הו ען ___ (ולד / בנת / זלמֶה / מרה).
          הוּ בִּעִיש פי ___.
          הוּ בִּדְרֻס / בִּשְתַר'ל / בִּסַאפֶר…
          הו ___ (מדחק / מחז'ן…)
          שו הו?
        example: |-
          האדא פילם.
          הו ען וַלַד.
          הוּ סַעִ'יר.
          הוּ בִּעִיש פי מדרסה ח'אסֶּה.
          הוּ בִּדְרֻס סִחְר.
          פִי אלפילם פִי אַסְחַאבּ.
          הו מֻחַ'שִּש וּ מֻחַ'תִיר.
          שו הו?
          – הארי פוטר!
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          שתי מיומנויות במחזור: **בניית שאלות עם פעלים בהווה** (פעילויות 1 ו־3) ו**מילות
          יחס בסיסיות – מקום / זמן / עם מי** (פעילויות 2 ו־4).
      - id: n-intro
        anchor: intro
        text: כל תלמיד אומר מי הוא ומה הוא רואה, עד שני משפטים. המורה נותן דוגמה ראשון.
      - id: n-warmup
        anchor: warmup
        text: שאלו כל תלמיד לפחות שתי שאלות. תשובות שנכתבות כאן מופיעות מתחת לכל שאלה.
      - id: n-act1
        anchor: act1
        text: >-
          מטרת הפעילות: תרגול מילות שאלה ופעלים יומיומיים בהווה. המורה מקריא תשובה,
          והתלמידים מנחשים מה הייתה השאלה. מקבלים כל שאלה שמילת השאלה שלה מתאימה לתשובה.
      - id: n-act2
        anchor: act2
        text: מחלקים את הכיתה לזוגות. אחרי הראיון כל תלמיד מספר לכיתה על תשובות השותף.
      - id: n-act3
        anchor: act3
        text: >-
          הקפידו על הכללים: שאלה אחת בכל תור, רק כן / לא, בלי מילת שאלה, ופנייה ישירה
          לדמות ב־אִנְת / אִנְתִי.
      - id: n-act4
        anchor: act4
        text: >-
          הכינו מראש שמות של סרטים וסדרות מוכרים ותנו לכל תלמיד שם אחד בלי שהאחרים
          ישמעו. מודדים דקה לכל תלמיד וסופרים נקודות.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: movies-and-tv-summary
    title: סיכום
    phase: during_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'סיכום דקדוקי: סרטים וטלוויזיה'
      - id: rules-questions
        type: ruleSummary
        lang: he
        skill: בניית שאלות עם פעלים בהווה
        rules:
          - text: >-
              בערבית מדוברת **לא הופכים את סדר המילים**. לוקחים משפט רגיל ומוסיפים
              **מילת שאלה בהתחלה**: מילת שאלה + משפט.
            examples:
              - אנא תחד'ר פילם. ← שו אנת תחד'ר?
              - אנא תחד'ר טלפיזיון אללֵיל. ← אימתא אנת תחד'ר טלפיזיון?
          - text: 'כששואלים, **פונים ישירות לאדם**: **אִנְת** לזכר, **אִנְתִי** לנקבה.'
            examples:
              - אִנְת בִּחִבּ אפלאם?
              - אִנְתִי בִּחִבּי מסלסלאת?
          - text: >-
              בשאלות כן / לא **לא משתמשים במילת שאלה**, והקול עולה בסוף המשפט. עונים
              **אֵי** (כן) או **לַא** (לא).
            examples:
              - אִנְת תחד'ר אפלאם?
              - אִנְת בִּחִבּ טלפיזיון?
          - text: פעלים יומיומיים בהווה שנלמדו – ראו בטבלה.
            examples:
              - אנא בִּחִבּ אפלאם.
              - אנא תחד'ר מסלסלאת.
      - id: question-words
        type: table
        lang: he
        caption: מילות שאלה
        header:
          - מילת שאלה
          - פירוש
        rows:
          - [שו, מה]
          - [ווין, איפה]
          - [אימתא, מתי]
          - [מִין, מי]
          - [לֵיש, למה]
          - [כַּם, כמה]
      - id: verbs
        type: table
        lang: he
        caption: פעלים בהווה
        header:
          - פועל
          - פירוש
        rows:
          - [תחד'ר, רואה / צופה]
          - [בִּחִבּ, אוהב]
          - [בִּפַדֵּל, מעדיף]
          - [בִּעִיש, גר]
          - [בִּדְרֻס, לומד]
          - [בִּשְתַעְ'ל, עובד]
      - id: rules-prepositions
        type: ruleSummary
        lang: he
        skill: מילות יחס בסיסיות
        rules:
          - text: '**פי** – מקום כללי / גדול: בית, חדר, עיר, מדינה.'
            examples:
              - פי אלבית
              - פי אלמדינה
              - פי אלמדרסה
          - text: '**ענד** – מקום מדויק / נקודה ספציפית: אדם, מקום מסוים.'
            examples:
              - ענד אלבאב
              - ענד אלמכתב
              - ענד אלסינמא
          - text: '**פי** משמשת גם לזמן כללי / ארוך.'
            examples:
              - פי ינאייר
              - פי אלסֵיף
              - פי סַנֶת 2023
          - text: 'זמן ספציפי: **אללֵיל** (בלילה), **אלסאעה** (בשעה), **אלדֻּהְר** (בצהריים).'
            examples:
              - אנא תחד'ר טלפיזיון אללֵיל.
              - אנא תחד'ר פילם פי אלסֵיף.
          - text: '**מע** – עם.'
            examples:
              - אנא תחד'ר אפלאם מע סחאבי.
      - id: connect
        type: text
        lang: he
        text: >-
          בשיעור שמענו **תשובה**, בנינו ממנה **שאלה**, ודיברנו על **זמן, מקום ואנשים**.
          השתמשנו בדקדוק כדי **לתקשר**, לא כדי לנתח.
      - id: takeaway
        type: callout
        lang: he
        tone: tip
        title: משפט סיכום
        text: 'בערבית מדוברת: משפט פשוט + מילת שאלה = שאלה טובה.'
    teacherNotes:
      - id: n-summary
        anchor: null
        text: עברו על שתי המיומנויות ובקשו מכל תלמיד דוגמה חדשה לכל כלל.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: movies-and-tv-homework
    title: שיעורי בית עם Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        lang: he
        level: 2
        text: 'שיעורי בית עם Mori: סרטים וטלוויזיה'
      - id: how
        type: text
        lang: he
        text: פתחו את הצ'אט עם Mori, העתיקו את ההודעה ושלחו אותה.
      - id: mori-tv
        type: aiTutorPrompt
        lang: he
        title: טלוויזיה וסרטים
        message: |-
          שלום Mori,
          אני רוצה לדבר בערבית על טלוויזיה וסרטים.
          תשאל אותי שאלות עם שו / ווין / אימתא / מין / לֵיש
          על זמן, מקום ואנשים,
          ותתקן אותי.
      - id: what-mori-does
        type: callout
        lang: he
        tone: info
        title: מה Mori יעשה איתך
        text: |-
          Mori ישאל שאלה אחת בכל פעם, תמיד בערבית מדוברת: מה אתה רואה, איפה, מתי, עם מי ולמה.
          Mori יתקן: מילת שאלה, מילת יחס (פי / ענד), גוף (אִנְת / אִנְתִי) ופועל בהווה.
      - id: answers-title
        type: heading
        lang: he
        level: 3
        text: עזרה – דוגמאות לתשובות
      - id: answers
        type: examples
        items:
          - text: אנא תחד'ר פילם.
          - text: אנא תחד'ר מסלסל על נטפליקס.
          - text: אנא תחד'ר טלפיזיון אללֵיל.
          - text: אנא תחד'ר אפלאם פי אלבית.
          - text: אנא תחד'ר אפלאם מע סחאבי.
          - text: אנא בִּחִבּ אפלאם מדחק.
      - id: challenge
        type: callout
        lang: he
        tone: tip
        title: אתגר קטן (רשות)
        text: |-
          לענות **בלי לעצור בעברית**.
          לבנות **משפט מלא**, אפילו קצר.
          לתקן את עצמך אם Mori עוצר אותך.

