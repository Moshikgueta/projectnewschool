activities:
  - slug: movies-and-tv-questions
    title: 'שאלות: שו, ווין, אימתא, מִין, לֵיש'
    minutes: 8
    items:
      - id: question-words
        type: matching
        lang: he
        prompt: התאימו כל מילת שאלה לפירוש שלה.
        pairs:
          - [שו, מה]
          - [ווין, איפה]
          - [אימתא, מתי]
          - [מִין, מי]
          - [לֵיש, למה]
      - id: when-night
        type: multipleChoice
        lang: he
        prompt: "התשובה: «אנא בִּחִבּ אַחד'ר טלפיזיון בֶּלְלִּיל.» באיזו מילת שאלה מתחילה השאלה?"
        options:
          - text: אימתא
            correct: true
          - text: ווין
            feedback: ווין שואלת איפה. בתשובה יש זמן (בֶּלְלִּיל – בלילה), לכן אימתא.
          - text: מִין
            feedback: מִין שואלת מי. בתשובה יש זמן (בֶּלְלִּיל – בלילה), לכן אימתא.
      - id: where-cinema
        type: multipleChoice
        lang: he
        prompt: "התשובה: «אנא בִּחִבּ אחד'ר אפלאם פי אלסינמא.» באיזו מילת שאלה מתחילה השאלה?"
        options:
          - text: ווין
            correct: true
          - text: לֵיש
            feedback: לֵיש שואלת למה. בתשובה יש מקום (פי אלסינמא – בקולנוע), לכן ווין.
          - text: אימתא
            feedback: אימתא שואלת מתי. בתשובה יש מקום (פי אלסינמא – בקולנוע), לכן ווין.
      - id: who-actor
        type: multipleChoice
        lang: he
        prompt: 'התשובה: «אחסַן מֻומַתֵּל פי אלעאלַם הו דנזל וושנטון.» באיזו מילת שאלה מתחילה השאלה?'
        options:
          - text: מִין
            correct: true
          - text: שו
            feedback: שו שואלת מה. התשובה היא אדם (דנזל וושנטון), לכן מִין.
          - text: ווין
            feedback: ווין שואלת איפה. התשובה היא אדם (דנזל וושנטון), לכן מִין.
      - id: why-action
        type: multipleChoice
        lang: he
        prompt: 'התשובה: «אנא בִּחִיבּ אפלאם אכּשן עשאן פיהא חַרַכֶּה.» באיזו מילת שאלה מתחילה השאלה?'
        options:
          - text: לֵיש
            correct: true
          - text: אימתא
            feedback: אימתא שואלת מתי. בתשובה יש סיבה (עשאן – כי), לכן לֵיש.
          - text: מִין
            feedback: מִין שואלת מי. בתשובה יש סיבה (עשאן – כי), לכן לֵיש.
      - id: word-order
        type: trueFalse
        lang: he
        prompt: בערבית מדוברת הופכים את סדר המילים כדי לבנות שאלה.
        answer: false
        feedback:
          correct: 'נכון! לא הופכים: מוסיפים מילת שאלה בהתחלה של משפט רגיל.'
          incorrect: 'לא הופכים את סדר המילים: מילת שאלה + משפט רגיל.'
      - id: ask-a-woman
        type: multipleChoice
        lang: he
        prompt: שואלים אישה אם היא אוהבת סדרות. איזו שאלה נכונה?
        options:
          - text: אִנְתִי בִּחִבּי מסלסלאת?
            correct: true
          - text: אִנְת בִּחִבּ מסלסלאת?
            feedback: אִנְת היא פנייה לזכר. לאישה פונים ב־אִנְתִי.
          - text: שו אִנְתִי בִּחִבּי מסלסלאת?
            feedback: זו שאלת כן / לא, ובשאלת כן / לא לא משתמשים במילת שאלה.
      - id: order-when
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים לשאלה: מתי אתה רואה טלוויזיה?'
        sentence: אימתא אנת תחד'ר טלפיזיון?

  - slug: movies-and-tv-prepositions
    title: 'מילות יחס: פי, ענד, מע'
    minutes: 8
    items:
      - id: fi-home
        type: multipleChoice
        lang: he
        prompt: "השלימו (בבית): אנא תחד'ר אפלאם ___ אלבית."
        options:
          - text: פי
            correct: true
          - text: ענד
            feedback: ענד היא למקום מדויק או נקודה מסוימת. בית הוא מקום כללי, לכן פי.
          - text: מע
            feedback: מע פירושה עם. כאן צריך מקום כללי (בבית), לכן פי.
      - id: and-door
        type: multipleChoice
        lang: he
        prompt: 'השלימו (ליד הדלת – נקודה מסוימת): ___ אלבאב'
        options:
          - text: ענד
            correct: true
          - text: פי
            feedback: פי היא למקום כללי וגדול. הדלת היא נקודה מסוימת, לכן ענד.
          - text: מע
            feedback: מע פירושה עם. כאן צריך נקודה מסוימת, לכן ענד.
      - id: maa-friends
        type: multipleChoice
        lang: he
        prompt: "השלימו (עם החברים שלי): אנא תחד'ר אפלאם ___ סחאבי."
        options:
          - text: מע
            correct: true
          - text: פי
            feedback: פי היא למקום או לזמן כללי. כאן צריך עם, לכן מע.
          - text: ענד
            feedback: ענד היא למקום מסוים. כאן צריך עם, לכן מע.
      - id: match-prepositions
        type: matching
        lang: he
        prompt: התאימו כל מילה לפירוש שלה.
        pairs:
          - [פי אלסינמא, בקולנוע]
          - [ענד אלבאב, ליד הדלת]
          - [מע, עם]
          - [אללֵיל, בלילה]
          - [אלדֻּהְר, בצהריים]
      - id: fi-time
        type: trueFalse
        lang: he
        prompt: 'פי משמשת גם לזמן כללי, למשל: פי ינאייר.'
        answer: true
        feedback:
          correct: 'נכון! פי – זמן כללי או ארוך: פי ינאייר, פי סַנֶת 2023.'
          incorrect: 'פי משמשת גם לזמן כללי או ארוך: פי ינאייר, פי סַנֶת 2023.'
      - id: night
        type: multipleChoice
        lang: he
        prompt: איך אומרים "בלילה"?
        options:
          - text: אללֵיל
            correct: true
          - text: אלדֻּהְר
            feedback: אלדֻּהְר פירושה בצהריים.
          - text: אלסאעה
            feedback: אלסאעה פירושה בשעה.
      - id: and-city
        type: trueFalse
        lang: he
        prompt: 'אומרים "ענד אלמדינה", כי עיר היא נקודה מסוימת.'
        answer: false
        feedback:
          correct: 'נכון! עיר היא מקום כללי וגדול, לכן: פי אלמדינה.'
          incorrect: 'עיר היא מקום כללי וגדול, לכן אומרים: פי אלמדינה.'
      - id: order-friends
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: אני רואה סרטים עם החברים שלי.'
        sentence: אנא תחד'ר אפלאם מע סחאבי
