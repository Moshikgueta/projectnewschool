activities:
  - slug: movies-and-tv-questions
    title: 'בניית שאלות: שו, ווין, אימתא, מִין, לֵיש'
    minutes: 8
    items:
      - id: question-words
        type: matching
        lang: he
        prompt: התאימו כל מילת שאלה לפירוש שלה.
        pairs:
          - [שו, מה]
          - [ווין, איפה]
          - [אימתא, מתי]
          - [מִין, מי]
          - [לֵיש, למה]
      - id: where
        type: multipleChoice
        lang: he
        prompt: איזו מילת שאלה פירושה **איפה**?
        options:
          - { text: ווין, correct: true }
          - { text: אימתא, feedback: אימתא = מתי. }
          - { text: לֵיש, feedback: לֵיש = למה. }
          - { text: שו, feedback: שו = מה. }
      - id: titanic
        type: multipleChoice
        lang: he
        prompt: >-
          התשובה: **אַחְלָא פילם בִּעְרִפו הו טיטאניק.** באיזו מילת שאלה מתחילה השאלה?
        options:
          - { text: שו, correct: true }
          - { text: ווין, feedback: 'ווין = איפה. התשובה לא אומרת איפה, אלא מה הסרט הכי טוב.' }
          - { text: אימתא, feedback: 'אימתא = מתי. התשובה לא אומרת מתי.' }
      - id: denzel
        type: multipleChoice
        lang: he
        prompt: >-
          התשובה: **אחסַן מֻומַתֵּל פי אלעאלַם הו דנזל וושנטון.** באיזו מילת שאלה מתחילה
          השאלה?
        options:
          - { text: מִין, correct: true }
          - { text: לֵיש, feedback: 'לֵיש = למה. התשובה אומרת מי, לא למה.' }
          - { text: ווין, feedback: 'ווין = איפה. התשובה אומרת מי השחקן.' }
      - id: at-night
        type: multipleChoice
        lang: he
        prompt: >-
          התשובה: **אנא בִּחִבּ אַחד'ר טלפיזיון בֶּלְלִּיל.** (בלילה) באיזו מילת שאלה מתחילה
          השאלה?
        options:
          - { text: אימתא, correct: true }
          - { text: מִין, feedback: 'מִין = מי. התשובה אומרת מתי: בלילה.' }
          - { text: שו, feedback: 'התשובה אומרת **מתי** (בלילה), ולכן שואלים עם אימתא.' }
      - id: action
        type: multipleChoice
        lang: he
        prompt: >-
          התשובה: **אנא בִּחִיבּ אפלאם אכּשן עשאן פיהא חַרַכֶּה.** (כי יש בהם תנועה) באיזו
          מילת שאלה מתחילה השאלה?
        options:
          - { text: לֵיש, correct: true }
          - { text: ווין, feedback: 'ווין = איפה. התשובה נותנת סיבה, ולכן שואלים למה: לֵיש.' }
          - { text: מִין, feedback: 'מִין = מי. התשובה נותנת סיבה, ולכן שואלים למה: לֵיש.' }
      - id: word-order
        type: trueFalse
        lang: he
        prompt: כדי לשאול שאלה בערבית מדוברת הופכים את סדר המילים במשפט.
        answer: false
        feedback:
          correct: 'נכון! לא הופכים את הסדר: מוסיפים מילת שאלה בהתחלה.'
          incorrect: 'בערבית מדוברת לא הופכים את סדר המילים. מילת שאלה + משפט = שאלה.'
      - id: to-a-woman
        type: multipleChoice
        lang: he
        prompt: שואלים **אישה** שאלה. באיזו מילה פונים אליה?
        options:
          - { text: אִנְתִי, correct: true }
          - { text: אִנְת, feedback: 'אִנְת = אתה (לזכר). לאישה אומרים אִנְתִי.' }
          - { text: אנא, feedback: 'אנא = אני. לאישה פונים ב־אִנְתִי.' }

  - slug: movies-and-tv-prepositions
    title: 'מילות יחס: פי, ענד, מע'
    minutes: 8
    items:
      - id: fi-home
        type: multipleChoice
        lang: he
        prompt: 'השלימו: **___ אלבית** (בבית: מקום כללי)'
        options:
          - { text: פי, correct: true }
          - { text: ענד, feedback: 'ענד היא למקום מדויק או לאדם. בית הוא מקום כללי: פי אלבית.' }
          - { text: מע, feedback: 'מע = עם. בבית: פי אלבית.' }
      - id: ind-door
        type: multipleChoice
        lang: he
        prompt: 'השלימו: **___ אלבאב** (ליד הדלת: נקודה מדויקת)'
        options:
          - { text: ענד, correct: true }
          - {
              text: פי,
              feedback: 'פי היא למקום כללי או גדול. ליד הדלת זו נקודה מדויקת: ענד אלבאב.',
            }
          - { text: מע, feedback: 'מע = עם. ליד הדלת: ענד אלבאב.' }
      - id: maa-friends
        type: multipleChoice
        lang: he
        prompt: 'השלימו: **___ סחאבי** (עם החברים שלי)'
        options:
          - { text: מע, correct: true }
          - { text: פי, feedback: 'פי = ב־. עם = מע.' }
          - { text: ענד, feedback: 'ענד = אצל / ליד. עם = מע.' }
      - id: fi-january
        type: multipleChoice
        lang: he
        prompt: 'השלימו: **___ ינאייר** (בינואר: זמן כללי)'
        options:
          - { text: פי, correct: true }
          - { text: ענד, feedback: 'ענד היא למקום מדויק, לא לזמן. בינואר: פי ינאייר.' }
          - { text: מע, feedback: 'מע = עם. בינואר: פי ינאייר.' }
      - id: prepositions-meaning
        type: matching
        lang: he
        prompt: התאימו כל מילה לפירוש שלה.
        pairs:
          - [פי, ב־ (מקום / זמן כללי)]
          - [ענד, אצל / ליד (מקום מסוים)]
          - [מע, עם]
          - [אללֵיל, בלילה]
          - [אלדֻּהְר, בצהריים]
      - id: ind-city
        type: trueFalse
        lang: he
        prompt: 'משתמשים ב־**ענד** למקום כללי וגדול, כמו עיר או מדינה.'
        answer: false
        feedback:
          correct: 'נכון! למקום כללי וגדול משתמשים ב־פי: פי אלמדינה.'
          incorrect: 'למקום כללי וגדול משתמשים ב־פי (פי אלמדינה). ענד היא למקום מדויק: ענד אלבאב.'
      - id: cinema
        type: multipleChoice
        lang: he
        prompt: איך אומרים **בקולנוע**?
        options:
          - { text: פי אלסינמא, correct: true }
          - { text: פאלבית, feedback: פאלבית = בבית. }
          - { text: עלא אלכנבאיה, feedback: עלא אלכנבאיה = על הספה. }
      - id: order-school
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: הוא גר בבית ספר מיוחד.'
        sentence: "הוּ בִּעִיש פי מדרסה ח'אסֶּה"
