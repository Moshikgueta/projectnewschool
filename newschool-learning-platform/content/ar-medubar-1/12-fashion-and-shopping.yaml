vocabulary:
  - slug: fashion-and-shopping
    title: אופנה וקניות
    items: *fashion-words

activities:
  - slug: fashion-and-shopping-clothes
    title: בגדים ותיאור
    minutes: 8
    items:
      - id: clothes
        type: matching
        lang: he
        prompt: התאימו כל פריט לבוש לפירוש שלו.
        pairs:
          - [פוּסתאן, שמלה]
          - [בַּנְטַלוֹן, מכנסיים]
          - [תַנּורָה, חצאית]
          - [שַׁנְטֵה, תיק]
          - ["גַ'קֵת", מעיל]
      - id: adjectives
        type: matching
        lang: he
        prompt: התאימו כל תואר לפירוש שלו.
        pairs:
          - [מוריח, נוח]
          - ["אַניק'", אלגנטי]
          - [רַסְמִי, רשמי]
          - [דַאפִי, חם]
          - ["חַ'פִיף", קליל]
      - id: blouse
        type: multipleChoice
        lang: he
        prompt: 'מה הפירוש של *בְּלוּזַה*?'
        options:
          - { text: חולצה, correct: true }
          - { text: שמלה, feedback: 'שמלה = *פוּסתאן*.' }
          - { text: מעיל, feedback: "מעיל = *גַ'קֵת*." }
      - id: skirt
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים "חצאית"?'
        options:
          - { text: תַנּורָה, correct: true }
          - { text: בַּנְטַלוֹן, feedback: '*בַּנְטַלוֹן* = מכנסיים.' }
