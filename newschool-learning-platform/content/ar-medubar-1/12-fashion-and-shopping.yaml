# Cycle "אופנה וקניות", converted from the spoken Arabic level 1 notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (spoken Arabic in Hebrew
# transliteration); Hebrew instructions carry `lang: he`.
course: ar-medubar-1
slug: fashion-and-shopping
title: "אופנה וקניות – מוד'ה ומושתריאת"
goal: לתאר בגדים במילים ובתארים פשוטים, ולדבר על מחירים וקניות במספרים.
position: 12
status: in_review

review:
  - >-
    The two workbook exercises ("Clothes and description" and "Numbers and prices")
    are NEW: the notebook has no self-correcting exercises. They were written only from
    this cycle's activities and word lists. An Arabic teacher must check every right
    answer, every wrong option and every transliteration before students see them. The
    number words in the exercises (אַלֶף, תְלַאת מִיֵּה, אַרְבַּע מִיֵּה, תִשְעַ מִיֵּה,
    חַ'מְסִין) are taken from the Activity 3 model and matched to their values by us.
  - >-
    The notebook has no lesson summary, no homework (Mori) and no vocabulary list for
    this cycle, so there are no summary and homework sections. The vocabulary section
    is built from the clothes, adjectives and situations lists in Activity 1, plus a
    few words from the warm-up and Activity 3. These Hebrew glosses are NEW (the
    notebook gives no meaning for them): אַהְוָן (נוח יותר), אַרְח'ָס' (זול יותר),
    אַסְרָע (מהיר יותר), מַחַל (חנות), שַׁרֵית (קניתי), מַעַאי (יש לי), the number
    words, and כַּם סִעְרוּ? (כמה זה עולה?). Please check.
  - >-
    The Activity 3 model has a wrong total: 300 + 400 + 150 = 850 shekels, but the
    last line says "תִשְעַ מִיֵּה וְחַ'מְסִין" (950). Not changed; please fix the total
    (or a price). A teacher note warns about it. It is not used in the exercises.
  - >-
    The notebook has two activities numbered 3. The first, "קנייה בחנות: דיאלוג קבוע",
    has only goals and no dialogue, so it was left out; the second (shopping with a
    1000-shekel budget) is Activity 3 here. If the dialogue exists elsewhere, please
    send it.
  - >-
    Activity 2 uses a Google Slides presentation whose real prices are in the slide
    notes. The link is in a teacher note only (not shown to students), so students do
    not see the prices. The "?slide=…#slide=…" part of the link was removed.
  - >-
    Activity 3 asks students to browse the ZARA Israel / H&M Israel websites on their
    phones. These sites are not on the link allow-list, so they are named but not
    linked.
  - >-
    The introduction frame was split into a frame and an example ("…כֻּתֻב"); the
    example name "דנה" is NEW. The Quizlet tracking parameters (?i=…&x=…) were removed.
  - >-
    Dialect / spelling doubts, NOT changed (teacher's call): "שוּ בִּלבַּס ל־…?" (3rd
    person? "what do you wear" may be "שו בִּתִלְבַּס"); "שור'ול" for شغل (elsewhere
    "שור'ל"); "כִּונְדַרָה" (Activity 1) vs "כִּנְדַרַאת" (Activity 3); "ליומיום" for
    ليوم يوم; "מוריח" (مريح); "אנא אסמי" (usually just "אסמי"); "בַּחֶבֶּ אַשְׁתְרי";
    "שַׁרֵית / שַרֵית" (I bought); "סֶעֶר אלאַואעי"; "ובַּסְ'רוף" (sukun placement).
  - >-
    Time ranges (5–10, 15–20, 12–15, 7–10 minutes) are rounded up. The "student
    answer" lines are replaced by the optional answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: fashion-and-shopping-class
    title: 'שיעור: אופנה וקניות'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        lang: he
        text: אופנה וקניות
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: בגדים ותיאור
            description: "פוּסתאן, בַּנְטַלוֹן, תַנּורָה... ותארים: מוריח, אַניק', רַסְמִי"
          - name: מספרים ומחירים
            description: 'כַּם סִעְרוּ? מַעַאי אַלֶף שֵקֶל. שַׁרֵית ___ בִּ ___ שֵקֶל.'
      - id: quizlet
        type: externalLink
        lang: he
        label: אופנה וקניות בקוויזלט
        url: https://quizlet.com/il/1124601103/%D7%90%D7%95%D7%A4%D7%A0%D7%94-%D7%95%D7%A7%D7%A0%D7%99%D7%95%D7%AA-%D7%9E%D7%95%D7%93%D7%94-%D7%95%D7%9E%D7%95%D7%A9%D7%AA%D7%A8%D7%99%D7%90%D7%AA-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        lang: he
        text: סבב פתיחה
      - id: intro
        type: sentenceFrame
        frame: אנא אסמי ___ וּבְּחֶבּ אִשתרי ___.
        example: אנא אסמי דנה וּבְּחֶבּ אִשתרי כֻּתֻב.
      - id: warmup-title
        type: heading
        level: 3
        lang: he
        text: שאלות הכנה
      - id: warmup
        type: discussionQuestions
        items:
          - question: שוּ בֶּתְחֶבּ/י תִשֶׁתְרי בֶּשַׁכֶּל עאם?
            frame: בַּחֶבֶּ אַשְׁתְרי ___
          - question: "בְּתִפַד'ל תִשתרי אוֹנְלַיין אוֹ מִן אִלמַחַל? לֵיה?"
            frame: |-
              בַּפַדֶּל אַשׁתְרי מן אלמַחַל לאנו ___
              בַּפַדֶּל אַשׁתְרי אונליין לאנו ___
              (אַהְוָן, אַרְח'ָס', אַסְרָע…)
          - question: "כַּם מַרָּה בְּתֶשְׁתְרי בֶּל שַּׁהָר? ק'די בתוס'ְרוף?"
            frame: |-
              בַּשְׁתְרי ___ מַרָּה / מַרָּאת…
              ובַּסְ'רוף ___ שקל
          - question: מֶן וין בּתֶשְׁתְרי? שׁו אֶסֶם אל מַחַל? וליה מן האד אלמחל?
          - question: "שו אַחֶ'ר אֶשֶׁי אֶשְׁתַריתו / אֶשְׁתַריתיה? וק'די כְּאן סֶעְרו?"
          - question: "שׁו אַכְּתַר אֶשִׁי רָ'אלִי אֶשְׁתַרֵיתוֹ?"
          - question: "לַוְ מַעַכְּ כּתיר מַס'ארי!.. בּתֶשְׁתְרי סָאעה ב תלאתין אלף שקל?"
      - id: activities-title
        type: heading
        level: 3
        lang: he
        text: פעילויות
      - id: act1
        type: classActivity
        lang: he
        title: 'פעילות 1: מה אני לובש? (תיאור בגדים)'
        skills: [בגדים ותיאור]
        minutes: 20
        steps:
          - המורה מציג תמונות של פריטי לבוש. אומרים את שם הפריט ואת הצבע שלו.
          - 'המורה כותב על הלוח ואומר בקול: *שוּ בִּלבַּס ל־…?*'
          - עונים על השאלה לכל אחד מארבעת המצבים, ומתארים את הבגדים בעזרת בנק התארים.
      - id: act1-clothes
        type: vocabulary
        glossLang: he
        items:
          - { term: פוּסתאן, gloss: שמלה }
          - { term: בַּנְטַלוֹן, gloss: מכנסיים }
          - { term: תַנּורָה, gloss: חצאית }
          - { term: שַׁנְטֵה, gloss: תיק }
          - { term: "גַ'קֵת", gloss: מעיל }
          - { term: בְּלוּזַה, gloss: חולצה }
          - { term: כִּונְדַרָה, gloss: נעליים }
      - id: act1-situations
        type: discussionQuestions
        title: שוּ בִּלבַּס ל־…?
        items:
          - question: שוּ בִּלבַּס ל־עיד מילאד?
          - question: "שוּ בִּלבַּס ל־יוֹם שׁור'ול?"
          - question: שוּ בִּלבַּס ל־בַּחַר?
          - question: "שוּ בִּלבַּס ל־לֶק'אא' מַע אלאַסְ'חאבְּ?"
      - id: act1-adjectives
        type: vocabulary
        glossLang: he
        items:
          - { term: מוריח, gloss: נוח }
          - { term: "אַניק'", gloss: אלגנטי }
          - { term: ליומיום, gloss: יומיומי }
          - { term: רַסְמִי, gloss: רשמי }
          - { term: דַאפִי, gloss: חם }
          - { term: "חַ'פִיף", gloss: קליל }
          - { term: מְלַוַּן, gloss: צבעוני }
      - id: act2
        type: classActivity
        lang: he
        title: 'פעילות 2: תנחשו את המחיר (מספרים)'
        skills: [מספרים ומחירים]
        minutes: 20
        steps:
          - המורה משתף מצגת עם תמונות של בגדים. בכל שקף יש פריט אחד.
          - 'המורה שואל: *כַּם סִעְרוּ?*'
          - כל תלמיד אומר ניחוש אחד בלבד, בערבית ובמספר.
          - המורה מגלה את המחיר האמיתי. מי שהכי קרוב מקבל נקודה.
          - בסוף, מי שצבר הכי הרבה נקודות מנצח.
      - id: act3
        type: classActivity
        lang: he
        title: 'פעילות 3: שופינג עם תקציב אמיתי – 1000 ש"ח'
        skills: [מספרים ומחירים, בגדים ותיאור]
        minutes: 20
        steps:
          - 'לכל תלמיד יש תקציב של **1000 ש"ח**.'
          - 'נכנסים בנייד לאתר של ZARA Israel או H&M Israel (לבד או בזוגות).'
          - 'המטרה: לקנות **כמה שיותר פריטים** בלי לעבור את התקציב. מותר לבחור בגדים מכל הסוגים.'
          - 'בונים "סל קניות" דמיוני: פריט, מחיר, סכום כולל (10 דקות).'
          - מציגים את סל הקניות מול הכיתה לפי המבנה הקבוע.
      - id: act3-board
        type: dialogue
        lines:
          - speaker: '1'
            text: כַּם מַעַכ?
          - speaker: '2'
            text: מַעַאי אַלֶף שֵקֶל.
      - id: act3-frame
        type: sentenceFrame
        frame: |-
          אַנא מַעַאי אַלֶף שֵקֶל.
          שַׁרֵית ___ בִּ ___ שֵקֶל.
          שַׁרֵית ___ בִּ ___ שֵקֶל.
          סֶעֶר אלאַואעי ___ שֵקֶל.
        example: |-
          אַנא מַעַאי אַלֶף שֵקֶל.
          שַרֵית פוּסתאן בִּ תְלַאת מִיֵּה שֵקֶל.
          שַרֵית כִּנְדַרַאת בִּ אַרְבַּע מִיֵּה שֵקֶל.
          שַרֵית בְּלוּזַאת בִּ מִיֵּה וַחְדֶה וְחַ'מְסִין.
          כֻּלּוּ סַעְרוּ תִשְעַ מִיֵּה וְחַ'מְסִין שֵקֶל.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          שיעור של 90 דקות. מיומנויות: דיבור, תיאור, מספרים וקניות. בוחרים פעילויות לפי
          מצב הכיתה.
      - id: n-intro
        anchor: intro
        minutes: 10
        text: מטרה – היכרות וחיבור לנושא הקניות. המורה נותן דוגמה ראשון ואז שואל כל תלמיד.
      - id: n-warmup
        anchor: warmup
        minutes: 20
        text: שואלים כל תלמיד לפחות שתי שאלות. התשובות שהתלמידים מקלידים מופיעות כאן מתחת לכל שאלה.
      - id: n-act1
        anchor: act1
        text: >-
          מטרות: אוצר מילים של בגדים, המבנה "מה לובשים ל…", תיאור בעזרת תארים ודיבור
          בהווה. חזרה על המילים 5 דקות, הצגת השאלה 2 דקות. דוגמה לשאלה לתלמיד: *שוּ
          בִּלבַּס ל־יוֹם שׁור'ול?*
      - id: n-act2
        anchor: act2
        text: >-
          המצגת: [שופינג Shopping](https://docs.google.com/presentation/d/1uFqbDX8-ftLQBBJCfbx6Sna6zhKy-DBUeYQup7FSlq4/edit).
          המחיר האמיתי של כל פריט מופיע **רק בהערות של השקף**, לא על התמונה, ולכן
          התלמידים לא רואים אותו. אחרי שכולם ניחשו, פותחים את ההערות ומקריאים את
          המחיר. רושמים נקודות על הלוח. משתמשים רק בשקפים שקשורים לאופנה, או רק בחלק
          מהם אם רוצים לסיים מוקדם.
      - id: n-act3
        anchor: act3
        text: >-
          כותבים על הלוח: *כַּם מַעַכ? / מַעַאי אַלֶף שֵקֶל*. מטרות: מספרים גדולים (מאות
          ואלפים), הפעלים לקנות / ללבוש / להוציא, הצגה בעל־פה וקבלת החלטות בתקציב. חיפוש
          עצמאי 10 דקות, הצגה 12 דקות.
      - id: n-act3-sum
        anchor: act3-frame
        text: >-
          שימו לב: בדוגמה 300 + 400 + 150 = 850 ש"ח, אבל בשורה האחרונה כתוב "תִשְעַ מִיֵּה
          וְחַ'מְסִין" (950). כדאי לתקן לפני שמציגים את הדוגמה.

