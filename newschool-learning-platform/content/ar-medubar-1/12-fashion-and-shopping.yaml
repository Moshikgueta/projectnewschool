  - slug: fashion-and-shopping-prices
    title: מספרים ומחירים
    minutes: 8
    items:
      - id: numbers
        type: matching
        lang: he
        prompt: התאימו כל מספר לערך שלו.
        pairs:
          - [אַלֶף, '1000']
          - [תְלַאת מִיֵּה, '300']
          - [אַרְבַּע מִיֵּה, '400']
          - [תִשְעַ מִיֵּה, '900']
          - ["חַ'מְסִין", '50']
      - id: how-much
        type: multipleChoice
        lang: he
        prompt: 'איך שואלים "כמה זה עולה?"'
        options:
          - { text: כַּם סִעְרוּ?, correct: true }
          - { text: כַּם מַעַכ?, feedback: '*כַּם מַעַכ?* = כמה יש לך?' }
          - { text: מַעַאי אַלֶף שֵקֶל., feedback: 'זה "יש לי אלף שקל".' }
      - id: budget
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: "יש לי אלף שקל"?'
        options:
          - { text: אַנא מַעַאי אַלֶף שֵקֶל., correct: true }
          - { text: אַנא מַעַאי מִיֵּה שֵקֶל., feedback: '*מִיֵּה* = מאה. אלף = *אַלֶף*.' }
          - { text: כַּם מַעַכ?, feedback: 'זו שאלה: כמה יש לך?' }
      - id: kam-maak
        type: multipleChoice
        lang: he
        prompt: 'מה הפירוש של *כַּם מַעַכ?*'
        options:
          - { text: כמה יש לך?, correct: true }
          - { text: כמה זה עולה?, feedback: 'כמה זה עולה? = *כַּם סִעְרוּ?*' }
          - { text: מה קנית?, feedback: '*מַעַכ* = יש לך (איתך).' }
      - id: shoes-400
        type: multipleChoice
        lang: he
        prompt: 'מה הפירוש של: *שַרֵית כִּנְדַרַאת בִּ אַרְבַּע מִיֵּה שֵקֶל*?'
        options:
