# Cycle "תגליות – אֶכְּתֶשׁאפאת" (Discoveries), converted from the spoken Arabic
# level 1 digital notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (spoken Arabic in Hebrew letters).
course: ar-medubar-1
slug: discoveries
title: תגליות – אֶכְּתֶשׁאפאת
goal: 'לדבר על חיות ומדינות: משפטי פעולה בהווה ומילות יחס של מיקום ומרחק.'
position: 14
status: in_review
review:
  - 'The two workbook exercises ("discoveries-actions" and "discoveries-prepositions") are NEW: the notebook has no self-study exercises. They were written from this cycle''s activities and questions only (plus the present-tense rule from the cycle "איך להירגע", which teaches the same skill). An Arabic teacher must check every right answer, every wrong option and every transliteration, including the Hebrew meanings given for the Activity 3 questions (בתוכֶּל לחמה, בתנאם עלא אלשג''רה, לונהא בֶּני, אַס''להא מן אלס''ין, חיואן לטיף), which the notebook does not translate.'
  - 'This cycle has no grammar summary and no vocabulary list in the notebook, so there is no summary section. The vocabulary section was built from the prepositions in Activity 1 (glossed in the notebook), "אלדווָל (מדינות)" from the introduction, the cycle title, and two words the notebook does not gloss here: אלטביעה (הטבע, as in the vocabulary of "איך להירגע") and אלחיואנאת (החיות). Please confirm, or add the cycle''s real word list (the Quizlet set may have it).'
  - The notebook names only "questions and exercises" for skill 2 (prepositions). Here Activity 1 is tagged as the prepositions activity, Activities 2 and 3 as present-tense actions (as the notebook says), and Activity 4 (guess the country) has no skill tag.
  - Activity 1 uses a map and Activity 2 a picture of animals; the notebook gives no file or link for either. The teacher shares them on screen (see the teacher notes). They should move into the course's own media.
  - The warm-up questions were numbered 1–4, 1–3, 7 in the notebook; they are one list of 8 here.
  - "Typos fixed: \"שו בּוכְֶּל ?\" (two vowel marks on כ) → \"שו בּוכֶּל?\"; \"ב שו משהורָה?\" → \"בשו משהורָה?\"; \"חאלַכְּ\\ חאלֶכְּ\" → \"חאלַכְּ / חאלֶכְּ\". The \"תשובות תלמידים / תלמיד 1–3\" lines were removed (the platform has answer boxes). The Quizlet link's tracking parameters (?i=…&x=…) were removed."
  - 'Please check these spellings, kept as written: "ענדָק" (warm-up 1) next to "עֶנְדָכְּ" (warm-up 5); "ק''ריב" (warm-up 2) next to "קריב" (Activity 1); "ליש" next to "ליה" for "why"; "אֶחְזר" in the title of Activity 4; "מוסְתחיל" (warm-up 4).'
sections:
  - slug: discoveries-class
    title: 'שיעור: תגליות'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: תגליות – אֶכְּתֶשׁאפאת
        lang: he
      - id: skills
        type: cycleOverview
        lang: he
        skills:
          - name: משפטי פעולה בהווה
            description: "מה החיות עושות: בתוכֶּל לחמה? בתנאם עלא אלשג'רה?"
          - name: 'מילות יחס: מיקום ומרחק'
            description: פוק, תחת, חד, קריב מן, בעיד ען
      - id: quizlet
        type: externalLink
        label: תגליות ב-Quizlet
        url: https://quizlet.com/il/1126155734/%D7%90%D7%9B%D7%AA%D7%A9%D7%90%D7%A4%D7%90%D7%AA-%D7%AA%D7%92%D7%9C%D7%99%D7%95%D7%AA-flash-cards/
        lang: he
      - id: intro-title
        type: heading
        level: 3
        text: סבב פתיחה
        lang: he
      - id: intro-how
        type: text
        lang: he
        text: כל אחד אומר מי הוא ומה מעניין אותו ללמוד. שני משפטים קצרים בלבד.
      - id: intro
        type: sentenceFrame
        frame: |-
          אנא ___.
          אנא בחב אתעלם אשי ג'דיד ען ___. (אלטביעה, אלחיואנאת, אלדווָל ..)
        example: אנא מורי. אנא בחב אתעלם אשי ג'דיד ען אלסיאסה.
      - id: warmup-title
        type: heading
        level: 3
        text: שאלות חימום
        lang: he
      - id: warmup
        type: discussionQuestions
        items:
          - question: שו אלבלד אלמופדל ענדָק? ליש?
          - question: אלבלד ק'ריב ואללא בעיד ען אֶסראיל?
          - question: שו מומְכֶּן נֶעְמַל הונאכְּ? שו מומְכֶּן נוכֶּל הונאכְּ?
          - question: וין מוסְתחיל תסאפֶר!? ו ליה?
          - question: שו אֶלְחַיואן אלמופַדָ'ל עֶנְדָכְּ? ליה?
          - question: שו בּוכֶּל?
          - question: שו אלחיואן אללי מֶשׁ מומְכֶּן יכּון פי ביתָכְּ?
          - question: אֶחְכּילי אשי ען חאלַכְּ / חאלֶכְּ!
      - id: activities-title
        type: heading
        level: 3
        text: פעילויות
        lang: he
      - id: act1
        type: classActivity
        lang: he
        title: 'פעילות 1: איפה זה נמצא? – מילות יחס'
        skills:
          - 'מילות יחס: מיקום ומרחק'
        steps:
          - חזרה קצרה על מילות היחס שלמטה.
          - הסתכלו על המפה שהמורה משתף ואמרו איפה נמצא כל מקום.
          - 'שאלו זה את זה: הו ___ קריב ואללא בעיד ען ___?'
      - id: act1-words
        type: examples
        items:
          - text: פוק
            gloss: מעל
          - text: תחת
            gloss: מתחת
          - text: חד
            gloss: ליד
          - text: קריב מן
            gloss: קרוב ל־
          - text: בעיד ען
            gloss: רחוק מ־
      - id: act1-frame
        type: sentenceFrame
        frame: הו ___ (פוק / תחת / חד / קריב מן / בעיד ען) ___.
      - id: act1-question
        type: sentenceFrame
        frame: הו ___ קריב ואללא בעיד ען ___?
      - id: act2
        type: classActivity
        lang: he
        title: 'פעילות 2: מה החיות עושות? – פעולות'
        skills:
          - משפטי פעולה בהווה
        steps:
          - המורה מציג תמונה של חיות.
          - ענו על השאלה שלמטה.
          - בחרו חיה ותארו מה היא עושה.
      - id: act2-question
        type: discussionQuestions
        items:
          - question: שו שאיֶף פי אלס'ורָה?
            frame: אל___ ___.
      - id: act3
        type: classActivity
        lang: he
        title: 'פעילות 3: נחשו את החיה!'
        skills:
          - משפטי פעולה בהווה
        steps:
          - כל אחד בוחר חיה בשקט, בלי להגיד.
          - שאר המשתתפים שואלים שאלות קצרות עד שמגלים מה החיה.
      - id: act3-questions
        type: examples
        items:
          - text: בתוכֶּל לחמה?
          - text: בתנאם עלא אלשג'רה?
          - text: אַס'להא מן אלס'ין?
          - text: לונהא בֶּני?
          - text: חיואן לטיף?
      - id: act4
        type: classActivity
        lang: he
        title: 'פעילות 4: אֶחְזר שו הי אל דולֶה?'
        steps:
          - משתתף אחד בוחר מדינה בלי להגיד.
          - שאר המשתתפים שואלים שאלות ומנסים לגלות מה המדינה.
      - id: act4-questions
        type: examples
        items:
          - text: מין ג'יראן האי אלדולֶה?
          - text: בשו משהורָה?
          - text: לון אלעלם הו אס'פר ואחמר?
    teacherNotes:
      - id: n-plan
        anchor: null
        text: 'שתי מיומנויות במחזור: **משפטי פעולה בהווה** (פעילות 2 או 3) ו**מילות יחס – מיקום ומרחק** (פעילות 1 ושאלות החימום על מרחק).'
      - id: n-intro
        anchor: intro
        text: תנו קודם את הדוגמה שלכם ("אנא מורי. אנא בחב אתעלם אשי ג'דיד ען אלסיאסה."), ואז כל תלמיד אומר שני משפטים קצרים.
      - id: n-act1
        anchor: act1
        text: 'חזרה קצרה על מילות היחס, ואז עבודה עם מפה. המפה עוד לא נמצאת בפלטפורמה: שתפו מפה במסך.'
      - id: n-act2
        anchor: act2
        text: הציגו במסך תמונה של כמה חיות (התמונה עוד לא נמצאת בפלטפורמה).
  - slug: discoveries-homework
    title: שיעורי בית עם Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: שיעורי בית עם Mori – תגליות
        lang: he
      - id: how
        type: text
        lang: he
        text: פתחו את הצ'אט עם Mori, העתיקו את ההודעה ושלחו אותה. Mori ישאל אתכם שאלות; ענו על כולן.
      - id: mori-discoveries
        type: aiTutorPrompt
        lang: he
        title: תגליות
        message: |-
          שלום Mori,
          אני רוצה לתרגל ערבית מדוברת.
          תשאל אותי שאלות על
          פעולות יומיומיות,
          מיקום ומרחק,
          וחיות.
          תתקן אותי.
      - id: challenge
        type: callout
        lang: he
        tone: tip
        title: אתגר קטן (רשות)
        text: |-
          ענו במשפט מלא.
          חברו שתי פעולות ביחד.
  - slug: discoveries-practice
    book: workbook
    title: 'תרגול: תגליות'
    phase: after_class
    blocks:
      - id: intro
        type: text
        lang: he
        text: תרגלו לבד את שתי המיומנויות של המחזור. כל תשובה נבדקת מיד, ואפשר לנסות שוב.
      - id: ex-actions
        type: activity
        activity: discoveries-actions
      - id: ex-prepositions
        type: activity
        activity: discoveries-prepositions
  - slug: discoveries-vocabulary
    title: אוצר מילים
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: 'מילים: תגליות'
        glossLang: he
        link: https://quizlet.com/il/1126155734/%D7%90%D7%9B%D7%AA%D7%A9%D7%90%D7%A4%D7%90%D7%AA-%D7%AA%D7%92%D7%9C%D7%99%D7%95%D7%AA-flash-cards/
        items: &words
          - term: אֶכְּתֶשׁאפאת
            gloss: תגליות
          - term: פוק
            gloss: מעל
          - term: תחת
            gloss: מתחת
          - term: חד
            gloss: ליד
          - term: קריב מן
            gloss: קרוב ל־
          - term: בעיד ען
            gloss: רחוק מ־
          - term: אלטביעה
            gloss: הטבע
          - term: אלחיואנאת
            gloss: החיות
          - term: אלדווָל
            gloss: המדינות
vocabulary:
  - slug: discoveries
    title: תגליות – אֶכְּתֶשׁאפאת
    items: *words
activities:
  - slug: discoveries-actions
    title: מה החיות עושות? משפטי פעולה בהווה
    minutes: 8
    items:
      - id: animal-questions
        type: matching
        lang: he
        prompt: התאימו כל שאלה לפירוש שלה.
        pairs:
          - - בתוכֶּל לחמה?
            - היא אוכלת בשר?
          - - בתנאם עלא אלשג'רה?
            - היא ישנה על העץ?
          - - לונהא בֶּני?
            - הצבע שלה חום?
          - - אַס'להא מן אלס'ין?
            - המוצא שלה מסין?
      - id: eats-meat
        type: multipleChoice
        lang: he
        prompt: 'נחשו את החיה: איך שואלים "היא אוכלת בשר?"'
        options:
          - text: בתוכֶּל לחמה?
            correct: true
          - text: בתנאם עלא אלשג'רה?
            feedback: זו השאלה "היא ישנה על העץ?".
          - text: לונהא בֶּני?
            feedback: זו השאלה "הצבע שלה חום?".
      - id: sleeps-tree
        type: multipleChoice
        lang: he
        prompt: איך שואלים "היא ישנה על העץ?"
        options:
          - text: בתנאם עלא אלשג'רה?
            correct: true
          - text: בתוכֶּל לחמה?
            feedback: זו השאלה "היא אוכלת בשר?".
          - text: חיואן לטיף?
            feedback: זו השאלה "חיה נחמדה?", בלי פועל.
      - id: what-eats
        type: multipleChoice
        lang: he
        prompt: איך שואלים "מה הוא אוכל?"
        options:
          - text: שו בּוכֶּל?
            correct: true
          - text: שו אֶלְחַיואן אלמופַדָ'ל עֶנְדָכְּ?
            feedback: זו השאלה "מה החיה האהובה עליך?".
          - text: שו שאיֶף פי אלס'ורָה?
            feedback: זו השאלה "מה אתה רואה בתמונה?".
      - id: b-prefix
        type: trueFalse
        lang: he
        prompt: בפעלים בהווה יש בדרך כלל תחילית ב־ לפני הפועל, כמו בתוכֶּל ובתנאם.
        answer: true
        feedback:
          correct: נכון! ה־ב מסמנת פעולה שקורית עכשיו או בדרך כלל.
          incorrect: ה־ב לפני הפועל היא סימן ההיכר של ההווה בערבית מדוברת.
      - id: no-hu
        type: trueFalse
        lang: he
        prompt: במשפט פעולה בהווה מוסיפים "הוא" או "יש" לפני הפועל.
        answer: false
        feedback:
          correct: נכון! פשוט אומרים מי + מה עושה.
          incorrect: זו טעות נפוצה. בערבית מדוברת פשוט אומרים מי + מה עושה, בלי "הוא" ובלי "יש".
      - id: what-to-eat
        type: trueFalse
        lang: he
        prompt: '"שו מומְכֶּן נוכֶּל הונאכְּ?" פירושו "מה אפשר לאכול שם?"'
        answer: true
        feedback:
          correct: נכון! ו"שו מומְכֶּן נֶעְמַל הונאכְּ?" = מה אפשר לעשות שם?
          incorrect: נוכֶּל = נאכל, הונאכְּ = שם. השאלה היא "מה אפשר לאכול שם?".
      - id: order-learn
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: "אני אוהב ללמוד משהו חדש על הטבע".'
        sentence: אנא בחב אתעלם אשי ג'דיד ען אלטביעה
  - slug: discoveries-prepositions
    title: איפה זה נמצא? מילות יחס
    minutes: 8
    items:
      - id: match
        type: matching
        lang: he
        prompt: התאימו כל מילת יחס לפירוש שלה.
        pairs:
          - - פוק
            - מעל
          - - תחת
            - מתחת
          - - חד
            - ליד
          - - קריב מן
            - קרוב ל־
          - - בעיד ען
            - רחוק מ־
      - id: above
        type: multipleChoice
        lang: he
        prompt: איך אומרים "מעל"?
        options:
          - text: פוק
            correct: true
          - text: תחת
            feedback: תחת = מתחת.
          - text: חד
            feedback: חד = ליד.
      - id: under
        type: multipleChoice
        lang: he
        prompt: איך אומרים "מתחת"?
        options:
          - text: תחת
            correct: true
          - text: פוק
            feedback: פוק = מעל.
          - text: בעיד ען
            feedback: בעיד ען = רחוק מ־.
      - id: next-to
        type: multipleChoice
        lang: he
        prompt: איך אומרים "ליד"?
        options:
          - text: חד
            correct: true
          - text: פוק
            feedback: פוק = מעל.
          - text: קריב מן
            feedback: קריב מן = קרוב ל־. ליד = חד.
      - id: far
        type: multipleChoice
        lang: he
        prompt: 'השלימו את השאלה "המדינה קרובה או רחוקה מישראל?": אלבלד ק''ריב ואללא ___ ען אֶסראיל?'
        options:
          - text: בעיד
            correct: true
          - text: פוק
            feedback: פוק = מעל. רחוק = בעיד.
          - text: תחת
            feedback: תחת = מתחת. רחוק = בעיד.
      - id: qarib
        type: trueFalse
        lang: he
        prompt: '"קריב מן" פירושו "רחוק מ־".'
        answer: false
        feedback:
          correct: נכון! קריב מן = קרוב ל־, ובעיד ען = רחוק מ־.
          incorrect: קריב מן = קרוב ל־. רחוק מ־ = בעיד ען.
      - id: baid-an
        type: trueFalse
        lang: he
        prompt: 'אחרי "בעיד" באה המילה "ען": בעיד ען = רחוק מ־.'
        answer: true
        feedback:
          correct: 'נכון! ואחרי "קריב" באה "מן": קריב מן.'
          incorrect: אומרים בעיד ען (רחוק מ־) וקריב מן (קרוב ל־).
      - id: order-far
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: "המדינה קרובה או רחוקה מישראל?"'
        sentence: אלבלד ק'ריב ואללא בעיד ען אֶסראיל?
