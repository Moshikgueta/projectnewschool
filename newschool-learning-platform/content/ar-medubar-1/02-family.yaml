activities:
  - slug: family-members
    title: בני המשפחה וכינויי שייכות
    minutes: 8
    items:
      - id: members
        type: matching
        lang: he
        prompt: התאימו כל בן משפחה לפירוש שלו.
        pairs:
          - ['אַבּוּי', 'אבא שלי']
          - ['אִמִּי', 'אמא שלי']
          - ['אַח׳וּי', 'אח שלי']
          - ['אֻוח׳תִי', 'אחות שלי']
          - ['וַלַאד עַמִּי', 'בני דוד שלי']
      - id: my-family
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״המשפחה שלי״?'
        options:
          - { text: 'עֵילְתִי', correct: true }
          - { text: 'עֵילְתַכּ', feedback: 'עֵילְתַכּ פירושו ״המשפחה שלך״.' }
          - { text: 'עֵילֵה', feedback: 'עֵילֵה פירושו ״משפחה״, בלי ״שלי״.' }
      - id: his-name
        type: multipleChoice
        lang: he
        prompt: '״זה אבא שלי. השם שלו דני.״ השלימו: הַאדַא אבוי. ___ דני.'
        options:
          - { text: 'אסמו', correct: true }
          - { text: 'אסמהא', feedback: 'אסמהא פירושו ״השם שלה״ – לאישה.' }
          - { text: 'אסמי', feedback: 'אסמי פירושו ״השם שלי״.' }
      - id: this-is-mom
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״זאת אמא שלי.״?'
        options:
          - { text: 'הַאדי אימי.', correct: true }
          - { text: 'הַאדַא אימי.', feedback: 'הַאדַא משמש לזכר. לנקבה אומרים הַאדי.' }
          - { text: 'הַאדוֹל אימי.', feedback: 'הַאדוֹל פירושו ״אלה״ (רבים).' }
      - id: she-studies
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים: ״היא לומדת״?'
        options:
          - { text: 'הִיֵּ בִּתְדְרֻס.', correct: true }
          - { text: 'הֻוֵ בִּדְרֻס.', feedback: 'זה ״הוא לומד״.' }
          - {
              text: 'הִיֵּ בִּדְרֻס.',
              feedback: 'בגוף נקבה הפועל מתחיל ב־בִּתְ: הִיֵּ בִּתְדְרֻס.',
            }
      - id: trait
        type: multipleChoice
        lang: he
        prompt: '״אני אוהב אותו כי הוא חכם.״ – אנא בִּחְבּּוֹ לַאֲנּוּ ___'
        options:
          - { text: 'זַכִּי', correct: true }
          - { text: 'רַאִיק', feedback: 'רַאִיק פירושו ״רגוע״.' }
          - { text: 'טַיִּבּ', feedback: 'טַיִּבּ פירושו ״טוב / טעים״.' }
      - id: lives
        type: trueFalse
        lang: he
        prompt: '״הוא גר״ זה הֻוֵ סַאכֵּן, ו״היא גרה״ זה הִיֵּ סַאכְּנֵה.'
        answer: true
        feedback:
          correct: 'נכון! סַאכֵּן לזכר, סַאכְּנֵה לנקבה.'
          incorrect: 'זה נכון: הֻוֵ סַאכֵּן (הוא גר), הִיֵּ סַאכְּנֵה (היא גרה).'
      - id: order-like
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״אני אוהב אותה כי היא נחמדה.״'
        sentence: 'אנא בִּחְבּּהַא לַאֲנּהַא חִלְוֵה'

  - slug: family-dates
    title: 'תאריכים: ימים, חודשים, קַבְּל / בַּעַד'
    minutes: 8
    items:
      - id: days
        type: matching
        lang: he
        prompt: התאימו כל יום לשם שלו בעברית.
        pairs:
          - ['אלאַחַד', 'ראשון']
          - ['אתְנֵין', 'שני']
          - ['תְלַאתה', 'שלישי']
          - ['אַרְבַּעַה', 'רביעי']
          - ['ח׳מִיס', 'חמישי']
      - id: friday
        type: multipleChoice
        lang: he
        prompt: 'איך אומרים ״שישי״?'
        options:
          - { text: 'ג׳ֻומְעַה', correct: true }
          - { text: 'אַסַּבְּת', feedback: 'אַסַּבְּת פירושו ״שבת״.' }
          - { text: 'ח׳מִיס', feedback: 'ח׳מִיס פירושו ״חמישי״.' }
      - id: before
        type: multipleChoice
        lang: he
        prompt: 'מה פירוש ״קַבְּל״?'
        options:
          - { text: 'לפני', correct: true }
          - { text: 'אחרי', feedback: '״אחרי״ זה בַּעַד.' }
          - { text: 'מתי', feedback: '״מתי״ זה אֵימְתַא / וינתא.' }
      - id: shbat
        type: multipleChoice
        lang: he
        prompt: 'איזה חודש הוא ״שבאט״?'
        options:
          - { text: 'פברואר', correct: true }
          - { text: 'ינואר', feedback: 'ינואר זה כנון תאני.' }
          - { text: 'מרץ', feedback: 'מרץ זה אד׳אר.' }
      - id: months
        type: matching
        lang: he
        prompt: התאימו כל חודש לשם שלו בעברית.
        pairs:
          - ['שבאט', 'פברואר']
          - ['אד׳אר', 'מרץ']
          - ['ניסאן', 'אפריל']
          - ['תמוז', 'יולי']
          - ['אילול', 'ספטמבר']
      - id: tishrin
        type: trueFalse
        lang: he
        prompt: '״תשרין אוול״ הוא אוקטובר, ו״תשרין תאני״ הוא נובמבר.'
        answer: true
        feedback:
          correct: 'נכון! אוול = ראשון, תאני = שני.'
          incorrect: 'תשרין אוול = אוקטובר, תשרין תאני = נובמבר.'
      - id: after
        type: multipleChoice
        lang: he
        prompt: 'יום ההולדת של אמא שלי ב־9 בפברואר, ושל אחותי ב־6 במרץ. השלימו: עיד מילאד אוח׳תי ___!'
        options:
          - { text: 'בעדהא', correct: true }
          - { text: 'קבל', feedback: 'קבל פירושו ״לפני״, אבל 6 במרץ בא אחרי 9 בפברואר.' }
      - id: order-monday
        type: reorderSentence
        lang: he
        prompt: 'סדרו את המילים: ״ביום שני אני עובד.״'
        sentence: 'ביום אלתנֵין אנא בִּשְתע׳ל'
