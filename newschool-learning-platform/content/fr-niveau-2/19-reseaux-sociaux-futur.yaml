vocabulary:
  - slug: reseaux-sociaux-futur
    title: 'Réseaux sociaux : le futur'
    items: *reseaux-sociaux-futur-words

activities:
  - slug: reseaux-sociaux-futur-comparaisons
    title: 'Les comparaisons : plus, moins, aussi… que'
    minutes: 8
    items:
      - id: plus-populaire
        type: multipleChoice
        prompt: Beaucoup de gens utilisent Instagram, peu de gens utilisent Twitter. Instagram est ___ populaire que Twitter.
        options:
          - { text: plus, correct: true }
          - { text: moins, feedback: 'Instagram a plus d’utilisateurs : il est *plus* populaire.' }
          - {
              text: aussi,
              feedback: '*Aussi… que* veut dire « égal ». Ici, Instagram a plus d’utilisateurs : *plus*.',
            }
      - id: aussi-que
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - { text: YouTube est aussi utile que Spotify., correct: true }
          - {
              text: YouTube est aussi utile comme Spotify.,
              feedback: 'Pour comparer, on dit *aussi… que*, pas *comme*.',
            }
          - {
              text: YouTube est aussi utile de Spotify.,
              feedback: 'Pour comparer deux choses, on dit *aussi… que*.',
            }
      - id: la-plus
        type: fillBlank
        prompt: Complète le superlatif.
        text: TikTok est l’application ___ plus addictive.
        blanks: [[la]]
      - id: plus-bon
        type: trueFalse
