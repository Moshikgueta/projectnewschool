# Cycle "Réseaux sociaux : le futur", converted from the French level 2 digital notebook
# ("Cahier digital 2025 - français niveau 2", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-2
slug: reseaux-sociaux-futur
title: 'Réseaux sociaux : le futur'
goal: Parler de l’avenir des réseaux sociaux avec le futur simple et les comparaisons.
position: 19
status: published

review:
  - >-
    The two workbook exercises ("Les comparaisons" and "Le futur simple") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's two
    skills, its summary rules (as corrected below), the activity examples and its
    vocabulary. Please check level, wording and every right answer before students
    see them.
  - >-
    Summary, futur simple rule 1 said you "take the whole infinitive and add the
    ending, whatever the verb group". That is wrong for verbs in -re, which drop the
    final -e (prendre → je prendrai, écrire → j'écrirai). The rule now says so, the
    endings are shown as a table (je regarderai… ils regarderont), and the irregular
    stems used in the cycle were added (aller → ir-, être → ser-, avoir → aur-, faire
    → fer-, voir → verr-, devenir → deviendr-, pouvoir → pourr-). "Le temps le plus
    facile en français" was softened to "un temps facile à former". Please confirm.
  - >-
    Summary, comparisons: "Le/la plus – le/la moins + adjectif" → "le / la / les plus
    (moins) + adjectif (+ de)". Two rules were added because the activities use them:
    "plus de / moins de + nom + que" (moins de photos que moi, plus de problèmes que de
    solutions) and "bon → meilleur" (meilleur que les réseaux actuels, les meilleurs
    arguments). The summary numbering (1, 2, 2) was fixed.
  - >-
    Activity 1 told students to write "au futur proche", but its frames are in futur
    simple (Je suivrai…, Ce post sera…, J'apprendrai…) and its examples in futur
    proche. The step now says "au futur simple (ou au futur proche)" and the three
    examples were rewritten in futur simple (Je suivrai un compte de cuisine parce que
    j'apprendrai du vocabulaire sur la nourriture…). The vote question "Quel post va
    être le plus intéressant" is kept (futur proche is correct French).
  - >-
    Corrections: warm-up "Quels nouveaux problèmes les réseaux sociaux apporteront dans
    les prochaines années ?" → "… apporteront-ils …" (inversion with a noun subject);
    Activity 4 "J(utiliserai Youtube" → "J'utiliserai YouTube"; Activity 5 "Les
    réseaux sociaux vont empirer le monde" → "vont rendre le monde pire" ("empirer"
    has no direct object); Mori "de corrige tes réponses" → "de corriger"; "Demande
    lui" → "Demande-lui".
  - >-
    Homework: the three Mori parts are written as messages the student sends to Mori.
    Part 1's questions are in futur proche in the source (Quelle application vas-tu
    utiliser…); they are kept, and the message asks Mori for answers in futur simple.
  - >-
    The "Conseils pour apprendre le français avec les réseaux sociaux" list is kept as a
    tip callout in the summary. Activity 1's optional variant (screenshot, vote) is in
    the teacher note.
  - >-
    Vocabulary: "Aussi… que – באותה מידה" → "באותה מידה… כמו"; "Amusant(e) / drôle –
    מצחיק/מהנה" → "מהנה / מצחיק" (same order as the French); "Abonné – עוקב" → "עוקב /
    מנוי". The same word list appears again in the next cycle (Réseaux sociaux : le
    passé). Please confirm.
  - >-
    Times: only Activity 2 has a time (15 minutes). The Quizlet link is kept without
    its tracking parameters (?i=…&x=…). The "Réponse de l'élève 1/2/3" lines are
    replaced by the optional answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: reseaux-sociaux-futur-classe
    title: 'Classe : Réseaux sociaux, le futur'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Réseaux sociaux : le futur'
      - id: skills
        type: cycleOverview
        skills:
          - name: Les comparaisons
            description: '*plus / moins / aussi… que, le / la plus…* : Instagram est plus populaire que Twitter.'
          - name: Le futur simple
            description: '*j’utiliserai, je publierai, ils deviendront* (et le futur proche : *je vais utiliser*)'
      - id: quizlet
        type: externalLink
        label: Réseaux sociaux (futur) sur Quizlet
        url: https://quizlet.com/il/1096731071/conversational-french-2025-reseaux-sociaux-futur-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. Je pense que les réseaux sociaux ___ (+ futur).
        example: Je m’appelle Lévanah. Je pense que les réseaux sociaux auront encore plus d’influence dans 10 ans.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup
        type: discussionQuestions
        items:
          - question: Quelle plateforme utiliseras-tu à l’avenir ? Pourquoi ?
            frame: J’utiliserai moins Facebook, car presque plus personne ne s’en sert.
          - question: Quels nouveaux problèmes les réseaux sociaux apporteront-ils dans les prochaines années ?
            frame: Ils provoqueront plus d’addiction et moins de temps passé en famille.
          - question: Quelle musique écouteras-tu sur YouTube ou Spotify après le cours ?
            frame: J’écouterai de la musique latino.
          - question: Quelle photo ou vidéo publieras-tu sur tes réseaux sociaux cette année ? Pourquoi ?
            frame: Je publierai des photos de mon chien parce qu’il est trop mignon.
          - question: Comment penses-tu que les réseaux sociaux évolueront dans dix ans ?
            frame: Ils deviendront plus rapides et proposeront davantage de vidéos.
          - question: Tu pars sur une île déserte. Comment communiqueras-tu sans internet ?
            frame: J’utiliserai le téléphone.
          - question: Que feras-tu pour utiliser les réseaux sociaux de manière plus saine à l’avenir ?
            frame: Je passerai moins de temps sur mon téléphone et plus de temps avec mes amis en personne.
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Utiliser les réseaux pour apprendre le français'
        skills: [Le futur simple, Les comparaisons]
        steps:
          - Formez des groupes de 3 ou 4.
          - Ouvre ton réseau social préféré (Instagram, TikTok, YouTube, X / Twitter).
          - Cherche une vraie publication en français sur un sujet qui t’intéresse (musique, sport, cuisine, voyages, mode, jeux vidéo, mèmes…).
          - Écris au moins trois phrases au futur simple (ou au futur proche) à partir de ce post (ci-dessous).
          - 'Partagez vos phrases en groupe et faites des comparaisons : *Mon post sera plus utile que le tien. Ton compte nous aidera plus que le mien.*'
          - Chaque groupe choisit la phrase la plus créative et la partage à la classe comme un post, avec un hashtag en français (#apprendrelefrançais, #musique, #recettes, #voyages).
        example: |-
          *Je suivrai un compte de cuisine parce que j’apprendrai du vocabulaire sur la nourriture.*
          *Cette vidéo de football sera plus amusante que le match à la télévision.*
          *À l’avenir, j’apprendrai plus de vocabulaire musical grâce à ce compte.*
      - id: act1-sentences
        type: discussionQuestions
        title: Mes phrases
        items:
          - question: Je suivrai le compte ___ parce que ___.
          - question: Ce post sera plus ___ que ___.
          - question: À l’avenir, j’apprendrai ___ grâce à ce compte.
      - id: act2
        type: classActivity
        title: 'Activité 2 : Mon meilleur profil sur les réseaux'
        skills: [Le futur simple, Les comparaisons]
        minutes: 15
        steps:
          - Crée un profil imaginaire sur la plateforme de ton choix.
          - Complète les informations ci-dessous.
          - Présente ton profil au groupe.
      - id: act2-profile
        type: discussionQuestions
        title: Mon profil
        items:
          - question: 'Plateforme : Mon profil sera sur ___ (nom de la plateforme).'
          - question: 'Mon objectif : J’utiliserai mon profil pour ___.'
            frame: trouver un emploi / trouver l’amour / rester en contact avec mes amis et ma famille / découvrir de nouvelles idées / passer le temps
          - question: 'Pourquoi cette plateforme est la meilleure : La plateforme que j’ai choisie est la meilleure parce que ___.'
          - question: 'Les trois choses les plus importantes à mon sujet : 1. ___'
          - question: 2. ___
          - question: 3. ___
      - id: act3
        type: classActivity
        title: 'Activité 3 : Le réseau social du futur (invention)'
        skills: [Les comparaisons, Le futur simple]
        steps:
          - En groupe, inventez une plateforme du futur.
          - Répondez aux trois questions ci-dessous.
          - Présentez votre réseau social à la classe.
        example: '*Notre réseau social s’appellera VisionApp. Il sera plus sûr qu’Instagram et plus rapide que TikTok.*'
      - id: act3-questions
        type: discussionQuestions
        title: Notre réseau social
        items:
          - question: Comment s’appellera votre réseau social ?
            frame: Notre réseau social s’appellera ___.
          - question: Que pourra-t-on y faire ?
            frame: On pourra ___.
          - question: En quoi sera-t-il meilleur que les réseaux actuels ?
            frame: Il sera plus ___ que ___.
      - id: act4
        type: classActivity
        title: 'Activité 4 : Ma semaine numérique du futur'
        skills: [Le futur simple, Les comparaisons]
        steps:
          - Écris trois phrases sur ta semaine numérique (ci-dessous).
          - En binômes, comparez vos phrases.
        example: |-
          *J’utiliserai YouTube plus souvent que toi.*
          *Tu partageras moins de photos que moi.*
      - id: act4-sentences
        type: discussionQuestions
        title: Ma semaine
        items:
          - question: Lundi, j’utiliserai ___.
          - question: Mercredi, je regarderai ___.
          - question: Vendredi, je partagerai ___.
      - id: act5
        type: classActivity
        title: 'Activité 5 : Débat sur le futur des réseaux sociaux'
        skills: [Le futur simple, Les comparaisons]
        steps:
          - 'La classe se divise en deux groupes. **Groupe A** : Les réseaux sociaux vont améliorer le monde. **Groupe B** : Les réseaux sociaux vont rendre le monde pire.'
          - Chaque groupe écrit trois phrases au futur (futur simple ou futur proche).
          - Chaque élève lit une phrase à voix haute.
          - 'On compare les arguments : *Instagram va être plus populaire que Facebook. Les idées du groupe A sont plus positives que celles du groupe B.*'
          - 'Vote final : quel groupe a les meilleurs arguments ?'
        example: |-
          *Groupe A : Les réseaux sociaux vont aider l’éducation.*
          *Groupe B : Les réseaux sociaux vont créer plus de problèmes que de solutions.*
      - id: act5-sentences
        type: discussionQuestions
        title: Nos arguments
        items:
          - question: Les réseaux sociaux ___.
          - question: Les réseaux sociaux ___.
          - question: Les réseaux sociaux ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Deux compétences dans ce cycle : **les comparaisons** et **le futur simple**.
          Toutes les activités pratiquent les deux. Le futur proche (*aller* + infinitif)
          est aussi accepté à l’oral. Choisis une ou deux activités selon le temps.
      - id: n-intro
        anchor: intro
        text: Donne d’abord ton propre exemple, puis interroge chaque élève.
      - id: n-warmup
        anchor: warmup
        text: Pose au moins deux questions à chaque élève. Les phrases sous chaque question sont des modèles de réponse.
      - id: n-act1
        anchor: act1
        text: >-
          Les élèves ont besoin de leur téléphone. Variante (optionnelle) : demander une
          capture d’écran du post trouvé pour travailler le vocabulaire au prochain cours,
          ou organiser un vote : *Quel post va être le plus intéressant pour apprendre le
          français ?*
      - id: n-act2
        anchor: act2
        minutes: 15
        text: Les élèves ont 15 minutes pour compléter le profil, puis le présentent.
      - id: n-act5
        anchor: act5
        text: Écris quelques arguments au tableau et fais comparer les deux groupes avant le vote final.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: reseaux-sociaux-futur-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: rules-futur
        type: ruleSummary
        skill: Le futur simple
        rules:
          - text: 'Le futur simple est facile à former : on prend **l’infinitif** et on ajoute les terminaisons **-ai, -as, -a, -ons, -ez, -ont**.'
            examples:
              - '(manger) Demain, je **mangerai** une pizza.'
              - '(publier) Je **publierai** des photos de mon chien.'
          - text: 'Les verbes en **-re** perdent le **e** final avant la terminaison.'
            examples: [prendre → je **prendrai**, écrire → j’**écrirai**]
          - text: 'Certains verbes ont un radical irrégulier : il faut les apprendre par cœur (voir le tableau).'
            examples:
              - '(aller) Demain, **j’irai** au cinéma.'
              - '(devenir) Les réseaux sociaux **deviendront** plus rapides.'
      - id: futur-table
        type: table
        caption: 'Le futur simple : utiliser'
        header: [Sujet, utiliser]
        rows:
          - [je, j’utiliserai]
          - [tu, utiliseras]
          - [il / elle / on, utilisera]
          - [nous, utiliserons]
          - [vous, utiliserez]
          - [ils / elles, utiliseront]
      - id: irregular-table
        type: table
        caption: Quelques verbes irréguliers au futur
        header: [Infinitif, Radical, Exemple]
        rows:
          - [aller, ir-, j’irai]
          - [être, ser-, je serai]
          - [avoir, aur-, j’aurai]
          - [faire, fer-, je ferai]
          - [voir, verr-, je verrai]
          - [pouvoir, pourr-, je pourrai]
          - [devenir, deviendr-, je deviendrai]
      - id: rules-futur-proche
        type: ruleSummary
        skill: Le futur proche
        rules:
          - text: 'Le **futur proche** est très utilisé à l’oral pour un projet ou une prédiction : sujet + **aller** au présent + **infinitif**.'
            examples:
              [Je vais utiliser Instagram demain., Les réseaux sociaux vont devenir plus rapides.]
      - id: aller-table
        type: table
        caption: Aller au présent
        header: [Sujet, aller]
        rows:
          - [je, vais]
          - [tu, vas]
          - [il / elle / on, va]
          - [nous, allons]
          - [vous, allez]
          - [ils / elles, vont]
      - id: rules-comparaisons
        type: ruleSummary
        skill: Les comparaisons
        rules:
          - text: '**plus / moins + adjectif + que**'
            examples:
              [Instagram est plus populaire que Twitter., Ce réseau sera moins rapide que TikTok.]
          - text: '**aussi + adjectif + que** (égalité)'
            examples: [YouTube est aussi utile que Spotify.]
          - text: '**le / la / les plus (moins) + adjectif** (+ **de**) : le superlatif. L’adjectif s’accorde.'
            examples:
              [
                TikTok est l’application la plus addictive.,
                Ce sont les réseaux les plus populaires du monde.,
              ]
          - text: 'Avec un nom : **plus de / moins de + nom + que**.'
            examples:
              [
                Tu partageras moins de photos que moi.,
                Ils vont créer plus de problèmes que de solutions.,
              ]
          - text: 'Attention : **bon → meilleur** (on ne dit pas *plus bon*).'
            examples:
              [
                Notre réseau sera meilleur que les réseaux actuels.,
                Quel groupe a les meilleurs arguments ?,
              ]
      - id: tips
        type: callout
        tone: tip
        title: Conseils pour apprendre le français avec les réseaux sociaux
        text: |-
          Suis des comptes en français sur tes centres d’intérêt (musique, cuisine, sport, mèmes…).
          Utilise des hashtags en français : #apprendrelefrançais, #recettes, #musiquefrançaise, #voyages.
          Regarde des stories ou des vidéos courtes et répète les phrases.
          Écris des commentaires simples en français.
          Compare les réseaux en français : *TikTok sera plus amusant que YouTube.*
          Enregistre les posts utiles (vocabulaire, expressions) et révise-les plus tard.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Révise les deux compétences avec le groupe et demande un nouvel exemple pour chaque règle.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: reseaux-sociaux-futur-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie un message et envoie-le. Mori va te poser des questions ; réponds à toutes.
      - id: mori-futur
        type: aiTutorPrompt
        title: 'Partie 1 : Le futur'
        message: |-
          Bonjour Mori ! Je veux pratiquer le futur. Pose-moi ces questions une par une :
          Quelle application vas-tu utiliser le moins à l’avenir ?
          Quelle musique vas-tu écouter sur YouTube ou Spotify après le cours ?
          Quelle photo ou vidéo vas-tu publier cette année ?
          Invente une phrase qui commence par « Dans le futur, je vais apprendre… ».
          Je vais répondre au futur simple. Corrige mes réponses, s’il te plaît.
      - id: mori-comparaisons
        type: aiTutorPrompt
        title: 'Partie 2 : Les comparaisons'
        message: |-
          Bonjour Mori ! Je veux pratiquer les comparaisons. Je vais :
          1. comparer deux réseaux sociaux avec « plus… que » ou « moins… que » ;
          2. dire quelle est, selon moi, la plateforme la plus utile ;
          3. comparer YouTube et TikTok.
          Corrige mes phrases, s’il te plaît.
      - id: mori-creativite
        type: aiTutorPrompt
        title: 'Partie 3 : Créativité'
        message: >-
          Bonjour Mori ! J’ai inventé un nouveau réseau social du futur. Je vais te le
          décrire et expliquer en quoi il sera meilleur que ceux d’aujourd’hui. Corrige
          mes fautes et pose-moi des questions de suivi, s’il te plaît.
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          Tu veux plus de questions ? Envoie : **S’il te plaît, pose-moi encore des questions !**
          Tu ne comprends pas une explication ? Envoie : **Peux-tu m’expliquer en hébreu, mais avec la phrase en français ?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: reseaux-sociaux-futur-pratique
    book: workbook
    title: 'Pratique : Réseaux sociaux, le futur'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Pratique les deux compétences du cycle. Chaque réponse est corrigée tout de suite, et tu peux réessayer.
      - id: ex-comparaisons
        type: activity
        activity: reseaux-sociaux-futur-comparaisons
      - id: ex-futur
        type: activity
        activity: reseaux-sociaux-futur-futur

