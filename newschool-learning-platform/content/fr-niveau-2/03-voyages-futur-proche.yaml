vocabulary:
  - slug: voyages-futur-proche
    title: Voyages et futur proche
    items: *voyages-futur-proche-words

activities:
  - slug: voyages-futur-proche-futur
    title: 'Le futur proche : je vais partir'
    minutes: 8
    items:
      - id: nous-allons
        type: multipleChoice
        prompt: Nous ___ visiter des musées.
        options:
          - { text: allons, correct: true }
          - { text: allez, feedback: '*Allez* est pour *vous*. Avec *nous*, on dit *nous allons*.' }
          - {
              text: vont,
              feedback: '*Vont* est pour *ils / elles*. Avec *nous*, on dit *nous allons*.',
            }
      - id: conjugue-aller
        type: fillBlank
        prompt: Complète avec le verbe *aller* au présent.
        text: Je ___ voyager en France. Tu ___ manger un croissant. Ils ___ acheter des souvenirs.
        blanks: [[vais], [vas], [vont]]
      - id: phrase-correcte
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - { text: Je vais dormir à l’hôtel., correct: true }
          - {
              text: Je vais dors à l’hôtel.,
              feedback: 'Après *aller*, le deuxième verbe est à l’infinitif : *je vais dormir*.',
            }
          - {
              text: Je va dormir à l’hôtel.,
              feedback: 'Avec *je*, on dit *je vais* : *Je vais dormir à l’hôtel.*',
            }
      - id: structure
        type: trueFalse
        prompt: 'Le futur proche se forme avec *aller* au présent + un infinitif : *Je vais partir.*'
        answer: true
        feedback:
          correct: 'Bravo ! *aller* au présent + infinitif : *je vais partir, nous allons visiter*.'
          incorrect: 'Si, c’est vrai : le futur proche = *aller* au présent + infinitif. *Je vais partir.*'
      - id: pronoms-aller
        type: matching
        prompt: Associe chaque pronom à la bonne forme du verbe *aller*.
        pairs:
          - [je, vais]
          - [tu, vas]
          - [il / elle, va]
          - [vous, allez]
          - [ils / elles, vont]
      - id: pleuvoir
        type: fillBlank
        prompt: 'Complète la prédiction : *aller* au présent + infinitif.'
        text: Il ___ bientôt ___ (pleuvoir).
        blanks: [[va], [pleuvoir]]
      - id: negation
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - { text: Je ne vais pas partir cet été., correct: true }
          - {
              text: Je ne vais partir pas cet été.,
              feedback: 'Au futur proche, *ne… pas* entoure le verbe *aller* : *Je ne vais pas partir.*',
            }
          - {
              text: Je vais ne partir pas cet été.,
              feedback: 'Au futur proche, *ne… pas* entoure le verbe *aller* : *Je ne vais pas partir.*',
            }
      - id: ordre-voiture
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Ils vont acheter une nouvelle voiture.

  - slug: voyages-futur-proche-projets
    title: Mes projets de voyage
    minutes: 8
    items:
      - id: vas-tu-dormir
        type: multipleChoice
        prompt: Où ___-tu dormir pendant les vacances ?
        options:
          - { text: vas, correct: true }
          - {
              text: va,
              feedback: '*Va* est pour *il / elle*. Avec *tu*, on dit *vas* : *Où vas-tu dormir ?*',
            }
          - {
              text: vais,
              feedback: '*Vais* est pour *je*. Avec *tu*, on dit *vas* : *Où vas-tu dormir ?*',
            }
      - id: agenda-ordre
        type: fillBlank
        prompt: Complète l’agenda avec *D’abord*, *Ensuite* et *Enfin*.
        text: ___, je vais prendre l’avion pour Rome. ___, je vais visiter le Colisée. ___, je vais acheter un souvenir pour ma famille.
        blanks: [[D’abord, D'abord], [Ensuite, Puis], [Enfin]]
        wordBank: [D’abord, Ensuite, Enfin]
      - id: questions-reponses
        type: matching
        prompt: Associe chaque question à sa réponse.
        pairs:
          - [Où vas-tu dormir ?, Je vais dormir dans un appartement.]
          - [Avec qui vas-tu voyager ?, Avec ma famille.]
          - [Quel moyen de transport vas-tu prendre ?, Je vais prendre le train.]
          - [Quels souvenirs vas-tu acheter ?, Des cartes postales pour mes amis.]
          - [Où vas-tu partir ?, Je vais partir en Italie.]
      - id: camarade-musees
        type: multipleChoice
        prompt: 'Ta camarade dit : *Je vais visiter des musées.* Raconte au groupe : Ma camarade ___ des musées.'
        options:
          - { text: va visiter, correct: true }
          - {
              text: vais visiter,
              feedback: '*Vais* est pour *je*. Pour *elle* (ma camarade), on dit *va visiter*.',
            }
          - {
              text: va visite,
              feedback: 'Après *aller*, le verbe est à l’infinitif : *va visiter*.',
            }
      - id: allons-nous
        type: multipleChoice
        prompt: Quel moyen de transport ___-nous prendre ?
        options:
          - { text: allons, correct: true }
          - {
              text: allez,
              feedback: '*Allez* est pour *vous*. Avec *nous*, on dit *allons* : *allons-nous*.',
            }
          - {
              text: vont,
              feedback: '*Vont* est pour *ils / elles*. Avec *nous*, on dit *allons-nous*.',
            }
      - id: prediction
        type: trueFalse
        prompt: '*Il va bientôt pleuvoir* est une prédiction au futur proche.'
        answer: true
        feedback:
          correct: 'Bravo ! On utilise aussi le futur proche pour une prédiction ou une action imminente.'
          incorrect: 'C’est vrai : *Il va bientôt pleuvoir* est une prédiction (*va* + *pleuvoir*).'
      - id: valise
        type: fillBlank
        prompt: Complète avec un mot du vocabulaire.
        text: Je vais mettre mes vêtements dans ma ___. Je ne vais pas oublier mon ___ pour prendre l’avion.
        blanks: [[valise], [passeport, billet]]
        wordBank: [valise, passeport, plage, ville]
      - id: ordre-igloos
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Nous allons dormir dans des igloos.
