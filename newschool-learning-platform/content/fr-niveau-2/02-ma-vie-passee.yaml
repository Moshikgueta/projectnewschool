vocabulary:
  - slug: ma-vie-passee
    title: Ma vie passée
    items: *ma-vie-passee-words

activities:
  - slug: ma-vie-passee-passe
    title: 'Les temps du passé : j’ai vu, je jouais'
    minutes: 8
    items:
      - id: semaine-film
        type: multipleChoice
        prompt: La semaine dernière, ___ un film.
        options:
          - { text: j’ai vu, correct: true }
          - {
              text: je voyais,
              feedback: 'Une action unique et terminée, à un moment précis : on utilise le passé composé, *j’ai vu*.',
            }
          - {
              text: je vois,
              feedback: '*Je vois* est au présent. Avec *la semaine dernière*, on dit *j’ai vu*.',
            }
      - id: rue-jouais
        type: multipleChoice
        prompt: Quand j’étais enfant, je ___ toujours avec mes amis dans la rue.
        options:
          - { text: jouais, correct: true }
          - {
              text: ai joué,
              feedback: '*Quand j’étais enfant* et *toujours* parlent d’une habitude : on utilise l’imparfait, *je jouais*.',
            }
          - {
              text: joue,
              feedback: '*Je joue* est au présent. Pour une habitude dans le passé, on dit *je jouais*.',
            }
      - id: avant-vivais
        type: fillBlank
        prompt: Complète avec le verbe *vivre* à l’imparfait.
        text: Avant, je ___ dans une autre ville.
        blanks: [[vivais]]
      - id: ecole-avions
        type: multipleChoice
        prompt: À l’école, nous ___ toujours des cours de musique.
        options:
          - { text: avions, correct: true }
          - {
              text: avons eu,
              feedback: '*Toujours* parle d’une habitude dans le passé : on utilise l’imparfait, *nous avions*.',
            }
          - {
              text: avons,
              feedback: '*Nous avons* est au présent. Pour une habitude à l’école, autrefois, on dit *nous avions*.',
            }
      - id: action-unique
        type: trueFalse
        prompt: 'Pour une action unique et terminée, on utilise l’imparfait : *Hier, je mangeais une pizza.*'
        answer: false
        feedback:
          correct: 'Bravo ! Pour une action unique et terminée, on utilise le passé composé : *Hier, j’ai mangé une pizza.*'
          incorrect: 'L’imparfait est pour les habitudes et les descriptions. Pour une action unique et terminée : *Hier, j’ai mangé une pizza.*'
      - id: participes
        type: matching
        prompt: Associe chaque verbe à son participe passé.
        pairs:
          - [boire, bu]
          - [lire, lu]
          - [voir, vu]
          - [connaître, connu]
          - [perdre, perdu]
      - id: diner-repas
        type: fillBlank
        prompt: Complète avec *dîner* au passé composé et *être* à l’imparfait.
        text: Il y a deux jours, j’___ avec mes amis. Le repas ___ délicieux.
        blanks: [[ai dîné], [était]]
      - id: ordre-quartier
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Mon quartier était très calme.

  - slug: ma-vie-passee-personnes
    title: 'Je, tu, il / elle au passé'
    minutes: 8
    items:
      - id: as-tu-mange
        type: multipleChoice
        prompt: Qu’___-tu mangé hier ?
        options:
          - { text: as, correct: true }
          - {
              text: ai,
              feedback: '*Ai* est pour *je* (j’ai). Avec *tu*, on dit *as* : *Qu’as-tu mangé ?*',
            }
          - {
              text: a,
              feedback: '*A* est pour *il / elle*. Avec *tu*, on dit *as* : *Qu’as-tu mangé ?*',
            }
      - id: ne-haifa
        type: multipleChoice
        prompt: 'Raconte au groupe : Mon camarade ___ à Haïfa.'
        options:
          - { text: est né, correct: true }
          - { text: a né, feedback: 'Le verbe *naître* se conjugue avec *être* : *il est né*.' }
          - {
              text: suis né,
              feedback: '*Suis* est pour *je*. Pour *il* (mon camarade), on dit *est né*.',
            }
      - id: elle-etudie
        type: fillBlank
        prompt: 'Raconte à la troisième personne : *J’ai étudié le français.*'
        text: Elle ___ le français.
        blanks: [[a étudié]]
      - id: tu-as-pris
        type: fillBlank
        prompt: Complète avec le verbe *prendre* au passé composé.
        text: Tu ___ un café ce matin ?
        blanks: [[as pris]]
      - id: je-il
        type: matching
        prompt: Associe la forme avec *je* à la forme avec *il*.
        pairs:
          - [j’ai bu, il a bu]
          - [je suis allé, il est allé]
          - [j’étais, il était]
          - [j’ai fait, il a fait]
          - [je jouais, il jouait]
      - id: accord-etre
        type: trueFalse
        prompt: 'Avec *être*, le participe passé s’accorde avec le sujet : *Elle est allée au cinéma.*'
        answer: true
        feedback:
          correct: 'Bravo ! *Il est allé*, mais *elle est allée* (+ e).'
          incorrect: 'Avec *être*, le participe s’accorde avec le sujet : *il est allé*, *elle est allée*.'
      - id: faisais-tu
        type: multipleChoice
        prompt: Que ___-tu quand tu étais enfant ?
        options:
          - { text: faisais, correct: true }
          - {
              text: faisait,
              feedback: '*Faisait* est pour *il / elle*. Avec *tu*, l’imparfait se termine en *-ais* : *faisais*.',
            }
          - { text: faisions, feedback: '*Faisions* est pour *nous*. Avec *tu*, on dit *faisais*.' }
      - id: ordre-basket
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Ma camarade jouait au basket.
