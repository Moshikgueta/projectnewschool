vocabulary:
  - slug: television-et-films
    title: Télévision et films
    items: *television-et-films-words

activities:
  - slug: television-et-films-temps
    title: 'Présent, passé et futur : je regarde, j’ai regardé, je vais regarder'
    minutes: 8
    items:
      - id: ai-vu
        type: multipleChoice
        prompt: Hier, ___ Titanic au cinéma.
        options:
          - { text: j’ai vu, correct: true }
          - {
              text: je vois,
              feedback: '*Je vois* est au présent. Avec *hier*, on utilise le passé composé : *j’ai vu*.',
            }
          - {
              text: je vais voir,
              feedback: '*Je vais voir* est au futur proche. Avec *hier*, on utilise le passé composé : *j’ai vu*.',
            }
      - id: regardais
        type: multipleChoice
        prompt: Quand j’étais enfant, ___ Toy Story très souvent.
        options:
          - { text: je regardais, correct: true }
          - {
              text: j’ai regardé,
              feedback: '*Très souvent* et *quand j’étais enfant* parlent d’une habitude : on utilise l’imparfait, *je regardais*.',
            }
          - {
              text: je regarderai,
              feedback: '*Regarderai* est au futur simple. Pour une habitude dans le passé : *je regardais*.',
            }
      - id: vais
        type: fillBlank
        prompt: Complète avec le verbe *aller* (futur proche).
        text: Ce week-end, je ___ regarder une comédie.
        blanks: [[vais]]
      - id: allee
        type: fillBlank
        prompt: Complète avec le participe passé du verbe *aller*.
        text: Hier, ma sœur est ___ au cinéma.
        blanks: [[allée]]
      - id: noms-temps
        type: matching
        prompt: Associe chaque forme à son temps.
        pairs:
          - [je regarde, présent]
          - [j’ai regardé, passé composé]
          - [je regardais, imparfait]
          - [je vais regarder, futur proche]
          - [je regarderai, futur simple]
      - id: etre-aller
        type: trueFalse
        prompt: 'Au passé composé, *aller* se conjugue avec *être* : je suis allé(e).'
        answer: true
        feedback:
          correct: 'Bravo ! *Je suis allé(e), elle est allée, nous sommes allé(e)s.*'
          incorrect: '*Aller* se conjugue avec *être* au passé composé : *je suis allé(e)*.'
      - id: partiront
        type: fillBlank
        prompt: Complète avec le verbe *partir* au futur simple.
        text: Ils ___ en vacances en juillet.
        blanks: [[partiront]]
      - id: jouions
        type: fillBlank
        prompt: Complète avec le verbe *jouer* à l’imparfait.
        text: Quand nous étions petits, nous ___ au foot tous les samedis.
        blanks: [[jouions]]

  - slug: television-et-films-narration
    title: Raconter avec tous les temps
    minutes: 8
    items:
      - id: camarade
        type: multipleChoice
        prompt: 'Ton camarade dit : *J’ai vu Titanic.* Tu le présentes à la classe : Mon camarade ___ Titanic.'
        options:
          - { text: a vu, correct: true }
          - { text: ai vu, feedback: '*Ai vu* est pour *je*. Pour ton camarade (il) : *il a vu*.' }
          - { text: as vu, feedback: '*As vu* est pour *tu*. Pour ton camarade (il) : *il a vu*.' }
      - id: etait
        type: multipleChoice
        prompt: Un grand bateau a voyagé puis il a coulé. ___ très triste.
        options:
          - { text: C’était, correct: true }
          - {
              text: C’est,
              feedback: 'L’histoire est au passé. Pour la description, on utilise l’imparfait : *c’était*.',
            }
          - {
              text: Ce sera,
              feedback: '*Ce sera* est au futur. Pour décrire au passé, on utilise l’imparfait : *c’était*.',
            }
      - id: scenario
        type: fillBlank
        prompt: Complète l’histoire avec *est*, *achète* ou *va*.
        text: Hier, Pierre ___ allé au cinéma. Maintenant, il ___ du pop-corn. Demain, il ___ regarder un autre film.
        blanks: [[est], [achète], [va]]
        wordBank: [est, achète, va]
      - id: jack
        type: multipleChoice
        prompt: Dans notre version de Titanic, Jack ___ survivre et voyager en Amérique avec Rose.
        options:
          - { text: va, correct: true }
          - {
              text: a,
              feedback: 'Pour une fin au futur, on utilise *aller* + infinitif : *Jack va survivre*.',
            }
          - { text: vais, feedback: '*Vais* est pour *je*. Avec *Jack* (il) : *il va survivre*.' }
      - id: pc-imparfait
        type: trueFalse
        prompt: 'Pour raconter un film au passé, on utilise le passé composé pour les actions et l’imparfait pour les descriptions.'
        answer: true
        feedback:
          correct: 'Bravo ! *Le bateau a coulé* (action). *C’était très triste* (description).'
          incorrect: 'C’est vrai : *le bateau a coulé* (action, passé composé), *c’était très triste* (description, imparfait).'
      - id: questions-reponses
        type: matching
        prompt: Associe chaque question à sa réponse.
        pairs:
          - [Quel film as-tu vu ?, J’ai vu Titanic.]
          - [Où l’as-tu vu ?, Au cinéma.]
          - [Avec qui l’as-tu vu ?, Avec ma sœur.]
          - [Que s’est-il passé ?, Le bateau a coulé.]
          - [Tu as aimé ?, 'Oui, c’était très beau.']
      - id: ordre-pierre
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Hier, Pierre est allé au cinéma.
      - id: mon-film
        type: shortAnswer
        prompt: Raconte le dernier film que tu as vu en deux ou trois phrases (passé composé et imparfait).
