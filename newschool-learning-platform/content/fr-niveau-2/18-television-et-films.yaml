# Cycle "Télévision et films", converted from the French level 2 digital notebook
# ("Cahier digital 2025 - français niveau 2", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-2
slug: television-et-films
title: Télévision et films
goal: Utiliser le présent, le passé et le futur, et raconter une histoire avec ces temps.
position: 18
status: in_review

review:
  - >-
    The two workbook exercises ("Présent, passé et futur" and "Raconter avec tous les
    temps") are NEW: the notebook has no self-study exercises. They were written from
    the cycle's two skills, its summary rules, the activity examples and its
    vocabulary. Please check level, wording and every right answer before students
    see them.
  - >-
    Summary, passé composé tip: "On utilise être avec les verbes de mouvement et les
    verbes pronominaux" is too broad (marcher, courir, voyager, nager take avoir). The
    rule now says: être with a short list of verbs (aller, venir, arriver, partir,
    entrer, sortir, monter, descendre, tomber, rester, naître, mourir, devenir,
    retourner…) and with pronominal verbs; avoir with all other verbs; with être the
    participle agrees with the subject (elle est allée). A NEW table shows voir /
    regarder / aller in the five tenses of the cycle. Please confirm.
  - >-
    Summary, imparfait: the rule (stem of "nous" in the present + -ais, -ais, -ait,
    -ions, -iez, -aient) is correct; the exception être → j'étais was added. Futur
    simple: "Radical du verbe" is explained (the infinitive; -re verbs drop the -e;
    irregular verbs such as être → je serai, avoir → j'aurai, aller → j'irai, voir →
    je verrai). A rule on when to use passé composé (actions) vs imparfait
    (description, habit) in a story was added for skill 2 ("narration"), which has no
    rule of its own in the source.
  - >-
    Corrections: title "Télévision et films 2" → "Télévision et films"; Activity 1
    model "La dernière série que j'ai vu était Lupin" → "que j'ai vue" (agreement of
    the participle with "que" = la série, placed before avoir); warm-up future 4 model
    "Je vais la regarder" → frame "Je vais le / la regarder" (film is masculine);
    Activity 3 "Sacha et Anna" → "Sacha et Annie" (the character in Extra en français
    is Annie; please check). The number emojis (1️⃣…) and stray "**" / "&#10;"
    markup were removed.
  - >-
    Activity 3: the YouTube link (Extra en français, episode 1) is kept without its
    "&t=25s" start time (the activity watches 0:00–4:00). The source says the
    questions are adapted to "A2 bas ou haut" but gives only one list; it is kept as
    one list. Answers are not in the source. Activity 4: the Ratatouille trailer link
    is kept without "&t=9s". The source says "répondre à des questions au futur" but
    gives no questions; four guiding questions in the futur proche were WRITTEN from
    the example (Rémy, Paris, rêve, talent). Please check.
  - >-
    Activity 2 says "6 questions" but lists 11; the step now says to choose 6. The
    source has no class plan and 8 activities; the plan note maps them to the two
    skills and suggests choosing 2 or 3. Film titles are kept as in the source (Les
    Avengers, Vice-Versa 2, Stranger Things, Friends, Pretty Woman…).
  - >-
    Times given as ranges are recorded as the upper value: Activity 1 "5–7 min" → 7,
    Activity 3 "7–8 min" → 8 (total 3 + 5 + 8 = 16). The "Réponse de l'élève 1/2/3"
    lines are removed (answer boxes). The Quizlet link is kept without its "?i=…&x=…"
    tracking parameters.
  - >-
    Vocabulary: "Opinion" appears twice; kept once. "Raconter" and "Narrer, raconter"
    → "raconter – לספר" and "narrer – לספר סיפור / לגולל". "Argument – עלילה" →
    "intrigue / argument – עלילה" (intrigue is the usual word for a plot). "Action –
    פעולה" → "action (film d'action) – אקשן / פעולה"; "Préféré – מועדף" → "אהוב /
    מועדף"; "Regarder – לצפות" → "לצפות / להסתכל". Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: television-et-films-classe
    title: 'Classe : Télévision et films'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Télévision et films
      - id: skills
        type: cycleOverview
        skills:
          - name: 'Les temps de l’indicatif : présent, passé, futur'
            description: '*je regarde, j’ai regardé, je regardais, je vais regarder, je regarderai*'
          - name: Raconter avec ces différents temps
            description: '*Hier, Pierre est allé au cinéma. Maintenant, il achète du pop-corn. Demain, il va regarder un autre film.*'
      - id: quizlet
        type: externalLink
        label: Télévision et films sur Quizlet
        url: https://quizlet.com/il/1083674417/conversational-french-2025-television-et-films-2-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. Quand j’étais enfant, mon film préféré était ___. Aujourd’hui, mon film préféré est ___.
        example: Je m’appelle Lévanah. Quand j’étais enfant, mon film préféré était Aladdin. Aujourd’hui, mon film préféré est Pretty Woman.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup-passe
        type: discussionQuestions
        title: Passé (passé composé + imparfait)
        items:
          - question: Quel film regardais-tu souvent quand tu étais enfant ?
            frame: Quand j’étais enfant, je regardais ___ très souvent.
          - question: Quel a été le premier film que tu as vu au cinéma ?
            frame: Le premier film que j’ai vu au cinéma était ___.
          - question: Quelle a été la dernière série que tu as regardée ?
            frame: La dernière série que j’ai regardée était ___.
          - question: Avec qui as-tu regardé ce film ou cette série ?
            frame: Je l’ai regardé(e) avec ___.
          - question: Es-tu allé(e) au cinéma le mois dernier ? Quel film as-tu vu ?
            frame: Oui, je suis allé(e) au cinéma et j’ai vu ___. / Non, je ne suis pas allé(e) au cinéma.
          - question: Quelle émission de télévision regardais-tu quand tu étais adolescent(e) ?
            frame: Quand j’étais adolescent(e), je regardais ___.
          - question: Quel film as-tu vu plusieurs fois par le passé ?
            frame: J’ai vu ___ plusieurs fois.
      - id: warmup-futur
        type: discussionQuestions
        title: Futur
        items:
          - question: Quel film vas-tu regarder cette semaine ?
            frame: Je vais regarder ___ cette semaine.
          - question: Vas-tu aller au cinéma le week-end prochain ? Quel film vas-tu voir ?
            frame: Oui, je vais aller au cinéma et je vais voir ___.
          - question: Vas-tu bientôt regarder une nouvelle série ? Laquelle ?
            frame: Oui, je vais regarder ___.
          - question: Avec qui vas-tu regarder ton prochain film ou ta prochaine série ?
            frame: Je vais le / la regarder avec ___.
          - question: Quels en-cas vas-tu manger lors de ta prochaine soirée cinéma ?
            frame: Je vais manger ___.
          - question: Vas-tu regarder un film dans une autre langue à l’avenir ? Lequel ?
            frame: Oui, je vais regarder un film en ___.
          - question: Quel genre de film vas-tu choisir la prochaine fois (comédie, action, horreur…) ?
            frame: Je vais choisir ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Mon dernier film (passé)'
        skills:
          [Raconter avec ces différents temps, 'Les temps de l’indicatif : présent, passé, futur']
        steps:
          - Écris **5 phrases au passé** sur le dernier film ou la dernière série que tu as regardé(e). Utilise les questions guides (7 minutes).
          - 'En binômes, posez-vous les questions et répondez. Ajoutez 2 questions d’opinion : *Quel a été ton moment préféré ? Qu’as-tu appris de cette série ?*'
          - Présente le film de ton / ta partenaire à la classe, à la **troisième personne**.
        example: |-
          *La dernière série que j’ai vue était Lupin. Je l’ai regardée à la maison avec ma sœur. L’histoire parlait d’un voleur. L’histoire était amusante et l’acteur excellent. J’ai beaucoup aimé parce que c’était intéressant.*
          A : *Quel a été le dernier film que tu as vu ?* — B : *J’ai vu Titanic au cinéma.*
          A : *Que s’est-il passé dans l’histoire ?* — B : *Un grand bateau a voyagé puis il a coulé. C’était très triste.*
          *Mon camarade a vu Titanic. Il l’a vu au cinéma avec sa famille. L’histoire était très triste et il a beaucoup aimé.*
      - id: act1-questions
        type: discussionQuestions
        title: Questions guides
        items:
          - question: Quel film ou série as-tu regardé(e) ?
            frame: La dernière série / Le dernier film que j’ai vu(e) était ___.
          - question: Où l’as-tu regardé(e) ?
            frame: Je l’ai regardé(e) ___.
          - question: Avec qui l’as-tu regardé(e) ?
            frame: Je l’ai regardé(e) avec ___.
          - question: Que s’est-il passé dans l’histoire ? (2 ou 3 phrases simples)
          - question: Tu as aimé ce film / cette série ? Pourquoi ?
            frame: J’ai aimé / Je n’ai pas aimé parce que c’était ___.
      - id: act2
        type: classActivity
        title: 'Activité 2 : Préparer une soirée cinéma (futur)'
        skills: ['Les temps de l’indicatif : présent, passé, futur']
        steps:
          - En petits groupes, planifiez une soirée cinéma. Choisissez **6 questions** guides et répondez au futur.
          - Organisez vos réponses dans un petit texte et lisez-le à la classe.
        example: '*Vendredi soir, nous allons regarder Harry Potter chez Pierre. Nous allons inviter nos amis de l’école. Nous allons manger de la pizza et de la glace, et boire des sodas. Tout le monde portera un pyjama. Après le film, nous allons danser. Les invités apporteront du pop-corn et des coussins. Nous allons décorer la salle avec des guirlandes lumineuses.*'
      - id: act2-questions
        type: discussionQuestions
        title: Questions guides
        items:
          - question: Quel film allez-vous regarder ?
          - question: Où allez-vous le regarder ? (cinéma, maison, plein air…)
          - question: Quand aura lieu la soirée cinéma ? (jour et heure)
          - question: Avec qui allez-vous le regarder ?
          - question: Qui allez-vous inviter ?
          - question: Que mangerez-vous et que boirez-vous ?
          - question: Quelle tenue allez-vous porter ? (pyjama, élégante, normale)
          - question: Quelle musique écouterez-vous avant ou après le film ?
          - question: Que ferez-vous après le film ?
          - question: Que vont apporter les invités ?
          - question: Comment allez-vous décorer l’endroit ?
      - id: act3
        type: classActivity
        title: 'Activité 3 : Analyser une scène (passé)'
        skills: [Raconter avec ces différents temps]
        minutes: 16
        steps:
          - 'Introduction (3 minutes) : « Avez-vous déjà accueilli un visiteur étranger ? Était-ce facile ou difficile de communiquer ? »'
          - 'Visionnage (5 minutes) : regarde la vidéo de 0:00 à 4:00 avec les sous-titres en français. Essaie de comprendre 2 éléments principaux.'
          - 'Compréhension (8 minutes) : réponds aux questions ci-dessous avec des phrases complètes au passé.'
        resource:
          label: Extra en français, épisode 1
          url: https://www.youtube.com/watch?v=EaNqp4FXh-s
      - id: act3-questions
        type: discussionQuestions
        title: Compréhension
        items:
          - question: Quelles lettres Sacha a-t-elle reçues ?
          - question: Qui est arrivé dans l’appartement ?
          - question: D’où vient Sam ?
          - question: Quel problème avait-il avec le français ?
          - question: Comment Sacha et Annie ont-elles réagi ?
      - id: act4
        type: classActivity
        title: 'Activité 4 : Analyser la bande-annonce de Ratatouille (futur)'
        skills:
          ['Les temps de l’indicatif : présent, passé, futur', Raconter avec ces différents temps]
        steps:
          - Regarde la bande-annonce sans sous-titres.
          - Réponds aux questions au futur avec *aller* au présent + infinitif.
          - Ensemble, construisez un petit texte au tableau.
          - Lisez le texte à tour de rôle.
        example: '*Rémy arrive à Paris, la ville des meilleurs chefs au monde. Il va réaliser son rêve et cuisiner. Son talent va être reconnu.*'
        resource:
          label: Bande-annonce officielle de Ratatouille
          url: https://www.youtube.com/watch?v=KpiDM6I4x_Q
      - id: act4-questions
        type: discussionQuestions
        title: Questions au futur
        items:
          - question: Où va aller Rémy ?
            frame: Rémy va aller ___.
          - question: Quel est son rêve ? Va-t-il le réaliser ?
            frame: Il va ___.
          - question: Que va-t-il faire à Paris ?
            frame: Il va ___.
          - question: Que va-t-il se passer avec son talent ?
            frame: Son talent va ___.
      - id: act5
        type: classActivity
        title: 'Activité 5 : La meilleure ou la pire expérience cinéma (passé)'
        skills: [Raconter avec ces différents temps]
        steps:
          - Décris **la meilleure ou la pire expérience cinéma** de ta vie. Réponds aux questions ci-dessous.
        example: '*J’ai vu Titanic au cinéma avec ma sœur. Le bateau a coulé et c’était très triste, mais j’ai beaucoup aimé.*'
      - id: act5-questions
        type: discussionQuestions
        items:
          - question: Quel film as-tu vu ?
          - question: Où l’as-tu vu ?
          - question: Avec qui ?
          - question: Que s’est-il passé dans l’histoire ?
          - question: Pourquoi était-ce la meilleure ou la pire expérience ?
      - id: act6
        type: classActivity
        title: 'Activité 6 : Inventer un film (futur)'
        skills: ['Les temps de l’indicatif : présent, passé, futur']
        steps:
          - En groupes, imaginez un film qui « va sortir » la semaine prochaine.
          - Répondez aux questions ci-dessous et présentez votre film.
      - id: act6-questions
        type: discussionQuestions
        title: Notre film
        items:
          - question: Quel sera le titre ?
            frame: Le titre sera ___.
          - question: Quel sera le genre ?
            frame: Ce sera ___.
          - question: Que va-t-il se passer ?
          - question: Qui seront les personnages principaux ?
            frame: Les personnages principaux seront ___.
          - question: Que va faire le public après l’avoir vu ?
      - id: act7
        type: classActivity
        title: 'Activité 7 : Réécrire la fin d’un film (passé + futur)'
        skills: [Raconter avec ces différents temps]
        steps:
          - Chaque groupe reçoit un film connu.
          - Résumez l’histoire originale **au passé**.
          - Proposez une fin différente **au futur**.
        example: '*Dans Titanic, le bateau a coulé et Jack est mort. Dans notre version, Jack va survivre et voyager en Amérique avec Rose.*'
      - id: act8
        type: classActivity
        title: 'Activité 8 : Écrire un scénario collectif (passé + présent + futur)'
        skills:
          [Raconter avec ces différents temps, 'Les temps de l’indicatif : présent, passé, futur']
        steps:
          - Le professeur commence l’histoire.
          - 'Chacun à son tour, continue l’histoire en changeant de temps : passé → présent → futur.'
        example: |-
          Élève 1 : *Hier, Pierre est allé au cinéma avec ses amis.*
          Élève 2 : *Maintenant, il achète du pop-corn.*
          Élève 3 : *Demain, il va regarder un autre film avec sa famille.*
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Deux compétences dans ce cycle : **les temps de l’indicatif** (présent, passé
          composé, imparfait, futur proche, futur simple : questions d’échauffement,
          activités 2, 4 et 6) et **raconter avec ces temps** (activités 1, 3, 5, 7 et 8).
          Choisis 2 ou 3 activités selon le temps.
      - id: n-intro
        anchor: intro
        text: Donne d’abord ton propre exemple, puis interroge chaque élève.
      - id: n-warmup
        anchor: warmup-title
        text: Pose au moins deux questions à chaque élève (passé et futur). Les réponses écrites ici apparaissent sous chaque question.
      - id: n-act1
        anchor: act1
        minutes: 7
        text: >-
          Production individuelle : 7 minutes. Ensuite, entretien en binômes, puis chaque
          élève présente le film de son partenaire à la troisième personne (*Mon camarade
          a vu…*). Fais attention au passé composé (actions) et à l’imparfait
          (description : *c’était, l’histoire parlait de…*).
      - id: n-act3
        anchor: act3
        minutes: 16
        text: >-
          Introduction : 3 minutes. Visionnage : 5 minutes. Compréhension guidée : 8
          minutes. Adapte les questions au niveau du groupe (A2 bas ou haut) : réponses
          courtes ou réponses plus longues avec des descriptions à l’imparfait.
      - id: n-act4
        anchor: act4
        text: Regarde la bande-annonce sans sous-titres. Écris ensuite au tableau le texte collectif avec les réponses des élèves.
      - id: n-act8
        anchor: act8
        text: Commence l’histoire avec « Hier, Pierre est allé au cinéma avec ses amis. » Chaque élève continue en changeant de temps.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: television-et-films-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: rules-temps
        type: ruleSummary
        skill: 'Les temps de l’indicatif : présent, passé, futur'
        rules:
          - text: '**Présent** : pour une action qui se passe **en ce moment**, pour les habitudes et les vérités générales. On conjugue le verbe au présent ; attention aux terminaisons des différents groupes.'
            examples: [Je parle français., Nous mangeons à midi.]
          - text: '**Passé composé** : pour raconter une action **terminée dans le passé**. **Avoir** ou **être** au présent + participe passé.'
            examples: [J’ai mangé., Elle est allée au cinéma.]
          - text: 'On utilise **être** avec quelques verbes (*aller, venir, arriver, partir, entrer, sortir, monter, descendre, tomber, rester, naître, mourir, devenir, retourner*…) et avec les verbes pronominaux. Avec **être**, le participe s’accorde avec le sujet. Tous les autres verbes utilisent **avoir**.'
            examples:
              [Elle est allée au cinéma., Nous nous sommes amusés., J’ai marché. / J’ai voyagé.]
          - text: '**Imparfait** : pour une **habitude** dans le passé, un contexte ou une description. Radical du verbe à *nous* au présent + **-ais, -ais, -ait, -ions, -iez, -aient**. Exception : *être → j’étais*.'
            examples:
              [nous jouons → je jouais, 'Quand j’étais petit, je jouais au foot tous les samedis.']
          - text: '**Futur proche** : pour une action qui va se passer **bientôt**. **Aller** au présent + infinitif.'
            examples: [Je vais manger., Nous allons partir demain.]
          - text: '**Futur simple** : pour une action **dans le futur**, souvent moins immédiate. Infinitif (sans le *e* final pour les verbes en *-re*) + **-ai, -as, -a, -ons, -ez, -ont**. Quelques verbes sont irréguliers : *être → je serai, avoir → j’aurai, aller → j’irai, voir → je verrai*.'
            examples: [Je parlerai français un jour., Ils partiront en vacances en juillet.]
      - id: temps-table
        type: table
        caption: Les temps du cycle
        header: [Temps, regarder, voir, aller]
        rows:
          - [Présent, je regarde, je vois, je vais]
          - [Passé composé, j’ai regardé, j’ai vu, je suis allé(e)]
          - [Imparfait, je regardais, je voyais, j’allais]
          - [Futur proche, je vais regarder, je vais voir, je vais aller]
          - [Futur simple, je regarderai, je verrai, j’irai]
      - id: rules-raconter
        type: ruleSummary
        skill: Raconter avec ces différents temps
        rules:
          - text: 'Pour raconter un film au passé, on utilise le **passé composé** pour les actions (ce qui s’est passé) et l’**imparfait** pour la description (comment c’était).'
            examples:
              [
                'Un grand bateau a voyagé puis il a coulé. C’était très triste.',
                L’histoire parlait d’un voleur.,
              ]
          - text: 'Les mots de temps aident à choisir le temps : *hier, le mois dernier* → passé ; *maintenant* → présent ; *demain, la semaine prochaine* → futur.'
            examples:
              - 'Hier, Pierre est allé au cinéma. Maintenant, il achète du pop-corn. Demain, il va regarder un autre film.'
          - text: 'Pour présenter le film d’un camarade, on utilise la **troisième personne**.'
            examples: [Mon camarade a vu Titanic. Il l’a vu au cinéma avec sa famille.]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Révise les deux compétences avec le groupe et demande un nouvel exemple pour chaque temps.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: television-et-films-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie un message et envoie-le. Mori va te poser des questions ; réponds à toutes.
      - id: mori-passe
        type: aiTutorPrompt
        title: 'Passé : raconter le dernier film ou la dernière série vu(e)'
        message: Mori, pose-moi des questions pour écrire 5 phrases au passé sur le dernier film ou la dernière série que j’ai vu(e).
      - id: mori-present
        type: aiTutorPrompt
        title: 'Présent : parler de mes goûts actuels'
        message: Mori, pose-moi des questions sur mes goûts actuels en matière de films et de séries au présent.
      - id: mori-futur
        type: aiTutorPrompt
        title: 'Futur : planifier une soirée cinéma'
        message: Mori, pose-moi des questions pour imaginer une soirée cinéma dans le futur et aide-moi à répondre en utilisant « aller + infinitif ».
      - id: mori-opinion
        type: aiTutorPrompt
        title: 'Opinion et comparaison : mes préférences cinéma'
        message: 'Mori, pose-moi des questions sur le meilleur et le pire film que j’ai vus, et aussi sur ma préférence : regarder des films à la maison ou au cinéma.'
      - id: mori-creativite
        type: aiTutorPrompt
        title: 'Créativité : inventer un film'
        message: 'Mori, pose-moi des questions pour inventer un nouveau film au futur : titre, genre, histoire et personnages principaux.'
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          Tu veux plus de questions ? Envoie : **S’il te plaît, pose-moi encore des questions !**
          Tu ne comprends pas une explication ? Envoie : **Peux-tu m’expliquer en hébreu, mais avec la phrase en français ?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: television-et-films-pratique
    book: workbook
    title: 'Pratique : Télévision et films'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Pratique les deux compétences du cycle. Chaque réponse est corrigée tout de suite, et tu peux réessayer.
      - id: ex-temps
        type: activity
        activity: television-et-films-temps
      - id: ex-narration
        type: activity
        activity: television-et-films-narration

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: television-et-films-vocabulaire
