# Cycle "Projets et objectifs - futur", converted from the French level 2 digital notebook
# ("Cahier digital 2025 - français niveau 2", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-2
slug: projets-et-objectifs-futur
title: Projets et objectifs (futur)
goal: Parler de ses objectifs au futur simple et exprimer des souhaits au conditionnel présent.
position: 12
status: in_review

review:
  - >-
    The two workbook exercises ("Le futur simple" and "Le conditionnel présent") are
    NEW: the notebook has no self-study exercises. They were written from the cycle's
    two skills, its summary rules, the activity examples and its vocabulary. Please
    check level, wording and every right answer before students see them.
  - >-
    Summary, futur simple, rule 1 said to take "tout le verbe à l'infinitif" and add
    the endings. For verbs in -re the final -e is dropped (prendre → je prendrai); this
    was added. Rule 2 ("certains verbes doivent être appris par cœur") gave only
    aller → j'irai; a short list of the common irregular stems was added (être, avoir,
    faire, venir, pouvoir, voir, vouloir), because the warm-up uses ferez, sera, etc.
    The futur proche rule (aller au présent + infinitif) is correct and kept.
  - >-
    Summary, conditionnel: the formation was written in Hebrew ("imparfait צורת הפועל
    בזמן עתיד + סיומות") and the uses were repeated in Hebrew. Rewritten in French:
    radical du futur + terminaisons de l'imparfait, with irregular examples (je
    serais, j'aurais, je ferais, j'irais). Table header "Prendr~~e~~" → "Prendre";
    "il parlerait" rows → "il / elle".
  - >-
    The conditionnel is used only in the intro round (J'aimerais…) and in Activity 3,
    step 2 (Comment seriez-vous ?). The homework questions use the futur proche, as in
    the source. Please check the plan; no mapping of activities to skills is given.
  - >-
    Corrections: warm-up "Qui célèbrera votre réussite… célèbrera / célèbreront mon
    objectif" → "… célèbrera / célèbreront ma réussite" (the 1990 spelling célèbrera
    is kept; célébrera is also correct); "Où feras-tu la fête ?" → "Où ferez-vous la
    fête ?" (the other questions use vous); Activity 1 frame "Le (date/jour) je ……"
    → "Le ___ (date), je ___."; Activity 2 "le groupe 1 imaginerai pour le groupe 2"
    → "imaginera une invention pour"; Activity 2 example "Nous allons créer un
    "Polar Explorer Penguin Drone"" (English name) → "Nous créerons un « drone
    pingouin explorateur polaire »" (futur simple, like the format); Activity 3 letter
    "Vous seras entouré de" → "Tu seras entouré(e) de", "Tu t'assureras ___" → "Tu
    t'assureras de ___", "Tu te souviendras ___" → "Tu te souviendras de ___";
    homework reading "Je suis excité(e) pour cette aventure" (anglicism) → "J'ai
    hâte de vivre cette aventure" and the question adapted.
  - >-
    Vocabulary: same list as cycle 11 in the source, with the same fixes:
    "Objectif" and "Atteindre" appeared twice; now "but / objectif – מטרה", "cible –
    יעד", "atteindre – להשיג", "réussir – להצליח", "parvenir à – להגיע"; "Volontaire"
    → "bénévole / volontaire"; "Créer / Établir" → "créer – ליצור", "établir / fonder
    – להקים". Please confirm, and consider giving this cycle future-related words.
  - >-
    The notebook gives no times, so no minutes are set (Activity 2's 5-minute
    presentation is kept in the steps). The Quizlet link is kept without its
    "?i=…&x=…" parameters. The "Réponse de l'élève 1/2/3" lines are replaced by the
    answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: projets-et-objectifs-futur-classe
    title: 'Classe : Projets et objectifs (futur)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Projets et objectifs (futur)
      - id: skills
        type: cycleOverview
        skills:
          - name: Le futur simple
            description: '*je parlerai, tu finiras, nous ferons* (et le futur proche : *je vais parler*)'
          - name: Le conditionnel présent
            description: 'Les souhaits et les hypothèses : *j’aimerais, je serais, nous voyagerions*'
      - id: quizlet
        type: externalLink
        label: Projets et objectifs (futur) sur Quizlet
        url: https://quizlet.com/il/1094947780/conversational-french-2025-projets-et-objectifs-futur-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. J’aimerais ___ parce que ___.
        example: Je m’appelle Lévanah. J’aimerais devenir auteure parce que j’adore la littérature.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup
        type: discussionQuestions
        items:
          - question: Quel est votre objectif ? Que ferez-vous lorsque votre objectif se réalisera ?
            frame: Mon objectif est ___. Lorsque mon objectif se réalisera, je ___.
          - question: Que ferez-vous pour réussir à atteindre votre objectif ?
            frame: Pour atteindre mon objectif, je ___.
          - question: Comment vous sentirez-vous lorsque votre objectif sera atteint ?
            frame: Je me sentirai ___ lorsque j’atteindrai mon objectif.
          - question: Que ferez-vous après avoir atteint votre objectif ?
            frame: Je ___ après avoir atteint mon objectif.
          - question: Qui célèbrera votre réussite avec vous ?
            frame: Mon / Ma / Mes ___ célèbrera / célèbreront ma réussite avec moi.
          - question: Où ferez-vous la fête ?
            frame: Nous ferons la fête ___, nous mangerons ___ et nous boirons ___.
      - id: warmup-examples
        type: callout
        tone: info
        title: Exemples
        text: |-
          *Mon objectif est de parler couramment français. Lorsque mon objectif se réalisera, je visiterai tous les pays francophones.*
          *Je me sentirai heureux lorsque j’atteindrai mon objectif.*
          *Je ferai la fête avec mes amis après avoir atteint mon objectif.*
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Ma vision vers mon objectif'
        skills: [Le futur simple]
        steps:
          - Écris une liste de 10 étapes que tu suivras pour atteindre ton objectif.
          - Chaque étape doit avoir une date de début.
          - Présente ta liste au groupe.
        example: |-
          **Objectif : Apprendre à jouer de la guitare.**
          1. Je commencerai à apprendre les accords de base et la technique du grattage (le 10 janvier).
          2. Je pratiquerai les accords 15 minutes par jour (du 11 au 25 janvier).
          3. J’apprendrai une chanson simple avec les accords de base (du 26 au 31 janvier).
          4. J’achèterai un livre pour débutants ou je téléchargerai une application pour des cours structurés (le 1er février).
          5. Je passerai 30 minutes deux fois par semaine à faire des exercices avec les doigts (du 2 au 28 février).
          6. J’enregistrerai mes progrès pour voir comment m’améliorer (du 1er au 15 mars).
          7. J’apprendrai à lire les tablatures de guitare de base (du 16 au 30 mars).
          8. Je jouerai deux chansons sans m’arrêter et avec des transitions douces (du 1er au 15 avril).
          9. Je rejoindrai un groupe de guitare ou je discuterai en ligne avec d’autres guitaristes pour avoir de l’aide et du soutien (du 16 au 30 avril).
          10. Je jouerai ma première mini-performance pour mes amis et ma famille ! (le 1er mai)
      - id: act1-list
        type: discussionQuestions
        title: Mes 10 étapes
        items:
          - question: 'Objectif : ___'
          - question: 1. Le ___ (date), je ___.
          - question: 2. ___
          - question: 3. ___
          - question: 4. ___
          - question: 5. ___
          - question: 6. ___
          - question: 7. ___
          - question: 8. ___
          - question: 9. ___
          - question: 10. Je l’ai fait !
      - id: act2
        type: classActivity
        title: 'Activité 2 : Mon cadeau pour t’aider avec ton objectif'
        skills: [Le futur simple]
        steps:
          - Formez des groupes avec des objectifs semblables.
          - Chaque groupe imagine une invention pour l’autre groupe (le groupe 1 pour le groupe 2, et le groupe 2 pour le groupe 1).
          - Présentez l’invention en 5 minutes. Expliquez comment elle aidera l’autre groupe à atteindre son objectif.
        example: |-
          **Objectif :** voyager en Alaska
          **Invention :** *Nous créerons un « drone pingouin explorateur polaire » : un robot pingouin volant qui vous aidera à préparer votre voyage, qui vous rappellera d’emporter des vêtements chauds et qui vous proposera des endroits à visiter.*
      - id: act2-frame
        type: discussionQuestions
        title: Notre invention
        items:
          - question: Nous créerons un / une ___.
          - question: Cela vous aidera à ___.
          - question: Mais surtout, cela vous aidera à ___.
      - id: act3
        type: classActivity
        title: 'Activité 3 : Visualiser ma vision'
        skills: [Le conditionnel présent, Le futur simple]
        steps:
          - 'Étape 1 (facultative) : Ton professeur te guide dans une visualisation.'
          - 'Étape 2 : Imagine que tu es déjà cette version future de toi-même. Comment serais-tu ? Comment parlerais-tu ? Que ressentirais-tu ?'
          - 'Étape 3 : Tu es ton « moi du futur ». Écris une lettre à ton « moi d’aujourd’hui ». Dis comment tu te sens maintenant que tu as atteint ton objectif, qui est à tes côtés et te soutient, et ce que tu as dû faire pour arriver là où tu es aujourd’hui.'
      - id: act3-step2
        type: discussionQuestions
        title: 'Étape 2 : Mon moi du futur'
        items:
          - question: Comment serais-tu ?
            frame: Je serais ___.
          - question: Comment parlerais-tu ?
            frame: Je parlerais ___.
          - question: Que ressentirais-tu ?
            frame: Je ressentirais ___.
      - id: act3-letter
        type: discussionQuestions
        title: 'Cher moi, je suis ton moi du futur.'
        items:
          - question: Quand tu auras atteint ton objectif, tu ressentiras ___.
          - question: Tu seras entouré(e) de ___.
          - question: Tu commenceras par ___.
          - question: Tu apprendras à ___.
          - question: Tu t’assureras de ___.
          - question: Tu te concentreras sur ___.
          - question: Tu te souviendras de ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Deux compétences dans ce cycle : **Le futur simple** (questions
          d’échauffement, activités 1, 2 et 3) et **Le conditionnel présent** (ronde
          d’introduction et activité 3, étape 2). Le cahier ne précise pas la répartition
          des activités.
      - id: n-intro
        anchor: intro
        text: Donne d’abord ton propre exemple, puis interroge chaque élève.
      - id: n-warmup
        anchor: warmup
        text: Pose au moins deux questions à chaque élève. Les réponses écrites ici apparaissent sous chaque question.
      - id: n-act2
        anchor: act2
        text: Divise les élèves en groupes qui ont des objectifs semblables. Chaque groupe a 5 minutes pour présenter son invention.
      - id: n-act3
        anchor: act3
        text: >-
          Étape 1 (facultative), visualisation à lire aux élèves : « Imaginez votre moi
          du futur. Fermez les yeux et imaginez-vous dans le futur, après avoir atteint
          votre objectif. Pensez à ce que vous ressentez, à quoi ressemble votre vie et
          qui est avec vous. » Les étapes 2 et 3 ne sont pas facultatives.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: projets-et-objectifs-futur-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: rules-futur
        type: ruleSummary
        skill: Le futur simple
        rules:
          - text: >-
              Le futur simple est un temps facile en français. On prend le verbe à
              l’**infinitif** et on ajoute la terminaison du sujet (peu importe le groupe
              du verbe) : je **-ai**, tu **-as**, il / elle **-a**, nous **-ons**, vous
              **-ez**, ils / elles **-ont**. Pour les verbes en **-re**, on enlève le **-e**
              final.
            examples:
              - (manger) Demain, je **mangerai** une pizza.
              - (prendre) Demain, je **prendrai** le train.
          - text: 'Il y a des exceptions : certains verbes ont un radical irrégulier, à apprendre par cœur.'
            examples:
              - (aller) Demain, j’**irai** au cinéma.
              - 'être → je serai · avoir → j’aurai · faire → je ferai · venir → je viendrai'
              - 'pouvoir → je pourrai · voir → je verrai · vouloir → je voudrai'
          - text: >-
              Dans les situations informelles, surtout à l’oral, on utilise souvent le
              **futur proche** : *aller* au présent + verbe à l’infinitif.
            examples:
              - (manger) Demain, je **vais manger** une pizza.
              - (aller) Demain, je **vais aller** au cinéma.
      - id: futur-table
        type: table
        caption: Le futur simple
        header: [Sujet, Parler, Finir, Prendre]
        rows:
          - [je, je parlerai, je finirai, je prendrai]
          - [tu, tu parleras, tu finiras, tu prendras]
          - [il / elle, il / elle parlera, il / elle finira, il / elle prendra]
          - [nous, nous parlerons, nous finirons, nous prendrons]
          - [vous, vous parlerez, vous finirez, vous prendrez]
          - [ils / elles, ils / elles parleront, ils / elles finiront, ils / elles prendront]
      - id: rules-conditionnel
        type: ruleSummary
        skill: Le conditionnel présent
        rules:
          - text: >-
              Le conditionnel présent exprime une hypothèse, un fait incertain, un
              souhait, une action envisagée, une envie, une émotion ou toute forme
              d’incertitude.
            examples:
              - J’aimerais devenir auteure.
              - À ta place, je ferais du sport.
          - text: >-
              Le conditionnel présent = le **radical du futur** + les **terminaisons de
              l’imparfait** : je **-ais**, tu **-ais**, il / elle **-ait**, nous **-ions**,
              vous **-iez**, ils / elles **-aient**.
            examples:
              [
                je parlerai (futur) → je parlerais (conditionnel),
                'je serai → je serais · j’aurai → j’aurais · je ferai → je ferais · j’irai → j’irais',
              ]
      - id: conditionnel-table
        type: table
        caption: Le conditionnel présent
        header: [Sujet, Parler, Finir, Prendre]
        rows:
          - [je, je parlerais, je finirais, je prendrais]
          - [tu, tu parlerais, tu finirais, tu prendrais]
          - [il / elle, il / elle parlerait, il / elle finirait, il / elle prendrait]
          - [nous, nous parlerions, nous finirions, nous prendrions]
          - [vous, vous parleriez, vous finiriez, vous prendriez]
          - [ils / elles, ils / elles parleraient, ils / elles finiraient, ils / elles prendraient]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Révise les deux compétences avec le groupe et demande un nouvel exemple pour chaque règle.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: projets-et-objectifs-futur-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie ce message et envoie-le. Mori va te poser des questions ; réponds à toutes au futur.
      - id: mori-questions
        type: aiTutorPrompt
        title: Questions orales au futur proche
        message: |-
          Bonjour Mori ! Je veux pratiquer le futur proche. Pose-moi ces questions une par une et corrige mes erreurs, s’il te plaît :
          Que vas-tu faire le week-end prochain ?
          Que vas-tu accomplir d’ici la fin de l’année ?
          Où vas-tu aller pendant tes prochaines vacances ?
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          Tu veux plus de questions ? Envoie : **S’il te plaît, pose-moi encore des questions !**
          Tu ne comprends pas une explication ? Envoie : **Peux-tu m’expliquer en hébreu, mais avec la phrase en français ?**
      - id: writing-title
        type: heading
        level: 3
        text: Écriture
      - id: mori-writing
        type: aiTutorPrompt
        title: Mon objectif pour le mois prochain
        intro: Écris un court paragraphe (5 à 7 phrases) sur ton objectif pour le mois prochain. Ajoute-le au message et envoie-le à Mori.
        message: |-
          Bonjour Mori ! Voici un paragraphe sur mon objectif pour le mois prochain. Corrige mes erreurs de futur simple et de futur proche, s’il te plaît, et explique-moi chaque correction.
          ___ (ton paragraphe)
      - id: reading-title
        type: heading
        level: 3
        text: Compréhension écrite
      - id: reading
        type: text
        text: >-
          L’année prochaine, j’étudierai à l’étranger, en Espagne. Je vais améliorer mon
          espagnol et découvrir la culture. Je rencontrerai de nouvelles personnes et je
          me ferai des amis. J’ai hâte de vivre cette aventure et tout ce que je vais
          découvrir.
      - id: reading-questions
        type: discussionQuestions
        title: Lis le texte et réponds aux questions
        items:
          - question: Où la personne étudiera-t-elle l’année prochaine ?
          - question: Que fera-t-elle là-bas ?
          - question: Qui rencontrera-t-elle ?
          - question: Que ressent-elle avant cette aventure ?

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: projets-et-objectifs-futur-pratique
    book: workbook
    title: 'Pratique : Projets et objectifs (futur)'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Pratique les deux compétences du cycle. Chaque réponse est corrigée tout de suite, et tu peux réessayer.
      - id: ex-futur
        type: activity
        activity: projets-et-objectifs-futur-futur
      - id: ex-conditionnel
        type: activity
        activity: projets-et-objectifs-futur-conditionnel

