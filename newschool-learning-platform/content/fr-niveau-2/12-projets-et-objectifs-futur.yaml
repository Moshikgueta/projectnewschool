vocabulary:
  - slug: projets-et-objectifs-futur
    title: Projets et objectifs (futur)
    items: *projets-et-objectifs-futur-words

activities:
  - slug: projets-et-objectifs-futur-futur
    title: 'Le futur simple : je parlerai, j’irai'
    minutes: 8
    items:
      - id: mangerai
        type: multipleChoice
        prompt: Demain, je ___ une pizza.
        options:
          - { text: mangerai, correct: true }
          - {
              text: mangerais,
              feedback: '*Je mangerais* est au conditionnel (-ais). Au futur simple, la terminaison de *je* est *-ai* : *je mangerai*.',
            }
          - {
              text: mangeais,
              feedback: '*Je mangeais* est à l’imparfait (le passé). Pour demain, on dit *je mangerai*.',
            }
      - id: etudierons
        type: fillBlank
        prompt: Complète avec le futur simple des verbes entre parenthèses.
        text: L’année prochaine, nous ___ (étudier) en Espagne et nous ___ (rencontrer) de nouvelles personnes.
        blanks: [[étudierons], [rencontrerons]]
      - id: irreguliers
        type: matching
        prompt: Associe chaque verbe à sa forme au futur simple.
        pairs:
          - [aller, j’irai]
          - [être, je serai]
          - [avoir, j’aurai]
          - [faire, je ferai]
          - [venir, je viendrai]
      - id: verbes-re
        type: trueFalse
        prompt: 'Pour les verbes en -re, on garde le -e final au futur : prendre → je prendreai.'
        answer: false
        feedback:
          correct: 'Bravo ! On enlève le *-e* final : *prendre → je prendrai*.'
          incorrect: 'Pour les verbes en *-re*, on enlève le *-e* final : *prendre → je prendrai*.'
      - id: irai
        type: multipleChoice
        prompt: Samedi prochain, j’___ au cinéma avec mes amis.
        options:
          - { text: irai, correct: true }
          - { text: allerai, feedback: '*Aller* est irrégulier au futur : on dit *j’irai*.' }
          - {
              text: allais,
              feedback: '*J’allais* est à l’imparfait (le passé). Pour samedi prochain, on dit *j’irai*.',
            }
      - id: finiras
        type: fillBlank
        prompt: Complète avec le futur simple du verbe *finir*.
        text: Tu ___ ton projet en mai.
        blanks: [[finiras]]
      - id: futur-proche
        type: multipleChoice
        prompt: 'Futur proche : Demain, je ___ manger une pizza.'
        options:
          - { text: vais, correct: true }
          - {
              text: irai,
              feedback: 'Le futur proche = *aller* au **présent** + infinitif : *je vais manger*.',
            }
          - {
              text: allais,
              feedback: 'Le futur proche = *aller* au **présent** + infinitif : *je vais manger*. *Allais* est à l’imparfait.',
            }
      - id: ordre-guitare
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Je jouerai de la guitare pour mes amis.

  - slug: projets-et-objectifs-futur-conditionnel
    title: 'Le conditionnel présent : j’aimerais'
    minutes: 8
    items:
      - id: aimerais
        type: multipleChoice
        prompt: 'Exprime un souhait : J’___ devenir auteure.'
        options:
          - { text: aimerais, correct: true }
          - {
              text: aimerai,
              feedback: '*J’aimerai* est au futur simple. Pour un souhait, on utilise le conditionnel (-ais) : *j’aimerais*.',
            }
          - {
              text: aimais,
              feedback: '*J’aimais* est à l’imparfait (le passé). Pour un souhait, on dit *j’aimerais*.',
            }
      - id: parlerions-finiriez
        type: fillBlank
        prompt: Complète avec le conditionnel présent des verbes entre parenthèses.
        text: Avec plus de temps, nous ___ (parler) français tous les jours et vous ___ (finir) vos projets.
        blanks: [[parlerions], [finiriez]]
      - id: formation
        type: trueFalse
        prompt: Le conditionnel présent = le radical du futur + les terminaisons de l’imparfait.
        answer: true
        feedback:
          correct: 'Bravo ! *je parler- + -ais = je parlerais*, *je ser- + -ais = je serais*.'
          incorrect: 'C’est vrai : on prend le radical du futur (*parler-, ser-*) et on ajoute *-ais, -ais, -ait, -ions, -iez, -aient*.'
      - id: futur-conditionnel
        type: matching
        prompt: Associe chaque forme du futur à sa forme au conditionnel.
        pairs:
          - [je parlerai, je parlerais]
          - [tu finiras, tu finirais]
          - [il prendra, il prendrait]
          - [nous serons, nous serions]
          - [ils auront, ils auraient]
      - id: ferais
        type: multipleChoice
        prompt: 'Un conseil : À ta place, je ___ du sport tous les jours.'
        options:
          - { text: ferais, correct: true }
          - {
              text: ferai,
              feedback: '*Je ferai* est au futur simple. Pour un conseil ou une hypothèse, on utilise le conditionnel : *je ferais*.',
            }
          - {
              text: faisais,
              feedback: '*Je faisais* est à l’imparfait (le passé). Pour un conseil, on dit *je ferais*.',
            }
      - id: prendraient
        type: fillBlank
        prompt: Complète avec le conditionnel présent du verbe *prendre*.
        text: Ils ___ bien l’avion, mais c’est trop cher.
        blanks: [[prendraient]]
      - id: voyagerais
        type: multipleChoice
        prompt: 'Une envie : Si j’avais le temps, je ___ en Alaska.'
        options:
          - { text: voyagerais, correct: true }
          - {
              text: voyagerai,
              feedback: '*Je voyagerai* est au futur simple. Pour une hypothèse (si j’avais…), on utilise le conditionnel : *je voyagerais*.',
            }
          - {
              text: voyage,
              feedback: '*Je voyage* est au présent. Pour une hypothèse, on dit *je voyagerais*.',
            }
      - id: ordre-canada
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: J’aimerais visiter le Canada.
