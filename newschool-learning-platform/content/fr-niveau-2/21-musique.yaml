vocabulary:
  - slug: musique
    title: Musique
    items: *musique-words

activities:
  - slug: musique-sociales
    title: 'Les compétences sociales : questions et réponses sur la musique'
    minutes: 8
    items:
      - id: questions-reponses
        type: matching
        prompt: Associe chaque question à sa réponse.
        pairs:
          - [Quelle musique écoutes-tu ?, J’écoute du rock.]
          - [Es-tu déjà allé(e) à un concert ?, 'Oui, je suis allé(e) à un concert de Stromae.']
          - [Jouais-tu d’un instrument ?, 'Oui, je jouais du piano.']
          - [
              Quelle était ta chanson préférée quand tu étais enfant ?,
              C’était une chanson pour enfants.,
            ]
          - [Quel artiste préfères-tu ?, Je préfère Angèle.]
      - id: reagir
        type: multipleChoice
        prompt: '— Je te donne ma patience. — Merci ! ___'
        options:
          - { text: 'Moi, je te donne mon énergie.', correct: true }
          - {
              text: 'Moi, je te donnes mon énergie.',
              feedback: 'Avec *je*, le verbe *donner* au présent est *je donne* (sans -s).',
            }
          - {
              text: 'Moi, je donne te mon énergie.',
              feedback: 'Le pronom *te* se place avant le verbe : *je te donne*.',
            }
      - id: ecoutes
        type: fillBlank
        prompt: Complète la question avec le verbe *écouter* au présent.
        text: — Quelle musique ___-tu ? — J’écoute du rock.
        blanks: [[écoutes]]
      - id: question-passe
        type: multipleChoice
        prompt: Quelle question est au passé composé ?
        options:
          - { text: Quelle musique as-tu écoutée hier ?, correct: true }
          - {
              text: Quelle musique écoutes-tu ?,
              feedback: '*Écoutes-tu* est au présent. Au passé composé : *as-tu écoutée*.',
            }
          - {
              text: Quelle musique écoutais-tu quand tu étais enfant ?,
              feedback: '*Écoutais-tu* est à l’imparfait. Au passé composé : *as-tu écoutée*.',
            }
      - id: troisieme-personne
        type: trueFalse
        prompt: 'Pour présenter ton / ta partenaire au groupe, tu parles à la 3e personne : *Maria écoute de la musique classique.*'
        answer: true
        feedback:
          correct: 'Bravo ! On présente son / sa partenaire avec *il / elle* : *Maria écoute…, elle écoutait…*'
          incorrect: 'C’est vrai : pour présenter quelqu’un, on utilise la 3e personne (*il / elle*) : *Maria écoute de la musique classique.*'
      - id: jouais
        type: fillBlank
        prompt: Complète la question avec le verbe *jouer* à l’imparfait.
        text: — Tu ___ d’un instrument quand tu étais petit(e) ? — Oui, je jouais du piano.
        blanks: [[jouais]]
      - id: ont-ils
        type: multipleChoice
        prompt: Tes goûts musicaux ___ changé ?
        options:
          - { text: ont-ils, correct: true }
          - {
              text: ont-t-il,
              feedback: 'Le verbe *ont* finit déjà par *t* : pas de *-t-* en plus. Et *tes goûts* est au pluriel : *ont-ils*.',
            }
          - { text: a-t-il, feedback: '*Tes goûts* est au pluriel : *ont-ils changé ?*' }
      - id: ordre-maria
        type: reorderSentence
        prompt: Remets les mots dans l’ordre pour présenter ta partenaire.
        sentence: Maria écoute de la musique classique.

  - slug: musique-temps
    title: 'Les temps dans un récit : présent, passé composé, imparfait'
    minutes: 8
    items:
      - id: ai-ecoute
        type: multipleChoice
        prompt: Hier, ___ la nouvelle chanson de Stromae.
        options:
          - { text: j’ai écouté, correct: true }
          - {
              text: j’écoute,
              feedback: '*J’écoute* est au présent. Avec *hier*, pour un fait ponctuel : *j’ai écouté*.',
            }
          - {
              text: j’écouterai,
              feedback: '*J’écouterai* est au futur. Avec *hier* : *j’ai écouté*.',
            }
      - id: ecoutais
        type: multipleChoice
        prompt: Quand j’étais enfant, ___ des chansons pour enfants tous les jours.
        options:
          - { text: j’écoutais, correct: true }
          - {
              text: j’écoute,
              feedback: '*J’écoute* est au présent. Pour une habitude passée, on utilise l’imparfait : *j’écoutais*.',
            }
          - {
              text: j’écouterai,
              feedback: '*J’écouterai* est au futur. Pour une habitude passée : *j’écoutais*.',
            }
      - id: lien-passe-present
        type: fillBlank
        prompt: Complète avec *manger* au passé composé et *avoir* au présent.
        text: Hier, j’ai trop ___. Aujourd’hui, j’___ mal au ventre.
        blanks: [[mangé], [ai]]
      - id: temps-usage
        type: matching
        prompt: Associe chaque phrase à son temps.
        pairs:
          - [J’aime la musique pop., 'présent : un goût']
          - ['Hier, j’ai écouté Stromae.', 'passé composé : un fait ponctuel']
          - ['Quand j’étais enfant, j’écoutais du rock.', 'imparfait : une habitude passée']
          - ['Aujourd’hui, j’ai mal au ventre.', 'présent : une conséquence']
      - id: aller-etre
        type: trueFalse
        prompt: 'Le passé composé de *aller* se forme avec *avoir* : *J’ai allé au concert.*'
        answer: false
        feedback:
          correct: 'Bravo ! *Aller* se conjugue avec *être* : *Je suis allé(e) au concert.*'
          incorrect: '*Aller* se conjugue avec *être* : *Je suis allé(e) au concert.*'
      - id: est-ne
        type: fillBlank
        prompt: Complète avec l’auxiliaire *être*.
        text: Stromae ___ né le 12 mars 1985 à Bruxelles.
        blanks: [[est]]
      - id: ecoutait
        type: multipleChoice
        prompt: Maria écoute de la musique classique, mais avant, elle ___ de la pop.
        options:
          - { text: écoutait, correct: true }
          - {
              text: écoute,
              feedback: 'Avec *avant*, on parle d’une habitude passée : *elle écoutait*.',
            }
          - {
              text: écouterait,
              feedback: 'Pour une habitude passée, on utilise l’imparfait : *elle écoutait*.',
            }
      - id: ordre-enfant
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Quand j’étais enfant, j’écoutais du rock.
