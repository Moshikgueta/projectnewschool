# Cycle "Projets et objectifs - passé", converted from the French level 2 digital notebook
# ("Cahier digital 2025 - français niveau 2", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-2
slug: projets-et-objectifs-passe
title: Projets et objectifs (passé)
goal: Parler de ses objectifs passés avec le passé composé et l’imparfait.
position: 11
status: published

review:
  - >-
    The two workbook exercises ("Le passé composé" and "L'imparfait") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's two
    skills, its summary rules, the activity examples and its vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    The summary explains the passé composé partly in Hebrew (formation, groups 1–3,
    glosses such as "J'ai été – הייתי"). As student-facing text is in French, it was
    rewritten in French; the Hebrew glosses of the rare verbs (clore, inclure,
    joindre, rire, suivre, sourire) and of "j'ai été / j'ai eu" were left out. Please
    say if you want a Hebrew version of the rule.
  - >-
    Summary, passé composé: the source names "avoir ou être" but never says which
    verbs take être, and that the participle then agrees with the subject. A rule was
    added (aller, venir, partir, sortir, arriver, rester, tomber, naître, mourir… and
    the pronominal verbs: elle est allée, ils sont venus, je me suis senti(e)). The
    Activity 3 letter uses these forms. Corrections in the participle list: "clore =
    close" → "clos"; "naitre" → "naître"; "eu [u]" → "eu (prononcé [y])"; "aller" was
    listed with the irregular "-é" verbs and is kept there (it is a 3rd-group verb).
  - >-
    Summary, imparfait: the source gives only the endings. The formation rule was
    added (the "nous" form of the present without -ons + endings: nous jouons → je
    jouais; être is the exception: j'étais), with a table. Rule 3 "ponctuelles our
    révolues" → "ou révolues".
  - >-
    Skills: the source says "(1) le passé composé & (2) l'imparfait (activité 1 ou
    4)", but the cycle has only 3 activities. The teacher note suggests using the
    imparfait in the descriptive parts of Activities 1 and 3 and in the homework
    reading. Please confirm the plan.
  - >-
    Corrections: intro example "mon objectif était de faire du sport, je n'ai pas
    commencé" → "…, mais je n'ai pas commencé"; warm-up stray asterisks removed;
    "Nous avons fêté à ___" → "Nous avons fêté ça à ___" (fêter needs an object);
    Activity 1 "comme mon modèle à suivre" → "comme modèle"; Activity 2 frame "Ça a
    aidé les gens ___" → "à ___, à ___ et à ___" (as in the example); Activity 3
    "Étape ½ (non facultative)" → "Étape 2"; mismatched quotation marks fixed; "J'ai
    commencé avec" → "J'ai commencé par"; gender marks added in the letter (assuré(e),
    concentré(e), souvenu(e), ravi(e), aidé(e)).
  - >-
    Vocabulary: "Objectif" appeared twice (with "But" and with "Cible") and
    "Atteindre" twice (with "Réussir" and "Parvenir"). Now: "but / objectif – מטרה",
    "cible – יעד", "atteindre – להשיג", "réussir – להצליח" (was להשיג), "parvenir à –
    להגיע". "Volontaire – מתנדב" → "bénévole / volontaire" (bénévole is the usual
    word for a volunteer). "Créer / Établir – להקים" → "créer – ליצור", "établir /
    fonder – להקים". Please confirm.
  - >-
    The notebook gives no times, so no minutes are set. The Quizlet link is kept
    without its "?i=…&x=…" parameters. The "Réponse de l'élève 1/2/3" lines are
    replaced by the answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: projets-et-objectifs-passe-classe
    title: 'Classe : Projets et objectifs (passé)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Projets et objectifs (passé)
      - id: skills
        type: cycleOverview
        skills:
          - name: Le passé composé
            description: Les actions terminées (*j’ai atteint mon objectif, je suis allé(e)*)
          - name: L’imparfait
            description: Les descriptions et les habitudes au passé (*j’étais, je jouais*)
      - id: quizlet
        type: externalLink
        label: Projets et objectifs (passé) sur Quizlet
        url: https://quizlet.com/il/1094944543/conversational-french-2025-projets-et-objectifs-passe-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. L’année dernière, mon objectif était de ___.
        example: Je m’appelle Lévanah. L’année dernière, mon objectif était de faire du sport, mais je n’ai pas commencé.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup
        type: discussionQuestions
        items:
          - question: Qu’as-tu fait jusqu’à présent pour te rapprocher de ton objectif ?
            frame: Jusqu’à présent, j’ai ___.
          - question: Quel était ton dernier objectif ? L’as-tu atteint ?
            frame: Mon dernier objectif était ___. Je l’ai atteint. / Je ne l’ai pas atteint.
          - question: Qu’as-tu fait pour atteindre ton dernier objectif ?
            frame: Le ___ (jour de la semaine), j’ai ___. Aussi, le ___, j’ai ___.
          - question: Comment t’es-tu senti(e) quand tu as atteint ton objectif ?
            frame: Je me suis senti(e) ___ quand j’ai atteint mon objectif.
          - question: Qu’as-tu fait après avoir atteint ton objectif ?
            frame: J’ai ___ après avoir atteint mon objectif.
          - question: Où as-tu fêté ta réussite ?
            frame: Nous avons fêté ça à ___ avec ___. Nous avons mangé ___ et bu ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Mon modèle à suivre'
        skills: [Le passé composé, L’imparfait]
        steps:
          - Fais une recherche sur une personne qui est un modèle pour toi, en lien avec ton objectif.
          - Présente ta recherche au groupe avec le **passé composé**.
        example: >-
          *J’ai choisi Greta Thunberg comme modèle. Elle a lancé un mouvement mondial
          pour la prise de conscience du changement climatique, elle a organisé des
          grèves scolaires et elle a prononcé des discours puissants devant les
          dirigeants du monde à l’ONU. Je pense que c’est mon modèle parce qu’elle a
          montré du courage et de la détermination pour une cause qui lui tenait à cœur,
          même très jeune.*
      - id: act1-frame
        type: discussionQuestions
        title: Mon modèle
        items:
          - question: J’ai choisi ___ comme modèle.
          - question: 'Cette personne a fait les choses suivantes : ___.'
          - question: Je pense que c’est mon modèle parce que ___.
      - id: act2
        type: classActivity
        title: 'Activité 2 : Que ferais-je sans toi ?'
        skills: [Le passé composé]
        steps:
          - Cherche une invention qui t’a aidé(e) à atteindre ton objectif.
          - Trouve qui l’a créée et en quelle année.
          - Présente l’invention et son impact au groupe.
        example: >-
          ***C’est** le téléphone portable. **Cette invention a été créée par** Martin
          Cooper et son équipe chez Motorola le 3 avril 1973. **Ça a aidé les gens à**
          communiquer tout de suite, à accéder à l’information à tout moment et à mieux
          organiser leur vie grâce à différentes applications. **Personnellement, ça m’a
          aidé(e) à** rester en contact avec ma famille, à apprendre de nouvelles choses
          et à gérer mes tâches quotidiennes.*
      - id: act2-frame
        type: discussionQuestions
        title: Mon invention
        items:
          - question: C’est ___. Cette invention a été créée par ___ en ___.
          - question: Ça a aidé les gens à ___, à ___ et à ___.
          - question: Personnellement, ça m’a aidé(e) à ___, à ___ et à ___.
      - id: act3
        type: classActivity
        title: 'Activité 3 : Lettre à mon moi du futur (au passé)'
        skills: [Le passé composé, L’imparfait]
        steps:
          - 'Étape 1 (facultative) : Ton professeur te guide dans une visualisation.'
          - 'Étape 2 : Écris une lettre à ton « moi du futur ». Dis ce que tu as ressenti après avoir atteint ton objectif, qui t’a aidé(e), et ce que tu as fait dans le passé pour aider ton moi du futur à réussir (avec les temps du passé).'
          - Lis ta lettre au groupe.
      - id: act3-letter
        type: discussionQuestions
        title: Cher futur moi,
        items:
          - question: J’espère qu’au moment où tu liras cette lettre, tu te sentiras / tu seras ___.
          - question: Je sais que tu as atteint ton objectif et j’espère que tu te souviendras des personnes qui t’ont aidé(e) et soutenu(e), comme ___.
          - question: 'Avec le recul, voici ce que j’ai fait pour t’aider à arriver là où tu es aujourd’hui : J’ai commencé par ___.'
          - question: J’ai appris à ___.
          - question: Je me suis assuré(e) de ___.
          - question: Je me suis concentré(e) sur ___.
          - question: Je me suis souvenu(e) de ___.
          - question: Je suis ravi(e) de voir ce que tu as accompli et de savoir que tout ce que j’ai fait t’a aidé(e) à construire cet avenir incroyable. Ton moi présent.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Deux compétences dans ce cycle : **Le passé composé** (questions
          d’échauffement, activités 1, 2 et 3) et **L’imparfait**. Le cahier indique
          « l’imparfait (activité 1 ou 4) », mais il n’y a que 3 activités. Fais utiliser
          l’imparfait dans les parties descriptives : à l’activité 1 (*Elle était très
          jeune, elle voulait…*) et à l’activité 3 (*Avant, j’avais peur de…*).
      - id: n-intro
        anchor: intro
        text: Donne d’abord ton propre exemple, puis interroge chaque élève.
      - id: n-warmup
        anchor: warmup
        text: Pose au moins deux questions à chaque élève. Les réponses écrites ici apparaissent sous chaque question.
      - id: n-act1
        anchor: act1
        text: Les élèves peuvent préparer leur recherche à la maison ou en classe, puis présenter avec la structure proposée.
      - id: n-act3
        anchor: act3
        text: >-
          Étape 1 (facultative), visualisation à lire aux élèves : « Imaginez votre moi
          du futur. Fermez les yeux et imaginez-vous dans le futur, après avoir atteint
          votre objectif. Pensez à ce que vous ressentez, à quoi ressemble votre vie et
          qui est avec vous. » L’étape 2 (la lettre) n’est pas facultative.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: projets-et-objectifs-passe-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: rules-pc
        type: ruleSummary
        skill: Le passé composé
        rules:
          - text: On utilise le passé composé pour les actions **ponctuelles** ou **terminées** dans le passé.
            examples: [J’ai terminé mon projet le mois dernier.]
          - text: Le passé composé = l’auxiliaire **avoir** ou **être** au présent + le **participe passé** du verbe.
            examples: [J’ai parlé. · Nous avons fini. · Elle est partie.]
          - text: >-
              Les verbes du **1er groupe** (-er) : on enlève **-er** et on ajoute **-é**.
              Les verbes du **2e groupe** (-ir, *nous finissons*) : on enlève **-ir** et on
              ajoute **-i**.
            examples:
              [
                parler → parlé (j’ai parlé),
                manger → mangé (j’ai mangé),
                finir → fini (j’ai fini),
                réussir → réussi (j’ai réussi),
              ]
          - text: Les verbes du **3e groupe** ont des participes irréguliers (voir le tableau). Tu les apprendras en parlant et en pratiquant.
            examples: ['avoir → eu (prononcé [y]) · être → été · faire → fait · prendre → pris']
          - text: >-
              Avec **être** : les verbes de mouvement et de changement (aller, venir,
              partir, sortir, arriver, rester, tomber, naître, mourir…) et les verbes
              pronominaux (*se sentir, se souvenir*). Le participe **s’accorde avec le
              sujet** : + **e** au féminin, + **s** au pluriel.
            examples:
              [
                Elle est allée à la montagne.,
                Ils sont venus.,
                Je me suis senti(e) heureux / heureuse.,
              ]
      - id: participes-table
        type: table
        caption: Les participes passés du 3e groupe
        header: [Terminaison, Exemples]
        rows:
          - ['-é', 'aller → allé, être → été, naître → né (je suis né(e))']
          - [
              '-u',
              'pouvoir → pu, vouloir → voulu, venir → venu, courir → couru, voir → vu, boire → bu, descendre → descendu, tenir → tenu, lire → lu, avoir → eu',
            ]
          - ['-is / -os / -us', 'prendre → pris, mettre → mis, clore → clos, inclure → inclus']
          - ['-ait / -int / -it', 'faire → fait, joindre → joint, dire → dit']
          - ['-ort / -ert', 'mourir → mort (il est mort), ouvrir → ouvert, offrir → offert']
          - ['-i', 'rire → ri, suivre → suivi, sortir → sorti, partir → parti, sourire → souri']
      - id: etre-avoir-table
        type: table
        caption: Être et avoir au passé composé
        header: [Sujet, être (participe été), avoir (participe eu)]
        rows:
          - [je / j’, j’ai été, j’ai eu]
          - [tu, tu as été, tu as eu]
          - [il / elle, il / elle a été, il / elle a eu]
          - [nous, nous avons été, nous avons eu]
          - [vous, vous avez été, vous avez eu]
          - [ils / elles, ils / elles ont été, ils / elles ont eu]
      - id: rules-imparfait
        type: ruleSummary
        skill: L’imparfait
        rules:
          - text: On utilise l’imparfait pour les **actions qui se répètent** (les habitudes) ou les **descriptions** au passé.
            examples:
              - Quand j’étais petite, je jouais le dimanche avec ma voisine.
          - text: >-
              Tous les verbes, quel que soit leur groupe, ont les mêmes terminaisons : je
              **-ais**, tu **-ais**, il / elle **-ait**, nous **-ions**, vous **-iez**, ils
              / elles **-aient**.
          - text: >-
              Pour trouver le radical, on prend le verbe au présent avec **nous** et on
              enlève **-ons**. Exception : **être** → *j’étais*.
            examples:
              [nous jouons → je jouais, nous finissons → je finissais, nous faisons → je faisais]
          - text: >-
              Les deux temps sont nécessaires pour bien s’exprimer : le **passé composé**
              pour les actions ponctuelles ou terminées, l’**imparfait** pour les
              descriptions et les habitudes au passé.
            examples:
              - L’été dernier, je suis allé(e) à la montagne. C’était magnifique.
      - id: imparfait-table
        type: table
        caption: L’imparfait
        header: [Sujet, Terminaison, jouer, être]
        rows:
          - [je / j’, '-ais', jouais, étais]
          - [tu, '-ais', jouais, étais]
          - [il / elle, '-ait', jouait, était]
          - [nous, '-ions', jouions, étions]
          - [vous, '-iez', jouiez, étiez]
          - [ils / elles, '-aient', jouaient, étaient]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Révise les deux compétences avec le groupe et demande un nouvel exemple pour chaque règle.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: projets-et-objectifs-passe-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie ce message et envoie-le. Mori va te poser des questions ; réponds à toutes au passé.
      - id: mori-questions
        type: aiTutorPrompt
        title: Questions orales au passé composé
        message: |-
          Bonjour Mori ! Je veux pratiquer le passé composé. Pose-moi ces questions une par une et corrige mes erreurs, s’il te plaît :
          Qu’as-tu fait le week-end dernier ?
          As-tu atteint un objectif le mois dernier ? Si oui, comment ?
          Qu’as-tu fait pour apprendre le français l’année dernière ?
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          Tu veux plus de questions ? Envoie : **S’il te plaît, pose-moi encore des questions !**
          Tu ne comprends pas une explication ? Envoie : **Peux-tu m’expliquer en hébreu, mais avec la phrase en français ?**
      - id: writing-title
        type: heading
        level: 3
        text: Production écrite
      - id: mori-writing
        type: aiTutorPrompt
        title: Mon dernier objectif
        intro: Écris un court paragraphe (5 à 7 phrases) sur ton dernier objectif et explique comment tu l’as atteint. Ajoute-le au message et envoie-le à Mori.
        message: |-
          Bonjour Mori ! Voici un paragraphe sur mon dernier objectif et comment je l’ai atteint. Corrige mes erreurs de passé composé et d’imparfait, s’il te plaît, et explique-moi chaque correction.
          ___ (ton paragraphe)
      - id: reading-title
        type: heading
        level: 3
        text: Compréhension écrite
      - id: reading
        type: text
        text: >-
          L’été dernier, je suis allé(e) à la montagne. J’ai marché tous les jours et
          j’ai visité de magnifiques lacs. Je suis resté(e) dans un chalet avec mes amis.
          Nous avons cuisiné de bons repas et passé nos soirées autour du feu. C’était un
          voyage inoubliable.
      - id: reading-questions
        type: discussionQuestions
        title: Lis le texte et réponds aux questions
        items:
          - question: Où la personne est-elle allée ?
          - question: Que faisait-elle chaque jour ?
          - question: Avec qui est-elle restée ?
          - question: Que faisait-elle le soir ?

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: projets-et-objectifs-passe-pratique
    book: workbook
    title: 'Pratique : Projets et objectifs (passé)'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Pratique les deux compétences du cycle. Chaque réponse est corrigée tout de suite, et tu peux réessayer.
      - id: ex-passe-compose
        type: activity
        activity: projets-et-objectifs-passe-passe-compose
      - id: ex-imparfait
        type: activity
        activity: projets-et-objectifs-passe-imparfait

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: projets-et-objectifs-passe-vocabulaire
    title: Vocabulaire
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Les mots des projets et des objectifs
        glossLang: he
        link: https://quizlet.com/il/1094944543/conversational-french-2025-projets-et-objectifs-passe-flash-cards/
        items: &projets-et-objectifs-passe-words
          - { term: but / objectif, gloss: מטרה }
          - { term: cible, gloss: יעד }
          - { term: projet, gloss: פרויקט }
          - { term: atteindre, gloss: להשיג }
          - { term: réussir, gloss: להצליח }
          - { term: parvenir à, gloss: להגיע }
          - { term: plan, gloss: תוכנית }
          - { term: futur, gloss: עתיד }
          - { term: action, gloss: פעולה }
          - { term: aider, gloss: לעזור }
          - { term: bénévole / volontaire, gloss: מתנדב }
          - { term: communiquer, gloss: לתקשר }
          - { term: changement, gloss: שינוי }
          - { term: passé, gloss: עבר }
          - { term: faire, gloss: לעשות }
          - { term: décision, gloss: החלטה }
          - { term: contribution, gloss: תרומה }
          - { term: créer, gloss: ליצור }
          - { term: établir / fonder, gloss: להקים }
          - { term: fêter / célébrer, gloss: לחגוג }
          - { term: résultats, gloss: תוצאות }
          - { term: ressentir / se sentir, gloss: להרגיש }

vocabulary:
  - slug: projets-et-objectifs-passe
    title: Projets et objectifs (passé)
    items: *projets-et-objectifs-passe-words

activities:
  - slug: projets-et-objectifs-passe-passe-compose
    title: 'Le passé composé : j’ai atteint mon objectif'
    minutes: 8
    items:
      - id: ai-termine
        type: multipleChoice
        prompt: Le mois dernier, ___ mon projet.
        options:
          - { text: j’ai terminé, correct: true }
          - {
              text: je terminais,
              feedback: 'C’est une action terminée (le mois dernier) : on utilise le passé composé, *j’ai terminé*.',
            }
          - {
              text: je suis terminé,
              feedback: '*Terminer* se conjugue avec *avoir* au passé composé : *j’ai terminé*.',
            }
      - id: participes
        type: matching
        prompt: Associe chaque verbe à son participe passé.
        pairs:
          - [prendre, pris]
          - [faire, fait]
          - [dire, dit]
          - [voir, vu]
          - [ouvrir, ouvert]
      - id: fini-reussi
        type: fillBlank
        prompt: Complète avec le passé composé des verbes entre parenthèses.
        text: Hier, nous ___ (finir) le projet et nous ___ (réussir) !
        blanks: [[avons fini], [avons réussi]]
      - id: est-allee
        type: multipleChoice
        prompt: L’été dernier, elle ___ à la montagne.
        options:
          - { text: est allée, correct: true }
          - {
              text: a allé,
              feedback: 'Le verbe *aller* se conjugue avec *être* au passé composé : *elle est allée*.',
            }
          - {
              text: est allé,
              feedback: 'Avec *être*, le participe s’accorde avec le sujet. *Elle* est féminin : *elle est allée*.',
            }
      - id: groupe-er
        type: trueFalse
        prompt: 'Pour former le participe passé d’un verbe en -er, on enlève -er et on ajoute -é : parler → parlé.'
        answer: true
        feedback:
          correct: 'Bravo ! *parler → parlé*, *manger → mangé*, *danser → dansé*.'
          incorrect: 'C’est vrai : pour les verbes du 1er groupe, on enlève *-er* et on ajoute *-é* (*parler → parlé*).'
      - id: pris
        type: multipleChoice
        prompt: Ce matin, j’ai ___ le train pour aller au travail.
        options:
          - { text: pris, correct: true }
          - {
              text: prendu,
              feedback: '*Prendre* est un verbe irrégulier : son participe passé est *pris*.',
            }
          - {
              text: prené,
              feedback: 'On ajoute *-é* seulement aux verbes en *-er*. *Prendre* fait *pris*.',
            }
      - id: venus-fete
        type: fillBlank
        prompt: Complète avec le passé composé des verbes entre parenthèses.
        text: Mes amis ___ (venir) chez moi et nous ___ (fêter) ma réussite.
        blanks: [[sont venus], [avons fêté]]
      - id: ordre-objectif
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: J’ai atteint mon objectif l’année dernière.

  - slug: projets-et-objectifs-passe-imparfait
