  - slug: occasions-speciales-passe-questions
    title: 'Questions au passé : Quel cadeau as-tu reçu ?'
    minutes: 8
    items:
      - id: as-recu
        type: multipleChoice
        prompt: Quel cadeau ___-tu reçu pour ton anniversaire ?
        options:
          - { text: as, correct: true }
          - { text: es, feedback: '*Recevoir* se conjugue avec *avoir* : *as-tu reçu ?*' }
          - { text: a, feedback: 'Avec *tu*, l’auxiliaire *avoir* est *as* : *as-tu reçu ?*' }
      - id: qu-as-tu
        type: fillBlank
        prompt: Complète la question avec l’auxiliaire.
        text: Qu’___-tu mangé à la fête ?
        blanks: [[as]]
      - id: questions-reponses
        type: matching
        prompt: Associe chaque question à sa réponse.
        pairs:
          - [Où as-tu célébré ton anniversaire ?, Je l’ai fêté dans un restaurant.]
          - [Quel cadeau as-tu reçu ?, J’ai reçu un livre.]
          - [Qui a organisé la fête ?, Ma sœur a organisé la fête.]
          - [Es-tu allé à une fête ennuyeuse ?, 'Oui, je suis allé à une fête sans musique.']
          - [Qu’as-tu bu ?, J’ai bu du coca.]
      - id: es-tu-alle
        type: multipleChoice
        prompt: Quelle question est correcte ?
        options:
          - { text: Es-tu déjà allé à une fête ennuyeuse ?, correct: true }
          - {
              text: As-tu déjà allé à une fête ennuyeuse ?,
              feedback: '*Aller* se conjugue avec *être* : *es-tu allé ?*',
            }
          - {
              text: Es-tu déjà aller à une fête ennuyeuse ?,
              feedback: 'Après l’auxiliaire, on met le participe passé : *allé*, pas l’infinitif *aller*.',
            }
      - id: inversion
        type: trueFalse
        prompt: 'Dans une question au passé composé avec inversion, le sujet vient après l’auxiliaire : *As-tu dansé ?*'
        answer: true
        feedback:
          correct: 'Bravo ! Auxiliaire + trait d’union + sujet, puis le participe : *As-tu dansé ? Es-tu allé(e) ?*'
          incorrect: 'Avec l’inversion, le sujet vient après l’auxiliaire, avec un trait d’union : *As-tu dansé ?*'
      - id: as-tu-danse
        type: fillBlank
        prompt: Complète la question.
        text: — ___-tu dansé ? — Oui, j’ai dansé toute la nuit.
        blanks: [[As]]
      - id: offert-recu
        type: multipleChoice
        prompt: 'Réponse : *J’ai offert un tee-shirt à mon meilleur ami.* Quelle est la question ?'
        options:
          - { text: Quel cadeau as-tu offert ?, correct: true }
          - {
              text: Quel cadeau as-tu reçu ?,
              feedback: '*Recevoir* : on te donne un cadeau. *Offrir* : tu donnes un cadeau. La réponse parle d’*offrir*.',
            }
          - {
              text: Quel cadeau offres-tu ?,
              feedback: '*Offres* est le présent. La réponse est au passé composé : *as-tu offert ?*',
            }
      - id: ordre-bel-anniversaire
        type: reorderSentence
        prompt: Remets les mots dans l’ordre pour faire une question.
        sentence: Où as-tu célébré ton plus bel anniversaire ?
