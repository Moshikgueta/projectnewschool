vocabulary:
  - slug: occasions-speciales-passe
    title: 'Occasions spéciales : le passé'
    items: *occasions-speciales-passe-words

activities:
  - slug: occasions-speciales-passe-passe-compose
    title: 'Le passé composé et l’imparfait : j’ai fêté, c’était'
    minutes: 8
    items:
      - id: ai-dine
        type: multipleChoice
        prompt: Hier, j’___ avec ma famille.
        options:
          - { text: ai dîné, correct: true }
          - { text: suis dîné, feedback: '*Dîner* se conjugue avec *avoir* : *j’ai dîné*.' }
          - {
              text: ai dîner,
              feedback: 'Après l’auxiliaire, on met le participe passé : *-er* → *-é*, *j’ai dîné*.',
            }
      - id: fini-pris
        type: fillBlank
        prompt: Complète avec le participe passé des verbes entre parenthèses.
        text: J’ai ___ (finir) mes devoirs et j’ai ___ (prendre) le bus.
        blanks: [[fini], [pris]]
      - id: participes
        type: matching
        prompt: Associe chaque verbe à son participe passé.
        pairs:
