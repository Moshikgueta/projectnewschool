vocabulary:
  - slug: demenagement
    title: Déménagement
    items: *demenagement-words

activities:
  - slug: demenagement-futur
    title: 'Le futur : je vais déménager, je déménagerai'
    minutes: 8
    items:
      - id: demenagerai
        type: multipleChoice
        prompt: L’année prochaine, je ___ en Espagne.
        options:
          - { text: déménagerai, correct: true }
          - {
              text: déménagera,
              feedback: 'La terminaison *-a* est pour *il / elle*. Avec *je* : *-ai*, *je déménagerai*.',
            }
          - {
              text: ai déménagé,
              feedback: '*J’ai déménagé* est au passé. *L’année prochaine* parle du futur : *je déménagerai*.',
            }
      - id: economiserons
        type: fillBlank
        prompt: Complète avec le verbe *économiser* au futur simple.
        text: Avant de déménager, nous ___ de l’argent.
        blanks: [[économiserons]]
      - id: irreguliers
        type: matching
        prompt: Associe chaque verbe à sa forme au futur simple.
        pairs:
          - [aller, j’irai]
          - [faire, je ferai]
          - [avoir, j’aurai]
          - [être, je serai]
          - [prendre, je prendrai]
      - id: vais-chercher
        type: multipleChoice
        prompt: Je ___ chercher un nouveau travail. (futur proche)
        options:
          - { text: vais, correct: true }
          - { text: vas, feedback: '*Vas* est pour *tu*. Avec *je* : *je vais chercher*.' }
          - {
              text: vais à,
              feedback: 'Après *aller*, on met directement l’infinitif, sans *à* : *je vais chercher*.',
            }
      - id: terminaisons
        type: trueFalse
        prompt: 'Le futur simple se forme avec l’infinitif + les terminaisons *-ai, -as, -a, -ons, -ez, -ont*.'
        answer: true
        feedback:
          correct: 'Bravo ! *déménager → je déménagerai, nous déménagerons*.'
          incorrect: 'Si : infinitif + *-ai, -as, -a, -ons, -ez, -ont*. *Je déménagerai, nous déménagerons.*'
      - id: irons-prendras
        type: fillBlank
        prompt: Complète avec les verbes au futur simple.
        text: Tous les matins, nous ___ (aller) à la boulangerie et tu ___ (prendre) le métro.
        blanks: [[irons], [prendras]]
      - id: aurai
        type: multipleChoice
        prompt: Après mon déménagement, ___ un meilleur travail.
        options:
          - { text: j’aurai, correct: true }
          - {
              text: j’avoirai,
              feedback: '*Avoir* a un radical irrégulier au futur : *aur-*. On dit *j’aurai*.',
            }
          - {
              text: j’ai eu,
              feedback: '*J’ai eu* est au passé. *Après mon déménagement* parle du futur : *j’aurai*.',
            }
      - id: ordre-metro
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Je prendrai le métro pour aller au travail.

  - slug: demenagement-socialiser
    title: 'Socialiser : demander et donner des informations'
    minutes: 8
    items:
      - id: question-pratique
        type: multipleChoice
        prompt: Tu viens d’arriver dans une nouvelle ville et tu cherches un endroit pour manger. Quelle question est directe et pratique ?
        options:
          - { text: Où est le meilleur restaurant ?, correct: true }
          - {
              text: Tu aimes manger ?,
