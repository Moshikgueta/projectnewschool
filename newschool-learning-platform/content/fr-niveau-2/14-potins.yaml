    title: Potins
    items: *potins-words

activities:
  - slug: potins-comparaisons
    title: 'Les comparaisons : plus, moins, aussi… que'
    minutes: 8
    items:
      - id: plus-bavarde
        type: multipleChoice
        prompt: Marie parle beaucoup. Sophie parle peu. Marie est ___ Sophie.
        options:
          - { text: plus bavarde que, correct: true }
          - {
              text: moins bavarde que,
              feedback: 'Marie parle plus que Sophie : c’est la supériorité, *plus bavarde que*.',
            }
          - {
              text: plus bavarde de,
              feedback: 'Pour comparer deux personnes, on utilise *que* : *plus bavarde que*.',
            }
      - id: aussi-que
        type: fillBlank
        prompt: Complète la comparaison d’égalité.
        text: Les potins à l’école sont ___ courants ___ ceux au travail.
        blanks: [[aussi], [que]]
      - id: le-plus-drole
        type: multipleChoice
        prompt: C’était le potin ___ de tous.
        options:
          - { text: le plus drôle, correct: true }
          - {
              text: plus drôle,
              feedback: 'Au superlatif, il faut l’article : *le potin le plus drôle*.',
            }
          - {
              text: le plus drôle que,
              feedback: 'Après un superlatif, on utilise *de*, pas *que* : *le plus drôle de tous*.',
            }
      - id: plus-bon
        type: trueFalse
        prompt: 'On peut dire : *Ce choix est plus bon que l’autre.*'
        answer: false
        feedback:
          correct: 'Bravo ! *Bon* devient *meilleur* : *Ce choix est meilleur que l’autre.*'
          incorrect: 'On ne dit pas *plus bon*. *Bon* devient *meilleur* : *Ce choix est meilleur que l’autre.*'
      - id: formes
        type: matching
        prompt: Associe chaque comparaison à sa forme.
        pairs:
          - [supériorité, plus … que]
          - [infériorité, moins … que]
          - [égalité, aussi … que]
          - [superlatif, le / la / les plus …]
      - id: la-les
        type: fillBlank
        prompt: Complète avec l’article du superlatif (*le*, *la* ou *les*).
        text: Indila est ___ plus intéressante de la liste. Mes cousins sont ___ plus bavards de la famille.
        blanks: [[la], [les]]
        wordBank: [le, la, les]
      - id: mieux
        type: multipleChoice
        prompt: Je choisis Indila parce qu’elle chante ___ qu’Aya Nakamura.
        options:
          - { text: mieux, correct: true }
          - {
              text: meilleur,
              feedback: '*Chanter* est un verbe : on utilise l’adverbe *bien → mieux*. *Meilleur* va avec un nom.',
            }
          - { text: plus bien, feedback: 'On ne dit pas *plus bien*. *Bien* devient *mieux*.' }
      - id: ordre-frere
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Je suis moins bavard que mon frère.

  - slug: potins-passe-compose
    title: 'Le passé composé : j’ai entendu, il est sorti'
    minutes: 8
    items:
      - id: ai-parle
        type: multipleChoice
        prompt: Hier, ___ avec mon ami.
        options:
          - { text: j’ai parlé, correct: true }
          - { text: je suis parlé, feedback: '*Parler* prend l’auxiliaire *avoir* : *j’ai parlé*.' }
          - {
              text: je parle,
              feedback: '*Je parle* est au présent. Avec *hier*, on utilise le passé composé : *j’ai parlé*.',
            }
      - id: sommes-alles
        type: fillBlank
        prompt: Complète au passé composé avec le verbe *aller*.
        text: Samedi, nous ___ au cinéma.
        blanks: [[sommes allés, sommes allées]]
      - id: participes
        type: matching
        prompt: Associe chaque verbe à son participe passé.
        pairs:
          - [faire, fait]
          - [voir, vu]
          - [prendre, pris]
          - [venir, venu]
          - [pouvoir, pu]
      - id: sont-partis
        type: multipleChoice
        prompt: Ils ___ partis en vacances la semaine dernière.
        options:
          - { text: sont, correct: true }
          - {
              text: ont,
              feedback: '*Partir* est un verbe de déplacement : il prend *être*. *Ils sont partis.*',
            }
          - { text: est, feedback: '*Ils* est au pluriel : *ils sont partis*.' }
      - id: accord-etre
        type: trueFalse
        prompt: 'Avec *être*, le participe passé s’accorde avec le sujet : *Elle est allée à l’école.*'
        answer: true
        feedback:
          correct: 'Bravo ! Avec *être*, on ajoute *-e* au féminin et *-s* au pluriel : *elle est allée, ils sont allés*.'
          incorrect: 'Avec *être*, le participe s’accorde avec le sujet : *elle est allée* (+ e).'
      - id: est-sortie
        type: fillBlank
        prompt: Complète au passé composé avec le verbe *sortir*.
        text: La semaine dernière, mon amie ___ avec un acteur célèbre.
        blanks: [[est sortie]]
      - id: a-fini
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - { text: Il a fini ses devoirs., correct: true }
          - {
              text: Il a finé ses devoirs.,
              feedback: 'Les verbes en *-ir* comme *finir* font leur participe en *-i* : *fini*.',
            }
          - {
              text: Il est fini ses devoirs.,
              feedback: '*Finir* prend l’auxiliaire *avoir* : *il a fini*.',
            }
      - id: ordre-potin
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: J’ai entendu un potin à l’école.
