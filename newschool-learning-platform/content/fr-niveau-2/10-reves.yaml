vocabulary:
  - slug: reves
    title: Rêves
    items: *reves-words

activities:
  - slug: reves-passe
    title: 'Les temps du passé : passé composé et imparfait'
    minutes: 8
    items:
      - id: ai-fait
        type: multipleChoice
        prompt: La nuit dernière, ___ un rêve très étrange.
        options:
          - { text: j’ai fait, correct: true }
          - {
              text: je faisais,
              feedback: 'C’est un événement ponctuel (la nuit dernière) : on utilise le passé composé, *j’ai fait*.',
            }
          - {
              text: je fais,
              feedback: '*Je fais* est au présent. Avec *la nuit dernière*, on utilise le passé composé : *j’ai fait*.',
            }
      - id: revais
        type: multipleChoice
        prompt: Quand j’étais petit, je ___ souvent que je volais.
        options:
          - { text: rêvais, correct: true }
          - {
              text: rêve,
              feedback: '*Je rêve* est au présent. Pour une habitude dans le passé, on utilise l’imparfait : *je rêvais*.',
            }
          - {
              text: rêverai,
              feedback: '*Je rêverai* est au futur. Pour une habitude dans le passé, on utilise l’imparfait : *je rêvais*.',
            }
      - id: etions-faisait
        type: fillBlank
        prompt: Complète avec l’imparfait des verbes entre parenthèses.
        text: Dans mon rêve, nous ___ (être) dans une forêt et il ___ (faire) nuit.
        blanks: [[étions], [faisait]]
      - id: participe-accord
        type: trueFalse
        prompt: Au passé composé, le participe passé ne change jamais.
        answer: false
        feedback:
          correct: 'Bravo ! Avec *être*, le participe s’accorde avec le sujet : *elle est allée*, *ils sont allés*.'
          incorrect: 'Avec *avoir*, le participe ne change pas (*elle a joué*). Mais avec *être*, il s’accorde avec le sujet : *elle est allée*.'
      - id: est-allee
        type: multipleChoice
        prompt: Hier, Léa ___ à la plage.
        options:
          - { text: est allée, correct: true }
          - {
              text: a allé,
              feedback: 'Le verbe *aller* se conjugue avec *être* au passé composé : *elle est allée*.',
            }
          - {
              text: est allé,
              feedback: 'Avec *être*, le participe s’accorde avec le sujet. Léa est une femme : *elle est allée*.',
            }
      - id: participes
        type: matching
        prompt: Associe chaque verbe à son participe passé.
        pairs:
          - [rêver, rêvé]
          - [voir, vu]
          - [faire, fait]
          - [tomber, tombé]
          - [entendre, entendu]
      - id: jouions-avons-joue
        type: fillBlank
        prompt: Complète avec le verbe *jouer* à l’imparfait ou au passé composé.
        text: Au lycée, nous ___ au football tous les samedis. Hier, nous ___ au football.
        blanks: [[jouions], [avons joué]]
      - id: ordre-reve
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Hier, j’ai rêvé de la mer.

  - slug: reves-prepositions
    title: 'Les prépositions : dans, à, en, sur…'
    minutes: 8
    items:
      - id: a-paris
        type: multipleChoice
        prompt: J’habite ___ Paris.
        options:
          - { text: à, correct: true }
          - {
              text: en,
              feedback: '*En* va devant un pays féminin (*en France*). Devant une ville, on dit *à* : *à Paris*.',
            }
          - {
              text: dans,
              feedback: 'Devant le nom d’une ville, on utilise *à* : *j’habite à Paris*.',
            }
      - id: en-france
        type: multipleChoice
        prompt: Dans mon rêve, j’étais ___ France.
        options:
          - { text: en, correct: true }
          - {
              text: à,
              feedback: '*À* va devant une ville (*à Paris*). *France* est un pays féminin : *en France*.',
            }
          - {
              text: au,
              feedback: '*Au* va devant un pays masculin (*au Canada*). *France* est féminin : *en France*.',
            }
      - id: sur-dans
        type: fillBlank
        prompt: Complète avec *sur* ou *dans*.
        text: Le livre est ___ la table et les clés sont ___ la boîte (à l’intérieur).
        blanks: [[sur], [dans]]
        wordBank: [sur, dans]
      - id: dans-trois-mois
        type: multipleChoice
        prompt: Je pars en vacances ___ trois mois. (C’est dans le futur.)
        options:
          - { text: dans, correct: true }
          - {
              text: pendant,
              feedback: '*Pendant* donne une durée (*pendant dix heures*). Pour un moment dans le futur, on dit *dans* : *dans trois mois*.',
            }
          - {
              text: depuis,
              feedback: '*Depuis* est pour une action qui continue. Pour un moment dans le futur, on dit *dans trois mois*.',
            }
      - id: en-a
        type: fillBlank
        prompt: Complète avec *en* ou *à*.
        text: Je suis né(e) ___ 2001. Le rendez-vous est ___ 8 heures.
        blanks: [[en], [à]]
        wordBank: [en, à]
      - id: lieu-hebreu
        type: matching
        prompt: Associe chaque préposition à sa traduction.
        pairs:
          - [devant, מול]
          - [derrière, מאחורי]
          - [à côté de, ליד]
          - [autour de, סביב]
          - [au-dessus de, מעל]
      - id: en-ville
        type: trueFalse
        prompt: 'Devant le nom d’une ville, on utilise *en* : *en Paris*.'
        answer: false
        feedback:
          correct: 'Bravo ! Devant une ville, on dit *à* : *à Paris*. *En* va devant un pays féminin : *en France*.'
          incorrect: 'Devant une ville, on dit *à* : *à Paris*. *En* va devant un pays féminin : *en France*.'
      - id: depuis
        type: multipleChoice
        prompt: J’apprends le français ___ deux ans. (Et je continue !)
        options:
          - { text: depuis, correct: true }
          - {
              text: dans,
              feedback: '*Dans* est pour un moment dans le futur. Pour une action qui continue, on dit *depuis* : *depuis deux ans*.',
            }
          - {
              text: en,
              feedback: '*En* va devant un mois ou une année (*en 2026*). Pour une action qui continue, on dit *depuis*.',
            }
