    title: 'Réseaux sociaux : le passé'
    items: *reseaux-sociaux-passe-words

activities:
  - slug: reseaux-sociaux-passe-comparaisons
    title: 'Les comparaisons au passé'
    minutes: 8
    items:
      - id: plus-populaire
        type: multipleChoice
        prompt: 'L’année dernière, tout le monde utilisait Instagram, mais peu de gens utilisaient Facebook. Instagram a été ___ populaire que Facebook.'
        options:
          - { text: plus, correct: true }
          - {
              text: moins,
              feedback: 'Tout le monde utilisait Instagram : il a été *plus* populaire.',
            }
          - {
              text: aussi,
              feedback: '*Aussi… que* veut dire « égal ». Ici, Instagram avait plus d’utilisateurs : *plus*.',
            }
      - id: moins-de
        type: fillBlank
        prompt: Complète la comparaison avec un nom.
        text: Tu as reçu moins ___ commentaires que moi.
        blanks: [[de]]
      - id: la-plus
        type: multipleChoice
        prompt: TikTok a été l’application ___ amusante de l’année.
        options:
          - { text: la plus, correct: true }
          - {
              text: plus,
              feedback: 'Pour le superlatif, il faut l’article : *l’application la plus amusante*.',
            }
          - { text: le plus, feedback: '*Application* est féminin : *la plus amusante*.' }
      - id: superlatif-de
        type: trueFalse
        prompt: 'Après un superlatif, on utilise *de* pour le groupe : *l’application la plus amusante de l’année*.'
        answer: true
        feedback:
          correct: 'Bravo ! *la plus amusante de l’année*, *la plus jeune du groupe*.'
          incorrect: 'C’est vrai : après le superlatif, on dit *de* : *la plus amusante de l’année*.'
      - id: aussi
        type: fillBlank
        prompt: 'Complète : les deux applications sont égales (=).'
        text: YouTube a été ___ intéressant que Spotify.
        blanks: [[aussi]]
      - id: questions-reponses
        type: matching
        prompt: Associe chaque question à sa réponse.
        pairs:
          - [Quel réseau as-tu le plus utilisé ?, J’ai surtout utilisé TikTok.]
          - [Quelle a été ta publication la plus vue ?, Une vidéo de mon chien.]
          - [Quel argument était le plus fort ?, L’argument du groupe A.]
          - [Quelle application était la moins pratique ?, Facebook était la moins pratique.]
      - id: meilleure
        type: multipleChoice
        prompt: Ma vidéo a eu mille vues, ta vidéo a eu dix vues. Ma vidéo a été ___ que la tienne.
        options:
          - { text: meilleure, correct: true }
          - {
              text: plus bonne,
              feedback: 'On ne dit pas *plus bon(ne)* : *bon* devient *meilleur*, et ici *meilleure* (la vidéo).',
            }
          - { text: meilleur, feedback: '*Vidéo* est féminin : *meilleure*.' }
      - id: ordre-applications
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Tu as utilisé plus d’applications que moi.

  - slug: reseaux-sociaux-passe-passe
    title: 'Les temps du passé : passé composé et imparfait'
    minutes: 8
    items:
      - id: ai-utilise
        type: multipleChoice
        prompt: Hier, ___ Instagram.
        options:
          - { text: j’ai utilisé, correct: true }
          - {
              text: je suis utilisé,
              feedback: '*Utiliser* se conjugue avec *avoir* : *j’ai utilisé*.',
            }
          - {
              text: j’utiliserai,
              feedback: '*J’utiliserai* est au futur. Avec *hier*, on utilise le passé composé : *j’ai utilisé*.',
            }
      - id: participes
        type: fillBlank
        prompt: Complète avec le participe passé du verbe entre parenthèses.
        text: (ouvrir) En janvier, j’ai ___ mon compte TikTok. (recevoir) En août, j’ai ___ cent « likes ».
        blanks: [[ouvert], [reçu]]
      - id: infinitif-participe
        type: matching
        prompt: Associe chaque infinitif à son participe passé.
        pairs:
          - [utiliser, utilisé]
          - [ouvrir, ouvert]
          - [recevoir, reçu]
          - [voir, vu]
          - [rire, ri]
      - id: negation
        type: multipleChoice
        prompt: L’année dernière, je ___ publié de photos.
        options:
          - { text: n’ai pas, correct: true }
          - {
              text: ne pas ai,
              feedback: 'La négation entoure l’auxiliaire : *je n’ai pas publié*.',
            }
          - {
              text: ai pas,
              feedback: 'À l’écrit, la négation a deux mots, *ne (n’)* et *pas* : *je n’ai pas publié*.',
            }
      - id: imparfait-habitude
        type: trueFalse
        prompt: 'Pour une habitude ou une description au passé, on utilise l’imparfait : *Mes parents n’utilisaient pas les réseaux sociaux.*'
        answer: true
        feedback:
          correct: 'Bravo ! Habitudes et descriptions au passé → imparfait.'
          incorrect: 'C’est vrai : pour une habitude ou une description au passé, on utilise l’imparfait (*utilisaient, était*).'
      - id: etaient
        type: multipleChoice
        prompt: Quand ils ___ jeunes, mes parents n’utilisaient pas les réseaux sociaux.
        options:
          - { text: étaient, correct: true }
          - {
              text: ont été,
              feedback: 'C’est une description dans le passé : on utilise l’imparfait, *étaient*.',
            }
          - {
              text: seront,
              feedback: '*Seront* est au futur. Pour une description au passé : *étaient*.',
            }
      - id: partagee
        type: fillBlank
        prompt: Complète avec le participe passé de *partager*. Attention, *l’* = *la vidéo* (féminin), placé avant le verbe.
        text: J’ai regardé une vidéo et ensuite je l’ai ___.
        blanks: [[partagée]]
      - id: ordre-publicite
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Je n’ai pas aimé cette publicité.
