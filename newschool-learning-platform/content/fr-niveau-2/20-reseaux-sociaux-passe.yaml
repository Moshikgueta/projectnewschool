# Cycle "Réseaux sociaux : le passé", converted from the French level 2 digital notebook
# ("Cahier digital 2025 - français niveau 2", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-2
slug: reseaux-sociaux-passe
title: 'Réseaux sociaux : le passé'
goal: Raconter ses expériences sur les réseaux sociaux au passé composé et à l’imparfait, et faire des comparaisons.
position: 20
status: in_review

review:
  - >-
    The two workbook exercises ("Les comparaisons" and "Les temps du passé") are NEW:
    the notebook has no self-study exercises. They were written from the cycle's two
    skills, its summary rules (as completed below), the activity examples and its
    vocabulary. Please check level, wording and every right answer before students
    see them.
  - >-
    Summary, passé composé: the structure "sujet + avoir/être + participe passé" had
    no word on which verbs take être or on agreement. Two short rules were added:
    être with aller, venir, partir… (agreement with the subject: elle est allée), and
    agreement of the participle with a direct object placed before avoir, which the
    cycle's own examples use (je l'ai partagée = la vidéo; Quelle application as-tu
    utilisée ?). The workbook has one item on this (je l'ai partagée). Please
    confirm this is not too much for the level.
  - >-
    Summary, comparisons: "Le/la plus – le/la moins + adjectif" → "le / la / les plus
    (moins) + adjectif (+ de)"; a rule "plus de / moins de + nom + que" was added
    because the activities use it (Tu as reçu moins de commentaires que moi, Tu as
    utilisé plus d'applications que moi), and "bon → meilleur" (used in the
    workbook).
  - >-
    Corrections: Activity 1 "Qu'est-ce que ton partenaire a-t-il publié ?" →
    "Qu'est-ce que ton partenaire a publié ?" (no inversion after "qu'est-ce que");
    warm-up model "j'ai utilisé plus Instagram que Facebook" → "j'ai plus utilisé
    Instagram que Facebook" (the adverb goes between the auxiliary and the
    participle); English quotation marks “likes” → « likes ».
  - >-
    Homework: the four Mori parts are written as messages the student sends to Mori
    (the source mixes "Demande-moi…" with orders to the student such as "Compare
    Instagram et Facebook…", now "Demande-moi de comparer Instagram et
    Facebook…"). The closing line "Corrige mes erreurs et donne-moi une phrase
    modèle" is added to each message.
  - >-
    Activity 2 times: "7–8 min" is recorded as 8; total 8 + 10 + 5 + 3 = 26 minutes.
    The other activities have no times.
  - >-
    Vocabulary: the list is the same as in the previous cycle (Réseaux sociaux : le
    futur), with the same gloss changes: "Aussi… que – באותה מידה" → "באותה מידה…
    כמו"; "Amusant(e) / drôle" → "מהנה / מצחיק"; "Abonné" → "עוקב / מנוי". Please
    confirm, or give this cycle its own list (e.g. past-tense verbs).
  - >-
    The Quizlet link is kept without its tracking parameters (?i=…&x=…). The "Réponse
    de l'élève 1/2/3" lines are replaced by the optional answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: reseaux-sociaux-passe-classe
    title: 'Classe : Réseaux sociaux, le passé'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Réseaux sociaux : le passé'
      - id: skills
        type: cycleOverview
        skills:
          - name: Les comparaisons
            description: '*plus / moins / aussi… que, le / la plus…* : Instagram a été plus populaire que Facebook.'
          - name: Les temps du passé
            description: 'Passé composé (*j’ai publié, je suis allé(e)*) et imparfait (*c’était, j’utilisais*)'
      - id: quizlet
        type: externalLink
        label: Réseaux sociaux (passé) sur Quizlet
        url: https://quizlet.com/il/1096733869/conversational-french-2025-reseaux-sociaux-passe-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. Hier, j’ai utilisé ___ (nom du réseau social), j’ai publié ___.
        example: Je m’appelle Lévanah. Hier, j’ai utilisé Instagram, j’ai publié la photo d’un gâteau.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup
        type: discussionQuestions
        items:
          - question: Quel réseau social as-tu utilisé hier ? Pourquoi ?
            frame: Hier, j’ai utilisé WhatsApp parce que j’ai parlé avec ma famille.
          - question: Quelle a été la dernière photo ou vidéo que tu as publiée ?
            frame: La dernière photo que j’ai publiée était celle de mon chien.
          - question: Quelle musique as-tu écoutée sur YouTube ou Spotify la semaine dernière ?
            frame: La semaine dernière, j’ai écouté du reggaeton sur Spotify.
          - question: Quelle a été la dernière publication intéressante que tu as vue ? Où ?
            frame: J’ai vu une recette sur TikTok, c’était très utile.
          - question: Quel réseau social as-tu le plus utilisé l’année dernière ? Et le moins utilisé ?
            frame: L’année dernière, j’ai plus utilisé Instagram que Facebook.
          - question: As-tu vécu une expérience amusante ou étrange sur les réseaux ?
            frame: Oui, un ami m’a identifié sur un mème très drôle.
          - question: Avec qui as-tu le plus parlé sur WhatsApp le mois dernier ?
            frame: Le mois dernier, j’ai parlé surtout avec mon meilleur ami.
          - question: Quelle publication t’a fait beaucoup rire ?
            frame: Il y a deux jours, j’ai vu un mème sur Instagram et j’ai beaucoup ri.
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Mon expérience sur les réseaux'
        skills: [Les temps du passé, Les comparaisons]
        steps:
          - Raconte ce que tu as fait récemment sur les réseaux sociaux. Écris **quatre phrases** au passé (ci-dessous).
          - 'En binôme, posez-vous ces questions : *Qu’est-ce que ton partenaire a publié ? Quelle publication as-tu préférée ? Quel réseau a été le plus intéressant pour toi ?*'
          - Partage une phrase de ton / ta camarade avec le groupe.
        example: |-
          *Hier, j’ai utilisé Instagram.*
          *J’ai regardé des vidéos de cuisine.*
          *J’ai aimé un post de recettes.*
          *Je n’ai pas aimé une publicité.*
      - id: act1-sentences
        type: discussionQuestions
        title: Mes quatre phrases
        items:
          - question: Quel réseau social as-tu utilisé ?
            frame: Hier, j’ai utilisé ___.
          - question: Qu’as-tu vu ou publié ?
            frame: J’ai regardé / J’ai publié ___.
          - question: Qu’est-ce que tu as aimé ?
            frame: J’ai aimé ___.
          - question: Qu’est-ce que tu n’as pas aimé ?
            frame: Je n’ai pas aimé ___.
      - id: act2
        type: classActivity
        title: 'Activité 2 : Débat, l’année dernière, les réseaux sociaux ont-ils aidé ou causé des problèmes ?'
        skills: [Les temps du passé, Les comparaisons]
        minutes: 26
        steps:
          - 'Formez deux groupes. **Groupe A** : « Les réseaux sociaux ont aidé. » **Groupe B** : « Les réseaux sociaux ont causé des problèmes. »'
          - 'Préparation (8 minutes) : chaque groupe écrit 3 ou 4 phrases au passé, à partir d’exemples réels ou inventés.'
          - 'Débat (10 minutes) : chaque élève lit une phrase. Le groupe opposé peut réagir avec une autre idée au passé.'
          - 'Comparaison (5 minutes) : quel argument était le plus fort ? Quel groupe a utilisé le plus d’exemples au passé ?'
          - 'Vote final (3 minutes) : votez pour le groupe le plus convaincant.'
        example: |-
          **Groupe A (positif)**
          *L’année dernière, les réseaux sociaux ont permis de garder le contact avec la famille.*
          *Les gens ont appris le français sur YouTube plus qu’à l’école.*
          *Les réseaux ont aidé les étudiants à communiquer avec leurs professeurs.*
          **Groupe B (négatif)**
          *L’année dernière, les réseaux ont créé plus d’addictions qu’il y a deux ans.*
          *Beaucoup de personnes ont passé moins de temps avec leur famille et plus de temps sur Internet.*
          *Les réseaux ont été moins sûrs qu’avant.*
      - id: act2-sentences
        type: discussionQuestions
        title: Nos arguments
        items:
          - question: L’année dernière, les réseaux sociaux ___.
          - question: Les réseaux ___.
          - question: Beaucoup de personnes ___.
      - id: act3
        type: classActivity
        title: 'Activité 3 : Ma ligne du temps numérique'
        skills: [Les temps du passé, Les comparaisons]
        steps:
          - 'Crée une ligne du temps avec **trois moments importants** de ton année sur les réseaux (par exemple : j’ai ouvert un compte, j’ai publié ma première photo, j’ai reçu beaucoup de « likes »).'
          - 'En binôme, comparez : *Ma première publication a été plus populaire que la tienne. Tu as reçu moins de commentaires que moi.*'
        example: |-
          *En janvier, j’ai ouvert mon compte TikTok.*
          *En mars, j’ai publié ma première vidéo.*
          *En août, j’ai reçu cent « likes ».*
      - id: act3-timeline
        type: discussionQuestions
        title: Ma ligne du temps
        items:
          - question: En ___ (mois), j’ai ___.
          - question: En ___ (mois), j’ai ___.
          - question: En ___ (mois), j’ai ___.
      - id: act4
        type: classActivity
        title: 'Activité 4 : L’interview des souvenirs'
        skills: [Les temps du passé, Les comparaisons]
        steps:
          - En binôme, un élève joue le **journaliste** et l’autre un **influenceur célèbre**.
          - Le journaliste pose **4 questions** au passé, au choix dans la liste ci-dessous.
          - L’influenceur répond au passé.
          - Ensuite, on inverse les rôles.
      - id: act4-questions
        type: discussionQuestions
        title: Questions du journaliste
        items:
          - question: Quelle a été ta publication la plus vue l’année dernière ?
            frame: Ma publication la plus vue a été une vidéo de mon chien.
          - question: Qu’as-tu fait sur ton premier compte ?
            frame: J’ai publié des photos avec mes amis.
          - question: Quelle célébrité as-tu suivie pour la première fois ?
            frame: J’ai suivi un chanteur très populaire sur Instagram.
          - question: Quelle a été la meilleure réaction à une de tes publications ?
            frame: Le meilleur commentaire a été « ta photo est incroyable ».
          - question: Quelle application as-tu le plus utilisée l’année dernière ? Pourquoi ?
            frame: J’ai surtout utilisé TikTok parce que j’ai vu beaucoup de vidéos amusantes.
      - id: act5
        type: classActivity
        title: 'Activité 5 : Histoire vraie, histoire fausse'
        skills: [Les temps du passé, Les comparaisons]
        steps:
          - Prépare **deux phrases au passé** sur les réseaux sociaux, une vraie et une fausse.
          - Lis tes phrases. Les autres devinent quelle phrase est vraie.
          - 'Utilise des comparaisons : *Ton histoire semblait plus réaliste que l’autre.*'
        example: |-
          *L’année dernière, j’ai publié une vidéo qui a eu mille vues.*
          *Il y a deux ans, j’ai supprimé toutes mes photos d’Instagram.*
      - id: act5-sentences
        type: discussionQuestions
        title: Vrai ou faux ?
        items:
          - question: 'Phrase 1 : ___'
          - question: 'Phrase 2 : ___'
      - id: act6
        type: classActivity
        title: 'Activité 6 : Mon journal numérique'
        skills: [Les temps du passé, Les comparaisons]
        steps:
          - Écris un mini-journal de 4 ou 5 phrases au passé sur une journée sur les réseaux sociaux.
          - 'En binôme, comparez vos journées : *Tu as utilisé plus d’applications que moi. J’ai publié moins de photos que toi.*'
        example: |-
          *Hier, j’ai utilisé WhatsApp pour parler avec ma mère.*
          *J’ai regardé deux vidéos sur TikTok.*
          *Ensuite, j’ai partagé une photo sur Instagram.*
          *C’était une journée très active !*
      - id: act6-journal
        type: discussionQuestions
        title: Mon journal
        items:
          - question: Hier, ___.
          - question: Ensuite, ___.
          - question: Puis, ___.
          - question: Enfin, ___.
          - question: C’était ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Deux compétences dans ce cycle : **les comparaisons** et **les temps du passé**
          (passé composé et imparfait). Toutes les activités pratiquent les deux. Il y a
          six activités : choisis-en deux ou trois selon le temps.
      - id: n-intro
        anchor: intro
        text: Donne d’abord ton propre exemple, puis interroge chaque élève.
      - id: n-warmup
        anchor: warmup
        text: Pose au moins deux questions à chaque élève. Les phrases sous chaque question sont des modèles de réponse.
      - id: n-act2
        anchor: act2
        minutes: 26
        text: >-
          Préparation : 8 minutes. Débat : 10 minutes. Comparaison : 5 minutes (note
          quelques phrases au tableau et pose les questions). Vote final : 3 minutes.
      - id: n-act5
        anchor: act5
        text: Encourage les élèves à utiliser des comparaisons quand ils donnent leur réponse.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: reseaux-sociaux-passe-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: rules-passe-compose
        type: ruleSummary
        skill: Le passé composé
        rules:
          - text: 'On utilise le passé composé pour des **actions terminées** à un moment précis du passé, des **expériences personnelles** et une **suite d’actions**.'
            examples:
              - Hier, j’ai utilisé WhatsApp pour parler avec ma famille.
              - L’année dernière, j’ai ouvert un compte TikTok.
              - J’ai publié une photo et j’ai reçu beaucoup de « likes ».
          - text: 'Structure : sujet + **avoir** ou **être** au présent + **participe passé**.'
            examples: [j’ai publié · j’ai vu · j’ai reçu · j’ai ouvert]
          - text: 'Avec **être** (aller, venir, partir, arriver, naître…), le participe s’accorde avec le sujet.'
            examples: [Il est allé au concert., Elle est allée au concert.]
          - text: 'Avec **avoir**, le participe s’accorde avec le complément quand il est **placé avant** le verbe.'
            examples:
              - J’ai regardé une vidéo et ensuite je l’ai partagée. (l’ = la vidéo)
              - Quelle application as-tu utilisée hier ?
      - id: rules-imparfait
        type: ruleSummary
        skill: L’imparfait
        rules:
          - text: '**Attention** : on utilise l’imparfait pour les **descriptions** et les **habitudes** au passé.'
            examples:
              - La photo que tu as publiée était très belle.
              - Mes parents n’utilisaient pas les réseaux sociaux quand ils étaient jeunes.
      - id: rules-questions
        type: ruleSummary
        skill: Les questions et la négation au passé composé
        rules:
          - text: 'Questions avec inversion : **auxiliaire + sujet + participe**.'
            examples:
              - Quelle application as-tu utilisée hier ?
              - Qu’as-tu publié la semaine dernière ?
              - Quelle a été ta publication la plus vue ?
              - Quelle appli as-tu le plus utilisée l’année dernière ?
          - text: 'Négation : **ne (n’)** + auxiliaire + **pas** + participe. Après la négation, *un / une / des* deviennent **de**.'
            examples:
              - Hier, je n’ai pas utilisé Instagram.
              - L’année dernière, je n’ai pas publié de photos.
              - La semaine dernière, je n’ai pas écouté de musique sur Spotify.
          - text: 'Marqueurs temporels : hier, la semaine dernière, le mois dernier, l’année dernière, il y a deux jours, en 2023.'
            examples:
              - Hier, j’ai utilisé Instagram, puis j’ai regardé une vidéo sur YouTube et enfin j’ai partagé une photo sur Facebook.
      - id: rules-comparaisons
        type: ruleSummary
        skill: Les comparaisons
        rules:
          - text: '**plus / moins + adjectif + que**'
            examples:
              [
                Instagram a été plus populaire que Facebook.,
                TikTok a été moins utile que YouTube pour apprendre.,
              ]
          - text: '**aussi + adjectif + que** (égalité)'
            examples: [YouTube a été aussi intéressant que Spotify.]
          - text: '**le / la / les plus (moins) + adjectif** (+ **de**) : le superlatif.'
            examples:
              [
                TikTok a été l’application la plus amusante de l’année.,
                Facebook était l’application la moins pratique.,
              ]
          - text: 'Avec un nom : **plus de / moins de + nom + que**.'
            examples:
              [
                Tu as reçu moins de commentaires que moi.,
                Tu as utilisé plus d’applications que moi.,
              ]
          - text: 'Attention : **bon → meilleur** (on ne dit pas *plus bon*).'
            examples: [Ma vidéo a été meilleure que la tienne.]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Révise les deux compétences avec le groupe et demande un nouvel exemple pour chaque règle.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: reseaux-sociaux-passe-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie un message et envoie-le. Mori va te poser des questions ; réponds à toutes.
      - id: mori-questions
        type: aiTutorPrompt
        title: 'Partie 1 : Questions personnelles'
        message: |-
          Bonjour Mori ! Je veux pratiquer le passé. Pose-moi ces questions une par une :
          Demande-moi quel réseau j’ai utilisé hier et pourquoi.
          Demande-moi quelle a été la dernière photo ou vidéo que j’ai publiée.
          Demande-moi quelle musique j’ai écoutée sur YouTube ou Spotify la semaine dernière.
          Demande-moi quelle a été la publication la plus intéressante que j’ai vue récemment.
          Demande-moi quel réseau j’ai le plus utilisé l’année dernière et lequel le moins.
          Demande-moi si j’ai eu une expérience amusante ou étrange sur les réseaux.
          Corrige mes erreurs et donne-moi une phrase modèle pour m’améliorer.
      - id: mori-comparaisons
        type: aiTutorPrompt
        title: 'Partie 2 : Comparaisons'
        message: |-
          Bonjour Mori ! Je veux pratiquer les comparaisons au passé :
          Demande-moi de comparer deux réseaux que j’ai utilisés le mois dernier.
          Demande-moi de comparer Instagram et Facebook avec « plus… que » ou « moins… que ».
          Pose-moi une question avec « le plus » ou « la plus » au sujet des réseaux.
          Corrige mes erreurs et donne-moi une phrase modèle pour m’améliorer.
      - id: mori-narration
        type: aiTutorPrompt
        title: 'Partie 3 : Brève narration'
        message: >-
          Bonjour Mori ! Demande-moi de raconter en 5 phrases ce que j’ai fait sur les
          réseaux hier. Ensuite, corrige mes erreurs et propose une version améliorée.
      - id: mori-creation
        type: aiTutorPrompt
        title: 'Partie 4 : Création'
        message: |-
          Bonjour Mori ! Fais-moi une interview comme si j’étais un influenceur célèbre :
          Demande-moi ce que j’ai publié l’année dernière et ce qui a été populaire.
          Demande-moi ce que j’ai ressenti quand j’ai reçu beaucoup de « likes ».
          Demande-moi ce qui a été le plus spécial pour moi sur les réseaux.
          Corrige mes erreurs et donne-moi une phrase modèle pour m’améliorer.
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          Tu veux plus de questions ? Envoie : **S’il te plaît, pose-moi encore des questions !**
          Tu ne comprends pas une explication ? Envoie : **Peux-tu m’expliquer en hébreu, mais avec la phrase en français ?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: reseaux-sociaux-passe-pratique
