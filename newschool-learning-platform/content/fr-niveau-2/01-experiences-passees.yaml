vocabulary:
  - slug: experiences-passees
    title: Expériences passées
    items: *experiences-passees-words

activities:
  - slug: experiences-passees-passe
    title: 'Les temps du passé : passé composé et imparfait'
    minutes: 8
    items:
      - id: hier-pizza
        type: multipleChoice
        prompt: Hier, ___ une pizza.
        options:
          - { text: j’ai mangé, correct: true }
          - {
              text: je mangeais,
              feedback: '*Hier* + une action terminée : on utilise le passé composé, *j’ai mangé*.',
            }
          - {
              text: je mange,
              feedback: '*Je mange* est au présent. Avec *hier*, on utilise le passé composé : *j’ai mangé*.',
            }
      - id: samedi-cinema
        type: multipleChoice
        prompt: Samedi, je ___ au cinéma.
        options:
          - { text: suis allé(e), correct: true }
          - {
              text: ai allé,
              feedback: 'Le verbe *aller* se conjugue avec *être* au passé composé : *je suis allé(e)*.',
            }
          - {
              text: allais,
              feedback: 'Samedi est un moment précis et l’action est terminée : on utilise le passé composé, *je suis allé(e)*.',
            }
      - id: enfant-football
        type: multipleChoice
        prompt: Quand j’étais enfant, je ___ souvent au football.
        options:
          - { text: jouais, correct: true }
          - {
              text: ai joué,
              feedback: '*Quand j’étais enfant* et *souvent* parlent d’une habitude : on utilise l’imparfait, *je jouais*.',
            }
          - {
              text: joue,
              feedback: '*Je joue* est au présent. Pour une habitude dans le passé, on dit *je jouais*.',
            }
      - id: plage-mer
        type: fillBlank
        prompt: Complète avec *aller* au passé composé et *être* à l’imparfait.
        text: L’été dernier, je ___ à la plage. La mer ___ calme.
        blanks: [[suis allé, suis allée, suis allé(e)], [était]]
      - id: participes
        type: matching
        prompt: Associe chaque verbe à son participe passé.
        pairs:
          - [prendre, pris]
          - [apprendre, appris]
          - [courir, couru]
          - [attendre, attendu]
          - [rire, ri]
      - id: aller-avoir
        type: trueFalse
        prompt: 'Au passé composé, on dit : *J’ai allé au supermarché.*'
        answer: false
        feedback:
          correct: 'Bravo ! *Aller* se conjugue avec *être* : *Je suis allé(e) au supermarché.*'
          incorrect: 'Attention : *aller* se conjugue avec *être*. On dit : *Je suis allé(e) au supermarché.*'
      - id: dimanche-dinais
        type: fillBlank
        prompt: Complète avec le verbe *dîner* à l’imparfait (une habitude).
        text: Le dimanche, je ___ avec mes amis.
        blanks: [[dînais]]
      - id: ordre-soeur
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Ma sœur a étudié pour un examen.

  - slug: experiences-passees-questions
    title: 'Poser des questions au passé : Qu’as-tu fait ?'
    minutes: 8
    items:
      - id: question-pates
        type: multipleChoice
        prompt: 'A : *Hier, j’ai préparé des pâtes.* Quelle est la bonne question de B ?'
        options:
          - { text: Qu’as-tu préparé hier ?, correct: true }
          - {
              text: Qu’ai-je préparé hier ?,
              feedback: '*Ai-je* est pour *je*. Pour poser la question à ton / ta partenaire, on dit *as-tu*.',
            }
          - {
              text: Qu’as-tu préparer hier ?,
              feedback: 'Au passé composé, on utilise le participe passé *préparé*, pas l’infinitif *préparer*.',
            }
      - id: es-tu-alle
        type: fillBlank
        prompt: Complète la question avec l’auxiliaire *être*.
        text: Où ___-tu allé(e) le week-end dernier ? — Je suis allé(e) au supermarché.
        blanks: [[es]]
      - id: as-qui
        type: fillBlank
        prompt: Complète les questions.
        text: Qu’___-tu mangé hier ? — J’ai mangé une salade. Avec ___ es-tu allé(e) au cinéma ? — Avec mon frère.
        blanks: [[as], [qui]]
      - id: questions-reponses
        type: matching
        prompt: Associe chaque question à sa réponse.
        pairs:
          - [Qu’as-tu vu ?, J’ai vu un film d’action.]
          - [Où as-tu voyagé ?, J’ai voyagé à Madrid.]
          - [Avec qui es-tu allé(e) au cinéma ?, Avec mon frère.]
          - [Quand es-tu allé(e) au musée ?, Il y a une semaine.]
          - [Qu’as-tu appris la semaine dernière ?, J’ai appris une chanson.]
      - id: est-ce-que
        type: trueFalse
        prompt: '*Qu’as-tu fait hier ?* et *Qu’est-ce que tu as fait hier ?* ont le même sens.'
        answer: true
        feedback:
          correct: 'Bravo ! On peut inverser (*as-tu*) ou utiliser *est-ce que* : le sens est le même.'
          incorrect: 'Les deux questions ont le même sens : on peut inverser (*as-tu*) ou utiliser *est-ce que*.'
      - id: camarade-film
        type: multipleChoice
        prompt: 'Ton camarade dit : *J’ai regardé un film.* Raconte au groupe : Mon camarade ___ un film.'
        options:
          - { text: a regardé, correct: true }
          - {
              text: ai regardé,
              feedback: '*Ai regardé* est pour *je*. Pour *il* (mon camarade), on dit *a regardé*.',
            }
          - {
              text: as regardé,
              feedback: '*As regardé* est pour *tu*. Pour *il* (mon camarade), on dit *a regardé*.',
            }
      - id: camarade-plage
        type: multipleChoice
        prompt: 'Ta camarade dit : *Je suis allée à la plage.* Raconte au groupe : Ma camarade ___ à la plage.'
        options:
          - { text: est allée, correct: true }
          - { text: a allé, feedback: '*Aller* se conjugue avec *être* : *elle est allée*.' }
          - {
              text: est allé,
              feedback: 'Avec *être*, le participe s’accorde avec le sujet. *Elle* est féminin : *elle est allée*.',
            }
      - id: ordre-camarade
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Mon camarade a préparé des pâtes.
