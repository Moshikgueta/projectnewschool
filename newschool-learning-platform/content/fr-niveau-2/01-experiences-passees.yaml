# Cycle "Expériences passées", converted from the French level 2 digital notebook
# ("Cahier digital 2025 - français niveau 2", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-2
slug: experiences-passees
title: Expériences passées
goal: Raconter des expériences au passé composé et à l’imparfait, et poser des questions au passé.
position: 1
status: in_review

review:
  - >-
    The two workbook exercises ("Les temps du passé" and "Poser des questions au passé")
    are NEW: the notebook has no self-study exercises. They were written from the cycle's
    two skills, its summary rules, the activity examples and its vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    Summary, skill 1: the notebook says when to use the passé composé and the imparfait
    but not how to form them. Added: the passé composé is avoir / être (present) + past
    participle; the list of être verbs (aller, venir, partir, sortir, rentrer, revenir,
    naître… and pronominal verbs like se lever, se reposer) with agreement of the
    participle (elle est allée); irregular participles from the vocabulary (pris, appris,
    couru, ri, attendu); negation around the auxiliary (je n’ai pas cuisiné, je n’ai
    jamais…, from Activities 1 and 2); the imparfait formed on the "nous" stem + -ais,
    -ais, -ait, -ions, -iez, -aient (être → ét-). Two conjugation tables were added.
    Please confirm this matches how you teach it.
  - >-
    Summary, skill 2 ("poser des questions au passé") has no rules in the source. A short
    rule was added from the activity examples: inversion of the auxiliary and the subject
    (Qu’as-tu fait ? Où es-tu allé(e) ?), the est-ce que form (Qu’est-ce que tu as fait ?),
    the question words, and the 1st / 2nd / 3rd person list from Activities 1 and 3. The
    workbook uses it.
  - >-
    Corrections: "à travers de phrases courtes" → "à travers des phrases courtes"
    (Spanish calque, Mori beginner goal); "je dinais" → "je dînais" (summary); "Où es-tu
    parti" → "Où es-tu parti(e)" (warm-up); warm-up frame "J’ai appris… et j’ai aimé parce
    que…" → "J’ai appris… et ça m’a plu parce que…" (aimer needs an object); Mori
    intermediate message 1 "Mon voyage préféré a été en Italie" → "Mon plus beau voyage,
    c’était en Italie" (calque of Spanish "fue a Italia"); Mori beginner message 1 "Je vais
    te répondre et tu pourras corriger mes phrases si je fais des erreurs" was kept but the
    greeting "Bonjour," → "Bonjour Mori," in all six messages.
  - >-
    Mori intermediate message 2 asks for "3 au passé composé, 2 à l’imparfait", but the
    example has 2 in passé composé (j’ai voyagé, a été) and 3 in imparfait (habitais,
    jouais, était). The message now says "2 au passé composé et 3 à l’imparfait" to match
    the example (same fix as in the Spanish notebook).
  - >-
    Activity 2 ("Je n’ai jamais…") has no example in the source. Three frames were added
    (Je n’ai jamais mangé de… / Je ne suis jamais allé(e) à… / Je n’ai jamais vu…). Please
    confirm.
  - >-
    Vocabulary: "Je me suis reposé(e)… נחתי / נח / נח" → "נחתי / נחת / נח"; "L’autre jour
    – ביום האחר" → "לפני כמה ימים" (the Hebrew was word-for-word); "Il est sorti / revenu
    / s’est reposé" kept in the masculine as in the source. Please confirm.
  - >-
    The notebook does not say which activities practise which skill, and gives no
    recommended combinations. The teacher note gives a suggestion (questions: Activities 1
    and 3; past tenses: all activities). Activity 4 needs three images chosen by the
    teacher (not in the notebook).
  - >-
    Times given as ranges are recorded as the upper value (7–8 → 8, 3–4 → 4, 2–3 → 3).
    The Quizlet link is kept without its tracking parameters (?i=…&x=…). The "Réponse de
    l’élève 1/2/3" lines are replaced by the optional answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: experiences-passees-classe
    title: 'Classe : Expériences passées'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Expériences passées
      - id: skills
        type: cycleOverview
        skills:
          - name: Les temps du passé
            description: Passé composé (*j’ai mangé, je suis allé(e)*) et imparfait (*je jouais, c’était*)
          - name: Poser des questions au passé
            description: '*Qu’as-tu fait ? Où es-tu allé(e) ? Avec qui ?*'
      - id: quizlet
        type: externalLink
        label: Expériences passées sur Quizlet
        url: https://quizlet.com/il/1095429882/conversational-french-2025-experiences-passees-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. Le week-end dernier, je ___.
        example: Je m’appelle Lévanah. Le week-end dernier, j’ai mangé au restaurant et je suis allée à la plage.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup-basic-title
        type: heading
        level: 4
        text: Niveau débutant
      - id: warmup-basic
        type: discussionQuestions
        items:
          - question: Qu’as-tu fait hier matin / hier soir ?
            frame: Hier, je me suis levé(e) à…
          - question: Qu’as-tu mangé lors de ton dernier repas ?
            frame: Lors de mon dernier repas, j’ai mangé…
          - question: Quels endroits as-tu visités le mois dernier ?
            frame: Le mois dernier, j’ai visité…
          - question: Quel est le dernier objet que tu as acheté ?
            frame: Le dernier objet que j’ai acheté, c’est…
          - question: Qu’as-tu appris à l’école (ou dans un cours) la semaine dernière ?
            frame: La semaine dernière, j’ai appris…
      - id: warmup-inter-title
        type: heading
        level: 4
        text: Niveau intermédiaire
      - id: warmup-inter
        type: discussionQuestions
        items:
          - question: Quel est le dernier film ou la dernière série que tu as vu(e) et qu’en as-tu pensé ?
            frame: Le dernier film que j’ai vu était… et je l’ai trouvé…
          - question: Qu’as-tu fait hier soir et avec qui étais-tu ?
            frame: Hier soir, j’ai… / J’étais avec…
          - question: Où es-tu parti(e) lors de tes dernières vacances (dans quel pays) et qu’as-tu préféré ?
            frame: J’ai voyagé en… et ce que j’ai préféré, c’est…
          - question: Quelle est la chose la plus intéressante que tu as apprise récemment (à l’école, au travail ou dans un cours) ?
            frame: J’ai appris… et ça m’a plu parce que…
          - question: Quelle a été ta meilleure expérience du mois dernier et pourquoi ?
            frame: Ma meilleure expérience a été… parce que…
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Qu’as-tu fait hier ?'
        skills: [Poser des questions au passé, Les temps du passé]
        minutes: 17
        steps:
          - Écris trois choses que tu as faites hier.
          - 'En binômes : l’élève A lit une phrase. L’élève B pose la question correspondante.'
          - Répétez avec les trois phrases de chaque élève.
          - Comparez vos activités. Avez-vous fait la même chose ?
          - Raconte au groupe, à la troisième personne, ce qu’a fait ton / ta partenaire.
        example: |-
          *A : Hier, j’ai préparé des pâtes.*
          *B : Qu’as-tu préparé hier ?*
          *Moi aussi, j’ai regardé un film. / Moi, je n’ai pas cuisiné, je suis allé(e) au restaurant.*
          *Mon camarade a préparé des pâtes et a regardé un film hier.*
      - id: act1-levels
        type: callout
        tone: info
        title: Selon le niveau
        text: |-
          **Niveau débutant :** phrases courtes et simples (*Hier, je suis allé(e) au supermarché.*).
          **Niveau intermédiaire :** ajoute des détails (*Hier, j’ai préparé des pâtes à la sauce tomate avec ma sœur à la maison.*).
      - id: act1-sentences
        type: discussionQuestions
        title: Mes trois phrases d’hier
        items:
          - question: Hier, ___.
          - question: Hier, ___.
          - question: Hier, ___.
      - id: act2
        type: classActivity
        title: 'Activité 2 : Je n’ai jamais…'
        skills: [Les temps du passé]
        steps:
          - Dis quelque chose que tu n’as jamais fait.
          - Les élèves qui l’ont déjà fait reçoivent un point négatif.
          - Avec deux points négatifs, tu es éliminé(e). Le dernier élève qui reste gagne.
        example: '*Je n’ai jamais mangé de sushis.* → Ceux qui ont déjà mangé des sushis reçoivent un point négatif.'
      - id: act2-sentences
        type: discussionQuestions
        title: Je n’ai jamais…
        items:
          - question: Je n’ai jamais ___.
            frame: Je n’ai jamais mangé de…
          - question: Je ne suis jamais ___.
            frame: Je ne suis jamais allé(e) à / en…
          - question: Je n’ai jamais ___.
            frame: Je n’ai jamais vu…
      - id: act3
        type: classActivity
        title: 'Activité 3 : La dernière fois que…'
        skills: [Les temps du passé, Poser des questions au passé]
        minutes: 17
        steps:
          - Complète les trois phrases ci-dessous.
          - 'En binômes : lis tes phrases. Ton / Ta partenaire te pose une ou deux questions pour en savoir plus.'
          - Raconte au groupe, à la troisième personne, ce que tu as découvert sur ton / ta partenaire.
        example: |-
          *A : La dernière fois que je suis allé au cinéma, c’était samedi.*
          *B : Avec qui es-tu allé au cinéma ? Qu’as-tu vu ?*
          *Mon camarade est allé au cinéma samedi avec son frère et il a vu un film d’action.*
      - id: act3-sentences
        type: discussionQuestions
        title: La dernière fois que…
        items:
          - question: La dernière fois que je suis allé(e) au cinéma, c’était ___.
          - question: La dernière fois que j’ai cuisiné, c’était ___.
          - question: La dernière fois que j’ai voyagé, c’était ___.
      - id: act3-levels
        type: callout
        tone: info
        title: Selon le niveau
        text: |-
          **Niveau débutant :** phrases courtes. *La dernière fois que j’ai voyagé, c’était à Madrid.*
          **Niveau intermédiaire :** ajoute des détails à l’imparfait. *La dernière fois que j’ai voyagé, c’était à Madrid. Il faisait beau et nous sortions souvent nous promener.*
      - id: act4
        type: classActivity
        title: 'Activité 4 : Une histoire en trois images'
        skills: [Les temps du passé]
        steps:
          - Regarde les trois images que montre ton professeur.
          - Seul(e) ou en groupe, invente une petite histoire au passé qui relie les trois images.
          - Utilise au moins trois verbes au passé composé ou à l’imparfait. Tu peux ajouter des détails.
          - Présente ton histoire à la classe.
        example: '*L’été dernier, je suis allé(e) à la plage, puis j’ai mangé au restaurant et enfin j’ai terminé la journée à une fête avec mes amis.*'
      - id: act4-levels
        type: callout
        tone: info
        title: Selon le niveau
        text: |-
          **Niveau débutant :** phrases courtes et simples, avec des marqueurs temporels (*hier, la semaine dernière*).
          **Niveau intermédiaire :** une histoire plus longue, avec des descriptions à l’imparfait. *Quand j’étais enfant, j’allais souvent à la plage avec ma famille. L’année dernière, j’y suis retourné(e), j’ai mangé dans un restaurant et j’ai dansé à une fête.*
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Deux compétences dans ce cycle : **les temps du passé** (passé composé et
          imparfait), pratiqués dans toutes les activités, et **poser des questions au
          passé**, surtout dans les activités 1 et 3. Le cahier ne donne pas de
          combinaison recommandée. Choisis les questions d’échauffement du niveau de ton
          groupe (débutant ou intermédiaire).
      - id: n-intro
        anchor: intro
        text: Donne d’abord ton propre exemple, puis interroge chaque élève.
      - id: n-warmup
        anchor: warmup-title
        text: Pose au moins deux questions à chaque élève. Les réponses écrites ici apparaissent sous chaque question.
      - id: n-act1
        anchor: act1
        minutes: 17
        text: >-
          Préparation individuelle : 3 minutes. Travail en binômes : 8 minutes.
          Comparaison : 3 minutes. En groupe : 3 minutes (quelques élèves racontent ce
          qu’a fait leur partenaire à la troisième personne). Les élèves pratiquent la
          1ʳᵉ personne (*J’ai préparé des pâtes.*), la 2ᵉ (*Qu’as-tu préparé ?*) et la 3ᵉ
          (*Il / Elle a préparé des pâtes.*).
      - id: n-act2
        anchor: act2
        text: >-
          Jeu rapide. Rappelle qu’après la négation on dit *de* : *Je n’ai jamais mangé
          de sushis.* Vérifie l’auxiliaire *être* avec *aller* : *Je ne suis jamais
          allé(e) en Inde.*
      - id: n-act3
        anchor: act3
        minutes: 17
        text: >-
          Préparation individuelle : 4 minutes. Travail en binômes : 8 minutes. En groupe :
          5 minutes. Les élèves pratiquent la 1ʳᵉ personne (*La dernière fois que j’ai
          voyagé, c’était…*), la 2ᵉ (*Où es-tu allé(e) ? Avec qui ?*) et la 3ᵉ (*Mon
          camarade a voyagé à…*).
      - id: n-act4
        anchor: act4
        text: >-
          Avant le cours, choisis trois images (par exemple : plage, restaurant, fête).
          Montre-les à l’écran ou distribue-les. Donne d’abord le modèle. À la fin,
          souligne le bon usage des temps du passé et des marqueurs temporels.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: experiences-passees-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: rules-passe-compose
        type: ruleSummary
        skill: Les temps du passé
        rules:
          - text: 'Le **passé composé** raconte des actions **ponctuelles et terminées**, à un moment **précis** du passé.'
            examples:
              - Hier, j’ai mangé une pizza.
              - Samedi, je suis allé(e) au cinéma.
              - La semaine dernière, j’ai regardé un film.
          - text: 'Marqueurs temporels typiques du passé composé :'
            examples:
              - 'hier, avant-hier, samedi dernier, la semaine dernière, il y a deux jours, le week-end dernier'
          - text: 'Formation : **avoir** ou **être** au présent + **participe passé**. La plupart des verbes prennent *avoir*.'
            examples: [j’ai mangé · tu as dormi · il a pris]
          - text: 'On utilise **être** avec les verbes de mouvement (*aller, venir, revenir, partir, sortir, rentrer, retourner, arriver*), avec *naître* et avec les verbes pronominaux (*se lever, se reposer*). Avec *être*, le participe s’accorde avec le sujet.'
            examples: [Il est allé à la plage., Elle est allée à la plage., Je me suis reposé(e).]
          - text: 'À la forme négative, *ne… pas* et *ne… jamais* entourent l’auxiliaire.'
            examples: [Je n’ai pas cuisiné., Je ne suis jamais allé(e) au Japon.]
          - text: 'L’**imparfait** sert à **décrire** (le contexte) ou à parler d’**habitudes** dans le passé.'
            examples:
              - Quand j’étais petite, je partais tous les étés en Italie.
              - Le dimanche, je dînais avec mes amis.
              - Quand j’étais enfant, je jouais souvent au football.
              - Mon quartier était très calme.
          - text: 'Marqueurs temporels typiques de l’imparfait :'
            examples: ['quand j’étais enfant, autrefois, avant, toujours, souvent, normalement']
          - text: 'Formation de l’imparfait : on prend le radical de *nous* au présent (*nous jouons* → *jou-*) et on ajoute **-ais, -ais, -ait, -ions, -iez, -aient**. Exception : *être* → *ét-* (*j’étais*).'
          - text: '**Dans un récit :** passé composé → ce qui s’est passé. Imparfait → le contexte ou les habitudes.'
            examples:
              - L’été dernier, je suis allé(e) à la plage (passé composé). La mer était calme et il faisait chaud (imparfait).
      - id: pc-table
        type: table
        caption: Le passé composé avec avoir et être
        header: [Personne, avoir + participe, être + participe]
        rows:
          - [je, j’ai mangé, je suis allé(e)]
          - [tu, tu as mangé, tu es allé(e)]
          - [il / elle, il / elle a mangé, il est allé / elle est allée]
          - [nous, nous avons mangé, nous sommes allé(e)s]
          - [vous, vous avez mangé, vous êtes allé(e)(s)]
          - [ils / elles, ils / elles ont mangé, ils sont allés / elles sont allées]
      - id: participles-table
        type: table
        caption: Participes passés irréguliers du cycle
        header: [Infinitif, Participe passé]
        rows:
          - [prendre, pris]
          - [apprendre, appris]
          - [courir, couru]
          - [rire, ri]
          - [attendre, attendu]
          - [faire, fait]
          - [voir, vu]
      - id: imparfait-table
        type: table
        caption: L’imparfait
        header: [Personne, jouer, faire, être]
        rows:
          - [je / j’, jouais, faisais, étais]
          - [tu, jouais, faisais, étais]
          - [il / elle, jouait, faisait, était]
          - [nous, jouions, faisions, étions]
          - [vous, jouiez, faisiez, étiez]
          - [ils / elles, jouaient, faisaient, étaient]
      - id: rules-questions
        type: ruleSummary
        skill: Poser des questions au passé
        rules:
          - text: 'Pour poser une question, on peut inverser l’**auxiliaire** et le **sujet** (avec un tiret), puis mettre le participe.'
            examples:
              [Qu’as-tu fait hier ?, Où es-tu allé(e) le week-end dernier ?, Qu’as-tu mangé ?]
          - text: 'On peut aussi utiliser **est-ce que** sans inversion. Le sens est le même.'
            examples: [Qu’est-ce que tu as fait hier ?, Est-ce que tu as aimé le film ?]
          - text: 'Mots interrogatifs utiles : *que (qu’), où, quand, avec qui, à quelle heure, quel / quelle*.'
            examples: [Avec qui es-tu allé(e) au cinéma ?, Quel film as-tu vu ?]
          - text: 'Pour raconter ce qu’a fait ton / ta partenaire, utilise la troisième personne.'
            examples:
              - J’ai préparé des pâtes. → Qu’as-tu préparé ? → Il / Elle a préparé des pâtes.
              - Mon camarade est allé au cinéma et il a vu un film d’action.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Révise les règles du niveau de ton groupe et demande un nouvel exemple pour chaque règle.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: experiences-passees-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie un message et envoie-le. Mori va te poser des questions ; réponds à toutes.
      - id: basic-title
        type: heading
        level: 3
        text: Niveau débutant
      - id: basic-goal
        type: text
        text: 'Objectif : pratiquer le passé composé à travers des phrases courtes, des questions simples et des récits à la troisième personne.'
      - id: mori-basic-1
        type: aiTutorPrompt
        title: 'Message 1 : Questions et réponses'
        message: |-
          Bonjour Mori, je veux pratiquer le passé. Peux-tu me poser 5 questions faciles comme :
          Qu’as-tu fait hier ?
          Qu’as-tu mangé ?
          Où es-tu allé(e) le week-end dernier ?
          Je vais te répondre et tu pourras corriger mes phrases si je fais des erreurs.
      - id: mori-basic-2
        type: aiTutorPrompt
        title: 'Message 2 : Mini-journal'
        intro: 'Ensuite, écris tes quatre phrases. Exemple : *Hier, je suis allé(e) au supermarché. Hier soir, j’ai regardé une série. Le week-end dernier, j’ai préparé une pizza. J’ai parlé au téléphone avec mon ami(e).*'
        message: Bonjour Mori, je vais te raconter quatre choses que j’ai faites hier. Corrige mes phrases et pose-moi une question supplémentaire sur chacune d’elles.
      - id: mori-basic-3
        type: aiTutorPrompt
        title: 'Message 3 : Récit à la troisième personne'
        intro: 'Ensuite, écris tes phrases. Exemple : *Ma sœur a étudié pour un examen. Elle a mangé une salade. Elle a regardé un film.*'
        message: Bonjour Mori, je vais te raconter ce qu’a fait une personne de ma famille hier, à la troisième personne. Corrige mes phrases et pose-moi une question supplémentaire sur cette personne.
      - id: inter-title
        type: heading
        level: 3
        text: Niveau intermédiaire
      - id: inter-goal
        type: text
        text: 'Objectif : combiner le passé composé (actions ponctuelles) avec l’imparfait (habitudes, descriptions, contexte).'
      - id: mori-inter-1
        type: aiTutorPrompt
        title: 'Message 1 : Entretien'
        intro: 'Exemple : Mori : *Quel a été ton plus beau voyage ?* Toi : *Mon plus beau voyage, c’était en Italie.* Mori : *Très bien. Comment c’était ?*'
        message: Bonjour Mori, peux-tu me poser 5 questions au passé, 3 avec le passé composé et 2 avec l’imparfait ? Après chacune de mes réponses, corrige-moi et pose-moi une question de suivi.
      - id: mori-inter-2
        type: aiTutorPrompt
        title: 'Message 2 : Mini-biographie'
        intro: 'Ensuite, écris tes cinq phrases. Exemple : *Quand j’étais enfant, j’habitais dans une petite ville. Je jouais toujours avec mes amis dans la rue. En 2005, j’ai voyagé à Madrid avec ma famille. Ce voyage a été très amusant. Mon école était grande.*'
        message: Bonjour Mori, je veux écrire une mini-biographie de mon enfance. Je vais te dire 5 phrases, 2 au passé composé et 3 à l’imparfait. Corrige mes phrases et pose-moi une question supplémentaire sur mon enfance.
      - id: mori-inter-3
        type: aiTutorPrompt
        title: 'Message 3 : Journal détaillé'
        intro: 'Ensuite, écris tes phrases. Exemple : *Samedi, je suis allé(e) à la plage. Il faisait très chaud. Dimanche, j’ai dîné avec ma famille. Le repas était délicieux.*'
        message: Bonjour Mori, je vais te raconter ce que j’ai fait la semaine dernière en six phrases. Pour chaque phrase, j’ajouterai un détail à l’imparfait. Corrige mes phrases si j’ai fait des erreurs et pose-moi une question sur une de mes phrases.
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          Tu veux plus de questions ? Envoie : **S’il te plaît, pose-moi encore des questions !**
          Tu ne comprends pas une explication ? Envoie : **Peux-tu m’expliquer en hébreu, mais avec la phrase en français ?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: experiences-passees-pratique
    book: workbook
    title: 'Pratique : Expériences passées'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Pratique les deux compétences du cycle. Chaque réponse est corrigée tout de suite, et tu peux réessayer.
      - id: ex-passe
        type: activity
        activity: experiences-passees-passe
      - id: ex-questions
        type: activity
        activity: experiences-passees-questions

