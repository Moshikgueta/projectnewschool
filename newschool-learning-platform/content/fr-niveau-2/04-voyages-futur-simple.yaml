# Cycle "Voyages - futur simple", converted from the French level 2 digital notebook
# ("Cahier digital 2025 - français niveau 2", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-2
slug: voyages-futur-simple
title: 'Voyages : le futur simple'
goal: Parler de ses voyages au futur simple, poser des questions et rapporter des projets au futur.
position: 4
status: published

review:
  - >-
    The two workbook exercises ("Le futur simple" and "Questions et récits au futur")
    are NEW: the notebook has no self-study exercises. They were written from the
    cycle's two skills, its summary rules, the activity examples and its vocabulary.
    Please check level, wording and every right answer before students see them.
  - >-
    Summary, rule 1: "il suffit de prendre tout le verbe à l'infinitif et d'ajouter la
    terminaison" is not true for verbs in -re: they lose their final -e (prendre → je
    prendrai, vivre → je vivrai, boire → je boirai). The rule now says so, with
    examples. "Le futur simple est le temps le plus facile en français" is softened
    to "Le futur simple se forme facilement".
  - >-
    Summary, rule 2 ("certains verbes doivent être appris par cœur") gave only
    "aller → j'irai". A table of the irregular futures used in this cycle was added
    (aller → j'irai, être → je serai, avoir → j'aurai / il y aura, faire → je ferai,
    venir → je viendrai, pouvoir → je pourrai, voir → je verrai), and a table of the
    regular endings (parler, finir, prendre). Please confirm.
  - >-
    Summary: skill 2 ("poser des questions et rapporter des faits au futur") has no
    rule in the source. A short rule was added from the activity examples: question
    word + verb + -tu with a hyphen (Où voyageras-tu ? Que feras-tu ?), and the 3rd
    person to report what a classmate said (Mon camarade visitera le Japon).
  - >-
    Mori: "corriger mes erreurs" → "corrige mes erreurs" (imperative, as in the first
    message); "A présent" → "À présent"; the broken quotation in the second message
    was fixed ("Où dormirons-nous ? – Nous dormirons à l'hôtel."); "Je te réponds en
    utilisant le futur simple - corrige mes erreurs" was moved into the first
    message, which it belongs to.
  - >-
    The notebook gives no plan saying which activity practises which skill: all
    three activities practise both (writing in the futur simple, then follow-up
    questions and a 3rd-person report). Teachers choose the activities.
  - >-
    Times given as ranges are recorded as the upper value (7–8 → 8, 3–4 → 4, 5–7 →
    7). Activity totals: 1 → 18 min, 2 → 17 min, 3 → 17 min. The Quizlet link is
    kept without its tracking parameters (?i=…&x=…). The "Réponse de l'élève 1/2/3"
    lines are replaced by the optional answer boxes.
  - >-
    Vocabulary: "Il/elle", "Ils/elles" spaced as "Il / elle", "Ils / elles".
    "J'essaierai" (also correct: j'essayerai) is kept. Glosses are as in the notebook.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: voyages-futur-simple-classe
    title: 'Classe : Voyages (futur simple)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Voyages : le futur simple'
      - id: skills
        type: cycleOverview
        skills:
          - name: Le futur simple
            description: '*Je visiterai, tu feras, il ira, nous prendrons…*'
          - name: Questions et récits au futur
            description: '*Où voyageras-tu ? Que feras-tu ?* → *Mon camarade visitera le Japon.*'
      - id: quizlet
        type: externalLink
        label: 'Voyages : futur simple sur Quizlet'
        url: https://quizlet.com/il/1096107425/conversational-french-2025-voyages-futur-simple-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. Mon prochain voyage sera au / en / à ___ et je ferai ___.
        example: Je m’appelle Lévanah. Mon prochain voyage sera au Portugal et je ferai une visite guidée à Lisbonne.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup
        type: discussionQuestions
        items:
          - question: Quels lieux visiteras-tu pendant ton prochain voyage ?
            frame: Je visiterai Paris et Marseille.
          - question: Quelles activités feras-tu pendant ce voyage ?
            frame: Je ferai des visites et je goûterai la cuisine française.
          - question: Qu’emporteras-tu dans ta valise ?
            frame: J’emporterai des vêtements chauds et mon appareil photo.
          - question: Comment sera l’hôtel où tu dormiras ?
            frame: Il sera grand et il y aura une piscine.
          - question: Quel moyen de transport utiliseras-tu dans 20 ans ?
            frame: J’utiliserai une voiture volante ou je voyagerai en train rapide.
          - question: Tu organises le voyage de tes rêves. Que feras-tu ?
            frame: Ce sera un voyage au Japon et je visiterai des temples anciens.
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Dans 20 ans'
        skills: [Le futur simple, Questions et récits au futur]
        minutes: 18
        steps:
          - Complète les phrases ci-dessous au futur simple.
          - 'En binômes : un élève lit ses phrases, l’autre pose 2 ou 3 questions de suivi.'
          - Présente ton / ta camarade au groupe, à la 3ᵉ personne.
        example: |-
          Élève A : *Dans 20 ans, je vivrai à Barcelone.*
          Élève B : *Avec qui vivras-tu à Barcelone ? Dans une maison ou dans un appartement ?*
          *Ma camarade vivra à Barcelone, voyagera en train électrique et sa maison sera intelligente.*
      - id: act1-sentences
        type: discussionQuestions
        title: Ma vie dans 20 ans
        items:
          - question: Dans 20 ans, je vivrai à ___.
          - question: Je voyagerai en ___.
          - question: La technologie sera ___.
          - question: Ma vie sera ___. (facultatif)
      - id: act1-questions
        type: callout
        tone: info
        title: Idées de questions
        text: |-
          *Avec qui vivras-tu ? Comment voyageras-tu exactement ? Que mangeras-tu dans le futur ? Comment sera ta maison ? Auras-tu un autre travail ? Quelles nouvelles activités feras-tu ?*
          *Comment sera l’école ou l’université du futur ? Qu’est-ce qui changera dans notre manière de voyager ? Qu’est-ce qui n’existera plus dans 20 ans ? Qu’est-ce qui ne changera pas ?*
      - id: act2
        type: classActivity
        title: 'Activité 2 : Mon voyage de rêve'
        skills: [Le futur simple, Questions et récits au futur]
        minutes: 17
        steps:
          - Écris trois phrases au futur simple (ci-dessous).
          - 'En binômes : ton / ta camarade pose des questions pour avoir plus d’informations.'
          - Présente au groupe ce que tu as appris sur ton / ta camarade.
        example: |-
          Élève A : *Un jour, je visiterai le Japon.*
          Élève B : *Quelle ville visiteras-tu au Japon ? Que goûteras-tu là-bas ?*
          *Mon camarade visitera le Japon, goûtera le ramen et rencontrera un ami japonais.*
      - id: act2-sentences
        type: discussionQuestions
        title: Mon voyage de rêve
        items:
          - question: Un jour, je visiterai ___.
          - question: Je goûterai ___.
          - question: Je rencontrerai ___.
          - question: 'Facultatif : Je logerai dans ___. / Je ferai ___.'
      - id: act2-questions
        type: callout
        tone: info
        title: Idées de questions
        text: '*Quelle ville visiteras-tu ? Quel plat goûteras-tu en premier ? Avec qui voyageras-tu ? Quelles activités feras-tu là-bas ? Quelle langue parleras-tu ? Que prendras-tu avec toi ?*'
      - id: act2-levels
        type: callout
        tone: info
        title: Selon le niveau
        text: |-
          **Débutants (A2−) :** phrases simples et concrètes. *Je visiterai l’Italie, je goûterai une pizza typique, je rencontrerai de nouveaux amis.*
          **Intermédiaires (A2+) :** phrases plus détaillées. *Je visiterai l’Italie avec ma famille, je goûterai la pizza napolitaine à Naples et je rencontrerai un chef local.*
      - id: act3
        type: classActivity
        title: 'Activité 3 : Prédictions'
        skills: [Le futur simple, Questions et récits au futur]
        minutes: 17
        steps:
          - 'Choisis une situation : ton prochain week-end, l’été prochain, le futur des transports, l’école ou l’université dans 10 ans, ta vie dans 20 ans.'
          - Écris 2 phrases au futur simple.
          - 'En binômes : lis tes phrases. Ton / ta camarade pose des questions de suivi.'
          - Présente ton / ta camarade au groupe, à la 3ᵉ personne.
        example: |-
          *Le week-end prochain, j’irai à la plage.* → *Avec qui iras-tu à la plage ?*
          *Dans 10 ans, j’enseignerai à l’université.* → *Quelle matière enseigneras-tu à l’université ?*
          *Mon camarade ira à la plage le week-end prochain et dans 10 ans, il enseignera le français à l’université.*
      - id: act3-sentences
        type: discussionQuestions
        title: Mes prédictions
        items:
          - question: ___ (quand ?), je ___.
          - question: ___ (quand ?), je ___.
      - id: act3-levels
        type: callout
        tone: info
        title: Selon le niveau
        text: |-
          **Débutants (A2−) :** phrases très simples avec un marqueur de temps clair. *Samedi, je mangerai une pizza. / Demain, j’étudierai le français.*
          **Intermédiaires (A2+) :** phrases plus longues, avec des détails et des justifications. *L’année prochaine, je voyagerai en Italie avec ma famille et je goûterai la cuisine typique de Rome.*
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Deux compétences dans ce cycle : **le futur simple** et **poser des questions
          et rapporter des faits au futur**. Les trois activités pratiquent les deux :
          écriture au futur simple, questions de suivi en binômes (2ᵉ personne), puis
          présentation du / de la camarade (3ᵉ personne). Choisis les activités selon le
          temps disponible.
      - id: n-intro
        anchor: intro
        text: Donne d’abord ton propre exemple, puis interroge chaque élève.
      - id: n-warmup
        anchor: warmup
        text: Pose au moins deux questions à chaque élève. Les réponses écrites ici apparaissent sous chaque question.
      - id: n-act1
        anchor: act1
        minutes: 18
        text: >-
          Écriture individuelle : 5 minutes. Interaction en binômes : 8 minutes (2 ou 3
          questions de suivi, voir les idées de questions). Présentation en groupe : 5
          minutes, à la 3ᵉ personne. Objectif : imaginer la vie dans 20 ans et
          interagir à la 1ʳᵉ, 2ᵉ et 3ᵉ personne.
      - id: n-act2
        anchor: act2
        minutes: 17
        text: >-
          Écriture individuelle : 4 minutes. Interaction en binômes : 8 minutes.
          Présentation en groupe : 5 minutes. Objectif : parler de projets et de rêves
          de voyage à la 1ʳᵉ, 2ᵉ et 3ᵉ personne. Adapte les attentes au niveau du
          groupe (voir l’encadré « Selon le niveau »).
      - id: n-act3
        anchor: act3
        minutes: 17
        text: >-
          Préparation : 2 minutes (propose les situations). Production individuelle : 5
          minutes. Interaction en binômes : 7 minutes. Présentation finale : 3 minutes, à
          la 3ᵉ personne. Objectif : pratiquer le futur simple à partir de situations de
          la vie réelle.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: voyages-futur-simple-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: rules-futur
        type: ruleSummary
        skill: Le futur simple
        rules:
          - text: 'Le futur simple se forme facilement : on prend **l’infinitif** du verbe et on ajoute la terminaison : **-ai, -as, -a, -ons, -ez, -ont**.'
            examples:
              - '(manger) Demain, je **mangerai** une pizza.'
              - '(finir) Demain, je **finirai** mes devoirs.'
          - text: 'Les verbes en **-re** perdent le **-e** final de l’infinitif.'
            examples: [prendre → je **prendrai**, vivre → je **vivrai**, boire → je **boirai**]
          - text: 'Certains verbes sont **irréguliers** : il faut les apprendre par cœur (voir le tableau). Les terminaisons restent les mêmes.'
            examples:
              - '(aller) Demain, **j’irai** au cinéma.'
              - (faire) Je **ferai** une visite guidée.
              - (être) Ce **sera** un beau voyage.
          - text: 'À l’oral, et dans les situations informelles, on utilise souvent le **futur proche** : *aller* au présent + infinitif.'
            examples:
              - '(manger) Demain, je **vais manger** une pizza.'
              - '(aller) Demain, je **vais aller** au cinéma.'
      - id: endings-table
        type: table
        caption: Le futur simple des verbes réguliers
        header: [Sujet, parler, finir, prendre]
        rows:
          - [je / j’, parlerai, finirai, prendrai]
          - [tu, parleras, finiras, prendras]
          - [il / elle / on, parlera, finira, prendra]
          - [nous, parlerons, finirons, prendrons]
          - [vous, parlerez, finirez, prendrez]
          - [ils / elles, parleront, finiront, prendront]
      - id: irregular-table
        type: table
        caption: Quelques verbes irréguliers au futur simple
        header: [Infinitif, Radical, Exemple]
        rows:
          - [aller, ir-, j’irai]
          - [être, ser-, je serai]
          - [avoir, aur-, 'j’aurai · il y aura']
          - [faire, fer-, je ferai]
          - [venir, viendr-, je viendrai]
          - [pouvoir, pourr-, je pourrai]
          - [voir, verr-, je verrai]
      - id: rules-questions
        type: ruleSummary
        skill: Questions et récits au futur
        rules:
          - text: 'Pour poser une question, mets le mot interrogatif, puis le verbe au futur et le sujet, avec un **trait d’union** : *verbe-tu*.'
            examples: [Où voyageras-tu ?, Que feras-tu là-bas ?, Avec qui iras-tu à la plage ?]
          - text: 'Pour rapporter ce que dit ton / ta camarade, utilise la **3ᵉ personne** (terminaison **-a**).'
            examples:
              [
                Je visiterai le Japon. → Mon camarade **visitera** le Japon.,
                Je vivrai à Barcelone. → Ma camarade **vivra** à Barcelone.,
              ]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Révise les deux compétences avec le groupe et demande un nouvel exemple pour chaque règle.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: voyages-futur-simple-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie un message et envoie-le. Mori va te poser des questions ; réponds à toutes.
      - id: goal-questions
        type: text
        text: '**Objectif :** pratiquer les questions et les réponses au futur simple.'
      - id: mori-voyage
        type: aiTutorPrompt
        title: 'Message 1 : Mon voyage à l’étranger'
        message: |-
          Bonjour Mori ! Je prépare un voyage à l’étranger. Pose-moi des questions comme : « Où voyageras-tu ? », « Que feras-tu là-bas ? », « Avec qui voyageras-tu ? ».
          Je te réponds au futur simple. Corrige mes erreurs, s’il te plaît.
      - id: mori-amis
        type: aiTutorPrompt
        title: 'Message 2 : Deux amis préparent un voyage'
        message: |-
          À présent, fais comme si nous étions deux amis qui préparent un voyage ensemble. Posons-nous des questions chacun notre tour et répondons au futur simple.
          Par exemple : « Où dormirons-nous ? – Nous dormirons à l’hôtel. »
          Corrige mes erreurs, s’il te plaît.
      - id: goal-predictions
        type: text
        text: '**Objectif :** utiliser le futur simple pour faire des prédictions.'
      - id: mori-20-ans
        type: aiTutorPrompt
        title: 'Message 3 : Voyager dans 20 ans'
        message: Bonjour Mori ! Aide-moi à imaginer comment je voyagerai dans 20 ans. Pose-moi des questions sur les moyens de transport, les destinations et les nouvelles technologies. Je te réponds au futur simple. Corrige mes erreurs, s’il te plaît.
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          Tu veux plus de questions ? Envoie : **S’il te plaît, pose-moi encore des questions !**
          Tu ne comprends pas une explication ? Envoie : **Peux-tu m’expliquer en hébreu, mais avec la phrase en français ?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: voyages-futur-simple-pratique
