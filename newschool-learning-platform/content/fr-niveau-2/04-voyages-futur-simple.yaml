vocabulary:
  - slug: voyages-futur-simple
    title: 'Voyages : le futur simple'
    items: *voyages-futur-simple-words

activities:
  - slug: voyages-futur-simple-futur
    title: 'Le futur simple : je visiterai, j’irai'
    minutes: 8
    items:
      - id: mangerai
        type: multipleChoice
        prompt: Demain, je ___ une pizza.
        options:
          - { text: mangerai, correct: true }
          - {
              text: mangera,
              feedback: '*-a* est la terminaison de *il / elle*. Avec *je*, on ajoute *-ai* : *je mangerai*.',
            }
          - {
              text: mangeons,
              feedback: '*Mangeons* est le présent de *nous*. Au futur simple avec *je* : *je mangerai*.',
            }
      - id: finirons
        type: fillBlank
        prompt: Complète avec le verbe *finir* au futur simple.
        text: Ce soir, nous ___ nos devoirs.
        blanks: [[finirons]]
      - id: prendrai
        type: multipleChoice
        prompt: L’été prochain, je ___ le train pour Paris.
        options:
          - { text: prendrai, correct: true }
          - {
              text: prendrerai,
              feedback: 'Les verbes en *-re* perdent le *-e* final : *prendr-* + *-ai* = *je prendrai*.',
            }
          - { text: prends, feedback: '*Prends* est le présent. Au futur simple : *je prendrai*.' }
      - id: irreguliers
        type: matching
        prompt: Associe chaque verbe à sa forme au futur simple.
        pairs:
          - [aller, j’irai]
          - [être, je serai]
          - [avoir, j’aurai]
          - [faire, je ferai]
          - [venir, je viendrai]
      - id: terminaisons
        type: trueFalse
        prompt: 'Les terminaisons du futur simple sont : *-ai, -as, -a, -ons, -ez, -ont*.'
        answer: true
        feedback:
          correct: 'Bravo ! Par exemple : je visiterai, tu visiteras, il visitera, nous visiterons, vous visiterez, ils visiteront.'
          incorrect: 'Si, ce sont bien les terminaisons du futur simple : je visiterai, tu visiteras, il visitera, nous visiterons, vous visiterez, ils visiteront.'
      - id: irons-visiterons
        type: fillBlank
        prompt: Complète avec les verbes entre parenthèses au futur simple.
        text: L’été prochain, nous ___ (aller) en Italie et nous ___ (visiter) Rome.
        blanks: [[irons], [visiterons]]
      - id: irai-cinema
        type: multipleChoice
        prompt: '*Demain, je vais aller au cinéma.* Quelle phrase dit la même chose au futur simple ?'
        options:
          - { text: 'Demain, j’irai au cinéma.', correct: true }
          - {
              text: 'Demain, j’allerai au cinéma.',
              feedback: '*Aller* est irrégulier au futur simple : *j’irai*.',
            }
          - {
              text: 'Demain, je vais au cinéma.',
              feedback: '*Je vais* est le présent. Au futur simple, *aller* devient *j’irai*.',
            }
      - id: ordre-barcelone
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Dans 20 ans, je vivrai à Barcelone.

  - slug: voyages-futur-simple-questions
    title: 'Questions et récits au futur : Où iras-tu ?'
    minutes: 8
    items:
      - id: voyageras
        type: multipleChoice
        prompt: Avec qui ___-tu ?
        options:
          - { text: voyageras, correct: true }
          - {
              text: voyagerai,
