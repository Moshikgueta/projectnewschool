# Cycle "Festivals", converted from the French level 2 digital notebook
# ("Cahier digital 2025 - français niveau 2", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-2
slug: festivals
title: Festivals
goal: Donner des conseils et inviter avec l’impératif, et parler des festivals au passé, au présent et au futur.
position: 9
status: published

review:
  - >-
    The two workbook exercises ("L'impératif" and "Passé, présent, futur") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's two skills,
    its summary rules, the activity examples and its vocabulary. Please check level,
    wording and every right answer before students see them.
  - >-
    Summary, imperative: "vouloir : veuille, voulons, veuillez" → "veuille, veuillons,
    veuillez". Rule 1 now says that -er verbs (and aller) lose the -s of the present at
    the tu form (tu manges → Mange !), which the example shows but the rule did not.
    Two rules were added from the cycle's own examples: the negative imperative (Ne
    mange pas !) and pronominal verbs (Hydrate-toi ! Amusez-vous !). "par coeur" → "par
    cœur". Please confirm.
  - >-
    Activity 1 answer key: "Porter des masques pour se cacher d'une divinité maléfique |
    cerf" → "États-Unis" (Halloween; "cerf" was a broken word). "Etats-Unis" →
    "États-Unis". The column says "Pays" but Rio de Janeiro, Amsterdam, Catalogne and
    "Apache et autres tribus indigènes" are not countries: the column is now "Lieu". The
    answer key is in a teacher note.
  - >-
    Activity 1 facts: "Porter de l'orange pour honorer la reine" (Amsterdam) is out of
    date: since 2014 it is the King's Day (Koningsdag), the king's birthday. Changed to
    "Porter de l'orange pour la fête du Roi (fête de la Reine jusqu'en 2013)". "Se cacher
    d'une divinité maléfique" (États-Unis, Halloween) is simplified history: the old
    Celtic custom was to hide from spirits; changed to "des esprits maléfiques". "Être
    déguisé dans la rue pendant toute la semaine de la fête" (Israël, Pourim) is kept
    (the source has "habillé"; changed to "déguisé"), but Pourim is not a full week in
    most places. Please check. "Un roi" was added to the vocabulary next to "une reine".
  - >-
    Activity 3, Oktoberfest example: "du 21 septembre au 6 octobre" are the dates of one
    year and change every year; changed to "de fin septembre à début octobre". "Vous
    êtes invité" → "Vous êtes invité(e)s". Please confirm.
  - >-
    Corrections: Activity 2 "célébrer les fêtes de manière original" → "originale";
    homework "quelqu'un allant à un festival" → "quelqu'un qui va à un festival"; warm-up
    "es-tu déjà allé" → "allé(e)", "t'es-tu déguisé" → "déguisé(e)"; warm-up questions
    had stray "**" markers (removed).
  - >-
    Homework: the notebook has two written tasks and no Mori message. Each task is now a
    Mori message with the same instructions and example.
  - >-
    Vocabulary: "S'habiller – להתלבש" kept, and "se déguiser – להתחפש" added (the
    introduction round uses it); "Vacances – חופשה" kept; "Couleurs" → "les couleurs";
    "artistes" → "des artistes"; "Autochtone / indigène – ילידי" → "יליד / ילידי". Please
    confirm.
  - >-
    Times: Activity 1 research "10 minutes" is kept; no other times are given in the
    source. No beginner / intermediate split in this cycle. The Quizlet link is kept
    without its tracking parameters. The "Réponse de l'élève 1/2/3" lines are replaced by
    the answer boxes. Frames were added to the warm-up questions (the source has none).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: festivals-classe
    title: 'Classe : Festivals'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Festivals
      - id: skills
        type: cycleOverview
        skills:
          - name: L’impératif
            description: '*Porte des chaussures confortables ! Venez avec vos amis ! Amusez-vous !*'
          - name: 'Les temps de l’indicatif : passé, présent, futur'
            description: '*L’année dernière, j’ai dansé. D’habitude, les gens se déguisent. L’année prochaine, j’irai au festival.*'
      - id: quizlet
        type: externalLink
        label: Festivals sur Quizlet
        url: https://quizlet.com/il/1094970822/conversational-french-2025-festivals-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        frame: Je m’appelle ___. Pourim / Halloween prochain, je vais me déguiser en ___.
        example: Je m’appelle Lévanah. Pourim prochain, je vais me déguiser en abeille.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup
        type: discussionQuestions
        items:
          - question: À quels festivals es-tu déjà allé(e) ?
            frame: Je suis déjà allé(e) à ___.
          - question: En quoi t’es-tu déguisé(e) l’année dernière ? OU Que portais-tu lors de ton dernier festival ?
            frame: L’année dernière, je me suis déguisé(e) en ___. / Je portais ___.
          - question: Y a-t-il un festival auquel tu participes chaque année ?
            frame: Chaque année, je participe à ___.
          - question: À quels festivals vas-tu aller cette année ?
            frame: Cette année, je vais aller à ___.
          - question: Quelle musique as-tu écoutée lors du dernier festival ? Vas-tu écouter la même musique au prochain festival ?
            frame: J’ai écouté ___. Au prochain festival, je vais écouter ___.
          - question: Quels conseils peux-tu donner à une personne qui va à un festival pour la première fois ? Réponds à l’impératif.
            frame: Apportez une bouteille d’eau avec vous ! / ___ !
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Si tu vas à ce festival…'
        skills: [L’impératif]
        minutes: 10
        steps:
          - Regarde le tableau. Les traditions et les lieux sont dans le désordre.
          - Trouve au moins 3 correspondances correctes.
          - En deux groupes, choisissez un lieu et sa coutume. Faites une recherche de 10 minutes.
          - Écrivez une liste de 5 choses qu’il faut faire pendant ce festival.
          - Partage tes recherches avec la classe. Utilise l’impératif.
        example: |-
          **Lieu :** Rio de Janeiro. **Coutume :** le Carnaval.
          5 choses que tu dois faire pour participer au Carnaval à Rio de Janeiro :
          1. **Porte** des vêtements colorés pour t’intégrer à l’ambiance festive !
          2. **Danse** la samba et **rejoins** les défilés !
          3. **Réserve** tes billets pour le Sambódrome !
          4. **Hydrate-toi** bien, car il peut faire chaud pendant les festivités !
          5. **Participe** aux fêtes de rue avec les habitants et les autres touristes !
      - id: act1-table
        type: table
        caption: Associe les traditions et les lieux
        header: [Tradition, Lieu]
        rows:
          - [Le Carnaval, 'Venise, Italie']
          - [Utiliser des masques pour faire la fête sans distinction de statut social, Inde]
          - [Célébrer avec les morts, Royaume-Uni]
          - [Jeter de la poudre colorée sur les gens, Mexique]
          - [Porter des masques pour se cacher des esprits maléfiques, Rio de Janeiro]
          - [S’habiller en Viking, Israël]
          - [Les costumes sont un rite de passage à l’âge adulte, Amsterdam]
          - [
              Se déguiser en diable et faire peur aux festivaliers,
              Apache et autres tribus indigènes,
            ]
          - [Porter de l’orange pour la fête du Roi (fête de la Reine jusqu’en 2013), États-Unis]
          - [Être déguisé dans la rue pendant toute la semaine de la fête, Catalogne]
      - id: act1-list
        type: discussionQuestions
        title: 5 choses qu’il faut faire pendant ce festival
        items:
          - question: '1. ___ !'
          - question: '2. ___ !'
          - question: '3. ___ !'
          - question: '4. ___ !'
          - question: '5. ___ !'
      - id: act2
        type: classActivity
        title: 'Activité 2 : Mes célébrations'
        skills: [Les temps de l’indicatif]
        steps:
          - Pense aux différentes fêtes que tu célèbres ou que tu connais.
          - 'Pose à ton / ta partenaire une question de chaque partie (ci-dessous) et prends des notes sur ses réponses.'
          - Après l’entretien, partage avec le groupe une réponse de ton / ta partenaire.
      - id: act2-general
        type: discussionQuestions
        title: Questions générales
        items:
          - question: Quelle est votre fête préférée et pourquoi ?
          - question: Quand et où cette fête est-elle célébrée ?
          - question: Cette fête est-elle célébrée dans d’autres pays ? Si oui, en quoi est-elle différente ?
      - id: act2-traditions
        type: discussionQuestions
        title: Traditions et coutumes
        items:
          - question: Quelles sont les traditions de cette fête ?
          - question: Est-ce que vous ou votre famille avez des traditions particulières pour cette fête ?
          - question: Existe-t-il un aliment particulier ou une boisson spéciale associée à cette célébration ?
      - id: act2-experience
        type: discussionQuestions
        title: Expérience personnelle
        items:
          - question: Quel est votre meilleur souvenir de cette fête ?
          - question: Comment célébrez-vous habituellement cette fête ? (En famille, entre amis, à la maison, lors d’événements publics, etc.)
          - question: Votre manière de célébrer cette fête a-t-elle changé au fil du temps ? Si oui, comment ?
      - id: act2-comparaison
        type: discussionQuestions
        title: Comparaison culturelle
        items:
          - question: Avez-vous déjà célébré cette fête dans un autre pays ? En quoi était-elle différente ?
          - question: Y a-t-il des fêtes d’autres cultures que vous aimeriez célébrer ? Pourquoi ?
          - question: Quelle fête d’un autre pays trouvez-vous intéressante ?
      - id: act2-opinions
        type: discussionQuestions
        title: Réflexion et opinions
        items:
          - question: Pensez-vous que les fêtes sont importantes ? Pourquoi ?
          - question: Préférez-vous les fêtes traditionnelles ou aimez-vous célébrer les fêtes de manière originale ?
      - id: act3
        type: classActivity
        title: 'Activité 3 : Créez une invitation sympa'
        skills: [L’impératif]
        steps:
          - 'Seul(e) ou en binôme, choisis un festival célèbre. Quelques exemples : Diwali (la fête des lumières), l’Oktoberfest (Allemagne), le Carnaval (Brésil), le Nouvel An chinois, Thanksgiving (États-Unis).'
          - Si nécessaire, cherche des informations sur le festival.
          - Écris le texte de ton invitation **à l’impératif**, pour présenter des activités passionnantes et donner envie de venir.
          - Présente ton invitation à la classe et lis à voix haute les impératifs que tu as utilisés.
          - 'Tes camarades donnent leur avis : l’invitation est-elle engageante et créative ?'
        example: |-
          **Titre :** Vous êtes invité(e)s à l’Oktoberfest !
          **Phrase d’ouverture :** « Célébrez le plus grand festival de la bière au monde à Munich ! »
          **Détails :**
          « Rendez-nous visite de fin septembre à début octobre à Munich, en Allemagne ! »
          « Portez une tenue bavaroise traditionnelle et venez vous amuser ! »
          « Goûtez la bière allemande authentique et dégustez nos délicieux bretzels ! »
          « Chantez au rythme de la musique folklorique et dansez toute la nuit ! »
          « Montez sur la grande roue et profitez de jeux de fête foraine passionnants ! »
          « Venez avec vos amis et votre famille et partagez un moment inoubliable ! »
      - id: act3-invitation
        type: discussionQuestions
        title: Mon invitation
        items:
          - question: 'Titre : Vous êtes invité(e)s à ___ !'
          - question: 'Phrase d’ouverture : « ___ ! »'
          - question: 'Détail 1 : « ___ ! »'
          - question: 'Détail 2 : « ___ ! »'
          - question: 'Détail 3 : « ___ ! »'
      - id: act4
        type: classActivity
        title: 'Activité 4 : Mon propre festival'
        skills: [Les temps de l’indicatif, L’impératif]
        steps:
          - Après avoir découvert tous ces festivals, c’est à vous d’inventer votre propre festival !
          - Travaillez en groupes. Complétez la fiche ci-dessous.
          - Chaque groupe présente son festival au reste de la classe.
      - id: act4-form
        type: discussionQuestions
        title: Notre festival
        items:
          - question: 'Nom du festival : ___'
          - question: 'Date du festival : ___'
          - question: 'Lieu du festival : ___'
          - question: Combien de temps dure ce festival ?
          - question: 'Code vestimentaire : ___'
          - question: Quelle musique pour ce festival ?
          - question: Quels artistes participeront au festival ?
            frame: ___ participeront au festival.
          - question: Que va-t-il se passer lors de ce festival ?
            frame: Les gens vont ___.
          - question: Quelles ont été vos sources d’inspiration pour inventer ce festival ?
            frame: Nous avons pensé à ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Deux compétences dans ce cycle : **l’impératif** (activités 1 et 3) et **les
          temps de l’indicatif : passé, présent, futur** (activités 2 et 4, et les
          questions d’échauffement).
      - id: n-intro
        anchor: intro
        text: Donne d’abord ton propre exemple, puis interroge chaque élève.
      - id: n-warmup
        anchor: warmup
        text: Pose au moins deux questions à chaque élève. Les réponses écrites ici apparaissent sous chaque question.
      - id: n-act1
        anchor: act1
        minutes: 10
        text: >-
          Montre le tableau dans le désordre. **Corrigé :** Jeter de la poudre colorée →
          Inde (Holi) ; Célébrer avec les morts → Mexique ; Se cacher des esprits
          maléfiques → États-Unis (Halloween) ; Se déguiser en diable → Catalogne ; Être
          déguisé dans la rue toute la semaine → Israël (Pourim) ; Rite de passage à l’âge
          adulte → Apache et autres tribus indigènes ; Carnaval → Rio de Janeiro ; Masques
          sans distinction de statut social → Venise, Italie ; S’habiller en Viking →
          Royaume-Uni ; Porter de l’orange → Amsterdam. Les élèves font au moins 3
          correspondances, puis font une recherche de 10 minutes en deux groupes.
      - id: n-act2
        anchor: act2
        text: Encourage les élèves à réfléchir aux différentes fêtes qu’ils célèbrent ou qu’ils connaissent. Chaque élève choisit une question de chaque partie. Fais attention aux temps (*célébrez-vous* au présent, *avez-vous célébré* au passé composé, *était-elle* à l’imparfait).
      - id: n-act3
        anchor: act3
        text: Les élèves travaillent seuls ou en binôme. Montre d’abord l’exemple de l’Oktoberfest. Fais lire à voix haute les impératifs utilisés.
      - id: n-act4
        anchor: act4
        text: Divise la classe en groupes. Pendant la présentation, vérifie le futur (*participeront, va se passer*) et le passé (*avons pensé*).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: festivals-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: rules-imperatif
        type: ruleSummary
        skill: L’impératif
        rules:
          - text: L’impératif ressemble au présent, mais il a seulement **trois personnes** (*tu, nous, vous*), et on ne dit **pas le pronom sujet**.
            examples:
              [
                'Présent : vous faites vos devoirs. → Impératif : Faites vos devoirs !',
                'Présent : nous dansons. → Impératif : Dansons !',
              ]
          - text: 'Avec les verbes en **-er** (et *aller*), on enlève le **-s** à la personne *tu*.'
            examples:
              [
                'Présent : tu manges ta soupe. → Impératif : Mange ta soupe !',
                'tu vas → Va au festival !',
                'tu danses → Danse la samba !',
              ]
          - text: 'On utilise l’impératif pour **donner un ordre**, **demander poliment** ou **donner un conseil**.'
            examples: [Range ta chambre !, Veuillez ouvrir la fenêtre., Essayez ce nouveau plat.]
          - text: 'À la forme négative : **ne (n’)** + verbe + **pas**.'
            examples: [Ne mange pas trop !, N’oubliez pas vos billets !]
          - text: 'Avec un verbe pronominal, le pronom va **après** le verbe, avec un trait d’union (*toi, nous, vous*).'
            examples: [Hydrate-toi bien !, Amusez-vous !, Préparons-nous !]
          - text: Certains verbes sont irréguliers et doivent être appris par cœur (voir le tableau).
      - id: imperatif-table
        type: table
        caption: Les impératifs irréguliers
        header: [Verbe, tu, nous, vous]
        rows:
          - [être, sois, soyons, soyez]
          - [avoir, aie, ayons, ayez]
          - [savoir, sache, sachons, sachez]
          - [vouloir, veuille, veuillons, veuillez]
      - id: rules-temps
        type: ruleSummary
        skill: 'Les temps de l’indicatif : passé, présent, futur'
        rules:
          - text: Le **présent** sert à décrire des personnes ou des choses, à parler d’une action en cours, de ses habitudes et de vérités générales.
            examples:
              [
                Les gens se préparent pour le festival.,
                'Généralement, les gens se déguisent et font la fête.',
              ]
          - text: 'Il y a deux temps principaux du passé : le **passé composé** pour un événement ponctuel ou daté, et l’**imparfait** pour les descriptions et les habitudes dans le passé.'
            examples: ['L’année dernière, j’ai participé à ce festival. C’était génial.']
          - text: 'Pour parler de l’avenir, on utilise le **futur proche** (*aller* au présent + infinitif) ou le **futur simple** (infinitif + **-ai, -as, -a, -ons, -ez, -ont**).'
            examples:
              [
                'L’année prochaine, nous allons organiser un nouveau festival.',
                'L’année prochaine, nous organiserons un nouveau festival.',
                'L’année prochaine, j’emmènerai mes amis au festival.',
              ]
      - id: temps-table
        type: table
        caption: 'Le verbe danser : passé, présent, futur'
        header: [Personne, Passé composé, Imparfait, Présent, Futur proche, Futur simple]
        rows:
          - [je / j’, ai dansé, dansais, danse, vais danser, danserai]
          - [tu, as dansé, dansais, danses, vas danser, danseras]
          - [il / elle, a dansé, dansait, danse, va danser, dansera]
          - [nous, avons dansé, dansions, dansons, allons danser, danserons]
          - [vous, avez dansé, dansiez, dansez, allez danser, danserez]
          - [ils / elles, ont dansé, dansaient, dansent, vont danser, danseront]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Révise les deux compétences avec le groupe et demande un nouvel exemple pour chaque règle. Fais dire la même phrase au passé, au présent et au futur.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: festivals-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie un message et envoie-le. Ensuite, écris tes phrases ; Mori va les corriger.
      - id: mori-imperatif
        type: aiTutorPrompt
        title: 'Message 1 : L’impératif'
        intro: 'Après le message, écris 5 phrases. Exemple : *Porte des chaussures confortables pour marcher toute la journée !*'
        message: >-
          Salut Mori ! Je vais écrire 5 phrases à l’impératif pour donner des conseils à
          quelqu’un qui va à un festival (ce qu’il faut faire, ce qu’il faut éviter,
          comment en profiter). Corrige mes phrases, s’il te plaît.
      - id: mori-temps
        type: aiTutorPrompt
        title: 'Message 2 : Passé, présent, futur'
        intro: |-
          Après le message, écris tes 3 phrases. Exemple :
          Passé : *L’année dernière, j’ai dansé au carnaval.*
          Présent : *Généralement, les gens se déguisent et font la fête.*
          Futur : *L’année prochaine, j’emmènerai mes amis au festival.*
        message: >-
          Salut Mori ! Je vais te parler d’un festival où je suis allé(e). Je vais écrire
          3 phrases : une au passé (ce que j’ai fait la dernière fois), une au présent (ce
          que les gens font généralement) et une au futur (ce qui se passera l’année
          prochaine). Corrige mes phrases, s’il te plaît.
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          Tu veux plus de questions ? Envoie : **S’il te plaît, pose-moi encore des questions !**
          Tu ne comprends pas une explication ? Envoie : **Peux-tu m’expliquer en hébreu, mais avec la phrase en français ?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: festivals-pratique
    book: workbook
    title: 'Pratique : Festivals'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Pratique les deux compétences du cycle. Chaque réponse est corrigée tout de suite, et tu peux réessayer.
      - id: ex-imperatif
        type: activity
        activity: festivals-imperatif
      - id: ex-temps
        type: activity
        activity: festivals-temps

