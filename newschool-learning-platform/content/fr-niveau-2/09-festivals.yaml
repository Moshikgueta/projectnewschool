          - { term: un genre musical, gloss: סגנון מוזיקה }
          - { term: des artistes, gloss: אמנים }

vocabulary:
  - slug: festivals
    title: Festivals
    items: *festivals-words

activities:
  - slug: festivals-imperatif
    title: 'L’impératif : Porte, Venez, Amusez-vous !'
    minutes: 8
    items:
      - id: porte
        type: multipleChoice
        prompt: 'Un conseil à un ami (*tu*) : ___ des chaussures confortables !'
        options:
          - { text: Porte, correct: true }
          - {
              text: Portes,
              feedback: 'Avec les verbes en *-er*, on enlève le *-s* à l’impératif : *Porte !*',
            }
          - {
              text: Tu portes,
              feedback: 'À l’impératif, on ne dit pas le pronom sujet : *Porte !*',
            }
      - id: personnes
        type: trueFalse
        prompt: 'L’impératif a trois personnes : *tu, nous, vous*.'
        answer: true
        feedback:
          correct: 'Bravo ! *Danse ! Dansons ! Dansez !* Et on ne dit pas le pronom sujet.'
          incorrect: 'C’est vrai : l’impératif a seulement trois personnes, *tu, nous, vous* : *Danse ! Dansons ! Dansez !*'
      - id: vous-imperatif
        type: fillBlank
        prompt: Complète l’invitation avec l’impératif (*vous*).
        text: (venir) ___ avec vos amis ! (goûter) ___ la bière allemande ! (danser) ___ toute la nuit !
        blanks: [[Venez, venez], [Goûtez, goûtez], [Dansez, dansez]]
      - id: irreguliers
        type: matching
        prompt: Associe chaque verbe à son impératif (*vous*).
        pairs:
          - [être, soyez]
          - [avoir, ayez]
          - [savoir, sachez]
          - [vouloir, veuillez]
          - [faire, faites]
      - id: pronominal
        type: multipleChoice
        prompt: 'Il fait chaud au festival : ___ bien !'
        options:
          - { text: Hydrate-toi, correct: true }
          - {
              text: Hydrate-te,
              feedback: 'À l’impératif, *te* devient *toi* après le verbe : *Hydrate-toi !*',
            }
          - {
              text: Tu t’hydrates,
              feedback: 'C’est le présent. À l’impératif, on ne dit pas le sujet : *Hydrate-toi !*',
            }
      - id: negatif
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - { text: N’oublie pas ton billet !, correct: true }
          - {
              text: Oublie pas ton billet !,
              feedback: 'À la forme négative, il faut *ne (n’)… pas* : *N’oublie pas ton billet !*',
            }
          - {
              text: N’oublies pas ton billet !,
              feedback: '*Oublier* est un verbe en *-er* : pas de *-s* à l’impératif. *N’oublie pas !*',
            }
      - id: tu-imperatif
        type: fillBlank
        prompt: Complète avec l’impératif (*tu*).
        text: (danser) ___ la samba ! (réserver) ___ tes billets ! (être) ___ prudent !
        blanks: [[Danse, danse], [Réserve, réserve], [Sois, sois]]
      - id: ordre-portez
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Portez une tenue traditionnelle.

  - slug: festivals-temps
    title: 'Passé, présent, futur'
    minutes: 8
    items:
      - id: annee-derniere
        type: multipleChoice
        prompt: L’année dernière, j’___ au carnaval.
        options:
          - { text: ai dansé, correct: true }
          - {
              text: danse,
              feedback: '*L’année dernière* parle du passé : on utilise le passé composé, *j’ai dansé*.',
            }
          - {
              text: danserai,
              feedback: '*Danserai* est au futur. Avec *l’année dernière*, on utilise le passé composé : *j’ai dansé*.',
            }
      - id: generalement
        type: multipleChoice
        prompt: Généralement, les gens ___ et font la fête.
        options:
          - { text: se déguisent, correct: true }
          - {
              text: se sont déguisés,
              feedback: '*Généralement* parle d’une habitude : on utilise le présent, *se déguisent*.',
            }
          - {
              text: se déguiseront,
              feedback: '*Généralement* parle d’une habitude actuelle : on utilise le présent, *se déguisent*.',
            }
      - id: marqueurs
        type: matching
        prompt: Associe chaque expression au temps qu’on utilise souvent avec elle.
        pairs:
          - [L’année dernière, passé composé]
          - [Quand j’étais petit(e), imparfait]
          - [Généralement, présent]
          - [L’année prochaine, futur]
      - id: c-etait
        type: multipleChoice
        prompt: L’année dernière, j’ai participé à ce festival. C’___ génial ! (une description)
        options:
          - { text: était, correct: true }
          - {
              text: est,
              feedback: 'On décrit un festival passé : on utilise l’imparfait, *c’était*.',
            }
          - {
              text: sera,
              feedback: '*Sera* est au futur. Pour une description dans le passé : *c’était*.',
            }
      - id: futur-proche-simple
        type: fillBlank
        prompt: 'Complète au futur : d’abord le futur proche, puis le futur simple.'
        text: L’année prochaine, nous ___ organiser un festival. Nous ___ (inviter) nos amis.
        blanks: [[allons], [inviterons]]
      - id: imparfait-description
        type: trueFalse
        prompt: On utilise l’imparfait pour un événement ponctuel et daté (*Le 5 mars, je suis allé au festival*).
        answer: false
        feedback:
          correct: 'Bravo ! Pour un événement ponctuel ou daté, on utilise le passé composé. L’imparfait sert aux descriptions et aux habitudes.'
          incorrect: 'Pour un événement ponctuel ou daté, on utilise le passé composé (*je suis allé*). L’imparfait sert aux descriptions et aux habitudes.'
      - id: emmenerai
        type: fillBlank
        prompt: Complète au futur simple.
        text: (emmener) L’année prochaine, j’___ mes amis au festival. (aller) Ils ___ au concert avec moi.
        blanks: [[emmènerai], [iront]]
      - id: ordre-preparent
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Les gens se préparent pour le festival.
