vocabulary:
  - slug: durabilite
    title: Durabilité
    items: *durabilite-words

activities:
  - slug: durabilite-futur
    title: 'Le futur proche et le futur simple : je vais recycler, je recyclerai'
    minutes: 8
    items:
      - id: allons
        type: multipleChoice
        prompt: Demain, nous ___ trier nos déchets.
        options:
          - { text: allons, correct: true }
          - {
              text: vont,
              feedback: '*Vont* est pour *ils / elles*. Avec *nous* : *nous allons* + infinitif.',
            }
          - {
              text: allez,
              feedback: '*Allez* est pour *vous*. Avec *nous* : *nous allons* + infinitif.',
            }
      - id: planter
        type: multipleChoice
        prompt: Je vais ___ un arbre dans le jardin.
        options:
          - { text: planter, correct: true }
          - {
              text: planterai,
              feedback: 'Après *aller*, le verbe reste à l’infinitif : *je vais planter*.',
            }
          - {
              text: plante,
              feedback: 'Après *aller*, le verbe reste à l’infinitif : *je vais planter*.',
            }
      - id: seront
        type: fillBlank
        prompt: Complète avec le verbe *être* au futur simple.
        text: En 2050, les villes ___ plus propres.
        blanks: [[seront]]
      - id: aura
        type: fillBlank
        prompt: Complète avec le verbe *avoir* au futur simple.
        text: Il y ___ plus d’arbres dans les forêts.
        blanks: [[aura]]
      - id: formes
        type: matching
        prompt: Associe chaque verbe à sa forme au futur simple.
        pairs:
          - [recycler (je), je recyclerai]
          - [réussir (tu), tu réussiras]
          - [être (ils), ils seront]
          - [avoir (elle), elle aura]
          - [utiliser (nous), nous utiliserons]
      - id: negation
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - { text: Nous n’allons pas jeter nos déchets par terre., correct: true }
          - {
              text: Nous ne allons pas jeter nos déchets par terre.,
              feedback: 'Devant une voyelle, *ne* devient *n’* : *nous n’allons pas*.',
            }
          - {
              text: Nous n’allons jeter pas nos déchets par terre.,
              feedback: '*Ne… pas* entoure le verbe *aller* : *nous n’allons pas jeter*.',
            }
      - id: futur-proche-regle
        type: trueFalse
        prompt: Le futur proche se forme avec le verbe *aller* au présent + l’infinitif.
        answer: true
        feedback:
          correct: 'Bravo ! *Je vais recycler, nous allons planter.*'
          incorrect: 'Si : *aller* au présent + infinitif. *Je vais recycler, nous allons planter.*'
      - id: ordre-pollution
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: La pollution diminuera dans les villes.

  - slug: durabilite-comparaisons
    title: 'Les comparaisons : plus… que, moins… que, le plus…'
    minutes: 8
    items:
      - id: plus-ecologique
        type: multipleChoice
        prompt: Le vélo pollue moins. Le vélo est ___ écologique que la voiture.
        options:
          - { text: plus, correct: true }
          - {
              text: moins,
              feedback: 'Le vélo pollue moins, donc il est *plus* écologique que la voiture.',
            }
          - {
              text: le plus,
              feedback: 'Avec *que* et deux éléments, on utilise le comparatif *plus… que*, sans article.',
            }
      - id: moins-que
        type: fillBlank
        prompt: 'Complète la comparaison (−).'
        text: Le sac en tissu est ___ polluant ___ le sac en plastique.
        blanks: [[moins], [que]]
      - id: aussi
        type: fillBlank
        prompt: 'Complète pour dire que les deux villes sont égales (=).'
        text: Ma ville est ___ bruyante que la tienne.
        blanks: [[aussi]]
        wordBank: [plus, moins, aussi]
      - id: le-moins
        type: multipleChoice
        prompt: La voiture est le moyen de transport ___ écologique.
        options:
          - { text: le moins, correct: true }
          - {
              text: la moins,
              feedback: 'L’article s’accorde avec *moyen* (masculin) : *le moyen de transport le moins écologique*.',
            }
          - {
              text: moins,
              feedback: 'Pour un superlatif, on répète l’article : *le moyen de transport le moins écologique*.',
            }
      - id: meilleur
        type: trueFalse
        prompt: 'On dit « Notre produit est plus bon pour la planète. »'
        answer: false
        feedback:
          correct: 'Bravo ! On ne dit pas « plus bon », on dit *meilleur* : *Notre produit est meilleur pour la planète.*'
          incorrect: 'On ne dit pas « plus bon », on dit *meilleur* : *Notre produit est meilleur pour la planète.*'
      - id: meme-sens
        type: matching
        prompt: Associe les phrases qui ont le même sens.
        pairs:
          - [Lyon est plus propre que Marseille., Marseille est moins propre que Lyon.]
          - [Le vélo est moins polluant que la voiture., La voiture est plus polluante que le vélo.]
          - [Le bus est plus rapide que le vélo., Le vélo est moins rapide que le bus.]
          - [Tel Aviv est aussi moderne que Paris., Paris est aussi moderne que Tel Aviv.]
      - id: plus-de
        type: multipleChoice
        prompt: Mon partenaire recycle ___ plastique que de papier.
        options:
          - { text: plus de, correct: true }
          - {
              text: plus,
              feedback: 'Avec un nom, on dit *plus de* : *plus de plastique que de papier*.',
            }
          - {
              text: plus du,
              feedback: 'Après *plus*, on dit *de* (pas *du*) : *plus de plastique*.',
            }
      - id: ordre-sac
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Notre sac est plus écologique que le vôtre.
