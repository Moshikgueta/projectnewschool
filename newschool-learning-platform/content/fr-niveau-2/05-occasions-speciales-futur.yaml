vocabulary:
  - slug: occasions-speciales-futur
    title: 'Occasions spéciales : le futur'
    items: *occasions-speciales-futur-words

activities:
  - slug: occasions-speciales-futur-projets
    title: 'Projets et célébrations : nous allons faire la fête !'
    minutes: 8
    items:
      - id: allons
        type: multipleChoice
        prompt: Nous ___ célébrer un mariage dans un jardin.
        options:
          - { text: allons, correct: true }
          - { text: vont, feedback: '*Vont* est pour *ils / elles*. Avec *nous* : *nous allons*.' }
          - { text: allez, feedback: '*Allez* est pour *vous*. Avec *nous* : *nous allons*.' }
      - id: aller-present
        type: fillBlank
        prompt: Complète avec *aller* au présent.
        text: Je ___ inviter mes amis. Tu ___ préparer un gâteau. Ils ___ décorer la salle.
        blanks: [[vais], [vas], [vont]]
      - id: questions-reponses
        type: matching
        prompt: Associe chaque question à sa réponse.
        pairs:
          - [Où va avoir lieu la fête ?, Elle va avoir lieu dans un jardin.]
          - [Qui va venir ?, Trente personnes vont venir.]
          - [Qu’allez-vous manger ?, Nous allons manger des fruits de mer.]
          - [Comment allez-vous décorer le lieu ?, Nous allons décorer avec des lumières.]
          - [Quand va-t-elle avoir lieu ?, Samedi prochain.]
      - id: accepter
        type: multipleChoice
        prompt: Merci pour l’invitation ! Je ___ à la fête.
        options:
          - { text: vais aller, correct: true }
          - {
              text: vais allé,
              feedback: 'Après *aller* au présent, le deuxième verbe est à l’infinitif : *je vais aller*.',
            }
          - { text: vas aller, feedback: '*Vas* est pour *tu*. Avec *je* : *je vais aller*.' }
      - id: structure
        type: trueFalse
        prompt: Le futur proche se forme avec *aller* au présent + un verbe à l’infinitif.
        answer: true
        feedback:
          correct: 'Bravo ! Par exemple : *Je vais célébrer mon anniversaire avec mes amis.*'
          incorrect: 'Si : *aller* au présent + infinitif. *Je vais célébrer mon anniversaire avec mes amis.*'
      - id: quelle-forme
        type: multipleChoice
        prompt: Quelle phrase est au futur proche ?
        options:
          - { text: Je vais célébrer mon anniversaire avec mes amis., correct: true }
          - {
              text: Je célébrerai mon anniversaire au restaurant.,
              feedback: '*Je célébrerai* est au futur simple. Le futur proche, c’est *aller* + infinitif : *je vais célébrer*.',
            }
          - {
              text: Je célèbre mon anniversaire à la maison.,
              feedback: '*Je célèbre* est au présent. Le futur proche, c’est *aller* + infinitif : *je vais célébrer*.',
            }
      - id: refuser
        type: fillBlank
        prompt: Refuse l’invitation au futur proche.
        text: Désolé, je ne ___ pas pouvoir venir.
        blanks: [[vais]]
      - id: ordre-ana
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: En mars, nous allons célébrer l’anniversaire d’Ana.

  - slug: occasions-speciales-futur-formes
    title: 'Futur proche et futur simple : je vais célébrer, je célébrerai'
    minutes: 8
    items:
      - id: viendront
        type: multipleChoice
        prompt: Vingt personnes ___ à la fête.
        options:
          - { text: viendront, correct: true }
          - {
              text: veniront,
              feedback: '*Venir* est irrégulier au futur simple : *viendr-* + *-ont* = *ils viendront*.',
            }
          - {
              text: viendra,
              feedback: '*Vingt personnes* = *elles* (pluriel) : la terminaison est *-ont*, *viendront*.',
            }
      - id: sera-aura
        type: fillBlank
        prompt: Complète avec les verbes au futur simple.
        text: La fête ___ (être) à la plage et il y ___ (avoir) de la musique.
        blanks: [[sera], [aura]]
      - id: proche-simple
        type: matching
        prompt: Associe chaque phrase au futur proche à la même phrase au futur simple.
        pairs:
          - [je vais célébrer, je célébrerai]
          - [nous allons danser, nous danserons]
          - [ils vont venir, ils viendront]
          - [tu vas faire, tu feras]
          - [je vais aller, j’irai]
      - id: pourrai
        type: multipleChoice
        prompt: Désolé, je ne ___ pas venir. Je serai occupé(e) ce jour-là.
        options:
          - { text: pourrai, correct: true }
          - { text: pouvrai, feedback: '*Pouvoir* est irrégulier au futur simple : *je pourrai*.' }
          - {
              text: pourra,
              feedback: '*-a* est pour *il / elle*. Avec *je*, la terminaison est *-ai* : *je pourrai*.',
            }
      - id: les-deux
        type: trueFalse
        prompt: Le futur proche est une faute ; il faut toujours utiliser le futur simple.
        answer: false
        feedback:
          correct: Bravo ! Les deux formes sont correctes. Le futur proche est plus courant à l’oral.
          incorrect: Les deux formes sont correctes. Le futur proche (*je vais inviter*) est même plus courant à l’oral.
      - id: inviterons
        type: fillBlank
        prompt: Complète avec les verbes au futur simple.
        text: Nous ___ (inviter) vingt personnes et nous ___ (manger) des fruits de mer.
        blanks: [[inviterons], [mangerons]]
      - id: y-aura-t-il
        type: multipleChoice
        prompt: Quelle musique y ___-t-il à la fête ?
        options:
          - { text: aura, correct: true }
          - {
              text: sera,
              feedback: 'On dit *il y a* (verbe *avoir*) ; au futur : *il y aura*, *y aura-t-il ?*',
            }
          - { text: aurons, feedback: '*Aurons* est pour *nous*. Avec *il* : *y aura-t-il ?*' }
      - id: ordre-noel
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: En décembre, nous célébrerons Noël en famille.
