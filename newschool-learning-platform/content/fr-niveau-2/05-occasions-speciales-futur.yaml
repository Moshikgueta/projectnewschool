# Cycle "Occasions spéciales - futur", converted from the French level 2 digital notebook
# ("Cahier digital 2025 - français niveau 2", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (French).
course: fr-niveau-2
slug: occasions-speciales-futur
title: 'Occasions spéciales : le futur'
goal: Parler de projets et de célébrations futures avec le futur proche et le futur simple.
position: 5
status: in_review

review:
  - >-
    The two workbook exercises ("Projets et célébrations" and "Futur proche et futur
    simple") are NEW: the notebook has no self-study exercises. They were written from
    the cycle's two skills, its summary rules, the activity examples and its
    vocabulary. Please check level, wording and every right answer before students
    see them.
  - >-
    Summary: the futur simple "verbe + terminaison" → "infinitif + terminaison (les
    verbes en -re perdent le -e)", with a short table of the irregular futures used in
    the cycle (serai/sera, aurai/il y aura, viendront, ferai, irai, pourrai). The
    notebook's "plus formel ou plus lointain" is kept as a simple guide but softened:
    both forms are correct, as the notebook itself says. A table of aller au présent
    was added from the notebook's list. Please confirm.
  - >-
    Corrections: "Fête nationale (Noël, Nouvel An, Pâques, etc.)" → "Fête ou jour
    férié (Noël, Nouvel An, Pâques, fête nationale…)" (Christmas and Easter are not
    national holidays); "voyager à la mer" → "partir à la mer" (Activity 4) and "aller
    à la mer" (Mori part 1); intro "Lors d'une fête, je vais toujours ___" → "Pendant
    une fête, j'aime toujours ___" (a habit, not a plan); "Désolé" → "Désolé(e)" and
    "occupé" → "occupé(e)" in Activities 3A/3B; "nous décorerons… et préparerons" →
    "et nous préparerons"; the stray "ð" before "Ainsi" was removed. In the role-play
    (2A/2B) the students plan their own party, so "Que vont-ils manger et boire ?" →
    "Qu'allez-vous manger et boire ?", "Comment vont-ils décorer / décoreront-ils /
    prépareront-ils" → "allez-vous décorer / décorerez-vous / préparerez-vous"
    (matching the notebook's "nous" examples).
  - >-
    Activity 1 asks students to write invitations in a Google document; the notebook
    gives no template link. It also has no example invitation: a short one was added
    ("Je fêterai mon anniversaire le samedi 12 mai…"). Please confirm. Activity 3A
    asks the teacher to show 4 pictures of celebrations, and Activity 4 a blank
    calendar (paper or digital); neither is in the notebook. The teacher notes say so.
  - >-
    Activities 2A/2B and 3A/3B are the same task first in the futur proche, then in
    the futur simple. They are kept as separate activities, with the notebook's
    "Ainsi…" explanation in the teacher notes. The notebook's list of practised
    abilities (expression orale, compréhension orale, production écrite) is in the
    plan note.
  - >-
    The notebook gives no activity times and no plan mapping activities to skills, so
    no minutes are set; all activities practise both skills. The Quizlet link is kept
    without its tracking parameters (?i=…&x=…). The "Réponse de l'élève 1/2/3" lines
    are replaced by the optional answer boxes. The Mori messages now start with
    "Bonjour Mori !" and end with a request to correct; the tips callout was added.
  - >-
    Vocabulary: "Mariés – זוג (חתן וכלה)" → "חתן וכלה"; "Hôte / hôtesse – מארח" →
    "מארח / מארחת"; "Toast / trinquer" → "Porter un toast / trinquer" (gloss "הרמת
    כוסית / להרים כוסית"); "Anniversaire de mariage / anniversaire" split, since
    "Anniversaire" already has its own line (יום הולדת): "Anniversaire de mariage –
    יום נישואין". Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: occasions-speciales-futur-classe
    title: 'Classe : Occasions spéciales (futur)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Occasions spéciales : le futur'
      - id: skills
        type: cycleOverview
        skills:
          - name: Projets et célébrations futures
            description: Organiser une fête, inviter, accepter ou refuser une invitation.
          - name: Futur proche et futur simple
            description: '*Je vais célébrer* (aller + infinitif) · *Je célébrerai* (futur simple)'
      - id: quizlet
        type: externalLink
        label: 'Occasions spéciales : futur sur Quizlet'
        url: https://quizlet.com/il/1094938602/conversational-french-2025-occasions-speciales-futur-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronde d’introduction
      - id: intro
        type: sentenceFrame
        prompt: Dis ton prénom, puis complète une ou deux phrases au choix.
        frame: |-
          Je m’appelle ___.
          J’aime organiser des fêtes parce que ___.
          Je n’aime pas organiser des fêtes parce que ___.
          Pendant une fête, j’aime toujours ___ (danser, chanter, manger, parler avec mes amis…).
          Prochainement, je vais célébrer ___.
          Je préfère ___ (les grandes fêtes / les petites fêtes).
          Une fête sans ___, ce n’est pas une vraie fête.
        example: Je m’appelle Lévanah. Prochainement, je vais célébrer mon anniversaire de mariage.
      - id: warmup-title
        type: heading
        level: 3
        text: Questions d’échauffement
      - id: warmup
        type: discussionQuestions
        items:
          - question: Comment vas-tu célébrer ton prochain anniversaire et avec qui ?
            frame: Je vais célébrer mon anniversaire ___ avec ___ (avec ma famille, mes amis, au restaurant, à la maison…).
          - question: Lors des prochaines fêtes (Noël, Nouvel An, Pâques…), que vas-tu faire et avec qui seras-tu ?
            frame: Je vais ___ (voyager, rendre visite à ma famille, préparer un repas spécial…) et je serai avec ___.
          - question: Inviteras-tu beaucoup de personnes à ton mariage ou à une autre célébration importante ? Pourquoi ?
            frame: J’inviterai ___ (beaucoup de personnes, seulement la famille…) parce que ___.
          - question: Comment vas-tu inviter les gens à ta fête (WhatsApp, e-mail, téléphone, invitation papier) ? Pourquoi préfères-tu ce moyen ?
            frame: Je vais inviter les gens par ___ parce que c’est ___ (rapide, plus personnel…).
          - question: Quelle occasion spéciale vas-tu célébrer l’année prochaine ?
            frame: L’année prochaine, je vais célébrer ___ (un anniversaire important, une remise de diplôme, un nouveau travail…).
          - question: Comment célébreras-tu cette occasion ?
            frame: J’organiserai ___ / Je ferai ___ / J’inviterai ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activités
      - id: act1
        type: classActivity
        title: 'Activité 1 : Les invitations'
        skills: [Projets et célébrations futures, Futur proche et futur simple]
        steps:
          - 'Dans un document Google, écris **deux invitations** au **futur simple** : une pour un anniversaire et une pour un mariage.'
          - Tu peux personnaliser ton document (images, polices, couleurs).
          - Lis **une de tes invitations** à la classe.
        example: '*Je fêterai mon anniversaire le samedi 12 mai à 20 heures, chez moi. Il y aura de la musique et un grand gâteau ! Merci de confirmer ta présence avant le 5 mai.*'
      - id: act2a
        type: classActivity
        title: 'Activité 2A : Jeu de rôle, nous organisons une fête (futur proche)'
        skills: [Projets et célébrations futures, Futur proche et futur simple]
        steps:
          - Travaillez en paires ou en groupes de trois.
          - Choisissez **une occasion spéciale** (anniversaire, mariage, diplôme, fête surprise, voyage…).
          - Répondez aux questions ci-dessous avec *aller* au présent + infinitif.
          - Partagez vos phrases avec la classe.
        example: '*Nous allons célébrer un mariage dans un jardin. Nous allons inviter trente personnes. Nous allons préparer de la nourriture traditionnelle et danser la salsa.*'
      - id: act2a-questions
        type: discussionQuestions
        title: Notre fête (futur proche)
        items:
          - question: Où va avoir lieu la fête ?
          - question: Qu’allez-vous manger et boire ?
          - question: Qui va venir ?
          - question: Quelle musique ou quelles activités va-t-il y avoir ?
          - question: Comment allez-vous décorer le lieu ?
      - id: act2b
        type: classActivity
        title: 'Activité 2B : Jeu de rôle, nous organisons une fête (futur simple)'
        skills: [Projets et célébrations futures, Futur proche et futur simple]
        steps:
          - Gardez le même événement.
          - Répondez de nouveau aux questions, cette fois **au futur simple**.
          - Partagez vos phrases avec la classe.
        example: '*La fête sera à la plage. Vingt personnes viendront. Nous mangerons des fruits de mer et nous danserons toute la nuit. Nous décorerons avec des lumières et nous préparerons une vidéo spéciale.*'
      - id: act2b-questions
        type: discussionQuestions
        title: Notre fête (futur simple)
        items:
          - question: Où sera la fête ?
          - question: Que mangeront et boiront les invités ?
          - question: Qui viendra ?
          - question: Quelle musique ou quelles activités y aura-t-il ?
          - question: Comment décorerez-vous le lieu ?
          - question: Quelle surprise préparerez-vous ?
      - id: act3a
        type: classActivity
        title: 'Activité 3A : Les traditions et les fêtes (futur proche)'
        skills: [Projets et célébrations futures, Futur proche et futur simple]
        steps:
          - Regarde les 4 images de célébrations que montre ton professeur et choisis-en **2**.
          - 'En binôme, répondez avec *aller* au présent + infinitif : Pourquoi ces personnes vont-elles faire la fête ? Où va se dérouler la fête ? Quand va-t-elle avoir lieu ?'
          - Partagez avec le groupe. Les autres disent s’ils vont aller à la fête ou non.
        example: |-
          *Ils vont célébrer un mariage à l’hôtel. La fête va avoir lieu samedi prochain.*
          → *Je vais aller à la fête, merci pour l’invitation.*
          → *Désolé(e), je ne vais pas pouvoir venir.*
      - id: act3b
        type: classActivity
        title: 'Activité 3B : Les traditions et les fêtes (futur simple)'
        skills: [Projets et célébrations futures, Futur proche et futur simple]
        steps:
          - Reprends les mêmes images.
          - 'Décris de nouveau les fêtes, cette fois au **futur simple** : Pourquoi feront-ils une fête ? Où sera la fête ? Quand aura-t-elle lieu ?'
          - Partagez avec le groupe. Les autres répondent au futur simple.
        example: |-
          *Ils célébreront un mariage à l’hôtel. La fête sera samedi prochain.*
          → *J’irai à la fête. Merci pour l’invitation.*
          → *Désolé(e), je ne pourrai pas venir.*
          → *Je serai occupé(e) ce jour-là.*
      - id: act4
        type: classActivity
        title: 'Activité 4 : Le calendrier des célébrations'
        skills: [Projets et célébrations futures, Futur proche et futur simple]
        steps:
          - Travaillez en groupes de 3 ou 4. Chaque groupe reçoit un **calendrier vierge** (papier ou numérique).
          - 'Choisissez **au moins 5 célébrations** : l’anniversaire d’un membre du groupe, des vacances ou un voyage, un mariage, une fête surprise, une fête ou un jour férié (Noël, Nouvel An, Pâques, fête nationale…), un diplôme ou un événement scolaire.'
          - Écrivez des phrases au futur. Vous pouvez mélanger le futur proche et le futur simple.
          - Décorez votre calendrier (dessins, images, emojis) et présentez **2 ou 3 célébrations** à la classe.
          - 'Les autres groupes posent des questions : *Qui va venir à la fête ? Où sera la célébration ? Que mangerez-vous pendant les vacances ?*'
        example: |-
          *En mars, nous allons célébrer l’anniversaire d’Ana.*
          *En juillet, nous partirons à la mer avec des amis.*
          *En décembre, nous célébrerons Noël en famille.*
          *L’année prochaine, j’irai à un concert en août.*
          *Nous inviterons vingt personnes. / Nous allons danser toute la nuit.*
      - id: act4-sentences
        type: discussionQuestions
        title: Notre calendrier
        items:
          - question: En ___, nous ___.
          - question: En ___, nous ___.
          - question: En ___, nous ___.
          - question: En ___, nous ___.
          - question: En ___, nous ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Deux compétences dans ce cycle : **projets et célébrations futures** et **futur
          proche / futur simple**. Toutes les activités pratiquent les deux. Le cycle
          travaille aussi l’expression orale (poser des questions et y répondre au futur),
          la compréhension orale (comprendre les camarades et le professeur dans des
          contextes liés au futur) et la production écrite (invitations, calendrier de
          célébrations).
      - id: n-intro
        anchor: intro
        text: Donne d’abord ton propre exemple, puis interroge chaque élève.
      - id: n-warmup
        anchor: warmup
        text: Pose au moins deux questions à chaque élève. Les réponses écrites ici apparaissent sous chaque question.
      - id: n-act1
        anchor: act1
        text: >-
          Le cahier ne donne pas de modèle de document Google : prépare un document
          partagé ou demande aux élèves d’en créer un. Explique le sens de *confirmer sa
          présence* si nécessaire.
      - id: n-act2
        anchor: act2b
        text: >-
          En 2A, les élèves pratiquent la forme la plus naturelle au niveau A2 (*aller*
          au présent + infinitif). En 2B, ils passent au futur simple. Parler deux fois
          du même sujet renforce le vocabulaire et la fluidité.
      - id: n-act3
        anchor: act3a
        text: >-
          Avant la classe, prépare **4 images** de célébrations (mariage, anniversaire,
          Nouvel An, diplôme…) : elles ne sont pas dans le cahier. En 3A, pratique du
          futur proche ; en 3B, passage progressif au futur simple avec les mêmes
          images, pour renforcer le vocabulaire et la structure.
      - id: n-act4
        anchor: act4
        text: >-
          Prépare un calendrier vierge (papier ou numérique ; il n’est pas dans le
          cahier). Après les présentations, compare les groupes : « Le groupe 1 voyagera
          en juillet, mais le groupe 2 voyagera en août. » « Tous les groupes vont
          célébrer un anniversaire, mais un seul groupe prévoit un mariage. » Variante
          compétitive : votez pour le calendrier le plus original (la fête la plus
          créative, la meilleure fête de l’été, le plan le plus fou).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: occasions-speciales-futur-resume
    title: Résumé
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ce que nous avons appris aujourd’hui
      - id: intro
        type: text
        text: 'Aujourd’hui, nous avons appris à parler de projets et de célébrations dans le futur. Nous avons pratiqué deux formes du futur :'
      - id: forms-table
        type: table
        caption: Le futur proche et le futur simple
        header: [Forme, Structure, Usage, Exemple]
        rows:
          - [
              Futur proche,
              '*aller* au présent + infinitif',
              'Plan proche, décidé',
              Je vais célébrer mon anniversaire avec mes amis.,
            ]
          - [
              Futur simple,
              'infinitif + -ai, -as, -a, -ons, -ez, -ont',
              'Prévision, promesse, plan plus formel',
              Je célébrerai mon anniversaire au restaurant.,
            ]
      - id: rules-proche
        type: ruleSummary
        skill: Le futur proche
        rules:
          - text: '**Aller** au présent + **infinitif**. C’est la forme la plus courante à l’oral.'
            examples:
              [Nous allons inviter trente personnes., Ils vont célébrer un mariage à l’hôtel.]
          - text: 'À la forme négative, *ne… pas* entoure le verbe *aller*.'
            examples: [Je **ne vais pas** pouvoir venir.]
      - id: aller-table
        type: table
        caption: Aller au présent + infinitif
        header: [Sujet, aller, Exemple]
        rows:
          - [je, vais, je vais danser]
          - [tu, vas, tu vas inviter]
          - [il / elle / on, va, elle va venir]
          - [nous, allons, nous allons célébrer]
          - [vous, allez, vous allez manger]
          - [ils / elles, vont, ils vont décorer]
      - id: rules-simple
        type: ruleSummary
        skill: Le futur simple
        rules:
          - text: '**Infinitif** + terminaison : **-ai, -as, -a, -ons, -ez, -ont**. Les verbes en *-re* perdent le *-e* final (*boire → nous boirons*).'
            examples: [Nous danserons toute la nuit., J’inviterai toute ma famille.]
          - text: 'Quelques verbes irréguliers : *être → je serai*, *avoir → j’aurai* (*il y aura*), *venir → ils viendront*, *faire → je ferai*, *aller → j’irai*, *pouvoir → je pourrai*.'
            examples:
              [La fête sera à la plage., Vingt personnes viendront., Je ne pourrai pas venir.]
      - id: both
        type: callout
        tone: info
        title: Futur proche ou futur simple ?
        text: Les deux sont corrects. Le futur proche est plus courant à l’oral, pour un projet proche et décidé ; le futur simple est un peu plus formel (invitations, promesses) ou parle d’un futur plus lointain.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Révise les deux formes avec le groupe et demande un nouvel exemple pour chaque règle.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: occasions-speciales-futur-devoirs
    title: Devoirs avec Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Devoirs avec Mori
      - id: how
        type: text
        text: Ouvre le chat avec Mori, copie un message et envoie-le. Mori va te poser des questions ; réponds à toutes.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Partie 1 : Le futur proche'
        intro: 'Écris et dis 5 phrases au futur proche. Exemples : *Je vais célébrer l’anniversaire de ma mère. Je vais aller à la mer en juin. Je vais inviter mes amis à dîner.*'
        message: Bonjour Mori ! Je vais te raconter mes plans pour le mois prochain, avec 5 phrases au futur proche. Pose-moi des questions et corrige-moi, s’il te plaît.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Partie 2 : Le futur simple'
        intro: 'Écris et dis 5 phrases au futur simple. Exemples : *Je célébrerai mon anniversaire au restaurant. J’aurai des vacances en août. J’inviterai toute ma famille à une fête.*'
        message: Bonjour Mori ! Je vais pratiquer le futur simple avec 5 phrases. Ensuite, pose-moi des questions comme « Où sera la fête ? », « Qui viendra ? », « Que feras-tu pour la célébrer ? ». Corrige-moi si je me trompe, s’il te plaît.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Partie 3 : Conversation guidée'
        message: Bonjour Mori ! Pose-moi des questions sur les occasions spéciales, par exemple « Comment vas-tu célébrer ton prochain anniversaire ? », « Quelle occasion spéciale célébreras-tu l’année prochaine ? », « Que feras-tu si tu ne peux pas aller à une fête ? ». Je vais répondre au futur. Corrige-moi, s’il te plaît.
      - id: mori-4
        type: aiTutorPrompt
        title: 'Partie 4 : Production libre'
        intro: 'Exemple : *En mars, je célébrerai l’anniversaire de mon frère. En juin, je vais voyager en Espagne. En décembre, je célébrerai Noël à la maison.*'
        message: Bonjour Mori ! Je vais te raconter le calendrier de mes célébrations pour l’année prochaine. Corrige-moi si je me trompe, s’il te plaît.
      - id: tips
        type: callout
        tone: tip
        title: Conseils
        text: |-
          Tu veux plus de questions ? Envoie : **S’il te plaît, pose-moi encore des questions !**
          Tu ne comprends pas une explication ? Envoie : **Peux-tu m’expliquer en hébreu, mais avec la phrase en français ?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: occasions-speciales-futur-pratique
    book: workbook
    title: 'Pratique : Occasions spéciales (futur)'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Pratique les deux compétences du cycle. Chaque réponse est corrigée tout de suite, et tu peux réessayer.
      - id: ex-projets
        type: activity
        activity: occasions-speciales-futur-projets
      - id: ex-formes
        type: activity
        activity: occasions-speciales-futur-formes

