vocabulary:
  - slug: identite-et-communaute
    title: Identité et communauté
    items: *identite-et-communaute-words

activities:
  - slug: identite-et-communaute-futur
    title: 'Le futur : je vais changer, je changerai'
    minutes: 8
    items:
      - id: serai
        type: multipleChoice
        prompt: Dans 10 ans, je ___ professeure.
        options:
          - { text: serai, correct: true }
          - {
              text: suis,
              feedback: '*Suis* est au présent. Avec *dans 10 ans*, on utilise le futur : *je serai*.',
            }
          - {
              text: sera,
              feedback: '*Sera* est pour *il / elle*. Avec *je*, la terminaison est *-ai* : *je serai*.',
            }
      - id: aiderons
        type: fillBlank
        prompt: Complète avec le verbe *aider* au futur simple.
        text: Nous ___ les nouveaux membres à s’intégrer.
        blanks: [[aiderons]]
      - id: vais
        type: multipleChoice
        prompt: Demain, je ___ parler de ma communauté.
        options:
          - { text: vais, correct: true }
          - { text: va, feedback: '*Va* est pour *il / elle*. Avec *je* : *je vais* + infinitif.' }
          - {
              text: allons,
              feedback: '*Allons* est pour *nous*. Avec *je* : *je vais* + infinitif.',
            }
      - id: prendre
        type: trueFalse
        prompt: 'Au futur simple, *prendre* garde tout l’infinitif : *je prendreai*.'
        answer: false
        feedback:
          correct: 'Bravo ! Pour les verbes en *-re*, on enlève le *e* : *je prendrai*.'
          incorrect: 'Pour les verbes en *-re*, on enlève le *e* final avant la terminaison : *je prendrai*.'
      - id: irreguliers
        type: matching
        prompt: Associe chaque verbe à sa forme au futur simple.
        pairs:
          - [être, je serai]
          - [avoir, j’aurai]
          - [aller, j’irai]
          - [faire, je ferai]
          - [changer, je changerai]
      - id: rencontrera
        type: fillBlank
        prompt: Complète avec le verbe *rencontrer* au futur simple.
        text: Quels problèmes ___ ta communauté ?
        blanks: [[rencontrera]]
      - id: changera
        type: multipleChoice
        prompt: Quelle partie de ton identité ne ___ jamais ?
        options:
          - { text: changera, correct: true }
          - {
              text: changerai,
              feedback: '*Changerai* est pour *je*. Le sujet est *quelle partie* (= elle) : *changera*.',
            }
          - {
              text: changeras,
              feedback: '*Changeras* est pour *tu*. Le sujet est *quelle partie* (= elle) : *changera*.',
            }
      - id: ordre-inclusive
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Ma communauté sera plus inclusive.

  - slug: identite-et-communaute-comparaisons
    title: 'Les comparaisons : plus… que, moins… que, aussi… que'
    minutes: 8
    items:
      - id: plus-grande
        type: multipleChoice
        prompt: Quelle phrase est correcte ?
        options:
          - { text: Ma communauté est plus grande que la tienne., correct: true }
          - {
              text: Ma communauté est plus grande de la tienne.,
              feedback: 'Après *plus*, on utilise *que* : *plus grande que*.',
            }
          - {
              text: Ma communauté est plus grand que la tienne.,
              feedback: '*Communauté* est féminin : l’adjectif s’accorde, *plus grande*.',
            }
      - id: aussi
        type: fillBlank
        prompt: 'Complète pour dire que les deux communautés sont égales (=).'
        text: Notre communauté est ___ unie que leur communauté.
        blanks: [[aussi]]
        wordBank: [plus, moins, aussi]
      - id: moins-que
        type: fillBlank
        prompt: 'Complète la comparaison (−).'
        text: Ma communauté est ___ diversifiée ___ la tienne.
        blanks: [[moins], [que]]
      - id: phrase-complete
        type: trueFalse
        prompt: '*La communauté de Yossi est plus accueillante.* Cette comparaison est complète.'
        answer: false
        feedback:
          correct: 'Bravo ! Il manque le deuxième élément : *… plus accueillante que la communauté de Danny*.'
          incorrect: 'Quand on compare, la phrase contient les deux éléments : *… plus accueillante que la communauté de Danny*.'
      - id: la-plus
        type: multipleChoice
        prompt: La communauté étudiante est ___ active.
        options:
          - { text: la plus, correct: true }
          - { text: le plus, feedback: '*Communauté* est féminin : *la plus active*.' }
          - {
              text: plus,
              feedback: 'Sans deuxième élément, on utilise le superlatif avec l’article : *la plus active*.',
            }
      - id: sens
        type: matching
        prompt: Associe chaque structure à son sens.
        pairs:
          - [plus… que, '+ (supérieur)']
          - [moins… que, '− (inférieur)']
          - [aussi… que, '= (égal)']
          - [la plus…, superlatif (le maximum)]
      - id: prefere
        type: multipleChoice
        prompt: 'Quelle phrase est la plus naturelle ?'
        options:
          - { text: Je préfère la génération Z., correct: true }
          - {
              text: J’aime plus la génération Z.,
              feedback: 'À l’oral, *j’aime plus* peut aussi vouloir dire « je n’aime plus ». Pour être clair, on utilise *préférer* : *Je préfère la génération Z.*',
            }
          - {
              text: Je plus aime la génération Z.,
              feedback: '*Plus* ne se met pas avant le verbe. On dit : *Je préfère la génération Z.*',
            }
      - id: ordre-active
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: La communauté étudiante est la plus active.
