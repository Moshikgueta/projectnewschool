activities:
  - slug: plans-pour-le-week-end-futur
    title: 'Le futur : je vais visiter, je visiterai'
    minutes: 8
    items:
      - id: vais-visiter
        type: multipleChoice
        prompt: Samedi, je ___ visiter le musée.
        options:
          - { text: vais, correct: true }
          - {
              text: va,
              feedback: 'Avec *je*, le verbe *aller* fait *je vais*. *Va* est pour *il / elle*.',
            }
          - {
              text: vas,
              feedback: 'Avec *je*, le verbe *aller* fait *je vais*. *Vas* est pour *tu*.',
            }
      - id: aller-present
        type: fillBlank
        prompt: Complète avec le verbe *aller* au présent (futur proche).
        text: Nous ___ faire une promenade en bateau. Ils ___ escalader la montagne.
        blanks: [[allons], [vont]]
      - id: infinitif-apres-aller
        type: multipleChoice
        prompt: Dimanche, tu vas ___ dans le jardin botanique.
        options:
          - { text: te détendre, correct: true }
          - {
              text: te détends,
              feedback: 'Au futur proche, après *aller*, le verbe est à l’infinitif : *tu vas te détendre*.',
            }
          - {
              text: détendu,
              feedback: '*Détendu* est un participe. Après *aller*, on met l’infinitif : *te détendre*.',
            }
      - id: futur-simple-terminaisons
        type: matching
        prompt: Associe chaque sujet au verbe *visiter* au futur simple.
        pairs:
          - [je, visiterai]
          - [tu, visiteras]
          - [nous, visiterons]
          - [vous, visiterez]
          - [ils, visiteront]
      - id: irreguliers
        type: fillBlank
        prompt: Complète au futur simple.
        text: (être) Mon week-end ___ génial. (aller) Demain, j’___ au marché. (faire) Nous ___ du vélo.
        blanks: [[sera], [irai], [ferons]]
      - id: prendre
        type: multipleChoice
        prompt: Le week-end prochain, je ___ le train pour Paris. (futur simple)
        options:
          - { text: prendrai, correct: true }
          - {
              text: prenderai,
              feedback: 'Avec les verbes en *-re*, on enlève le *e* final de l’infinitif : *prendr-* + *ai* = *prendrai*.',
            }
          - {
              text: vais prendre,
              feedback: '*Vais prendre* est correct, mais c’est le futur proche. Au futur simple : *je prendrai*.',
            }
      - id: plans
        type: trueFalse
        prompt: On utilise le futur proche pour parler de plans et de décisions déjà prises.
        answer: true
        feedback:
          correct: 'Bravo ! *Ce week-end, je vais voir mes amis* : c’est un plan déjà décidé.'
          incorrect: 'C’est vrai : le futur proche (*aller* + infinitif) sert à parler de plans et de décisions déjà prises.'
      - id: ordre-week-end
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: Ce week-end, je vais voir mes amis.

  - slug: plans-pour-le-week-end-comparaisons
    title: 'Les comparaisons : plus… que, le plus…'
    minutes: 8
    items:
      - id: plus-que
        type: multipleChoice
        prompt: Mon week-end est ___ amusant ___ ton week-end.
        options:
          - { text: plus … que, correct: true }
          - {
              text: plus … de,
              feedback: 'Pour comparer deux choses, on dit *plus* + adjectif + *que*.',
            }
          - {
              text: le plus … que,
              feedback: '*Le plus* est un superlatif : on ne compare pas avec *que*. Ici : *plus amusant que*.',
            }
      - id: meilleur
        type: multipleChoice
        prompt: Ce restaurant est ___ que l’autre.
        options:
          - { text: meilleur, correct: true }
          - {
              text: plus bon,
              feedback: 'On ne dit pas *plus bon*. Le comparatif de *bon* est *meilleur*.',
            }
          - {
              text: mieux,
              feedback: '*Mieux* vient de l’adverbe *bien*. Avec l’adjectif *bon* (un restaurant), on dit *meilleur*.',
            }
      - id: superlatif-accord
        type: fillBlank
        prompt: Complète avec *le*, *la* ou *les*.
        text: Dana est ___ plus gentille. Ce sont ___ week-ends les plus relaxants. C’est ___ moins ennuyeux.
        blanks: [[la], [les], [le]]
        wordBank: [le, la, les]
      - id: mieux-danse
        type: multipleChoice
        prompt: Yossi danse ___ que moi.
        options:
          - { text: mieux, correct: true }
          - {
              text: meilleur,
              feedback: '*Danser* est un verbe : on utilise l’adverbe *mieux* (de *bien*), pas l’adjectif *meilleur*.',
            }
          - {
              text: plus bien,
              feedback: 'On ne dit pas *plus bien*. Le comparatif de *bien* est *mieux*.',
            }
      - id: superlatif-sans-que
        type: trueFalse
        prompt: 'Avec un superlatif, on doit toujours ajouter *que* : *Le week-end de Yossi est le plus reposant que.*'
        answer: false
        feedback:
          correct: 'Bravo ! Avec un superlatif, pas besoin de comparer : *Le week-end de Yossi est le plus reposant.*'
          incorrect: 'Avec un superlatif (*le plus, le meilleur*), pas besoin de *que* : *Le week-end de Yossi est le plus reposant.*'
      - id: types
        type: matching
        prompt: Associe chaque phrase à son sens.
        pairs:
          - [plus amusant que, '+ (supériorité)']
          - [moins ennuyeux que, '− (infériorité)']
          - [aussi actif que, '= (égalité)']
          - [le plus relaxant, superlatif]
      - id: moins-que
        type: fillBlank
        prompt: 'Complète la comparaison (−, infériorité).'
        text: Rester à la maison est ___ actif ___ faire de la randonnée.
        blanks: [[moins], [que]]
      - id: ordre-meilleur
        type: reorderSentence
        prompt: Remets les mots dans l’ordre.
        sentence: C’est le meilleur week-end de l’année.
