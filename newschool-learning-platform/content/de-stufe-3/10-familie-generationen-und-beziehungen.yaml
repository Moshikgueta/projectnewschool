activities:
  - slug: familie-generationen-und-beziehungen-adjektive
    title: Adjektive und Adjektivendungen
    minutes: 8
    items:
      - id: geduldige-person
        type: multipleChoice
        prompt: Meine Schwester ist geduldig. Sie ist eine ___ Person.
        options:
          - { text: geduldige, correct: true }
          - {
              text: geduldig,
              feedback: 'Vor einem Nomen braucht das Adjektiv eine Endung: *eine geduldige Person*.',
            }
          - {
              text: geduldigen,
              feedback: '*Person* ist feminin, Nominativ: *eine geduldige Person* (Endung *-e*).',
            }
      - id: geduldigen-bruder
        type: multipleChoice
        prompt: Ich habe einen ___ Bruder.
        options:
          - { text: geduldigen, correct: true }
          - {
              text: geduldiger,
              feedback: '*ein geduldiger Bruder* ist Nominativ. Nach *haben* steht der Akkusativ: *einen geduldigen Bruder*.',
            }
          - {
              text: geduldig,
              feedback: 'Vor einem Nomen braucht das Adjektiv eine Endung. Akkusativ maskulin: *einen geduldigen Bruder*.',
            }
      - id: ist-geduldige
        type: trueFalse
        prompt: 'Der Satz *Meine Mutter ist geduldige.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! Nach *sein* hat das Adjektiv keine Endung: *Meine Mutter ist geduldig.*'
          incorrect: 'Nach *sein, werden* und *bleiben* hat das Adjektiv keine Endung: *Meine Mutter ist geduldig.*'
      - id: disziplinierter-arzt
        type: fillBlank
        prompt: Ergänze das Adjektiv *diszipliniert* mit der richtigen Endung.
        text: Mein Großvater war ein sehr ___ Arzt.
        blanks: [[disziplinierter]]
      - id: praeziser
        type: matching
        prompt: Welches präzisere Adjektiv passt zu welchem einfachen Adjektiv?
        pairs:
          - [nett, warmherzig]
          - [streng, anspruchsvoll]
          - [alt, erfahren]
          - [gut, zuverlässig]
          - [offen, aufgeschlossen]
      - id: vater-endungen
        type: fillBlank
        prompt: Ergänze die Endungen von *geduldig* (Nominativ).
        text: der ___ Vater, ein ___ Vater, ein ___ Kind
        blanks: [[geduldige], [geduldiger], [geduldiges]]
        wordBank: [geduldige, geduldiger, geduldiges]
      - id: wurde-angespannt
        type: multipleChoice
        prompt: Beim Abendessen wurde die Atmosphäre plötzlich ___.
        options:
          - { text: angespannt, correct: true }
          - {
              text: angespannte,
              feedback: 'Nach *werden* hat das Adjektiv keine Endung: *Die Atmosphäre wurde angespannt.*',
            }
          - {
              text: angespanntes,
              feedback: 'Nach *werden* hat das Adjektiv keine Endung: *Die Atmosphäre wurde angespannt.*',
            }
      - id: ordne-geduldig
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz.
        sentence: Meine Schwester ist unglaublich geduldig.

  - slug: familie-generationen-und-beziehungen-konnektoren
    title: Konnektoren und Wortstellung
    minutes: 8
    items:
