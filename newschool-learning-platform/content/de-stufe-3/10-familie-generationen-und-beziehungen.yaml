# Cycle "Familie, Generationen und Beziehungen", converted from the German level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (German).
course: de-stufe-3
slug: familie-generationen-und-beziehungen
title: Familie, Generationen und Beziehungen
goal: Familie und Beziehungen genau beschreiben, mit Adjektiven und den richtigen Endungen und mit Konnektoren in der richtigen Wortstellung.
position: 10
status: published

review:
  - >-
    The two workbook exercises ("Adjektive und Adjektivendungen" and "Konnektoren und
    Wortstellung") are NEW: the notebook has no self-correcting exercises. They were
    written from the cycle's summary rules, examples and vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    The notebook names three language focuses (adjectives and adjective endings;
    connectors; word order in main and subordinate clauses). The cycle has two
    skills, so connectors and word order are joined into one skill, "Konnektoren und
    Wortstellung" (the notebook itself teaches them together).
  - >-
    Left out: the leftover line "Diese Version basiert auf deinem ursprünglichen
    Unterrichtsplan, wurde aber grammatisch an das Deutsche angepasst." (a note to
    the author, not course text); the empty "Unterricht vom" / "Teilnehmer" fields;
    the "Niveau: 3 - sehr anspruchsvoll" line; all "Antwort Schüler/in 1/2/3" lines.
    The teacher note "Grammatikfokus" is kept as a teacher note. No real student
    names appear in this cycle.
  - >-
    Resources without links: Activity 3 names the video "57 Years Apart - A Boy And a
    Man Talk About Life" and Activity 4 and homework task 3 name the podcast "BBC
    Learning English: The Bond Between Sisters". The notebook gives no URL, and the
    BBC host is not on the allowed list, so both are mentioned only in teacher notes.
    Please add a YouTube link for the video if you have one. Both are in English;
    the podcast expression "march to your own drum" is linked to the German
    vocabulary item "seinen eigenen Weg gehen" in a teacher note.
  - >-
    Summary additions (please confirm): the adjective-ending examples are now
    labelled "Nominativ" (the notebook says only "mit bestimmtem / unbestimmtem
    Artikel"); a short ending table (Nominativ and Akkusativ, der / ein) was added;
    a rule was added that after a Nebensatz at the start of the sentence the main
    clause begins with the verb ("Obwohl ..., akzeptiert er ..."), which the
    notebook's examples show but do not state; "wohingegen" was added to the
    Nebensatz connector list (it is in the notebook's table).
  - >-
    Corrections: Activity 2 "Obwohl sich die Familienmitglieder sehr wichtig sind" →
    "Obwohl die Familienmitglieder einander sehr wichtig sind" (reciprocal meaning;
    "sich wichtig sein" can sound like "important to oneself"); broken bold marks ("\*\*Einfach\*\*" etc.) in the tables removed;
    warm-up heading "Die Lehrkraft kann acht Fragen auswählen" → "aus den acht Fragen
    auswählen" (there are exactly eight).
  - >-
    Vocabulary changes (please confirm): "die Schwesternschaft" (usually a nurses'
    association / sorority) → "die Verbundenheit" (קרבה / אחווה); "die
    Geburtenreihenfolge" → "die Geburtsreihenfolge" (the usual form); "jemanden unter
    Druck setzen" was glossed "לשים מישהו במצב לא נוח" with the definition "zu einer
    schnellen Reaktion zwingen" (that is English "put someone on the spot"): its gloss
    is now "להפעיל לחץ על מישהו", and "jemanden in eine unangenehme Situation bringen
    – לשים מישהו במצב לא נוח" was added (Activity 4 uses it); "deshalb – כתוצאה
    מכך" → "לכן"; "sich streiten – להתווכח" → "לריב / להתווכח"; "sich mit jemandem
    verstehen" → "sich (gut) mit jemandem verstehen". The German short definitions of
    the vocabulary table were left out (the vocabulary block has term and Hebrew
    gloss only). "das Geschwister" (singular) is correct but formal; in everyday
    German people say "mein Bruder / meine Schwester".
  - >-
    The intro round and warm-up questions had example answers but no sentence frames:
    frames were made from the examples, and the full example answers are in the
    warm-up teacher note. The notebook gives no times for any part of this cycle, so
    no minutes are set.
  - >-
    The notebook has no Hebrew summary and no classic homework with an answer key in
    this cycle; the German summary ("Zusammenfassung der Stunde") is kept in German.
    The two Mori tasks for homework ("Familientausch", "Beziehungen zwischen
    Geschwistern") plus the first Mori message are all kept; nothing was repeated.
    The Quizlet link lost its tracking parameter (?funnelUUID=…).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: familie-generationen-und-beziehungen-unterricht
    title: 'Unterricht: Familie, Generationen und Beziehungen'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Familie, Generationen und Beziehungen
      - id: skills
        type: cycleOverview
        skills:
          - name: Adjektive und Adjektivendungen
            description: 'Präzise Adjektive, ohne Endung nach *sein / werden / bleiben* (*Sie ist geduldig.*), mit Endung vor einem Nomen (*eine geduldige Person, einen geduldigen Bruder*)'
          - name: Konnektoren und Wortstellung
            description: '*aber, denn* (normale Wortstellung), *weil, obwohl, während* (Verb am Ende), *deshalb, trotzdem* (Verb direkt danach)'
      - id: quizlet
        type: externalLink
        label: Familie, Generationen und Beziehungen auf Quizlet
        url: https://quizlet.com/il/1201404697/familie-generationen-und-beziehungen-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Einführungsrunde
      - id: intro
        type: sentenceFrame
        prompt: Beschreibe deine Familie mit **zwei Adjektiven** und verbinde deine Ideen mit einem Konnektor.
        frame: Ich bin ___. Meine Familie ist ___, aber / obwohl ___.
        example: Ich bin Dana. Meine Familie ist ziemlich traditionell, aber gleichzeitig sehr offen.
      - id: warmup-title
        type: heading
        level: 3
        text: Aufwärmfragen
      - id: warmup-hint
        type: callout
        tone: info
        text: Antworte möglichst vollständig, benutze **starke Adjektive** und verbinde mehrere Ideen logisch mit **Konnektoren**.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Würdest du deine Familie eher als traditionell oder modern beschreiben? Wie beeinflusst das wichtige Entscheidungen?
            frame: Ich würde meine Familie als ___ beschreiben, besonders wenn ___. Allerdings ___.
          - question: Wer ist eine besonders einflussreiche Person in deiner Familie? Wie würdest du diese Person beschreiben?
            frame: Mein / Meine ___ ist sehr ___, weshalb ___. Obwohl er / sie manchmal ___ ist, ___.
          - question: Welche Eigenschaften bewunderst du an älteren Familienmitgliedern, obwohl du nicht immer mit ihnen einer Meinung bist?
            frame: Ich bewundere ___ meiner Großeltern, obwohl wir ___.
          - question: Wie würdest du die Dynamik in deiner Familie beschreiben? Inwiefern ist sie anderen Familien ähnlich oder anders?
            frame: Unsere Familie ist ziemlich ___, obwohl wir ___. Da ___, ___.
          - question: Wie hat sich deine Beziehung zu deinen Eltern im Laufe der Jahre verändert?
            frame: Meine Beziehung zu meinen Eltern ist mit der Zeit ___ geworden. Früher ___, während ___.
          - question: Glaubst du, dass das Aufwachsen in Israel eine besondere Familienatmosphäre schafft? Warum oder warum nicht?
            frame: Familien in Israel sind meiner Erfahrung nach ___. Gleichzeitig ___.
          - question: Wie beeinflussen familiäre Erwartungen persönliche Entscheidungen, zum Beispiel Beruf, Studium oder Lebensstil?
            frame: Familiäre Erwartungen können ___ sein, weil ___. Allerdings ___.
          - question: Wie würde dein ideales zukünftiges Familienleben aussehen? Welche Werte wären dir besonders wichtig?
            frame: Mein ideales Familienleben wäre ___. Mir wäre ___ besonders wichtig, damit ___.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Der Berufsbaum meiner Familie'
        skills: [Adjektive und Adjektivendungen, Konnektoren und Wortstellung]
        steps:
          - '**Schritt 1, Berufsbaum erstellen (Einzelarbeit):** Erstelle einen Berufsbaum über drei Generationen: Großeltern, Eltern, du selbst (optional: Kinder).'
          - 'Notiere für jede Person: 1. Beruf oder wichtigste Tätigkeit, 2. zwei bis drei Adjektive zur Persönlichkeit oder Arbeitsweise, 3. einen kurzen Satz über ihren Einfluss auf andere Familienmitglieder. Versuche, Gemeinsamkeiten und Unterschiede zwischen den Generationen zu erkennen.'
          - '**Schritt 2, Präsentation in Paaren:** Person A präsentiert ihren Berufsbaum, Person B stellt Rückfragen. Danach tauscht ihr die Rollen.'
          - 'Nützliche Fragen: *Warum hat diese Person diesen Beruf gewählt? War diese Person eher unabhängig oder familienorientiert? Wie hat sie die nächste Generation beeinflusst? Gibt es Eigenschaften, die sich über mehrere Generationen wiederholen?*'
          - '**Schritt 3, Diskussion:** Sprecht über die Fragen unten.'
          - '**Schritt 4, Präsentation im Plenum:** Stell einen interessanten Aspekt über die Familie deines Partners / deiner Partnerin vor. Benutze mindestens **zwei starke Adjektive**, **einen Konnektor für einen Grund** und **einen Konnektor für einen Gegensatz**.'
        example: |-
          *Großvater: Arzt (diszipliniert, ehrgeizig, verantwortungsbewusst)*
          *Mein Großvater war ein sehr disziplinierter Arzt, weshalb meine Mutter schon früh großen Wert auf beruflichen Erfolg gelegt hat.*
          *Plenum: Sein Vater ist sehr ehrgeizig, weil beruflicher Erfolg in seiner Familie immer wichtig war. Sein Sohn ist dagegen deutlich unabhängiger und hat einen ganz anderen Weg gewählt.*
      - id: act1-questions
        type: discussionQuestions
        title: Diskussion
        items:
          - question: Gibt es ein klares Muster bei den Berufen in deiner Familie?
            frame: In meiner Familie ___, weil ___.
          - question: Ist deine Familie eher karriereorientiert oder familienorientiert?
            frame: Meine Familie ist eher ___. Trotzdem ___.
          - question: Wer hat dich beruflich am stärksten beeinflusst?
            frame: Am stärksten hat mich ___ beeinflusst, weil er / sie ___.
          - question: Hast du einen ähnlichen Weg wie deine Eltern gewählt?
            frame: Ja, ___. / Nein, ich ___, obwohl ___.
          - question: Gab es Druck, einen bestimmten Beruf zu wählen?
          - question: Welche sozialen oder kulturellen Faktoren haben die Entscheidungen deiner Familie beeinflusst?
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Super Nanny besucht meine Familie'
        skills: [Adjektive und Adjektivendungen, Konnektoren und Wortstellung]
        steps:
          - '**Schritt 1, die Situation:** Du bist eine professionelle **Super Nanny** und verbringst eine Woche mit deiner eigenen Familie. Du beobachtest alles und schreibst danach einen professionellen, aber leicht dramatischen Bericht.'
          - '**Schritt 2, Bericht schreiben:** A. Erste Beobachtung. B. Familienmitglieder beschreiben. C. Eine Sache auswählen, die verändert werden sollte (zum Beispiel Schlafenszeiten, Handynutzung, Gespräche beim Abendessen, Verteilung der Hausarbeit, dramatische Reaktionen, Unpünktlichkeit, Überfürsorglichkeit). D. Eine humorvolle Lösung vorschlagen, mit einem Modalverb und mindestens einem Konnektor. E. Positiver Abschluss.'
          - '**Schritt 3, Super-Nanny-Konferenz:** Arbeitet zu zweit. Jede Super Nanny berichtet über ihre Familie. Die andere Person gibt mindestens **einen zusätzlichen Ratschlag** mit *sollte, könnte, müsste* oder *Es wäre besser, wenn …*'
          - '**Schritt 4, Klassendiskussion:** Sprecht über die Fragen unten.'
        example: '*Das ist eine warmherzige, aber leicht dramatische Familie. Obwohl sich alle sehr lieben, werden selbst einfache Gespräche schnell zu intensiven Diskussionen. Die Mutter ist effizient und verantwortungsbewusst, während der Vater eher gelassen und optimistisch ist. Deshalb werden manchmal wichtige Aufgaben vergessen. Die Kinder sind kreativ und energiegeladen, obwohl sie beim Aufräumen plötzlich erstaunlich müde werden. Ich würde einen festen Haushaltsplan empfehlen, weil eine klare Struktur die täglichen Diskussionen reduzieren könnte. Trotz des leichten Chaos ist diese Familie außergewöhnlich loyal und eng miteinander verbunden.*'
      - id: act2-report
        type: discussionQuestions
        title: Mein Super-Nanny-Bericht
        items:
          - question: 'A. Erste Beobachtung (*Das ist eine liebevolle, aber leicht chaotische Familie. Obwohl die Familienmitglieder einander sehr wichtig sind, ist ihre Kommunikation manchmal ziemlich dramatisch.*)'
            frame: Das ist eine ___, aber ___ Familie. Obwohl ___, ___.
          - question: 'B. Familienmitglieder beschreiben (*Die Mutter ist äußerst organisiert, aber gleichzeitig schnell überfordert. Der Vater ist meistens gelassen, obwohl er auf mysteriöse Weise verschwindet, sobald jemand die Küche aufräumen muss. Die Kinder sind kreativ und energiegeladen, weshalb es im Haus selten ruhig ist.*)'
            frame: Die Mutter / Der Vater ist ___, obwohl ___.
          - question: C. Was sollte sich in dieser Familie verändern?
            frame: In dieser Familie sollte sich ___ verändern.
          - question: 'D. Eine humorvolle Lösung (*Die Familie sollte beim Abendessen alle Handys weglegen, damit sich die Familienmitglieder besser miteinander unterhalten können. Ein wöchentlicher Haushaltsplan könnte mehr Ordnung schaffen, obwohl wahrscheinlich zunächst niemand begeistert wäre.*)'
            frame: Die Familie sollte ___, damit ___.
          - question: 'E. Positiver Abschluss (*Trotz des kleinen Chaos ist diese Familie warmherzig und loyal. Mit einigen kleinen Veränderungen könnte das Familienleben deutlich entspannter werden.*)'
            frame: Trotz ___ ist diese Familie ___.
      - id: act2-discussion
        type: discussionQuestions
        title: Klassendiskussion
        items:
          - question: Warum bemerken Menschen Probleme in anderen Familien oft leichter als in ihrer eigenen?
          - question: Glaubst du, dass Außenstehende familiäre Probleme manchmal übertreiben, weil ihnen der Kontext fehlt?
          - question: Oder kann eine Person von außen eine objektivere Perspektive haben?
          - question: Wie beeinflussen soziale Medien unsere Vorstellungen von einer „perfekten Familie“?
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Generationenkonflikte'
        skills: [Adjektive und Adjektivendungen, Konnektoren und Wortstellung]
        steps:
          - '**Schritt 1, Brainstorming (Gruppe):** Was bedeutet **Generationenkonflikt**? Warum entstehen Unterschiede zwischen Generationen? Wie beschreibt eine jüngere Generation oft ältere Menschen, und wie beschreibt eine ältere Generation oft jüngere Menschen? Sammelt Adjektive an der Tafel (siehe Tabelle).'
          - '**Schritt 2, Video:** Schaut das Interview mit einem Jungen und einem Mann, zwischen denen 57 Jahre Altersunterschied liegen. Notiert: eine überraschende Gemeinsamkeit, einen deutlichen Unterschied, zwei Adjektive für jede Person.'
          - '**Schritt 3, Diskussion in Paaren:** Sprecht über die Fragen unten und auch über den Einfluss von Technologie, Arbeitsmoral, Beziehungen, sozialen Medien, Respekt und Unabhängigkeit. Benutzt bewusst Vergleiche (*technikaffiner als …*) und Konnektoren (*während, obwohl*).'
          - '**Schritt 4, Klassenaustausch:** Jedes Paar präsentiert eine interessante Erkenntnis. Wenn Menschen aus verschiedenen Generationen in der Gruppe sind: *Wie ist es, gemeinsam mit Menschen einer anderen Generation eine Sprache zu lernen?*'
        example: |-
          *Jüngere Menschen sind häufig technikaffiner als ältere Menschen.*
          *Während meine Generation großen Wert auf Flexibilität legt, ist berufliche Stabilität für meine Eltern wichtiger.*
          *Obwohl die Generationen unterschiedlich wirken, haben sie oft ähnliche Bedürfnisse.*
      - id: act3-adjectives
        type: table
        caption: Mögliche Adjektive
        header: [Jüngere Generation, Ältere Generation]
        rows:
          - [flexibel, erfahren]
          - [sensibel, traditionell]
          - [technikaffin, pragmatisch]
          - [offen, diszipliniert]
          - [ungeduldig, konservativ]
          - [idealistisch, widerstandsfähig]
          - [anpassungsfähig, zuverlässig]
      - id: act3-questions
        type: discussionQuestions
        title: Diskussion in Paaren
        items:
          - question: Hattest du schon einmal ein interessantes Gespräch mit jemandem, der viel älter oder jünger war als du?
          - question: Welche Stereotype über deine Generation nerven dich?
            frame: Mich nervt, dass ___.
          - question: Ist deine Generation offener, gestresster, unabhängiger oder sensibler als frühere Generationen?
            frame: Meine Generation ist ___ als ___, weil ___.
          - question: Was verstehen ältere Menschen an jüngeren Generationen oft nicht?
          - question: Was verstehen jüngere Menschen an älteren Generationen oft nicht?
          - question: Wie beeinflussen Technologie, Arbeitsmoral, Beziehungen, soziale Medien, Respekt und Unabhängigkeit das Verhältnis zwischen den Generationen?
            frame: Während ___, ___.
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Beziehungen zwischen Geschwistern'
        skills: [Adjektive und Adjektivendungen, Konnektoren und Wortstellung]
        steps:
          - '**Schritt 1, Podcast:** Hört den Podcast über Beziehungen zwischen Geschwistern. Notiert beim Hören: eine positive Beschreibung der Beziehung, ein erwähntes Stereotyp, einen interessanten Ausdruck. Ihr könnt gleichzeitig das Transkript lesen.'
          - '**Schritt 2, Hörverständnis:** Beantwortet die drei Fragen unten.'
          - '**Schritt 3, Gespräch:** Sprecht über eure eigenen Beziehungen zu Geschwistern. Benutzt möglichst präzise Adjektive und verbindet eure Aussagen logisch.'
          - '**Schritt 4, Klassendiskussion:** Sprecht über die letzten drei Fragen.'
      - id: act4-listening
        type: discussionQuestions
        title: Hörverständnis
        items:
          - question: Wie beschreibt Eileen ihre Beziehung zu ihren Schwestern?
          - question: Was bedeutet der Ausdruck „march to your own drum“? Wie sagt man das auf Deutsch?
            frame: Das bedeutet ___. Auf Deutsch sagt man ___.
          - question: Was sagt die Psychotherapeutin über Geschwister-Stereotype?
      - id: act4-questions
        type: discussionQuestions
        title: Gespräch über Geschwister
        items:
          - question: Verstehst du dich gut mit deinen Geschwistern?
            frame: Ich verstehe mich ___ mit ___, weil ___.
          - question: Hat sich eure Beziehung mit der Zeit verändert?
          - question: Hat dich ein Geschwisterteil schon einmal in eine unangenehme Situation gebracht?
          - question: Gehst du innerhalb deiner Familie deinen eigenen Weg?
          - question: Welches Geschwister-Stereotyp passt zu deiner Familie? Welches passt überhaupt nicht?
          - question: Warum teilen Menschen Geschwister gerne in Kategorien ein?
          - question: Hat es einen großen Einfluss, ob man das älteste, mittlere oder jüngste Kind ist?
          - question: Sind solche Stereotype hilfreich oder problematisch?
          - question: Gibt es in der israelischen Kultur typische Geschwisterrollen?
          - question: Beeinflusst die Geschwisterrolle die Persönlichkeit im Erwachsenenalter?
          - question: Können Beziehungen zwischen Geschwistern stärker sein als Freundschaften?
          - question: Warum verbessern sich Geschwisterbeziehungen häufig mit zunehmendem Alter?
      - id: act5
        type: classActivity
        title: 'Aktivität 5: Debatte – Loyalität oder Unabhängigkeit?'
        skills: [Konnektoren und Wortstellung, Adjektive und Adjektivendungen]
        steps:
          - 'Familiäre Loyalität und persönliche Unabhängigkeit gelten beide als wichtige Werte. Trotzdem können sie miteinander in Konflikt geraten. In vielen Kulturen bieten enge Familienbeziehungen emotionale Unterstützung und Stabilität. Gleichzeitig können sie Erwartungen und sozialen Druck erzeugen. Während familiäre Loyalität Zusammenhalt und Verantwortungsbewusstsein fördern kann, ermöglicht Unabhängigkeit den Menschen, eine eigene Identität zu entwickeln und selbstständige Entscheidungen zu treffen.'
          - '**Die zentrale Frage:** Kann man einer Familie eng verbunden sein und gleichzeitig vollständig unabhängig leben?'
          - '**Gruppe 1:** Die Familie steht über allem. Loyalität gegenüber der Familie sollte einer der wichtigsten Werte im Leben sein.'
          - '**Gruppe 2:** Jedes Familienmitglied ist ein eigenständiger Mensch. Die Familie sollte persönliche Entscheidungen respektieren und niemandem vorschreiben, wie er oder sie leben soll.'
          - '**Sprachliche Anforderungen:** Jedes Argument enthält mindestens ein starkes Adjektiv, einen Grund, einen Gegensatz oder eine Einschränkung und ein Beispiel.'
        example: '*Enge Familienbeziehungen sind äußerst wertvoll, weil Menschen in schwierigen Situationen Unterstützung brauchen. Allerdings darf familiäre Loyalität nicht bedeuten, dass persönliche Freiheit völlig aufgegeben werden muss.*'
      - id: act5-argument
        type: discussionQuestions
        title: Mein Argument
        items:
          - question: Dein Argument für deine Gruppe
            frame: ___ ist / sind äußerst ___, weil ___. Allerdings ___. Zum Beispiel ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: **Adjektive und Adjektivendungen** und
          **Konnektoren und Wortstellung** (das Heft nennt die Wortstellung in Haupt- und
          Nebensätzen als dritten Schwerpunkt; sie wird hier mit den Konnektoren geübt).
          Das Heft gibt keine Zeiten an: Wähle die Aktivitäten nach der verfügbaren Zeit.
      - id: n-grammar
        anchor: skills
        text: >-
          **Grammatikfokus:** Es geht nicht nur darum, mehr Adjektive und Konnektoren zu
          benutzen. Achte die ganze Stunde auf zwei Dinge. 1. Adjektive verändern ihre
          Form: *Meine Schwester ist geduldig.* aber *Sie ist eine geduldige Person. Ich
          habe einen geduldigen Bruder.* Vor einem Nomen braucht das Adjektiv eine
          Endung. 2. Konnektoren beeinflussen die Wortstellung: *Meine Familie ist
          traditionell, aber sie ist sehr tolerant.* / *…, obwohl sie sehr tolerant
          ist.* / *Meine Familie ist traditionell. Trotzdem ist sie sehr tolerant.* Greif
          das während der gesamten Stunde immer wieder auf.
      - id: n-intro
        anchor: intro
        text: 'Gib zuerst dein eigenes Beispiel. Zweites Beispiel aus dem Heft: *Meine Familie ist sehr eng verbunden, obwohl wir oft unterschiedliche Meinungen haben.*'
      - id: n-warmup
        anchor: warmup
        text: >-
          Wähle aus den acht Fragen aus. Beispielantworten aus dem Heft: 1. *Ich würde
          meine Familie als relativ traditionell beschreiben, besonders wenn es um Werte
          und Familienfeiern geht. Allerdings sind meine Eltern bei beruflichen
          Entscheidungen ziemlich aufgeschlossen.* 2. *Meine ältere Schwester ist sehr
          zielstrebig und verantwortungsbewusst, weshalb sie für mich ein wichtiges
          Vorbild ist. Obwohl sie manchmal streng sein kann, ist sie unglaublich
          unterstützend.* 3. *Ich bewundere die Geduld und Widerstandsfähigkeit meiner
          Großeltern, obwohl wir bei manchen Themen völlig unterschiedliche Ansichten
          haben. Sie sind sehr erfahren und pragmatisch, weshalb ich ihren Rat trotzdem
          ernst nehme.* 4. *Unsere Familie ist ziemlich unterstützend und offen, obwohl
          wir uns manchmal wegen Kleinigkeiten streiten. Da uns ehrliche Kommunikation
          wichtig ist, lösen wir Konflikte meistens relativ schnell.* 5. *Meine Beziehung
          zu meinen Eltern ist mit der Zeit ausgeglichener geworden. Früher haben wir uns
          häufiger gestritten, während wir heute viel ruhiger miteinander sprechen.* 6.
          *Familien in Israel sind meiner Erfahrung nach oft sehr eng miteinander
          verbunden. Diese Nähe kann manchmal überwältigend sein, gleichzeitig bietet sie
          aber viel emotionale Unterstützung.* 7. *Familiäre Erwartungen können
          motivierend sein, weil sie Verantwortungsbewusstsein fördern. Allerdings können
          sie auch einschränkend wirken, wenn persönliche Entscheidungen nicht akzeptiert
          werden.* 8. *Mein ideales Familienleben wäre ruhig und stabil, gleichzeitig aber
          auch flexibel und spontan. Mir wäre eine respektvolle Atmosphäre besonders
          wichtig, damit sich alle Familienmitglieder wertgeschätzt fühlen.*
      - id: n-act1
        anchor: act1
        text: >-
          Sozialform: Einzelarbeit, dann Partnerarbeit, dann Präsentation. Achte bei der
          Präsentation im Plenum darauf, dass jede Person zwei starke Adjektive, einen
          Grund (*weil, denn*) und einen Gegensatz (*obwohl, während, dagegen*) benutzt.
      - id: n-act2
        anchor: act2
        text: >-
          Die Aktivität soll humorvoll bleiben. Es geht um eine fiktive Fernsehsendung und
          nicht darum, echte familiäre Probleme psychologisch zu analysieren. Wer nicht
          über die eigene Familie sprechen möchte, kann eine Familie erfinden.
      - id: n-act3
        anchor: act3
        text: >-
          Sozialform: Gruppenarbeit, Video, Diskussion. Das Heft nennt das Video „57
          Years Apart - A Boy And a Man Talk About Life“ (auf Englisch), aber ohne Link.
          Such es vor der Stunde (z. B. auf YouTube) und zeig es aus deinem eigenen
          Material.
      - id: n-act4
        anchor: act4
        text: >-
          Das Heft nennt den Podcast „BBC Learning English: The Bond Between Sisters“ (auf
          Englisch, mit Transkript), aber ohne Link; die Seite steht nicht auf der Liste
          der erlaubten Links. Spiel ihn aus deinem eigenen Material vor. Der Ausdruck
          „march to your own drum“ entspricht auf Deutsch *seinen eigenen Weg gehen*
          (Wortschatz).
      - id: n-act5
        anchor: act5
        text: >-
          Sozialform: Gruppendebatte. Teile die Klasse in Gruppe 1 und Gruppe 2. Achte
          darauf, dass jedes Argument ein starkes Adjektiv, einen Grund, einen Gegensatz
          oder eine Einschränkung und ein Beispiel enthält.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: familie-generationen-und-beziehungen-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Zusammenfassung der Stunde
      - id: adjectives-table
        type: table
        caption: Adjektive für Familie und Generationen
        header: [Persönlichkeit, Familienatmosphäre, Generationen, Emotionale Zustände]
        rows:
          - [unterstützend, warmherzig, aufgeschlossen, überfordert]
          - [stur, chaotisch, anpassungsfähig, respektiert]
          - [unabhängig, traditionell, konservativ, missverstanden]
          - [verantwortungsbewusst, intensiv, widerstandsfähig, wertgeschätzt]
          - [ehrgeizig, entspannt, pragmatisch, frustriert]
          - [geduldig, harmonisch, idealistisch, '']
          - [anspruchsvoll, angespannt, '', '']
      - id: rules-adjektive
        type: ruleSummary
        skill: Adjektive und Adjektivendungen
        rules:
          - text: 'Adjektive helfen uns, Menschen, Beziehungen, Situationen und Eigenschaften genauer zu beschreiben.'
          - text: 'Nach **sein, werden** und **bleiben** bekommt das Adjektiv **keine Endung**.'
            examples:
              - Meine Mutter ist geduldig.
              - Mein Bruder ist unabhängig.
              - Die Atmosphäre wurde angespannt.
              - Meine Großeltern bleiben optimistisch.
          - text: 'Steht das Adjektiv **vor einem Nomen**, braucht es eine **Endung**. **Nominativ** mit bestimmtem Artikel:'
            examples:
              - der geduldige Vater
              - die geduldige Mutter
              - das geduldige Kind
              - die geduldigen Eltern
          - text: '**Nominativ** mit unbestimmtem Artikel: Das Adjektiv zeigt das Genus (*-er, -e, -es*).'
            examples: [ein geduldiger Vater, eine geduldige Mutter, ein geduldiges Kind]
          - text: '**Akkusativ:** Nur das Maskulinum ändert sich (*einen …-en*).'
            examples: [Ich habe einen geduldigen Bruder., Sie hat eine unterstützende Schwester.]
          - text: 'Mit Adverbien machen wir Adjektive stärker oder präziser: *sehr, besonders, ziemlich, äußerst, unglaublich, überraschend, außergewöhnlich, ausgesprochen*.'
            examples:
              - Meine Schwester ist unglaublich geduldig.
              - Mein Vater ist ausgesprochen pragmatisch.
              - Unsere Familie ist ziemlich traditionell.
      - id: endings-table
        type: table
        caption: Adjektivendungen (Nominativ und Akkusativ)
        header: ['', maskulin, feminin, neutral, Plural]
        rows:
          - [
              Nominativ,
              der geduldige / ein geduldiger Vater,
              die / eine geduldige Mutter,
              das geduldige / ein geduldiges Kind,
              die geduldigen Eltern,
            ]
          - [
              Akkusativ,
              den / einen geduldigen Vater,
              die / eine geduldige Mutter,
              das geduldige / ein geduldiges Kind,
              die geduldigen Eltern,
            ]
      - id: precise-table
        type: table
        caption: Präzisere Adjektive verwenden
        header: [Einfach, Präziser]
        rows:
          - [nett, freundlich / warmherzig / rücksichtsvoll / unterstützend]
          - [wütend, frustriert / gereizt / verärgert / nachtragend]
          - [alt, erfahren / traditionell / konservativ]
          - [jung, energiegeladen / neugierig / idealistisch]
          - [streng, anspruchsvoll / diszipliniert / autoritär]
          - [gut, zuverlässig / hilfsbereit / kompetent]
          - [offen, aufgeschlossen / tolerant / flexibel]
      - id: rules-konnektoren
        type: ruleSummary
        skill: Konnektoren und Wortstellung
        rules:
          - text: 'Im Deutschen ist es besonders wichtig zu wissen, **welche Wortstellung ein Konnektor verlangt**.'
          - text: '**und, aber, oder, denn, sondern:** normale Wortstellung wie in einem Hauptsatz (Subjekt + Verb).'
            examples:
              - Meine Schwester ist unabhängig, aber sie ist sehr familienorientiert.
              - Ich respektiere meinen Vater, denn er ist sehr verantwortungsbewusst.
              - Meine Mutter ist nicht streng, sondern sie ist sehr konsequent.
          - text: '**weil, obwohl, während, wenn, damit, dass, wohingegen** leiten einen **Nebensatz** ein: Das konjugierte Verb steht **am Ende des Nebensatzes**.'
            examples:
              - 'Grund: Ich telefoniere jeden Tag mit meiner Mutter, weil wir ein sehr enges Verhältnis haben.'
              - 'Vergleich / Gegensatz: Während meine Schwester sehr spontan ist, bin ich eher vorsichtig.'
              - 'Zweck: Wir treffen uns regelmäßig, damit der Kontakt zwischen den Generationen nicht verloren geht.'
          - text: 'Steht der **Nebensatz am Anfang**, beginnt der Hauptsatz danach **mit dem Verb** (Verb, Komma, Verb).'
            examples:
              - Obwohl mein Vater ziemlich konservativ ist, akzeptiert er meine Entscheidungen.
              - Wenn meine Familie mich braucht, versuche ich immer zu helfen.
          - text: '**deshalb, deswegen, trotzdem, allerdings, außerdem, danach, schließlich** stehen im Hauptsatz auf **Position 1**. Danach folgt **sofort das Verb**.'
            examples:
              - Meine Familie lebt weit weg. Deshalb telefoniere ich oft mit ihnen.
              - 'Falsch: *Deshalb ich telefoniere …*'
              - Meine Schwester und ich sind sehr unterschiedlich. Trotzdem verstehen wir uns hervorragend.
              - Meine Eltern sind sehr unterstützend. Allerdings haben sie manchmal hohe Erwartungen.
              - Mein Bruder ist zuverlässig. Außerdem ist er sehr geduldig.
      - id: connectors-table
        type: table
        caption: Ideen hinzufügen, kontrastieren und begründen
        header: [Konnektor, Funktion, Beispiel]
        rows:
          - [und, zusätzliche Information, Meine Schwester ist ruhig und sehr geduldig.]
          - [
              außerdem,
              zusätzliche Information,
              Mein Bruder ist zuverlässig. Außerdem ist er hilfsbereit.,
            ]
          - [aber, Gegensatz, 'Meine Familie ist traditionell, aber sehr tolerant.']
          - [
              allerdings,
              Einschränkung,
              Meine Eltern sind offen. Allerdings sind sie bei einigen Themen eher konservativ.,
            ]
          - [obwohl, Gegensatz, 'Obwohl wir uns oft streiten, verstehen wir uns gut.']
          - [während, Vergleich, 'Während mein Bruder Stabilität bevorzugt, mag ich Veränderungen.']
          - [
              wohingegen,
              formeller Vergleich,
              'Meine Mutter ist sehr spontan, wohingegen mein Vater alles plant.',
            ]
          - [
              weil,
              Grund,
              'Ich rufe meine Großeltern oft an, weil mir unsere Beziehung wichtig ist.',
            ]
          - [
              denn,
              Grund,
              'Ich rufe meine Großeltern oft an, denn mir ist unsere Beziehung wichtig.',
            ]
          - [deshalb, Folge, Meine Familie lebt weit weg. Deshalb sehen wir uns selten.]
          - [
              trotzdem,
              unerwarteter Gegensatz,
              Wir wohnen weit auseinander. Trotzdem haben wir ein enges Verhältnis.,
            ]
          - [zuerst, Reihenfolge, Zuerst lebten meine Großeltern in Polen.]
          - [dann, Reihenfolge, Dann zogen sie nach Israel.]
          - [danach, Reihenfolge, Danach gründeten sie eine Familie.]
          - [
              schließlich,
              Abschluss,
              Schließlich entschieden sich meine Eltern für ein Leben in Tel Aviv.,
            ]
      - id: mistakes
        type: callout
        tone: warning
        title: Typische Fehler vermeiden
        text: |-
          ❌ *Obwohl meine Familie ist traditionell, wir sind sehr offen.*
          ✅ *Obwohl meine Familie traditionell ist, sind wir sehr offen.*
          ❌ *Meine Familie ist traditionell, trotzdem wir sind tolerant.*
          ✅ *Meine Familie ist traditionell. Trotzdem sind wir tolerant.*
          ❌ *Weil meine Eltern sind streng, habe ich viele Regeln.*
          ✅ *Weil meine Eltern streng sind, habe ich viele Regeln.*
          ❌ *Meine Familie ist sehr eng verbunden, aber obwohl wir streiten uns viel und trotzdem wir lieben uns.* (zu viele Verbindungen in einem Satz)
          ✅ *Meine Familie ist sehr eng verbunden, aber wir streiten uns manchmal.*
          ✅ *Obwohl wir unterschiedliche Meinungen haben, respektieren wir einander.*
          ✅ *Meine Familie ist ziemlich traditionell, weil Stabilität für meine Eltern wichtig ist. Obwohl sie meinen beruflichen Weg anfangs nicht verstanden haben, unterstützen sie mich heute.*
    teacherNotes:
      - id: n-summary
        anchor: null
        text: >-
          Wiederhole die Regeln mit der Gruppe und bitte um ein neues Beispiel für jede
          Regel, über die eigene Familie. Erinnere daran: Das ist ein wichtiger
          Unterschied zum Englischen, wo Adjektive vor dem Nomen keine Endung haben.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: familie-generationen-und-beziehungen-hausaufgaben
    title: Hausaufgaben mit Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben mit Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere eine Nachricht und schick sie ab. Mori stellt dir Fragen; beantworte alle.
      - id: mori-familie
        type: aiTutorPrompt
        title: 'Aufgabe 1: Meine Familie'
        message: >-
          Hallo Mori! Sprich mit mir über meine Familie und stelle mir Fragen, mit denen
          ich Persönlichkeiten, Beziehungen und die Familienatmosphäre beschreiben kann.
          Ermutige mich, präzise deutsche Adjektive wie unterstützend, traditionell,
          unabhängig, ehrgeizig, stur, aufgeschlossen, zuverlässig oder warmherzig zu
          verwenden. Bitte mich außerdem, zwei Generationen meiner Familie miteinander zu
          vergleichen. Hilf mir dabei, meine Aussagen mit Konnektoren wie aber, obwohl,
          während, weil, deshalb, trotzdem, allerdings und wohingegen logisch zu verbinden.
          Achte besonders auf meine deutsche Wortstellung nach Konnektoren und korrigiere
          meine Adjektivendungen, wenn ich Adjektive vor Nomen verwende. Stelle Folgefragen
          und hilf mir, ausführliche und natürliche Antworten zu formulieren.
      - id: mori-familientausch
        type: aiTutorPrompt
        title: 'Aufgabe 2: Familientausch'
        intro: 'Du bekommst die Möglichkeit, Teil einer berühmten Familie zu werden, zum Beispiel der britischen Königsfamilie, der Kardashians, der Familie Banai, einer berühmten fiktiven Familie oder einer anderen bekannten Familie. Vergleiche deine neue Familie mit deiner echten Familie.'
        message: >-
          Hallo Mori! Stell dir vor, ich werde Mitglied einer berühmten Familie. Stelle mir
          Fragen darüber, wie mein Leben in dieser Familie aussehen würde. Fordere mich dazu
          auf, die Familienmitglieder mit präzisen Adjektiven zu beschreiben und meine Ideen
          mit Konnektoren wie weil, obwohl, allerdings, während, trotzdem und deshalb zu
          verbinden. Bitte mich, Gemeinsamkeiten und Unterschiede zwischen dieser berühmten
          Familie und meiner echten Familie zu erklären. Korrigiere besonders die
          Wortstellung nach den Konnektoren und meine Adjektivendungen.
      - id: familientausch-tips
        type: callout
        tone: info
        title: Vergiss nicht
        text: |-
          Beschreibe die Familie mit präzisen Adjektiven.
          Begründe deine Aussagen.
          Verwende verschiedene Konnektoren.
          Vergleiche beide Familien.
      - id: mori-geschwister
        type: aiTutorPrompt
        title: 'Aufgabe 3: Beziehungen zwischen Geschwistern'
        intro: 'Hör den Podcast über Geschwisterbeziehungen (aus dem Unterricht) noch einmal. Notiere eine positive Beschreibung der Beziehung, ein erwähntes Stereotyp und einen interessanten Ausdruck. Schick Mori danach diese Nachricht.'
        message: >-
          Hallo Mori! Heute habe ich einen Podcast über Geschwisterbeziehungen und
          Stereotype über ältere, mittlere und jüngere Geschwister gehört. Stelle mir Fragen
          über meine eigene Beziehung zu meinen Geschwistern. Hilf mir, sie mit präzisen
          Adjektiven wie unterstützend, konkurrenzorientiert, unabhängig, beschützend,
          zuverlässig oder stur zu beschreiben. Frage mich auch, ob meine Position in der
          Familie typischen Stereotypen entspricht. Fordere mich dazu auf, meine Antworten
          mit obwohl, allerdings, weil, während, deshalb und anderen passenden Konnektoren
          zu verbinden. Korrigiere meine Wortstellung und meine Adjektivendungen.
      - id: geschwister-tips
        type: callout
        tone: info
        title: Vergiss nicht
        text: |-
          Erzähle von persönlichen Erfahrungen.
          Begründe deine Meinung.
          Verwende unterschiedliche Konnektoren.
          Beschreibe deine Geschwister möglichst präzise.
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Adjektiv **vor dem Nomen** = mit Endung (*eine geduldige Schwester*); nach *sein* = ohne Endung (*Sie ist geduldig.*).
          Nach *weil, obwohl, während* steht das Verb **am Ende**; nach *deshalb, trotzdem* steht das Verb **direkt danach**.
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**
    teacherNotes:
      - id: n-homework
        anchor: mori-geschwister
        text: >-
          Aufgabe 3 setzt den Podcast aus Aktivität 4 voraus („BBC Learning English: The
          Bond Between Sisters“). Das Heft gibt keinen Link; schick den Schülern den Podcast
          aus deinem eigenen Material oder lass sie über ein Gespräch aus dem Unterricht
          schreiben.

