vocabulary:
  - slug: identitaet-und-gemeinschaft
    title: Identität und Gemeinschaft
    items: *identitaet-und-gemeinschaft-words

activities:
  - slug: identitaet-und-gemeinschaft-vergleiche
    title: 'Vergleiche: Komparativ und Superlativ'
    minutes: 8
    items:
      - id: persoenlicher
        type: multipleChoice
        prompt: Eine kleine Gemeinschaft ist oft ___ als eine große Gemeinschaft.
        options:
          - { text: persönlicher, correct: true }
          - {
              text: mehr persönlich,
              feedback: 'Im Deutschen sagen wir nicht *mehr* + Adjektiv. Wir hängen *-er* an: *persönlicher*.',
            }
          - {
              text: persönlich,
              feedback: 'Vor *als* steht der Komparativ: Adjektiv + *-er* (*persönlicher als*).',
            }
      - id: flexibler
        type: fillBlank
        prompt: Schreib den Komparativ von *flexibel*.
        text: Digitale Nomaden sind ___ als traditionelle Gemeinschaften.
        blanks: [[flexibler]]
      - id: genauso-wie
        type: fillBlank
        prompt: Ergänze *als* oder *wie*.
        text: Eine Online-Gemeinschaft kann genauso wichtig sein ___ eine lokale Gemeinschaft.
        blanks: [[wie]]
        wordBank: [als, wie]
      - id: formen
        type: matching
        prompt: Welcher Komparativ passt zu welchem Adjektiv?
        pairs:
          - [gut, besser]
          - [viel, mehr]
          - [gern, lieber]
          - [stark, stärker]
          - [klein, kleiner]
      - id: wichtigste
        type: trueFalse
        prompt: 'Der Satz *Familie ist für viele Menschen die wichtigste Gemeinschaft.* ist richtig.'
        answer: true
        feedback:
          correct: 'Richtig! Vor einem Nomen steht der Superlativ mit Artikel und Endung: *die wichtigste Gemeinschaft*.'
          incorrect: 'Der Satz ist richtig: Vor einem Nomen sagen wir *die wichtigste Gemeinschaft* (Superlativ mit Endung).'
      - id: am-liebsten
        type: multipleChoice
        prompt: In welcher Gemeinschaft würdest du am ___ leben?
        options:
          - { text: liebsten, correct: true }
          - { text: gernsten, feedback: '*gern* ist unregelmäßig: *gern → lieber → am liebsten*.' }
          - {
              text: lieber,
              feedback: '*lieber* ist der Komparativ. Nach *am* steht der Superlativ: *am liebsten*.',
            }
      - id: staerksten
        type: fillBlank
        prompt: Schreib den Superlativ von *stark*.
        text: Welche Gemeinschaft hat deiner Meinung nach den ___ Zusammenhalt?
        blanks: [[stärksten]]
      - id: ordne-modern
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz.
        sentence: Diese Gemeinschaft ist am modernsten.
        alsoAccept: [Am modernsten ist diese Gemeinschaft]

  - slug: identitaet-und-gemeinschaft-konjunktiv
    title: Konjunktiv II
    minutes: 8
    items:
      - id: waere
        type: multipleChoice
        prompt: Wenn ich Leiter einer Gemeinschaft ___, würde ich alle Mitglieder nach ihrer Meinung fragen.
        options:
          - { text: wäre, correct: true }
          - {
              text: bin,
              feedback: 'Die Situation ist hypothetisch (nicht real). Wir brauchen den Konjunktiv II: *sein → wäre*.',
