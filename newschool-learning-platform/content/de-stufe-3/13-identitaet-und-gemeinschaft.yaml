# Cycle "Identität und Gemeinschaft", converted from the German level 3 digital notebook
# ("German Level 3- Digital Notebook", docs/CONTENT-AUDIT.md). DRAFT for teacher review:
# see `review` below. Blocks without `lang` are in the course language (German).
course: de-stufe-3
slug: identitaet-und-gemeinschaft
title: Identität und Gemeinschaft
goal: Über Identität und Gemeinschaften sprechen, mit Vergleichen (Komparativ und Superlativ) und dem Konjunktiv II.
position: 13
status: published

review:
  - >-
    The two workbook exercises ("Vergleiche: Komparativ und Superlativ" and "Konjunktiv
    II") are NEW: they were written from the cycle's summary rules, the activity
    examples, the homework exercises and the vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    The notebook lists three language goals: (1) Konjunktiv II for hypothetical
    situations, (2) comparisons with Komparativ and Superlativ, (3) telling personal
    experiences with Perfekt, Präteritum and Plusquamperfekt. The cycle overview keeps
    (1) and (2) as the cycle's two skills; (3) is practised in Activity 3 and homework
    Aufgabe 3 and keeps its own block in the summary.
  - >-
    Grammar fixes in Activity 1, Step 3: "Ich wäre wahrscheinlich kein Schatzmeister,
    weil ich kreativer als organisiert bin" and "Ich bin geduldiger als dominant" are
    wrong in German: when one person is compared on two different qualities, German uses
    "eher … als" (or "mehr … als") with the base form. Now "…weil ich eher kreativ als
    organisiert bin" and "Ich bin eher geduldig als dominant". A short rule on this was
    added to the summary.
  - >-
    Other corrections: Activity 5 "Würde die Identität stärker oder schwächer?" → "Würde
    die Identität stärker oder schwächer werden?" (werden is missing); "Gruppen Debatte"
    → "Gruppendebatte"; heading "Datum / Teilnehmende" with broken bold marks removed;
    stray "**" marks removed throughout.
  - >-
    Summary corrections: "am + Adjektiv + -sten" → "am + Adjektiv + -(e)sten", with the
    umlaut note (am stärksten, am ältesten). The Konjunktiv II structure "Wenn +
    Konjunktiv II, würde + Infinitiv" was rewritten: in the wenn-clause the verb goes to
    the end, and the main clause starts with the verb (wäre / hätte / könnte / müsste or
    würde + infinitive); both clauses may use wäre/hätte/Modalverb or würde + infinitive.
    The Hebrew text was changed the same way. ADDED (please confirm): "werden → würde"
    in the list of forms and a rule for the Konjunktiv II der Vergangenheit (wäre / hätte
    + Partizip II), which Activity 3, Step 3 uses (Wenn ich nicht ins Ausland gezogen
    wäre…) but the summary did not explain.
  - >-
    Summary, Plusquamperfekt: "Als ich angekommen bin, hatte der Kurs schon angefangen"
    mixes Perfekt and Plusquamperfekt; this is common in spoken German and is kept, but a
    note was added that in written texts the als-clause is usually in Präteritum (Als
    ich ankam, …). Please confirm.
  - >-
    Homework Aufgabe 2: the hints in brackets were mixed (some gave the answer "würde /
    würde", some had "würden" as an infinitive). They are now all infinitives: 1.
    (werden / werden), 3. (sein / werden), 4. (haben / werden), 6. (müssen / werden).
    The answer key (checked, all correct) is in a teacher note only. Aufgabe 3, item 1
    has one blank, so only the Präteritum "verbrachte" fits (as in the key). Aufgabe 3, item 5 "kennengelernt hatte" is correct;
    "gekannt hatte" would also be natural.
  - >-
    Left out: the "Datum / Teilnehmende" lines and all "Antwort Teilnehmer/in 1/2/3"
    lines (the platform has answer boxes). No times are given in the source except
    "vier bis sechs Minuten" for the pair talk in Activity 2 (recorded as 6). The
    Hebrew Mori instructions are kept in Hebrew.
  - >-
    The short descriptions of the communities in Activity 4 (Amish, Massai, Auroville,
    digital nomads, Kibbuz) are the notebook's own short texts and are kept as a table.
  - >-
    Vocabulary: "die Inklusion – הכללה / שילוב" → "הכלה / שילוב" (הכללה means
    generalisation). "der Wert" and "die Werte" are kept as two items as in the source.
    The Quizlet link lost its tracking parameter (?new). Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: identitaet-und-gemeinschaft-unterricht
    title: 'Unterricht: Identität und Gemeinschaft'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Identität und Gemeinschaft
      - id: skills
        type: cycleOverview
        skills:
          - name: 'Vergleiche: Komparativ und Superlativ'
            description: '*persönlicher als, genauso wichtig wie, am flexibelsten, die stärkste Gemeinschaft*'
          - name: Konjunktiv II
            description: 'Hypothetische Situationen: *Wenn ich Leiter wäre, würde ich alle nach ihrer Meinung fragen.*'
      - id: quizlet
        type: externalLink
        label: Identität und Gemeinschaft auf Quizlet
        url: https://quizlet.com/il/1201674999/identitat-und-gemeinschaft-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Vorstellungsrunde
      - id: intro
        type: sentenceFrame
        frame: Mein Name ist ___. Heute bin ich ___ als in meiner Kindheit.
        example: Mein Name ist Dana. Heute bin ich selbstständiger als in meiner Kindheit.
      - id: warmup-title
        type: heading
        level: 3
        text: Einstiegsfragen
      - id: warmup-hint
        type: callout
        tone: info
        text: Antworte möglichst in vollständigen Sätzen und benutze **Vergleiche** und den **Konjunktiv II**. Niemand muss persönliche Informationen erzählen. Du kannst auch ein Beispiel erfinden.
      - id: warmup
        type: discussionQuestions
        items:
          - question: 'Neben deinem Namen und deiner Nationalität: Was ist ein wichtiger Teil deiner Identität? Wie beeinflusst er dein Leben?'
            frame: Ein wichtiger Teil meiner Identität ist ___. Er beeinflusst mein Leben, weil ___.
          - question: Wenn du dich beschreiben müsstest, ohne deinen Beruf oder deine Familie zu erwähnen, was würdest du sagen?
            frame: Ich würde sagen, dass ich ___ bin.
          - question: 'Gab es einen Moment in deinem Leben, in dem du besonders stark gedacht hast: „Das bin wirklich ich“? Was ist passiert?'
            frame: Ja, als ich ___, habe ich gedacht …
          - question: Hat sich deine Identität in den letzten fünf bis zehn Jahren verändert? Was ist heute anders? Denk zum Beispiel an Werte, Prioritäten, Lebensstil, Meinungen und Beziehungen.
            frame: Heute bin ich ___ als vor zehn Jahren. Früher ___, heute ___.
          - question: Verhältst du dich in verschiedenen Gruppen unterschiedlich, zum Beispiel in der Familie, bei der Arbeit und mit Freunden?
            frame: Mit meinen Freunden bin ich ___ als bei der Arbeit.
          - question: Bist du deinen Eltern ähnlicher oder unähnlicher? In welchen Bereichen?
            frame: Ich bin meiner Mutter / meinem Vater ähnlicher, weil ___.
          - question: Kannst du deine Meinung bei der Arbeit genauso frei ausdrücken wie mit engen Freunden? Warum oder warum nicht?
            frame: Bei der Arbeit kann ich meine Meinung (nicht) genauso frei ausdrücken wie ___, weil ___.
          - question: Wenn du morgen in ein anderes Land ziehen würdest, welcher Teil deiner Identität würde gleich bleiben und welcher würde sich wahrscheinlich verändern?
            frame: ___ würde gleich bleiben, aber ___ würde sich wahrscheinlich verändern.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Meine Rolle in einer Gemeinschaft'
        skills: ['Vergleiche: Komparativ und Superlativ', Konjunktiv II]
        steps:
          - '**Schritt 1 – Rollen in einer Gemeinschaft:** Sammelt gemeinsam Rollen, die Menschen in Gruppen haben können: der Leiter / die Leiterin, der Organisator / die Organisatorin, der Vermittler / die Vermittlerin, der Unterstützer / die Unterstützerin, der Kritiker / die Kritikerin, die kreative Person, die Person, die gut zuhört. Sprecht darüber: Warum übernehmen Menschen unterschiedliche Rollen? Welche Rolle ist besonders wichtig? Welche Rolle passt zu dir?'
          - '**Schritt 2 – Eine neue Gemeinschaft erfinden (Breakout-Räume):** Jede Gruppe entwickelt eine eigene Gemeinschaft, zum Beispiel für ein gemeinsames Hobby, von Menschen, die auf den Mars ziehen, eine ökologische Gemeinschaft oder eine Gemeinschaft mit einer erfundenen Religion. Entscheidet gemeinsam die Fragen unten.'
          - '**Schritt 3 – Meine Rolle:** Jede Person erklärt im Konjunktiv II, welche Rolle sie in dieser Gemeinschaft hätte. Danach wählt jede Person eine Rolle, die weniger gut zu ihr passen würde, und benutzt dabei Vergleiche.'
          - '**Schritt 4 – Präsentation:** Jede Gruppe stellt ihre Gemeinschaft vor. Danach vergleicht die Klasse die Gemeinschaften.'
        example: |-
          *Wenn ich Mitglied dieser Gemeinschaft wäre, würde ich wahrscheinlich die Kommunikation organisieren, weil ich gern mit Menschen arbeite.*
          *Ich wäre wahrscheinlich kein Schatzmeister, weil ich eher kreativ als organisiert bin.*
          *Die Rolle eines Vermittlers würde besser zu mir passen als die Rolle eines Leiters.*
          *Ich bin eher geduldig als dominant.*
      - id: act1-plan
        type: discussionQuestions
        title: Unsere Gemeinschaft (Schritt 2)
        items:
          - question: Was ist das Hauptziel?
            frame: Das Hauptziel unserer Gemeinschaft ist ___.
          - question: Wer darf Mitglied werden?
            frame: Mitglied werden darf ___.
          - question: Welche Werte sind wichtig?
            frame: Für uns sind ___ und ___ besonders wichtig.
          - question: Was gibt den Mitgliedern ein Gefühl von Zugehörigkeit?
            frame: Ein Gefühl von Zugehörigkeit gibt ___.
          - question: Welche Rollen gibt es?
            frame: Es gibt ___.
          - question: Welche Regeln gibt es?
            frame: Eine wichtige Regel ist, dass ___.
      - id: act1-role
        type: discussionQuestions
        title: Meine Rolle (Schritt 3)
        items:
          - question: Welche Rolle hättest du in dieser Gemeinschaft?
            frame: Wenn ich Mitglied dieser Gemeinschaft wäre, würde ich ___, weil ___.
          - question: Welche Rolle würde weniger gut zu dir passen? Warum?
            frame: Die Rolle ___ würde besser zu mir passen als die Rolle ___, weil ich eher ___ als ___ bin.
      - id: act1-compare
        type: discussionQuestions
        title: Die Gemeinschaften vergleichen (Schritt 4)
        items:
          - question: Welche Gemeinschaft ist inklusiver?
            frame: ___ ist inklusiver als ___.
          - question: Welche Gemeinschaft wäre langfristig stabiler?
            frame: ___ wäre langfristig stabiler, weil ___.
          - question: Welche würde das stärkste Gefühl von Zugehörigkeit schaffen?
            frame: ___ würde das stärkste Gefühl von Zugehörigkeit schaffen.
          - question: Welche hat die klarsten Rollen?
            frame: ___ hat die klarsten Rollen.
          - question: In welcher Gemeinschaft würdest du am liebsten leben?
            frame: Am liebsten würde ich in ___ leben, weil ___.
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Speed Identity'
        skills: ['Vergleiche: Komparativ und Superlativ', Konjunktiv II]
        minutes: 6
        steps:
          - '**Schritt 1 – Meine Identität:** Schreib fünf Eigenschaften oder Elemente auf, die deine Identität beschreiben, zum Beispiel: kreativ, analytisch, selbstständig, ruhig, sportlich, neugierig, israelisch, familienorientiert, problemlösungsorientiert.'
          - '**Schritt 2 – Partnergespräch (etwa 6 Minuten):** Findet eine Gemeinsamkeit und einen Unterschied, stellt eine Warum-Frage und eine hypothetische Frage und macht mindestens einen Vergleich.'
          - '**Schritt 3 – Präsentation:** Präsentiere zwei Elemente deiner Identität, eine Gemeinsamkeit oder einen Unterschied zu deinem Partner / deiner Partnerin und eine Eigenschaft, die du gern (oder nicht) von ihm / ihr übernehmen würdest.'
        example: |-
          *Ich bin genauso neugierig wie du.*
          *Du bist spontaner als ich.*
          *Wenn du weniger unabhängig wärst, würde sich dein Leben verändern?*
          *Wenn wir unsere Berufe tauschen würden, wer hätte größere Schwierigkeiten?*
      - id: act2-sentences
        type: discussionQuestions
        title: Meine Präsentation
        items:
          - question: Zwei Elemente meiner Identität
            frame: Ich bin ___ und ___.
          - question: Eine Gemeinsamkeit oder ein Unterschied
            frame: Ich bin genauso ___ wie mein Partner. / Mein Partner ist ___er als ich.
          - question: Eine Eigenschaft meines Partners
            frame: Ich würde gern ___ von meinem Partner übernehmen. / Ich würde nicht ___ übernehmen.
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Was wäre heute anders?'
        skills: [Konjunktiv II]
        steps:
          - '**Schritt 1 – Eine wichtige Erfahrung auswählen:** Wähle eine Erfahrung, die dein Leben oder deine Identität beeinflusst hat, zum Beispiel eine berufliche Entscheidung, den Militärdienst, eine Reise, einen Erfolg, einen Misserfolg, eine Beziehung, ein Studium oder einen Kurs, einen Umzug oder ein Risiko.'
          - '**Schritt 2 – Die Geschichte erzählen:** Schreib eine kurze Geschichte mit 2 bis 3 Sätzen im Perfekt oder Präteritum, mindestens 1 Satz im Plusquamperfekt, mindestens 1 Satz über Gefühle und mindestens 1 Satz über die Folgen der Erfahrung. Die Leitfragen unten helfen dir.'
          - '**Schritt 3 – Was wäre heute anders?** Stell dir vor, dass diese Erfahrung nie passiert wäre. Schreib 1 bis 2 Sätze im Konjunktiv II.'
          - '**Schritt 4 – Klassengespräch:** Sprecht über die Fragen unten.'
        example: |-
          *Als ich 22 Jahre alt war, bin ich für längere Zeit ins Ausland gezogen. Vorher hatte ich immer bei meiner Familie gelebt. Am Anfang war ich ziemlich nervös, aber ich habe schnell neue Freunde gefunden. Diese Erfahrung hat mich selbstständiger gemacht.*
          *Wenn ich damals nicht ins Ausland gezogen wäre, wäre ich heute wahrscheinlich weniger selbstständig.*
          *Wenn ich diese Person nicht kennengelernt hätte, würde mein Leben heute anders aussehen.*
          *Ich wäre vielleicht vorsichtiger, wenn ich diese Erfahrung nicht gemacht hätte.*
      - id: act3-story
        type: discussionQuestions
        title: Leitfragen für deine Geschichte
        items:
          - question: Wann ist es passiert?
            frame: Als ich ___ Jahre alt war, ___.
          - question: Wo warst du?
            frame: Ich war in ___.
          - question: Was war vorher passiert?
            frame: Vorher hatte ich ___. / Vorher war ich ___.
          - question: Was ist dann passiert?
            frame: Dann habe ich ___. / Dann bin ich ___.
          - question: Wie hast du dich gefühlt?
            frame: Am Anfang war ich ___, aber ___.
          - question: Was hat sich danach verändert?
            frame: Diese Erfahrung hat mich ___er gemacht.
          - question: Was wäre heute anders, wenn diese Erfahrung nie passiert wäre?
            frame: Wenn ich damals nicht ___ hätte / wäre, wäre ich heute ___.
      - id: act3-discussion
        type: discussionQuestions
        title: Klassengespräch
        items:
          - question: Wie beeinflussen Erfahrungen aus der Kindheit unsere Identität?
          - question: Wird unsere Identität stärker durch große Ereignisse oder durch kleine tägliche Erfahrungen geprägt?
          - question: Kann eine einzige Erfahrung einen Menschen stark verändern?
          - question: Entwickelt sich unsere Identität unser ganzes Leben lang?
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Gemeinschaften auf der ganzen Welt'
        skills: ['Vergleiche: Komparativ und Superlativ']
        steps:
          - '**Schritt 1 – Verschiedene Gemeinschaften kennenlernen:** Lest die kurzen Texte in der Tabelle unten.'
          - '**Schritt 2 – Recherche (Gruppenarbeit):** Jede Gruppe wählt zwei Gemeinschaften und sucht Informationen: Was definiert die Identität dieser Gemeinschaft? Welche Werte sind besonders wichtig? Wie stark ist das Gefühl der Zugehörigkeit? Ist die Gemeinschaft eher individuell oder kollektiv? Welche Probleme oder Herausforderungen gibt es heute?'
          - '**Schritt 3 – Gemeinschaften vergleichen:** Die Gruppen werden neu gemischt. Vergleicht die Gemeinschaften: Werte, Rollen, Identität, Hierarchie, Zugehörigkeit, Tradition, Flexibilität, individuelle Freiheit, kollektive Verantwortung.'
          - '**Schritt 4 – Diskussion:** Sprecht über die Fragen unten.'
        example: |-
          *Die Amish sind traditioneller als digitale Nomaden.*
          *Auroville ist weniger hierarchisch als …*
          *Digitale Nomaden haben mehr individuelle Freiheit als …*
          *Tradition ist für die Massai genauso wichtig wie …*
          *… hat das stärkste Gemeinschaftsgefühl.*
      - id: act4-communities
        type: table
        caption: Gemeinschaften auf der ganzen Welt
        header: [Gemeinschaft, Kurzbeschreibung]
        rows:
          - - Die Amish
            - Die Amish leben vor allem in Nordamerika. Viele von ihnen führen ein traditionelles religiöses Leben und benutzen moderne Technologie nur begrenzt. Die Gemeinschaft und gemeinsame Regeln spielen eine wichtige Rolle.
          - - Die Massai in Kenia und Tansania
            - Bei den Massai sind Tradition, Familie, Land und verschiedene soziale Rollen wichtige Teile der Identität. Gleichzeitig verändert sich ihr Leben durch Modernisierung und gesellschaftlichen Wandel.
          - - Auroville in Indien
            - Auroville wurde als internationale Gemeinschaft gegründet. Menschen aus verschiedenen Ländern leben dort zusammen. Die Idee ist, dass Nationalität und Religion weniger wichtig sein sollen als Zusammenarbeit und Gemeinschaft.
          - - Digitale Nomaden
            - Digitale Nomaden arbeiten online und leben oft für einige Monate in verschiedenen Ländern. Ihre Gemeinschaft basiert weniger auf einem festen Ort und mehr auf einem gemeinsamen Lebensstil, Mobilität und Freiheit.
          - - Der Kibbuz in Israel
            - Der Kibbuz wurde ursprünglich als gemeinschaftliche Lebensform aufgebaut, in der Verantwortung und Besitz stark geteilt wurden. Viele Kibbuzim haben sich später verändert und sind heute individueller und privatisierter als früher.
      - id: act4-compare
        type: discussionQuestions
        title: Vergleichen und diskutieren
        items:
          - question: Welche Gemeinschaft schafft das stärkste Gefühl kollektiver Identität?
            frame: ___ schafft das stärkste Gefühl kollektiver Identität, weil ___.
          - question: Welche Gemeinschaft ist am flexibelsten?
            frame: ___ ist am flexibelsten.
          - question: Was macht eine Gemeinschaft langfristig stabil?
            frame: Eine Gemeinschaft ist langfristig stabiler, wenn ___.
          - question: Welche Probleme haben traditionelle Gemeinschaften in einer modernen Gesellschaft?
            frame: Traditionelle Gemeinschaften haben oft mehr Probleme mit ___ als ___.
      - id: act5
        type: classActivity
        title: 'Aktivität 5: Debatte – Soll sich eine Gemeinschaft verändern?'
        skills: [Konjunktiv II, 'Vergleiche: Komparativ und Superlativ']
        steps:
          - 'Gemeinschaften entstehen durch gemeinsame Werte, Traditionen und soziale Rollen. Diese Dinge beeinflussen die Identität der Mitglieder und ihr Gefühl von Zugehörigkeit. Gesellschaften verändern sich aber ständig: Technologie, Globalisierung und neue Generationen bringen neue Ideen. Dadurch entsteht ein Konflikt zwischen Tradition und Veränderung.'
          - '**Gruppe 1:** Tradition schützt die Identität. Gemeinschaften sollten ihre traditionellen Strukturen bewahren. **Gruppe 2:** Identität entwickelt sich weiter. Gemeinschaften müssen sich verändern, um eine Zukunft zu haben.'
          - '**Schritt 1 – Argumente sammeln:** Denkt über die Situationen unten nach. Jedes Argument muss mindestens einen Vergleich, einen persönlichen Bezug oder einen Satz im Konjunktiv II enthalten.'
          - '**Schritt 2 – Debatte:** Gruppe A gibt ein Argument, Gruppe B reagiert darauf. Dann gibt Gruppe B ein neues Argument, und Gruppe A reagiert darauf.'
          - '**Schritt 3 – Klassengespräch:** Sprecht über die Fragen am Ende.'
        example: |-
          *Wenn jüngere Mitglieder mehr Macht hätten, wäre die Gemeinschaft moderner.*
          *Eine Gemeinschaft mit festen Traditionen ist oft stabiler als eine Gemeinschaft, die sich sehr schnell verändert.*
      - id: act5-situations
        type: discussionQuestions
        title: Situationen (Schritt 1)
        items:
          - question: Wenn eine ältere Generation viele Jahre lang alle wichtigen Entscheidungen treffen würde, was würde passieren? Wäre die Gemeinschaft stabiler? Würde es weniger Innovation geben?
            frame: Die Gemeinschaft wäre ___, aber ___.
          - question: Wenn jüngere Mitglieder mehr Macht hätten, wie würde sich die Gemeinschaft verändern? Würde die Identität stärker oder schwächer werden? Wäre die Gemeinschaft moderner? Würden ältere Mitglieder sich weniger zugehörig fühlen?
            frame: Wenn jüngere Mitglieder mehr Macht hätten, würde ___.
          - question: Was würde passieren, wenn eine Gemeinschaft sich überhaupt nicht an neue soziale oder technologische Entwicklungen anpassen würde?
            frame: Wenn sich eine Gemeinschaft nicht anpassen würde, ___.
          - question: Was würde passieren, wenn sie sich zu schnell verändern würde?
            frame: Wenn sie sich zu schnell verändern würde, ___.
      - id: act5-discussion
        type: discussionQuestions
        title: Klassengespräch (Schritt 3)
        items:
          - question: An welche realen Gemeinschaften habt ihr während der Debatte gedacht?
          - question: Welche Konflikte gibt es häufig zwischen älteren und jüngeren Generationen?
          - question: Wenn du zu den älteren Mitgliedern gehören würdest, wie würdest du reagieren?
            frame: Wenn ich zu den älteren Mitgliedern gehören würde, würde ich ___.
          - question: Wenn du zu den jüngeren Mitgliedern gehören würdest, was würdest du verändern?
            frame: Wenn ich zu den jüngeren Mitgliedern gehören würde, würde ich ___ verändern.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: **Vergleiche mit Komparativ und
          Superlativ** und der **Konjunktiv II** für hypothetische Situationen. Dazu
          kommt das Erzählen persönlicher Erfahrungen mit Perfekt, Präteritum und
          Plusquamperfekt (Aktivität 3, Hausaufgabe 3). Das Heft gibt keine Zeiten an:
          Jede Aktivität kann eine halbe Stunde oder länger dauern. Wähle die
          Aktivitäten nach der verfügbaren Zeit.
      - id: n-intro
        anchor: intro
        text: Gib zuerst dein eigenes Beispiel. Jede Person sagt ihren Namen und einen Vergleich mit ihrer Kindheit (Komparativ + als).
      - id: n-warmup
        anchor: warmup
        text: >-
          Wähle aus den acht Fragen aus. Die Teilnehmenden sollen in vollständigen Sätzen
          antworten und Vergleiche und den Konjunktiv II benutzen. Niemand muss
          persönliche Informationen erzählen; erfundene Beispiele sind in Ordnung.
      - id: n-act1
        anchor: act1
        text: >-
          Sozialform: Breakout-Räume. Sammle in Schritt 1 die Rollen mit der ganzen
          Klasse. Achte in Schritt 3 auf den Unterschied: Zwei Personen vergleichen →
          Komparativ (*Du bist kreativer als ich*). Zwei Eigenschaften derselben Person
          vergleichen → *eher … als* + Grundform (*Ich bin eher kreativ als organisiert*,
          nicht *kreativer als organisiert*).
      - id: n-act2
        anchor: act2
        minutes: 6
        text: >-
          Partnerarbeit. Das Partnergespräch in Schritt 2 dauert etwa 4 bis 6 Minuten.
          Erinnere an *genauso … wie* für Gemeinsamkeiten und Komparativ + *als* für
          Unterschiede.
      - id: n-act3
        anchor: act3
        text: >-
          Einzelarbeit + Klassengespräch. Erkläre kurz den Konjunktiv II der
          Vergangenheit (*wäre / hätte* + Partizip II) für die erfundene Vergangenheit:
          *Wenn ich nicht umgezogen wäre, …* Im Hauptsatz steht oft der Konjunktiv II
          der Gegenwart für die Folge heute: *… wäre ich heute weniger selbstständig.*
      - id: n-act4
        anchor: act4
        text: >-
          Gruppenarbeit und Recherche. Die Teilnehmenden dürfen für Schritt 2 im Internet
          suchen. Achte beim Vergleichen auf die Strukturen *traditioneller als, weniger
          hierarchisch als, mehr individuelle Freiheit als, genauso wichtig wie, das
          stärkste Gemeinschaftsgefühl*.
      - id: n-act5
        anchor: act5
        text: >-
          Teile die Klasse in zwei Gruppen. Die Teilnehmenden vertreten die Position
          ihrer Gruppe, auch wenn sie persönlich anders denken. Achte darauf, dass jedes
          Argument einen Vergleich, einen persönlichen Bezug oder einen Satz im
          Konjunktiv II enthält.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: identitaet-und-gemeinschaft-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: rules-vergleiche
        type: ruleSummary
        skill: 'Vergleiche: Komparativ und Superlativ'
        rules:
          - text: 'Zwei Dinge vergleichen: **Komparativ + als**. Bei den meisten Adjektiven hängen wir **-er** an. Kurze Adjektive mit a, o, u bekommen oft einen Umlaut.'
            examples:
              - klein → kleiner
              - stark → stärker
              - modern → moderner
              - wichtig → wichtiger
              - Eine kleine Gemeinschaft ist oft persönlicher als eine große Gemeinschaft.
              - Digitale Nomaden sind flexibler als traditionelle Gemeinschaften.
          - text: 'Zwei Dinge sind gleich: **(genau)so + Adjektiv + wie**.'
            examples:
              - Eine Online-Gemeinschaft kann genauso wichtig sein wie eine lokale Gemeinschaft.
              - Ich bin genauso neugierig wie du.
          - text: '„Am meisten“: **Superlativ**. Nach Verben: **am + Adjektiv + -(e)sten**. Vor einem Nomen: Artikel + Adjektiv + **-(e)st-** + Endung.'
            examples:
              - Diese Gemeinschaft ist am modernsten.
              - Welche Gemeinschaft ist am flexibelsten?
              - die stärkste Gemeinschaft
              - Familie ist für viele Menschen die wichtigste Gemeinschaft.
          - text: 'Unregelmäßige Formen lernen wir auswendig.'
            examples:
              - gut → besser → am besten
              - viel → mehr → am meisten
              - gern → lieber → am liebsten
          - text: 'Zwei Eigenschaften **derselben Person** vergleichen: **eher + Grundform + als** (nicht Komparativ).'
            examples:
              - Ich bin eher kreativ als organisiert.
              - 'Falsch: *Ich bin kreativer als organisiert.*'
      - id: rules-konjunktiv
        type: ruleSummary
        skill: Konjunktiv II
        rules:
          - text: 'Mit dem **Konjunktiv II** sprechen wir über **hypothetische**, also nicht reale Situationen.'
            examples:
              - Wenn ich in einer kleinen Gemeinschaft leben würde, würde ich meine Nachbarn besser kennen.
          - text: 'Wichtige Formen: **sein → wäre, haben → hätte, können → könnte, müssen → müsste, werden → würde**. Bei den meisten anderen Verben: **würde + Infinitiv**.'
            examples:
              - Wenn ich Leiter einer Gemeinschaft wäre, würde ich alle Mitglieder nach ihrer Meinung fragen.
              - Wenn wir mehr Geld hätten, könnten wir mehr Projekte organisieren.
              - Wenn die Gemeinschaft wachsen würde, müssten wir neue Regeln entwickeln.
          - text: '**Wortstellung:** Im **wenn-Satz** steht das konjugierte Verb **am Ende**. Danach beginnt der Hauptsatz mit dem **Verb** (*würde, wäre, hätte, könnte* …).'
            examples:
              - Wenn ich mehr Zeit **hätte**, **könnte** ich mich stärker engagieren.
              - 'Falsch: *Wenn ich hätte mehr Zeit, ich könnte …*'
          - text: '**Konjunktiv II der Vergangenheit:** *wäre / hätte* + **Partizip II**. So sprechen wir über eine Vergangenheit, die nicht passiert ist.'
            examples:
              - Wenn ich damals nicht ins Ausland gezogen wäre, wäre ich heute wahrscheinlich weniger selbstständig.
              - Wenn ich diese Person nicht kennengelernt hätte, würde mein Leben heute anders aussehen.
      - id: rules-vergangenheit
        type: ruleSummary
        skill: Über Erfahrungen erzählen
        rules:
          - text: 'Im gesprochenen Deutsch erzählen wir meistens im **Perfekt**.'
            examples: [Ich bin nach Berlin gezogen., Ich habe dort neue Freunde kennengelernt.]
          - text: 'Bei **sein, haben** und den **Modalverben** benutzen wir meistens das **Präteritum**.'
            examples:
              [Ich war damals 20 Jahre alt., Ich hatte wenig Geld., Ich musste viel arbeiten.]
          - text: 'Das **Plusquamperfekt** (*hatte / war* + Partizip II) beschreibt etwas, das **vor** einer anderen Handlung in der Vergangenheit passiert ist.'
            examples:
              - Bevor ich nach Deutschland gezogen bin, hatte ich noch nie allein gelebt.
              - Als ich angekommen bin, hatte der Kurs schon angefangen.
              - 'Geschrieben meistens mit Präteritum: *Als ich ankam, hatte der Kurs schon angefangen.*'
          - text: 'Eine gute Geschichte verbindet **Vergangenheit** (was passiert ist), **Gegenwart** (wer ich heute bin) und **Konjunktiv II** (wie mein Leben anders wäre).'
            examples:
              - Vor fünf Jahren bin ich nach Berlin gezogen. Vorher hatte ich immer bei meiner Familie gelebt. Heute bin ich viel selbstständiger. Wenn ich damals nicht umgezogen wäre, wäre mein Leben heute wahrscheinlich ganz anders.
      - id: tenses-table
        type: table
        caption: Zeitformen in einer Geschichte
        header: [Zeitform, Wofür?, Beispiel]
        rows:
          - [
              Perfekt / Präteritum,
              Was ist passiert?,
              Ich bin nach Berlin gezogen. Ich war 20 Jahre alt.,
            ]
          - [
              Plusquamperfekt,
              Was war vorher schon passiert?,
              Vorher hatte ich immer bei meiner Familie gelebt.,
            ]
          - [Präsens + Komparativ, Wer bin ich heute?, Heute bin ich viel selbstständiger.]
          - [
              Konjunktiv II,
              Wie wäre es anders?,
              'Wenn ich nicht umgezogen wäre, wäre mein Leben anders.',
            ]
      - id: summary-he-vergleiche
        type: text
        lang: he
        text: >-
          **השוואות: Komparativ ו־Superlativ.** כדי להשוות בין שני דברים משתמשים בדרך
          כלל ב־Komparativ + als. ברוב שמות התואר מוסיפים ‎-er‏ (klein → kleiner,
          stark → stärker). קהילה קטנה היא לעיתים אישית יותר מקהילה גדולה: Eine kleine
          Gemeinschaft ist oft persönlicher als eine große Gemeinschaft. כששני דברים
          שווים משתמשים ב־(genau)so + Adjektiv + wie. כדי לומר "הכי..." משתמשים
          ב־Superlativ: am + Adjektiv + ‎-(e)sten‏ (Diese Gemeinschaft ist am
          modernsten), או לפני שם עצם: die stärkste Gemeinschaft. צורות חשובות ולא
          רגילות: gut → besser → am besten, viel → mehr → am meisten, gern → lieber →
          am liebsten. כשמשווים שתי תכונות של אותו אדם אומרים eher … als: Ich bin eher
          kreativ als organisiert.
      - id: summary-he-konjunktiv
        type: text
        lang: he
        text: >-
          **Konjunktiv II.** משתמשים ב־Konjunktiv II כדי לדבר על מצב דמיוני או
          היפותטי. צורות חשובות: sein → wäre, haben → hätte, können → könnte, müssen →
          müsste, werden → würde; ברוב הפעלים האחרים: würde + Infinitiv. במשפט עם wenn
          הפועל עובר לסוף, והמשפט הראשי מתחיל בפועל: Wenn ich in einer kleinen
          Gemeinschaft leben würde, würde ich meine Nachbarn besser kennen. – אם הייתי
          חי בקהילה קטנה, הייתי מכיר טוב יותר את השכנים שלי. על עבר שלא קרה: wäre /
          hätte + Partizip II (Wenn ich nicht umgezogen wäre, …).
      - id: summary-he-vergangenheit
        type: text
        lang: he
        text: >-
          **לספר על חוויות מהעבר.** בגרמנית מדוברת משתמשים הרבה ב־Perfekt כדי לספר מה
          קרה (Ich bin nach Berlin gezogen). עם sein, haben ופעלים מודאליים נפוץ מאוד
          להשתמש ב־Präteritum (Ich war damals 20 Jahre alt). Plusquamperfekt (hatte /
          war + Partizip II) מתאר פעולה שקרתה לפני פעולה אחרת בעבר: Bevor ich nach
          Deutschland gezogen bin, hatte ich noch nie allein gelebt. – לפני שעברתי
          לגרמניה, מעולם לא גרתי לבד. הדרך הקלה לזכור: Perfekt / Präteritum = מה קרה;
          Plusquamperfekt = מה כבר קרה קודם. כשמספרים סיפור טוב אפשר לשלב: עבר (מה קרה
          לי), הווה (מי אני היום) ו־Konjunktiv II (איך החיים שלי היו נראים אחרת).
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die Regeln mit der Gruppe und bitte um ein neues Beispiel für jede Regel, zum Beispiel über die Gemeinschaften aus Aktivität 4.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: identitaet-und-gemeinschaft-hausaufgaben
    title: Hausaufgaben
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben mit Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere die Nachricht und schick sie ab. Mori stellt dir Fragen; beantworte alle.
      - id: mori-hint
        type: text
        lang: he
        text: >-
          שלחו ל־Mori את ההודעה ונהלו שיחה של בערך 5 עד 7 שאלות. נסו להשתמש לפחות ב־2
          השוואות, ב־2 משפטים ב־Konjunktiv II ובסיפור קצר אחד מהעבר.
      - id: mori-gespraech
        type: aiTutorPrompt
        title: 'Aufgabe: Gespräch über Identität und Gemeinschaft'
        message: >-
          Ich möchte über Identität und Gemeinschaft sprechen. Stelle mir bitte Fragen
          auf B1-Niveau. Lass mich verschiedene Gemeinschaften vergleichen und frage mich
          auch nach einer Erfahrung, die meine Identität verändert hat. Stelle außerdem
          einige hypothetische Fragen mit „Was würdest du tun, wenn …?“. Hilf mir,
          Komparativ, Superlativ, Vergangenheit und Konjunktiv II zu benutzen. Stelle
          kurze Folgefragen und korrigiere wichtige Fehler.
      - id: mori-ende
        type: aiTutorPrompt
        title: Zum Schluss
        intro: Schick diese Nachricht am Ende des Gesprächs.
        message: Welche drei Fehler habe ich am häufigsten gemacht?
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Mindestens **2 Vergleiche**, **2 Sätze im Konjunktiv II** und **eine kurze Geschichte** aus der Vergangenheit.
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**
      - id: practice-title
        type: heading
        level: 2
        text: Übungen zum Schreiben
      - id: aufgabe1
        type: discussionQuestions
        title: 'Aufgabe 1: Vergleiche'
        items:
          - question: Eine kleine Gemeinschaft ist oft ___ als eine große Gemeinschaft. *(persönlich)*
          - question: Junge Menschen sind manchmal ___ für Veränderungen als ältere Menschen. *(offen)*
          - question: Familie ist für viele Menschen die ___ Gemeinschaft im Leben. *(wichtig)*
          - question: Digitale Gemeinschaften sind oft ___ als traditionelle Gemeinschaften. *(flexibel)*
          - question: Meine Freunde sind genauso ___ wie meine Familie. *(wichtig)*
          - question: Welche Gemeinschaft hat deiner Meinung nach den ___ Zusammenhalt? *(stark)*
      - id: aufgabe2
        type: discussionQuestions
        title: 'Aufgabe 2: Konjunktiv II – Ergänze die richtige Form.'
        items:
          - question: Wenn ich in einer kleinen Gemeinschaft leben ___, ___ ich meine Nachbarn wahrscheinlich besser kennen. *(werden / werden)*
          - question: Wenn ich mehr Zeit ___, ___ ich mich stärker in meiner Gemeinschaft engagieren. *(haben / können)*
          - question: Wenn ich Leiter einer Gemeinschaft ___, ___ ich alle Mitglieder nach ihrer Meinung fragen. *(sein / werden)*
          - question: Wenn junge Mitglieder mehr Verantwortung ___, ___ sich die Gemeinschaft wahrscheinlich verändern. *(haben / werden)*
          - question: Wenn unsere Gemeinschaft größer ___, ___ wir neue Regeln entwickeln. *(werden / müssen)*
          - question: Wenn ich zwischen Freiheit und Sicherheit wählen ___, ___ ich wahrscheinlich Freiheit wählen. *(müssen / werden)*
      - id: aufgabe3
        type: discussionQuestions
        title: 'Aufgabe 3: Vergangenheit und Plusquamperfekt – Setze die Verben in die passende Vergangenheitsform.'
        items:
          - question: Als ich jünger war, ___ ich viel Zeit mit meiner Familie. *(verbringen)*
          - question: Vor fünf Jahren ___ ich in eine neue Stadt ___. *(ziehen)*
          - question: Bevor ich umgezogen bin, ___ ich noch nie allein ___. *(leben)*
          - question: Dort ___ ich viele neue Menschen ___. *(kennenlernen)*
          - question: Ich war am Anfang nervös, weil ich vorher niemanden dort ___ ___. *(kennenlernen)*
          - question: Diese Erfahrung ___ meine Persönlichkeit stark ___. *(verändern)*
      - id: aufgabe4-title
        type: heading
        level: 3
        text: 'Aufgabe 4: Meine Identität'
      - id: aufgabe4-rules
        type: callout
        tone: info
        title: Dein Text
        text: |-
          Schreib **6 bis 8 Sätze** über eine Erfahrung, die deine Identität beeinflusst hat. Beantworte dabei: Was ist passiert? Was war vorher passiert? Wie hast du dich gefühlt? Was hat sich danach verändert? Wie bist du heute anders als vorher? Was wäre heute anders, wenn diese Erfahrung nicht passiert wäre?
          Benutze mindestens **einen Vergleich**, **einen Satz im Plusquamperfekt** und **einen Satz im Konjunktiv II**.
          Du kannst so anfangen: *Vor einigen Jahren habe ich … Vorher hatte ich … Danach wurde ich … Heute bin ich … als früher. Wenn das nicht passiert wäre, würde ich heute …*
      - id: aufgabe4
        type: reflection
        prompt: Eine Erfahrung, die meine Identität beeinflusst hat
    teacherNotes:
      - id: n-key1
        anchor: aufgabe1
        text: >-
          Lösungen Aufgabe 1: 1. persönlicher (als) 2. offener (für Veränderungen als)
          3. wichtigste 4. flexibler (als) 5. wichtig (genauso wichtig wie) 6. stärksten.
      - id: n-key2
        anchor: aufgabe2
        text: >-
          Lösungen Aufgabe 2: 1. würde, würde 2. hätte, könnte 3. wäre, würde 4.
          hätten, würde 5. würde, müssten 6. müsste, würde.
      - id: n-key3
        anchor: aufgabe3
        text: >-
          Lösungen Aufgabe 3: 1. verbrachte 2. bin … gezogen 3. hatte … gelebt 4. habe
          … kennengelernt 5. kennengelernt hatte (auch möglich: gekannt hatte) 6. hat …
          verändert.
      - id: n-key4
        anchor: aufgabe4
        text: >-
          Aufgabe 4: individuelle Antworten. Beispiel: *Vor fünf Jahren bin ich in eine
          neue Stadt gezogen. Vorher hatte ich immer in derselben Stadt gelebt. Am
          Anfang war ich ziemlich nervös. Nach einigen Monaten habe ich viele neue
          Menschen kennengelernt. Diese Erfahrung hat mich selbstständiger gemacht. Heute
          bin ich offener als früher. Wenn ich damals nicht umgezogen wäre, wäre mein
          Leben heute wahrscheinlich ganz anders.*

