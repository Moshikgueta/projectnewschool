vocabulary:
  - slug: reisen
    title: Reisen
    items: *reisen-words

activities:
  - slug: reisen-perfekt
    title: Perfekt
    minutes: 8
    items:
      - id: bin-gereist
        type: multipleChoice
        prompt: Ich ___ nach Spanien gereist.
        options:
          - { text: bin, correct: true }
          - {
              text: habe,
              feedback: '*reisen* ist ein Verb der Bewegung: Das Perfekt bilden wir mit *sein*: *Ich bin gereist.*',
            }
          - { text: ist, feedback: '*ist* ist für *er / sie / es*. Für *ich* sagen wir *bin*.' }
      - id: hotel-gebucht
        type: fillBlank
        prompt: Ergänze das Perfekt von *buchen*.
        text: Wir ___ ein Hotel ___.
        blanks: [[haben], [gebucht]]
      - id: pass-verloren
        type: fillBlank
        prompt: Ergänze das Perfekt von *verlieren*.
        text: Sie ___ ihren Reisepass ___.
        blanks: [[hat], [verloren]]
      - id: allein-gereist
        type: multipleChoice
        prompt: Welche Frage ist richtig?
        options:
          - { text: Bist du schon einmal allein gereist?, correct: true }
          - {
              text: Hast du schon einmal allein gereist?,
              feedback: '*reisen* bildet das Perfekt mit *sein*: *Bist du … gereist?*',
            }
          - {
              text: Bist du schon einmal allein gereisen?,
              feedback: 'Das Partizip II von *reisen* ist *gereist*.',
            }
      - id: verpasst
        type: trueFalse
        prompt: 'Der Satz *Ich habe meinen Flug verpasst.* ist richtig.'
        answer: true
        feedback:
          correct: 'Richtig! Verben mit *ver-* bekommen kein *ge-*: *verpassen → verpasst*.'
          incorrect: 'Der Satz ist richtig: *verpassen* bildet das Perfekt mit *haben*, und Verben mit *ver-* bekommen kein *ge-*: *verpasst*.'
      - id: formen
        type: matching
        prompt: Welche Perfektform passt zu welchem Verb?
        pairs:
          - [verlieren, hat verloren]
          - [ankommen, ist angekommen]
          - [treffen, hat getroffen]
          - [sich verlaufen, hat sich verlaufen]
          - [fahren, ist gefahren]
      - id: ordne-verneinung
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz.
        sentence: Ich habe meinen Pass nicht gefunden.
      - id: frage-japan
        type: fillBlank
        prompt: Ergänze *haben* oder *sein*.
        text: ___ du schon Japan besucht?
        blanks: [[Hast]]

  - slug: reisen-erzaehlen
    title: Erzählen mit Zeitwörtern
    minutes: 8
    items:
      - id: zuerst-habe-ich
        type: multipleChoice
        prompt: Zuerst ___ meinen Koffer gesucht.
        options:
          - { text: habe ich, correct: true }
          - {
              text: ich habe,
              feedback: 'Steht ein Zeitwort auf Position 1, kommt danach das Verb: *Zuerst habe ich …*',
            }
      - id: dann-ich-habe
        type: trueFalse
        prompt: 'Der Satz *Dann ich habe gemerkt, dass er weg war.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! Nach *dann* kommt das Verb: *Dann habe ich gemerkt, dass er weg war.*'
          incorrect: 'Nach einem Zeitwort auf Position 1 kommt das Verb: *Dann habe ich gemerkt …*'
      - id: ordne-ende
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz.
        sentence: Am Ende habe ich ein neues Ticket gekauft.
      - id: bedeutung
        type: matching
        prompt: Was bedeutet das Zeitwort auf Hebräisch?
        pairs:
          - [zuerst, קודם]
          - [plötzlich, פתאום]
          - [leider, לצערי]
          - [am Ende, בסוף]
          - [zum Glück, למרבה המזל]
      - id: zug-verpasst
        type: fillBlank
        prompt: Ergänze das Perfekt von *verpassen*.
        text: Leider ___ ich meinen Zug ___.
        blanks: [[habe], [verpasst]]
      - id: zum-glueck
        type: multipleChoice
        prompt: 'Ich hatte kein Geld mehr. ___ hat mir ein Freund geholfen. (Das war gut für mich.)'
        options:
          - { text: Zum Glück, correct: true }
          - {
              text: Leider,
              feedback: '*leider* benutzen wir für etwas Schlechtes. Hier ist es gut: *Zum Glück*.',
            }
      - id: dass
        type: fillBlank
        prompt: Ergänze das passende Wort.
        text: Dann habe ich gemerkt, ___ mein Handy weg war.
        blanks: [[dass]]
      - id: ploetzlich
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Plötzlich habe ich meinen Pass verloren., correct: true }
          - {
              text: Plötzlich ich habe meinen Pass verloren.,
              feedback: 'Nach *plötzlich* auf Position 1 kommt das Verb: *Plötzlich habe ich …*',
            }
          - {
              text: Plötzlich habe ich meinen Pass verlieren.,
              feedback: 'Im Perfekt brauchen wir das Partizip II: *verloren*.',
            }
