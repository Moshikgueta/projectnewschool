      - id: ex1-title
        type: heading
        level: 4
        lang: he
        text: תרגיל 1 – השלימו את המשפטים ב־Perfekt
      - id: ex1-hint
        type: text
        lang: he
        text: השתמשו בצורה הנכונה של הפועל.
      - id: ex1
        type: discussionQuestions
        items:
          - question: Ich ___ (sehen) viele Videos auf TikTok.
          - question: Wir ___ (lesen) interessante Nachrichten online.
          - question: Sie ___ (teilen) einen Beitrag auf Instagram.
          - question: Ich ___ (kennenlernen) viele Menschen über soziale Medien.
          - question: Du ___ (verbringen) viel Zeit im Internet.
          - question: Wir ___ (entdecken) einen neuen Podcast.
          - question: Er ___ (löschen) seinen Account.
          - question: Ich ___ (hören) von diesem Influencer.
      - id: ex2-title
        type: heading
        level: 4
        lang: he
        text: תרגיל 2 – הפכו את המשפטים ל־Passiv
      - id: ex2-hint
        type: text
        lang: he
        text: 'דוגמה: Die Plattform hat das Video geteilt. → Das Video wurde geteilt.'
      - id: ex2
        type: discussionQuestions
        items:
          - question: Die Firma hat neue Funktionen eingeführt.
          - question: Die Nutzer haben den Beitrag geteilt.
          - question: Die Plattform sammelt persönliche Daten.
          - question: Millionen Menschen sehen dieses Video.
          - question: Die Moderatoren haben den Kommentar entfernt.
      - id: ex3-title
        type: heading
        level: 4
        lang: he
        text: תרגיל 3 – השלימו עם Perfekt או Passiv
      - id: ex3
        type: discussionQuestions
        items:
          - question: Viele Informationen ___ veröffentlicht worden.
          - question: Ich ___ diesen Beitrag schon gesehen.
          - question: Eine neue Funktion ___ eingeführt worden.
          - question: Wir ___ viele Nachrichten gelesen.
          - question: Persönliche Daten ___ gesammelt worden.
      - id: ex4-title
        type: heading
        level: 4
        lang: he
        text: תרגיל 4 – שאלות אישיות
      - id: ex4-hint
        type: text
        lang: he
        text: ענו ב־3–4 משפטים מלאים על כל שאלה.
      - id: ex4
        type: discussionQuestions
        items:
          - question: Wie haben soziale Medien dein Leben verändert?
          - question: Was hast du in letzter Zeit oft online gesehen?
          - question: Welche Plattform hast du zuletzt benutzt?
          - question: Welche Inhalte werden deiner Meinung nach zu oft gefördert?
          - question: Hast du schon einmal Fake News gesehen? Was ist passiert?
      - id: ex5-title
        type: heading
        level: 4
        lang: he
        text: תרגיל 5 – כתיבה
      - id: ex5-hint
        type: text
        lang: he
        text: |-
          כתבו 120–150 מילים בנושא: **„Soziale Medien: Fluch oder Segen?“**
          התייחסו ל: היתרונות של רשתות חברתיות; החסרונות שלהן; כיצד הן השפיעו על החיים שלכם; אילו שינויים ראיתם בשנים האחרונות.
          השתמשו לפחות ב־5 משפטים ב־Perfekt וב־3 משפטים ב־Passiv.
      - id: ex5
        type: reflection
        prompt: 'Soziale Medien: Fluch oder Segen?'
      - id: mori-title
        type: heading
        level: 3
        lang: he
        text: שיעורי בית עם מורי
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere eine Nachricht und schick sie ab. Mori stellt dir Fragen; antworte auf Deutsch.
      - id: mori-erfahrungen
        type: aiTutorPrompt
        lang: he
        title: פעילות 1 – החוויות שלי ברשתות חברתיות
        message: >-
          היי מורי! אני לומד גרמנית ברמת B1. בבקשה שאל אותי שאלות על החוויות שלי ברשתות
          חברתיות. תגרום לי להשתמש בזמן Perfekt כדי לדבר על דברים שראיתי, קראתי, שיתפתי
          או גיליתי. תקן את כל הטעויות שלי מיד, הסבר אותן בקצרה, ושאל שאלות המשך כדי
          שאענה במשפטים מלאים בגרמנית.
      - id: mori-nachrichten
        type: aiTutorPrompt
        lang: he
        title: פעילות 2 – חדשות ומידע ברשת
        message: >-
          היי מורי! בבקשה שאל אותי שאלות על חדשות, מידע ומשפיענים ברשתות חברתיות. תעודד
          אותי להשתמש גם ב־Perfekt וגם ב־Passiv. שאל אותי מה פורסם, מה שותף, מה הוסר ומה
          השפיע על אנשים. תקן את כל הטעויות שלי ועזור לי להרחיב את התשובות שלי.
      - id: mori-experte
        type: aiTutorPrompt
        lang: he
        title: פעילות 3 – מומחה לרשתות חברתיות
        message: >-
          היי מורי! תעמיד פנים שאני מומחה לרשתות חברתיות. שאל אותי על טרנדים חדשים,
          אלגוריתמים, פרטיות, בינה מלאכותית והשפעת הרשתות החברתיות. תגרום לי להשתמש
          במשפטי Passiv כמו "wurde veröffentlicht", "ist geteilt worden", "werden
          gesammelt" ובמשפטי Perfekt. תקן כל טעות ותשאל שאלות מאתגרות ברמת B1.
      - id: mori-interview
        type: aiTutorPrompt
        lang: he
        title: פעילות 4 – ראיון עם משפיען
        intro: בחרו משפיען, יוטיובר, עיתונאי או יוצר תוכן, וכתבו את שמו במקום ___ בהודעה.
        message: >-
          היי מורי! אני רוצה לראיין משפיען. המשפיען שבחרתי הוא: ___. בבקשה תענה כאילו אתה
          אותו אדם. תעודד אותי לשאול שאלות ב־Perfekt וב־Passiv. תקן את השאלות שלי, הסבר את
          הטעויות שלי, ושאל אותי שאלות המשך כדי לפתח שיחה טבעית בגרמנית.
      - id: mori-debatte
        type: aiTutorPrompt
        lang: he
        title: פעילות 5 – דיון על חדשות
        message: >-
          היי מורי! בוא נעשה דיון על השאלה: "האם אפשר לסמוך על חדשות ברשתות חברתיות?".
          תציג דעות בעד ונגד. תעודד אותי להביע את דעתי באמצעות משפטים ב־Perfekt וב־Passiv,
          להשתמש בביטויים כמו "Meiner Meinung nach", "Ich denke, dass" ו־"Andererseits".
          תקן את כל הטעויות שלי ועזור לי לדבר בצורה טבעית ומשכנעת יותר בגרמנית.
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          **Perfekt:** *haben / sein* … Partizip II am Ende. **Perfekt Passiv:** *ist / sind* … Partizip II + *worden*.
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**
    teacherNotes:
      - id: n-key1
        anchor: ex1
        text: >-
          Lösungen Übung 1: 1. habe … gesehen 2. haben … gelesen 3. hat … geteilt 4. habe
          … kennengelernt 5. hast … verbracht 6. haben … entdeckt 7. hat … gelöscht 8. habe
          … gehört.
      - id: n-key2
        anchor: ex2
        text: >-
          Lösungen Übung 2: 1. Neue Funktionen wurden eingeführt. (auch: … sind
          eingeführt worden.) 2. Der Beitrag wurde geteilt. (auch: … ist geteilt worden.)
          3. Persönliche Daten werden gesammelt. 4. Dieses Video wird von Millionen
          Menschen gesehen. 5. Der Kommentar wurde entfernt. (auch: … ist entfernt
          worden.)
      - id: n-key3
        anchor: ex3
        text: 'Lösungen Übung 3: 1. sind 2. habe 3. ist 4. haben 5. sind.'
      - id: n-key4
        anchor: ex4
        text: |-
          Beispielantworten Übung 4:
          1. Soziale Medien haben mein Leben stark verändert. Ich habe viele Informationen schneller bekommen und neue Menschen kennengelernt. Gleichzeitig habe ich manchmal zu viel Zeit online verbracht.
          2. In letzter Zeit habe ich viele Videos über Reisen und Sprachen gesehen. Ich habe auch viele Nachrichten über Politik und Technologie gelesen. Manche Inhalte waren interessant, aber andere waren nicht sehr wichtig.
          3. Zuletzt habe ich Instagram benutzt. Ich habe dort Fotos gesehen und ein paar Nachrichten gelesen. Außerdem habe ich einige Beiträge von Freunden gelikt.
          4. Meiner Meinung nach werden oberflächliche Inhalte zu oft gefördert. Viele Videos über Konsum, Streit oder unrealistische Lebensstile werden sehr oft gezeigt. Bessere Bildungsinhalte sollten mehr unterstützt werden.
          5. Ja, ich habe schon einmal Fake News gesehen. Ein Beitrag wurde sehr oft geteilt, aber später wurde gezeigt, dass die Information falsch war. Seitdem prüfe ich Nachrichten vorsichtiger.
      - id: n-key5
        anchor: ex5
        text: |-
          Beispieltext Übung 5:
          Soziale Medien sind meiner Meinung nach sowohl Fluch als auch Segen. Sie haben unser Leben stark verändert. Ich habe durch soziale Medien viele neue Informationen bekommen, interessante Videos gesehen und neue Menschen kennengelernt. Außerdem habe ich viele Nachrichten schneller gelesen als früher. Ein großer Vorteil ist, dass wichtige Informationen schnell geteilt werden. Auch Bildungsinhalte werden heute oft online veröffentlicht.
          Aber es gibt auch Nachteile. Viele persönliche Daten werden gesammelt, und falsche Informationen werden manchmal verbreitet. Ich habe schon oft gesehen, dass Menschen zu viel Zeit im Internet verbracht haben. In den letzten Jahren sind viele neue Funktionen eingeführt worden, und kurze Videos sind besonders populär geworden. Meiner Meinung nach sollten soziale Medien bewusster genutzt werden. Sie können sehr nützlich sein, aber man muss kritisch bleiben.

