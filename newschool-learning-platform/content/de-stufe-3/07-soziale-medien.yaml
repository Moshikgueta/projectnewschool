sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: soziale-medien-unterricht
    title: 'Unterricht: Soziale Medien'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Soziale Medien
      - id: skills
        type: cycleOverview
        skills:
          - name: Das Perfekt
            description: 'Erfahrungen und Veränderungen: *Soziale Medien haben unsere Kommunikation verändert.*'
          - name: Das Passiv
            description: 'Die Handlung ist wichtiger als die Person: *Eine neue Funktion ist eingeführt worden. Viele Beiträge werden geteilt.*'
      - id: quizlet
        type: externalLink
        label: Soziale Medien auf Quizlet
        url: https://quizlet.com/br/1186157056/soziale-medien-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Vorstellungsrunde
      - id: intro
        type: sentenceFrame
        frame: Ich heiße ___ und ich denke, dass soziale Medien unser Leben verbessert / verschlechtert / verändert haben.
        example: Ich heiße Marta und ich denke, dass soziale Medien unser Leben sowohl positiv als auch negativ verändert haben.
      - id: warmup-title
        type: heading
        level: 3
        text: Aufwärmfragen
      - id: warmup-hint
        type: callout
        tone: info
        text: Antworte immer in **vollständigen Sätzen**.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Hast du deinen Alltag wegen sozialer Medien verändert?
            frame: Ja, ich habe meinen Alltag verändert, weil ___. / Nein, ich habe meinen Alltag nicht verändert, weil ___.
          - question: Hast du durch soziale Medien wichtige Menschen kennengelernt? Erzähl der Klasse davon.
            frame: Ja, ich habe durch soziale Medien ___ kennengelernt. / Nein, ich habe noch nie ___.
          - question: Welche Beiträge hast du in letzter Zeit geteilt?
            frame: In letzter Zeit habe ich ___ geteilt.
          - question: Wie wird Inklusion in sozialen Medien gefördert?
            frame: Inklusion wird durch ___ gefördert.
          - question: Wie werden Fake News verbreitet und wie können sie gestoppt werden?
            frame: Fake News werden durch ___ verbreitet. Sie können gestoppt werden, wenn ___.
          - question: Wie werden persönliche Daten von sozialen Medien gesammelt und wie findest du das?
            frame: Persönliche Daten werden durch ___ gesammelt. Ich finde das ___, weil ___.
          - question: Welche Inhalte werden deiner Meinung nach am häufigsten gefördert?
            frame: Meiner Meinung nach werden ___ am häufigsten gefördert.
          - question: Wird genug getan, um Jugendliche in sozialen Medien zu schützen? Warum?
            frame: Ich denke, dass (nicht) genug getan wird, weil ___.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Trends des Jahrhunderts'
        skills: [Das Passiv]
        steps:
          - 'Soziale Medien verändern sich ständig. Plattformen versuchen immer, neue Funktionen und Trends einzuführen. **Schritt 1:** Jede Gruppe bekommt eine Plattform: Instagram, TikTok, YouTube oder X / Twitter. Die Gruppe arbeitet als Forschungs- oder Medienteam.'
          - '**Schritt 2:** Denkt an fünf aktuelle Trends oder Veränderungen. Ihr könnt echte oder erfundene, aber realistische Beispiele verwenden. Konzentriert euch auf: neue Funktionen, beliebte Inhalte, Richtlinien, virale Trends, künstliche Intelligenz, Algorithmen.'
          - '**Schritt 3:** Schreibt fünf formelle Sätze im Passiv, mindestens 3 Sätze im **Perfekt Passiv** und 1 Satz im **Präteritum Passiv**.'
          - '**Schritt 4:** Präsentiert euren Bericht. Regeln: nicht ablesen, langsam und deutlich sprechen, das Passiv natürlich verwenden.'
          - '**Schritt 5:** Während die anderen präsentieren: Schreibt einen Passivsatz auf und entscheidet, ob er im Perfekt Passiv oder im Präteritum Passiv steht.'
          - '**Schritt 6, Klassendiskussion:** Welche Plattform hat sich am meisten verändert? Warum ist das Passiv in Nachrichten und Berichten nützlich? Wie würde dieselbe Information im Aktiv klingen?'
        example: |-
          *Eine neue Funktion ist eingeführt worden.*
          *Künstliche Intelligenz ist verwendet worden, um Inhalte zu personalisieren.*
          *Im Jahr 2025 wurde eine neue Sicherheitsrichtlinie eingeführt.*
          *Ein Bericht ist veröffentlicht worden.*
          *Präsentation: Heute präsentieren wir aktuelle Entwicklungen auf Instagram. In den letzten Monaten sind mehrere neue Funktionen eingeführt worden.*
      - id: act1-sentences
        type: discussionQuestions
        title: Unser Bericht im Passiv
        items:
          - question: 'Satz 1 (Perfekt Passiv)'
            frame: ___ ist / sind ___ worden.
          - question: 'Satz 2 (Perfekt Passiv)'
            frame: ___ ist / sind ___ worden.
          - question: 'Satz 3 (Perfekt Passiv)'
            frame: ___ ist / sind ___ worden.
          - question: 'Satz 4 (Präteritum Passiv)'
            frame: Im Jahr ___ wurde / wurden ___.
          - question: 'Satz 5 (frei)'
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Was ich in sozialen Medien bemerkt habe'
        skills: [Das Perfekt]
        steps:
          - '**Schritt 1:** Wählt zwei Themen aus der Liste unten. Bildet zu jedem Thema einen Satz im Perfekt.'
          - '**Schritt 2, Gruppenarbeit:** A erzählt von seiner / ihrer Erfahrung. B antwortet ebenfalls im Perfekt. C stellt eine Zusatzfrage.'
          - '**Schritt 3, Klassengespräch:** Vergleicht die Antworten verschiedener Schüler.'
        example: |-
          *A: Ich habe bemerkt, dass kurze Videos sehr beliebt geworden sind.*
          *B: Das habe ich auch gesehen.*
          *C: Hast du bemerkt, dass viele Menschen längere Videos nicht mehr anschauen?*
      - id: act2-topics
        type: discussionQuestions
        title: Themen
        items:
          - question: Etwas, das in letzter Zeit sehr beliebt geworden ist.
          - question: Etwas, über das viele Menschen sprechen.
          - question: Etwas, das mich zum Lachen gebracht hat.
          - question: Etwas, das mich nachdenklich gemacht hat.
          - question: Etwas, das viele Menschen mögen.
          - question: Etwas, das ich vermieden habe.
          - question: Eine Person, die ich durch soziale Medien entdeckt habe.
          - question: Eine Gewohnheit, die sich bei mir verändert hat.
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Passives Scrollen oder aktive Entscheidungen?'
        skills: [Das Passiv]
        steps:
          - '**Diskussion:** Werden Inhalte von den Nutzern ausgewählt oder für sie ausgewählt? Hast du schon einmal Zeit verloren, ohne es zu merken? Scrollst du einfach oder entscheidest du bewusst, was du anschaust?'
          - '**Textanalyse:** Lest die beiden Texte. Ein Schüler arbeitet mit Text 1, ein Schüler mit Text 2.'
          - '**Partnerarbeit:** Verwendet das Passiv: *Inhalte sind … / Zeit ist … / Kontrolle ist … / Gewohnheiten sind … / Entscheidungen sind …*'
          - '**Gruppendiskussion:** Beantwortet die Fragen unten.'
        example: |-
          *Viel Zeit ist verschwendet worden.*
          *Mehr Kontrolle ist gewonnen worden.*
          *Neue Gewohnheiten sind entwickelt worden.*
      - id: act3-questions
        type: discussionQuestions
        title: Gruppendiskussion
        items:
          - question: Was ist durch passives Scrollen verloren gegangen?
            frame: Durch passives Scrollen ist ___ verloren gegangen.
          - question: Was ist durch aktive Entscheidungen gewonnen worden?
            frame: Durch aktive Entscheidungen ist / sind ___ gewonnen worden.
          - question: Was wird von Plattformen gefördert?
            frame: Von Plattformen wird / werden ___ gefördert.
          - question: Was wird nicht ausreichend geschützt?
            frame: ___ wird / werden nicht ausreichend geschützt.
          - question: Was war für dich schwierig?
            frame: Für mich war ___ schwierig.
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Debatte – Woher sollten wir unsere Nachrichten bekommen?'
        skills: [Das Perfekt]
        steps:
          - '**Gruppe A:** Wir sollten Nachrichten hauptsächlich über soziale Medien erhalten. **Gruppe B:** Wir sollten Nachrichten hauptsächlich über traditionelle Medien erhalten.'
          - '**Vorbereitung:** Diskutiert: Warum vertrauen Menschen dieser Quelle? Wie werden Informationen verbreitet? Welche Rolle spielen Emotionen? Wie beeinflusst die Quelle Stress oder Informationsmüdigkeit? Versucht, Beispiele im Perfekt zu geben.'
          - '**Debatte:** Gruppe A präsentiert ein Argument, Gruppe B antwortet. Danach umgekehrt.'
          - '**Klassendiskussion:** Beantwortet die Fragen unten.'
        example: |-
          *Meiner Meinung nach sind Nachrichten in sozialen Medien schneller. Ich habe letzte Woche zuerst auf Instagram von dem Unfall gelesen.*
          *Da bin ich anderer Meinung. Ich habe schon oft Fake News gesehen, die sehr oft geteilt worden sind.*
      - id: act4-phrases
        type: callout
        tone: info
        title: Nützliche Ausdrücke
        text: |-
          **Meinung:** Meiner Meinung nach … / Ich denke, dass … / Ich glaube, dass …
          **Zustimmung:** Da stimme ich zu. / Das stimmt.
          **Widerspruch:** Da bin ich anderer Meinung. / Andererseits …
      - id: act4-questions
        type: discussionQuestions
        title: Klassendiskussion
        items:
          - question: Wie hat sich das Vertrauen in Informationen verändert?
            frame: Das Vertrauen in Informationen hat sich ___ verändert, weil ___.
          - question: Fühlst du dich heute von Nachrichten überfordert?
            frame: Ja / Nein, ich fühle mich ___, weil ___.
          - question: Welcher Quelle vertraust du mehr?
            frame: Ich vertraue ___ mehr, weil ___.
          - question: Ist es möglich, informiert zu bleiben, ohne gestresst zu sein?
            frame: Ich denke, dass es (nicht) möglich ist, weil ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: das **Perfekt** (Aufwärmfragen 1–3,
          Aktivitäten 2 und 4) und das **Passiv** (Aufwärmfragen 4–8, Aktivitäten 1
          und 3) im Präsens, Präteritum und Perfekt. In der Debatte (Aktivität 4) kommen
          Meinungsausdrücke dazu. Das Heft gibt für diesen Zyklus keine Zeiten an.
      - id: n-intro
        anchor: intro
        text: Gib zuerst dein eigenes Beispiel. Achte auf die Nebensatz-Wortstellung nach *dass* (… verändert **haben**).
      - id: n-warmup
        anchor: warmup
        text: >-
          Du kannst 8 Fragen auswählen. Die Schüler antworten immer in vollständigen
          Sätzen. Die Fragen 4–8 stehen im Passiv: Achte darauf, dass die Antworten auch
          im Passiv kommen (*Inklusion wird durch … gefördert*).
      - id: n-act1
        anchor: act1
        text: >-
          Achte im Perfekt Passiv auf *worden* (nicht *geworden*): *Eine neue Funktion
          ist eingeführt worden.* Beim Zuhören (Schritt 5) sammeln die Schüler die Sätze;
          besprecht danach gemeinsam, welche im Perfekt und welche im Präteritum Passiv
          stehen.
      - id: n-act3
        anchor: act3
        text: >-
          Die zwei Texte für die Textanalyse fehlen im Heft. Bring zwei kurze Texte mit
          (zum Beispiel einen über passives Scrollen und einen über bewusste Mediennutzung)
          oder lass die Textanalyse weg und geh direkt zur Partnerarbeit.
      - id: n-act4
        anchor: act4
        text: >-
          Teile die Klasse in zwei Gruppen. Die Gruppen müssen ihrer Position nicht
          persönlich zustimmen. Erinnere an Beispiele im Perfekt (*Ich habe schon oft
          gesehen, dass …*) und an die Ausdrücke im Kasten.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: soziale-medien-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: intro-he
        type: text
        lang: he
        text: >-
          בשיעור זה דיברנו על השפעת הרשתות החברתיות על חיי היומיום שלנו, על הדרך שבה
          אנו צורכים מידע, ועל השינויים שהתרחשו בעולם התקשורת בשנים האחרונות. בנוסף,
          תרגלנו שני נושאים דקדוקיים חשובים: **Perfekt** (זמן עבר המתאר חוויות ושינויים
          בעלי קשר להווה) ו־**Passiv** (מבנה סביל).
      - id: rules-perfekt
        type: ruleSummary
        skill: Das Perfekt
        rules:
          - text: 'Das **Perfekt** ist im gesprochenen Deutsch die wichtigste Vergangenheitsform. Wir benutzen es für persönliche Erfahrungen, Veränderungen, Ereignisse mit Folgen für heute und Handlungen, bei denen die genaue Zeit nicht wichtig ist.'
            examples:
              - Ich habe viele interessante Menschen online kennengelernt.
              - Soziale Medien haben unsere Kommunikation verändert.
          - text: 'Form: **haben / sein** (Position 2) + **Partizip II** (am Satzende).'
            examples:
              - Ich **habe** einen Beitrag **gelesen**.
              - Wir **haben** viele Nachrichten **gesehen**.
              - Kurze Videos **sind** sehr beliebt **geworden**.
          - text: 'Verben mit **ver-, ent-, be-** und Verben auf **-ieren** haben kein *ge-*. Bei trennbaren Verben steht *-ge-* in der Mitte.'
            examples:
              - verändern → verändert
              - verbringen → verbracht
              - entdecken → entdeckt
              - konsumieren → konsumiert
              - kennenlernen → kennen**ge**lernt
              - einführen → ein**ge**führt
          - text: 'Typische Zeitwörter: **kürzlich, in letzter Zeit, schon, noch nie, oft, immer**.'
            examples:
              [
                In letzter Zeit habe ich viele Videos über Reisen gesehen.,
                Ich habe noch nie einen Beitrag gelöscht.,
              ]
      - id: perfekt-he
        type: text
        lang: he
        text: |-
          ה־**Perfekt** הוא אחד מזמני העבר החשובים ביותר בגרמנית המדוברת. משתמשים בו כאשר מדברים על: חוויות אישיות; שינויים שהתרחשו לאורך זמן; אירועים שיש להם השפעה על ההווה; פעולות שהתרחשו בעבר אך הזמן המדויק שלהן אינו חשוב.
          מבנה הזמן: **haben / sein + Partizip II**. ה־haben / sein במקום השני במשפט, וה־Partizip II בסוף המשפט.
          מילות זמן נפוצות: kürzlich (לאחרונה), in letzter Zeit (בזמן האחרון), schon (כבר), noch nie (מעולם לא), oft (לעיתים קרובות), immer (תמיד).
      - id: rules-passiv
        type: ruleSummary
        skill: Das Passiv
        rules:
          - text: 'Das **Passiv** benutzen wir, wenn die **Handlung** wichtiger ist als die Person, die sie macht. Es ist typisch für Nachrichten, Berichte, Studien und Beiträge in sozialen Medien.'
          - text: '**Präsens Passiv:** *werden* + Partizip II.'
            examples: [Viele Beiträge werden täglich geteilt., Persönliche Daten werden gesammelt.]
          - text: '**Präteritum Passiv:** *wurde / wurden* + Partizip II.'
            examples:
              [
                Eine neue Funktion wurde eingeführt.,
                Im Jahr 2025 wurde eine neue Sicherheitsrichtlinie eingeführt.,
              ]
          - text: '**Perfekt Passiv:** *sein* + Partizip II + **worden** (nicht *geworden*).'
            examples:
              [
                Viele Informationen sind veröffentlicht worden.,
                Ein Bericht ist veröffentlicht worden.,
              ]
          - text: 'Aktiv → Passiv: Das Objekt (Akkusativ) wird zum Subjekt. Die Person nennen wir nur, wenn sie wichtig ist: mit **von** + Dativ.'
            examples:
              - 'Aktiv: Die Plattform hat das Video geteilt.'
              - 'Passiv: Das Video ist geteilt worden. / Das Video wurde geteilt.'
              - 'Millionen Menschen sehen dieses Video. → Dieses Video wird von Millionen Menschen gesehen.'
          - text: 'Im natürlichen Deutsch kombinieren wir Aktiv und Passiv: Das **Passiv** zeigt das Ergebnis oder den Prozess, das **Aktiv** eine Meinung, ein Gefühl oder eine persönliche Erfahrung.'
            examples: [Viele Inhalte werden geteilt, aber ich lese nur wenige davon.]
      - id: passiv-table
        type: table
        caption: Die drei Formen des Passivs
        header: [Zeit, Form, Beispiel]
        rows:
          - [Präsens, werden + Partizip II, Viele Beiträge werden täglich geteilt.]
          - [Präteritum, wurde(n) + Partizip II, Eine neue Funktion wurde eingeführt.]
          - [
              Perfekt,
              ist / sind + Partizip II + worden,
              Viele Informationen sind veröffentlicht worden.,
            ]
      - id: passiv-he
        type: text
        lang: he
        text: |-
          ה־**Passiv** (סביל) משמש כאשר הפעולה עצמה חשובה יותר ממי שביצע אותה. הוא נפוץ במיוחד בחדשות, בדוחות, במחקרים ובפרסומים ברשתות חברתיות.
          השוואה: **Aktiv:** Die Plattform hat das Video geteilt. – הפלטפורמה שיתפה את הסרטון. **Passiv:** Das Video ist geteilt worden. / Das Video wurde geteilt. – הסרטון שותף.
          **Präsens Passiv:** Viele Beiträge werden täglich geteilt. – פוסטים רבים משותפים מדי יום.
          **Perfekt Passiv:** Viele Informationen sind veröffentlicht worden. – מידע רב פורסם.
          **Präteritum Passiv:** Eine neue Funktion wurde eingeführt. – הוצגה פונקציה חדשה.
          **שילוב בין Aktiv ו־Passiv:** בגרמנית טבעית משלבים בין שני המבנים. ה־Passiv מאפשר לנו להתמקד בתוצאה או בתהליך. ה־Aktiv מאפשר לנו להביע דעה, רגש או חוויה אישית. דוגמה: Viele Inhalte werden geteilt, aber ich lese nur wenige davon. – תכנים רבים משותפים, אבל אני קורא רק חלק קטן מהם.
      - id: phrases-table
        type: table
        caption: Nützliche Ausdrücke
        header: [Funktion, Deutsch, עברית]
        rows:
          - [Meinung, Meiner Meinung nach …, לדעתי…]
          - [Meinung, 'Ich denke, dass …', אני חושב ש…]
          - [Meinung, 'Ich glaube, dass …', אני מאמין ש…]
          - [Zustimmung, Da stimme ich zu., אני מסכים.]
          - [Zustimmung, Das stimmt., זה נכון.]
          - [Widerspruch, Da bin ich anderer Meinung., אני חושב אחרת.]
          - [Widerspruch, Andererseits …, מצד שני…]
      - id: key-sentence
        type: callout
        tone: tip
        title: Merksatz
        text: '**Perfekt:** *haben / sein* … Partizip II. **Perfekt Passiv:** *ist / sind* … Partizip II + **worden**.'
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die Regeln mit der Gruppe und bitte um ein neues Beispiel zu jeder Passivform, am besten über eine Plattform, die die Schüler benutzen.

