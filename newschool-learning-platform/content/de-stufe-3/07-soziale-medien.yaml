vocabulary:
  - slug: soziale-medien
    title: Soziale Medien
    items: *soziale-medien-words

activities:
  - slug: soziale-medien-perfekt
    title: Das Perfekt
    minutes: 8
    items:
      - id: habe-gesehen
        type: multipleChoice
        prompt: Ich ___ viele Videos auf TikTok gesehen.
        options:
          - { text: habe, correct: true }
          - {
              text: bin,
              feedback: '*sehen* ist kein Verb der Bewegung: Wir sagen *Ich habe gesehen*.',
            }
          - { text: hat, feedback: '*hat* ist für *er / sie / es*. Für *ich* sagen wir *habe*.' }
      - id: geloescht
        type: fillBlank
        prompt: Schreib das Partizip II von *löschen*.
        text: Er hat seinen Account ___.
        blanks: [[gelöscht]]
      - id: verbracht
        type: multipleChoice
        prompt: Du hast viel Zeit im Internet ___.
        options:
          - { text: verbracht, correct: true }
          - {
              text: geverbracht,
              feedback: 'Verben mit *ver-* haben im Partizip II kein *ge-*: *verbracht*.',
            }
          - {
              text: verbringt,
              feedback: '*verbringen* ist unregelmäßig: Das Partizip II ist *verbracht*.',
            }
      - id: partizip-paare
        type: matching
        prompt: Welches Partizip II passt zu welchem Verb?
        pairs:
          - [teilen, geteilt]
          - [lesen, gelesen]
          - [entdecken, entdeckt]
          - [kennenlernen, kennengelernt]
          - [veröffentlichen, veröffentlicht]
      - id: wortstellung
        type: trueFalse
        prompt: 'Der Satz *Ich habe gelesen einen Beitrag.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! Das Partizip II steht am Satzende: *Ich habe einen Beitrag gelesen.*'
          incorrect: 'Das Partizip II steht immer am Satzende: *Ich habe einen Beitrag gelesen.*'
      - id: geworden
        type: fillBlank
        prompt: Ergänze *sein* in der richtigen Form und das Partizip II von *werden*.
        text: Kurze Videos ___ in letzter Zeit sehr beliebt ___.
        blanks: [[sind], [geworden]]
      - id: kennengelernt
        type: multipleChoice
        prompt: Ich habe viele interessante Menschen online ___.
        options:
          - { text: kennengelernt, correct: true }
          - {
              text: gekennenlernt,
              feedback: 'Bei trennbaren Verben steht *-ge-* in der Mitte: *kennen-ge-lernt*.',
            }
          - {
              text: kennenlernen,
              feedback: '*kennenlernen* ist der Infinitiv. Im Perfekt brauchen wir das Partizip II: *kennengelernt*.',
            }
      - id: ordne-kommunikation
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz im Perfekt.
        sentence: Soziale Medien haben unsere Kommunikation verändert.

  - slug: soziale-medien-passiv
    title: Das Passiv
    minutes: 8
    items:
      - id: praesens-werden
        type: multipleChoice
        prompt: Viele Beiträge ___ täglich geteilt.
        options:
          - { text: werden, correct: true }
          - { text: wird, feedback: '*Beiträge* ist Plural: *Viele Beiträge werden geteilt*.' }
          - {
              text: haben,
              feedback: 'Das Präsens Passiv bilden wir mit *werden* + Partizip II: *werden geteilt*.',
            }
      - id: perfekt-ist
        type: fillBlank
        prompt: Ergänze das Hilfsverb im Perfekt Passiv.
        text: Eine neue Funktion ___ eingeführt worden.
        blanks: [[ist]]
      - id: worden
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Viele Informationen sind veröffentlicht worden., correct: true }
          - {
              text: Viele Informationen sind veröffentlicht geworden.,
              feedback: 'Im Perfekt Passiv sagen wir *worden*, nicht *geworden*.',
            }
          - {
              text: Viele Informationen haben veröffentlicht worden.,
              feedback: 'Das Perfekt Passiv bilden wir mit *sein*: *sind … veröffentlicht worden*.',
            }
      - id: regel-worden
        type: trueFalse
        prompt: 'Im Perfekt Passiv benutzen wir *worden*, nicht *geworden*.'
        answer: true
        feedback:
          correct: 'Richtig! *Ein Bericht ist veröffentlicht worden.*'
          incorrect: 'Doch: Im Perfekt Passiv steht *worden*: *Ein Bericht ist veröffentlicht worden.*'
      - id: aktiv-passiv
        type: matching
        prompt: Welcher Passivsatz passt zu welchem Aktivsatz?
        pairs:
          - [Die Plattform sammelt persönliche Daten., Persönliche Daten werden gesammelt.]
          - [Die Moderatoren haben den Kommentar entfernt., Der Kommentar ist entfernt worden.]
          - [Die Firma führte eine neue Funktion ein., Eine neue Funktion wurde eingeführt.]
          - [
              Millionen Menschen sehen dieses Video.,
              Dieses Video wird von Millionen Menschen gesehen.,
            ]
      - id: praeteritum-wurde
        type: fillBlank
        prompt: Ergänze das Präteritum Passiv.
        text: Im Jahr 2025 ___ eine neue Sicherheitsrichtlinie eingeführt.
        blanks: [[wurde]]
      - id: welche-form
        type: multipleChoice
        prompt: Welcher Satz steht im **Präteritum** Passiv?
        options:
          - { text: Der Beitrag wurde geteilt., correct: true }
          - {
              text: Der Beitrag ist geteilt worden.,
              feedback: '*ist … worden* ist das Perfekt Passiv. Das Präteritum Passiv ist *wurde* + Partizip II.',
            }
          - {
              text: Der Beitrag wird geteilt.,
              feedback: '*wird* + Partizip II ist das Präsens Passiv. Das Präteritum Passiv ist *wurde* + Partizip II.',
            }
      - id: ordne-informationen
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz im Perfekt Passiv.
        sentence: Viele Informationen sind veröffentlicht worden.
