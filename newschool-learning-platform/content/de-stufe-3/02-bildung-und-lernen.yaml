vocabulary:
  - slug: bildung-und-lernen
    title: Bildung und Lernen
    items: *bildung-und-lernen-words

activities:
  - slug: bildung-und-lernen-perfekt
    title: 'Perfekt: Lernerfahrungen'
    minutes: 8
    items:
      - id: ist-gefahren
        type: multipleChoice
        prompt: Meine Schwester ___ nach Berlin gefahren.
        options:
          - { text: ist, correct: true }
          - {
              text: hat,
              feedback: '*fahren* ist ein Verb der Bewegung: Das Perfekt bilden wir mit *sein*: *sie ist gefahren*.',
            }
          - {
              text: sind,
              feedback: '*sind* ist für *wir / sie* (Plural). *Meine Schwester* ist eine Person: *ist*.',
            }
      - id: haben-teilgenommen
        type: fillBlank
        prompt: Ergänze *haben* oder *sein* in der richtigen Form.
        text: Wir ___ an einem Kurs teilgenommen.
        blanks: [[haben]]
      - id: habe-gegangen
        type: trueFalse
        prompt: 'Der Satz *Ich habe gegangen.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! *gehen* ist ein Verb der Bewegung: *Ich bin gegangen.*'
          incorrect: 'Verben der Bewegung bilden das Perfekt mit *sein*: *Ich bin gegangen.*'
      - id: wortstellung
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Ich habe letztes Jahr Deutsch studiert., correct: true }
          - {
              text: Ich habe letztes Jahr studiert Deutsch.,
              feedback: 'Das Partizip II steht am Satzende: *… Deutsch studiert.*',
            }
          - {
              text: Ich letztes Jahr habe Deutsch studiert.,
              feedback: '*habe* steht auf Position 2, direkt nach *Ich*: *Ich habe letztes Jahr …*',
            }
      - id: partizip-paare
        type: matching
        prompt: Welches Partizip II passt zu welchem Verb?
        pairs:
          - [lernen, gelernt]
          - [teilnehmen, teilgenommen]
          - [treffen, getroffen]
          - [kommen, gekommen]
          - [motivieren, motiviert]
      - id: bin-gekommen
        type: fillBlank
        prompt: Ergänze das Verb *kommen* im Perfekt.
        text: Ich ___ spät zur Vorlesung ___.
        blanks: [[bin], [gekommen]]
      - id: zeitangabe
        type: trueFalse
        prompt: 'Im Deutschen benutzen wir das Perfekt auch mit genauen Zeitangaben wie *gestern* oder *letztes Jahr*.'
        answer: true
        feedback:
          correct: 'Richtig! *Letztes Jahr habe ich an einer Universität studiert.*'
          incorrect: 'Doch: Das Perfekt ist die normale Vergangenheit beim Sprechen, auch mit Zeitangaben: *Letztes Jahr habe ich an einer Universität studiert.*'
      - id: ordne-motiviert
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Mein Lehrer hat mich immer motiviert.

  - slug: bildung-und-lernen-futur
    title: 'Futur I: Pläne und Vorhersagen'
    minutes: 8
    items:
      - id: werde
        type: multipleChoice
        prompt: Ich ___ nächstes Jahr mehr Deutsch lernen.
        options:
          - { text: werde, correct: true }
          - { text: wird, feedback: '*wird* ist für *er / sie / es*. Für *ich* sagen wir *werde*.' }
          - {
              text: werden,
              feedback: '*werden* ist für *wir / sie / Sie*. Für *ich* sagen wir *werde*.',
            }
      - id: wird-veraendern
        type: fillBlank
        prompt: Ergänze *werden* + Infinitiv von *verändern*.
        text: Technologie ___ Schulen stark ___.
        blanks: [[wird], [verändern]]
      - id: werden-formen
        type: matching
        prompt: Welche Form von *werden* passt?
        pairs:
          - [ich, werde]
          - [du, wirst]
          - [er / sie / es, wird]
          - [wir, werden]
          - [ihr, werdet]
      - id: einfacher-machen
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Technologie wird alles einfacher machen., correct: true }
          - {
              text: Technologie wird macht alles einfacher.,
              feedback: 'Nach *werden* steht der Infinitiv am Satzende: *… alles einfacher machen.*',
            }
          - {
              text: Technologie wird alles einfacher macht.,
              feedback: 'Am Satzende steht der Infinitiv *machen*, nicht *macht*.',
            }
      - id: werden-studieren
        type: fillBlank
        prompt: Ergänze *werden* + Infinitiv von *studieren*.
        text: Viele Schüler ___ online ___.
        blanks: [[werden], [studieren]]
      - id: praesens-zukunft
        type: trueFalse
        prompt: 'Im gesprochenen Deutsch benutzen wir für die Zukunft oft das Präsens mit einer Zeitangabe: *Nächstes Jahr lerne ich Deutsch in Berlin.*'
        answer: true
        feedback:
          correct: 'Richtig! Mit *nächstes Jahr, morgen, in Zukunft* ist das Präsens für die Zukunft ganz normal.'
          incorrect: 'Doch: Mit einer Zeitangabe wie *nächstes Jahr* benutzen wir oft das Präsens für die Zukunft.'
      - id: lehrer-benutzen
        type: fillBlank
        prompt: Ergänze *werden* + Infinitiv von *benutzen*.
        text: In Zukunft ___ Lehrer mehr Technologie ___.
        blanks: [[werden], [benutzen]]
      - id: ordne-studieren
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Ich werde Deutsch studieren.
