# Cycle "Bildung und Lernen", converted from the German level 3 digital notebook
# ("German Level 3- Digital Notebook", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (German).
course: de-stufe-3
slug: bildung-und-lernen
title: Bildung und Lernen
goal: Mit dem Perfekt über Lernerfahrungen sprechen und mit dem Futur I Pläne und Vorhersagen über die Bildung ausdrücken.
position: 2
status: in_review

review:
  - >-
    The two workbook exercises ("Perfekt: Lernerfahrungen" and "Futur I: Pläne und
    Vorhersagen") are NEW: the notebook has no self-correcting exercises. They were
    written from the cycle's summary rules, the classic homework, the activity examples
    and the vocabulary. Please check level, wording and every right answer before
    students see them.
  - >-
    The notebook's focus list (Perfekt, Futur I, intentions and predictions, opinions,
    learning experiences) became two skills: "Perfekt: Lernerfahrungen" and "Futur I:
    Pläne und Vorhersagen"; opinions are practised in the activities and kept in the
    summary. The line "Level: 3 (extreme)" was left out.
  - >-
    Summary, rules translated from the English / Spanish notebooks and WRONG for
    German, rewritten in Hebrew (please check the Hebrew): (1) "ה־Perfekt מחבר בין
    העבר להווה" (the English present perfect idea) and "מצבים שקרו ועדיין חשובים היום":
    in German the Perfekt is simply the normal spoken past tense, also with exact time
    expressions (gestern, letztes Jahr). (2) "שילוב בין Perfekt ו־Past Details"
    (English words left in; this is the Spanish perfecto / indefinido idea): in German
    the details stay in the Perfekt; the example "Ihn habe ich letztes Jahr gemacht"
    (awkward) → "Den Kurs habe ich letztes Jahr gemacht." The rule is now "Perfekt mit
    Details". ADDED (please confirm): sein with verbs of movement / change of state
    now lists kommen, fahren, gehen; the Futur I word order (werden in position 2, the
    infinitive at the end); a table of werden (ich werde … ihr werdet); the Präteritum
    of sein / haben / mögen for "Als ich ein Kind war, mochte ich…" (used in the
    homework key and sample text).
  - >-
    Corrections: Mori messages "Frag mich Fragen über…" (not idiomatic) → "Stell mir
    Fragen über…" (tasks 1 and 2); summary "Ich glaube, dass… – אני חושב ש…" → "אני
    חושב/ת / מאמין/ה ש…" so it differs from "Ich denke, dass…"; Activity 1 letter: the
    broken bold / italic marks were removed; stray "**" lines after Activity 2 and
    around the warm-up questions were removed.
  - >-
    Classic homework: kept in the homework section (Hebrew instructions as in the
    source), with the answer key and sample paragraph ONLY in teacher notes. All key
    answers were checked and are correct; Part C 2 also accepts "Nächstes Jahr werde
    ich in Deutschland Deutsch lernen" (both orders are correct) and 3 "Als ich ein
    Kind war, mochte ich die Schule nicht" / "… bin ich nicht gern zur Schule
    gegangen".
  - >-
    The Hebrew lists under the Mori tasks ("נסו לדבר על", "אל תשכחו", "דוגמאות לנושאים",
    "נסו להשתמש ב"), the "B1 challenge", the "B1 goal", "tips" and "good answer
    structure" are kept in Hebrew as callouts. The Mori messages stay in German.
  - >-
    Left out: the "Datum / Teilnehmer" lines and the "Antwort von Schüler 1/2/3" lines
    (the platform has answer boxes). The Quizlet link lost its "?new" parameter.
  - >-
    Times: introduction max. 5 minutes; Activity 1: 5 minutes brainstorming + 10
    minutes writing (15 recorded); Activity 2: 10 minutes preparation + 3 minutes per
    presentation. No other times in the source. The source says to choose 1–2
    activities (plan note).
  - >-
    Vocabulary: "die Lernschwierigkeit – לקות למידה" → "קושי בלמידה" (לקות למידה is a
    Lernstörung); "motivieren – לעודד" → "לתת מוטיבציה / לעודד". Please confirm. "der
    Lehrerassistent" is kept as in the source (also common: die Assistenzlehrkraft).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: bildung-und-lernen-unterricht
    title: 'Unterricht: Bildung und Lernen'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Bildung und Lernen
      - id: skills
        type: cycleOverview
        skills:
          - name: 'Perfekt: Lernerfahrungen'
            description: '*Ich habe an einem Kurs teilgenommen. Mein Lehrer hat mich motiviert. Ich bin nach Berlin gefahren.*'
          - name: 'Futur I: Pläne und Vorhersagen'
            description: '*werden* + Infinitiv: *Ich werde nächstes Jahr studieren. Technologie wird Schulen verändern.*'
      - id: quizlet
        type: externalLink
        label: Bildung und Lernen auf Quizlet
        url: https://quizlet.com/br/1181629289/bildung-und-lernen-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Einführungsrunde
      - id: intro
        type: sentenceFrame
        frame: Ich heiße ___. Mein Lieblingsfach in der Schule war ___, weil ___.
        example: Ich heiße Daniel. Mein Lieblingsfach war Geschichte, weil ich alte Kulturen interessant finde.
      - id: warmup-title
        type: heading
        level: 3
        text: Aufwärmfragen
      - id: warmup-hint
        type: callout
        tone: info
        text: Antworte in **ganzen Sätzen** und benutze möglichst das **Perfekt**.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Hast du schon einmal eine wichtige Lernerfahrung gemacht, an die du dich noch heute erinnerst? War das in der Schule oder außerhalb der Schule?
            frame: Ja, ich habe ___. Das war ___.
          - question: Hast du schon einmal ein Fach gelernt, das sehr schwierig für dich war? Was hast du gemacht, um besser zu werden?
            frame: ___ war sehr schwierig für mich. Um besser zu werden, habe ich ___.
          - question: Hast du schon einmal an einer Universität oder Hochschule studiert? Wie war die Erfahrung?
            frame: Ich habe an ___ studiert. Die Erfahrung war ___.
          - question: Hast du schon einmal an einem Gruppenprojekt teilgenommen? Welche Rolle hattest du?
            frame: Ich habe an ___ teilgenommen. Ich war ___.
          - question: Welches Fach wird deiner Meinung nach in 50 Jahren nicht mehr unterrichtet werden? Warum?
            frame: Meiner Meinung nach wird ___ nicht mehr unterrichtet werden, weil ___.
          - question: Wirst du nächstes Jahr etwas Neues lernen oder studieren? Erzähl der Klasse davon.
            frame: Nächstes Jahr werde ich ___.
          - question: Wenn du eine praktische Ausbildung machen könntest, welche Ausbildung würdest du wählen? Warum?
            frame: Ich würde eine Ausbildung als ___ machen, weil ___.
          - question: 'Hast du schon einmal an einem Kurs außerhalb der Schule teilgenommen? Zum Beispiel: Sport, Musik oder Sprachen?'
            frame: Ja, ich habe an einem ___kurs teilgenommen. / Nein, ich habe noch nie ___.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Ein Brief an meinen Mentor'
        skills: ['Perfekt: Lernerfahrungen']
        minutes: 15
        steps:
          - 'Denk an eine Person, die dich motiviert oder unterstützt hat: eine Lehrerin / einen Lehrer, eine Trainerin / einen Trainer, ein Familienmitglied, eine Beraterin / einen Berater.'
          - 'Die Klasse sammelt Ideen mit den Fragen unten (5 Minuten Brainstorming).'
          - 'Schreib einen kurzen Brief (8–10 Sätze) im **Perfekt** (10 Minuten).'
          - Lies deinen Brief zu zweit oder vor der Klasse vor.
        example: |-
          *Liebe Frau Müller,*
          *ich habe Ihre Deutschstunden immer sehr gemocht. Sie haben mich motiviert, mehr Deutsch zu sprechen. Sie haben mir geholfen, selbstbewusster zu werden. Ich habe viel von Ihnen gelernt. Wenn ich nervös war, haben Sie mich unterstützt. Vielen Dank für alles!*
          *Viele Grüße*
          *Anna*
      - id: act1-questions
        type: discussionQuestions
        title: Ideen sammeln
        items:
          - question: Wer ist die Person?
            frame: Die Person ist ___.
          - question: Was hat die Person gemacht?
            frame: Sie / Er hat ___.
          - question: Wie hat diese Person geholfen?
            frame: Sie / Er hat mir geholfen, ___ zu ___.
          - question: Wofür möchtest du dich bedanken?
            frame: Ich möchte mich für ___ bedanken.
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Bildung für alle'
        skills: ['Futur I: Pläne und Vorhersagen']
        steps:
          - '**Situation:** Ihr seid ein Team im Bildungsministerium. Ihr müsst ein neues Lernprogramm für die Zukunft planen. Das Programm soll für alle Kinder geeignet sein, auch für Kinder mit Behinderungen oder Lernschwierigkeiten.'
          - '**Gruppenarbeit (10 Minuten):** Plant neue Ideen, moderne Technologien, Unterstützung für Schüler und inklusive Klassenräume. Benutzt das **Futur I** (*werden* + Infinitiv).'
          - '**Präsentation (3 Minuten pro Gruppe):** Nach jeder Präsentation stellt eine andere Gruppe eine Frage.'
        example: |-
          *Wir werden mehr Technologie im Unterricht benutzen.*
          *Die Lehrer werden neue Methoden lernen.*
          *Schüler mit Lernschwierigkeiten werden zusätzliche Hilfe bekommen.*
          *In Zukunft werden Schulen flexibler sein.*
      - id: act2-frames
        type: discussionQuestions
        title: Unser Lernprogramm
        items:
          - question: Neue Ideen
            frame: Wir werden ___.
          - question: Moderne Technologien
            frame: Die Schüler werden ___ benutzen.
          - question: Unterstützung für Schüler
            frame: Schüler mit Lernschwierigkeiten werden ___.
          - question: Inklusive Klassenräume
            frame: In Zukunft werden Klassenräume ___ sein.
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Welcher Lerntyp bist du?'
        skills: ['Perfekt: Lernerfahrungen']
        steps:
          - 'Die Klasse spricht darüber: *Wie lernst du am besten? Durch Lesen? Durch Zuhören? Durch praktische Übungen?* Lest die Lerntypen in der Tabelle.'
          - '**Partnerinterview:** Stellt euch gegenseitig die Fragen unten. Antwortet im Perfekt (Fragen 1–5) und im Futur I (Fragen 6–8).'
        example: |-
          *A: Hast du schon einmal Audioaufnahmen benutzt, um besser zu lernen?*
          *B: Ja, ich habe Podcasts gehört, als ich Englisch gelernt habe. Das hat mir sehr geholfen.*
      - id: act3-types
        type: table
        caption: Lerntypen
        header: [Lerntyp, Wie lernt man?]
        rows:
          - [Visuell, 'Lernt mit Bildern, Videos oder Notizen.']
          - [Auditiv, Lernt durch Zuhören und Diskussionen.]
          - [Praktisch, Lernt durch Bewegung und praktische Aktivitäten.]
          - [Sozial, Lernt gern mit anderen Menschen.]
          - [Online, 'Lernt mit Technologie, Apps oder digitalen Kursen.']
      - id: act3-questions
        type: discussionQuestions
        title: Fragen für das Partnerinterview
        items:
          - question: Hast du schon einmal etwas gelernt, nur weil du jemandem zugeschaut hast?
            frame: Ja, ich habe ___ gelernt, weil ich ___ zugeschaut habe.
          - question: Hast du schon einmal Audioaufnahmen benutzt, um besser zu lernen?
          - question: Hast du schon einmal etwas gebaut oder gemacht, um es besser zu verstehen?
          - question: Hast du schon einmal besser in einer Gruppe als allein gelernt?
          - question: Hast du schon einmal viele Notizen geschrieben, um etwas zu lernen?
          - question: Wirst du in Zukunft lieber online oder im Klassenzimmer lernen?
            frame: In Zukunft werde ich lieber ___ lernen, weil ___.
          - question: Wirst du dieses Jahr einen Kurs machen?
          - question: Glaubst du, dass Technologie das Lernen einfacher machen wird?
            frame: Ich glaube (nicht), dass Technologie das Lernen einfacher machen wird, weil ___.
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Mein Klassenzimmer der Zukunft'
        skills: ['Futur I: Pläne und Vorhersagen']
        steps:
          - '*Stellt euch vor: Ihr seid Lehrer im Jahr 2050.* Welche neuen Fächer werdet ihr unterrichten? Wählt 3 neue Schulfächer.'
          - 'Denkt über die Fragen unten nach: *Warum wird das Fach wichtig sein? Was werden die Schüler lernen? Wie werdet ihr unterrichten?*'
          - '**Präsentation:** Präsentiert eure Ideen. Die Gruppe stellt Fragen: *Warum hast du dieses Fach gewählt? Welches Fach wird am wichtigsten sein? Wirst du mehr Theorie oder Praxis benutzen? Wie wirst du den Unterricht interessant machen?*'
        example: |-
          *Ich werde ein Fach über mentale Gesundheit unterrichten.*
          *Die Schüler werden lernen, besser mit Stress umzugehen.*
          *Ich werde Experten in den Unterricht einladen.*
      - id: act4-frames
        type: discussionQuestions
        title: Mein neues Fach
        items:
          - question: Welches Fach wirst du unterrichten?
            frame: Ich werde ein Fach über ___ unterrichten.
          - question: Warum wird das Fach wichtig sein?
            frame: Das Fach wird wichtig sein, weil ___.
          - question: Was werden die Schüler lernen?
            frame: Die Schüler werden lernen, ___.
          - question: Wie wirst du unterrichten?
            frame: Ich werde ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: **Perfekt: Lernerfahrungen** (Aufwärmfragen,
          Aktivitäten 1 und 3) und **Futur I: Pläne und Vorhersagen** (Aktivitäten 2 und
          4, Fragen 6–8 in Aktivität 3). Wähle **1–2 Aktivitäten** je nach Zeit,
          Gruppengröße und Niveau. Die Aktivitäten sind unabhängig voneinander.
          Weitere Ziele: Absichten und Vorhersagen ausdrücken, Meinungen äußern.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: Maximal 5 Minuten. Gib zuerst dein eigenes Beispiel.
      - id: n-warmup
        anchor: warmup
        text: Wähle 5–8 Fragen aus. Die Schüler antworten in ganzen Sätzen und möglichst im Perfekt (Fragen 5–7 im Futur I bzw. Konjunktiv II).
      - id: n-act1
        anchor: act1
        minutes: 15
        text: >-
          Sprachfokus: Perfekt, Erfahrungen beschreiben, Dankbarkeit ausdrücken. Gib 5
          Minuten zum Brainstorming und 10 Minuten zum Schreiben. Danach lesen die
          Schüler ihre Briefe in Paaren oder vor der Klasse vor.
      - id: n-act2
        anchor: act2
        minutes: 10
        text: 'Sprachfokus: Futur I, Pläne und Vorhersagen, Meinung ausdrücken. 10 Minuten Vorbereitung, dann 3 Minuten Präsentation pro Gruppe.'
      - id: n-act3
        anchor: act3
        text: 'Sprachfokus: Perfekt, über Erfahrungen sprechen. Erkläre jeden Lerntyp kurz mit einem eigenen Beispiel im Perfekt.'
      - id: n-act4
        anchor: act4
        text: 'Sprachfokus: Futur I, Zukunftspläne beschreiben. Achte auf *werden* in Position 2 und den Infinitiv am Satzende.'

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: bildung-und-lernen-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: rules-perfekt
        type: ruleSummary
        lang: he
        skill: 'Perfekt: Lernerfahrungen'
        rules:
          - text: 'ה־**Perfekt** הוא זמן העבר המרכזי בדיבור בגרמנית. משתמשים בו כדי לדבר על חוויות ועל דברים שעשינו בעבר.'
            examples:
              [
                Ich habe Deutsch gelernt. – למדתי גרמנית.,
                Ich bin nach Berlin gefahren. – נסעתי לברלין.,
              ]
          - text: 'מבנה: **haben / sein + Partizip II**. haben / sein במקום השני, וה־Partizip II בסוף המשפט.'
            examples: [Ich habe letztes Jahr Deutsch studiert.]
          - text: '**haben:** רוב הפעלים משתמשים ב־haben.'
            examples: [Ich habe gearbeitet. – עבדתי., Wir haben gelernt. – למדנו.]
          - text: '**sein:** פעלי תנועה או שינוי מצב משתמשים ב־sein (gehen, kommen, fahren).'
            examples: [Ich bin gegangen. – הלכתי., Sie ist gekommen. – היא הגיעה.]
          - text: 'שימו לב: בגרמנית (לא כמו באנגלית) משתמשים ב־Perfekt גם עם זמן מדויק בעבר, כמו gestern או letztes Jahr.'
            examples: [Letztes Jahr habe ich an einer Universität studiert.]
          - text: '**Perfekt עם פרטים:** קודם מספרים על החוויה, ואז מוסיפים פרטים (מתי, איפה, עם מי). גם הפרטים נשארים ב־Perfekt.'
            examples:
              - Ich habe einen Kurs gemacht. Den Kurs habe ich letztes Jahr gemacht.
              - עשיתי קורס. עשיתי אותו בשנה שעברה.
          - text: 'עם **sein, haben** ו־**mögen** אומרים בדרך כלל Präteritum: **war, hatte, mochte**.'
            examples: ['Als ich ein Kind war, mochte ich die Schule nicht.']
      - id: rules-futur
        type: ruleSummary
        lang: he
        skill: 'Futur I: Pläne und Vorhersagen'
        rules:
          - text: 'מבנה: **werden + Infinitiv**. werden במקום השני, וה־Infinitiv בסוף המשפט.'
            examples:
              [
                Ich werde nächstes Jahr studieren. – אני אלמד בשנה הבאה.,
                Technologie wird Schulen verändern. – טכנולוגיה תשנה בתי ספר.,
              ]
          - text: 'משתמשים ב־Futur I לתוכניות לעתיד, לתחזיות ולרעיונות על העתיד.'
          - text: '**עתיד בדיבור יומיומי:** בגרמנית הרבה פעמים משתמשים פשוט ב־Präsens עם ביטוי זמן.'
            examples:
              [Nächstes Jahr lerne ich Deutsch in Berlin. – בשנה הבאה אני לומד גרמנית בברלין.]
      - id: werden-table
        type: table
        caption: werden im Präsens (für das Futur I)
        header: [Person, werden, Beispiel]
        rows:
          - [ich, werde, Ich werde Deutsch studieren.]
          - [du, wirst, Wirst du dieses Jahr einen Kurs machen?]
          - [er / sie / es, wird, Technologie wird Schulen verändern.]
          - [wir, werden, Wir werden neue Fähigkeiten entwickeln.]
          - [ihr, werdet, Wie werdet ihr unterrichten?]
          - [sie / Sie, werden, Viele Schüler werden online studieren.]
      - id: opinion-table
        type: table
        caption: Wichtige Ausdrücke für die Meinung
        header: [Deutsch, עברית]
        rows:
          - [Meiner Meinung nach…, לדעתי…]
          - ['Ich glaube, dass…', אני חושב/ת / מאמין/ה ש…]
          - ['Ich denke, dass…', אני חושב/ת ש…]
          - [Zum Beispiel…, למשל…]
          - [In Zukunft…, בעתיד…]
      - id: time-table
        type: table
        caption: Zeiten verbinden
        header: [Zeit, Deutsch, עברית]
        rows:
          - [Vergangenheit, Früher…, בעבר…]
          - [Vergangenheit, Als ich jünger war…, כשהייתי צעיר יותר…]
          - [Vergangenheit, Vor einigen Jahren…, לפני כמה שנים…]
          - [Gegenwart, Heute…, היום…]
          - [Gegenwart, Im Moment…, כרגע…]
          - [Gegenwart, Jetzt…, עכשיו…]
          - [Zukunft, In Zukunft…, בעתיד…]
          - [Zukunft, Nächstes Jahr…, בשנה הבאה…]
          - [Zukunft, Später…, מאוחר יותר…]
      - id: mistakes-table
        type: table
        caption: Häufige Fehler
        header: [Falsch, Richtig]
        rows:
          - [Ich werde studiere Deutsch., Ich werde Deutsch studieren.]
          - [Ich habe gegangen., Ich bin gegangen.]
          - [Ich habe letztes Jahr studiert Deutsch., Ich habe letztes Jahr Deutsch studiert.]
          - [Technologie wird macht alles einfacher., Technologie wird alles einfacher machen.]
      - id: answer-structure
        type: callout
        tone: tip
        lang: he
        title: מבנה תשובה טוב ברמת B1
        text: |-
          *Früher… / Heute… / In Zukunft…*
          דוגמה: *Früher habe ich nicht gern gelernt. Heute lerne ich gern Deutsch. In Zukunft werde ich nach Deutschland reisen.*
      - id: b1-tips
        type: callout
        tone: tip
        lang: he
        title: טיפים חשובים לגרמנית B1
        text: |-
          - אל תענו רק "כן" או "לא"
          - תוסיפו הסבר
          - השתמשו בביטויי קישור
          - נסו לדבר גם על עבר, הווה ועתיד
          - דברו במשפטים מלאים, הסבירו למה ותנו דוגמאות
      - id: b1-goal
        type: callout
        tone: info
        lang: he
        title: מטרה ברמת B1
        text: |-
          תלמיד ברמת B1 צריך להיות מסוגל:
          - לדבר 2–3 דקות ברצף
          - לספר על חוויות
          - לדבר על תוכניות לעתיד
          - להסביר דעות
          - להשתתף בדיונים
          - להגיב לאחרים
          - להשתמש בעבר, הווה ועתיד באותה שיחה
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die zwei Fertigkeiten. Bitte jeden Schüler um eine Lernerfahrung im Perfekt und einen Plan oder eine Vorhersage im Futur I.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: bildung-und-lernen-hausaufgaben
    title: Hausaufgaben
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben
      - id: classic-title
        type: heading
        level: 3
        text: Klassische Hausaufgaben
      - id: part-a
        type: discussionQuestions
        lang: he
        title: 'חלק א – השלימו עם הצורה הנכונה של הפועל ב־Perfekt.'
        items:
          - question: Ich ___ Deutsch gelernt. (haben)
          - question: Wir ___ an einem Kurs teilgenommen. (haben)
          - question: Meine Schwester ___ nach Berlin gefahren. (sein)
          - question: Ich ___ viele interessante Lehrer getroffen. (haben)
          - question: Letztes Jahr ___ ich an einer Universität studiert. (haben)
          - question: Die Schüler ___ ein Gruppenprojekt gemacht. (haben)
          - question: Mein Lehrer ___ mich immer motiviert. (haben)
          - question: Ich ___ spät zur Vorlesung gekommen. (sein)
      - id: part-b
        type: discussionQuestions
        lang: he
        title: 'חלק ב – Futur I: השלימו את המשפטים עם werden + Infinitiv.'
        items:
          - question: Ich ___ nächstes Jahr mehr Deutsch ___. (lernen)
          - question: Technologie ___ Schulen stark ___. (verändern)
          - question: Viele Schüler ___ online ___. (studieren)
          - question: Wir ___ neue Fähigkeiten ___. (entwickeln)
          - question: In Zukunft ___ Lehrer mehr Technologie ___. (benutzen)
      - id: part-c
        type: discussionQuestions
        lang: he
        title: חלק ג – תרגמו לגרמנית.
        items:
          - question: למדתי הרבה מהמורים שלי.
          - question: בשנה הבאה אני אלמד גרמנית בגרמניה.
          - question: כשהייתי ילד, לא אהבתי בית ספר.
          - question: בעתיד בתי ספר ישתמשו ביותר טכנולוגיה.
          - question: השתתפתי בפרויקט קבוצתי מעניין.
      - id: part-d-rules
        type: callout
        tone: info
        lang: he
        title: חלק ד – כתיבה
        text: |-
          כתבו פסקה של 8–10 שורות על חוויית לימוד משמעותית שהייתה לכם. נסו לכלול:
          - לפחות 3 משפטים ב־Perfekt
          - לפחות 2 משפטים ב־Futur I
          - דעה אישית
          אפשר להשתמש בביטויים: *Früher… / Heute… / In Zukunft… / Meiner Meinung nach… / Ich glaube, dass…*
      - id: part-d
        type: reflection
        prompt: Eine wichtige Lernerfahrung
      - id: mori-title
        type: heading
        level: 3
        text: Hausaufgaben mit Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere eine Nachricht und schick sie ab. Mori stellt dir Fragen; beantworte alle.
      - id: mori-erfahrungen
        type: aiTutorPrompt
        title: 'Aufgabe 1: Meine Lernerfahrungen'
        message: Hallo Mori! Lass uns über meine Lernerfahrungen sprechen. Stell mir Fragen über Dinge, die ich gelernt oder erlebt habe, damit ich das Perfekt benutzen kann. Bitte korrigiere meine Fehler und stelle Folgefragen.
      - id: mori-erfahrungen-hint
        type: callout
        tone: info
        lang: he
        title: נסו לדבר על
        text: |-
          בית ספר, אוניברסיטה, שפות, מורים, קורסים, חוויות טובות וקשות.
          **אל תשכחו:** לענות במשפטים מלאים, להסביר למה ולתת דוגמאות.
      - id: mori-zukunft
        type: aiTutorPrompt
        title: 'Aufgabe 2: Die Schule der Zukunft'
        message: Hallo Mori! Lass uns über Schulen der Zukunft sprechen. Stell mir Fragen über Technologie, neue Schulfächer und Lernen im Jahr 2050. Ich möchte das Futur I benutzen. Bitte korrigiere meine Fehler.
      - id: mori-zukunft-hint
        type: callout
        tone: info
        lang: he
        title: דוגמאות לנושאים
        text: בתי ספר וירטואליים, רובוטים בכיתה, שיעורים חדשים, לימודים אונליין, טכנולוגיה בחינוך.
      - id: mori-lerntyp
        type: aiTutorPrompt
        title: 'Aufgabe 3: Welcher Lerntyp bin ich?'
        message: Hallo Mori! Hilf mir, über meinen Lernstil zu sprechen. Frag mich, wie ich am besten lerne und welche Erfahrungen ich gemacht habe. Bitte stelle viele Folgefragen.
      - id: mori-lerntyp-hint
        type: callout
        tone: info
        lang: he
        title: נסו להשתמש ב
        text: Perfekt, Futur I וביטויי דעה.
      - id: challenge
        type: callout
        tone: info
        lang: he
        title: אתגר B1
        text: |-
          נסו לדבר לפחות 2 דקות ברצף, בלי לעבור לעברית, במשפטים מלאים, עם לפחות:
          - 3 משפטים ב־Perfekt
          - 2 משפטים ב־Futur I
          - 2 ביטויי דעה
          דוגמאות: *Meiner Meinung nach… / Ich glaube, dass… / In Zukunft… / Früher… Heute…*
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**
    teacherNotes:
      - id: n-key-a
        anchor: part-a
        text: 'Lösungen Teil A: 1. habe, 2. haben, 3. ist, 4. habe, 5. habe, 6. haben, 7. hat, 8. bin.'
      - id: n-key-b
        anchor: part-b
        text: >-
          Lösungen Teil B: 1. werde … lernen, 2. wird … verändern, 3. werden …
          studieren, 4. werden … entwickeln, 5. werden … benutzen.
      - id: n-key-c
        anchor: part-c
        text: >-
          Lösungen Teil C: 1. Ich habe viel von meinen Lehrern gelernt. 2. Nächstes Jahr
          werde ich Deutsch in Deutschland lernen. (auch: … in Deutschland Deutsch
          lernen.) 3. Als ich ein Kind war, mochte ich die Schule nicht. (auch: … bin ich nicht gern zur Schule gegangen.) 4. In Zukunft
          werden Schulen mehr Technologie benutzen. 5. Ich habe an einem interessanten
          Gruppenprojekt teilgenommen.
      - id: n-key-d
        anchor: part-d
        text: >-
          Beispieltext Teil D: Früher mochte ich die Schule nicht so sehr. Ich habe oft
          gedacht, dass Lernen langweilig ist. Aber später habe ich einen sehr guten
          Lehrer getroffen. Er hat mich motiviert und mir geholfen. Heute lerne ich viel
          selbstständiger. Meiner Meinung nach ist Lernen sehr wichtig für das Leben. In
          Zukunft werde ich mehr Sprachen lernen. Ich glaube, dass Technologie beim
          Lernen sehr helfen wird.

