# Cycle "Künstliche Intelligenz (KI)", converted from the German level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (German).
course: de-stufe-3
slug: kuenstliche-intelligenz
title: Künstliche Intelligenz (KI)
goal: Über KI und die Zukunft diskutieren, mit dem Konjunktiv II für hypothetische Situationen und mit Präsens und Futur I für die Zukunft.
position: 12
status: published

review:
  - >-
    The two workbook exercises ("Konjunktiv II" and "Zukunft: Präsens und Futur I")
    are NEW: the notebook has no self-correcting exercises. They were written from
    the cycle's summary rules, examples, homework sentences and vocabulary. Please
    check level, wording and every right answer before students see them.
  - >-
    The classic homework (Exercise 1, Präsens oder Futur I) has NO answer key in the
    notebook. A key was written and is in a teacher note only. Note: items 1, 3, 4 and
    6 have two blanks, so they need Futur I (werden … Infinitiv), even where the
    Präsens would also be natural (item 3 "Morgen teste ich ein neues KI-Tool" is a
    plan). Item 2 (one blank, after "dass") takes "verändern wird" or "verändert";
    item 5 takes the Präsens "sprechen". Please check, or rewrite the items so that
    both forms can be chosen.
  - >-
    Summary additions (please confirm, and check the Hebrew): a Hebrew rule was added
    that most verbs form the Konjunktiv II with würde + Infinitiv, while sein, haben
    and the modal verbs use their own forms (wäre, hätte, könnte, müsste), not "würde
    sein"; "es gibt → es gäbe" was added to the list of important forms, because the
    warm-up and the homework use "gäbe". The Hebrew summary is otherwise kept as it
    is (ruleSummary blocks with lang he), with the German examples and their Hebrew
    translations.
  - >-
    Corrections: the warm-up numbering was broken (the three KI abilities were
    numbered 1–3 and the next question 4, then every question "1."): the eight
    questions are now in order, and the definition of KI is an info callout with a
    teacher note (show it after collecting ideas). The definition says "three
    abilities" and lists three. Activity 1 model prompt: "Ich würde gern viel draußen
    machen" → "viel draußen unternehmen"; "Unser Budget ist mittelgroß" → "Wir haben
    ein mittleres Budget". Broken bold marks and line breaks removed.
  - >-
    Left out: the empty "Datum / Teilnehmende" fields; the "Niveau: B1, Stufe 3 -
    anspruchsvoll" line; all "Antwort Teilnehmer/in 1/2/3" lines. The intro example
    "Ich bin Ofir" was changed to "Ich bin Lior" in case it is a real person's name.
    Activity 3 asks for "einen deutschsprachigen Podcast oder ein kurzes Video" about
    KI in police work but names no resource and gives no link: a teacher note asks
    the teacher to choose one.
  - >-
    Homework: the Hebrew instructions of Exercises 1 and 2 and of the Mori task are
    kept in Hebrew; the Mori message is unchanged (quotation marks removed). The
    final step "write one of your sentences in its corrected form" became a
    reflection box.
  - >-
    Vocabulary: "die Fähigkeit entwickeln" → "Fähigkeiten entwickeln" (it is the same
    noun as the item "die Fähigkeit"; the plural is the usual collocation); "der
    Prompt – פרומפט / הנחיה ל־AI" was ADDED (key word of Activity 1, not in the
    notebook list). Please confirm the gloss.
  - >-
    The notebook gives no times for this cycle, so no minutes are set; Activity 1
    says each person has one minute to ask the partner about travel preferences (kept
    in the steps). The Quizlet link lost its tracking parameter (?new). The
    "Breakout-Räume" (online lessons) are kept as in the notebook.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: kuenstliche-intelligenz-unterricht
    title: 'Unterricht: Künstliche Intelligenz (KI)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Künstliche Intelligenz (KI)
      - id: skills
        type: cycleOverview
        skills:
          - name: Konjunktiv II für hypothetische Situationen
            description: '*Wenn es keine KI gäbe, wäre mein Alltag anders. Wenn ich Bildungsminister wäre, würde ich …*'
          - name: 'Zukunft: Präsens und Futur I'
            description: 'Präsens für klare Pläne (*Morgen treffe ich …*), Futur I für Prognosen (*KI wird viele Berufe verändern.*)'
      - id: quizlet
        type: externalLink
        label: Künstliche Intelligenz auf Quizlet (Deutsch + Übersetzung)
        url: https://quizlet.com/il/1201495751/kunstliche-intelligenz-ki-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Vorstellungsrunde
      - id: intro
        type: sentenceFrame
        frame: Ich bin ___. Ich benutze KI jeden Tag / ein paar Mal pro Woche / fast nie.
        example: Ich bin Lior. Ich benutze KI ein paar Mal pro Woche, meistens um Wörter auf Deutsch nachzuschlagen.
      - id: warmup-title
        type: heading
        level: 3
        text: Einstiegsfragen
      - id: warmup-hint
        type: callout
        tone: info
        text: Antworte möglichst in ganzen Sätzen und benutze Formen für die **Zukunft** und den **Konjunktiv II**. Wenn du nicht über persönliche Erfahrungen sprechen möchtest, kannst du auch ein Beispiel erfinden. Wichtig ist vor allem, auf Deutsch zu sprechen und die Grammatik aktiv zu benutzen.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Was muss eine Technologie können, damit man sie als künstliche Intelligenz bezeichnen kann?
            frame: Eine Technologie muss ___ können.
          - question: Ist KI nur ChatGPT? Welche anderen KI-Programme oder Plattformen kennst oder benutzt du? Nenne ein Beispiel.
            frame: Ich kenne / benutze auch ___.
          - question: Wäre das Leben ohne KI besser oder schlechter? Nenne ein Beispiel für deine Meinung.
            frame: Ohne KI wäre das Leben ___, weil ___.
          - question: Wenn es heute keine KI gäbe, wie wäre dein Alltag anders?
            frame: Wenn es heute keine KI gäbe, würde ich ___.
          - question: Werden Regierungen KI in Zukunft stärker regulieren? Warum denkst du das?
            frame: Ich glaube, dass Regierungen KI ___ regulieren werden, weil ___.
          - question: Glaubst du, dass Menschen KI in Zukunft mehr oder weniger vertrauen werden? Begründe deine Meinung.
            frame: Ich glaube, dass Menschen KI in Zukunft ___ vertrauen werden, weil ___.
          - question: Beschreibe eine konkrete Erfahrung, die du mit KI gemacht hast. War sie hilfreich, enttäuschend, überraschend oder frustrierend? Warum?
            frame: Einmal habe ich KI benutzt, um ___. Das war ___, weil ___.
          - question: Wie wird KI deinen Beruf oder deinen Arbeitsbereich in den nächsten 5 bis 10 Jahren beeinflussen?
            frame: In den nächsten Jahren wird KI ___.
      - id: definition
        type: callout
        tone: info
        title: Was ist künstliche Intelligenz?
        text: |-
          Eine allgemeine Definition von **künstlicher Intelligenz (KI)**: Technologie, die bestimmte Fähigkeiten menschlicher Intelligenz nachahmen kann. Dafür braucht KI unter anderem drei wichtige Fähigkeiten:
          1. **Lernen:** KI kann neue Informationen sammeln und aus Daten lernen.
          2. **Probleme lösen und Schlussfolgerungen ziehen:** KI kann Informationen nutzen, um Lösungen für neue Probleme zu finden.
          3. **Natürliche Sprache verstehen:** KI kann normale menschliche Sprache verstehen, ohne dass die Person programmieren muss.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Wie schreibt man einen guten Prompt?'
        skills: ['Zukunft: Präsens und Futur I']
        steps:
          - '**Schritt 1, Einstieg:** Hast du schon einmal mit einem KI-Chatbot über deine Pläne gesprochen? Was hast du gefragt? Hast du die Antwort bekommen, die du erwartet hast?'
          - 'Wenn wir einer KI eine Aufgabe geben oder Informationen von ihr möchten, schreiben wir einen **Prompt**. Ein Prompt ist die **Anweisung oder Aufgabe**, die man einer KI gibt. Er erklärt, was man braucht und wie die KI helfen soll. Je klarer der Prompt ist, desto besser kann die KI verstehen, was wir möchten.'
          - '**Schritt 2, einen klaren Prompt schreiben:** Lies die Regeln in der Tabelle unten (allein oder mit der Lehrkraft) und besprecht sie gemeinsam.'
          - '**Schritt 3, eine Reise planen (zu zweit, Breakout-Räume):** Jede Person hat **eine Minute**, um dem Partner / der Partnerin Fragen zu seinen / ihren Reisevorlieben zu stellen. Danach schreibt jede Person mit Hilfe der Regeln einen Prompt und bittet eine KI, eine ideale Kurzreise für die andere Person zu planen. Schick deinen Prompt über den Chat an die Lehrkraft.'
          - '**Schritt 4, Präsentation:** Lies vor oder fasse kurz zusammen, was die KI für die Reise geplant hat. Der Fokus liegt auf der Qualität des Prompts, nicht auf der Reise selbst.'
          - '**Schritt 5, gemeinsame Korrektur:** Die Lehrkraft wählt ein oder zwei Prompts aus und verbessert sie gemeinsam mit der Gruppe.'
        example: |-
          *„Ich verbringe im Mai ein langes Wochenende in Barcelona und möchte einen Plan für drei Tage. Ich komme am Freitagnachmittag an und fahre am Montagmorgen wieder ab.*
          *Ich würde gern kulturelle Sehenswürdigkeiten besuchen, lokales Essen probieren und auch etwas Zeit draußen verbringen. Ich möchte nicht nur sehr touristische Orte besuchen und würde lieber authentische Stadtviertel kennenlernen.*
          *Ich reise mit einem Freund, der Live-Musik liebt. Deshalb würden wir gern an einem Abend ein Konzert oder eine andere Veranstaltung besuchen. Wir haben ein mittleres Budget, deshalb möchten wir keine Luxusangebote.*
          *Bitte erstelle einen klaren Tagesplan mit Uhrzeiten, Orten und kurzen Erklärungen. Was würdest du als Alternative empfehlen, wenn das Wetter schlecht wäre?“*
      - id: act1-rules
        type: table
        caption: Ein guter Prompt sollte …
        header: [Regel, Beispiel]
        rows:
          - [
              das Ziel klar nennen,
              „Ich plane ein Wochenende in Rom und möchte einen detaillierten Reiseplan.“,
            ]
          - [
              Hintergrund und Kontext geben,
              „Ich bin drei Tage in Rom und interessiere mich besonders für Kultur und lokales Essen.“,
            ]
          - [
              Zeit und praktische Details nennen,
              „Ich komme am Freitagabend an und fahre am Montagmorgen wieder ab.“,
            ]
          - [
              persönliche Vorlieben erklären,
              „Ich würde gern viel draußen unternehmen und möchte nicht zu viel Geld ausgeben.“,
            ]
          - [
              Grenzen oder Einschränkungen nennen,
              „Ich reise mit einem begrenzten Budget und hätte gern günstige Vorschläge.“,
            ]
          - ['erklären, wer mitkommt', '„Ich reise mit einem Freund, der Live-Musik mag.“']
          - [
              ein bestimmtes Format verlangen,
              „Bitte erstelle einen Tagesplan mit Uhrzeiten und Orten.“,
            ]
      - id: act1-prompt
        type: discussionQuestions
        title: Mein Prompt
        items:
          - question: Was möchte dein Partner / deine Partnerin auf der Reise machen?
            frame: Er / Sie möchte ___. Er / Sie würde gern ___.
          - question: Schreib deinen Prompt für die KI.
            frame: Ich plane ___ und möchte ___. Ich komme ___ an. Ich würde gern ___. Bitte erstelle ___.
      - id: act2
        type: classActivity
        title: 'Aktivität 2: KI übernimmt die Arbeitswelt'
        skills: ['Zukunft: Präsens und Futur I', Konjunktiv II für hypothetische Situationen]
        steps:
          - '**Schritt 1, gemeinsames Brainstorming:** Auf der ganzen Welt verändert künstliche Intelligenz bereits verschiedene Berufe. Manche Veränderungen passieren langsam und organisiert, andere plötzlich und kontrovers. Hast du schon gesehen, dass KI Aufgaben von Menschen übernimmt? Welche Berufe werden sich deiner Meinung nach zuerst verändern? Wird dein Beruf oder dein zukünftiger Beruf davon betroffen sein?'
          - '**Schritt 2, ein Szenario auswählen (Breakout-Räume):** Jede Gruppe wählt ein Szenario, oder die Lehrkraft verteilt sie: KI ersetzt Mitarbeiter im Kundenservice. / KI ersetzt Übersetzer. / KI ersetzt Fahrer. / KI ersetzt Journalisten und Nachrichtenschreiber. / KI ersetzt persönliche Assistenten.'
          - '**Schritt 3, die Zukunft vorstellen:** Besprecht, was passieren würde, in zwei Möglichkeiten. **Langsame Veränderung:** KI übernimmt innerhalb von zehn Jahren immer mehr Aufgaben in diesem Beruf. **Plötzliche Veränderung:** KI ersetzt bereits im nächsten Jahr 80 Prozent der Menschen, die in diesem Beruf arbeiten. Benutzt die Fragen unten.'
          - '**Schritt 4, Präsentation:** Jede Gruppe präsentiert ihre Ergebnisse. Danach entscheidet die Klasse gemeinsam: Welche Entwicklung wäre am problematischsten? Welche ist am wahrscheinlichsten? Welche könnte auch positive Folgen haben?'
      - id: act2-questions
        type: discussionQuestions
        title: Die Zukunft vorstellen
        items:
          - question: Was wird KI besser machen als Menschen?
            frame: KI wird ___ besser machen, weil ___.
          - question: Was wird KI wahrscheinlich nicht besser machen?
            frame: KI wird wahrscheinlich nicht ___.
          - question: Wenn diese Veränderung in Israel passieren würde, würde sie die Gesellschaft verbessern oder große Probleme verursachen?
            frame: Wenn diese Veränderung in Israel passieren würde, würde sie ___.
          - question: Welche Folgen würde diese Veränderung haben?
            frame: Diese Veränderung würde ___.
          - question: Welche neuen Berufe könnten entstehen?
            frame: Es könnten neue Berufe wie ___ entstehen.
          - question: Was müssten Menschen neu lernen?
            frame: Menschen müssten ___ lernen.
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Kann KI Verbrechen aufklären?'
        skills: [Konjunktiv II für hypothetische Situationen, 'Zukunft: Präsens und Futur I']
        steps:
          - '**Schritt 1, einen Beitrag hören oder sehen:** Die Klasse hört einen deutschsprachigen Podcast oder sieht ein kurzes Video zum Thema KI bei Polizei und Kriminalermittlungen. Danach fasst die Gruppe die wichtigsten Punkte zusammen.'
          - 'Fragen: Was hat dich überrascht? Wird KI in Zukunft ein wichtiger Teil von Polizeiermittlungen sein? Würdest du dich wohlfühlen, wenn die Polizei KI benutzen würde, um persönliche Daten zu analysieren?'
          - '**Schritt 2, Partnerarbeit und kritisches Denken:** Besprecht zu zweit die Fragen unten.'
          - '**Schritt 3, Aussagen diskutieren:** Jedes Paar nennt zwei interessante Punkte aus seinem Gespräch. Danach liest die Lehrkraft Aussagen vor. Sag, ob du zustimmst, nicht zustimmst oder unsicher bist.'
      - id: act3-questions
        type: discussionQuestions
        title: Partnerarbeit
        items:
          - question: Warum kann KI bei Kriminalermittlungen hilfreich sein?
          - question: Welche Risiken gibt es, wenn die Polizei KI benutzt?
          - question: Wie können schnelle Datenanalysen Ermittlern helfen?
          - question: Wird KI Ermittlungen schneller machen? Was würde passieren, wenn KI einen großen Teil der Arbeit von Ermittlern übernehmen würde?
            frame: KI wird ___. Wenn KI ___ übernehmen würde, ___.
          - question: Könnte der Einsatz von KI ethische Probleme verursachen?
          - question: Sollte die Polizei stark von Technologie abhängig sein?
          - question: Wenn eine KI einen schweren Fehler machen würde, wer wäre dafür verantwortlich?
            frame: Wenn eine KI einen schweren Fehler machen würde, wäre ___ verantwortlich.
          - question: Wenn Kriminelle lernen würden, KI-Systeme zu manipulieren, was könnte die Polizei tun?
            frame: Die Polizei könnte ___.
      - id: act3-statements
        type: discussionQuestions
        title: 'Aussagen: Stimmst du zu?'
        items:
          - question: „KI wird der Justiz mehr helfen als schaden.“
            frame: Ich stimme zu / nicht zu / bin unsicher, weil ___.
          - question: „KI wird Kriminalermittlungen genauer machen als menschliche Ermittler.“
          - question: „Wenn Regierungen KI verantwortungsvoll einsetzen würden, wäre die Gesellschaft sicherer.“
          - question: „Langfristig werden die Risiken der KI-Überwachung größer sein als ihre Vorteile.“
      - id: act4
        type: classActivity
        title: 'Aktivität 4: KI und Bildung'
        skills: [Konjunktiv II für hypothetische Situationen, 'Zukunft: Präsens und Futur I']
        steps:
          - 'Künstliche Intelligenz wird immer mehr Teil unseres Alltags. Schülerinnen und Schüler benutzen bereits KI-Tools, um Informationen zu suchen, Texte zu übersetzen, Ideen zu entwickeln oder Aufgaben zu bearbeiten. In Zukunft werden viele Berufe voraussetzen, dass Menschen verstehen, wie KI funktioniert und wie man sie verantwortungsvoll benutzt.'
          - 'Einige Lehrkräfte machen sich jedoch Sorgen. Wenn Schulen KI ohne klare Regeln einsetzen würden, könnten Schülerinnen und Schüler zu abhängig von Technologie werden. Dadurch könnten wichtige Fähigkeiten wie kritisches Denken oder Kreativität schwächer werden.'
          - '**Die Frage:** Sollten Schulen junge Menschen auf eine Welt mit KI vorbereiten oder sollten sie traditionelle Lernmethoden stärker schützen? **Gruppe 1:** KI sollte in der Schule unterrichtet werden. **Gruppe 2:** KI sollte nicht in der Schule unterrichtet werden.'
          - '**Schritt 1, Argumente sammeln:** Jede Gruppe sammelt Argumente für ihre Position, auch wenn ihr persönlich nicht einverstanden seid. Findet gute Gründe und konkrete Beispiele. **Regel:** Jedes Argument enthält mindestens eine Zukunftsaussage oder einen Satz im Konjunktiv II.'
          - '**Schritt 2, Debatte:** Die Gruppen sprechen abwechselnd. Gruppe 1 nennt ein Argument, Gruppe 2 reagiert darauf. Dann nennt Gruppe 2 ein neues Argument, und Gruppe 1 reagiert darauf.'
          - '**Schritt 3, Diskussion in der Klasse:** Sprecht über die letzten Fragen unten.'
      - id: act4-prep
        type: discussionQuestions
        title: Fragen zur Vorbereitung
        items:
          - question: Wie wird KI Bildung und Arbeitsmarkt in den nächsten 10 bis 15 Jahren verändern? Welche Fähigkeiten werden Schülerinnen und Schüler brauchen?
            frame: In den nächsten Jahren wird KI ___. Schüler werden ___ brauchen.
          - question: Welche Vorteile und Risiken hätte KI-Unterricht in der Schule? Denkt an Selbstständigkeit, Kreativität, Verantwortung und zukünftige Berufe.
            frame: KI-Unterricht hätte den Vorteil, dass ___. Ein Risiko wäre, dass ___.
          - question: Wenn Schulen KI vollständig in den Unterricht integrieren würden, wie würde sich das Lernen verändern? Würden Schülerinnen und Schüler besser verstehen, weniger selbst arbeiten, abhängiger werden oder mehr Möglichkeiten bekommen?
            frame: Wenn Schulen KI vollständig integrieren würden, würden Schüler ___.
      - id: act4-discussion
        type: discussionQuestions
        title: Diskussion in der Klasse
        items:
          - question: Wenn Schülerinnen und Schüler bei allen Hausaufgaben von KI abhängig wären, wie würden sie Kreativität entwickeln?
          - question: Wenn Schulen KI komplett verbieten würden, was würden Schülerinnen und Schüler wahrscheinlich tun?
          - question: Wenn du Bildungsminister oder Bildungsministerin wärst, welche Regeln würdest du einführen?
            frame: Wenn ich Bildungsminister(in) wäre, würde ich ___.
          - question: Welche KI-Kompetenzen werden Jugendliche in Zukunft brauchen?
            frame: Jugendliche werden ___ brauchen.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: der **Konjunktiv II für hypothetische
          Situationen** (Aktivitäten 2–4) und **die Zukunft mit Präsens und Futur I**
          (Aktivitäten 1, 2 und 4). Das Heft gibt keine Zeiten an: Wähle die Aktivitäten
          nach der verfügbaren Zeit. Breakout-Räume sind für den Online-Unterricht; im
          Klassenraum arbeiten die Gruppen an eigenen Tischen.
      - id: n-intro
        anchor: intro
        text: Gib zuerst dein eigenes Beispiel.
      - id: n-warmup
        anchor: warmup
        text: >-
          Wähle aus den acht Fragen aus. Bei Frage 1: Sammelt zuerst gemeinsam Ideen und
          zeig erst danach die Definition (Kasten unter den Fragen).
      - id: n-act1
        anchor: act1
        text: >-
          Grammatikfokus: Zukunft ausdrücken (*Ich komme am Freitag an. Ich werde …*) und
          höfliche Wünsche (*Ich würde gern …, Ich hätte gern …*). Bei Schritt 5 bespricht
          ihr typische sprachliche Fehler und Möglichkeiten zur Verbesserung.
      - id: n-act2
        anchor: act2
        text: Grammatikfokus Futur I + Konjunktiv II. Achte darauf, dass die Gruppen bei der langsamen Veränderung eher Futur I (*wird übernehmen*) und bei der plötzlichen Veränderung eher Konjunktiv II (*würde verursachen*) benutzen.
      - id: n-act3
        anchor: act3
        text: >-
          Das Heft nennt keinen konkreten Podcast und kein Video und gibt keinen Link.
          Wähle vor der Stunde einen kurzen deutschsprachigen Beitrag über KI bei der
          Polizei (z. B. auf YouTube) und spiel ihn aus deinem eigenen Material vor.
      - id: n-act4
        anchor: act4
        text: Sozialform Debatte, Gruppenarbeit, Klassengespräch. Achte darauf, dass jedes Argument eine Zukunftsaussage oder einen Satz im Konjunktiv II enthält.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: kuenstliche-intelligenz-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: סיכום השיעור
      - id: rules-zukunft
        type: ruleSummary
        lang: he
        skill: 'דיבור על העתיד בגרמנית: Präsens ו־Futur I'
        rules:
          - text: 'בגרמנית אין מבנה מקביל ישיר ל־**going to** באנגלית. ברוב המקרים משתמשים ב־**Präsens** כדי לדבר על תוכנית עתידית ברורה, וב־**Futur I** בעיקר כדי להביע תחזית או ציפייה לגבי העתיד.'
          - text: '**Präsens – תוכניות ואירועים עתידיים:** כאשר ברור מההקשר או מביטוי הזמן שמדובר בעתיד, אפשר להשתמש בזמן הווה.'
            examples:
              - Morgen treffe ich meine Lehrerin. (מחר אני פוגש את המורה שלי.)
              - Nächstes Jahr führt unsere Schule einen KI-Kurs ein. (בשנה הבאה בית הספר שלנו פותח קורס בינה מלאכותית.)
              - Im September beginnen wir mit einem neuen Projekt. (בספטמבר אנחנו מתחילים פרויקט חדש.)
          - text: '**Futur I – תחזיות וציפיות.** מבנה: **werden + Infinitiv**.'
            examples:
              - KI wird in Zukunft viele Berufe verändern. (בינה מלאכותית תשנה מקצועות רבים בעתיד.)
              - Viele Menschen werden neue Fähigkeiten lernen müssen. (אנשים רבים יצטרכו ללמוד מיומנויות חדשות.)
              - Schulen werden KI häufiger benutzen. (בתי ספר ישתמשו בבינה מלאכותית בתדירות גבוהה יותר.)
          - text: 'הפועל **werden** נמצא במקום השני במשפט, והפועל המרכזי בצורת המקור נמצא בסוף.'
            examples: [Ich werde mehr mit KI arbeiten., Wir werden neue Regeln brauchen.]
      - id: werden-table
        type: table
        caption: werden + Infinitiv
        header: [Person, werden, Beispiel]
        rows:
          - [ich, werde, Ich werde mehr mit KI arbeiten.]
          - [du, wirst, Du wirst neue Fähigkeiten brauchen.]
          - [er / sie / es, wird, KI wird viele Berufe verändern.]
          - [wir, werden, Wir werden neue Regeln brauchen.]
          - [ihr, werdet, Ihr werdet mehr mit KI lernen.]
          - [sie / Sie, werden, Schulen werden KI häufiger benutzen.]
      - id: rules-konjunktiv
        type: ruleSummary
        lang: he
        skill: 'Konjunktiv II – מצבים היפותטיים'
        rules:
          - text: 'אנחנו משתמשים ב־Konjunktiv II כדי לדבר על מצבים דמיוניים, לא מציאותיים או היפותטיים בהווה ובעתיד. מבנה נפוץ: **Wenn + Konjunktiv II, Konjunktiv II**.'
            examples:
              - Wenn KI viele Arbeitsplätze ersetzen würde, würden viele Menschen neue Fähigkeiten brauchen. (אם בינה מלאכותית הייתה מחליפה מקומות עבודה רבים, אנשים רבים היו צריכים מיומנויות חדשות.)
              - Wenn ich Bildungsminister wäre, würde ich KI-Unterricht einführen. (אם הייתי שר החינוך, הייתי מכניס לימודי בינה מלאכותית.)
          - text: 'רוב הפעלים: **würde + Infinitiv** (würde lernen, würde einführen). עם sein, haben ופעלים מודאליים משתמשים בצורה הקצרה, ולא ב־würde sein / würde haben.'
          - text: 'צורות חשובות:'
            examples:
              - sein → wäre
              - haben → hätte
              - können → könnte
              - müssen → müsste
              - werden → würde
              - es gibt → es gäbe
          - text: 'דוגמאות:'
            examples:
              - Wenn ich mehr Zeit hätte, würde ich mehr über KI lernen.
              - Wenn KI zuverlässiger wäre, könnte sie Ärzten stärker helfen.
              - Wenn viele Berufe verschwinden würden, müssten Menschen sich beruflich neu orientieren.
      - id: remember
        type: callout
        tone: tip
        lang: he
        title: חשוב לזכור
        text: |-
          **Präsens** = תוכנית עתידית ברורה
          **Futur I** = תחזית לגבי העתיד
          **Konjunktiv II** = מצב היפותטי או דמיוני
    teacherNotes:
      - id: n-summary
        anchor: null
        text: >-
          Wiederhole die drei Formen mit der Gruppe und bitte um ein neues Beispiel zu
          KI für jede: einen Plan (Präsens), eine Prognose (Futur I) und eine
          hypothetische Situation (Konjunktiv II).

  # ── after class ──────────────────────────────────────────────────────────
  - slug: kuenstliche-intelligenz-hausaufgaben
    title: Hausaufgaben
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben
      - id: ex1-title
        type: heading
        level: 3
        text: '1. Zukunft: Präsens oder Futur I?'
      - id: ex1-instr
        type: text
        lang: he
        text: השלימו את המשפטים בצורה הגיונית. השתמשו ב־Präsens או Futur I.
      - id: ex1
        type: discussionQuestions
        items:
          - question: Nächstes Jahr ___ unsere Firma mehr KI-Programme ___. (benutzen)
          - question: Ich glaube, dass KI in Zukunft viele Berufe ___. (verändern)
          - question: Morgen ___ ich ein neues KI-Tool ___. (testen)
          - question: In zehn Jahren ___ viele Menschen anders ___. (arbeiten)
          - question: Nächste Woche ___ wir im Kurs über KI und Bildung. (sprechen)
          - question: Wahrscheinlich ___ KI noch wichtiger ___. (werden)
      - id: ex2-title
        type: heading
        level: 3
        text: 2. Konjunktiv II
      - id: ex2-instr
        type: text
        lang: he
        text: השלימו את המשפטים עם רעיון משלכם. נסו לכתוב לפחות משפט אחד עם **würde**, אחד עם **könnte** ואחד עם **müsste**.
      - id: ex2
        type: discussionQuestions
        items:
          - question: Wenn KI alle Übersetzer ersetzen würde, …
          - question: Wenn ich eine eigene KI entwickeln könnte, …
          - question: Wenn Schulen KI komplett verbieten würden, …
          - question: Wenn ich Bildungsminister wäre, …
          - question: Wenn es morgen keine KI mehr gäbe, …
      - id: mori-title
        type: heading
        level: 3
        text: 3. Üben mit Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere die Nachricht und schick sie ab. Mori stellt dir Fragen; beantworte alle.
      - id: mori-ki
        type: aiTutorPrompt
        title: Gespräch über künstliche Intelligenz
        message: Ich möchte mit dir über künstliche Intelligenz sprechen. Stelle mir bitte Fragen auf B1-Niveau über die Zukunft von KI, Arbeit und Bildung. Hilf mir, Präsens und Futur I für die Zukunft sowie Konjunktiv II für hypothetische Situationen zu benutzen. Stelle nach jeder Antwort eine kurze Folgefrage und korrigiere wichtige Fehler.
      - id: mori-instr
        type: text
        lang: he
        text: 'נהלו עם Mori שיחה של כ־5 עד 7 שאלות. במהלך השיחה נסו להשתמש לפחות ב־**2 משפטים על העתיד** וב־**2 משפטים עם Konjunktiv II**. בסיום בחרו משפט אחד שאמרתם במהלך השיחה וכתבו אותו בצורה המתוקנת שלו.'
      - id: corrected
        type: reflection
        prompt: Mein Satz aus dem Gespräch, in der korrigierten Form
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Plan = **Präsens** (*Morgen teste ich …*), Prognose = **Futur I** (*KI wird …*), hypothetisch = **Konjunktiv II** (*Wenn …, würde …*).
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**
    teacherNotes:
      - id: n-key
        anchor: ex1
        text: >-
          Lösungen (vom Heft nicht gegeben, bitte prüfen): 1. wird … benutzen 2.
          verändern wird (auch richtig: verändert) 3. werde … testen 4. werden … arbeiten
          5. sprechen 6. wird … werden. Wegen der zwei Lücken brauchen 1, 3, 4 und 6 das
          Futur I. Für einen klaren Plan ist auch das Präsens natürlich: *Morgen teste ich
          ein neues KI-Tool.* Übung 2 ist frei; achte auf *würde / könnte / müsste* und
          die Wortstellung (Verb am Ende des wenn-Satzes, dann Verb am Anfang des
          Hauptsatzes).

