vocabulary:
  - slug: kuenstliche-intelligenz
    title: Künstliche Intelligenz (KI)
    items: *kuenstliche-intelligenz-words

activities:
  - slug: kuenstliche-intelligenz-konjunktiv
    title: Konjunktiv II für hypothetische Situationen
    minutes: 8
    items:
      - id: waere-minister
        type: multipleChoice
        prompt: Wenn ich Bildungsminister ___, würde ich KI-Unterricht einführen.
        options:
          - { text: wäre, correct: true }
          - {
              text: bin,
              feedback: 'Das ist eine hypothetische Situation (ich bin nicht Minister). Wir brauchen den Konjunktiv II: *wäre*.',
            }
          - {
              text: würde sein,
              feedback: 'Bei *sein* benutzen wir die kurze Form *wäre*, nicht *würde sein*.',
            }
      - id: haette-zeit
        type: fillBlank
        prompt: Ergänze *haben* im Konjunktiv II.
        text: Wenn ich mehr Zeit ___, würde ich mehr über KI lernen.
        blanks: [[hätte]]
        accents: strict
      - id: formen
        type: matching
        prompt: Welche Form im Konjunktiv II passt?
        pairs:
          - [sein, wäre]
          - [haben, hätte]
          - [können, könnte]
          - [müssen, müsste]
          - [es gibt, es gäbe]
      - id: gaebe
        type: trueFalse
        prompt: 'In dem Satz *Wenn es heute keine KI gäbe, wäre mein Alltag anders.* ist *gäbe* der Konjunktiv II von *es gibt*.'
        answer: true
        feedback:
          correct: 'Richtig! *es gibt → es gäbe*: Wir sprechen über eine Situation, die nicht real ist.'
          incorrect: '*gäbe* ist der Konjunktiv II von *es gibt*. Wir sprechen über eine Situation, die nicht real ist.'
      - id: waere-koennte
        type: fillBlank
        prompt: Ergänze *sein* und *können* im Konjunktiv II.
        text: Wenn KI zuverlässiger ___, ___ sie Ärzten stärker helfen.
        blanks: [[wäre], [könnte]]
        accents: strict
      - id: muessten
        type: multipleChoice
        prompt: Wenn viele Berufe verschwinden würden, ___ Menschen sich beruflich neu orientieren.
        options:
          - { text: müssten, correct: true }
          - {
              text: müssen,
              feedback: '*müssen* ist real (Indikativ). Der Satz ist hypothetisch (*wenn … würden*): *müssten*.',
            }
          - {
              text: mussten,
              feedback: '*mussten* (ohne Umlaut) ist Präteritum, also Vergangenheit. Der Konjunktiv II hat einen Umlaut: *müssten*.',
            }
      - id: wuerde-wuerden
        type: fillBlank
        prompt: Ergänze *würde* oder *würden*.
        text: Wenn KI viele Arbeitsplätze ersetzen ___, ___ viele Menschen neue Fähigkeiten brauchen.
        blanks: [[würde], [würden]]
        wordBank: [würde, würden]
        accents: strict
      - id: ordne-alternative
        type: reorderSentence
        prompt: Ordne die Wörter zu einer Frage.
        sentence: Was würdest du als Alternative empfehlen?

  - slug: kuenstliche-intelligenz-zukunft
    title: 'Zukunft: Präsens und Futur I'
    minutes: 8
    items:
      - id: prognose
        type: multipleChoice
        prompt: Welcher Satz ist eine Prognose mit Futur I?
        options:
          - { text: KI wird in Zukunft viele Berufe verändern., correct: true }
          - {
              text: Morgen treffe ich meine Lehrerin.,
              feedback: 'Dieser Satz ist im Präsens: ein klarer Plan mit der Zeitangabe *morgen*. Futur I ist *werden* + Infinitiv.',
            }
          - {
              text: 'Wenn ich mehr Zeit hätte, würde ich mehr lernen.',
              feedback: 'Das ist der Konjunktiv II (hypothetische Situation), keine Prognose. Futur I: *KI wird … verändern*.',
            }
      - id: werden-muessen
        type: fillBlank
        prompt: Ergänze *werden* im Futur I (Prognose).
        text: Viele Menschen ___ neue Fähigkeiten lernen müssen.
        blanks: [[werden]]
      - id: plan-praesens
        type: trueFalse
        prompt: 'Für die Zukunft braucht man im Deutschen immer das Futur I. Der Satz *Morgen treffe ich meine Lehrerin.* ist also falsch.'
        answer: false
        feedback:
          correct: 'Genau! Mit einer Zeitangabe (*morgen*) ist das Präsens für einen klaren Plan richtig und sehr natürlich.'
          incorrect: 'Für klare Pläne mit einer Zeitangabe benutzen wir oft das Präsens: *Morgen treffe ich meine Lehrerin.* Das ist richtig.'
      - id: werden-arbeiten
        type: fillBlank
        prompt: Ergänze *arbeiten* im Futur I.
        text: In zehn Jahren ___ viele Menschen anders ___.
        blanks: [[werden], [arbeiten]]
      - id: wortstellung
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Ich werde mehr mit KI arbeiten., correct: true }
          - {
              text: Ich werde arbeiten mehr mit KI.,
              feedback: '*werden* steht auf Position 2, der Infinitiv am Satzende: *Ich werde mehr mit KI arbeiten.*',
            }
          - {
              text: Ich mehr mit KI arbeiten werde.,
              feedback: 'Im Hauptsatz steht *werden* auf Position 2: *Ich werde mehr mit KI arbeiten.*',
            }
      - id: sprechen-praesens
        type: fillBlank
        prompt: Ergänze *sprechen* im Präsens (ein klarer Plan).
        text: Nächste Woche ___ wir im Kurs über KI und Bildung.
        blanks: [[sprechen]]
      - id: werden-formen
        type: matching
        prompt: Welche Form von *werden* passt?
        pairs:
          - [ich, werde]
          - [du, wirst]
          - [er / sie / es, wird]
          - [wir, werden]
          - [ihr, werdet]
      - id: ordne-regeln
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz.
        sentence: Wir werden neue Regeln brauchen.
