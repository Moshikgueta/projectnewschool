vocabulary:
  - slug: kueche-und-restaurants
    title: Küche und Restaurants
    items: *kueche-und-restaurants-words

activities:
  - slug: kueche-und-restaurants-perfekt
    title: 'Perfekt: Erfahrungen mit Essen'
    minutes: 8
    items:
      - id: habe-probiert
        type: multipleChoice
        prompt: Ich ___ noch nie indisches Essen probiert.
        options:
          - { text: habe, correct: true }
          - {
              text: bin,
              feedback: '*probieren* ist kein Verb der Bewegung: Das Perfekt bilden wir mit *haben*: *Ich habe probiert.*',
            }
          - { text: hat, feedback: '*hat* ist für *er / sie / es*. Für *ich* sagen wir *habe*.' }
      - id: hat-gebracht
        type: fillBlank
        prompt: Ergänze das Verb *bringen* im Perfekt.
        text: Der Kellner ___ uns die Speisekarte ___.
        blanks: [[hat], [gebracht]]
      - id: partizip-paare
        type: matching
        prompt: Welches Partizip II passt zu welchem Verb?
        pairs:
          - [essen, gegessen]
          - [bestellen, bestellt]
          - [probieren, probiert]
          - [finden, gefunden]
          - [zurückschicken, zurückgeschickt]
      - id: zurueckgeschickt
        type: multipleChoice
        prompt: Ich habe schon einmal ein Gericht ___.
        options:
          - { text: zurückgeschickt, correct: true }
          - {
              text: gezurückschickt,
              feedback: 'Bei trennbaren Verben steht *-ge-* in der Mitte: *zurück-ge-schickt*.',
            }
          - {
              text: zurückschickt,
              feedback: 'Das Partizip II braucht *-ge-*: Bei trennbaren Verben steht es in der Mitte: *zurückgeschickt*.',
            }
      - id: sind-geworden
        type: fillBlank
        prompt: Ergänze das Verb *werden* im Perfekt.
        text: Kunden ___ anspruchsvoller ___.
        blanks: [[sind], [geworden]]
      - id: seit-praesens
        type: trueFalse
        prompt: 'Der Satz *Dieses Restaurant serviert seit 1998 koschere Gerichte.* ist richtig.'
        answer: true
        feedback:
          correct: 'Richtig! Das Restaurant serviert heute noch koschere Gerichte: Mit *seit* benutzen wir das Präsens.'
          incorrect: 'Der Satz ist richtig: Für etwas, das heute noch gilt, benutzen wir mit *seit* das Präsens, nicht das Perfekt.'
      - id: vegetarier
        type: multipleChoice
        prompt: 'Du bist heute noch Vegetarier. Welcher Satz ist richtig?'
        options:
          - { text: Ich bin seit fünf Jahren Vegetarier., correct: true }
          - {
              text: Ich bin seit fünf Jahren Vegetarier gewesen.,
              feedback: 'Das gilt heute noch: Mit *seit* benutzen wir das Präsens: *Ich bin seit fünf Jahren Vegetarier.*',
            }
          - {
              text: Ich bin für fünf Jahre Vegetarier.,
              feedback: 'Auf Deutsch sagen wir *seit* (nicht *für*), wenn etwas heute noch gilt: *seit fünf Jahren*.',
            }
      - id: ordne-restaurant
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Wir haben gestern im Restaurant gegessen.

  - slug: kueche-und-restaurants-modalverben
    title: Modalverben
    minutes: 8
    items:
      - id: solltest
        type: multipleChoice
        prompt: Du ___ dieses Gericht probieren. Es ist fantastisch!
        options:
          - { text: solltest, correct: true }
          - {
              text: sollte,
              feedback: 'Modalverben ändern sich nach der Person: Für *du* sagen wir *solltest*.',
            }
          - {
              text: sollten,
              feedback: '*sollten* ist für *wir / sie / Sie*. Für *du* sagen wir *solltest*.',
            }
      - id: gleiche-form
        type: trueFalse
        prompt: Modalverben haben für alle Personen dieselbe Form.
        answer: false
        feedback:
          correct: 'Genau! Modalverben ändern sich: *ich sollte, du solltest, wir sollten*. Nur *ich* und *er / sie / es* haben dieselbe Form.'
          incorrect: 'Auf Deutsch ändern sich Modalverben nach der Person: *ich sollte, du solltest, wir sollten*.'
      - id: infinitiv-ende
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Du solltest nach den Zutaten fragen., correct: true }
          - {
              text: Du solltest fragst nach den Zutaten.,
              feedback: 'Nach einem Modalverb steht der Infinitiv (*fragen*), und er steht am Satzende.',
            }
          - {
              text: Du solltest nach den Zutaten fragst.,
              feedback: 'Am Satzende steht der Infinitiv: *fragen*, nicht *fragst*.',
            }
      - id: darf
        type: fillBlank
        prompt: Ergänze *dürfen* in der richtigen Form.
        text: Man ___ kein verdorbenes Essen servieren.
        blanks: [[darf]]
      - id: bedeutung
        type: matching
        prompt: Was drückt der Satz aus?
        pairs:
          - [Du musst dieses Gericht vermeiden., Pflicht]
          - [Du solltest die Spezialität des Hauses probieren., Rat]
          - [Dieses Gericht könnte Milch enthalten., Möglichkeit]
          - [Kann ich meine Bestellung ändern?, Bitte]
      - id: muessen
        type: fillBlank
        prompt: Ergänze *müssen* in der richtigen Form.
        text: Menschen mit Allergien ___ vorsichtig sein.
        blanks: [[müssen]]
      - id: kunden-sollten
        type: multipleChoice
        prompt: Kunden ___ höflich mit Kellnern sprechen.
        options:
          - { text: sollten, correct: true }
          - { text: sollte, feedback: '*Kunden* ist Plural (= sie): Wir sagen *sollten*.' }
          - {
              text: solltet,
              feedback: '*solltet* ist für *ihr*. Für *Kunden* (= sie) sagen wir *sollten*.',
            }
      - id: ordne-hoeflich
        type: reorderSentence
        prompt: Ordne die Wörter zu einer höflichen Bitte.
        sentence: Könnten Sie mir die Speisekarte bringen?
