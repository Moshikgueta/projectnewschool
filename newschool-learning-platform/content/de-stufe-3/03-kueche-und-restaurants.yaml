# Cycle "Küche und Restaurants", converted from the German level 3 digital notebook
# ("German Level 3- Digital Notebook", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (German).
course: de-stufe-3
slug: kueche-und-restaurants
title: Küche und Restaurants
goal: Mit dem Perfekt über Erfahrungen mit Essen und Restaurants sprechen und mit Modalverben Rat, Pflicht und Möglichkeiten ausdrücken.
position: 3
status: published

review:
  - >-
    The two workbook exercises ("Perfekt: Erfahrungen mit Essen" and "Modalverben")
    are NEW: the notebook has no self-correcting exercises. They were written from the
    cycle's summary rules (as corrected below), the classic homework, the activity
    examples and the vocabulary. Please check level, wording and every right answer
    before students see them.
  - >-
    Summary, rules translated from the English notebook and WRONG for German,
    rewritten in Hebrew (please check the Hebrew): (1) "Perfekt is used for
    experiences without saying when; to say when, use the Präteritum" (English
    present perfect rule): in German the Perfekt is the normal spoken past, also with
    gestern / letztes Jahr; the Präteritum is mostly written, and spoken with
    war / hatte / modal verbs. (2) "States that started in the past and are still true
    use the Perfekt": in German they use the PRÄSENS with seit / schon lange. Examples
    fixed: "Dieses Restaurant hat seit 1998 koschere Gerichte serviert." → "Dieses
    Restaurant serviert seit 1998 koschere Gerichte."; "Ich bin seit langer Zeit
    Vegetarier gewesen." → "Ich bin schon lange Vegetarier."; "Er hat zehn Jahre als
    Koch gearbeitet." is kept as a finished period, next to "Er arbeitet seit zehn
    Jahren als Koch."
  - >-
    Summary, more Perfekt fixes: (3) the heading "For / Since בגרמנית" (English) →
    "seit und schon lange", with seit + Präsens. (4) "Sometimes the Partizip II is very different
    from the normal past form" (English past participle idea) → rules for German:
    ge-…-t / ge-…-en, no ge- with be- / ver- / -ieren (bestellt, probiert), -ge- in
    separable verbs (zurückgeschickt).
  - >-
    Summary, Modalverben: "Modalverben do not change with the person" (English modal
    rule) is WRONG: German modal verbs are conjugated (ich sollte, du solltest, wir
    sollten…); only ich and er / sie / es share a form. Rewritten, and a conjugation
    table was ADDED. The rule "after a modal verb comes the infinitive" now adds "at
    the end of the sentence". In the table, "mögen / könnten – uncertainty" (English
    "may") → only "könnte" (mögen in this sense is rare and formal); "sollten /
    könnten / würden" are labelled as Konjunktiv II forms of sollen / können / werden;
    rows for dürfen and wollen (used in the homework) were ADDED. Please confirm.
  - >-
    Warm-up corrections: "Ich habe den Hühnersuppe" → "die Hühnersuppe"; "einen
    Baskischen Käsekuchen" → "baskischen" (adjective, lower case); "Ich habe schon
    immer … backen wollen, aber mein Ofen ist nicht gut genug gewesen" → "Ich wollte
    schon immer … backen, aber mein Ofen war nicht gut genug" (modal verbs and sein in
    the Präteritum, as the summary says); question 5 "Was ist das schwierigste Rezept
    gewesen" → "Was war das schwierigste Rezept"; its model "ist selbstgemachte
    Ravioli gewesen, weil der Teig sehr kompliziert gewesen ist" → "waren
    selbstgemachte Ravioli, weil der Teig sehr kompliziert war" (Ravioli is plural).
    The model answers are given as sentence frames for the students and in full in a
    teacher note.
  - >-
    Activity corrections: Activity 3 customer question "Might dieses Gericht Butter
    enthalten?" (English word) → "Könnte dieses Gericht Butter enthalten?"; Activity 1
    example questions about people in general ("Haben Menschen dieses Essen oft im
    Winter gegessen?", "Haben Menschen in Japan etwas Ähnliches gegessen?") and the
    non-yes/no "Ist das Gericht scharf oder eher mild gewesen?" → questions to the
    student in the Perfekt ("Hast du dieses Essen oft im Winter gegessen?", "Hast du
    so etwas schon einmal in einem japanischen Restaurant gegessen?", "Ist das Gericht
    scharf gewesen?"). Stray "**" marks and broken headings were removed.
  - >-
    Classic homework: kept in the homework section, with the answer key and sample
    answers ONLY in teacher notes. Fixes: Part 1 item 3 "das Menü" (= a set menu) →
    "die Speisekarte"; item 7 "Sie ___ die Suppe zu salzig gefunden" can be "hat"
    (she) or "haben" (they / you formal), the key gave only "haben": both are accepted
    in the note. Part 2: the key's note on several possible answers is kept and
    extended (2. müssen / sollten, 3. Könnte / Kann / Darf, 4. wollen / könnten).
    Part 4: "הזמנה" can also be "die Bestellung" (an order); the key says "die
    Reservierung" (of a table) — both are accepted in the note.
  - >-
    Homework with Mori: the source has ONE message and two tasks (dream restaurant,
    restaurant critic) in Hebrew; the message is kept once in German, the two tasks
    are Hebrew callouts with their German examples.
  - >-
    Title: "Küche & Restaurants" → "Küche und Restaurants" (as requested for the
    file). Left out: "Level: 3 (extreme)", the "Datum / Teilnehmer" lines, the
    "Antwort von Student 1/2/3" lines. The Quizlet link lost its "?new" parameter. The
    source gives no times for this cycle.
  - >-
    Vocabulary: "würzig – מתובל / חריף" → "מתובל / עשיר בתבלינים" (würzig is not
    "scharf"); "die Erfahrung – חוויה" → "חוויה / ניסיון". Please confirm. "die
    Würzung" is kept as in the source (more common: die Würze).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: kueche-und-restaurants-unterricht
    title: 'Unterricht: Küche und Restaurants'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Küche und Restaurants
      - id: skills
        type: cycleOverview
        skills:
          - name: 'Perfekt: Erfahrungen mit Essen'
            description: '*Ich habe noch nie in einem veganen Restaurant gegessen. Hast du schon einmal ein Gericht zurückgeschickt?*'
          - name: Modalverben
            description: 'Rat, Pflicht, Möglichkeit und Höflichkeit: *Du solltest … probieren. Sie müssen … vermeiden. Könnten Sie …?*'
      - id: quizlet
        type: externalLink
        label: Küche und Restaurants auf Quizlet
        url: https://quizlet.com/br/1182860199/kuche-restaurants-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Einführungsrunde
      - id: intro
        type: sentenceFrame
        frame: Ich heiße ___. Am Freitagabend isst meine Familie normalerweise ___.
        example: Ich heiße Noa. Am Freitagabend isst meine Familie normalerweise Hühnersuppe und Reis.
      - id: warmup-title
        type: heading
        level: 3
        text: Aufwärmfragen
      - id: warmup-hint
        type: callout
        tone: info
        text: Antworte in **ganzen Sätzen** und benutze das **Perfekt**.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Welche Küche hast du probiert, die jeder mindestens einmal probieren sollte? Warum?
            frame: Ich habe ___ probiert, und ich finde, dass jeder es mindestens einmal probieren sollte, weil ___.
          - question: Hast du schon einmal etwas Ungewöhnliches gegessen, das du ohne andere Leute wahrscheinlich nie probiert hättest?
            frame: Ich habe ___ gegessen, aber allein hätte ich es wahrscheinlich nie bestellt.
          - question: Welches Gericht wolltest du schon immer kochen, hast es aber noch nicht geschafft?
            frame: Ich wollte schon immer ___ backen / kochen, aber ___.
          - question: Welches traditionelle Essen aus deiner Kindheit hast du nie vergessen?
            frame: Ich habe ___ nie vergessen, weil ___.
          - question: Was war das schwierigste Rezept, das du jemals gekocht oder gebacken hast?
            frame: Das schwierigste Rezept, das ich jemals gekocht habe, war ___, weil ___.
          - question: Welche internationale Küche sollten Restaurants in Israel häufiger anbieten? Warum?
            frame: Ich finde, dass Restaurants in Israel häufiger ___ anbieten sollten, weil ___.
          - question: Welches Essen hast du probiert und möchtest es nie wieder essen?
            frame: Ich habe einmal ___ probiert, aber ich möchte es nie wieder essen, weil ___.
          - question: Welches Essen könnte das Nationalgericht Israels sein? Warum?
            frame: Ich denke, dass ___ das Nationalgericht Israels sein könnte, weil ___.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Hast du schon mein Lieblingsessen probiert?'
        skills: ['Perfekt: Erfahrungen mit Essen']
        steps:
          - Denk an ein Lieblingsessen (dein *Comfort Food*) und schick es anonym an die Lehrkraft.
          - 'Ein Schüler beschreibt das Essen indirekt. Die anderen stellen **Ja-/Nein-Fragen im Perfekt**, um das Essen zu erraten.'
        example: |-
          *Hast du dieses Gericht schon einmal in einem Restaurant gegessen?*
          *Hast du dieses Essen oft im Winter gegessen?*
          *Ist das Gericht scharf gewesen?*
          *Hast du so etwas schon einmal in einem japanischen Restaurant gegessen?*
          *Hast du dieses Essen bei einem Familienfest gegessen?*
      - id: act1-info
        type: callout
        tone: info
        title: Comfort Food
        text: '*Comfort Food* ist Essen, das Menschen glücklich oder entspannt macht.'
      - id: act1-questions
        type: discussionQuestions
        title: Meine Fragen im Perfekt
        items:
          - question: Frage 1
            frame: Hast du dieses Gericht schon einmal ___ gegessen?
          - question: Frage 2
            frame: Ist das Gericht ___ gewesen?
          - question: Frage 3
            frame: Hast du dieses Essen ___?
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Restaurantkritik'
        skills: [Modalverben]
        steps:
          - 'Denkt an ein Restaurant oder eine Fast-Food-Kette, die ihr besucht habt. Wählt ein Restaurant aus und schreibt kurze Notizen: *Was hat euch gefallen? Was hat euch nicht gefallen? Was sollte sich ändern? Was sollte gleich bleiben?*'
          - Diskutiert mit euren Partnern die Fragen unten und benutzt Modalverben.
          - 'Erstellt einen **„Top-5-Verbesserungsplan“** mit verschiedenen Modalverben.'
        example: |-
          *1. Das Restaurant sollte den Geräuschpegel reduzieren.*
          *2. Das Restaurant könnte modernere Möbel kaufen.*
          *3. Es müsste schnelleren Service anbieten.*
          *4. Die Speisekarte sollte mehr vegane Optionen enthalten.*
          *5. Das Restaurant könnte saisonale Gerichte anbieten.*
      - id: act2-questions
        type: discussionQuestions
        title: Fragen zur Diskussion
        items:
          - question: Was sollte das Restaurant verbessern?
            frame: Das Restaurant sollte ___.
          - question: Was sollte es nicht verändern?
            frame: Es sollte ___ nicht verändern.
          - question: Was könnte mehr Kunden anziehen?
            frame: ___ könnte mehr Kunden anziehen.
          - question: Welche Änderungen könnten das Restaurant erfolgreicher machen?
            frame: Wenn das Restaurant ___, könnte es erfolgreicher sein.
          - question: Was würde euch dazu bringen, öfter zurückzukommen?
            frame: Wir würden öfter zurückkommen, wenn ___.
      - id: act2-plan
        type: discussionQuestions
        title: Unser Top-5-Verbesserungsplan
        items:
          - question: '1.'
            frame: Das Restaurant sollte ___.
          - question: '2.'
            frame: Das Restaurant könnte ___.
          - question: '3.'
            frame: Es müsste ___.
          - question: '4.'
          - question: '5.'
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Rollenspiel: Kann ich etwas Passendes bestellen?'
        skills: ['Perfekt: Erfahrungen mit Essen', Modalverben]
        steps:
          - 'Spielt reale Restaurant-Situationen nach, zu zweit: ein Kunde, ein Kellner.'
          - '**Rollen für den Kunden:** veganer Kunde, koscherer Kunde, vegetarischer Kunde, Kunde mit Allergien. **Ziel des Kunden:** ein sicheres und leckeres Gericht bestellen.'
          - '**Ziel des Kellners:** die Zutaten erklären und passende Empfehlungen geben.'
          - Tauscht die Rollen.
        example: |-
          *Kunde: Könnten Sie mir sagen, ob dieses Gericht Nüsse enthält?*
          *Kellner: Sie sollten dieses Gericht vermeiden, weil es Nüsse enthält.*
          *Kunde: Würden Sie etwas Veganes empfehlen?*
          *Kellner: Sie könnten den gegrillten Gemüseteller probieren.*
      - id: act3-phrases
        type: table
        caption: Beispielsätze
        header: [Kunde, Kellner]
        rows:
          - [
              'Könnten Sie mir sagen, ob dieses Gericht Nüsse enthält?',
              'Sie sollten dieses Gericht vermeiden, weil es Nüsse enthält.',
            ]
          - [
              Ich habe früher Probleme mit diesem Gericht gehabt.,
              Sie könnten den gegrillten Gemüseteller probieren.,
            ]
          - [Würden Sie etwas Veganes empfehlen?, Der Koch könnte das Gericht anpassen.]
          - [
              Könnte dieses Gericht Butter enthalten?,
              Wir haben schon glutenfreie Pasta vorbereitet.,
            ]
          - ['', Wir müssen bei Allergien sehr vorsichtig sein.]
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Debatte: Sollte man Essen zurückschicken?'
        skills: [Modalverben, 'Perfekt: Erfahrungen mit Essen']
        steps:
          - '*Sollten Kunden Essen im Restaurant zurückschicken dürfen? Was passiert, wenn einem das Essen nicht schmeckt? Hast du das schon einmal gemacht? Was sollte der Kunde tun? Welche Verantwortung sollte das Restaurant haben?*'
          - '**Gruppe A:** „Es ist normal und wichtig, Essen zurückzuschicken.“ **Gruppe B:** „Man sollte ein bestelltes Gericht niemals zurückschicken!“'
          - '**Gruppenarbeit:** Sammelt Argumente für die Meinung eurer Gruppe. Jedes Argument muss mindestens ein Modalverb oder das Perfekt enthalten. Baut persönliche Erfahrungen oder Beispiele ein. Punkte: die Art des Restaurants (elegant, locker, Take-away), kulturelle Normen in verschiedenen Ländern (Beispiele im Perfekt), Gründe, Essen zurückzuschicken, Kundenservice und die Verantwortung des Restaurants.'
          - '**Debatte:** Jede Gruppe präsentiert immer nur ein Argument: Gruppe A präsentiert ein Argument, Gruppe B antwortet; Gruppe B präsentiert ein Argument, Gruppe A antwortet.'
          - '**Gemeinsame Diskussion** mit den Fragen unten.'
        example: |-
          *Gruppe A: Ich habe einmal ein kaltes Gericht zurückgeschickt, und der Kellner hat sich entschuldigt. Ein Restaurant sollte guten Service anbieten.*
          *Gruppe B: Man sollte zuerst fragen, was im Gericht ist. Dann muss man nichts zurückschicken.*
      - id: act4-questions
        type: discussionQuestions
        title: Diskussionsfragen
        items:
          - question: Wie sollten Restaurants guten Kundenservice anbieten und gleichzeitig unnötige Lebensmittelverschwendung vermeiden?
            frame: Restaurants sollten ___.
          - question: Welche kulturellen Normen zum Zurückschicken von Essen sollten sich deiner Meinung nach verändern oder nicht verändern?
            frame: Meiner Meinung nach sollte sich ___ (nicht) verändern, weil ___.
          - question: Welche Regeln oder Richtlinien könnten Kunden und Restaurantmitarbeitern helfen, Beschwerden respektvoller und effektiver zu lösen?
            frame: Eine Regel könnte sein, dass ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: **Perfekt: Erfahrungen mit Essen**
          (Aufwärmfragen, Aktivitäten 1, 3 und 4) und **Modalverben** (Aktivitäten 2, 3
          und 4). Das Heft gibt für diesen Zyklus keine Zeiten an; wähle die Aktivitäten
          nach Zeit und Gruppe.
      - id: n-intro
        anchor: intro
        text: Gib zuerst dein eigenes Beispiel.
      - id: n-warmup
        anchor: warmup
        text: >-
          Wähle bis zu 8 Fragen aus. Musterantworten: 1. Ich habe äthiopisches Essen
          probiert, und ich finde, dass jeder es mindestens einmal probieren sollte, weil
          die Gewürze sehr interessant sind. 2. Ich habe Kaninchen gegessen, aber allein
          hätte ich es wahrscheinlich nie bestellt. 3. Ich wollte schon immer einen
          baskischen Käsekuchen backen, aber mein Ofen war nicht gut genug. 4. Ich habe
          die Hühnersuppe meiner Großmutter nie vergessen, weil meine Familie sie jeden
          Freitagabend gekocht hat. 5. Das schwierigste Rezept, das ich jemals gekocht
          habe, waren selbstgemachte Ravioli, weil der Teig sehr kompliziert war. 6. Ich
          finde, dass Restaurants in Israel häufiger koreanisches Essen anbieten sollten,
          weil viele Gerichte sehr würzig und interessant sind. 7. Ich habe einmal
          Austern probiert, aber ich möchte sie nie wieder essen, weil ich die Konsistenz
          nicht gemocht habe. 8. Ich denke, dass Falafel das Nationalgericht Israels sein
          könnte, weil viele Menschen es essen und es im ganzen Land sehr beliebt ist.
      - id: n-act1
        anchor: act1
        text: >-
          Grammatikfokus: Perfekt. Die Schüler schicken dir ihr Lieblingsessen anonym
          (z. B. im Chat). Ein Schüler beschreibt ein Essen indirekt; die anderen raten
          nur mit Ja-/Nein-Fragen im Perfekt. Bei *sein* ist auch *War das Gericht
          scharf?* richtig.
      - id: n-act2
        anchor: act2
        text: 'Grammatikfokus: Modalverben. Achte auf die Formen *sollte, könnte, müsste* (Konjunktiv II) für höfliche Vorschläge.'
      - id: n-act3
        anchor: act3
        text: 'Grammatikfokus: Perfekt + Modalverben. Verteile die Kundenrollen; der Kellner erklärt Zutaten und gibt Empfehlungen.'
      - id: n-act4
        anchor: act4
        text: 'Grammatikfokus: Modalverben + Perfekt. Teile die Klasse in zwei Gruppen. Zum Schluss gemeinsame Diskussion mit den drei Fragen.'

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: kueche-und-restaurants-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: rules-perfekt
        type: ruleSummary
        lang: he
        skill: 'Perfekt: Erfahrungen mit Essen'
        rules:
          - text: 'ה־**Perfekt** הוא זמן העבר הרגיל בדיבור בגרמנית. משתמשים בו כדי לדבר על חוויות, וגם כשאומרים בדיוק מתי משהו קרה (gestern, letztes Jahr). ה־Präteritum נפוץ בעיקר בכתיבה, ובדיבור עם war, hatte ופעלים מודאליים (wollte, konnte).'
            examples:
              - Ich habe noch nie in einem veganen Restaurant gegessen. – מעולם לא אכלתי במסעדה טבעונית.
              - Hast du schon einmal ein Gericht zurückgeschickt? – האם אי פעם החזרת מנה במסעדה?
              - Ich habe Sushi probiert, aber ich habe es noch nie in Israel bestellt. – ניסיתי סושי, אבל אף פעם לא הזמנתי אותו בישראל.
              - Wir haben gestern in einem italienischen Restaurant gegessen.
          - text: 'משתמשים ב־Perfekt גם כדי לדבר על שינויים, מגמות והתפתחויות בעולם האוכל והמסעדות. מילות זמן נפוצות: **in den letzten Jahren** (בשנים האחרונות), **in letzter Zeit** (לאחרונה), **in den letzten Monaten** (בחודשים האחרונים).'
            examples:
              - Viele Menschen haben angefangen, Essen online zu bestellen. – הרבה אנשים התחילו להזמין אוכל באינטרנט.
              - Restaurants sind allergiefreundlicher geworden. – מסעדות הפכו לידידותיות יותר לאנשים עם אלרגיות.
              - Kunden sind anspruchsvoller geworden. – לקוחות הפכו לתובעניים יותר.
          - text: 'מבנה: **haben / sein + Partizip II** (בסוף המשפט). רוב הפעלים עם haben; פעלי תנועה ושינוי מצב (gehen, fahren, werden) עם sein.'
          - text: '**איך בונים Partizip II:** פעלים רגילים: **ge-…-t**; פעלים לא רגילים: **ge-…-en**, לפעמים עם שינוי תנועה. בלי ge- בפעלים עם be- / ver- ובפעלים שמסתיימים ב־-ieren. בפעלים נפרדים ge- באמצע.'
            examples:
              - machen → gemacht, wählen → gewählt, kochen → gekocht
              - essen → gegessen, finden → gefunden, bringen → gebracht
              - bestellen → bestellt, probieren → probiert, servieren → serviert
              - zurückschicken → zurückgeschickt
          - text: '**מצבים שנמשכים עד היום:** בגרמנית משתמשים כאן ב־**Präsens** עם **seit** או **schon lange** (לא ב־Perfekt!). ה־Perfekt הוא לדברים שהסתיימו.'
            examples:
              - Dieses Restaurant serviert seit 1998 koschere Gerichte. – המסעדה הזאת מגישה אוכל כשר מאז 1998.
              - Ich bin schon lange Vegetarier. – אני צמחוני כבר הרבה זמן.
              - Er arbeitet seit zehn Jahren als Koch. – הוא עובד כטבח כבר עשר שנים (ועדיין עובד).
              - Er hat zehn Jahre als Koch gearbeitet. – הוא עבד כטבח עשר שנים (וזה נגמר).
          - text: '**seit ו־schon lange:** seit + נקודת זמן או תקופה (seit 2020, seit März, seit vielen Jahren); **schon lange** = כבר הרבה זמן. עם שניהם הפועל ב־Präsens.'
            examples: [Ich esse seit März kein Fleisch., Wir kennen dieses Restaurant schon lange.]
      - id: rules-modal
        type: ruleSummary
        lang: he
        skill: Modalverben
        rules:
          - text: 'משתמשים ב־**Modalverben** כדי להביע עצה, חובה, אפשרות, נימוס והמלצה.'
            examples:
              - Du solltest die Spezialität des Hauses probieren. – כדאי לך לנסות את המנה המיוחדת של הבית.
              - Du musst dieses Gericht vermeiden. – אתה חייב להימנע מהמנה הזאת.
              - Du könntest die vegetarische Option wählen. – אתה יכול לבחור באופציה הצמחונית.
              - Würden Sie gern die Dessertkarte sehen? – האם תרצה לראות את תפריט הקינוחים?
          - text: '**חוק חשוב:** אחרי Modalverb תמיד מגיע פועל בצורת מקור (**Infinitiv**), והוא עומד **בסוף המשפט**.'
            examples:
              - 'נכון: Du solltest nach den Zutaten fragen.'
              - 'לא נכון: Du solltest fragst.'
          - text: '**Modalverben משתנים לפי הגוף** (לא כמו באנגלית): ich sollte, du solltest, wir sollten. רק ל־ich ול־er / sie / es יש אותה צורה, בלי סיומת.'
            examples:
              - Ich sollte das Gericht zurückschicken.
              - Er sollte das Gericht zurückschicken.
              - Sie sollten das Gericht zurückschicken.
              - Du solltest das Gericht zurückschicken.
          - text: '**sollte, könnte, müsste, würde** הן צורות Konjunktiv II (של sollen, können, müssen, werden): הן מנומסות ועדינות יותר.'
            examples: [Du sollst … → Du solltest …, Kann ich …? → Könnte ich …?]
      - id: modal-table
        type: table
        caption: Wichtige Modalverben für diese Stunde
        header: [Modalverb, שימוש, Beispiel]
        rows:
          - [müssen, חובה חזקה, Du musst dieses Gericht vermeiden.]
          - [dürfen / nicht dürfen, רשות / איסור, Man darf kein verdorbenes Essen servieren.]
          - [wollen, רצון / תוכנית, Wir wollen heute Abend asiatisch essen gehen.]
          - [können, בקשה / רשות, Kann ich meine Bestellung ändern?]
          - [sollte (sollen), עצה / המלצה, Du solltest das Gericht zurückschicken.]
          - [könnte (können), אפשרות / הצעה עדינה, Du könntest die vegetarische Option probieren.]
          - [könnte (können), חוסר ודאות, Dieses Gericht könnte Milch enthalten.]
          - [würde (werden), נימוס / המלצה, Ich würde die Suppe empfehlen.]
      - id: modal-forms
        type: table
        caption: Formen der Modalverben
        header: [Person, müssen, können, dürfen, wollen, sollte, könnte]
        rows:
          - [ich, muss, kann, darf, will, sollte, könnte]
          - [du, musst, kannst, darfst, willst, solltest, könntest]
          - [er / sie / es / man, muss, kann, darf, will, sollte, könnte]
          - [wir, müssen, können, dürfen, wollen, sollten, könnten]
          - [ihr, müsst, könnt, dürft, wollt, solltet, könntet]
          - [sie / Sie, müssen, können, dürfen, wollen, sollten, könnten]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die zwei Fertigkeiten. Bitte jeden Schüler um eine Erfahrung im Restaurant im Perfekt und um einen Rat mit *sollte / könnte / müssen*.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: kueche-und-restaurants-hausaufgaben
    title: Hausaufgaben
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben
      - id: classic-title
        type: heading
        level: 3
        text: 'Klassische Hausaufgaben: Essen, Restaurants, Perfekt und Modalverben'
      - id: part1-example
        type: callout
        tone: info
        lang: he
        title: חלק 1 – Perfekt
        text: |-
          השלימו את המשפטים ב־Perfekt.
          דוגמה: *Ich ___ Sushi ___. (haben / essen)* → *Ich habe Sushi gegessen.*
      - id: part1
        type: discussionQuestions
        items:
          - question: Wir ___ gestern in einem italienischen Restaurant ___. (haben / essen)
          - question: Meine Freunde ___ eine Reservierung ___. (haben / machen)
          - question: Der Kellner ___ uns die Speisekarte ___. (haben / bringen)
          - question: Ich ___ noch nie indisches Essen ___. (haben / probieren)
          - question: Meine Familie ___ oft zusammen ___. (haben / kochen)
          - question: Das Restaurant ___ veganes Essen ___. (haben / servieren)
          - question: Sie ___ die Suppe zu salzig ___. (haben / finden)
          - question: Ich ___ schon einmal ein Gericht ___. (haben / zurückschicken)
      - id: part2-rules
        type: callout
        tone: info
        lang: he
        title: חלק 2 – Modalverben
        text: |-
          השלימו את המשפטים עם פועל מודאלי מתאים (בצורה הנכונה).
          *müssen / sollten / könnten / dürfen / wollen*
      - id: part2
        type: discussionQuestions
        items:
          - question: Du ___ dieses Gericht probieren. Es ist fantastisch!
          - question: Menschen mit Allergien ___ vorsichtig sein.
          - question: ___ ich bitte die Rechnung bekommen?
          - question: Wir ___ heute Abend asiatisch essen gehen.
          - question: Das Restaurant ___ mehr vegetarische Optionen anbieten.
          - question: Kunden ___ höflich mit Kellnern sprechen.
          - question: Man ___ kein verdorbenes Essen servieren.
      - id: part3
        type: discussionQuestions
        lang: he
        title: חלק 3 – כתיבה. ענו על השאלות ב־4–5 משפטים מלאים.
        items:
          - question: Was ist das beste Restaurant, in dem du jemals gegessen hast?
          - question: Hast du schon einmal Essen zurückgeschickt? Warum?
          - question: Welche Küche möchtest du noch probieren?
          - question: Was sollte ein gutes Restaurant haben?
      - id: part4
        type: discussionQuestions
        lang: he
        title: חלק 4 – אוצר מילים. תרגמו לגרמנית.
        items:
          - question: מרכיבים
          - question: מנה עיקרית
          - question: שירות
          - question: חריף
          - question: טבעוני
          - question: תפריט
          - question: קינוח
          - question: תבלינים
          - question: מסעדה
          - question: הזמנה
      - id: mori-title
        type: heading
        level: 3
        text: 'Hausaufgaben mit Mori: Restaurants und Essenserfahrungen'
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere die Nachricht und schick sie ab. Mori stellt dir Fragen; beantworte alle.
      - id: mori
        type: aiTutorPrompt
        title: Restaurants und Essen
        message: Hallo Mori! Lass uns über Restaurants und Essen sprechen. Bitte stelle mir Fragen, damit ich das Perfekt und Modalverben benutzen kann. Frage mich nach Restaurants, Gerichten, Problemen mit Essen und Empfehlungen.
      - id: mori-task1
        type: callout
        tone: info
        lang: he
        title: פעילות 1 – מסעדת החלומות שלי
        text: |-
          תארו למורי את מסעדת החלומות שלכם. הסבירו: איזה אוכל מגישים שם, איך המקום נראה, מה צריך להיות בתפריט, מה אסור שיהיה שם ואיזה שירות צריך להיות.
          **חובה להשתמש ב:** לפחות 5 Modalverben ולפחות 5 משפטים ב־Perfekt.
          דוגמאות: *Das Restaurant sollte ruhige Musik haben. Ich habe dort schon einmal fantastische Pasta gegessen.*
      - id: mori-task2
        type: callout
        tone: info
        lang: he
        title: פעילות 2 – מבקר מסעדות
        text: |-
          אתם מבקרי מסעדות. ספרו למורי על מסעדה שבה אכלתם: מה אהבתם, מה לא אהבתם, מה המלצרים היו צריכים לעשות, מה יכול להשתפר והאם הייתם חוזרים לשם.
          **אל תשכחו:** להשתמש ב־Perfekt וב־Modalverben ולתת דוגמאות אישיות.
          דוגמאות: *Der Service hätte schneller sein können. Ich habe das Dessert wirklich gemocht. Das Restaurant sollte mehr vegetarische Gerichte anbieten.*
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**
    teacherNotes:
      - id: n-key-1
        anchor: part1
        text: >-
          Lösungen Teil 1: 1. haben … gegessen, 2. haben … gemacht, 3. hat … gebracht,
          4. habe … probiert, 5. hat … gekocht, 6. hat … serviert, 7. haben … gefunden
          (*sie* = Plural / *Sie*) oder hat … gefunden (*sie* = eine Frau): beides ist
          richtig, 8. habe … zurückgeschickt.
      - id: n-key-2
        anchor: part2
        text: >-
          Lösungen Teil 2: 1. solltest, 2. müssen (auch: sollten), 3. Könnte (auch:
          Kann / Darf), 4. wollen (auch: könnten), 5. sollte (auch: könnte), 6. sollten,
          7. darf. Bei einigen Sätzen sind mehrere Antworten grammatikalisch möglich;
          achte auf die richtige Personalform (*du solltest, das Restaurant sollte,
          Kunden sollten*).
      - id: n-key-3
        anchor: part3
        text: >-
          Beispielantworten Teil 3: 1. Das beste Restaurant war ein italienisches
          Restaurant in Rom. Das Essen war ausgezeichnet und der Service war sehr
          freundlich. Besonders die Pasta hat mir gefallen. Ich möchte dort noch einmal
          essen. 2. Ja, einmal habe ich ein Gericht zurückgeschickt. Das Fleisch war
          nicht richtig gekocht. Der Kellner hat sich entschuldigt und mir ein neues
          Gericht gebracht. 3. Ich möchte die koreanische Küche probieren. Ich habe
          gehört, dass sie sehr lecker ist. Besonders möchte ich Bibimbap und
          koreanisches Barbecue essen. 4. Ein gutes Restaurant sollte frische Zutaten,
          freundlichen Service und eine saubere Atmosphäre haben. Das Essen sollte lecker
          sein und die Preise sollten fair sein.
      - id: n-key-4
        anchor: part4
        text: >-
          Lösungen Teil 4: die Zutaten, das Hauptgericht, der Service, scharf, vegan, die
          Speisekarte, der Nachtisch / das Dessert, die Gewürze, das Restaurant, die
          Reservierung (eines Tisches) oder die Bestellung (des Essens).

