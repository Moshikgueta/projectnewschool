# Cycle "Unterhaltung", converted from the German level 3 digital notebook
# ("German Level 3- Digital Notebook", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (German).
course: de-stufe-3
slug: unterhaltung
title: Unterhaltung
goal: Über Erfahrungen mit Filmen, Musik und Kultur im Perfekt und mit seit sprechen und Meinungen begründen und auf andere Meinungen reagieren.
position: 16
status: published

review:
  - >-
    The two workbook exercises ("Perfekt und Präsens mit seit" and "Meinungen
    ausdrücken und reagieren") are NEW: they were written from the cycle's summary,
    the activity examples, the homework sentences and the vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    The notebook lists five language goals. The cycle overview keeps two skills:
    "Perfekt und Präsens mit seit" (experiences, changes over time, seit + Präsens)
    and "Meinungen ausdrücken und reagieren" (opinion, reasons, reactions, with the
    adjectives of the cycle). Talking about films / music and the adjectives are
    practised inside both.
  - >-
    The classic homework (Aufgaben 1–4) is kept in the homework section as practice
    for the students; the answer key ("Lösungsschlüssel") is ONLY in the teacher notes
    of that section. Key checked; all answers of Aufgaben 1 and 2 are correct.
  - >-
    Homework corrections: Aufgabe 2, item 6 "In letzter Zeit ___ ich weniger fern ___
    (sehen)" → "In letzter Zeit ___ ich weniger ___. (fernsehen)", because the key's
    answer is "ferngesehen" (one word), which does not fit a gap after "fern".
    Aufgabe 3 had two gap sentences with the verb at the end, so "Ich würde sagen,
    dass" fitted items 1 AND 4, and "Ich verstehe, was du meinst, aber Streaming auch
    viele Vorteile hat" is wrong (after "aber" the verb is in position 2; the key
    itself said so). Items 3 and 4 now read "B: ___ Streaming hat auch viele
    Vorteile." and "___ werden Dokumentarfilme oft unterschätzt." so each phrase fits
    exactly one gap; the key was renumbered (it restarted at 1).
  - >-
    Aufgabe 4 model review (teacher note only): "weil sie sehr anders als typische
    Serien ist" → "ganz anders" (more natural). The review is about the real series
    *Dark*; it is a short opinion, kept.
  - >-
    Other corrections: intro frame "Einen Film / eine Serie / ein Konzert / ein
    Theaterstück, das … ist ___" → nominative with matching relative pronouns ("Ein
    Film / eine Serie / ein Konzert, den / die / das …"); warm-up 5 "Warum war sie
    besonders?" (unclear reference: Konzert or Veranstaltung) → "Was war daran
    besonders?"; Activity 4 title "Debatte, Stirbt …" → "Debatte: Stirbt …";
    Activity 4 frame "Konzerte sind weiterhin beliebt geblieben" → "Konzerte sind
    beliebt geblieben" (weiterhin + geblieben is doubled); "Mamma Mia\!" escape and
    the many broken "****" marks removed; heading "Datum / Teilnehmende" left out.
  - >-
    Summary (Hebrew, kept as written, as ruleSummary blocks with lang he; German
    examples in German). Additions, please confirm and check the Hebrew: a sentence
    that verbs of movement / change (gehen, fahren, werden) take *sein* (the source
    example uses "sind gefahren" without saying why); a word-order rule for opinions
    (after *dass* the verb goes to the end; after *Meiner Meinung nach / Aus meiner
    Sicht* the verb comes right after); a word-order rule for the connectors (weil →
    verb at the end, denn → normal order, deshalb / aus diesem Grund / trotzdem → verb
    right after the connector), with examples. The "simple way to remember" lines are
    a table. The seit rule compares with English (I have worked here…); it is correct
    for German and kept.
  - >-
    Left out: all "Antwort Teilnehmer/in 1/2/3" lines (the platform has answer boxes),
    the empty "Datum / Teilnehmende" fields. No gamma.app link, no song lyrics and no
    real students' names in this cycle (Daniel in the intro example is a model name).
  - >-
    The source gives no times for any part of this cycle, so no minutes are set; the
    teacher chooses activities to fit the lesson. Sentence frames were added to the
    warm-up questions and to the activity discussion questions.
  - >-
    Vocabulary: kept as in the source; "die Untertitel" marked "(Pl.)". Added from the
    summary (please confirm): schon einmal, noch nie, bisher, in letzter Zeit, in den
    letzten Jahren, seit, with the Hebrew glosses the summary gives. The Quizlet link
    lost its "?new" parameter.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: unterhaltung-unterricht
    title: 'Unterricht: Unterhaltung'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Unterhaltung
      - id: skills
        type: cycleOverview
        skills:
          - name: Perfekt und Präsens mit seit
            description: 'Erfahrungen und Veränderungen im Perfekt (*Ich habe diesen Film schon dreimal gesehen.*), aber Präsens mit *seit*, wenn etwas bis heute weitergeht (*Ich höre seit zwei Jahren Podcasts.*)'
          - name: Meinungen ausdrücken und reagieren
            description: '*Meiner Meinung nach…, Ich würde sagen, dass…* + Begründung mit *weil, denn, deshalb* + Reaktionen wie *Das sehe ich anders.* und Adjektive wie *überbewertet, zeitlos, innovativ*'
      - id: quizlet
        type: externalLink
        label: Unterhaltung auf Quizlet (Deutsch + Übersetzung)
        url: https://quizlet.com/1202278959/unterhaltung-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Vorstellungsrunde
      - id: intro
        type: sentenceFrame
        frame: Ich bin ___. Ein Film / eine Serie / ein Konzert, den / die / das meiner Meinung nach jeder einmal sehen sollte, ist ___, weil ___.
        example: Ich bin Daniel. Eine Serie, die meiner Meinung nach jeder einmal sehen sollte, ist *Friends*, weil sie lustig und zeitlos ist.
      - id: warmup-title
        type: heading
        level: 3
        text: Einstiegsfragen
      - id: warmup-hint
        type: callout
        tone: info
        text: Antworte in **vollständigen Sätzen**. Bei Erfahrungen benutzt du das **Perfekt**, und deine Meinung **begründest** du.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Was bedeutet Unterhaltung für dich? Welche Arten von Unterhaltung sind dir besonders wichtig?
            frame: Für mich bedeutet Unterhaltung ___. Besonders wichtig sind mir ___.
          - question: Welche neue Serie, welchen Podcast oder welche Musikerin / welchen Musiker hast du in letzter Zeit entdeckt? Warum hat dich das interessiert?
            frame: In letzter Zeit habe ich ___ entdeckt. Das hat mich interessiert, weil ___.
          - question: 'Welche Art von Unterhaltung hast du dieses Jahr häufiger genutzt: Streaming, soziale Medien, Podcasts oder Live-Veranstaltungen? Warum?'
            frame: Dieses Jahr habe ich häufiger ___ genutzt, weil ___.
          - question: Hast du schon einmal eine kulturelle Veranstaltung vor dem Ende verlassen, weil du dich gelangweilt hast? Was ist passiert?
            frame: Ja, ich habe einmal ___ verlassen, weil ___. / Nein, ich habe noch nie ___.
          - question: Welches Konzert oder welche Live-Veranstaltung hat dir in den letzten Jahren am besten gefallen? Was war daran besonders?
            frame: In den letzten Jahren hat mir ___ am besten gefallen. Besonders war ___.
          - question: Welchen Film, welche Serie oder welchen Künstler hast du schon mehrmals gesehen oder gehört? Warum lohnt es sich deiner Meinung nach?
            frame: Ich habe ___ schon mehrmals gesehen / gehört. Meiner Meinung nach lohnt es sich, weil ___.
          - question: Wie würdest du deinen Geschmack bei Unterhaltung beschreiben? Magst du eher Mainstream oder eher unabhängige und weniger bekannte Angebote?
            frame: Ich würde sagen, dass ich eher ___ mag, weil ___.
          - question: Welche Art von Unterhaltung wird deiner Meinung nach unterschätzt? Warum?
            frame: Meiner Meinung nach wird ___ unterschätzt, weil ___.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Wie gut ist es wirklich?'
        skills: [Meinungen ausdrücken und reagieren]
        steps:
          - Viele bekannte Filme, Musiker, Serien, Musicals und Theaterstücke haben die Unterhaltungswelt stark beeinflusst. In dieser Aktivität bewertet ihr bekannte Beispiele und versucht, eure Gruppe von eurer Meinung zu überzeugen.
          - '**Schritt 1: Beispiele auswählen.** Wählt sechs Beispiele aus der Liste unten. Ihr könnt auch eigene Beispiele hinzufügen.'
          - '**Schritt 2: Bewerten.** Bewertet die Beispiele mit diesen Kategorien: **überbewertet, innovativ, unvergesslich, zum Nachdenken anregend, bedeutungsvoll, zeitlos** oder eine eigene Kategorie. Sagt nicht nur „Ich mag es.“, sondern erklärt eure Meinung.'
          - '**Schritt 3: Andere überzeugen.** Nicht alle müssen derselben Meinung sein. Reagiert aufeinander: *Ich verstehe deinen Punkt, aber… / Da stimme ich dir teilweise zu. Trotzdem… / Das sehe ich anders, weil… / Kannst du ein Beispiel dafür geben? / Warum findest du das innovativ?*'
          - '**Schritt 4: Klassenergebnis.** Versucht als Klasse, euch auf einige Bewertungen zu einigen (Fragen unten).'
        example: |-
          *Meiner Meinung nach ist der Film überbewertet, weil die Geschichte sehr vorhersehbar ist.*
          *Ich würde sagen, dass diese Serie besonders innovativ ist, weil…*
          *Für mich ist dieser Künstler zeitlos. Seine Musik ist seit Jahrzehnten beliebt.*
        wordBank:
          - Titanic
          - Der König der Löwen
          - Friends
          - Elton John
          - Michael Jackson
          - Das Phantom der Oper
          - Game of Thrones
          - Adele
          - Les Misérables
          - Beyoncé
          - Forrest Gump
          - Romeo und Julia
          - Der Nussknacker
          - Matrix
          - Mamma Mia!
          - Schwanensee
          - The Office
      - id: act1-rating
        type: discussionQuestions
        title: Meine Bewertung
        items:
          - question: Welches Beispiel ist für dich überbewertet?
            frame: Meiner Meinung nach ist ___ überbewertet, weil ___.
          - question: Welches Beispiel ist besonders innovativ?
            frame: Ich würde sagen, dass ___ besonders innovativ ist, weil ___.
          - question: Welches Beispiel ist zeitlos oder unvergesslich?
            frame: Für mich ist ___ zeitlos / unvergesslich. ___ ist seit ___ beliebt.
          - question: Ein Partner sieht es anders. Wie reagierst du?
            frame: Ich verstehe deinen Punkt, aber ___. / Das sehe ich anders, weil ___.
      - id: act1-class
        type: discussionQuestions
        title: Klassenergebnis
        items:
          - question: Was ist am meisten überbewertet?
            frame: Wir finden, dass ___ am meisten überbewertet ist, weil ___.
          - question: Was ist am zeitlosesten?
            frame: Am zeitlosesten ist ___, weil ___.
          - question: Was hat die Unterhaltungswelt am stärksten verändert?
            frame: ___ hat die Unterhaltungswelt am stärksten verändert, weil ___.
          - question: Welches Werk wird heute vielleicht unterschätzt?
            frame: Ich glaube, dass ___ heute unterschätzt wird.
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Podcast-Interview'
        skills: [Perfekt und Präsens mit seit]
        steps:
          - '**Schritt 1: Eine Person auswählen.** Wähle eine Person aus der Unterhaltungswelt, die du interessant findest: Schauspieler/in, Musiker/in, Regisseur/in, Moderator/in, Komiker/in, Schriftsteller/in oder Produzent/in. Erkläre: *Ich habe ___ gewählt, weil…*'
          - '**Schritt 2: Fünf Interviewfragen schreiben.** Schreib fünf Fragen über die Erfahrungen und die Karriere dieser Person, möglichst im Perfekt. Mögliche Themen: Karriere, Zusammenarbeit, Erfolge, Herausforderungen, wichtige Entscheidungen, Veränderungen im Leben.'
          - '**Schritt 3: Die Rolle übernehmen.** Wähle zwei Fragen und beantworte sie so, als wärst du die berühmte Person. Gib vollständige Antworten.'
          - '**Schritt 4: Podcast vorstellen.** Stell deinem Partner / deiner Partnerin deine Person und deine Fragen vor. Er / Sie ergänzt mindestens eine weitere Interviewfrage.'
        example: |-
          *Mit welchen Künstlern haben Sie im Laufe Ihrer Karriere zusammengearbeitet?*
          *Welche Rolle hat Ihre Karriere am stärksten verändert?*
          *Haben Sie schon einmal daran gedacht, Ihre Karriere zu beenden?*
          *Welche Herausforderung haben Sie bisher am schwierigsten gefunden?*
          *Welche Projekte haben Sie in den letzten Jahren besonders inspiriert?*
          *Antwort: Ich habe im Laufe meiner Karriere mit vielen internationalen Künstlern zusammengearbeitet. Besonders wichtig ist für mich die Zusammenarbeit mit ___ gewesen, weil…*
      - id: act2-questions
        type: discussionQuestions
        title: Mein Podcast-Interview
        items:
          - question: Wen hast du gewählt? Warum?
            frame: Ich habe ___ gewählt, weil ___.
          - question: Frage 1
            frame: Haben Sie schon einmal ___?
          - question: Frage 2
            frame: Mit wem haben Sie ___?
          - question: Frage 3
            frame: Welche ___ haben Sie in den letzten Jahren ___?
          - question: Frage 4
          - question: Frage 5
          - question: Deine Antwort als berühmte Person
            frame: Ich habe im Laufe meiner Karriere ___. Besonders wichtig ist für mich ___ gewesen, weil ___.
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Unterhaltung mit wenig Anspruch?'
        skills: [Meinungen ausdrücken und reagieren, Perfekt und Präsens mit seit]
        steps:
          - 'Manche Unterhaltungsangebote werden vor allem produziert, um schnell Aufmerksamkeit zu bekommen. Sie können sehr dramatisch, übertrieben, oberflächlich, sensationell, provokativ, billig produziert oder auf Klicks ausgerichtet sein. Dazu gehören zum Beispiel Reality-TV, Klatschsendungen, Clickbait-Videos, inszenierte Pranks, extrem dramatische Talentshows und bestimmte Influencer-Inhalte.'
          - '**Schritt 1: Brainstorming.** Welche Arten von Unterhaltung wirken auf euch eher oberflächlich oder nur auf Aufmerksamkeit ausgerichtet? Sammelt passende Adjektive (Wortliste unten).'
          - '**Schritt 2: Recherche.** Wählt ein konkretes Beispiel oder eine Art von Unterhaltung. Findet heraus: Was ist es? Wer schaut es? Warum ist es beliebt geworden? Welche Elemente ziehen besonders viel Aufmerksamkeit an? Welche Rolle spielen Konflikte, Skandale oder Clickbait? Wie würdet ihr es beschreiben? Beschreibt auch Veränderungen im Perfekt.'
          - '**Schritt 3: Präsentation.** Präsentiert eure Ergebnisse mit den sechs Punkten unten.'
        example: |-
          *Reality-TV ist in den letzten Jahren noch extremer geworden.*
          *Soziale Medien haben diese Form der Unterhaltung sehr populär gemacht.*
          *Viele Formate haben begonnen, stärker auf kurze und dramatische Szenen zu setzen.*
        wordBank:
          - übertrieben
          - oberflächlich
          - dramatisch
          - provokativ
          - sensationell
          - unterhaltsam
          - peinlich
          - süchtig machend
          - unoriginell
      - id: act3-presentation
        type: discussionQuestions
        title: Unsere Präsentation
        items:
          - question: Was ist das Format?
            frame: Unser Beispiel ist ___.
          - question: Warum ist es populär?
            frame: Es ist populär geworden, weil ___.
          - question: Warum könnte man es als oberflächlich oder sensationsorientiert bezeichnen?
            frame: Man könnte es als ___ bezeichnen, weil ___.
          - question: Welche Adjektive passen dazu?
            frame: Wir finden es ___, ___ und ___.
          - question: Wie hat es sich in den letzten Jahren verändert?
            frame: In den letzten Jahren ist es ___ geworden. / … hat es ___.
          - question: Sollte man solche Unterhaltung kritisieren oder ist sie einfach harmloser Spaß?
            frame: Meiner Meinung nach ___, weil ___.
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Debatte: Stirbt die klassische Unterhaltungswelt?'
        skills: [Meinungen ausdrücken und reagieren, Perfekt und Präsens mit seit]
        steps:
          - 'Viele Menschen verbringen heute einen großen Teil ihrer Freizeit mit dem Smartphone. Streamingdienste, YouTube, TikTok und soziale Medien konkurrieren mit traditionellen Formen der Unterhaltung. Gleichzeitig gibt es weiterhin Kinos, Theater, Konzerte, Museen, Festivals, kulturelle Veranstaltungen und Live-Shows. Die Frage lautet: **Stirbt die traditionelle Unterhaltungswelt oder verändert sie sich nur?**'
          - '**Schritt 1: Veränderungen sammeln.** Besprecht die Fragen unten und benutzt das Perfekt: *In den letzten Jahren haben viele Menschen begonnen, … / Streamingdienste haben die Art verändert, wie wir … / Kinos sind weniger wichtig geworden, weil … / Konzerte sind beliebt geblieben.*'
          - '**Schritt 2: Gruppen vorbereiten.** **Gruppe A:** Traditionelle Unterhaltung befindet sich im Niedergang. **Gruppe B:** Unterhaltung stirbt nicht, sondern verändert sich. Jede Gruppe bereitet vier bis fünf Argumente vor. Denkt auch darüber nach, was die andere Gruppe sagen könnte und wie ihr darauf reagieren könnt.'
          - '**Schritt 3: Debatte.** Gruppe A nennt ein Argument, Gruppe B reagiert. Dann nennt Gruppe B ein neues Argument, und Gruppe A reagiert. Redemittel: *Meiner Meinung nach… / Ich glaube, dass… / Aus meiner Sicht… / Ich würde sagen, dass… / Da stimme ich zu, weil… / Ich verstehe, was du meinst, aber… / Ich bin nicht sicher, ob ich zustimme, weil…*'
          - '**Schritt 4: Klassendiskussion.** Besprecht die Fragen unten zusammen.'
      - id: act4-changes
        type: discussionQuestions
        title: 'Schritt 1: Veränderungen sammeln'
        items:
          - question: Wie haben Smartphones unsere Freizeit verändert?
            frame: Smartphones haben ___ verändert. In den letzten Jahren haben viele Menschen begonnen, ___.
          - question: Wie haben Streamingdienste Fernsehen und Kino verändert?
            frame: Streamingdienste haben die Art verändert, wie wir ___.
          - question: Welche kulturellen Aktivitäten sind weniger populär geworden?
            frame: ___ sind weniger wichtig geworden, weil ___.
          - question: Welche sind weiterhin stark?
            frame: ___ sind beliebt geblieben.
          - question: Welche neuen Formen von Unterhaltung sind entstanden?
            frame: In letzter Zeit sind ___ entstanden.
      - id: act4-class
        type: discussionQuestions
        title: 'Schritt 4: Klassendiskussion'
        items:
          - question: Wie hat Technologie verändert, wie wir Unterhaltung konsumieren?
            frame: Technologie hat verändert, wie wir ___.
          - question: Welche Gewohnheiten haben sich besonders stark verändert?
            frame: Besonders stark haben sich ___ verändert.
          - question: Welche traditionellen Kulturangebote sind stabil geblieben?
            frame: ___ sind stabil geblieben, weil ___.
          - question: Werden Menschen in Zukunft mehr oder weniger Live-Veranstaltungen besuchen?
            frame: Ich glaube, dass Menschen in Zukunft ___ Live-Veranstaltungen besuchen werden, weil ___.
          - question: Ist digitale Unterhaltung weniger wertvoll als kulturelle Unterhaltung vor Ort?
            frame: Aus meiner Sicht ___, weil ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: **Perfekt und Präsens mit seit**
          (Erfahrungen mit *schon einmal, noch nie, bisher, in letzter Zeit, in den
          letzten Jahren*; Veränderungen über die Zeit; *seit* + Präsens für Dinge, die
          bis heute weitergehen) und **Meinungen ausdrücken und reagieren** (Meinung,
          Begründung, Reaktion auf andere Meinungen, Adjektive für Unterhaltung). Das
          Heft gibt für diesen Zyklus keine Zeiten an: Wähle die Aktivitäten nach der
          verfügbaren Zeit aus.
      - id: n-intro
        anchor: intro
        text: Gib zuerst dein eigenes Beispiel. Achte auf den Nominativ (*Ein Film, den …, ist …*) und auf das passende Relativpronomen (den / die / das).
      - id: n-warmup
        anchor: warmup
        text: >-
          Wähle aus den acht Fragen aus. Die Teilnehmenden antworten möglichst in
          vollständigen Sätzen, bei Erfahrungen im Perfekt, und begründen ihre Meinung.
      - id: n-act1
        anchor: act1
        text: >-
          Sprachziele: Meinungen + Adjektive + Argumentieren. Sozialform: Gruppenarbeit
          und Klassengespräch. Achte darauf, dass jede Bewertung begründet wird (*weil,
          denn, deshalb*) und dass die Teilnehmenden auf andere Meinungen reagieren.
      - id: n-act2
        anchor: act2
        text: >-
          Sprachziele: Perfekt + Fragen über Erfahrungen. Sozialform: Einzelarbeit und
          Partnerarbeit. Die Interviewfragen stehen in der Sie-Form (*Haben Sie schon
          einmal …?*). Achte auf *haben / sein* und das Partizip II am Satzende.
      - id: n-act3
        anchor: act3
        text: >-
          Sprachziele: Meinungen + Adjektive + Perfekt. Sozialform: Recherche und
          Gruppenarbeit. Die Gruppen dürfen im Internet recherchieren. Achte auf
          *werden* im Perfekt mit *sein* (*ist extremer geworden*).
      - id: n-act4
        anchor: act4
        text: >-
          Sprachziele: Meinungen + Veränderungen über die Zeit + Argumentieren.
          Sozialform: Gruppendebatte. Teile die Klasse in Gruppe A und Gruppe B. Achte
          darauf, dass jede Reaktion begründet wird.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: unterhaltung-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: rules-erfahrungen
        type: ruleSummary
        lang: he
        skill: 'Perfekt und Präsens mit seit: לדבר על חוויות בגרמנית'
        rules:
          - text: 'כאשר מדברים על דברים שעשינו או חווינו בעבר, משתמשים הרבה ב־**Perfekt**. המבנה: **haben / sein + Partizip II**. ה־Partizip II בא בסוף המשפט. עם פעלי תנועה ושינוי מצב (gehen, fahren, werden) משתמשים ב־**sein**.'
            examples:
              - Ich habe diesen Film schon dreimal gesehen. – כבר ראיתי את הסרט הזה שלוש פעמים.
              - Ich habe noch nie ein Musical gesehen. – מעולם לא ראיתי מחזמר.
              - Wir sind schon einmal zusammen zu einem Konzert gefahren. – כבר נסענו פעם ביחד להופעה.
          - text: 'מילים שימושיות במיוחד:'
            examples:
              - schon einmal = כבר פעם / אי פעם
              - noch nie = אף פעם עד עכשיו
              - bisher = עד עכשיו
              - in letzter Zeit = לאחרונה
              - in den letzten Jahren = בשנים האחרונות
          - text: 'דוגמאות:'
            examples:
              - Hast du schon einmal ein Konzert vor dem Ende verlassen?
              - Ich habe diesen Künstler bisher nur einmal live gesehen.
              - In den letzten Jahren habe ich viel mehr Podcasts gehört.
      - id: rules-veraenderungen
        type: ruleSummary
        lang: he
        skill: 'Perfekt und Präsens mit seit: שינויים לאורך זמן'
        rules:
          - text: 'אפשר להשתמש ב־Perfekt כדי לתאר שינוי שקרה לאורך השנים ועד היום.'
            examples:
              - Streamingdienste haben die Unterhaltungswelt stark verändert. – שירותי סטרימינג שינו מאוד את עולם הבידור.
              - Viele Menschen haben begonnen, mehr Inhalte auf dem Handy zu konsumieren. – אנשים רבים התחילו לצרוך יותר תוכן בטלפון.
              - Reality-TV ist in den letzten Jahren immer extremer geworden. – ריאליטי הפך בשנים האחרונות לקיצוני יותר ויותר.
          - text: 'ביטויים שימושיים:'
            examples:
              - in den letzten Jahren
              - in letzter Zeit
              - im Laufe der Jahre
              - bisher
              - immer mehr
              - immer weniger
      - id: rules-seit
        type: ruleSummary
        lang: he
        skill: 'Perfekt und Präsens mit seit: פעולה שהתחילה בעבר וממשיכה עד היום'
        rules:
          - text: 'כאן יש הבדל חשוב מאנגלית. באנגלית משתמשים לעיתים ב־Present Perfect: *I have worked here for five years.* בגרמנית, אם הפעולה עדיין ממשיכה היום, משתמשים בדרך כלל ב־**Präsens + seit**.'
            examples:
              - Ich arbeite seit fünf Jahren hier.
              - 'ולא: *Ich habe seit fünf Jahren hier gearbeitet.*'
          - text: 'דוגמאות:'
            examples:
              - Ich höre seit zwei Jahren regelmäßig Podcasts. – אני מאזין לפודקאסטים באופן קבוע כבר שנתיים.
              - Diese Serie läuft seit 2015. – הסדרה משודרת מאז 2015.
              - Seit meiner Kindheit interessiere ich mich für Filme. – אני מתעניין בסרטים מאז הילדות.
      - id: remember-table
        type: table
        lang: he
        caption: הדרך הפשוטה לזכור
        header: [מצב, זמן, דוגמה]
        rows:
          - [חוויה שהסתיימה, Perfekt, Ich habe diesen Film schon dreimal gesehen.]
          - [
              שינוי שקרה לאורך זמן,
              לרוב Perfekt,
              Streamingdienste haben die Unterhaltungswelt verändert.,
            ]
          - [משהו שהתחיל בעבר ועדיין ממשיך, Präsens + seit, Ich höre seit zwei Jahren Podcasts.]
      - id: rules-meinung
        type: ruleSummary
        lang: he
        skill: 'Meinungen ausdrücken und reagieren: להביע דעה'
        rules:
          - text: 'כדי להביע דעה בצורה ברורה אפשר להשתמש ב:'
            examples:
              - Ich denke, dass... – אני חושב ש...
              - Ich glaube, dass... – אני מאמין / חושב ש...
              - Meiner Meinung nach... – לדעתי...
              - Aus meiner Sicht... – מנקודת המבט שלי...
              - Ich würde sagen, dass... – הייתי אומר ש...
          - text: 'שימו לב לסדר המילים: אחרי **dass** הפועל בא בסוף המשפט. אחרי **Meiner Meinung nach** ו־**Aus meiner Sicht** הפועל בא מיד אחריהם (במקום השני).'
            examples:
              - Meiner Meinung nach **ist** die Serie völlig überbewertet.
              - Ich würde sagen, dass Live-Konzerte interessanter als Streaming **sind**.
      - id: rules-begruenden
        type: ruleSummary
        lang: he
        skill: 'Meinungen ausdrücken und reagieren: לנמק דעה'
        rules:
          - text: 'ברמת B1 לא מספיק לומר: *Ich mag den Film.* כדאי להסביר למה:'
            examples:
              - Ich mag den Film, weil die Geschichte originell und emotional ist.
              - Ich finde Dokumentarfilme besonders interessant, weil ich dabei etwas Neues lernen kann.
          - text: 'אפשר להשתמש ב: **weil, denn, deshalb, zum Beispiel, aus diesem Grund**.'
          - text: 'סדר המילים: אחרי **weil** הפועל בסוף; אחרי **denn** סדר מילים רגיל; אחרי **deshalb**, **aus diesem Grund** ו־**trotzdem** הפועל בא מיד אחריהם.'
            examples:
              - Ich sehe gern Dokumentarfilme, weil ich dabei etwas Neues **lerne**.
              - Ich sehe gern Dokumentarfilme, denn ich **lerne** dabei etwas Neues.
              - Die Geschichte ist spannend, deshalb **sehe** ich die Serie gern.
              - Das könnte stimmen, trotzdem **finde** ich die Serie zu lang.
      - id: reactions-table
        type: table
        lang: he
        caption: להגיב לדעה של מישהו אחר
        header: [להסכים, להסכים חלקית, לא להסכים]
        rows:
          - [Da stimme ich dir zu., 'Ich verstehe, was du meinst, aber...', Das sehe ich anders.]
          - [
              Das sehe ich genauso.,
              Da stimme ich dir teilweise zu.,
              'Ich bin nicht sicher, ob ich dir zustimme.',
            ]
          - [
              Das ist ein guter Punkt.,
              'Das könnte stimmen, trotzdem...',
              'Ich glaube nicht, dass das immer stimmt.',
            ]
      - id: reactions-why
        type: callout
        lang: he
        tone: tip
        title: אחרי התגובה חשוב להסביר למה
        text: '**Ich verstehe, was du meinst, aber meiner Meinung nach sind Streamingdienste nicht nur negativ, weil sie auch kleinere Produktionen zugänglich machen.**'
    teacherNotes:
      - id: n-summary
        anchor: null
        text: >-
          Wiederhole die zwei Fertigkeiten mit der Gruppe. Bitte um ein Beispiel mit
          *schon einmal / noch nie*, einen Satz mit *seit* + Präsens und eine begründete
          Meinung mit Reaktion. Die Wortstellungsregeln (dass, weil, denn, deshalb,
          trotzdem) sind eine Ergänzung zum Heft.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: unterhaltung-hausaufgaben
    title: Hausaufgaben
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben
      - id: aufgabe1
        type: discussionQuestions
        title: 'Aufgabe 1: Perfekt. Setze die Verben ins Perfekt.'
        items:
          - question: Ich ___ diesen Film schon dreimal ___. *(sehen)*
          - question: Wir ___ letztes Jahr ein großes Musikfestival ___. *(besuchen)*
          - question: Meine Schwester ___ noch nie einen Podcast ___. *(hören)*
          - question: Ich ___ in letzter Zeit viele neue Serien ___. *(entdecken)*
          - question: Streamingdienste ___ unsere Sehgewohnheiten stark ___. *(verändern)*
          - question: Viele Menschen ___ in den letzten Jahren mehr Zeit auf YouTube ___. *(verbringen)*
          - question: Der Künstler ___ gerade ein neues Album ___. *(veröffentlichen)*
          - question: Ich ___ noch nie vor dem Ende aus einem Theaterstück ___. *(gehen)*
      - id: aufgabe2
        type: discussionQuestions
        title: 'Aufgabe 2: Perfekt oder Präsens mit seit? Wähle die passende Form.'
        items:
          - question: Ich ___ seit drei Jahren regelmäßig Podcasts. *(hören)*
          - question: In den letzten Jahren ___ ich viele neue Podcasts ___. *(entdecken)*
          - question: Diese Serie ___ seit 2022 auf Netflix. *(laufen)*
          - question: Streamingdienste ___ die Unterhaltungsindustrie stark ___. *(verändern)*
          - question: Seit meiner Kindheit ___ ich mich für Musicals. *(interessieren)*
          - question: In letzter Zeit ___ ich weniger ___. *(fernsehen)*
      - id: aufgabe3-hint
        type: text
        text: '**Aufgabe 3: Meinungen ausdrücken.** Ergänze mit einer passenden Formulierung: *Meiner Meinung nach / Ich verstehe, was du meinst, aber / Das sehe ich genauso / Ich würde sagen, dass*'
      - id: aufgabe3
        type: discussionQuestions
        title: 'Aufgabe 3: Meinungen ausdrücken'
        items:
          - question: ___ Reality-TV oft zu dramatisch und oberflächlich ist.
          - question: 'A: Live-Konzerte sind viel besser als Musik zu Hause. B: ___. Die Atmosphäre ist einfach ganz anders.'
          - question: 'A: Streaming ist schlecht für das Kino. B: ___ Streaming hat auch viele Vorteile.'
          - question: ___ werden Dokumentarfilme oft unterschätzt.
      - id: aufgabe4-title
        type: heading
        level: 3
        text: 'Aufgabe 4: Kurze Rezension'
      - id: aufgabe4-rules
        type: callout
        tone: info
        title: So schreibst du deine Rezension
        text: |-
          Wähle einen Film, eine Serie, einen Podcast, ein Konzert oder einen Künstler. Schreib **7 bis 9 Sätze** und beantworte:
          - Was hast du gewählt? Wann hast du es entdeckt?
          - Hast du es schon mehrmals gesehen oder gehört?
          - Wie würdest du es mit drei Adjektiven beschreiben?
          - Was gefällt dir besonders? Gibt es etwas, das dir nicht gefällt?
          - Würdest du es anderen empfehlen? Warum?
          Benutze mindestens: **3 Sätze im Perfekt**, **3 verschiedene Adjektive**, **eine Meinungsformulierung**, **eine Begründung mit weil** und **schon einmal / noch nie / in letzter Zeit / bisher**.
      - id: aufgabe4
        type: reflection
        prompt: Meine Rezension (7 bis 9 Sätze)
      - id: mori-title
        type: heading
        level: 3
        text: Hausaufgaben mit Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere die Nachricht und schick sie ab. Mori stellt dir Fragen; beantworte alle.
      - id: mori-gespraech
        type: aiTutorPrompt
        title: Ein Gespräch über Unterhaltung
        intro: 'Versuche während des Gesprächs: mindestens 4 Sätze im Perfekt, mindestens einmal **noch nie**, mindestens 3 begründete Meinungen, mindestens 4 verschiedene Adjektive, und widersprich Mori mindestens einmal höflich.'
        message: >-
          Hallo Mori. Ich möchte auf B1-Niveau über Unterhaltung sprechen. Stelle mir
          nacheinander 6 Fragen über Filme, Serien, Musik, Podcasts, Konzerte und andere
          kulturelle Aktivitäten. Stelle mir Fragen über meine Erfahrungen mit ‚schon
          einmal‘, ‚noch nie‘, ‚bisher‘ und ‚in letzter Zeit‘. Bitte mich auch, klare
          Meinungen zu äußern und sie mit Gründen und Beispielen zu erklären. Reagiere
          manchmal auf meine Meinung und widersprich mir, damit ich üben kann, höflich
          zuzustimmen oder nicht zuzustimmen. Korrigiere am Ende meine wichtigsten
          Grammatikfehler und schlage mir bessere Adjektive vor.
      - id: mori-ende
        type: aiTutorPrompt
        title: Am Ende des Gesprächs
        intro: Frag Mori am Schluss nach deinen Fehlern und nach neuen Wörtern.
        message: Welche drei Fehler habe ich am häufigsten gemacht und welche fünf Wörter aus unserem Gespräch sollte ich mir merken?
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Erfahrungen im **Perfekt**, aber **seit + Präsens** für Dinge, die bis heute weitergehen.
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**
    teacherNotes:
      - id: n-aufgabe1
        anchor: aufgabe1
        text: >-
          Lösung Aufgabe 1: 1. habe … gesehen; 2. haben … besucht; 3. hat … gehört; 4.
          habe … entdeckt; 5. haben … verändert; 6. haben … verbracht; 7. hat …
          veröffentlicht; 8. bin … gegangen.
      - id: n-aufgabe2
        anchor: aufgabe2
        text: >-
          Lösung Aufgabe 2: 1. höre (seit + Präsens); 2. habe … entdeckt; 3. läuft; 4.
          haben … verändert; 5. interessiere; 6. habe … ferngesehen. Satz 6 wurde
          geändert (vorher „weniger fern ___“), weil *ferngesehen* ein Wort ist.
      - id: n-aufgabe3
        anchor: aufgabe3
        text: >-
          Lösung Aufgabe 3: 1. Ich würde sagen, dass; 2. Das sehe ich genauso; 3. Ich
          verstehe, was du meinst, aber; 4. Meiner Meinung nach. Sätze 3 und 4 wurden
          umgestellt (Verb auf Position 2), damit jede Formulierung nur in eine Lücke
          passt. Auch möglich bei Satz 3: *Ich verstehe, was du meinst, aber ich glaube,
          dass Streaming auch viele Vorteile hat.*
      - id: n-aufgabe4
        anchor: aufgabe4
        text: >-
          Persönliche Antwort. Beispiel aus dem Heft: Ich habe die Serie *Dark* vor
          einigen Jahren entdeckt. Seitdem habe ich sie zweimal gesehen. Meiner Meinung
          nach ist sie spannend, originell und zum Nachdenken anregend. Besonders
          interessant finde ich die komplizierte Geschichte. Ich habe bisher nur wenige
          Serien gesehen, die so komplex sind. Manchmal ist die Handlung allerdings etwas
          verwirrend. Trotzdem würde ich die Serie empfehlen, weil sie ganz anders als
          typische Serien ist. In letzter Zeit habe ich wieder darüber nachgedacht, sie
          noch einmal zu sehen.

