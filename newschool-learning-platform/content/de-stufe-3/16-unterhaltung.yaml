vocabulary:
  - slug: unterhaltung
    title: Unterhaltung
    items: *unterhaltung-words

activities:
  - slug: unterhaltung-perfekt
    title: Perfekt und Präsens mit seit
    minutes: 8
    items:
      - id: habe-gesehen
        type: multipleChoice
        prompt: Ich ___ diesen Film schon dreimal gesehen.
        options:
          - { text: habe, correct: true }
          - {
              text: bin,
              feedback: '*sehen* ist kein Verb der Bewegung: Das Perfekt bilden wir mit *haben*: *Ich habe gesehen.*',
            }
          - { text: hat, feedback: '*hat* ist für *er / sie / es*. Für *ich* sagen wir *habe*.' }
      - id: bin-gegangen
        type: multipleChoice
        prompt: Ich ___ noch nie vor dem Ende aus einem Theaterstück gegangen.
        options:
          - { text: bin, correct: true }
          - {
              text: habe,
              feedback: '*gehen* ist ein Verb der Bewegung: Das Perfekt bilden wir mit *sein*: *Ich bin gegangen.*',
            }
          - { text: ist, feedback: '*ist* ist für *er / sie / es*. Für *ich* sagen wir *bin*.' }
      - id: festival
        type: fillBlank
        prompt: Setze das Verb *besuchen* ins Perfekt.
        text: Wir ___ letztes Jahr ein großes Musikfestival ___.
        blanks: [[haben], [besucht]]
      - id: seit-podcasts
        type: multipleChoice
        prompt: Du hörst auch heute noch Podcasts. Welcher Satz ist richtig?
        options:
          - { text: Ich höre seit drei Jahren regelmäßig Podcasts., correct: true }
          - {
              text: Ich habe seit drei Jahren regelmäßig Podcasts gehört.,
              feedback: 'Die Handlung geht bis heute weiter. Dann benutzen wir *seit* + Präsens, nicht das Perfekt: *Ich höre seit drei Jahren …*',
            }
          - {
              text: Ich höre vor drei Jahren regelmäßig Podcasts.,
              feedback: '*vor drei Jahren* ist ein Zeitpunkt in der Vergangenheit. Für eine Zeit, die bis heute dauert, sagen wir *seit*: *seit drei Jahren*.',
            }
      - id: serie-laeuft
        type: trueFalse
        prompt: 'Die Serie läuft heute noch. Der Satz *Diese Serie läuft seit 2015.* ist richtig.'
        answer: true
        feedback:
          correct: 'Richtig! Die Serie läuft bis heute, deshalb: *seit* + Präsens.'
          incorrect: 'Der Satz ist richtig: Was bis heute weitergeht, steht im Präsens mit *seit*.'
      - id: partizipien
        type: matching
        prompt: Welches Partizip II passt zu welchem Verb?
        pairs:
          - [sehen, gesehen]
          - [entdecken, entdeckt]
          - [verbringen, verbracht]
          - [veröffentlichen, veröffentlicht]
          - [werden, geworden]
      - id: extremer-geworden
        type: fillBlank
        prompt: 'Setze *werden* ins Perfekt. Tipp: *werden* bildet das Perfekt mit *sein*.'
        text: Reality-TV ___ in den letzten Jahren immer extremer ___.
        blanks: [[ist], [geworden]]
      - id: ordne-seit
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz.
        sentence: Seit meiner Kindheit interessiere ich mich für Filme.

  - slug: unterhaltung-meinung
    title: Meinungen ausdrücken und reagieren
    minutes: 8
    items:
      - id: meiner-meinung
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Meiner Meinung nach ist die Serie überbewertet., correct: true }
          - {
              text: Meiner Meinung nach die Serie ist überbewertet.,
              feedback: 'Nach *Meiner Meinung nach* steht das Verb direkt danach (Position 2): *Meiner Meinung nach ist …*',
            }
          - {
              text: Meiner Meinung nach die Serie überbewertet ist.,
              feedback: '*Meiner Meinung nach* ist kein Nebensatz: Das Verb steht direkt danach: *Meiner Meinung nach ist die Serie …*',
            }
      - id: weil-ist
        type: fillBlank
        prompt: Ergänze das Verb *sein*. Achtung, Nebensatz mit *weil*!
        text: Ich mag den Film, weil die Geschichte originell und emotional ___.
        blanks: [[ist]]
      - id: adjektive
        type: matching
        prompt: Welche Erklärung passt zu welchem Adjektiv?
        pairs:
          - [überbewertet, 'Viele finden es besser, als es wirklich ist.']
          - [zeitlos, Es ist auch nach vielen Jahren noch aktuell.]
          - [unvergesslich, Man vergisst es nie.]
          - [oberflächlich, Es hat keine Tiefe.]
          - [innovativ, Es ist neu und ganz anders.]
      - id: genauso
        type: multipleChoice
        prompt: 'A: *Live-Konzerte sind viel besser als Musik zu Hause.* B: „___ Die Atmosphäre ist einfach ganz anders.“'
        options:
          - { text: Das sehe ich genauso., correct: true }
          - {
              text: Das sehe ich anders.,
              feedback: 'B findet die Atmosphäre bei Konzerten besonders, also stimmt B zu: *Das sehe ich genauso.*',
            }
          - {
              text: 'Ich bin nicht sicher, ob ich dir zustimme.',
              feedback: 'B ist sicher und stimmt zu. *Ich bin nicht sicher, ob …* zeigt, dass man nicht zustimmt.',
            }
      - id: deshalb
        type: trueFalse
        prompt: 'Der Satz *Die Geschichte ist spannend, deshalb sehe ich die Serie gern.* ist richtig.'
        answer: true
        feedback:
          correct: 'Genau! Nach *deshalb* kommt direkt das Verb: *deshalb sehe ich …*'
          incorrect: 'Der Satz ist richtig: Nach *deshalb* steht das Verb direkt danach: *deshalb sehe ich …*'
      - id: dass-werden
        type: fillBlank
        prompt: Ergänze *werden* in der richtigen Form.
        text: Ich glaube, dass Dokumentarfilme oft unterschätzt ___.
        blanks: [[werden]]
      - id: teilweise
        type: multipleChoice
        prompt: Mit welcher Reaktion stimmst du nur **teilweise** zu?
        options:
          - { text: Da stimme ich dir teilweise zu., correct: true }
          - {
              text: Das sehe ich genauso.,
              feedback: 'Mit *Das sehe ich genauso.* stimmst du ganz zu, nicht nur teilweise.',
            }
          - {
              text: Das sehe ich anders.,
              feedback: 'Mit *Das sehe ich anders.* stimmst du nicht zu.',
            }
      - id: ordne-meinung
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz.
        sentence: Meiner Meinung nach ist die Serie völlig überbewertet.
