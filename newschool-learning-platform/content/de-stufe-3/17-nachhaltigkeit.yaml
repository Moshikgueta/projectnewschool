# Cycle "Nachhaltigkeit", converted from the German level 3 digital notebook
# ("German Level 3- Digital Notebook", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (German).
course: de-stufe-3
slug: nachhaltigkeit
title: Nachhaltigkeit
goal: Mit Modalverben über Verantwortung und Lösungen sprechen und mit dem Konjunktiv II hypothetische Situationen beschreiben.
position: 17
status: in_review

review:
  - >-
    The two workbook exercises ("Modalverben" and "Konjunktiv II") are NEW: they were
    written from the cycle's summary, the activity examples, the homework sentences
    and the vocabulary. Please check level, wording and every right answer before
    students see them.
  - >-
    The notebook lists four language goals. The cycle overview keeps two skills:
    "Modalverben" (responsibility, possibilities, recommendations) and "Konjunktiv
    II" (hypothetical situations). Discussing the environment and proposing
    solutions is practised inside both.
  - >-
    The classic homework (Aufgaben 1–4) is kept in the homework section as practice
    for the students; the answer key ("Lösungsschlüssel") is ONLY in the teacher notes
    of that section. Key checked. Aufgabe 1, item 7 "Menschen ___ öfter öffentliche
    Verkehrsmittel benutzen, wenn es gute Verbindungen gibt" → "…, wenn es gute
    Verbindungen gäbe" so that the key's "könnten" (hypothetical) is clearly the
    answer. Aufgabe 1, item 8: the key says "sollten"; "dürfen" (Wir dürfen nicht
    erwarten, …) is also correct German; a teacher note says so. Aufgabe 3: the
    instruction says "use a different modal verb each time", but the key's model
    answers repeat sollte(n) / könnte(n); a teacher note says any correct modal verb
    is fine. The hint lines of Aufgabe 1 ("Eine Empfehlung." …) are now in brackets.
  - >-
    Summary (Hebrew, kept as written, as ruleSummary blocks with lang he; German
    examples in German). Fixes: the translation of "Menschen könnten weniger Plastik
    benutzen" said "אנשים יכולים" (= können); it now reads "אנשים היו יכולים / יכולים";
    "Unternehmen dürfen giftige Stoffe nicht einfach in die Natur werfen" → "…in die
    Natur leiten" (toxic substances are not "thrown"; same verb as homework Aufgabe
    1), Hebrew "לזרוק" → "להזרים". Please check the Hebrew.
  - >-
    Summary additions (please confirm and check the Hebrew): for recommendations we
    usually say *sollte / sollten* (Konjunktiv II of sollen), which all the examples
    use; *nicht dürfen* = forbidden vs. *nicht müssen* = not necessary; in a
    subordinate clause (weil, dass, wenn) the modal verb goes to the end; word order
    in wenn-sentences (verb at the end of the wenn-clause, the main clause starts
    with the verb: *…, würde ich …*); the Konjunktiv II forms *sollen → sollte* and
    *es gibt → es gäbe* (gäbe is used in homework Aufgabe 2). The modal verbs and the
    Konjunktiv II forms are tables.
  - >-
    Class corrections: Activity 3 "Welche eine Gewohnheit wollt ihr verändern?" →
    "Welche Gewohnheit (nur eine!) wollt ihr verändern?"; Activity 3, Step 5 "Jede
    Person hat ungefähr zwei Minuten Zeit. Präsentiert: …" and "Danach stellt die
    Gruppe zwei Rückfragen" → each group presents, every person speaks about two
    minutes, then the other groups ask two questions (please confirm); Activity 5
    named the teams "Gruppe 1 / Gruppe 2" and then "Gruppe A / Gruppe B": now A / B
    throughout. Heading "Wortschatzvfür Quizlet" and the broken "****" marks were
    cleaned up.
  - >-
    Left out: all "Antwort Teilnehmer/in 1/2/3" lines (the platform has answer boxes)
    and the empty "Datum / Teilnehmende" fields. No gamma.app link, no song lyrics and
    no real students' names in this cycle (Dina in the intro example is a model name).
    "Breakout-Räume" (online lesson) are kept in the teacher notes as "small groups /
    breakout rooms".
  - >-
    The source gives no times for any part of this cycle, so no minutes are set; it
    has five activities, more than one lesson can hold, so the teacher chooses.
    Sentence frames were added to the warm-up questions and to the activity
    discussion questions; the letter structure of Activity 4 became discussion
    questions with the source's Redemittel as frames.
  - >-
    Vocabulary: kept as in the source; "die natürlichen Ressourcen" → "die
    natürlichen Ressourcen (Pl.)". The Quizlet link lost its "?new" parameter.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: nachhaltigkeit-unterricht
    title: 'Unterricht: Nachhaltigkeit'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Nachhaltigkeit
      - id: skills
        type: cycleOverview
        skills:
          - name: Modalverben
            description: '*müssen, sollten, können / könnten, dürfen* für Verantwortung, Möglichkeiten und Empfehlungen: *Wir sollten weniger Plastik kaufen.*'
          - name: Konjunktiv II
            description: 'Hypothetische Situationen mit *wäre, hätte, könnte, müsste, würde*: *Wenn mehr Menschen recyceln würden, würde es weniger Müll geben.*'
      - id: quizlet
        type: externalLink
        label: Nachhaltigkeit auf Quizlet (Deutsch + Übersetzung)
        url: https://quizlet.com/1202278785/nachhaltigkeit-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Vorstellungsrunde
      - id: intro
        type: sentenceFrame
        frame: Ich bin ___. Um die Umwelt zu schützen, könnte ich ___.
        example: Ich bin Dina. Um die Umwelt zu schützen, könnte ich beim Abwaschen weniger Wasser benutzen.
      - id: warmup-title
        type: heading
        level: 3
        text: Einstiegsfragen
      - id: warmup-hint
        type: callout
        tone: info
        text: Antworte in **vollständigen Sätzen** und benutze **Modalverben** (*sollte, müsste, könnte*) und den **Konjunktiv II** (*wäre, würde*).
      - id: warmup
        type: discussionQuestions
        items:
          - question: Welche nachhaltige Gewohnheit aus einem anderen Land oder einer anderen Gemeinschaft sollte man deiner Meinung nach auch in Israel übernehmen?
            frame: Meiner Meinung nach sollte man auch in Israel ___ übernehmen, weil ___.
          - question: Warum recyceln manche Menschen nicht? Was könnte sie davon abhalten? Betrifft dich das auch?
            frame: Manche Menschen recyceln nicht, weil ___. ___ könnte sie davon abhalten.
          - question: Was könntest du persönlich häufiger tun, um die Umwelt zu schützen? Warum machst du es im Moment nicht?
            frame: Ich könnte ___. Im Moment mache ich es nicht, weil ___.
          - question: Was würdest du einer Person sagen, die Umweltschutz nicht wichtig findet?
            frame: Ich würde ihr sagen, dass ___.
          - question: Was würdest du tun, um mehr Menschen zum Recycling zu motivieren?
            frame: Ich würde ___.
          - question: Was sollten Städte und Gemeinden tun, um nachhaltiger zu werden?
            frame: Städte sollten ___. / Gemeinden müssten ___.
          - question: Wenn du ein neues Umweltgesetz einführen könntest, welches wäre es? Warum?
            frame: Wenn ich ein neues Umweltgesetz einführen könnte, wäre es ___, weil ___.
          - question: Welches Produkt sollte deiner Meinung nach verboten werden, weil es der Umwelt schadet? Begründe deine Meinung.
            frame: Meiner Meinung nach sollte ___ verboten werden, weil ___.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Wir könnten mehr tun'
        skills: [Modalverben]
        steps:
          - '**Schritt 1: Ideen sammeln.** Denk über Nachhaltigkeit im Alltag, in Unternehmen und in der Politik nach. Schreib vier Sätze darüber, was Menschen, Unternehmen oder Regierungen besser machen könnten. Benutze verschiedene Modalverben und die Satzanfänge unten.'
          - '**Schritt 2: Gruppengespräch.** Jede Person stellt zwei Ideen vor und erklärt, warum sie diese gewählt hat. Die anderen sagen nicht nur „Ich stimme zu.“: Sie reagieren mit Modalverben und stellen mindestens eine Rückfrage.'
          - '**Schritt 3: Drei Ideen auswählen.** Jede Gruppe wählt drei Ideen: die realistischste Idee, die effektivste langfristige Lösung und die kontroverseste Idee.'
          - '**Schritt 4: Präsentation.** Jede Gruppe präsentiert ihre drei Ideen. Danach stimmt die Klasse über die drei Kategorien ab.'
        example: |-
          *Die Regierung müsste mehr investieren, weil…*
          *Menschen könnten ihren Alltag verändern, indem…*
          *Unternehmen sollten verpflichtet werden, …*
          *Diese Lösung könnte besonders effektiv sein, weil…*
      - id: act1-ideas
        type: discussionQuestions
        title: 'Schritt 1: Meine vier Ideen'
        items:
          - question: Was sollten Menschen tun?
            frame: Um die Umwelt zu schützen, sollten Menschen ___.
          - question: Was wäre eine realistische Veränderung?
            frame: Eine realistische Veränderung könnte sein, dass ___.
          - question: Was müssen Unternehmen tun?
            frame: Große Unternehmen müssen ___.
          - question: Welche Lösung hat auch ein Problem?
            frame: Diese Lösung könnte helfen, aber ___.
          - question: Was würden Menschen tun, wenn sie wirklich etwas verändern wollten?
            frame: Wenn Menschen wirklich etwas verändern wollten, würden sie ___.
          - question: Was sollten wir nicht erwarten?
            frame: Wir sollten nicht erwarten, dass ___.
      - id: act1-questions
        type: discussionQuestions
        title: 'Schritt 2: Mögliche Rückfragen'
        items:
          - question: Warum könnte diese Idee funktionieren?
            frame: Diese Idee könnte funktionieren, weil ___.
          - question: Wer sollte dafür verantwortlich sein?
            frame: Dafür sollte ___ verantwortlich sein.
          - question: Was könnte dabei schiefgehen?
            frame: Es könnte schiefgehen, wenn ___.
          - question: Könnten Menschen diese Gewohnheit realistisch verändern?
          - question: Müssen Einzelpersonen handeln oder sollte die Regierung mehr Verantwortung übernehmen?
          - question: Was müsste passieren, damit diese Lösung funktioniert?
            frame: Damit diese Lösung funktioniert, müsste ___.
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Würdest du zu weit gehen?'
        skills: [Konjunktiv II, Modalverben]
        steps:
          - Auf der ganzen Welt versuchen Umweltaktivisten, Menschen zu überzeugen, nachhaltiger zu leben. Manche Proteste sind friedlich. Andere beinhalten aggressive Aktionen, Blockaden oder Sachbeschädigung.
          - '**Schritt 1: Gemeinsames Brainstorming.** Welche Umweltproteste kennt ihr? Welche waren friedlich? Welche waren kontrovers? Können aggressive Proteste manchmal effektiv sein? Wann geht ein Protest zu weit?'
          - '**Schritt 2: Rollen wählen.** Jede Gruppe bekommt zwei Situationen: eine friedliche Umweltaktion und eine aggressive oder kontroverse Umweltaktion. Jede Person wählt eine Rolle und behält sie für beide Situationen: Umweltaktivist/in, Regierungsvertreter/in, Bürger/in, Tourist/in oder außenstehende Person.'
          - '**Schritt 3: Rollenspiel.** Besprecht für jede Situation: *Wenn diese Demonstration in unserem Land stattfinden würde, würde sie Menschen wirklich dazu bringen, nachhaltiger zu leben?* Jede Person benutzt mindestens einen Satz im Konjunktiv II und einen Satz mit einem Modalverb.'
          - '**Schritt 4: Klassengespräch.** Jede Gruppe präsentiert eine Aussage zu jeder Protestform. Danach diskutiert die Klasse die Fragen unten.'
        example: |-
          *Wenn Menschen diesen Protest sehen würden, könnten sie stärker über das Problem nachdenken.*
          *Diese Aktion könnte Aufmerksamkeit schaffen, aber sie könnte auch viele Menschen verärgern.*
          *Wenn Aktivisten so handeln würden, würde die Öffentlichkeit vielleicht weniger Verständnis haben.*
          *Die Regierung sollte ruhig reagieren.*
          *Wenn Recycling einfacher wäre, würden wahrscheinlich mehr Menschen mitmachen.*
      - id: act2-roleplay
        type: discussionQuestions
        title: 'Schritt 3: In meiner Rolle'
        items:
          - question: Situation 1 (friedliche Aktion)
            frame: Wenn diese Demonstration in unserem Land stattfinden würde, ___. Die Regierung sollte ___.
          - question: Situation 2 (aggressive oder kontroverse Aktion)
            frame: Diese Aktion könnte ___, aber sie könnte auch ___.
      - id: act2-class
        type: discussionQuestions
        title: 'Schritt 4: Klassengespräch'
        items:
          - question: Welche Demonstration wäre effektiver?
            frame: ___ wäre effektiver, weil ___.
          - question: Welche könnte das Gegenteil erreichen?
            frame: ___ könnte das Gegenteil erreichen, weil ___.
          - question: Welche Protestform würde dich persönlich eher überzeugen?
            frame: Mich würde eher ___ überzeugen.
          - question: Sollten Umweltaktivisten Gesetze brechen dürfen, wenn sie auf ein wichtiges Problem aufmerksam machen wollen?
            frame: Ich finde, Umweltaktivisten sollten ___, weil ___.
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Kampagne für eine grünere Zukunft'
        skills: [Konjunktiv II, Modalverben]
        steps:
          - '**Schritt 1: Ein Thema auswählen.** Jede Gruppe bekommt ein allgemeines Nachhaltigkeitsthema, zum Beispiel: Recycling, weniger Plastik, Wasser sparen, nachhaltige Mode, weniger Lebensmittel verschwenden, öffentlicher Verkehr, weniger Autoverkehr. Macht das Thema konkreter: Welche Personengruppe wollt ihr erreichen? Welche Gewohnheit (nur eine!) wollt ihr verändern?'
          - '**Schritt 2: Ziel und Zielgruppe.** Was ist das genaue Ziel? Was soll sich verändern? Wer ist die Zielgruppe?'
          - '**Schritt 3: Strategie und Botschaft.** Was ist eure Hauptbotschaft? Wie wollt ihr die Menschen überzeugen? Welche Plattformen würdet ihr benutzen? Was könnte besonders gut funktionieren?'
          - '**Schritt 4: Sichtbarkeit und Erfolg.** Wo würden Menschen die Kampagne sehen? Wie könnte man den Erfolg messen? Was müsste passieren, damit ihr sagen könnt: Die Kampagne war erfolgreich?'
          - '**Schritt 5: Präsentation.** Jede Gruppe präsentiert ihre Kampagne, jede Person spricht ungefähr zwei Minuten: Thema, Zielgruppe, Ziel, Strategie und warum sie funktionieren könnte. Danach stellen die anderen zwei Rückfragen, zum Beispiel: *Was würdet ihr tun, wenn die Menschen die Kampagne ignorieren würden? Wie könntet ihr die Kampagne an eine andere Zielgruppe anpassen? Was könnte schiefgehen? Könnte die Kampagne auch ohne großes Budget funktionieren?*'
        example: |-
          *Unsere Kampagne konzentriert sich darauf, Jugendliche in großen Städten dazu zu motivieren, Plastikflaschen zu recyceln.*
          *Die Kampagne würde auf Instagram, in Schulen und im öffentlichen Verkehr erscheinen.*
          *Der Erfolg könnte durch die Menge des recycelten Materials gemessen werden.*
      - id: act3-plan
        type: discussionQuestions
        title: Unsere Kampagne
        items:
          - question: 'Schritt 1: Thema und Zielgruppe'
            frame: Unsere Kampagne konzentriert sich auf ___ bei ___.
          - question: 'Schritt 2: Ziel'
            frame: Unsere Kampagne soll ___. / Wir möchten erreichen, dass ___.
          - question: 'Schritt 2: Was würde sich verändern?'
            frame: Wenn unsere Zielgruppe diese Gewohnheit ändern würde, könnte ___. / Die Menschen sollten ___.
          - question: 'Schritt 3: Strategie und Botschaft'
            frame: Wir würden die Menschen überzeugen, indem ___. / Diese Strategie könnte funktionieren, weil ___.
          - question: 'Schritt 3: Hauptbotschaft'
            frame: Die Kampagne sollte zeigen, dass ___. / Menschen könnten ihre Gewohnheiten ändern, wenn ___.
          - question: 'Schritt 4: Sichtbarkeit und Erfolg'
            frame: Die Kampagne würde ___ erscheinen. Wenn die Kampagne erfolgreich wäre, würden mehr Menschen ___.
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Ein Brief für die Umwelt'
        skills: [Modalverben, Konjunktiv II]
        steps:
          - '**Schritt 1: Ein Problem auswählen.** Wähle ein Umweltthema, das dir wichtig ist, zum Beispiel: Recycling, Plastikmüll, öffentlicher Verkehr, Luftverschmutzung, Grünflächen, Wasserverschwendung, Lebensmittelverschwendung. Wähle danach eine Person, die etwas verändern könnte: Bürgermeister/in, Mitglied des Stadtrats, Schulleiter/in, Gemeindeleiter/in oder Politiker/in.'
          - '**Schritt 2: Einen formellen Brief oder eine E-Mail schreiben.** Dein Text hat sechs Teile: Begrüßung, das Problem erklären, eine Lösung vorschlagen, die mögliche Wirkung erklären, Folgen beschreiben, Abschluss (Satzanfänge unten).'
          - '**Schritt 3: Partnerarbeit.** Lest euch gegenseitig eure Texte vor. Die andere Person stellt danach zwei Fragen, zum Beispiel: *Wie realistisch ist diese Lösung? Wie viel würde sie kosten? Wer müsste dafür verantwortlich sein? Was könnte passieren, wenn die Idee nicht funktioniert?* Danach tauscht ihr die Rollen.'
          - '**Schritt 4: Klassengespräch.** Besprecht die Fragen unten.'
      - id: act4-letter
        type: discussionQuestions
        title: Mein Brief
        items:
          - question: Begrüßung
            frame: Sehr geehrte Frau ___, / Sehr geehrter Herr ___,
          - question: Das Problem erklären
            frame: Ich schreibe Ihnen, weil ___. / In unserer Stadt gibt es ein Problem mit ___.
          - question: Eine Lösung vorschlagen
            frame: Die Stadt sollte ___. / Man könnte ___. / Die Gemeinde müsste ___.
          - question: Die mögliche Wirkung erklären
            frame: Diese Lösung könnte helfen, weil ___. / Wenn die Stadt diese Maßnahme einführen würde, könnten ___.
          - question: Folgen beschreiben
            frame: Wenn sich nichts ändern würde, würde ___.
          - question: Abschluss
            frame: Vielen Dank für Ihre Zeit. Mit freundlichen Grüßen ___
      - id: act4-class
        type: discussionQuestions
        title: 'Schritt 4: Klassengespräch'
        items:
          - question: Wie würde die Person wahrscheinlich auf deinen Brief reagieren?
            frame: Ich glaube, die Person würde ___.
          - question: Welche Idee eines anderen Teilnehmers fandest du besonders interessant?
            frame: Besonders interessant fand ich ___, weil ___.
          - question: Wenn mehr Menschen solche Briefe schreiben würden, könnte das wirklich etwas verändern?
            frame: Wenn mehr Menschen solche Briefe schreiben würden, ___.
      - id: act5
        type: classActivity
        title: 'Aktivität 5: Sollte man die Natur in Ruhe lassen?'
        skills: [Modalverben, Konjunktiv II]
        steps:
          - 'Auf der ganzen Welt diskutieren Regierungen und Umweltorganisationen darüber, wie stark Menschen in die Natur eingreifen sollten. Manche Menschen glauben: *Die Natur sollte möglichst in Ruhe gelassen werden.* Andere glauben: *Menschen müssen die Natur aktiv schützen und kontrollieren.*'
          - 'Die zentrale Frage lautet: **Wenn Menschen aufhören würden, Naturgebiete zu kontrollieren, würde sich die Natur selbst erholen oder würden neue Probleme entstehen?**'
          - '**Gruppe A:** Menschen sollten so wenig wie möglich in die Natur eingreifen. **Gruppe B:** Menschen müssen Naturgebiete aktiv schützen und kontrollieren.'
          - '**Schritt 1: Argumente vorbereiten.** Besprecht die Fragen unten. Jedes Argument enthält mindestens ein Modalverb oder einen Satz im Konjunktiv II.'
          - '**Schritt 2: Debatte.** Gruppe A nennt ein Argument, Gruppe B reagiert. Dann nennt Gruppe B ein neues Argument, und Gruppe A reagiert. Redemittel: *Meiner Meinung nach sollten wir… / Ich glaube, dass die Regierung … müsste. / Das könnte funktionieren, aber… / Wenn Menschen nicht eingreifen würden, … / Ich verstehe deinen Punkt, aber…*'
          - '**Schritt 3: Klassendiskussion.** Besprecht die Fragen unten zusammen.'
      - id: act5-arguments
        type: discussionQuestions
        title: 'Schritt 1: Argumente vorbereiten'
        items:
          - question: Was würde passieren, wenn Menschen Wälder und Wildtiere überhaupt nicht mehr kontrollieren würden?
            frame: Wenn Menschen nicht eingreifen würden, ___.
          - question: Sollten Menschen Tierpopulationen kontrollieren?
            frame: Meiner Meinung nach sollten Menschen ___, weil ___.
          - question: Was sollte passieren, wenn eine bedrohte Tierart Probleme für lokale Gemeinden verursacht?
            frame: In diesem Fall sollte ___.
          - question: Könnte menschliches Eingreifen langfristig mehr Schaden verursachen?
            frame: Menschliches Eingreifen könnte ___.
          - question: Wer sollte entscheiden, wann Menschen eingreifen dürfen?
            frame: Ich glaube, dass ___ entscheiden müsste.
      - id: act5-class
        type: discussionQuestions
        title: 'Schritt 3: Klassendiskussion'
        items:
          - question: Gibt es in Israel Orte, an denen Menschen Probleme für die Natur verursachen?
          - question: Gibt es Situationen, in denen Natur Probleme für Menschen verursacht?
          - question: Kennst du ein Beispiel, bei dem menschliches Eingreifen der Natur geholfen hat?
          - question: Was würdest du anders machen, wenn dieselbe Situation heute noch einmal passieren würde?
            frame: Wenn dieselbe Situation heute noch einmal passieren würde, würde ich ___.
          - question: Was sollten Regierungen in Zukunft tun, um Natur und Menschen gleichzeitig zu schützen?
            frame: Regierungen sollten ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: **Modalverben** (Verantwortung,
          Möglichkeiten, Empfehlungen: *müssen, sollten, können / könnten, dürfen*) und
          der **Konjunktiv II** (hypothetische Situationen: *Wenn …, würde …*). Dazu
          kommen Diskussionen über Umweltschutz und persönliche Verantwortung und das
          Vorschlagen und Begründen von Lösungen. Das Heft gibt keine Zeiten an und hat
          fünf Aktivitäten: Wähle nach der verfügbaren Zeit aus.
      - id: n-intro
        anchor: intro
        text: Gib zuerst dein eigenes Beispiel. *könnte* ist hier ein höflicher Vorschlag (Konjunktiv II).
      - id: n-warmup
        anchor: warmup
        text: >-
          Wähle aus den acht Fragen aus. Die Teilnehmenden antworten möglichst in
          vollständigen Sätzen, mit Modalverben und Konjunktiv II.
      - id: n-act1
        anchor: act1
        text: >-
          Sprachziel: Modalverben. Sozialform: Einzelarbeit, dann Kleingruppen
          (Breakout-Räume). Achte auf das Modalverb auf Position 2 und den Infinitiv am
          Satzende. Am Ende stimmt die Klasse über die drei Kategorien ab.
      - id: n-act2
        anchor: act2
        text: >-
          Sprachziele: Konjunktiv II + Modalverben. Sozialform: Kleingruppen
          (Breakout-Räume) und Rollenspiel. Bereite für jede Gruppe zwei Situationen vor
          (eine friedliche und eine aggressive oder kontroverse Umweltaktion). Achte
          darauf, dass jede Person mindestens einen Satz im Konjunktiv II und einen mit
          einem Modalverb sagt.
      - id: n-act3
        anchor: act3
        text: >-
          Sprachziele: Konjunktiv II + Modalverben + Präsentation. Sozialform:
          Gruppenarbeit. Teile jeder Gruppe ein Thema zu. Im Heft steht „Jede Person hat
          ungefähr zwei Minuten Zeit“: Plane die Zeit nach der Gruppengröße.
      - id: n-act4
        anchor: act4
        text: >-
          Sprachziele: formelles Schreiben + Modalverben + Konjunktiv II. Sozialform:
          Einzelarbeit und Partnerarbeit. Achte auf die Anrede (*Sehr geehrte Frau … /
          Sehr geehrter Herr …*), die Sie-Form und *Mit freundlichen Grüßen* ohne
          Komma.
      - id: n-act5
        anchor: act5
        text: >-
          Sprachziele: Modalverben + Konjunktiv II + Debatte. Sozialform:
          Gruppendebatte. Teile die Klasse in Gruppe A und Gruppe B (im Heft zuerst
          „Gruppe 1 / 2“ genannt).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: nachhaltigkeit-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: rules-modal
        type: ruleSummary
        lang: he
        skill: 'Modalverben בגרמנית'
        rules:
          - text: 'Modalverben הם פעלים שעוזרים לנו להביע: חובה, המלצה, אפשרות, יכולת, רצון, רשות.'
          - text: 'המבנה: **Modalverb במקום השני + Infinitiv בסוף המשפט**.'
            examples:
              - Wir müssen die Umwelt schützen. – אנחנו חייבים להגן על הסביבה.
              - Die Regierung sollte mehr in öffentliche Verkehrsmittel investieren. – הממשלה צריכה להשקיע יותר בתחבורה ציבורית.
              - Menschen könnten weniger Plastik benutzen. – אנשים היו יכולים / יכולים להשתמש בפחות פלסטיק.
              - Unternehmen dürfen giftige Stoffe nicht einfach in die Natur leiten. – אסור לחברות פשוט להזרים חומרים רעילים לטבע.
          - text: 'חשוב לזכור שהפועל הראשי מגיע בסוף בצורת המקור:'
            examples:
              - Wir müssen mehr recyceln.
              - 'ולא: *Wir müssen recyceln mehr.*'
          - text: 'במשפט משני (אחרי **weil, dass, wenn**) ה־Modalverb בא בסוף המשפט, אחרי ה־Infinitiv.'
            examples:
              - Ich trenne meinen Müll, weil wir die Umwelt schützen **müssen**.
      - id: modal-table
        type: table
        lang: he
        caption: הפעלים המרכזיים ברמת B1
        header: [Modalverb, משמעות]
        rows:
          - [müssen, חייב]
          - ['sollen (sollte / sollten)', אמור / כדאי / צריך]
          - [können (könnte / könnten), יכול]
          - [dürfen, מותר]
          - [wollen, רוצה]
          - [möchten, היה רוצה]
      - id: rules-muessen-sollen
        type: ruleSummary
        lang: he
        skill: 'Modalverben: müssen מול sollen, können ו־könnten'
        rules:
          - text: 'יש הבדל בעוצמה. **müssen** מביע חובה חזקה:'
            examples:
              - Unternehmen müssen Umweltgesetze einhalten. – חברות חייבות לציית לחוקי סביבה.
          - text: '**sollen** מביע המלצה או ציפייה. להמלצה משתמשים בדרך כלל בצורה **sollte / sollten** (Konjunktiv II של sollen):'
            examples:
              - Menschen sollten weniger Plastik kaufen. – אנשים צריכים / כדאי שיקנו פחות פלסטיק.
          - text: 'אפשר לחשוב על זה כך: **müssen** = אין ממש ברירה; **sollen** = זו ההמלצה או הדבר הנכון לעשות.'
          - text: 'שימו לב: **nicht dürfen** = אסור. **nicht müssen** = לא חייבים (אין צורך).'
            examples:
              - Fabriken dürfen giftige Stoffe nicht in Flüsse leiten. – אסור למפעלים להזרים חומרים רעילים לנהרות.
              - Du musst heute nicht mit dem Auto fahren. – אתה לא חייב לנסוע היום ברכב.
          - text: '**können** מתאר יכולת או אפשרות אמיתית. **könnten** הוא Konjunktiv II ומשמש להצעה רכה או אפשרות היפותטית. לכן **könnten** שימושי מאוד כאשר מציעים פתרונות.'
            examples:
              - Wir können öfter mit dem Bus fahren. – אנחנו יכולים לנסוע באוטובוס לעיתים קרובות יותר.
              - Wir könnten öfter mit dem Bus fahren. – יכולנו / אפשר היה לנסוע באוטובוס לעיתים קרובות יותר.
              - Die Stadt könnte mehr Fahrradwege bauen. – העיר יכולה / הייתה יכולה לבנות יותר שבילי אופניים.
      - id: rules-konjunktiv
        type: ruleSummary
        lang: he
        skill: Konjunktiv II
        rules:
          - text: 'משתמשים ב־Konjunktiv II כדי לדבר על מצבים דמיוניים, היפותטיים או לא מציאותיים. מבנה נפוץ: **Wenn + Konjunktiv II, würde + Infinitiv**.'
            examples:
              - Wenn mehr Menschen recyceln würden, würde es weniger Müll geben. – אם יותר אנשים היו ממחזרים, הייתה פחות פסולת.
              - Wenn öffentliche Verkehrsmittel billiger wären, würden weniger Menschen mit dem Auto fahren. – אם התחבורה הציבורית הייתה זולה יותר, פחות אנשים היו נוסעים ברכב.
          - text: 'סדר המילים: בחלק של **wenn** הפועל בא בסוף; החלק השני מתחיל בפועל (würde / könnte / müsste) ואחריו הנושא.'
            examples:
              - Wenn ich Bürgermeister **wäre**, **würde** ich mehr Fahrradwege bauen.
          - text: 'דוגמאות:'
            examples:
              - Wenn ich Bürgermeister wäre, würde ich mehr Fahrradwege bauen.
              - Wenn die Stadt mehr Geld hätte, könnte sie mehr Parks schaffen.
              - Wenn wir weniger Wasser hätten, müssten wir unseren Verbrauch stark reduzieren.
      - id: konjunktiv-table
        type: table
        lang: he
        caption: צורות חשובות של Konjunktiv II
        header: [Infinitiv, Konjunktiv II, דוגמה]
        rows:
          - [sein, wäre, 'Wenn ich Bürgermeister wäre, …']
          - [haben, hätte, 'Wenn die Stadt mehr Geld hätte, …']
          - [können, könnte, … könnte sie mehr Parks schaffen.]
          - [müssen, müsste, … müssten wir weniger verbrauchen.]
          - [werden, würde, … würde es weniger Müll geben.]
          - [sollen, sollte, Wir sollten weniger Plastik kaufen.]
          - [es gibt, es gäbe, 'Wenn es kein sauberes Wasser mehr gäbe, …']
      - id: rules-bedeutung
        type: ruleSummary
        lang: he
        skill: 'Konjunktiv II: würde, könnte ו־müsste'
        rules:
          - text: 'יש הבדל במשמעות. **würde** = מה היה קורה:'
            examples:
              - Wenn Autos verboten wären, würden mehr Menschen den Bus nehmen.
          - text: '**könnte** = מה היה יכול לקרות / אפשרות:'
            examples:
              - Wenn die Stadt mehr investieren würde, könnte die Luftqualität besser werden.
          - text: '**müsste** = מה היה צריך לקרות / חובה במצב היפותטי:'
            examples:
              - Wenn Wasser knapp wäre, müssten die Menschen weniger verbrauchen.
      - id: rules-loesungen
        type: ruleSummary
        lang: he
        skill: 'Modalverben und Konjunktiv II: להביע הצעות ופתרונות'
        rules:
          - text: 'בדיונים על Nachhaltigkeit אפשר להשתמש ב:'
            examples:
              - Wir sollten...
              - Die Regierung müsste...
              - Unternehmen könnten...
              - Man könnte...
              - Es wäre besser, wenn...
              - Eine mögliche Lösung wäre...
          - text: 'דוגמאות:'
            examples:
              - Eine mögliche Lösung wäre, mehr Recyclingstationen zu bauen.
              - Man könnte öffentliche Verkehrsmittel billiger machen.
              - Es wäre besser, wenn Unternehmen weniger Plastik benutzen würden.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: >-
          Wiederhole die zwei Fertigkeiten mit der Gruppe: Bitte jede Person um einen
          Vorschlag mit *sollte / könnte* und einen Wenn-Satz im Konjunktiv II. Die
          Regeln zu *nicht dürfen / nicht müssen*, zum Modalverb im Nebensatz, zur
          Wortstellung im Wenn-Satz und die Formen *sollte, gäbe* sind Ergänzungen zum
          Heft.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: nachhaltigkeit-hausaufgaben
    title: Hausaufgaben
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben
      - id: aufgabe1-hint
        type: text
        text: '**Aufgabe 1: Modalverben.** Wähle das passende Modalverb: *müssen / sollten / könnten / dürfen / müsste / könnte*'
      - id: aufgabe1
        type: discussionQuestions
        title: 'Aufgabe 1: Modalverben'
        items:
          - question: Unternehmen ___ weniger Plastikverpackungen benutzen. *(Eine Empfehlung.)*
          - question: Fabriken ___ giftige Stoffe nicht einfach in Flüsse leiten. *(Es ist verboten.)*
          - question: Regierungen ___ Umweltgesetze kontrollieren und durchsetzen. *(Es ist eine starke Verpflichtung.)*
          - question: Städte ___ mehr Fahrradwege bauen. *(Eine mögliche Lösung.)*
          - question: Wenn unsere Stadt mehr Geld hätte, ___ sie mehr Grünflächen schaffen.
          - question: Wenn Wasser sehr knapp wäre, ___ jeder seinen Verbrauch reduzieren.
          - question: Menschen ___ öfter öffentliche Verkehrsmittel benutzen, wenn es gute Verbindungen gäbe.
          - question: Wir ___ nicht erwarten, dass nur Regierungen das Problem lösen.
      - id: aufgabe2
        type: discussionQuestions
        title: 'Aufgabe 2: Konjunktiv II. Ergänze die passende Form.'
        items:
          - question: Wenn mehr Menschen recyceln ___, ___ es weniger Müll geben. *(würden / würde)*
          - question: Wenn öffentliche Verkehrsmittel billiger ___, ___ mehr Menschen sie benutzen. *(wären / würden)*
          - question: Wenn ich Bürgermeister ___, ___ ich mehr Parks bauen. *(wäre / würde)*
          - question: Wenn Unternehmen weniger Plastik ___, ___ sie viel Müll vermeiden. *(benutzen würden / könnten)*
          - question: Wenn wir mehr erneuerbare Energie ___, ___ die Luft sauberer sein. *(nutzen würden / könnte)*
          - question: Wenn es kein sauberes Wasser mehr ___, ___ wir unseren Alltag komplett verändern. *(gäbe / müssten)*
      - id: aufgabe3
        type: discussionQuestions
        title: 'Aufgabe 3: Was sollte man tun? Schreib für jedes Problem eine Lösung. Benutze jedes Mal ein anderes Modalverb.'
        items:
          - question: In der Stadt gibt es zu viel Verkehr.
            frame: Die Stadt ___.
          - question: Viele Menschen benutzen Einwegplastik.
            frame: Menschen ___.
          - question: Unternehmen produzieren zu viel Müll.
            frame: Unternehmen ___.
          - question: Viele Menschen recyceln nicht.
            frame: Die Regierung / Die Stadt ___.
          - question: In der Stadt gibt es zu wenige Grünflächen.
            frame: Man ___.
      - id: aufgabe4-title
        type: heading
        level: 3
        text: 'Aufgabe 4: Wenn ich entscheiden könnte'
      - id: aufgabe4-rules
        type: callout
        tone: info
        title: So schreibst du deinen Text
        text: |-
          Stell dir vor, du könntest drei Dinge in deiner Stadt verändern, um sie nachhaltiger zu machen. Schreib **7 bis 9 Sätze** über:
          - eine Veränderung im Verkehr
          - eine Veränderung beim Müll oder Recycling
          - eine Veränderung bei Energie, Wasser oder Grünflächen
          Benutze mindestens: **2 Sätze mit sollten / müssen**, **2 Sätze mit könnten**, **2 Sätze im Konjunktiv II** und **eine Begründung mit weil**.
          Du kannst so beginnen: *Wenn ich Bürgermeister/in meiner Stadt wäre, würde ich … / Die Stadt sollte … / Wir könnten … / Wenn mehr Menschen …, würde …*
      - id: aufgabe4
        type: reflection
        prompt: Mein Text (7 bis 9 Sätze)
      - id: mori-title
        type: heading
        level: 3
        text: Hausaufgaben mit Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere die Nachricht und schick sie ab. Mori stellt dir Fragen; beantworte alle.
      - id: mori-gespraech
        type: aiTutorPrompt
        title: Ein Gespräch über Nachhaltigkeit
        intro: 'Versuche im Gespräch: mindestens 2 Sätze mit **sollten**, mindestens 1 Satz mit **müssen**, mindestens 2 Sätze mit **könnten** und mindestens 3 Sätze im **Konjunktiv II**.'
        message: >-
          Hallo Mori. Ich möchte auf B1-Niveau über Nachhaltigkeit und Umweltschutz
          sprechen. Stelle mir nacheinander 6 Fragen über Recycling, Plastik, Verkehr,
          Energie und persönliche Verantwortung. Hilf mir, Modalverben wie ‚sollten‘,
          ‚müssen‘, ‚könnten‘ und ‚dürfen‘ zu benutzen. Stelle mir auch mindestens drei
          hypothetische Fragen mit ‚Was würde passieren, wenn...?‘, damit ich den
          Konjunktiv II üben kann. Wenn meine Antwort zu kurz ist, stelle mir eine
          Rückfrage. Widersprich mir manchmal höflich, damit ich meine Meinung genauer
          erklären muss. Korrigiere am Ende meine wichtigsten Fehler und zeige mir drei
          bessere Beispielsätze.
      - id: mori-ende
        type: aiTutorPrompt
        title: Am Ende des Gesprächs
        intro: Frag Mori am Schluss nach deinen Fehlern und nach neuen Wörtern.
        message: Welche drei Fehler habe ich am häufigsten gemacht und welche fünf Wörter aus unserem Gespräch sollte ich mir merken?
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Das **Modalverb** steht auf Position 2, der **Infinitiv am Satzende**. Im Wenn-Satz steht das Verb am Ende: *Wenn ich Bürgermeister wäre, würde ich …*
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**
    teacherNotes:
      - id: n-aufgabe1
        anchor: aufgabe1
        text: >-
          Lösung Aufgabe 1: 1. sollten; 2. dürfen; 3. müssen; 4. könnten; 5. könnte; 6.
          müsste; 7. könnten; 8. sollten. In Satz 7 steht jetzt „wenn es gute
          Verbindungen gäbe“ (im Heft: „gibt“), damit *könnten* klar hypothetisch ist. In
          Satz 8 ist auch *dürfen* richtig (*Wir dürfen nicht erwarten, dass …*).
      - id: n-aufgabe2
        anchor: aufgabe2
        text: >-
          Lösung Aufgabe 2: 1. würden … würde; 2. wären … würden; 3. wäre … würde; 4.
          benutzen würden … könnten; 5. nutzen würden … könnte; 6. gäbe … müssten.
      - id: n-aufgabe3
        anchor: aufgabe3
        text: >-
          Mehrere Antworten sind möglich, zum Beispiel: 1. Die Stadt sollte den
          öffentlichen Verkehr verbessern. 2. Menschen könnten wiederverwendbare Taschen
          und Flaschen benutzen. 3. Unternehmen müssen weniger Verpackungsmaterial
          produzieren. 4. Die Stadt könnte mehr Recyclingstationen aufstellen. 5. Man
          sollte mehr Parks und Grünflächen schaffen. Die Beispiele wiederholen
          *sollte / könnte*; jedes richtige Modalverb ist in Ordnung.
      - id: n-aufgabe4
        anchor: aufgabe4
        text: >-
          Persönliche Antwort. Beispiel aus dem Heft: Wenn ich Bürgermeister meiner Stadt
          wäre, würde ich zuerst den öffentlichen Verkehr verbessern. Die Stadt sollte
          mehr Busse einsetzen und müsste neue Fahrradwege bauen. Die Menschen könnten
          dann öfter das Auto zu Hause lassen. Außerdem würde ich mehr
          Recyclingstationen in Wohngebieten aufstellen. Unternehmen sollten weniger
          Einwegplastik verwenden, weil dadurch viel Müll entsteht. Wir könnten auch mehr
          Solarenergie auf öffentlichen Gebäuden nutzen. Wenn die Stadt mehr in
          erneuerbare Energie investieren würde, könnte sie langfristig weniger fossile
          Energie verbrauchen. Ich glaube, dass diese Veränderungen die Stadt sauberer
          und lebenswerter machen würden.

