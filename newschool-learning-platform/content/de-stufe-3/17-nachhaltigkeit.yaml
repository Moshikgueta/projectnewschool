vocabulary:
  - slug: nachhaltigkeit
    title: Nachhaltigkeit
    items: *nachhaltigkeit-words

activities:
  - slug: nachhaltigkeit-modalverben
    title: Modalverben
    minutes: 8
    items:
      - id: duerfen-verboten
        type: multipleChoice
        prompt: 'Fabriken ___ giftige Stoffe nicht einfach in Flüsse leiten. (Es ist verboten.)'
        options:
          - { text: dürfen, correct: true }
          - {
              text: müssen,
              feedback: '*nicht müssen* heißt: Es ist nicht nötig. Für ein Verbot sagen wir *nicht dürfen*.',
            }
          - {
              text: sollten,
              feedback: '*sollten* ist nur eine Empfehlung. Für ein Verbot sagen wir *nicht dürfen*.',
            }
      - id: muessen-pflicht
        type: multipleChoice
        prompt: 'Unternehmen ___ Umweltgesetze einhalten. (Eine starke Pflicht: Es gibt keine Wahl.)'
        options:
          - { text: müssen, correct: true }
          - {
              text: sollten,
              feedback: '*sollten* ist eine Empfehlung. Für eine starke Pflicht sagen wir *müssen*.',
            }
          - {
              text: könnten,
              feedback: '*könnten* ist eine Möglichkeit oder ein Vorschlag. Für eine starke Pflicht sagen wir *müssen*.',
            }
      - id: infinitiv-ende
        type: trueFalse
        prompt: 'Der Satz *Wir müssen recyceln mehr.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! Der Infinitiv steht am Satzende: *Wir müssen mehr recyceln.*'
          incorrect: 'Das Modalverb steht auf Position 2, der Infinitiv am Satzende: *Wir müssen mehr recyceln.*'
      - id: sollten-empfehlung
        type: fillBlank
        prompt: 'Ergänze das passende Modalverb. (Eine Empfehlung.)'
        text: Menschen ___ weniger Plastik kaufen.
        blanks: [[sollten]]
        wordBank: [müssen, sollten, dürfen]
      - id: bedeutung
        type: matching
        prompt: Was bedeutet das Modalverb?
        pairs:
          - [müssen, Es ist eine Pflicht.]
          - [sollten, Es ist eine Empfehlung.]
          - [dürfen, Es ist erlaubt.]
          - [können, Es ist möglich.]
          - [wollen, Ich habe den Wunsch.]
      - id: vorschlag
        type: multipleChoice
        prompt: Welcher Satz ist ein höflicher Vorschlag?
        options:
          - { text: Die Stadt könnte mehr Fahrradwege bauen., correct: true }
          - {
              text: Die Stadt muss mehr Fahrradwege bauen.,
              feedback: '*muss* ist eine starke Pflicht, kein höflicher Vorschlag. Für einen Vorschlag sagen wir *könnte*.',
            }
          - {
              text: Die Stadt darf mehr Fahrradwege bauen.,
              feedback: '*darf* bedeutet, dass es erlaubt ist. Für einen Vorschlag sagen wir *könnte*.',
            }
