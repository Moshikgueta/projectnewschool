vocabulary:
  - slug: geld-und-sparen
    title: Geld und Sparen
    items: *geld-und-sparen-words

activities:
  - slug: geld-und-sparen-konjunktiv
    title: Konjunktiv II
    minutes: 8
    items:
      - id: haette-reisen
        type: multipleChoice
        prompt: Wenn ich mehr Geld ___, würde ich öfter reisen.
        options:
          - { text: hätte, correct: true }
          - {
              text: habe,
              feedback: '*habe* ist Indikativ: Das ist real. Für eine unreale Situation brauchen wir den Konjunktiv II: *hätte*.',
            }
          - {
              text: hatte,
              feedback: '*hatte* ist Präteritum (Vergangenheit). Hier sprechen wir über eine unreale Situation: *Wenn ich mehr Geld hätte …*',
            }
      - id: waere-reich
        type: fillBlank
        prompt: Ergänze *sein* im Konjunktiv II.
        text: Wenn ich reich ___, würde ich weniger arbeiten.
        blanks: [[wäre]]
      - id: an-deiner-stelle
        type: fillBlank
        prompt: Ergänze *werden* im Konjunktiv II.
        text: An deiner Stelle ___ ich weniger Geld verschwenden.
        blanks: [[würde]]
      - id: wortstellung
        type: trueFalse
        prompt: 'Der Satz *Wenn ich mehr Geld hätte, ich würde reisen.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! Nach dem wenn-Satz kommt zuerst das Verb: *Wenn ich mehr Geld hätte, würde ich reisen.*'
          incorrect: 'Nach dem wenn-Satz beginnt der Hauptsatz mit dem Verb: *…, würde ich reisen.*'
      - id: vergangenheit
        type: multipleChoice
        prompt: Wenn ich früher gespart ___, hätte ich ein Haus gekauft.
        options:
          - { text: hätte, correct: true }
          - {
              text: würde,
              feedback: 'Für eine Vergangenheit, die nicht passiert ist, benutzen wir *hätte / wäre* + Partizip II: *gespart hätte*.',
            }
          - {
              text: wäre,
              feedback: '*sparen* bildet das Perfekt mit *haben*. Darum: *Wenn ich früher gespart hätte …*',
            }
      - id: formen
        type: matching
        prompt: Welche Form im Konjunktiv II (ich) passt zu welchem Verb?
        pairs:
          - [haben, hätte]
          - [sein, wäre]
          - [werden, würde]
          - [können, könnte]
          - [müssen, müsste]
      - id: ordne-rat
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Ratschlag.
        sentence: An deiner Stelle würde ich mehr sparen.
      - id: schulden
        type: fillBlank
        prompt: Ergänze *werden* und *haben* im Konjunktiv II.
        text: Wenn Menschen besser mit Geld umgehen ___, ___ sie weniger Schulden.
        blanks: [[würden], [hätten]]

  - slug: geld-und-sparen-passiv
    title: Passiv mit Modalverben
    minutes: 8
    items:
      - id: gespart-werden
        type: multipleChoice
        prompt: Mehr Geld sollte ___.
        options:
          - { text: gespart werden, correct: true }
          - {
              text: werden gespart,
              feedback: 'Am Satzende steht zuerst das Partizip II, dann *werden*: *gespart werden*.',
            }
          - {
              text: sparen werden,
              feedback: 'Im Passiv brauchen wir das Partizip II: *gespart werden*.',
            }
      - id: unterrichtet
        type: fillBlank
        prompt: Schreib das Partizip II von *unterrichten*.
        text: Finanzielle Bildung sollte in Schulen ___ werden.
        blanks: [[unterrichtet]]
      - id: handlung
        type: trueFalse
        prompt: Im Passiv ist die Handlung wichtiger als die Person, die sie macht.
        answer: true
        feedback:
          correct: 'Richtig! *Geld wird gespart.* Wer spart, ist nicht wichtig.'
          incorrect: 'Doch: Das Passiv benutzen wir, wenn die Handlung wichtiger ist als die Person: *Geld wird gespart.*'
      - id: aktiv-passiv
        type: multipleChoice
        prompt: '*Die Menschen sollten weniger Geld verschwenden.* Welcher Satz ist das Passiv?'
        options:
          - { text: Weniger Geld sollte verschwendet werden., correct: true }
          - {
              text: Weniger Geld sollte verschwenden werden.,
              feedback: 'Im Passiv steht das Partizip II vor *werden*: *verschwendet werden*.',
            }
          - {
              text: Weniger Geld wird verschwendet sollen.,
              feedback: 'Das Modalverb steht auf Position 2, *Partizip II + werden* am Ende: *Weniger Geld sollte verschwendet werden.*',
            }
      - id: koennte
        type: fillBlank
        prompt: Ergänze *können* im Konjunktiv II.
        text: Lebensmittelverschwendung ___ reduziert werden.
        blanks: [[könnte]]
      - id: werden-praesens
        type: fillBlank
        prompt: 'Passiv Präsens: Ergänze *werden*.'
        text: Viele Produkte ___ gekauft.
        blanks: [[werden]]
      - id: paare
        type: matching
        prompt: Welcher Passivsatz passt zu welchem Aktivsatz?
        pairs:
          - [Die Regierung sollte Bildung fördern., Bildung sollte gefördert werden.]
          - [Familien sollten Verschwendung vermeiden., Verschwendung sollte vermieden werden.]
          - [Die Stadt könnte die Kosten senken., Die Kosten könnten gesenkt werden.]
          - [Wir sollten alte Dinge wiederverwenden., Alte Dinge sollten wiederverwendet werden.]
      - id: ordne-passiv
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Passivsatz.
        sentence: Weniger Geld sollte für unnötige Produkte ausgegeben werden.
