vocabulary:
  - slug: achtsamkeit-und-entspannung
    title: Achtsamkeit und Entspannung
    items: *achtsamkeit-und-entspannung-words

activities:
  - slug: achtsamkeit-und-entspannung-adjektive
    title: Adjektive für Gefühle, Orte und Atmosphäre
    minutes: 8
    items:
      - id: erschoepft
        type: multipleChoice
        prompt: Nach einem langen Arbeitstag bin ich oft sehr ___.
        options:
          - { text: erschöpft, correct: true }
          - {
              text: harmonisch,
              feedback: '*harmonisch* beschreibt einen Ort oder eine Atmosphäre, nicht wie müde eine Person ist. Sehr müde = *erschöpft*.',
            }
          - {
              text: erholsam,
              feedback: '*erholsam* beschreibt etwas, das uns Ruhe gibt (ein erholsamer Urlaub). Sehr müde = *erschöpft*.',
            }
      - id: ruhiger-raum
        type: fillBlank
        prompt: Ergänze *ruhig* mit der richtigen Endung.
        text: Das ist ein ___ Raum.
        blanks: [[ruhiger]]
      - id: entspannende-uebung
        type: fillBlank
        prompt: Ergänze *entspannend* mit der richtigen Endung.
        text: Wir haben eine ___ Übung gemacht.
        blanks: [[entspannende]]
      - id: keine-endung
        type: trueFalse
        prompt: 'Nach *sein, werden* oder *bleiben* bekommt das Adjektiv keine Endung: *Der Raum ist ruhig.*'
        answer: true
        feedback:
          correct: 'Richtig! *Der Raum ist ruhig.* Aber vor einem Nomen: *ein ruhiger Raum*.'
          incorrect: 'Doch: Nach *sein, werden, bleiben* gibt es keine Endung (*Der Raum ist ruhig*). Nur vor einem Nomen: *ein ruhiger Raum*.'
      - id: genauer
        type: matching
        prompt: Welches genauere Adjektiv passt zu welchem einfachen Adjektiv?
        pairs:
          - [müde, erschöpft]
          - [nervös, angespannt]
          - [schlecht, belastend]
          - [schön, harmonisch]
          - [ruhig, friedlich]
      - id: beruhigend
        type: multipleChoice
        prompt: Ein Raum mit Pflanzen und natürlichem Licht wirkt oft ___.
        options:
          - { text: beruhigend, correct: true }
          - {
              text: impulsiv,
              feedback: '*impulsiv* beschreibt das Verhalten einer Person, nicht einen Raum.',
            }
          - {
              text: erschöpft,
              feedback: '*erschöpft* beschreibt, wie sich eine Person fühlt (sehr müde), nicht einen Raum.',
            }
      - id: stressiger-tag
        type: fillBlank
        prompt: Ergänze *stressig* mit der richtigen Endung.
        text: Gestern war ein ___ Tag.
        blanks: [[stressiger]]
      - id: ordne-atmosphaere
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz.
        sentence: Die Atmosphäre war besonders angenehm.
        alsoAccept: [Besonders angenehm war die Atmosphäre]

  - slug: achtsamkeit-und-entspannung-konjunktiv
    title: Konjunktiv II
    minutes: 8
    items:
      - id: wuerde-haette
        type: fillBlank
        prompt: Ergänze *werden* und *haben* im Konjunktiv II.
        text: Wenn ich weniger arbeiten ___, ___ ich mehr Zeit zum Entspannen.
        blanks: [[würde], [hätte]]
      - id: waere
        type: multipleChoice
