# Cycle "Gefühle und Emotionen", converted from the German level 3 digital notebook
# ("German Level 3- Digital Notebook", docs/CONTENT-AUDIT.md). DRAFT for teacher review:
# see `review` below. Blocks without `lang` are in the course language (German).
course: de-stufe-3
slug: gefuehle-und-emotionen
title: Gefühle und Emotionen
goal: Über Gefühle und Erfahrungen sprechen, mit genauen Gefühlsadjektiven und dem Perfekt mit schon einmal und noch nie.
position: 15
status: in_review

review:
  - >-
    The two workbook exercises ("Adjektive für Gefühle" and "Perfekt für Erfahrungen")
    are NEW: they were written from the cycle's summary rules, the activity examples,
    the homework exercises and the vocabulary. Please check level, wording and every
    right answer before students see them.
  - >-
    The notebook lists four language goals: (1) adjectives to describe feelings, (2)
    Perfekt for experiences, (3) questions and answers with schon einmal, jemals and noch
    nie, (4) talking about feelings in more detail. The cycle overview keeps two skills:
    "Adjektive für Gefühle" (1 + 4) and "Perfekt für Erfahrungen" (2 + 3). "jemals" is
    named in the goals but not used anywhere in the notebook; one line about it was
    ADDED to the summary (please confirm).
  - >-
    Summary, "Perfekt מול זמן עבר מוגדר": the Hebrew text says that after the general
    question with "schon einmal" the story itself is told in "the past details". This
    comes from the English present perfect vs. past simple rule and does not fit German:
    in German both the general experience and the specific event are normally told in
    the Perfekt (and in Präteritum with sein, haben and modal verbs). The difference is
    only the time words (schon einmal / noch nie vs. letztes Jahr, damals). The rule was
    rewritten in German and in Hebrew.
  - >-
    "Ja, das habe ich." (Activity 4 example and the summary) is a calque of English "Yes,
    I have"; natural German is "Ja, schon einmal." or "Ja, habe ich." Changed in both
    places; the short answer "Ja, habe ich" now also shows "Ja, bin ich" for sein-verbs.
    ADDED: the rule that with sein, German usually prefers "war" (Präteritum) to "bin …
    gewesen"; the source sentences with "gewesen" (warm-up examples, Activity 2 frame,
    Activity 3 model, summary) are correct and were kept. Please confirm.
  - >-
    Summary, haben / sein: "many verbs of movement or change of place use sein" now also
    names change of state (e.g. werden, aufwachen) as in earlier cycles. Activity 4: the
    verb table now shows the helping verb (hat gewonnen, ist gereist …); the source had
    only the Partizip II. Please confirm.
  - >-
    Not in the platform: the Inside Out clips (Activities 1 and 3; German title "Alles
    steht Kopf") and the bingo cards (Activity 2) are not in the notebook. They are
    mentioned in teacher notes; please add a YouTube link for the clips if you have one.
  - >-
    Homework: the four Aufgaben are kept as practice for the students; the answer key
    (checked, all correct) is in teacher notes only. The Aufgabe 4 model text from the
    key is in a teacher note.
  - >-
    Left out: the "Datum / Teilnehmende" lines and all "Antwort Teilnehmer/in 1/2/3"
    lines (the platform has answer boxes). The source gives no times for this cycle.
    Stray "**" marks were removed throughout; "Am Ende frage Mori" → "Frag Mori am
    Ende".
  - >-
    Vocabulary: "überfordert – מוצף / לא מסוגל להתמודד" kept; "erleichtert – חש הקלה"
    kept. The Quizlet link lost its tracking parameter (?new).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: gefuehle-und-emotionen-unterricht
    title: 'Unterricht: Gefühle und Emotionen'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Gefühle und Emotionen
      - id: skills
        type: cycleOverview
        skills:
          - name: Adjektive für Gefühle
            description: 'Gefühle genauer beschreiben: *Ich fühle mich erleichtert. Er wirkt unsicher. Ich war ziemlich enttäuscht.*'
          - name: Perfekt für Erfahrungen
            description: '*Hast du schon einmal …? Bist du schon einmal …? Ich habe noch nie …*'
      - id: quizlet
        type: externalLink
        label: Gefühle und Emotionen auf Quizlet
        url: https://quizlet.com/il/1201955668/gefuhle-und-emotionen-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Vorstellungsrunde
      - id: intro
        type: sentenceFrame
        frame: Ich bin ___. Wenn ich Deutsch spreche, fühle ich mich ___.
        example: Ich bin Shachar. Wenn ich Deutsch spreche, fühle ich mich manchmal unsicher, aber auch neugierig.
      - id: warmup-title
        type: heading
        level: 3
        text: Einstiegsfragen
      - id: warmup-hint
        type: callout
        tone: info
        text: Antworte möglichst in vollständigen Sätzen. Bei Fragen über Erfahrungen benutzt du das **Perfekt**. Beschreibe deine Gefühle mit **genauen Adjektiven**. Wenn du nicht über persönliche Erfahrungen sprechen möchtest, kannst du auch eine Situation erfinden.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Fällt es dir leicht, über deine Gefühle zu sprechen? Warum oder warum nicht?
            frame: Es fällt mir (nicht) leicht, über meine Gefühle zu sprechen, weil ___.
          - question: Hast du schon einmal etwas gemacht, auf das du wirklich stolz warst? Was ist passiert?
            frame: Ich bin besonders stolz auf mich gewesen, als ich ___.
          - question: Bist du schon einmal auf einen Freund oder eine Freundin neidisch gewesen? Warum?
            frame: Ich bin einmal neidisch gewesen, weil ___.
          - question: Hast du schon einmal deine Gefühle vor einer Person versteckt, die dir wichtig ist? Warum?
            frame: Ja, ich habe einmal ___. / Nein, das habe ich noch nie gemacht.
          - question: Hast du dich schon einmal wegen einer kleinen Sache schuldig gefühlt? Was ist passiert?
            frame: Ich habe mich schuldig gefühlt, als ___.
          - question: Wie fühlst du dich normalerweise nach einem langen Arbeitstag? Benutze mindestens drei Adjektive.
            frame: Nach einem langen Arbeitstag fühle ich mich ___, ___ und ___.
          - question: Welche einfache Sache in deinem Alltag macht dich zufrieden? Warum?
            frame: ___ macht mich zufrieden, weil ___.
          - question: Hat jemand in deinem Leben schon einmal etwas getan, wofür du besonders dankbar warst? Erzähl davon.
            frame: Ich war ___ besonders dankbar, weil er / sie ___ hat.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Unsere Emotionen'
        skills: [Adjektive für Gefühle]
        steps:
          - '**Schritt 1 – Emotionen kennenlernen (Klassengespräch):** Wer hat den Film *Inside Out* (*Alles steht Kopf*) gesehen? Seht gemeinsam einen kurzen Ausschnitt, in dem verschiedene Emotionen dargestellt werden, und sprecht über die Fragen unten.'
          - '**Schritt 2 – Eine neue Emotion erfinden (individuelle Aufgabe):** Erfinde eine neue Figur für eine Emotion, die im Film vorkommen könnte. Benutze die Satzanfänge unten und mindestens fünf Adjektive.'
          - '**Schritt 3 – Präsentation:** Jede Person stellt ihre Emotion vor. Die anderen beantworten danach: In welchen Situationen könnte diese Emotion besonders stark werden? Ist diese Emotion eher hilfreich oder problematisch? Welche andere Emotion könnte gut oder schlecht mit ihr zusammenarbeiten?'
        example: |-
          *Die Emotion heißt Neid.*
          *Sie ist unruhig, unsicher, aufmerksam, kritisch und manchmal ziemlich negativ. Sie vergleicht sich ständig mit anderen Menschen und denkt oft darüber nach, was andere haben.*
          *Wenn jemand Neid fühlt, denkt die Person vielleicht, dass ihr eigenes Leben nicht gut genug ist.*
          *Trotzdem kann Neid manchmal hilfreich sein, weil er uns zeigen kann, was wir selbst erreichen oder verändern möchten.*
      - id: act1-questions
        type: discussionQuestions
        title: Über den Film sprechen (Schritt 1)
        items:
          - question: Welche Emotion passt am besten zu deiner Persönlichkeit?
            frame: Zu meiner Persönlichkeit passt am besten ___, weil ___.
          - question: Gibt es eine Emotion, die bei dir stärker ist als andere?
            frame: Bei mir ist ___ stärker als ___.
          - question: Welche Emotion zeigt man leicht?
          - question: Welche Emotion versucht man oft zu verstecken?
          - question: Kann eine negative Emotion auch eine wichtige Funktion haben?
      - id: act1-frames
        type: discussionQuestions
        title: Meine neue Emotion (Schritt 2)
        items:
          - question: Wie heißt die Emotion?
            frame: Die Emotion heißt ___.
          - question: Wie ist sie? (mindestens fünf Adjektive)
            frame: Sie ist ___, ___, ___, ___ und ___.
          - question: Was passiert, wenn jemand diese Emotion fühlt?
            frame: Wenn jemand diese Emotion fühlt, ___.
          - question: Warum ist diese Emotion wichtig?
            frame: Diese Emotion ist wichtig, weil ___.
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Gefühle-Bingo'
        skills: [Adjektive für Gefühle, Perfekt für Erfahrungen]
        steps:
          - '**Schritt 1 – Das Spiel (Paare oder kleine Gruppen):** Jede Gruppe bekommt eine Bingo-Karte mit verschiedenen Gefühlen. Eine Person wählt heimlich ein Gefühl und erzählt von einer Situation, in der sie dieses Gefühl schon einmal erlebt hat. Sie darf das Gefühl selbst nicht nennen. Die anderen raten, welches Gefühl gemeint ist.'
          - '**Schritt 2 – Über Erfahrungen sprechen:** Benutzt das Perfekt und beschreibt die Situation möglichst genau. Die Satzanfänge unten helfen.'
          - '**Schritt 3 – Rückfragen stellen:** Wenn die Gruppe das Gefühl erraten hat, stellt mindestens eine Person eine zusätzliche Frage: *Was hast du danach gemacht? Wie lange hast du dich so gefühlt? Hast du mit jemandem darüber gesprochen? Würdest du heute anders reagieren?*'
          - Die erste Gruppe, die ihre Bingo-Karte vollständig hat, gewinnt.
        example: |-
          *Ich habe drei Wochen für eine wichtige Prüfung gelernt. Am Ende habe ich die Prüfung trotzdem nicht bestanden. Danach habe ich mich wirklich schlecht gefühlt.*
          *Antwort: Du warst wahrscheinlich enttäuscht.*
      - id: act2-frames
        type: discussionQuestions
        title: Satzanfänge
        items:
          - question: Ich habe mich so gefühlt, als …
          - question: Ich bin besonders ___ gewesen, als …
          - question: Ich habe diese Emotion erlebt, nachdem …
          - question: Das ist mir schon einmal passiert, als …
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Erinnerungen, die uns geprägt haben'
        skills: [Perfekt für Erfahrungen, Adjektive für Gefühle]
        steps:
          - '**Schritt 1 – Was ist eine wichtige Erinnerung?** Seht den kurzen Ausschnitt aus *Inside Out*, in dem wichtige Erinnerungen erklärt werden. Sprecht danach: Sind alle Erinnerungen gleich wichtig? Müssen wichtige Erinnerungen immer positiv sein? Können schwierige Erfahrungen unsere Persönlichkeit beeinflussen? Welche Emotionen erinnern wir besonders lange?'
          - '**Schritt 2 – Eine wichtige Erinnerung auswählen:** Denk an eine Erinnerung, die dich stark beeinflusst hat, zum Beispiel eine Reise, eine wichtige Prüfung, ein Erfolg, ein Misserfolg, ein Umzug, eine Beziehung, eine Begegnung, ein besonderer Familientag oder eine berufliche Entscheidung.'
          - '**Schritt 3 – Die Erinnerung erzählen (Partnerarbeit):** Erzählt euch gegenseitig von eurer Erinnerung. Benutzt das Perfekt und möglichst viele passende Gefühlsadjektive. Die Leitfragen unten helfen.'
          - '**Schritt 4 – Partner wechseln:** Nach einigen Minuten wechseln die Partner. Jede Person erzählt ihre Geschichte noch einmal und versucht, klarer zu sprechen und mehr passende Adjektive zu benutzen.'
        example: '*Ich bin vor einigen Jahren allein ins Ausland gereist. Vor der Reise bin ich sehr nervös und unsicher gewesen. Während der Reise habe ich viele neue Menschen kennengelernt. Danach habe ich mich viel selbstbewusster gefühlt. Diese Erfahrung hat mir gezeigt, dass ich unabhängiger bin, als ich vorher gedacht habe.*'
      - id: act3-questions
        type: discussionQuestions
        title: Leitfragen
        items:
          - question: Was ist passiert?
            frame: Vor ___ bin ich / habe ich ___.
          - question: Wer war dabei?
            frame: ___ war dabei.
          - question: Wie hast du dich zuerst gefühlt?
            frame: Zuerst habe ich mich ___ gefühlt.
          - question: Hat sich dein Gefühl später verändert?
            frame: Später habe ich mich ___ gefühlt.
          - question: Warum erinnerst du dich noch heute daran?
            frame: Ich erinnere mich noch heute daran, weil ___.
          - question: Hat diese Erfahrung dich verändert?
            frame: Diese Erfahrung hat mir gezeigt, dass ___.
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Hast du schon einmal …?'
        skills: [Perfekt für Erfahrungen]
        steps:
          - '**Schritt 1 – Grammatik kurz wiederholen:** Um nach Erfahrungen zu fragen, benutzen wir sehr oft *Hast du schon einmal … + Partizip II?* oder *Bist du schon einmal … + Partizip II?* (Klassenspiel)'
          - '**Schritt 2 – Fragen bilden:** Eine Person wählt ein Verb aus der Tabelle und stellt einer anderen Person eine Frage mit *schon einmal*. Die andere Person antwortet und erklärt, wie sie sich dabei gefühlt hat. Danach stellt diese Person die nächste Frage.'
          - '**Schritt 3 – Schwieriger machen:** Nach einigen Runden stellt jede Person zusätzlich eine Gefühlsfrage: *Wie hast du dich dabei gefühlt? Warst du danach erleichtert oder enttäuscht? Hast du dich dafür geschämt? Bist du heute noch stolz darauf?*'
        example: |-
          *Hast du schon einmal einen wichtigen Geburtstag vergessen?*
          *Bist du schon einmal allein in ein anderes Land gereist?*
          *Hast du schon einmal einen Wettbewerb gewonnen?*
          *A: Hast du schon einmal den Geburtstag von jemandem vergessen?*
          *B: Ja, schon einmal. Ich habe einmal den Geburtstag eines Freundes vergessen und habe mich danach sehr peinlich berührt und schuldig gefühlt.*
      - id: act4-verbs
        type: table
        caption: Verben für die Aktivität
        header: [Infinitiv, Perfekt, Infinitiv, Perfekt]
        rows:
          - [gewinnen, hat gewonnen, reisen, ist gereist]
          - [verlieren, hat verloren, sprechen, hat gesprochen]
          - [brechen, hat gebrochen, schicken, hat geschickt]
          - [vergessen, hat vergessen, helfen, hat geholfen]
          - [sagen, hat gesagt, hören, hat gehört]
          - [treffen, hat getroffen, verpassen, hat verpasst]
          - [schreiben, hat geschrieben, streiten, hat gestritten]
          - [machen, hat gemacht, behalten, hat behalten]
          - [sehen, hat gesehen, finden, hat gefunden]
          - [essen, hat gegessen, versprechen, hat versprochen]
      - id: act4-questions
        type: discussionQuestions
        title: Meine Fragen
        items:
          - question: Hast du schon einmal ___?
            frame: Ja, schon einmal. Ich habe ___ und war danach ___. / Nein, noch nie.
          - question: Bist du schon einmal ___?
            frame: Ja, schon einmal. Ich bin ___. Ich habe mich ___ gefühlt. / Nein, noch nie.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: **Gefühlsadjektive** (genauer beschreiben
          mit *sein, sich fühlen, wirken* und Verstärkern) und das **Perfekt für
          Erfahrungen** mit *schon einmal* und *noch nie*. Das Heft gibt keine Zeiten an;
          wähle die Aktivitäten nach der verfügbaren Zeit.
      - id: n-intro
        anchor: intro
        text: Gib zuerst dein eigenes Beispiel. Jede Person sagt ihren Namen und wie sie sich fühlt, wenn sie Deutsch spricht (ein oder zwei Adjektive).
      - id: n-warmup
        anchor: warmup
        text: >-
          Wähle aus den acht Fragen aus. Bei Fragen über Erfahrungen sollen die
          Teilnehmenden das Perfekt benutzen und ihre Gefühle mit genauen Adjektiven
          beschreiben. Erfundene Situationen sind in Ordnung. *Ich bin stolz gewesen* ist
          richtig, aber *Ich war stolz* ist häufiger.
      - id: n-act1
        anchor: act1
        text: >-
          Klassengespräch + individuelle Aufgabe. Frag die Klasse, wer den Film *Inside
          Out* (*Alles steht Kopf*) gesehen hat, und erkläre kurz das Konzept für die
          anderen. Der Ausschnitt ist nicht im Heft verlinkt: Such einen kurzen Ausschnitt
          auf YouTube, in dem die Emotionen vorgestellt werden.
      - id: n-act2
        anchor: act2
        text: >-
          Paare oder kleine Gruppen. Die Bingo-Karten sind nicht im Heft: Bereite eine
          Karte (zum Beispiel 3 × 3) mit Gefühlen aus dem Wortschatz vor (*stolz,
          enttäuscht, erleichtert, dankbar, verlegen, überfordert, neidisch, schuldig,
          überrascht* …).
      - id: n-act3
        anchor: act3
        text: >-
          Partnerarbeit. Zeig in Schritt 1 einen kurzen Ausschnitt aus *Inside Out*, in
          dem die wichtigen Erinnerungen (*core memories*) erklärt werden (nicht im Heft
          verlinkt). Achte auf das Perfekt und auf genaue Gefühlsadjektive.
      - id: n-act4
        anchor: act4
        text: >-
          Klassenspiel. Wiederhole kurz: Die meisten Verben bilden das Perfekt mit
          *haben*; *reisen* (wie *fahren, gehen, kommen, ziehen*) mit *sein*. Natürliche
          kurze Antworten: *Ja, schon einmal. / Ja, habe ich. / Nein, noch nie.* (nicht
          *Ja, das habe ich*).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: gefuehle-und-emotionen-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: rules-adjektive
        type: ruleSummary
        skill: Adjektive für Gefühle
        rules:
          - text: 'Gefühlsadjektive stehen oft nach **sein, sich fühlen** und **wirken**.'
            examples: [Ich bin nervös., Ich fühle mich entspannt., Er wirkt unsicher.]
          - text: 'Bei **sich fühlen** brauchen wir das **Reflexivpronomen**.'
            examples:
              - Ich fühle mich …
              - Du fühlst dich …
              - Er / Sie fühlt sich …
              - Wir fühlen uns …
              - Ihr fühlt euch …
              - Sie fühlen sich …
          - text: 'Wir können ein Adjektiv **verstärken**: *sehr, wirklich, extrem, besonders, ziemlich, total* (umgangssprachlich).'
            examples:
              - Ich war sehr nervös.
              - Sie hat sich wirklich erleichtert gefühlt.
              - Ich bin ziemlich enttäuscht gewesen.
              - Er war extrem wütend.
          - text: 'Nicht immer nur *gut, schlecht, glücklich, traurig*: Benutze **genauere** Adjektive.'
            examples:
              - nervös, enttäuscht, erleichtert, dankbar
              - verlegen, überfordert, stolz, unsicher, zufrieden
      - id: reflexive-table
        type: table
        caption: sich fühlen
        header: [Person, sich fühlen, Beispiel]
        rows:
          - [ich, ich fühle mich, Ich fühle mich erleichtert.]
          - [du, du fühlst dich, Fühlst du dich überfordert?]
          - [er / sie, er / sie fühlt sich, Sie fühlt sich unsicher.]
          - [wir, wir fühlen uns, Wir fühlen uns entspannt.]
          - [ihr, ihr fühlt euch, Fühlt ihr euch wohl?]
          - [sie / Sie, sie / Sie fühlen sich, Sie fühlen sich stolz.]
      - id: rules-perfekt
        type: ruleSummary
        skill: Perfekt für Erfahrungen
        rules:
          - text: 'Über **Lebenserfahrungen** sprechen wir im **Perfekt** (*haben / sein* + Partizip II), oft mit **schon einmal, noch nie, bisher, schon oft**. Formeller: **jemals** (*Hast du jemals …?*).'
            examples:
              - Ich habe schon einmal einen Wettbewerb gewonnen.
              - Ich bin schon einmal allein ins Ausland gereist.
              - Ich habe mich noch nie so erleichtert gefühlt.
          - text: 'Die meisten Verben bilden das Perfekt mit **haben**. Verben der **Bewegung** (Ortswechsel) und der **Veränderung** bilden es mit **sein**.'
            examples:
              - Ich habe einen Freund getroffen.
              - Ich habe meinen Schlüssel verloren.
              - Ich habe eine Prüfung bestanden.
              - Ich bin nach Deutschland gereist.
              - Ich bin nach Hause gegangen.
              - Ich bin nach Berlin gezogen.
          - text: '**Fragen nach Erfahrungen:** *Hast du schon einmal …* / *Bist du schon einmal …* + **Partizip II am Ende**.'
            examples:
              - Hast du schon einmal etwas Wichtiges verloren?
              - Hast du schon einmal eine schwierige Entscheidung getroffen?
              - Bist du schon einmal allein gereist?
              - Bist du schon einmal zu spät zu einem wichtigen Termin gekommen?
          - text: '**Kurze Antworten:** *Ja, schon einmal. / Ja, habe ich. / Ja, bin ich. / Nein, noch nie.* Auf B1-Niveau erklären wir danach mehr.'
            examples:
              - Ja, schon einmal. Ich habe einmal meinen Pass verloren und war danach extrem nervös.
          - text: '**Erst die Erfahrung, dann die Geschichte:** *schon einmal* öffnet das Thema. Dann erzählen wir das Ereignis mit Details, auch im **Perfekt** (bei *sein, haben* und Modalverben meistens im **Präteritum**: *war, hatte, musste*).'
            examples:
              - Hast du schon einmal deinen Schlüssel verloren?
              - Wann ist das passiert? Wo warst du? Wie hast du dich gefühlt?
              - 'Mit *sein* ist *war* häufiger als *bin … gewesen*: *Ich war sehr stolz.*'
      - id: summary-he-adjektive
        type: text
        lang: he
        text: >-
          **שמות תואר לרגשות.** שמות תואר מאפשרים לנו לתאר בצורה מדויקת יותר איך אדם
          מרגיש. בגרמנית משתמשים בהם הרבה אחרי פעלים כמו sein, sich fühlen ו־wirken: Ich
          bin nervös – אני עצבני / מתוח; Ich fühle mich entspannt – אני מרגיש רגוע; Er
          wirkt unsicher – הוא נראה חסר ביטחון. כאשר משתמשים ב־sich fühlen, חשוב לזכור את
          הכינוי החוזר (mich, dich, sich, uns, euch, sich). אפשר לחזק שם תואר: sehr =
          מאוד; wirklich = באמת / מאוד; extrem = בצורה קיצונית; besonders = במיוחד;
          ziemlich = די; total = לגמרי, בעיקר בשפה מדוברת. כדאי לא להשתמש תמיד רק ב־gut /
          schlecht / glücklich / traurig, אלא לבחור מילים מדויקות יותר: nervös = מתוח;
          enttäuscht = מאוכזב; erleichtert = חש הקלה; dankbar = אסיר תודה; verlegen =
          נבוך; überfordert = מוצף; stolz = גאה; unsicher = חסר ביטחון; zufrieden = מרוצה.
      - id: summary-he-perfekt
        type: text
        lang: he
        text: >-
          **Perfekt לחוויות.** כאשר מדברים על חוויות שעברנו בחיים, משתמשים בדרך כלל
          ב־Perfekt (haben / sein + Partizip II), יחד עם מילים כמו schon einmal = כבר פעם
          / אי פעם; noch nie = אף פעם עד עכשיו; bisher = עד עכשיו; schon oft = כבר פעמים
          רבות (בשפה רשמית יותר גם jemals = אי פעם). לדוגמה: Ich habe schon einmal einen
          Wettbewerb gewonnen – כבר יצא לי לזכות בתחרות. רוב הפעלים משתמשים ב־haben;
          פעלים של תנועה, שינוי מקום או שינוי מצב משתמשים ב־sein (Ich bin nach
          Deutschland gereist). שאלה שימושית מאוד: Hast du schon einmal …? / Bist du schon
          einmal …? והפועל ב־Partizip II בסוף. תשובות קצרות: Ja, schon einmal. / Ja, habe
          ich. / Nein, noch nie. אבל ברמת B1 חשוב להמשיך ולהסביר. **חוויה ואחר כך
          הסיפור:** שאלה עם schon einmal פותחת את הנושא כחוויית חיים. אחר כך מספרים את
          האירוע עצמו עם פרטים (מתי, איפה, איך הרגשת) – בגרמנית גם את זה מספרים בדרך כלל
          ב־Perfekt, ועם sein, haben ופעלים מודאליים ב־Präteritum (Wo warst du?).
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die Regeln mit der Gruppe und bitte um ein neues Beispiel für jede Regel, zum Beispiel eine Frage mit *schon einmal* und eine Antwort mit einem Gefühlsadjektiv.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: gefuehle-und-emotionen-hausaufgaben
    title: Hausaufgaben
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben mit Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere die Nachricht und schick sie ab. Mori stellt dir Fragen; beantworte alle.
      - id: mori-gespraech
        type: aiTutorPrompt
        title: 'Aufgabe: Gespräch über Gefühle und Erfahrungen'
        intro: 'Versuche während des Gesprächs mindestens 5 verschiedene Gefühlsadjektive zu benutzen, mindestens 4 Antworten im Perfekt zu geben, mindestens einmal *noch nie* zu benutzen und mindestens zweimal ausführlich zu erklären, warum du dich so gefühlt hast.'
        message: >-
          Hallo Mori. Ich möchte auf B1-Niveau über Gefühle und Emotionen sprechen. Stelle
          mir nacheinander 6 Fragen über Erfahrungen aus meinem Leben. Benutze Fragen mit
          „Hast du schon einmal …?“ oder „Bist du schon einmal …?“. Frage mich nach jeder
          Antwort auch, wie ich mich in dieser Situation gefühlt habe und warum. Hilf mir,
          verschiedene Gefühlsadjektive und das Perfekt zu benutzen. Wenn ich immer
          dieselben Adjektive benutze, schlage mir bessere Wörter vor. Korrigiere am Ende
          meine wichtigsten Fehler.
      - id: mori-ende
        type: aiTutorPrompt
        title: Zum Schluss
        intro: Frag Mori am Ende des Gesprächs.
        message: Welche drei Gefühlsadjektive sollte ich mir aus unserem Gespräch merken und welche drei Grammatikfehler habe ich am häufigsten gemacht?
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Statt *gut, schlecht, glücklich, traurig*: **erleichtert, enttäuscht, stolz, verlegen, überfordert** …
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**
      - id: practice-title
        type: heading
        level: 2
        text: Übungen zum Schreiben
      - id: aufgabe1
        type: discussionQuestions
        title: 'Aufgabe 1: Gefühle – Wähle das passende Adjektiv.'
        items:
          - question: Ich habe eine schwierige Prüfung bestanden. Ich bin sehr ___ auf mich. *(stolz / neidisch)*
          - question: Mein Freund hat mir in einer schwierigen Situation geholfen. Ich bin ihm sehr ___. *(dankbar / gelangweilt)*
          - question: Ich habe aus Versehen etwas kaputt gemacht. Jetzt fühle ich mich ___. *(schuldig / erleichtert)*
          - question: Ich habe lange auf das Ergebnis gewartet und endlich eine positive Antwort bekommen. Ich bin ___. *(erleichtert / wütend)*
          - question: Ich habe vor vielen Menschen gesprochen und plötzlich meinen Text vergessen. Ich war sehr ___. *(verlegen / zufrieden)*
          - question: Ich habe zu viele Aufgaben gleichzeitig und weiß nicht, wo ich anfangen soll. Ich fühle mich ___. *(überfordert / stolz)*
      - id: aufgabe2
        type: discussionQuestions
        title: 'Aufgabe 2: Perfekt – Setze das Verb ins Perfekt.'
        items:
          - question: Ich ___ schon einmal eine wichtige Prüfung ___. *(bestehen)*
          - question: Meine Schwester ___ mir in einer schwierigen Situation ___. *(helfen)*
          - question: Wir ___ letztes Jahr zusammen nach Italien ___. *(reisen)*
          - question: Ich ___ noch nie einen wichtigen Geburtstag ___. *(vergessen)*
          - question: Er ___ seinen besten Freund bei der Arbeit ___. *(kennenlernen)*
          - question: Meine Eltern ___ mich immer ___. *(unterstützen)*
          - question: Ich ___ schon einmal mein Handy ___. *(verlieren)*
          - question: Sie ___ allein nach Deutschland ___. *(fahren)*
      - id: aufgabe3
        type: discussionQuestions
        title: 'Aufgabe 3: Hast du schon einmal …? – Bilde Fragen mit *schon einmal*.'
        items:
          - question: du / einen Wettbewerb / gewinnen
          - question: du / etwas Wichtiges / verlieren
          - question: du / allein / ins Ausland reisen
          - question: du / eine wichtige Person / enttäuschen
          - question: du / jemandem / bei einem Problem helfen
          - question: du / vor vielen Menschen / sprechen
      - id: aufgabe4-title
        type: heading
        level: 3
        text: 'Aufgabe 4: Eine emotionale Erfahrung'
      - id: aufgabe4-rules
        type: callout
        tone: info
        title: Dein Text
        text: |-
          Schreib **6 bis 8 Sätze** über eine Situation, in der du eine starke Emotion gefühlt hast: etwas, das dich stolz, nervös, enttäuscht, erleichtert, dankbar, verlegen, wütend oder überrascht gemacht hat.
          Beantworte: Was ist passiert? Wer war dabei? Wie hast du dich zuerst gefühlt? Warum hast du dich so gefühlt? Hat sich dein Gefühl später verändert? Was hast du aus der Erfahrung gelernt?
          Benutze mindestens **4 verschiedene Gefühlsadjektive**, **3 Sätze im Perfekt**, **schon einmal** oder **noch nie** und einen Verstärker wie **sehr, wirklich, ziemlich, besonders**.
      - id: aufgabe4
        type: reflection
        prompt: Eine Situation, in der ich eine starke Emotion gefühlt habe
    teacherNotes:
      - id: n-key1
        anchor: aufgabe1
        text: >-
          Lösungen Aufgabe 1: 1. stolz 2. dankbar 3. schuldig 4. erleichtert 5. verlegen
          6. überfordert.
      - id: n-key2
        anchor: aufgabe2
        text: >-
          Lösungen Aufgabe 2: 1. habe … bestanden 2. hat … geholfen 3. sind … gereist 4.
          habe … vergessen 5. hat … kennengelernt 6. haben … unterstützt 7. habe …
          verloren 8. ist … gefahren.
      - id: n-key3
        anchor: aufgabe3
        text: >-
          Lösungen Aufgabe 3: 1. Hast du schon einmal einen Wettbewerb gewonnen? 2. Hast
          du schon einmal etwas Wichtiges verloren? 3. Bist du schon einmal allein ins
          Ausland gereist? 4. Hast du schon einmal eine wichtige Person enttäuscht? 5.
          Hast du schon einmal jemandem bei einem Problem geholfen? 6. Hast du schon
          einmal vor vielen Menschen gesprochen?
      - id: n-key4
        anchor: aufgabe4
        text: >-
          Aufgabe 4: individuelle Antworten. Beispiel: *Ich habe mich schon einmal vor
          einer wichtigen Präsentation extrem nervös gefühlt. Ich hatte Angst, dass ich
          meinen Text vergessen würde. Am Anfang war ich unsicher und angespannt. Die
          Präsentation ist aber viel besser gelaufen, als ich erwartet hatte. Danach war
          ich sehr erleichtert und ziemlich stolz auf mich. Meine Kollegen haben mir
          positives Feedback gegeben, und dafür war ich sehr dankbar. Seit dieser
          Erfahrung bin ich selbstbewusster, wenn ich vor anderen Menschen sprechen
          muss.*

