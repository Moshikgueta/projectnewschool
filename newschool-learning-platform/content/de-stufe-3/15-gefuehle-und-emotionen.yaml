vocabulary:
  - slug: gefuehle-und-emotionen
    title: Gefühle und Emotionen
    items: *gefuehle-und-emotionen-words

activities:
  - slug: gefuehle-und-emotionen-adjektive
    title: Adjektive für Gefühle
    minutes: 8
    items:
      - id: stolz
        type: multipleChoice
        prompt: Ich habe eine schwierige Prüfung bestanden. Ich bin sehr ___ auf mich.
        options:
          - { text: stolz, correct: true }
          - {
              text: neidisch,
              feedback: 'Neidisch sind wir, wenn ein anderer etwas hat, das wir wollen. Nach einem eigenen Erfolg sind wir *stolz auf uns*.',
            }
          - {
              text: enttäuscht,
              feedback: 'Enttäuscht sind wir, wenn etwas nicht gut gegangen ist. Hier war die Prüfung ein Erfolg: *stolz*.',
            }
      - id: schuldig
        type: multipleChoice
        prompt: Ich habe aus Versehen etwas kaputt gemacht. Jetzt fühle ich mich ___.
        options:
          - { text: schuldig, correct: true }
          - {
              text: erleichtert,
              feedback: 'Erleichtert sind wir, wenn ein Problem vorbei ist. Wenn wir einen Fehler gemacht haben, fühlen wir uns *schuldig*.',
            }
          - {
              text: dankbar,
              feedback: 'Dankbar sind wir, wenn jemand uns hilft. Nach einem eigenen Fehler fühlen wir uns *schuldig*.',
            }
      - id: uns
        type: fillBlank
        prompt: Ergänze das Reflexivpronomen.
        text: Wir fühlen ___ heute sehr entspannt.
        blanks: [[uns]]
      - id: dich
        type: fillBlank
        prompt: Ergänze das Reflexivpronomen.
        text: Fühlst du ___ manchmal überfordert?
        blanks: [[dich]]
      - id: situationen
        type: matching
        prompt: Welches Gefühl passt zu welcher Situation?
        pairs:
          - [Ich habe endlich eine positive Antwort bekommen., erleichtert]
          - [Ich habe vor vielen Menschen meinen Text vergessen., verlegen]
          - [Mein Freund hat mir bei einem Problem geholfen., dankbar]
          - [Ich habe zu viele Aufgaben gleichzeitig., überfordert]
          - ['Meine Freundin hat etwas, das ich auch gern hätte.', neidisch]
      - id: ohne-mich
        type: trueFalse
        prompt: 'Der Satz *Ich fühle entspannt.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! *sich fühlen* braucht das Reflexivpronomen: *Ich fühle mich entspannt.*'
          incorrect: '*sich fühlen* braucht das Reflexivpronomen: *Ich fühle mich entspannt.*'
      - id: verstaerker
        type: multipleChoice
        prompt: Welches Wort macht ein Adjektiv stärker? *Ich war ___ erleichtert.*
        options:
          - { text: besonders, correct: true }
          - {
              text: noch nie,
              feedback: '*noch nie* sagt, dass etwas nie passiert ist. Verstärker sind *sehr, wirklich, besonders, ziemlich, extrem*.',
            }
          - {
              text: schon einmal,
              feedback: '*schon einmal* fragt nach einer Erfahrung. Verstärker sind *sehr, wirklich, besonders, ziemlich, extrem*.',
            }
      - id: ordne-wirkt
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz.
        sentence: Er wirkt heute unsicher.
        alsoAccept: [Heute wirkt er unsicher]

  - slug: gefuehle-und-emotionen-perfekt
    title: Perfekt für Erfahrungen
    minutes: 8
    items:
      - id: bist-gereist
        type: multipleChoice
        prompt: ___ du schon einmal allein ins Ausland gereist?
        options:
          - { text: Bist, correct: true }
          - {
              text: Hast,
              feedback: '*reisen* ist ein Verb der Bewegung: Das Perfekt bilden wir mit *sein*: *Bist du … gereist?*',
            }
          - {
              text: Warst,
              feedback: '*warst* ist Präteritum von *sein*. Im Perfekt brauchen wir *bist* + Partizip II: *Bist du … gereist?*',
            }
      - id: handy-verloren
        type: fillBlank
        prompt: Setze *verlieren* ins Perfekt.
        text: Ich ___ schon einmal mein Handy ___.
        blanks: [[habe], [verloren]]
      - id: partizipien
        type: matching
        prompt: Welches Partizip II passt zu welchem Verb?
        pairs:
          - [gewinnen, gewonnen]
          - [verlieren, verloren]
          - [helfen, geholfen]
          - [streiten, gestritten]
          - [schicken, geschickt]
      - id: sind-gereist
        type: fillBlank
        prompt: Ergänze *haben* oder *sein* in der richtigen Form.
        text: Wir ___ letztes Jahr zusammen nach Italien gereist.
        blanks: [[sind]]
      - id: hast-gereist
        type: trueFalse
        prompt: 'Die Frage *Hast du schon einmal allein ins Ausland gereist?* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! *reisen* bildet das Perfekt mit *sein*: *Bist du schon einmal allein ins Ausland gereist?*'
          incorrect: 'Verben der Bewegung bilden das Perfekt mit *sein*: *Bist du schon einmal allein ins Ausland gereist?*'
      - id: noch-nie
        type: multipleChoice
        prompt: '*Hast du schon einmal deinen Schlüssel verloren?* Welche kurze Antwort passt, wenn das nie passiert ist?'
        options:
          - { text: 'Nein, noch nie.', correct: true }
          - {
              text: 'Nein, schon einmal.',
              feedback: '*schon einmal* bedeutet, dass es passiert ist. Wenn es nie passiert ist: *Nein, noch nie.*',
            }
          - {
              text: 'Ja, noch nie.',
              feedback: '*Ja* und *noch nie* passen nicht zusammen. Richtig: *Nein, noch nie.*',
            }
      - id: hat-geholfen
        type: fillBlank
        prompt: Setze *helfen* ins Perfekt.
        text: Meine Schwester ___ mir in einer schwierigen Situation ___.
        blanks: [[hat], [geholfen]]
      - id: ordne-erleichtert
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz.
        sentence: Ich habe mich noch nie so erleichtert gefühlt.
        alsoAccept:
          - Noch nie habe ich mich so erleichtert gefühlt
          - So erleichtert habe ich mich noch nie gefühlt
