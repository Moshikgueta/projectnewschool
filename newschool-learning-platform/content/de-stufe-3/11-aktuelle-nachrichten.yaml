activities:
  - slug: aktuelle-nachrichten-indirekte-rede
    title: 'Indirekte Rede mit dass, ob und W-Wörtern'
    minutes: 8
    items:
      - id: ob-strasse
        type: multipleChoice
        prompt: 'Die Journalistin fragte: „Ist die Straße wieder offen?“ → Die Journalistin fragte, ___ die Straße wieder offen ist.'
        options:
          - { text: ob, correct: true }
          - {
              text: dass,
              feedback: 'Das ist eine Ja-/Nein-Frage. Für Fragen ohne Fragewort benutzen wir *ob*: *…, ob die Straße wieder offen ist.*',
            }
          - {
              text: was,
              feedback: 'Die Frage hat kein Fragewort (*Ist die Straße …?*). Für Ja-/Nein-Fragen benutzen wir *ob*.',
            }
      - id: dass-ruhig
        type: fillBlank
        prompt: 'Der Reporter sagte: „Die Situation ist ruhig.“ Ergänze *dass* oder *ob*.'
        text: Der Reporter sagte, ___ die Situation ruhig ist.
        blanks: [[dass]]
        wordBank: [dass, ob]
      - id: dana-liest
        type: multipleChoice
        prompt: 'Dana: „Ich lese jeden Morgen Nachrichten.“ Welcher Bericht ist richtig?'
        options:
          - { text: 'Dana sagte, dass sie jeden Morgen Nachrichten liest.', correct: true }
          - {
              text: 'Dana sagte, dass sie liest jeden Morgen Nachrichten.',
              feedback: 'Nach *dass* steht das konjugierte Verb am Ende: *…, dass sie jeden Morgen Nachrichten liest.*',
            }
          - {
              text: 'Dana sagte, dass ich jeden Morgen Nachrichten lese.',
              feedback: 'Dana spricht über sich selbst. Im Bericht ändert sich das Pronomen: *ich → sie*.',
            }
      - id: wo-lese
        type: trueFalse
        prompt: 'Der Satz *Er fragte, wo lese ich Nachrichten.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! Nach dem Fragewort steht das Verb am Ende: *Er fragte, wo ich Nachrichten lese.*'
          incorrect: 'In der indirekten Frage steht das Verb am Ende: *Er fragte, wo ich Nachrichten lese.*'
      - id: wann-beginnt
        type: fillBlank
        prompt: '„Wann beginnt die Demonstration?“ Schreib die indirekte Frage.'
        text: Sie fragte, ___ die Demonstration ___.
        blanks: [[wann], [beginnt]]
      - id: zeitangaben
        type: matching
        prompt: 'Später erzählen: Welche Zeitangabe passt?'
        pairs:
          - [heute, an diesem Tag]
          - [morgen, am nächsten Tag]
          - [gestern, am Tag davor]
          - [jetzt, zu diesem Zeitpunkt]
          - [hier, dort]
      - id: zeitform-zurueck
        type: trueFalse
        prompt: 'Im Deutschen muss man in der indirekten Rede die Zeitform immer zurückverschieben (*ist → war*).'
        answer: false
        feedback:
          correct: 'Richtig! Anders als im Englischen ist das nicht automatisch: *Sie sagte, dass sie müde ist.* (wenn es noch stimmt)'
          incorrect: 'Im Deutschen gibt es keinen automatischen Wechsel. Die Zeitform hängt davon ab, wann die Information gültig ist: *Sie sagte, dass sie müde ist.*'
      - id: ordne-ob
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz.
        sentence: Er fragte, ob die Nachricht wahr ist.

  - slug: aktuelle-nachrichten-zeitformen
    title: Vergangenheit, Gegenwart und Zukunft
    minutes: 8
    items:
      - id: gestern-hat
        type: multipleChoice
        prompt: Gestern ___ die Regierung eine Erklärung veröffentlicht.
        options:
          - { text: hat, correct: true }
          - {
              text: ist,
              feedback: '*veröffentlichen* bildet das Perfekt mit *haben*: *Die Regierung hat … veröffentlicht.*',
            }
          - {
              text: wird,
              feedback: '*gestern* ist Vergangenheit. Wir brauchen das Perfekt: *hat … veröffentlicht*.',
            }
      - id: gab
        type: fillBlank
        prompt: Ergänze *geben* im Präteritum.
        text: Letzte Woche ___ es eine große Demonstration.
        blanks: [[gab]]
      - id: wird-geben
        type: fillBlank
        prompt: Ergänze *geben* im Futur I (*werden* + Infinitiv).
        text: Morgen ___ der Minister eine Pressekonferenz ___.
        blanks: [[wird], [geben]]
      - id: praesens-zukunft
        type: trueFalse
        prompt: 'Der Satz *Morgen veröffentlicht die Regierung eine Erklärung.* spricht über die Zukunft.'
        answer: true
        feedback:
          correct: 'Richtig! Mit einer Zeitangabe wie *morgen* kann das Präsens über die Zukunft sprechen.'
          incorrect: 'Das Verb ist im Präsens, aber *morgen* zeigt die Zukunft. Im Deutschen ist das sehr natürlich.'
      - id: partizipien
        type: matching
        prompt: Welches Partizip II passt zu welchem Verb?
        pairs:
          - [veröffentlichen, veröffentlicht]
          - [lesen, gelesen]
          - [sprechen, gesprochen]
          - [stattfinden, stattgefunden]
          - [beginnen, begonnen]
      - id: im-moment
        type: multipleChoice
        prompt: Im Moment ___ die Medien über die Krise.
        options:
          - { text: berichten, correct: true }
          - { text: berichtet, feedback: '*die Medien* ist Plural: *die Medien berichten*.' }
          - {
              text: haben berichtet,
              feedback: '*Im Moment* bedeutet jetzt. Für das, was jetzt passiert, benutzen wir das Präsens: *berichten*.',
            }
      - id: habe-gelesen
        type: fillBlank
        prompt: Ergänze *lesen* im Perfekt.
        text: Vor zwei Tagen ___ ich einen interessanten Artikel ___.
        blanks: [[habe], [gelesen]]
      - id: ordne-demo
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz über die Zukunft.
        sentence: Morgen wird es eine Demonstration geben.
