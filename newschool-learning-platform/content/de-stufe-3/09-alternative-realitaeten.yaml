# Cycle "Alternative Realitäten", converted from the German level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (German); Hebrew blocks carry `lang: he`.
course: de-stufe-3
slug: alternative-realitaeten
title: Alternative Realitäten
goal: Über unwirkliche Situationen heute und in der Vergangenheit sprechen, mit dem Konjunktiv II der Gegenwart und der Vergangenheit.
position: 9
status: published

review:
  - >-
    The two workbook exercises ("Konjunktiv II der Gegenwart" and "Konjunktiv II der
    Vergangenheit") are NEW: the notebook has only classic exercises with an answer
    key. They were written from the cycle's summary, the activity examples, the
    classic homework (corrected) and the Konjunktiv II forms. Please check level,
    wording and every right answer before students see them.
  - >-
    The notebook names THREE language focuses (Konjunktiv II Gegenwart, Konjunktiv II
    Vergangenheit, mixed past + present). The platform shows two skills per cycle:
    "Konjunktiv II der Gegenwart" and "Konjunktiv II der Vergangenheit", the second
    including the mixed situations (Wenn ich damals … gezogen wäre, würde ich heute …).
    The summary keeps all three parts.
  - >-
    NO vocabulary list in the notebook for this cycle (only the Quizlet link). The
    vocabulary section was built from the Konjunktiv II forms table of the summary
    (with the notebook's Hebrew meanings), vielleicht / möglicherweise (glossed in
    the summary) and frequent words of the activities with NEW Hebrew glosses: damals,
    wahrscheinlich, die Entscheidung, die Konsequenz, die Gelegenheit, die Realität,
    die Reue, bereuen, sich vorstellen, das Ereignis, erfinden, verpassen. Please check
    the glosses or replace the list with the Quizlet set.
  - >-
    Classic homework, answer key: Exercise 8.3 "Wenn sie mehr gelernt hätte, würde sie
    die Prüfung gestern bestanden haben" is not really wrong (würde + Infinitiv
    Perfekt), only unusual; the key dropped "gestern" ("… hätte sie die Prüfung
    bestanden"). The key now reads "… hätte sie die Prüfung gestern bestanden" and a
    note explains that the original is possible but unusual. Same for 8.1 / 8.4
    ("haben würde", "sein würde"): not wrong, but with haben / sein we use hätte /
    wäre. Exercise 1.5 key "sprechen würde" is right; "spräche" is also correct but
    rare (added to the key). All other key answers (Exercises 1–9) were checked and are
    correct.
  - >-
    Summary: the structure "Wenn + Konjunktiv II, würde + Infinitiv" was kept, with an
    added note that the main clause can also have wäre / hätte / könnte (the
    notebook's own example: Wenn ich mehr Geld hätte, könnte ich ein Jahr lang
    reisen). The rule that with haben, sein and the modal verbs we prefer hätte /
    wäre / könnte to the würde form is from the notebook. The Hebrew summary is kept;
    the Hebrew gloss of "Wenn ich mehr Zeit gehabt hätte, wäre ich gereist" is the same
    as for the present sentence (Hebrew does not show the difference): fine, the
    arrows explain it.
  - >-
    Corrections: Activity 5 says "Gruppe 1 / Gruppe 2" and then "Gruppe A / Gruppe
    B"; now "Gruppe A / Gruppe B" throughout. English quotation marks ("Ja", "Was wäre,
    wenn …?") → German „…“. Stray "**" marks and the broken Hebrew bold markup were
    cleaned up. Warm-up B.4 "zu einer Gelegenheit … "Ja" gesagt hättest" kept with
    „Ja“.
  - >-
    Kept but please check: the "Was wäre passiert, wenn …?" examples include political
    and historical topics (Herzl and Uganda, Israel's borders in 1948, the end of World
    War II, Donald Trump as president, COVID-19). They are from the notebook; choose
    what suits your group. The film / series / book list keeps the original
    (English) titles.
  - >-
    The teacher's grammar note at the start ("Hinweis für die Lehrkraft") is in the
    teacher notes; the "Ziele" list of the homework is kept in Hebrew. Activity 1 asks
    the teacher to show pictures (not in the notebook). Times: the notebook gives 5
    minutes for the introduction only. The 2 + 1 minutes of Activity 1, step 2 are in
    the step text.
  - >-
    Left out: the empty "Datum / Teilnehmer" lines and the "Antwort Schüler/in 1/2/3"
    lines (the platform has answer boxes). The Quizlet link lost its tracking
    parameter (?new). No student names or class notes appear in this cycle.
  - >-
    Homework: the classic exercises (Exercises 1–10) and the three Mori prompts are
    kept in Hebrew, as in the notebook (Mori blocks carry lang he); German sentences
    stay German. Mori prompt 2 keeps the placeholder "[שם האדם]". The answer key
    ("מפתח תשובות") is in the teacher notes only. The tips callout and a German "how to"
    line were added as in other cycles.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: alternative-realitaeten-unterricht
    title: 'Unterricht: Alternative Realitäten'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Alternative Realitäten
      - id: skills
        type: cycleOverview
        skills:
          - name: Konjunktiv II der Gegenwart
            description: 'Unwirkliche Situationen heute und in der Zukunft: *Wenn ich mehr Zeit hätte, würde ich mehr reisen.*'
          - name: Konjunktiv II der Vergangenheit
            description: 'Was nicht passiert ist, auch mit Folgen für heute: *Wenn ich mehr gelernt hätte, hätte ich die Prüfung bestanden. Wenn ich damals nach Deutschland gezogen wäre, würde ich heute fließend Deutsch sprechen.*'
      - id: quizlet
        type: externalLink
        label: Alternative Realitäten auf Quizlet (Deutsch + Hebräisch)
        url: https://quizlet.com/il/1201404319/alternative-realitaten-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Einführungsrunde
      - id: intro
        type: sentenceFrame
        prompt: Stellt euch kurz vor und ergänzt den Satz.
        frame: Ich bin ___. Mein Leben wäre entspannter / aufregender / einfacher / schwieriger, wenn ich ___ hätte.
        example: Ich bin Maria. Mein Leben wäre entspannter, wenn ich ein Flugticket nach Thailand hätte.
      - id: warmup-title
        type: heading
        level: 3
        text: Gesprächseinstieg
      - id: warmup-hint
        type: callout
        tone: info
        text: Antworte in **ganzen Sätzen** im Konjunktiv II.
      - id: warmup-a
        type: discussionQuestions
        title: A. Konjunktiv II der Gegenwart
        items:
          - question: Wenn du eine Sache in deinem Leben verändern könntest, was würdest du verändern und warum?
            frame: Wenn ich eine Sache verändern könnte, würde ich ___ verändern, weil ___.
          - question: Wenn du für einen Tag mit einer anderen Person das Leben tauschen könntest, wen würdest du wählen und warum?
            frame: Ich würde mit ___ tauschen, weil ___.
          - question: Wenn du in der Welt eines Buches, einer Serie oder eines Films leben könntest, welche Welt würdest du wählen?
            frame: Ich würde die Welt von ___ wählen, weil ___.
          - question: Wenn du ein globales Problem lösen könntest, welches würdest du wählen und warum?
            frame: Ich würde ___ lösen, weil ___.
          - question: Wenn du eine neue Technologie erfinden könntest, was würdest du erfinden und wie würde sie die Welt verändern?
            frame: Ich würde ___ erfinden. Die Welt wäre dann ___.
          - question: Wenn du morgen in ein anderes Land ziehen müsstest, wohin würdest du ziehen und was würdest du dort machen?
            frame: Ich würde nach ___ ziehen und dort ___.
      - id: warmup-b
        type: discussionQuestions
        title: B. Konjunktiv II der Vergangenheit und gemischte Situationen
        items:
          - question: Wenn du in der Schule oder an der Universität etwas anderes gelernt oder studiert hättest, was würdest du heute machen?
            frame: Wenn ich ___ studiert hätte, würde ich heute ___.
          - question: Wenn du eine wichtige Person in deinem Leben nie kennengelernt hättest, wie hätte sich dein Leben entwickelt?
            frame: Wenn ich ___ nie kennengelernt hätte, hätte ich ___.
          - question: Wenn du in einem anderen Land aufgewachsen wärst, wie wärst du heute anders?
            frame: Wenn ich in ___ aufgewachsen wäre, wäre ich heute ___.
          - question: Wenn du zu einer Gelegenheit, die du damals abgelehnt hast, „Ja“ gesagt hättest, wo wärst du heute?
            frame: Wenn ich damals „Ja“ gesagt hätte, wäre ich heute ___.
          - question: Wenn du als Teenager eine wichtige Entscheidung anders getroffen hättest, was wäre heute anders?
            frame: Wenn ich als Teenager ___ hätte / wäre, wäre heute ___.
          - question: Wenn du eine bestimmte Gewohnheit in der Vergangenheit nicht geändert hättest, wie würde dein Leben heute aussehen?
            frame: Wenn ich ___ nicht geändert hätte, würde mein Leben heute ___ aussehen.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Mein paralleles Leben'
        skills: [Konjunktiv II der Gegenwart]
        steps:
          - '**Einzelarbeit + Partner- / Gruppenarbeit.** **Schritt 1, visueller Einstieg:** Die Lehrkraft zeigt Bilder von alternativen Lebensrealitäten, Berufen, Ländern oder ungewöhnlichen Situationen. Wähle ein Bild oder denk dir selbst eine alternative Realität aus. Schreib mindestens **drei Sätze im Konjunktiv II** (Satzanfänge unten).'
          - '**Schritt 2, Austausch in Paaren:** Jede Person hat ungefähr zwei Minuten, um ihr paralleles Leben vorzustellen. Danach stellen die anderen eine Minute lang Rückfragen: *Warum würdest du das verändern? Wie wäre dein Leben anders? Welche Probleme hätte dieses neue Leben? Was würdest du als Erstes machen? Wer würde auf diese Veränderung besonders stark reagieren? Was würdest du aus deinem heutigen Leben vermissen?*'
          - '**Schritt 3, Präsentation und Abstimmung:** Jedes Paar präsentiert ein oder zwei interessante Ideen; die Lehrkraft schreibt sie an die Tafel. Danach stimmt die Klasse ab: *In welcher alternativen Realität würdet ihr am liebsten leben?*'
      - id: act1-frames
        type: discussionQuestions
        title: Mein paralleles Leben
        items:
          - question: Wenn ich mehr Zeit hätte, würde ich ___.
          - question: Wenn ich für einen Tag eine andere Person wäre, würde ich ___.
          - question: Wenn ich an einem anderen Ort leben würde, würde ich ___.
          - question: Wenn ich jede beliebige Fähigkeit lernen könnte, würde ich ___.
          - question: Wenn ich nicht arbeiten oder studieren müsste, würde ich ___.
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Verändere die Welt'
        skills: [Konjunktiv II der Gegenwart, Konjunktiv II der Vergangenheit]
        steps:
          - '**Wechselnde Gruppen.** **Schritt 1, Brainstorming:** Gruppen von drei bis vier Personen. Jede Gruppe bekommt ein Thema: Geld, Gesundheit, Bildung oder Umwelt, und entwickelt **vier Szenarien**, in denen die Welt komplett anders funktioniert.'
          - '**Regeln:** Jeder Vorschlag enthält den Konjunktiv II. Nennt positive und negative Konsequenzen. Seid konkret. Erklärt, wer betroffen wäre und was sich verändern würde.'
          - '**Schritt 2, Gruppenwechsel:** In jeder neuen Gruppe ist mindestens eine Person aus jedem ursprünglichen Themenbereich. Jede Person erklärt mindestens ein Szenario aus ihrer Gruppe. Die anderen reagieren: *Das wäre gut, weil … / Das könnte problematisch sein, weil … / Ich glaube nicht, dass … / Eine mögliche Konsequenz wäre …*'
          - '**Schritt 3 (optional), Vergangenheit verändern:** Übergang zum Konjunktiv II der Vergangenheit. Diskutiert die Fragen unten.'
        example: |-
          *Wenn es kein Geld gäbe, würden die Menschen Waren und Dienstleistungen direkt tauschen.*
          *Wenn alle Menschen kostenlosen Zugang zu Bildung hätten, gäbe es möglicherweise weniger soziale Ungleichheit.*
          *Wenn niemand recyceln würde, würden Umweltprobleme noch schneller zunehmen.*
          *Wenn medizinische Versorgung überall kostenlos wäre, könnten mehr Menschen behandelt werden.*
      - id: act2-past
        type: discussionQuestions
        title: Vergangenheit verändern
        items:
          - question: Wenn die Menschheit in der Vergangenheit andere Entscheidungen getroffen hätte, würde unsere Welt heute anders aussehen?
            frame: Wenn die Menschheit ___ hätte, würde unsere Welt heute ___.
          - question: Wenn Regierungen früher gehandelt hätten, welche Probleme hätten vermieden werden können?
            frame: Wenn Regierungen früher gehandelt hätten, hätte / hätten ___ vermieden werden können.
          - question: Welche Entscheidung hätte der Welt am meisten geholfen?
            frame: ___ hätte der Welt am meisten geholfen.
          - question: Welche Entscheidung hätte vielleicht neue Probleme verursacht?
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Alternative Realitäten in Film, Serien und Literatur'
        skills: [Konjunktiv II der Gegenwart, Konjunktiv II der Vergangenheit]
        steps:
          - '**Schritt 1, Brainstorming:** Welche Filme, Serien oder Bücher zeigen alternative Realitäten, Zukunftsszenarien oder komplett andere Gesellschaften? Ideen in der Tabelle unten.'
          - '**Schritt 2, Stellt euch vor, ihr lebt dort:** Wählt in Paaren oder Gruppen eine Welt aus einem Film, einer Serie oder einem Buch. Falls ihr sie nicht gut genug kennt, könnt ihr Informationen im Internet oder mit KI suchen. Diskutiert die Fragen unten (Gegenwart).'
          - '**Schritt 3, Schreibt die Geschichte um:** Jetzt betrachtet ihr die Geschichte rückblickend. Verwendet den Konjunktiv II der Vergangenheit.'
          - '**Schritt 4, Präsentation:** Jedes Paar präsentiert seine alternative Realität und verbindet Vergangenheit und Gegenwart.'
        example: '*Wenn ich in dieser Welt leben würde, müsste ich meinen Alltag komplett verändern. Wenn die Menschen aber früher andere Entscheidungen getroffen hätten, wäre diese Realität vielleicht nie entstanden.*'
      - id: act3-ideas
        type: table
        caption: Ideen
        header: [Art, Titel, Thema]
        rows:
          - [Film, Meet the Robinsons, optimistische Retro-Vorstellung der Zukunft]
          - [
              Film,
              Back to the Future Part II,
              wie man sich in den 1980er-Jahren das Jahr 2015 vorgestellt hat,
            ]
          - [Film, The Truman Show, eine kontrollierte künstliche Realität]
          - [Film, Her, eine von künstlicher Intelligenz geprägte emotionale Zukunft]
          - [Film, The Matrix, verborgene Realität und Wahrheit]
          - [Serie, Black Mirror, Zukunftsszenarien und Technologie]
          - [Serie, The Handmaid's Tale, eine Gesellschaft nach einem radikalen politischen Wandel]
          - [Serie, Westworld, künstliche Welten und Identität]
          - [Serie, Stranger Things, parallele Welten]
          - [Serie, The Last of Us, eine Gesellschaft nach einem globalen Zusammenbruch]
          - [Buch, '1984', totale Kontrolle und manipulierte Realität]
          - [Buch, The Hunger Games, 'Macht, Gesellschaft und Spektakel']
      - id: act3-present
        type: discussionQuestions
        title: Stellt euch vor, ihr lebt dort
        items:
          - question: Wenn du in dieser Welt leben würdest, wie würde dein Alltag aussehen?
            frame: Wenn ich in dieser Welt leben würde, würde mein Alltag ___ aussehen.
          - question: Wenn diese Realität heute existieren würde, was wäre besser als in unserer Realität?
            frame: Besser wäre, dass ___.
          - question: Was wäre schlechter?
          - question: Womit würdest du dich unwohl fühlen?
            frame: Ich würde mich mit ___ unwohl fühlen.
          - question: Welche Art von Mensch würde in dieser Gesellschaft besonders erfolgreich sein? Warum?
          - question: Wenn du dort ein Jahr lang überleben müsstest, welche Gewohnheiten müsstest du zuerst verändern?
            frame: Ich müsste zuerst ___ verändern.
      - id: act3-past
        type: discussionQuestions
        title: Schreibt die Geschichte um
        items:
          - question: Wenn die Hauptfigur eine andere Entscheidung getroffen hätte, wie hätte sich die Geschichte verändert?
          - question: Wenn die Menschen die Wahrheit früher erfahren hätten, was wäre passiert?
          - question: Wenn sich die Gesellschaft anders entwickelt hätte, wäre diese Zukunft überhaupt entstanden?
          - question: Wenn sich die Gemeinschaft besser auf die Krise vorbereitet hätte, welche Probleme hätten vermieden werden können?
          - question: Wenn eine wichtige Figur nicht gestorben oder verschwunden wäre, wie hätte sich das Machtverhältnis verändert?
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Alternative Weltgeschichte'
        skills: [Konjunktiv II der Vergangenheit]
        steps:
          - '**Einzelarbeit + Paare.** **Schritt 1, historisches Ereignis wählen:** Jede Person wählt ein Ereignis aus der deutschen, israelischen, jüdischen oder allgemeinen Weltgeschichte. Beispiele: *Was wäre passiert, wenn Theodor Herzl Uganda statt Palästina bevorzugt hätte? Was wäre passiert, wenn Israel 1948 mit anderen Grenzen gegründet worden wäre? Was wäre passiert, wenn Christoph Kolumbus Amerika nie erreicht hätte? Was wäre passiert, wenn der Zweite Weltkrieg anders geendet hätte? Was wäre passiert, wenn das Internet nie erfunden worden wäre?*'
          - 'Eine einzige historische Veränderung kann langfristig sehr unterschiedliche Konsequenzen haben. Heute untersucht ihr drei Zeitpunkte: unmittelbar danach, zehn Jahre später, hundert Jahre später.'
          - '**Schritt 2, Einzelarbeit:** Wählt ein Ereignis und beschreibt drei mögliche Konsequenzen (Satzanfänge unten).'
          - '**Schritt 3, Partnerarbeit:** Erklärt euch gegenseitig eure alternative Geschichte. Diskutiert: *Welche Konsequenz ist am überraschendsten? Welche Veränderung erscheint am realistischsten? Welche Veränderung hätte den Alltag am stärksten beeinflusst?*'
          - '**Schritt 4, Klassendiskussion:** *Welches historische Ereignis hätte langfristig die größten Auswirkungen auf die Welt gehabt?*'
          - '**Schritt 5, Was-wäre-wenn-Schnellrunde:** Die Lehrkraft nennt ein Ereignis, die Lernenden formulieren spontan eine Konsequenz.'
        example: |-
          *Wenn das Internet nie erfunden worden wäre, hätten Unternehmen anders kommuniziert.*
          *Zehn Jahre später wären andere Technologien wichtiger geworden.*
          *Heute würden wir wahrscheinlich ganz anders arbeiten und lernen.*
      - id: act4-frames
        type: discussionQuestions
        title: Meine alternative Geschichte
        items:
          - question: Unmittelbare Konsequenz
            frame: Wenn ___ passiert wäre, hätte ___.
          - question: Zehn Jahre später
            frame: Zehn Jahre später hätte / wäre ___.
          - question: Hundert Jahre später oder heute
            frame: Heute würde ___ wahrscheinlich ___.
      - id: act4-quick
        type: discussionQuestions
        title: Was-wäre-wenn-Schnellrunde
        items:
          - question: Wenn Donald Trump nie Präsident gewesen wäre …
          - question: Wenn Menschen nie auf dem Mond gelandet wären …
          - question: Wenn soziale Medien nie erfunden worden wären …
          - question: Wenn sich das Internet seit den frühen 2000er-Jahren nicht weiterentwickelt hätte …
          - question: Wenn Smartphones nie erfunden worden wären …
          - question: Wenn Englisch nie zu einer Weltsprache geworden wäre …
          - question: Wenn Flugzeuge nie erfunden worden wären …
          - question: Wenn Frauen in der gesamten Geschichte immer die gleichen Rechte wie Männer gehabt hätten …
          - question: Wenn die Menschen Kaffee nie entdeckt hätten …
          - question: Wenn die COVID-19-Pandemie nie stattgefunden hätte …
      - id: act5
        type: classActivity
        title: 'Aktivität 5: Es ist mein Leben'
        skills: [Konjunktiv II der Gegenwart, Konjunktiv II der Vergangenheit]
        steps:
          - 'Manche Menschen glauben, dass Gedanken wie **„Was wäre, wenn …?“** hilfreich sind: Sie helfen uns, aus der Vergangenheit zu lernen, persönlich zu wachsen und bessere Entscheidungen zu treffen. Andere glauben, dass zu viel Nachdenken über alternative Realitäten zu Reue führt und uns daran hindert, unser Leben so zu akzeptieren, wie es ist. In dieser Aktivität diskutiert ihr beide Positionen.'
          - '**Gruppe A:** „Was wäre, wenn?“-Denken ist nützlich. **Gruppe B:** Die Realität zu akzeptieren ist gesünder.'
          - '**Schritt 1, Argumente vorbereiten:** Sammelt Argumente für eure Position. Ihr müsst der Position nicht persönlich zustimmen. Versucht, den Konjunktiv II der Gegenwart und der Vergangenheit zu verwenden. Nutzt die Fragen unten.'
          - '**Schritt 2, Debatte:** Gruppe A präsentiert ein Argument, Gruppe B reagiert. Gruppe B präsentiert ein neues Argument, Gruppe A reagiert. Versucht, aufeinander einzugehen.'
          - '**Schritt 3:** Klassendiskussion.'
        example: |-
          *Wenn Menschen nie über ihre Fehler nachdenken würden, würden sie wahrscheinlich dieselben Fehler wiederholen.*
          *Antwort: Das stimmt teilweise. Aber wenn Menschen ständig darüber nachdenken würden, was sie anders hätten machen können, wären sie vielleicht unzufriedener.*
      - id: act5-prep
        type: discussionQuestions
        title: Diskussionsfragen zur Vorbereitung
        items:
          - question: Warum denken Menschen über alternative Realitäten nach?
          - question: Wenn Menschen häufiger verschiedene Möglichkeiten durchspielen würden, wie würde das ihre Entscheidungen beeinflussen?
          - question: Wie können Gedanken über alternative Vergangenheiten zu persönlichem Wachstum führen?
          - question: Wenn Menschen ihre früheren Entscheidungen nie hinterfragt hätten, was hätten sie vielleicht nicht gelernt?
          - question: Wenn wir unsere Vergangenheit stärker akzeptieren würden, wären wir dann zufriedener?
          - question: Kann Reue manchmal hilfreich sein?
          - question: Was hätten Menschen möglicherweise anders gemacht, wenn sie die Konsequenzen ihrer Entscheidungen gekannt hätten?
      - id: act5-class
        type: discussionQuestions
        title: Klassendiskussion
        items:
          - question: Wenn Menschen etwas weniger über „Was wäre, wenn?“ nachdenken würden, wie würde sich ihr Alltag verändern?
          - question: Wenn du jemandem einen Rat geben müsstest, der frühere Entscheidungen ständig bereut, was würdest du sagen?
            frame: Ich würde sagen, ___.
          - question: Wenn du deine eigene Einstellung zu vergangenen Entscheidungen verändern könntest, was würdest du anders machen?
          - question: Wenn du eine deiner Entscheidungen rückgängig machen könntest, würdest du es wirklich tun? Warum oder warum nicht?
            frame: Ich würde es (nicht) tun, weil ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Sprachliche Schwerpunkte: **1.** Konjunktiv II der Gegenwart, **2.**
          Konjunktiv II der Vergangenheit, **3.** gemischte hypothetische Situationen
          (Bedingung in der Vergangenheit, Konsequenz heute). Auf der Plattform sind 2
          und 3 als eine Fertigkeit zusammengefasst. Sehr anspruchsvolles Niveau 3.
      - id: n-grammar
        anchor: null
        text: >-
          Führe die Lernenden schrittweise an hypothetische Situationen heran. Beginne
          mit Fragen über unwirkliche oder imaginäre Situationen in der Gegenwart oder
          Zukunft (**Konjunktiv II der Gegenwart**: *Wenn ich mehr Zeit hätte, würde ich
          mehr reisen.*). Danach geht es um Situationen in der Vergangenheit, die nicht
          mehr verändert werden können (**Konjunktiv II der Vergangenheit**: *Wenn ich
          mehr gelernt hätte, hätte ich die Prüfung bestanden.*). Einige Fragen
          verbinden Vergangenheit und Gegenwart: *Wenn ich damals Medizin studiert hätte,
          würde ich heute vielleicht als Arzt arbeiten.* Hier liegt die Bedingung in der
          Vergangenheit, aber die Konsequenz betrifft die Gegenwart.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: Gib zuerst dein eigenes Beispiel. Achte auf *hätte* am Ende des wenn-Satzes.
      - id: n-warmup
        anchor: warmup-hint
        text: >-
          Wähle die Fragen entsprechend dem Niveau der Gruppe: Teil A (Gegenwart) für
          alle, Teil B (Vergangenheit und gemischte Situationen) für stärkere Gruppen. Bei
          B.1 verbinden wir Vergangenheit und Gegenwart.
      - id: n-act1
        anchor: act1
        text: >-
          Bring Bilder von alternativen Lebensrealitäten, Berufen, Ländern oder
          ungewöhnlichen Situationen mit (im Heft nicht enthalten). Achte darauf, dass
          bei *sein, haben* und Modalverben die eigene Form benutzt wird (*wäre, hätte,
          könnte*), nicht *würde sein*.
      - id: n-act2
        anchor: act2
        text: >-
          Teile die Klasse in Gruppen von drei bis vier Personen. Bilde für Schritt 2 neue
          Gruppen mit mindestens einer Person aus jedem Thema. Schritt 3 ist optional und
          führt zum Konjunktiv II der Vergangenheit.
      - id: n-act4
        anchor: act4
        text: >-
          Die Beispiele berühren politische und historische Themen; wähle aus, was zu
          deiner Gruppe passt. In der Schnellrunde nennst du ein Ereignis aus der Liste,
          und die Lernenden formulieren spontan eine Konsequenz.
      - id: n-act5
        anchor: act5
        text: Die Gruppen müssen ihrer Position nicht persönlich zustimmen. Achte darauf, dass die Gruppen wirklich auf das Argument der anderen Gruppe reagieren.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: alternative-realitaeten-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: rules-gegenwart
        type: ruleSummary
        skill: Konjunktiv II der Gegenwart
        rules:
          - text: 'Wir benutzen den **Konjunktiv II der Gegenwart** für unrealistische Situationen, Wünsche und Träume, hypothetische Veränderungen und imaginäre Situationen in der Gegenwart oder Zukunft.'
          - text: '**Wenn** + Konjunktiv II (Verb am Ende), **würde** + Infinitiv. Im Hauptsatz kann auch *wäre, hätte, könnte* stehen.'
            examples:
              - Wenn ich mehr Zeit hätte, würde ich mehr reisen.
              - Wenn ich in Berlin leben würde, würde ich öfter ins Theater gehen.
              - Wenn ich mehr Geld hätte, könnte ich ein Jahr lang reisen.
          - text: 'Bei **sein, haben** und den **Modalverben** benutzen wir die eigene Form, nicht *würde*: *wäre, hätte, könnte, müsste, dürfte, sollte, wüsste*.'
            examples:
              - Wenn ich reich wäre, würde ich weniger arbeiten.
              - 'Natürlicher: Wenn ich mehr Zeit hätte … (nicht: Wenn ich mehr Zeit haben würde …)'
          - text: '*hätte* und *wäre* sehen aus wie Vergangenheit, aber hier beschreiben sie **keine echte Vergangenheit**, sondern eine imaginäre Situation heute oder in der Zukunft.'
          - text: '**würde** + Infinitiv = was ich tun würde (hypothetisches Ergebnis). **könnte** + Infinitiv = was möglich wäre (Möglichkeit, Fähigkeit). Mit **vielleicht / möglicherweise** zeigen wir, dass wir nicht sicher sind.'
            examples:
              - Wenn ich mehr Zeit hätte, würde ich Deutsch lernen.
              - Wenn ich mehr Zeit hätte, könnte ich Deutsch lernen.
              - Wenn ich mehr Zeit hätte, würde ich vielleicht Deutsch lernen.
      - id: forms-table
        type: table
        caption: Häufige Formen im Konjunktiv II
        header: [Infinitiv, Konjunktiv II, משמעות]
        rows:
          - [sein, wäre, היה / הייתה]
          - [haben, hätte, היה לו / היה לי]
          - [können, könnte, היה יכול]
          - [müssen, müsste, היה צריך / היה חייב]
          - [dürfen, dürfte, היה רשאי]
          - [sollen, sollte, היה אמור / כדאי היה]
          - [wissen, wüsste, היה יודע]
          - [kommen, käme, היה בא]
          - [gehen, ginge, היה הולך]
      - id: gegenwart-he
        type: text
        lang: he
        text: |-
          אנחנו משתמשים ב־**Konjunktiv II** כדי לדבר על: מצבים לא מציאותיים בהווה; מצבים היפותטיים; משאלות; חלומות; דברים שאנחנו מדמיינים; אפשרויות היפותטיות לגבי העתיד.
          המבנה: **Wenn + Konjunktiv II, würde + Infinitiv**
          *Wenn ich mehr Zeit hätte, würde ich eine weitere Sprache lernen.* – אם היה לי יותר זמן, הייתי לומד שפה נוספת.
          *Wenn ich in einem anderen Land leben würde, würde ich mehr reisen.* – אם הייתי גר במדינה אחרת, הייתי מטייל יותר.
          *Wenn sie Präsidentin wäre, würde sie vieles verändern.* – אם היא הייתה נשיאה, היא הייתה משנה הרבה דברים.
          חשוב לשים לב: אף על פי שצורות כמו **hätte** ו־**wäre** עשויות להיראות כמו צורות שקשורות לעבר, כאן הן **לא מתארות עבר אמיתי**. הן מתארות מצב דמיוני או היפותטי בהווה או בעתיד.
          **הצורה עם würde:** בגרמנית מדוברת נפוץ מאוד להשתמש במבנה **würde + Infinitiv**: *Wenn ich dort wohnen würde, würde ich jeden Tag ans Meer gehen.* – אם הייתי גר שם, הייתי הולך כל יום לים.
          עם זאת, עם **sein**, **haben** ועם פעלים מודאליים, בדרך כלל מעדיפים להשתמש בצורה המיוחדת של Konjunktiv II ולא ב־**würde**. טבעי יותר: *Wenn ich mehr Zeit hätte …* – אם היה לי יותר זמן… פחות טבעי: *Wenn ich mehr Zeit haben würde …* לכן כדאי במיוחד לזכור את הצורות: **wäre, hätte, könnte, müsste, sollte**.
      - id: moeglichkeit-he
        type: text
        lang: he
        text: |-
          **אפשרות והסתברות:** בגרמנית יש כמה דרכים להביע תוצאה היפותטית, אפשרות או חוסר ודאות. המערכת אינה זהה לחלוטין למילים would / could / might באנגלית.
          **würde** משמש בדרך כלל כדי לתאר **תוצאה היפותטית**: *Wenn ich mehr Zeit hätte, würde ich Deutsch lernen.* – אם היה לי יותר זמן, הייתי לומד גרמנית. כאן אני מדמיין מה הייתי עושה.
          **könnte** משמש כדי לדבר על **אפשרות או יכולת**: *Wenn ich mehr Zeit hätte, könnte ich Deutsch lernen.* – אם היה לי יותר זמן, הייתי יכול ללמוד גרמנית. המשמעות כאן אינה בהכרח שאעשה זאת, אלא שזה יהיה אפשרי.
          השוו: **würde lernen** – הייתי לומד; **könnte lernen** – הייתי יכול ללמוד.
          כדי להראות שאנחנו לא בטוחים בתוצאה, אפשר להוסיף **vielleicht** = אולי, **möglicherweise** = ייתכן / אולי.
          *Wenn ich mehr Zeit hätte, würde ich vielleicht Deutsch lernen.* – אם היה לי יותר זמן, אולי הייתי לומד גרמנית.
          *Wenn wir früher losgefahren wären, hätten wir den Zug möglicherweise noch erreicht.* – אם היינו יוצאים מוקדם יותר, ייתכן שעדיין היינו מספיקים לרכבת.
      - id: rules-vergangenheit
        type: ruleSummary
        skill: Konjunktiv II der Vergangenheit
        rules:
          - text: 'Mit dem **Konjunktiv II der Vergangenheit** sprechen wir über Situationen, die in der Vergangenheit **nicht passiert sind**: verpasste Gelegenheiten, Reue, ein anderes Ergebnis.'
          - text: 'Form: **hätte / wäre** + **Partizip II**, in beiden Satzteilen.'
            examples:
              - Wenn ich mehr gelernt hätte, hätte ich die Prüfung bestanden.
              - Wenn wir früher losgefahren wären, hätten wir den Zug nicht verpasst.
              - Wenn das Internet nie erfunden worden wäre, hätte sich die Kommunikation anders entwickelt.
          - text: '**hätte oder wäre?** Wie im Perfekt: Verben mit *sein* im Perfekt → *wäre*, Verben mit *haben* → *hätte*.'
            examples:
              - Ich bin gegangen. → Ich wäre gegangen.
              - Ich habe gearbeitet. → Ich hätte gearbeitet.
          - text: '**Gemischte Situationen:** Die Bedingung liegt in der Vergangenheit, die Konsequenz betrifft heute. **Wenn** + Konjunktiv II Vergangenheit, Konjunktiv II Gegenwart (*würde* + Infinitiv / *wäre* / *hätte*).'
            examples:
              - Wenn ich damals nach Deutschland gezogen wäre, würde ich heute in Berlin leben.
              - Wenn sie Medizin studiert hätte, wäre sie heute vielleicht Ärztin.
              - Wenn wir uns damals nicht kennengelernt hätten, wären wir heute wahrscheinlich keine Freunde.
      - id: overview-table
        type: table
        caption: Der wichtigste Unterschied
        header: [Form, Zeit, Bedeutung, Beispiel]
        rows:
          - [
              Konjunktiv II Gegenwart,
              Gegenwart / Zukunft,
              'Nicht real, aber vorstellbar',
              'Wenn ich mehr Zeit hätte, würde ich reisen.',
            ]
          - [
              Konjunktiv II Vergangenheit,
              Vergangenheit,
              'Ist nicht passiert, kann nicht mehr geändert werden',
              'Wenn ich mehr Zeit gehabt hätte, wäre ich gereist.',
            ]
          - [
              Vergangenheit + Gegenwart,
              Vergangenheit → heute,
              Eine andere Vergangenheit würde unsere Realität heute verändern,
              'Wenn ich damals nach Deutschland gezogen wäre, würde ich heute Deutsch sprechen.',
            ]
      - id: vergangenheit-he
        type: text
        lang: he
        text: |-
          אנחנו משתמשים ב־**Konjunktiv II של העבר** כדי לדבר על מצב בעבר ש**לא באמת קרה**: דברים שלא קרו; עבר חלופי שאנחנו מדמיינים; הזדמנויות שפספסנו; חרטות; תוצאות דמיוניות של החלטות שכבר התקבלו.
          המבנה: **hätte / wäre + Partizip II**
          *Wenn ich mehr gelernt hätte, hätte ich die Prüfung bestanden.* – אם הייתי לומד יותר, הייתי עובר את המבחן. אבל בפועל לא למדתי מספיק ולא עברתי את המבחן.
          *Wenn wir früher losgefahren wären, hätten wir den Zug nicht verpasst.* – אם היינו יוצאים מוקדם יותר, לא היינו מפספסים את הרכבת. אבל בפועל יצאנו מאוחר ופספסנו אותה.
          *Wenn das Internet nie erfunden worden wäre, hätte sich die Kommunikation anders entwickelt.* – אם האינטרנט מעולם לא היה מומצא, התקשורת הייתה מתפתחת בצורה אחרת.
          **haben או sein?** הבחירה בין **hätte** לבין **wäre** עובדת לפי אותו עיקרון של זמן ה־**Perfekt**. *Ich bin gegangen.* – הלכתי. → *Ich wäre gegangen.* – הייתי הולך. *Ich habe gearbeitet.* – עבדתי. → *Ich hätte gearbeitet.* – הייתי עובד.
          כלומר: **Perfekt:** haben / sein + Partizip II. **Konjunktiv II Vergangenheit:** hätte / wäre + Partizip II.
      - id: gemischt-he
        type: text
        lang: he
        text: |-
          **שילוב של עבר והווה:** זהו מבנה חשוב במיוחד. לפעמים אנחנו מדברים על **אירוע או החלטה בעבר**, אבל מדמיינים כיצד הם היו משפיעים על **המצב שלנו היום**. כלומר: **עבר שונה → מציאות שונה היום**.
          המבנה: **Wenn + Konjunktiv II Vergangenheit, Konjunktiv II Gegenwart**
          *Wenn ich damals nach Deutschland gezogen wäre, würde ich heute in Berlin leben.* – אם הייתי עובר אז לגרמניה, הייתי גר היום בברלין. המעבר לגרמניה שייך לעבר, ולכן: **gezogen wäre**. אבל המגורים בברלין מתייחסים להיום, ולכן: **würde … leben**.
          *Wenn sie Medizin studiert hätte, wäre sie heute vielleicht Ärztin.* – אם היא הייתה לומדת רפואה, אולי היא הייתה היום רופאה.
          *Wenn wir uns damals nicht kennengelernt hätten, wären wir heute wahrscheinlich keine Freunde.* – אם לא היינו מכירים אז, כנראה שלא היינו חברים היום.
          זה דומה למה שנקרא באנגלית mixed conditionals, כלומר תנאי שמשלב בין זמן אחד לזמן אחר.
      - id: remember-he
        type: text
        lang: he
        text: |-
          **דרך פשוטה לזכור:**
          **Wenn ich mehr Zeit hätte, würde ich reisen.** – אם היה לי יותר זמן, הייתי מטייל. → מצב היפותטי **עכשיו**.
          **Wenn ich mehr Zeit gehabt hätte, wäre ich gereist.** – אם היה לי יותר זמן, הייתי מטייל / הייתי נוסע. → מצב היפותטי **בעבר שכבר הסתיים**.
          **Wenn ich damals nach Deutschland gezogen wäre, würde ich heute Deutsch sprechen.** – אם הייתי עובר אז לגרמניה, הייתי מדבר היום גרמנית. → משהו שלא קרה **בעבר**, שמשפיע על מצב דמיוני **בהווה**.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die drei Strukturen mit der Gruppe. Bitte jeden Schüler um ein eigenes Beispiel für jede Struktur, zum Beispiel über eine Entscheidung aus seinem Leben.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: alternative-realitaeten-hausaufgaben
    title: Hausaufgaben
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben
      - id: goals
        type: text
        lang: he
        text: |-
          **מטרות** – בשיעורי הבית נתרגל:
          1. **Konjunktiv II בהווה**
          2. **Konjunktiv II בעבר**
          3. **שילוב בין עבר להווה**
          4. שימוש ב־**würde, könnte, hätte, wäre**
          5. תיאור מצבים היפותטיים והשלכות שלהם
          6. הבעת חרטה, אפשרויות ומציאויות חלופיות
      - id: classic-title
        type: heading
        level: 3
        lang: he
        text: חלק א – תרגול קלאסי
      - id: ex1-title
        type: heading
        level: 4
        lang: he
        text: תרגיל 1 – השלימו את הצורה הנכונה
      - id: ex1-hint
        type: text
        lang: he
        text: השלימו את המשפטים עם הצורה המתאימה של הפועל בסוגריים.
      - id: ex1
        type: discussionQuestions
        items:
          - question: Wenn ich mehr Zeit ___, würde ich jeden Tag Deutsch lernen. (haben)
          - question: Wenn sie reich ___, würde sie weniger arbeiten. (sein)
          - question: Wenn wir überall leben ___, würden wir wahrscheinlich nach Spanien ziehen. (können)
          - question: Wenn du morgen nicht arbeiten ___, was würdest du machen? (müssen)
          - question: Wenn ich besser Deutsch ___, könnte ich in Deutschland arbeiten. (sprechen)
          - question: Wenn er mehr Geld ___, würde er eine lange Reise machen. (haben)
          - question: Wenn ihr eine neue Sprache lernen ___, welche würdet ihr wählen? (können)
          - question: Wenn ich du ___, würde ich diese Gelegenheit nutzen. (sein)
      - id: ex2-title
        type: heading
        level: 4
        lang: he
        text: תרגיל 2 – בנו משפטים עם Konjunktiv II בהווה
      - id: ex2-hint
        type: text
        lang: he
        text: |-
          חברו את שני חלקי המשפט למשפט היפותטי אחד.
          דוגמה: Ich habe nicht genug Geld. Ich reise nicht ein Jahr lang. → **Wenn ich genug Geld hätte, würde ich ein Jahr lang reisen.**
      - id: ex2
        type: discussionQuestions
        items:
          - question: Ich habe wenig Freizeit. Ich lese nicht viel.
          - question: Sie lebt nicht am Meer. Sie geht nicht jeden Morgen schwimmen.
          - question: Wir können nicht von überall arbeiten. Wir reisen nicht häufiger.
          - question: Er spricht kein Japanisch. Er arbeitet nicht in Tokio.
          - question: Ich muss morgen arbeiten. Ich bleibe nicht lange auf.
          - question: Du hast kein Auto. Du fährst nicht jedes Wochenende aufs Land.
      - id: ex3-title
        type: heading
        level: 4
        lang: he
        text: תרגיל 3 – würde או könnte?
      - id: ex3-hint
        type: text
        lang: he
        text: |-
          בחרו את האפשרות המתאימה יותר לפי המשמעות. בחלק מהמשפטים שתי האפשרויות אפשריות מבחינה דקדוקית. בחרו לפי המשמעות:
          **würde** = מה הייתי עושה; **könnte** = מה הייתי יכול לעשות
      - id: ex3
        type: discussionQuestions
        items:
          - question: Wenn ich mehr Freizeit hätte, ___ ich jeden Tag Sport machen. (würde / könnte)
          - question: Wenn ich einen Führerschein hätte, ___ ich mit dem Auto zur Arbeit fahren. (würde / könnte)
          - question: Wenn sie reich wäre, ___ sie wahrscheinlich weniger arbeiten. (würde / könnte)
          - question: Wenn wir in Deutschland leben würden, ___ wir leichter Deutsch lernen. (würden / könnten)
          - question: Wenn ich morgen frei hätte, ___ ich meine Freunde besuchen. (würde / könnte)
      - id: ex4-title
        type: heading
        level: 4
        lang: he
        text: תרגיל 4 – Konjunktiv II בעבר
      - id: ex4-hint
        type: text
        lang: he
        text: השלימו את המשפטים באמצעות **hätte** או **wäre** ובצורת Partizip II המתאימה.
      - id: ex4
        type: discussionQuestions
        items:
          - question: Wenn ich mehr ___ ___, hätte ich die Prüfung bestanden. (lernen)
          - question: Wenn wir früher ___ ___, hätten wir den Zug erreicht. (losfahren)
          - question: Wenn sie das Angebot ___ ___, hätte sie heute einen anderen Job. (annehmen)
          - question: Wenn ich gestern nicht so spät ___ ___, wäre ich heute weniger müde. (ins Bett gehen)
          - question: Wenn sie nach Deutschland ___ ___, hätte sie schneller Deutsch gelernt. (ziehen)
          - question: Wenn du mich ___ ___, hätte ich dir geholfen. (fragen)
          - question: Wenn wir das vorher ___ ___, hätten wir anders entschieden. (wissen)
          - question: Wenn er vorsichtiger ___ ___, wäre der Unfall vielleicht nicht passiert. (sein)
      - id: ex5-title
        type: heading
        level: 4
        lang: he
        text: תרגיל 5 – מה באמת קרה?
      - id: ex5-hint
        type: text
        lang: he
        text: |-
          קראו את המשפט ההיפותטי וכתבו מה קרה במציאות.
          דוגמה: **Wenn ich früher losgefahren wäre, hätte ich den Zug nicht verpasst.** → Ich bin nicht früh losgefahren. Ich habe den Zug verpasst.
      - id: ex5
        type: discussionQuestions
        items:
          - question: Wenn ich mehr gelernt hätte, hätte ich die Prüfung bestanden.
          - question: Wenn sie das Jobangebot angenommen hätte, wäre sie nach Berlin gezogen.
          - question: Wenn wir früher reserviert hätten, hätten wir einen Tisch bekommen.
          - question: Wenn er mir die Wahrheit gesagt hätte, hätte ich ihm geholfen.
          - question: Wenn sie nicht so viel Geld ausgegeben hätte, hätte sie jetzt mehr Ersparnisse.
      - id: ex6-title
        type: heading
        level: 4
        lang: he
        text: תרגיל 6 – עבר או הווה?
      - id: ex6-hint
        type: text
        lang: he
        text: |-
          החליטו איזה מבנה דרוש. כתבו:
          **G** = Konjunktiv II בהווה; **V** = Konjunktiv II בעבר; **M** = שילוב של עבר והווה
      - id: ex6
        type: discussionQuestions
        items:
          - question: Wenn ich mehr Zeit hätte, würde ich mehr lesen.
          - question: Wenn ich damals Medizin studiert hätte, wäre ich heute Arzt.
          - question: Wenn wir früher losgefahren wären, hätten wir den Flug nicht verpasst.
          - question: Wenn sie in Berlin leben würde, würde sie öfter ihre Freunde sehen.
          - question: Wenn ich dieses Angebot angenommen hätte, würde ich heute in Deutschland leben.
          - question: Wenn er mehr gelernt hätte, hätte er die Prüfung bestanden.
          - question: Wenn ich reich wäre, würde ich weniger arbeiten.
          - question: Wenn wir uns damals nicht kennengelernt hätten, wären wir heute keine Freunde.
      - id: ex7-title
        type: heading
        level: 4
        lang: he
        text: תרגיל 7 – שילוב בין עבר להווה
      - id: ex7-hint
        type: text
        lang: he
        text: |-
          השלימו את המשפטים כך שהסיבה תהיה בעבר והתוצאה תהיה בהווה.
          דוגמה: Wenn ich damals nach Deutschland gezogen wäre, → **würde ich heute wahrscheinlich besser Deutsch sprechen.**
      - id: ex7
        type: discussionQuestions
        items:
          - question: Wenn ich damals ein anderes Fach studiert hätte, ___.
          - question: Wenn ich vor fünf Jahren in ein anderes Land gezogen wäre, ___.
          - question: Wenn ich diese Person nie kennengelernt hätte, ___.
          - question: Wenn ich früher angefangen hätte, Deutsch zu lernen, ___.
          - question: Wenn ich damals dieses Jobangebot angenommen hätte, ___.
          - question: Wenn Smartphones nie erfunden worden wären, ___.
      - id: ex8-title
        type: heading
