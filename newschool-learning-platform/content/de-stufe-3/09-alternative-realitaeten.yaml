          - question: Wenn er das Angebot angenommen wäre, hätte er heute einen anderen Job.
          - question: Wenn ich damals nach Berlin gezogen hätte, hätte ich heute in Berlin leben.
          - question: Wenn du mir gestern geholfen würdest, hätten wir früher fertig geworden.
      - id: ex9-title
        type: heading
        level: 4
        lang: he
        text: תרגיל 9 – תרגום מעברית לגרמנית
      - id: ex9-hint
        type: text
        lang: he
        text: תרגמו לגרמנית.
      - id: ex9
        type: discussionQuestions
        lang: he
        items:
          - question: אם היה לי יותר כסף, הייתי מטייל יותר.
          - question: אם הייתי יכול לבחור כל מקצוע, הייתי הופך לסופר.
          - question: אם היינו יוצאים מוקדם יותר, לא היינו מפספסים את הרכבת.
          - question: אם היא הייתה לומדת יותר, היא הייתה עוברת את המבחן.
          - question: אם הייתי עובר לגרמניה לפני עשר שנים, הייתי מדבר היום גרמנית בצורה שוטפת.
          - question: אם לא היינו נפגשים אז, כנראה שלא היינו חברים היום.
          - question: אם האינטרנט לא היה מומצא, העולם שלנו היה נראה היום שונה מאוד.
          - question: אם הייתי יודע את האמת אז, הייתי מקבל החלטה אחרת.
      - id: ex10-title
        type: heading
        level: 4
        lang: he
        text: תרגיל 10 – המציאות החלופית שלי
      - id: ex10-hint
        type: text
        lang: he
        text: |-
          כתבו **8 עד 10 משפטים בגרמנית**. בחרו החלטה אחת מהעבר שלכם, לדוגמה: לימודים, עבודה, מעבר דירה, טיול, מערכת יחסים, הזדמנות שקיבלתם או דחיתם, שפה שהתחלתם או לא התחלתם ללמוד.
          כתבו על שתי מציאויות: **המציאות האמיתית** – מה קרה בפועל? **המציאות החלופית** – מה היה קורה אילו הייתם מקבלים החלטה אחרת?
          השתמשו לפחות ב: 2 משפטים עם **Konjunktiv II בהווה**; 2 משפטים עם **Konjunktiv II בעבר**; 2 משפטים שמשלבים **עבר + הווה**.
          אפשר להתחיל כך: **Wenn ich damals … hätte, …** / **Wenn ich … wäre, würde ich …** / **Wenn ich damals … wäre, würde ich heute …**
      - id: ex10
        type: reflection
        prompt: Meine alternative Realität
      - id: mori-title
        type: heading
        level: 3
        lang: he
        text: חלק ב – שיחה עם Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere eine Nachricht und schick sie ab. Mori stellt dir Fragen; antworte auf Deutsch.
      - id: mori-gespraech
        type: aiTutorPrompt
        lang: he
        title: פעילות 1 – שיחה על מציאויות חלופיות
        message: |-
          שלום Mori. היום אני רוצה לתרגל גרמנית בנושא מציאויות חלופיות ומצבי "Was wäre, wenn?".
          נהל איתי את כל השיחה בגרמנית.
          שאל אותי שאלות שבהן אצטרך לדמיין גרסאות שונות של החיים שלי או של העולם.
          התחל בשאלות עם Konjunktiv II בהווה, כלומר מצבים לא אמיתיים או היפותטיים בהווה ובעתיד. לדוגמה, שאל אותי מה הייתי עושה אם היה לי יותר זמן, כסף, חופש או אפשרויות אחרות.
          לאחר מכן עבור לשאלות עם Konjunktiv II בעבר, שבהן אצטרך לחשוב על דברים שלא קרו ולדמיין כיצד העבר היה יכול להתפתח אחרת.
          שלב גם שאלות שבהן אירוע בעבר משפיע על מציאות היפותטית בהווה. לדוגמה: Wenn du damals eine andere Entscheidung getroffen hättest, wie würde dein Leben heute aussehen?
          אחרי כל תשובה שלי, שאל שאלת המשך אחת לפחות. בקש ממני:
          - להסביר השלכות
          - להשוות בין שתי מציאויות
          - להביע דעה אישית
          - להסביר יתרונות וחסרונות
          - לדבר גם על רגשות
          אם אני עושה טעות ב־Konjunktiv II, תקן אותי בקצרה והסבר מה צריך לשנות.
          עודד אותי לענות במשפטים מלאים ולא בתשובות של מילה אחת.
          אל תענה במקומי.
      - id: mori-mittagessen
        type: aiTutorPrompt
        lang: he
        title: פעילות 2 – ארוחת צהריים במציאות חלופית
        intro: >-
          בחרו אדם מפורסם שכבר אינו בחיים (אמן או אמנית, פוליטיקאי או פוליטיקאית, מדען או
          מדענית, מוזיקאי או מוזיקאית, סופר או סופרת, דמות היסטורית). דמיינו שבמציאות
          חלופית האדם הזה עדיין חי ואתם נפגשים איתו לארוחת צהריים. כתבו את שמו במקום
          [שם האדם].
        message: |-
          שלום Mori. אני רוצה לתרגל גרמנית דרך משחק תפקידים.
          במציאות החלופית שלנו אתה [שם האדם], ואתה עדיין חי כיום.
          אנחנו נפגשים לארוחת צהריים.
          נהל את כל השיחה איתי בגרמנית ודבר איתי כאילו אתה האדם הזה.
          שאל אותי:
          - מדוע רציתי לפגוש אותך
          - מה הייתי רוצה לשאול אותך
          - מה הייתי רוצה ללמוד ממך
          - כיצד העולם היה נראה היום אילו עדיין היית בחיים
          - אילו דברים היית אולי עושה אחרת אילו ידעת בעבר מה יקרה בעתיד
          שלב שאלות שיחייבו אותי להשתמש ב:
          - Konjunktiv II בהווה
          - Konjunktiv II בעבר
          - שילוב של עבר והווה
          שאל גם שאלות המשך כדי שאוכל להסביר: דעות, רגשות, הערכה, חרטה, השלכות היסטוריות אפשריות.
          אם אני טועה בדקדוק, תקן אותי בקצרה ואז המשך את השיחה.
          עודד אותי לדבר במשפטים מלאים בגרמנית.
          אל תנהל מונולוג ארוך. תן לי לדבר כמה שיותר.
      - id: mori-zwei-realitaeten
        type: aiTutorPrompt
        lang: he
        title: פעילות 3 – החלטה אחת, שתי מציאויות
        intro: >-
          חשבו על החלטה קטנה או גדולה שקיבלתם בעבר (לימודים, מקצוע, מערכת יחסים, טיול,
          מעבר למדינה אחרת, הזדמנות, החלטה שקיבלתם או דחיתם). דמיינו שתי גרסאות של
          החיים שלכם: **מציאות A** – החיים שאתם באמת חיים היום; **מציאות B** – החיים שהיו
          לכם אילו הייתם מקבלים החלטה אחרת.
        message: |-
          שלום Mori. אני רוצה לתרגל גרמנית באמצעות שתי גרסאות חלופיות של החיים שלי.
          החלטה אחת שקיבלתי בעבר יצרה שתי מציאויות אפשריות.
          מציאות A היא החיים שאני באמת חי היום.
          מציאות B היא החיים שהייתי חי אילו הייתי מקבל אז החלטה אחרת.
          נהל איתי את כל השיחה בגרמנית.
          לפעמים דבר עם "האני" שלי מהמציאות האמיתית ולפעמים עם "האני" שלי מהמציאות החלופית.
          שאל אותי שאלות על:
          - מה קרה בפועל
          - מה היה יכול לקרות אחרת
          - איך החיים שלי היו נראים היום
          - איפה הייתי גר
          - במה הייתי עובד
          - עם מי הייתי בקשר
          - מה הייתי מרוויח ומה הייתי מפסיד
          - האם הייתי מאושר יותר או פחות
          - מה למדתי מההחלטה האמיתית שלי
          שלב שאלות עם Konjunktiv II בהווה, Konjunktiv II בעבר ושילוב של עבר והווה.
          שאל שאלות המשך ודרוש ממני להסביר את התשובות שלי.
          אם אני עושה טעות, תקן אותי בקצרה והראה לי את הצורה הנכונה.
          בסיום השיחה, בקש ממני לסכם בגרמנית איזו משתי המציאויות הייתי מעדיף ולמה.
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          **Heute:** *Wenn ich … hätte / wäre, würde ich …* **Damals:** *Wenn ich … hätte / wäre + Partizip II, hätte / wäre ich …* **Damals → heute:** *Wenn ich damals … wäre, würde ich heute …*
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**
    teacherNotes:
      - id: n-key1
        anchor: ex1
        text: >-
          Lösungen Übung 1: 1. hätte 2. wäre 3. könnten 4. müsstest 5. sprechen würde
          (auch richtig, aber selten: spräche) 6. hätte 7. könntet 8. wäre.
      - id: n-key2
        anchor: ex2
        text: >-
          Mögliche Lösungen Übung 2: 1. Wenn ich mehr Freizeit hätte, würde ich mehr
          lesen. 2. Wenn sie am Meer leben würde, würde sie jeden Morgen schwimmen gehen.
          3. Wenn wir von überall arbeiten könnten, würden wir häufiger reisen. 4. Wenn er
          Japanisch sprechen würde, könnte er in Tokio arbeiten. 5. Wenn ich morgen nicht
          arbeiten müsste, würde ich länger aufbleiben. 6. Wenn du ein Auto hättest,
          würdest du jedes Wochenende aufs Land fahren.
      - id: n-key3
        anchor: ex3
        text: >-
          Lösungen Übung 3: 1. würde 2. könnte 3. würde 4. könnten 5. würde. In manchen
          Sätzen ist auch die andere Form richtig, aber die Bedeutung ändert sich: *würde*
          = was ich tun würde; *könnte* = Möglichkeit oder Fähigkeit.
      - id: n-key4
        anchor: ex4
        text: >-
          Lösungen Übung 4: 1. gelernt hätte 2. losgefahren wären 3. angenommen hätte 4.
          ins Bett gegangen wäre 5. gezogen wäre 6. gefragt hättest 7. gewusst hätten 8.
          gewesen wäre.
      - id: n-key5
        anchor: ex5
        text: >-
          Lösungen Übung 5: 1. Ich habe nicht genug gelernt. Ich habe die Prüfung nicht
          bestanden. 2. Sie hat das Jobangebot nicht angenommen. Sie ist nicht nach
          Berlin gezogen. 3. Wir haben nicht früh genug reserviert. Wir haben keinen Tisch
          bekommen. 4. Er hat mir die Wahrheit nicht gesagt. Ich habe ihm nicht geholfen.
          5. Sie hat zu viel Geld ausgegeben. Sie hat jetzt weniger Ersparnisse.
      - id: n-key6
        anchor: ex6
        text: 'Lösungen Übung 6: 1. G 2. M 3. V 4. G 5. M 6. V 7. G 8. M.'
      - id: n-key7
        anchor: ex7
        text: >-
          Persönliche Antworten. Beispiele: 1. … würde ich heute vielleicht in einem
          anderen Bereich arbeiten. 2. … würde ich heute wahrscheinlich eine andere
          Sprache sprechen. 3. … wäre mein Leben heute ganz anders. 4. … würde ich heute
          viel fließender sprechen. 5. … würde ich heute vielleicht in einer anderen Stadt
          leben. 6. … würden wir heute anders kommunizieren.
      - id: n-key8
        anchor: ex8
        text: >-
          Lösungen Übung 8: 1. Wenn ich mehr Zeit hätte, würde ich mehr reisen. 2. Wenn
          ich gestern früher gegangen wäre, hätte ich den Bus erreicht. 3. Wenn sie mehr
          gelernt hätte, hätte sie die Prüfung gestern bestanden. 4. Wenn ich reich wäre,
          könnte ich weniger arbeiten. 5. Wenn wir früher losgefahren wären, hätten wir
          den Zug nicht verpasst. 6. Wenn er das Angebot angenommen hätte, hätte er heute
          einen anderen Job. 7. Wenn ich damals nach Berlin gezogen wäre, würde ich heute
          in Berlin leben. 8. Wenn du mir gestern geholfen hättest, wären wir früher
          fertig geworden. Hinweis: Die Sätze 1, 3 und 4 sind nicht falsch, nur
          ungewöhnlich (*haben würde, sein würde, würde … bestanden haben*); bei *haben* und
          *sein* benutzen wir *hätte / wäre*.
      - id: n-key9
        anchor: ex9
        text: >-
          Mögliche Lösungen Übung 9: 1. Wenn ich mehr Geld hätte, würde ich mehr reisen.
          2. Wenn ich jeden Beruf wählen könnte, würde ich Schriftsteller(in) werden. 3.
          Wenn wir früher losgefahren wären, hätten wir den Zug nicht verpasst. 4. Wenn
          sie mehr gelernt hätte, hätte sie die Prüfung bestanden. 5. Wenn ich vor zehn
          Jahren nach Deutschland gezogen wäre, würde ich heute fließend Deutsch
          sprechen. 6. Wenn wir uns damals nicht kennengelernt hätten, wären wir heute
          wahrscheinlich keine Freunde. 7. Wenn das Internet nie erfunden worden wäre,
          würde unsere Welt heute ganz anders aussehen. 8. Wenn ich damals die Wahrheit
          gewusst hätte, hätte ich eine andere Entscheidung getroffen.
      - id: n-key10
        anchor: ex10
        text: |-
          Persönliche Antworten. Prüfe, dass der Schüler mindestens zwei Sätze im Konjunktiv II der Gegenwart, zwei im Konjunktiv II der Vergangenheit und zwei gemischte Sätze (Vergangenheit + Gegenwart) benutzt. Beispiel:
          Wenn ich damals in Deutschland studiert hätte, wäre mein Leben anders verlaufen. Ich hätte dort wahrscheinlich viele neue Menschen kennengelernt. Vielleicht wäre ich nach dem Studium in Deutschland geblieben. Heute würde ich dann wahrscheinlich in Berlin leben. Ich würde im Alltag viel mehr Deutsch sprechen. Vielleicht hätte ich einen anderen Beruf und andere Freunde. Trotzdem weiß ich nicht, ob ich glücklicher wäre. Wenn ich heute wählen könnte, würde ich wahrscheinlich meine echte Realität behalten.

