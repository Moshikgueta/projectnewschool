activities:
  - slug: alternative-realitaeten-gegenwart
    title: Konjunktiv II der Gegenwart
    minutes: 8
    items:
      - id: haette-zeit
        type: fillBlank
        prompt: Ergänze *haben* im Konjunktiv II.
        text: Wenn ich mehr Zeit ___, würde ich jeden Tag Deutsch lernen.
        blanks: [[hätte]]
      - id: waere-reich
        type: multipleChoice
        prompt: Wenn sie reich ___, würde sie weniger arbeiten.
        options:
          - { text: wäre, correct: true }
          - {
              text: war,
              feedback: '*war* ist Präteritum: eine echte Vergangenheit. Für eine imaginäre Situation heute sagen wir *wäre*.',
            }
          - {
              text: ist,
              feedback: '*ist* beschreibt die Realität. Sie ist nicht reich: Wir brauchen den Konjunktiv II *wäre*.',
            }
      - id: koennten
        type: fillBlank
        prompt: Ergänze *können* im Konjunktiv II.
        text: Wenn wir überall leben ___, würden wir wahrscheinlich nach Spanien ziehen.
        blanks: [[könnten]]
      - id: formen
        type: matching
        prompt: Welche Konjunktiv-II-Form passt zu welchem Verb?
        pairs:
          - [sein, wäre]
          - [haben, hätte]
          - [können, könnte]
          - [müssen, müsste]
          - [wissen, wüsste]
      - id: koennte-bedeutung
        type: trueFalse
        prompt: '*Wenn ich mehr Zeit hätte, könnte ich Deutsch lernen.* bedeutet: Es wäre möglich, aber ich sage nicht sicher, dass ich es tun würde.'
        answer: true
        feedback:
          correct: 'Richtig! *könnte* = Möglichkeit oder Fähigkeit. *würde* = was ich tun würde.'
          incorrect: '*könnte* drückt eine Möglichkeit aus. Was ich wirklich tun würde, sagen wir mit *würde*: *…, würde ich Deutsch lernen.*'
      - id: natuerlich
        type: multipleChoice
        prompt: Welcher Satz ist am natürlichsten?
        options:
          - { text: 'Wenn ich mehr Zeit hätte, würde ich mehr reisen.', correct: true }
          - {
              text: 'Wenn ich mehr Zeit haben würde, würde ich mehr reisen.',
              feedback: 'Das ist nicht falsch, aber bei *haben* benutzen wir lieber die eigene Form *hätte*.',
            }
          - {
              text: 'Wenn ich mehr Zeit hatte, würde ich mehr reisen.',
              feedback: '*hatte* ist Präteritum (echte Vergangenheit). Für eine imaginäre Situation sagen wir *hätte*.',
            }
      - id: ich-du
        type: fillBlank
        prompt: Ergänze *sein* im Konjunktiv II.
        text: Wenn ich du ___, würde ich diese Gelegenheit nutzen.
        blanks: [[wäre]]
      - id: ordne-reich
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz im Konjunktiv II.
        sentence: Wenn ich reich wäre, würde ich weniger arbeiten.

  - slug: alternative-realitaeten-vergangenheit
    title: Konjunktiv II der Vergangenheit
    minutes: 8
    items:
      - id: losgefahren-waeren
        type: multipleChoice
        prompt: Wenn wir früher losgefahren ___, hätten wir den Zug nicht verpasst.
        options:
          - { text: wären, correct: true }
          - {
              text: hätten,
              feedback: '*losfahren* bildet das Perfekt mit *sein* (*wir sind losgefahren*), also: *losgefahren wären*.',
            }
          - {
              text: würden,
              feedback: 'Für die Vergangenheit brauchen wir *hätte / wäre* + Partizip II: *losgefahren wären*.',
            }
      - id: gefragt-haettest
        type: fillBlank
        prompt: Ergänze das Partizip II von *fragen* und *haben* im Konjunktiv II.
        text: Wenn du mich ___ ___, hätte ich dir geholfen.
        blanks: [[gefragt], [hättest]]
      - id: angenommen-falsch
        type: trueFalse
        prompt: 'Der Satz *Wenn er das Angebot angenommen wäre, hätte er heute einen anderen Job.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! *annehmen* bildet das Perfekt mit *haben* (*er hat angenommen*): *Wenn er das Angebot angenommen hätte, …*'
          incorrect: '*annehmen* bildet das Perfekt mit *haben*: *Wenn er das Angebot angenommen **hätte**, hätte er heute einen anderen Job.*'
      - id: was-wirklich
        type: matching
        prompt: Was ist wirklich passiert?
        pairs:
          - [
              'Wenn ich mehr gelernt hätte, hätte ich die Prüfung bestanden.',
              Ich habe die Prüfung nicht bestanden.,
            ]
          - [
              'Wenn wir früher reserviert hätten, hätten wir einen Tisch bekommen.',
              Wir haben keinen Tisch bekommen.,
            ]
          - [
              'Wenn sie das Jobangebot angenommen hätte, wäre sie nach Berlin gezogen.',
              Sie ist nicht nach Berlin gezogen.,
            ]
          - [
              'Wenn er mir die Wahrheit gesagt hätte, hätte ich ihm geholfen.',
              Ich habe ihm nicht geholfen.,
            ]
      - id: gemischt-erkennen
        type: multipleChoice
        prompt: '*Wenn ich dieses Angebot angenommen hätte, würde ich heute in Deutschland leben.* Welche Struktur ist das?'
        options:
          - { text: Vergangenheit + Gegenwart (gemischt), correct: true }
          - {
              text: Konjunktiv II der Gegenwart,
              feedback: '*angenommen hätte* ist Konjunktiv II der Vergangenheit; die Folge (*würde … leben*) betrifft heute. Das ist gemischt.',
            }
          - {
              text: Konjunktiv II der Vergangenheit,
              feedback: 'Die Bedingung ist Vergangenheit, aber *würde … heute leben* ist Gegenwart. Das ist gemischt.',
            }
      - id: heute-wuerde
        type: multipleChoice
        prompt: Wenn ich damals nach Deutschland gezogen wäre, ___ ich heute in Berlin leben.
        options:
          - { text: würde, correct: true }
          - {
              text: hätte,
              feedback: '*hätte* + Infinitiv gibt es nicht. Die Folge betrifft heute: *würde* + Infinitiv (*würde … leben*).',
            }
          - {
              text: wäre,
              feedback: '*wäre* + Infinitiv gibt es nicht. Die Folge betrifft heute: *würde* + Infinitiv (*würde … leben*).',
            }
      - id: gewesen-waere
        type: fillBlank
        prompt: Ergänze das Partizip II von *sein* und *sein* im Konjunktiv II.
        text: Wenn er vorsichtiger ___ ___, wäre der Unfall vielleicht nicht passiert.
        blanks: [[gewesen], [wäre]]
      - id: ordne-pruefung
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz im Konjunktiv II der Vergangenheit.
        sentence: Wenn ich mehr gelernt hätte, hätte ich die Prüfung bestanden.
