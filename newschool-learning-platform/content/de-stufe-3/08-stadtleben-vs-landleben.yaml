# Cycle "Stadtleben vs. Landleben", converted from the German level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (German); Hebrew blocks carry `lang: he`.
course: de-stufe-3
slug: stadtleben-vs-landleben
title: Stadtleben vs. Landleben
goal: Orte mit Relativsätzen beschreiben und Meinungen über Stadt- und Landleben ausdrücken und begründen.
position: 8
status: published

review:
  - >-
    The two workbook exercises ("Relativsätze" and "Meinungen ausdrücken und
    begründen") are NEW: the notebook has no self-correcting exercises. They were
    written from the cycle's summary, the activity examples, the classic homework
    (corrected) and the vocabulary. Please check level, wording and every right answer
    before students see them.
  - >-
    Activity 1 is titled "Trends des Jahrhunderts" in the notebook, the title of
    Activity 1 of the previous cycle (Soziale Medien), and says "Lest den Flyer, der an
    die Bewohner verteilt wurde", but there is NO flyer in the notebook. The title is
    now "Stadterneuerung in unserem Viertel"; a teacher note asks the teacher to bring
    or describe a short flyer about a renovation project. Please confirm the title and
    add the flyer.
  - >-
    Summary, Relativsätze: the notebook's table (der / die / das for people or things,
    die for plural, wo for places) only gives the nominative and does not say how to
    choose the pronoun. Added German rules (please confirm): the pronoun takes gender
    and number from the noun and its case from its role in the relative clause; a
    table of the nominative, accusative and dative forms (den, dem, der, denen), which
    the cycle itself uses (einen Park, den ich oft besuche; das Viertel, in dem wir
    leben; Menschen, mit denen sie sprechen konnte); the conjugated verb goes to the
    end; commas around the relative clause; "wo" for places can also be "in dem / an
    dem" (both are correct).
  - >-
    Summary, connectors: the notebook only lists weil, denn, aber, jedoch, obwohl and
    "auf der einen Seite … auf der anderen Seite" with Hebrew glosses. A German rule on
    word order was added: weil / obwohl / dass send the verb to the end; denn and aber
    do not change the word order; after "Meiner Meinung nach", "jedoch" (at the start)
    and "auf der anderen Seite" the verb comes next (position 2). The Hebrew text is
    kept as it is.
  - >-
    Corrections: Activity 4, step 3 "…an einem Ort leben, wo es viele Menschen gibt
    oder an einem Ort, wo es ruhig ist?" → comma after "gibt" (the relative clause
    must be closed); Activity 2 model answer: missing full stop added; the Hebrew
    summary heading appeared twice and is kept once; stray "**" marks and the broken
    title "Stadtleben vs Landleben**" were cleaned up; "Mori\!" → "Mori!" in the Mori
    messages.
  - >-
    The classic homework (Exercises 1–5) is printed TWICE in the notebook; it is kept
    once. Answer key checked: all answers are correct. The key now also accepts "in
    dem / an dem" next to "wo" (Exercise 1.5: der Ort, an dem ich aufgewachsen bin;
    Exercise 2.3 and 2.5: in dem). The answer key and the model answers of Exercises
    3–5 are in the teacher notes only.
  - >-
    Introduction frame "Ich heiße ___. Ich lebe in einer Stadt / auf dem Land." was
    extended with a relative clause (… in einer Stadt, die ___ / auf dem Land, wo ___)
    to match the notebook's own example (Mario). Frames were added for the warm-up
    questions and the discussion questions (not in the source).
  - >-
    Vocabulary: "erhalten – לשמר" → "לשמר (גם: לקבל)": erhalten also means "to
    receive", as in the previous cycle (Nachrichten erhalten). All other glosses are
    unchanged. The Quizlet link lost its tracking parameter (?new).
  - >-
    Kept: the DW video "Anomalia: Leben in einem Öko-Dorf" (YouTube, allowed host) as
    the resource of Activity 2; the notebook's short introduction to Anomalia and the
    fable "Die Stadtmaus und die Landmaus" (a retelling of a traditional fable written
    for the notebook, not a copied text). Left out: the empty "Datum / Teilnehmer"
    lines and the "Antwort Schüler/in 1/2/3" lines. The notebook gives no times for
    this cycle, so no minutes are set. No student names or class notes appear in this
    cycle.
  - >-
    Homework: the classic exercises and the Mori messages are kept in Hebrew, as in
    the notebook (Mori blocks carry lang he); German example sentences stay German.
    The tips callout and a short German "how to" line were added as in other cycles.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: stadtleben-vs-landleben-unterricht
    title: 'Unterricht: Stadtleben vs. Landleben'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Stadtleben vs. Landleben
      - id: skills
        type: cycleOverview
        skills:
          - name: Relativsätze
            description: '*der, die, das, die / wo*: *Ich wohne in einer Stadt, die viele Parks hat. Das ist ein Ort, wo man ruhig leben kann.*'
          - name: Meinungen ausdrücken und begründen
            description: '*Meiner Meinung nach ist das Stadtleben besser, weil es mehr Möglichkeiten gibt.*'
      - id: quizlet
        type: externalLink
        label: Stadtleben vs. Landleben auf Quizlet
        url: https://quizlet.com/br/1186208944/stadtleben-vs-landleben-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Vorstellungsrunde
      - id: intro
        type: sentenceFrame
        frame: Ich heiße ___ und ich lebe in einer Stadt, die ___. / … auf dem Land, wo ___.
        example: Ich heiße Mario und ich lebe in einer Stadt, die viele Parks und Cafés hat.
      - id: warmup-title
        type: heading
        level: 3
        text: Aufwärmfragen
      - id: warmup-hint
        type: callout
        tone: info
        text: Antworte in **vollständigen Sätzen** und **begründe** deine Meinung.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Würdest du lieber in einer Stadt oder auf dem Land leben? Warum?
            frame: Ich würde lieber ___ leben, weil ___.
          - question: Beschreibe einen Ort, an dem du gerne gelebt oder den du gerne besucht hast. Welche Vorteile hatte dieser Ort?
            frame: '___ ist ein Ort, der / die / das ___. Ein Vorteil war, dass ___.'
          - question: Wie wohnst du heute? Gibt es etwas, das du gerne ändern würdest?
            frame: Ich wohne in ___, die / der / das ___. Ich würde gerne ___ ändern.
          - question: Bist du schon einmal umgezogen? Wie hat sich dein Leben dadurch verändert?
            frame: Ja, ich bin nach ___ umgezogen. Mein Leben hat sich ___ verändert. / Nein, ___.
          - question: Wo möchtest du in Zukunft leben? Warum?
            frame: In Zukunft möchte ich in / an einem Ort leben, wo ___, weil ___.
          - question: Welche Art von Gemeinschaft passt am besten zu dir?
            frame: Eine Gemeinschaft, die ___, passt am besten zu mir.
          - question: Gibt es dort, wo du wohnst, Natur oder Grünflächen? Nutzt du sie oft?
            frame: In meiner Nähe gibt es ___, den / die / das ich ___ nutze.
          - question: Was denkst du über Stadterneuerungsprojekte? Sind sie eine gute Lösung?
            frame: Meiner Meinung nach sind Stadterneuerungsprojekte ___, weil ___.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Stadterneuerung in unserem Viertel'
        skills: [Relativsätze, Meinungen ausdrücken und begründen]
        steps:
          - 'In vielen Städten werden alte Gebäude abgerissen und neue gebaut. **Schritt 1:** Lest den Flyer, der an die Bewohner verteilt wurde.'
          - '**Schritt 2:** Jeder Schüler bekommt eine Rolle: langjähriger Bewohner, junger Berufstätiger, Elternteil oder Vertreter der Gemeinde.'
          - '**Schritt 3:** Diskutiert gemeinsam die Fragen unten. Versucht, Relativsätze zu benutzen.'
          - '**Schritt 4:** Entscheidet gemeinsam: *Wir unterstützen das Projekt.* / *Wir lehnen das Projekt ab.* / *Wir unterstützen das Projekt unter bestimmten Bedingungen.*'
        example: |-
          *Menschen, die seit vielen Jahren hier wohnen, machen sich Sorgen.*
          *Das Viertel, in dem wir leben, wird sich stark verändern.*
      - id: act1-questions
        type: discussionQuestions
        title: Diskussion
        items:
          - question: Wie wird das Projekt die Bewohner beeinflussen?
            frame: Bewohner, die ___, werden ___.
          - question: Ist Stadterneuerung eine gute Lösung?
            frame: Ich denke, dass Stadterneuerung ___, weil ___.
          - question: Welche Probleme könnte die Baustelle verursachen?
            frame: Die Baustelle könnte ___ verursachen.
          - question: Welche Vorteile könnte das Projekt bringen?
            frame: Ein Vorteil, den das Projekt bringen könnte, ist ___.
          - question: Wie wird sich das Viertel verändern?
            frame: Das Viertel, in dem wir leben, wird ___.
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Leben in einem Öko-Dorf'
        skills: [Meinungen ausdrücken und begründen]
        steps:
          - '**Schritt 1:** Schaut die ersten 7 Minuten des DW-Videos *Anomalia: Leben in einem Öko-Dorf*.'
          - '**Kurze Einführung:** Anomalia ist ein Öko-Dorf in Deutschland, in dem Menschen versuchen, nachhaltiger und umweltfreundlicher zu leben. Die Bewohner legen großen Wert auf Gemeinschaft, Naturschutz und einen bewussten Lebensstil. Viele Menschen arbeiten zusammen, teilen Ressourcen und versuchen, ihren ökologischen Fußabdruck zu reduzieren.'
          - '**Schritt 2:** Diskutiert die Fragen unten in Gruppen oder als Klasse. Verwendet Meinungsäußerungen: *Ich denke, dass … / Meiner Meinung nach … / Persönlich glaube ich, dass … / Aus meiner Sicht … / Ich bin der Meinung, dass … / Einerseits …, andererseits …*'
          - '**Mini-Debatte:** „Das Leben in einem Öko-Dorf bietet eine bessere Lebensqualität als das Leben in einer Großstadt.“ **Gruppe A** stimmt zu, **Gruppe B** stimmt nicht zu.'
          - 'Jedes Argument soll enthalten: eine klare Meinung, einen Grund und ein persönliches Beispiel.'
        example: '*Meiner Meinung nach bietet ein Öko-Dorf eine bessere Lebensqualität, weil die Menschen enger mit der Natur verbunden sind. Ich verbringe gerne Zeit im Freien, deshalb könnte ich mir vorstellen, in einer solchen Gemeinschaft zu leben.*'
        resource:
          label: 'Anomalia: Leben in einem Öko-Dorf | DW Deutsch (YouTube)'
          url: https://www.youtube.com/watch?v=vQpGZar9urM
      - id: act2-questions
        type: discussionQuestions
        title: Fragen zum Video
        items:
          - question: Was hat euch am Leben im Öko-Dorf überrascht?
            frame: Mich hat überrascht, dass ___.
          - question: Wie unterscheidet sich das Leben im Öko-Dorf vom Leben in einer Großstadt?
            frame: Im Öko-Dorf ___, aber in einer Großstadt ___.
          - question: Welche Rolle spielen Gemeinschaft, Natur und Nachhaltigkeit im Alltag der Bewohner?
          - question: Könntet ihr euch vorstellen, in einem Öko-Dorf zu leben? Warum oder warum nicht?
            frame: Ich könnte mir (nicht) vorstellen, in einem Öko-Dorf zu leben, weil ___.
          - question: Welche Vorteile hat eine Gemeinschaft, in der Menschen enger zusammenarbeiten?
          - question: Welche Nachteile könnte das Leben in einem Öko-Dorf haben?
            frame: Einerseits ___, andererseits ___.
          - question: Welche Ideen aus dem Öko-Dorf könnten auch in Städten genutzt werden?
          - question: Glaubt ihr, dass mehr Menschen in Zukunft nachhaltiger leben möchten?
            frame: Ich glaube (nicht), dass ___.
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Wettbewerb – Urbane Natur'
        skills: [Relativsätze]
        steps:
          - 'Urbane Natur bedeutet Parks, Gärten, Flüsse oder andere Grünflächen in Städten. **Schritt 1:** Sammelt Beispiele, zum Beispiel den Central Park, den Hyde Park oder die Bahai-Gärten.'
          - '**Schritt 2:** Findet drei Orte aus verschiedenen Kontinenten. Beschreibt sie mit Relativsätzen.'
          - '**Schritt 3:** Präsentiert eure Orte. Die interessanteste Präsentation gewinnt.'
        example: |-
          *Der Central Park ist ein Park, der mitten in New York liegt.*
          *Die Bahai-Gärten sind ein Ort, der viele Touristen anzieht.*
          *Singapur ist eine Stadt, in der moderne Architektur und Natur kombiniert werden.*
      - id: act3-places
        type: discussionQuestions
        title: Unsere drei Orte
        items:
          - question: Ort 1
            frame: ___ ist ein Park / ein Garten / eine Stadt, der / die / das ___.
          - question: Ort 2
            frame: ___ ist ein Ort, wo ___.
          - question: Ort 3
            frame: ___ ist eine Stadt, in der ___.
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Die Stadtmaus und die Landmaus'
        skills: [Relativsätze, Meinungen ausdrücken und begründen]
        steps:
          - '**Schritt 1:** Lest die Geschichte unten.'
          - '**Schritt 2, Verständnisfragen:** Besprecht die Fragen in Paaren oder Gruppen.'
          - '**Schritt 3, Relativsätze:** Beantwortet die Fragen mit Relativsätzen.'
          - '**Schritt 4, Debatte:** **Gruppe A:** Das Stadtleben bietet eine bessere Lebensqualität. **Gruppe B:** Das Landleben bietet eine bessere Lebensqualität. Jedes Argument muss enthalten: mindestens einen Relativsatz, eine persönliche Meinung und ein persönliches Beispiel.'
          - '**Schritt 5:** Klassendiskussion und Abschlussfrage.'
        example: |-
          *Meiner Meinung nach ist das Stadtleben besser, weil es mehr Möglichkeiten gibt. Ich wohne in einer Stadt, die viele Restaurants und kulturelle Veranstaltungen bietet.*
          *Ich glaube, dass das Landleben angenehmer ist, weil es weniger Lärm gibt. Ich habe einmal in einem Dorf gewohnt, das sehr ruhig war.*
      - id: act4-story-title
        type: heading
        level: 4
        text: Die Stadtmaus und die Landmaus
      - id: act4-story
        type: text
        text: |-
          Die Landmaus lebte auf dem Land, wo die Luft frisch war und das Leben ruhig verlief. Jeden Morgen hörte sie die Vögel, die in den Bäumen sangen, und sie genoss die Natur, die sie umgab.
          Eines Tages bekam sie Besuch von ihrer Cousine, der Stadtmaus, die in einer großen Stadt lebte. Die Stadtmaus erzählte von Restaurants, die bis spät in die Nacht geöffnet waren, von Geschäften, die alles verkauften, und von Menschen, die immer beschäftigt waren.
          Die Landmaus war neugierig und beschloss, ihre Cousine zu besuchen.
          Als sie in der Stadt ankam, war sie beeindruckt von den Wolkenkratzern, die den Himmel bedeckten, und von den Straßen, die voller Menschen waren. Zuerst gefiel ihr das aufregende Leben. Doch schon bald hörte sie laute Sirenen, Verkehrslärm und Menschen, die die ganze Nacht unterwegs waren. Sie fühlte sich gestresst und unsicher.
          Einige Wochen später besuchte die Stadtmaus das Dorf. Dort sah sie Felder, die sich bis zum Horizont erstreckten, und Häuser, die von Natur umgeben waren. Sie genoss die Ruhe, aber nach einigen Tagen langweilte sie sich. Es gab keine Einkaufszentren, keine großen Veranstaltungen und nur wenige Menschen, mit denen sie sprechen konnte.
          Am Ende verstanden beide Mäuse, dass Lebensqualität für verschiedene Menschen etwas anderes bedeutet. Der Ort, der für eine Person perfekt ist, kann für eine andere Person ungeeignet sein.
      - id: act4-comprehension
        type: discussionQuestions
        title: Verständnisfragen
        items:
          - question: Was hat der Landmaus am Stadtleben gefallen?
            frame: Der Landmaus haben ___ gefallen, die ___.
          - question: Was hat ihr am Stadtleben nicht gefallen?
          - question: Was hat die Stadtmaus auf dem Land genossen?
          - question: Warum war die Stadtmaus auf dem Land nicht ganz glücklich?
          - question: Welche Maus hat eurer Meinung nach die bessere Lebensqualität?
            frame: Meiner Meinung nach hat die ___ die bessere Lebensqualität, weil ___.
      - id: act4-relative
        type: discussionQuestions
        title: Mit Relativsätzen antworten
        items:
          - question: Welche Vorteile hat eine Stadt, die viele Arbeitsmöglichkeiten bietet?
            frame: Eine Stadt, die viele Arbeitsmöglichkeiten bietet, ___.
          - question: Welche Vorteile hat ein Dorf, das von Natur umgeben ist?
            frame: Ein Dorf, das von Natur umgeben ist, ___.
          - question: Würdet ihr lieber an einem Ort leben, wo es viele Menschen gibt, oder an einem Ort, wo es ruhig ist?
            frame: Ich würde lieber an einem Ort leben, wo ___.
      - id: act4-relative-examples
        type: callout
        tone: info
        title: Beispiele
        text: |-
          *Die Stadt ist ein Ort, der viele Möglichkeiten bietet.*
          *Das Dorf ist ein Ort, wo die Menschen ruhiger leben können.*
          *Die Landmaus mochte die Natur, die sie jeden Tag sehen konnte.*
      - id: act4-discussion
        type: discussionQuestions
        title: Klassendiskussion
        items:
          - question: Mit welcher Maus identifiziert ihr euch mehr?
            frame: Ich identifiziere mich mehr mit der ___, weil ___.
          - question: Welche Aspekte des Stadtlebens mögt ihr?
          - question: Welche Aspekte des Landlebens mögt ihr?
          - question: Gibt es Orte, die das Beste aus beiden Welten bieten?
            frame: Ja, ___ ist ein Ort, der / die / das ___.
          - question: Was bedeutet Lebensqualität für euch persönlich?
            frame: Lebensqualität bedeutet für mich ___.
          - question: '**Abschlussfrage:** Wenn ihr heute umziehen könntet, würdet ihr einen Ort wählen, der eher städtisch oder eher ländlich ist? Warum?'
            frame: Ich würde einen Ort wählen, der eher ___ ist, weil ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: **Relativsätze** (der, die, das, die /
          wo; Aktivitäten 1, 3 und 4) und **Meinungen ausdrücken und begründen**
          (Aufwärmfragen, Aktivitäten 1, 2 und 4). Themen: Lebensqualität, Gemeinschaft,
          Natur, Verkehr, Bevölkerungsdichte, Stadterneuerung. Das Heft gibt für diesen
          Zyklus keine Zeiten an.
      - id: n-intro
        anchor: intro
        text: Gib zuerst dein eigenes Beispiel mit einem Relativsatz. Achte darauf, dass das Verb im Relativsatz am Ende steht (… *die viele Parks **hat***).
      - id: n-warmup
        anchor: warmup
        text: Die Schüler antworten in vollständigen Sätzen und begründen ihre Meinung (*weil, denn, obwohl*). Stell jedem Schüler mindestens zwei Fragen.
      - id: n-act1
        anchor: act1
        text: >-
          Der Flyer fehlt im Heft. Bring einen kurzen Flyer mit (zum Beispiel: Ein altes
          Wohnhaus im Viertel wird abgerissen, an seiner Stelle werden ein Hochhaus mit
          Wohnungen, ein Park und eine Tiefgarage gebaut; die Bauzeit beträgt zwei Jahre)
          oder beschreibe das Projekt mündlich. Verteile die vier Rollen; bei mehr
          Schülern können Rollen doppelt vergeben werden.
      - id: n-act2
        anchor: act2
        text: >-
          Zeig die ersten 7 Minuten des Videos. Lies vorher die kurze Einführung vor.
          Achte in der Mini-Debatte darauf, dass jedes Argument eine Meinung, einen Grund
          und ein persönliches Beispiel hat.
      - id: n-act3
        anchor: act3
        text: Die Gruppen können im Internet recherchieren. Bewertet am Ende gemeinsam die interessanteste Präsentation; achtet dabei auch auf richtige Relativsätze.
      - id: n-act4
        anchor: act4
        text: >-
          Die Geschichte ist voller Relativsätze: Lass die Schüler beim Lesen alle
          Relativpronomen markieren (*die, der, denen*) und sag, worauf sie sich
          beziehen. In der Debatte muss jedes Argument einen Relativsatz enthalten.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: stadtleben-vs-landleben-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: intro-he
        type: text
        lang: he
        text: >-
          בשיעור זה דיברנו על ההבדלים בין החיים בעיר לבין החיים בכפר. שוחחנו על איכות
          חיים, קהילה, טבע, תחבורה, צפיפות אוכלוסין, התחדשות עירונית והעדפות מגורים.
          בנוסף, תרגלנו שני נושאים דקדוקיים חשובים: **Relativsätze (משפטי זיקה)**
          ו־**הבעת דעה בגרמנית**.
      - id: rules-relativ
        type: ruleSummary
        skill: Relativsätze
        rules:
          - text: 'Mit einem **Relativsatz** geben wir mehr Informationen über eine Person, einen Ort, eine Sache oder eine Idee, ohne einen neuen Satz anzufangen.'
            examples:
              - Ich wohne in einer Stadt, die viele Parks hat.
              - Die Menschen, die auf dem Land leben, kennen oft ihre Nachbarn besser.
          - text: 'Das **Relativpronomen** hat das Genus und die Zahl des Nomens: **der** (maskulin), **die** (feminin), **das** (neutral), **die** (Plural).'
            examples:
              - Der Park, der sehr groß ist.
              - Die Stadt, die viele Restaurants hat.
              - Das Haus, das neu gebaut wurde.
              - Die Menschen, die hier wohnen.
          - text: 'Der **Kasus** kommt aus dem Relativsatz: Ist das Pronomen dort Akkusativ- oder Dativobjekt oder steht es nach einer Präposition, ändert es sich (*den, dem, der, denen*).'
            examples:
              - Es gibt einen Park, **den** ich oft besuche.
              - Das Viertel, **in dem** wir leben, wird sich verändern.
              - Es gab nur wenige Menschen, **mit denen** sie sprechen konnte.
          - text: 'Für **Orte** können wir **wo** benutzen (oder *in dem / in der / an dem*).'
            examples:
              - Das ist ein Ort, wo man ruhig leben kann.
              - Das ist der Ort, wo ich aufgewachsen bin. / … an dem ich aufgewachsen bin.
          - text: 'Im Relativsatz steht das **konjugierte Verb am Ende**. Vor (und nach) dem Relativsatz steht ein **Komma**.'
            examples:
              - Das ist ein Dorf, das sehr ruhig **ist**.
              - Die Menschen, die hier **leben**, kennen sich gut.
      - id: relativ-table
        type: table
        caption: Relativpronomen
        header: [Kasus, maskulin, feminin, neutral, Plural]
        rows:
          - [Nominativ, der, die, das, die]
          - [Akkusativ, den, die, das, die]
          - [Dativ, dem, der, dem, denen]
      - id: relativ-he
        type: text
        lang: he
        text: |-
          משפטי זיקה מאפשרים לנו להוסיף מידע על אדם, מקום, חפץ או רעיון, בלי להתחיל משפט חדש. הם הופכים את הדיבור והכתיבה לטבעיים, מפורטים וזורמים יותר.
          **Ich wohne in einer Stadt, die viele Parks hat.** – אני גר בעיר שיש בה הרבה פארקים.
          **Das ist ein Ort, wo man ruhig leben kann.** – זה מקום שבו אפשר לחיות בשקט.
          **Die Menschen, die auf dem Land leben, kennen oft ihre Nachbarn besser.** – אנשים שחיים בכפר מכירים בדרך כלל טוב יותר את השכנים שלהם.
          למה משתמשים במשפטי זיקה? כדי לחבר רעיונות; כדי להימנע מחזרות; כדי להישמע טבעיים יותר; כדי לתת יותר מידע.
      - id: relativ-he-table
        type: table
        lang: he
        caption: מילות הזיקה החשובות
        header: [מילת זיקה, שימוש, דוגמה]
        rows:
          - [der / die / das, אנשים או דברים, 'Das Haus, das neu gebaut wurde.']
          - [die, רבים, 'Die Menschen, die hier wohnen.']
          - [wo, מקומות, 'Die Stadt, wo ich lebe.']
      - id: rules-meinung
        type: ruleSummary
        skill: Meinungen ausdrücken und begründen
        rules:
          - text: 'Eine gute Meinung hat drei Teile: **1.** die Meinung sagen, **2.** erklären, warum, **3.** ein Beispiel geben.'
            examples:
              - Meiner Meinung nach ist das Stadtleben besser, weil es mehr Arbeitsmöglichkeiten gibt. Ich wohne in einer Stadt, die viele Restaurants hat.
          - text: 'Nach **Meiner Meinung nach** steht das Verb direkt danach (Position 2). Nach **Ich denke, dass / Ich glaube, dass / Persönlich finde ich, dass** steht das Verb am Ende.'
            examples:
              - Meiner Meinung nach **ist** das Stadtleben besser.
              - Ich glaube, dass das Landleben ruhiger und gesünder **ist**.
          - text: '**weil** und **obwohl** schicken das Verb ans Ende. Nach **denn** und **aber** bleibt die normale Wortstellung.'
            examples:
              - Ich bevorzuge das Landleben, obwohl es weniger Dienstleistungen **gibt**.
              - Ich wohne gern in der Stadt, denn es **gibt** dort viele Cafés.
          - text: 'Nach **jedoch** (am Satzanfang) und **auf der anderen Seite** kommt sofort das Verb.'
            examples:
              - Auf der einen Seite ist die Stadt praktisch, auf der anderen Seite **ist** sie oft laut und teuer.
              - Die Stadt ist praktisch. Jedoch **ist** sie sehr teuer.
      - id: meinung-table
        type: table
        caption: Nützliche Ausdrücke und Konnektoren
        header: [Deutsch, עברית]
        rows:
          - ['Ich denke, dass …', אני חושב ש…]
          - ['Ich glaube, dass …', אני מאמין ש…]
          - [Meiner Meinung nach …, לדעתי…]
          - ['Persönlich finde ich, dass …', באופן אישי אני חושב ש…]
          - [weil, כי]
          - [denn, מפני ש]
          - [aber, אבל]
          - [jedoch, אולם]
          - [obwohl, למרות ש]
          - [auf der einen Seite … auf der anderen Seite …, מצד אחד… מצד שני…]
      - id: meinung-he
        type: text
        lang: he
        text: |-
          כאשר אנחנו מביעים דעה, כדאי: 1. לומר את דעתנו. 2. להסביר מדוע. 3. לתת דוגמה.
          **Meiner Meinung nach ist das Stadtleben besser, weil es mehr Arbeitsmöglichkeiten gibt.** – לדעתי החיים בעיר טובים יותר כי יש יותר אפשרויות עבודה.
          **Ich bevorzuge das Landleben, obwohl es weniger Dienstleistungen gibt.** – אני מעדיף את החיים בכפר למרות שיש פחות שירותים.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die Regeln mit der Gruppe. Bitte jeden Schüler um einen Satz über seinen Wohnort mit einem Relativsatz und einer begründeten Meinung.

