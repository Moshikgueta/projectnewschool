      - id: ex5-hint
        type: text
        lang: he
        text: |-
          כתבו 120–150 מילים בנושא: **„Stadtleben oder Landleben?“**
          התייחסו ל: היכן אתם גרים כיום; מה אתם אוהבים במקום שבו אתם גרים; היכן הייתם רוצים לגור בעתיד; היתרונות והחסרונות של עיר וכפר.
          השתמשו לפחות ב־5 Relativsätze וב־5 ביטויי דעה.
      - id: ex5
        type: reflection
        prompt: Stadtleben oder Landleben?
      - id: mori-title
        type: heading
        level: 3
        lang: he
        text: שיעורי בית עם מורי
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere eine Nachricht und schick sie ab. Mori stellt dir Fragen; antworte auf Deutsch.
      - id: mori-ort
        type: aiTutorPrompt
        lang: he
        title: פעילות 1 – העיר והכפר שלי
        message: >-
          היי מורי! אני לומד גרמנית ברמת B1. בבקשה שאל אותי שאלות על העיר או הכפר שבהם
          אני גר. תעודד אותי להשתמש במשפטי זיקה (Relativsätze) ובביטויי דעה. תקן את כל
          הטעויות שלי מיד, הסבר אותן בקצרה, ושאל שאלות המשך כדי שאענה במשפטים מלאים.
      - id: mori-vergleich
        type: aiTutorPrompt
        lang: he
        title: פעילות 2 – השוואה בין עיר לכפר
        message: >-
          היי מורי! בבקשה עזור לי להשוות בין החיים בעיר לחיים בכפר. שאל אותי שאלות על
          תחבורה, קהילה, טבע, איכות חיים, רעש וצפיפות אוכלוסין. תגרום לי להשתמש
          ב־Relativsätze ובביטויי דעה. תקן את כל הטעויות שלי ועזור לי להרחיב את התשובות.
      - id: mori-experte
        type: aiTutorPrompt
        lang: he
        title: פעילות 3 – מומחה לאיכות חיים
        message: >-
          היי מורי! תעמיד פנים שאני מומחה לאיכות חיים. שאל אותי שאלות על ערים, כפרים,
          קהילות, טבע והתחדשות עירונית. תעודד אותי להשתמש במשפטי זיקה ובביטויי דעה
          מתקדמים. תקן כל טעות ושאל שאלות מאתגרות ברמת B1.
      - id: mori-ideal
        type: aiTutorPrompt
        lang: he
        title: פעילות 4 – העיר האידיאלית שלי
        message: >-
          היי מורי! אני רוצה לתאר את העיר או הכפר האידיאליים עבורי. שאל אותי שאלות על
          דיור, תחבורה, קהילה, טבע ומקומות בילוי. תוודא שאני משתמש במשפטי זיקה ובביטויי
          דעה. תקן את הטעויות שלי ועזור לי לדבר בצורה טבעית יותר.
      - id: mori-debatte
        type: aiTutorPrompt
        lang: he
        title: פעילות 5 – דיון – עיר או כפר?
        message: >-
          היי מורי! בוא נעשה דיון על השאלה: "איפה איכות החיים טובה יותר - בעיר או
          בכפר?". תציג טיעונים בעד ונגד. תעודד אותי להשתמש במשפטי זיקה, בביטויי דעה
          ובדוגמאות אישיות. תקן את כל הטעויות שלי ועזור לי להביע את דעתי בצורה משכנעת
          יותר.
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          **Relativsatz:** Komma + *der / die / das / wo* … Verb am Ende. **Meinung:** Meinung + Grund (*weil*) + Beispiel.
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**
    teacherNotes:
      - id: n-key1
        anchor: ex1
        text: 'Lösungen Übung 1: 1. die 2. das 3. die 4. das 5. wo (auch richtig: an dem).'
      - id: n-key2
        anchor: ex2
        text: >-
          Lösungen Übung 2: 1. Das ist eine Stadt, die viele Restaurants hat. 2. Ich kenne
          einen Mann, der auf dem Land lebt. 3. Das ist ein Dorf, wo es viele Grünflächen
          gibt. (auch: in dem es …) 4. Ich habe ein Haus gesehen, das sehr modern war. 5.
          Das ist ein Viertel, wo viele Familien wohnen. (auch: in dem viele Familien
          wohnen.)
      - id: n-key3
        anchor: ex3
        text: >-
          Beispiellösungen Übung 3: 1. … weil es mehr Möglichkeiten gibt. 2. … ruhiger und
          gesünder ist. 3. … dass beide Lebensformen Vorteile haben. 4. … auf der anderen
          Seite ist sie oft laut und teuer. 5. Ich bevorzuge das Stadtleben, weil ich
          Kultur und Restaurants mag. Achte auf die Wortstellung: Verb am Ende nach
          *weil / dass*, Verb direkt nach *auf der anderen Seite*.
      - id: n-key4
        anchor: ex4
        text: |-
          Beispielantworten Übung 4:
          1. Ich würde lieber in einer Stadt leben. Dort gibt es mehr Arbeitsmöglichkeiten und mehr kulturelle Angebote. Außerdem finde ich es praktisch, wenn alles in der Nähe ist.
          2. Das Stadtleben hat viele Vorteile. Es gibt viele Restaurants, Geschäfte, Schulen und Universitäten. Außerdem kann man viele interessante Menschen kennenlernen.
          3. Das Landleben ist oft ruhiger und entspannter. Man hat mehr Natur und weniger Verkehr. Für Familien kann das sehr angenehm sein.
          4. Ja, ich mag ein Viertel, das viele Cafés und Parks hat. Dort kann man gut spazieren gehen. Der Ort ist ruhig, aber nicht langweilig.
          5. Lebensqualität bedeutet für mich, gesund und sicher zu leben. Wichtig sind auch gute Beziehungen, Freizeit und Natur. Außerdem brauche ich einen Ort, an dem ich mich wohlfühle.
      - id: n-key5
        anchor: ex5
        text: |-
          Beispieltext Übung 5:
          Heute wohne ich in einer Stadt, die viele Möglichkeiten bietet. Ich mag mein Viertel, das ruhig und grün ist. Es gibt einen Park, den ich oft besuche, und viele Cafés, die ich sehr angenehm finde. Meiner Meinung nach ist das Stadtleben praktisch, weil man alles in der Nähe hat. Ich glaube, dass die Stadt besonders gut für Arbeit und Studium ist. Auf der anderen Seite ist sie manchmal laut und teuer.
          Das Landleben, das ruhiger und natürlicher ist, hat auch viele Vorteile. Persönlich finde ich, dass man dort entspannter leben kann. In Zukunft möchte ich vielleicht an einem Ort wohnen, der Natur und Stadt verbindet. Ich bevorzuge im Moment die Stadt, weil ich Kultur, Restaurants und gute Verkehrsmittel brauche. Meiner Ansicht nach hängt die beste Wahl vom Lebensstil ab.

