      - id: ex3
        type: discussionQuestions
        items:
          - question: Meiner Meinung nach ist das Stadtleben besser, weil ___.
          - question: Ich glaube, dass das Landleben ___.
          - question: Persönlich finde ich, dass ___.
          - question: Auf der einen Seite ist die Stadt praktisch, auf der anderen Seite ___.
          - question: Ich bevorzuge ___, weil ___.
      - id: ex4-title
        type: heading
        level: 4
        lang: he
        text: תרגיל 4 – שאלות אישיות
      - id: ex4-hint
        type: text
        lang: he
        text: ענו ב־3–4 משפטים מלאים.
      - id: ex4
        type: discussionQuestions
        items:
          - question: Würdest du lieber in einer Stadt oder auf dem Land leben?
          - question: Welche Vorteile hat das Stadtleben?
          - question: Welche Vorteile hat das Landleben?
          - question: Gibt es einen Ort, den du besonders magst?
          - question: Was bedeutet Lebensqualität für dich?
      - id: ex5-title
