vocabulary:
  - slug: stadtleben-vs-landleben
    title: Stadtleben vs. Landleben
    items: *stadtleben-vs-landleben-words

activities:
  - slug: stadtleben-vs-landleben-relativsaetze
    title: Relativsätze
    minutes: 8
    items:
      - id: stadt-die
        type: multipleChoice
        prompt: Ich wohne in einer Stadt, ___ viele Parks hat.
        options:
          - { text: die, correct: true }
          - {
              text: der,
              feedback: '*die Stadt* ist feminin. Das Relativpronomen hat das Genus des Nomens: *die*.',
            }
          - {
              text: das,
              feedback: '*das* ist für neutrale Nomen (*das Dorf*). *die Stadt* ist feminin: *die*.',
            }
      - id: dorf-das
        type: fillBlank
        prompt: Ergänze das Relativpronomen.
        text: Das ist ein Dorf, ___ sehr ruhig ist.
        blanks: [[das, welches]]
      - id: menschen-die
        type: fillBlank
        prompt: Ergänze das Relativpronomen.
        text: Die Menschen, ___ hier leben, kennen sich gut.
        blanks: [[die, welche]]
      - id: park-den
        type: multipleChoice
        prompt: Es gibt einen Park, ___ ich oft besuche.
        options:
          - { text: den, correct: true }
          - {
              text: der,
              feedback: 'Im Relativsatz ist *ich* das Subjekt; den Park besuche ich: Akkusativ, also *den*.',
            }
          - { text: dem, feedback: '*dem* ist Dativ. *besuchen* braucht den Akkusativ: *den*.' }
      - id: verb-ende
        type: trueFalse
        prompt: 'Im Relativsatz steht das konjugierte Verb am Ende: *Das ist ein Park, der sehr groß ist.*'
        answer: true
        feedback:
          correct: 'Richtig! *…, der sehr groß **ist**.*'
          incorrect: 'Doch: Im Relativsatz steht das Verb am Ende: *…, der sehr groß **ist**.*'
      - id: satzhaelften
        type: matching
        prompt: Welcher Relativsatz passt?
        pairs:
          - ['Das ist eine Stadt,', die viele Restaurants hat.]
          - ['Ich kenne einen Mann,', der auf dem Land lebt.]
          - ['Ich habe ein Haus gesehen,', das sehr modern war.]
          - ['Ich mag die Cafés,', die in meinem Viertel sind.]
      - id: ort-wo
        type: multipleChoice
        prompt: Das ist der Ort, ___ ich aufgewachsen bin.
        options:
          - { text: wo, correct: true }
          - {
              text: der,
              feedback: '*der* wäre das Subjekt, aber das Subjekt ist *ich*. Für Orte sagen wir *wo* (oder *an dem*).',
            }
          - {
              text: den,
              feedback: '*aufwachsen* hat kein Akkusativobjekt. Für Orte sagen wir *wo* (oder *an dem*).',
            }
      - id: ordne-central-park
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz mit Relativsatz.
        sentence: Der Central Park ist ein Park, der mitten in New York liegt.

  - slug: stadtleben-vs-landleben-meinungen
    title: Meinungen ausdrücken und begründen
    minutes: 8
    items:
      - id: meinung-verb
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Meiner Meinung nach ist das Stadtleben besser., correct: true }
          - {
              text: Meiner Meinung nach das Stadtleben ist besser.,
              feedback: 'Nach *Meiner Meinung nach* kommt sofort das Verb (Position 2): *Meiner Meinung nach ist …*',
            }
          - {
              text: 'Meiner Meinung nach, das Stadtleben ist besser.',
              feedback: 'Kein Komma und das Verb direkt danach: *Meiner Meinung nach ist das Stadtleben besser.*',
            }
      - id: dass-ist
        type: fillBlank
        prompt: Ergänze das Verb *sein*.
        text: Ich glaube, dass das Landleben ruhiger und gesünder ___.
        blanks: [[ist]]
      - id: obwohl
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - {
              text: 'Ich bevorzuge das Landleben, obwohl es weniger Dienstleistungen gibt.',
              correct: true,
            }
          - {
              text: 'Ich bevorzuge das Landleben, obwohl gibt es weniger Dienstleistungen.',
              feedback: '*obwohl* schickt das Verb ans Ende: *…, obwohl es weniger Dienstleistungen gibt.*',
            }
          - {
              text: 'Ich bevorzuge das Landleben, obwohl es gibt weniger Dienstleistungen.',
              feedback: '*obwohl* schickt das Verb ans Ende: *…, obwohl es weniger Dienstleistungen gibt.*',
            }
      - id: denn-regel
        type: trueFalse
        prompt: 'Nach *denn* steht das Verb am Ende, wie nach *weil*.'
        answer: false
        feedback:
          correct: 'Genau! Nach *denn* bleibt die normale Wortstellung: *…, denn es gibt dort viele Cafés.*'
          incorrect: 'Nach *denn* bleibt die normale Wortstellung: *…, denn es gibt dort viele Cafés.* Nur nach *weil* steht das Verb am Ende.'
      - id: ausdruecke
        type: matching
        prompt: Was passt zusammen?
        pairs:
          - [weil, כי]
          - [obwohl, למרות ש]
          - [aber, אבל]
          - [Meiner Meinung nach, לדעתי]
          - [auf der einen Seite … auf der anderen Seite, מצד אחד… מצד שני]
      - id: andere-seite
        type: fillBlank
        prompt: Ergänze das Verb *sein*.
        text: Auf der einen Seite ist die Stadt praktisch, auf der anderen Seite ___ sie oft laut und teuer.
        blanks: [[ist]]
      - id: weil-denn
        type: multipleChoice
        prompt: Ich wohne gern in der Stadt, ___ es dort viele Arbeitsmöglichkeiten gibt.
        options:
          - { text: weil, correct: true }
          - {
              text: denn,
              feedback: 'Nach *denn* steht das Verb nicht am Ende: *denn es gibt dort …*. Hier steht *gibt* am Ende, also *weil*.',
            }
          - {
              text: obwohl,
              feedback: '*obwohl* zeigt einen Gegensatz. Hier geben wir einen Grund: *weil*.',
            }
      - id: ordne-dass
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz.
        sentence: Ich denke, dass das Landleben gesünder ist.
