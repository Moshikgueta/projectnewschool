vocabulary:
  - slug: gesundheit
    title: Gesundheit
    items: *gesundheit-words

activities:
  - slug: gesundheit-frueher
    title: Früher und heute
    minutes: 8
    items:
      - id: habe-getrunken
        type: multipleChoice
        prompt: Früher ___ ich jeden Tag Cola getrunken.
        options:
          - { text: habe, correct: true }
          - {
              text: bin,
              feedback: '*trinken* ist kein Verb der Bewegung: Das Perfekt bilden wir mit *haben*: *Ich habe getrunken.*',
            }
          - {
              text: hatte,
              feedback: 'Das Perfekt ist *haben* im Präsens + Partizip II: *Früher habe ich … getrunken.*',
            }
      - id: war-sportlicher
        type: fillBlank
        prompt: Ergänze *sein* im Präteritum.
        text: Früher ___ ich sportlicher.
        blanks: [[war]]
      - id: spielte
        type: fillBlank
        prompt: Ergänze *spielen* im Präteritum.
        text: Als Kind ___ ich oft Fußball.
        blanks: [[spielte]]
      - id: war-hatte
        type: trueFalse
        prompt: 'Bei *sein* und *haben* benutzen wir für die Vergangenheit meistens *war* und *hatte*, auch im Gespräch.'
        answer: true
        feedback:
          correct: 'Richtig! *Früher war ich sportlicher. Ich hatte mehr Freizeit.*'
          incorrect: 'Doch: Bei *sein* und *haben* sagen wir meistens *war* und *hatte*: *Früher war ich sportlicher.*'
      - id: praeteritum-formen
        type: matching
        prompt: Welche Präteritumform (ich) passt zu welchem Verb?
        pairs:
          - [sein, war]
          - [haben, hatte]
          - [können, konnte]
          - [müssen, musste]
          - [spielen, spielte]
      - id: heute-praesens
        type: multipleChoice
        prompt: Früher habe ich nie Sport gemacht, heute ___ ich dreimal pro Woche.
        options:
          - { text: trainiere, correct: true }
          - {
              text: habe trainiert,
              feedback: 'Mit *heute* sprechen wir über die Gegenwart: Wir benutzen das Präsens: *heute trainiere ich*.',
            }
          - {
              text: trainierte,
              feedback: '*trainierte* ist Präteritum (Vergangenheit). Für *heute* brauchen wir das Präsens: *trainiere*.',
            }
      - id: ordne-frueher
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Satz.
        sentence: Früher habe ich viel Fast Food gegessen.
      - id: hatte-freizeit
        type: fillBlank
        prompt: Ergänze *haben* im Präteritum.
        text: Früher ___ ich mehr Freizeit.
        blanks: [[hatte]]

  - slug: gesundheit-modalverben
    title: Modalverben
    minutes: 8
    items:
      - id: rat-solltest
        type: multipleChoice
        prompt: 'Ein Rat: Du ___ mehr schlafen.'
        options:
          - { text: solltest, correct: true }
          - {
              text: darfst,
              feedback: '*dürfen* bedeutet Erlaubnis. Für einen Rat benutzen wir *sollte*: *Du solltest mehr schlafen.*',
            }
          - {
              text: kannst,
              feedback: '*können* bedeutet Fähigkeit oder Möglichkeit. Für einen Rat benutzen wir *sollte*: *Du solltest …*',
            }
      - id: verbot-darf
        type: fillBlank
        prompt: 'Ein Verbot: Ergänze *dürfen*.'
        text: Man ___ im Krankenhaus nicht rauchen.
        blanks: [[darf]]
      - id: wortstellung
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Ich muss mehr Wasser trinken., correct: true }
          - {
              text: Ich muss trinken mehr Wasser.,
              feedback: 'Das zweite Verb steht im Infinitiv am Satzende: *Ich muss mehr Wasser trinken.*',
            }
          - {
              text: Ich mehr Wasser trinken muss.,
              feedback: 'Im Hauptsatz steht das Modalverb auf Position 2: *Ich muss mehr Wasser trinken.*',
            }
      - id: nicht-muessen
        type: trueFalse
        prompt: '*Du musst nicht rauchen.* bedeutet: Rauchen ist verboten.'
        answer: false
        feedback:
          correct: 'Genau! *nicht müssen* = nicht nötig. Ein Verbot ist *nicht dürfen*: *Du darfst nicht rauchen.*'
          incorrect: '*nicht müssen* bedeutet „nicht nötig“. Ein Verbot ist *nicht dürfen*: *Du darfst nicht rauchen.*'
      - id: bedeutung
        type: matching
        prompt: Was drückt das Modalverb aus?
        pairs:
          - [Du solltest mehr schlafen., ein Rat]
          - [Du musst zum Arzt gehen., eine Pflicht]
          - [Hier darf man Sport machen., eine Erlaubnis]
          - [Ich kann schwimmen., eine Fähigkeit]
          - [Du könntest Yoga ausprobieren., ein höflicher Vorschlag]
      - id: koenntest
        type: fillBlank
        prompt: 'Ein höflicher Vorschlag: Ergänze *können* im Konjunktiv II.'
        text: Du ___ Yoga ausprobieren.
        blanks: [[könntest]]
      - id: ordne-arzt
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Ratschlag.
        sentence: Vielleicht solltest du mit einem Arzt sprechen.
      - id: pflicht-muessen
        type: fillBlank
        prompt: 'Eine Pflicht: Ergänze *müssen*.'
        text: Patienten ___ die Medikamente regelmäßig nehmen.
        blanks: [[müssen]]
