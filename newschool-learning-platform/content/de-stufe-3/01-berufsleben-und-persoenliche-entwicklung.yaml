# Cycle "Berufsleben und persönliche Entwicklung", converted from the German level 3
# digital notebook ("German Level 3- Digital Notebook", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (German).
course: de-stufe-3
slug: berufsleben-und-persoenliche-entwicklung
title: Berufsleben und persönliche Entwicklung
goal: Über das Berufsleben in Vergangenheit, Gegenwart und Zukunft sprechen und hypothetische Situationen mit dem Konjunktiv II ausdrücken.
position: 1
status: published

review:
  - >-
    The two workbook exercises ("Vergangenheit, Gegenwart und Zukunft verbinden" and
    "Konjunktiv II") are NEW: the notebook has no self-correcting exercises. They were
    written from the cycle's summary rules, the classic homework, the activity examples
    and the vocabulary. Please check level, wording and every right answer before
    students see them.
  - >-
    The notebook lists five language goals (past / present / future, describing work
    experience, giving reasons, Konjunktiv II, longer conversations). The cycle
    overview keeps two skills: "Vergangenheit, Gegenwart und Zukunft verbinden" and
    "Konjunktiv II"; opinions and reasons are practised in Activity 6 and kept in the
    summary.
  - >-
    Corrections: warm-up "Wie findest du eine gute Work-Life-Balance?" (calque of "How
    do you find…", in German it asks for an opinion) → "Wie schaffst du eine gute
    Work-Life-Balance?"; Activity 3 "Arbeit zu zweit" → "Arbeitet zu zweit";
    "Klassensurvey" (English word) → "Klassenumfrage"; the English heading "Teacher
    Note" became a German teacher note; stray "**" / "\*\*" marks around the warm-up
    questions, Activity 2 and the Activity 6 heading were removed.
  - >-
    Summary (Hebrew, kept): the example "Wir müssten weniger Stress haben." (= "we
    would have to have less stress", odd) → "Wir müssten weniger arbeiten."; the
    opinion phrase "Ich glaube, dass… – אני חושב ש…" → "אני חושב/ת / מאמין/ה ש…" so it
    differs from "Ich finde, dass…". ADDED (please confirm): the word-order rule for
    wenn-sentences (verb at the end of the wenn-clause, then the verb at the start of
    the main clause: "Wenn ich mehr Zeit hätte, würde ich…"), the rule that after
    "Früher / Heute / In Zukunft / Meiner Meinung nach" the verb is in position 2, and
    that "dass" sends the verb to the end. A tenses table and a "Falsch / Richtig"
    table were built from the summary's lists.
  - >-
    Classic homework: kept in the homework section (Hebrew instructions as in the
    source), with the answer key ONLY in a teacher note. Fixes: Part A is headed
    "Perfekt", but item 4 ("Früher ___ ich sehr schüchtern" → war) is Präteritum, so
    the heading is now "Perfekt und Präteritum"; in Part B items 1 and 4 the hint in
    brackets was the answer itself "(würde)" → "(werden)". All other key answers were
    checked and are correct; key 2 of Part C also accepts "von zu Hause" without "aus".
  - >-
    The Hebrew reminders under the Mori tasks ("אל תשכחו", "נסו לדבר על") and the
    "B1 challenge" are kept in Hebrew as callouts; the Mori messages stay in German as
    in the source. The "דיבור ברמת B1" and "מטרה ברמת B1" lists are kept as Hebrew
    callouts in the summary.
  - >-
    Left out: the "Datum / Teilnehmer" lines and the "Antwort von Schüler 1/2/3" lines
    (the platform has answer boxes). The Quizlet link lost its "?new" parameter.
  - >-
    Times: introduction max. 5 minutes; Activity 2 presentation max. 1.5 minutes per
    person; Activity 4 4 minutes per round; Activity 5 presentation 1.5–2 minutes per
    person (recorded as 2 in a note). The activities have no total times; the source
    says to choose 2–3 activities per lesson (plan note).
  - >-
    Vocabulary: "die Erfahrung sammeln" → "Erfahrungen sammeln" (no article in the
    collocation). The Hebrew headings of the table were dropped. Please confirm the
    glosses; no other changes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: berufsleben-und-persoenliche-entwicklung-unterricht
    title: 'Unterricht: Berufsleben und persönliche Entwicklung'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Berufsleben und persönliche Entwicklung
      - id: skills
        type: cycleOverview
        skills:
          - name: Vergangenheit, Gegenwart und Zukunft verbinden
            description: '*Früher habe ich … gearbeitet. Heute arbeite ich … In Zukunft möchte ich / werde ich …*'
          - name: Konjunktiv II
            description: 'Hypothetische Situationen und Wünsche: *Wenn ich mehr Zeit hätte, würde ich mehr reisen.*'
      - id: quizlet
        type: externalLink
        label: Berufsleben und persönliche Entwicklung auf Quizlet
        url: https://quizlet.com/br/1181610333/berufsleben-und-personliche-entwicklung-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Einführungsrunde
      - id: intro
        type: sentenceFrame
        frame: Ich heiße ___. Als ich ein Kind war, wollte ich ___ werden, und heute bin ich ___.
        example: Ich heiße Anna. Als ich klein war, wollte ich Tierärztin werden, und heute arbeite ich als Lehrerin.
      - id: warmup-title
        type: heading
        level: 3
        text: Aufwärmfragen
      - id: warmup-hint
        type: callout
        tone: info
        text: Antworte in **ganzen Sätzen** und erkläre, **warum**.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Was machst du normalerweise bei der Arbeit oder im Studium?
            frame: Normalerweise ___.
          - question: 'Was ist dir wichtiger: Geld oder persönliches Interesse? Warum?'
            frame: Mir ist ___ wichtiger, weil ___.
          - question: Gefällt dir dein Beruf oder dein Studium? Warum?
            frame: Mein Beruf / Mein Studium gefällt mir (nicht), weil ___.
          - question: Was machst du in deiner Freizeit, um dich zu entspannen?
            frame: Um mich zu entspannen, ___.
          - question: Wie schaffst du eine gute Work-Life-Balance?
            frame: Ich schaffe eine gute Work-Life-Balance, indem ich ___.
          - question: Hattest du schon einmal eine schwierige Situation bei der Arbeit oder in der Schule? Wie hast du das Problem gelöst?
            frame: Einmal hatte ich ___. Ich habe das Problem gelöst, indem ich ___.
          - question: Wenn du jeden Beruf wählen könntest, welchen Beruf würdest du wählen?
            frame: Wenn ich jeden Beruf wählen könnte, würde ich ___ wählen, weil ___.
          - question: Würdest du gerne den Job deines Chefs haben? Warum oder warum nicht?
            frame: Ich würde den Job meines Chefs (nicht) gern haben, weil ___.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Bewerbungsgespräch'
        skills: [Vergangenheit, Gegenwart und Zukunft verbinden]
        steps:
          - 'Arbeitet zu zweit: Schüler A ist der Interviewer, Schüler B ist der Bewerber. Wählt einen Beruf oder eine Position.'
          - '**Interview:** Der Interviewer wählt Fragen aus der Liste unten und kann eine Zusatzfrage stellen. Der Bewerber antwortet in der Vergangenheit, Gegenwart und Zukunft und benutzt Berufswortschatz.'
          - Tauscht die Rollen.
          - 'Gebt euch positives Feedback: *Du hast sehr klar gesprochen. Deine Beispiele waren interessant. Du hast einen guten Wortschatz benutzt.*'
        example: |-
          *A: Warum haben Sie diesen Beruf gewählt?*
          *B: Ich habe diesen Beruf gewählt, weil ich gern mit Menschen arbeite. In Zukunft möchte ich ein Team leiten.*
      - id: act1-questions
        type: discussionQuestions
        title: Fragenliste
        items:
          - question: Erzählen Sie etwas über Ihren Beruf oder Ihr Studium.
            frame: Ich arbeite als ___. / Ich studiere ___.
          - question: Warum haben Sie diesen Beruf gewählt?
            frame: Ich habe diesen Beruf gewählt, weil ___.
          - question: Welche Fähigkeit haben Sie in einem früheren Job gelernt?
            frame: In meinem früheren Job habe ich ___ gelernt.
          - question: Was können Sie besonders gut?
            frame: Ich kann besonders gut ___.
          - question: Was möchten Sie in Zukunft verbessern?
            frame: In Zukunft möchte ich ___ verbessern.
          - question: Welche Eigenschaften helfen Ihnen in diesem Beruf?
            frame: Mir hilft, dass ich ___ bin.
          - question: Was würde Ihr früherer Chef über Sie sagen?
            frame: Mein früherer Chef würde sagen, dass ich ___ bin.
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Meine berufliche Inspiration'
        skills: [Vergangenheit, Gegenwart und Zukunft verbinden]
        steps:
          - 'Wähle etwas, das dich motiviert: ein Zitat, eine Person, eine Erfahrung oder ein Bild.'
          - 'Mach kurze Notizen: *Was inspiriert mich? Warum gefällt es mir? Wie hilft es mir?* Schreib einfache Stichpunkte, keine ganzen Sätze, und schlag schwierige Wörter nach.'
          - 'Präsentiere deine Inspiration (max. 1,5 Minuten). Struktur: **Vergangenheit** (*Früher …*), **Gegenwart** (*Heute …*), **Zukunft** (*In Zukunft möchte ich …*).'
          - Die Gruppe stellt danach eine Frage.
        example: |-
          *Ein Zitat, das mich motiviert, ist: „Wer nicht wagt, der nicht gewinnt.“*
          *Früher hatte ich Angst vor Veränderungen. Heute probiere ich gern neue Dinge aus. In Zukunft möchte ich mutiger sein.*
      - id: act2-frames
        type: discussionQuestions
        title: Meine Notizen
        items:
          - question: Was inspiriert dich?
            frame: Mich inspiriert ___.
          - question: Vergangenheit
            frame: Früher ___.
          - question: Gegenwart
            frame: Heute ___.
          - question: Zukunft
            frame: In Zukunft möchte ich ___.
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Der ideale Beruf'
        skills: [Konjunktiv II]
        steps:
          - 'Arbeitet zu zweit. Sprecht über euren **Traumjob**, euren **idealen Chef** und **ideale Arbeitsbedingungen**. Benutzt den Konjunktiv II.'
          - Tauscht die Rollen.
          - '**Klassenumfrage:** Jeder Schüler sagt einen Satz im Konjunktiv II. Die anderen reagieren.'
        example: |-
          *Wenn ich mehr Freizeit hätte, würde ich mehr reisen.*
          *Wenn mein Chef freundlicher wäre, wäre die Arbeit einfacher.*
      - id: act3-info
        type: callout
        tone: info
        title: Der Konjunktiv II
        text: Wir benutzen den Konjunktiv II für **hypothetische Situationen**, **unrealistische Wünsche** und **Träume**.
      - id: act3-frames
        type: discussionQuestions
        title: Mögliche Satzanfänge
        items:
          - question: Dein Traumjob
            frame: Wenn ich meinen Traumjob hätte, würde ich ___.
          - question: Weniger Arbeit
            frame: Wenn ich weniger arbeiten müsste, würde ich ___.
          - question: Dein idealer Chef
            frame: Wenn mein Chef organisierter wäre, ___.
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Speed Networking'
        skills: [Vergangenheit, Gegenwart und Zukunft verbinden]
        steps:
          - 'Bereite eine kurze professionelle Vorstellung vor: Name, Beruf / Studium, tägliche Aufgaben, Zukunftspläne.'
          - Networking-Runden in Paaren, 4 Minuten pro Runde.
          - 'Wechsle den Partner. Optional: Erzähl auch eine interessante Erfahrung.'
          - 'Schreib zum Schluss ein kurzes Feedback: *Die interessanteste Person war ___, weil ___.*'
        example: |-
          *Ich heiße Lukas und arbeite als Designer.*
          *Ich arbeite oft mit kleinen Teams.*
          *In Zukunft möchte ich meine eigene Firma gründen.*
      - id: act4-frames
        type: discussionQuestions
        title: Meine Vorstellung
        items:
          - question: Name und Beruf / Studium
            frame: Ich heiße ___ und arbeite als ___. / … und studiere ___.
          - question: Tägliche Aufgaben
            frame: Jeden Tag ___.
          - question: Zukunftspläne
            frame: In Zukunft möchte ich ___.
          - question: Feedback
            frame: Die interessanteste Person war ___, weil ___.
      - id: act5
        type: classActivity
        title: 'Aktivität 5: Meine berufliche Zeitleiste'
        skills: [Vergangenheit, Gegenwart und Zukunft verbinden]
        steps:
          - 'Schreib kurze Notizen zu deiner **Vergangenheit** (mein erster Job, was wollte ich früher machen?), deiner **Gegenwart** (mein Beruf heute, mein Studium) und deiner **Zukunft** (Karriereziele, Zukunftspläne).'
          - Präsentiere deine Zeitleiste (1,5–2 Minuten). Nach jeder Präsentation stellt die Gruppe eine Frage.
          - '**Diskussion:** Was hatten die Präsentationen gemeinsam? Was war schwierig? Haben frühere Erfahrungen Einfluss auf unsere Zukunft?'
        example: '*Mein erster Job war in einem Café. Früher wollte ich Pilot werden. Heute arbeite ich als Ingenieurin. Nächstes Jahr mache ich eine Weiterbildung, und in Zukunft möchte ich ein Team leiten.*'
      - id: act5-frames
        type: discussionQuestions
        title: Meine Zeitleiste
        items:
          - question: Vergangenheit
            frame: Mein erster Job war ___. Früher wollte ich ___.
          - question: Gegenwart
            frame: Heute arbeite ich als ___. / Im Moment studiere ich ___.
          - question: Zukunft
            frame: In Zukunft möchte ich ___. / Nächstes Jahr ___.
      - id: act6
        type: classActivity
        title: 'Aktivität 6: Debatte: 4-Tage-Woche'
        skills: [Konjunktiv II]
        steps:
          - Lest als Klasse den Text unten und diskutiert die Fragen.
          - '**Gruppenarbeit:** Gruppe A ist für die 4-Tage-Woche, Gruppe B für die 5-Tage-Woche. Bereitet 4–5 starke Argumente vor und überlegt auch Antworten auf die Argumente der anderen Gruppe. Benutzt den Konjunktiv II.'
          - '**Debatte:** Gruppe A gibt ein Argument, Gruppe B antwortet. Dann gibt Gruppe B ein Argument, Gruppe A antwortet.'
          - 'Begründet eure Meinungen, reagiert auf andere Argumente, benutzt den Konjunktiv II und sprecht in vollständigen Sätzen.'
        example: |-
          *Wenn Menschen weniger arbeiten würden, hätten sie weniger Stress.*
          *Wenn Firmen nur vier Tage arbeiten würden, könnten die Mitarbeiter motivierter sein.*
          *Wenn die Arbeitswoche länger wäre, hätten manche Unternehmen bessere Ergebnisse.*
      - id: act6-text
        type: text
        text: >-
          In den letzten Jahren haben einige Unternehmen beschlossen, die Arbeitswoche von
          fünf auf vier Tage zu verkürzen, ohne die Gehälter der Mitarbeiter zu
          reduzieren. Befürworter dieses Modells argumentieren, dass eine 4-Tage-Woche die
          Work-Life-Balance verbessern, Stress reduzieren und sogar die Produktivität
          erhöhen kann, weil die Mitarbeiter motivierter und konzentrierter sind. Kritiker
          glauben jedoch, dass weniger Arbeitstage Druck erzeugen könnten, die gleiche
          Menge an Arbeit in kürzerer Zeit zu erledigen, und dass dieses Modell nicht für
          alle Branchen geeignet ist. Deshalb gibt es weiterhin eine Debatte darüber, ob
          eine 4-Tage- oder 5-Tage-Woche besser für Arbeitnehmer und Arbeitgeber ist.
      - id: act6-questions
        type: discussionQuestions
        title: Fragen zum Text
        items:
          - question: Kennst du Unternehmen mit einer 4-Tage-Woche?
            frame: Ja, ich kenne ___. / Nein, ich kenne keine.
          - question: Würdest du gerne nur 4 Tage pro Woche arbeiten?
            frame: Ich würde (nicht) gern nur 4 Tage arbeiten, weil ___.
          - question: Glaubst du, dass Menschen produktiver wären?
            frame: Ich glaube (nicht), dass Menschen produktiver wären, weil ___.
      - id: act6-groups
        type: table
        caption: Die zwei Gruppen
        header: [Gruppe, Position]
        rows:
          - [Gruppe A, Die Arbeitswoche sollte 4 Tage haben.]
          - [Gruppe B, Die Arbeitswoche sollte 5 Tage haben.]
      - id: act6-arguments
        type: discussionQuestions
        title: Unsere Argumente
        items:
          - question: Argument 1
            frame: Wenn ___, würde / hätte / wäre ___.
          - question: Argument 2
            frame: Meiner Meinung nach ___, weil ___.
          - question: Antwort auf ein Argument der anderen Gruppe
            frame: Einerseits ___, andererseits ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: **Vergangenheit, Gegenwart und Zukunft
          verbinden** (Aktivitäten 1, 2, 4 und 5) und **Konjunktiv II** (Aktivitäten 3
          und 6). Wähle **2–3 Aktivitäten** je nach Zeit und Gruppe; die Aktivitäten sind
          unabhängig und müssen nicht alle in einer Stunde gemacht werden. Sprachliche
          Ziele laut Heft: über Vergangenheit, Gegenwart und Zukunft sprechen, berufliche
          Erfahrungen beschreiben, Meinungen begründen, hypothetische Situationen mit dem
          Konjunktiv II ausdrücken, längere Gespräche führen.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: Maximal 5 Minuten. Gib zuerst dein eigenes Beispiel.
      - id: n-warmup
        anchor: warmup
        text: Wähle 5–8 Fragen aus. Die Schüler antworten in ganzen Sätzen.
      - id: n-act1
        anchor: act1
        text: >-
          Sprachfokus: Vergangenheit, Gegenwart, Zukunft und Berufswortschatz. Achte auf
          die Sie-Form im Interview und auf das positive Feedback am Ende.
      - id: n-act2
        anchor: act2
        text: >-
          Sprachfokus: narrative Zeiten. Jede Präsentation dauert höchstens 1,5 Minuten.
          Die Notizen sind nur Stichpunkte, damit die Schüler frei sprechen.
      - id: n-act3
        anchor: act3
        text: Erkläre kurz die Verwendung des Konjunktivs II mit den zwei Beispielen. In der Klassenumfrage reagieren die anderen mit *Ich auch! / Ich nicht, weil …*
      - id: n-act4
        anchor: act4
        minutes: 4
        text: 'Sprachfokus: sich professionell vorstellen. 4 Minuten pro Runde; dann Partner wechseln. Das Feedback am Ende ist schriftlich.'
      - id: n-act5
        anchor: act5
        minutes: 2
        text: 'Sprachfokus: Vergangenheit, Gegenwart und Zukunft verbinden. Präsentation 1,5–2 Minuten pro Person, danach eine Frage der Gruppe.'
      - id: n-act6
        anchor: act6
        text: >-
          Sprachfokus: Meinungen ausdrücken + Konjunktiv II. Du kannst Beispiele von
          deutschen oder internationalen Firmen mit einer 4-Tage-Woche geben. Erinnere an
          die Redemittel aus der Zusammenfassung (*Meiner Meinung nach …, Einerseits …,
          andererseits …*).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: berufsleben-und-persoenliche-entwicklung-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: rules-zeiten
        type: ruleSummary
        lang: he
        skill: Vergangenheit, Gegenwart und Zukunft verbinden
        rules:
          - text: '**עבר – Perfekt:** הזמן המרכזי בדיבור בגרמנית לתיאור חוויות, פעולות שהסתיימו וסיפורים על העבר. מבנה: **haben / sein + Partizip II**.'
            examples: [Ich habe in Berlin gearbeitet., Ich bin nach Deutschland gefahren.]
          - text: '**עבר – Präteritum:** נפוץ יותר בכתיבה, אבל גם בדיבור עם פעלים מסוימים: **war, hatte, konnte, musste**.'
            examples: [Früher war ich schüchtern., Ich hatte viel Stress.]
          - text: '**הווה – Präsens:** משמש לשגרה, לעובדות, לעבודה וללימודים כיום ולתכניות עתידיות פשוטות.'
            examples:
              [
                Ich arbeite in einer Sprachschule.,
                Ich lerne Deutsch.,
                Nächstes Jahr reise ich nach Berlin.,
              ]
          - text: '**עתיד – Futur I:** מבנה: **werden + Infinitiv** (ה־Infinitiv בסוף המשפט).'
            examples: [Ich werde in Deutschland arbeiten.]
          - text: 'בגרמנית הרבה פעמים משתמשים פשוט ב־**Präsens** עם ביטוי זמן:'
            examples: [Morgen arbeite ich von zu Hause., Nächstes Jahr studiere ich in Berlin.]
          - text: '**חיבור בין זמנים:** כדי ליצור תשובה טבעית ומתקדמת יותר. אחרי ביטוי הזמן בתחילת המשפט, הפועל במקום השני.'
            examples:
              - 'עבר: Früher… / Als ich jünger war… / Vor einigen Jahren…'
              - 'הווה: Heute… / Jetzt… / Im Moment…'
              - 'עתיד: In Zukunft… / Später… / Nächstes Jahr…'
              - Früher **habe** ich in Berlin gearbeitet. Heute **arbeite** ich von zu Hause.
      - id: tenses-table
        type: table
        caption: Die Zeiten im Überblick
        header: [Zeit, Form, Beispiel]
        rows:
          - [Perfekt, haben / sein + Partizip II, Ich habe in Berlin gearbeitet.]
          - [Präteritum, 'war, hatte, konnte, musste', Früher war ich schüchtern.]
          - [Präsens, Verb in Position 2, Ich lerne Deutsch.]
          - [Futur I, werden + Infinitiv, Ich werde in Deutschland arbeiten.]
      - id: rules-konjunktiv
        type: ruleSummary
        lang: he
        skill: Konjunktiv II
        rules:
          - text: 'ה־**Konjunktiv II** משמש למצבים דמיוניים, לחלומות, לעצות, למצבים לא ריאליים ולנימוס.'
          - text: 'מבנה נפוץ: **Wenn + Konjunktiv II → würde + Infinitiv**.'
            examples:
              - 'Wenn ich mehr Zeit hätte, würde ich mehr reisen.'
              - 'Wenn ich reich wäre, würde ich ein Haus kaufen.'
          - text: '**סדר המילים:** במשפט עם wenn הפועל בא בסוף (… hätte,); אחרי הפסיק המשפט הראשי מתחיל בפועל (würde ich…), וה־Infinitiv בסוף.'
            examples:
              - 'Wenn mein Chef netter **wäre**, **wäre** die Arbeit einfacher.'
          - text: 'פעלים חשובים: **haben → hätte, sein → wäre, können → könnte, müssen → müsste, werden → würde**.'
            examples:
              [
                Ich wäre gern Chef.,
                Ich könnte in Deutschland arbeiten.,
                Wir müssten weniger arbeiten.,
              ]
      - id: konjunktiv-table
        type: table
        caption: Wichtige Verben im Konjunktiv II
        header: [Infinitiv, Konjunktiv II]
        rows:
          - [haben, hätte]
          - [sein, wäre]
          - [können, könnte]
          - [müssen, müsste]
          - [werden, würde]
      - id: opinion-table
        type: table
        caption: Nützliche Ausdrücke für die Meinung
        header: [Deutsch, עברית]
        rows:
          - [Meiner Meinung nach…, לדעתי…]
          - ['Ich glaube, dass…', אני חושב/ת / מאמין/ה ש…]
          - ['Ich finde, dass…', אני חושב/ת ש…]
          - ['Einerseits…, andererseits…', 'מצד אחד…, מצד שני…']
          - [Zum Beispiel…, למשל…]
      - id: opinion-rule
        type: callout
        tone: info
        lang: he
        title: סדר המילים
        text: 'אחרי **Meiner Meinung nach** הפועל במקום השני: *Meiner Meinung nach **ist** die Work-Life-Balance sehr wichtig.* אחרי **dass** הפועל בסוף: *Ich glaube, dass die Work-Life-Balance sehr wichtig **ist**.*'
      - id: mistakes-table
        type: table
        caption: Häufige Fehler
        header: [Falsch, Richtig]
        rows:
          - [
              'Wenn ich mehr Zeit habe, würde ich mehr lernen.',
              'Wenn ich mehr Zeit hätte, würde ich mehr lernen.',
            ]
          - [
              Früher arbeite ich in Berlin.,
              Früher arbeitete ich in Berlin. / Früher habe ich in Berlin gearbeitet.,
            ]
          - [Ich werde arbeite in Deutschland., Ich werde in Deutschland arbeiten.]
      - id: b1-speaking
        type: callout
        tone: tip
        lang: he
        title: דיבור ברמת B1
        text: |-
          ברמת B1 חשוב:
          - לדבר במשפטים מלאים
          - להסביר למה
          - לחבר בין עבר, הווה ועתיד
          - לתת דוגמאות
          - להגיב לאחרים
      - id: b1-goal
        type: callout
        tone: info
        lang: he
        title: מטרה ברמת B1
        text: |-
          תלמיד ברמת B1 צריך להיות מסוגל:
          - לדבר 2–3 דקות ברצף
          - לתאר חוויות
          - להסביר דעות
          - להשתתף בדיון
          - לספר סיפור פשוט
          - לדבר על מטרות ותכניות
          - להתמודד עם שיחות עבודה בסיסיות
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die zwei Fertigkeiten. Bitte jeden Schüler um einen Satz mit *Früher / Heute / In Zukunft* und einen Satz mit *Wenn ich …, würde ich …*.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: berufsleben-und-persoenliche-entwicklung-hausaufgaben
    title: Hausaufgaben
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben
      - id: classic-title
        type: heading
        level: 3
        text: Klassische Hausaufgaben
      - id: part-a
        type: discussionQuestions
        lang: he
        title: 'חלק א – Perfekt ו־Präteritum: השלימו את המשפטים עם הצורה הנכונה של הפועל.'
        items:
          - question: Ich ___ in Berlin gearbeitet. (haben)
          - question: Wir ___ nach Deutschland gefahren. (sein)
          - question: Meine Freundin ___ Medizin studiert. (haben)
          - question: Früher ___ ich sehr schüchtern. (sein)
          - question: Letztes Jahr ___ ich eine neue Stelle gefunden. (haben)
      - id: part-b
        type: discussionQuestions
        lang: he
        title: 'חלק ב – Konjunktiv II: השלימו את המשפטים.'
        items:
          - question: Wenn ich mehr Zeit hätte, ___ ich mehr Deutsch lernen. (werden)
          - question: Wenn mein Chef netter wäre, ___ die Arbeit einfacher. (sein)
          - question: Wenn ich in Deutschland wohnen würde, ___ ich jeden Tag Deutsch sprechen. (können)
          - question: Ich ___ gern weniger Stress haben. (werden)
          - question: Wenn wir eine 4-Tage-Woche hätten, ___ wir mehr Freizeit. (haben)
      - id: part-c
        type: discussionQuestions
        lang: he
        title: חלק ג – תרגמו לגרמנית.
        items:
          - question: כשהייתי ילד, רציתי להיות רופא.
          - question: היום אני עובד מהבית.
          - question: בעתיד אני רוצה לעבוד בגרמניה.
          - question: אם היה לי יותר כסף, הייתי מטייל יותר.
          - question: אני חושב שאיזון בין עבודה לחיים חשוב מאוד.
      - id: part-d-rules
        type: callout
        tone: info
        lang: he
        title: חלק ד – כתיבה
        text: |-
          כתבו פסקה קצרה של 8–10 שורות על החיים המקצועיים שלכם. נסו לכלול:
          - עבר
          - הווה
          - עתיד
          - לפחות 2 משפטים ב־Konjunktiv II
          אפשר להשתמש בביטויים: *Früher… / Heute… / In Zukunft… / Wenn ich mehr Zeit hätte…*
      - id: part-d
        type: reflection
        prompt: Mein Berufsleben – früher, heute und in Zukunft
      - id: mori-title
        type: heading
        level: 3
        text: Hausaufgaben mit Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere eine Nachricht und schick sie ab. Mori stellt dir Fragen; beantworte alle.
      - id: mori-beruf
        type: aiTutorPrompt
        title: 'Aufgabe 1: Mein berufliches Gespräch'
        message: Hallo Mori! Lass uns über mein Berufsleben sprechen. Frag mich über meine Vergangenheit, mein Leben heute und meine Zukunftspläne. Bitte korrigiere meine Grammatik und stelle Folgefragen.
      - id: mori-beruf-hint
        type: callout
        tone: info
        lang: he
        title: אל תשכחו
        text: |-
          - לענות במשפטים מלאים
          - להשתמש בעבר, הווה ועתיד
          - להסביר למה
          - לתת דוגמאות
      - id: mori-dilemma
        type: aiTutorPrompt
        title: 'Aufgabe 2: Was würdest du tun?'
        intro: '*Beispiel: Was würdest du tun, wenn dein Chef sehr unfreundlich wäre?*'
        message: Hallo Mori! Lass uns ein Spiel mit schwierigen Situationen bei der Arbeit spielen. Gib mir Arbeitsdilemmas und ich antworte mit Konjunktiv II. Bitte korrigiere meine Fehler und stelle Folgefragen.
      - id: mori-karriere
        type: aiTutorPrompt
        title: 'Aufgabe 3: Eine Karrieregeschichte'
        message: Hallo Mori! Ich möchte dir über die Karriere eines Freundes oder Familienmitglieds erzählen. Bitte hilf mir mit den Zeiten und korrigiere meine Fehler.
      - id: mori-karriere-hint
        type: callout
        tone: info
        lang: he
        title: נסו לדבר על
        text: |-
          - עבר
          - הווה
          - עתיד
          - מטרות
          - שינויים בקריירה
      - id: challenge
        type: callout
        tone: info
        lang: he
        title: אתגר B1
        text: |-
          נסו לדבר לפחות:
          - 2 דקות ברצף
          - בלי לעבור לעברית
          - עם משפטים מורכבים
          - עם Konjunktiv II לפחות 3 פעמים
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**
    teacherNotes:
      - id: n-key-a
        anchor: part-a
        text: 'Lösungen Teil A: 1. habe, 2. sind, 3. hat, 4. war (Präteritum von *sein*), 5. habe.'
      - id: n-key-b
        anchor: part-b
        text: 'Lösungen Teil B: 1. würde, 2. wäre, 3. könnte, 4. würde, 5. hätten.'
      - id: n-key-c
        anchor: part-c
        text: >-
          Lösungen Teil C: 1. Als ich ein Kind war, wollte ich Arzt werden. 2. Heute
          arbeite ich von zu Hause (aus). 3. In Zukunft möchte ich in Deutschland
          arbeiten. 4. Wenn ich mehr Geld hätte, würde ich mehr reisen. 5. Ich denke /
          glaube, dass die Work-Life-Balance sehr wichtig ist.
      - id: n-key-d
        anchor: part-d
        text: >-
          Beispieltext Teil D: Früher war ich Schüler und wusste nicht genau, was ich
          machen wollte. Später habe ich einen Beruf gefunden, der mir gefällt. Heute
          arbeite ich viel und lerne auch Deutsch. Ich möchte mich beruflich
          weiterentwickeln. In Zukunft möchte ich in Deutschland arbeiten und neue
          Erfahrungen sammeln. Wenn ich mehr Zeit hätte, würde ich jeden Tag Deutsch
          lernen. Wenn ich weniger Stress hätte, würde ich mehr reisen. Ich glaube, dass
          eine gute Work-Life-Balance sehr wichtig ist.

