vocabulary:
  - slug: berufsleben-und-persoenliche-entwicklung
    title: Berufsleben und persönliche Entwicklung
    items: *berufsleben-und-persoenliche-entwicklung-words

activities:
  - slug: berufsleben-und-persoenliche-entwicklung-zeiten
    title: Vergangenheit, Gegenwart und Zukunft verbinden
    minutes: 8
    items:
      - id: habe-gefunden
        type: multipleChoice
        prompt: Letztes Jahr ___ ich eine neue Stelle gefunden.
        options:
          - { text: habe, correct: true }
          - {
              text: bin,
              feedback: '*finden* ist kein Verb der Bewegung: Das Perfekt bilden wir mit *haben*: *Ich habe gefunden.*',
            }
          - {
              text: werde,
              feedback: '*werden* + Infinitiv ist Futur I. *Letztes Jahr* ist Vergangenheit: *Ich habe … gefunden.*',
            }
      - id: sind-gefahren
        type: fillBlank
        prompt: Ergänze *haben* oder *sein* in der richtigen Form.
        text: Wir ___ nach Deutschland gefahren.
        blanks: [[sind]]
      - id: frueher-war
        type: multipleChoice
        prompt: Früher ___ ich sehr schüchtern.
        options:
          - { text: war, correct: true }
          - {
              text: bin,
              feedback: '*bin* ist Präsens. *Früher* ist Vergangenheit, und bei *sein* benutzen wir das Präteritum: *war*.',
            }
          - {
              text: werde,
              feedback: '*werde* zeigt die Zukunft. *Früher* ist Vergangenheit: *Früher war ich schüchtern.*',
            }
      - id: frueher-arbeite
        type: trueFalse
        prompt: 'Der Satz *Früher arbeite ich in Berlin.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! *Früher* braucht die Vergangenheit: *Früher arbeitete ich in Berlin.* oder *Früher habe ich in Berlin gearbeitet.*'
          incorrect: '*arbeite* ist Präsens. Richtig ist: *Früher arbeitete ich in Berlin.* oder *Früher habe ich in Berlin gearbeitet.*'
      - id: zeiten-paare
        type: matching
        prompt: Welche Zeit passt zu welchem Satz?
        pairs:
          - [Ich habe in Berlin gearbeitet., Perfekt]
          - [Ich hatte viel Stress., Präteritum]
          - [Ich lerne Deutsch., Präsens]
          - [Ich werde in Deutschland arbeiten., Futur I]
      - id: naechstes-jahr
        type: fillBlank
        prompt: Ergänze das Verb *studieren* im Präsens.
        text: Nächstes Jahr ___ ich in Berlin.
        blanks: [[studiere]]
      - id: werde-arbeiten
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Ich werde in Deutschland arbeiten., correct: true }
          - {
              text: Ich werde arbeite in Deutschland.,
              feedback: 'Nach *werden* steht der Infinitiv, und er steht am Satzende: *Ich werde in Deutschland arbeiten.*',
            }
          - {
              text: Ich werde in Deutschland arbeite.,
              feedback: 'Am Satzende steht der Infinitiv *arbeiten*, nicht *arbeite*.',
            }
      - id: ordne-heute
        type: reorderSentence
        prompt: Ordne die Wörter. Beginne mit *Heute*; das Verb steht auf Position 2.
        sentence: Heute arbeite ich von zu Hause.

  - slug: berufsleben-und-persoenliche-entwicklung-konjunktiv
    title: Konjunktiv II
    minutes: 8
    items:
      - id: haette
        type: multipleChoice
        prompt: Wenn ich mehr Zeit ___, würde ich mehr reisen.
        options:
          - { text: hätte, correct: true }
          - {
              text: habe,
              feedback: 'Die Situation ist hypothetisch (nicht real): Wir brauchen den Konjunktiv II *hätte*.',
            }
          - {
              text: hatte,
              feedback: '*hatte* ist Präteritum (Vergangenheit). Für eine hypothetische Situation sagen wir *hätte* (mit Umlaut).',
            }
      - id: konjunktiv-formen
        type: matching
        prompt: Welche Form im Konjunktiv II passt zu welchem Verb?
        pairs:
          - [haben, hätte]
          - [sein, wäre]
          - [können, könnte]
          - [müssen, müsste]
          - [werden, würde]
      - id: waere
        type: fillBlank
        prompt: Ergänze *sein* im Konjunktiv II.
        text: Wenn mein Chef netter wäre, ___ die Arbeit einfacher.
        blanks: [[wäre]]
      - id: koennte
        type: fillBlank
        prompt: Ergänze *können* im Konjunktiv II.
        text: Wenn ich in Deutschland wohnen würde, ___ ich jeden Tag Deutsch sprechen.
        blanks: [[könnte]]
      - id: wenn-habe
        type: trueFalse
        prompt: 'Der Satz *Wenn ich mehr Zeit habe, würde ich mehr lernen.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! Beide Teile brauchen den Konjunktiv II: *Wenn ich mehr Zeit hätte, würde ich mehr lernen.*'
          incorrect: 'Im wenn-Satz brauchen wir auch den Konjunktiv II: *Wenn ich mehr Zeit hätte, würde ich mehr lernen.*'
      - id: wortstellung
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: 'Wenn ich reich wäre, würde ich ein Haus kaufen.', correct: true }
          - {
              text: 'Wenn ich wäre reich, würde ich ein Haus kaufen.',
              feedback: 'Im wenn-Satz steht das Verb am Ende: *Wenn ich reich wäre, …*',
            }
          - {
              text: 'Wenn ich reich wäre, ich würde ein Haus kaufen.',
              feedback: 'Nach dem wenn-Satz kommt zuerst das Verb: *…, würde ich ein Haus kaufen.*',
            }
      - id: haetten
        type: fillBlank
        prompt: Ergänze *haben* im Konjunktiv II.
        text: Wenn wir eine 4-Tage-Woche hätten, ___ wir mehr Freizeit.
        blanks: [[hätten]]
      - id: ordne-wuerde
        type: reorderSentence
        prompt: Ordne die Wörter zu einem Wunsch.
        sentence: Ich würde gern weniger arbeiten.
