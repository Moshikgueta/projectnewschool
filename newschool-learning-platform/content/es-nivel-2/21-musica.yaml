vocabulary:
  - slug: musica
    title: Música
    items: *musica-words

activities:
  - slug: musica-sociales
    title: 'Habilidades sociales: preguntas sobre la música'
    minutes: 8
    items:
      - id: une-respuestas
        type: matching
        prompt: Une cada pregunta con su respuesta.
        pairs:
          - [¿Qué música escuchas hoy?, Escucho reguetón.]
          - [¿Fuiste a un concierto alguna vez?, 'Sí, fui a un concierto de Shakira.']
          - [¿Tocaste un instrumento?, 'Sí, toqué la guitarra.']
          - [¿Cantaste en la escuela?, 'No, no canté.']
          - [¿Cuál era tu canción favorita cuando eras niño?, Mi canción favorita era «La Bamba».]
      - id: fui
        type: multipleChoice
        prompt: —¿Fuiste a un concierto? —Sí, ___ a un concierto de Marc Anthony.
        options:
          - { text: fui, correct: true }
          - { text: fue, feedback: '*Fue* es para él o ella. Para hablar de ti decimos *fui*.' }
          - {
              text: voy,
              feedback: '*Voy* es presente. La pregunta es en pasado (*¿Fuiste…?*): *fui*.',
            }
      - id: escuchas
        type: fillBlank
        prompt: Completa la pregunta con el verbo *escuchar* en presente.
        text: —¿Qué música ___ hoy? —Hoy escucho salsa.
        blanks: [[escuchas]]
      - id: pregunta-pasado
        type: multipleChoice
        prompt: ¿Qué pregunta está en pasado?
        options:
          - { text: ¿Qué música escuchaste ayer?, correct: true }
          - {
              text: ¿Qué música escuchas hoy?,
              feedback: '*Escuchas* es presente. En pasado decimos *escuchaste*.',
            }
          - {
              text: ¿Qué música te gusta?,
              feedback: '*Te gusta* es presente. En pasado decimos, por ejemplo, *¿Qué música escuchaste ayer?*',
            }
      - id: gustos-presente
        type: trueFalse
        prompt: 'Para hablar de gustos y rutinas de hoy usamos el presente: *Me gusta escuchar salsa cuando cocino.*'
        answer: true
        feedback:
          correct: ¡Correcto! Gustos, opiniones y rutinas → presente.
          incorrect: 'Gustos, opiniones y rutinas van en presente: *Me gusta escuchar salsa cuando cocino.*'
      - id: toque
        type: fillBlank
        prompt: Responde con el verbo *tocar* en pasado (yo).
        text: —¿Tocaste un instrumento? —Sí, ___ el piano.
        blanks: [[toqué, yo toqué]]
      - id: ordena-favorita
        type: reorderSentence
        prompt: Ordena las palabras para hacer una pregunta.
        sentence: ¿Cuál es tu canción favorita?
      - id: tu-pregunta
        type: shortAnswer
        prompt: Escribe una pregunta en pasado para entrevistar a un compañero sobre la música.

  - slug: musica-narrativa
    title: 'Narrativa: presente y pasado'
    minutes: 8
    items:
      - id: hoy-estoy
        type: multipleChoice
        prompt: Ayer estudié toda la noche. Hoy ___ cansado.
        options:
          - { text: estoy, correct: true }
          - { text: estuve, feedback: 'Con *hoy* hablamos del presente: *hoy estoy cansado*.' }
          - { text: estaba, feedback: '*Estaba* es pasado. Con *hoy* usamos el presente: *estoy*.' }
      - id: comi-tengo
        type: fillBlank
        prompt: Completa con *comer* en pasado y *tener* en presente (yo).
        text: Ayer ___ demasiada pizza. Hoy ___ dolor de estómago.
        blanks: [[comí, yo comí], [tengo, yo tengo]]
      - id: escuchaba
        type: multipleChoice
        prompt: Cuando era niño, ___ música infantil todos los días.
        options:
          - { text: escuchaba, correct: true }
          - {
              text: escucho,
              feedback: '*Escucho* es presente. Para un hábito del pasado usamos el imperfecto: *escuchaba*.',
            }
          - {
              text: voy a escuchar,
              feedback: '*Voy a escuchar* es futuro. Para un hábito del pasado usamos el imperfecto: *escuchaba*.',
            }
      - id: imperfecto-habitos
        type: trueFalse
        prompt: 'El pretérito imperfecto describe hábitos del pasado: *Mis padres ponían salsa en casa todos los días.*'
        answer: true
        feedback:
          correct: ¡Correcto! *Ponían* es un hábito del pasado.
          incorrect: 'Sí: el imperfecto (*ponían, escuchaba, bailábamos*) describe hábitos del pasado.'
      - id: une-infinitivos
        type: matching
        prompt: Une cada forma con su infinitivo.
        pairs:
          - [nació, nacer]
          - [tuvo, tener]
          - [ponían, poner]
          - [bailábamos, bailar]
          - [escuché, escuchar]
      - id: biografia
        type: fillBlank
        prompt: Completa la biografía con *nació* o *vive*.
        text: Shakira ___ en Barranquilla en 1977. Ahora ___ en Miami.
        blanks: [[nació], [vive]]
        wordBank: [nació, vive]
      - id: ordena-antes
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Hoy escucho salsa, pero antes escuchaba rock.
      - id: marta
        type: multipleChoice
        prompt: Hoy Marta escucha reguetón, pero antes ___ música pop.
        options:
          - { text: escuchaba, correct: true }
          - {
              text: escucha,
              feedback: 'Con *antes* hablamos de un hábito del pasado: *escuchaba*.',
            }
          - {
              text: escuché,
              feedback: '*Escuché* es para *yo*. Marta es ella, y es un hábito del pasado: *escuchaba*.',
            }
