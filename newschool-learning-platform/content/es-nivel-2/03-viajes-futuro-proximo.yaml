    blocks:
      - id: intro
        type: text
        text: Practica las dos habilidades del ciclo. Cada respuesta se corrige al momento, y puedes intentarlo otra vez.
      - id: ex-ir-a
        type: activity
        activity: viajes-futuro-proximo-ir-a
      - id: ex-plan
        type: activity
        activity: viajes-futuro-proximo-plan

