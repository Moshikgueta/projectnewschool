# Cycle "Viajes: futuro próximo", converted from the Spanish level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-2
slug: viajes-futuro-proximo
title: 'Viajes: futuro próximo'
goal: Hablar de planes de viaje con ir a + infinitivo y ordenarlos con primero, después, luego y al final.
position: 3
status: in_review

review:
  - >-
    The two workbook exercises ("Ir a + infinitivo" and "Plan de viaje: primero,
    después…") are NEW: the notebook has no self-study exercises. They were written
    from the cycle's two skills, its summary rules, the activity examples and its
    vocabulary. Please check level, wording and every right answer before students
    see them.
  - >-
    The source names objectives, not two skills: plans with "ir a + infinitivo" and
    talking about travel plans. The two skills used here are "Futuro próximo: ir a +
    infinitivo" and "Organizar un plan de viaje" (sequence markers primero, después,
    luego, al final and the "vamos a" form), both taught in the summary. Please
    confirm.
  - >-
    The grammar in the summary is correct; a conjugation table of "ir" (voy, vas, va,
    vamos, vais, van) was added from the source's examples, and the "Gramática
    aprendida en contexto" and "Conclusión gramatical" parts, which repeat each
    other, are merged into one rule list. The "Regla práctica para A2" is kept.
  - >-
    Corrections: title "Futuro proximo" → "Futuro próximo"; homework title "Futuro
    con ir+ infinitivo" → "ir a + infinitivo"; "Voy a usar el avión y después voy a
    tomar un tren" → "Voy a ir en avión y después voy a tomar un tren" (also "Voy a
    usar el avión y luego un tren" in the summary); Mori "Yo voy a responder y
    corrígeme si me equivoco" → "Voy a responder. Corrígeme si me equivoco"; Mori
    message 2 "Escucha y dime" → "Lee mis frases y dime" (it is a written chat).
  - >-
    The introduction frame uses the simple future "Mi próximo viaje será a ___". It
    is kept as in the source (será is common and correct), but it is not the tense
    of this cycle; you may prefer "Mi próximo viaje va a ser a ___".
  - >-
    Vocabulary: "Sacar, לצלם" → "Sacar fotos, לצלם"; "Disfrutar, להנות" → "ליהנות"
    (spelling). Please confirm.
  - >-
    Activity 3 says each student "receives a list of travel actions", but the
    notebook gives only the examples in the activity; they are shown as the word
    bank. Activity 4 has no time for the group report; the times recorded are the
    source's (ranges recorded as the upper value: 2–3 → 3, 8–10 → 10, 5–7 → 7).
  - >-
    The Quizlet link is kept without its "?new" parameter. The "Respuesta de alumno
    1/2/3" lines are replaced by the optional answer boxes (decision C2).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: viajes-futuro-proximo-clase
    title: 'Clase: Viajes, futuro próximo'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Viajes: futuro próximo'
      - id: skills
        type: cycleOverview
        skills:
          - name: 'Futuro próximo: ir a + infinitivo'
            description: '*Voy a viajar a Italia. ¿Qué vas a hacer?*'
          - name: Organizar un plan de viaje
            description: '*Primero, después, luego, al final* · *vamos a* + infinitivo'
      - id: quizlet
        type: externalLink
        label: 'Viajes: futuro próximo en Quizlet'
        url: https://quizlet.com/br/1069761636/viajes-futuro-proximo-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___. Mi próximo viaje será a ___ y voy a ___.
        example: Soy Marta. Mi próximo viaje será a Grecia y voy a visitar las islas.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup
        type: discussionQuestions
        items:
          - question: ¿A dónde vas a viajar en tus próximas vacaciones?
            frame: Voy a viajar a ___.
          - question: ¿Con quién vas a viajar?
            frame: Voy a viajar con ___.
          - question: ¿Qué vas a hacer en ese viaje?
            frame: Voy a visitar ___ y voy a comer ___.
          - question: ¿Dónde vas a dormir? (hotel, apartamento, camping…)
            frame: Voy a dormir en ___.
          - question: ¿Qué transporte vas a usar? (avión, tren, coche…)
            frame: Voy a ir en ___ y después voy a tomar ___.
          - question: ¿Qué recuerdos vas a comprar?
            frame: Voy a comprar ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Plan de viaje en pareja'
        skills: ['Futuro próximo: ir a + infinitivo']
        minutes: 18
        steps:
          - Lee las preguntas de abajo.
          - 'En parejas: el alumno A hace una pregunta y el alumno B responde con *ir a* + infinitivo. Después cambien de rol.'
          - 'Opcional: añade un detalle a cada respuesta.'
          - Cuenta al grupo, en tercera persona, qué va a hacer tu compañero.
        example: |-
          *A: ¿Dónde vas a dormir?*
          *B: Voy a dormir en un apartamento cerca del centro.*
          *A: ¿Qué vas a comprar en ese viaje?*
          *B: Voy a comprar recuerdos para mi familia.*
          *Reporte: Mi compañero va a dormir en un apartamento y va a comprar recuerdos para su familia.*
      - id: act1-questions
        type: discussionQuestions
        title: Preguntas modelo
        items:
          - question: ¿A dónde vas a viajar?
            frame: Voy a viajar a ___.
          - question: ¿Con quién vas a viajar?
            frame: Voy a viajar con ___.
          - question: ¿Qué vas a hacer en ese viaje?
            frame: Voy a ___ y voy a ___.
          - question: ¿Dónde vas a dormir?
            frame: Voy a dormir en ___.
          - question: ¿Qué transporte vas a usar?
            frame: Voy a ir en ___.
          - question: ¿Qué recuerdos vas a comprar?
            frame: Voy a comprar ___.
      - id: act2
        type: classActivity
        title: 'Actividad 2: Plan de viaje compartido'
        skills: [Organizar un plan de viaje, 'Futuro próximo: ir a + infinitivo']
        steps:
          - En grupos de 3 o 4, elijan un destino.
          - Cada alumno añade una acción con *vamos a* + infinitivo (transporte, comida, actividades, alojamiento, compras).
          - 'Hagan preguntas al grupo para cambiar o añadir detalles: *¿Dónde vamos a dormir? ¿Qué vamos a visitar primero? ¿Qué transporte vamos a usar?*'
          - Compartan el plan completo con toda la clase, con *nosotros*.
        example: |-
          *A: Vamos a viajar a España.*
          *B: Vamos a dormir en un hotel en Barcelona.*
          *C: Vamos a visitar museos en Madrid.*
          *D: Vamos a comprar recuerdos en Sevilla.*
          *B: ¿Vamos a viajar en avión o en tren?*
          *Todos: ¡En avión!*
          *Vamos a viajar a España, vamos a dormir en un hotel en Barcelona, vamos a visitar museos en Madrid y vamos a comprar recuerdos en Sevilla.*
      - id: act2-plan
        type: discussionQuestions
        title: Nuestro plan
        items:
          - question: Vamos a viajar a ___.
          - question: Vamos a dormir en ___.
          - question: Vamos a visitar ___.
          - question: Vamos a comer ___.
          - question: Vamos a comprar ___.
      - id: act3
        type: classActivity
        title: 'Actividad 3: Agenda de viaje sorpresa'
        skills: [Organizar un plan de viaje, 'Futuro próximo: ir a + infinitivo']
        steps:
          - Elige 4 o 5 acciones de la lista.
          - Ordénalas y escribe tu mini-agenda de viaje con *ir a* + infinitivo y *primero, después, luego, al final*.
          - Lee tu agenda en voz alta, en parejas o para la clase.
        example: |-
          **Primero** voy a viajar en avión a Roma.
          **Después** voy a visitar el Coliseo.
          **Luego** voy a comer pizza en un restaurante típico.
          **Al final** voy a comprar un recuerdo para mi familia.
        wordBank:
          - viajar en tren
          - visitar un museo
          - comer en un restaurante típico
          - comprar un regalo
          - ir a la playa
          - dormir en un hotel
      - id: act3-agenda
        type: discussionQuestions
        title: Mi agenda de viaje
        items:
          - question: Primero voy a ___.
          - question: Después voy a ___.
          - question: Luego voy a ___.
          - question: Al final voy a ___.
      - id: act4
        type: classActivity
        title: 'Actividad 4: El viaje imposible'
        skills: [Organizar un plan de viaje, 'Futuro próximo: ir a + infinitivo']
        minutes: 20
        steps:
          - 'Mira los 3 viajes imposibles: un mes en la **Antártida**, una semana en **Marte** o tres días en una **isla sin internet**.'
          - En grupo, elijan un destino y planeen 5 acciones principales con *vamos a* + infinitivo. Usen las preguntas de abajo.
          - Presenten su viaje imposible a la clase.
          - 'La clase vota: ¿cuál es el plan más divertido, más realista o más loco?'
        example: '*En la Antártida vamos a llevar ropa muy abrigada, vamos a dormir en iglús, vamos a comer pescado y sopa caliente, vamos a sacar fotos de pingüinos y vamos a jugar con bolas de nieve.*'
      - id: act4-questions
        type: discussionQuestions
        title: Preguntas guía
        items:
          - question: ¿Qué vamos a llevar?
            frame: Vamos a llevar ___.
          - question: ¿Dónde vamos a dormir?
            frame: Vamos a dormir en ___.
          - question: ¿Qué vamos a comer?
            frame: Vamos a comer ___.
          - question: ¿Qué actividades vamos a hacer?
            frame: Vamos a ___.
          - question: ¿Cómo vamos a sobrevivir / divertirnos?
            frame: Vamos a ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Clase de 90 minutos. Objetivos: hablar de planes de viaje; practicar el futuro
          con *ir a* + infinitivo (planes concretos); expresar deseos y predicciones sobre
          viajes.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: Da tu propio ejemplo primero y después pregunta a cada estudiante.
      - id: n-warmup
        anchor: warmup
        minutes: 30
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act1
        anchor: act1
        minutes: 18
        text: >-
          Preparación: 3 minutos (escribe en la pizarra las preguntas modelo). Trabajo en
          parejas: 10 minutos. Reporte en grupo: 5 minutos. Variación opcional: cada
          alumno inventa un detalle adicional (*Voy a visitar museos y voy a sacar
          fotos.*).
      - id: n-act2
        anchor: act2
        text: >-
          Objetivo: practicar *vamos a* + infinitivo en frases colaborativas, con
          preguntas y respuestas, y varias áreas de vocabulario (destino, transporte,
          comida, alojamiento, actividades).
      - id: n-act3
        anchor: act3
        text: >-
          Entrega a cada alumno una lista de acciones de viaje (por ejemplo, las del banco
          de palabras). Trabajo individual primero y después en parejas o en grupo.
          Objetivo: frases conectadas con *voy a* + infinitivo y marcadores de secuencia.
      - id: n-act4
        anchor: act4
        text: >-
          Preparación: 3 minutos (presenta los 3 viajes en la pizarra o en la pantalla;
          puedes cambiarlos según la edad o los intereses del grupo). Trabajo en grupos:
          10 minutos. Presentación y votación: 7 minutos. Objetivo: *vamos a* +
          infinitivo en contexto colaborativo, con humor y negociación.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: viajes-futuro-proximo-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-ir-a
        type: ruleSummary
        skill: 'Futuro próximo: ir a + infinitivo'
        rules:
          - text: 'Se llama **futuro próximo** (perífrasis de futuro). Estructura: sujeto + **ir** (conjugado) + **a** + infinitivo.'
            examples:
              - Yo **voy a viajar** a Italia.
              - Tú **vas a comer** paella.
              - Él / Ella **va a dormir** en un hotel.
              - Nosotros **vamos a visitar** museos.
              - Ellos **van a comprar** recuerdos.
          - text: '**Planes ya decididos:** ya sabes lo que vas a hacer.'
            examples: [Voy a viajar a Italia este verano., Vamos a dormir en un hotel en Barcelona.]
          - text: '**Acciones inmediatas:** algo está a punto de pasar.'
            examples: [Voy a salir ahora mismo de casa., Va a llover pronto.]
          - text: '**Intenciones personales:** lo que quieres hacer en el futuro.'
            examples: [Voy a estudiar más español este año., Ellos van a comprar un coche nuevo.]
          - text: 'Se usa en las tres personas: primera (*Voy a viajar*), segunda (*¿Qué vas a hacer?*) y tercera (*Mi compañero va a visitar un museo*).'
          - text: '**Regla práctica para A2:** usa *ir a* + infinitivo para lo que ya decidiste hacer, lo que vas a hacer pronto y lo que quieres o planeas hacer.'
      - id: ir-table
        type: table
        caption: El verbo ir (presente) + a + infinitivo
        header: [Persona, ir, Ejemplo]
        rows:
          - [Yo, voy, Voy a viajar.]
          - [Tú, vas, ¿Qué vas a hacer?]
          - [Él / Ella / Usted, va, Va a dormir en un hotel.]
          - [Nosotros / Nosotras, vamos, Vamos a visitar museos.]
          - [Vosotros / Vosotras, vais, Vais a comer tapas.]
          - [Ellos / Ellas / Ustedes, van, Van a comprar recuerdos.]
      - id: rules-plan
        type: ruleSummary
        skill: Organizar un plan de viaje
        rules:
          - text: 'Los **marcadores de secuencia** (*primero, después, luego, al final*) ordenan un itinerario o una agenda.'
            examples:
              - Primero voy a viajar en avión a Roma.
              - Después voy a visitar el Coliseo.
              - Luego voy a comer pizza en un restaurante típico.
              - Al final voy a comprar un recuerdo para mi familia.
          - text: 'Para planes en grupo, usa **vamos a** + infinitivo.'
            examples: [Vamos a viajar a España., ¿Dónde vamos a dormir?]
          - text: 'En un viaje, hablamos de planes, actividades, alojamiento, transporte y compras.'
            examples:
              - Voy a viajar a Grecia en mis próximas vacaciones.
              - Voy a visitar museos y voy a comer pizza.
              - Vamos a dormir en un apartamento cerca del centro.
              - Voy a ir en avión y luego en tren.
              - Voy a comprar un imán para mi familia.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos habilidades con el grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: viajes-futuro-proximo-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Tarea con Mori: ir a + infinitivo'
      - id: how
        type: text
        text: Abre el chat con Mori, copia un mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: basic-title
        type: heading
        level: 3
        text: Nivel iniciante
      - id: basic-goal
        type: text
        text: 'Objetivo: practicar frases cortas con planes concretos.'
      - id: mori-basic-1
        type: aiTutorPrompt
        title: 'Mensaje 1: Preguntas y respuestas'
        message: |-
          Hola Mori, hazme 5 preguntas fáciles con ir a + infinitivo, como:
          ¿A dónde vas a viajar?
          ¿Qué vas a comer mañana?
          ¿Dónde vas a dormir en tus vacaciones?
          Voy a responder. Corrígeme si me equivoco.
      - id: mori-basic-2
        type: aiTutorPrompt
        title: 'Mensaje 2: Mini-diario de planes'
        intro: 'Después, escribe 4 planes. Ejemplo: *Voy a estudiar español mañana. El viernes voy a cenar pizza. El sábado voy a visitar a mis abuelos. El domingo voy a dormir mucho.*'
        message: Hola Mori, te voy a contar 4 planes para esta semana. Lee mis frases y dime si están correctas. Después, hazme una pregunta extra sobre cada frase.
      - id: mori-basic-3
        type: aiTutorPrompt
        title: 'Mensaje 3: Reporte en tercera persona'
        intro: 'Después, escribe tus frases. Ejemplo: *Mi hermano va a jugar al fútbol. Va a estudiar para un examen. Va a comer hamburguesa.*'
        message: Hola Mori, voy a contarte qué va a hacer una persona de mi familia. Corrige mis frases y hazme una pregunta más sobre esa persona.
      - id: inter-title
        type: heading
        level: 3
        text: Nivel intermedio
      - id: inter-goal
        type: text
        text: 'Objetivo: usar ir a + infinitivo con más detalles, preguntas de seguimiento y narración en tercera persona.'
      - id: mori-inter-1
        type: aiTutorPrompt
        title: 'Mensaje 1: Entrevista de planes'
        intro: 'Ejemplo: Mori: *¿Qué vas a hacer en tu próximo viaje?* Tú: *Voy a visitar museos en Roma.* Mori: *Muy bien. ¿Qué museo vas a visitar primero?*'
        message: Hola Mori, entrevístame con 6 preguntas sobre mis próximos viajes y planes. Usa ir a + infinitivo. Después de cada respuesta, corrígeme y hazme una pregunta de seguimiento.
      - id: mori-inter-2
        type: aiTutorPrompt
        title: 'Mensaje 2: Agenda de viaje'
        intro: 'Después, escribe tus 5 frases. Ejemplo: *Primero voy a viajar en avión a Madrid. Después voy a visitar el Palacio Real. Luego voy a comer tapas en un restaurante. Más tarde voy a comprar recuerdos. Al final voy a volver al hotel.*'
        message: Hola Mori, voy a organizar mi próximo viaje con 5 frases usando primero, después, luego y al final. Corrige mis frases y hazme una pregunta para añadir un detalle.
      - id: mori-inter-3
        type: aiTutorPrompt
        title: 'Mensaje 3: Planes familiares en tercera persona'
        intro: 'Después, escribe tus frases. Ejemplo: *Mi madre va a ir al supermercado. Mi padre va a ver un partido de fútbol. Mi hermana va a salir con sus amigos.*'
        message: Hola Mori, te voy a contar qué van a hacer 3 personas de mi familia el fin de semana. Corrige mis frases y hazme una pregunta extra sobre una de ellas.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: viajes-futuro-proximo-practica
    book: workbook
    title: 'Práctica: Viajes, futuro próximo'
