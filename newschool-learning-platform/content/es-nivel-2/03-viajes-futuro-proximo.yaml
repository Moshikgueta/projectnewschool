vocabulary:
  - slug: viajes-futuro-proximo
    title: 'Viajes: futuro próximo'
    items: *viajes-futuro-proximo-words

activities:
  - slug: viajes-futuro-proximo-ir-a
    title: 'Futuro próximo: voy a viajar'
    minutes: 8
    items:
      - id: voy-a-viajar
        type: multipleChoice
        prompt: Este verano yo ___ a Italia.
        options:
          - { text: voy a viajar, correct: true }
          - {
              text: voy viajar,
              feedback: 'Falta la *a*: *ir* + **a** + infinitivo → *voy a viajar*.',
            }
          - {
              text: va a viajar,
              feedback: '*Va* es para *él / ella*. Con *yo* usamos *voy*: *voy a viajar*.',
            }
      - id: une-ir
        type: matching
        prompt: Une cada persona con la forma de *ir*.
        pairs:
          - [yo, voy]
          - [tú, vas]
          - [él / ella, va]
          - [nosotros, vamos]
          - [ellos / ellas, van]
      - id: vas-hacer
        type: fillBlank
        prompt: Completa la pregunta y la respuesta con *ir a*.
        text: ¿Qué ___ a hacer en tu viaje? — ___ a visitar museos.
        blanks: [[vas], [Voy, Yo voy]]
      - id: ellos-van
        type: fillBlank
        prompt: Completa con *ir* + *a* + infinitivo.
        text: Ellos ___ ___ comprar recuerdos.
        blanks: [[van], [a]]
      - id: infinitivo
        type: trueFalse
        prompt: 'Después de *ir a* usamos el verbo en infinitivo: *Voy a comer pizza.*'
        answer: true
        feedback:
          correct: ¡Correcto! *ir* (conjugado) + *a* + infinitivo (*comer, viajar, dormir*).
          incorrect: 'El segundo verbo va en infinitivo: *Voy a comer*, no *Voy a como*.'
      - id: va-llover
        type: multipleChoice
