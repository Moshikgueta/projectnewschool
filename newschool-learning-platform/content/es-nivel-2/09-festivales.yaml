vocabulary:
  - slug: festivales
    title: Festivales
    items: *festivales-words

activities:
  - slug: festivales-imperativo
    title: 'Imperativo: baila, come, no cantes'
    minutes: 8
    items:
      - id: bebe
        type: multipleChoice
        prompt: ___ mucha agua en el festival. (beber, tú)
        options:
          - { text: Bebe, correct: true }
          - {
              text: Bebes,
              feedback: '*Bebes* es presente, no es una instrucción. El imperativo de *beber* es *bebe*.',
            }
          - {
              text: Bebas,
              feedback: '*Bebas* es para el negativo: *No bebas*. En afirmativo usa *bebe*.',
            }
      - id: baila
        type: fillBlank
        prompt: Completa con el imperativo de *bailar* (tú).
        text: ___ en la fiesta.
        blanks: [[Baila]]
      - id: no-cantes
        type: multipleChoice
        prompt: No ___ tan fuerte en la fiesta. (cantar, tú)
        options:
          - { text: cantes, correct: true }
          - {
              text: canta,
              feedback: 'En negativo, los verbos en *-ar* terminan en *-es*: *no cantes*.',
            }
          - { text: cantas, feedback: '*Cantas* es presente. En negativo usa *no cantes*.' }
      - id: formas-tu
        type: matching
        prompt: Une cada verbo con su imperativo (tú).
        pairs:
          - [bailar, baila]
          - [comer, come]
          - [vivir, vive]
          - [usar, usa]
          - [salir, sal]
      - id: ustedes
        type: trueFalse
        prompt: 'Con *ustedes*, los verbos en *-ar* terminan en *-en*: *Bailen en la fiesta.*'
        answer: true
        feedback:
          correct: ¡Correcto! *-ar* → *-en* (bailen); *-er* / *-ir* → *-an* (coman, vivan).
          incorrect: 'Con *ustedes*: *-ar* → *-en* (bailen); *-er* / *-ir* → *-an* (coman, vivan).'
      - id: no-beban
        type: fillBlank
        prompt: Completa con el imperativo negativo de *beber* (ustedes).
        text: No ___ demasiado en el festival.
        blanks: [[beban]]
      - id: no-salgas
        type: multipleChoice
        prompt: No ___ tarde del evento. (salir, tú)
        options:
          - { text: salgas, correct: true }
          - {
              text: sales,
              feedback: '*Sales* es presente. En negativo usa el subjuntivo: *no salgas*.',
