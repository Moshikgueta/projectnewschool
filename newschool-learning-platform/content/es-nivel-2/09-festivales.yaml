  - slug: festivales-narrar
    title: 'Narrar: pasado, presente y futuro'
    minutes: 8
    items:
      - id: fui
        type: multipleChoice
        prompt: Ayer ___ a un concierto increíble.
        options:
          - { text: fui, correct: true }
          - { text: voy, feedback: '*Ayer* es pasado: usa el pretérito indefinido, *fui*.' }
          - { text: iré, feedback: '*Iré* es futuro. *Ayer* es pasado: usa *fui*.' }
      - id: celebrabamos
        type: multipleChoice
        prompt: Cuando era niño, siempre ___ el carnaval.
        options:
          - { text: celebrábamos, correct: true }
          - {
              text: celebraremos,
              feedback: 'Es un hábito en el pasado: usa el imperfecto, *celebrábamos*.',
            }
          - {
              text: vamos a celebrar,
              feedback: '*Vamos a celebrar* es futuro. Para hábitos en el pasado usa el imperfecto.',
            }
      - id: traere
        type: fillBlank
        prompt: Completa con el verbo *traer* en futuro simple (yo).
        text: El año que viene ___ a mis amigos al festival.
        blanks: [[traeré, yo traeré]]
      - id: tiempos
        type: matching
        prompt: Une cada oración con su tiempo.
        pairs:
          - [Ayer encontré una invitación., pretérito indefinido]
          - ['Cuando era niña, bailaba en el desfile.', imperfecto]
          - [Hoy voy al evento., presente]
          - [¿Qué pasará allí?, futuro simple]
          - [Mañana vamos a preparar todo., ir a + infinitivo]
      - id: imperfecto-habitos
        type: trueFalse
        prompt: 'El imperfecto se usa para describir situaciones y hábitos en el pasado: *Cuando era niño, siempre celebrábamos el carnaval.*'
        answer: true
        feedback:
          correct: ¡Correcto! El imperfecto describe hábitos y situaciones del pasado.
          incorrect: 'El imperfecto sí describe hábitos en el pasado. Para acciones terminadas usamos el pretérito indefinido: *Ayer fui a un concierto.*'
      - id: baile
        type: fillBlank
        prompt: Completa con el verbo *bailar* en pretérito indefinido (yo).
        text: El año pasado ___ en el carnaval.
        blanks: [[bailé, yo bailé]]
      - id: cancelara
        type: multipleChoice
        prompt: Si sigue lloviendo, el desfile se ___.
        options:
          - { text: cancelará, correct: true }
          - {
              text: canceló,
              feedback: 'Hablamos de algo que va a pasar: usa el futuro, *se cancelará*.',
            }
          - {
              text: cancelaba,
              feedback: '*Cancelaba* es imperfecto (pasado). Aquí usamos el futuro: *se cancelará*.',
            }
      - id: ordena-manana
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Mañana vamos a preparar todo.
