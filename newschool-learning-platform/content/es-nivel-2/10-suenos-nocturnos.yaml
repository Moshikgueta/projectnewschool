          - { term: Lúcido, gloss: צלול }
          - { term: A pesar de, gloss: למרות }
          - { term: Debido a, gloss: בגלל }
          - { term: En lugar de, gloss: במקום }

vocabulary:
  - slug: suenos-nocturnos
    title: Sueños nocturnos
    items: *suenos-nocturnos-words

activities:
  - slug: suenos-nocturnos-pasado
    title: 'Tiempo pasado: soñé y soñaba'
    minutes: 8
    items:
      - id: anoche-sone
        type: multipleChoice
        prompt: Anoche ___ con una playa enorme.
        options:
          - { text: soñé, correct: true }
          - {
              text: soñaba,
              feedback: '*Anoche* es un momento concreto y la acción terminó: usa el pretérito indefinido, *soñé*.',
            }
          - { text: soñó, feedback: '*Soñó* es para *él* o *ella*. Para *yo*, usa *soñé*.' }
      - id: cada-noche
        type: multipleChoice
        prompt: Cuando era pequeño, todas las noches ___ que volaba.
        options:
          - { text: soñaba, correct: true }
          - {
              text: soñé,
              feedback: '*Todas las noches* es un hábito del pasado: usa el pretérito imperfecto, *soñaba*.',
            }
          - { text: soñaron, feedback: '*Soñaron* es para *ellos*. Aquí habla *yo*: *soñaba*.' }
      - id: habia
        type: fillBlank
        prompt: Completa con el verbo *haber* en pretérito imperfecto.
        text: En mi sueño, ___ un castillo rodeado de niebla.
        blanks: [[había]]
      - id: une-yo
        type: matching
        prompt: Une cada verbo con su forma de *yo* en pretérito indefinido.
        pairs:
          - [soñar, soñé]
          - [volar, volé]
          - [comer, comí]
          - [vivir, viví]
          - [escribir, escribí]
      - id: descripcion
        type: trueFalse
        prompt: 'Usamos el pretérito imperfecto para describir una situación en el pasado: *En el sueño, era de noche.*'
        answer: true
        feedback:
          correct: ¡Correcto! *Era* describe la situación del sueño.
          incorrect: 'Las descripciones del pasado van en imperfecto: *era de noche*, *había un castillo*.'
      - id: caminamos-comieron
        type: fillBlank
        prompt: Completa con el pretérito indefinido.
        text: Ayer nosotros ___ (caminar) por la playa. Después, ellos ___ (comer) pastel.
        blanks: [[caminamos], [comieron]]
      - id: estaba
        type: multipleChoice
        prompt: ¿Cuál es la forma de *estar* en pretérito imperfecto para *yo*?
        options:
          - { text: estaba, correct: true }
          - {
              text: estuve,
              feedback: '*Estuve* es pretérito indefinido. El imperfecto de *-ar* termina en *-aba*: *estaba*.',
            }
          - {
              text: estaré,
              feedback: '*Estaré* es futuro. El imperfecto de *-ar* termina en *-aba*: *estaba*.',
            }
      - id: ordena-volaba
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Anoche soñé que volaba sobre el mar.
        alsoAccept: [Soñé que volaba sobre el mar anoche]

  - slug: suenos-nocturnos-preposiciones
    title: 'Preposiciones avanzadas: a pesar de, debido a, en lugar de'
    minutes: 8
    items:
      - id: a-pesar-lluvia
        type: multipleChoice
        prompt: ___ la lluvia, fuimos al parque.
        options:
          - { text: A pesar de, correct: true }
          - {
              text: Debido a,
              feedback: '*Debido a* explica la causa. Aquí hay una contradicción (llueve, pero fuimos): *a pesar de*.',
            }
          - {
              text: En lugar de,
              feedback: '*En lugar de* es elegir una cosa y no otra. Aquí hay una contradicción: *a pesar de*.',
            }
      - id: debido-vuelo
        type: multipleChoice
        prompt: El vuelo se retrasó ___ problemas técnicos.
        options:
          - { text: debido a, correct: true }
          - {
              text: a pesar de,
              feedback: 'Los problemas técnicos son la causa del retraso: usa *debido a*.',
            }
          - {
              text: en lugar de,
              feedback: 'Los problemas técnicos son la causa del retraso: usa *debido a*.',
            }
      - id: en-lugar-cine
        type: fillBlank
        prompt: Completa la oración.
        text: Decidí quedarme en casa ___ ir al cine.
        blanks: [[en lugar de, en vez de]]
        wordBank: [en lugar de, debido a, a pesar de]
      - id: une-lugar
        type: matching
        prompt: Une cada preposición con su traducción.
        pairs:
          - [detrás de, מאחורי]
          - [frente a, מול]
          - [alrededor de, סביב]
          - [encima de, מעל]
          - [en lugar de, במקום]
      - id: infinitivo
        type: trueFalse
        prompt: 'Después de *a pesar de* podemos usar un sustantivo o un verbo en infinitivo: *A pesar de estar cansada, salí.*'
        answer: true
        feedback:
          correct: '¡Correcto! *A pesar de la lluvia* / *A pesar de estar cansada*.'
          incorrect: '*A pesar de* puede ir con un sustantivo (*la lluvia*) o con un infinitivo (*estar*).'
      - id: al-del
        type: fillBlank
        prompt: Completa con *al* o *del*.
        text: El gato está debajo ___ sofá. Debido ___ tráfico, llegamos tarde.
        blanks: [[del], [al]]
        wordBank: [al, del]
      - id: alrededor-de
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: Hay árboles alrededor de mi casa., correct: true }
          - {
              text: Hay árboles alrededor mi casa.,
              feedback: 'Decimos *alrededor **de***: *alrededor de mi casa*.',
            }
          - {
              text: Hay árboles alrededor a mi casa.,
              feedback: 'Decimos *alrededor **de***, no *alrededor a*.',
            }
      - id: ordena-piscina
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Detrás de mi casa hay una piscina.
        alsoAccept: [Hay una piscina detrás de mi casa]
