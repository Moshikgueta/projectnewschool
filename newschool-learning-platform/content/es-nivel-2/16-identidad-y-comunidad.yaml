# Cycle "Identidad y comunidad", converted from the Spanish level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-2
slug: identidad-y-comunidad
title: Identidad y comunidad
goal: Hablar de tu identidad y tu comunidad con ser y estar, comparaciones y el futuro.
position: 16
status: in_review

review:
  - >-
    The three workbook exercises ("Ser y estar", "Comparaciones" and "El futuro") are
    NEW: the notebook has no self-study exercises. They were written from the cycle's
    skills, its summary rules and its vocabulary. Please check level, wording and every
    right answer before students see them.
  - >-
    This cycle lists THREE skills (Ser vs. Estar, Comparaciones, Futuro simple), not
    two. All three are kept in the overview, and one exercise was written per skill
    (three exercises instead of the usual two). Please confirm.
  - >-
    Future (summary, Activity 3 introduction): the source calls "ir a + infinitivo"
    the "futuro simple". In Spanish, "voy a + infinitivo" is the futuro perifrástico
    (near future) and the futuro simple is the conjugated form (seré, estaremos,
    crecerá). Both are kept but named correctly. The source's ending list "-é, -ás, -á,
    -emos, -án" was missing the vosotros ending -éis; it is added, with a full table
    (hablar, ser, tener) that is NEW. Please confirm.
  - >-
    Ser vs. estar summary: "Ser = identidad permanente" is softened to "identidad:
    quién eres, profesión, nacionalidad, características", because "permanente" is not
    a reliable rule (e.g. "es joven", "está muerto").
  - >-
    Activity 1 was titled "El futuro de Mi Comunidad", but it is the ser/estar
    interview (Activity 3 is the one about the future). It is renamed "Entrevistas -
    ser y estar". Activity 2 "Comprar comunidades" → "Comparar comunidades" (typo).
  - >-
    Corrections: "Informacion" → "Información"; "En qué sentido es menos unida que…?"
    → "¿En qué sentido es menos unida que…?"; a stray "ð" character before "Copiar/pegar"
    was removed. Warm-up frame "Lo que nunca va a cambiar es que voy a ser…" →
    "Lo que nunca va a cambiar es que soy ___." (simpler and logical). Frames were added
    to the comparison warm-up questions, which had none.
  - >-
    Activity 3 says "(Opcional: dar también las preguntas 6–10 si la clase es más
    avanzada)", but the source only has questions 1–5. Questions 6–10 are missing;
    the remark is left out.
  - >-
    The source has two Quizlet links (1070284737 "identidad-y-comunidad-actualizado"
    and an older set 858787830). Both are kept without the "?new" parameter; the
    updated set is the main one. Please confirm the older one is still wanted.
  - >-
    Mori homework: the source gives six "Comando" instructions (what the student
    writes), not messages to send. A message to Mori was written for each. The six
    tasks are kept as six prompts.
  - >-
    Vocabulary: "Estar" gloss "להימצא / להיות זמני" → "להיות (מצב / מקום)"; "Tan…
    como" "כמו" → "באותה מידה… כמו"; "El/la más" written "El / la más". "Inclusivo"
    is kept as "מכליל". Please confirm.
  - >-
    Times given as ranges are recorded as the upper value (3–4 → 4, 8–10 → 10). The
    activities give stage times but no totals, so the stage times are in the steps and
    teacher notes. The "Fecha / Participantes" header and empty lines were left out.
    The "Gramática aplicada en las actividades" part of the summary is a teacher note.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: identidad-y-comunidad-clase
    title: 'Clase: Identidad y comunidad'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Identidad y comunidad
      - id: skills
        type: cycleOverview
        skills:
          - name: Ser y estar
            description: '*Soy argentino* (identidad) · *Estoy en Tel Aviv* (lugar, estado)'
          - name: Comparaciones
            description: '*más … que, menos … que, tan … como, el / la más …*'
          - name: El futuro
            description: '*Voy a vivir en otra ciudad* (ir a + infinitivo) · *Seré profesor* (futuro simple)'
      - id: quizlet
        type: externalLink
        label: Identidad y comunidad en Quizlet
        url: https://quizlet.com/il/1070284737/identidad-y-comunidad-actualizado-flash-cards/
      - id: quizlet-2
        type: externalLink
        label: Identidad y comunidad en Quizlet (otra lista)
        url: https://quizlet.com/858787830/conversational-spanish-identity-community-level-2-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___ (nombre). Soy ___ (nacionalidad / religión / ciudadanía / género / localidad).
        example: Soy Marta. Soy una mujer argentina.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de preparación
      - id: warmup-ser-estar
        type: discussionQuestions
        title: Ser y estar
        items:
          - question: ¿De qué país eres? ¿Cuál es tu nacionalidad?
            frame: Soy ___.
          - question: ¿Dónde estás ahora?
            frame: Estoy en ___.
          - question: ¿Practicas alguna religión?
            frame: Soy ___. / No soy religioso / religiosa.
          - question: ¿Cuál es tu género?
            frame: Soy mujer. / Soy hombre.
      - id: warmup-comparaciones
        type: discussionQuestions
        title: Comparaciones
        items:
          - question: ¿Qué parte de tu identidad compartes con tu familia o comunidad?
            frame: Comparto ___ con mi ___.
          - question: ¿Qué aspectos son solo tuyos?
            frame: Solo yo ___.
          - question: Compárate con otra persona.
            frame: Soy más alto / alta que ___. / Estoy más cansado / cansada que ___.
      - id: warmup-futuro
        type: discussionQuestions
        title: El futuro
        items:
          - question: Imagina tu vida en 5 años. ¿Qué cosas de tu identidad van a cambiar?
            frame: En cinco años voy a ___.
          - question: ¿Qué parte de tu identidad nunca cambiará?
            frame: Lo que nunca va a cambiar es que soy ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Entrevistas - ser y estar'
        skills: [Ser y estar]
        steps:
          - Escucha el ejemplo de tu profesor. Fíjate en **soy** (identidad) y **estoy** (estado, lugar).
          - En parejas, entrevista a tu compañero con las preguntas de abajo (4 minutos). Usa **ser** y **estar** en cada respuesta.
          - Después de 2 minutos, cambia de pareja y repite la entrevista.
          - Presenta a tu compañero al grupo. Haz **un error** con ser / estar a propósito; el grupo lo corrige.
          - 'Juego «Verdadero o falso»: di 2 frases con **ser** y 2 con **estar** sobre ti. Una es mentira. El grupo hace preguntas para descubrirla.'
        example: |-
          *Hola, yo soy Marta. Soy profesora y soy brasileña. Hoy estoy contenta y estoy en Curitiba. ¿Y tú?*
          *Ella es cansada hoy* ❌ → *Ella está cansada hoy* ✅
          *Soy vegetariano, soy estudiante de medicina, estoy en Brasil, estoy cansado ahora.* — *¿De verdad eres estudiante de medicina?*
      - id: act1-questions
        type: discussionQuestions
        title: Preguntas de la entrevista
        items:
          - question: ¿De dónde eres y dónde estás ahora?
            frame: Soy de ___ y ahora estoy en ___.
          - question: ¿Cómo estás hoy y cómo eres como persona?
            frame: Hoy estoy ___. Soy ___.
          - question: ¿Cuál es tu profesión o tu rol en la vida?
            frame: Soy ___.
          - question: ¿Quién en tu familia es más alto o más bajo que tú?
            frame: Mi ___ es más ___ que yo.
          - question: ¿Tu comunidad es más grande o más pequeña que otra comunidad que conoces?
            frame: Mi comunidad es más ___ que ___.
          - question: ¿Qué parte de tu identidad nunca va a cambiar?
            frame: Nunca va a cambiar que soy ___.
          - question: ¿Qué vas a ser en 10 años? ¿Qué vas a estar haciendo?
            frame: En 10 años voy a ser ___. Voy a estar ___.
          - question: ¿Cómo está tu ciudad hoy (el clima, el ambiente)?
            frame: Hoy mi ciudad está ___.
          - question: ¿Quién es la persona más importante en tu vida y por qué?
            frame: La persona más importante en mi vida es ___ porque ___.
          - question: 'Si un turista te pregunta «¿Qué es típico de tu comunidad?», ¿qué le respondes?'
            frame: Lo típico de mi comunidad es ___.
      - id: act2
        type: classActivity
        title: 'Actividad 2: Comparar comunidades'
        skills: [Comparaciones]
        steps:
          - Repasa las estructuras con tu profesor (4 minutos).
          - En grupos pequeños, habla de tu comunidad y compárala con otra (la clase, tu ciudad, tu religión, tus amigos…).
          - Usa al menos 3 tipos de comparaciones. Escriban 2–3 frases (10 minutos).
          - De vuelta en el grupo principal, cada grupo comparte 2 frases y responde una pregunta extra (8 minutos).
          - 'Pregunta final: ¿Qué comunidad es la más importante para ti y por qué?'
        example: |-
          *Mi comunidad es más grande que la tuya.*
          *Mi comunidad es menos diversa que la tuya.*
          *Nuestra comunidad es tan unida como la suya.*
          *La comunidad estudiantil es la más activa.*
      - id: act2-questions
        type: discussionQuestions
        title: Preguntas guía
        items:
          - question: ¿Qué comunidad es más grande?
            frame: La comunidad de ___ es más grande que ___.
          - question: ¿Qué comunidad es menos diversa?
            frame: La comunidad de ___ es menos diversa que ___.
          - question: ¿Qué comunidad es tan importante como otra?
            frame: La comunidad de ___ es tan importante como ___.
          - question: ¿Cuál es la comunidad más activa / antigua / interesante?
            frame: La comunidad más ___ es ___.
          - question: ¿Qué diferencias ven entre sus comunidades y las de otros países?
      - id: act3
        type: classActivity
        title: 'Actividad 3: Mi comunidad en el futuro'
        skills: [El futuro]
        steps:
          - Escucha los ejemplos de tu profesor (4 minutos).
          - 'En grupos pequeños, imaginen cómo va a ser su comunidad en el futuro: cada grupo **defiende el futuro de su comunidad**.'
          - Respondan a las preguntas guía y escriban 3 frases en futuro (10 minutos).
          - 'En el grupo principal, un portavoz por grupo comparte las 3 frases (8 minutos).'
          - '¿Qué parte de tu comunidad va a ser siempre igual, incluso en 50 años?'
        example: |-
          *Mi comunidad va a ser más inclusiva.*
          *Vamos a ayudar a los nuevos miembros.*
          *Nuestra comunidad va a crecer… Nunca vamos a olvidar…*
          *Nuestra comunidad será más grande. Estaremos más unidos.*
      - id: act3-questions
        type: discussionQuestions
        title: Preguntas guía
        items:
          - question: ¿Qué va a ser lo más importante para tu comunidad en los próximos 10 años?
            frame: Lo más importante va a ser ___.
          - question: ¿Qué cosas van a cambiar rápidamente?
            frame: ___ va / van a cambiar rápidamente.
          - question: ¿Qué no va a cambiar nunca?
            frame: ___ nunca va a cambiar.
          - question: ¿Qué problemas va a tener tu comunidad en el futuro?
            frame: Mi comunidad va a tener ___.
          - question: ¿Qué soluciones van a crear?
            frame: Vamos a crear ___.
      - id: act4
        type: classActivity
        title: 'Actividad 4: Mi comunidad - quiénes somos, qué estamos haciendo y qué vamos a hacer'
        skills: [Ser y estar, Comparaciones, El futuro]
        steps:
          - Escucha el ejemplo de tu profesor (5 minutos).
          - 'En grupos, hablen de una comunidad (real o inventada) y escriban **4 frases** (15 minutos):'
          - 1) Una con **ser** (identidad, descripción).
          - 2) Una con **estar + gerundio** (qué están haciendo ahora).
          - 3) Una con una **comparación** (con otra comunidad).
          - 4) Una en **futuro** (qué van a hacer en 5–10 años).
          - Cada grupo presenta sus 4 frases y responde una pregunta extra (10 minutos).
          - '¿Qué parte de tu comunidad nunca va a cambiar?'
        example: |-
          *Nuestra comunidad es internacional.*
          *Ahora estamos organizando clases en línea.*
          *Somos más activos que la comunidad local.*
          *En el futuro vamos a ser más grandes y vamos a ayudar a más personas.*
      - id: act4-sentences
        type: discussionQuestions
        title: Nuestras 4 frases
        items:
          - question: 'Ser: Nuestra comunidad es ___.'
          - question: 'Estar + gerundio: Ahora estamos ___.'
          - question: 'Comparación: Somos más / menos ___ que ___.'
          - question: 'Futuro: En ___ años vamos a ___.'
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Tres habilidades en este ciclo: **Ser y estar** (preguntas de preparación,
          Actividad 1), **Comparaciones** (preguntas de preparación, Actividad 2) y **El
          futuro** (preguntas de preparación, Actividad 3). La Actividad 4 integra ser,
          estar + gerundio, comparaciones y futuro.
      - id: n-intro
        anchor: intro
        text: Da tu propio ejemplo primero y después pregunta a cada estudiante.
      - id: n-warmup
        anchor: warmup-ser-estar
        text: >-
          Revisión guiada: la diferencia entre **ser** (identidad: quién eres,
          nacionalidad, profesión) y **estar** (estado o lugar).
      - id: n-act1
        anchor: act1
        text: >-
          Etapa 1: modela el ejemplo y señala **soy** (identidad) vs. **estoy** (estado,
          lugar). Etapa 2: entrevistas en parejas (3–4 min); cada respuesta usa ser y
          estar. Etapa 3: cambia las parejas después de 2 minutos (fluidez y variedad).
          Etapa 4: cada estudiante presenta a su compañero con un error de ser / estar a
          propósito; el resto de la clase escucha y corrige. Etapa 5: juego «Verdadero o
          falso».
      - id: n-act2
        anchor: act2
        text: >-
          Introducción (3–4 min): escribe los ejemplos en la pizarra de Zoom.
          Instrucciones (2–3 min): copia las preguntas guía en el chat. Salas (8–10 min):
          entra en las salas para escuchar, ayudar y recordar la estructura. Regreso
          (7–8 min): después de cada grupo pregunta «¿Por qué tu comunidad es más
          importante que…?» o «¿En qué sentido es menos unida que…?»; escribe las frases
          en la pizarra y corrige suavemente. Cierre (3–4 min). Variación: encuesta en
          Zoom «¿Cuál comunidad es la más interesante?»; los estudiantes votan y
          justifican con una comparación (*La comunidad artística es más creativa que la
          comunidad deportiva.*).
      - id: n-act3
        anchor: act3
        text: >-
          Introducción (3–4 min): «Hoy vamos a imaginar el futuro de nuestras
          comunidades. Usamos **ir a + infinitivo** (voy a ser) o el **futuro simple**
          (seré, estaremos, ayudarán).» Escribe 2–3 ejemplos en la pizarra de Zoom.
          Instrucciones (2–3 min) y preguntas guía en el chat. Salas (10–12 min): si los
          estudiantes se bloquean, da pistas: «¿Qué van a hacer con la tecnología?», «¿Qué
          van a mantener igual?». Regreso (7–8 min): pregunta extra «¿Por qué va a ser
          importante eso para su comunidad?», «¿Qué va a pasar si no lo hacen?». Cierre
          (3–4 min): corrige errores frecuentes («no decimos *va ser*, sino *va a ser*»).
          Opción lúdica (2–3 min): encuesta «¿Cuál comunidad va a tener el futuro más
          interesante?» (*Voy a votar por la comunidad X porque va a ser muy creativa.*).
      - id: n-act4
        anchor: act4
        text: >-
          Escribe el modelo en la pizarra: *Mi comunidad es estudiantil. Ahora estamos
          organizando un evento cultural. Somos más diversos que otras comunidades porque
          tenemos gente de muchos países. En 5 años vamos a ser más grandes y vamos a
          tener más proyectos.* Copia las instrucciones al chat. Preguntas extra: «¿Por
          qué tu comunidad es más activa que otra?», «¿Qué van a hacer si crecen
          demasiado rápido?», «¿Qué están haciendo ahora para preparar el futuro?».
          Cierre (5 min): corrige ser vs. estar, comparaciones mal formadas y futuro sin
          «a». Variación: encuesta y justificación con comparación + futuro (*La comunidad
          artística va a ser más importante que la deportiva porque va a inspirar a más
          personas.*).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: identidad-y-comunidad-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-ser-estar
        type: ruleSummary
        skill: Ser y estar
        rules:
          - text: '**Ser**: identidad (quién eres), profesión, nacionalidad y características.'
            examples: [Soy argentino., Soy profesor., Mi comunidad es solidaria.]
          - text: '**Estar**: lugar, estado temporal y acciones en progreso.'
            examples: [Estoy en Tel Aviv., Hoy estoy cansado., Estamos organizando un festival.]
          - text: Errores comunes.
            examples:
              - ❌ *Soy cansado.* → ✅ *Estoy cansado.*
              - ❌ *Estoy profesor.* → ✅ *Soy profesor.*
      - id: rules-continuo
        type: ruleSummary
        skill: Estar + gerundio
        rules:
          - text: 'Usamos **estar + verbo en -ando / -iendo** para acciones en progreso.'
            examples:
              - Estoy estudiando español.
              - Mi comunidad está trabajando en un proyecto.
              - Ellos están organizando un evento cultural.
          - text: 'Conecta identidad (ser) y acción (estar + gerundio):'
            examples: [Soy estudiante y estoy aprendiendo español.]
      - id: rules-comparaciones
        type: ruleSummary
        skill: Comparaciones
        rules:
          - text: '**más … que** (+)'
            examples: [Mi comunidad es más grande que la tuya., Estoy más cansado que ayer.]
          - text: '**menos … que** (−)'
            examples: [Nuestra comunidad es menos diversa que la otra.]
          - text: '**tan … como** (=)'
            examples:
              - Mi comunidad es tan importante como la de mis amigos.
              - Mi ciudad es tan interesante como tu ciudad.
          - text: '**el / la más …** (lo máximo)'
            examples:
              [La comunidad estudiantil es la más activa., Nuestra comunidad es la más antigua.]
      - id: rules-futuro
        type: ruleSummary
        skill: El futuro
        rules:
          - text: '**Ir a + infinitivo**: planes y futuro cercano, muy común en la conversación.'
            examples:
              [
                Voy a vivir en otra ciudad.,
                Vamos a ayudar a más personas.,
                En 10 años voy a ser arquitecto.,
              ]
          - text: '**Futuro simple**: infinitivo + **-é, -ás, -á, -emos, -éis, -án**. Para planes, predicciones y proyecciones.'
            examples:
              [
                Seré profesor.,
                Estaremos en otro país.,
                Nuestra comunidad crecerá mucho.,
                Mi comunidad será más inclusiva.,
              ]
          - text: 'Recuerda: *va **a** ser*, no *va ser*.'
      - id: table-futuro
        type: table
        caption: El futuro
        header: [Persona, ir a + infinitivo, hablar, ser, tener]
        rows:
          - [yo, voy a hablar, hablaré, seré, tendré]
          - [tú, vas a hablar, hablarás, serás, tendrás]
          - [él / ella / usted, va a hablar, hablará, será, tendrá]
          - [nosotros / nosotras, vamos a hablar, hablaremos, seremos, tendremos]
          - [vosotros / vosotras, vais a hablar, hablaréis, seréis, tendréis]
          - [ellos / ellas / ustedes, van a hablar, hablarán, serán, tendrán]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: >-
          Gramática aplicada: Actividad 1 → ser vs. estar; Actividad 2 → comparaciones;
          Actividad 3 → futuro (ir a + infinitivo y futuro simple); Actividad 4 → ser,
          estar + gerundio, comparaciones y futuro en una misma descripción. Repasa las
          reglas con el grupo y pide un ejemplo nuevo para cada una.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: identidad-y-comunidad-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: >-
          Practica *ser*, *estar + gerundio*, comparaciones y futuro. Abre el chat con
          Mori, copia un mensaje y envíalo. Responde a todas las preguntas de Mori.
      - id: mori-presentacion
        type: aiTutorPrompt
        title: 1. Presentación personal (ser / estar)
        intro: 'Preséntate en 3 frases: **ser** para decir quién eres, **estar** para decir dónde estás y cómo estás hoy. Ejemplo: *Soy Marta. Soy profesora. Estoy en Tel Aviv y estoy feliz.*'
        message: >-
          ¡Hola Mori! Quiero practicar ser y estar. Voy a presentarme en 3 frases: quién
          soy, dónde estoy y cómo estoy hoy. Corrige mis errores, por favor, y después
          hazme preguntas. Mis frases son: ___
      - id: mori-continuo
        type: aiTutorPrompt
        title: 2. Estar + gerundio
        intro: 'Escribe 2 frases: ¿Qué estás haciendo ahora? ¿Qué está haciendo otra persona de tu familia o un amigo? Ejemplo: *Estoy estudiando español. Mi hermano está cocinando.*'
        message: >-
          ¡Hola Mori! Quiero practicar estar + gerundio. Te escribo qué estoy haciendo
          ahora y qué está haciendo otra persona. Corrige mis errores, por favor. Mis
          frases son: ___
      - id: mori-comparaciones
        type: aiTutorPrompt
        title: 3. Comparaciones
        intro: 'Haz 3 comparaciones: una con **más … que**, una con **menos … que** y una con **tan … como**. Ejemplo: *Mi ciudad es más grande que tu ciudad. Mi barrio es menos ruidoso que el centro. Mi familia es tan unida como la tuya.*'
        message: >-
          ¡Hola Mori! Quiero practicar comparaciones. Te escribo 3 comparaciones (más …
          que, menos … que, tan … como). Corrige mis errores y hazme más preguntas, por
          favor. Mis frases son: ___
      - id: mori-futuro
        type: aiTutorPrompt
        title: 4. El futuro
        intro: 'Imagina tu vida en 10 años. Escribe 3 frases: una con **ir a + infinitivo** y dos con el **futuro simple** (-é, -ás, -á, -emos, -éis, -án). Ejemplo: *Voy a viajar mucho. Trabajaré en otro país. Mi comunidad será más inclusiva.*'
        message: >-
          ¡Hola Mori! Quiero practicar el futuro. Imagino mi vida en 10 años: una frase
          con ir a + infinitivo y dos en futuro simple. Corrige mis errores, por favor.
          Mis frases son: ___
      - id: mori-verdadero-falso
        type: aiTutorPrompt
        title: 5. Juego «Verdadero o falso»
        intro: 'Ejemplo: *Soy estudiante. Soy francés. Estoy en Brasil. Estoy muy cansado.*'
        message: >-
          ¡Hola Mori! Vamos a jugar a «Verdadero o falso». Escribe 4 frases sobre ti (2
          con ser y 2 con estar). Una debe ser mentira. Yo intento adivinar cuál es.
          Después, yo escribo 4 frases y tú adivinas.
      - id: mori-reflexion
        type: aiTutorPrompt
        title: 6. Reflexión final
        message: >-
          ¡Hola Mori! Pregúntame: ¿Qué parte de tu identidad nunca va a cambiar? Voy a
          responder en una frase. Corrige mis errores, por favor.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: identidad-y-comunidad-practica
    book: workbook
    title: 'Práctica: Identidad y comunidad'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practica las tres habilidades del ciclo. Cada respuesta se corrige al momento, y puedes intentarlo otra vez.
      - id: ex-ser-estar
        type: activity
        activity: identidad-y-comunidad-ser-estar
      - id: ex-comparaciones
        type: activity
        activity: identidad-y-comunidad-comparaciones
      - id: ex-futuro
        type: activity
        activity: identidad-y-comunidad-futuro

