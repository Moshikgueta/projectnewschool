vocabulary:
  - slug: identidad-y-comunidad
    title: Identidad y comunidad
    items: *identidad-y-comunidad-words

activities:
  - slug: identidad-y-comunidad-ser-estar
    title: Ser y estar
    minutes: 8
    items:
      - id: estoy-cansada
        type: multipleChoice
        prompt: Hoy ___ cansada.
        options:
          - { text: estoy, correct: true }
          - {
              text: soy,
              feedback: '*Cansada* es un estado temporal: usa *estar* (*estoy cansada*).',
            }
          - { text: es, feedback: 'Hablas de ti (yo) y es un estado: *estoy cansada*.' }
      - id: soy-profesor
        type: multipleChoice
        prompt: ___ profesor.
        options:
          - { text: Soy, correct: true }
          - { text: Estoy, feedback: 'La profesión es identidad: usa *ser* (*soy profesor*).' }
          - { text: Está, feedback: 'La profesión va con *ser*, y para *yo* decimos *soy*.' }
      - id: soy-estoy
        type: fillBlank
        prompt: Completa con *soy* o *estoy*.
        text: Yo ___ argentino, pero ahora ___ en Tel Aviv.
        blanks: [[soy], [estoy]]
        wordBank: [soy, estoy]
      - id: soy-cansado
        type: trueFalse
        prompt: '*Soy cansado* es correcto.'
        answer: false
        feedback:
          correct: '¡Correcto! *Cansado* es un estado: *Estoy cansado.*'
          incorrect: 'Para un estado temporal usamos *estar*: *Estoy cansado.*'
      - id: une-usos
        type: matching
        prompt: Une cada frase con su uso.
        pairs:
          - [Soy argentina., nacionalidad (ser)]
          - [Soy profesora., profesión (ser)]
          - [Estoy en la clase., lugar (estar)]
          - [Estoy contenta hoy., estado (estar)]
          - [Estamos organizando un festival., acción en progreso (estar)]
      - id: esta-trabajando
        type: fillBlank
        prompt: Completa con *estar* + gerundio.
        text: Mi comunidad ___ trabajando en un proyecto. Ellos ___ organizando un evento cultural.
        blanks: [[está], [están]]
      - id: donde-estas
        type: multipleChoice
        prompt: ¿Dónde ___ ahora?
        options:
          - { text: estás, correct: true }
          - {
              text: eres,
              feedback: 'Para el lugar donde estás ahora usamos *estar*: *¿Dónde estás?*',
            }
          - { text: es, feedback: 'Preguntas a *tú* por un lugar: *¿Dónde estás?*' }
      - id: ordena-estudiante
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Soy estudiante y estoy aprendiendo español.

  - slug: identidad-y-comunidad-comparaciones
    title: 'Comparaciones: más, menos, tan … como'
    minutes: 8
    items:
      - id: mas-que
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: Mi comunidad es más grande que la tuya., correct: true }
          - {
              text: Mi comunidad es más grande como la tuya.,
              feedback: 'Con *más* usamos *que*: *más grande que*.',
            }
          - {
              text: Mi comunidad es tan grande que la tuya.,
              feedback: 'Con *tan* usamos *como*: *tan grande como*.',
            }
      - id: tan-como
        type: fillBlank
        prompt: Completa la comparación.
        text: Mi ciudad es tan interesante ___ tu ciudad.
        blanks: [[como]]
      - id: menos-que
        type: fillBlank
        prompt: Completa con *menos … que*.
        text: Nuestra comunidad es ___ diversa ___ la otra.
        blanks: [[menos], [que]]
      - id: mas-como
        type: trueFalse
        prompt: '*Mi familia es más grande como la tuya* es correcto.'
        answer: false
        feedback:
          correct: '¡Correcto! Decimos *más grande que la tuya*.'
          incorrect: 'Con *más* y *menos* usamos *que*: *más grande que la tuya*. *Como* va con *tan*.'
      - id: une-estructuras
        type: matching
        prompt: Une cada estructura con su significado.
        pairs:
          - [más … que, יותר … מ־]
          - [menos … que, פחות … מ־]
          - [tan … como, באותה מידה … כמו]
          - [el / la más, הכי]
      - id: la-mas-activa
        type: multipleChoice
        prompt: La comunidad estudiantil es ___ activa.
        options:
          - { text: la más, correct: true }
          - { text: el más, feedback: '*Comunidad* es femenino: *la más activa*.' }
          - {
              text: más que,
              feedback: 'No comparamos con otra cosa: es lo máximo, *la más activa*.',
            }
      - id: mas-alta
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: Soy más alta que mi hermano., correct: true }
          - { text: Soy más alta como mi hermano., feedback: 'Con *más* usamos *que*.' }
          - {
              text: Soy tan alta que mi hermano.,
              feedback: 'Con *tan* usamos *como*: *tan alta como*.',
            }
      - id: ordena-antigua
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Nuestra comunidad es la más antigua.

  - slug: identidad-y-comunidad-futuro
    title: 'El futuro: voy a vivir, seré'
    minutes: 8
    items:
      - id: voy-a-vivir
        type: multipleChoice
        prompt: En cinco años ___ vivir en otra ciudad.
        options:
          - { text: voy a, correct: true }
          - { text: voy, feedback: 'Falta *a*: *voy a + infinitivo* (*voy a vivir*).' }
          - { text: va a, feedback: 'Hablas de ti (yo): *voy a vivir*.' }
      - id: vamos-a
        type: fillBlank
        prompt: Completa.
        text: Vamos ___ ayudar a más personas. Ellos ___ a organizar un evento.
        blanks: [[a], [van]]
      - id: va-ser
        type: trueFalse
        prompt: '*Mi comunidad va ser más inclusiva* es correcto.'
        answer: false
        feedback:
          correct: '¡Correcto! Decimos *va a ser*.'
          incorrect: 'Falta *a*: *Mi comunidad va a ser más inclusiva.*'
      - id: une-ser
        type: matching
        prompt: Une cada persona con el futuro simple de *ser*.
        pairs:
          - [yo, seré]
          - [tú, serás]
          - [él / ella, será]
          - [nosotros, seremos]
          - [ellos / ellas, serán]
      - id: crecera
        type: fillBlank
        prompt: Escribe el verbo *crecer* en futuro simple.
        text: Nuestra comunidad ___ mucho.
        blanks: [[crecerá]]
      - id: estaremos
        type: multipleChoice
        prompt: En 2030 nosotros ___ en otro país.
        options:
          - { text: estaremos, correct: true }
          - {
              text: estarán,
              feedback: '*Estarán* es para *ellos / ellas*. Para *nosotros*: *estaremos*.',
            }
          - { text: estaré, feedback: '*Estaré* es para *yo*. Para *nosotros*: *estaremos*.' }
      - id: sere
        type: fillBlank
        prompt: Escribe el verbo *ser* en futuro simple.
        text: En 10 años (yo) ___ arquitecto.
        blanks: [[seré, yo seré]]
      - id: ordena-inclusiva
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Mi comunidad va a ser más inclusiva.
