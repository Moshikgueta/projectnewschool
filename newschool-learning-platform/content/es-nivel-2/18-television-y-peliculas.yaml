# Cycle "Televisión y películas", converted from the Spanish level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-2
slug: television-y-peliculas
title: Televisión y películas
goal: Repasar el pasado, el presente y el futuro, y contar historias con todos los tiempos.
position: 18
status: in_review

review:
  - >-
    The two workbook exercises ("Pasado, presente y futuro" and "Narrar con todos los
    tiempos") are NEW: the notebook has no self-study exercises. They were written
    from the cycle's two skills, its summary rules and its vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    Tense names translated from English were corrected: "Pasado simple (pretérito
    indefinido / imperfecto)" → "El pasado: pretérito indefinido e imperfecto"
    (Spanish has two past tenses, not one "simple past"); "Presente simple" →
    "Presente"; "Futuro simple (ir a + infinitivo / futuro simple)" → "El futuro: ir a
    + infinitivo y futuro simple" ("voy a ver" is the futuro perifrástico; "veré" is
    the futuro simple). A short rule on when to use indefinido (a finished, one-time
    action) vs. imperfecto (habits, descriptions in the past) was added to the summary,
    with a NEW table of ver / ir / ser. Activity titles saying "Pasado simple" /
    "Futuro simple" were adjusted the same way. Please confirm.
  - >-
    Corrections: "Television y peliculas" → "Televisión y películas"; "Los Simpsons" →
    "Los Simpson" (the Spanish title); "guión" → "guion" (RAE spelling since 2010);
    Mori Part 5 was missing its final full stop. Stray "ð" / "ð¹" characters were removed.
    Activity 4 "Analizamos el tráiler de Coco Futuro" → "Analizamos el tráiler de Coco
    (futuro)".
  - >-
    Activity 3 (Extra en español, episode 1) keeps its YouTube link. Activity 4 names
    "COCO - Tráiler - (Latinoamérica) (YouTube)" with no link; the teacher finds it
    (teacher note). Please add a YouTube link if you have one.
  - >-
    Activity 3 has questions for "A2 Bajo" and "A2 Alto"; they are kept as "Nivel
    básico" and "Nivel avanzado". The answers to the comprehension questions are not in
    the source; please check them against the episode.
  - >-
    The source has no class plan (which activities to choose) and 8 activities; the
    plan note maps them to the two skills and suggests choosing 2–3. Activity 2 ends
    with empty "Pareja 1/2/3" lines; they are replaced by answer boxes. The
    "Respuesta de alumno 1/2/3" lines are removed (answer boxes).
  - >-
    Film titles are kept as in the source, some in English (Poor Things, Inside Out 2,
    Friends, Stranger Things). Their Spanish titles are "Pobres criaturas" and
    "Intensamente 2" / "Del revés 2"; change them if you prefer.
  - >-
    Vocabulary: "Opinión" appears twice in the source; it is kept once. "Acción"
    "פעולה" → "אקשן (פעולה)"; "Favorito" "מועדף" → "אהוב / מועדף"; "Mirar" "לצפות" →
    "להסתכל / לצפות". There is no vocabulary-list Quizlet link besides the one at the
    top (kept without "?new").
  - >-
    Times given as ranges are recorded as the upper value: Activity 4 "25–30 minutos"
    → 30. Other activities give only stage times, which are in the steps.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: television-y-peliculas-clase
    title: 'Clase: Televisión y películas'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Televisión y películas
      - id: skills
        type: cycleOverview
        skills:
          - name: Pasado, presente y futuro
            description: 'Repaso de los tiempos: *vi, miraba, miro, voy a ver, veré*'
          - name: Narrar con todos los tiempos
            description: '*Ayer Miguel fue al cine. Ahora compra palomitas. Mañana va a ver otra película.*'
      - id: quizlet
        type: externalLink
        label: Televisión y películas en Quizlet
        url: https://quizlet.com/br/1071343088/espanol-conversacional-peliculas-y-tv-actualizado-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___. Cuando era niño / niña, mi película favorita era ___. Ahora mi película favorita es ___.
        example: Soy Marta. Cuando era niña, mi película favorita era La Bella y la Bestia. Ahora mi película favorita es Poor Things.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de preparación
      - id: warmup-pasado
        type: discussionQuestions
        title: Pasado
        items:
          - question: ¿Qué película mirabas mucho cuando eras niño / niña?
            frame: Cuando era niño / niña miraba ___ muchas veces.
          - question: ¿Cuál fue la primera película que viste en el cine?
            frame: La primera película que vi en el cine fue ___.
          - question: ¿Cuál fue la última serie que viste?
            frame: La última serie que vi fue ___.
          - question: ¿Con quién viste la última película o serie?
            frame: La vi con ___.
          - question: ¿Fuiste al cine el mes pasado? ¿Qué viste?
            frame: Sí, fui al cine y vi ___. / No, no fui al cine.
          - question: ¿Qué programa de televisión mirabas cuando eras adolescente?
            frame: Cuando era adolescente miraba ___.
          - question: ¿Qué película viste muchas veces en el pasado?
            frame: Vi ___ muchas veces.
      - id: warmup-futuro
        type: discussionQuestions
        title: Futuro
        items:
          - question: ¿Qué película vas a ver esta semana?
            frame: Voy a ver ___ esta semana.
          - question: ¿Vas a ir al cine el próximo fin de semana? ¿Qué película verás?
            frame: Sí, voy a ir al cine y veré ___.
          - question: ¿Vas a mirar una serie nueva pronto? ¿Cuál?
            frame: Sí, voy a mirar ___.
          - question: ¿Con quién vas a ver tu próxima película o serie?
            frame: Voy a verla con ___.
          - question: ¿Qué aperitivos vas a comer en tu próxima noche de cine?
            frame: Voy a comer ___.
          - question: ¿Vas a mirar una película en otro idioma en el futuro? ¿Cuál?
            frame: Sí, voy a mirar una película en ___.
          - question: ¿Qué género de película vas a elegir la próxima vez (comedia, acción, terror…)?
            frame: Voy a elegir una ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Mi última película (pasado)'
        skills: [Pasado, presente y futuro, Narrar con todos los tiempos]
        steps:
          - Escribe **5 frases en pasado** sobre la última película o serie que viste. Usa las preguntas guía (7 minutos).
          - 'En parejas, pregunta y responde (10 minutos). Añade dos preguntas de opinión: ¿Cuál fue tu personaje favorito? ¿Qué aprendiste de la película?'
          - Presenta a tu compañero al grupo en **tercera persona** (5 minutos).
        example: |-
          *La última película que vi fue Encanto. La vi en mi casa con mi hermana. Trataba de una familia mágica. La historia fue divertida y la música fue bonita. Me gustó mucho porque fue interesante.*
          A: *¿Cuál fue la última película que viste?* — B: *Vi Titanic en el cine.*
          A: *¿Qué pasó en la historia?* — B: *Un barco grande viajó y luego se hundió. Fue muy triste.*
          *Mi compañero vio Titanic. La vio en el cine con su familia. La historia fue muy triste y le gustó mucho.*
      - id: act1-questions
        type: discussionQuestions
        title: Preguntas guía
        items:
          - question: ¿Qué viste?
            frame: La última película que vi fue ___.
          - question: ¿Dónde la viste?
            frame: La vi en ___.
          - question: ¿Con quién la viste?
            frame: La vi con ___.
          - question: ¿Qué pasó en la historia? (2–3 frases simples)
          - question: ¿Te gustó o no? ¿Por qué?
            frame: Me gustó / No me gustó porque ___.
      - id: act2
        type: classActivity
        title: 'Actividad 2: Planes para una noche de cine (futuro)'
        skills: [Pasado, presente y futuro]
        steps:
          - En grupos pequeños, planeen juntos una «noche de cine». Elijan 6 preguntas guía y respóndanlas.
          - Organicen sus respuestas en un pequeño texto y preséntenlo al grupo.
          - 'Opcional: comparen sus planes con los de otro grupo.'
        example: |-
          *El viernes por la noche vamos a ver Harry Potter en la casa de Pedro. Vamos a invitar a nuestros amigos de la escuela. Vamos a comer pizza y helado y vamos a beber refrescos. Todos vamos a usar pijamas. Vamos a escuchar música antes de la película y después vamos a bailar. Los invitados van a traer palomitas y cojines. Vamos a decorar la sala con luces.*
          *El grupo A va a comer más cosas que el grupo B. El grupo B va a decorar la casa, pero el grupo A no.*
      - id: act2-questions
        type: discussionQuestions
        title: Preguntas guía
        items:
          - question: ¿Qué película van a ver?
          - question: ¿Dónde la van a ver? (cine, casa, aire libre…)
          - question: ¿Cuándo será la noche de cine? (día y hora)
          - question: ¿Con quién la van a ver? (amigos, familia, compañeros)
          - question: ¿A quién van a invitar?
          - question: ¿Qué van a comer?
          - question: ¿Qué van a beber?
          - question: ¿Qué ropa van a usar? (pijamas, ropa elegante, normal)
          - question: ¿Qué música van a escuchar antes o después de la película?
          - question: ¿Qué van a hacer después de la película? (hablar, bailar, jugar, dormir)
          - question: ¿Qué van a llevar los invitados? (comida, bebida, almohadas)
          - question: ¿Cómo van a decorar el lugar? (luces, cojines, mantas, nada)
      - id: act3
        type: classActivity
        title: 'Actividad 3: Analizamos una escena en pasado (Extra en español)'
        skills: [Pasado, presente y futuro, Narrar con todos los tiempos]
        steps:
          - 'Pregunta de inicio: ¿Alguna vez recibiste un visitante extranjero? ¿Fue fácil o difícil comunicarse?'
          - Mira el fragmento (minutos 0:00–4:00) con subtítulos en español. Anota dos cosas que entiendas.
          - Responde a las preguntas de comprensión con frases completas en **pasado** (8 minutos).
          - En parejas, discute las preguntas de detalle y comparación (3 minutos). Comparte una respuesta con el grupo.
          - Da tu opinión sobre las preguntas finales (7 minutos).
          - Escribimos juntos un resumen de la escena en pasado.
        example: '*Lola recibió cartas. Ana estaba en el piso. Sam llegó de Estados Unidos. No hablaba bien español. Las chicas se sorprendieron mucho.*'
        resource:
          label: 'Extra en español, episodio 1: Sam llega a España'
          url: https://www.youtube.com/watch?v=VzWCYdTNNlo
      - id: act3-comprension
        type: callout
        tone: info
        title: Comprensión – dos niveles
        text: >-
          Nivel básico: preguntas cortas, respuestas cortas en pasado. Nivel avanzado:
          respuestas más largas, con descripción (imperfecto) y comparaciones.
      - id: act3-basico
        type: discussionQuestions
        title: Comprensión – nivel básico
        items:
          - question: ¿Qué cartas recibió Lola?
          - question: ¿Quién llegó al piso?
          - question: ¿De dónde vino Sam?
          - question: ¿Qué problema tenía con el español?
          - question: ¿Cómo reaccionaron Lola y Ana?
      - id: act3-avanzado
        type: discussionQuestions
        title: Comprensión – nivel avanzado
        items:
          - question: ¿Qué hacía Ana antes de que Sam llegara?
          - question: ¿Qué pensaban Lola y Ana de Sam al principio?
          - question: ¿Cómo describirías la manera de hablar de Sam?
      - id: act3-parejas-basico
        type: discussionQuestions
        title: En parejas – nivel básico
        items:
          - question: ¿Qué llevaba Sam?
          - question: ¿Fue graciosa la escena? ¿Por qué?
          - question: ¿Qué personaje te gustó más?
      - id: act3-parejas-avanzado
        type: discussionQuestions
        title: En parejas – nivel avanzado
        items:
          - question: ¿Sam hablaba mejor o peor que tú en español?
          - question: ¿Su ropa era más elegante o más rara que la tuya?
          - question: ¿La reacción de Lola fue más tranquila o más exagerada que la de Ana?
      - id: act3-opiniones
        type: discussionQuestions
        title: Opiniones finales
        items:
          - question: ¿Por qué crees que Sam quería vivir en España?
          - question: ¿Qué consejo le darías para mejorar su español?
          - question: ¿Cómo reaccionarías tú si un extranjero llegara a tu casa hablando poco español?
      - id: act4
        type: classActivity
        title: 'Actividad 4: Analizamos el tráiler de Coco (futuro)'
        skills: [Pasado, presente y futuro]
        minutes: 30
        steps:
          - 'Mira el tráiler de *Coco* sin subtítulos (5 minutos). Escucha y observa: ¿Qué va a pasar en la historia? ¿Quién es el protagonista?'
          - Responde a las preguntas con **ir a + infinitivo** (10 minutos).
          - Leemos en voz alta, por turnos, un texto corto en futuro con las respuestas (7 minutos).
          - 'Opinión: ¿Te gustó el tráiler? ¿Por qué?'
          - 'Comparación: ¿Este tráiler te parece mejor que otro que viste? ¿Cuál?'
          - 'Juego en parejas: uno pregunta «¿Qué va a hacer Miguel?», el otro responde. Luego cambian.'
        example: |-
          *Miguel va a viajar al Mundo de los Muertos. Va a usar la guitarra de Ernesto de la Cruz para tocar música. Él y Héctor van a descubrir la verdadera historia de su familia. Miguel va a seguir su pasión por la música. Su música va a cambiar la forma de pensar de su familia.*
          *Sí, me gustó porque fue emocionante.*
          *Me pareció mejor que el tráiler de Frozen porque es más emocionante.*
      - id: act4-questions
        type: discussionQuestions
        title: Preguntas en futuro
        items:
          - question: ¿Qué va a suceder con Miguel?
            frame: Miguel va a ___.
          - question: ¿Qué va a hacer Miguel con la guitarra de Ernesto de la Cruz?
            frame: Va a ___.
          - question: ¿Qué van a descubrir Miguel y Héctor juntos?
            frame: Van a descubrir ___.
          - question: ¿Qué va a pasar con la pasión de Miguel por la música?
            frame: Él va a ___.
          - question: ¿Cómo va a afectar el futuro de Miguel a su familia?
            frame: Su música va a ___.
      - id: act5
        type: classActivity
        title: 'Actividad 5: La peor o la mejor película que he visto (pasado)'
        skills: [Pasado, presente y futuro, Narrar con todos los tiempos]
        steps:
          - Piensa en la mejor o la peor película que viste en tu vida. Escribe 4–5 frases en pasado (4 minutos).
          - En parejas, pregunta y responde (8 minutos).
          - Presenta a tu compañero al grupo en tercera persona (5 minutos).
        example: |-
          *Vi Avatar en el cine. La historia fue larga, pero los efectos fueron increíbles.*
          *Mi compañero vio Titanic en el cine con su hermana. Fue muy triste, pero le gustó mucho.*
      - id: act5-questions
        type: discussionQuestions
        items:
          - question: ¿Qué película viste?
          - question: ¿Dónde la viste?
          - question: ¿Con quién la viste?
          - question: ¿Qué pasó en la historia?
          - question: ¿Por qué fue la mejor / la peor película?
      - id: act6
        type: classActivity
        title: 'Actividad 6: El estreno del futuro (futuro)'
        skills: [Pasado, presente y futuro]
        steps:
          - En grupos pequeños, son críticos de cine. Inventen una película nueva que **se va a estrenar** la próxima semana (5 minutos).
          - Preparen la sinopsis con las preguntas de abajo, en futuro (8 minutos).
          - Cada grupo presenta su película (7 minutos). La clase vota cuál va a ser la película más exitosa.
        example: '*La película se va a llamar «La última noche». Va a ser de acción. Los protagonistas van a viajar por el mundo y van a salvar a la humanidad.*'
      - id: act6-questions
        type: discussionQuestions
        title: Nuestra película
        items:
          - question: ¿Cómo se va a llamar la película?
            frame: La película se va a llamar ___.
          - question: ¿De qué género va a ser? (comedia, terror, aventura…)
            frame: Va a ser de ___.
          - question: ¿Qué va a pasar en la historia?
          - question: ¿Quiénes van a ser los protagonistas?
            frame: Los protagonistas van a ser ___.
          - question: ¿Qué va a hacer el público después de verla?
      - id: act7
        type: classActivity
        title: 'Actividad 7: Reescribir el final de la película (pasado y futuro)'
        skills: [Narrar con todos los tiempos]
        steps:
          - 'En grupos de 3–4, reciben una película conocida (por ejemplo: *Titanic, Coco, Harry Potter, Frozen*).'
          - 'Preparen una mini presentación (15 minutos): un resumen breve en **pasado** (inicio, desarrollo y final real) y un final nuevo en **futuro**.'
          - Presenten su versión (7 minutos por grupo). La clase hace 1–2 preguntas.
        example: |-
          *En Titanic, el barco se hundió y Jack murió. Pero en nuestro final alternativo, Jack va a sobrevivir y va a viajar con Rose a América.*
          *¿Por qué va a pasar esto? ¿Qué van a hacer los personajes después?*
      - id: act8
        type: classActivity
        title: 'Actividad 8: Escribe tu propio guion (pasado, presente y futuro)'
        skills: [Narrar con todos los tiempos]
        steps:
          - Tu profesor dice la primera frase en pasado.
          - 'Por turnos, cada estudiante añade una frase, pero **cambia el tiempo verbal**: si la frase anterior está en pasado, la nueva está en presente o en futuro.'
          - El último estudiante cierra la historia con una frase final (puede ser en futuro).
          - La clase lee el guion completo en voz alta y busca **3 errores** con los tiempos verbales (7 minutos).
          - '¿Sería una buena película o serie? ¿Por qué sí o no?'
        example: |-
          Estudiante 1: *Ayer Miguel fue al cine con sus amigos.*
          Estudiante 2: *Ahora compra palomitas y refrescos.*
          Estudiante 3: *Mañana va a ver otra película con su familia.*
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Pasado, presente y futuro** (preguntas de
          preparación, Actividades 1, 2, 4, 5 y 6) y **Narrar con todos los tiempos**
          (Actividades 1, 3, 5, 7 y 8). El cuaderno tiene 8 actividades: elige 2–3 según
          el tiempo y el grupo.
      - id: n-intro
        anchor: intro
        text: Da tu propio ejemplo primero y después pregunta a cada estudiante.
      - id: n-warmup
        anchor: warmup-pasado
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act1
        anchor: act1
        text: >-
          Etapa 1: producción individual (5–7 min). Etapa 2: entrevista en parejas (7–10
          min). Etapa 3: presentación al grupo en tercera persona (5 min).
      - id: n-act3
        anchor: act3
        text: >-
          Introducción (3 min): «Hoy vamos a ver un fragmento de la serie *Extra en
          español*. Sam es un chico de Estados Unidos que llega a España.» Pon el video
          (0:00–4:00) con subtítulos en español; si hace falta, repítelo sin subtítulos.
          Comprensión (7–8 min): elige 3–4 preguntas según el nivel. Parejas (7–8 min).
          Opiniones (5–7 min): respuestas más largas en el nivel avanzado, frases cortas
          en el básico. Cierre (2–3 min): escribe la mini narración colectiva en la
          pizarra.
      - id: n-act4
        anchor: act4
        text: >-
          Material: tráiler oficial «COCO - Tráiler - (Latinoamérica)» en YouTube (el
          cuaderno no tiene el enlace; búscalo antes de la clase). Muestra el tráiler
          completo sin subtítulos. Con las respuestas de los estudiantes, escribe en la
          pizarra el texto modelo y pide leerlo en voz alta por turnos.
      - id: n-act6
        anchor: act6
        text: Trabajo en grupos (5 min), sinopsis (7–8 min), presentación (5–7 min) y votación.
      - id: n-act7
        anchor: act7
        text: Asigna a cada grupo una película conocida por todos. Preparación 10–15 minutos; presentación 5–7 minutos por grupo.
      - id: n-act8
        anchor: act8
        text: >-
          Empieza con *Ayer Miguel fue al cine con sus amigos.* En la revisión (5–7 min),
          identifica con la clase 3 errores comunes con los tiempos verbales.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: television-y-peliculas-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-tiempos
        type: ruleSummary
        skill: Pasado, presente y futuro
        rules:
          - text: '**Pretérito indefinido**: una acción terminada, que pasó una vez (con *ayer, el mes pasado, la primera vez…*).'
            examples:
              - La primera película que vi en el cine fue Shrek.
              - La última serie que vi fue Friends.
              - Fui al cine el mes pasado y vi Barbie.
          - text: '**Pretérito imperfecto**: hábitos y descripciones en el pasado (con *cuando era niño, siempre, muchas veces…*).'
            examples:
              [
                Cuando era niño miraba Toy Story muchas veces.,
                Cuando era niña mi película favorita era La Bella y la Bestia.,
              ]
          - text: '**Presente**: opiniones y gustos de ahora, y comparaciones.'
            examples:
              - Ahora mi película favorita es Poor Things.
              - Me gusta esta película porque es interesante.
              - Sam habla peor que yo en español.
          - text: '**Ir a + infinitivo**: planes. **Futuro simple** (-é, -ás, -á, -emos, -éis, -án): planes y predicciones.'
            examples:
              - Voy a ver Los Vengadores esta semana.
              - Sí, voy a ir al cine y veré Inside Out 2.
              - Vamos a comer pizza y helado en la noche de cine.
              - Miguel va a viajar al Mundo de los Muertos.
      - id: table-tiempos
        type: table
        caption: 'Ver, ir y ser en cuatro tiempos'
        header: [Persona, indefinido, imperfecto, presente, futuro simple]
        rows:
          - [yo, vi · fui · fui, veía · iba · era, veo · voy · soy, veré · iré · seré]
          - [
              tú,
              viste · fuiste · fuiste,
              veías · ibas · eras,
              ves · vas · eres,
              verás · irás · serás,
            ]
          - [él / ella, vio · fue · fue, veía · iba · era, ve · va · es, verá · irá · será]
          - [
              nosotros,
              vimos · fuimos · fuimos,
              veíamos · íbamos · éramos,
              vemos · vamos · somos,
              veremos · iremos · seremos,
            ]
          - [
              ellos / ellas,
              vieron · fueron · fueron,
              veían · iban · eran,
              ven · van · son,
              verán · irán · serán,
            ]
      - id: rules-narrativa
        type: ruleSummary
        skill: Narrar con todos los tiempos
        rules:
          - text: 'Para contar el argumento de una película, usa el **indefinido** para las acciones y el **imperfecto** para describir.'
            examples: [Un barco grande viajó y luego se hundió., Trataba de una familia mágica.]
          - text: 'Combina pasado, presente y futuro para un relato más completo. Las palabras de tiempo ayudan: *ayer* → pasado, *ahora* → presente, *mañana* → futuro.'
            examples:
              - Ayer Miguel fue al cine con sus amigos. (pasado)
              - Ahora compra palomitas. (presente)
              - Mañana va a ver otra película. (futuro)
          - text: 'Para un final alternativo: el final real en pasado y el final nuevo en futuro.'
            examples:
              [
                El barco se hundió y Jack murió. Pero en nuestro final Jack va a sobrevivir y va a viajar con Rose a América.,
              ]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: >-
          Funciones practicadas: hablar de películas y series vistas, describir costumbres
          de la niñez, narrar el argumento de una película, hablar de gustos presentes,
          comparar personajes o películas, dar opiniones, planear una noche de cine,
          inventar una película, reescribir finales, predecir qué pasará con los
          personajes y escribir un guion colectivo. Repasa las reglas y pide un ejemplo
          nuevo para cada una.

