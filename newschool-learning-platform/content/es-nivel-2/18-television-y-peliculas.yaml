activities:
  - slug: television-y-peliculas-tiempos
    title: 'Pasado, presente y futuro: vi, miraba, veo, voy a ver'
    minutes: 8
    items:
      - id: primera-vi
        type: multipleChoice
        prompt: La primera película que ___ en el cine fue Shrek.
        options:
          - { text: vi, correct: true }
          - {
              text: veía,
              feedback: 'Es una acción terminada que pasó una vez (la primera película): usa el indefinido, *vi*.',
            }
          - { text: voy a ver, feedback: 'Habla del pasado (*fue*): usa el indefinido, *vi*.' }
      - id: era-nina
        type: fillBlank
        prompt: Completa con el verbo *ser* en imperfecto.
        text: Cuando ___ niña, mi película favorita ___ La Bella y la Bestia.
        blanks: [[era, yo era], [era]]
      - id: imperfecto-habito
        type: trueFalse
        prompt: 'Para hábitos de la infancia usamos el imperfecto: *Cuando era niño miraba Toy Story muchas veces.*'
        answer: true
        feedback:
          correct: ¡Correcto! *Miraba* es un hábito en el pasado.
          incorrect: 'Los hábitos en el pasado van en imperfecto: *miraba*, *veía*, *era*.'
      - id: fui-cine
        type: fillBlank
        prompt: Escribe el verbo *ir* en pretérito indefinido.
        text: El mes pasado (yo) ___ al cine y vi Barbie.
        blanks: [[fui, yo fui]]
      - id: une-tiempos
        type: matching
        prompt: Une cada frase con su tiempo.
        pairs:
          - [Ayer vi una serie., pretérito indefinido]
          - [De niño miraba dibujos animados., pretérito imperfecto]
          - [Ahora mi película favorita es Coco., presente]
          - [Mañana voy a ver una película., ir a + infinitivo]
          - [El sábado veré Inside Out 2., futuro simple]
      - id: ahora-es
        type: multipleChoice
        prompt: Ahora mi película favorita ___ Poor Things.
        options:
          - { text: es, correct: true }
          - { text: fue, feedback: '*Ahora* habla del presente: *es*.' }
          - { text: era, feedback: '*Era* es pasado. Con *ahora* usamos el presente: *es*.' }
      - id: vere
        type: multipleChoice
        prompt: Sí, el próximo fin de semana voy a ir al cine y ___ Inside Out 2.
        options:
          - { text: veré, correct: true }
          - { text: vi, feedback: '*El próximo fin de semana* es futuro: *veré* (o *voy a ver*).' }
          - { text: veía, feedback: '*Veía* es pasado. Para el futuro: *veré* (o *voy a ver*).' }
      - id: ordena-friends
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: La última serie que vi fue Friends.

  - slug: television-y-peliculas-narrativa
    title: 'Narrar con todos los tiempos: ayer, ahora, mañana'
    minutes: 8
    items:
      - id: ayer-fue
        type: multipleChoice
        prompt: Ayer Miguel ___ al cine con sus amigos.
        options:
          - { text: fue, correct: true }
          - { text: va, feedback: '*Ayer* es pasado: *fue*.' }
          - { text: va a ir, feedback: '*Ayer* es pasado, no futuro: *fue*.' }
      - id: ahora-compra
        type: multipleChoice
        prompt: Ahora Miguel ___ palomitas y refrescos.
        options:
          - { text: compra, correct: true }
          - { text: compró, feedback: '*Ahora* es presente: *compra*.' }
          - { text: compraba, feedback: '*Compraba* es pasado. Con *ahora*: *compra*.' }
      - id: manana-va
        type: fillBlank
        prompt: Completa con *ir a + infinitivo*.
        text: Mañana Miguel ___ a ver otra película con su familia.
        blanks: [[va]]
      - id: indefinido-accion
        type: trueFalse
        prompt: 'En *Un barco grande viajó y luego se hundió*, los verbos están en pretérito indefinido porque son acciones terminadas.'
        answer: true
        feedback:
          correct: ¡Correcto! *Viajó* y *se hundió* son acciones de la historia.
          incorrect: '*Viajó* y *se hundió* son acciones terminadas: pretérito indefinido.'
      - id: final-alternativo
        type: fillBlank
        prompt: 'Completa: el final real en pasado, el final nuevo en futuro.'
        text: En Titanic, el barco se ___ (hundir) y Jack murió. Pero en nuestro final, Jack ___ a sobrevivir.
        blanks: [[hundió], [va]]
      - id: companero-vio
        type: multipleChoice
        prompt: Mi compañero ___ Titanic con su familia y le gustó mucho.
        options:
          - { text: vio, correct: true }
          - { text: vi, feedback: '*Vi* es para *yo*. Para *mi compañero* (él): *vio*.' }
          - { text: ve, feedback: '*Le gustó* está en pasado: *vio*.' }
      - id: une-preguntas
        type: matching
        prompt: Une cada pregunta con su respuesta.
        pairs:
          - [¿Qué viste?, Vi Encanto.]
          - [¿Dónde la viste?, En mi casa.]
          - [¿Con quién la viste?, Con mi hermana.]
          - [¿Qué vas a ver esta semana?, Voy a ver Los Vengadores.]
          - [¿Te gustó?, 'Sí, me gustó mucho.']
      - id: ordena-titanic
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Mi compañero vio Titanic en el cine.
