vocabulary:
  - slug: mi-vida-en-pasado
    title: Mi vida en pasado
    items: *mi-vida-en-pasado-words

activities:
  - slug: mi-vida-en-pasado-preguntas
    title: 'Preguntas en pasado: ¿Qué desayunaste?'
    minutes: 8
    items:
      - id: desayunaste
        type: multipleChoice
        prompt: 'Respuesta: *Ayer desayuné pan con café.* ¿Cuál es la pregunta?'
        options:
          - { text: ¿Qué desayunaste ayer?, correct: true }
          - {
              text: ¿Qué desayunas ayer?,
              feedback: '*Desayunas* es presente. Con *ayer* usamos el pasado: *¿Qué desayunaste?*',
            }
          - {
              text: ¿Con quién desayunaste ayer?,
              feedback: 'La respuesta no dice con quién, dice qué: *pan con café*. Pregunta con *qué*.',
            }
      - id: une-preguntas
        type: matching
        prompt: Une cada respuesta con su pregunta.
        pairs:
          - [Ayer hablé con mi mejor amigo., ¿Con quién hablaste ayer?]
          - [Hace tres días visité a mis abuelos., ¿A quién visitaste hace tres días?]
          - [El mes pasado compré un celular nuevo., ¿Qué compraste el mes pasado?]
          - [En mis vacaciones viajé a España., ¿Adónde viajaste en tus vacaciones?]
          - [El fin de semana pasado cociné pasta., ¿Qué cocinaste el fin de semana pasado?]
      - id: viste-semana
        type: fillBlank
        prompt: Completa la pregunta con el verbo en pasado.
        text: La semana pasada vi una película. → ¿Qué ___ la semana pasada?
        blanks: [[viste]]
      - id: empezaste
        type: fillBlank
        prompt: Completa la pregunta con el verbo *empezar* en pasado.
        text: El año pasado empecé un curso de inglés. → ¿Qué curso ___ el año pasado?
        blanks: [[empezaste]]
      - id: hacias
        type: multipleChoice
        prompt: Quieres preguntar por un hábito de la infancia. ¿Qué pregunta usas?
        options:
          - { text: ¿Qué hacías cuando eras niño?, correct: true }
          - {
              text: ¿Qué hiciste cuando eras niño?,
              feedback: 'Para hábitos y descripciones del pasado usamos el imperfecto: *¿Qué hacías?*',
            }
          - {
              text: ¿Qué haces cuando eras niño?,
              feedback: '*Haces* es presente. Para un hábito del pasado usamos *hacías*.',
            }
      - id: como-era
        type: trueFalse
        prompt: 'Para preguntar cómo era tu escuela, usamos el imperfecto: *¿Cómo era tu escuela?*'
        answer: true
        feedback:
          correct: ¡Correcto! Las descripciones del pasado van en imperfecto.
          incorrect: 'Las descripciones del pasado van en imperfecto: *¿Cómo era tu escuela?*'
      - id: hiciste-mes
        type: fillBlank
        prompt: Completa la pregunta con el verbo *hacer* en pasado (indefinido).
        text: ¿Qué ___ el mes pasado? — Viajé a Italia.
        blanks: [[hiciste]]
      - id: ordena-naciste
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: ¿Dónde naciste y dónde creciste?

  - slug: mi-vida-en-pasado-personas
    title: 'Yo, tú, él: comí, comiste, comió'
    minutes: 8
    items:
      - id: une-personas
        type: matching
        prompt: Une cada persona y verbo con su forma en pasado.
        pairs:
          - [yo (ir), fui]
          - [tú (comer), comiste]
          - [él (hacer), hizo]
          - [yo (hablar), hablé]
          - [ella (ver), vio]
      - id: companero-nacio
        type: multipleChoice
        prompt: 'Tu compañero dice: *Nací en Haifa.* Lo cuentas al grupo: Mi compañero ___ en Haifa.'
        options:
          - { text: nació, correct: true }
          - { text: nací, feedback: '*Nací* es para *yo*. Para tu compañero (él) usamos *nació*.' }
          - {
              text: naciste,
              feedback: '*Naciste* es para *tú*. Para tu compañero (él) usamos *nació*.',
            }
      - id: hizo
        type: multipleChoice
        prompt: ¿Qué hizo tu hermana ayer? — Mi hermana ___ una película.
        options:
          - { text: vio, correct: true }
          - { text: vi, feedback: '*Vi* es para *yo*. Para *ella* usamos *vio*.' }
          - {
              text: veía,
              feedback: 'Es una acción de ayer, puntual y terminada: usamos el indefinido, *vio*.',
            }
      - id: desayuno-fue
        type: fillBlank
        prompt: 'Tu compañero dice: *Desayuné café y fui al supermercado.* Completa el reporte.'
        text: Mi compañero ___ café y ___ al supermercado.
        blanks: [[desayunó], [fue]]
      - id: tercera
        type: trueFalse
        prompt: '*Él comió pizza ayer* está en tercera persona.'
        answer: true
        feedback:
          correct: ¡Correcto! *Él comió* = tercera persona. *Yo comí* = primera, *¿Tú comiste?* = segunda.
          incorrect: '*Él / ella* es la tercera persona: *él comió*.'
      - id: jugaba-ella
        type: multipleChoice
        prompt: Cuando era niña, mi compañera siempre ___ al baloncesto.
        options:
          - { text: jugaba, correct: true }
          - {
              text: jugó,
              feedback: '*Siempre* y *cuando era niña* hablan de un hábito: usamos el imperfecto, *jugaba*.',
            }
          - { text: jugabas, feedback: '*Jugabas* es para *tú*. Para *ella* usamos *jugaba*.' }
      - id: hice-hiciste
        type: fillBlank
        prompt: Completa con el verbo *hacer* en pasado.
        text: —¿Qué ___ tú el sábado? —Yo ___ una pizza. Y mi hermano ___ un pastel.
        blanks: [[hiciste], [hice], [hizo]]
        wordBank: [hice, hiciste, hizo]
      - id: ordena-reporte
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Mi compañero fue al cine y vio una película.
