# Cycle "Redes sociales (futuro)", converted from the Spanish level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-2
slug: redes-sociales-futuro
title: Redes sociales (futuro)
goal: Hablar del futuro de las redes sociales con ir a + infinitivo y hacer comparaciones.
position: 19
status: in_review

review:
  - >-
    The two workbook exercises ("Futuro con ir a + infinitivo" and "Comparaciones")
    are NEW: the notebook has no self-study exercises. They were written from the
    cycle's two skills, its summary rules and its vocabulary. Please check level,
    wording and every right answer before students see them.
  - >-
    Skills: the "Información general" of this cycle lists "Comparaciones" and
    "Pasado simple (pretérito indefinido)", copied from the "Redes sociales PASADO"
    cycle. Every activity, the grammar summary and the homework of this cycle
    practise the future with "ir a + infinitivo" and comparisons, so the skills
    are written as "Futuro con ir a + infinitivo" and "Comparaciones". Please confirm.
  - >-
    Terminology: the notebook calls "voy a + infinitivo" "futuro simple". In
    Spanish grammar "futuro simple" is the form "usaré, serán"; "ir a + infinitivo"
    is the periphrastic future. The rule is now called "Futuro con ir a +
    infinitivo", the conjugation of "ir" (voy, vas, va, vamos, vais, van) was added
    as a table, and the futuro simple is mentioned only as an option in the debate.
  - >-
    Comparisons summary: "El/la más + adjetivo" was corrected to "el/la + nombre +
    más/menos + adjetivo" (la aplicación más adictiva). Two rules were added that
    the activities already use: "más/menos + nombre + que" (más fotos que) and
    "verbo + más/menos que" (va a ayudar más que). Next to "igual de + adjetivo +
    que" the standard form "tan + adjetivo + como" was added.
  - >-
    Corrections: introduction frame "hicieron nuestra vida [mejor / peor / no
    cambiaron nada]" → "hicieron nuestra vida mejor / peor" or "no cambiaron
    nada"; "¿Por que?" → "¿Por qué?"; Activity 2 "elija una de las opciones" →
    "elige una opción"; "mantenerse en contacto con amigos y familiares" →
    "mantenerme en contacto con mis amigos y mi familia"; "Mi perfil de red social
    estará en" → "va a estar en" (to practise the cycle's skill); tip 5 "Comparar
    redes en tu propio idioma y en español" → "Comparar redes sociales en español".
  - >-
    Activity 5 (debate) repeats its instructions three times (Instrucciones,
    Grupos, Pasos); they are kept once. Activity 2 is labelled "Nivel 1" but the
    notebook has no other level for it; the label was dropped.
  - >-
    Activity 1's "Variante (opcional)" (screenshot and vote) is kept as a teacher
    note. The source gives a time only for Activity 2 (15 minutes).
  - >-
    Vocabulary: "Conectar, להתחבר" → "Conectar(se), לחבר / להתחבר" ("conectar" is
    "to connect something"); "Escuchar" → "להקשיב / לשמוע". The Quizlet link is
    kept as it is. The "Respuesta de alumno 1/2/3" lines are replaced by the
    optional answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: redes-sociales-futuro-clase
    title: 'Clase: Redes sociales (futuro)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Redes sociales (futuro)
      - id: skills
        type: cycleOverview
        skills:
          - name: Futuro con ir a + infinitivo
            description: '*Voy a usar… / Las redes sociales van a ser…*'
          - name: Comparaciones
            description: '*más / menos… que, el / la más, el / la menos*'
      - id: quizlet
        type: externalLink
        label: Redes sociales (futuro) en Quizlet
        url: https://quizlet.com/il/881348695/conversational-spanish-social-media-futuro-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        prompt: Di 2 frases. Si quieres, explica por qué.
        frame: Soy ___. Creo que las redes sociales hicieron nuestra vida mejor / peor. / Creo que las redes sociales no cambiaron nada.
        example: Soy Marta. Creo que las redes sociales hicieron nuestra vida mejor porque es más fácil comunicarse con amigos y familia.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup
        type: discussionQuestions
        items:
          - question: ¿Qué red social vas a usar menos en el futuro? ¿Por qué?
            frame: Voy a usar menos ___ porque ___. (*Voy a usar menos Facebook porque casi nadie lo usa.*)
          - question: ¿Qué problemas nuevos van a traer las redes sociales en los próximos años?
            frame: Van a traer ___. (*Van a traer más adicción y menos tiempo con la familia.*)
          - question: ¿Qué música vas a escuchar en YouTube o Spotify después de la clase?
            frame: Voy a escuchar ___. (*Voy a escuchar música latina.*)
          - question: ¿Qué foto o video vas a subir a tus redes sociales este año? ¿Por qué?
            frame: Voy a subir ___ porque ___. (*Voy a subir fotos de mi perro.*)
          - question: ¿Cómo crees que las redes sociales van a cambiar dentro de 10 años?
            frame: Van a ser ___. (*Van a ser más rápidas y con más videos.*)
          - question: Si mañana cierran todas las redes sociales, ¿qué vas a hacer para comunicarte con tus amigos?
            frame: Voy a ___. (*Voy a usar el teléfono.*)
          - question: ¿Qué vas a hacer tú para usar las redes sociales de una manera más sana en el futuro?
            frame: Voy a ___. (*Voy a pasar menos tiempo en el teléfono y más con mis amigos en persona.*)
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Usamos las redes sociales para aprender español'
        skills: [Futuro con ir a + infinitivo, Comparaciones]
        steps:
          - Formen grupos de 3–4 estudiantes.
          - Cada estudiante abre su red social favorita (Instagram, TikTok, YouTube, X).
          - Busquen un post real en español sobre algo que les interese (música, deportes, cocina, viajes, moda, videojuegos, memes…).
          - Escriban al menos 3 frases con *ir a + infinitivo* sobre el post que encontraron (abajo).
          - 'Compartan sus frases en el grupo y hagan comparaciones entre ustedes: *Mi post va a ser más útil que el tuyo. Tu cuenta va a ayudar más que la mía.*'
          - Cada grupo elige la frase más creativa y la comparte con la clase como si fuera un post. Pueden añadir un hashtag en español (#aprendeespañol, #música, #recetas, #viajes).
      - id: act1-sentences
        type: discussionQuestions
        title: Mis frases sobre el post
        items:
          - question: Voy a seguir la cuenta ___ porque ___.
            frame: '*Voy a seguir una cuenta de cocina porque quiero aprender palabras de comida.*'
          - question: Este post va a ser más ___ que ___.
            frame: '*Este video de fútbol va a ser más divertido que el partido en la televisión.*'
          - question: En el futuro, voy a aprender ___ con esta cuenta.
            frame: '*En el futuro, voy a aprender más vocabulario de música con esta cuenta.*'
      - id: act2
        type: classActivity
        title: 'Actividad 2: Mi mejor perfil en redes sociales'
        skills: [Comparaciones, Futuro con ir a + infinitivo]
        minutes: 15
        steps:
          - Imagina un perfil nuevo en una red social (no lo abres de verdad).
          - Completa los detalles de abajo.
          - Presenta tu perfil al grupo.
      - id: act2-profile
        type: discussionQuestions
        title: Completa los detalles
        items:
          - question: 'Plataforma: mi perfil de red social va a estar en ___.'
          - question: 'Mi meta es usar mi perfil para ___.'
            frame: encontrar trabajo / encontrar el amor / mantenerme en contacto con mis amigos y mi familia / tener nuevas ideas / pasar el tiempo
          - question: 'Por qué es la mejor plataforma: la plataforma que elegí es la mejor porque ___.'
          - question: 'Mi perfil: las 3 cosas más importantes sobre mí son…'
            frame: (1) ___ (2) ___ (3) ___
      - id: act3
        type: classActivity
        title: 'Actividad 3: La red social del futuro (invento)'
        skills: [Futuro con ir a + infinitivo, Comparaciones]
        steps:
          - En grupos, inventen una nueva red social del futuro.
          - Decidan el nombre de la red social.
          - ¿Qué se va a poder hacer en ella?
          - ¿Cómo va a ser mejor que las redes sociales actuales?
          - Presenten su red social al grupo.
        example: '*Nuestra red social se va a llamar VisionApp. Va a ser más segura que Instagram y más rápida que TikTok.*'
      - id: act4
        type: classActivity
        title: 'Actividad 4: Mi semana digital del futuro'
        skills: [Futuro con ir a + infinitivo, Comparaciones]
        steps:
          - Escribe 3 frases sobre tus planes en las redes la próxima semana (abajo).
          - En parejas, comparen sus semanas.
        example: |-
          *Yo voy a usar más YouTube que tú.*
          *Tú vas a compartir menos fotos que yo.*
      - id: act4-sentences
        type: discussionQuestions
        title: Mi semana digital
        items:
          - question: El lunes voy a usar ___.
          - question: El miércoles voy a mirar ___.
          - question: El viernes voy a compartir ___.
      - id: act5
        type: classActivity
        title: 'Actividad 5: Debate del futuro'
        skills: [Futuro con ir a + infinitivo, Comparaciones]
        steps:
          - 'Dividimos la clase en dos grupos. Grupo A: *Las redes sociales van a mejorar el mundo.* Grupo B: *Las redes sociales van a empeorar el mundo.*'
          - Cada grupo escribe 3 frases con *ir a + infinitivo* (o con el futuro simple, si lo conoces).
          - Cada estudiante dice una frase de su grupo en voz alta.
          - 'Comparamos las frases de los dos grupos: *Instagram va a ser más popular que Facebook. Las ideas del Grupo A son más positivas que las del Grupo B.*'
          - 'Al final, votamos: ¿qué grupo tiene los mejores argumentos?'
      - id: act5-examples
        type: table
        caption: Ejemplos para el debate
        header: [Grupo A (positivo), Grupo B (negativo)]
        rows:
          - [
              Las redes sociales van a ser más importantes que la televisión.,
              Las redes sociales van a traer más problemas que soluciones.,
            ]
          - [
              Las personas van a aprender más rápido que antes.,
              Las personas van a pasar más tiempo en internet que con la familia.,
            ]
          - [
              Las redes sociales van a ayudar más que los libros.,
              Las redes sociales van a ser menos seguras que ahora.,
            ]
      - id: act5-sentences
        type: discussionQuestions
        title: Las frases de mi grupo
        items:
          - question: Las redes sociales van a ___.
          - question: Las personas van a ___ más / menos ___ que ___.
          - question: Las redes sociales van a ser más / menos ___ que ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Futuro con ir a + infinitivo** y
          **Comparaciones**. Todas las actividades combinan las dos. Elige 2 o 3
          actividades según el tiempo de la clase.
      - id: n-intro
        anchor: intro
        text: Da tu propio ejemplo primero y después pregunta a cada estudiante.
      - id: n-warmup
        anchor: warmup
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act1
        anchor: act1
        text: >-
          Variante opcional: pide a los estudiantes una captura de pantalla del post
          para trabajar el vocabulario en la próxima clase. También puedes organizar
          una votación: ¿qué post va a ser más interesante para aprender español?
      - id: n-act2
        anchor: act2
        text: Los estudiantes tienen 15 minutos para completar el perfil; después cada uno lo presenta.
      - id: n-act5
        anchor: act5
        text: >-
          Guía a los grupos para que usen comparaciones en sus frases. Al final, la
          clase vota: ¿quién tiene mejores argumentos?

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: redes-sociales-futuro-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-futuro
        type: ruleSummary
        skill: Futuro con ir a + infinitivo
        rules:
          - text: Se usa para planes y predicciones.
          - text: 'Estructura: sujeto + **ir** (conjugado) + **a** + verbo en infinitivo.'
            examples:
              - Voy a usar Instagram mañana.
              - Las redes sociales van a ser más rápidas en el futuro.
      - id: ir-table
        type: table
        caption: El verbo ir + a + infinitivo
        header: [Persona, Ir a, Ejemplo]
        rows:
          - [yo, voy a, Voy a subir una foto.]
          - [tú, vas a, ¿Vas a escuchar música?]
          - [él / ella / usted, va a, Mi hermana va a abrir una cuenta.]
          - [nosotros / nosotras, vamos a, Vamos a mirar un video.]
          - [vosotros / vosotras, vais a, ¿Vais a compartir el post?]
          - [ellos / ellas / ustedes, van a, Las redes van a cambiar.]
      - id: rules-comparaciones
        type: ruleSummary
        skill: Comparaciones
        rules:
          - text: '**más / menos** + adjetivo + **que**'
            examples: [Instagram es más popular que Twitter.]
          - text: '**más / menos** + nombre + **que**, o verbo + **más / menos que**'
            examples:
              [Tú vas a compartir menos fotos que yo., Tu cuenta va a ayudar más que la mía.]
          - text: '**el / la** + nombre + **más / menos** + adjetivo (en hebreo: הכי)'
            examples: [TikTok es la aplicación más adictiva., Es la red social menos segura.]
          - text: '**tan** + adjetivo + **como** (también se dice **igual de** + adjetivo + **que**)'
            examples: [YouTube es tan útil como Spotify., YouTube es igual de útil que Spotify.]
          - text: El adjetivo concuerda con la cosa (masculino o femenino, singular o plural).
            examples: [Las redes sociales van a ser más rápidas., El video va a ser más divertido.]
      - id: tips
        type: callout
        tone: tip
        title: Consejos para aprender español usando redes sociales
        text: |-
          1. Sigue cuentas en español sobre tus intereses (música, cocina, deportes, memes).
          2. Usa hashtags en español: #aprendeespañol, #recetas, #músicaespañola, #viajes.
          3. Mira stories o videos cortos y repite frases en voz alta.
          4. Escribe comentarios simples en español en videos o publicaciones.
          5. Compara redes sociales en español: *TikTok va a ser más divertido que YouTube.*
          6. Guarda posts útiles (palabras, expresiones) y revísalos después como vocabulario.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos habilidades con el grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: redes-sociales-futuro-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia cada mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: mori-futuro
        type: aiTutorPrompt
        title: 'Parte 1: Futuro con ir a + infinitivo'
        message: |-
          ¡Hola Mori! Quiero practicar el futuro con "ir a + infinitivo". Por favor, hazme estas preguntas, una por una:
          1. ¿Qué red social vas a usar menos en el futuro?
          2. ¿Qué música vas a escuchar en YouTube o Spotify después de la clase?
          3. ¿Qué foto o video vas a subir a tus redes este año?
          Después, pídeme inventar una frase con "En el futuro, voy a aprender…". Corrige mis errores, por favor.
      - id: mori-comparaciones
        type: aiTutorPrompt
        title: 'Parte 2: Comparaciones'
        message: >-
          ¡Hola Mori! Quiero practicar comparaciones. Compara dos redes sociales con
          "más / menos… que", pídeme decir cuál es la red social más útil para mí y
          hazme una pregunta para comparar YouTube y TikTok. Corrige mis errores, por
          favor.
      - id: mori-creatividad
        type: aiTutorPrompt
        title: 'Parte 3: Creatividad'
        message: >-
          ¡Hola Mori! Pídeme inventar una nueva red social del futuro y describirla.
          Después, pregúntame cómo va a ser mejor que las redes sociales de ahora. Al
          final, corrige mis errores y dame una frase modelo para mejorar.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**
          Al final, envía: **Mori, corrige mis errores y dame una frase modelo para mejorar.**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: redes-sociales-futuro-practica
    book: workbook
