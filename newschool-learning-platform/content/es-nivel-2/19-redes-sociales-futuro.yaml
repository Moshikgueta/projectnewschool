vocabulary:
  - slug: redes-sociales-futuro
    title: Redes sociales (futuro)
    items: *redes-futuro-words

activities:
  - slug: redes-sociales-futuro-ir-a
    title: 'Futuro: ir a + infinitivo'
    minutes: 8
    items:
      - id: voy-a
        type: multipleChoice
        prompt: Mañana yo ___ a usar Instagram.
        options:
          - { text: voy, correct: true }
          - { text: va, feedback: '*Va* es para él, ella o usted. Con *yo* decimos *voy a*.' }
          - { text: vamos, feedback: '*Vamos* es para nosotros. Con *yo* decimos *voy a*.' }
      - id: van-a
        type: fillBlank
        prompt: Completa con el verbo *ir*.
        text: En el futuro, las redes sociales ___ a ser más rápidas.
        blanks: [[van]]
      - id: une-ir
        type: matching
        prompt: Une cada persona con la forma de *ir a*.
        pairs:
          - [yo, voy a]
          - [tú, vas a]
          - [él / ella, va a]
          - [nosotros, vamos a]
          - [ellos / ellas, van a]
      - id: planes
        type: trueFalse
        prompt: '*Ir a + infinitivo* se usa para hablar de planes y predicciones: *Voy a usar Instagram mañana.*'
        answer: true
        feedback:
          correct: ¡Correcto! Planes y predicciones.
          incorrect: '*Ir a + infinitivo* habla del futuro: planes (*Voy a subir una foto.*) y predicciones (*Van a ser más rápidas.*).'
      - id: frase-correcta
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: Voy a subir fotos de mi perro., correct: true }
          - { text: Voy subir fotos de mi perro., feedback: 'Falta *a*: *voy **a** subir*.' }
          - {
              text: Voy a subo fotos de mi perro.,
              feedback: 'Después de *ir a* el verbo va en infinitivo: *voy a **subir***.',
            }
      - id: vas-voy
        type: fillBlank
        prompt: Completa la pregunta y la respuesta con el verbo *ir*.
        text: —¿Qué ___ a escuchar después de la clase? —___ a escuchar música latina.
        blanks: [[vas], [Voy, Yo voy]]
      - id: ordena-cuenta
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Voy a seguir una cuenta de cocina.
      - id: vamos-a
        type: multipleChoice
        prompt: Nosotros ___ a pasar menos tiempo en el teléfono.
        options:
          - { text: vamos, correct: true }
          - {
              text: van,
              feedback: '*Van* es para ellos, ellas o ustedes. Con *nosotros* decimos *vamos a*.',
            }
          - { text: vas, feedback: '*Vas* es para tú. Con *nosotros* decimos *vamos a*.' }

  - slug: redes-sociales-futuro-comparaciones
    title: 'Comparaciones: más… que, el más'
    minutes: 8
    items:
      - id: mas-que
        type: multipleChoice
        prompt: Instagram es más popular ___ Twitter.
        options:
          - { text: que, correct: true }
          - {
              text: de,
              feedback: 'Para comparar dos cosas decimos *más… **que***: *más popular que Twitter*.',
            }
          - {
              text: como,
              feedback: '*Como* va con *tan*: *tan popular como*. Con *más* usamos *que*.',
            }
      - id: la-mas
        type: fillBlank
        prompt: 'Completa con la palabra correcta (+ = הכי).'
        text: TikTok es la aplicación ___ adictiva (+).
        blanks: [[más]]
      - id: hebreo-hachi
        type: trueFalse
        prompt: 'Para decir "הכי" usamos *el / la* + nombre + *más* + adjetivo: *la red social más popular*.'
        answer: true
        feedback:
          correct: ¡Correcto! *La aplicación más adictiva.*
          incorrect: 'Sí es así: *el / la* + nombre + *más* + adjetivo, por ejemplo *la red social más popular*.'
      - id: une-comparaciones
        type: matching
        prompt: Une cada expresión con su traducción.
        pairs:
          - [más… que, יותר… מ]
          - [menos… que, פחות… מ]
          - [el / la más, הכי]
          - [el / la menos, הכי פחות]
      - id: tan-como
        type: fillBlank
        prompt: Completa la comparación.
        text: YouTube es tan útil ___ Spotify.
        blanks: [[como]]
      - id: el-tuyo
        type: multipleChoice
        prompt: Mi post va a ser más útil que ___ tuyo.
        options:
          - { text: el, correct: true }
          - { text: la, feedback: '*Post* es masculino: *el tuyo*.' }
          - { text: lo, feedback: 'Hablamos de *el post* (masculino): *el tuyo*.' }
      - id: ordena-segura
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Nuestra red social va a ser más segura que Instagram.
      - id: concordancia
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: Las redes sociales van a ser menos seguras que ahora., correct: true }
          - {
              text: Las redes sociales van a ser menos seguro que ahora.,
              feedback: 'El adjetivo concuerda con *las redes* (femenino plural): *seguras*.',
            }
          - {
              text: Las redes sociales van a ser menos seguras de ahora.,
              feedback: 'Para comparar decimos *menos… **que***: *menos seguras que ahora*.',
            }
