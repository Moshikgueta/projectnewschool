        type: vocabulary
        title: Palabras del voluntariado
        glossLang: he
        link: https://quizlet.com/il/867296099/conversational-spanish-volunteering-flash-cards/
        items: &voluntariado-words
          - { term: Voluntario / Voluntaria, gloss: מתנדב / מתנדבת }
          - { term: Voluntariado, gloss: התנדבות }
          - { term: Ayudar, gloss: לעזור }
          - { term: Comunidad, gloss: קהילה }
          - { term: Personas, gloss: אנשים }
          - { term: Dar, gloss: לתת }
          - { term: Tiempo, gloss: זמן }
          - { term: Apoyo, gloss: תמיכה }
          - { term: Bondad, gloss: חסד }
          - { term: Compartir, gloss: לשתף }
          - { term: Cuidado, gloss: 'טיפול, אכפתיות' }
          - { term: Local, gloss: מקומי }
          - { term: Necesitar, gloss: 'להזדקק, להצטרך' }
          - { term: Acción, gloss: פעולה }
          - { term: Ayuda, gloss: עזרה }
          - { term: Impacto, gloss: השפעה }
          - { term: Caridad, gloss: צדקה }
          - { term: Contribución, gloss: תרומה }
          - { term: Venir, gloss: לבוא }
          - { term: Hacer, gloss: לעשות }
          - { term: Organización sin fines de lucro, gloss: ארגון ללא מטרות רווח }
