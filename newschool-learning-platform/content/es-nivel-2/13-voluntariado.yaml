vocabulary:
  - slug: voluntariado
    title: Voluntariado y ayuda al otro
    items: *voluntariado-words

activities:
  - slug: voluntariado-indefinido
    title: 'Pretérito indefinido: ayudé, comí, fui'
    minutes: 8
    items:
      - id: ayer-ayude
        type: multipleChoice
        prompt: Ayer yo ___ a las familias necesitadas.
        options:
          - { text: ayudé, correct: true }
          - { text: ayudó, feedback: '*Ayudó* es para él, ella o usted. Para *yo*: *ayudé*.' }
          - { text: ayudaste, feedback: '*Ayudaste* es para *tú*. Para *yo*: *ayudé*.' }
      - id: hicieron
        type: fillBlank
        prompt: Completa con el verbo *hacer* en pretérito indefinido.
        text: Ellos ___ un gran trabajo recolectando ropa para los necesitados.
        blanks: [[hicieron]]
      - id: estuvimos
        type: fillBlank
        prompt: Completa con el verbo *estar* en pretérito indefinido.
        text: Nosotros ___ en el evento de recaudación todo el día.
        blanks: [[estuvimos]]
      - id: une-comer
        type: matching
        prompt: Une cada persona con la forma de *comer* en pretérito indefinido.
        pairs:
          - [yo, comí]
          - [tú, comiste]
          - [él / ella, comió]
          - [nosotros, comimos]
          - [ellos / ellas, comieron]
      - id: ser-ir
        type: trueFalse
        prompt: '*Ser* e *ir* tienen las mismas formas en pretérito indefinido: *fui, fuiste, fue…*'
        answer: true
        feedback:
          correct: '¡Correcto! *Fui voluntario* (ser) y *fui al refugio* (ir).'
          incorrect: '*Ser* e *ir* comparten las formas: *fui, fuiste, fue, fuimos, fueron*.'
      - id: dijo
        type: multipleChoice
        prompt: El coordinador ___ que todos hicieron un excelente trabajo.
        options:
          - { text: dijo, correct: true }
          - { text: deció, feedback: '*Decir* es irregular: *dije, dijiste, dijo*.' }
          - { text: dije, feedback: '*Dije* es para *yo*. Para *el coordinador* (él): *dijo*.' }
      - id: asistieron
        type: fillBlank
        prompt: Completa con el verbo *asistir* en pretérito indefinido.
        text: Muchas personas ___ al taller sobre cómo ayudar en la comunidad.
        blanks: [[asistieron]]
      - id: ordena-tuvimos
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Tuvimos la oportunidad de ayudar a muchas personas.

  - slug: voluntariado-imperfecto
    title: 'Pretérito imperfecto: ayudaba, tenía, era, iba'
    minutes: 8
    items:
      - id: cada-semana
        type: multipleChoice
        prompt: Cuando era voluntario, ___ a preparar comidas cada semana.
        options:
          - { text: ayudaba, correct: true }
          - {
              text: ayudé,
              feedback: '*Cada semana* es un hábito en el pasado: usa el imperfecto, *ayudaba*.',
            }
          - { text: ayudía, feedback: 'Los verbos en -ar terminan en -aba: *ayudaba*.' }
      - id: tenian
        type: fillBlank
        prompt: Completa con el verbo *tener* en pretérito imperfecto.
        text: Antes, los voluntarios ___ menos recursos para trabajar.
        blanks: [[tenían]]
      - id: viviamos
        type: fillBlank
        prompt: Completa con el verbo *vivir* en pretérito imperfecto.
        text: Nosotros ___ cerca del refugio.
        blanks: [[vivíamos]]
      - id: une-formas
        type: matching
        prompt: Une cada verbo con su forma en pretérito imperfecto.
        pairs:
          - [ser (yo), era]
          - [ir (yo), iba]
          - [ver (yo), veía]
          - [ayudar (yo), ayudaba]
          - [ser (nosotros), éramos]
      - id: interrupcion
        type: trueFalse
        prompt: 'En *Los voluntarios trabajaban en el evento cuando llegó más ayuda*, la interrupción (*llegó*) va en imperfecto.'
        answer: false
        feedback:
          correct: '¡Correcto! La acción en curso va en imperfecto (*trabajaban*) y la interrupción en indefinido (*llegó*).'
          incorrect: '*Llegó* está en pretérito indefinido: es la interrupción. La acción en curso (*trabajaban*) va en imperfecto.'
      - id: trabajaban
        type: multipleChoice
        prompt: Los voluntarios ___ en el evento cuando llegó más ayuda.
        options:
          - { text: trabajaban, correct: true }
          - {
              text: trabajaron,
              feedback: 'La acción estaba en curso cuando otra la interrumpió: usa el imperfecto, *trabajaban*.',
            }
          - { text: trabajaba, feedback: '*Los voluntarios* es plural (ellos): *trabajaban*.' }
      - id: dabamos
        type: fillBlank
        prompt: Completa con el verbo *dar* en pretérito imperfecto.
        text: Todos los días, nosotros ___ comida a las personas sin hogar.
        blanks: [[dábamos]]
      - id: ordena-dedicados
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Los voluntarios eran muy dedicados a su labor.
