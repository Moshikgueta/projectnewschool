# Cycle "Voluntariado y ayuda al otro", converted from the Spanish level 2
# (conversational) digital notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher
# review: see `review` below. Blocks without `lang` are in the course language (Spanish).
course: es-nivel-2
slug: voluntariado
title: Voluntariado y ayuda al otro
goal: Contar experiencias de voluntariado con el pretérito indefinido y el pretérito imperfecto.
position: 13
status: in_review

review:
  - >-
    The two workbook exercises ("Pretérito indefinido" and "Pretérito imperfecto")
    are NEW: the notebook has no self-study exercises. They were written from the
    cycle's two skills, its summary rules and its vocabulary. Please check level,
    wording and every right answer before students see them.
  - >-
    Skill names: the notebook calls skill 1 "Pretérito Simple". In Spanish grammar
    it is the "pretérito indefinido" (pretérito perfecto simple); the skill is named
    "Pretérito indefinido" with "pasado simple" in its description.
  - >-
    Grammar correction: the summary said "Solo dos verbos son irregulares en el
    pretérito imperfecto" (ser, ir). There are three: ser, ir and ver. "Ver" (veía,
    veías…) was added to the rule and the table. Please confirm.
  - >-
    Summary tables: vosotros is placed after nosotros (yo, tú, él, nosotros,
    vosotros, ellos), as usual in Spanish tables; the source put it last. The
    missing closing bracket in "(de “ir”" was fixed. The broken "3 reglas"
    numbering of both skills was rewritten as three clear rules each.
  - >-
    Introduction example: "preparé jalot para los hayalim" (Hebrew words in Latin
    letters) → "preparé jalot (pan de Shabat) para los soldados". Please confirm.
  - >-
    Warm-up: question 4 was a sentence to complete; it became the question "¿Por
    qué las personas hacen voluntariado?" with the source sentence as its frame.
    Frames were added to all warm-up questions (the source has none). The empty
    question 7 was left out. Question 3 "[Sí/No]" became a frame.
  - >-
    Activity 1 ("Carrera de voluntariado") is mostly in the present tense; only
    sentence 4 is in the past. The plan lists it for both skills; kept as in the
    source. The answer key (written by the converter) is in a teacher note: please
    check it. "Dar" is an extra verb in the bank (or an alternative in sentence 4).
  - >-
    Activity 3: "Busca un video en YouTube sobre voluntariado en tu idioma" → "en
    español". The YouTube link from the source is kept.
  - >-
    Activity 4 (debate): the times "10/15 minutos" are recorded as 15 minutes.
    The debate situation text was kept as written.
  - >-
    Homework: the notebook gives written homework (Partes 1–4: questions,
    present → imperfect, reading, writing) and no Mori message. The written parts are
    kept as answer boxes; ONE Mori message was written by the converter from Parte 1
    so the section matches the platform's homework pattern. Please confirm or remove.
    The answer key for Parte 2 is in a teacher note. A stray "ð" character (broken
    emoji) after Parte 2 sentence 3 was removed; missing final full stops were added.
  - >-
    Vocabulary: "Voluntario – התנדבות" is a mismatch: "Voluntario" is now "מתנדב /
    מתנדבת" and "Voluntariado – התנדבות" was added. "Cuidado" (אכפתיות) is glossed
    "טיפול, אכפתיות"; "Habilidades" as "כישורים, יכולות"; "Necesitar" as "להזדקק,
    להצטרך". Please confirm.
  - >-
    The "Materiales adicionales" links (two Google Drive grammar sheets and two TED
    talks on YouTube) are kept in the summary section. Activity times given as
    ranges are recorded as the upper value. The "Respuesta de alumno 1/2/3" lines are
    replaced by the optional answer boxes (decision C2).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: voluntariado-clase
    title: 'Clase: Voluntariado y ayuda al otro'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Voluntariado y ayuda al otro
      - id: skills
        type: cycleOverview
        skills:
          - name: Pretérito indefinido
            description: 'El pasado simple, para acciones terminadas: *ayudé, comí, fui, hice*'
          - name: Pretérito imperfecto
            description: 'Hábitos, descripciones y acciones en curso en el pasado: *ayudaba, tenía, era, iba*'
      - id: quizlet
        type: externalLink
        label: Voluntariado en Quizlet
        url: https://quizlet.com/il/867296099/conversational-spanish-volunteering-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___. Esto es lo que hice por los demás / esto es lo que hacía por los demás ___.
        example: >-
          Soy Flor. Esto es lo que hice por los demás: **preparé** jalot (pan de Shabat)
          para los soldados. También **iba** todos los viernes a una escuela con niños con
          necesidades especiales para pasar Shabat con ellos.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de preparación
      - id: warmup
        type: discussionQuestions
        items:
          - question: Cuéntanos una situación en la que ayudaste a alguien.
            frame: Una vez ayudé a ___. Yo ___.
          - question: ¿Puedes nombrar una organización sin fines de lucro que admires? ¿Por qué? ¿Qué hicieron?
            frame: Admiro ___ porque ___. Ellos ___.
          - question: Voluntariado significa trabajar sin recibir dinero. ¿Eres voluntario / voluntaria ahora? ¿Dónde?
            frame: Sí, soy voluntario / voluntaria en ___. / No, ahora no soy voluntario / voluntaria.
          - question: ¿Por qué las personas hacen voluntariado?
            frame: Las personas hacen voluntariado porque las hace sentir ___.
          - question: Comparte una experiencia personal con el voluntariado. ¿Eras voluntario fijo allí o fuiste solo una vez?
            frame: Fui voluntario / voluntaria en ___. Iba todas las semanas. / Fui solo una vez.
          - question: ¿Qué pensabas sobre hacer trabajo voluntario antes de intentarlo y qué piensas ahora?
            frame: Antes pensaba que ___. Ahora pienso que ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Carrera de voluntariado'
        skills: [Pretérito indefinido, Pretérito imperfecto]
        steps:
          - Completa los espacios con el verbo correcto en su forma correcta.
          - Trabaja en pareja o solo / sola, como diga tu profesor.
          - Quien termina primero, grita **¡Listo!**
        wordBank: [Recibir, Hacer, Necesitar, Ayudar, Dar, Ser]
      - id: act1-sentences
        type: discussionQuestions
        title: Completa las oraciones
        items:
          - question: La gente en nuestra ciudad ___ de nuestra ayuda, y la ___.
          - question: Cuando ___ a los demás, nos sentimos bien por dentro.
          - question: ___ de nuestra comunidad un lugar mejor al ser voluntarios.
          - question: Cuando comenzó la guerra, los voluntarios ___ sin esperar nada a cambio porque realmente se preocupaban.
          - question: Ayudar a las personas ___ un acto de corazón.
      - id: act2
        type: classActivity
        title: 'Actividad 2: ¡Era un gran voluntario!'
        skills: [Pretérito indefinido, Pretérito imperfecto]
        minutes: 10
        steps:
          - ¡Es el momento de ser creativos! Trabajen en parejas.
          - Piensen en el voluntariado más raro de su vida (¡uno falso, por supuesto!). Tienen 10 minutos.
          - 'Escriban: el nombre de la organización, qué hacía la organización, cuál era su papel y qué aportaban, y por qué cerró la organización.'
          - Cuenten su historia al grupo.
      - id: act2-frames
        type: discussionQuestions
        title: Nuestra organización
        items:
          - question: El nombre de la organización era ___.
          - question: Esta organización ___.
          - question: Nuestro papel en esta organización era ___.
          - question: Cada día ___.
          - question: Esta organización cerró porque ___.
      - id: act3
        type: classActivity
        title: 'Actividad 3: Hora de historias y videos'
        skills: [Pretérito imperfecto]
        steps:
          - Mira el video de un voluntario que ayuda a alguien.
          - Responde las preguntas de abajo y comenta con el grupo.
        resource:
          label: Video sobre voluntariado
          url: https://www.youtube.com/watch?v=PWqmSFXMVHI
      - id: act3-questions
        type: discussionQuestions
        items:
          - question: ¿Qué hizo el voluntario para ayudar?
            frame: El voluntario ___.
          - question: ¿Cómo crees que se sintió la persona ayudada?
            frame: Creo que se sintió ___.
          - question: ¿Por qué es valioso ayudar a otros en la comunidad?
            frame: Es valioso porque ___.
      - id: act4
        type: classActivity
        title: 'Actividad 4: Debate sobre el voluntariado'
        skills: [Pretérito indefinido, Pretérito imperfecto]
        steps:
          - Lee la situación. La clase se divide en dos grupos, a favor y en contra.
          - Cada grupo tiene 15 minutos para preparar varios puntos que defiendan su postura.
          - Cada grupo tiene 5 minutos para presentar su postura. Usa experiencias del pasado, con el pretérito indefinido y el imperfecto. **Todos deben hablar.**
          - Cada grupo tiene 3 minutos para responder al otro grupo.
          - El juez (el profesor) elige un ganador.
          - 'Reflexión: ¿qué grupo presentó los argumentos más convincentes? ¿Cómo influyeron las experiencias pasadas en sus puntos de vista?'
      - id: act4-situation
        type: callout
        tone: info
        title: 'Situación: «Los estudiantes están obligados a hacer un voluntariado como parte de su educación»'
        text: >-
          El gobierno local propuso una nueva política que exigía a los estudiantes de
          secundaria y universidad hacer al menos 50 horas de voluntariado antes de
          graduarse. Esto generó un debate en la comunidad. Algunos apoyaron la idea,
          pensando que ayudaba a formar carácter y a devolver algo a la sociedad, mientras
          que otros creyeron que añadía más presión a los estudiantes, que ya tenían muchas
          responsabilidades académicas y personales.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Pretérito indefinido** (preguntas 1 y 2,
          Actividad 1 o 2) y **Pretérito imperfecto** (preguntas 5 y 6, Actividad 1 o 3).
          La Actividad 4 (debate) practica las dos.
      - id: n-intro
        anchor: intro
        text: >-
          Guía a los estudiantes para decir su nombre y algo que hicieron (indefinido) o
          que hacían (imperfecto) por los demás. Da tu propio ejemplo primero.
      - id: n-warmup
        anchor: warmup
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act1
        anchor: act1
        text: >-
          Tú decides si juegan en parejas (Breakout Rooms) o solos. Respuestas posibles:
          1. necesita… recibe · 2. ayudamos · 3. Hacemos · 4. ayudaron (o dieron) · 5. es.
          Acepta otras formas correctas.
      - id: n-act2
        anchor: act2
        text: Divide a los estudiantes en parejas. Después de 10 minutos, cada pareja presenta su organización inventada.
      - id: n-act3
        anchor: act3
        text: >-
          Puedes usar el video del enlace o buscar otro video corto (3 minutos o menos)
          en YouTube sobre voluntariado en español: una historia simple y atractiva de un
          voluntario que ayuda a alguien. Después, inicia la discusión con vocabulario básico.
      - id: n-act4
        anchor: act4
        text: >-
          Tiempos: preparación 15 minutos, presentación 5 minutos por grupo, respuesta 3
          minutos por grupo. El argumento principal debe basarse en experiencias, usando
          mucho el pasado (indefinido e imperfecto). Al final, elige un ganador y dirige la
          reflexión.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: voluntariado-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-indefinido
        type: ruleSummary
        skill: Pretérito indefinido
        rules:
          - text: '**¿Cuándo?** Para acciones completas (terminadas) en un momento específico del pasado.'
            examples:
              - Yo visité Londres el año pasado.
              - Ellos ayudaron a organizar alimentos para las familias necesitadas la semana pasada.
          - text: '**Verbos regulares.** Verbos en **-ar**: -é, -aste, -ó, -amos, -asteis, -aron. Verbos en **-er** e **-ir**: -í, -iste, -ió, -imos, -isteis, -ieron.'
            examples:
              - Los voluntarios comieron juntos después de organizar el evento.
              - Muchas personas asistieron al taller sobre cómo ayudar en la comunidad.
          - text: '**Verbos irregulares.** No siguen la regla de -é, -í, -ó: los aprendes hablando y practicando. **Ser** e **ir** tienen las mismas formas (fui, fuiste, fue…).'
            examples:
              - Fui voluntario en un refugio el mes pasado. (ser)
              - Mis amigos y yo fuimos a un voluntariado en el sur de Israel. (ir)
              - Ellos hicieron un gran trabajo recolectando ropa para los necesitados.
              - Nosotros estuvimos en el evento de recaudación todo el día.
              - Tuvimos la oportunidad de ayudar a muchas personas.
              - El coordinador dijo que todos hicieron un excelente trabajo.
      - id: table-indefinido-regular
        type: table
        caption: Pretérito indefinido, verbos regulares
        header: [Persona, Ayudar (-ar), Comer (-er), Asistir (-ir)]
        rows:
          - [Yo, ayudé, comí, asistí]
          - [Tú, ayudaste, comiste, asististe]
          - [Él / Ella / Usted, ayudó, comió, asistió]
          - [Nosotros / Nosotras, ayudamos, comimos, asistimos]
          - [Vosotros / Vosotras, ayudasteis, comisteis, asististeis]
          - [Ellos / Ellas / Ustedes, ayudaron, comieron, asistieron]
      - id: table-indefinido-irregular
        type: table
        caption: Pretérito indefinido, verbos irregulares
        header: [Persona, Ser / Ir, Hacer, Estar, Tener, Decir]
        rows:
          - [Yo, fui, hice, estuve, tuve, dije]
          - [Tú, fuiste, hiciste, estuviste, tuviste, dijiste]
          - [Él / Ella / Usted, fue, hizo, estuvo, tuvo, dijo]
          - [Nosotros / Nosotras, fuimos, hicimos, estuvimos, tuvimos, dijimos]
          - [Vosotros / Vosotras, fuisteis, hicisteis, estuvisteis, tuvisteis, dijisteis]
          - [Ellos / Ellas / Ustedes, fueron, hicieron, estuvieron, tuvieron, dijeron]
      - id: rules-imperfecto
        type: ruleSummary
        skill: Pretérito imperfecto
        rules:
          - text: '**¿Cuándo?** (A) Para hábitos y acciones repetidas en el pasado. (B) Para describir situaciones, estados o condiciones: el clima, las emociones, el entorno. (C) Para la acción en curso que otra acción interrumpe: la acción en curso va en **imperfecto** y la interrupción en **indefinido**.'
            examples:
              - Cuando era voluntario, **ayudaba** a preparar comidas cada semana.
              - Todos los días, los voluntarios **visitaban** el refugio.
              - La comunidad **necesitaba** más apoyo en ese momento.
              - '**Hacía** frío, pero los voluntarios seguían trabajando.'
              - Los voluntarios **trabajaban** en el evento cuando **llegó** más ayuda.
              - '**Éramos** voluntarios allí, hasta que la organización **cerró**.'
          - text: '**Verbos regulares.** Verbos en **-ar**: raíz + -aba, -abas, -aba, -ábamos, -abais, -aban. Verbos en **-er** e **-ir**: raíz + -ía, -ías, -ía, -íamos, -íais, -ían.'
            examples:
              - Cuando era voluntario, yo **ayudaba** a organizar eventos cada semana.
              - Antes, los voluntarios **tenían** menos recursos para trabajar.
              - Los voluntarios **vivían** cerca del refugio.
          - text: '**Verbos irregulares.** Solo tres verbos son irregulares en el imperfecto: **ser**, **ir** y **ver**.'
            examples:
              - Los voluntarios **eran** muy dedicados a su labor.
              - Los voluntarios siempre **iban** al refugio después del trabajo.
              - De niño, **veía** a mi abuela ayudar a los vecinos.
      - id: table-imperfecto-regular
        type: table
        caption: Pretérito imperfecto, verbos regulares
        header: [Persona, Ayudar (-ar), Tener (-er), Vivir (-ir)]
        rows:
          - [Yo, ayudaba, tenía, vivía]
          - [Tú, ayudabas, tenías, vivías]
          - [Él / Ella / Usted, ayudaba, tenía, vivía]
          - [Nosotros / Nosotras, ayudábamos, teníamos, vivíamos]
          - [Vosotros / Vosotras, ayudabais, teníais, vivíais]
          - [Ellos / Ellas / Ustedes, ayudaban, tenían, vivían]
      - id: table-imperfecto-irregular
        type: table
        caption: Pretérito imperfecto, verbos irregulares
        header: [Persona, Ser, Ir, Ver]
        rows:
          - [Yo, era, iba, veía]
          - [Tú, eras, ibas, veías]
          - [Él / Ella / Usted, era, iba, veía]
          - [Nosotros / Nosotras, éramos, íbamos, veíamos]
          - [Vosotros / Vosotras, erais, ibais, veíais]
          - [Ellos / Ellas / Ustedes, eran, iban, veían]
      - id: more-title
        type: heading
        level: 3
        text: Materiales adicionales
      - id: more-indefinido
        type: externalLink
        label: Pretérito simple (indefinido)
        url: https://drive.google.com/file/d/1ZGvBE7q8Q_PNeduStXQUmcljc-qK8Xny/view
      - id: more-imperfecto
        type: externalLink
        label: Pretérito imperfecto
        url: https://drive.google.com/file/d/1z3ODReVkLwkIZOQgcSzGhf1B9Vq2jCHj/view
      - id: more-ted-1
        type: externalLink
        label: 'TED Talk: «El poder del voluntariado», Carolina Freire (Panamá)'
        url: https://www.youtube.com/watch?v=y33e-YZDQvs
      - id: more-ted-2
        type: externalLink
        label: 'TED Talk: «Voluntariado como forma de vida», Leticia García (España)'
        url: https://www.youtube.com/watch?v=gbhGp3eOh2E
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos habilidades con el grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: voluntariado-tarea
    title: Tarea
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea
      - id: part1-title
        type: heading
        level: 3
        text: 'Parte 1: Preguntas y respuestas'
      - id: part1
        type: discussionQuestions
        title: Responde con el pretérito indefinido o el pretérito imperfecto.
        items:
          - question: ¿Cuándo fue la última vez que fuiste voluntario / voluntaria?
          - question: ¿Qué hacías cuando te ofreciste como voluntario / voluntaria por primera vez?
          - question: ¿A qué tipo de actividades asistías cuando eras voluntario / voluntaria?
          - question: ¿Ayudaste a alguien en algo este año?
      - id: part2-title
        type: heading
        level: 3
        text: 'Parte 2: Del presente al pretérito imperfecto'
      - id: part2-how
        type: text
        text: >-
          Lee las frases en **presente** y cámbialas al **pretérito imperfecto**. Recuerda:
          el imperfecto describe situaciones habituales o en curso en el pasado.
          *Opcional:* agrega algo a la oración para mostrar que hablas del pasado.
      - id: part2
        type: discussionQuestions
        items:
          - question: 'Presente: Los voluntarios **trabajan** mucho durante todo el día.'
            frame: Recuerdo que los voluntarios ___ mucho todos los días.
          - question: 'Presente: Cada año, los voluntarios **organizan** eventos para recolectar donaciones.'
            frame: Durante el 2022, los voluntarios ___ eventos para recolectar donaciones todos los meses.
          - question: 'Presente: Siempre **ayudo** a las familias que se mudan.'
            frame: Siempre ___ a las familias que se mudaban, hasta que me mudé yo y no me ayudó nadie.
          - question: 'Presente: Durante los eventos, los voluntarios **llegan** temprano para prepararse.'
            frame: Durante los eventos, los voluntarios ___ temprano para prepararse.
          - question: 'Presente: Todos los días, **damos** comida a las personas sin hogar.'
            frame: Todos los días, ___ comida a las personas sin hogar.
      - id: part3-title
        type: heading
        level: 3
        text: 'Parte 3: Comprensión lectora (10 minutos)'
      - id: part3-text
        type: text
        text: >-
          El verano pasado, un grupo de voluntarios **decidió** ayudar en una escuela para
          niños desfavorecidos. **Cada día**, los voluntarios **trabajaban** con los niños,
          les **enseñaban** a leer y les **daban** meriendas. Un día, mientras **jugaban**
          afuera, **llegó** una familia que no **tenía** casa. Los voluntarios les
          **ofrecieron** su apoyo y les **dieron** ropa y comida. Todos **se sintieron** muy
          felices de ayudar.
      - id: part3
        type: discussionQuestions
        title: Responde con frases completas. Usa el pretérito indefinido y el imperfecto.
        items:
          - question: ¿Qué hacían los voluntarios todos los días?
          - question: ¿Qué ocurrió cuando los voluntarios estaban jugando afuera?
          - question: ¿Cómo se sintieron los voluntarios al final del día?
      - id: part4-title
        type: heading
        level: 3
        text: 'Parte 4: Escritura (15 minutos)'
      - id: part4
        type: reflection
        prompt: >-
          Escribe un párrafo corto (5–7 frases) sobre un día en el que participaste en una
          actividad de voluntariado. Usa el **pretérito indefinido** para las acciones
          específicas y el **pretérito imperfecto** para describir las situaciones o las
          actividades habituales.
      - id: part4-example
        type: callout
        tone: info
        title: Ejemplo de párrafo
        text: >-
          El mes pasado, **fui** a un centro de voluntariado para ayudar a personas sin
          hogar. **Estaba** muy emocionado por participar. Durante el día, **organizamos**
          alimentos y **preparamos** camas para los que iban a pasar la noche. Mientras
          **trabajábamos**, los voluntarios **hablaban** sobre cómo mejorar las actividades.
          **Fue** un día muy gratificante.
      - id: mori-title
        type: heading
        level: 3
        text: Practica con Mori
      - id: mori-voluntariado
        type: aiTutorPrompt
        title: Mis experiencias de voluntariado
        intro: Abre el chat con Mori, copia este mensaje y envíalo. Mori te hará preguntas; responde a todas.
        message: >-
          ¡Hola Mori! Quiero practicar el pretérito indefinido y el pretérito imperfecto.
          Hazme preguntas sobre mis experiencias de voluntariado y de ayuda a otras
          personas, por ejemplo: ¿Cuándo fue la última vez que fuiste voluntario? ¿Qué
          hacías cuando eras voluntario? Corrige mis errores, por favor.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**
    teacherNotes:
      - id: n-part2
        anchor: part2
        text: 'Respuestas: 1. trabajaban · 2. organizaban · 3. ayudaba · 4. llegaban · 5. dábamos.'

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: voluntariado-practica
    book: workbook
    title: 'Práctica: Voluntariado y ayuda al otro'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practica las dos habilidades del ciclo. Cada respuesta se corrige al momento, y puedes intentarlo otra vez.
      - id: ex-indefinido
        type: activity
        activity: voluntariado-indefinido
      - id: ex-imperfecto
        type: activity
        activity: voluntariado-imperfecto

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: voluntariado-vocabulario
