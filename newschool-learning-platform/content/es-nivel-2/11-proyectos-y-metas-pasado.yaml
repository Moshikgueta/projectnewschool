vocabulary:
  - slug: proyectos-y-metas-pasado
    title: 'Proyectos y metas: el pasado'
    items: *proyectos-y-metas-pasado-words

activities:
  - slug: proyectos-y-metas-pasado-regulares
    title: 'Pretérito: verbos regulares'
    minutes: 8
    items:
      - id: complete
        type: multipleChoice
        prompt: El mes pasado, yo ___ mi proyecto.
        options:
          - { text: completé, correct: true }
          - {
              text: completo,
              feedback: '*Completo* es presente. Para una acción terminada (*el mes pasado*), usa *completé*.',
            }
          - {
              text: completó,
              feedback: '*Completó* es para *él* o *ella*. Para *yo*, usa *completé*.',
            }
      - id: ayudaron
        type: fillBlank
        prompt: Completa con el pretérito indefinido.
        text: Ellos ___ (ayudar) a organizar el proyecto.
        blanks: [[ayudaron]]
      - id: une-comer
        type: matching
        prompt: Une cada persona con su forma de *comer* en pretérito indefinido.
        pairs:
          - [yo, comí]
          - [tú, comiste]
          - [él / ella, comió]
          - [nosotros, comimos]
          - [ellos / ellas, comieron]
      - id: tilde
        type: trueFalse
        prompt: 'En los verbos regulares, *yo ayudé* y *él ayudó* llevan tilde en la última sílaba.'
        answer: true
        feedback:
          correct: ¡Correcto! *Ayudé, ayudó, comí, comió*.
          incorrect: 'Sí llevan tilde: *ayudé, ayudó*. Sin tilde, *ayudo* es presente.'
      - id: celebramos
        type: fillBlank
        prompt: Completa con el pretérito indefinido.
        text: Después de lograr la meta, nosotros ___ (celebrar) en un restaurante y ___ (beber) limonada.
        blanks: [[celebramos], [bebimos]]
      - id: contribuyo
        type: multipleChoice
        prompt: El equipo ___ con ideas innovadoras.
        options:
          - { text: contribuyó, correct: true }
          - { text: contribuió, feedback: 'La *i* entre vocales cambia a *y*: *contribuyó*.' }
          - { text: contribuyeron, feedback: '*El equipo* es singular (él): *contribuyó*.' }
      - id: lograste
        type: multipleChoice
        prompt: ¿___ tu meta el año pasado?
        options:
          - { text: Lograste, correct: true }
          - { text: Logré, feedback: '*Logré* es para *yo*. Para *tú*, usa *lograste*.' }
          - {
              text: Lograstes,
              feedback: 'La forma de *tú* termina en *-aste*, sin *-s* final: *lograste*.',
            }
      - id: ordena-celebramos
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: El sábado celebramos con mis amigos.
        alsoAccept: [Celebramos con mis amigos el sábado]

  - slug: proyectos-y-metas-pasado-irregulares
    title: 'Pretérito: verbos irregulares'
    minutes: 8
    items:
      - id: fuimos
        type: multipleChoice
        prompt: Mis compañeros y yo ___ a una reunión.
        options:
          - { text: fuimos, correct: true }
          - { text: fueron, feedback: '*Mis compañeros y yo* = *nosotros*: *fuimos*.' }
          - {
              text: fui,
              feedback: '*Fui* es solo para *yo*. *Mis compañeros y yo* = *nosotros*: *fuimos*.',
            }
      - id: hice-tuve
        type: fillBlank
        prompt: Completa con el pretérito indefinido.
        text: Ayer yo ___ (hacer) la tarea y ___ (tener) una reunión.
        blanks: [[hice], [tuve]]
      - id: une-irregulares
        type: matching
        prompt: Une cada verbo con su forma de *yo* en pretérito indefinido.
        pairs:
          - [hacer, hice]
          - [estar, estuve]
          - [tener, tuve]
          - [decir, dije]
          - [ir, fui]
      - id: ser-ir
        type: trueFalse
        prompt: '*Fui* puede ser del verbo *ser* o del verbo *ir*.'
        answer: true
        feedback:
          correct: '¡Correcto! *Fui líder del equipo* (ser). *Fui a una reunión* (ir).'
          incorrect: '*Ser* e *ir* tienen las mismas formas en el pretérito: *Fui líder* (ser), *Fui a una reunión* (ir).'
      - id: dijo
        type: multipleChoice
        prompt: El jefe ___ que todos hicieron un excelente trabajo.
        options:
          - { text: dijo, correct: true }
          - {
              text: deció,
              feedback: '*Decir* es irregular en el pretérito: *dije, dijiste, dijo*.',
            }
          - {
              text: dició,
              feedback: '*Decir* es irregular en el pretérito: *dije, dijiste, dijo*.',
            }
      - id: hizo
        type: fillBlank
        prompt: Completa con el pretérito indefinido de *hacer*.
        text: Ella ___ un gran trabajo en el proyecto.
        blanks: [[hizo]]
      - id: tuvo
        type: multipleChoice
        prompt: ¿Qué oración está bien escrita?
        options:
          - { text: Él tuvo una idea genial., correct: true }
          - {
              text: Él tuvó una idea genial.,
              feedback: 'Las formas irregulares no llevan tilde: *tuvo*.',
            }
          - {
              text: Él tenió una idea genial.,
              feedback: '*Tener* es irregular en el pretérito: *tuve, tuviste, tuvo*.',
            }
      - id: ordena-estuvimos
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Estuvimos en la oficina toda la semana.
        alsoAccept: [Toda la semana estuvimos en la oficina]
