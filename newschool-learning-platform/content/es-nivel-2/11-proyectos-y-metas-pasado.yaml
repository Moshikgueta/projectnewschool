# Cycle "Proyectos y metas (pasado)", converted from the Spanish level 2 digital
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-2
slug: proyectos-y-metas-pasado
title: 'Proyectos y metas: el pasado'
goal: Contar lo que hiciste por tus metas con el pretérito indefinido de verbos regulares e irregulares.
position: 11
status: in_review

review:
  - >-
    The two workbook exercises ("Pretérito: verbos regulares" and "Pretérito: verbos
    irregulares") are NEW: the notebook has no self-study exercises. They were
    written from the cycle's summary rules, examples and vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    Skills: the plan names "pasado simple y pretérito imperfecto", but nothing in
    the cycle teaches or practises the imperfecto: every activity and the whole
    summary are about the pretérito indefinido, split into regular and irregular
    verbs. The two skills are therefore "Pretérito indefinido: verbos regulares" and
    "Pretérito indefinido: verbos irregulares". Please confirm, or add imperfecto
    material.
  - >-
    The summary's "Presente subjuntivo" section was LEFT OUT. It belongs to the next
    cycle (Proyectos y metas: el futuro, where it is kept), and its "past" example is
    wrong: "Esperaba que tú vinieras" uses the imperfect subjunctive, not the present
    subjunctive, and the explanation ("the wish stays present") is not correct.
  - >-
    Summary corrections: *contribuir* is labelled "regular", but it changes i → y
    (contribuyó, contribuyeron); the rule now says so. A rule was ADDED that the
    irregular forms have no written accent (hice, hizo, tuve, tuvo), which the
    workbook checks. The conjugation lists are kept as tables; all forms were
    checked and are correct.
  - >-
    Corrections: Activity 1 "en relación a su meta" → "relacionada con tu meta";
    Activity 2 "una invención" → "un invento", frame "Esto es ___. Fue creado por ___
    el ___" → "Este / Esta es ___. Fue creado/a por ___ en ___ (año / fecha)";
    Activity 3 "Etapa ½ (no opcional)" → "Etapa 2"; the letter instructions "Cómo
    esperas que se sienta … Quiénes lo ayudaron" → "Cómo esperas que se sienta tu Yo
    del Futuro … Quiénes te ayudaron".
  - >-
    The homework has no Mori message in the source (only questions, a writing task
    and a reading). A Mori message was written from the three homework questions;
    the writing task and the reading with its questions are kept as answer boxes.
  - >-
    Vocabulary: "Establecer" glossed "לקבוע / להקים" (establecer una meta = לקבוע
    מטרה); "Alcanzar" glossed "להשיג / להגיע אל". The same list is used in the next
    cycle. The Quizlet link is kept without "?new". The source gives no activity
    times, so no minutes are recorded. The "Respuesta de alumno 1/2/3" lines are
    replaced by the answer boxes.
  - >-
    The source has no introduction round for this cycle, so none is included.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: proyectos-y-metas-pasado-clase
    title: 'Clase: Proyectos y metas (pasado)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Proyectos y metas: el pasado'
      - id: skills
        type: cycleOverview
        skills:
          - name: 'Pretérito indefinido: verbos regulares'
            description: '*Ayudé, comí, contribuí*: acciones terminadas en el pasado'
          - name: 'Pretérito indefinido: verbos irregulares'
            description: '*Fui, hice, estuve, tuve, dije*'
      - id: quizlet
        type: externalLink
        label: Proyectos y metas en Quizlet
        url: https://quizlet.com/il/985525722/goals-and-proyects-conversational-spanish-flash-cards/
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup
        type: discussionQuestions
        items:
          - question: ¿Qué hiciste hasta ahora para acercarte a tu meta?
            frame: Hasta ahora yo ___.
          - question: ¿Cuál fue tu última meta? ¿La lograste?
            frame: Mi última meta fue ___. La logré. / No la logré.
          - question: ¿Qué hiciste para lograr tu última meta?
            frame: El ___ (día de la semana), yo ___. También, el ___, yo ___.
          - question: ¿Cómo te sentiste cuando lograste tu meta?
            frame: Me sentí ___ cuando logré mi meta.
          - question: ¿Qué hiciste después de lograr tu meta?
            frame: Yo ___ después de lograr mi meta.
          - question: ¿Dónde celebraste?
            frame: Celebramos en ___ con ___. Comimos ___. Bebimos ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Mi modelo a seguir'
        skills:
          ['Pretérito indefinido: verbos regulares', 'Pretérito indefinido: verbos irregulares']
        steps:
          - Investiga sobre una persona que es tu modelo a seguir, relacionada con tu meta.
          - Presenta tu investigación al grupo en pretérito indefinido. Usa la oración de abajo.
        example: >-
          **Elegí a** Greta Thunberg como mi modelo a seguir. **Esta persona hizo lo
          siguiente:** comenzó un movimiento global por la conciencia sobre el cambio
          climático, organizó huelgas escolares y dio discursos poderosos a los líderes
          mundiales en la ONU y en otros eventos. **Creo que esto la convierte en mi
          modelo porque** mostró valentía y determinación por una causa que le
          importaba mucho, incluso siendo tan joven.
      - id: act1-frame
        type: sentenceFrame
        frame: 'Elegí a ___ como mi modelo a seguir. Esta persona hizo lo siguiente: ___. Creo que esto la convierte en mi modelo porque ___.'
      - id: act2
        type: classActivity
        title: 'Actividad 2: ¿Qué hubiese hecho sin ti?'
        skills:
          ['Pretérito indefinido: verbos regulares', 'Pretérito indefinido: verbos irregulares']
        steps:
          - Investiga sobre un invento que te ayudó a lograr tu meta. Busca el año en que fue creado y su impacto.
          - Presenta el invento al grupo con las oraciones de abajo.
        example: >-
          **Este es** el teléfono móvil. **Fue creado por** Martin Cooper y su equipo
          en Motorola el 3 de abril de 1973. **Ayudó a las personas a** comunicarse de
          manera instantánea, acceder a información en cualquier momento y organizar
          su vida con diversas aplicaciones. **Personalmente, me ayudó a** mantenerme
          conectada con mi familia, aprender nuevas habilidades y organizar mis tareas
          diarias.
      - id: act2-frame
        type: discussionQuestions
        title: Mi invento
        items:
          - question: Este / Esta es ___. Fue creado/a por ___ en ___ (año / fecha).
          - question: Ayudó a las personas a ___, ___ y ___.
          - question: Personalmente, me ayudó a ___, ___ y ___.
      - id: act3
        type: classActivity
        title: 'Actividad 3: Carta a mi Yo del Futuro'
        skills:
          ['Pretérito indefinido: verbos regulares', 'Pretérito indefinido: verbos irregulares']
        steps:
          - '(Opcional) Etapa 1: Tu profesor te guía en una visualización de tu Yo del Futuro.'
          - 'Etapa 2: Escribe una carta a tu Yo del Futuro. Di cómo esperas que se sienta después de alcanzar la meta, quiénes te ayudaron en el camino y qué hiciste en el pasado para tener éxito (usa el pretérito para esta parte).'
      - id: act3-letter
        type: discussionQuestions
        title: Querido/a Yo del Futuro
        items:
          - question: Espero que, para cuando leas esto, te sientas ___.
          - question: Sé que habrás alcanzado tu meta, y espero que recuerdes a las personas que te apoyaron, como ___.
          - question: 'Mirando hacia atrás, esto fue lo que hice para ayudarte a llegar a donde estás ahora. Comencé por ___.'
          - question: Aprendí a ___.
          - question: Me aseguré de ___.
          - question: Me enfoqué en ___.
          - question: Recordé ___.
          - question: Estoy emocionado/a de ver lo que has logrado, y sé que todo lo que estoy haciendo ahora te está ayudando a construir ese futuro increíble. Con amor, tu Yo del Presente.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Este ciclo practica el **pretérito indefinido**: verbos regulares
          (*ayudé, comí*) e irregulares (*fui, hice, tuve*). Todas las actividades usan el
          pretérito. La Actividad 1 y la Actividad 2 necesitan una pequeña investigación
          en internet.
      - id: n-warmup
        anchor: warmup
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act3
        anchor: act3
        text: >-
          Etapa 1 (opcional), lee despacio: «Imagina tu Yo del Futuro. Cierra los ojos e
          imagínate en el futuro, después de haber alcanzado tu meta. Piensa en cómo te
          sientes, cómo es tu vida y quiénes están contigo.» La carta (Etapa 2) no es
          opcional.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: proyectos-y-metas-pasado-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-regulares
        type: ruleSummary
        skill: 'Pretérito indefinido: verbos regulares'
        rules:
          - text: Usamos el pretérito indefinido para acciones que pasaron y terminaron en un momento concreto del pasado.
            examples: [Yo completé mi proyecto el mes pasado.]
          - text: 'Verbos en **-ar**: raíz + *-é, -aste, -ó, -amos, -aron*. Verbos en **-er / -ir**: raíz + *-í, -iste, -ió, -imos, -ieron*.'
            examples:
              - Ellos ayudaron a organizar los recursos para el proyecto.
              - Los miembros del equipo comieron juntos después de planificar la tarea.
          - text: 'Algunos verbos cambian la **i** por **y** entre vocales (él / ellos): *contribuyó, contribuyeron*.'
            examples: [El equipo contribuyó con ideas innovadoras para mejorar el proyecto.]
      - id: regulares-table
        type: table
        caption: Verbos regulares
        header: [Persona, Ayudar, Comer, Contribuir]
        rows:
          - [yo, ayudé, comí, contribuí]
          - [tú, ayudaste, comiste, contribuiste]
          - [él / ella / usted, ayudó, comió, contribuyó]
          - [nosotros / nosotras, ayudamos, comimos, contribuimos]
          - [ellos / ellas / ustedes, ayudaron, comieron, contribuyeron]
      - id: rules-irregulares
        type: ruleSummary
        skill: 'Pretérito indefinido: verbos irregulares'
        rules:
          - text: Los verbos irregulares no siguen las terminaciones regulares. Los aprendes hablando y practicando.
          - text: '*Ser* e *ir* tienen las mismas formas en el pretérito: *fui, fuiste, fue, fuimos, fueron*.'
            examples:
              - Fui líder del equipo el mes pasado. (ser)
              - Mis compañeros y yo fuimos a una reunión para revisar el avance del proyecto. (ir)
          - text: 'Las formas irregulares no llevan tilde: *hice, hizo, tuve, tuvo, dije, dijo*.'
            examples:
              - Ellos hicieron un gran trabajo y terminaron las tareas antes de la fecha límite.
              - Estuvimos trabajando en el proyecto durante toda la semana.
              - Tuvimos una reunión importante para definir los pasos del proyecto.
              - El jefe dijo que todos hicieron un excelente trabajo en la presentación.
      - id: irregulares-table
        type: table
        caption: Verbos irregulares
        header: [Persona, Ser / Ir, Hacer, Estar, Tener, Decir]
        rows:
          - [yo, fui, hice, estuve, tuve, dije]
          - [tú, fuiste, hiciste, estuviste, tuviste, dijiste]
          - [él / ella / usted, fue, hizo, estuvo, tuvo, dijo]
          - [nosotros / nosotras, fuimos, hicimos, estuvimos, tuvimos, dijimos]
          - [ellos / ellas / ustedes, fueron, hicieron, estuvieron, tuvieron, dijeron]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos habilidades con el grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: proyectos-y-metas-pasado-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia este mensaje y envíalo. Mori te hará preguntas; responde a todas en pasado.
      - id: mori-metas
        type: aiTutorPrompt
        title: Mis metas en el pasado
        message: >-
          ¡Hola Mori! Quiero practicar el pretérito indefinido (pasado simple). Por
          favor, hazme estas preguntas una por una y corrige mis errores: ¿Qué hiciste el
          fin de semana pasado? ¿Lograste alguna meta el mes pasado? Si es así, ¿cómo la
          lograste? ¿Qué hiciste para aprender español el año pasado?
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**
      - id: writing-title
        type: heading
        level: 3
        text: Ejercicio de escritura
      - id: writing
        type: reflection
        prompt: Escribe un párrafo corto (5–7 oraciones) sobre tu **última meta** y cómo la lograste.
      - id: reading-title
        type: heading
        level: 3
        text: Ejercicio de lectura
      - id: reading
        type: text
        text: >-
          El verano pasado, viajé a las montañas. Caminé todos los días y visité muchos
          lagos hermosos. Me quedé en una cabaña con mis amigos. Cocinamos comidas
          deliciosas y pasamos tiempo alrededor de la fogata. Fue un viaje inolvidable.
      - id: reading-questions
        type: discussionQuestions
        title: Responde en pretérito indefinido
        items:
          - question: ¿A dónde viajó la persona el verano pasado?
          - question: ¿Qué hizo allí?
          - question: ¿Con quién se quedó?
          - question: ¿Qué hizo por la noche?

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: proyectos-y-metas-pasado-practica
    book: workbook
    title: 'Práctica: Proyectos y metas (pasado)'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practica las dos habilidades del ciclo. Cada respuesta se corrige al momento, y puedes intentarlo otra vez.
      - id: ex-regulares
        type: activity
        activity: proyectos-y-metas-pasado-regulares
      - id: ex-irregulares
        type: activity
        activity: proyectos-y-metas-pasado-irregulares

