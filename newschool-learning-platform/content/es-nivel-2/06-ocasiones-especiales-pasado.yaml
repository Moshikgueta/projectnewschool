vocabulary:
  - slug: ocasiones-especiales-pasado
    title: 'Ocasiones especiales: pasado'
    items: *ocasiones-especiales-pasado-words

activities:
  - slug: ocasiones-especiales-pasado-narrar
    title: 'Contar en pasado: celebré, fui, comimos'
    minutes: 8
    items:
      - id: celebre
        type: multipleChoice
        prompt: 'El año pasado (yo) ___ mi cumpleaños en casa.'
        options:
          - { text: celebré, correct: true }
          - {
              text: celebró,
              feedback: '*Celebró* es para *él / ella*. Para *yo* usamos *-é*: *celebré*.',
            }
          - {
              text: celebro,
              feedback: '*Celebro* es presente. *El año pasado* pide el pasado: *celebré*.',
            }
      - id: comimos
        type: fillBlank
        prompt: Escribe el verbo en pretérito indefinido.
        text: Ayer ___ (comer, nosotros) pizza.
        blanks: [[comimos, nosotros comimos]]
      - id: une-irregulares
        type: matching
        prompt: Une cada verbo con su forma de *yo* en pasado.
        pairs:
          - [ir, fui]
          - [tener, tuve]
          - [hacer, hice]
          - [dar, di]
          - [recibir, recibí]
      - id: negativa
        type: fillBlank
        prompt: 'Escribe la frase en negativo, con el verbo *ir* en pasado (yo).'
        text: Estuve enfermo. ___ a la fiesta.
        blanks: [[No fui, Yo no fui]]
      - id: er-ir
        type: trueFalse
        prompt: 'Los verbos en *-er* y en *-ir* tienen las mismas terminaciones en pretérito indefinido: *comí, recibí*.'
        answer: true
        feedback:
          correct: '¡Correcto! *-í, -iste, -ió, -imos, -isteis, -ieron*: *comí, recibí*.'
          incorrect: 'Son las mismas: *comí / recibí, comiste / recibiste, comió / recibió*.'
      - id: dieron
        type: multipleChoice
        prompt: Mis amigos me ___ un regalo muy bonito.
        options:
          - { text: dieron, correct: true }
          - {
              text: daron,
              feedback: '*Dar* es irregular en pasado: *di, diste, dio, dimos, dieron*.',
            }
          - { text: dio, feedback: '*Dio* es para *él / ella*. *Mis amigos* = *ellos*: *dieron*.' }
      - id: ordena-bailamos
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Bailamos salsa y escuchamos música.
      - id: expresion
        type: multipleChoice
        prompt: ¿Qué expresión usamos con el pretérito indefinido?
        options:
          - { text: el año pasado, correct: true }
          - {
              text: el próximo año,
              feedback: '*El próximo año* es futuro. Para el pasado: *ayer, el año pasado, hace dos años…*',
            }
          - {
              text: mañana,
              feedback: '*Mañana* es futuro. Para el pasado: *ayer, anoche, la semana pasada…*',
            }

  - slug: ocasiones-especiales-pasado-preguntas
    title: 'Preguntas sobre el pasado: ¿qué hiciste?'
    minutes: 8
    items:
      - id: hiciste
        type: multipleChoice
        prompt: '¿Qué ___ el fin de semana pasado? (hacer, tú)'
        options:
          - { text: hiciste, correct: true }
          - { text: hice, feedback: '*Hice* es para *yo*. Para preguntar a *tú*: *hiciste*.' }
          - {
              text: hizo,
              feedback: '*Hizo* es para *él / ella*. Para preguntar a *tú*: *hiciste*.',
            }
      - id: celebraste
        type: fillBlank
        prompt: Escribe el verbo en pretérito indefinido.
        text: ¿Dónde ___ (celebrar, tú) tu mejor cumpleaños?
        blanks: [[celebraste]]
      - id: vino
        type: fillBlank
        prompt: Escribe el verbo en pretérito indefinido.
        text: ¿Quién ___ (venir) a tu fiesta?
        blanks: [[vino]]
      - id: une-respuestas
        type: matching
        prompt: Une cada pregunta con su respuesta.
        pairs:
          - [¿Qué regalo recibiste?, Recibí un libro de mi hermana.]
          - [¿Dónde celebraste tu cumpleaños?, En un restaurante.]
          - [¿Quién vino a tu fiesta?, Vinieron mis amigos.]
          - [¿Qué comiste en la fiesta?, Comí pizza.]
          - [¿Cuándo fuiste a la boda?, El año pasado.]
      - id: forma-tu
        type: trueFalse
        prompt: 'En la pregunta *¿Qué hiciste?*, *hiciste* es la forma de *tú*.'
        answer: true
        feedback:
          correct: '¡Correcto! *hice* (yo), *hiciste* (tú), *hizo* (él / ella).'
          incorrect: '*Hiciste* es la forma de *tú*: *hice* (yo), *hiciste* (tú), *hizo* (él / ella).'
      - id: adonde
        type: multipleChoice
        prompt: '¿___ fuiste de vacaciones? — Fui a España.'
        options:
          - { text: Adónde, correct: true }
          - {
              text: Quién,
              feedback: '*Quién* pregunta por una persona. Para un lugar con *ir* usamos *¿Adónde…?*',
            }
          - {
              text: Cuánto,
              feedback: '*Cuánto* pregunta por una cantidad. Para un lugar con *ir* usamos *¿Adónde…?*',
            }
      - id: ordena-regalo
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: ¿Qué regalo recibiste en tu cumpleaños?
      - id: comiste
        type: fillBlank
        prompt: Escribe el verbo en pretérito indefinido.
        text: ¿___ (comer, tú) pastel en la fiesta? — No, no comí pastel.
        blanks: [[Comiste]]
