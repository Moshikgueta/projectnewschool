          - { text: Ella no comí nada., feedback: '*Comí* es para *yo*. Para *ella* usa *comió*.' }
          - {
              text: Ella comió no nada.,
              feedback: '*No* va antes del verbo: *Ella no comió nada.*',
            }

  - slug: salud-consejos
    title: 'Dar consejos: deberías, puedes, tienes que'
    minutes: 8
    items:
      - id: deberias
        type: multipleChoice
        prompt: 'Tu amigo tiene dolor de cabeza. Le dices: «___ descansar».'
        options:
          - { text: Deberías, correct: true }
          - {
              text: Deber,
              feedback: 'Hay que conjugar *deber* para la persona: a tu amigo (tú) le dices *deberías*.',
            }
          - {
              text: Debemos,
              feedback: '*Debemos* es para *nosotros*. Para tu amigo (tú) usa *deberías*.',
            }
      - id: infinitivo
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: Deberías dormir más., correct: true }
          - {
              text: Deberías duermes más.,
              feedback: 'Después de *deberías* el verbo va en infinitivo: *dormir*.',
            }
          - {
              text: Deberías a dormir más.,
              feedback: 'Con *deber* no usamos *a*: *Deberías dormir más.*',
            }
      - id: se-conjugan
        type: trueFalse
        prompt: '*Deber* no cambia con la persona: *yo debe, tú debe, él debe*.'
        answer: false
        feedback:
          correct: '¡Correcto! *Deber* se conjuga: yo debo, tú debes, él debe.'
          incorrect: 'En español *deber* se conjuga según la persona: yo debo, tú debes, él debe.'
      - id: debe
        type: fillBlank
        prompt: Completa con el verbo *deber* en presente.
        text: Él ___ descansar el brazo.
        blanks: [[debe]]
      - id: tienes-que
        type: fillBlank
        prompt: Completa con el verbo *tener* (tú).
        text: Si mañana todavía te duele, ___ que ir al hospital.
        blanks: [[tienes, tú tienes]]
      - id: problema-consejo
        type: matching
        prompt: Une cada problema con un buen consejo.
        pairs:
          - [Tengo dolor de garganta., Deberías beber té caliente.]
          - [No duermo bien por la noche., Podrías leer un libro antes de dormir.]
          - [Como demasiada comida rápida., Deberías comer más fruta.]
          - [Nunca bebo agua., Tienes que beber dos litros de agua al día.]
          - [Me duele la espalda., Deberías caminar más y no estar sentado todo el día.]
      - id: sera-mejor
        type: multipleChoice
        prompt: Será mejor que ___ en casa hoy.
        options:
          - { text: te quedes, correct: true }
          - {
              text: te quedas,
              feedback: 'Después de *será mejor que* usamos el subjuntivo: *te quedes*.',
            }
          - {
              text: quedarte,
              feedback: 'Después de *será mejor que* va un verbo conjugado en subjuntivo: *te quedes*.',
            }
      - id: ordena-agua
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Deberías beber mucha agua.
