vocabulary:
  - slug: salud
    title: Salud
    items: *salud-words

activities:
  - slug: salud-preterito
    title: 'Pretérito indefinido: ¿qué pasó?'
    minutes: 8
    items:
      - id: fui
        type: multipleChoice
        prompt: Ayer yo ___ al médico.
        options:
          - { text: fui, correct: true }
          - { text: fue, feedback: '*Fue* es para él / ella. Para *yo* usa *fui*.' }
          - { text: voy, feedback: '*Ayer* habla del pasado: usa el pretérito indefinido, *fui*.' }
      - id: comi
        type: fillBlank
        prompt: Completa con el verbo *comer* en pretérito indefinido.
        text: Anoche ___ pollo en mal estado.
        blanks: [[comí, yo comí]]
      - id: formas
        type: matching
        prompt: Une cada verbo con su forma en pretérito indefinido.
        pairs:
          - [caminar (yo), caminé]
          - [comer (ella), comió]
          - [vivir (ellos), vivieron]
          - [tomar (tú), tomaste]
          - [hacer (yo), hice]
      - id: negativo
        type: trueFalse
        prompt: 'Para hacer una oración negativa en pasado, ponemos *no* antes del verbo: *No fui al médico.*'
        answer: true
        feedback:
          correct: ¡Correcto! *No* va antes del verbo, y el verbo no cambia.
          incorrect: 'En español solo ponemos *no* antes del verbo: *No fui al médico. No comí nada.*'
      - id: tomaste
        type: multipleChoice
        prompt: '¿___ algún medicamento? (tú)'
        options:
          - { text: Tomaste, correct: true }
          - { text: Tomé, feedback: '*Tomé* es para *yo*. Para *tú* usa *tomaste*.' }
          - { text: Tomas, feedback: '*Tomas* es presente. Para el pasado usa *tomaste*.' }
      - id: me-cai
        type: fillBlank
        prompt: Completa con *caer* y *lastimar* en pretérito indefinido (yo).
        text: Ayer me ___ en casa y me ___ el brazo.
        blanks: [[caí], [lastimé]]
      - id: ordena-escaleras
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Me caí en las escaleras.
      - id: no-comio
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
