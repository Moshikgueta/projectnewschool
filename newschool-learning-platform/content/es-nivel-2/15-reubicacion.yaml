vocabulary:
  - slug: reubicacion
    title: Reubicación
    items: *reubicacion-words

activities:
  - slug: reubicacion-futuro
    title: 'Futuro: voy a mudarme, me mudaré'
    minutes: 8
    items:
      - id: me-mudare
        type: multipleChoice
        prompt: El año que viene, yo ___ a España.
        options:
          - { text: me mudaré, correct: true }
          - {
              text: me mudará,
              feedback: 'La terminación *-á* es para él o ella. Para *yo*: *me mudaré*.',
            }
          - {
              text: me mudé,
              feedback: '*Me mudé* es pasado. *El año que viene* es futuro: *me mudaré*.',
            }
      - id: ahorrare
        type: fillBlank
        prompt: Completa con el verbo *ahorrar* (yo) en futuro simple.
        text: Antes de mudarme, ___ dinero.
        blanks: [[ahorraré, yo ahorraré]]
      - id: hare
        type: fillBlank
        prompt: Completa con el verbo *hacer* (yo) en futuro simple.
        text: Mañana ___ las maletas.
        blanks: [[haré, yo haré]]
      - id: une-futuro
        type: matching
        prompt: Une cada verbo con su forma para *yo* en futuro simple.
        pairs:
          - [hacer, haré]
          - [tener, tendré]
          - [salir, saldré]
          - [ir, iré]
          - [comer, comeré]
      - id: ir-a
        type: fillBlank
        prompt: Completa con el verbo *ir* en presente.
        text: Mi familia ___ a buscar un apartamento nuevo. Nosotros ___ a aprender el idioma.
        blanks: [[va], [vamos]]
      - id: pronombre
        type: trueFalse
        prompt: '*Voy a mudarme* y *Me voy a mudar* son correctas las dos.'
        answer: true
        feedback:
          correct: ¡Correcto! El pronombre puede ir antes de *voy* o al final del infinitivo.
          incorrect: 'Las dos son correctas: el pronombre puede ir antes de *voy* o al final del infinitivo.'
      - id: voy-a-buscar
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: Voy a buscar un trabajo nuevo., correct: true }
          - {
              text: Voy buscar un trabajo nuevo.,
              feedback: 'Falta *a*: *ir + a + infinitivo* → *voy a buscar*.',
            }
          - {
              text: Voy a busco un trabajo nuevo.,
              feedback: 'Después de *voy a* va el infinitivo: *buscar*.',
            }
      - id: ordena-metro
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Tomaré el metro para ir al trabajo.

  - slug: reubicacion-socializar
    title: 'Socializar: pedir y dar información'
    minutes: 8
    items:
      - id: pregunta-practica
        type: multipleChoice
        prompt: Acabas de llegar a una ciudad nueva y buscas un lugar para comer. ¿Qué pregunta es directa y práctica?
        options:
          - { text: ¿Dónde está el mejor restaurante?, correct: true }
          - {
              text: ¿Te gusta comer?,
              feedback: 'Esta pregunta no te da información útil. Pregunta directo: *¿Dónde está el mejor restaurante?*',
            }
          - {
              text: ¿Qué hiciste ayer?,
              feedback: 'Esta pregunta no es práctica para buscar comida. Pregunta directo: *¿Dónde está el mejor restaurante?*',
            }
      - id: grupo-correcto
        type: multipleChoice
        prompt: Te mudaste a Madrid y quieres saber cuál es el mejor barrio para vivir. ¿Dónde preguntas?
        options:
          - { text: En un grupo de Facebook de Madrid., correct: true }
          - {
              text: En un grupo general de recetas.,
              feedback: 'Elige el grupo correcto antes de preguntar: un grupo de tu nueva ciudad.',
            }
          - {
              text: En un grupo de fútbol de otro país.,
              feedback: 'Elige el grupo correcto antes de preguntar: un grupo de tu nueva ciudad.',
            }
      - id: breve
        type: trueFalse
        prompt: 'Para socializar, es mejor dar la información esencial, por ejemplo: *Me mudaré en julio.*'
        answer: true
        feedback:
          correct: ¡Correcto! Una respuesta breve y clara es suficiente.
          incorrect: 'Sé breve: da solo la información esencial. *Me mudaré en julio.* es claro y suficiente.'
      - id: como-donde
        type: fillBlank
        prompt: Completa las preguntas con *Cómo* o *Dónde*.
        text: ¿___ se paga el estacionamiento? ¿___ está el supermercado más cercano?
        blanks: [[Cómo, Dónde], [Dónde]]
        wordBank: [Cómo, Dónde]
      - id: une-respuestas
        type: matching
        prompt: Une cada pregunta con una respuesta breve.
        pairs:
          - [¿Cuándo te mudarás?, En julio.]
          - [¿Con quién te vas a mudar?, Con mi familia.]
          - [¿Dónde está la farmacia?, Al lado del supermercado.]
          - [¿Cómo se paga el transporte público?, Con una tarjeta.]
      - id: lugares
        type: fillBlank
        prompt: Completa con un lugar de la ciudad.
        text: Para tomar el tren, voy a la ___ de tren. Para comprar medicinas, voy a la ___.
        blanks: [[estación], [farmacia]]
        wordBank: [estación, farmacia, biblioteca]
      - id: ordena-supermercado
        type: reorderSentence
        prompt: Ordena las palabras.
