vocabulary:
  - slug: sustentabilidad
    title: Sustentabilidad
    items: *sustentabilidad-words

activities:
  - slug: sustentabilidad-futuro
    title: 'Planes futuros: voy a reciclar, habrá'
    minutes: 8
    items:
      - id: voy-a-reciclar
        type: multipleChoice
        prompt: Mañana (yo) ___ reciclar más botellas.
        options:
          - { text: voy a, correct: true }
          - { text: voy, feedback: 'Falta *a*: *ir a + infinitivo* (*voy a reciclar*).' }
          - {
              text: vamos a,
              feedback: '*Vamos a* es para *nosotros*. Para *yo*: *voy a reciclar*.',
            }
      - id: van-a
        type: fillBlank
        prompt: Completa con el verbo *ir*.
        text: Ellos ___ a usar bicicleta en el futuro. Nosotros ___ a plantar árboles.
        blanks: [[van], [vamos]]
      - id: ir-a-planes
        type: trueFalse
        prompt: 'Usamos *ir a + infinitivo* para planes e intenciones: *Vamos a plantar árboles.*'
        answer: true
        feedback:
          correct: ¡Correcto! *Ir a + infinitivo* es para planes.
          incorrect: '*Ir a + infinitivo* sí es para planes e intenciones: *Voy a reciclar más botellas.*'
      - id: une-futuro
        type: matching
        prompt: Une cada verbo con su futuro simple (él / ella).
        pairs:
          - [tener, tendrá]
          - [ser, será]
          - [haber, habrá]
          - [usar, usará]
          - [plantar, plantará]
      - id: habra
        type: fillBlank
        prompt: Escribe *haber* en futuro simple.
        text: En 2050 ___ menos coches y ___ menos contaminación.
        blanks: [[habrá], [habrá]]
      - id: sera-barata
        type: multipleChoice
        prompt: La energía solar ___ más barata en el futuro.
        options:
          - { text: será, correct: true }
          - { text: serán, feedback: '*La energía* es singular: *será*.' }
          - { text: va ser, feedback: 'Falta *a*: *va a ser*. O en futuro simple: *será*.' }
      - id: plantaremos
        type: fillBlank
        prompt: Escribe *plantar* en futuro simple.
        text: En el futuro, nosotros ___ más árboles.
        blanks: [[plantaremos]]
      - id: ordena-plastico
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: No vamos a usar plástico.

  - slug: sustentabilidad-comparaciones
    title: 'Comparaciones: más ecológico, el más contaminante'
    minutes: 8
    items:
      - id: mas-ecologica
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: La bicicleta es más ecológica que el coche., correct: true }
          - {
              text: La bicicleta es más ecológica como el coche.,
              feedback: 'Con *más* usamos *que*: *más ecológica que*.',
            }
          - {
              text: La bicicleta es más ecológico que el coche.,
              feedback: '*Bicicleta* es femenino: *ecológica*.',
            }
      - id: menos-contaminante
        type: fillBlank
        prompt: Completa con *menos … que*.
        text: La bolsa de tela es ___ contaminante ___ la bolsa de plástico.
        blanks: [[menos], [que]]
      - id: tan-ruidosa
        type: fillBlank
        prompt: Completa la comparación.
        text: Mi ciudad es tan ruidosa ___ la tuya.
        blanks: [[como]]
      - id: tan-limpia
        type: multipleChoice
        prompt: Barcelona es ___ limpia como Buenos Aires.
        options:
          - { text: tan, correct: true }
          - {
              text: más,
              feedback: 'Con *como* usamos *tan*: *tan limpia como*. Con *más* usamos *que*.',
            }
          - {
              text: menos,
              feedback: 'Con *como* usamos *tan*: *tan limpia como*. Con *menos* usamos *que*.',
            }
      - id: el-menos
        type: multipleChoice
        prompt: El coche es ___ medio de transporte menos ecológico.
        options:
          - { text: el, correct: true }
          - { text: la, feedback: '*Medio* es masculino: *el medio de transporte*.' }
          - {
              text: más,
              feedback: 'El superlativo empieza con *el / la*: *el medio de transporte menos ecológico*.',
            }
      - id: mas-bueno
        type: trueFalse
        prompt: '*La bicicleta es más buena que el coche para el planeta* es la mejor forma.'
        answer: false
        feedback:
          correct: '¡Correcto! Decimos *mejor*: *La bicicleta es mejor que el coche.*'
          incorrect: '*Bueno* tiene una forma especial: *mejor*. *La bicicleta es mejor que el coche.*'
      - id: une-estructuras
        type: matching
        prompt: Une cada estructura con su significado.
        pairs:
          - [más … que, יותר … מ־]
          - [menos … que, פחות … מ־]
          - [tan … como, באותה מידה … כמו]
          - [el / la más, הכי / ביותר]
      - id: ordena-material
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: El plástico es el material más contaminante.
