# Cycle "Experiencias pasadas", converted from the Spanish level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-2
slug: experiencias-pasadas
title: Experiencias pasadas
goal: Contar experiencias en pasado y hacer preguntas en pasado.
position: 1
status: in_review

review:
  - >-
    The two workbook exercises ("Oraciones en pasado" and "Preguntas en pasado") are
    NEW: the notebook has no self-study exercises. They were written from the cycle's
    two skills, its summary rules, the activity examples and its vocabulary. Please
    check level, wording and every right answer before students see them.
  - >-
    Summary, grammar: the notebook writes "pretérito indefinido / perfecto" as if it
    were one tense, and gives only indefinido examples (Ayer comí pizza). But
    Activity 2 uses both ("Nunca comí sushi" / "Nunca he comido sushi"). The summary
    now explains the two tenses separately: indefinido (comí, fui, vi) for finished
    actions with a finished time marker (ayer, la semana pasada), and pretérito
    perfecto (he comido, has ido, ha visto) for life experiences without a specific
    time (nunca, alguna vez, ya) and for hoy / esta semana. A table of the forms was
    added. Please confirm this matches how you teach it.
  - >-
    Summary, skill 2 ("Construir preguntas en pasado") has no rules in the source.
    A short rule was added from the activity examples (question word + verb in the
    tú form -aste / -iste: ¿Qué cocinaste? ¿Con quién fuiste?) and the 1st / 2nd /
    3rd person list from Activity 1. The workbook uses it.
  - >-
    Corrections: "¿Dónde fuiste…?" → "¿Adónde fuiste…?" (Mori message 1 and
    Activity 3; with "ir" we ask "adónde"); Activity 3 example "La última vez que
    viajé fue a Madrid" → "La última vez que viajé, fui a Madrid"; Mori message 1 "Yo
    voy a responder y corrígeme si me equivoco" → "Voy a responder. Corrígeme si me
    equivoco"; Mori message 3 word order ("te voy a contar en tercera persona qué hizo
    ayer…"); a stray character "ð" before "Regla práctica" was removed.
  - >-
    Mori, intermediate message 2 asks for "3 en indefinido/perfecto y 2 en
    imperfecto", but the example has 2 in indefinido and 3 in imperfecto. The message
    now says "2 en pretérito indefinido y 3 en imperfecto" to match the example.
  - >-
    Vocabulary: "Reí / Reíste / Rió" → "Rio" (no accent since the 2010 spelling
    rules); "Descansé… נחתי / נח / נח" → "נחתי / נחת / נח"; "El otro día, ביום האחר"
    → "לפני כמה ימים" (the Hebrew was a word-for-word translation). Please confirm.
  - >-
    The cycle has no introduction round in the source, so none was added. The plan
    says skill 2 (questions) is practised in Activity 1 or 4; Activity 4 (stories
    from three photos) mostly practises past sentences. The plan is kept as in the
    source. Activity 4 needs three photos chosen by the teacher (not in the notebook).
  - >-
    Times given as ranges are recorded as the upper value (7–8 → 8, 3–4 → 4, 2–3 →
    3). The Quizlet link is kept without its "?new" parameter. The "Respuesta de
    alumno 1/2/3" lines are replaced by the optional answer boxes (decision C2).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: experiencias-pasadas-clase
    title: 'Clase: Experiencias pasadas'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Experiencias pasadas
      - id: skills
        type: cycleOverview
        skills:
          - name: Oraciones en pasado
            description: Pretérito indefinido (*comí, fui, vi*) y pretérito perfecto (*he comido*)
          - name: Preguntas en pasado
            description: '*¿Qué hiciste? ¿Adónde fuiste? ¿Con quién comiste?*'
      - id: quizlet
        type: externalLink
        label: Experiencias pasadas en Quizlet
        url: https://quizlet.com/br/1069755691/experiencias-pasadas-actualizado-flash-cards/
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup-basic-title
        type: heading
        level: 4
        text: Nivel iniciante
      - id: warmup-basic
        type: discussionQuestions
        items:
          - question: ¿Qué hiciste el fin de semana pasado?
            frame: El fin de semana pasado fui a… / comí… / vi…
          - question: ¿A qué hora te despertaste ayer?
            frame: Ayer me desperté a las…
          - question: ¿Qué comiste en tu última comida?
            frame: En mi última comida comí…
          - question: ¿Qué lugares visitaste el mes pasado?
            frame: El mes pasado visité…
          - question: ¿Qué fue lo último que compraste en una tienda?
            frame: Lo último que compré fue…
          - question: ¿Qué aprendiste en la escuela (o en un curso) la semana pasada?
            frame: La semana pasada aprendí…
      - id: warmup-inter-title
        type: heading
        level: 4
        text: Nivel intermedio
      - id: warmup-inter
        type: discussionQuestions
        items:
          - question: ¿Cuál fue la última película o serie que viste y qué te pareció?
            frame: La última película que vi fue… y me pareció…
          - question: ¿Qué hiciste ayer por la tarde / noche y con quién estuviste?
            frame: Ayer por la noche… Estuve con…
          - question: ¿A qué país viajaste en tus últimas vacaciones y qué fue lo mejor del viaje?
            frame: Viajé a… y lo mejor fue…
          - question: ¿Qué fue lo más interesante que aprendiste recientemente en la escuela, en el trabajo o en un curso?
            frame: Aprendí… y me gustó porque…
          - question: ¿Cuál fue tu mejor experiencia del último mes y por qué fue especial?
            frame: Mi mejor experiencia fue… porque…
          - question: ¿Qué fue lo más divertido que hiciste la semana pasada y con quién lo compartiste?
            frame: La semana pasada hice… con… y fue muy divertido.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: ¿Y qué hiciste ayer…?'
        skills: [Preguntas en pasado, Oraciones en pasado]
        minutes: 17
        steps:
          - Escribe 3 cosas que hiciste ayer.
          - 'En parejas: el alumno A lee una de sus frases. El alumno B hace la pregunta que corresponde.'
          - Repitan con las 3 frases de cada uno.
          - Comenten si hicieron algo parecido o diferente.
          - Cuenta al grupo, en tercera persona, qué hizo tu compañero.
        example: |-
          *A: Ayer cociné pasta.*
          *B: ¿Qué cocinaste ayer?*
          *Yo también vi una película. / Yo no cociné, comí en un restaurante.*
          *Mi compañero cocinó pasta y vio una película ayer.*
      - id: act1-levels
        type: callout
        tone: info
        title: Por nivel
        text: |-
          **Nivel iniciante:** frases cortas y muy simples (*Ayer fui al supermercado.*).
          **Nivel intermedio:** añade detalles (*Ayer cociné pasta con mi hermana en casa.*).
      - id: act1-sentences
        type: discussionQuestions
        title: Mis 3 frases de ayer
        items:
          - question: Ayer ___.
          - question: Ayer ___.
          - question: Ayer ___.
      - id: act2
        type: classActivity
        title: 'Actividad 2: Yo nunca, nunca he…'
        skills: [Oraciones en pasado]
        steps:
          - Di algo que nunca hiciste.
          - Quien sí lo hizo recibe un punto negativo.
          - Con dos puntos negativos, estás eliminado. Gana el último que queda.
        example: |-
          *Nunca comí sushi.* (nivel iniciante: pretérito indefinido)
          *Nunca he comido sushi.* (nivel intermedio: pretérito perfecto)
      - id: act2-sentences
        type: discussionQuestions
        title: Yo nunca…
        items:
          - question: Nunca ___.
            frame: Nunca comí… / Nunca he comido…
          - question: Nunca ___.
            frame: Nunca fui a… / Nunca he ido a…
          - question: Nunca ___.
            frame: Nunca vi… / Nunca he visto…
      - id: act3
        type: classActivity
        title: 'Actividad 3: La última vez que…'
        skills: [Oraciones en pasado, Preguntas en pasado]
        minutes: 17
        steps:
          - Completa las 3 frases de abajo. Puedes añadir un detalle (lugar, comida, persona).
          - 'En parejas: lee tus frases. Tu compañero te hace una o dos preguntas para saber más.'
          - Cuenta al grupo, en tercera persona, qué descubriste de tu compañero.
        example: |-
          *A: La última vez que fui al cine fue el sábado.*
          *B: ¿Con quién fuiste? ¿Qué película viste?*
          *A: La última vez que cociné fue ayer.*
          *B: ¿Qué cocinaste? ¿Con quién comiste?*
          *Mi compañero fue al cine el sábado con su hermano y vio una película de acción.*
      - id: act3-sentences
        type: discussionQuestions
        title: La última vez que…
        items:
          - question: La última vez que fui al cine fue ___.
          - question: La última vez que cociné fue ___.
          - question: La última vez que viajé fue ___.
      - id: act3-levels
        type: callout
        tone: info
        title: Por nivel
        text: |-
          **Nivel iniciante:** frases cortas con una acción. *La última vez que viajé, fui a Madrid.*
          **Nivel intermedio:** añade detalles con el imperfecto. *La última vez que viajé, fui a Madrid. El clima estaba muy bonito y siempre salíamos a pasear.*
      - id: act4
        type: classActivity
        title: 'Actividad 4: Historias en tres fotos'
        skills: [Oraciones en pasado, Preguntas en pasado]
        steps:
          - Mira las 3 fotos que muestra tu profesor.
          - Solo o en pareja, crea una mini-historia en pasado que conecta las 3 fotos.
          - Usa al menos 3 verbos en pasado. Puedes añadir detalles.
          - Comparte tu historia con la clase.
        example: '*El verano pasado fui a la playa, después comí en un restaurante y al final terminé en una fiesta con mis amigos.*'
      - id: act4-levels
        type: callout
        tone: info
        title: Por nivel
        text: |-
          **Nivel iniciante:** frases cortas, con *ayer, la semana pasada*. *Ayer fui al cine, después comí pizza y más tarde hablé con mi amigo.*
          **Nivel intermedio:** una historia más larga, con descripciones en imperfecto. *Cuando era niño, siempre iba a la playa con mi familia. El año pasado fui de nuevo, comí en un restaurante y después bailé en una fiesta.*
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Oraciones en pasado** (pretérito indefinido /
          pretérito perfecto), con las preguntas de calentamiento y la Actividad 2 o 3; y
          **Preguntas en pasado**, con la Actividad 1 o 4. Elige las preguntas de
          calentamiento del nivel de tu grupo (iniciante o intermedio).
      - id: n-warmup
        anchor: warmup-title
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act1
        anchor: act1
        minutes: 17
        text: >-
          Preparación individual: 3 minutos. Trabajo en parejas: 8 minutos. Comparación: 3
          minutos. Cierre: 3 minutos (algunos alumnos cuentan en tercera persona lo que
          hizo su compañero). Así practican la 1ª persona (*Yo cociné*), la 2ª (*¿Qué
          cocinaste?*) y la 3ª (*Él cocinó*).
      - id: n-act2
        anchor: act2
        text: >-
          Con grupos iniciantes, acepta el pretérito indefinido (*Nunca comí sushi*). Con
          grupos intermedios o avanzados, pide el pretérito perfecto (*Nunca he comido
          sushi*).
      - id: n-act3
        anchor: act3
        minutes: 17
        text: >-
          Preparación individual: 4 minutos. Trabajo en parejas: 8 minutos. Cierre en
          grupo: 5 minutos. Practican la 1ª persona (*La última vez que viajé…*), la 2ª
          (*¿Adónde fuiste? ¿Con quién viajaste?*) y la 3ª (*Mi compañero viajó a…*).
      - id: n-act4
        anchor: act4
        text: >-
          Antes de la clase, elige 3 imágenes relacionadas con experiencias (por ejemplo:
          playa, restaurante, fiesta). Muéstralas en la pantalla o entrégalas impresas.
          Da primero el ejemplo modelo. Al final, destaca el uso correcto de los verbos en
          pasado y de los marcadores de tiempo.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: experiencias-pasadas-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: basic-title
        type: heading
        level: 3
        text: Nivel iniciante
      - id: rules-indefinido
        type: ruleSummary
        skill: Oraciones en pasado
        rules:
          - text: 'El **pretérito indefinido** cuenta cosas que pasaron **una vez** y ya terminaron, con un marcador de tiempo claro.'
            examples: [Ayer comí pizza., El sábado fui al cine., La semana pasada vi una película.]
          - text: 'Marcadores de tiempo típicos del indefinido:'
            examples:
              - 'ayer, anoche, el sábado pasado, la semana pasada, hace dos días, el fin de semana pasado'
          - text: 'El **pretérito perfecto** (*he / has / ha* + participio) cuenta experiencias de la vida **sin un momento concreto**, con *nunca, alguna vez, ya*, y también lo que pasó *hoy* o *esta semana*.'
            examples:
              [Nunca he comido sushi., ¿Alguna vez has ido a México?, Hoy he visto a mi amiga.]
          - text: '**Regla práctica:** ¿hay un momento terminado (*ayer, el sábado*)? Usa el indefinido: *Ayer comí sushi.* ¿Hablas de tu vida en general (*nunca, alguna vez*)? Puedes usar el perfecto: *Nunca he comido sushi.*'
      - id: forms-table
        type: table
        caption: Formas practicadas en clase
        header: [Persona, Indefinido, Perfecto]
        rows:
          - [Yo, 'comí, fui, vi', 'he comido, he ido, he visto']
          - [Tú, 'comiste, fuiste, viste', 'has comido, has ido, has visto']
          - [Él / Ella, 'comió, fue, vio', 'ha comido, ha ido, ha visto']
      - id: rules-preguntas
        type: ruleSummary
        skill: Preguntas en pasado
        rules:
          - text: 'Para preguntar a otra persona (tú), el verbo en indefinido termina en **-aste** (verbos en -ar) o **-iste** (verbos en -er / -ir).'
            examples: [Ayer cociné pasta. → ¿Qué cocinaste ayer?, Comí ensalada. → ¿Qué comiste?]
          - text: 'Pon la palabra interrogativa primero, con tilde: *qué, dónde, adónde, cuándo, con quién, a qué hora*.'
            examples: [¿Con quién fuiste?, ¿Qué película viste?, ¿A qué hora te despertaste?]
          - text: 'Para contar lo que hizo tu compañero, usa la tercera persona.'
            examples:
              [
                Yo cociné. → ¿Qué cocinaste? → Él cocinó pasta.,
                Mi compañero fue al cine y vio una película.,
              ]
      - id: inter-title
        type: heading
        level: 3
        text: Nivel intermedio
      - id: rules-imperfecto
        type: ruleSummary
        skill: Oraciones en pasado (con imperfecto)
        rules:
          - text: 'El indefinido cuenta hechos concretos, con más detalle y más verbos.'
            examples:
              [
                El año pasado viajé a Italia.,
                Hace dos días cené con mis amigos.,
                Ayer estudié para un examen.,
              ]
          - text: 'El **pretérito imperfecto** habla de lo que solías hacer antes (hábitos), de cómo eran las cosas y del contexto.'
            examples:
              - Cuando era niño, siempre jugaba al fútbol.
              - Mi barrio era muy tranquilo.
              - En la escuela siempre teníamos clases de música.
          - text: 'Marcadores de tiempo típicos del imperfecto:'
            examples: ['cuando era niño, en mi infancia, antes, siempre, normalmente']
          - text: '**Regla práctica:** indefinido → qué pasó. Imperfecto → cómo era la situación, qué solías hacer.'
            examples:
              - El verano pasado viajé a la playa (indefinido). El mar estaba muy tranquilo y hacía calor (imperfecto).
      - id: imperfecto-table
        type: table
        caption: Imperfecto
        header: [Persona, jugar, vivir, escuchar]
        rows:
          - [Yo, jugaba, vivía, escuchaba]
          - [Tú, jugabas, vivías, escuchabas]
          - [Él / Ella, jugaba, vivía, escuchaba]
      - id: recap
        type: callout
        tone: info
        title: Resumen de lo aprendido
        text: |-
          **Nivel iniciante:** usa el indefinido (o el perfecto) para contar cosas simples y terminadas.
          **Nivel intermedio:** usa el indefinido + el imperfecto para contar experiencias más completas, con contexto y descripciones.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las reglas del nivel de tu grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: experiencias-pasadas-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia un mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: basic-title
        type: heading
        level: 3
        text: Nivel iniciante
      - id: basic-goal
        type: text
        text: 'Objetivo: practicar el pretérito indefinido con frases cortas, preguntas simples y reportes en tercera persona.'
      - id: mori-basic-1
        type: aiTutorPrompt
        title: 'Mensaje 1: Preguntas y respuestas'
        message: |-
          Hola Mori, quiero practicar el pasado. Hazme 5 preguntas fáciles como:
          ¿Qué hiciste ayer?
          ¿Qué comiste?
          ¿Adónde fuiste el fin de semana pasado?
          Voy a responder. Corrígeme si me equivoco.
      - id: mori-basic-2
        type: aiTutorPrompt
        title: 'Mensaje 2: Mini-diario'
        intro: 'Después, escribe 4 frases. Ejemplo: *Ayer fui al supermercado. Anoche vi una serie. El fin de semana pasado cociné pizza. Hablé con mi amigo por teléfono.*'
        message: Hola Mori, te voy a contar 4 cosas que hice ayer. Corrige mis frases y hazme una pregunta más sobre cada una.
      - id: mori-basic-3
        type: aiTutorPrompt
        title: 'Mensaje 3: Reporte en tercera persona'
        intro: 'Después, escribe tus frases. Ejemplo: *Mi hermana estudió para un examen. Ella comió ensalada. Vio una película.*'
        message: Hola Mori, te voy a contar en tercera persona qué hizo ayer una persona de mi familia. Por favor, corrige mis frases y hazme una pregunta más sobre esa persona.
      - id: inter-title
        type: heading
        level: 3
        text: Nivel intermedio
      - id: inter-goal
        type: text
        text: 'Objetivo: combinar el pretérito indefinido (acciones puntuales) con el imperfecto (hábitos, descripciones y contexto).'
      - id: mori-inter-1
        type: aiTutorPrompt
        title: 'Mensaje 1: Entrevista'
        intro: 'Ejemplo: Mori: *¿Cuál fue tu viaje favorito?* Tú: *Mi viaje favorito fue a Italia.* Mori: *Muy bien. ¿Con quién viajaste a Italia?*'
        message: Hola Mori, hazme 5 preguntas en pasado, 3 con el pretérito indefinido y 2 con el imperfecto. Después de cada respuesta, corrígeme y hazme una pregunta de seguimiento.
      - id: mori-inter-2
        type: aiTutorPrompt
        title: 'Mensaje 2: Mini-biografía'
        intro: 'Después, escribe tus 5 frases. Ejemplo: *Cuando era niño vivía en una ciudad pequeña. Siempre jugaba con mis amigos en la calle. En 2005 viajé a Madrid con mi familia. El viaje fue divertido. Mi escuela era grande.*'
        message: Hola Mori, quiero escribir una mini-biografía de mi infancia. Te voy a contar 5 frases, 2 en pretérito indefinido y 3 en imperfecto. Corrige mis frases y después hazme una pregunta más sobre mi infancia.
      - id: mori-inter-3
        type: aiTutorPrompt
        title: 'Mensaje 3: Diario detallado'
        intro: 'Después, escribe tus frases. Ejemplo: *El sábado fui a la playa. Hacía mucho calor. El domingo cené con mi familia. La comida estaba deliciosa.*'
        message: Hola Mori, te voy a contar lo que hice la semana pasada en 6 frases. Para cada frase voy a añadir un detalle en imperfecto. Corrígeme si me equivoco y hazme una pregunta sobre una de mis frases.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: experiencias-pasadas-practica
    book: workbook
    title: 'Práctica: Experiencias pasadas'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practica las dos habilidades del ciclo. Cada respuesta se corrige al momento, y puedes intentarlo otra vez.
      - id: ex-pasado
        type: activity
        activity: experiencias-pasadas-pasado
      - id: ex-preguntas
        type: activity
        activity: experiencias-pasadas-preguntas

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: experiencias-pasadas-vocabulario
    title: Vocabulario
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Palabras de experiencias pasadas
        glossLang: he
        link: https://quizlet.com/br/1069755691/experiencias-pasadas-actualizado-flash-cards/
        items: &experiencias-pasadas-words
          - { term: Salí / Saliste / Salió (salir), gloss: יצאתי / יצאת / יצא }
          - { term: Volví / Volviste / Volvió (volver), gloss: חזרתי / חזרת / חזר }
          - { term: Aprendí / Aprendiste / Aprendió (aprender), gloss: למדתי / למדת / למד }
          - { term: Enseñé / Enseñaste / Enseñó (enseñar), gloss: לימדתי / לימדת / לימד }
          - { term: Caminé / Caminaste / Caminó (caminar), gloss: הלכתי / הלכת / הלך }
          - { term: Corrí / Corriste / Corrió (correr), gloss: רצתי / רצת / רץ }
          - { term: Visité / Visitaste / Visitó (visitar), gloss: ביקרתי / ביקרת / ביקר }
          - { term: Descansé / Descansaste / Descansó (descansar), gloss: נחתי / נחת / נח }
          - { term: Dormí / Dormiste / Durmió (dormir), gloss: ישנתי / ישנת / ישן }
          - { term: Soñé / Soñaste / Soñó (soñar), gloss: חלמתי / חלמת / חלם }
          - { term: Reí / Reíste / Rio (reír), gloss: צחקתי / צחקת / צחק }
          - { term: Bailé / Bailaste / Bailó (bailar), gloss: רקדתי / רקדת / רקד }
          - { term: Canté / Cantaste / Cantó (cantar), gloss: שרתי / שרת / שר }
          - { term: Tomé / Tomaste / Tomó (tomar), gloss: לקחתי / לקחת / לקח }
          - { term: Esperé / Esperaste / Esperó (esperar), gloss: חיכיתי / חיכית / חיכה }
          - { term: Hace una semana, gloss: לפני שבוע }
          - { term: Hace un mes, gloss: לפני חודש }
          - { term: En mi infancia, gloss: בילדותי }
          - { term: En aquella época, gloss: באותה תקופה }
