vocabulary:
  - slug: experiencias-pasadas
    title: Experiencias pasadas
    items: *experiencias-pasadas-words

activities:
  - slug: experiencias-pasadas-pasado
    title: 'Oraciones en pasado: comí, he comido, comía'
    minutes: 8
    items:
      - id: ayer-comi
        type: multipleChoice
        prompt: Ayer ___ pizza.
        options:
          - { text: comí, correct: true }
          - {
              text: como,
              feedback: '*Como* es presente. Con *ayer* usamos el pretérito indefinido: *comí*.',
            }
          - {
              text: he comido,
              feedback: 'Con un momento terminado como *ayer*, usamos el indefinido: *Ayer comí pizza.*',
            }
      - id: fui-vi
        type: fillBlank
        prompt: Completa con el pretérito indefinido de *ir* y *ver*.
        text: El sábado yo ___ al cine y ___ una película.
        blanks: [[fui], [vi]]
      - id: une-verbos
        type: matching
        prompt: Une cada verbo con su forma de *yo* en pasado.
        pairs:
          - [salir, salí]
          - [volver, volví]
          - [caminar, caminé]
          - [aprender, aprendí]
          - [dormir, dormí]
      - id: estudio
        type: multipleChoice
        prompt: Mi hermana ___ para un examen ayer.
        options:
          - { text: estudió, correct: true }
          - { text: estudié, feedback: '*Estudié* es para *yo*. Para *ella* usamos *estudió*.' }
          - {
              text: estudiaste,
              feedback: '*Estudiaste* es para *tú*. Para *ella* usamos *estudió*.',
            }
      - id: he-comido
        type: trueFalse
        prompt: '*Nunca he comido sushi* está en pretérito perfecto (*he* + participio).'
        answer: true
        feedback:
          correct: ¡Correcto! *He comido* = *he* + participio. Lo usamos para experiencias de la vida, con *nunca* o *alguna vez*.
          incorrect: '*He comido* es pretérito perfecto: *he / has / ha* + participio.'
      - id: jugaba
        type: multipleChoice
        prompt: Cuando era niño, siempre ___ al fútbol.
        options:
          - { text: jugaba, correct: true }
          - {
              text: jugué,
              feedback: '*Cuando era niño* y *siempre* hablan de un hábito: usamos el imperfecto, *jugaba*.',
            }
          - {
              text: juego,
              feedback: '*Juego* es presente. Para un hábito del pasado usamos *jugaba*.',
            }
      - id: viaje-estaba
        type: fillBlank
        prompt: Completa con *viajar* (indefinido) y *estar* (imperfecto).
        text: El verano pasado yo ___ a la playa. El mar ___ muy tranquilo.
        blanks: [[viajé], [estaba]]
        wordBank: [viajé, viajaba, estuvo, estaba]
      - id: ordena-hable
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Ayer hablé con mi amiga.

  - slug: experiencias-pasadas-preguntas
    title: 'Preguntas en pasado: ¿Qué hiciste?'
    minutes: 8
    items:
      - id: cocinaste
        type: multipleChoice
        prompt: 'A: *Ayer cociné pasta.* B: ¿Cuál es la pregunta?'
        options:
          - { text: ¿Qué cocinaste ayer?, correct: true }
          - {
              text: ¿Qué cocinas ayer?,
              feedback: '*Cocinas* es presente. Con *ayer* usamos el pasado: *¿Qué cocinaste?*',
            }
          - {
              text: ¿Qué cociné ayer?,
              feedback: '*Cociné* es para *yo*. Para preguntar a otra persona (tú) usamos *cocinaste*.',
            }
      - id: fuiste
        type: fillBlank
        prompt: Completa la pregunta con el verbo *ir* en pasado.
        text: ¿Con quién ___ al cine? — Fui con mi hermano.
        blanks: [[fuiste]]
      - id: une-respuestas
        type: matching
        prompt: Une cada pregunta con su respuesta.
        pairs:
          - [¿Qué comiste?, Comí ensalada.]
          - [¿Adónde fuiste el sábado?, Fui al cine.]
          - [¿A qué hora te despertaste?, Me desperté a las siete.]
          - [¿Con quién viajaste?, Viajé con mi familia.]
          - [¿Qué película viste?, Vi una película de acción.]
      - id: hiciste
        type: multipleChoice
        prompt: ¿Qué pregunta está bien escrita?
        options:
          - { text: ¿Qué hiciste ayer?, correct: true }
          - {
              text: ¿Qué hice ayer?,
              feedback: '*Hice* es para *yo*. Para preguntar a otra persona usamos *hiciste*.',
            }
          - { text: ¿Que hiciste ayer?, feedback: 'En una pregunta, *qué* lleva tilde.' }
      - id: aste-iste
        type: trueFalse
        prompt: 'Para preguntar a un amigo (tú) en pasado, el verbo termina en *-aste* o *-iste*: *¿cocinaste?, ¿comiste?*'
        answer: true
        feedback:
          correct: ¡Correcto! *cocinar → cocinaste*, *comer → comiste*.
          incorrect: 'Sí, para *tú* el indefinido termina en *-aste* (verbos en -ar) o *-iste* (verbos en -er / -ir).'
      - id: quien-despertaste
        type: fillBlank
        prompt: Completa las preguntas.
        text: ¿Con ___ comiste? — Comí con mis amigos. ¿A qué hora te ___ ayer? — Me desperté a las siete.
        blanks: [[quién], [despertaste]]
      - id: companero-cocino
        type: multipleChoice
        prompt: 'Tu compañero dice: *Ayer cociné pasta.* Cuéntalo al grupo: Mi compañero ___ pasta ayer.'
        options:
          - { text: cocinó, correct: true }
          - {
              text: cociné,
              feedback: '*Cociné* es para *yo*. Para tu compañero (él) usamos *cocinó*.',
            }
          - {
              text: cocinaste,
              feedback: '*Cocinaste* es para *tú*. Para tu compañero (él) usamos *cocinó*.',
            }
      - id: ordena-hiciste
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: ¿Qué hiciste el fin de semana pasado?
