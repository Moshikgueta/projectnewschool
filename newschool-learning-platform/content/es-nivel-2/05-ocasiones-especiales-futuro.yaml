activities:
  - slug: ocasiones-especiales-futuro-proximo
    title: 'Futuro próximo: voy a + infinitivo'
    minutes: 8
    items:
      - id: voy-celebrar
        type: multipleChoice
        prompt: 'Mañana (yo) ___ a celebrar el cumpleaños de mi mamá.'
        options:
          - { text: voy, correct: true }
          - {
              text: va,
              feedback: '*Va* es para *él / ella*. Para *yo* decimos *voy a*: *Voy a celebrar…*',
            }
          - {
              text: vamos,
              feedback: '*Vamos* es para *nosotros*. Para *yo* decimos *voy a*: *Voy a celebrar…*',
            }
      - id: vamos-invitar
        type: fillBlank
        prompt: Completa con el verbo *ir*.
        text: Nosotros ___ a invitar a 30 personas.
        blanks: [[vamos]]
      - id: va-ser
        type: fillBlank
        prompt: Completa con el verbo *ir*.
        text: ¿Dónde ___ a ser la fiesta?
        blanks: [[va]]
      - id: une-ir
        type: matching
        prompt: Une cada persona con la forma de *ir*.
        pairs:
          - [yo, voy a]
          - [tú, vas a]
          - [él / ella, va a]
          - [nosotros, vamos a]
          - [ellos / ellas, van a]
      - id: infinitivo
        type: trueFalse
        prompt: 'Después de *voy a* usamos el verbo en infinitivo: *Voy a bailar en la fiesta.*'
        answer: true
        feedback:
          correct: '¡Correcto! *ir + a + infinitivo*: *voy a bailar, vamos a comer*.'
          incorrect: 'Después de *voy a* el verbo va en infinitivo: *Voy a bailar*, no *Voy a bailo*.'
      - id: decorar
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: Vamos a decorar el salón., correct: true }
          - {
              text: Vamos decorar el salón.,
              feedback: 'Falta la palabra *a*: *ir + a + infinitivo*: *Vamos a decorar*.',
            }
          - {
              text: Vamos a decoramos el salón.,
              feedback: 'Después de *vamos a* usamos el infinitivo: *Vamos a decorar*.',
            }
      - id: ordena-invitar
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Voy a invitar a mis amigos.
      - id: no-voy-poder
        type: fillBlank
        prompt: Completa la respuesta a una invitación.
        text: Lo siento, pero no ___ a poder asistir.
        blanks: [[voy]]

  - slug: ocasiones-especiales-futuro-simple
    title: 'Futuro simple: celebraré, vendrán'
    minutes: 8
    items:
      - id: sera
        type: multipleChoice
        prompt: '¿Dónde ___ la fiesta? (ser, futuro simple)'
        options:
          - { text: será, correct: true }
          - { text: es, feedback: '*Es* es presente. En futuro simple: *ser + á = será*.' }
          - { text: serás, feedback: '*Serás* es para *tú*. *La fiesta* = *ella*: *será*.' }
      - id: vendran
        type: fillBlank
        prompt: Escribe el verbo en futuro simple.
        text: ___ (venir) 20 personas a la fiesta.
        blanks: [[Vendrán]]
      - id: celebraremos
        type: fillBlank
        prompt: Escribe el verbo en futuro simple.
        text: En diciembre ___ (celebrar, nosotros) la Navidad en familia.
        blanks: [[celebraremos, nosotros celebraremos]]
      - id: une-formas
        type: matching
        prompt: Une cada frase con *voy a…* con la misma idea en futuro simple.
        pairs:
          - [Voy a bailar., Bailaré.]
          - [Vamos a comer., Comeremos.]
          - [Van a venir., Vendrán.]
          - [Va a ser., Será.]
          - [Voy a ir., Iré.]
      - id: dos-formas
        type: trueFalse
        prompt: '*Voy a bailar en la fiesta* y *Bailaré en la fiesta* son correctas las dos.'
        answer: true
        feedback:
          correct: '¡Correcto! Las dos formas son correctas; cambian el estilo y el contexto.'
          incorrect: 'Las dos formas son correctas: *voy a bailar* es más común en la vida diaria y *bailaré* es un poco más formal o lejano.'
      - id: habra
        type: multipleChoice
        prompt: '¿Qué música ___ en la fiesta? (haber, futuro simple)'
        options:
          - { text: habrá, correct: true }
          - {
              text: haberá,
              feedback: '*Haber* es irregular en futuro: la raíz es *habr-*: *habrá*.',
            }
          - { text: hay, feedback: '*Hay* es presente. En futuro simple decimos *habrá*.' }
      - id: ordena-podre
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Lo siento, no podré ir.
      - id: ire
        type: fillBlank
        prompt: Escribe el verbo en futuro simple.
        text: ___ (ir, yo) a la fiesta. Gracias por invitarme.
        blanks: [[Iré, Yo iré]]
