# Cycle "Ocasiones especiales: futuro", converted from the Spanish nivel 2 digital
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-2
slug: ocasiones-especiales-futuro
title: 'Ocasiones especiales: futuro'
goal: Hablar de planes y celebraciones con el futuro próximo (voy a + infinitivo) y el futuro simple.
position: 5
status: in_review

review:
  - >-
    The two workbook exercises ("Futuro próximo" and "Futuro simple") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's
    summary rules, its examples and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Skills: the notebook's "Habilidades a practicar" are general (speaking,
    listening, writing). The two cycle skills are taken from its learning goals and
    summary: "Futuro próximo (voy a + infinitivo)" and "Futuro simple".
  - >-
    Summary: the rule "Voy a + verbo" is written "ir a + infinitivo", with a table
    of the verb ir (voy, vas, va, vamos, vais, van). A short table of the futuro
    simple (with the vosotros form) and the irregular forms used in the cycle
    (será is regular; vendrán, habrá, harás, tendré and podré are irregular) was added. The
    notebook's "más formal o lejano" is kept as a simple guide but softened: both
    forms are correct and the difference is style and context, as the notebook
    itself says. Please confirm.
  - >-
    Corrections: "Role-play" (English) → "Juego de roles" in Activities 2A and 2B;
    "FUTURO PROXIMO" → "futuro próximo"; "FUTURO LEJANO" → "futuro simple" (the
    activity practises the futuro simple, not a separate tense); in Activity 3A
    the answer "Voy a la fiesta." → "Voy a ir a la fiesta." to match the voy a +
    infinitivo practice; the stray asterisks in Activity 3B were cleaned.
  - >-
    Activity 3A asks the teacher to show 4 pictures of celebrations; the notebook
    has no pictures. The teacher note asks the teacher to bring them.
  - >-
    Links: the Quizlet link's "?new" and the Google Docs template's "?usp=sharing"
    were removed. The Quizlet set URL has a typo ("ocaciones") but it is the real
    address and is kept.
  - >-
    Activity 4 mentions a blank calendar sheet or a digital template (Google
    Docs/Slides); the notebook gives no link. The teacher note says so.
  - >-
    The notebook gives no activity times, so no minutes are recorded. The Mori
    homework has four parts; each is an aiTutorPrompt with its example sentences in
    the intro. The Mori messages end with "por favor" and the tips callout from
    the other cycles was added.
  - >-
    Activity 1 has no example in the notebook; a short invitation example was
    added ("La fiesta será el sábado 12 de mayo…"). The intro example sentence
    ("Me gusta organizar fiestas porque me encanta cocinar…") was also written
    new. Please confirm.
  - >-
    Vocabulary: "Recuerdo (souvenir)" → "Recuerdo" (gloss מזכרת); "Viaje" glossed
    "טיול / נסיעה" as in the notebook. Please confirm.
  - >-
    The "Respuesta de alumno 1/2/3" lines are replaced by the optional answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: ocasiones-especiales-futuro-clase
    title: 'Clase: Ocasiones especiales (futuro)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Ocasiones especiales: futuro'
      - id: skills
        type: cycleOverview
        skills:
          - name: Futuro próximo
            description: '*Voy a + infinitivo*: Voy a celebrar mi cumpleaños con amigos.'
          - name: Futuro simple
            description: '*-é, -ás, -á, -emos, -án*: Celebraré mi cumpleaños en un restaurante.'
      - id: quizlet
        type: externalLink
        label: 'Ocasiones especiales: futuro en Quizlet'
        url: https://quizlet.com/br/1069768875/ocaciones-especiales-futuro-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Yo soy ___. Me gusta / No me gusta organizar fiestas porque ___.
        example: Yo soy Dana. Me gusta organizar fiestas porque me encanta cocinar para mis amigos.
      - id: intro-options
        type: discussionQuestions
        title: Otras opciones para tu segunda frase
        items:
          - question: En una fiesta, siempre voy a ___ (bailar, cantar, comer, hablar con amigos…).
          - question: En el futuro, voy a celebrar ___.
          - question: Prefiero ___ (fiestas grandes / fiestas pequeñas).
          - question: Una fiesta sin ___ no es una fiesta.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup
        type: discussionQuestions
        items:
          - question: ¿Cómo vas a celebrar tu próximo cumpleaños y con quién?
            frame: Voy a celebrar mi cumpleaños ___ (con familia, con amigos, en un restaurante, en casa…) con ___.
          - question: En las próximas fiestas (Navidad, Año Nuevo, Pascua…), ¿qué vas a hacer y con quién vas a estar?
            frame: Voy a ___ (viajar, visitar a mi familia, preparar comida especial…) y voy a estar con ___.
          - question: En el futuro, ¿invitarás a muchas personas a tu boda u otra celebración importante? ¿Por qué sí o por qué no?
            frame: Sí, invitaré a ___ porque ___. / No, solo invitaré a ___ porque ___.
          - question: ¿Cómo vas a invitar a las personas a tu fiesta (WhatsApp, email, teléfono, invitación en papel)? ¿Por qué prefieres este método?
            frame: Voy a invitar por ___ porque ___.
          - question: ¿Qué ocasión especial vas a celebrar el próximo año?
            frame: El próximo año voy a celebrar ___ (un cumpleaños importante, una graduación, un trabajo nuevo…).
          - question: ¿Qué vas a hacer para celebrar esa ocasión (comida, música, viaje, regalos…)?
            frame: Voy a ___ (organizar una fiesta, hacer una cena, viajar, invitar a amigos…).
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Invitaciones'
        skills: [Futuro simple]
        steps:
          - Haz una copia de la plantilla de invitaciones.
          - 'Escribe dos invitaciones en futuro simple: una para una fiesta de cumpleaños y otra para una boda.'
          - Si quieres, añade imágenes y cambia las fuentes.
          - Lee una de tus invitaciones al grupo.
        example: '*La fiesta será el sábado 12 de mayo en el salón de fiestas. Habrá música y comida. ¡Por favor, confirma tu asistencia!*'
        resource:
          label: Plantilla de invitaciones (Google Docs)
          url: https://docs.google.com/document/d/1Zkyucwz0vQ1Gee_NAxw4vsTHRDU3CQH8ACpI6vPEs-8/edit
      - id: act2a
        type: classActivity
        title: 'Actividad 2A: Juego de roles – Organizamos una fiesta (voy a…)'
        skills: [Futuro próximo]
        steps:
          - Trabajen en parejas o en grupos de 3.
          - Cada grupo elige una ocasión especial (cumpleaños, boda, graduación, fiesta sorpresa, viaje).
          - Respondan a las preguntas de abajo con *voy a… / vamos a… / van a…*.
          - Compartan sus planes con el grupo.
        example: '*Vamos a celebrar una boda en un jardín. Vamos a invitar a 30 personas. Vamos a preparar comida típica y vamos a bailar salsa.*'
      - id: act2a-questions
        type: discussionQuestions
        title: Nuestra fiesta (voy a…)
        items:
          - question: ¿Dónde **va a ser** la fiesta?
            frame: La fiesta va a ser en ___.
          - question: ¿Qué **van a comer y beber**?
            frame: Vamos a comer ___ y vamos a beber ___.
          - question: ¿Quiénes **van a venir**?
            frame: Van a venir ___.
          - question: ¿Qué música o actividades **va a haber**?
            frame: Va a haber ___.
          - question: ¿Cómo **van a decorar** el lugar?
            frame: Vamos a decorar con ___.
      - id: act2b
        type: classActivity
        title: 'Actividad 2B: Juego de roles – Organizamos una fiesta (futuro simple)'
        skills: [Futuro simple]
        steps:
          - Usen la misma ocasión de la Actividad 2A.
          - Respondan otra vez a las preguntas, ahora en futuro simple.
          - Compartan sus planes con el grupo.
        example: '*La fiesta será en la playa. Vendrán 20 personas. Comeremos mariscos y bailaremos toda la noche. Decoraremos con luces y prepararemos un video especial.*'
      - id: act2b-questions
        type: discussionQuestions
        title: Nuestra fiesta (futuro simple)
        items:
          - question: ¿Dónde **será** la fiesta?
            frame: La fiesta será en ___.
          - question: ¿Qué **comerán y beberán**?
            frame: Comeremos ___ y beberemos ___.
          - question: ¿Quiénes **vendrán**?
            frame: Vendrán ___.
          - question: ¿Qué música o actividades **habrá**?
            frame: Habrá ___.
          - question: ¿Cómo **decorarán** el lugar?
            frame: Decoraremos con ___.
          - question: ¿Qué sorpresa especial **prepararán**?
            frame: Prepararemos ___.
      - id: act3a
        type: classActivity
        title: 'Actividad 3A: Tradiciones y fiestas (futuro próximo)'
        skills: [Futuro próximo]
        steps:
          - Mira las 4 imágenes de celebraciones que muestra tu profesor.
          - Elige 2 imágenes.
          - En parejas, responde a las preguntas de abajo con *va a… / van a…*.
          - Comparte con el grupo.
          - 'Los demás dicen si van a ir: *Voy a ir a la fiesta. Gracias por invitarme.* / *Lo siento, pero no voy a poder asistir.*'
        example: '*Van a tener una boda en un hotel. La fiesta va a ser el próximo sábado.*'
      - id: act3a-questions
        type: discussionQuestions
        title: Las imágenes (futuro próximo)
        items:
          - question: ¿Por qué **van a tener** una fiesta las personas de la imagen?
            frame: Van a tener una fiesta porque ___.
          - question: ¿Dónde **va a ser** la fiesta?
            frame: La fiesta va a ser en ___.
          - question: ¿Cuándo **va a ser** la fiesta?
            frame: La fiesta va a ser ___.
      - id: act3b
        type: classActivity
        title: 'Actividad 3B: Tradiciones y fiestas (futuro simple)'
        skills: [Futuro simple]
        steps:
          - Usa las mismas imágenes de la Actividad 3A.
          - Describe otra vez las fiestas, ahora en futuro simple.
          - Comparte con el grupo con frases completas.
          - 'Los demás responden en futuro simple: *Iré a la fiesta. Gracias por invitarme.* / *Lo siento, no podré ir.* / *Estaré ocupado / ocupada ese día.*'
        example: '*Ellos celebrarán una boda en un hotel. La fiesta será el próximo sábado.*'
      - id: act3b-questions
        type: discussionQuestions
        title: Las imágenes (futuro simple)
        items:
          - question: ¿Por qué **tendrán** una fiesta las personas de la imagen?
            frame: Tendrán una fiesta porque ___.
          - question: ¿Dónde **será** la fiesta?
            frame: La fiesta será en ___.
          - question: ¿Cuándo **será** la fiesta?
            frame: La fiesta será ___.
      - id: act4
        type: classActivity
        title: 'Actividad 4: Calendario de celebraciones'
        skills: [Futuro próximo, Futuro simple]
        steps:
          - Trabajen en grupos de 3 o 4 con un calendario de 12 meses.
          - 'Elijan al menos 5 celebraciones: un cumpleaños de alguien del grupo, vacaciones o viajes, una boda, una fiesta sorpresa, una fiesta nacional (Año Nuevo, Pascua, Día de la Independencia), una graduación.'
          - Escriban frases completas en futuro. Usen *voy a…* y el futuro simple.
          - Decoren el calendario con dibujos, imágenes o emojis.
          - Cada grupo presenta 2 o 3 celebraciones a la clase.
          - Los otros grupos hacen preguntas en futuro.
        example: |-
          *En marzo vamos a celebrar el cumpleaños de Ana.*
          *En julio viajaremos a la playa con amigos.*
          *En diciembre celebraremos la Navidad en familia.*
          *El próximo año iré a un concierto en agosto.*
          *Invitaremos a 20 personas. Vamos a bailar toda la noche.*
      - id: act4-questions
        type: discussionQuestions
        title: Preguntas para los otros grupos
        items:
          - question: ¿Quiénes van a venir a la fiesta?
          - question: ¿Dónde será la celebración?
          - question: ¿Qué comerán en las vacaciones?
      - id: act4-variation
        type: callout
        tone: tip
        title: 'Variación (opcional): competencia'
        text: 'La clase vota por el calendario más original o la fiesta más divertida. Categorías: «La celebración más creativa», «La mejor fiesta del verano», «El plan más loco».'
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Futuro próximo** (*voy a + infinitivo*:
          Actividades 2A y 3A) y **Futuro simple** (Actividades 1, 2B y 3B). La
          Actividad 4 mezcla las dos. En las actividades A practican la forma más
          natural en A2 (*voy a…*); en las actividades B suben un nivel con la
          conjugación del futuro simple. Hablan dos veces del mismo tema, y así refuerzan
          el vocabulario y la fluidez.
      - id: n-intro
        anchor: intro
        text: Cada estudiante dice 2 frases. Da tu propio ejemplo primero.
      - id: n-warmup
        anchor: warmup
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act1
        anchor: act1
        text: >-
          Explica qué significa «confirmar asistencia» (לאשר השתתפות). Cada estudiante
          hace una copia de la plantilla de Google Docs antes de escribir.
      - id: n-act2a
        anchor: act2a
        text: Divide la clase en parejas o grupos de 3.
      - id: n-act3a
        anchor: act3a
        text: >-
          Prepara 4 imágenes de celebraciones diferentes (por ejemplo: boda, cumpleaños,
          Año Nuevo, graduación); el cuaderno no las incluye. Usa las mismas imágenes en
          la Actividad 3B: es fácil de preparar y refuerza enseguida.
      - id: n-act4
        anchor: act4
        text: >-
          Reparte una hoja de calendario en blanco (12 meses) o una plantilla digital
          (Google Docs / Slides); el cuaderno no tiene un enlace. Al final, guía una
          comparación: «El Grupo 1 viajará en julio, pero el Grupo 2 viajará en agosto.»
          «Todos van a celebrar cumpleaños, pero solo un grupo hará una boda.»

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: ocasiones-especiales-futuro-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: summary-intro
        type: text
        text: Hoy hablamos sobre **planes y celebraciones en el futuro**. Practicamos dos formas para expresar el futuro.
      - id: rules-proximo
        type: ruleSummary
        skill: Futuro próximo
        rules:
          - text: '**ir** (voy, vas, va, vamos, vais, van) + **a** + **infinitivo**. Se usa para planes cercanos y decididos; es la forma más común en la vida diaria.'
            examples:
              - Voy a celebrar mi cumpleaños con amigos.
              - Vamos a viajar en vacaciones.
              - Voy a bailar en la fiesta.
      - id: ir-a-table
        type: table
        caption: 'Futuro próximo: ir a + infinitivo'
        header: [Persona, ir + a, Ejemplo]
        rows:
          - [Yo, voy a, Voy a invitar a mis amigos.]
          - [Tú, vas a, ¿Cómo vas a celebrar tu cumpleaños?]
          - [Él / Ella / Usted, va a, ¿Dónde va a ser la fiesta?]
          - [Nosotros / Nosotras, vamos a, Vamos a bailar toda la noche.]
          - [Vosotros / Vosotras, vais a, ¿Vais a venir a la boda?]
          - [Ellos / Ellas / Ustedes, van a, ¿Quiénes van a venir?]
      - id: rules-simple
        type: ruleSummary
        skill: Futuro simple
        rules:
          - text: '**infinitivo + -é, -ás, -á, -emos, -éis, -án**. Se usa para predicciones, promesas y planes más lejanos o más formales.'
            examples:
              - Celebraré mi cumpleaños en un restaurante.
              - Comeremos mariscos en la fiesta.
              - Bailaré en la fiesta.
          - text: 'Algunos verbos cambian la raíz: ser → será, venir → vendrán, haber → habrá, hacer → harás, tener → tendré, poder → podré.'
            examples: [¿Quiénes vendrán?, Habrá música y baile., 'Lo siento, no podré ir.']
          - text: '**Las dos formas son correctas**: la diferencia es el estilo y el contexto.'
            examples: [Voy a bailar en la fiesta. = Bailaré en la fiesta.]
      - id: futuro-simple-table
        type: table
        caption: 'Futuro simple: celebrar'
        header: [Persona, Forma, Ejemplo]
        rows:
          - [Yo, celebraré, Celebraré mi cumpleaños en casa.]
          - [Tú, celebrarás, ¿Dónde celebrarás tu cumpleaños?]
          - [Él / Ella / Usted, celebrará, Ana celebrará su graduación.]
          - [Nosotros / Nosotras, celebraremos, Celebraremos la Navidad en familia.]
          - [Vosotros / Vosotras, celebraréis, ¿Celebraréis el Año Nuevo en la playa?]
          - [Ellos / Ellas / Ustedes, celebrarán, Ellos celebrarán una boda en un hotel.]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos formas con el grupo y pide la misma frase en las dos formas (*Voy a bailar. → Bailaré.*).

  # ── after class ──────────────────────────────────────────────────────────
  - slug: ocasiones-especiales-futuro-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia cada mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: mori-proximo
        type: aiTutorPrompt
        title: 'Parte 1: Futuro próximo (voy a…)'
        intro: >-
          Escribe y dile a Mori **5 frases en futuro próximo**. Por ejemplo: *Voy a
          celebrar el cumpleaños de mi mamá. Voy a viajar a la playa en junio. Voy a
          invitar a mis amigos a una cena.*
        message: Mori, voy a contarte mis planes para el próximo mes. Hazme preguntas y corrígeme, por favor.
      - id: mori-simple
        type: aiTutorPrompt
        title: 'Parte 2: Futuro simple (-é, -ás, -á…)'
        intro: >-
          Escribe y dile a Mori **5 frases en futuro simple**. Por ejemplo: *Celebraré mi
          cumpleaños en un restaurante. Tendré vacaciones en agosto. Invitaré a toda mi
          familia a una fiesta.* Mori te hará preguntas como: *¿Dónde será la fiesta?
          ¿Quiénes vendrán? ¿Qué harás para celebrarlo?*
        message: Mori, voy a practicar el futuro simple. Corrígeme si me equivoco, por favor.
      - id: mori-conversacion
        type: aiTutorPrompt
        title: 'Parte 3: Conversación guiada'
        intro: >-
          Mori te hará preguntas como: *¿Cómo vas a celebrar tu próximo cumpleaños? ¿Qué
          ocasión especial celebrarás el próximo año? ¿Qué harás si no puedes ir a una
          fiesta?*
        message: Mori, hazme preguntas sobre ocasiones especiales y yo voy a responder en futuro.
      - id: mori-calendario
        type: aiTutorPrompt
        title: 'Parte 4: Producción libre'
        intro: >-
          Cuéntale a Mori tu calendario del próximo año. Por ejemplo: *En marzo celebraré
          el cumpleaños de mi hermano. En junio voy a viajar a España. En diciembre
          celebraré la Navidad en casa.*
        message: Mori, voy a contarte un calendario de celebraciones de mi próximo año. Corrígeme si me equivoco, por favor.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes algo? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: ocasiones-especiales-futuro-practica
    book: workbook
    title: 'Práctica: Ocasiones especiales (futuro)'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practica las dos habilidades del ciclo. Cada respuesta se corrige al momento, y puedes intentarlo otra vez.
      - id: ex-proximo
        type: activity
        activity: ocasiones-especiales-futuro-proximo
      - id: ex-simple
        type: activity
        activity: ocasiones-especiales-futuro-simple

