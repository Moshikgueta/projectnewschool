vocabulary:
  - slug: planes-fin-de-semana
    title: Planes para el fin de semana
    items: *planes-words

activities:
  - slug: planes-fin-de-semana-futuro
    title: 'Futuro: voy a viajar, viajaré'
    minutes: 8
    items:
      - id: voy-a
        type: multipleChoice
        prompt: Este sábado yo ___ a visitar a mis abuelos.
        options:
          - { text: voy, correct: true }
          - { text: va, feedback: '*Va* es para él / ella. Para *yo* usa *voy*.' }
          - { text: vamos, feedback: '*Vamos* es para *nosotros*. Para *yo* usa *voy*.' }
      - id: van-a
        type: fillBlank
        prompt: Completa con el verbo *ir* en presente.
        text: Ellos ___ a comer en ese restaurante.
        blanks: [[van]]
      - id: vas-a
        type: fillBlank
        prompt: Completa con el verbo *ir* (tú).
        text: ¿___ a viajar este verano?
        blanks: [[Vas, Tú vas]]
      - id: vivire
        type: multipleChoice
        prompt: Algún día ___ cerca del mar. (yo, futuro simple)
        options:
          - { text: viviré, correct: true }
          - {
              text: vivé,
              feedback: 'En el futuro simple, la terminación va después del infinitivo completo: *vivir + é = viviré*.',
            }
          - { text: vivirá, feedback: '*Vivirá* es para él / ella. Para *yo* usa *viviré*.' }
      - id: estudiar-futuro
        type: matching
        prompt: Une cada persona con el verbo *estudiar* en futuro simple.
        pairs:
          - [yo, estudiaré]
          - [tú, estudiarás]
          - [él / ella, estudiará]
          - [nosotros, estudiaremos]
          - [ellos / ellas, estudiarán]
      - id: plan
        type: trueFalse
        prompt: '*Voy a viajar a México en julio* habla de un plan: ya tengo el pasaje.'
        answer: true
        feedback:
          correct: ¡Correcto! Para planes ya decididos usamos *ir a + infinitivo*.
          incorrect: '*Ir a + infinitivo* es para planes ya decididos. Para un sueño usamos el futuro simple: *Viajaré a México algún día.*'
      - id: vamos-a-ver
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: Vamos a ver una película., correct: true }
          - { text: Vamos ver una película., feedback: 'Falta *a*: *ir + a + infinitivo*.' }
          - {
              text: Vamos a vemos una película.,
              feedback: 'Después de *a* el verbo va en infinitivo: *ver*.',
            }
      - id: ordena-sabado
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: El sábado voy a dormir hasta tarde.

  - slug: planes-fin-de-semana-comparaciones
    title: 'Comparaciones: más, menos, tan, el mejor'
    minutes: 8
    items:
      - id: mas-que
        type: multipleChoice
        prompt: El sábado es ___ caluroso ___ el viernes.
        options:
          - { text: más … que, correct: true }
          - { text: más … como, feedback: 'Con *más* usamos *que*: *más caluroso que*.' }
          - { text: tan … que, feedback: 'Con *tan* usamos *como*: *tan caluroso como*.' }
      - id: tan-como
        type: fillBlank
        prompt: Completa la comparación de igualdad.
        text: El viernes fue ___ tranquilo ___ el sábado.
        blanks: [[tan], [como]]
      - id: mejor
        type: multipleChoice
        prompt: Mi plan es ___ que el tuyo. (bueno)
        options:
          - { text: mejor, correct: true }
          - { text: más mejor, feedback: '*Mejor* ya es comparativo: no uses *más* antes.' }
          - { text: tan mejor, feedback: '*Bueno* tiene una forma especial: *mejor que*.' }
      - id: concordancia
        type: trueFalse
        prompt: 'El adjetivo no cambia en las comparaciones: *Mis planes son más divertido que los tuyos.*'
        answer: false
        feedback:
          correct: '¡Correcto! El adjetivo concuerda con el sustantivo: *más divertidos*.'
          incorrect: 'El adjetivo concuerda con el sustantivo: *Mis planes son más divertidos que los tuyos.*'
      - id: tipos
        type: matching
        prompt: Une cada estructura con su uso.
        pairs:
          - [más … que, superioridad (+)]
          - [menos … que, inferioridad (−)]
          - [tan … como, igualdad (=)]
          - [el / la más …, superlativo (el extremo)]
      - id: la-mejor
        type: fillBlank
        prompt: Completa con el artículo correcto.
        text: Va a ser ___ mejor fiesta de mi vida.
        blanks: [[la]]
      - id: peor
        type: multipleChoice
        prompt: El domingo por la noche fue la ___ parte de mi semana. (mala)
        options:
          - { text: peor, correct: true }
          - { text: más mala, feedback: '*Malo / mala* tiene una forma especial: *peor*.' }
          - { text: menos peor, feedback: '*Peor* ya es comparativo: no uses *menos* antes.' }
      - id: ordena-aburrido
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Tu plan es menos aburrido que el mío.
