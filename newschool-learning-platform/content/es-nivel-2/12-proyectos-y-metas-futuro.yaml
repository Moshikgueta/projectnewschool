# Cycle "Proyectos y metas (futuro)", converted from the Spanish level 2 digital
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-2
slug: proyectos-y-metas-futuro
title: 'Proyectos y metas: el futuro'
goal: Hablar de tus planes y metas con el futuro (voy a / estudiaré) y el presente de subjuntivo (cuando logre…).
position: 12
status: in_review

review:
  - >-
    The two workbook exercises ("El futuro" and "Presente de subjuntivo") are NEW:
    the notebook has no self-study exercises. They were written from the cycle's two
    skills, its summary rules and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Summary, skill 1 (Futuro) was translated literally from the English "will"
    rules and was REWRITTEN. "Add the word *voy a* before the verb" → ir a +
    infinitive with the full forms (voy, vas, va, vamos, van + a + infinitive).
    "Use *voy a ir* when the verb implies movement" was wrong as a rule (it is just
    *ir a* + *ir*: *Voy a ir al cine*) and is rewritten that way. "In more formal
    situations we use the future conjugation" → the futuro simple (infinitive + -é,
    -ás, -á, -emos, -án), common in writing, promises and less concrete plans; a
    table and the irregular futures *haré, tendré, podré, saldré, diré* were ADDED
    (the activity examples use *haré*). The example "¿Tú estudiaras para el
    examen?" → "¿Tú estudiarás para el examen?" (missing accent; *estudiaras* is
    another tense).
  - >-
    Summary, skill 2 (Presente de subjuntivo): the explanation and its examples are
    correct. A short rule on how to form it (-ar → -e, -er / -ir → -a) and the rule
    "cuando + subjuntivo for a future action" (used in the warm-up: *cuando logre mi
    meta*) were ADDED, with a small table.
  - >-
    Activity 1 example list: "Comprar un libro … o descargar una app" (infinitives)
    → "Compraré un libro … o descargaré una app"; "Dedicaré 30 minutos … para
    practicar" → "a practicar"; "Me uniré a un grupo local o en línea de guitarra" →
    "a un grupo de guitarra local o en línea"; "¡Voy a tocar mi primera mini
    actuación para mis amigos y familia!" → "¡Voy a dar mi primer pequeño concierto
    para mis amigos y mi familia!".
  - >-
    Activity 2 example: the goal "Viajar a Alaska" did not match the invention ("will
    help plan your trip to Patagonia"); the goal is now "Viajar a la Patagonia".
    Please confirm.
  - >-
    Activity 3: "Etapa ½" and "Etapa ⅔" → Etapa 2 and Etapa 3; "escribe una carta a
    tu Yo del Pasado (la versión de ti de hoy)" → "a tu Yo del Presente"; "Una lista
    de cosas que tuviste que hacer" → "que vas a tener que hacer" (the letter frames
    are in the future: *Vas a empezar por…*).
  - >-
    Warm-up: the empty item 7 was removed; frame 5 "Mi ___ va a celebrar conmigo mi
    meta" → "Mi ___ va a celebrar mi logro conmigo". Homework: "¿Conocerá a quién?" →
    "¿A quién conocerá?"; "¿Cómo se sentirá sobre la aventura?" → "¿Cómo se siente
    la persona con esta aventura?" (the text says *Estoy emocionado*); "¿Qué lograrás
    al final de este año?" → "¿Qué lograrás antes de que termine este año?".
  - >-
    The homework has no Mori message in the source (only questions, a writing task
    and a reading). A Mori message was written from the three homework questions;
    the writing task and the reading with its questions are kept as answer boxes.
  - >-
    The source has no introduction round for this cycle, so none is included. Only
    Activity 2 has a time (5 minutes to present each invention). The vocabulary list
    is the same as in the previous cycle (Proyectos y metas: el pasado), with the same
    gloss changes ("Establecer" → "לקבוע / להקים", "Alcanzar" → "להשיג / להגיע אל").
    The Quizlet link is kept without "?new". The "Respuesta de alumno 1/2/3" lines
    are replaced by the answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: proyectos-y-metas-futuro-clase
    title: 'Clase: Proyectos y metas (futuro)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Proyectos y metas: el futuro'
      - id: skills
        type: cycleOverview
        skills:
          - name: Futuro
            description: '*Voy a estudiar* (ir a + infinitivo) y *estudiaré* (futuro simple)'
          - name: Presente de subjuntivo
            description: '*Es importante que estudies. Cuando logre mi meta, voy a celebrar.*'
      - id: quizlet
        type: externalLink
        label: Proyectos y metas en Quizlet
        url: https://quizlet.com/il/985525722/goals-and-proyects-conversational-spanish-flash-cards/
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup
        type: discussionQuestions
        items:
          - question: ¿Cuál es tu meta? ¿Qué vas a hacer cuando tu meta se haga realidad?
            frame: Mi meta es ___. Cuando mi meta se haga realidad, voy a ___.
          - question: ¿Qué vas a hacer a continuación para cumplir tu meta?
            frame: El próximo ___ (día de la semana) voy a ___.
          - question: ¿Cómo te vas a sentir cuando logres tu meta?
            frame: Me voy a sentir ___ cuando logre mi meta. (Me voy a sentir feliz cuando logre mi meta.)
          - question: ¿Qué vas a hacer después de alcanzar tu meta?
            frame: Voy a ___ después de alcanzar mi meta. (Voy a celebrar con mis amigos después de alcanzar mi meta.)
          - question: ¿Quién va a celebrar tu logro contigo?
            frame: Mi ___ va a celebrar mi logro conmigo.
          - question: ¿Dónde vas a celebrar?
            frame: Vamos a celebrar en ___. Vamos a comer ___. Vamos a beber ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Mi visión hacia mi meta'
        skills: [Futuro]
        steps:
          - Escribe tu meta.
          - Escribe una lista de 10 pasos que vas a dar para lograr tu meta. Cada paso tiene una fecha de inicio.
          - Comparte tu lista con el grupo.
        example: |-
          **Meta:** Aprender a tocar la guitarra.
          1. Voy a empezar a aprender los acordes básicos y la técnica de rasgueo (10 de enero).
          2. Practicaré los acordes durante 15 minutos todos los días (11–25 de enero).
          3. Aprenderé una canción simple con los acordes básicos (26–31 de enero).
          4. Compraré un libro para principiantes o descargaré una app con lecciones (1 de febrero).
          5. Dedicaré 30 minutos dos veces a la semana a practicar ejercicios de dedos (2–28 de febrero).
          6. Grabaré mis avances para ver cómo mejorar (1–15 de marzo).
          7. Aprenderé a leer tablaturas de guitarra básicas (16–30 de marzo).
          8. Tocaré dos canciones sin detenerme y con transiciones suaves (1–15 de abril).
          9. Me uniré a un grupo de guitarra local o en línea para recibir comentarios y apoyo (16–30 de abril).
          10. ¡Voy a dar mi primer pequeño concierto para mis amigos y mi familia! (1 de mayo)
      - id: act1-list
        type: discussionQuestions
        title: Mi meta y mis 10 pasos
        items:
          - question: 'Meta: ___'
          - question: '1. El ___ (fecha) voy a ___.'
          - question: '2. El ___ (fecha) ___.'
          - question: '3. El ___ (fecha) ___.'
          - question: '4. El ___ (fecha) ___.'
          - question: '5. El ___ (fecha) ___.'
          - question: '6. El ___ (fecha) ___.'
          - question: '7. El ___ (fecha) ___.'
          - question: '8. El ___ (fecha) ___.'
          - question: '9. El ___ (fecha) ___.'
          - question: '10. El ___ (fecha): ¡Lo logré!'
      - id: act2
        type: classActivity
        title: 'Actividad 2: Mi regalo para tu meta, mi amigo'
        skills: [Futuro]
        steps:
          - Formen grupos de estudiantes con metas parecidas.
          - Cada grupo inventa algo para el otro grupo (el grupo 1 para el grupo 2 y al revés).
          - 'Presenten el invento en 5 minutos: expliquen cómo va a ayudar al otro grupo a lograr su meta.'
        example: |-
          **Meta:** Viajar a la Patagonia.
          **Invento:** Vamos a crear un «Dron Pingüino Explorador Polar», un robot pingüino volador que te ayudará a planificar tu viaje a la Patagonia: te recordará empacar ropa de abrigo y te sugerirá lugares para visitar.
      - id: act3
        type: classActivity
        title: 'Actividad 3: ¡A visualizar nuestra visión!'
        skills: [Futuro, Presente de subjuntivo]
        steps:
          - '(Opcional) Etapa 1: Tu profesor te guía en una visualización de tu Yo del Futuro.'
          - 'Etapa 2: Conviértete en esa versión de ti. Finge que ya eres tu Yo del Futuro: ¿cómo te pararías, hablarías y sentirías ahora que tuviste éxito?'
          - 'Etapa 3: Como tu Yo del Futuro, escribe una carta a tu Yo del Presente (tú, hoy). Cuéntale cómo se va a sentir cuando alcance la meta, quiénes lo van a apoyar y qué cosas va a tener que hacer para llegar allí.'
      - id: act3-letter
        type: discussionQuestions
        title: Carta de mi Yo del Futuro
        items:
          - question: Vas a sentirte ___.
          - question: Vas a estar rodeado/a de ___.
          - question: Vas a empezar por ___.
          - question: Vas a aprender a ___.
          - question: Vas a asegurarte de ___.
          - question: Vas a enfocarte en ___.
          - question: Vas a recordar ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Futuro** (*ir a* + infinitivo y futuro simple;
          Actividades 1, 2 y 3) y **Presente de subjuntivo** (preguntas de calentamiento
          y Actividad 3). Hay 6 preguntas de calentamiento.
      - id: n-warmup
        anchor: warmup
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act2
        anchor: act2
        text: Divide al grupo según metas parecidas. Cada grupo tiene 5 minutos para presentar su invento.
      - id: n-act3
        anchor: act3
        text: >-
          Etapa 1 (opcional), lee despacio: «Imagina tu Yo del Futuro. Cierra los ojos e
          imagínate en el futuro, después de haber alcanzado tu meta. Piensa en cómo te
          sientes, cómo es tu vida y quiénes están contigo.» Las Etapas 2 y 3 no son
          opcionales.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: proyectos-y-metas-futuro-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-futuro
        type: ruleSummary
        skill: Futuro
        rules:
          - text: '**Ir a + infinitivo:** *voy, vas, va, vamos, van* + *a* + infinitivo. Es la forma más común y natural de hablar de planes y del futuro cercano.'
            examples: [Voy a estudiar., Voy a cocinar mañana., Vamos a celebrar en un restaurante.]
          - text: 'Si la acción es *ir*, decimos **voy a ir**: *ir a* + *ir*.'
            examples: [Voy a ir al cine el sábado.]
          - text: '**Futuro simple:** infinitivo + *-é, -ás, -á, -emos, -án* (igual para -ar, -er, -ir). Es común en textos escritos, promesas y planes menos concretos.'
            examples:
              [
                Estudiaré para el examen.,
                ¿Tú estudiarás para el examen?,
                El próximo año conoceré a nuevas personas.,
              ]
          - text: 'Algunos verbos cambian la raíz, pero tienen las mismas terminaciones: *hacer → haré*, *tener → tendré*, *poder → podré*, *salir → saldré*, *decir → diré*.'
            examples: [Haré nuevos amigos.]
      - id: futuro-table
        type: table
        caption: El futuro de estudiar
        header: [Persona, Ir a + infinitivo, Futuro simple]
        rows:
          - [yo, voy a estudiar, estudiaré]
          - [tú, vas a estudiar, estudiarás]
          - [él / ella / usted, va a estudiar, estudiará]
          - [nosotros / nosotras, vamos a estudiar, estudiaremos]
          - [ellos / ellas / ustedes, van a estudiar, estudiarán]
      - id: rules-subjuntivo
        type: ruleSummary
        skill: Presente de subjuntivo
        rules:
          - text: 'El presente de subjuntivo expresa deseos, dudas, emociones o situaciones que todavía no son reales. Aparece sobre todo en una oración que depende de otra, después de *que*.'
            examples:
              [
                Es importante que tú **estudies** para el examen.,
                Espero que mi familia **celebre** conmigo.,
              ]
          - text: 'Se forma con la raíz del presente (forma de *yo*) y las terminaciones «al revés»: verbos en **-ar** → *-e* (*estudie, estudies*); verbos en **-er / -ir** → *-a* (*coma, comas; viva, vivas*).'
          - text: 'Con el futuro: después de **cuando** + una acción futura, usamos el subjuntivo (no el futuro).'
            examples:
              - Cuando tú **llegues**, nosotros comeremos.
              - Cuando **logre** mi meta, voy a celebrar.
              - Cuando mi meta se **haga** realidad, voy a viajar.
      - id: subjuntivo-table
        type: table
        caption: Presente de subjuntivo
        header: [Persona, Estudiar, Comer, Vivir]
        rows:
          - [yo, estudie, coma, viva]
          - [tú, estudies, comas, vivas]
          - [él / ella / usted, estudie, coma, viva]
          - [nosotros / nosotras, estudiemos, comamos, vivamos]
          - [ellos / ellas / ustedes, estudien, coman, vivan]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos habilidades con el grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: proyectos-y-metas-futuro-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia este mensaje y envíalo. Mori te hará preguntas; responde a todas en futuro.
      - id: mori-metas
        type: aiTutorPrompt
        title: Mis planes y metas
        message: >-
          ¡Hola Mori! Quiero practicar el futuro (voy a + infinitivo y el futuro simple)
          y el presente de subjuntivo con «cuando». Por favor, hazme estas preguntas una
          por una y corrige mis errores: ¿Qué vas a hacer el próximo fin de semana?
          ¿Qué lograrás antes de que termine este año? ¿A dónde vas a ir en tus próximas
          vacaciones? ¿Qué vas a hacer cuando logres tu meta?
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**
      - id: writing-title
        type: heading
        level: 3
        text: Ejercicio de escritura
      - id: writing
        type: reflection
        prompt: Escribe un párrafo corto (5–7 oraciones) sobre tu **meta** para el próximo mes.
      - id: reading-title
        type: heading
        level: 3
        text: Ejercicio de lectura
      - id: reading
        type: text
        text: >-
          El próximo año, estudiaré en el extranjero, en España. Voy a mejorar mi
          español y aprender sobre la cultura. También conoceré a nuevas personas y
          haré nuevos amigos. Estoy emocionado por esta aventura y por lo que voy a
          vivir.
      - id: reading-questions
        type: discussionQuestions
        title: Responde en futuro
        items:
          - question: ¿Dónde estudiará la persona el próximo año?
          - question: ¿Qué hará allí?
          - question: ¿A quién conocerá?
          - question: ¿Cómo se siente la persona con esta aventura?

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: proyectos-y-metas-futuro-practica
    book: workbook
    title: 'Práctica: Proyectos y metas (futuro)'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practica las dos habilidades del ciclo. Cada respuesta se corrige al momento, y puedes intentarlo otra vez.
      - id: ex-futuro
        type: activity
        activity: proyectos-y-metas-futuro-futuro
      - id: ex-subjuntivo
        type: activity
        activity: proyectos-y-metas-futuro-subjuntivo

