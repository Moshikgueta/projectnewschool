vocabulary:
  - slug: proyectos-y-metas-futuro
    title: 'Proyectos y metas: el futuro'
    items: *proyectos-y-metas-futuro-words

activities:
  - slug: proyectos-y-metas-futuro-futuro
    title: 'El futuro: voy a estudiar, estudiaré'
    minutes: 8
    items:
      - id: voy-a
        type: multipleChoice
        prompt: Mañana yo ___ a cocinar.
        options:
          - { text: voy, correct: true }
          - { text: vas, feedback: '*Vas* es para *tú*. Para *yo*: *voy a* + infinitivo.' }
          - { text: va, feedback: '*Va* es para *él* o *ella*. Para *yo*: *voy a* + infinitivo.' }
      - id: vamos-a
        type: fillBlank
        prompt: Completa con el verbo *ir* en presente.
        text: Nosotros ___ a celebrar en un restaurante.
        blanks: [[vamos]]
      - id: estudiare
        type: multipleChoice
        prompt: El próximo año, yo ___ en España.
        options:
          - { text: estudiaré, correct: true }
          - {
              text: estudié,
              feedback: '*Estudié* es pasado. Para el futuro: infinitivo + *-é* → *estudiaré*.',
            }
          - {
              text: estudiaba,
              feedback: '*Estudiaba* es pasado (imperfecto). Para el futuro: *estudiaré*.',
            }
      - id: une-futuro
        type: matching
        prompt: Une cada verbo con su forma de *yo* en futuro simple.
        pairs:
          - [hacer, haré]
          - [tener, tendré]
          - [poder, podré]
          - [practicar, practicaré]
          - [aprender, aprenderé]
      - id: dos-futuros
        type: trueFalse
        prompt: '*Voy a estudiar* y *Estudiaré* hablan las dos del futuro.'
        answer: true
        feedback:
          correct: ¡Correcto! *Ir a* + infinitivo y el futuro simple hablan del futuro.
          incorrect: 'Las dos formas hablan del futuro: *voy a estudiar* (ir a + infinitivo) y *estudiaré* (futuro simple).'
      - id: estudiaras
        type: fillBlank
        prompt: Completa con el futuro simple.
        text: ¿Tú ___ (estudiar) para el examen?
        blanks: [[estudiarás]]
      - id: voy-a-ir
        type: multipleChoice
        prompt: Voy a ___ al cine el sábado.
        options:
          - { text: ir, correct: true }
          - { text: voy, feedback: 'Después de *voy a* va el infinitivo: *voy a ir*.' }
          - { text: iré, feedback: 'Después de *voy a* va el infinitivo: *voy a ir*.' }
      - id: ordena-guitarra
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Voy a aprender a tocar la guitarra.

  - slug: proyectos-y-metas-futuro-subjuntivo
    title: 'Presente de subjuntivo: que estudies, cuando logre'
    minutes: 8
    items:
      - id: es-importante
        type: multipleChoice
        prompt: Es importante que tú ___ para el examen.
        options:
          - { text: estudies, correct: true }
          - {
              text: estudias,
              feedback: 'Después de *es importante que* usamos el subjuntivo: *estudies*.',
            }
          - {
              text: estudiar,
              feedback: 'Después de *que* necesitamos un verbo conjugado en subjuntivo: *estudies*.',
            }
      - id: cuando-logre
        type: multipleChoice
        prompt: Cuando ___ mi meta, voy a celebrar.
        options:
          - { text: logre, correct: true }
          - {
              text: logro,
              feedback: 'Es una acción futura: después de *cuando* usamos el subjuntivo, *logre*.',
            }
          - {
              text: lograré,
              feedback: 'Después de *cuando* no usamos el futuro, sino el subjuntivo: *logre*.',
            }
      - id: llegues
        type: fillBlank
        prompt: Completa con el presente de subjuntivo.
        text: Cuando tú ___ (llegar), nosotros comeremos.
        blanks: [[llegues]]
      - id: une-subjuntivo
        type: matching
        prompt: Une cada forma del presente de indicativo con su forma del presente de subjuntivo (tú).
        pairs:
          - [estudias, estudies]
          - [hablas, hables]
          - [comes, comas]
          - [vives, vivas]
          - [escribes, escribas]
      - id: cuando-futuro
        type: trueFalse
        prompt: 'Después de *cuando* usamos el futuro: *Cuando lograré mi meta, voy a celebrar.*'
        answer: false
        feedback:
          correct: '¡Correcto! Decimos *Cuando logre mi meta…*'
          incorrect: 'Después de *cuando* (acción futura) usamos el subjuntivo: *Cuando logre mi meta, voy a celebrar.*'
      - id: trabajemos
        type: fillBlank
        prompt: Completa con el presente de subjuntivo.
        text: Es importante que nosotros ___ (trabajar) todos los días.
        blanks: [[trabajemos]]
      - id: espero-que
        type: multipleChoice
        prompt: Espero que mi familia ___ conmigo.
        options:
          - { text: celebre, correct: true }
          - {
              text: celebra,
              feedback: 'Después de *espero que* (un deseo) usamos el subjuntivo: *celebre*.',
            }
          - {
              text: celebrará,
              feedback: 'Después de *espero que* (un deseo) usamos el subjuntivo: *celebre*.',
            }
      - id: ordena-logre
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Cuando logre mi meta, voy a celebrar.
        alsoAccept: [Voy a celebrar cuando logre mi meta]
