  - slug: proyectos-y-metas-futuro-vocabulario
    title: Vocabulario
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Palabras de proyectos y metas
        glossLang: he
        link: https://quizlet.com/il/985525722/goals-and-proyects-conversational-spanish-flash-cards/
        items: &proyectos-y-metas-futuro-words
          - { term: Meta, gloss: מטרה }
          - { term: Proyecto, gloss: פרויקט }
          - { term: Lograr, gloss: להשיג }
          - { term: Plan, gloss: תוכנית }
          - { term: Objetivo, gloss: יעד }
          - { term: Futuro, gloss: עתיד }
          - { term: Acción, gloss: פעולה }
          - { term: Ayudar, gloss: לעזור }
          - { term: Voluntario, gloss: מתנדב }
          - { term: Comunicar, gloss: לתקשר }
          - { term: Cambio, gloss: שינוי }
          - { term: Pasado, gloss: עבר }
          - { term: Hacer, gloss: לעשות }
          - { term: Decisión, gloss: החלטה }
          - { term: Contribución, gloss: תרומה }
          - { term: Establecer, gloss: לקבוע / להקים }
