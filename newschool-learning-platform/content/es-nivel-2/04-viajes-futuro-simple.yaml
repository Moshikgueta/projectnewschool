# Cycle "Viajes: futuro simple", converted from the Spanish nivel 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-2
slug: viajes-futuro-simple
title: 'Viajes: futuro simple'
goal: Hablar de planes y predicciones de viaje en futuro simple, y preguntar y contar los planes de otros.
position: 4
status: in_review

review:
  - >-
    The two workbook exercises ("Mis planes" and "Preguntas y planes de otros") are
    NEW: the notebook has no self-study exercises. They were written from the
    cycle's skills, its general information (the futuro simple endings), its
    examples and its vocabulary. Please check level, wording and every right answer
    before students see them.
  - >-
    Title: the notebook calls the cycle "Viajes – Futuro imperfecto" (also the
    Quizlet label). The tense taught (viajaré, viajarás…) is the futuro simple, also
    called futuro imperfecto de indicativo. The title is "Viajes: futuro simple";
    please confirm. The Quizlet set URL itself is kept as it is.
  - >-
    Skills: the notebook lists three goals (1st person plans, 2nd person questions,
    3rd person reports). The platform shows two skills, so goals 2 and 3 are
    combined: "Planes y predicciones" (yo / nosotros) and "Preguntar y contar los
    planes de otros" (tú / él / ella).
  - >-
    Grammar rule rewritten: the notebook says "verbo + terminaciones especiales"
    and gives the endings without saying they go on the whole infinitive. The
    summary now says "infinitivo completo + -é, -ás, -á, -emos, -éis, -án", adds
    the missing vosotros form (viajaréis) and adds the irregular stems used in the
    cycle's own examples (hacer → haré, tener → tendré, poder → podré, venir →
    vendré). Please confirm the extra row of irregular verbs.
  - >-
    The notebook has no lesson summary ("Resumen") and no Mori homework for this
    cycle. The "Resumen" section is built from the notebook's "Información general"
    (the endings and the three goals); there is no "Tarea con Mori" section. Please
    add a Mori task if you want one.
  - >-
    Corrections: the many stray asterisks and broken formatting in Activity 1 were
    cleaned; "Preguntas de preparación" is shown as "Preguntas de calentamiento" as
    in level 1; the warm-up models are given in the teacher note and turned into
    sentence frames.
  - >-
    The level variations ("Iniciantes (A2 bajo)" / "Intermedios (A2 alto)") in
    Activities 2 and 3 are kept as two callouts: "Nivel iniciante" and "Nivel
    intermedio".
  - >-
    Times: the ranges 7–8 min and 5–7 min are recorded as 8 and 7; 3–4 min as 4.
    The activity totals are 18, 17 and 17 minutes.
  - >-
    Vocabulary: "Entrada (ticket)" → "Entrada" (the English word "ticket" was
    removed); "Cambiará" glossed "ישתנה / ישנה" (it is mostly intransitive, "will
    change"); "Historia" glossed "סיפור / היסטוריה"; "Asistiré" glossed "אשתתף / אגיע".
    Please confirm.
  - >-
    The "Respuesta de alumno 1/2/3" lines are replaced by the optional answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: viajes-futuro-simple-clase
    title: 'Clase: Viajes (futuro simple)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Viajes: futuro simple'
      - id: skills
        type: cycleOverview
        skills:
          - name: Planes y predicciones
            description: '*Visitaré Japón. Viajaremos en tren rápido.*'
          - name: Preguntar y contar los planes de otros
            description: '*¿Qué visitarás en Japón? Mi compañero visitará Japón.*'
      - id: quizlet
        type: externalLink
        label: 'Viajes: futuro simple en Quizlet'
        url: https://quizlet.com/br/1069761895/viajes-futuro-imperfecto-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___. Mi próximo viaje será a ___ y voy a ___.
        example: Soy Marta. Mi próximo viaje será a Grecia y voy a visitar las islas.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup
        type: discussionQuestions
        items:
          - question: ¿Qué lugares visitarás en tu próximo viaje?
            frame: Visitaré ___ y ___.
          - question: ¿Qué actividades harás durante ese viaje?
            frame: Haré ___ y probaré ___.
          - question: ¿Qué cosas llevarás en tu maleta?
            frame: Llevaré ___ y ___.
          - question: ¿Cómo será el hotel donde te quedarás?
            frame: Será ___ y tendrá ___.
          - question: ¿Qué transporte usarás dentro de 20 años?
            frame: Usaré ___. / Viajaré en ___.
          - question: ¿Cuál será tu viaje soñado?
            frame: Será un viaje a ___ y visitaré ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Dentro de 20 años'
        skills: [Planes y predicciones, Preguntar y contar los planes de otros]
        minutes: 18
        steps:
          - 'Escritura individual (5 min): completa las frases de abajo.'
          - 'En parejas (8 min): lee tus frases. Tu compañero hace 2 o 3 preguntas de seguimiento.'
          - 'Con todo el grupo (5 min): presenta a tu compañero en tercera persona.'
        example: |-
          *Alumno A: En 20 años viviré en Barcelona.*
          *Alumno B: ¿Con quién vivirás en Barcelona? ¿En una casa o en un piso?*
          *Reporte: Mi compañera vivirá en Barcelona, viajará en trenes eléctricos y su casa será inteligente.*
      - id: act1-sentences
        type: discussionQuestions
        title: Mis frases
        items:
          - question: En 20 años viviré en ___.
          - question: Viajaré en ___.
          - question: La tecnología será ___.
          - question: Mi vida será ___. (opcional)
      - id: act1-questions
        type: discussionQuestions
        title: Preguntas de apoyo
        answerable: false
        items:
          - question: ¿Con quién vivirás?
          - question: ¿Cómo viajarás exactamente?
          - question: ¿Qué comerás en el futuro?
          - question: ¿Cómo será tu casa?
          - question: ¿Tendrás un trabajo diferente?
          - question: ¿Qué cosas nuevas harás en tu tiempo libre?
          - question: ¿Cómo será la escuela / universidad en el futuro?
          - question: ¿Qué cambiará en los viajes?
          - question: ¿Qué no existirá en 20 años?
          - question: ¿Qué será igual que ahora?
      - id: act2
        type: classActivity
        title: 'Actividad 2: Mi viaje soñado'
        skills: [Planes y predicciones, Preguntar y contar los planes de otros]
        minutes: 17
        steps:
          - 'Escritura individual (4 min): escribe 3 frases en futuro simple. Usa las frases de abajo.'
          - 'En parejas (8 min): tu compañero hace preguntas de seguimiento para saber más.'
          - 'Con todo el grupo (5 min): presenta lo que aprendiste de tu compañero en tercera persona.'
        example: |-
          *Alumno A: Algún día visitaré Japón.*
          *Alumno B: ¿Qué ciudad visitarás en Japón? ¿Qué comida probarás allí?*
          *Reporte: Mi compañero visitará Japón, probará ramen y conocerá a un amigo japonés.*
      - id: act2-sentences
        type: discussionQuestions
        title: Mi viaje soñado
        items:
          - question: Algún día visitaré ___.
          - question: Probaré ___.
          - question: Conoceré a ___.
          - question: 'Opcional: Me hospedaré en ___. / Haré ___.'
      - id: act2-questions
        type: discussionQuestions
        title: Preguntas de apoyo
        answerable: false
        items:
          - question: ¿Qué ciudad visitarás?
          - question: ¿Qué comida probarás primero?
          - question: ¿Con quién viajarás?
          - question: ¿Qué actividades harás en ese lugar?
          - question: ¿Qué idioma necesitarás hablar?
          - question: ¿Qué llevarás contigo?
      - id: act2-iniciante
        type: callout
        tone: tip
        title: Nivel iniciante (A2 bajo)
        text: 'Frases cortas y concretas: *Visitaré Italia, probaré pizza, conoceré a nuevos amigos.*'
      - id: act2-intermedio
        type: callout
        tone: tip
        title: Nivel intermedio (A2 alto)
        text: 'Frases más largas, con detalles: *Visitaré Italia con mi familia, probaré la pizza napolitana en Nápoles y conoceré a un chef local.*'
      - id: act3
        type: classActivity
        title: 'Actividad 3: Predicciones cotidianas'
        skills: [Planes y predicciones, Preguntar y contar los planes de otros]
        minutes: 17
        steps:
          - 'Preparación (2 min): tu profesor dice una situación (por ejemplo: tu próximo fin de semana, el verano que viene, el futuro del transporte, la escuela / universidad dentro de 10 años, tu vida en 20 años).'
          - 'Producción individual (5 min): inventa 2 frases en futuro simple.'
          - 'En parejas (7 min): lee tus frases. Tu compañero hace preguntas de seguimiento.'
          - 'Cierre en grupo (3 min): presenta a tu compañero en tercera persona.'
        example: |-
          *El próximo fin de semana viajaré a la playa. Dentro de 10 años estudiaré en la universidad.*
          *¿Con quién viajarás a la playa? ¿Qué estudiarás en la universidad?*
          *Mi compañero viajará a la playa el próximo fin de semana y dentro de 10 años estudiará en la universidad.*
      - id: act3-sentences
        type: discussionQuestions
        title: Mis predicciones
        items:
          - question: 'Frase 1:'
            frame: ___ (cuándo) + verbo en futuro simple + ___.
          - question: 'Frase 2:'
            frame: ___ (cuándo) + verbo en futuro simple + ___.
      - id: act3-iniciante
        type: callout
        tone: tip
        title: Nivel iniciante (A2 bajo)
        text: 'Frases muy simples, con una palabra de tiempo clara: *El sábado cocinaré pizza. Mañana estudiaré español.*'
      - id: act3-intermedio
        type: callout
        tone: tip
        title: Nivel intermedio (A2 alto)
        text: 'Frases más largas, con detalles y explicaciones: *El próximo año viajaré a Italia con mi familia y probaré la comida típica de Roma.*'
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Planes y predicciones** en 1.ª persona
          (*Visitaré Japón*) y **Preguntar y contar los planes de otros** en 2.ª y 3.ª
          persona (*¿Qué visitarás? / Mi compañero visitará…*). Las tres actividades
          practican las tres personas: escritura en 1.ª persona, preguntas en 2.ª
          persona y reporte en 3.ª persona.
      - id: n-intro
        anchor: intro
        text: Da tu propio ejemplo primero y después pregunta a cada estudiante.
      - id: n-warmup
        anchor: warmup
        text: >-
          Modelos del cuaderno: 1. *Visitaré Barcelona y Sevilla.* 2. *Haré excursiones y
          probaré la comida local.* 3. *Llevaré ropa de verano y mi cámara de fotos.*
          4. *Será grande y tendrá piscina.* 5. *Usaré coches eléctricos o viajaré en tren
          rápido.* 6. *Será un viaje a Japón y visitaré templos antiguos.*
      - id: n-act1
        anchor: act1
        minutes: 18
        text: >-
          Puedes proyectar o repartir la lista de preguntas de apoyo y elegir las
          preguntas según el nivel del grupo.
      - id: n-act2
        anchor: act2
        minutes: 17
        text: Elige las preguntas de apoyo según el nivel del grupo.
      - id: n-act3
        anchor: act3
        minutes: 17
        text: >-
          Reparte o di las situaciones: tu próximo fin de semana, el verano que viene, el
          futuro del transporte, la escuela / universidad dentro de 10 años, tu vida en
          20 años.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: viajes-futuro-simple-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-planes
        type: ruleSummary
        skill: Planes y predicciones
        rules:
          - text: 'Usamos el **futuro simple** para hablar de planes, deseos y predicciones: nuestros próximos viajes.'
          - text: 'Forma: **infinitivo completo + terminación**. Las terminaciones son iguales para los verbos en -ar, -er e -ir.'
            examples: [viajar → viajaré, comer → comeré, vivir → viviré]
          - text: 'Todas las formas llevan tilde, menos *nosotros*: viajar**é**, viajar**ás**, viajar**á**, viajar**án**; viajar**emos**.'
          - text: 'Algunos verbos cambian la raíz, pero las terminaciones son las mismas.'
            examples: [hacer → haré, tener → tendré, poder → podré, venir → vendré]
      - id: future-table
        type: table
        caption: 'El futuro simple: viajar'
        header: [Persona, Terminación, Ejemplo]
        rows:
          - [Yo, -é, Viajaré a Japón.]
          - [Tú, -ás, ¿Viajarás en tren?]
          - [Él / Ella / Usted, -á, Mi compañero viajará en avión.]
          - [Nosotros / Nosotras, -emos, Viajaremos en tren rápido.]
          - [Vosotros / Vosotras, -éis, Viajaréis con vuestros amigos.]
          - [Ellos / Ellas / Ustedes, -án, Mis padres viajarán a Grecia.]
      - id: rules-otros
        type: ruleSummary
        skill: Preguntar y contar los planes de otros
        rules:
          - text: 'Para preguntar a un compañero, usa la 2.ª persona (*tú*): -ás.'
            examples: [¿Qué visitarás en Japón?, ¿Con quién viajarás?]
          - text: 'Para contar los planes de otra persona, usa la 3.ª persona (*él / ella*): -á.'
            examples: [Mi compañero visitará Japón., Mi compañera vivirá en Barcelona.]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: >-
          El cuaderno no tiene resumen para este ciclo: este resumen viene de la
          información general. Repasa las terminaciones con el grupo y pide un ejemplo en
          1.ª, 2.ª y 3.ª persona.

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: viajes-futuro-simple-practica
    book: workbook
    title: 'Práctica: Viajes (futuro simple)'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practica las dos habilidades del ciclo. Cada respuesta se corrige al momento, y puedes intentarlo otra vez.
      - id: ex-planes
        type: activity
        activity: viajes-futuro-simple-planes
      - id: ex-preguntas
        type: activity
        activity: viajes-futuro-simple-preguntas

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: viajes-futuro-simple-vocabulario
    title: Vocabulario
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: 'Viajes: futuro simple'
        glossLang: he
        link: https://quizlet.com/br/1069761895/viajes-futuro-imperfecto-flash-cards/
        items: &viajes-futuro-simple-words
          - { term: Descubriré, gloss: אגלה }
