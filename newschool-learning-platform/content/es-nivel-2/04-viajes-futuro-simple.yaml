vocabulary:
  - slug: viajes-futuro-simple
    title: 'Viajes: futuro simple'
    items: *viajes-futuro-simple-words

activities:
  - slug: viajes-futuro-simple-planes
    title: 'Mis planes: viajaré, visitaremos'
    minutes: 8
    items:
      - id: estudiare
        type: multipleChoice
        prompt: 'Mañana ___ español. (estudiar, yo)'
        options:
          - { text: estudiaré, correct: true }
          - {
              text: estudiará,
              feedback: 'La terminación *-á* es para *él / ella*. Para *yo* usamos *-é*: *estudiaré*.',
            }
          - {
              text: estudiaremos,
              feedback: 'La terminación *-emos* es para *nosotros*. Para *yo* usamos *-é*: *estudiaré*.',
            }
      - id: visitare-japon
        type: fillBlank
        prompt: Escribe el verbo en futuro simple.
        text: El próximo año ___ (visitar, yo) Japón.
        blanks: [[visitaré, yo visitaré]]
      - id: viajaremos
        type: fillBlank
        prompt: Escribe el verbo en futuro simple.
        text: En 20 años ___ (viajar, nosotros) en trenes eléctricos.
        blanks: [[viajaremos, nosotros viajaremos]]
      - id: une-yo
        type: matching
        prompt: Une cada verbo con su forma de *yo* en futuro simple.
        pairs:
          - [visitar, visitaré]
          - [probar, probaré]
          - [conocer, conoceré]
          - [hacer, haré]
          - [tener, tendré]
      - id: infinitivo
        type: trueFalse
        prompt: 'Para formar el futuro simple, ponemos la terminación después del infinitivo completo: *viajar → viajaré*.'
        answer: true
        feedback:
          correct: '¡Correcto! *viajar + é = viajaré*, *comer + é = comeré*, *vivir + é = viviré*.'
          incorrect: 'Usamos el infinitivo completo: *viajar + é = viajaré*, *comer + é = comeré*.'
      - id: hare
        type: multipleChoice
        prompt: '¿Cuál es el futuro simple de *hacer* (yo)?'
        options:
          - { text: haré, correct: true }
          - {
              text: haceré,
              feedback: '*Hacer* es irregular en futuro: la raíz cambia a *har-*: *haré*.',
            }
          - { text: hacé, feedback: 'En futuro simple la raíz de *hacer* es *har-*: *haré*.' }
      - id: ordena-japon
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Algún día visitaré Japón.
      - id: tecnologia
        type: fillBlank
        prompt: Escribe el verbo en futuro simple.
        text: En 20 años la tecnología ___ (ser) muy diferente.
        blanks: [[será]]

  - slug: viajes-futuro-simple-preguntas
    title: 'Preguntas y planes de otros: ¿viajarás?, viajará'
    minutes: 8
    items:
      - id: visitaras
        type: multipleChoice
        prompt: '¿Qué ___ en Japón? (visitar, tú)'
        options:
          - { text: visitarás, correct: true }
          - {
              text: visitaré,
              feedback: 'La terminación *-é* es para *yo*. Para preguntar a *tú* usamos *-ás*: *visitarás*.',
            }
          - {
              text: visitará,
              feedback: 'La terminación *-á* es para *él / ella*. Para *tú* usamos *-ás*: *visitarás*.',
            }
      - id: companero
        type: fillBlank
        prompt: Escribe el verbo en futuro simple.
        text: Mi compañero ___ (visitar) Japón.
        blanks: [[visitará]]
      - id: vivir-barcelona
        type: fillBlank
        prompt: Escribe el verbo en futuro simple.
        text: ¿Con quién ___ (vivir, tú) en Barcelona?
        blanks: [[vivirás]]
      - id: une-personas
        type: matching
        prompt: Une cada persona con su terminación en futuro simple.
        pairs:
          - [yo, -é]
          - [tú, -ás]
          - [él / ella, -á]
          - [nosotros, -emos]
          - [ellos / ellas, -án]
      - id: tercera
        type: trueFalse
        prompt: 'En *Mi compañera viajará en trenes eléctricos*, el verbo está en 3.ª persona (*ella*).'
        answer: true
        feedback:
          correct: '¡Correcto! *-á* es la terminación de *él / ella*.'
          incorrect: '*Mi compañera* = *ella*, y la terminación *-á* es para *él / ella*: *viajará*.'
      - id: reporte
        type: multipleChoice
        prompt: 'Tu compañero dice: *Probaré ramen.* ¿Cómo lo cuentas al grupo?'
        options:
          - { text: Mi compañero probará ramen., correct: true }
          - {
              text: Mi compañero probaré ramen.,
              feedback: '*Probaré* es para *yo*. Para hablar de otra persona usamos *-á*: *probará*.',
            }
          - {
              text: Mi compañero probarás ramen.,
              feedback: '*Probarás* es para *tú*. Para hablar de otra persona usamos *-á*: *probará*.',
            }
      - id: ordena-comida
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: ¿Qué comida probarás primero?
      - id: tendras
        type: multipleChoice
        prompt: '¿___ un trabajo diferente? (tener, tú)'
        options:
          - { text: Tendrás, correct: true }
          - {
              text: Tenerás,
              feedback: '*Tener* es irregular en futuro: la raíz es *tendr-*: *tendrás*.',
            }
          - {
              text: Tendrá,
              feedback: '*Tendrá* es para *él / ella*. Para preguntar a *tú* usamos *-ás*: *tendrás*.',
            }
