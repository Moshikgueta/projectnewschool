# Cycle "Redes sociales (pasado)", converted from the Spanish level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-2
slug: redes-sociales-pasado
title: Redes sociales (pasado)
goal: Contar experiencias con las redes sociales en pretérito indefinido y hacer comparaciones.
position: 20
status: in_review

review:
  - >-
    The two workbook exercises ("Pretérito indefinido" and "Comparaciones") are
    NEW: the notebook has no self-study exercises. They were written from the
    cycle's two skills, its summary rules and its vocabulary. Please check level,
    wording and every right answer before students see them.
  - >-
    Grammar summary: the conjugation lists gave 5 forms; they are now tables with
    the vosotros forms added (usasteis, mirasteis, publicasteis, fuisteis,
    tuvisteis, hicisteis, dijisteis). Two short rules were added that the
    workbook uses: the regular endings (-ar: -é, -aste, -ó…; -er/-ir: -í, -iste,
    -ió…) and the spelling change publicar → publiqué. "ver" (vi, viste, vio…) was
    added to the irregular table because the activities use it a lot. Next to
    "igual de + adjetivo + que" the standard form "tan + adjetivo + como" was added.
  - >-
    Corrections: "Resumen grammatical" → "Resumen gramatical"; "Facebook fue la
    menos activa para mis amigos" → "Facebook fue la red menos activa entre mis
    amigos"; Activity 5 "cuál es la verdad y cuál es mentira" → "cuál es verdadera
    y cuál es falsa"; tip 5 example "TikTok va a ser más divertido que YouTube"
    (future) → "TikTok fue más divertido que YouTube" (past, this cycle's skill).
  - >-
    Repeated text kept once: the line "Cada estudiante dice 2 frases" (twice in the
    introduction) and Activity 4's "Dinámica", which repeats its steps. The
    "Consejos para aprender español usando redes sociales" list is the same as in
    the "Redes sociales (futuro)" cycle; it is kept here too so the cycle stands on
    its own.
  - >-
    Activity 2 (debate) times: 7–8 minutes is recorded as 8; the activity total is
    26 minutes (8 + 10 + 5 + 3). Its "Variaciones" are a teacher note. No other
    activity has a time.
  - >-
    The homework's 16 numbered Mori requests are grouped into one message per part
    (5 parts), with the closing request in the tips callout.
  - >-
    The vocabulary list is the same as in the "Redes sociales (futuro)" cycle, with
    the same two gloss changes: "Conectar(se), לחבר / להתחבר" and "Escuchar, להקשיב
    / לשמוע". The Quizlet link is kept without "?new". The "Respuesta de alumno
    1/2/3" lines are replaced by the optional answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: redes-sociales-pasado-clase
    title: 'Clase: Redes sociales (pasado)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Redes sociales (pasado)
      - id: skills
        type: cycleOverview
        skills:
          - name: Pretérito indefinido
            description: 'Contar experiencias reales con las redes sociales: *usé, vi, publiqué, fue*'
          - name: Comparaciones
            description: '*más / menos… que, el / la más, el / la menos*'
      - id: quizlet
        type: externalLink
        label: Redes sociales (pasado) en Quizlet
        url: https://quizlet.com/br/1071363390/redes-sociales-pasado-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        prompt: Di 2 frases.
        frame: Soy ___. Ayer usé ___ (red social). La última vez que entré a mis redes, publiqué ___.
        example: Soy Marta. Ayer usé Instagram. La última vez publiqué fotos de mis vacaciones.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup
        type: discussionQuestions
        items:
          - question: ¿Qué red social usaste ayer? ¿Por qué?
            frame: Ayer usé ___ porque ___. (*Ayer usé WhatsApp porque hablé con mi familia.*)
          - question: ¿Cuál fue la última foto o video que subiste a tus redes sociales?
            frame: La última foto que subí fue de ___. (*La última foto que subí fue de mi perro.*)
          - question: ¿Qué música escuchaste en YouTube o Spotify la semana pasada?
            frame: La semana pasada escuché ___. (*La semana pasada escuché reguetón en Spotify.*)
          - question: ¿Cuál fue la última publicación interesante que viste? ¿Dónde?
            frame: Vi ___ en ___. (*Vi una receta en TikTok y fue muy útil.*)
          - question: ¿Qué red social usaste más el año pasado? ¿Y cuál usaste menos?
            frame: El año pasado usé más ___ que ___. (*El año pasado usé más Instagram que Facebook.*)
          - question: ¿Tuviste alguna experiencia divertida o rara en redes sociales?
            frame: Sí, ___. / No, no tuve ___. (*Sí, un amigo me etiquetó en un meme muy gracioso.*)
          - question: ¿Con quién hablaste más en WhatsApp el mes pasado?
            frame: El mes pasado hablé más con ___. (*El mes pasado hablé más con mi mejor amigo.*)
          - question: ¿Qué publicación te hizo reír mucho?
            frame: Hace ___ vi ___ y me reí mucho. (*Hace dos días vi un meme en Instagram y me reí mucho.*)
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Mi experiencia en redes'
        skills: [Pretérito indefinido, Comparaciones]
        steps:
          - Escribe 4 frases en pasado sobre lo que hiciste en las redes hace poco (abajo).
          - 'En parejas, háganse preguntas: *¿Qué publicaste? ¿Qué viste? ¿Qué red social fue más interesante para ti?*'
          - Cada estudiante comparte con el grupo 1 frase de su compañero.
        example: |-
          *Ayer usé Instagram.*
          *Vi videos de cocina.*
          *Me gustó un post de recetas.*
          *No me gustó un anuncio.*
      - id: act1-sentences
        type: discussionQuestions
        title: Mis 4 frases
        items:
          - question: ¿Qué red social usaste?
            frame: Ayer usé ___.
          - question: ¿Qué viste o publicaste?
            frame: Vi ___. / Publiqué ___.
          - question: ¿Qué te gustó más?
            frame: Me gustó ___.
          - question: ¿Qué no te gustó?
            frame: No me gustó ___.
      - id: act2
        type: classActivity
        title: 'Actividad 2: Debate en pasado'
        skills: [Pretérito indefinido, Comparaciones]
        minutes: 26
        steps:
          - 'Tema: *El año pasado, ¿las redes sociales ayudaron más o causaron más problemas?* Grupo A: las redes sociales ayudaron más. Grupo B: las redes sociales causaron más problemas.'
          - 'Preparación (8 minutos): cada grupo escribe 3–4 frases en pasado, con ejemplos reales o inventados.'
          - 'Debate (10 minutos): cada estudiante presenta una frase de su grupo. El otro grupo puede responder con otra frase en pasado.'
          - 'Usa comparaciones: *Instagram fue más popular que Facebook. TikTok fue menos útil que YouTube para aprender.*'
          - 'Comparación de argumentos (5 minutos): ¿cuál argumento fue más fuerte? ¿Qué grupo usó más ejemplos en pasado?'
          - 'Votación final (3 minutos): ¿quién tuvo los mejores argumentos, el Grupo A o el Grupo B?'
      - id: act2-examples
        type: table
        caption: Ejemplos para el debate
        header: [Grupo A (positivo), Grupo B (negativo)]
        rows:
          - [
              El año pasado las redes sociales ayudaron a comunicar a las familias.,
              El año pasado las redes crearon más adicción que soluciones.,
            ]
          - [
              Las personas aprendieron español en YouTube más que en la escuela.,
              Muchas personas pasaron menos tiempo con su familia y más en internet.,
            ]
          - [
              Las redes conectaron a los estudiantes con sus profesores.,
              Las redes fueron menos seguras que antes.,
            ]
      - id: act2-sentences
        type: discussionQuestions
        title: Las frases de mi grupo
        items:
          - question: El año pasado las redes sociales ___.
          - question: Las personas ___ más / menos ___ que ___.
          - question: Las redes fueron más / menos ___ que ___.
      - id: act3
        type: classActivity
        title: 'Actividad 3: Línea del tiempo digital'
        skills: [Pretérito indefinido, Comparaciones]
        steps:
          - 'Dibuja una línea del tiempo con 3 momentos importantes de tus redes el año pasado (por ejemplo: abrí una cuenta, subí mi primera foto, recibí muchos comentarios).'
          - Escribe una frase en pasado para cada momento.
          - 'En parejas, comparen sus experiencias: *Mi primera publicación fue más popular que la tuya. Tú recibiste menos comentarios que yo.*'
        example: '*En enero abrí mi cuenta de TikTok. En marzo subí mi primer video. En agosto recibí cien likes.*'
      - id: act3-timeline
        type: discussionQuestions
        title: Mi línea del tiempo
        items:
          - question: En ___ (mes), ___.
          - question: En ___ (mes), ___.
          - question: En ___ (mes), ___.
      - id: act4
        type: classActivity
        title: 'Actividad 4: Entrevista de recuerdos'
        skills: [Pretérito indefinido, Comparaciones]
        steps:
          - En parejas, un estudiante es periodista y el otro es un usuario famoso de redes.
          - El periodista elige 4 preguntas de la lista y las hace a su compañero.
          - El usuario famoso responde con frases completas.
          - Luego cambian de rol.
      - id: act4-questions
        type: discussionQuestions
        title: Preguntas para el periodista
        items:
          - question: ¿Cuál fue tu publicación más vista el año pasado?
            frame: Mi publicación más vista fue ___. (*Mi publicación más vista fue un video de mi perro.*)
          - question: ¿Qué hiciste en tu primera cuenta de redes sociales?
            frame: En mi primera cuenta ___. (*En mi primera cuenta subí fotos con mis amigos.*)
          - question: ¿Qué persona famosa seguiste por primera vez?
            frame: Seguí a ___. (*Seguí a un cantante muy popular en Instagram.*)
          - question: ¿Cuál fue el mejor comentario que recibiste en una publicación?
            frame: El mejor comentario fue ___. (*El mejor comentario fue «tu foto es increíble».*)
          - question: ¿Qué aplicación usaste más el año pasado y por qué?
            frame: Usé más ___ porque ___. (*Usé más TikTok porque vi muchos videos divertidos.*)
          - question: ¿Qué experiencia rara o divertida tuviste en redes?
            frame: ___. (*Un amigo me etiquetó en un meme muy gracioso.*)
      - id: act5
        type: classActivity
        title: 'Actividad 5: Historias verdaderas y falsas'
        skills: [Pretérito indefinido, Comparaciones]
        steps:
          - 'Prepara dos frases en pasado sobre tus redes: una verdadera y una falsa.'
          - El resto del grupo adivina cuál es verdadera y cuál es falsa.
          - 'Usa comparaciones en las respuestas: *Tu historia fue más realista que la otra.*'
        example: |-
          *El año pasado subí un video que tuvo mil vistas.*
          *Hace dos años borré todas mis fotos de Instagram.*
      - id: act5-sentences
        type: discussionQuestions
        title: Mis dos historias
        items:
          - question: 'Historia 1:'
          - question: 'Historia 2:'
      - id: act6
        type: classActivity
        title: 'Actividad 6: Diario digital'
        skills: [Pretérito indefinido, Comparaciones]
        steps:
          - Escribe un mini diario de ayer en las redes sociales (4–5 frases).
          - 'En parejas, lean sus diarios y comparen: *Tú usaste más aplicaciones que yo. Yo publiqué menos cosas que tú.*'
        example: '*Ayer usé WhatsApp para hablar con mi madre. Vi dos videos en TikTok. Después compartí una foto en Instagram. Fue un día muy activo.*'
      - id: act6-diary
        type: discussionQuestions
        title: Mi diario de ayer
        items:
          - question: Ayer usé ___ para ___. Vi ___. Después ___. Fue un día ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Pretérito indefinido** y **Comparaciones**.
          Todas las actividades combinan las dos. Elige 2 o 3 actividades según el
          tiempo de la clase.
      - id: n-intro
        anchor: intro
        text: Da tu propio ejemplo primero y después pregunta a cada estudiante.
      - id: n-warmup
        anchor: warmup
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act2
        anchor: act2
        text: >-
          Divide la clase en dos grupos. Durante el debate, guía a los estudiantes
          para que usen comparaciones. En la parte de comparación, escribe en la
          pizarra algunas frases de los dos grupos. Variaciones: mini debate en
          parejas (cada uno defiende un punto y responde al otro), o, después del
          debate, cada grupo escribe un párrafo breve en pasado con sus ideas
          principales.
      - id: n-act5
        anchor: act5
        text: Anima a los estudiantes a usar comparaciones cuando adivinan.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: redes-sociales-pasado-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-preterito
        type: ruleSummary
        skill: Pretérito indefinido
        rules:
          - text: 'Se usa para acciones terminadas en un momento concreto del pasado, para experiencias personales y para una secuencia de acciones.'
          - text: 'Estructura: sujeto (opcional) + verbo en pretérito indefinido.'
            examples:
              - Ayer usé WhatsApp para hablar con mi familia.
              - El año pasado abrí una cuenta en TikTok.
              - Subí una foto y recibí muchos likes.
              - Vi un video en YouTube y después lo compartí.
          - text: 'Verbos regulares: **-ar** → -é, -aste, -ó, -amos, -asteis, -aron; **-er / -ir** → -í, -iste, -ió, -imos, -isteis, -ieron.'
            examples: [usar → usé, abrir → abrí, recibir → recibí]
          - text: 'Los verbos en **-car** cambian con *yo*: c → qu.'
            examples: [publicar → publiqué, buscar → busqué]
      - id: regulares-table
        type: table
        caption: Verbos regulares comunes
        header: [Infinitivo, yo, tú, él / ella / usted, nosotros, vosotros, ellos / ustedes]
        rows:
          - [usar, usé, usaste, usó, usamos, usasteis, usaron]
          - [mirar, miré, miraste, miró, miramos, mirasteis, miraron]
          - [publicar, publiqué, publicaste, publicó, publicamos, publicasteis, publicaron]
      - id: irregulares-table
        type: table
        caption: Verbos irregulares frecuentes
        header: [Infinitivo, yo, tú, él / ella / usted, nosotros, vosotros, ellos / ustedes]
        rows:
          - [ir / ser, fui, fuiste, fue, fuimos, fuisteis, fueron]
          - [tener, tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron]
          - [hacer, hice, hiciste, hizo, hicimos, hicisteis, hicieron]
          - [decir, dije, dijiste, dijo, dijimos, dijisteis, dijeron]
          - [ver, vi, viste, vio, vimos, visteis, vieron]
      - id: rules-comparaciones
        type: ruleSummary
        skill: Comparaciones
        rules:
          - text: '**más / menos** + adjetivo + **que**'
            examples:
              [
                Instagram fue más popular que Facebook.,
                TikTok fue menos útil que YouTube para estudiar.,
              ]
          - text: '**el / la** + nombre + **más / menos** + adjetivo'
            examples:
              [
                TikTok fue la aplicación más divertida del año.,
                Facebook fue la red menos activa entre mis amigos.,
              ]
          - text: '**tan** + adjetivo + **como** (también se dice **igual de** + adjetivo + **que**)'
            examples:
              [
                YouTube fue tan interesante como Spotify.,
                YouTube fue igual de interesante que Spotify.,
              ]
      - id: rules-preguntas
        type: ruleSummary
        skill: Preguntas en pasado
        rules:
          - text: 'Estructura: palabra interrogativa + verbo en pasado.'
            examples:
              - ¿Qué red social usaste ayer?
              - ¿Qué publicaste la semana pasada?
              - ¿Cuál fue tu publicación más vista?
              - ¿Qué aplicación usaste más el año pasado?
      - id: rules-conectores
        type: ruleSummary
        skill: Conectores temporales
        rules:
          - text: 'Para organizar la narración en pasado:'
            examples:
              - ayer
              - la semana pasada
              - el mes pasado
              - el año pasado
              - hace dos días / hace un año
              - en 2023
          - text: 'Ejemplo en contexto:'
            examples:
              - Ayer usé Instagram, después miré un video en YouTube y al final compartí una foto en Facebook.
      - id: tips
        type: callout
        tone: tip
        title: Consejos para aprender español usando redes sociales
        text: |-
          1. Sigue cuentas en español sobre tus intereses (música, cocina, deportes, memes).
          2. Usa hashtags en español: #aprendeespañol, #recetas, #músicaespañola, #viajes.
          3. Mira stories o videos cortos y repite frases en voz alta.
          4. Escribe comentarios simples en español en videos o publicaciones.
          5. Compara redes sociales en español: *TikTok fue más divertido que YouTube.*
          6. Guarda posts útiles (palabras, expresiones) y revísalos después como vocabulario.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos habilidades con el grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: redes-sociales-pasado-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia cada mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: mori-preguntas
        type: aiTutorPrompt
        title: 'Parte 1: Preguntas personales en pasado'
        message: |-
          ¡Hola Mori! Quiero practicar el pretérito indefinido. Por favor, hazme estas preguntas, una por una:
          1. ¿Qué red social usaste ayer y por qué?
          2. ¿Cuál fue la última foto o video que subiste a tus redes?
          3. ¿Qué música escuchaste en YouTube o Spotify la semana pasada?
          4. ¿Cuál fue la publicación más interesante que viste hace poco?
          5. ¿Qué red social usaste más el año pasado y cuál usaste menos?
          6. ¿Tuviste alguna experiencia divertida o rara en redes sociales?
          Corrige mis errores, por favor.
      - id: mori-comparaciones
        type: aiTutorPrompt
        title: 'Parte 2: Comparaciones'
        message: >-
          ¡Hola Mori! Quiero practicar comparaciones. Pídeme decir una frase que
          compare dos redes sociales que usé en el pasado. Después, compara Instagram y
          Facebook con "más / menos… que" y hazme una pregunta para usar "el / la más"
          con redes sociales. Corrige mis errores, por favor.
      - id: mori-narracion
        type: aiTutorPrompt
        title: 'Parte 3: Narración breve'
        message: >-
          ¡Hola Mori! Pídeme contar en 5 frases qué hice ayer en mis redes sociales.
          Después, corrige mis errores y dame una versión mejor.
      - id: mori-influencer
        type: aiTutorPrompt
        title: 'Parte 4: Extensión creativa'
        message: >-
          ¡Hola Mori! Hazme una entrevista como si yo fuera un influencer famoso.
          Pregúntame qué publiqué el año pasado que fue muy popular, qué hice cuando
          recibí muchos likes y qué fue lo más especial que me pasó en mis redes
          sociales. Corrige mis errores, por favor.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**
          Al final, envía: **Mori, corrige mis errores y dame una frase modelo para mejorar.**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: redes-sociales-pasado-practica
    book: workbook
    title: 'Práctica: Redes sociales (pasado)'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practica las dos habilidades del ciclo. Cada respuesta se corrige al momento, y puedes intentarlo otra vez.
      - id: ex-preterito
        type: activity
        activity: redes-sociales-pasado-preterito
      - id: ex-comparaciones
        type: activity
        activity: redes-sociales-pasado-comparaciones

