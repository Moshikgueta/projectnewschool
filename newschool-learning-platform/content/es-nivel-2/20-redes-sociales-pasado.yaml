vocabulary:
  - slug: redes-sociales-pasado
    title: Redes sociales (pasado)
    items: *redes-pasado-words

activities:
  - slug: redes-sociales-pasado-preterito
    title: 'Pretérito indefinido: usé, vi, publiqué'
    minutes: 8
    items:
      - id: use
        type: multipleChoice
        prompt: Ayer yo ___ WhatsApp para hablar con mi familia.
        options:
          - { text: usé, correct: true }
          - { text: usó, feedback: '*Usó* es para él, ella o usted. Con *yo* decimos *usé*.' }
          - { text: uso, feedback: '*Uso* es presente. Con *ayer* usamos el pasado: *usé*.' }
      - id: abri
        type: fillBlank
        prompt: Completa con el verbo *abrir* en pasado (yo).
        text: El año pasado ___ una cuenta en TikTok.
        blanks: [[abrí, yo abrí]]
      - id: une-irregulares
        type: matching
        prompt: Une cada verbo con su forma en pasado (yo).
        pairs:
          - [publicar, publiqué]
          - [ir, fui]
          - [tener, tuve]
          - [hacer, hice]
          - [decir, dije]
      - id: publique
        type: trueFalse
        prompt: 'En pasado, *publicar* con *yo* se escribe *publiqué* (c → qu).'
        answer: true
        feedback:
          correct: ¡Correcto! *Publiqué*, como *busqué*.
          incorrect: 'Los verbos en *-car* cambian con *yo*: *publicar* → *publiqué*.'
      - id: publicaste
        type: fillBlank
        prompt: Completa con el verbo *publicar* en pasado (tú).
        text: ¿Qué ___ la semana pasada?
        blanks: [[publicaste]]
      - id: fue
        type: multipleChoice
        prompt: Mi publicación más vista el año pasado ___ un video de mi perro.
        options:
          - { text: fue, correct: true }
          - { text: fui, feedback: '*Fui* es para *yo*. *Mi publicación* es ella: *fue*.' }
          - { text: fueron, feedback: '*Fueron* es plural. *Mi publicación* es singular: *fue*.' }
      - id: ordena-ayer
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Ayer usé Instagram y vi videos de cocina.
      - id: conector
        type: multipleChoice
        prompt: ___ subí mi primer video.
        options:
          - { text: Hace un año, correct: true }
          - {
              text: Mañana,
              feedback: '*Mañana* es futuro. *Subí* es pasado: *hace un año, ayer, el año pasado…*',
            }
          - {
              text: El año próximo,
              feedback: '*El año próximo* es futuro. *Subí* es pasado: *el año pasado*.',
            }

  - slug: redes-sociales-pasado-comparaciones
    title: 'Comparaciones en pasado'
    minutes: 8
    items:
      - id: mas-popular
        type: multipleChoice
        prompt: Instagram fue ___ popular que Facebook.
        options:
          - { text: más, correct: true }
          - {
              text: tan,
              feedback: '*Tan* va con *como*: *tan popular como*. Con *que* usamos *más* o *menos*.',
            }
          - {
              text: la más,
              feedback: '*La más* no compara dos cosas con *que*. Decimos *más popular que*.',
            }
      - id: mas-aplicaciones
        type: fillBlank
        prompt: 'Completa con *más* (+) o *menos* (−).'
        text: Tú usaste ___ aplicaciones que yo (+). Las redes fueron ___ seguras que antes (−).
        blanks: [[más], [menos]]
        wordBank: [más, menos]
      - id: superlativo
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: TikTok fue la aplicación más divertida del año., correct: true }
          - {
              text: TikTok fue la más aplicación divertida del año.,
              feedback: 'El orden es *la* + nombre + *más* + adjetivo: *la aplicación más divertida*.',
            }
          - {
              text: TikTok fue la aplicación más divertida que el año.,
              feedback: 'Con *el / la más* usamos *de*: *la más divertida del año*.',
            }
      - id: tan-como
        type: trueFalse
        prompt: 'Para decir que dos cosas son iguales usamos *tan… como*: *YouTube fue tan interesante como Spotify.*'
        answer: true
        feedback:
          correct: ¡Correcto! *Tan* + adjetivo + *como*.
          incorrect: 'Sí: *tan* + adjetivo + *como* dice que dos cosas son iguales.'
      - id: une-comparaciones
        type: matching
        prompt: Une cada expresión con su traducción.
        pairs:
          - [más… que, יותר… מ]
          - [menos… que, פחות… מ]
          - [el / la más, הכי]
          - [el / la menos, הכי פחות]
      - id: menos-que
        type: multipleChoice
        prompt: Yo publiqué menos cosas ___ tú.
        options:
          - { text: que, correct: true }
          - {
              text: de,
              feedback: 'Para comparar dos personas decimos *menos… **que***: *menos cosas que tú*.',
            }
          - { text: como, feedback: '*Como* va con *tan*. Con *menos* usamos *que*.' }
      - id: ordena-tuya
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Mi primera publicación fue más popular que la tuya.
      - id: la-tuya
        type: fillBlank
        prompt: Completa con *el* o *la*.
        text: Tu video fue más divertido que ___ mío. Mi foto fue menos popular que ___ tuya.
        blanks: [[el], [la]]
        wordBank: [el, la]
