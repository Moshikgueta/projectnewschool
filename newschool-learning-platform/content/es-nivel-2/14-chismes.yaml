vocabulary:
  - slug: chismes
    title: Chismes
    items: *chismes-words

activities:
  - slug: chismes-pasado
    title: 'Pretérito indefinido: escuché, hablé, fue'
    minutes: 8
    items:
      - id: ayer-hable
        type: multipleChoice
        prompt: Ayer ___ con mi amigo.
        options:
          - { text: hablé, correct: true }
          - { text: hablo, feedback: '*Hablo* es presente. *Ayer* marca el pasado: *hablé*.' }
          - { text: habló, feedback: '*Habló* es para él o ella. Para *yo*: *hablé*.' }
      - id: escuche
        type: fillBlank
        prompt: Completa con el verbo *escuchar* (yo) en pretérito indefinido.
        text: La semana pasada ___ un chisme sobre mi vecino.
        blanks: [[escuché, yo escuché]]
      - id: une-yo
        type: matching
        prompt: Une cada verbo con su forma para *yo* en pretérito indefinido.
        pairs:
          - [hablar, hablé]
          - [comer, comí]
          - [vivir, viví]
          - [ir, fui]
          - [tener, tuve]
      - id: marcadores
        type: trueFalse
        prompt: '*Ayer, anoche, la semana pasada* y *el año pasado* son marcadores de tiempo del pasado.'
        answer: true
        feedback:
          correct: ¡Correcto! Dejan claro que la acción terminó en el pasado.
          incorrect: 'Son marcadores de pasado: *Ayer escuché un chisme.*'
      - id: conto
        type: fillBlank
        prompt: Completa con el verbo *contar* en pretérito indefinido.
        text: Ayer mi primo me ___ un secreto.
        blanks: [[contó]]
      - id: publico
        type: multipleChoice
        prompt: Anoche mi amigo ___ fotos de sus vacaciones.
        options:
          - { text: publicó, correct: true }
          - {
              text: publiqué,
              feedback: '*Publiqué* es para *yo*. Para *mi amigo* (él): *publicó*.',
            }
          - {
              text: publica,
              feedback: '*Publica* es presente. *Anoche* marca el pasado: *publicó*.',
            }
      - id: dijo
        type: fillBlank
        prompt: Completa con el verbo *decir* en pretérito indefinido.
        text: ¿Qué te ___ tu hermana ayer?
        blanks: [[dijo]]
      - id: ordena-companero
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Escuché que un compañero cambió de trabajo.

  - slug: chismes-comparaciones
    title: 'Comparaciones: más, menos, tan… como'
    minutes: 8
    items:
      - id: mas-que
        type: multipleChoice
        prompt: Ana es ___ chismosa que Pedro.
        options:
          - { text: más, correct: true }
          - {
              text: tan,
              feedback: '*Tan* va con *como*: *tan chismosa como*. Con *que* usa *más* o *menos*.',
            }
          - { text: muy, feedback: '*Muy* no compara. Para comparar con *que*: *más* o *menos*.' }
      - id: tan-como
        type: fillBlank
        prompt: Completa la comparación de igualdad.
        text: Los chismes en la escuela son tan comunes ___ en el trabajo.
        blanks: [[como]]
      - id: peor
        type: multipleChoice
        prompt: Un chisme sobre mi vida personal es ___ un chisme sobre mi trabajo.
        options:
          - { text: peor que, correct: true }
          - { text: más peor que, feedback: '*Peor* ya significa «más malo»: no digas *más peor*.' }
          - { text: peor como, feedback: 'Para comparar con *peor* usamos *que*: *peor que*.' }
      - id: igualdad
        type: trueFalse
        prompt: 'Para la igualdad usamos *tan + adjetivo + que*.'
        answer: false
        feedback:
          correct: '¡Correcto! La igualdad es *tan + adjetivo + como*.'
          incorrect: 'La igualdad es *tan + adjetivo + como*: *tan comunes como*.'
      - id: superlativo
        type: fillBlank
        prompt: Completa el superlativo.
        text: Ese fue el chisme ___ gracioso de todos.
        blanks: [[más]]
      - id: une-tipos
        type: matching
        prompt: Une cada estructura con su tipo de comparación.
        pairs:
          - [más… que, superioridad]
          - [menos… que, inferioridad]
          - [tan… como, igualdad]
          - [el / la más…, superlativo]
      - id: menos
        type: fillBlank
        prompt: 'Completa con *más* o *menos*.'
        text: 'Mi hermano cuenta muchos chismes; yo, pocos. Yo soy ___ chismoso que mi hermano.'
        blanks: [[menos]]
        wordBank: [más, menos]
      - id: ordena-falso
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Un chisme falso es más peligroso que uno verdadero.
