vocabulary:
  - slug: dinero-y-ahorros
    title: Dinero y ahorros
    items: *dinero-y-ahorros-words

activities:
  - slug: dinero-y-ahorros-condicionales
    title: 'Oraciones condicionales: si ahorras, si ganara, si hubiera ahorrado'
    minutes: 8
    items:
      - id: tendras
        type: multipleChoice
        prompt: Si ahorras este mes, ___ dinero extra.
        options:
          - { text: tendrás, correct: true }
          - {
              text: tendrías,
              feedback: 'Con *si* + presente (*ahorras*), el resultado va en futuro: *tendrás*.',
            }
          - {
              text: tuvieras,
              feedback: '*Tuvieras* es imperfecto de subjuntivo; va después de *si*, no en el resultado. Aquí: *tendrás*.',
            }
      - id: ganara
        type: fillBlank
        prompt: Completa con el verbo *ganar* (situación hipotética).
        text: Si ___ la lotería, compraría una casa.
        blanks: [[ganara, ganase, yo ganara, yo ganase]]
      - id: tipos
        type: matching
        prompt: Une cada tipo de situación con su ejemplo.
        pairs:
          - [Hecho general, 'Si ahorras dinero, tienes más seguridad.']
          - [Posibilidad real de futuro, 'Si recibes una prima, la usarás para un viaje.']
          - [Situación hipotética, 'Si ganara la lotería, compraría una casa.']
          - [Situación irreal del pasado, 'Si hubieras ahorrado más, habrías viajado.']
      - id: habrias-comprado
        type: multipleChoice
        prompt: Si hubieras ahorrado más el año pasado, ___ un coche.
        options:
          - { text: habrías comprado, correct: true }
          - {
              text: comprarías,
              feedback: 'Es una situación irreal del pasado: después de *si hubieras…* usamos el condicional compuesto, *habrías comprado*.',
            }
          - {
              text: compraste,
              feedback: '*Compraste* cuenta un hecho real. Para un pasado irreal usamos *habrías comprado*.',
            }
      - id: si-futuro
        type: trueFalse
        prompt: 'Después de *si* nunca usamos el futuro ni el condicional: *Si tendré dinero…* es incorrecto.'
        answer: true
        feedback:
          correct: '¡Correcto! Decimos *Si tengo dinero, viajaré* y *Si tuviera dinero, viajaría*.'
          incorrect: 'Después de *si* no van ni el futuro ni el condicional: *Si tengo dinero…*, *Si tuviera dinero…*'
      - id: hubiera-empezado
        type: fillBlank
        prompt: Completa con el verbo *empezar* (situación irreal del pasado).
        text: Si ___ a ahorrar cuando era más joven, ahora tendría más dinero.
        blanks: [[hubiera empezado, hubiese empezado, yo hubiera empezado, yo hubiese empezado]]
      - id: gastas
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: 'Si gastas más de lo que ganas, tienes problemas.', correct: true }
          - {
              text: 'Si gastarás más de lo que ganas, tienes problemas.',
              feedback: 'Después de *si* no usamos el futuro: *Si gastas…*',
            }
          - {
              text: 'Si gastarías más de lo que ganas, tienes problemas.',
              feedback: 'Después de *si* no usamos el condicional: *Si gastas…*',
            }
      - id: ordena-ahorras
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Si ahorras primero, gastarás menos.

  - slug: dinero-y-ahorros-pasiva
    title: 'Voz pasiva: se ahorra, es ahorrado'
    minutes: 8
    items:
      - id: se-desperdicia
        type: multipleChoice
        prompt: En muchas casas ___ mucha energía.
        options:
          - { text: se desperdicia, correct: true }
          - {
              text: se desperdician,
              feedback: '*Energía* es singular, así que el verbo va en singular: *se desperdicia*.',
            }
          - {
              text: desperdicia se,
              feedback: '*Se* va antes del verbo conjugado: *se desperdicia*.',
            }
      - id: se-apagan
        type: fillBlank
        prompt: Completa con la pasiva con *se* del verbo *apagar*.
        text: En mi casa ___ ___ las luces por la noche.
        blanks: [[se], [apagan]]
      - id: aprobado
        type: multipleChoice
        prompt: El proyecto fue ___ por el comité.
        options:
          - { text: aprobado, correct: true }
          - {
              text: aprobada,
              feedback: 'En la pasiva con *ser*, el participio concuerda con el sujeto: *el proyecto* es masculino, *aprobado*.',
            }
          - { text: aprobar, feedback: 'Después de *ser* (*fue*) va el participio: *aprobado*.' }
      - id: concordancia
        type: trueFalse
        prompt: 'En la pasiva con *ser*, el participio concuerda con el sujeto: *La energía es ahorrada. Los gastos son reducidos.*'
        answer: true
        feedback:
          correct: '¡Correcto! *La energía* → *ahorrada*; *los gastos* → *reducidos*.'
          incorrect: 'Sí concuerda: *la energía es ahorrada*, *los gastos son reducidos*.'
      - id: activa-pasiva
        type: matching
        prompt: Une cada oración activa con su forma en pasiva con *se*.
        pairs:
          - [Ahorramos agua., Se ahorra agua.]
          - [Reutilizamos las cosas viejas., Se reutilizan las cosas viejas.]
          - [Desperdiciamos comida., Se desperdicia comida.]
          - [Reducimos los gastos., Se reducen los gastos.]
      - id: se-puede
        type: fillBlank
        prompt: Completa con el verbo *poder* en presente.
        text: Se ___ ahorrar dinero si se cocina en casa.
        blanks: [[puede]]
      - id: cual-pasiva
        type: multipleChoice
        prompt: ¿Qué oración está en voz pasiva?
        options:
          - { text: Las cuentas son revisadas por el banco., correct: true }
          - {
              text: El banco revisa las cuentas.,
              feedback: 'Esta oración es activa: el sujeto (*el banco*) hace la acción. En pasiva: *Las cuentas son revisadas por el banco.*',
            }
          - {
              text: El banco ha revisado las cuentas.,
              feedback: 'Esta oración es activa (pretérito perfecto). En pasiva: *Las cuentas son revisadas por el banco.*',
            }
      - id: ordena-dinero
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Se desperdicia mucho dinero.
