# Cycle "Dinero y ahorros", converted from the Spanish level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-3
slug: dinero-y-ahorros
title: Dinero y ahorros
goal: Hablar de dinero con oraciones condicionales y con la voz pasiva.
position: 2
status: in_review

review:
  - >-
    The two workbook exercises ("Oraciones condicionales" and "Voz pasiva") are NEW:
    the notebook has no self-study exercises. They were written from the cycle's two
    skills, its summary rules, the activity examples and its vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    Summary, conditionals (rules translated from English): "Si + presente, futuro
    (will/va a)" → "Si + presente, futuro (tendrás) o ir a + infinitivo"; "Si +
    pasado, condicional simple (would)" → "Si + imperfecto de subjuntivo (ganara /
    ganase), condicional (compraría)"; "Si + pluscuamperfecto, condicional perfecto
    (would have)" → "Si + pluscuamperfecto de subjuntivo (hubiera / hubiese
    ahorrado), condicional compuesto (habría viajado)". A rule was added that after
    "si" we never use the future or the conditional (*si tendré, si tendría). The
    labels "Cero / Primer / Segundo / Tercer condicional" (an English-style
    numbering; "Cero condicional" is not Spanish) are renamed "Condicional tipo 0, 1,
    2, 3" everywhere. Please confirm.
  - >-
    Summary, passive voice: the source teaches only "ser + participio" and "modal +
    ser + participio" (an English pattern: "can be saved"). In Spanish this passive is
    formal and mostly written; the everyday form is the "pasiva refleja" with "se"
    (se ahorra agua, se reducen los gastos, se puede ahorrar energía), which the
    source itself uses in its activities. The summary now teaches both, with
    agreement rules and a table; "modales" → "deber / poder + infinitivo". Unnatural
    calques were changed: "Más dinero debería ser ahorrado cada mes" → "Se debería
    ahorrar más dinero cada mes"; "La energía puede ser reducida en casa" → "El
    consumo de energía puede ser reducido en casa" (shown with its se-form). Please
    confirm.
  - >-
    Activity 4 examples were calques of the English passive: "El agua puede ser
    ahorrada si se cierran los grifos" → "Se puede ahorrar agua si se cierran los
    grifos"; "Menos energía puede ser usada si se apagan las luces" → "Se usa menos
    energía si se apagan las luces"; "Más dinero puede ser ahorrado al cocinar en
    casa" → "Se puede ahorrar más dinero si se cocina en casa". The ser-passive is
    still mentioned in the teacher note.
  - >-
    Activity 2 corrections: "Se te da un gran bono en el trabajo" → "Te dan un gran
    bono en el trabajo"; "A un amigo le fue robado el dinero de su cuenta bancaria"
    (calque of an English passive with an indirect object) → "El dinero de la cuenta
    bancaria de un amigo fue robado"; "Hoy en día no se ahorra suficiente dinero
    entre los jóvenes" → "Hoy en día los jóvenes no ahorran suficiente dinero".
  - >-
    Other corrections: warm-up 6 "Si te dieran un millón de dólares, ¿cómo se
    gastaría?" → "¿cómo lo gastarías?"; Activity 1 "qué cuestiones tratará" → "qué
    preguntas"; Activity 3 tip 1 "Si pudieras ahorrar la mitad de tu salario, ¿qué
    harías con él?" → "con ese dinero"; tip 4 "snacks" (English) → "tentempiés",
    "un refrigerio allá" → "un tentempié allá", Tipo 3 "¿qué cosa más grande podrías
    haber comprado?" → "habrías podido comprar"; biography "A partir de esa
    experiencia y mi formación" → "y de mi formación"; Activity 4 group question
    "¿Qué cosas se hacen en tu casa para que se ahorre dinero?" → "para ahorrar
    dinero?";
    Mori "Si yo fuera rico…." → "Si yo fuera rico…"; Mori example "mucho dinero es
    desperdiciado en entretenimiento" → "se desperdicia mucho dinero en
    entretenimiento"; "Se dice que más dinero debería ser invertido en educación" →
    "Se dice que se debería invertir más dinero en educación"; stray characters ("ð¹",
    "ð©", "&#10;") removed.
  - >-
    Activity 3 is a reading text ("5 consejos para ahorrar dinero — Por Daniel
    Roberts, asesor financiero", with a short biography). It is kept as a reading
    with the five tips (each tip text shown before its questions; the level-based
    "Tipo 0/1/2/3" labels replace "Cero/Primero/Segundo/Tercero"). The source starts at "Etapa 2" (no Etapa
    1): Etapa 1 is taken to be reading the text. Please check whether the text and
    author can be used (the source does not say where it comes from). The
    first-person biography looked copied from a real advisor's website, so it was
    replaced with a one-line neutral description; only the name and the short
    quote are kept.
  - >-
    Vocabulary: "Acciones, פעולות" → "Acciones, פעולות / מניות" (in a money context
    "acciones" are shares); "Ahorros, חיסכון" → "חסכונות"; "Voz pasiva, סביל" → "Voz
    pasiva, משפט סביל". Please confirm.
  - >-
    The source gives no activity times and no plan for combining activities. The
    Quizlet link is kept without its "?new" parameter. The "Respuesta del estudiante
    1/2/3" lines are replaced by the answer boxes. Warm-up sentence frames were added
    (the source has none).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: dinero-y-ahorros-clase
    title: 'Clase: Dinero y ahorros'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Dinero y ahorros
      - id: skills
        type: cycleOverview
        skills:
          - name: Oraciones condicionales
            description: '*Si ahorras, tienes / tendrás… · Si ganara, compraría… · Si hubiera ahorrado, habría…*'
          - name: Voz pasiva
            description: '*Se ahorra agua. Se pueden reducir los gastos. El proyecto fue aprobado.*'
      - id: quizlet
        type: externalLink
        label: Dinero y ahorros en Quizlet
        url: https://quizlet.com/br/1072903874/dinero-y-ahorros-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___. Creo que la salud financiera es importante porque ___.
        example: Soy Marta. Creo que la salud financiera es importante porque nos da tranquilidad.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup
        type: discussionQuestions
        items:
          - question: ¿Cuánto dinero piensas que deberían ahorrar los jóvenes cada mes?
            frame: Pienso que los jóvenes deberían ahorrar ___ cada mes porque ___.
          - question: ¿Crees que en las escuelas se enseña a ahorrar dinero de forma adecuada o debería enseñarse más?
            frame: Creo que en las escuelas se enseña ___. Debería enseñarse ___.
          - question: ¿Qué harías si tu salario se redujera un 20 %?
            frame: Si mi salario se redujera un 20 %, ___.
          - question: ¿Qué piensas que debería hacerse si alguien pierde sus ahorros por un error del banco?
            frame: Pienso que debería ___.
          - question: ¿Cómo pueden aprender hoy en día los adolescentes buenos hábitos de ahorro?
            frame: Pueden aprender ___.
          - question: Si te dieran un millón de dólares, ¿cómo lo gastarías?
            frame: Si me dieran un millón de dólares, ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Hablemos de condicionales'
        skills: [Oraciones condicionales]
        steps:
          - Trabajen en parejas.
          - Discutan y respondan 4 de estas preguntas. El profesor elige qué preguntas, según el nivel del grupo.
          - Compartan sus respuestas con toda la clase.
        example: '*Si ganaras 10.000 dólares mañana, ¿qué harías con ellos?* → *Si ganara 10.000 dólares, ahorraría la mitad y haría un viaje.*'
      - id: act1-cero-title
        type: heading
        level: 4
        text: Condicional tipo 0 (hechos generales)
      - id: act1-cero
        type: discussionQuestions
        items:
          - question: Si ahorras dinero cada mes, ¿qué pasa?
            frame: Si ahorras dinero cada mes, ___.
          - question: Si la gente no planifica sus gastos, ¿qué ocurre normalmente?
            frame: Si la gente no planifica sus gastos, ___.
          - question: Si alguien gasta más de lo que gana, ¿qué problemas tiene?
            frame: Si alguien gasta más de lo que gana, ___.
          - question: Si siempre compras lo más barato, ¿cómo afecta a tu estilo de vida?
            frame: Si siempre compras lo más barato, ___.
      - id: act1-primero-title
        type: heading
        level: 4
        text: Condicional tipo 1 (posibilidades reales de futuro)
      - id: act1-primero
        type: discussionQuestions
        items:
          - question: Si recibes una prima este año, ¿cómo la usarás?
            frame: Si recibo una prima este año, la usaré para ___.
          - question: Si encuentras un piso más barato, ¿en qué gastarás el dinero extra?
            frame: Si encuentro un piso más barato, gastaré el dinero extra en ___.
          - question: Si abres una cuenta de ahorros el mes que viene, ¿cuánto ahorrarás?
            frame: Si abro una cuenta de ahorros, ahorraré ___.
          - question: Si tus gastos suben el próximo año, ¿qué recortarás primero?
            frame: Si mis gastos suben, primero recortaré ___.
      - id: act1-segundo-title
        type: heading
        level: 4
        text: Condicional tipo 2 (situaciones irreales o hipotéticas)
      - id: act1-segundo
        type: discussionQuestions
        items:
          - question: Si ganaras 10.000 dólares mañana, ¿qué harías con ellos?
            frame: Si ganara 10.000 dólares, ___.
          - question: Si pudieras vivir en cualquier sitio por menos dinero, ¿dónde vivirías?
            frame: Si pudiera vivir en cualquier sitio, viviría en ___.
          - question: Si tuvieras que ahorrar el 50 % de tu salario, ¿qué dejarías de comprar?
            frame: Si tuviera que ahorrar el 50 % de mi salario, dejaría de comprar ___.
          - question: Si pudieras cambiar una cosa sobre cómo ahorra la gente, ¿qué cambiarías?
            frame: Si pudiera, cambiaría ___.
      - id: act1-tercero-title
        type: heading
        level: 4
        text: Condicional tipo 3 (situaciones irreales del pasado)
      - id: act1-tercero
        type: discussionQuestions
        items:
          - question: Si hubieras ahorrado más dinero el año pasado, ¿qué habrías hecho con él?
            frame: Si hubiera ahorrado más dinero, habría ___.
          - question: Si hubieras sabido más de dinero a los 18 años, ¿qué habrías hecho de otra manera?
            frame: Si hubiera sabido más de dinero a los 18 años, habría ___.
          - question: Si hubieras gastado menos en ropa cuando eras joven, ¿cuánto habrías ahorrado?
            frame: Si hubiera gastado menos en ropa, habría ahorrado ___.
          - question: Si hubieras pedido consejo antes, ¿habrías evitado algún error financiero?
            frame: Si hubiera pedido consejo antes, ___.
      - id: act2
        type: classActivity
        title: 'Actividad 2: ¿Qué se debe hacer?'
        skills: [Voz pasiva]
        steps:
          - El profesor presenta una situación.
          - Los estudiantes responden con la voz pasiva, sobre todo con *se* (*se debería…, se podría…, debería hacerse…*).
        example: '*Te dan un gran bono en el trabajo. ¿Qué debería hacerse con él?* → *Una parte se debería ahorrar y otra parte se podría invertir.*'
      - id: act2-scenarios
        type: discussionQuestions
        title: Situaciones
        items:
          - question: Te dan un gran bono en el trabajo. ¿Qué debería hacerse con él?
            frame: Con el bono se debería ___.
          - question: El dinero de la cuenta bancaria de un amigo fue robado. ¿Qué debería hacerse?
            frame: Se debería ___.
          - question: Se gasta demasiado dinero en cosas innecesarias. ¿Qué podría hacerse para cambiarlo?
            frame: Se podría ___.
          - question: Hoy en día los jóvenes no ahorran suficiente dinero. ¿Qué debería hacerse para ayudarlos?
            frame: Se debería ___.
          - question: Se piensa que debería darse más educación financiera en las escuelas. ¿Estás de acuerdo?
            frame: Estoy de acuerdo / No estoy de acuerdo porque ___.
          - question: Tu ciudad pide ideas sobre cómo debería gastarse el dinero público. ¿Qué propones?
            frame: Propongo que el dinero se gaste en ___.
      - id: act3
        type: classActivity
        title: 'Actividad 3: Consejos de dinero'
        skills: [Oraciones condicionales]
        steps:
          - Lean el texto *5 consejos para ahorrar dinero*.
          - Trabajen en parejas. Cada pareja recibe un consejo y responde a sus preguntas.
          - Después, cada pareja cuenta su consejo y sus respuestas a la clase.
      - id: act3-levels
        type: callout
        tone: info
        title: Según el nivel
        text: |-
          **Si todavía no han estudiado todos los condicionales:** usen solo los tipos 0 y 1.
          **Si ya los conocen:** practiquen también los tipos 2 y 3.
      - id: act3-reading
        type: callout
        tone: culture
        title: 5 consejos para ahorrar dinero (Daniel Roberts, asesor financiero)
        text: |-
          *«Ahorrar dinero no significa dejar de disfrutar de la vida; significa cuidar de tu futuro mientras disfrutas del presente.»*
          Un asesor financiero que ayuda a las personas a ahorrar, invertir y planificar su futuro.
      - id: tip1-text
        type: text
        text: '**1. Págate a ti mismo primero.** *Cuando recibas dinero, guarda una parte antes de gastarlo. Incluso una cantidad pequeña ayuda. Si ahorras primero, evitarás gastarlo sin darte cuenta.*'
      - id: tip1
        type: discussionQuestions
        title: 'Preguntas sobre el consejo 1'
        items:
          - question: 'Tipo 0: ¿Qué pasa si primero ahorras una parte de tu dinero?'
          - question: 'Tipo 1: Si empiezas a ahorrar este mes, ¿cómo te ayudará?'
          - question: 'Tipo 2: Si pudieras ahorrar la mitad de tu salario, ¿qué harías con ese dinero?'
          - question: 'Tipo 3: Si siempre hubieras ahorrado el dinero primero, ¿cómo serían hoy tus finanzas?'
      - id: tip2-text
        type: text
        text: '**2. Sabe adónde va tu dinero.** *Apunta en qué gastas tu dinero durante una semana. Verás pequeños detalles que puedes cambiar. Muchas personas malgastan dinero porque no prestan atención a esos detalles.*'
      - id: tip2
        type: discussionQuestions
        title: 'Preguntas sobre el consejo 2'
        items:
          - question: 'Tipo 0: Si anotas tus gastos, ¿qué observas?'
          - question: 'Tipo 1: Si haces un seguimiento de tus gastos esta semana, ¿qué aprenderás?'
          - question: 'Tipo 2: Si pudieras ver todos tus gastos en un solo lugar, ¿cómo te sentirías?'
          - question: 'Tipo 3: Si hubieras controlado mejor tu dinero el año pasado, ¿qué habrías cambiado?'
      - id: tip3-text
        type: text
        text: '**3. Fija una meta.** *Es más fácil ahorrar cuando tienes un objetivo, como un viaje, un portátil o estudios futuros. Cuando hay una meta, ahorrar se convierte en un plan y no en un sacrificio.*'
      - id: tip3
        type: discussionQuestions
        title: 'Preguntas sobre el consejo 3'
        items:
          - question: 'Tipo 0: Si tienes un objetivo, ¿ahorras dinero más fácilmente?'
          - question: 'Tipo 1: Si te pones una meta de ahorro este mes, ¿cuánto ahorrarás?'
          - question: 'Tipo 2: Si pudieras elegir cualquier meta de ahorro hoy, ¿cuál sería?'
          - question: 'Tipo 3: Si el año pasado te hubieras puesto una meta clara, ¿qué habrías hecho con el dinero?'
      - id: tip4-text
        type: text
        text: '**4. Gasta menos en cosas pequeñas.** *Un café aquí, un tentempié allá… todo suma. Compra menos cosas pequeñas y guarda ese dinero. Te sorprenderá cuánto puedes ahorrar.*'
      - id: tip4
        type: discussionQuestions
        title: 'Preguntas sobre el consejo 4'
        items:
          - question: 'Tipo 0: Si compras menos cosas pequeñas, ¿qué pasa con tus ahorros?'
          - question: 'Tipo 1: Si dejas de comprar tentempiés todos los días, ¿cuánto ahorrarás este mes?'
          - question: 'Tipo 2: Si pudieras evitar comprar una cosa cada día, ¿cómo te sentirías?'
          - question: 'Tipo 3: Si el año pasado hubieras gastado menos en tentempiés, ¿qué cosa más grande habrías podido comprar?'
      - id: tip5-text
        type: text
        text: '**5. Empieza ahora, no después.** *Mucha gente espera «tener más dinero» para empezar a ahorrar. Pero ahorrar es un hábito: comienza hoy, aunque sea con poco, y estarás creando un buen hábito para el futuro.*'
      - id: tip5
        type: discussionQuestions
        title: 'Preguntas sobre el consejo 5'
        items:
          - question: 'Tipo 0: Si esperas demasiado para ahorrar, ¿qué pasa?'
          - question: 'Tipo 1: Si ahorras tu dinero hoy, ¿qué harás con él en el futuro?'
          - question: 'Tipo 2: Si pudieras darte un consejo sobre el ahorro, ¿qué te dirías?'
          - question: 'Tipo 3: Si hubieras empezado a ahorrar cuando eras más joven, ¿cómo sería tu vida ahora?'
      - id: act4
        type: classActivity
        title: 'Actividad 4: ¿Cómo ahorrar dinero?'
        skills: [Voz pasiva]
        steps:
          - 'Explicación del profesor: hoy hablamos de cómo el dinero **se ahorra** o **se desperdicia** en la vida diaria, con la voz pasiva.'
          - 'Discusión en grupo: respondan juntos a las tres preguntas de abajo.'
          - 'Trabajo en parejas: cada pareja recibe una frase y escribe una posible solución con la voz pasiva.'
        example: |-
          *Se puede ahorrar agua si se cierran los grifos.*
          *Se usa menos energía si se apagan las luces.*
          *Se puede ahorrar más dinero si se cocina en casa.*
      - id: act4-group
        type: discussionQuestions
        title: Discusión en grupo
        items:
          - question: ¿Dónde crees que se desperdicia más dinero?
            frame: Creo que se desperdicia más dinero en ___.
          - question: ¿Qué cosa pequeña podría cambiarse para ahorrar dinero?
            frame: Podría cambiarse ___.
          - question: ¿Qué cosas se hacen en tu casa para ahorrar dinero?
            frame: En mi casa se ___.
      - id: act4-pairs
        type: discussionQuestions
        title: Trabajo en parejas
        items:
          - question: Habla de cómo puede ahorrarse agua en casa.
            frame: Se puede ahorrar agua si ___.
          - question: Habla de cómo puede reducirse el desperdicio de comida.
          - question: Habla de cómo se desperdicia energía en la vida diaria.
          - question: Habla de cómo pueden ahorrarse los costes de transporte.
          - question: Habla de cómo pueden cambiarse los hábitos de consumo.
          - question: Habla de cómo se desperdicia dinero en el entretenimiento.
          - question: Habla de cómo puede ahorrarse dinero al viajar.
          - question: Habla de cómo pueden reutilizarse las cosas viejas en lugar de tirarlas.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Oraciones condicionales** (Actividades 1 y 3)
          y **Voz pasiva** (Actividades 2 y 4). El cuaderno no indica tiempos ni cómo
          combinar las actividades.
      - id: n-intro
        anchor: intro
        text: Da tu propio ejemplo primero y después pregunta a cada estudiante.
      - id: n-warmup
        anchor: warmup-title
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act1
        anchor: act1
        text: >-
          Elige según el nivel del grupo qué tipos de condicional van a practicar (por
          ejemplo, solo tipos 0 y 1 con un grupo que todavía no ha visto el subjuntivo).
          Las parejas responden 4 preguntas y después las comparten con toda la clase.
      - id: n-act2
        anchor: act2
        text: >-
          Presenta cada situación en voz alta. Acepta la pasiva con *se* (*se debería
          ahorrar*) y la pasiva con *ser* (*debería ser ahorrado*), pero recuerda que en
          la conversación la forma con *se* es mucho más natural.
      - id: n-act3
        anchor: act3
        text: >-
          Etapa 1: lectura del texto (el cuaderno empieza en la Etapa 2). Da a cada
          pareja uno de los cinco consejos. Según el nivel, usan solo los tipos 0 y 1, o
          los cuatro tipos.
      - id: n-act4
        anchor: act4
        text: >-
          Explica los ejemplos con *se* y muestra también la pasiva con *ser* (*El agua
          puede ser ahorrada*), que es correcta pero más formal. En la Etapa 3, da una
          frase a cada pareja.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: dinero-y-ahorros-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-condicionales
        type: ruleSummary
        skill: Oraciones condicionales
        rules:
          - text: 'Hablan de situaciones **reales o irreales** y de sus resultados. Estructura: oración con **si** (condición) + oración principal (resultado).'
          - text: '**Tipo 0, hechos generales:** si + presente, presente.'
            examples: ['Si ahorras dinero, tienes más seguridad.']
          - text: '**Tipo 1, posibilidades reales de futuro:** si + presente, futuro (o *ir a* + infinitivo).'
            examples:
              ['Si ahorras este mes, tendrás dinero extra.', 'Si recibo una prima, voy a viajar.']
          - text: '**Tipo 2, situaciones irreales o hipotéticas (presente / futuro):** si + imperfecto de subjuntivo, condicional simple.'
            examples: ['Si ganara la lotería, compraría una casa.']
          - text: '**Tipo 3, situaciones irreales del pasado:** si + pluscuamperfecto de subjuntivo, condicional compuesto (*habría* + participio).'
            examples: ['Si hubieras ahorrado más, habrías viajado el año pasado.']
          - text: 'Después de **si** nunca usamos el futuro ni el condicional.'
            examples:
              [
                'Si tengo dinero, viajaré. (no *Si tendré dinero*)',
                'Si tuviera dinero, viajaría. (no *Si tendría dinero*)',
              ]
      - id: condicionales-table
        type: table
        caption: Las oraciones condicionales
        header: [Tipo, Condición (si…), Resultado, Ejemplo]
        rows:
          - ['0', presente, presente, 'Si ahorras, tienes más seguridad.']
          - ['1', presente, futuro / ir a + infinitivo, 'Si ahorras, tendrás dinero extra.']
          - [
              '2',
              imperfecto de subjuntivo,
              condicional simple,
              'Si ganara la lotería, compraría una casa.',
            ]
          - [
              '3',
              pluscuamperfecto de subjuntivo,
              condicional compuesto,
              'Si hubiera ahorrado, habría viajado.',
            ]
      - id: subjuntivo-table
        type: table
        caption: Formas para los tipos 2 y 3
        header:
          [Persona, 'ganar (si…)', 'comprar (resultado)', 'ahorrar (si…)', 'viajar (resultado)']
        rows:
          - [yo, ganara / ganase, compraría, hubiera ahorrado, habría viajado]
          - [tú, ganaras / ganases, comprarías, hubieras ahorrado, habrías viajado]
          - [él / ella / usted, ganara / ganase, compraría, hubiera ahorrado, habría viajado]
          - [
              nosotros / nosotras,
              ganáramos / ganásemos,
              compraríamos,
              hubiéramos ahorrado,
              habríamos viajado,
            ]
          - [
              ellos / ellas / ustedes,
              ganaran / ganasen,
              comprarían,
              hubieran ahorrado,
              habrían viajado,
            ]
      - id: rules-pasiva
        type: ruleSummary
        skill: Voz pasiva
        rules:
          - text: 'Usamos la voz pasiva cuando lo importante es la **acción** y no la persona que la hace.'
          - text: '**Pasiva con se** (la más común al hablar): **se** + verbo en 3.ª persona. El verbo concuerda con la cosa: singular o plural.'
            examples:
              [
                Se ahorra agua.,
                Se reducen los gastos.,
                Se desperdicia mucho dinero en entretenimiento.,
              ]
          - text: 'Con **deber** y **poder**: **se** + debe / puede + infinitivo. También: *debería hacerse, puede ahorrarse*.'
            examples:
              [
                Se debería ahorrar más dinero cada mes.,
                Se puede ahorrar energía apagando las luces.,
                ¿Qué podría hacerse para cambiarlo?,
              ]
          - text: '**Pasiva con ser** (más formal, sobre todo escrita): **ser** + participio. El participio concuerda con el sujeto. La persona que hace la acción (el agente) se puede omitir o añadir con **por**.'
            examples:
              [
                El dinero es ahorrado por muchas familias.,
                El consumo de energía puede ser reducido en casa.,
                El reciclaje debe ser promovido en las escuelas.,
              ]
          - text: 'Usos comunes: hablar de **normas, hábitos o políticas**, y **dar soluciones sin nombrar al responsable**.'
            examples:
              [
                Se debe promover el reciclaje en las escuelas.,
                Se puede ahorrar energía apagando las luces.,
              ]
      - id: pasiva-table
        type: table
        caption: Activa y pasiva
        header: [Activa, Pasiva con se, Pasiva con ser]
        rows:
          - [
              Muchas familias ahorran dinero.,
              Se ahorra dinero.,
              El dinero es ahorrado por muchas familias.,
            ]
          - [
              El comité aprobó el proyecto.,
              Se aprobó el proyecto.,
              El proyecto fue aprobado por el comité.,
            ]
          - [
              Reutilizamos las cosas viejas.,
              Se reutilizan las cosas viejas.,
              Las cosas viejas son reutilizadas.,
            ]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: >-
          Repasa las dos habilidades con el grupo y pide un ejemplo nuevo sobre dinero
          para cada tipo de condicional y para cada forma de la pasiva.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: dinero-y-ahorros-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia un mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: mori-main
        type: aiTutorPrompt
        title: Mensaje principal
        message: >-
          ¡Hola Mori! Quiero practicar sobre dinero y ahorros. Hazme preguntas usando la
          voz pasiva y las oraciones condicionales. Por favor, corrige mis errores.
      - id: mori-reportero
        type: aiTutorPrompt
        title: 'Actividad 1: Reportero de noticias (voz pasiva)'
        intro: |-
          Ejemplo de inicio (Mori): *Se ha descubierto que se desperdicia mucho dinero en entretenimiento.*
          Ejemplo de respuesta (tú): *Se dice que se debería invertir más dinero en educación. Se piensa que el ahorro puede ser promovido por campañas escolares.*
        message: >-
          Vamos a jugar al Reportero de Noticias de Dinero. Tú empiezas una breve noticia
          sobre dinero usando la voz pasiva, y yo la continúo con dos o tres frases más,
          también en pasiva. Por favor, corrige mis errores.
      - id: mori-rico
        type: aiTutorPrompt
        title: 'Actividad 2: Si yo fuera rico… (condicionales)'
        intro: |-
          Ejemplos de preguntas (Mori): *¿Qué pasaría si ganaras un millón de dólares mañana?* (tipo 2) · *¿Qué habrías hecho si hubieras ahorrado más el año pasado?* (tipo 3) · *¿Qué harás si tu banco te da un bono especial este mes?* (tipo 1) · *¿Qué ocurre si ahorras siempre el 10 % de tu sueldo?* (tipo 0)
          Ejemplos de respuestas (tú): *Si ganara un millón, viajaría por el mundo. Si hubiera ahorrado más, habría comprado un coche.*
        message: >-
          Hagamos un juego: «Si yo fuera rico…». Hazme preguntas divertidas con «si…»
          para que yo pueda responder con los distintos condicionales (tipo 0, 1, 2 o 3).
          Por favor, corrige mis errores.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**

