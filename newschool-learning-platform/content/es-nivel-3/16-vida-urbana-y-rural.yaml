# Cycle "Vida urbana vs. vida rural", converted from the Spanish level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-3
slug: vida-urbana-y-rural
title: Vida urbana vs. vida rural
goal: Usar oraciones de relativo y expresar opiniones justificadas sobre la vida en la ciudad y en el campo.
position: 16
status: in_review

review:
  - >-
    The two workbook exercises ("Oraciones de relativo" and "Expresar opiniones") are
    NEW: the notebook has no self-study exercises. They were written from the cycle's
    two skills, its summary rules, the activity examples and its vocabulary. Please
    check level, wording and every right answer before students see them.
  - >-
    Summary, wrong rule: the notebook gives "Las personas quienes viven en el campo
    tienen un estilo de vida diferente" as a correct example of quien / quienes. In
    Spanish, quien(es) cannot start a specifying (no-comma) relative clause directly
    after a noun: it is "Las personas que viven en el campo…". The rule is rewritten:
    quien(es) is used in explanatory clauses with commas (El vecino, quien vive aquí…),
    after a preposition (la persona con quien hablé) or with no antecedent (Quienes
    viven en el campo…). The workbook tests this. Please confirm.
  - >-
    Summary additions: el cual / la cual is also explained as common after a
    preposition (el barrio en el cual vivo); a table of the relative pronouns was
    added; a new rule explains indicative vs. subjunctive in relative clauses (Vivo en
    una ciudad que tiene… / Prefiero una ciudad que tenga…), because the notebook's
    own examples use both without explaining it; a rule "No creo que + subjuntivo"
    and a table of haber (pretérito perfecto) were added. Please confirm.
  - >-
    Corrections: intro frame "Mi hogar está en un entorno urbano/rural. Porque ___."
    (sentence fragment) → "…urbano / rural porque ___."; story "sintió curiosidad y
    decidió visitarlo" (the city mouse had come to visit him, so "lo" was wrong) →
    "decidió ir con él a la ciudad"; Activity 1 step 1 "Se ha entregado un folleto…
    en su barrio" → "Lee el folleto… en tu barrio"; "Nivel: 3 (Avanzado)" left out
    (the course is B1).
  - >-
    Left out: the gamma.app slide-deck link (not an allowed host; mentioned in the
    teacher plan note). The source has no flyer for Activity 1, no video or image
    links for Activity 2 and no images for Activity 3 step 4: the teacher notes say
    to prepare them. The "Respuesta del estudiante 1/2/3" lines are replaced by the
    answer boxes. The "Objetivo final de la actividad" list of Activity 4 is in the
    teacher note.
  - >-
    Warm-up: the notebook gives a full model answer for 7 of the 8 questions. They are
    shortened into sentence frames (with blanks) for students; the full models are in
    a teacher note. Question 8 had no example; a frame was added. Activity question
    frames were also added (the source has none).
  - >-
    Quizlet link: the "?new" parameter was removed. Vocabulary glosses kept as in the
    source; "Creo que / Pienso que" glossed "אני חושב/ת ש" (both genders). No times are
    given in the source, so no minutes are recorded.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: vida-urbana-y-rural-clase
    title: 'Clase: Vida urbana vs. vida rural'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Vida urbana vs. vida rural
      - id: skills
        type: cycleOverview
        skills:
          - name: Oraciones de relativo
            description: '*que, quien / quienes, donde, el cual / la cual / los cuales / las cuales, cuyo / cuya*'
          - name: Expresar opiniones y justificarlas
            description: '*Creo que…, En mi opinión…, Desde mi punto de vista…* + *porque, ya que, aunque, sin embargo, además*'
      - id: quizlet
        type: externalLink
        label: Vida urbana vs. vida rural en Quizlet
        url: https://quizlet.com/br/1172786651/vida-urbana-vs-vida-rural-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___. Mi hogar está en un entorno urbano / rural porque ___.
        example: Soy Dana. Mi hogar está en un entorno urbano porque vivo en el centro de una ciudad grande.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup-rules
        type: callout
        tone: info
        title: Al responder
        text: |-
          Usa oraciones completas.
          Usa el pretérito perfecto (*he vivido, he visitado*).
          Usa oraciones de relativo (*que, donde, quien*).
          Justifica tus opiniones (*porque, ya que, aunque*).
      - id: warmup
        type: discussionQuestions
        items:
          - question: ¿Preferirías vivir en una ciudad o en un lugar rural que ofrezca una mejor calidad de vida para ti personalmente?
            frame: Preferiría vivir en ___ que tenga ___, porque me gusta vivir en un lugar donde ___.
          - question: Describe un barrio donde hayas vivido o que hayas visitado. ¿Qué tenía ese lugar que mejoraba tu calidad de vida?
            frame: He vivido en un barrio que tenía ___. Era un lugar donde ___.
          - question: Describe tu situación actual de vivienda. ¿Hay algo que quisieras cambiar? ¿Por qué?
            frame: Vivo en ___ que está ___. Me gustaría mudarme a un lugar que tenga ___, porque ___.
          - question: ¿Alguna vez te has mudado a otra ciudad o a otro barrio? ¿Cómo ha cambiado tu calidad de vida?
            frame: Me he mudado a ___ que tiene ___, lo cual ha mejorado mi calidad de vida porque ___.
          - question: Si pudieras elegir cualquier lugar donde vivir en el futuro, ¿qué tipo de lugar elegirías y por qué?
            frame: Me gustaría vivir en ___ que tenga ___, donde pueda ___.
          - question: ¿Qué tipo de comunidad prefieres y por qué?
            frame: Prefiero vivir en una comunidad que ___, porque me gusta vivir en un lugar donde ___.
          - question: ¿Hay naturaleza urbana en tu ciudad? ¿Has tenido tiempo para disfrutarla?
            frame: Sí, hay ___ que está cerca de mi casa, donde ___. He ido ___.
          - question: ¿Crees que los proyectos de renovación urbana, que incluyen demolición y construcción, son una buena solución? ¿Por qué?
            frame: Creo que sí / no, porque ___. Sin embargo, ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Renovación urbana en nuestro barrio'
        skills: [Oraciones de relativo, Expresar opiniones y justificarlas]
        steps:
          - '**Paso 1:** Lee el folleto sobre un proyecto de demolición y construcción de nuevos edificios en tu barrio.'
          - '**Paso 2:** Recibe un rol (mira los roles abajo).'
          - '**Paso 3:** Discusión en grupo. Responde a las preguntas desde tu rol, usando oraciones de relativo.'
          - '**Paso 4:** El grupo toma una decisión.'
        example: '*Apoyamos la renovación urbana, que puede mejorar la infraestructura, pero queremos condiciones que protejan a los residentes.*'
      - id: act1-culture
        type: callout
        tone: culture
        title: Contexto cultural latinoamericano
        text: >-
          En muchas ciudades latinoamericanas, como Ciudad de México, Buenos Aires, São
          Paulo, Bogotá o Santiago, existen proyectos de renovación urbana que transforman
          barrios antiguos. Estos proyectos pueden mejorar la infraestructura, pero también
          afectan a las personas que viven allí.
      - id: act1-roles
        type: table
        caption: Roles
        header: [Rol, Descripción]
        rows:
          - [
              Residente antiguo,
              Persona que ha vivido en el barrio durante muchos años. Está preocupada por el ruido y los cambios.,
            ]
          - [
              Profesional joven,
              Persona que apoya el desarrollo urbano. Prefiere edificios modernos que tengan más servicios.,
            ]
          - [
              Padre o madre,
              Persona que está preocupada por la seguridad y la calidad de vida de su familia.,
            ]
          - [
              Representante de la comunidad,
              Persona que intenta encontrar una solución que beneficie a todos.,
            ]
      - id: act1-questions
        type: discussionQuestions
        title: Discusión en grupo
        items:
          - question: ¿Cómo afectará la demolición a las personas que viven aquí, especialmente a los residentes que han vivido aquí durante muchos años?
            frame: La demolición afectará a los residentes que ___, porque ___.
          - question: ¿Crees que la renovación urbana es una buena solución para este barrio, que ya tiene una alta densidad de población? ¿Por qué?
            frame: En mi opinión, ___, ya que ___.
          - question: ¿Cuáles son tus principales preocupaciones sobre el proyecto que quieren construir?
            frame: Mi principal preocupación es ___ que ___.
          - question: Da un ejemplo personal.
            frame: He vivido / He visto un barrio donde ___.
          - question: ¿Qué beneficios pueden ofrecer los edificios modernos que incluyen espacios verdes?
            frame: Los edificios que tienen espacios verdes ___.
          - question: ¿Cómo cambiará este proyecto el barrio donde viven actualmente las personas?
            frame: El barrio donde ___ se convertirá en un lugar que ___.
      - id: act1-decision
        type: discussionQuestions
        title: Nuestra decisión
        items:
          - question: ¿Qué decide el grupo?
            frame: Apoyamos / No apoyamos la renovación urbana, que ___, pero queremos ___ que ___.
      - id: act2
        type: classActivity
        title: 'Actividad 2: Comunidades rurales en América Latina'
        skills: [Expresar opiniones y justificarlas]
        steps:
          - '**Paso 1:** Mira el video o las imágenes que muestra tu profesor (comunidades rurales en Perú, comunidades indígenas en México, comunidades rurales en Colombia o en Argentina).'
          - '**Paso 2:** Discusión: responde a las preguntas de abajo.'
          - '**Paso 3:** Expresa tu opinión personal sobre la vida rural. Usa al menos una expresión de opinión, al menos una oración de relativo y un ejemplo personal.'
          - '**Paso 4:** Conclusión en grupo: respondan juntos a la pregunta final con una opinión clara, una razón y una oración de relativo.'
        example: '*En mi opinión, la vida rural ofrece una calidad de vida que es más tranquila. Las personas que viven en estas comunidades tienen menos estrés, pero también tienen menos acceso a servicios que son importantes.*'
      - id: act2-questions
        type: discussionQuestions
        title: Discusión
        items:
          - question: ¿Qué te ha sorprendido sobre el estilo de vida de estas comunidades?
            frame: Me ha sorprendido ___.
          - question: ¿Cómo es diferente este estilo de vida del que tienen las personas que viven en ciudades?
            frame: Las personas que viven en el campo ___, mientras que las personas que viven en ciudades ___.
          - question: ¿Qué papel juega la tecnología en tu vida diaria?
            frame: La tecnología es algo que ___.
          - question: ¿Podrías vivir en un lugar donde no haya mucha tecnología?
            frame: Sí / No, podría vivir en un lugar donde ___, porque ___.
          - question: ¿Qué aspectos de la vida rural podrían mejorar la vida urbana?
            frame: Creo que ___ podría mejorar la vida urbana, ya que ___.
      - id: act2-opinion
        type: discussionQuestions
        title: Mi opinión sobre la vida rural
        items:
          - question: Expresa tu opinión personal sobre la vida rural, con una oración de relativo y un ejemplo personal.
            frame: Creo que… / Pienso que… / En mi opinión… / Es un lugar donde… / Es una comunidad que…
      - id: act2-conclusion
        type: discussionQuestions
        title: Conclusión en grupo
        items:
          - question: ¿Creen que la vida rural ofrece una mejor calidad de vida que la vida urbana? ¿Por qué?
            frame: Creemos que la vida rural es mejor para las personas que ___, pero la vida urbana es mejor para quienes ___.
      - id: act3
        type: classActivity
        title: 'Actividad 3: Competencia, naturaleza urbana'
        skills: [Oraciones de relativo]
        steps:
          - '*Naturaleza urbana* significa espacios naturales que existen dentro de las ciudades. Por ejemplo: el Parque Chapultepec en Ciudad de México, el Parque Ibirapuera en São Paulo o el Parque Tres de Febrero en Buenos Aires.'
          - '**Paso 1:** Menciona ciudades que tienen naturaleza urbana.'
          - '**Paso 2:** En parejas, busquen 3 lugares en diferentes países y descríbanlos con oraciones de relativo.'
          - '**Paso 3:** Cada pareja presenta sus lugares. Gana la pareja que encuentre los lugares más interesantes.'
          - '**Paso 4 (opcional):** Mira las imágenes que muestra tu profesor y crea oraciones de relativo.'
        example: |-
          *El Parque Ibirapuera es un lugar que está en São Paulo.*
          *Es un parque donde muchas personas hacen ejercicio.*
      - id: act3-places
        type: discussionQuestions
        title: Nuestros 3 lugares
        items:
          - question: 'Lugar 1:'
            frame: ___ es un lugar que ___. Es un parque donde ___.
          - question: 'Lugar 2:'
            frame: ___ es un lugar que ___. Es un parque donde ___.
          - question: 'Lugar 3:'
            frame: ___ es un lugar que ___. Es un parque donde ___.
      - id: act4
        type: classActivity
        title: 'Actividad 4: El ratón de la ciudad y el ratón del campo'
        skills: [Expresar opiniones y justificarlas, Oraciones de relativo]
        steps:
          - '**Paso 1:** Lee la historia (o escucha a tu profesor).'
          - '**Pregunta central:** ¿Qué estilo de vida ofrece mejor calidad de vida, la vida en la ciudad o la vida en el campo? Grupo 1: la vida en la ciudad. Grupo 2: la vida en el campo.'
          - '**Paso 2:** Preparen argumentos para defender su opinión. Cada argumento incluye al menos 3 palabras del vocabulario, al menos una oración de relativo (*que, donde, quien…*) y al menos un ejemplo personal.'
          - '**Paso 3:** Debate. El grupo A presenta un argumento y el grupo B responde. Después, el grupo B presenta un argumento y el grupo A responde.'
          - '**Paso 4:** Discusión final con toda la clase.'
        example: |-
          **Vida urbana:** *Creo que la vida urbana es mejor porque ofrece más oportunidades laborales. La ciudad es un lugar donde las personas pueden encontrar trabajo más fácilmente. Yo he vivido en una ciudad que tenía muchas opciones, y eso mejoró mi calidad de vida.*
          **Vida rural:** *En mi opinión, la vida rural es mejor porque es más tranquila. El campo es un lugar donde las personas tienen menos estrés. Yo he visitado un pueblo que era muy tranquilo, y me sentí más relajado.*
      - id: story-title
        type: heading
        level: 4
        text: 'Historia: El ratón de la ciudad y el ratón del campo'
      - id: story
        type: text
        text: |-
          El ratón del campo vivía en una zona rural tranquila, donde las mañanas comenzaban con el canto de los pájaros y el aire era fresco. Vivía en una pequeña casa que estaba rodeada de naturaleza, donde todo era silencioso y predecible. La comida que encontraba era simple, pero natural y suficiente. Su vida era tranquila y no tenía estrés.

          Un día, su primo, el ratón de la ciudad, que vivía en una gran ciudad como Buenos Aires, Ciudad de México o Madrid, vino a visitarlo. Le contó historias emocionantes sobre una ciudad que estaba llena de edificios altos, restaurantes, transporte público y personas de todo el mundo. El ratón del campo, que nunca había visitado una ciudad grande, sintió curiosidad y decidió ir con él a la ciudad.

          Cuando llegaron a la ciudad, el ratón del campo se sorprendió. Vio avenidas que estaban llenas de coches, edificios que tocaban el cielo y tiendas donde había comida abundante. Todo parecía emocionante al principio. Sin embargo, pronto escuchó ruidos fuertes, coches que pasaban constantemente y personas que caminaban rápidamente. El ratón del campo, que estaba acostumbrado al silencio, sintió miedo y estrés.

          Más tarde, el ratón de la ciudad visitó el campo. Al principio, disfrutó del aire puro y del espacio abierto. Pero después de unos días, empezó a sentirse aburrido. El campo era un lugar donde no había movimiento constante, ni entretenimiento, ni la energía que él conocía.

          Al final, los dos ratones comprendieron una verdad importante: la calidad de vida depende de la persona. El lugar que es perfecto para uno puede ser incómodo o aburrido para otro.
      - id: act4-board
        type: examples
        title: Frases útiles para el debate
        items:
          - text: La ciudad es un lugar donde…
          - text: El campo es un lugar que…
          - text: Prefiero vivir en un lugar donde…
          - text: Creo que la ciudad es mejor porque…
      - id: act4-arguments
        type: discussionQuestions
        title: Nuestros argumentos
        items:
          - question: 'Argumento 1:'
            frame: Creo que ___ es mejor porque ___. Es un lugar donde ___.
          - question: 'Argumento 2:'
            frame: En mi opinión, ___. Yo he vivido / he visitado ___ que ___.
          - question: 'Argumento 3:'
            frame: Desde mi punto de vista, ___, ya que ___.
      - id: act4-final
        type: discussionQuestions
        title: Discusión final
        items:
          - question: ¿Qué parte de la historia te ha hecho pensar de forma diferente?
            frame: La parte que me ha hecho pensar es ___, porque ___.
          - question: ¿Con cuál ratón te identificas más y por qué?
            frame: Me identifico más con el ratón ___, porque ___.
          - question: ¿Prefieres vivir en un lugar que sea tranquilo o en un lugar que tenga más actividad?
            frame: Prefiero vivir en un lugar que ___, aunque ___.
          - question: ¿Crees que existe un lugar donde se pueda tener un equilibrio entre la vida urbana y la rural?
            frame: Creo que sí / no. Un lugar donde ___ sería ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Oraciones de relativo** (Actividades 1, 3 y 4)
          y **Expresar opiniones y justificarlas** (Actividades 1, 2 y 4). Elige las
          actividades según el tiempo; el cuaderno no indica tiempos. El cuaderno enlaza
          una presentación en gamma.app («Nivel Avanzado B2»); no se incluye aquí
          porque ese sitio no está permitido. Si la usas, ábrela por tu cuenta.
      - id: n-intro
        anchor: intro
        text: Da tu propio ejemplo primero y después pregunta a cada estudiante.
      - id: n-warmup
        anchor: warmup
        text: |-
          Elige algunas de las 8 preguntas. Pide oraciones completas, el pretérito perfecto, oraciones de relativo y una justificación. Respuestas modelo del cuaderno:
          1. *Preferiría vivir en una ciudad que tenga buenas oportunidades laborales y transporte público eficiente, porque me gusta vivir en un lugar donde todo esté cerca. Sin embargo, también valoro los lugares que son tranquilos.*
          2. *He vivido en un barrio que tenía muchos restaurantes, parques y tiendas. Era un lugar donde podía caminar a todos lados, lo cual hacía mi vida más cómoda.*
          3. *Vivo en un apartamento que está en el centro de la ciudad. Me gustaría mudarme a un lugar que tenga más espacio, porque trabajo desde casa.*
          4. *Me he mudado a una ciudad que tiene mejor transporte público, lo cual ha mejorado mi calidad de vida porque ahora pierdo menos tiempo en el tráfico.*
          5. *Me gustaría vivir en una ciudad que tenga naturaleza cerca, donde pueda disfrutar tanto de la vida urbana como de la tranquilidad.*
          6. *Prefiero vivir en una comunidad que tenga un fuerte sentido de conexión entre los vecinos, porque me gusta vivir en un lugar donde las personas se conozcan.*
          7. *Sí, hay un parque que está cerca de mi casa, donde muchas personas hacen ejercicio. He ido varias veces y me ha ayudado a relajarme.*
      - id: n-act1
        anchor: act1
        text: >-
          Antes de la clase, prepara un folleto breve sobre un proyecto (imaginario) de
          demolición y construcción de nuevos edificios en el barrio: el cuaderno lo
          menciona pero no lo incluye. Reparte un rol a cada estudiante. Al final, el
          grupo formula su decisión con una oración de relativo.
      - id: n-act2
        anchor: act2
        text: >-
          El cuaderno no incluye el video ni las imágenes: busca antes de la clase un video
          corto o fotos de comunidades rurales en Perú, México, Colombia o Argentina. En el
          paso 3, escribe en la pizarra: *Creo que… / Pienso que… / En mi opinión… / Es un
          lugar donde… / Es una comunidad que…* En el paso 4, escucha, corrige errores y
          refuerza el uso correcto de las estructuras.
      - id: n-act3
        anchor: act3
        text: >-
          Los estudiantes pueden buscar los lugares en internet. Para el paso 4 (opcional),
          prepara imágenes de parques urbanos; el cuaderno no las incluye.
      - id: n-act4
        anchor: act4
        text: >-
          Lee la historia o pide a los estudiantes que la lean en voz alta. Divide la clase
          en dos grupos. Escribe en la pizarra: *La ciudad es un lugar donde… / El campo es
          un lugar que… / Prefiero vivir en un lugar donde… / Creo que la ciudad es mejor
          porque…* Durante el debate, escucha y corrige errores. Objetivo final: expresar
          opiniones complejas, usar oraciones de relativo correctamente, defender una
          opinión en un debate, comparar estilos de vida y hablar sobre calidad de vida
          con fluidez.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: vida-urbana-y-rural-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-relativos
        type: ruleSummary
        skill: Oraciones de relativo
        rules:
          - text: 'Las oraciones de relativo dan información sobre una persona, un lugar, una cosa o una idea. Unen dos ideas en una sola oración y evitan repeticiones.'
            examples:
              - Vivo en una ciudad. La ciudad tiene muchos parques. → Vivo en una ciudad que tiene muchos parques.
          - text: '**Que** es el relativo más común. Se usa para personas, cosas, animales e ideas.'
            examples:
              [
                La ciudad que visité es muy moderna.,
                El barrio que tiene más parques es más tranquilo.,
                Las personas que viven aquí están satisfechas.,
              ]
          - text: '**Quien / quienes** se refiere solo a personas y es más formal. Se usa entre comas, después de una preposición (*con quien, a quien*) o sin sustantivo antes (*Quienes…*). Sin comas y sin preposición, usamos **que**: *las personas que viven* (no *las personas quienes viven*).'
            examples:
              [
                'El vecino, quien vive aquí, trabaja desde casa.',
                La persona con quien hablé vive en el campo.,
                Quienes viven en el campo tienen un estilo de vida diferente.,
              ]
          - text: '**Donde** se usa para lugares. Significa *en el que / en el cual*.'
            examples:
              [Es una ciudad donde hay muchas oportunidades., El barrio donde vivo es tranquilo.]
          - text: '**El cual / la cual / los cuales / las cuales** son más formales. Concuerdan en género y número con el sustantivo. Se usan entre comas o después de una preposición.'
            examples:
              [
                'La ciudad, la cual tiene muchos parques, es muy agradable.',
                'Los edificios, los cuales son modernos, mejoran la infraestructura.',
                El barrio en el cual vivo es tranquilo.,
              ]
          - text: '**Cuyo / cuya / cuyos / cuyas** expresa posesión. Concuerda con lo que se posee, no con el poseedor.'
            examples:
              [
                Es un barrio cuyos edificios son antiguos.,
                Conocí a una persona cuya familia vive en el campo.,
              ]
      - id: relativos-table
        type: table
        caption: Los pronombres relativos
        header: [Relativo, Se usa para, Ejemplo]
        rows:
          - [que, 'personas, cosas, animales, ideas', La ciudad que visité es moderna.]
          - [
              quien / quienes,
              'personas (entre comas, con preposición o sin sustantivo)',
              'El vecino, quien vive aquí, trabaja desde casa.',
            ]
          - [donde, lugares, El barrio donde vivo es tranquilo.]
          - [
              el cual / la cual / los cuales / las cuales,
              'contextos formales; entre comas o con preposición',
              'La ciudad, la cual tiene muchos parques, es agradable.',
            ]
          - [cuyo / cuya / cuyos / cuyas, posesión, Es un barrio cuyos edificios son antiguos.]
      - id: rules-tipos
        type: ruleSummary
        skill: Tipos de oraciones de relativo
        rules:
          - text: '**Especificativas:** dan información necesaria para saber de qué sustantivo hablamos (responden a *¿cuál?*). No llevan comas.'
            examples:
              [
                La ciudad que tiene buen transporte es más cómoda.,
                Las personas que viven en zonas rurales tienen más contacto con la naturaleza.,
              ]
          - text: '**Explicativas:** dan información adicional, no esencial. Siempre van entre comas.'
            examples:
              [
                'Buenos Aires, que es una ciudad grande, tiene muchos parques.',
                'El campo, que es más tranquilo, ofrece menos oportunidades laborales.',
              ]
          - text: 'Si hablamos de algo que conocemos y existe, el verbo va en **indicativo**. Si hablamos de algo que buscamos, deseamos o imaginamos, va en **subjuntivo**.'
            examples:
              [
                Vivo en una ciudad que tiene buen transporte público.,
                Prefiero vivir en una ciudad que tenga buen transporte público.,
                Me gustaría vivir en un lugar donde todo esté cerca.,
              ]
      - id: rules-opiniones
        type: ruleSummary
        skill: Expresar opiniones y justificarlas
        rules:
          - text: 'Para introducir una opinión personal:'
            examples:
              [
                Creo que la vida urbana es más conveniente.,
                Pienso que el campo ofrece una mejor calidad de vida.,
                'En mi opinión, la ciudad ofrece más oportunidades.',
                'Desde mi punto de vista, el campo es más relajante.',
                'Personalmente, prefiero vivir en una ciudad.',
              ]
          - text: 'Con *creo que* y *pienso que* el verbo va en indicativo. En negativo (*no creo que, no pienso que*) va en subjuntivo.'
            examples: [Creo que la ciudad es ruidosa., No creo que la ciudad sea mejor.]
          - text: 'Justifica tu opinión con **conectores de causa**: *porque, ya que, debido a que*.'
            examples:
              [
                Prefiero la ciudad porque tiene más servicios.,
                'Me gusta el campo, ya que es más tranquilo.',
              ]
          - text: '**Conectores de contraste**: *pero, sin embargo, aunque*.'
            examples:
              [
                'La ciudad es interesante, pero es ruidosa.',
                'El campo es tranquilo, aunque tiene menos oportunidades.',
                'La ciudad tiene muchos servicios. Sin embargo, es cara.',
              ]
          - text: '**Conectores de adición**: *además, también*.'
            examples: ['La ciudad tiene buenos servicios. Además, ofrece más empleo.']
          - text: '**Opinión + oración de relativo:** así hablamos de forma más avanzada.'
            examples:
              - Prefiero vivir en una ciudad que tenga buen transporte público, porque es un lugar donde puedo moverme fácilmente.
              - En mi opinión, el campo es mejor para las personas que buscan tranquilidad, aunque la ciudad ofrece más oportunidades laborales.
      - id: rules-perfecto
        type: ruleSummary
        skill: El pretérito perfecto para experiencias
        rules:
          - text: 'Para hablar de experiencias que tienen relación con el presente: **haber** (presente) + participio (*-ado, -ido*).'
            examples:
              [
                He vivido en una ciudad grande.,
                He visitado un pueblo rural.,
                He visto lugares donde la calidad de vida es mejor.,
              ]
      - id: perfecto-table
        type: table
        caption: Pretérito perfecto
        header: [Persona, haber, Participio]
        rows:
          - [yo, he, 'vivido, visitado, visto']
          - [tú, has, 'vivido, visitado, visto']
          - [él / ella / usted, ha, 'vivido, visitado, visto']
          - [nosotros / nosotras, hemos, 'vivido, visitado, visto']
          - [ellos / ellas / ustedes, han, 'vivido, visitado, visto']
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos habilidades con el grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: vida-urbana-y-rural-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia un mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Parte 1: Conversación guiada'
        message: >-
          Hola Mori. Quiero practicar hablar sobre la vida urbana y la vida rural. Por
          favor, hazme preguntas abiertas y conversacionales sobre mis experiencias
          personales viviendo o visitando ciudades, barrios, pueblos o zonas rurales.
          Pregúntame cómo estos lugares han afectado mi calidad de vida, mis experiencias
          con el ruido, el transporte, el aislamiento o la naturaleza urbana, y mis
          preferencias de vivienda. Anímame a expresar opiniones claras, justificarlas con
          razones y ejemplos personales, usar oraciones de relativo (que, donde, quien,
          etc.) y comparar la vida urbana y rural de forma equilibrada y respetuosa.
          También puedes hacer preguntas de seguimiento para ayudarme a explicar mis ideas
          con más profundidad.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Parte 2: Vida urbana vs. vida rural en el mundo hispanohablante'
        intro: |-
          Elige un lugar urbano (por ejemplo: Buenos Aires, Ciudad de México, Madrid, Bogotá, Barcelona, Santiago, Lima) y un lugar rural (un pueblo pequeño, una comunidad rural o una ciudad pequeña en un país hispanohablante). Puedes basarte en tu experiencia personal, en lugares que hayas visitado o en lugares que conozcas.
          Piensa en: la calidad de vida, la naturaleza urbana o el entorno natural, el ruido y el ritmo de vida, la densidad de población, el sentido de comunidad y la rutina diaria.
        message: >-
          Hola Mori. Por favor, ayúdame a comparar un lugar urbano y un lugar rural en un
          país hispanohablante. Hazme preguntas que me ayuden a describir mis
          experiencias, expresar mis opiniones y explicar las diferencias en calidad de
          vida, naturaleza, ritmo de vida y comunidad. Anímame a usar oraciones de relativo
          como que y donde, justificar mis opiniones y dar ejemplos personales. También haz
          preguntas de seguimiento para ayudarme a explicar mis respuestas con más
          profundidad.
      - id: mori-2-remember
        type: callout
        tone: info
        title: No olvides
        text: |-
          Usa al menos 4 oraciones de relativo.
          Compara al menos 3 aspectos de la vida.
          Expresa opiniones personales, no solo hechos.
      - id: part3-title
        type: heading
        level: 3
        text: 'Parte 3: Comunidades y estilos de vida'
      - id: part3-intro
        type: text
        text: >-
          Muchas comunidades viven de formas diferentes según el lugar donde viven. Elige
          **una** comunidad y busca información sobre ella. Por ejemplo: una comunidad rural
          en Perú, una comunidad indígena en México, una comunidad rural en Colombia, una
          comunidad urbana en Buenos Aires o una comunidad rural en España. Responde a las
          preguntas y envía tus respuestas a Mori.
      - id: part3-questions
        type: discussionQuestions
        items:
          - question: ¿Cómo influye el lugar donde vive esta comunidad en su estilo de vida? Usa una oración de relativo (que o donde).
            frame: Esta comunidad vive en un lugar donde ___, por eso ___.
          - question: ¿Cuáles crees que son las principales ventajas de vivir en esta comunidad? Piensa en la calidad de vida, la comunidad o la naturaleza.
            frame: Creo que la principal ventaja es ___, ya que ___.
          - question: ¿Qué desafíos crees que enfrentan las personas que viven allí? Piensa en la infraestructura, el aislamiento o el acceso a servicios.
            frame: Las personas que viven allí ___.
          - question: ¿Te sentirías cómodo / cómoda viviendo en esta comunidad? ¿Por qué o por qué no? Justifica tu opinión con un ejemplo personal o una comparación.
            frame: Me sentiría / No me sentiría cómodo porque ___.
          - question: ¿Qué aspectos de este estilo de vida podrían funcionar en la vida moderna? Da un ejemplo.
            frame: Creo que ___ podría funcionar, por ejemplo ___.
      - id: mori-4
        type: aiTutorPrompt
        title: 'Parte 4: Enviar tus respuestas para corrección'
        message: >-
          Hola Mori. He completado una tarea en la que investigué una comunidad que vive en
          un entorno urbano o rural. En mis respuestas, expliqué dónde vive esta comunidad,
          cómo viven las personas allí y cómo el entorno afecta su calidad de vida. El
          objetivo de la tarea fue expresar opiniones personales y usar oraciones de
          relativo de forma natural. Por favor, revisa mis respuestas y ayúdame a
          mejorarlas corrigiendo mis errores gramaticales, especialmente las oraciones de
          relativo, el uso de expresiones de opinión y la claridad general. Corrige mis
          errores, sugiere formas más naturales de expresarme y dame una oración modelo
          mejorada para cada respuesta. También explícame brevemente qué hice bien y qué
          puedo mejorar.
      - id: requirements
        type: callout
        tone: info
        title: Requisitos finales
        text: |-
          Elige solo una comunidad.
          Escribe respuestas detalladas.
          Usa oraciones de relativo especificativas y explicativas.
          Expresa opiniones claras y bien justificadas.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**

