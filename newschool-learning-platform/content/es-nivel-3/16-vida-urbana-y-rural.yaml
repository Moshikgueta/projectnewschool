vocabulary:
  - slug: vida-urbana-y-rural
    title: Vida urbana vs. vida rural
    items: *vida-urbana-y-rural-words

activities:
  - slug: vida-urbana-y-rural-relativos
    title: 'Oraciones de relativo: que, donde, cuyo'
    minutes: 8
    items:
      - id: donde-vivo
        type: multipleChoice
        prompt: El barrio ___ vivo es tranquilo.
        options:
          - { text: donde, correct: true }
          - {
              text: que,
              feedback: 'Para un lugar donde vives, usamos *donde* (o *en el que*): *el barrio donde vivo*.',
            }
          - {
              text: cuyo,
              feedback: '*Cuyo* expresa posesión (*un barrio cuyos edificios…*). Para un lugar usamos *donde*.',
            }
      - id: cuya-familia
        type: fillBlank
        prompt: Completa con *cuyo / cuya / cuyos / cuyas*.
        text: Conocí a una persona ___ familia vive en el campo.
        blanks: [[cuya]]
      - id: cuyos-edificios
        type: multipleChoice
        prompt: Es un barrio ___ edificios son antiguos.
        options:
          - { text: cuyos, correct: true }
          - {
              text: cuyo,
              feedback: '*Cuyo* concuerda con lo que se posee: *edificios* es masculino plural, entonces *cuyos*.',
            }
          - { text: cuyas, feedback: '*Edificios* es masculino, no femenino: *cuyos edificios*.' }
      - id: explicativas
        type: trueFalse
        prompt: 'Las oraciones de relativo explicativas van entre comas: *Buenos Aires, que es una ciudad grande, tiene muchos parques.*'
        answer: true
        feedback:
          correct: ¡Correcto! Las explicativas dan información adicional y siempre van entre comas.
          incorrect: 'Las explicativas dan información adicional y siempre van entre comas. Las especificativas no llevan comas.'
      - id: une-relativos
        type: matching
        prompt: Une cada relativo con su uso.
        pairs:
          - [que, 'personas, cosas, animales e ideas']
          - [quien / quienes, solo personas]
          - [donde, lugares]
          - [cuyo / cuya, posesión]
          - [el cual / la cual, contextos formales o después de una preposición]
      - id: la-cual
        type: multipleChoice
        prompt: 'La ciudad, ___ tiene muchos parques, es muy agradable.'
        options:
          - { text: la cual, correct: true }
          - {
              text: el cual,
              feedback: '*El cual* concuerda con el sustantivo: *ciudad* es femenino, entonces *la cual*.',
            }
          - {
              text: cuya,
              feedback: '*Cuya* expresa posesión y va antes de otro sustantivo (*cuya familia*). Aquí usamos *la cual* (o *que*).',
            }
      - id: personas-que
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: Las personas que viven en el campo tienen otro estilo de vida., correct: true }
          - {
              text: Las personas quienes viven en el campo tienen otro estilo de vida.,
              feedback: 'Sin comas y sin preposición no usamos *quienes*: *las personas que viven…*',
            }
          - {
              text: Las personas cuyas viven en el campo tienen otro estilo de vida.,
              feedback: '*Cuyas* expresa posesión y va antes de un sustantivo. Aquí usamos *que*.',
            }
      - id: ordena-barrio
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Es una ciudad donde hay muchas oportunidades.

  - slug: vida-urbana-y-rural-opiniones
    title: 'Expresar opiniones: creo que, porque, aunque'
    minutes: 8
    items:
      - id: porque-servicios
        type: multipleChoice
        prompt: Prefiero la ciudad ___ tiene más servicios.
        options:
          - { text: porque, correct: true }
          - {
              text: aunque,
              feedback: '*Aunque* expresa contraste. Para dar la razón de tu opinión usa un conector de causa: *porque*.',
            }
          - { text: además, feedback: '*Además* añade otra idea. Para dar la razón usa *porque*.' }
      - id: une-conectores
        type: matching
        prompt: Une cada expresión con su función.
        pairs:
          - [porque / ya que, causa]
          - [pero / aunque, contraste]
          - [además / también, adición]
          - [creo que / en mi opinión, opinión]
      - id: aunque-oportunidades
        type: fillBlank
        prompt: Completa con un conector de contraste.
        text: El campo es tranquilo, ___ tiene menos oportunidades.
        blanks: [[aunque, pero]]
      - id: sin-embargo-causa
        type: trueFalse
        prompt: '*Sin embargo* expresa causa, como *porque*.'
        answer: false
        feedback:
          correct: '¡Correcto! *Sin embargo* expresa contraste, como *pero*.'
          incorrect: '*Sin embargo* expresa contraste, como *pero*: *La ciudad tiene servicios. Sin embargo, es ruidosa.*'
      - id: ademas-empleo
        type: multipleChoice
        prompt: La ciudad tiene buenos servicios. ___, ofrece más empleo.
        options:
          - { text: Además, correct: true }
          - {
              text: Sin embargo,
              feedback: 'Las dos ideas son positivas: no hay contraste. Para añadir una idea usamos *además*.',
            }
          - {
              text: Aunque,
              feedback: '*Aunque* expresa contraste. Aquí añadimos una idea: *Además*.',
            }
      - id: mi-opinion
        type: fillBlank
        prompt: Completa las expresiones de opinión.
        text: ___ mi opinión, la ciudad ofrece más oportunidades. Desde mi punto de ___, el campo es más relajante.
        blanks: [[En, en], [vista]]
      - id: justificar
        type: multipleChoice
        prompt: ¿Qué oración expresa una opinión y la justifica?
        options:
          - { text: Creo que el campo es mejor porque es más tranquilo., correct: true }
          - {
              text: El campo es mejor.,
              feedback: 'Falta la justificación: añade un conector de causa (*porque, ya que*) y una razón.',
            }
          - {
              text: Porque el campo es tranquilo.,
              feedback: 'Hay una razón, pero falta la opinión: *Creo que el campo es mejor porque…*',
            }
      - id: ordena-creo
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Creo que la vida urbana es más conveniente.
