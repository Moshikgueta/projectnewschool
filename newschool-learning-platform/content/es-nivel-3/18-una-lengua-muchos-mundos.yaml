vocabulary:
  - slug: una-lengua-muchos-mundos
    title: Una lengua, muchos mundos
    items: *una-lengua-muchos-mundos-words

activities:
  - slug: una-lengua-muchos-mundos-pasado
    title: Preguntas y experiencias en pasado
    minutes: 8
    items:
      - id: has-visto
        type: multipleChoice
        prompt: ¿___ alguna vez una serie argentina? (tú, ver)
        options:
          - { text: Has visto, correct: true }
          - { text: Has veído, feedback: 'El participio de *ver* es irregular: *visto*.' }
          - {
              text: Has ver,
              feedback: 'Después de *haber* va el participio, no el infinitivo: *has visto*.',
            }
      - id: he-viajado
        type: fillBlank
        prompt: Completa con *viajar* en pretérito perfecto (yo).
        text: Nunca ___ a México.
        blanks: [[he viajado]]
      - id: participios
        type: matching
        prompt: Une cada verbo con su participio.
        pairs:
          - [hablar, hablado]
          - [ver, visto]
          - [hacer, hecho]
          - [escuchar, escuchado]
          - [decir, dicho]
      - id: momento-concreto
        type: trueFalse
        prompt: 'Con un momento concreto del pasado (*ayer, el año pasado*) usamos el pretérito indefinido: *El año pasado vi un documental sobre Perú.*'
        answer: true
        feedback:
          correct: ¡Correcto! Con *ayer* o *el año pasado* usamos el indefinido.
          incorrect: 'Con un momento concreto del pasado usamos el indefinido: *El año pasado vi un documental.*'
      - id: vi
        type: multipleChoice
        prompt: El año pasado yo ___ un documental sobre Perú.
        options:
          - { text: vi, correct: true }
          - {
              text: he visto,
              feedback: 'Con *el año pasado* (un momento concreto) usamos el indefinido: *vi*.',
            }
          - { text: veí, feedback: 'El indefinido de *ver* (yo) es *vi*, sin *e*.' }
      - id: has-hablado
        type: fillBlank
        prompt: Completa con *haber* (tú).
        text: ¿___ hablado con personas de otros países?
        blanks: [[Has, has]]
      - id: ordena-acento
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: He escuchado un acento chileno.
      - id: escuche
        type: multipleChoice
        prompt: Ayer ___ un acento muy diferente. (yo, escuchar)
        options:
          - { text: escuché, correct: true }
          - {
              text: escuchado,
              feedback: 'El participio solo no es un verbo conjugado. Con *ayer* usamos el indefinido: *escuché*.',
            }
          - { text: escuchí, feedback: 'Los verbos en -ar terminan en *-é* para *yo*: *escuché*.' }

  - slug: una-lengua-muchos-mundos-comparar
    title: Comparar y opinar
    minutes: 8
    items:
      - id: mas-que
        type: multipleChoice
        prompt: México es ___ grande ___ Uruguay.
        options:
          - { text: más… que, correct: true }
          - {
              text: más… como,
              feedback: 'Con *más* usamos *que*: *más grande que*. *Como* va con *tan*.',
            }
          - {
              text: tan… que,
              feedback: 'México no es igual de grande que Uruguay. Para cosas diferentes usamos *más… que*.',
            }
      - id: tan-como
        type: fillBlank
        prompt: Completa la comparación de igualdad.
        text: Para mí, el acento chileno es ___ difícil ___ el cubano.
        blanks: [[tan], [como]]
      - id: igualdad
        type: trueFalse
        prompt: 'Para decir que dos cosas son iguales usamos *tan + adjetivo + que*.'
        answer: false
        feedback:
          correct: '¡Correcto! Usamos *tan + adjetivo + como*: *tan difícil como*.'
          incorrect: 'La forma es *tan + adjetivo + como*: *El acento chileno es tan difícil como el cubano.*'
      - id: funciones
        type: matching
        prompt: Une cada frase con su función.
        pairs:
          - [Creo que…, dar una opinión]
          - [Estoy de acuerdo porque…, aceptar la idea de otra persona]
          - [No estoy de acuerdo porque…, rechazar la idea de otra persona]
          - [Eso depende de…, decir que no siempre es igual]
          - [más… que, comparar dos cosas diferentes]
      - id: mejor
        type: multipleChoice
        prompt: Este video es ___ que el otro. (bueno)
        options:
          - { text: mejor, correct: true }
          - { text: más bueno, feedback: 'Para comparar calidad decimos *mejor*, no *más bueno*.' }
          - {
              text: más mejor,
              feedback: '*Mejor* ya es una comparación: no usamos *más* con *mejor*.',
            }
      - id: mas-menos
        type: fillBlank
        prompt: Completa con una palabra de comparación.
        text: Algunos países hablan ___ rápido que otros.
        blanks: [[más, menos]]
      - id: ordena-cultura
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Creo que cada país tiene una cultura diferente.
      - id: estoy-de-acuerdo
        type: multipleChoice
        prompt: ¿Qué frase es correcta?
        options:
          - { text: Estoy de acuerdo contigo., correct: true }
          - {
              text: Soy de acuerdo contigo.,
              feedback: 'Decimos *estar de acuerdo*: *Estoy de acuerdo.*',
            }
          - { text: Estoy acuerdo contigo., feedback: 'Falta *de*: *estar de acuerdo*.' }
