vocabulary:
  - slug: educacion
    title: Educación
    items: *educacion-words

activities:
  - slug: educacion-pasado
    title: 'Pretérito perfecto e indefinido: mis experiencias'
    minutes: 8
    items:
      - id: he-participado
        type: multipleChoice
        prompt: Yo ___ en muchos cursos de formación.
        options:
          - { text: he participado, correct: true }
          - {
              text: participado,
              feedback: 'El pretérito perfecto necesita el verbo *haber* antes del participio: *he participado*.',
            }
          - {
              text: ha participado,
              feedback: '*Ha* es para él / ella. Para *yo* usamos *he*: *he participado*.',
            }
      - id: ha-ensenado
        type: fillBlank
        prompt: Completa con el verbo *enseñar* en pretérito perfecto.
        text: Mi profesora me ___ a no tener miedo a equivocarme.
        blanks: [[ha enseñado]]
      - id: la-conoci
        type: multipleChoice
        prompt: He tenido una profesora que me ha marcado mucho. La ___ en la secundaria.
        options:
          - { text: conocí, correct: true }
          - {
              text: he conocido,
              feedback: 'Aquí damos un detalle concreto (cuándo: *en la secundaria*). Para el detalle usamos el indefinido: *conocí*.',
            }
          - {
              text: conozco,
              feedback: '*Conozco* es presente. Hablamos de un momento del pasado: *conocí*.',
            }
      - id: detalle
        type: trueFalse
        prompt: Usamos el pretérito perfecto para dar el detalle concreto (cuándo, dónde, con quién).
        answer: false
        feedback:
          correct: '¡Correcto! El detalle concreto va en indefinido: *El más importante lo hice en 2022.*'
          incorrect: 'El perfecto es para la experiencia (*He participado en muchos cursos*); el detalle concreto va en indefinido (*Lo hice en 2022*).'
      - id: participios
        type: matching
        prompt: Une cada verbo con su participio.
        pairs:
          - [estudiar, estudiado]
          - [aprender, aprendido]
          - [hacer, hecho]
          - [ver, visto]
          - [escribir, escrito]
      - id: lo-hice
        type: fillBlank
        prompt: Completa con el verbo *hacer* (yo) en el tiempo correcto.
        text: He participado en muchos cursos. El más importante lo ___ en 2022.
        blanks: [[hice]]
      - id: has-estudiado
        type: fillBlank
        prompt: Completa con el verbo *estudiar* (tú) en pretérito perfecto.
        text: ¿___ alguna vez una materia muy difícil?
        blanks: [[Has estudiado, has estudiado, Tú has estudiado, tú has estudiado]]
      - id: ordena-videos
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: He aprendido mucho con vídeos online.

  - slug: educacion-futuro
    title: 'El futuro: ir a + infinitivo y futuro simple'
    minutes: 8
    items:
      - id: voy-a
        type: multipleChoice
        prompt: El próximo año ___ estudiar educación especial. (yo)
        options:
          - { text: voy a, correct: true }
          - {
              text: voy,
              feedback: 'Falta la preposición *a*: *ir* + **a** + infinitivo (*voy a estudiar*).',
            }
          - { text: vas a, feedback: '*Vas* es para *tú*. Para *yo* usamos *voy a*.' }
      - id: usaran
        type: fillBlank
        prompt: Completa con el verbo *usar* en futuro simple.
        text: Las escuelas ___ más tecnología en el futuro.
        blanks: [[usarán]]
      - id: irregulares
        type: matching
        prompt: Une cada verbo con su forma en futuro simple.
        pairs:
          - [tener (yo), tendré]
          - [hacer (yo), haré]
          - [poder (yo), podré]
          - [ser (la educación), será]
          - [aprender (ellos), aprenderán]
      - id: plan-prediccion
        type: trueFalse
        prompt: 'Usamos *ir a* + infinitivo para planes e intenciones, y el futuro simple para predicciones.'
        answer: true
        feedback:
          correct: '¡Correcto! *Voy a estudiar pedagogía* (plan). *La educación será más digital* (predicción).'
          incorrect: '*Ir a* + infinitivo = plan (*Voy a estudiar pedagogía*). Futuro simple = predicción (*La educación será más digital*).'
      - id: prediccion
        type: multipleChoice
        prompt: ¿Qué frase es una predicción con futuro simple?
        options:
          - { text: La educación será más flexible., correct: true }
          - {
              text: Vamos a crear un programa nuevo.,
              feedback: 'Esta frase usa *ir a* + infinitivo: es un plan. El futuro simple es *será*, *aprenderán*…',
            }
          - {
              text: He estudiado en una universidad.,
              feedback: 'Esta frase está en pretérito perfecto (pasado). El futuro simple es *será*, *aprenderán*…',
            }
      - id: vamos
        type: fillBlank
        prompt: Completa con el verbo *ir* (nosotros).
        text: Nosotros ___ a cambiar la manera de enseñar.
        blanks: [[vamos]]
      - id: ayudara
        type: multipleChoice
        prompt: Voy a hacer un curso de psicología educativa. Me ___ a entender mejor a mis alumnos.
        options:
          - { text: ayudará, correct: true }
          - {
              text: ayudó,
              feedback: '*Ayudó* es pasado. El curso es un plan, y el resultado va en futuro: *ayudará*.',
            }
          - {
              text: ayudar,
              feedback: 'Aquí necesitamos un verbo conjugado en futuro: *Me ayudará*.',
            }
      - id: ordena-inclusiva
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: La educación será más inclusiva.
