course: es-nivel-3
slug: familia-y-generaciones
title: Familia, generaciones y relaciones
goal: Hablar de la familia y las generaciones con conectores lógicos y adjetivos descriptivos.
position: 17
status: in_review

review:
  - >-
    The two workbook exercises ("Conectores lógicos" and "Adjetivos descriptivos") are
    NEW: the notebook has no self-study exercises. They were written from the cycle's
    two skills, its summary rules, the activity examples and its vocabulary. Please
    check level, wording and every right answer before students see them.
  - >-
    Summary: the notebook's grammar summary is written in Hebrew; it is translated
    into Spanish like the other cycles. Wrong rule fixed: it said the adjective can go
    "before the noun" with the example "Una familia tradicional", where it is after
    the noun. Rewritten: descriptive adjectives normally go after the noun. The
    agreement rule only showed number (tradicional / tradicionales); gender was added
    (organizado / organizada, protector / protectora; -e and consonant adjectives do
    not change for gender) with a new table. Please confirm.
  - >-
    Connectors: "mientras" is listed as a contrast connector; for contrast it is
    "mientras que" ("mientras" alone means "while" in time). Changed in the summary,
    Activity 3, Mori activity 2 and the vocabulary. Added to the summary: gracias a,
    por eso, en cambio, a pesar de (used in the activities but not in the summary), a
    rule on comparatives (más / menos… que, tan… como), used in Activity 3 and the
    homework, and a connectors table.
  - >-
    Corrections: heading "Domande di riscaldamento" (Italian) → "Preguntas de
    calentamiento"; vocabulary "Testardo" (Italian) → "Testarudo / terco"; "Determinado"
    → "Decidido / determinado" (as a personality adjective "decidido" is more
    natural); "La Super Niñera visita mi familia" / "observa tu familia" → "visita a
    mi familia" / "observa a tu familia" (personal "a"); "verbos modales" (English
    category) → "verbos en condicional (recomendaría, podría, debería)"; "Tarea con
    Mori - Práctica guiada (más speaking)" → "(más práctica oral)"; "Bonus (opcional,
    muy potente)" → "Extra (opcional)"; intro example "Aprendí el valor de la
    responsabilidad porque…" rewritten to follow the frame ("Una cosa importante que
    aprendí de mi familia es…").
  - >-
    Left out: the gamma.app slide-deck link (not an allowed host; mentioned in the
    teacher plan note). Activity 3 uses a video and Activity 4 a listening, but the
    source has no link or audio for either: teacher notes say to choose one. The
    "Respuesta del estudiante 1/2/3" lines are replaced by the answer boxes. The
    Activity 6 time "20-25 minutos" is recorded as 20. The Quizlet link's funnelUUID
    tracking parameter was removed.
  - >-
    Smaller wording fixes: warm-up frame 6 "crea una atmósfera ___" → "crea un
    ambiente ___"; frame 3 "Admiro su ___ y ___" → "Admiro su ___ y su ___"; homework
    "Yo soy más parecido a" → "Me parezco más a"; interview question "¿las familias
    israelíes cambiaron en los últimos años?" → "han cambiado"; "Tema: Tu familia vs
    otra familia" → "tu familia y otra familia que conoces"; Mori activity 3 "hazme
    mejorar la respuesta" → "ayúdame a mejorar la respuesta". Activity frames and the
    Activity 1 / 2 answer boxes were added (the source has none).
  - >-
    The "Tarea clásica" (written homework, Parts 1-4) is kept in the homework section
    before the Mori tasks, as answerable questions. Vocabulary glosses: "Conflicto" →
    "סכסוך / קונפליקט"; "Reservado" glossed "מופנם" in the source (that is closer to
    "introvertido"); changed to "שמור / מאופק". Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: familia-y-generaciones-clase
    title: 'Clase: Familia, generaciones y relaciones'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Familia, generaciones y relaciones
      - id: skills
        type: cycleOverview
        skills:
          - name: Conectores lógicos
            description: '*sin embargo, aunque, mientras que, por lo tanto, gracias a, en cambio, ya que*'
          - name: Adjetivos descriptivos
            description: '*solidario, exigente, resiliente, independiente, tradicional, protector*'
      - id: quizlet
        type: externalLink
        label: Familia, generaciones y relaciones en Quizlet
        url: https://quizlet.com/br/1173508478/familia-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de presentación
      - id: intro
        type: sentenceFrame
        frame: |-
          Me llamo ___.
          Mi familia es ___ y ___, aunque a veces ___.
          Una cosa importante que aprendí de mi familia es ___, porque ___.
        example: |-
          Me llamo Marco.
          Mi familia es muy unida y tradicional, aunque a veces puede ser un poco caótica.
          Una cosa importante que aprendí de mi familia es el valor de la responsabilidad, porque mis padres siempre han sido muy exigentes pero solidarios.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup
        type: discussionQuestions
        items:
          - question: ¿Describirías tu familia como más tradicional o más moderna? ¿Cómo influye eso en las decisiones importantes?
            frame: Mi familia es bastante ___, sobre todo en cuanto a ___. Sin embargo, es ___ cuando se trata de ___.
          - question: ¿Quién ha sido una persona influyente en tu vida y por qué?
            frame: ___ es una persona muy ___ y ___; por lo tanto, para mí es ___. Aunque a veces es ___, también es ___.
          - question: ¿Qué cualidades admiras en las personas mayores de tu familia o comunidad?
            frame: Admiro su ___ y su ___, aunque a veces ___. Son ___; por lo tanto, sus consejos son ___.
          - question: ¿Cómo describirías la dinámica de tu familia?
            frame: Mi familia es ___ y ___, aunque a veces ___. Normalmente ___ porque ___.
          - question: ¿Crees que las relaciones entre padres e hijos cambian con la edad? ¿Cómo?
            frame: Con el tiempo, las relaciones pueden volverse más ___ y ___. Antes ___, pero ahora ___ porque ___.
          - question: ¿Crees que la cultura israelí influye en la vida familiar? ¿Cómo?
            frame: En mi opinión, la cultura israelí crea un ambiente ___ y ___, ya que ___. Aunque ___, también ofrece ___.
          - question: ¿Crees que las familias influyen mucho en las decisiones personales hoy en día?
            frame: Las familias pueden influir de manera ___ porque ___. Sin embargo, también pueden ser ___ si ___.
          - question: ¿Cómo sería tu ambiente familiar ideal en el futuro?
            frame: Mi ambiente familiar ideal sería ___ y ___, pero también ___. Me gustaría crear un ambiente ___ para que ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: El árbol profesional de la familia'
        skills: [Adjetivos descriptivos, Conectores lógicos]
        steps:
          - '**Fase 1, preparación individual:** crea un pequeño árbol familiar de hasta tres generaciones: abuelos, padres, tú y (opcional) hijos o familia futura.'
          - 'Para cada persona escribe: su profesión o actividad principal, 2 o 3 adjetivos para describir su personalidad o su manera de trabajar, y una frase sobre la influencia que tuvo en la familia.'
          - '**Mini reto:** encuentra una similitud entre generaciones, una diferencia importante y una influencia positiva o negativa.'
          - '**Fase 2, conversación en parejas:** presenta tu árbol a tu compañero. Tu compañero hace al menos tres preguntas de seguimiento.'
          - 'Responde con frases completas, usa al menos dos conectores y haz una comparación entre generaciones.'
          - '**Fase 3, presentación oral:** cuenta algo interesante sobre tu compañero, con un contraste, una comparación y una conclusión personal.'
        example: |-
          *Mi abuelo era muy trabajador y disciplinado. Gracias a su ejemplo, mi padre se volvió más responsable.*
          *Mi madre es muy independiente, mientras que mi abuela era más tradicional.*
          *Aunque mis padres trabajan en oficinas, yo prefiero un trabajo más creativo.*
        wordBank: [sin embargo, aunque, mientras que, por eso, gracias a, en cambio, por lo tanto]
      - id: act1-tree
        type: discussionQuestions
        title: Mi árbol familiar
        items:
          - question: Mis abuelos
            frame: Mi abuelo / abuela era ___. Era muy ___ y ___. Gracias a su ejemplo, ___.
          - question: Mis padres
            frame: Mi madre / padre es ___. Es ___ y ___, mientras que ___.
          - question: Yo
            frame: Soy ___. Aunque ___, yo ___.
          - question: Mis hijos o mi familia futura (opcional)
            frame: Me gustaría que ___.
      - id: act1-challenge
        type: discussionQuestions
        title: Mini reto
        items:
          - question: Una similitud entre generaciones
            frame: Tanto mi ___ como mi ___ son ___.
          - question: Una diferencia importante
            frame: Mi ___ es ___, mientras que mi ___ es ___.
          - question: Una influencia positiva o negativa
            frame: Gracias a ___, ___. / Por culpa de ___, ___.
      - id: act1-followup
        type: examples
        title: Preguntas de seguimiento sugeridas
        items:
          - text: ¿Hay profesiones similares en tu familia?
          - text: ¿Qué persona te inspira más?
          - text: ¿Qué generación es más tradicional?
          - text: ¿Te gustaría seguir un camino parecido o diferente?
          - text: ¿Qué cualidades familiares admiras más?
          - text: ¿Crees que la personalidad influye en la profesión?
      - id: act1-models
        type: examples
        title: Modelos para la presentación oral
        items:
          - text: La familia de ella valora mucho la estabilidad, mientras que ella prefiere un estilo de vida más flexible.
          - text: Aunque sus padres son muy organizados, él es bastante espontáneo.
          - text: Gracias al ejemplo de su madre, él se volvió más independiente.
          - text: En cambio, él decidió elegir una profesión completamente diferente.
      - id: act2
        type: classActivity
        title: 'Actividad 2: La superniñera visita a mi familia'
        skills: [Adjetivos descriptivos, Conectores lógicos]
        steps:
          - '**Fase 1:** Imagina que eres una superniñera que observa a tu familia durante una semana.'
          - '**Fase 2:** Escribe un informe con: una observación general, una descripción de roles, un aspecto a mejorar (rutina, comunicación, tareas, uso del celular, puntualidad), una solución con un verbo en condicional (*recomendaría, podría, debería*) y un cierre positivo.'
          - '**Fase 3:** Presenta tu informe. Tu compañero añade otra sugerencia con un verbo en condicional.'
          - '**Fase 4:** Discusión en grupo.'
        example: |-
          *Esta es una familia cariñosa pero ligeramente caótica.*
          *La madre es extremadamente organizada, mientras que el padre es relajado pero distraído.*
          *Recomendaría establecer reglas más claras, porque esto podría reducir los conflictos.*
          *A pesar de algunas dificultades, la familia es unida y leal.*
      - id: act2-report
        type: discussionQuestions
        title: Mi informe de superniñera
        items:
          - question: Observación general
            frame: Esta es una familia ___ pero ___.
          - question: Descripción de roles
            frame: La madre es ___, mientras que el padre es ___.
          - question: Un aspecto a mejorar
            frame: Un problema de esta familia es ___.
          - question: Una solución
            frame: Recomendaría ___, porque esto podría ___.
          - question: Cierre positivo
            frame: A pesar de ___, la familia es ___.
      - id: act2-discussion
        type: discussionQuestions
        title: Discusión
        items:
          - question: ¿Por qué es más fácil juzgar a otras familias?
            frame: Creo que es más fácil porque ___.
          - question: ¿Las redes sociales muestran una imagen realista de las familias?
            frame: En mi opinión, ___; sin embargo, ___.
      - id: act3
        type: classActivity
        title: 'Actividad 3: Brecha generacional'
        skills: [Conectores lógicos, Adjetivos descriptivos]
        steps:
          - '**Fase 1, lluvia de ideas:** ¿Qué es una brecha generacional? ¿Qué la causa? ¿Cómo influyen la tecnología y los valores?'
          - '**Fase 2:** Mira el video. Anota una similitud, una diferencia y dos adjetivos para cada persona.'
          - '**Fase 3:** Discusión. Usa *mientras que, sin embargo, aunque, por lo tanto* y comparativos (*más… que, menos… que*).'
          - '**Fase 4:** Presenta una similitud y una diferencia con una frase compleja.'
        example: '*Mi generación es más abierta que la de mis padres; sin embargo, también es más estresada.*'
      - id: act3-questions
        type: discussionQuestions
        title: Discusión
        items:
          - question: ¿Has hablado con alguien mucho mayor o mucho más joven que tú?
            frame: Sí, he hablado con ___, que es ___. Aunque ___, ___.
          - question: ¿Tu generación es más abierta o más estresada?
            frame: Mi generación es más ___ que ___, mientras que ___.
          - question: ¿Qué estereotipos te molestan?
            frame: Me molesta el estereotipo de que ___, porque ___.
          - question: Una similitud y una diferencia
            frame: Tanto ___ como ___ son ___. Sin embargo, ___, mientras que ___.
      - id: act4
        type: classActivity
        title: 'Actividad 4: Relaciones entre hermanos'
        skills: [Adjetivos descriptivos, Conectores lógicos]
        steps:
          - '**Fase 1:** Escucha el audio. Anota una descripción positiva, un estereotipo y una expresión.'
          - '**Fase 2, comprensión:** ¿Cómo se describe la relación? ¿Qué significa la expresión?'
          - '**Fase 3:** Discusión con adjetivos emocionales y conectores.'
          - '**Fase 4:** ¿Las relaciones entre hermanos mejoran con la edad?'
        example: '*Aunque discutimos mucho, nos apoyamos en momentos difíciles.*'
      - id: act4-questions
        type: discussionQuestions
        title: Discusión
        items:
          - question: ¿Te llevas bien con tus hermanos?
            frame: Me llevo ___ con ___. Aunque ___, ___.
          - question: ¿Cumples el estereotipo (de hermano mayor, menor o del medio)?
            frame: Sí / No, porque ___.
          - question: ¿Son útiles los estereotipos?
            frame: Creo que ___, ya que ___.
          - question: ¿Las relaciones entre hermanos mejoran con la edad?
            frame: Con la edad, ___; por lo tanto, ___.
      - id: act5
        type: classActivity
        title: 'Actividad 5: Debate'
        skills: [Conectores lógicos, Adjetivos descriptivos]
        steps:
          - 'Dividan la clase en dos grupos. **Grupo 1:** La lealtad familiar es el valor más importante. **Grupo 2:** La independencia personal debe tener prioridad.'
          - Cada grupo prepara al menos 3 argumentos, con conectores lógicos y adjetivos descriptivos.
          - Debate entre los dos grupos.
          - 'Conclusión: discusión abierta.'
        example: '*La lealtad familiar es fundamental, porque garantiza estabilidad emocional. Sin embargo, una presión excesiva puede resultar limitante.*'
      - id: act5-arguments
        type: discussionQuestions
        title: Nuestros argumentos
        items:
          - question: 'Argumento 1:'
            frame: ___ es fundamental, porque ___.
          - question: 'Argumento 2:'
            frame: Además, ___. Por lo tanto, ___.
          - question: 'Argumento 3:'
            frame: Aunque ___, ___.
          - question: '¿Es posible mantener vínculos familiares fuertes sin sacrificar la libertad personal?'
            frame: Creo que ___, siempre que ___.
      - id: act6
        type: classActivity
        title: 'Actividad 6: Entrevista familiar entre compañeros'
        skills: [Conectores lógicos, Adjetivos descriptivos]
        minutes: 20
        steps:
          - '**Paso 1:** Trabajen en parejas.'
          - '**Paso 2:** El estudiante A elige una pregunta de la lista y entrevista al estudiante B. B responde con frases completas y ejemplos. A hace al menos una pregunta de seguimiento. Después cambian de rol.'
          - 'Reglas: desarrolla tus respuestas, justifica tus opiniones, compara generaciones o experiencias y reacciona con naturalidad.'
          - '**Paso 3:** Después de cada respuesta, el compañero hace al menos una pregunta adicional (*¿Por qué? ¿Puedes darme un ejemplo? ¿Eso siempre fue así? ¿Estás de acuerdo con eso? ¿Te gustaría cambiarlo?*).'
          - '**Paso 4, resumen oral:** cada estudiante presenta una idea interesante sobre su compañero.'
        example: |-
          *Aunque su familia es bastante tradicional, él tiene una visión más moderna.*
          *Ella explicó que las expectativas familiares pueden ser positivas, pero también estresantes.*
          *Lo que más me llamó la atención fue…*
      - id: act6-questions
        type: discussionQuestions
        title: Preguntas de la entrevista
        items:
          - question: ¿Cómo describirías el ambiente en tu familia?
          - question: ¿Tu familia es más tradicional o más moderna?
          - question: ¿Qué diferencias notas entre tu generación y la de tus padres?
          - question: ¿Qué valores familiares son más importantes para ti?
          - question: ¿Crees que las familias israelíes han cambiado en los últimos años?
          - question: ¿Las familias influyen demasiado en las decisiones personales?
          - question: ¿Qué opinas sobre los adultos que siguen viviendo con sus padres?
          - question: ¿Las familias israelíes son demasiado protectoras?
          - question: ¿Qué aspecto de la cultura familiar israelí cambiarías?
          - question: ¿Crees que la independencia personal es más importante que la cercanía familiar?
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Conectores lógicos** y **Adjetivos
          descriptivos**; las seis actividades practican las dos. Elige dos o tres según el
          tiempo. El cuaderno enlaza una presentación en gamma.app («Familia, Generaciones
          y Relaciones»); no se incluye aquí porque ese sitio no está permitido. Si la usas,
          ábrela por tu cuenta.
      - id: n-intro
        anchor: intro
        text: Da tu propio ejemplo primero y después pregunta a cada estudiante.
      - id: n-warmup
        anchor: warmup
        text: Haz al menos dos preguntas a cada estudiante. Pide que usen los adjetivos y los conectores de las frases modelo.
      - id: n-act1
        anchor: act1
        text: >-
          Modalidad: trabajo individual → trabajo en parejas → presentación oral. Escribe
          en la pizarra los conectores sugeridos: *sin embargo, aunque, mientras que, por
          eso, gracias a, en cambio, por lo tanto.*
      - id: n-act2
        anchor: act2
        text: >-
          Modalidad: escritura individual → comparación en parejas → discusión. Recuerda que
          *recomendaría, podría, debería* van seguidos de infinitivo.
      - id: n-act3
        anchor: act3
        text: >-
          Modalidad: lluvia de ideas → video → discusión → compartir. El cuaderno no indica
          qué video usar: elige antes de la clase un video corto en español sobre la brecha
          generacional (por ejemplo, en YouTube).
      - id: n-act4
        anchor: act4
        text: >-
          Modalidad: escucha → comprensión → discusión. El cuaderno no incluye el audio:
          elige antes de la clase un audio o video corto sobre las relaciones entre
          hermanos que tenga una descripción positiva, un estereotipo y una expresión.
      - id: n-act5
        anchor: act5
        text: 'Modalidad: división en grupos → preparación de argumentos → debate. Corrige el uso de los conectores al final.'
      - id: n-act6
        anchor: act6
        minutes: 20
        text: Duración aproximada en el cuaderno, 20 a 25 minutos. Circula entre las parejas y anota errores para comentarlos al final.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: familia-y-generaciones-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-adjetivos
        type: ruleSummary
        skill: Adjetivos descriptivos
        rules:
          - text: 'Usamos adjetivos para describir a personas (carácter, cualidades), dinámicas familiares o sociales, y emociones. Un nivel básico usa *bueno*; un nivel más avanzado usa *solidario, resiliente, independiente, exigente*.'
            examples: [Mi familia es buena. → Mi familia es muy unida y solidaria.]
          - text: 'El adjetivo va después de **ser** o de verbos como **parecer**, o después del sustantivo.'
            examples:
              [Mi madre es organizada., La situación parece complicada., Una familia tradicional.]
          - text: '**Concordancia:** el adjetivo concuerda en género y número con el sustantivo. Los adjetivos en *-o* cambian a *-a*; los adjetivos en *-or* añaden *-a*; los adjetivos en *-e* o en consonante (*tradicional, flexible*) no cambian con el género, solo con el número.'
            examples:
              [
                'Mi padre es organizado. / Mi madre es organizada.',
                'Mi abuelo es protector. / Mi abuela es protectora.',
                'una familia tradicional / unas familias tradicionales',
              ]
          - text: '**Intensificadores:** *muy, extremadamente, particularmente, bastante, un poco*.'
            examples:
              [
                La madre es extremadamente organizada.,
                Mi familia es bastante tradicional.,
                'A veces puede ser un poco caótica.',
              ]
          - text: '**Comparar:** *más / menos* + adjetivo + *que*; *tan* + adjetivo + *como*.'
            examples:
              [
                Mi generación es más abierta que la de mis padres.,
                Mis padres son menos flexibles que yo.,
                Mi hermana es tan responsable como mi madre.,
              ]
      - id: adjetivos-table
        type: table
        caption: Concordancia de los adjetivos
        header:
          [Terminación, Masculino singular, Femenino singular, Masculino plural, Femenino plural]
        rows:
          - [-o, organizado, organizada, organizados, organizadas]
          - [-or, protector, protectora, protectores, protectoras]
          - [-e, exigente, exigente, exigentes, exigentes]
          - [consonante, tradicional, tradicional, tradicionales, tradicionales]
      - id: rules-conectores
        type: ruleSummary
        skill: Conectores lógicos
        rules:
          - text: 'Los conectores unen ideas y nos ayudan a construir frases complejas y claras.'
          - text: '**Adición:** *y, además, también*.'
            examples: ['Mi familia es unida. Además, es muy solidaria.']
          - text: '**Contraste:** *pero, sin embargo, aunque, mientras que, en cambio, a pesar de*. Para contrastar dos personas o ideas usamos *mientras que* (*mientras* solo indica tiempo).'
            examples:
              [
                'Mi madre es muy independiente, mientras que mi abuela era más tradicional.',
                'Aunque discutimos mucho, nos apoyamos en momentos difíciles.',
                'A pesar de algunas dificultades, la familia es unida y leal.',
              ]
          - text: '**Causa:** *porque, ya que, puesto que, gracias a* (+ sustantivo).'
            examples:
              [
                'La lealtad familiar es fundamental, porque garantiza estabilidad emocional.',
                'Gracias a su ejemplo, mi padre se volvió más responsable.',
              ]
          - text: '**Consecuencia:** *entonces, por eso, por lo tanto*.'
            examples: ['Mis padres son muy exigentes; por lo tanto, aprendí a ser responsable.']
          - text: '**Secuencia:** *primero, luego, finalmente*.'
            examples: ['Primero hablamos, luego discutimos y finalmente llegamos a un acuerdo.']
          - text: 'Con *sin embargo* y *por lo tanto* usamos una coma después: *Sin embargo, …* / *; por lo tanto, …*'
      - id: conectores-table
        type: table
        caption: Conectores lógicos
        header: [Función, Conectores]
        rows:
          - [Adición, 'y, además, también']
          - [Contraste, 'pero, sin embargo, aunque, mientras que, en cambio, a pesar de']
          - [Causa, 'porque, ya que, puesto que, gracias a']
          - [Consecuencia, 'entonces, por eso, por lo tanto']
          - [Secuencia, 'primero, luego, finalmente']
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos habilidades con el grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: familia-y-generaciones-tarea
    title: Tarea
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea
      - id: classic-title
        type: heading
        level: 3
        text: Práctica escrita
      - id: classic-goal
        type: text
        text: 'Objetivo: practicar los adjetivos avanzados, los conectores lógicos y las comparaciones, por escrito y en voz alta.'
      - id: part1
        type: discussionQuestions
        title: 'Parte 1: Completa y amplía'
        items:
          - question: Completa la frase y añade una segunda idea con un conector.
            frame: Mi familia es bastante ___, pero ___.
          - question: Completa la frase y añade una segunda idea con un conector.
            frame: Mi madre es ___ porque ___.
          - question: Completa la frase y añade una segunda idea con un conector.
            frame: Aunque mi familia es ___, también ___.
          - question: Completa la frase y añade una segunda idea con un conector.
            frame: En mi familia, la comunicación es ___; por lo tanto, ___.
          - question: Completa la frase y añade una segunda idea con un conector.
            frame: Mi generación es más ___ que la de mis padres, mientras que ellos ___.
      - id: part2
        type: discussionQuestions
        title: 'Parte 2: Elige y justifica'
        items:
          - question: 'Mi familia es: a) tradicional, b) moderna. Elige y explica por qué (mínimo 2 frases).'
            frame: Mi familia es ___ porque ___. Además, ___.
          - question: 'En mi familia hay más: a) independencia, b) presión. Elige y explica por qué (mínimo 2 frases).'
            frame: En mi familia hay más ___, ya que ___.
          - question: 'Me parezco más a: a) mis padres, b) mis abuelos. Elige y explica por qué (mínimo 2 frases).'
            frame: Me parezco más a ___ porque ___. Sin embargo, ___.
      - id: part3
        type: discussionQuestions
        title: 'Parte 3: Reescribe mejor'
        items:
          - question: Mi familia es buena.
            frame: 'Ejemplo: Mi familia es muy unida y solidaria, aunque a veces puede ser exigente.'
          - question: Mis padres trabajan mucho.
          - question: Yo hablo con mi familia.
          - question: Mi hermano es inteligente.
      - id: part4
        type: discussionQuestions
        title: 'Parte 4: Mini producción'
        items:
          - question: 'Escribe 6 a 8 frases sobre tu familia y otra familia que conoces. Incluye 2 comparaciones (*más… que / menos… que*), 3 conectores diferentes y 3 adjetivos avanzados.'
      - id: mori-title
        type: heading
        level: 3
        text: Tarea con Mori (práctica oral)
      - id: how
        type: text
        text: Abre el chat con Mori, copia un mensaje y envíalo. Mori te hará preguntas y corregirá tus errores al momento.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Actividad 1: Preguntas rápidas'
        intro: 'Meta: responder al menos 10 preguntas.'
        message: >-
          Hola Mori, hazme preguntas rápidas sobre mi familia. Quiero responder usando
          frases completas con conectores como pero, aunque, porque y mientras que. Corrige
          mis errores inmediatamente y hazme repetir la frase correctamente.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Actividad 2: Comparaciones reales'
        intro: 'Meta: hacer al menos 5 comparaciones.'
        message: >-
          Mori, ayúdame a comparar mi familia con otra familia. Hazme preguntas para usar
          estructuras como más… que, menos… que y mientras que. Corrige mis errores y dame
          una mejor versión de mi respuesta.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Actividad 3: Opinión y reacción'
        intro: 'Meta: responder a 5 opiniones.'
        message: >-
          Mori, dame opiniones sobre la familia (por ejemplo: «La familia debe ser
          tradicional»). Yo quiero responder con mi opinión usando conectores como sin
          embargo, porque y aunque. Corrige mis errores y ayúdame a mejorar la respuesta.
      - id: mori-4
        type: aiTutorPrompt
        title: 'Actividad 4: Corrección activa'
        intro: 'Después, escribe 5 frases sobre tu familia.'
        message: Mori, voy a escribir frases sobre mi familia. Corrige todos mis errores, explícalos brevemente y dame una versión mejor.
      - id: extra
        type: callout
        tone: info
        title: Extra (opcional)
        text: Grábate hablando 1 minuto sobre tu familia. Después, escribe lo que dijiste y corrígelo con Mori.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**

