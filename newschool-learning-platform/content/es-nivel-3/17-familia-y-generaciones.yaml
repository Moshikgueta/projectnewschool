vocabulary:
  - slug: familia-y-generaciones
    title: Familia, generaciones y relaciones
    items: *familia-y-generaciones-words

activities:
  - slug: familia-y-generaciones-conectores
    title: 'Conectores lógicos: aunque, mientras que, por lo tanto'
    minutes: 8
    items:
      - id: mientras-que
        type: multipleChoice
        prompt: Mi madre es muy independiente, ___ mi abuela era más tradicional.
        options:
          - { text: mientras que, correct: true }
          - {
              text: por lo tanto,
              feedback: '*Por lo tanto* expresa consecuencia. Aquí comparamos dos personas diferentes: *mientras que*.',
            }
          - {
              text: porque,
              feedback: '*Porque* expresa causa. Para contrastar dos personas usamos *mientras que*.',
            }
      - id: gracias-a
        type: fillBlank
        prompt: Completa con un conector de dos palabras que expresa una causa positiva.
        text: ___ su ejemplo, mi padre se volvió más responsable.
        blanks: [[Gracias a, gracias a]]
      - id: une-funciones
        type: matching
        prompt: Une cada conector con su función.
        pairs:
          - [además, adición]
          - [sin embargo, contraste]
          - [ya que, causa]
          - [por lo tanto, consecuencia]
          - [finalmente, secuencia]
      - id: aunque-contraste
        type: trueFalse
        prompt: '*Aunque* expresa contraste: *Aunque discutimos mucho, nos apoyamos en momentos difíciles.*'
        answer: true
        feedback:
          correct: ¡Correcto! *Aunque* une dos ideas que contrastan.
          incorrect: '*Aunque* es un conector de contraste, como *pero* y *sin embargo*.'
      - id: por-lo-tanto
        type: multipleChoice
        prompt: Mis padres son muy exigentes; ___, aprendí a ser responsable.
        options:
          - { text: por lo tanto, correct: true }
          - {
              text: aunque,
              feedback: 'Aprender a ser responsable es una consecuencia, no un contraste: *por lo tanto*.',
            }
          - {
              text: mientras que,
              feedback: '*Mientras que* compara dos cosas diferentes. Aquí hay una consecuencia: *por lo tanto*.',
            }
      - id: unida-aunque
        type: fillBlank
        prompt: Completa con un conector de contraste de una palabra.
        text: Mi familia es muy unida, ___ a veces puede ser exigente.
        blanks: [[aunque, pero]]
      - id: porque-lealtad
        type: multipleChoice
        prompt: La lealtad familiar es fundamental, ___ garantiza estabilidad emocional.
        options:
          - { text: porque, correct: true }
          - {
              text: sin embargo,
              feedback: 'La segunda parte explica la razón, no un contraste: usamos un conector de causa, *porque*.',
            }
          - {
              text: en cambio,
              feedback: '*En cambio* expresa contraste. Aquí damos la razón: *porque*.',
            }
      - id: ordena-aunque
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Aunque discutimos mucho, nos apoyamos.

  - slug: familia-y-generaciones-adjetivos
    title: 'Adjetivos descriptivos: concordancia y comparación'
    minutes: 8
    items:
      - id: organizada
        type: multipleChoice
        prompt: Mi madre es muy ___.
        options:
          - { text: organizada, correct: true }
          - {
              text: organizado,
              feedback: 'El adjetivo concuerda con *madre* (femenino): *organizada*.',
            }
          - { text: organizadas, feedback: '*Madre* es singular: *organizada*, sin *-s*.' }
      - id: tradicionales
        type: fillBlank
        prompt: Completa con el adjetivo *tradicional* en la forma correcta.
        text: Mis abuelos son muy ___.
        blanks: [[tradicionales]]
      - id: une-adjetivos
        type: matching
        prompt: Une cada adjetivo con su significado.
        pairs:
          - [exigente, pide mucho a los demás]
          - [testarudo, nunca cambia de opinión]
          - [solidario, ayuda y apoya a los demás]
          - [flexible, se adapta fácilmente a los cambios]
          - [reservado, no habla mucho de sus sentimientos]
      - id: posicion
        type: trueFalse
        prompt: 'En español, el adjetivo descriptivo normalmente va después del sustantivo: *una familia tradicional*.'
        answer: true
        feedback:
          correct: ¡Correcto! Decimos *una familia tradicional*, *un padre exigente*.
          incorrect: 'Normalmente el adjetivo va después del sustantivo: *una familia tradicional* (no *una tradicional familia*).'
      - id: independientes
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: Mis hermanas son muy independientes., correct: true }
          - {
              text: Mis hermanas son muy independiente.,
              feedback: '*Hermanas* es plural: el adjetivo también va en plural, *independientes*.',
            }
          - {
              text: Mis hermanas son muy independientas.,
              feedback: 'Los adjetivos en *-e* no cambian con el género: *independiente / independientes*.',
            }
      - id: protectora
        type: fillBlank
        prompt: Completa con el adjetivo *protector* en la forma correcta.
        text: Mi padre es protector y mi madre también es muy ___.
        blanks: [[protectora]]
      - id: tan-como
        type: multipleChoice
        prompt: 'Mi hermana y mi madre son igual de responsables: mi hermana es ___ responsable ___ mi madre.'
        options:
          - { text: tan… como, correct: true }
          - {
              text: más… como,
              feedback: 'Con *más* usamos *que* (*más… que*). Para decir que son iguales usamos *tan… como*.',
            }
          - { text: tan… que, feedback: 'Para comparar dos cosas iguales decimos *tan… como*.' }
      - id: ordena-unida
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Mi familia es muy unida y solidaria.
        alsoAccept: [Mi familia es muy solidaria y unida]
