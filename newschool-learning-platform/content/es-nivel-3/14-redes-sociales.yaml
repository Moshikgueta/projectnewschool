vocabulary:
  - slug: redes-sociales
    title: Redes sociales
    items: *redes-sociales-words

activities:
  - slug: redes-sociales-pasiva
    title: 'Voz pasiva: ha sido compartido'
    minutes: 8
    items:
      - id: compartido
        type: multipleChoice
        prompt: Un meme ha sido ___ por millones de usuarios.
        options:
          - { text: compartido, correct: true }
          - {
              text: compartida,
              feedback: 'En la voz pasiva el participio concuerda con el sujeto: *meme* es masculino, *compartido*.',
            }
          - { text: compartir, feedback: 'Después de *ha sido* va el participio: *compartido*.' }
      - id: comentadas
        type: fillBlank
        prompt: Completa con el participio de *comentar*.
        text: Las fotos han sido ___ cientos de veces.
        blanks: [[comentadas]]
      - id: cual-pasiva
        type: multipleChoice
        prompt: ¿Qué oración está en voz pasiva?
        options:
          - { text: El video ha sido eliminado de YouTube., correct: true }
          - {
              text: He eliminado el video.,
              feedback: 'Esta oración es activa: dice quién lo hizo (yo). La pasiva usa *ser* + participio: *ha sido eliminado*.',
            }
          - {
              text: YouTube elimina muchos videos.,
              feedback: 'Esta oración es activa y está en presente. La pasiva usa *ser* + participio: *ha sido eliminado*.',
            }
      - id: concuerda
        type: trueFalse
        prompt: 'En la voz pasiva, el participio concuerda con el sujeto: *Una campaña fue difundida.*'
        answer: true
        feedback:
          correct: ¡Correcto! *una campaña → difundida*, *los videos → vistos*.
          incorrect: 'Con *ser*, el participio cambia con el sujeto: *una campaña fue difundida*, *los videos fueron vistos*.'
      - id: fue
        type: fillBlank
        prompt: Completa con el verbo *ser* en pretérito indefinido.
        text: Una campaña solidaria ___ difundida en X la semana pasada.
        blanks: [[fue]]
      - id: activa-pasiva
        type: matching
        prompt: Une cada oración activa con su forma en voz pasiva.
        pairs:
          - [
              Los creadores han criticado el algoritmo.,
              El algoritmo ha sido criticado por los creadores.,
            ]
          - [
              Muchos usuarios han malinterpretado la publicación.,
              La publicación ha sido malinterpretada por muchos usuarios.,
            ]
          - [
              TikTok ha introducido una nueva función.,
              Una nueva función ha sido introducida por TikTok.,
            ]
          - [
              Millones de personas han visto los videos.,
              Los videos han sido vistos por millones de personas.,
            ]
      - id: se-han
        type: multipleChoice
        prompt: Se ___ compartido muchas noticias falsas.
        options:
          - { text: han, correct: true }
          - {
              text: ha,
              feedback: 'Con la pasiva con *se*, el verbo concuerda con la cosa: *noticias* es plural, *se han compartido*.',
            }
          - {
              text: hemos,
              feedback: 'La pasiva con *se* usa la 3.ª persona: *se han compartido noticias*.',
            }
      - id: ordena-meme
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Un meme ha sido compartido millones de veces.

  - slug: redes-sociales-perfecto
    title: 'Pretérito perfecto: he publicado, has visto'
    minutes: 8
    items:
      - id: he-publicado
        type: multipleChoice
        prompt: Esta semana yo ___ muchas fotos en Instagram.
        options:
          - { text: he publicado, correct: true }
          - {
              text: ha publicado,
              feedback: '*Ha* es para él / ella. Para *yo* usa *he publicado*.',
            }
          - {
              text: he publicar,
              feedback: 'Después de *haber* va el participio (-ado / -ido): *he publicado*.',
            }
      - id: has-visto
        type: fillBlank
        prompt: Completa con el verbo *haber* (tú).
        text: ¿___ visto el último video viral en TikTok?
        blanks: [[Has, has, Tú has, tú has]]
      - id: participios
        type: matching
        prompt: Une cada verbo con su participio.
        pairs:
          - [ver, visto]
          - [hacer, hecho]
          - [escribir, escrito]
          - [publicar, publicado]
          - [compartir, compartido]
      - id: no-cambia
        type: trueFalse
        prompt: 'En el pretérito perfecto, el participio cambia con el sujeto: *Ella ha publicada un video.*'
        answer: false
        feedback:
          correct: '¡Correcto! Con *haber*, el participio no cambia: *Ella ha publicado un video.*'
          incorrect: 'Con *haber*, el participio siempre termina en *-o*: *Ella ha publicado un video.*'
      - id: han-cambiado
        type: fillBlank
        prompt: Completa con el verbo *cambiar* en pretérito perfecto.
        text: Mis amigos ___ su foto de perfil varias veces.
        blanks: [[han cambiado]]
      - id: nadie
        type: multipleChoice
        prompt: '¿Has conocido a alguien importante gracias a las redes sociales? — No, ___.'
        options:
          - { text: no he conocido a nadie, correct: true }
          - {
              text: no he conocido a alguien,
              feedback: 'En una oración negativa usamos *nadie*: *No he conocido a nadie.*',
            }
          - {
              text: no he conocí a nadie,
              feedback: 'Después de *he* va el participio: *conocido*.',
            }
      - id: hemos
        type: multipleChoice
        prompt: En los últimos años, nosotros ___ pasado demasiado tiempo en redes sociales.
        options:
          - { text: hemos, correct: true }
          - {
              text: han,
              feedback: '*Han* es para ellos / ellas / ustedes. Para *nosotros* usa *hemos*.',
            }
          - { text: habemos, feedback: 'La forma de *haber* para *nosotros* es *hemos*.' }
      - id: ordena-visto
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: ¿Has visto el último video viral?
