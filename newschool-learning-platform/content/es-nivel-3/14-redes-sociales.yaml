# Cycle "Redes sociales", converted from the Spanish nivel 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-3
slug: redes-sociales
title: Redes sociales
goal: Hablar de experiencias recientes con el pretérito perfecto y contar noticias con la voz pasiva.
position: 14
status: in_review

review:
  - >-
    The two workbook exercises ("Pretérito perfecto" and "Voz pasiva") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's two
    skills, its summary rules, the activity examples and its vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    Skill name: "Presente perfecto" (calque of the English "present perfect") is
    called "Pretérito perfecto" everywhere, as in the level 2 course.
  - >-
    Summary, pretérito perfecto: added how to form the participle (-ar → -ado, -er /
    -ir → -ido), the common irregular participles (visto, hecho, escrito, puesto,
    dicho, abierto, vuelto, roto), the time markers (hoy, esta semana, últimamente,
    alguna vez, nunca, ya, todavía no) and the rule that the participle does not
    change after haber (ella ha publicado, not "publicada"). A table of haber was
    kept and the conjugation of publicar / ver was added.
  - >-
    Summary, voz pasiva: added that the participle agrees with the subject in gender
    and number (un meme ha sido compartido / las fotos han sido comentadas), and a
    rule on the "pasiva con se" (se ha compartido una noticia / se han compartido
    noticias), because the cycle uses it ("Se ha introducido una nueva función", "Se
    han compartido noticias falsas") and it is the usual passive in everyday Spanish;
    the passive with ser is mostly for news and formal texts. Please confirm.
  - >-
    Corrections: Activity 1 "Un informe reciente ha sido publicado que muestra…" (the
    relative clause is separated from its noun) → "Ha sido publicado un informe
    reciente que muestra…"; Activity 4 "¿Qué comentarios negativos han sido recibidos
    en tus publicaciones?" (unnatural passive of recibir) → "¿Qué comentarios
    negativos se han escrito en tus publicaciones?"; Mori "repíteme otra pregunta
    parecida" → "hazme otra pregunta parecida"; a missing full stop in the last
    Activity 2 clue. Stray characters ("I" before "Nivel", "ð¹" before headings) and
    the asterisk debris around Activities 3 and 4 were removed. "Twitter" was changed
    to "X" in the examples (the platform's current name); Activity 1 keeps "X /
    Twitter".
  - >-
    The source gives no plan saying which activity practises which skill. The plan
    note now says: Activities 1 and 3 practise the voz pasiva, Activity 2 the
    pretérito perfecto, Activity 4 both. Please confirm.
  - >-
    Times recorded as the upper value of each range: Activity 3 (3 + 10 + 8 + 5
    optional + 5 = 31 min), Activity 4 (5 + 5 + 12 + 5 + 10 = 37 min). Activity 1
    gives only the report time (max. 3 min) and Activity 2 only the search time (10
    min). Activities 3 and 4 need headlines and role cards prepared by the teacher
    (not in the notebook).
  - >-
    Mori: the source has 19 short lines to send to Mori in five groups. The three
    topic groups and the extra group are now four messages; the "Prompts generales"
    (corrige mis errores, dame un ejemplo, dime si mi respuesta es natural) are in the
    tips callout.
  - >-
    Vocabulary: "Publicación, פרסום" → "פוסט / פרסום"; "Noticia, חדשות" → "ידיעה /
    חדשה" (noticia is singular); "Seguidor, עוקב" kept. The "#" and "**Español**"
    header debris of the source table was removed. Please confirm.
  - >-
    The "Respuesta de alumno 1/2/3" lines are replaced by the answer boxes. The
    Quizlet link is kept as in the source.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: redes-sociales-clase
    title: 'Clase: Redes sociales'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Redes sociales
      - id: skills
        type: cycleOverview
        skills:
          - name: Voz pasiva
            description: '*Ser* + participio: *Un meme ha sido compartido millones de veces. Se han compartido noticias falsas.*'
          - name: Pretérito perfecto
            description: '*Haber* + participio: *He publicado muchas fotos. ¿Has visto el último video viral?*'
      - id: quizlet
        type: externalLink
        label: Redes sociales en Quizlet
        url: https://quizlet.com/il/887935532/extreme-spanish-social-media-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___ y creo que las redes sociales han mejorado / empeorado / cambiado nuestras vidas.
        example: Soy Marta y creo que las redes sociales han cambiado nuestras vidas para bien y para mal.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup-perfecto-title
        type: heading
        level: 4
        text: Pretérito perfecto
      - id: warmup-perfecto
        type: discussionQuestions
        items:
          - question: ¿Has cambiado tu rutina diaria por culpa de las redes sociales?
            frame: Sí, la he cambiado porque ___. / No, no la he cambiado porque ___.
          - question: ¿Has conocido a alguien importante gracias a las redes sociales?
            frame: Sí, he conocido a ___. / No, no he conocido a nadie.
          - question: ¿Qué publicaciones has compartido últimamente?
            frame: He compartido fotos / artículos / videos de ___.
      - id: warmup-pasiva-title
        type: heading
        level: 4
        text: Voz pasiva
      - id: warmup-pasiva
        type: discussionQuestions
        items:
          - question: ¿Cómo se promueve la inclusión en las redes sociales?
            frame: La inclusión se promueve con campañas, hashtags, videos ___.
          - question: ¿Qué noticias falsas han sido compartidas en redes sociales recientemente?
            frame: Se han compartido noticias falsas sobre ___.
          - question: ¿Qué cambios importantes han sido introducidos en tus plataformas favoritas?
            frame: En Instagram ha sido introducida una nueva función que ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Las tendencias'
        skills: [Voz pasiva]
        steps:
          - 'En grupos pequeños: cada grupo recibe una plataforma (Instagram, TikTok, YouTube, X / Twitter…).'
          - Busquen o imaginen **5 novedades recientes** de su plataforma y escríbanlas en **voz pasiva** con el banco de estructuras.
          - Presenten un informe oral breve (máximo 3 minutos).
      - id: act1-bank
        type: examples
        title: Banco de estructuras (voz pasiva)
        items:
          - text: Se ha introducido una nueva función que permite…
          - text: Ha sido compartida una publicación que…
          - text: En 2025 fue implementada una política que…
          - text: La inteligencia artificial ha sido utilizada para…
          - text: Ha sido publicado un informe reciente que muestra…
      - id: act1-findings
        type: discussionQuestions
        title: Nuestras 5 novedades
        items:
          - question: Novedad 1
            frame: Se ha introducido ___.
          - question: Novedad 2
            frame: Ha sido compartida ___.
          - question: Novedad 3
            frame: Fue implementada ___.
          - question: Novedad 4
            frame: Ha sido utilizada ___.
          - question: Novedad 5
            frame: Ha sido publicado ___.
      - id: act2
        type: classActivity
        title: 'Actividad 2: Búsqueda del tesoro en las redes sociales'
        skills: [Pretérito perfecto]
        minutes: 10
        steps:
          - Lee la lista de pistas de abajo.
          - 'Tienes 10 minutos: recuerda o busca ejemplos reales de tu uso de las redes sociales. No necesitas mostrar la pantalla, solo contarlo.'
          - Ganas un punto cada vez que completas una frase con el pretérito perfecto.
      - id: act2-clues
        type: discussionQuestions
        title: Banco de pistas
        items:
          - question: He encontrado una publicación que ha sido compartida más de 500 veces.
            frame: He encontrado una publicación de ___ que ___.
          - question: He visto un video que ha sido comentado más de 50 veces.
            frame: He visto un video de ___.
          - question: He leído un post que me ha molestado mucho porque…
            frame: He leído un post que me ha molestado mucho porque ___.
          - question: He escuchado una canción en YouTube que ha sido reproducida millones de veces.
            frame: He escuchado ___.
          - question: He encontrado un meme que ha sido usado en diferentes contextos.
            frame: He encontrado un meme sobre ___.
      - id: act3
        type: classActivity
        title: 'Actividad 3: Debate rápido, noticias virales'
        skills: [Voz pasiva]
        minutes: 31
        steps:
          - 'Lee los titulares virales que muestra tu profesor. Por ejemplo: *Un meme ha sido compartido más de 3 millones de veces. Una nueva función ha sido introducida en TikTok esta semana. Una celebridad ha sido criticada en X por sus comentarios. Un video ha sido eliminado de YouTube por infringir las normas.*'
          - 'En parejas: cada pareja recibe 2 o 3 titulares. Reaccionen a cada uno con **al menos una frase en voz pasiva + un comentario de opinión**.'
          - 'Debate en grupo: cada pareja comparte la noticia que más le sorprendió y cómo reaccionó. Los demás añaden reacciones en voz pasiva.'
          - 'Opcional: inventen su propio titular viral en voz pasiva (*Una nueva app ha sido descargada por millones de estudiantes en 24 horas*). Léanlo a la clase; los demás reaccionan.'
          - 'Conclusión: ¿Crees que la voz pasiva se usa mucho en los titulares de noticias? ¿Por qué?'
        example: |-
          **Pareja A:** *Un influencer ha sido cancelado en Instagram. Creemos que ha sido criticado de forma exagerada.*
          **Pareja B:** *Sí, pero también ha sido apoyado por parte de sus seguidores.*
      - id: act3-models
        type: examples
        title: Modelos de reacción
        items:
          - text: Esa noticia ha sido exagerada por los medios.
          - text: Ese video ha sido visto millones de veces en pocas horas.
          - text: El escándalo ha sido utilizado como publicidad por la marca.
          - text: La publicación ha sido malinterpretada por muchos usuarios.
      - id: act3-headline
        type: discussionQuestions
        title: Mi titular viral
        items:
          - question: Mi titular en voz pasiva
            frame: ___ ha sido ___ por ___.
          - question: ¿Crees que la voz pasiva se usa mucho en los titulares de noticias? ¿Por qué?
            frame: Creo que sí / no, porque ___.
      - id: act4
        type: classActivity
        title: 'Actividad 4: Juego de rol, el influencer entrevistado'
        skills: [Pretérito perfecto, Voz pasiva]
        minutes: 37
        steps:
          - 'Recibe tu tarjeta. **Influencers:** un gamer, una activista ambiental, una modelo de moda, un chef de YouTube, un viajero de TikTok. **Periodistas:** una revista de tecnología, un medio de moda, un periódico serio, un canal juvenil. Piensa cómo vas a adaptar tus preguntas o respuestas a tu rol.'
          - 'El **periodista** prepara 4 o 5 preguntas con el pretérito perfecto y la voz pasiva (mira el banco de preguntas).'
          - 'Hagan la entrevista en parejas. El **influencer** responde siempre con el pretérito perfecto (*He colaborado con…*) y la voz pasiva (*Han sido publicadas críticas sobre mi trabajo, pero…*).'
          - Cambien de rol y hagan una nueva mini-entrevista con al menos 2 preguntas nuevas.
          - Cada pareja prepara un mini resumen oral (2 o 3 frases) para la clase, como un artículo de periódico.
        example: '*Hoy hemos entrevistado a un influencer de viajes. Él ha colaborado con tres agencias y han sido compartidas muchas fotos suyas en Instagram.*'
      - id: act4-questions
        type: discussionQuestions
        title: Banco de preguntas
        items:
          - question: ¿Cuántas colaboraciones has tenido con marcas este año?
            frame: Este año he tenido ___.
          - question: ¿Qué comentarios negativos se han escrito en tus publicaciones?
            frame: Se han escrito comentarios sobre ___.
          - question: ¿Has cambiado tu estilo de contenido en los últimos meses?
            frame: Sí, lo he cambiado porque ___. / No, no lo he cambiado.
          - question: ¿Qué noticias falsas han sido compartidas sobre ti?
            frame: Han sido compartidas noticias falsas sobre ___.
          - question: ¿Has trabajado en campañas sociales o solidarias en el último año?
            frame: Sí, he trabajado en ___. / No, todavía no he trabajado en ___.
          - question: ¿Qué tendencias han sido seguidas por tus seguidores más fieles?
            frame: Mis seguidores han seguido ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Voz pasiva** (Actividades 1 y 3) y
          **Pretérito perfecto** (Actividad 2). La Actividad 4 practica las dos. Las
          preguntas de calentamiento tienen tres preguntas para cada habilidad.
      - id: n-intro
        anchor: intro
        text: Da tu propio ejemplo primero y después pregunta a cada estudiante.
      - id: n-warmup
        anchor: warmup-title
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act1
        anchor: act1
        text: >-
          Divide la clase en grupos pequeños y asigna una plataforma a cada grupo. Cada
          informe dura como máximo 3 minutos.
      - id: n-act2
        anchor: act2
        minutes: 10
        text: Da un punto por cada frase completa y correcta en pretérito perfecto.
      - id: n-act3
        anchor: act3
        minutes: 31
        text: >-
          Prepara titulares virales recientes para mostrar en la pantalla o repartir en
          papel (2 o 3 por pareja). Presentación del tema: 3 minutos. Trabajo en parejas:
          10 minutos. Debate grupal: 8 minutos. Expansión (opcional): 5 minutos.
          Conclusión: 5 minutos. Para cerrar, resume: la voz pasiva pone el foco en el
          hecho o la acción, no en quién lo hizo; por eso es típica en titulares y redes.
      - id: n-act4
        anchor: act4
        minutes: 37
        text: >-
          Prepara tarjetas con identidades de influencers y enfoques de periodistas.
          Preparación de roles: 5 minutos. Preparación de preguntas: 5 minutos.
          Entrevista: 12 minutos. Cambio de roles: 5 minutos. Conclusión: 10 minutos.
          Circula, corrige errores y toma notas para el feedback final. Con grupos
          grandes, haz un panel de prensa: un influencer frente a 3 periodistas; cada
          periodista hace una pregunta distinta y al final el panel hace un breve informe
          para la clase.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: redes-sociales-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-perfecto
        type: ruleSummary
        skill: Pretérito perfecto
        rules:
          - text: 'Usamos el **pretérito perfecto** para experiencias con relevancia en el presente y para cambios recientes o acciones repetidas en nuestra vida.'
            examples:
              - He publicado muchas fotos en Instagram esta semana.
              - ¿Has visto el último video viral en TikTok?
              - Mis amigos han cambiado su foto de perfil varias veces.
              - En los últimos años hemos pasado demasiado tiempo en redes sociales.
          - text: 'Estructura: **haber** (conjugado) + **participio**. El participio se forma así: -ar → **-ado**, -er / -ir → **-ido**.'
            examples: ['publicar → publicado', 'compartir → compartido', 'conocer → conocido']
          - text: 'Algunos participios son irregulares.'
            examples:
              [
                'ver → visto',
                'hacer → hecho',
                'escribir → escrito',
                'poner → puesto',
                'decir → dicho',
                'abrir → abierto',
                'volver → vuelto',
                'romper → roto',
              ]
          - text: 'Con **haber**, el participio no cambia: siempre termina en **-o**.'
            examples:
              [Ella ha publicado un video (no *ha publicada*)., Mis amigas han subido fotos.]
          - text: 'Marcadores típicos: *hoy, esta semana, este año, últimamente, alguna vez, nunca, siempre, ya, todavía no*.'
            examples:
              [
                Últimamente he pasado más tiempo en TikTok.,
                Siempre he usado YouTube para aprender cosas.,
              ]
      - id: haber-table
        type: table
        caption: Pretérito perfecto
        header: [Persona, haber, publicar, ver]
        rows:
          - [yo, he, he publicado, he visto]
          - [tú, has, has publicado, has visto]
          - [él / ella / usted, ha, ha publicado, ha visto]
          - [nosotros / nosotras, hemos, hemos publicado, hemos visto]
          - [vosotros / vosotras, habéis, habéis publicado, habéis visto]
          - [ellos / ellas / ustedes, han, han publicado, han visto]
      - id: rules-pasiva
        type: ruleSummary
        skill: Voz pasiva
        rules:
          - text: 'La **voz pasiva** pone el foco en la **acción** o el **objeto**, no en quién la hace. Es muy común en titulares, noticias y reportes de redes sociales.'
            examples:
              [
                Un meme ha sido compartido por millones de usuarios.,
                El nuevo algoritmo ha sido criticado por los creadores de contenido.,
              ]
          - text: 'Estructura: sujeto + **ser** (en el tiempo adecuado) + **participio** (+ *por* + quién lo hace).'
            examples:
              - Una campaña solidaria fue difundida en X la semana pasada.
              - Las fotos han sido comentadas cientos de veces en Facebook.
          - text: 'En la voz pasiva, el participio **concuerda** con el sujeto en género y número.'
            examples:
              [
                'un meme → compartido',
                'una noticia → compartida',
                'los videos → vistos',
                'las fotos → comentadas',
              ]
          - text: 'Muchas veces no decimos **por quién** porque no es importante: lo relevante es el hecho.'
            examples: [El video ha sido eliminado de YouTube.]
          - text: '**Pasiva con se:** *se* + verbo en 3.ª persona. El verbo concuerda con la cosa: singular o plural. Es la pasiva más común al hablar.'
            examples:
              [Se ha introducido una nueva función., Se han compartido muchas noticias falsas.]
      - id: compare-table
        type: table
        caption: Pretérito perfecto y voz pasiva
        header: [Pretérito perfecto (acción personal), Voz pasiva (el hecho en las redes)]
        rows:
          - [
              He subido tres fotos hoy.,
              Tres fotos han sido subidas a la cuenta oficial de la marca.,
            ]
          - [
              Mis amigos han creado un grupo nuevo en WhatsApp.,
              Un grupo nuevo ha sido creado en WhatsApp.,
            ]
      - id: phrases
        type: examples
        title: Expresiones útiles
        items:
          - text: 'Últimamente he… → Últimamente he pasado más tiempo en TikTok.'
          - text: 'Siempre he… → Siempre he usado YouTube para aprender cosas.'
          - text: 'Ha sido… → Ese post ha sido malinterpretado por los usuarios.'
          - text: 'Han sido… → Muchas noticias falsas han sido compartidas en X.'
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos habilidades con el grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: redes-sociales-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia un mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: mori-perfecto
        type: aiTutorPrompt
        title: 'Pretérito perfecto: experiencias personales'
        intro: 'Ejemplo de pregunta de Mori: *¿Has compartido alguna noticia viral últimamente?*'
        message: >-
          ¡Hola Mori! Quiero practicar el pretérito perfecto sobre las redes sociales.
          Pregúntame si he publicado o compartido algo, si he cambiado mi foto de perfil
          y si he conocido personas gracias a las redes sociales. Corrige mi respuesta si
          no uso bien haber + participio.
      - id: mori-pasiva
        type: aiTutorPrompt
        title: 'Voz pasiva: noticias virales'
        intro: 'Ejemplo de Mori: *Un meme ha sido compartido millones de veces. ¿Qué opinas?*'
        message: >-
          ¡Hola Mori! Quiero practicar la voz pasiva. Dame titulares de redes sociales
          inventados en voz pasiva para reaccionar y hazme preguntas en voz pasiva.
          Corrige mi respuesta si no uso bien el participio o la concordancia, y pídeme
          repetir la respuesta correcta.
      - id: mori-larga
        type: aiTutorPrompt
        title: Producción más larga
        message: >-
          ¡Hola Mori! Hazme una pregunta para hablar de lo mejor y lo peor de las redes
          sociales y otra para reflexionar sobre si las redes sociales han mejorado
          nuestras vidas, con el pretérito perfecto. Después pídeme inventar una noticia
          en voz pasiva y comentarla. Por favor, corrige mis errores.
      - id: mori-extra
        type: aiTutorPrompt
        title: Extra
        intro: Para cuando quieres más práctica.
        message: >-
          ¡Hola Mori! Hazme preguntas que mezclen el pretérito perfecto y la voz pasiva, y
          pídeme dos frases: una en pretérito perfecto y otra en voz pasiva. Después hazme
          otra pregunta parecida, pero más difícil. Por favor, corrige mis errores.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres un ejemplo antes de responder? Envía: **Mori, dame un ejemplo antes de que yo responda.**
          ¿Quieres sonar más natural? Envía: **Mori, dime si mi respuesta es natural o si puedo mejorarla.**
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: redes-sociales-practica
    book: workbook
    title: 'Práctica: Redes sociales'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practica las dos habilidades del ciclo. Cada respuesta se corrige al momento, y puedes intentarlo otra vez.
      - id: ex-pasiva
        type: activity
        activity: redes-sociales-pasiva
      - id: ex-perfecto
        type: activity
        activity: redes-sociales-perfecto

