vocabulary:
  - slug: cocina
    title: Cocina
    items: *cocina-words

activities:
  - slug: cocina-perfecto
    title: 'Pretérito perfecto: ¿qué has probado?'
    minutes: 8
    items:
      - id: he-comido
        type: multipleChoice
        prompt: Yo nunca ___ comida india.
        options:
          - { text: he comido, correct: true }
          - {
              text: ha comido,
              feedback: '*Ha* es para él / ella. Para *yo* usa *he*: *he comido*.',
            }
          - {
              text: he comer,
              feedback: 'Después de *haber* va el participio, no el infinitivo: *he comido*.',
            }
      - id: visitado
        type: fillBlank
        prompt: Completa con el participio de *visitar*.
        text: Hemos ___ muchos cafés en Tel Aviv.
        blanks: [[visitado]]
      - id: participios
        type: matching
        prompt: Une cada verbo con su participio.
        pairs:
          - [hacer, hecho]
          - [volver, vuelto]
          - [probar, probado]
          - [comer, comido]
          - [cocinar, cocinado]
      - id: haber-cambia
        type: trueFalse
        prompt: 'En el pretérito perfecto, *haber* cambia según la persona y el participio no cambia: *yo he cocinado, ellos han cocinado*.'
        answer: true
        feedback:
          correct: ¡Correcto! Solo cambia *haber* (he, has, ha, hemos, habéis, han).
          incorrect: 'El participio no cambia; solo cambia *haber*: *yo he cocinado, ellos han cocinado*.'
      - id: has-ido
        type: multipleChoice
        prompt: ¿___ ido alguna vez a un restaurante vegano? (tú)
        options:
          - { text: Has, correct: true }
          - { text: Ha, feedback: '*Ha* es para él / ella / usted. Para *tú* usa *has*.' }
          - { text: He, feedback: '*He* es para *yo*. Para *tú* usa *has*.' }
      - id: hecho
        type: fillBlank
        prompt: Completa con el participio de *hacer* (¡es irregular!).
        text: Esta semana he ___ una receta nueva.
        blanks: [[hecho]]
