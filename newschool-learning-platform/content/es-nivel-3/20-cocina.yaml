        type: multipleChoice
        prompt: Vivo en Curitiba ___ cinco años.
        options:
          - { text: desde hace, correct: true }
          - {
              text: desde,
              feedback: '*Desde* va con un momento específico (*desde 2022*). Con una cantidad de tiempo usamos *desde hace*.',
            }
          - {
              text: hace desde,
              feedback: 'El orden correcto es *desde hace*: *desde hace cinco años*.',
            }
      - id: ordena-conejo
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Nunca he comido conejo.

  - slug: cocina-modales
    title: 'Verbos modales: deberías, puedes, tienes que'
    minutes: 8
    items:
      - id: probar
        type: multipleChoice
        prompt: Deberías ___ este plato. ¡Es nuestra especialidad!
        options:
          - { text: probar, correct: true }
          - {
              text: pruebas,
              feedback: 'Después de un verbo modal va el infinitivo: *deberías probar*.',
            }
          - { text: a probar, feedback: 'Con *deber* no usamos *a*: *deberías probar*.' }
      - id: tienen
        type: fillBlank
        prompt: Completa con el verbo *tener* en presente.
        text: Los camareros ___ que conocer los ingredientes.
        blanks: [[tienen]]
      - id: funciones
        type: matching
        prompt: Une cada frase con su función.
        pairs:
          - [Deberías probar el hummus., dar un consejo]
          - [Puedes pedir el menú del día., dar permiso]
          - [Tenemos que reservar antes de ir., expresar una obligación fuerte]
          - [Este postre podría hacerse muy popular., hablar de una posibilidad]
          - ['En mi opinión, este lugar es acogedor.', dar una opinión]
      - id: tener-que-infinitivo
        type: trueFalse
        prompt: 'Después de *tener que* el verbo también se conjuga: *Tenemos que cocinamos más.*'
        answer: false
        feedback:
          correct: '¡Correcto! Solo se conjuga *tener*; después va el infinitivo: *Tenemos que cocinar más.*'
          incorrect: 'Solo se conjuga *tener*; después va el infinitivo: *Tenemos que cocinar más.*'
      - id: deberian
        type: multipleChoice
        prompt: Los restaurantes ___ ofrecer más opciones vegetarianas.
        options:
          - { text: deberían, correct: true }
          - { text: debería, feedback: '*Los restaurantes* es plural (ellos): usa *deberían*.' }
          - {
              text: deberíamos,
              feedback: '*Deberíamos* es para *nosotros*. Para *los restaurantes* (ellos) usa *deberían*.',
            }
      - id: puede
        type: fillBlank
        prompt: Completa con el verbo *poder* en presente.
        text: ¿Se ___ modificar el menú para personas con alergias?
        blanks: [[puede]]
      - id: correcta
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: Podrían cambiar el menú., correct: true }
          - {
              text: Podrían cambian el menú.,
              feedback: 'Después de *podrían* va el infinitivo: *cambiar*.',
            }
          - {
              text: Podrían a cambiar el menú.,
              feedback: 'Con *poder* no usamos *a*: *Podrían cambiar el menú.*',
            }
      - id: ordena-reservar
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Tenemos que reservar antes de ir.
