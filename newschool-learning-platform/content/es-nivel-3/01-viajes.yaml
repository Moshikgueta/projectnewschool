activities:
  - slug: viajes-perfecto
    title: 'Pretérito perfecto e indefinido: he viajado, viajé'
    minutes: 8
    items:
      - id: en-2022
        type: multipleChoice
        prompt: En 2022 ___ a Grecia.
        options:
          - { text: viajé, correct: true }
          - {
              text: he viajado,
              feedback: 'Con una fecha terminada (*en 2022*) usamos el pretérito indefinido: *viajé*.',
            }
          - {
              text: viajo,
              feedback: '*Viajo* es presente. Para un hecho terminado en 2022 usamos *viajé*.',
            }
      - id: participios-regulares
        type: fillBlank
        prompt: Completa con el participio de *visitar* y de *disfrutar*.
        text: Muchos turistas han ___ este lugar. Los viajeros han ___ de la comida local.
        blanks: [[visitado], [disfrutado]]
      - id: participios-irregulares
        type: matching
        prompt: Une cada verbo con su participio.
        pairs:
          - [hacer, hecho]
          - [ver, visto]
          - [decir, dicho]
          - [estar, estado]
          - [perder, perdido]
      - id: haber
        type: fillBlank
        prompt: Completa con el verbo *haber* en presente.
        text: ¿Alguna vez (tú) ___ perdido tu equipaje? Mis amigos y yo ___ hecho un viaje por carretera.
        blanks: [[has], [hemos]]
      - id: fecha-perfecto
        type: trueFalse
        prompt: 'Con una fecha terminada usamos el pretérito perfecto: *He viajado a Grecia en 2022.*'
        answer: false
        feedback:
          correct: '¡Correcto! Con una fecha terminada usamos el indefinido: *Viajé a Grecia en 2022.*'
          incorrect: 'El pretérito perfecto es para experiencias sin un momento concreto (*He visitado Grecia*). Con una fecha usamos el indefinido: *Viajé a Grecia en 2022.*'
      - id: he-visitado
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: He visitado Grecia., correct: true }
          - {
              text: He visitada Grecia.,
              feedback: 'Con *haber*, el participio no cambia: siempre *visitado*.',
            }
          - {
              text: Ha visitado yo Grecia.,
              feedback: 'Para *yo* usamos *he*: *He visitado Grecia.*',
            }
      - id: el-ano-pasado
        type: multipleChoice
        prompt: El año pasado ___ en un albergue en Lisboa.
        options:
          - { text: me alojé, correct: true }
          - {
              text: me he alojado,
              feedback: 'Con *el año pasado* (un momento terminado) usamos el indefinido: *me alojé*.',
            }
          - {
              text: me alojo,
              feedback: '*Me alojo* es presente. Para el año pasado usamos *me alojé*.',
            }
      - id: ordena-alguna-vez
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: ¿Alguna vez has viajado sin planear nada?

  - slug: viajes-pluscuamperfecto
    title: 'Pluscuamperfecto: ya había salido'
    minutes: 8
    items:
      - id: avion
        type: multipleChoice
        prompt: Cuando llegué al aeropuerto, el avión ya ___.
        options:
          - { text: había salido, correct: true }
          - {
              text: salió,
              feedback: 'El avión salió **antes** de mi llegada: para la acción anterior usamos el pluscuamperfecto, *había salido*.',
            }
          - {
              text: ha salido,
              feedback: '*Ha salido* es pretérito perfecto. Para algo anterior a otra acción pasada usamos *había salido*.',
            }
      - id: habia-habiamos
        type: fillBlank
        prompt: Completa con *haber* en imperfecto.
        text: Antes de viajar a México, yo ya ___ estudiado español. Cuando visitamos Japón, ya ___ probado comida japonesa.
        blanks: [[había], [habíamos]]
      - id: personas
        type: matching
        prompt: Une cada persona con su forma del pluscuamperfecto.
        pairs:
          - [yo / él / ella, había viajado]
          - [tú, habías viajado]
          - [nosotros, habíamos viajado]
          - [vosotros, habíais viajado]
          - [ellos / ellas, habían viajado]
      - id: primero
        type: trueFalse
        prompt: 'En *Perdí el vuelo porque había llegado tarde*, la acción que pasó primero es *había llegado tarde*.'
        answer: true
        feedback:
          correct: '¡Correcto! Primero llegué tarde (pluscuamperfecto) y después perdí el vuelo (indefinido).'
          incorrect: 'La acción en pluscuamperfecto (*había llegado*) es la que pasó primero; después, *perdí el vuelo*.'
      - id: que-paso-antes
        type: multipleChoice
        prompt: '*Cuando te perdiste en Venecia, yo ya había perdido mi pasaporte.* ¿Qué pasó primero?'
        options:
          - { text: Yo perdí mi pasaporte., correct: true }
          - {
              text: Tú te perdiste en Venecia.,
              feedback: '*Había perdido* está en pluscuamperfecto: esa acción pasó antes de *te perdiste*.',
            }
          - {
              text: Las dos cosas pasaron al mismo tiempo.,
              feedback: 'El pluscuamperfecto (*había perdido*) muestra que esa acción pasó antes de la otra.',
            }
      - id: construido
        type: fillBlank
        prompt: Completa con el pluscuamperfecto de *construir*.
        text: Antes de la llegada de los españoles, los habitantes ya ___ ___ ciudades importantes.
        blanks: [[habían], [construido]]
      - id: antes-de-mudarme
        type: multipleChoice
        prompt: Antes de mudarme a España, ya ___ a Grecia.
        options:
          - { text: había viajado, correct: true }
          - {
              text: he viajado,
              feedback: 'Viajar a Grecia pasó antes de otra acción pasada (*mudarme*): usamos el pluscuamperfecto, *había viajado*.',
            }
          - {
              text: viajaré,
              feedback: '*Viajaré* es futuro. Para algo anterior a otra acción pasada usamos *había viajado*.',
            }
      - id: ordena-hotel
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Mi amiga había reservado el hotel.
