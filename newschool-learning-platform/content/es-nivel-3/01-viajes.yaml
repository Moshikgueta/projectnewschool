# Cycle "Viajes", converted from the Spanish level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-3
slug: viajes
title: Viajes
goal: Contar experiencias de viaje con el pretérito perfecto y el indefinido, y decir qué había pasado antes con el pluscuamperfecto.
position: 1
status: in_review

review:
  - >-
    The two workbook exercises ("Pretérito perfecto e indefinido" and
    "Pluscuamperfecto") are NEW: the notebook has no self-study exercises. They were
    written from the cycle's two skills, its summary rules, the activity examples and
    its vocabulary. Please check level, wording and every right answer before
    students see them.
  - >-
    Skills: the source lists "pretérito perfecto compuesto, pretérito perfecto simple
    (repaso) y pretérito pluscuamperfecto". They are grouped as two skills:
    "Pretérito perfecto e indefinido" (experiences vs. finished events, review) and
    "Pluscuamperfecto" (what had happened before). Please confirm.
  - >-
    Tense names translated from English: "presente perfecto" (warm-up headings,
    Activities 1, 3, 5, 6 and Mori) → "pretérito perfecto"; "pasado perfecto"
    (Activity 1 tip, Activity 2 title) → "pluscuamperfecto"; Mori "presente
    pluscuamperfecto" → "pluscuamperfecto".
  - >-
    Summary: the source summary is written in Hebrew. It is rendered in Spanish
    (rules, a conjugation table of haber in the imperfect + participle, and the
    comparison of the three tenses); the Hebrew translations of the example
    sentences are kept as glosses. The Hebrew table "אני עשיתי → había hecho" gave
    only one person and a Hebrew simple past; it is replaced by a full table (había,
    habías, había, habíamos, habíais, habían + participle). A short list of
    irregular participles (hecho, visto, dicho, puesto, vuelto, escrito) was added
    because the activities use them. Please confirm.
  - >-
    Corrections in Activity 1: "Prima:" (a calque of "Bonus") → "Extra:".
    Activity 2: "Para cuando hiciste eso, yo ya había…" (calque of "By the time…") →
    "Cuando hiciste eso, yo ya había…", as in the source's own examples; "y contaré
    una historia" → "y cuenta una historia"; student 3 "yo ya me había quedado
    dormido en un autobús y perdí mi parada" → "…y había perdido mi parada" (both
    actions happened before).
  - >-
    Corrections in Activity 3: "¿Alguna vez te has alojado en un hostel?" → "en un
    albergue (hostel)"; "solo/a" written in full. Activity 4: Q1 "viajado solo" →
    "solo/a"; Q3 "¿Ya habías aprendido algo de la lengua local? idiomas ¿antes de
    eso?" → "¿Ya habías aprendido algo de la lengua local antes de eso?"; Q4 "¿Qué
    te había dicho la gente sobre él antes de que lo comieras?" → "sobre esa comida
    antes de que la probaras" (comida is feminine); Q7 "¿Qué pasó que te hizo llegar
    tarde?" → "¿Qué había pasado para que llegaras tarde?" (to practise the
    pluscuamperfecto); Q8 "mientras viajas" → "mientras viajabas", "¿Qué habían
    experimentado ambos…?" → "¿Qué habían vivido los dos…?"; Q10 "¿Alguna vez ha
    tenido…? ¿Qué has hecho para solucionarlo?" → "¿Alguna vez has tenido…? ¿Qué
    hiciste para solucionarla?".
  - >-
    Smaller wording changes: Activity 3 Q12 "¿Alguna vez has realizado un viaje
    turístico…?" → "¿Alguna vez has hecho un viaje organizado…?". Activity 4: Q6
    "¿…habían planeado todo antes de comenzar?" → "¿…lo habían planeado todo antes
    de salir?"; Q9 "algún vocabulario" → "algo de vocabulario"; Q11 "¿Eso alguna vez
    ha causado problemas?" → "¿Eso te ha causado problemas alguna vez?"; Q12 "justo
    antes de eso" → "justo antes"; Q13 "¿Alguna vez has regresado a un lugar que
    amabas?" → "¿…has vuelto a un lugar que te encantaba?". Activity 5 "sobre ti
    mismo" → "sobre ti mismo/a".
  - >-
    Activity 5, model summary: "Después de esa experiencia, ha recomendado viajar con
    más tiempo" → "Desde esa experiencia, siempre recomienda viajar con más tiempo"
    (the perfect did not fit). Activity 6 asks students to research a destination;
    no website is named in the source. The questions in Etapa 4 use vosotros (¿Qué
    os gustó…?), kept as in the source.
  - >-
    Introduction round: "pase directamente" → "pasa directamente" (teacher note).
    Mori: "Utilice vocabulario de viaje. Práctica…" → "Usa vocabulario de viajes.
    Practica…"; "Abra el chatbot de la escuela" → "Abre el chat con Mori";
    "el chatbot" in the summary questions → "Mori".
  - >-
    Vocabulary: "viaje, טיול" → "נסיעה / טיול"; "hostel" → "albergue / hostel";
    "solo/a, לבד" kept. Please confirm the glosses.
  - >-
    Times given as ranges are recorded as the upper value (Activity 5: 2–3 → 3,
    8–10 → 10). The source gives no times for Activities 1–4 and no plan for
    combining activities. The Quizlet link is kept without its "?new" parameter;
    its slug says "traveling-extreme-spanish", please check it is the right set.
    The course-wide Quizlet class and Tazman links in the notebook introduction
    (before this cycle) were not converted.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: viajes-clase
    title: 'Clase: Viajes'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Viajes
      - id: skills
        type: cycleOverview
        skills:
          - name: Pretérito perfecto e indefinido
            description: 'Experiencias (*he viajado, he estado*) y hechos terminados (*viajé a Grecia en 2022*)'
          - name: Pluscuamperfecto
            description: 'Lo que había pasado antes: *Cuando llegué, el avión ya había salido.*'
      - id: quizlet
        type: externalLink
        label: Viajes en Quizlet
        url: https://quizlet.com/il/1057550900/traveling-extreme-spanish-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___. Ya había viajado a ___ antes de empezar el curso de español.
        example: Soy Marta. Ya había viajado a México antes de empezar el curso de español.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup-perfecto-title
        type: heading
        level: 4
        text: Pretérito perfecto (experiencias)
      - id: warmup-perfecto
        type: discussionQuestions
        items:
          - question: ¿Cuál ha sido el mejor viaje que has hecho?
            frame: El mejor viaje que he hecho ha sido ___ porque ___.
          - question: ¿Qué es lo más inesperado que te ha pasado mientras viajabas?
            frame: Lo más inesperado que me ha pasado es que ___.
          - question: ¿Cuántos países has visitado en tu vida?
            frame: He visitado ___ países, por ejemplo ___.
          - question: ¿Alguna vez has viajado sin planear nada? ¿Cómo fue la experiencia?
            frame: Sí, una vez viajé a ___ sin planear nada y fue ___. / No, nunca he viajado sin planear.
      - id: warmup-plusc-title
        type: heading
        level: 4
        text: Pluscuamperfecto (qué ocurrió antes)
      - id: warmup-plusc
        type: discussionQuestions
        items:
          - question: Antes de tu primer viaje al extranjero, ¿ya habías visitado muchos lugares de tu país?
            frame: Antes de mi primer viaje al extranjero, ya había visitado ___. / todavía no había visitado ___.
          - question: ¿Ya habías estudiado algún idioma antes de viajar al extranjero por primera vez?
            frame: Sí, ya había estudiado ___. / No, todavía no había estudiado ningún idioma.
          - question: ¿Qué habías preparado antes de tu viaje más memorable?
            frame: Antes de ese viaje, había preparado ___.
      - id: warmup-destino-title
        type: heading
        level: 4
        text: Conexión con la investigación de destinos
      - id: warmup-destino
        type: discussionQuestions
        items:
          - question: ¿Qué país te gustaría visitar y por qué?
            frame: Me gustaría visitar ___ porque ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Una verdad y una mentira'
        skills: [Pretérito perfecto e indefinido]
        steps:
          - Piensa en dos historias de viaje sobre algo que has hecho. Una es verdad y la otra es mentira.
          - Cuenta las dos historias completas al grupo.
          - Los demás adivinan qué historia es verdadera y cuál es falsa.
          - 'Extra: si tu grupo ya lo conoce, puedes usar también el pluscuamperfecto en la historia (no es obligatorio).'
        example: |-
          **Verdad:** *He estado en Japón y probé sushi en un restaurante tradicional. ¡Fue increíble y aprendí a hacer sushi con el chef!*
          **Mentira:** *He viajado a Australia e hice paracaidismo sobre la Gran Barrera de Coral. ¡Fue la experiencia más emocionante de mi vida!*
      - id: act1-stories
        type: discussionQuestions
        title: Mis dos historias
        items:
          - question: 'Historia 1:'
            frame: He estado en ___ y ___.
          - question: 'Historia 2:'
            frame: He viajado a ___ y ___.
      - id: act2
        type: classActivity
        title: 'Actividad 2: Cuando hiciste eso, yo ya había…'
        skills: [Pluscuamperfecto]
        steps:
          - El profesor empieza a contar una historia divertida que le pasó en un viaje, y dice cuándo pasó.
          - 'Al terminar, un estudiante dice: *Cuando hiciste eso, yo ya había…* y cuenta una historia de viaje que le pasó antes, con la fecha.'
          - 'Después, otro estudiante reacciona a esa historia: *Cuando hiciste eso, yo ya había…* y cuenta otra historia.'
          - Todos los estudiantes hablan y cuentan una historia de viaje.
        example: |-
          **Profesor:** *En 2018 me perdí por completo en Venecia porque estaba siguiendo Google Maps y ¡me llevó dando vueltas durante una hora!*
          **Estudiante 1:** *Cuando te perdiste en Venecia en 2018, yo ya había perdido mi pasaporte en el aeropuerto de Madrid en 2016. ¡Tuve que hablar con la policía y perdí mi vuelo!*
          **Estudiante 2:** *Cuando perdiste tu pasaporte en 2016, yo ya había comido insectos fritos en Tailandia en 2015 sin saber qué eran. ¡Pensé que eran patatas fritas!*
          **Estudiante 3:** *Cuando comiste insectos en 2015, yo ya me había quedado dormido en un autobús en Nueva York y había perdido mi parada en 2014. ¡Terminé en una ciudad totalmente diferente!*
          **Estudiante 4:** *Cuando perdiste tu parada en 2014, yo ya había estado atrapado en un ascensor de un hotel en Londres durante 20 minutos, ¡con extraños! Eso fue allá por 2013.*
      - id: act2-story
        type: discussionQuestions
        title: Mi historia
        items:
          - question: Cuando hiciste eso, yo ya había ___.
            frame: Cuando ___ en ___, yo ya había ___ en ___.
      - id: act3
        type: classActivity
        title: 'Actividad 3: ¿Alguna vez has…?'
        skills: [Pretérito perfecto e indefinido]
        steps:
          - Trabajen en parejas.
          - Elige tres de estas preguntas y respóndelas. Si dices que sí, cuenta cuándo y dónde pasó (pretérito indefinido).
        example: '*¿Alguna vez has perdido tu equipaje?* → *Sí, he perdido mi equipaje una vez. Lo perdí en el aeropuerto de Roma en 2019.*'
      - id: act3-questions
        type: discussionQuestions
        title: ¿Alguna vez has…?
        items:
          - question: ¿Alguna vez has viajado solo/a?
          - question: ¿Alguna vez has perdido tu equipaje en el aeropuerto?
          - question: ¿Alguna vez te has perdido en un país extranjero?
          - question: ¿Alguna vez has probado una comida realmente extraña mientras viajabas?
          - question: ¿Alguna vez has visitado un lugar que viste en una película?
          - question: ¿Alguna vez has tenido un vuelo retrasado o cancelado?
          - question: ¿Alguna vez te has alojado en un albergue (hostel)?
          - question: ¿Alguna vez has hecho un viaje por carretera con amigos?
          - question: ¿Alguna vez has visitado más de tres países en un solo viaje?
          - question: ¿Alguna vez has perdido un vuelo o un tren mientras viajabas?
          - question: ¿Alguna vez has hecho un nuevo amigo mientras viajabas?
          - question: ¿Alguna vez has hecho un viaje organizado o un viaje en grupo?
          - question: ¿Alguna vez has viajado sin planear nada?
          - question: ¿Alguna vez has tenido un momento divertido o embarazoso en el extranjero?
          - question: ¿Alguna vez te has enamorado de un lugar (o de una persona) mientras viajabas?
      - id: act4
        type: classActivity
        title: 'Actividad 4: Cuando hiciste eso, ¿habías…?'
        skills: [Pretérito perfecto e indefinido, Pluscuamperfecto]
        steps:
          - Esta actividad continúa la Actividad 3. Trabajen con la misma pareja.
          - Toma las preguntas que eligieron en la Actividad 3 y haz también la segunda pregunta, en pluscuamperfecto.
          - Tu compañero responde y explica qué había pasado antes.
        example: '*¿Alguna vez has visitado un lugar de una película?* — *Sí, he visitado Nueva Zelanda.* — *¿Habías visto ya la película antes de ir?* — *Sí, la había visto tres veces.*'
      - id: act4-questions
        type: discussionQuestions
        title: Preguntas de seguimiento
        items:
          - question: ¿Alguna vez has viajado solo/a? ¿Qué habías hecho antes que te hizo sentir preparado/a para viajar solo/a?
          - question: ¿Alguna vez has perdido tu equipaje? ¿Qué habías empacado que realmente necesitabas?
          - question: ¿Alguna vez te has perdido en un país extranjero? ¿Ya habías aprendido algo de la lengua local antes de eso?
          - question: ¿Alguna vez has probado comida extraña en el extranjero? ¿Qué te había dicho la gente sobre esa comida antes de que la probaras?
          - question: ¿Alguna vez has visitado un lugar de una película? ¿Habías visto ya la película antes de ir?
          - question: ¿Alguna vez has hecho un viaje por carretera con amigos? ¿Tú y tus amigos lo habían planeado todo antes de salir?
          - question: ¿Alguna vez has perdido un vuelo o un tren? ¿Qué había pasado para que llegaras tarde?
          - question: ¿Alguna vez has hecho un nuevo amigo mientras viajabas? ¿Qué habían vivido los dos antes de conocerse?
          - question: ¿Alguna vez has visitado un país donde no hablabas el idioma? ¿Habías estudiado algo de vocabulario antes de ir?
          - question: ¿Alguna vez has tenido una emergencia en un viaje? ¿Qué hiciste para solucionarla?
          - question: ¿Alguna vez has hecho un viaje sin planear nada? ¿Eso te ha causado problemas alguna vez?
          - question: ¿Alguna vez has tenido un momento divertido o embarazoso en el extranjero? ¿Qué había pasado justo antes?
          - question: ¿Alguna vez has vuelto a un lugar que te encantaba? ¿Qué ha cambiado desde la primera vez que lo visitaste?
      - id: act5
        type: classActivity
        title: 'Actividad 5: Viajes reales'
        skills: [Pretérito perfecto e indefinido, Pluscuamperfecto]
        minutes: 13
        steps:
          - 'Preparación individual (3 minutos): elige una experiencia de viaje que viviste de verdad: tu mejor viaje, un viaje que salió mal, una experiencia divertida, una situación inesperada, un momento vergonzoso o un viaje que cambió tu forma de pensar.'
          - 'Piensa: ¿Dónde ocurrió? ¿Cuándo ocurrió? ¿Qué pasó? ¿Cómo te sentiste? ¿Qué habías hecho antes de que ocurriera?'
          - 'Entrevista en parejas (10 minutos): el entrevistador hace preguntas abiertas (mira las preguntas principales y de seguimiento de abajo).'
          - '**Regla:** después de cada respuesta, el entrevistador hace al menos una pregunta más. No puede pasar enseguida a la siguiente pregunta de la lista.'
          - 'La experiencia detrás de la experiencia: el entrevistador descubre qué había ocurrido antes de la historia (pluscuamperfecto).'
          - 'Presentación al grupo: el entrevistador resume la historia de su compañero.'
        example: |-
          *David nos ha contado una experiencia que vivió en Japón. Había soñado con visitar ese país durante muchos años y había aprendido algunas palabras en japonés antes de viajar. Lo que más le sorprendió fue la cultura local y la organización del transporte. Desde esa experiencia, siempre recomienda viajar con más tiempo para poder explorar lugares menos turísticos.*
      - id: act5-main
        type: discussionQuestions
        title: Preguntas principales
        items:
          - question: ¿Cuál ha sido el viaje más memorable que has hecho?
          - question: ¿Por qué fue tan especial?
          - question: ¿Qué ocurrió durante ese viaje?
          - question: ¿Qué sentiste en ese momento?
          - question: ¿Qué habías hecho para prepararte?
          - question: ¿Hubo algo que te sorprendió?
          - question: ¿Aprendiste algo sobre ti mismo/a durante ese viaje?
      - id: act5-follow
        type: discussionQuestions
        title: Preguntas de seguimiento
        answerable: false
        items:
          - question: ¿Qué pasó después?
          - question: ¿Cómo reaccionaron las otras personas?
          - question: ¿Volverías a hacerlo?
          - question: ¿Qué harías diferente hoy?
          - question: ¿Qué habías esperado que ocurriera?
          - question: ¿La realidad fue diferente de tus expectativas?
          - question: ¿Qué consejo darías a alguien que quiere hacer ese viaje?
      - id: act5-before
        type: discussionQuestions
        title: La experiencia detrás de la experiencia (pluscuamperfecto)
        answerable: false
        items:
          - question: Antes de ese viaje, ¿ya habías visitado un lugar parecido?
          - question: ¿Qué habías oído sobre ese destino?
          - question: ¿Ya habías conocido a las personas que viajaron contigo?
          - question: ¿Habías planeado todo con antelación o fue espontáneo?
          - question: ¿Habías tenido experiencias similares antes?
      - id: act5-summary
        type: discussionQuestions
        title: La historia de mi compañero
        items:
          - question: Resume la historia de tu compañero.
            frame: ___ nos ha contado una experiencia que vivió en ___. Había ___. Lo que más le sorprendió fue ___.
      - id: act6
        type: classActivity
        title: 'Actividad 6: Investiga un destino y convéncenos'
        skills: [Pretérito perfecto e indefinido, Pluscuamperfecto]
        minutes: 15
        steps:
          - 'Investigación (10 minutos): en parejas, elijan un destino (por ejemplo: Japón, Grecia, Islandia, Perú, Marruecos, Vietnam). Busquen lugares para visitar, comida típica, actividades y algo interesante sobre su historia.'
          - 'Preparación (5 minutos): preparen una presentación de 2 o 3 minutos con los tres tiempos (mira los ejemplos de abajo).'
          - 'Presentación: presenten su destino. Intenten responder: ¿Dónde está? ¿Por qué es interesante? ¿Qué puede hacer un turista allí? ¿Por qué deberíamos visitarlo?'
          - 'Preguntas: después de cada presentación, los compañeros hacen una o dos preguntas: *¿Qué os gustó más de este destino? ¿Qué os sorprendió? ¿Os gustaría visitarlo? ¿Qué actividad recomendaríais?*'
          - 'Votación final: la clase vota el destino más interesante, el más bonito y el que más ganas da de visitar.'
      - id: act6-tenses
        type: examples
        title: Los tres tiempos en la presentación
        items:
          - text: '**Pretérito perfecto** (experiencias de los turistas): *Muchos turistas han visitado este lugar. Los viajeros han disfrutado de la comida local.*'
          - text: '**Pretérito indefinido** (un hecho histórico): *La ciudad se fundó en el año 1535. El monumento se construyó hace 200 años.*'
          - text: '**Pluscuamperfecto** (algo anterior a un hecho histórico): *Antes de la llegada de los españoles, los habitantes ya habían construido ciudades importantes. Antes de convertirse en una atracción turística, la zona había sido un pequeño pueblo.*'
      - id: act6-notes
        type: discussionQuestions
        title: Nuestro destino
        items:
          - question: Pretérito perfecto
            frame: Muchos turistas han ___.
          - question: Pretérito indefinido
            frame: En el año ___, ___.
          - question: Pluscuamperfecto
            frame: Antes de ___, ya había(n) ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Pretérito perfecto e indefinido** (repaso:
          Actividades 1, 3 y 5) y **Pluscuamperfecto** (Actividades 2, 4, 5 y 6). El
          cuaderno no indica tiempos para las Actividades 1 a 4 ni cómo combinar las
          actividades: elige según el tiempo de la clase.
      - id: n-intro
        anchor: intro
        text: >-
          Mantenlo muy corto: dos frases por estudiante, no más de 30 segundos por
          persona y no más de 5 minutos en total. Si los estudiantes ya se conocen, pasa
          directamente a las preguntas de calentamiento.
      - id: n-warmup
        anchor: warmup-title
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act1
        anchor: act1
        text: >-
          El uso del pluscuamperfecto en la historia es opcional y depende del nivel del
          grupo.
      - id: n-act2
        anchor: act2
        text: >-
          Empieza tú con una historia divertida de un viaje y di la fecha. Cada
          estudiante reacciona a la historia anterior con *Cuando hiciste eso, yo ya
          había…* y una fecha anterior. Corrige el pluscuamperfecto (*había* +
          participio) en el momento.
      - id: n-act4
        anchor: act4
        text: Esta actividad continúa la Actividad 3 con las mismas parejas y las mismas preguntas.
      - id: n-act5
        anchor: act5
        minutes: 13
        text: >-
          Preparación individual: 3 minutos. Entrevista en parejas: 10 minutos. Después,
          la etapa del pluscuamperfecto y la presentación al grupo (el cuaderno no da
          tiempos para estas dos etapas). Lee el modelo en voz alta antes de las
          presentaciones.
      - id: n-act6
        anchor: act6
        minutes: 15
        text: >-
          Investigación: 10 minutos (los estudiantes necesitan internet). Preparación: 5
          minutos. Después, presentaciones de 2 o 3 minutos por pareja, preguntas y
          votación final.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: viajes-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-plusc
        type: ruleSummary
        skill: Pluscuamperfecto
        rules:
          - text: 'Usamos el **pluscuamperfecto** para hablar de una acción que pasó **antes de otra acción en el pasado**.'
            examples: ['Cuando llegué al aeropuerto, el avión ya había salido.']
          - text: 'Forma: **haber** en imperfecto (*había, habías, había…*) + **participio** (*-ado* / *-ido*). El participio no cambia.'
            examples: [había hecho, había comido, había viajado]
          - text: 'Lo usamos cuando contamos una historia y queremos mostrar qué pasó antes. Palabras clave: *antes de…, cuando…, ya, todavía no, porque*.'
            examples:
              - Antes de viajar a México, ya había estudiado español.
              - Perdí el vuelo porque había llegado tarde al aeropuerto.
          - text: '**Consejo:** si hay dos acciones en el pasado, la que pasó primero va en pluscuamperfecto y la que pasó después, en pretérito indefinido.'
            examples: [Había estudiado español durante dos años antes de viajar a Argentina.]
      - id: plusc-table
        type: table
        caption: 'Pluscuamperfecto: haber (imperfecto) + participio'
        header: [Persona, haber, viajar, comer, hacer]
        rows:
          - [yo, había, había viajado, había comido, había hecho]
          - [tú, habías, habías viajado, habías comido, habías hecho]
          - [él / ella / usted, había, había viajado, había comido, había hecho]
          - [nosotros / nosotras, habíamos, habíamos viajado, habíamos comido, habíamos hecho]
          - [vosotros / vosotras, habíais, habíais viajado, habíais comido, habíais hecho]
          - [ellos / ellas / ustedes, habían, habían viajado, habían comido, habían hecho]
      - id: participles
        type: table
        caption: Participios irregulares frecuentes
        header: [Infinitivo, Participio]
        rows:
          - [hacer, hecho]
          - [ver, visto]
          - [decir, dicho]
          - [poner, puesto]
          - [volver, vuelto]
          - [escribir, escrito]
      - id: plusc-examples
        type: examples
        title: Ejemplos del mundo de los viajes
        items:
          - text: Cuando llegué al aeropuerto, el avión ya había salido.
            gloss: כשהגעתי לשדה התעופה, המטוס כבר יצא. (יציאת המטוס קרתה לפני ההגעה שלי)
          - text: Antes de viajar a México, ya había estudiado español.
            gloss: לפני שנסעתי למקסיקו, כבר למדתי ספרדית.
          - text: Cuando visité Japón, ya había probado comida japonesa en mi país.
            gloss: כשביקרתי ביפן, כבר ניסיתי אוכל יפני בארץ שלי.
          - text: Perdí el vuelo porque había llegado tarde al aeropuerto.
            gloss: פספסתי את הטיסה כי הגעתי מאוחר לשדה התעופה.
      - id: rules-compare
        type: ruleSummary
        skill: Pretérito perfecto e indefinido
        rules:
          - text: '**Pretérito perfecto** (*he viajado*): experiencias de la vida, sin un momento concreto. Forma: *he, has, ha, hemos, habéis, han* + participio.'
            examples: [He visitado Grecia., ¿Alguna vez has perdido tu equipaje?]
          - text: '**Pretérito indefinido** (*viajé*): un hecho concreto y terminado, con un momento del pasado (*en 2022, el año pasado, ayer*).'
            examples: [Viajé a Grecia en 2022., El monumento se construyó hace 200 años.]
          - text: '**Pluscuamperfecto** (*había viajado*): algo que pasó antes de otro hecho del pasado.'
            examples: ['Antes de mudarme a España, ya había viajado a Grecia.']
      - id: compare-table
        type: table
        caption: Los tres tiempos del pasado
        header: [Tiempo, Forma, Uso, Ejemplo]
        rows:
          - [
              Pretérito perfecto,
              he / has / ha + participio,
              experiencias de la vida,
              He visitado Grecia.,
            ]
          - [
              Pretérito indefinido,
              'viajé, comí, fui',
              hecho concreto con fecha,
              Viajé a Grecia en 2022.,
            ]
          - [
              Pluscuamperfecto,
              había / habías / había + participio,
              antes de otro hecho pasado,
              'Antes de mudarme, ya había viajado a Grecia.',
            ]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: >-
          El resumen del cuaderno está en hebreo; aquí está en español, con la traducción
          hebrea de los ejemplos. Repasa las dos habilidades y pide un ejemplo nuevo de
          viaje para cada tiempo.

