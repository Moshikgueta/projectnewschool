vocabulary:
  - slug: relaciones-publicas
    title: Relaciones públicas
    items: *relaciones-publicas-words

activities:
  - slug: relaciones-publicas-presentacion
    title: 'Presentación profesional: ayudo a…, me especializo en…'
    minutes: 8
    items:
      - id: ayudo-a
        type: multipleChoice
        prompt: Ayudo a mis clientes ___ su imagen.
        options:
          - { text: a mejorar, correct: true }
          - {
              text: mejorar,
              feedback: 'Con *ayudar* decimos *ayudar a* + persona + *a* + infinitivo: *Ayudo a mis clientes a mejorar…*',
            }
          - {
              text: a mejoran,
              feedback: 'Después de *ayudar a… a* el verbo va en infinitivo: *a mejorar*.',
            }
      - id: especializo
        type: fillBlank
        prompt: Completa con la preposición correcta.
        text: Me especializo ___ diseño de interiores.
        blanks: [[en]]
      - id: objetivo
        type: multipleChoice
        prompt: Mi objetivo profesional es ___ más clientes.
        options:
          - { text: tener, correct: true }
          - { text: tengo, feedback: 'Después de *mi objetivo es* usamos el infinitivo: *tener*.' }
          - {
              text: a tener,
              feedback: 'Con *mi objetivo es* no usamos *a*: *Mi objetivo es tener más clientes.*',
            }
      - id: une-presentacion
        type: matching
        prompt: Une las dos partes de la presentación.
        pairs:
          - [Me llamo, Laura Gómez.]
          - [Me especializo en, el diseño de logos.]
          - [Trabajo de forma autónoma desde, mi casa en Barcelona.]
          - [Mis clientes me eligen porque, tengo mucha paciencia.]
          - [Ayudo a pequeñas empresas, a crear su imagen visual.]
      - id: presente
        type: trueFalse
        prompt: 'En una presentación profesional usamos el presente: *trabajo, ayudo, me especializo*.'
        answer: true
        feedback:
          correct: ¡Correcto! Hablamos de nuestra identidad y de nuestro trabajo de ahora.
          incorrect: 'Sí: para hablar de identidad y trabajo usamos el presente (*soy, trabajo, ayudo*).'
      - id: eligen
        type: fillBlank
        prompt: Completa con el verbo *elegir* en presente (ellos).
        text: Mis clientes me ___ porque soy muy organizada.
        blanks: [[eligen]]
      - id: porque
        type: multipleChoice
        prompt: Mis clientes me eligen ___ tengo paciencia.
        options:
          - { text: porque, correct: true }
          - {
              text: por qué,
              feedback: '*Por qué* (separado y con tilde) es para preguntar: *¿Por qué?* Para dar una razón usamos *porque*.',
            }
          - {
              text: porqué,
              feedback: '*El porqué* es un sustantivo (= la razón). Para unir dos frases y dar una razón usamos *porque*.',
            }
      - id: ordena-ayudo
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Ayudo a pequeñas empresas a crear su imagen.

  - slug: relaciones-publicas-modismos
    title: 'Modismos y siglas de las RRPP'
    minutes: 8
    items:
      - id: une-modismos
        type: matching
        prompt: Une cada modismo con su significado.
        pairs:
          - [Volverse viral, Hacerse muy conocido en internet muy rápido.]
          - [Dar una mano, Ayudar.]
          - [Borrón y cuenta nueva, Olvidar el pasado y empezar de nuevo.]
          - [Robarse el protagonismo, Llevarse toda la atención.]
          - [Cuidar la imagen, Mantener una buena reputación.]
      - id: rrpp
        type: multipleChoice
        prompt: ¿Qué significa la sigla *RRPP*?
        options:
          - { text: relaciones públicas, correct: true }
          - {
              text: redes públicas,
              feedback: '*RRPP* son las *relaciones públicas*: la profesión que cuida la imagen ante el público.',
            }
          - {
              text: respuestas para la prensa,
              feedback: '*RRPP* son las *relaciones públicas*. Las letras dobles (RR, PP) indican plural.',
            }
      - id: letras-dobles
        type: trueFalse
        prompt: 'En la sigla *RRPP*, las letras dobles indican que las palabras están en plural.'
        answer: true
        feedback:
          correct: '¡Correcto! *RR* = relaciones, *PP* = públicas: las dos palabras están en plural.'
          incorrect: 'Sí: en español las letras dobles de una sigla indican plural. *RRPP* = relaciones públicas.'
      - id: ong
        type: multipleChoice
        prompt: ¿Qué es una *ONG*?
        options:
          - { text: una organización no gubernamental, correct: true }
          - {
              text: una oficina de noticias general,
              feedback: '*ONG* = *organización no gubernamental*, por ejemplo una organización que ayuda a personas o animales.',
            }
          - {
              text: un canal de televisión,
              feedback: 'La televisión es *TV*. *ONG* = *organización no gubernamental*.',
            }
      - id: borron
        type: fillBlank
        prompt: Completa el modismo.
        text: Después de la crisis, la empresa quiere hacer borrón y cuenta ___.
        blanks: [[nueva]]
      - id: viral
        type: multipleChoice
        prompt: 'Un video de la marca tuvo millones de visitas en un día. El video se ___.'
        options:
          - { text: volvió viral, correct: true }
          - {
              text: robó el protagonismo,
              feedback: '*Robarse el protagonismo* es llevarse toda la atención en un evento. Un video con millones de visitas *se volvió viral*.',
            }
          - {
              text: dio una mano,
              feedback: '*Dar una mano* significa ayudar. Un video con millones de visitas *se volvió viral*.',
            }
      - id: disculpa
        type: multipleChoice
        prompt: ¿Qué frase es mejor para una disculpa formal de una empresa?
        options:
          - { text: La empresa quiere cuidar su imagen y comunicar con claridad., correct: true }
          - {
              text: '¡Borrón y cuenta nueva, aquí no pasó nada!',
              feedback: 'En una disculpa formal este modismo puede sonar poco serio. Es mejor un mensaje claro y formal.',
            }
          - {
              text: 'Jugamos bien nuestras cartas y nos robamos el protagonismo.',
              feedback: 'Estos modismos son informales y no piden perdón. En una disculpa formal es mejor un mensaje claro.',
            }
      - id: ordena-imagen
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: La empresa tiene que cuidar su imagen.
