# Cycle "Relaciones públicas", converted from the Spanish level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-3
slug: relaciones-publicas
title: Relaciones públicas
goal: Presentarse como profesional dando razones y usar modismos y siglas de las relaciones públicas.
position: 11
status: published

review:
  - >-
    The two workbook exercises ("Presentación profesional" and "Modismos y siglas") are
    NEW: the notebook has no self-study exercises. They were written from the cycle's
    summary, the activity model, the homework examples and the vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    Skills: the notebook lists four (modismos en contexto; siglas; narrativa con tiempos
    mixtos; opiniones con razones), but the class activity and the summary practise a
    professional presentation (present tense, ayudar a + infinitivo, porque). The cycle
    is organised around two skills: "Presentación profesional" (class activity +
    summary; includes giving reasons with porque) and "Modismos y siglas" (vocabulary +
    Mori homework). Mixed tenses are practised only in the Mori homework. Please
    confirm this choice.
  - >-
    The source is partly a filled-in class record: it contains real students' answers
    (Mira, Ofri, S./Silvia, Dalia) to the introduction round, the warm-up and the
    profile activity, and the teacher's notes on them. Those answers were left out.
    Only ONE warm-up question is written as a question; four more were RECONSTRUCTED
    from the answers (what a professional / unprofessional person does; whether
    customer service in Israel is professional; qualities for customer service;
    advantages and disadvantages of not being self-employed). Please check them.
  - >-
    The introduction example now uses a neutral name (Ana) and a corrected version of a
    student answer. The profile model in Step 2 keeps the "Dalia, diseñadora de
    interiores" text (it is labelled "Usa este modelo"), with "Petaj Tikwa" → "Petaj
    Tikva". The other two filled-in profiles (Silvia, Ofri) were left out.
  - >-
    Corrections: "atendimiento al cliente" (Portuguese) → "atención al cliente";
    "improfesional" → "poco profesional"; "no tengo tomar decisiones" → "no tengo que
    tomar decisiones" (reconstructed question); "Presente simple" (English term) →
    "presente"; the activity's "freelancer" → "autónomo"; garbled emoji characters
    ("ð¦", "ð©"…) in the vocabulary headings were removed.
  - >-
    Summary: the source summary covers only the professional presentation. A short
    rule block for "Modismos y siglas" (meanings, formal / informal register, doubled
    letters for plurals in RRPP) and one for mixed tenses (from the Mori examples) were
    ADDED so that the homework and the workbook have rules to rely on. The model
    sentence "Mi objetivo profesional es que mis clientes se sientan satisfechos" uses
    "es que + subjuntivo"; this is now explained next to "es + infinitivo".
  - >-
    Mori, Activity 1: the example marks "Ahora trabajamos con RRPP" as an error and
    corrects it to "Ahora estamos trabajando". Both are correct Spanish; the example
    now presents it as an alternative for an action in progress, not as an error.
  - >-
    Vocabulary: "Tener buena imagen – תדמית טובה" → "להיות בעל תדמית טובה";
    "Responder – להגיב" → "לענות / להגיב" (Reaccionar is also "להגיב"); "ONG – עמותה" →
    "ארגון לא ממשלתי / עמותה"; "Dar una mano" → "Dar / echar una mano" (echar is usual
    in Spain). "Volar bajo el radar" is a calque of English; "pasar desapercibido" is
    more common in Spanish. It is kept as in the source; please decide. The four
    vocabulary groups are merged into one list.
  - >-
    The source gives no activity times except "15–20 minutes" for the homework, and no
    plan; no minutes are recorded in class. The Quizlet link is kept without "?new".
    The definition of "relaciones públicas" at the start of the source is kept as an
    introduction text.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: relaciones-publicas-clase
    title: 'Clase: Relaciones públicas'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Relaciones públicas
      - id: skills
        type: cycleOverview
        skills:
          - name: Presentación profesional
            description: '*Me llamo…, soy…, trabajo…, ayudo a… a + infinitivo, me especializo en…, mis clientes me eligen porque…*'
          - name: Modismos y siglas
            description: '*Tener buena imagen, volverse viral, borrón y cuenta nueva, dar una mano; RRPP, ONG, TV, CEO*'
      - id: quizlet
        type: externalLink
        label: Relaciones públicas en Quizlet
        url: https://quizlet.com/br/1124113621/relaciones-publicas-flash-cards/
      - id: what
        type: callout
        tone: info
        title: ¿Qué son las relaciones públicas?
        text: |-
          Las **relaciones públicas** (RRPP) son el área o la profesión que se encarga de crear y mantener una buena imagen de una persona, empresa o institución ante el público. Su objetivo es comunicar bien, generar confianza y construir una reputación positiva.
          Alguien que trabaja en relaciones públicas puede organizar eventos, hablar con la prensa, manejar la comunicación de una empresa, resolver crisis de imagen y cuidar cómo el público ve a una marca o a una persona.
          **En pocas palabras:** relaciones públicas = comunicación estratégica con la gente para crear una buena imagen.
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___. Para mí, en las RRPP es importante ___ porque ___.
        example: Soy Ana. Para mí, en las relaciones públicas es importante escuchar al público porque, si tengo una marca, necesito entender lo que la gente necesita.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de preparación
      - id: warmup
        type: discussionQuestions
        items:
          - question: ¿Qué significa para ti «tener buena imagen» en la vida profesional o en las redes sociales? Incluye un ejemplo real o hipotético.
            frame: Para mí, tener buena imagen es ___. Por ejemplo, ___.
          - question: ¿Qué hace una persona profesional? ¿Y una persona poco profesional?
            frame: Una persona profesional ___. Una persona poco profesional ___.
          - question: ¿La mayoría de la gente que trabaja en atención al cliente en Israel hace un buen trabajo? ¿Es profesional?
            frame: Creo que sí / no porque ___.
          - question: ¿Qué cualidades tiene que tener una persona que trabaja en atención al cliente?
            frame: Tiene que tener paciencia, ___.
          - question: ¿Qué ventajas y desventajas tiene trabajar como empleado y no como autónomo?
            frame: Una ventaja es que ___. Una desventaja es que ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividad
      - id: act1
        type: classActivity
        title: 'Actividad: Crea tu perfil profesional como autónomo'
        skills: [Presentación profesional]
        steps:
          - 'Imagina que eres una persona autónoma. Puedes ser lo que quieras: profesor, diseñador, traductor, coach, fotógrafo, programador, guía turístico, etc. Vas a crear un perfil profesional para tu «empresa personal».'
          - '**Paso 1, elige tu identidad profesional:** nombre profesional, profesión o servicios, ciudad o país, a quién ayudas (tipo de clientes).'
          - '**Paso 2, escribe tu presentación** (5 o 6 líneas) con el modelo de abajo.'
          - '**Paso 3, define tu imagen profesional:** responde en frases cortas.'
          - Presenta tu perfil al grupo.
        example: |-
          *Me llamo Laura Gómez. Soy diseñadora gráfica en Barcelona. Ayudo a pequeñas empresas a crear su imagen visual.*
      - id: act1-step1
        type: discussionQuestions
        title: 'Paso 1: Mi identidad profesional'
        items:
          - question: Nombre profesional
          - question: Profesión / servicios
          - question: Ciudad / país
          - question: A quién ayudas (tipo de clientes)
      - id: act1-model
        type: examples
        title: 'Paso 2: Modelo de presentación'
        items:
          - text: Me llamo Dalia y soy diseñadora de interiores.
          - text: Trabajo de forma autónoma en Ramat Gan, Petaj Tikva y Bnei Brak.
          - text: Ayudo a la gente que tiene una casa vieja y quiere reformarla.
          - text: Me especializo en cambiar el interior de las casas.
          - text: Mis clientes me eligen porque tengo mucha paciencia con ellos.
          - text: Mi objetivo profesional es que mis clientes se sientan satisfechos con mi trabajo.
      - id: act1-step2
        type: discussionQuestions
        title: 'Paso 2: Mi presentación'
        items:
          - question: Me llamo ___ y soy ___.
          - question: Trabajo de forma autónoma en ___.
          - question: Ayudo a ___ a ___.
          - question: Me especializo en ___.
          - question: Mis clientes me eligen porque ___.
          - question: Mi objetivo profesional es ___.
      - id: act1-step3
        type: discussionQuestions
        title: 'Paso 3: Mi imagen profesional'
        items:
          - question: Tres adjetivos que describen tu estilo profesional.
            frame: Soy ___, ___ y ___.
          - question: ¿Qué te diferencia de otros profesionales?
            frame: A diferencia de otros profesionales, yo ___.
          - question: ¿Qué problema principal resuelves para tus clientes?
            frame: Ayudo a mis clientes a ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Habilidades del ciclo: **Presentación profesional** (preguntas de preparación y
          actividad) y **Modismos y siglas** (vocabulario y tarea con Mori). El cuaderno
          no indica tiempos para la clase. Lee con el grupo la explicación de qué son las
          relaciones públicas antes de la ronda de introducción.
      - id: n-intro
        anchor: intro
        text: Da tu propio ejemplo primero y después pregunta a cada estudiante. Pide siempre una razón con *porque*.
      - id: n-warmup
        anchor: warmup-title
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act1
        anchor: act1
        text: >-
          Esta actividad entrena lengua profesional, claridad, imagen personal y confianza
          al hablar. Corrige las estructuras *ayudar a + infinitivo*, *especializarse en*
          y *mi objetivo es + infinitivo*. Al final, cada estudiante presenta su perfil y
          el grupo dice qué le convenció.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: relaciones-publicas-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-presentacion
        type: ruleSummary
        skill: Presentación profesional
        rules:
          - text: 'Usamos el **presente** para hablar de identidad y trabajo.'
            examples: ['Me llamo…, soy…, trabajo…, ayudo…, me especializo…']
          - text: '**Ayudar a** + personas + **a** + infinitivo.'
            examples:
              [
                Ayudo a mis alumnos a expresarse.,
                Ayudo a pequeñas empresas a crear su imagen visual.,
              ]
          - text: '**Especializarse en** + sustantivo o infinitivo.'
            examples:
              [
                Me especializo en diseño de interiores.,
                Me especializo en crear esculturas de arcilla.,
              ]
          - text: '**Mi objetivo (profesional) es** + infinitivo. Si hablamos de otra persona, usamos **es que** + subjuntivo.'
            examples:
              - Mi objetivo es tener más clientes.
              - Mi objetivo profesional es que mis clientes se sientan satisfechos.
          - text: 'Para dar razones usamos **porque** + verbo conjugado.'
            examples: [Mis clientes me eligen porque tengo paciencia.]
          - text: 'Adjetivos para describir un estilo profesional:'
            examples: ['creativo, paciente, profesional, cercano, organizado, flexible']
      - id: structures-table
        type: table
        caption: Estructuras para la presentación profesional
        header: [Estructura, Ejemplo]
        rows:
          - [Me llamo + nombre, Me llamo Laura Gómez.]
          - [Soy + profesión, Soy diseñadora gráfica.]
          - [Trabajo de forma autónoma en + lugar, Trabajo de forma autónoma en Barcelona.]
          - [Ayudo a + personas + a + infinitivo, Ayudo a pequeñas empresas a crear su imagen.]
          - [Me especializo en + sustantivo / infinitivo, Me especializo en diseño gráfico.]
          - [Mis clientes me eligen porque + razón, Mis clientes me eligen porque soy creativa.]
          - [
              Mi objetivo profesional es + infinitivo,
              Mi objetivo profesional es tener más clientes.,
            ]
      - id: rules-modismos
        type: ruleSummary
        skill: Modismos y siglas
        rules:
          - text: 'Un **modismo** es una expresión con un sentido especial. Piensa en el público: en un texto formal (una disculpa oficial, un comunicado) algunos modismos pueden sonar poco serios.'
            examples:
              - 'Tener buena imagen / cuidar la imagen: tener o mantener una buena reputación.'
              - 'Volverse viral: hacerse muy conocido en internet muy rápido.'
              - 'Borrón y cuenta nueva: olvidar el pasado y empezar de nuevo.'
              - 'Dar (echar) una mano: ayudar.'
          - text: 'Las **siglas** se forman con las primeras letras de las palabras. En español, las letras dobles indican plural.'
            examples:
              - RRPP = relaciones públicas
              - ONG = organización no gubernamental
              - TV = televisión
              - CEO = director ejecutivo (sigla del inglés)
      - id: rules-tiempos
        type: ruleSummary
        skill: Pasado, presente y futuro (para la tarea)
        rules:
          - text: 'Para contar una crisis: **pasado** (qué pasó), **presente** (qué hacemos ahora) y **futuro** (qué vamos a hacer).'
            examples:
              - Ha habido una crisis pequeña en las redes.
              - Ahora la empresa está transmitiendo un mensaje claro.
              - En el futuro va a cuidar mejor su imagen.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las estructuras con el grupo y pide un ejemplo nuevo para cada una.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: relaciones-publicas-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: 'Tiempo recomendado: 20 minutos. Objetivo: practicar la narración con varios tiempos, los modismos, las siglas y las opiniones con razones. Abre el chat con Mori, copia un mensaje y envíalo.'
      - id: mori-1
        type: aiTutorPrompt
        title: 'Actividad 1: «Soy el portavoz»'
        intro: |-
          En cada respuesta: máximo 3 frases cortas, con un mensaje claro (no justifiques de más).
          **Ejemplo.** Mori: *¿Qué ha pasado exactamente y cómo empezó el problema?* Tú: *Ha habido un error en las redes sociales y la imagen de la empresa se ha visto afectada. Ahora trabajamos con RRPP porque queremos recuperar la confianza.* Mori: *¡Bien! También puedes decir «Ahora estamos trabajando con RRPP» para una acción en curso. Repítelo, por favor.*
        message: |-
          Hola Mori. Quiero practicar relaciones públicas.
          Sé mi periodista y hazme 6 preguntas sobre una crisis pública.
          Yo soy el portavoz y debo responder con:
          – pasado, presente o futuro
          – al menos 1 conector
          – 1 sigla por respuesta
          Corrige mis errores inmediatamente y pídeme que repita la frase corregida.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Actividad 2: «Modismo correcto o peligroso»'
        intro: |-
          Practicas el uso real de los modismos, el registro (formal / informal) y la adecuación al contexto.
          **Ejemplo de respuesta:** *Es peligroso usar este modismo en una disculpa formal porque puede sonar poco serio. Yo diría: «La empresa quiere cuidar su imagen y comunicar con claridad».*
        message: |-
          Hola Mori. Dame 8 frases relacionadas con las RRPP.
          En algunas, el modismo está bien usado y en otras está mal usado.
          Yo tengo que decir si es correcto o peligroso, explicar por qué y proponer una versión mejor.
          Corrige mis errores y dame la versión natural.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Actividad 3: «Mensaje con siglas»'
        intro: 'Situaciones que Mori puede darte: empresa tecnológica + público general; ONG + donantes; CEO + empleados; marca joven + redes sociales.'
        message: |-
          Hola Mori. Quiero escribir un mensaje corto de RRPP.
          Dame una situación (empresa, ONG o persona pública) y un público específico.
          Yo escribiré un texto de máximo 5 frases con:
          – 2 siglas
          – 1 modismo
          – 1 conector
          Después, pregúntame si las siglas son adecuadas para ese público y cómo cambiaría el mensaje para otro público.
          Corrige todo y ayúdame a mejorar el texto.
      - id: mori-4
        type: aiTutorPrompt
        title: 'Actividad 4: «Antes, ahora, después»'
        intro: '**Ejemplo de respuesta:** *Ha habido una crisis pequeña en las redes. Ahora la empresa está transmitiendo un mensaje claro. En el futuro va a cuidar mejor su imagen.*'
        message: |-
          Hola Mori. Dame 3 situaciones breves de RRPP.
          Para cada una, debo responder con:
          – 1 frase en pasado
          – 1 frase en presente
          – 1 frase en futuro
          Corrige mis tiempos verbales y ayúdame a conectar mejor las frases.
      - id: reminder
        type: callout
        tone: info
        title: Recordatorio final
        text: |-
          Durante toda la tarea con Mori:
          1. Prioriza el mensaje, no la perfección.
          2. Usa conectores simples.
          3. Piensa siempre en el público.
          4. Acepta la corrección y repite la versión correcta.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**

