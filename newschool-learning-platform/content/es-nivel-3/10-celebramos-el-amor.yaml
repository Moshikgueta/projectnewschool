# Cycle "Celebramos el amor", converted from the Spanish level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-3
slug: celebramos-el-amor
title: Celebramos el amor
goal: Expresar deseos, emociones y consejos con el subjuntivo y contar lo que otros dijeron en estilo indirecto.
position: 10
status: in_review

review:
  - >-
    The two workbook exercises ("Subjuntivo" and "Estilo indirecto") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's summary
    rules, the activity examples and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Skills: the notebook lists four (comparativos y superlativos; subjuntivo; estilo
    indirecto; conectores). The cycle overview and the workbook use the two that the
    activities and the summary actually teach: subjuntivo (Activities 2 and 3) and
    estilo indirecto (Activities 4 and 5). Comparatives are still practised in the
    introduction round, a warm-up question and Mori part 3, and a short comparatives
    rule was ADDED to the summary (the source summary has none). Connectors have no
    activity or rule in the source; they are only mentioned in the plan note.
  - >-
    Summary, subjuntivo: the "Regla básica" (first verb indicative + que + second verb
    subjunctive) was completed: it applies when the two verbs have DIFFERENT subjects;
    with the same subject Spanish uses the infinitive (Quiero viajar, not *Quiero que
    viaje* about oneself). "Ojalá" is not a verb: it is now presented as an expression
    that always takes the subjunctive. Emotion (Me alegra que…), recommendation (Es
    mejor que…, Te aconsejo que…) and doubt (No creo que…, Dudo que…) were added to the
    rules because Activity 3 uses them. "Hipótesis" was dropped from the list of uses
    (hypotheses with si are not taught in this cycle). Please confirm.
  - >-
    Summary, estilo indirecto: the table is kept; a note was added that after a past
    indefinido the speaker can also keep the indefinido (Contó que me regaló flores),
    and the workbook accepts both. The title "Estilo indirecto (reported speech)" lost
    its English part. Rows of the table with an empty third column were reformatted.
  - >-
    Corrections: "Es importante que una pareja confíe en el otro" → "Es importante que
    los dos miembros de la pareja confíen el uno en el otro"; "Actividad 4: ¡teléfono
    del amor (role play en cadena)" → "El teléfono del amor (juego en cadena)";
    Activity 5 "usar reported speech" → "usar el estilo indirecto" and "Role play" →
    "Juego de rol"; Activity 2 game "Match de deseos" (English) → "Deseos en común";
    "Profesor presenta el objetivo" → teacher note; "Nivel: 3 (extremo)" was removed.
    A stray "." line after Activity 3 was removed.
  - >-
    Mori: the homework is written as Mori's lines plus the expected student answers.
    It is rewritten as four messages the student sends to Mori; the source's model
    answers are given as examples in the intro of each message. Mori part 2 answers
    (Ella dijo que me amaba, etc.) are not shown, so that the student does the
    transformation.
  - >-
    Vocabulary glosses changed: "Pareja, זוג" → "בן / בת זוג; זוג" (pareja usually means
    one's partner); "Intimidad, קרבה" → "אינטימיות / קרבה"; "Declaración, הצהרה" →
    "הצהרה / וידוי (אהבה)". Please confirm.
  - >-
    Times given as ranges are recorded as the upper value (Activity 3: 15–20 → 20).
    Activities 1, 4 and 5 have only step times; they are in the teacher notes. The
    Quizlet link is kept without its "?new" parameter. The "Respuesta de alumno 1/2/3"
    lines are replaced by the answer boxes. Activity 1 asks students to research
    festivities; no source or link is given. The "Festival de los Faroles (Taiwán)" is
    not a typical love festival; please check that it is the festivity you meant.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: celebramos-el-amor-clase
    title: 'Clase: Celebramos el amor'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: ¡Celebramos el amor!
      - id: skills
        type: cycleOverview
        skills:
          - name: Subjuntivo
            description: 'Deseos, emociones, consejos y dudas: *Quiero que…, Espero que…, Ojalá que…, Me alegra que…, Es mejor que…, Dudo que…*'
          - name: Estilo indirecto
            description: 'Contar lo que dijo otra persona: *«Te amo». → Dijo que me amaba.*'
      - id: also
        type: text
        text: 'También repasamos los **comparativos y superlativos** (*más… que, tan… como, menos… que, la más romántica*).'
      - id: quizlet
        type: externalLink
        label: Celebramos el amor en Quizlet
        url: https://quizlet.com/br/1073213590/celebramos-el-amor-nivel-3-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___ y creo que el amor es ___ (más importante que / tan difícil como / menos complicado que) ___.
        example: Soy Ana y creo que el amor es más importante que el dinero.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de preparación
      - id: warmup
        type: discussionQuestions
        items:
          - question: '**Comparativos:** ¿Crees que el amor es más importante que el dinero? ¿Por qué?'
            frame: Creo que el amor es más / menos importante que el dinero porque ___.
          - question: '**Superlativos:** ¿Cuál es para ti la celebración más romántica que conoces?'
            frame: Para mí, la celebración más romántica es ___ porque ___.
          - question: '**Subjuntivo (deseo):** Completa: *Quiero que mi pareja…* ¿Qué pondrías?'
            frame: Quiero que mi pareja ___.
          - question: '**Subjuntivo (emoción):** ¿Qué situación te alegra en una relación?'
            frame: Me alegra que mi pareja ___.
          - question: '**Estilo indirecto:** Imagina que tu mejor amigo te dijo: «Estoy enamorado». ¿Cómo lo contarías?'
            frame: Mi mejor amigo me dijo que ___.
          - question: '**Cultura y normas sociales:** En tu cultura, ¿qué costumbre de amor o de pareja es diferente a otras culturas?'
            frame: En mi cultura ___, pero en otras culturas ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Conozcamos diferentes celebraciones del amor'
        skills: [Comparativos y superlativos]
        steps:
          - 'En grupos de 2 o 3, reciban una festividad diferente y busquen: nombre, cultura o país y fecha; origen histórico; cómo se celebra hoy.'
          - Presenten su festividad al grupo en 2 minutos.
          - Comparen las festividades con comparativos y superlativos.
        example: |-
          *El nombre del día festivo es… y se celebra en…*
          *Se originó en…; hoy la gente celebra…*
        wordBank:
          - Holi (India)
          - San Valentín (EE. UU. / Brasil)
          - Tu B'Av (Israel)
          - Día de Sant Jordi (Cataluña)
          - Día Blanco (Corea / Japón)
          - Festival de los Faroles (Taiwán)
      - id: act1-notes
        type: discussionQuestions
        title: Nuestra festividad
        items:
          - question: El nombre del día festivo es ___ y se celebra en ___.
          - question: Se originó en ___.
          - question: Hoy la gente celebra ___.
          - question: 'Comparación: ___ es más / menos ___ que ___.'
      - id: act2
        type: classActivity
        title: 'Actividad 2: Deseos y subjuntivo'
        skills: [Subjuntivo]
        minutes: 15
        steps:
          - 'Completa oralmente las frases de la pizarra: *Quiero que… / Espero que… / Ojalá que…*'
          - Escribe 5 deseos para una relación ideal.
          - 'En parejas, lee 2 o 3 frases. Tu compañero escucha y corrige si falta el subjuntivo.'
          - '**Deseos en común:** comparte con el grupo un deseo fuerte. ¿Quién más quiere lo mismo? ¿Quién tiene un deseo opuesto?'
        example: |-
          *Quiero que mi pareja me escuche.*
          *Espero que podamos viajar juntos.*
          *Ojalá que nunca discutamos por tonterías.*
          *Quiero que mi pareja me sorprenda a veces.*
          *Espero que siempre haya confianza.*
      - id: act2-wishes
        type: discussionQuestions
        title: Mis 5 deseos para una relación ideal
        items:
          - question: Quiero que mi pareja ___.
          - question: Espero que ___.
          - question: Ojalá que ___.
          - question: Quiero que ___.
          - question: Espero que ___.
      - id: act2-variations
        type: callout
        tone: info
        title: Variaciones opcionales
        text: |-
          **Creativa:** escribe un «contrato de pareja ideal» con 3 cláusulas en subjuntivo.
          **Competitiva:** los grupos votan por el deseo más original o más divertido.
      - id: act3
        type: classActivity
        title: 'Actividad 3: Situaciones románticas y subjuntivo'
        skills: [Subjuntivo]
        minutes: 20
        steps:
          - Lee las situaciones románticas que muestra tu profesor.
          - 'En parejas, reaccionen a cada situación con expresiones que llevan subjuntivo: deseos (*Quiero que… / Ojalá que…*), recomendaciones (*Es mejor que… / Te aconsejo que…*), emociones (*Me alegra que… / Me molesta que…*), duda o negación (*No creo que… / Dudo que…*).'
          - Cada pareja comparte con el grupo una situación y sus frases.
        example: |-
          Situación: *Tu pareja llega tarde.*
          **A:** *Quiero que me expliques por qué llegaste tarde.*
          **B:** *Es importante que entiendas que había tráfico.*
      - id: act3-situations
        type: discussionQuestions
        title: Situaciones románticas
        items:
          - question: Tu pareja llega tarde a una cita importante.
            frame: Quiero que ___. / Es mejor que ___.
          - question: Alguien te regala flores en el trabajo.
            frame: Me alegra que ___. / No creo que ___.
          - question: Tu mejor amigo quiere declararse a alguien, pero tiene miedo.
            frame: Te aconsejo que ___. / Ojalá que ___.
          - question: Una pareja discute en un restaurante.
            frame: Me molesta que ___. / Es mejor que ___.
          - question: Una persona prepara una sorpresa de aniversario.
            frame: Espero que ___. / Dudo que ___.
      - id: act3-variation
        type: callout
        tone: info
        title: Variación opcional
        text: Cada pareja inventa su propia situación romántica y prepara 2 o 3 frases en subjuntivo para presentarla al grupo.
      - id: act4
        type: classActivity
        title: 'Actividad 4: El teléfono del amor (juego en cadena)'
        skills: [Estilo indirecto]
        steps:
          - El primer estudiante lee una frase de amor en estilo directo.
          - El segundo estudiante la repite en estilo indirecto.
          - El tercero la transforma de nuevo y añade un matiz.
          - La cadena continúa hasta 5 o 6 estudiantes.
          - 'Comparen la primera frase y la última: ¿se mantuvo el sentido?'
        example: |-
          *«Te amo».*
          *Él dijo que la amaba.*
          *Ella comentó que él había dicho que la amaba.*
      - id: act4-phrases
        type: discussionQuestions
        title: Del estilo directo al indirecto
        items:
          - question: '«Te amo». → Dijo que ___.'
          - question: '«Quiero casarme contigo». → Dijo que ___.'
          - question: '«Nunca te olvidaré». → Prometió que ___.'
          - question: '«Siempre confiaré en ti». → Dijo que ___.'
      - id: act5
        type: classActivity
        title: 'Actividad 5: Periodistas del corazón (entrevista y reporte)'
        skills: [Estilo indirecto]
        steps:
          - 'En parejas: un estudiante es un personaje famoso o ficticio (actor, cantante, influencer, Romeo o Julieta…). El otro es periodista y le hace 3 o 4 preguntas románticas.'
          - El personaje responde con frases directas.
          - El periodista escribe un mini artículo (5 o 6 líneas) en estilo indirecto.
          - Los periodistas leen su artículo al grupo.
        example: |-
          **Periodista:** *¿Qué le dijiste a tu pareja en su aniversario?*
          **Actor:** *Le regalé flores y le dije: «Eres mi vida».*
          **Artículo:** *El actor contó que le había regalado flores a su pareja y que le había dicho que era su vida.*
      - id: act5-questions
        type: discussionQuestions
        title: Preguntas del periodista
        items:
          - question: ¿Qué le dijiste a tu pareja en su aniversario?
          - question: ¿Cómo declaraste tu amor por primera vez?
          - question: '**Mi artículo:** El personaje contó que ___.'
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Habilidades del ciclo: **Subjuntivo** (Actividades 2 y 3) y **Estilo indirecto**
          (Actividades 4 y 5). Los comparativos y superlativos aparecen en la ronda de
          introducción, en las preguntas de preparación y en la Actividad 1. El cuaderno
          menciona también los **conectores** (*porque, ya que, aunque, así que*): anímalos a
          usarlos en las presentaciones y narraciones. El cuaderno no indica qué actividades
          combinar.
      - id: n-intro
        anchor: intro
        text: >-
          Presenta el objetivo: «Hoy vamos a practicar cómo expresar emociones, deseos,
          consejos y comparaciones al hablar del amor». Da tu propio ejemplo primero.
      - id: n-warmup
        anchor: warmup-title
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act1
        anchor: act1
        text: >-
          Investigación en grupos: 10 minutos. Presentaciones: 2 minutos por grupo. Da a
          cada grupo una festividad de la lista. Modelo para presentar: «El nombre del día
          festivo es… y se celebra en…» / «Se originó en…, hoy la gente celebra…».
      - id: n-act2
        anchor: act2
        minutes: 15
        text: >-
          Activación: 3 minutos (escribe en la pizarra *Quiero que… / Espero que… / Ojalá
          que…* y refuerza: «Después de estas expresiones usamos el subjuntivo»). Escritura
          individual: 5 minutos. Parejas: 5 minutos (deja en la pizarra el recordatorio
          *Quiero que / Espero que / Ojalá que + subjuntivo*). Deseos en común: 4 minutos.
      - id: n-act3
        anchor: act3
        minutes: 20
        text: >-
          Preparación: 2 minutos (reparte tarjetas o muestra las situaciones en pantalla).
          Parejas: 10 minutos. Puesta en común: 5 minutos. Corrige si alguien usa el
          indicativo en lugar del subjuntivo.
      - id: n-act4
        anchor: act4
        text: >-
          Preparación: 3 minutos (reparte tarjetas con frases directas: *Te amo. / Quiero
          casarme contigo. / Nunca te olvidaré. / Siempre confiaré en ti.*). Cadena: 10
          minutos. Revisión: 5 minutos; corrige los tiempos verbales y los pronombres.
      - id: n-act5
        anchor: act5
        text: >-
          Juego de rol: 8 minutos. Escritura del artículo: 7 minutos. Lectura: 5 minutos.
          Corrige los tiempos verbales y las estructuras del estilo indirecto.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: celebramos-el-amor-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-subjuntivo
        type: ruleSummary
        skill: Subjuntivo
        rules:
          - text: 'Usamos el **subjuntivo** después de expresiones de **deseo**, **emoción**, **recomendación** y **duda**.'
          - text: '**Deseo:** *quiero que, espero que, deseo que, ojalá (que)*. *Ojalá* no es un verbo: es una expresión que siempre lleva subjuntivo.'
            examples:
              - Quiero que mi pareja me escuche.
              - Espero que podamos viajar juntos.
              - Deseo que siempre seas feliz.
              - Espero que siempre haya confianza. (haber → haya)
              - Ojalá que nunca discutamos por tonterías.
          - text: '**Emoción:** *me alegra que, me molesta que*.'
            examples: [Me alegra que mi pareja me sorprenda., Me molesta que llegues tarde.]
          - text: '**Recomendación:** *es mejor que, es importante que, te aconsejo que*.'
            examples:
              - Es importante que los dos miembros de la pareja confíen el uno en el otro.
              - Te aconsejo que hables con ella.
          - text: '**Duda o negación:** *dudo que, no creo que*.'
            examples: [Dudo que llegue a tiempo., No creo que sea una buena idea.]
          - text: '**Regla básica:** primer verbo en **indicativo** + *que* + segundo verbo en **subjuntivo**, cuando los dos verbos tienen **sujetos diferentes**. Si el sujeto es el mismo, usamos el infinitivo.'
            examples:
              - Quiero que mi pareja me escuche. (yo / mi pareja)
              - Quiero viajar contigo. (yo / yo)
      - id: subjuntivo-table
        type: table
        caption: Presente de subjuntivo
        header: [Persona, escuchar, poder, discutir, ser]
        rows:
          - [yo, escuche, pueda, discuta, sea]
          - [tú, escuches, puedas, discutas, seas]
          - [él / ella / usted, escuche, pueda, discuta, sea]
          - [nosotros / nosotras, escuchemos, podamos, discutamos, seamos]
          - [ellos / ellas / ustedes, escuchen, puedan, discutan, sean]
      - id: rules-indirecto
        type: ruleSummary
        skill: Estilo indirecto
        rules:
          - text: 'Cuando contamos lo que **otra persona dijo**, usamos el **estilo indirecto**. En el estilo directo repetimos sus palabras exactas; en el indirecto cambiamos los tiempos verbales y los pronombres.'
            examples: ['Marta dijo: «Te amo». → Marta dijo que me amaba.']
          - text: '**Estructura:** verbo de decir o pensar + *que* + verbo en estilo indirecto.'
            examples:
              - '«Quiero estar contigo». → Él dijo que quería estar conmigo.'
              - '«Nunca te olvidaré». → Ella prometió que nunca me olvidaría.'
          - text: 'Verbos para introducir el estilo indirecto:'
            examples: ['dijo que, contó que, explicó que, comentó que, prometió que, confesó que']
          - text: 'Cambiamos los pronombres si es necesario (*te → me, contigo → conmigo, yo → él / ella*).'
            examples: ['«Te amo». → Dijo que me amaba.']
      - id: indirecto-table
        type: table
        caption: Cambios de tiempos verbales (con el verbo introductorio en pasado)
        header: [Estilo directo, Estilo indirecto, Ejemplo]
        rows:
          - [Presente, Imperfecto, '«Te amo». → Dijo que me **amaba**.']
          - [
              Futuro,
              Condicional,
              '«Siempre estaré contigo». → Dijo que siempre **estaría** conmigo.',
            ]
          - [
              Pretérito perfecto,
              Pluscuamperfecto,
              '«He pensado en ti». → Dijo que **había pensado** en mí.',
            ]
          - [
              Pretérito indefinido,
              Pluscuamperfecto (o indefinido),
              '«Te regalé flores». → Contó que me **había regalado** flores. / Contó que me **regaló** flores.',
            ]
      - id: rules-comparativos
        type: ruleSummary
        skill: Comparativos y superlativos (repaso)
        rules:
          - text: '**Comparativos:** *más / menos* + adjetivo + *que*; *tan* + adjetivo + *como*.'
            examples:
              - El Día de San Valentín es más comercial que Tu B'Av.
              - El amor es tan difícil como la amistad.
          - text: '**Superlativo:** *el / la / los / las + más* + adjetivo.'
            examples: [Holi es la fiesta más colorida.]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos habilidades con el grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: celebramos-el-amor-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia un mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Parte 1: Deseos con subjuntivo'
        intro: 'Ejemplos: *Quiero que mi pareja me escuche. Espero que podamos viajar juntos. Ojalá que nunca discutamos por tonterías.*'
        message: >-
          Hola Mori, quiero practicar el subjuntivo para expresar deseos. Pídeme 3 frases
          con «Quiero que…», después 2 frases con «Espero que…» y al final 2 frases con
          «Ojalá que…» sobre una relación ideal. Si uso el indicativo en lugar del
          subjuntivo, corrígeme y explícame la forma correcta.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Parte 2: Estilo indirecto'
        intro: 'Ejemplos de frases que Mori te puede dar: *Ella dijo: «Te amo». / Él comentó: «Quiero casarme contigo». / Ellos explicaron: «Nunca te olvidaremos».*'
        message: >-
          Hola Mori, quiero practicar el estilo indirecto. Dame frases de amor en estilo
          directo, una por una, y yo las transformo al estilo indirecto. Corrígeme si
          olvido cambiar el tiempo verbal o los pronombres.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Parte 3: Comparativos y superlativos'
        intro: "Ejemplos: *El Día de San Valentín es más comercial que Tu B'Av. Holi es la fiesta más colorida.*"
        message: >-
          Hola Mori, quiero practicar los comparativos y superlativos. Pídeme una frase
          que compare dos celebraciones del amor con «más… que» o «tan… como», y después
          otra frase con un superlativo («el / la más…»). Corrige mis frases.
      - id: mori-4
        type: aiTutorPrompt
        title: 'Parte 4: Reflexión escrita'
        message: >-
          Hola Mori, quiero escribir una reflexión de 3 o 4 frases sobre esta clase. Voy a
          responder: ¿Cuál fue la parte más fácil: el subjuntivo, el estilo indirecto o los
          comparativos? ¿Qué fue lo más difícil? Y te voy a dar un ejemplo concreto de lo
          que escribí. Corrige mis errores.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: celebramos-el-amor-practica
    book: workbook
    title: 'Práctica: Celebramos el amor'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practica las dos habilidades del ciclo. Cada respuesta se corrige al momento, y puedes intentarlo otra vez.
      - id: ex-subjuntivo
        type: activity
        activity: celebramos-el-amor-subjuntivo
      - id: ex-indirecto
        type: activity
        activity: celebramos-el-amor-indirecto

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: celebramos-el-amor-vocabulario
    title: Vocabulario
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Palabras del amor y las celebraciones
        glossLang: he
        link: https://quizlet.com/br/1073213590/celebramos-el-amor-nivel-3-flash-cards/
        items: &celebramos-el-amor-words
          - { term: Afecto, gloss: חיבה }
          - { term: Cariño, gloss: אהבה / חיבה }
          - { term: Compromiso, gloss: מחויבות }
          - { term: Confianza, gloss: אמון }
          - { term: Fidelidad, gloss: נאמנות }
