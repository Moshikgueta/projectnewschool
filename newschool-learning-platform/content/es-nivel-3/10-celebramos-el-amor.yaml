vocabulary:
  - slug: celebramos-el-amor
    title: Celebramos el amor
    items: *celebramos-el-amor-words

activities:
  - slug: celebramos-el-amor-subjuntivo
    title: 'Subjuntivo: quiero que, espero que, ojalá'
    minutes: 8
    items:
      - id: escuche
        type: multipleChoice
        prompt: Quiero que mi pareja me ___.
        options:
          - { text: escuche, correct: true }
          - {
              text: escucha,
              feedback: '*Escucha* es indicativo. Después de *quiero que* usamos el subjuntivo: *escuche*.',
            }
          - {
              text: escuchar,
              feedback: 'Usamos el infinitivo solo cuando el sujeto es el mismo (*Quiero escuchar*). Aquí hay dos sujetos (yo / mi pareja): *que me escuche*.',
            }
      - id: podamos
        type: fillBlank
        prompt: Completa con el verbo *poder* en subjuntivo (nosotros).
        text: Espero que ___ viajar juntos.
        blanks: [[podamos, nosotros podamos]]
      - id: discutamos
        type: multipleChoice
        prompt: Ojalá que nunca ___ por tonterías.
        options:
          - { text: discutamos, correct: true }
          - {
              text: discutimos,
              feedback: '*Discutimos* es indicativo. *Ojalá* siempre lleva subjuntivo: *discutamos*.',
            }
          - {
              text: discutiremos,
              feedback: '*Discutiremos* es futuro. Después de *ojalá* usamos el subjuntivo: *discutamos*.',
            }
      - id: alegra
        type: trueFalse
        prompt: '*Me alegra que estás aquí* es correcto.'
        answer: false
        feedback:
          correct: '¡Correcto! Después de *me alegra que* (emoción) usamos el subjuntivo: *Me alegra que estés aquí.*'
          incorrect: 'Después de *me alegra que* (emoción) usamos el subjuntivo: *Me alegra que estés aquí.*'
      - id: tipos
        type: matching
        prompt: Une cada expresión con lo que expresa.
        pairs:
          - [Quiero que…, un deseo]
          - [Me alegra que…, una emoción]
          - [Te aconsejo que…, una recomendación]
          - [Dudo que…, una duda]
      - id: haya
        type: fillBlank
        prompt: Completa con el verbo *haber* en subjuntivo.
        text: Es importante que en una pareja ___ confianza.
        blanks: [[haya]]
      - id: diga
        type: multipleChoice
        prompt: No creo que él ___ la verdad.
        options:
          - { text: diga, correct: true }
          - { text: dice, feedback: '*No creo que* expresa duda: usamos el subjuntivo, *diga*.' }
          - {
              text: decir,
              feedback: 'Hay dos sujetos (yo / él), así que usamos *que* + subjuntivo: *que él diga*.',
            }
      - id: ordena-ojala
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Ojalá que nunca discutamos por tonterías.

  - slug: celebramos-el-amor-indirecto
    title: 'Estilo indirecto: dijo que…'
    minutes: 8
    items:
      - id: amaba
        type: multipleChoice
        prompt: 'Marta dijo: «Te amo». → Marta dijo que me ___.'
        options:
          - { text: amaba, correct: true }
          - {
              text: amo,
              feedback: 'Con el verbo introductorio en pasado (*dijo*), el presente cambia a imperfecto: *amaba*.',
            }
          - {
              text: amará,
              feedback: '*Amará* es futuro. El presente *amo* cambia a imperfecto: *amaba*.',
            }
      - id: estaria
        type: fillBlank
        prompt: Completa en estilo indirecto.
        text: '«Siempre estaré contigo». → Dijo que siempre ___ conmigo.'
        blanks: [[estaría]]
      - id: habia-pensado
        type: multipleChoice
        prompt: '«He pensado en ti». → Dijo que ___ en mí.'
        options:
          - { text: había pensado, correct: true }
          - {
              text: ha pensado,
              feedback: 'Con *dijo*, el pretérito perfecto (*he pensado*) cambia a pluscuamperfecto: *había pensado*.',
            }
          - {
              text: pensaría,
              feedback: '*Pensaría* es condicional; lo usamos para el futuro. *He pensado* cambia a *había pensado*.',
            }
      - id: une-frases
        type: matching
        prompt: Une cada frase en estilo directo con su forma en estilo indirecto.
        pairs:
          - [«Te amo»., Dijo que me amaba.]
          - [«Nunca te olvidaré»., Prometió que nunca me olvidaría.]
          - [«Quiero casarme contigo»., Dijo que quería casarse conmigo.]
          - [«He pensado en ti»., Dijo que había pensado en mí.]
      - id: que
        type: trueFalse
        prompt: 'En estilo indirecto, después del verbo de comunicación ponemos *que*: *Él dijo que quería estar conmigo.*'
        answer: true
        feedback:
          correct: ¡Correcto! Verbo de decir + *que* + verbo en estilo indirecto.
          incorrect: 'Sí, siempre ponemos *que*: *dijo que, contó que, prometió que…*'
      - id: conmigo
        type: fillBlank
        prompt: 'Él me dijo: «Quiero estar contigo». Cuéntalo en estilo indirecto.'
        text: Él dijo que ___ estar ___.
        blanks: [[quería], [conmigo]]
      - id: olvidarian
        type: multipleChoice
        prompt: 'Ellos explicaron: «Nunca te olvidaremos». → Ellos explicaron que nunca me ___.'
        options:
          - { text: olvidarían, correct: true }
          - {
              text: olvidaremos,
              feedback: 'Hay que cambiar el futuro a condicional y la persona: *olvidaremos → olvidarían*.',
            }
          - {
              text: olvidaban,
              feedback: '*Olvidaban* es imperfecto. El futuro cambia a condicional: *olvidarían*.',
            }
      - id: ordena-prometio
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Ella prometió que nunca me olvidaría.
