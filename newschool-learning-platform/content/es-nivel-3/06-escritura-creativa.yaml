activities:
  - slug: escritura-creativa-narracion
    title: 'Narrar en pasado: vi, estaba, había desaparecido'
    minutes: 8
    items:
      - id: vi
        type: multipleChoice
        prompt: Ayer ___ una sombra en la biblioteca.
        options:
          - { text: vi, correct: true }
          - {
              text: veía,
              feedback: 'El imperfecto (*veía*) es para descripciones y rutinas. Para un hecho puntual usamos el indefinido: *vi*.',
            }
          - {
              text: había visto,
              feedback: 'El pluscuamperfecto es para una acción anterior a otra acción pasada. Aquí es un hecho puntual: *vi*.',
            }
      - id: estaban
        type: multipleChoice
        prompt: Todos ___ en silencio cuando empezó la tormenta.
        options:
          - { text: estaban, correct: true }
          - {
              text: están,
              feedback: '*Están* es presente. Para describir el contexto en el pasado usamos el imperfecto: *estaban*.',
            }
          - {
              text: han estado,
              feedback: '*Han estado* es pretérito perfecto. Para el contexto de una historia en pasado usamos el imperfecto: *estaban*.',
            }
      - id: habia
        type: fillBlank
        prompt: Completa con el verbo *haber* para formar el pluscuamperfecto.
        text: Cuando llegué, el objeto ya ___ desaparecido.
        blanks: [[había]]
      - id: une-tiempos
        type: matching
        prompt: Une cada tiempo verbal con su uso en una narración.
        pairs:
          - [Pretérito indefinido, hechos puntuales]
          - [Pretérito imperfecto, 'descripciones, rutinas y contexto']
          - [Pretérito pluscuamperfecto, una acción anterior a otra acción pasada]
          - [Condicional compuesto, hipótesis irreales en el pasado]
      - id: mismo-tiempo
        type: trueFalse
        prompt: Para dar cohesión a un cuento, conviene mantener el mismo tiempo verbal (pasado o presente).
        answer: true
        feedback:
          correct: ¡Correcto! Mantener los tiempos verbales, los personajes y los escenarios da cohesión al texto.
          incorrect: 'Sí conviene: la cohesión textual pide mantener los tiempos verbales, los personajes y los escenarios.'
      - id: ladraba
        type: fillBlank
        prompt: Completa con el imperfecto de *ladrar*.
        text: El perro ___ sin parar porque había notado algo.
        blanks: [[ladraba]]
      - id: tercera-persona
        type: multipleChoice
        prompt: 'Cambia la perspectiva a tercera persona: *Yo vi una sombra con un paraguas rojo.*'
        options:
          - { text: Ella vio una sombra con un paraguas rojo., correct: true }
          - {
              text: Ella vi una sombra con un paraguas rojo.,
              feedback: '*Vi* es para *yo*. Para *ella* usamos *vio*.',
            }
          - {
              text: Ella ve una sombra con un paraguas rojo.,
              feedback: '*Ve* es presente. La historia está en pasado: *vio*.',
            }
      - id: ordena-noche
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Era una noche lluviosa y todos estaban en silencio.

  - slug: escritura-creativa-conectores
    title: 'Conectores y cohesión: sin embargo, por lo tanto, para que'
    minutes: 8
    items:
      - id: sin-embargo
        type: multipleChoice
        prompt: Estaba cansado; ___, no podía dormir.
        options:
          - { text: sin embargo, correct: true }
          - {
              text: por lo tanto,
              feedback: '*Por lo tanto* expresa una consecuencia. Aquí hay un contraste (cansado, pero sin dormir): *sin embargo*.',
            }
          - {
              text: finalmente,
              feedback: '*Finalmente* es un conector de secuencia. Aquí hay un contraste: *sin embargo*.',
            }
      - id: une-conectores
        type: matching
        prompt: Une cada conector con su función.
        pairs:
          - [sin embargo, contraste]
          - [por lo tanto, consecuencia]
          - [mientras tanto, secuencia]
          - [en caso de que, condición]
          - [a fin de que, propósito]
      - id: por-lo-tanto
        type: multipleChoice
        prompt: Llovía mucho; ___, la biblioteca cerró temprano.
        options:
          - { text: por lo tanto, correct: true }
          - {
              text: sin embargo,
              feedback: '*Sin embargo* expresa contraste. Aquí la lluvia es la causa del cierre: usamos un conector de consecuencia, *por lo tanto*.',
            }
          - {
              text: a pesar de que,
              feedback: '*A pesar de que* expresa contraste. Aquí hay una consecuencia: *por lo tanto*.',
            }
      - id: a-pesar
        type: trueFalse
        prompt: '*A pesar de que* es un conector de contraste.'
        answer: true
        feedback:
          correct: '¡Correcto! Como *sin embargo* y *no obstante*, expresa contraste.'
          incorrect: '*A pesar de que* expresa contraste, como *sin embargo* y *no obstante*.'
      - id: para-que
        type: multipleChoice
        prompt: Dejé la luz encendida ___ el detective pudiera ver.
        options:
          - { text: para que, correct: true }
          - {
              text: dado que,
              feedback: '*Dado que* expresa causa. Aquí hay un propósito: *para que* (+ subjuntivo).',
            }
          - {
              text: sin embargo,
              feedback: '*Sin embargo* expresa contraste. Aquí hay un propósito: *para que*.',
            }
      - id: despues
        type: fillBlank
        prompt: Completa con un conector de secuencia.
        text: Primero entramos en la sala y ___ encontramos una carta.
        blanks: [[después, luego, entonces, más tarde]]
        wordBank: [después, sin embargo, por lo tanto, a pesar de que]
      - id: en-caso-de-que
        type: multipleChoice
        prompt: En caso de que ___ el ladrón, llama a la policía.
        options:
          - { text: vuelva, correct: true }
          - {
              text: vuelve,
              feedback: 'Después de *en caso de que* usamos el subjuntivo: *vuelva*.',
            }
          - {
              text: volverá,
              feedback: 'Después de *en caso de que* no usamos el futuro, sino el subjuntivo: *vuelva*.',
            }
      - id: ordena-nadie
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Sin embargo, nadie vio al ladrón.
