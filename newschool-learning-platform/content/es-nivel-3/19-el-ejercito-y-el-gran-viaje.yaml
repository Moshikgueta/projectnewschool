        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia este mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: mori
        type: aiTutorPrompt
        title: El servicio militar y experiencias personales
        message: |-
          Hoy hablamos sobre el servicio militar en Israel y experiencias personales.
          Hazme preguntas sobre:
          - experiencias sociales
          - presión social
          - identidad israelí
          - opiniones y debates
          - diferencias entre personas y experiencias
          Corrige todos mis errores inmediatamente y explícalos brevemente.
          Haz preguntas de seguimiento después de cada respuesta.
          Usa vocabulario de nivel B1-B2 y mantén una conversación natural e interactiva.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**

