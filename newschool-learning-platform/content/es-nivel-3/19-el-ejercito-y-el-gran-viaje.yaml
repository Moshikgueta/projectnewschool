# Cycle "El ejército y el gran viaje", converted from the Spanish level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-3
slug: el-ejercito-y-el-gran-viaje
title: El ejército y el gran viaje
goal: Opinar y debatir con respeto, y hablar de experiencias y de sus efectos.
position: 19
status: published

review:
  - >-
    The two workbook exercises ("Opinar y debatir" and "Experiencias y efectos") are
    NEW: the notebook has no self-study exercises. They were written from the cycle's
    summary rules, its activity phrases and its vocabulary, and use neutral examples.
    Please check level, wording and every right answer before students see them.
  - >-
    Skills: the notebook lists five language points (opinion, reacting and debating,
    past experiences, comparisons, simple hypotheses). They are grouped into the two
    template skills "Opinar y debatir" (summary points 1–3) and "Experiencias y efectos"
    (summary points 5–7); comparisons (point 4) are kept in the summary under the second
    skill. Please confirm.
  - >-
    Sensitive topic: the content is kept as in the source, with both sides of each
    debate. Some questions were leading (warm-up 2 and 5, reflection "¿Crees que la
    sociedad israelí idealiza demasiado…?"); their sentence frames now offer both
    answers (Creo que sí / Creo que no, porque…). A short student callout and a teacher
    note were added: nobody has to share personal experiences, and every opinion is
    respected. No content was removed. Please check the tone.
  - >-
    The grammar summary was in Hebrew; it is translated into Spanish (with the Hebrew
    glosses kept in the vocabulary). "Entiendo tu punto, pero…" (calque of "I see your
    point") → "Entiendo tu punto de vista, pero…" (the activities use "Entiendo tu idea,
    pero…", kept). "Eso depende…" → "Eso depende de…". Summary point 6 ("hypothetical
    questions") only had reflective questions (¿Crees que…? ¿Hasta qué punto…?); kept as
    "preguntas para reflexionar", and the Activity 6 question "¿Qué pasaría si menos
    personas quisieran servir?" was added as the one real hypothesis (condicional +
    imperfecto de subjuntivo). A rule was added that "Nunca había pensado en…" is the
    pluscuamperfecto and "He conocido…" the pretérito perfecto. "tan… como" glossed
    "כמו" in the source; the rule now says it compares two equal things.
  - >-
    Corrections: Hebrew "טיול גדול" inside two Spanish questions → "el «gran viaje»";
    the quotes "“ gran viaje”" (extra space) fixed; warm-up 1 had broken markdown
    (\#\#\# \*\*); stray "5" in "Ejemplos:5" removed; English "Stage" → "Paso"
    everywhere.
  - >-
    Left out: the lesson-slides link (gamma.app, not allowed; it also points to another
    lesson, "Familia, generaciones y relaciones"); mentioned in a teacher note. The
    Quizlet link is kept without "?new".
  - >-
    Times: the notebook says 90 minutes, but its parts add up to about 150 (intro 10,
    warm-up 12, activities 15 + 20 + 15 + 15 + 15 + 20, closing 8). Ranges are recorded
    as the upper value (10–12 → 12, 5–8 → 8). The plan note asks the teacher to choose
    activities. The closing round ("Cierre") is kept at the end, after Activity 6, as in the
    source. Warm-up frames were added and the "Respuesta del estudiante 1/2/3" lines
    are replaced by the answer boxes; the source's example answers are kept in the
    frames.
  - >-
    NOT converted: source lines 15344–15933 (end of the given range) are a different
    cycle, "Cocina" (pretérito perfecto, verbos modales, desde / desde hace), with
    Italian headings ("Giro di presentazione", "Vocabolario", "Livello…"), class notes
    with students' names and a vocabulary list cut off at item 30. It belongs in its
    own file.
  - >-
    Vocabulary: glosses as in the source. "Enfrentarse" → "Enfrentarse (a)". Please
    confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: el-ejercito-y-el-gran-viaje-clase
    title: 'Clase: El ejército y el gran viaje'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: El ejército y el gran viaje
      - id: subtitle
        type: text
        text: El servicio militar en Israel, el gran viaje después del ejército y experiencias personales.
      - id: skills
        type: cycleOverview
        skills:
          - name: Opinar y debatir
            description: '*Desde mi punto de vista…, Entiendo tu idea, pero…, No estoy completamente de acuerdo porque…, Un ejemplo claro es…*'
          - name: Experiencias y efectos
            description: '*influir en, afectar, ayudar a; He conocido…, Me sorprendió…, Nunca había pensado en…*'
      - id: respect
        type: callout
        tone: info
        title: Hablamos con respeto
        text: >-
          Es un tema sensible. No tienes que contar experiencias personales si no quieres.
          Todas las opiniones se respetan: escucha, reacciona a las ideas y no a las personas.
      - id: quizlet
        type: externalLink
        label: El ejército y el gran viaje en Quizlet
        url: https://quizlet.com/br/1177274224/el-ejercito-y-el-gran-viaje-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de presentación
      - id: intro
        type: discussionQuestions
        items:
          - question: En relación con el servicio militar, creo que ___.
          - question: Para muchos israelíes, el ejército representa ___.
          - question: Una cosa positiva / difícil del servicio militar es ___.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup
        type: discussionQuestions
        items:
          - question: ¿Hasta qué punto el servicio militar influye en la forma en que los israelíes ven el mundo y a otras personas?
            frame: 'Creo que influye mucho / poco porque ___. (Ejemplo: Creo que influye mucho porque durante el servicio militar las personas viven situaciones intensas, conocen gente muy diferente y desarrollan otra perspectiva sobre responsabilidad, seguridad y sociedad.)'
          - question: ¿Crees que en Israel existe una relación demasiado fuerte entre identidad nacional y experiencia militar?
            frame: 'Creo que sí / Creo que no, porque ___. (Ejemplo: Sí, porque en Israel muchas conversaciones sociales, experiencias personales e incluso oportunidades profesionales están relacionadas con el ejército y el tipo de servicio que hizo cada persona.)'
          - question: ¿Puede una persona sentirse completamente parte de la sociedad israelí sin hacer el servicio militar? ¿Por qué?
            frame: 'Depende de ___. (Ejemplo: Depende mucho del entorno social, porque algunas personas aceptan diferentes caminos, pero otras todavía consideran el servicio militar como una experiencia central de la vida israelí.)'
          - question: ¿Qué impacto psicológico puede tener entrar al ejército a los 18 años?
            frame: 'Puede ayudar a ___, pero también puede ___. (Ejemplo: Puede ayudar a algunas personas a madurar más rápido, pero también puede generar presión emocional, estrés y dificultades relacionadas con la responsabilidad o las experiencias vividas.)'
          - question: ¿Crees que algunas personas esconden opiniones críticas sobre el ejército por miedo al juicio social?
            frame: 'Creo que sí / Creo que no, porque ___. (Ejemplo: Sí, porque el ejército es un tema muy sensible en Israel y algunas personas sienten que expresar ciertas opiniones puede generar críticas o incomodidad social.)'
          - question: ¿Qué tipo de presión social puede existir alrededor del servicio militar y del «éxito» dentro del ejército?
            frame: 'Muchas personas sienten presión para ___. (Ejemplo: Muchas personas sienten presión para entrar a unidades prestigiosas o para tener una experiencia considerada importante o exitosa dentro de la sociedad israelí.)'
          - question: ¿Crees que el gran viaje después del ejército funciona como una forma de escapar emocionalmente del servicio militar?
            frame: 'Creo que sí / Creo que no, porque ___. (Ejemplo: Sí, porque después del ejército muchas personas necesitan descansar, desconectarse de la presión y pensar sobre su futuro antes de empezar otra etapa de la vida.)'
          - question: ¿Es posible criticar ciertos aspectos del ejército y seguir siendo patriótico?
            frame: 'Creo que sí / Creo que no, porque ___. (Ejemplo: Sí, porque una persona puede amar a su país y al mismo tiempo pensar críticamente sobre algunos aspectos sociales, políticos o militares.)'
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      # Actividad 1
      - id: act1
        type: classActivity
        title: 'Actividad 1: Experiencias y perspectivas'
        skills: [Experiencias y efectos, Opinar y debatir]
        minutes: 15
        steps:
          - '**Objetivo:** hablar sobre experiencias reales y perspectivas diferentes.'
          - '**Paso 1, activación:** responde a las preguntas del profesor (abajo).'
          - '**Paso 2, conversación en parejas:** cada pareja recibe una situación y habla sobre ella con las preguntas guía.'
          - '**Paso 3, compartir ideas:** cada pareja presenta una conclusión. Los otros estudiantes reaccionan: *Estoy de acuerdo porque… / Nunca había pensado en eso. / Creo que depende de la experiencia personal.*'
      - id: act1-activation
        type: discussionQuestions
        title: 'Paso 1: activación'
        items:
          - question: ¿Qué narrativas o mensajes sobre el ejército escuchan los jóvenes israelíes desde pequeños?
          - question: ¿Crees que las expectativas antes del servicio suelen ser realistas?
          - question: ¿Qué diferencias existen entre la imagen social del ejército y la experiencia real de muchas personas?
          - question: ¿Piensas que el servicio militar afecta de manera diferente a distintos grupos dentro de la sociedad israelí?
      - id: act1-situations
        type: examples
        title: 'Paso 2: situaciones'
        items:
          - text: Una persona que disfruta mucho del servicio militar.
          - text: Una persona que tuvo una experiencia difícil.
          - text: Alguien que hizo el servicio nacional.
          - text: Una familia con varios hijos en diferentes unidades.
          - text: Una persona que quiere viajar inmediatamente después del ejército.
      - id: act1-guide
        type: discussionQuestions
        title: Preguntas guía
        items:
          - question: ¿Qué conflictos internos puede experimentar esta persona?
          - question: ¿Cómo influye el entorno social o familiar en su experiencia?
          - question: ¿Qué aprendió sobre sí misma durante el servicio?
          - question: ¿Qué contradicciones emocionales puede sentir?
          - question: ¿Crees que esta experiencia cambió su visión sobre Israel o sobre la sociedad?
          - question: ¿Qué consejo daría a alguien que está por entrar al ejército?
      # Actividad 2
      - id: act2
        type: classActivity
        title: 'Actividad 2: Debate: ¿El ejército es una parte esencial de la identidad israelí?'
        skills: [Opinar y debatir]
        minutes: 20
        steps:
          - '**Objetivo:** practicar la opinión, la argumentación y la reacción.'
          - '**Paso 1, preparación:** **Grupo A:** el ejército es una parte esencial de la identidad israelí. **Grupo B:** la identidad israelí no debería depender tanto del ejército. Cada grupo prepara argumentos con las preguntas guía.'
          - '**Paso 2, debate.** Reglas: reaccionar a otras ideas, usar ejemplos, hablar con respeto y hacer preguntas.'
          - '**Paso 3, reflexión:** completa las frases de abajo.'
        wordBank:
          - Desde mi punto de vista…
          - Entiendo tu idea, pero…
          - No estoy completamente de acuerdo porque…
          - Eso depende de la situación.
          - Un ejemplo claro es…
      - id: act2-guide
        type: discussionQuestions
        title: Preguntas guía
        answerable: false
        items:
          - question: ¿Hasta qué punto el ejército funciona como una herramienta de integración social?
          - question: ¿Crees que en Israel a veces es difícil separar identidad nacional y militarización?
          - question: ¿Piensas que algunas críticas al ejército son socialmente aceptadas y otras no?
          - question: ¿Qué diferencias existen entre patriotismo y presión social?
          - question: ¿Puede el servicio militar afectar la salud mental de algunas personas?
          - question: ¿Crees que la sociedad israelí habla suficiente sobre las consecuencias emocionales del servicio militar?
          - question: ¿Crees que el servicio militar acelera la madurez emocional?
          - question: ¿Qué tensiones sociales pueden surgir alrededor del servicio militar?
          - question: ¿Las personas que no sirven reciben el mismo nivel de aceptación social?
          - question: ¿Puede existir desigualdad entre diferentes tipos de servicio o unidades?
          - question: ¿Qué relación existe entre ejército, identidad nacional y ciudadanía en Israel?
      - id: act2-reflection
        type: discussionQuestions
        title: 'Paso 3: reflexión'
        items:
          - question: Después del debate, pienso que ___.
          - question: La idea más interesante fue ___.
          - question: Me hizo pensar sobre ___.
      # Actividad 3
      - id: act3
        type: classActivity
        title: 'Actividad 3: Situaciones reales'
        skills: [Opinar y debatir, Experiencias y efectos]
        minutes: 15
        steps:
          - '**Objetivo:** reaccionar de forma espontánea y expresar emociones.'
          - En parejas o en grupos pequeños, elijan una situación de abajo y represéntenla.
          - 'Expresa emociones, reacciona con naturalidad, haz preguntas y usa opiniones y ejemplos.'
      - id: act3-situations
        type: examples
        title: Situaciones
        items:
          - text: Un amigo termina el ejército y siente que perdió dirección o motivación.
          - text: Una persona recibe una unidad que no quería y siente frustración o presión social.
          - text: Los padres están preocupados por el impacto emocional del servicio militar.
          - text: Dos amigos tienen opiniones completamente diferentes sobre el papel del ejército en Israel.
          - text: Una persona extranjera cuestiona aspectos culturales relacionados con el servicio militar obligatorio.
          - text: Un soldado siente dificultad para adaptarse nuevamente a la vida civil después del servicio.
      # Actividad 4
      - id: act4
        type: classActivity
        title: 'Actividad 4: El «gran viaje» después del ejército'
        skills: [Experiencias y efectos, Opinar y debatir]
        minutes: 15
        steps:
          - '**Objetivo:** hablar sobre la costumbre israelí de viajar después del servicio militar y su significado personal y social.'
          - '**Paso 1, activación:** responde a las preguntas del profesor. Después de cada respuesta, otro estudiante reacciona, hace una pregunta o comparte una experiencia o un ejemplo.'
          - '**Paso 2, conversación en grupos:** hablen sobre destinos populares, experiencias típicas, diferencias entre viajar antes y después del ejército, la presión social relacionada con el viaje y el crecimiento personal.'
          - '**Paso 3, mini juego de rol:** elijan una situación. Expresen opiniones, reaccionen con naturalidad, hagan recomendaciones y comparen experiencias.'
          - '**Paso 4, reflexión:** discutan las preguntas abiertas y completen las frases de abajo.'
      - id: act4-activation
        type: discussionQuestions
        title: 'Paso 1: activación'
        items:
          - question: ¿Por qué crees que el «gran viaje» se convirtió en una parte tan importante de la cultura israelí?
          - question: ¿Piensas que este viaje representa libertad, escape, crecimiento personal o una mezcla de todo?
          - question: ¿Cómo influye la experiencia del ejército en la forma en que muchos israelíes viajan después?
          - question: ¿Crees que existe presión social para hacer un viaje largo después del servicio militar?
          - question: ¿Qué diferencias existen entre viajar después del ejército y viajar en otras etapas de la vida?
          - question: ¿Por qué tantos israelíes eligen destinos como India, Tailandia, Argentina o Perú?
          - question: ¿Piensas que las personas vuelven diferentes después de este tipo de viaje? ¿En qué sentido?
          - question: ¿Crees que el «gran viaje» ayuda a las personas a descubrir qué quieren hacer en el futuro?
      - id: act4-groups
        type: discussionQuestions
        title: 'Paso 2: preguntas guía'
        answerable: false
        items:
          - question: ¿Crees que el «gran viaje» funciona como una transición entre el ejército y la vida adulta?
          - question: ¿Qué tipo de crecimiento emocional o personal puede generar un viaje tan largo?
          - question: ¿Piensas que viajar solo cambia la forma de ver el mundo?
          - question: ¿Qué diferencias culturales suelen sorprender más a los israelíes durante estos viajes?
          - question: ¿Por qué algunos viajeros sienten la necesidad de desconectarse completamente de Israel durante un tiempo?
          - question: ¿Crees que las redes sociales cambiaron la cultura del «gran viaje»?
          - question: ¿Puede existir una idealización exagerada de este viaje en la sociedad israelí?
          - question: ¿Qué dificultades emocionales, económicas o personales pueden aparecer durante un viaje largo?
          - question: ¿Piensas que algunas personas vuelven más maduras después del viaje o eso depende de la persona?
          - question: ¿Qué críticas existen sobre esta tradición?
      - id: act4-roleplay
        type: examples
        title: 'Paso 3: situaciones para el juego de rol'
        items:
          - text: Un amigo quiere viajar seis meses por Sudamérica.
          - text: Los padres están preocupados por el viaje.
          - text: Una persona no quiere hacer el «gran viaje» y siente presión social.
          - text: Dos amigos discuten sobre viajar a la India o a Argentina.
      - id: act4-open
        type: discussionQuestions
        title: 'Paso 4: preguntas abiertas'
        items:
          - question: ¿Crees que la sociedad israelí idealiza demasiado el servicio militar?
            frame: Creo que sí / Creo que no, porque ___.
          - question: ¿Hasta qué punto el ejército influye en la política y la cultura israelí?
            frame: Creo que influye mucho / poco en ___ porque ___.
          - question: ¿Piensas que los jóvenes israelíes tienen suficiente libertad para elegir caminos diferentes?
            frame: Pienso que sí / Pienso que no, porque ___.
          - question: ¿Qué cambios sociales podrían existir en el futuro relacionados con el servicio militar?
            frame: En el futuro, podría ___.
          - question: ¿Es posible criticar ciertos aspectos del sistema y seguir siendo patriótico?
            frame: Desde mi punto de vista, ___.
      - id: act4-reflection
        type: discussionQuestions
        title: 'Paso 4: completa'
        items:
          - question: Después del ejército, muchas personas viajan porque ___.
          - question: Creo que el «gran viaje» ayuda a las personas a ___.
          - question: En comparación con otros países, ___.
          - question: Lo más interesante de esta tradición es ___.
      # Actividad 5
      - id: act5
        type: classActivity
        title: 'Actividad 5: Israel después del ejército'
        skills: [Experiencias y efectos]
        minutes: 15
        steps:
          - '**Objetivo:** hablar sobre cambios personales y sociales.'
          - Habla con tu grupo sobre las preguntas guía de abajo.
          - '**Mini tarea:** completa las tres frases.'
      - id: act5-guide
        type: discussionQuestions
        title: Preguntas guía
        answerable: false
        items:
          - question: ¿Por qué muchos israelíes sienten la necesidad de viajar lejos después del ejército?
          - question: ¿Crees que el servicio militar cambia la manera en que las personas se relacionan con amigos y familia?
          - question: ¿Qué habilidades sociales o emocionales suelen desarrollarse durante el servicio?
          - question: ¿Hasta qué punto el ejército influye en oportunidades laborales o académicas en Israel?
          - question: ¿Qué efectos positivos y negativos puede dejar esta experiencia a largo plazo?
          - question: ¿Crees que algunas personas sienten presión por «encontrarse a sí mismas» después del ejército?
          - question: ¿Cómo influye esta etapa en la transición hacia la vida adulta?
      - id: act5-task
        type: discussionQuestions
        title: Mini tarea
        items:
          - question: Después del ejército, muchas personas ___.
          - question: Una cosa que me sorprendió sobre la sociedad israelí es ___.
          - question: Creo que esta experiencia puede ayudar a las personas a ___.
      # Actividad 6
      - id: act6
        type: classActivity
        title: 'Actividad 6: Debate central: ¿servicio militar obligatorio o elección personal?'
        skills: [Opinar y debatir]
        minutes: 20
        steps:
          - '**Objetivo:** practicar la argumentación, la reacción, la persuasión y el debate sobre un tema complejo y sensible.'
          - '**Paso 1, grupos:** **Grupo A** defiende el servicio militar obligatorio. **Grupo B** defiende la idea de que el servicio militar debería ser una elección personal. **Importante:** no tienes que estar personalmente de acuerdo con la posición que defiendes.'
          - '**Paso 2, preparación:** cada grupo prepara 5 argumentos principales, ejemplos sociales o personales y posibles respuestas a las críticas del otro grupo.'
          - '**Paso 3, debate:** el Grupo A presenta un argumento, el Grupo B responde; después el Grupo B presenta un argumento y el Grupo A responde.'
          - 'Condiciones: reaccionar directamente a las ideas del otro grupo, usar ejemplos, hacer preguntas difíciles, interrumpir con respeto y justificar las opiniones.'
          - '**Paso 4, cambio de perspectiva:** ahora defiende por un minuto la posición contraria. Así desarrollas empatía, entiendes otras perspectivas y practicas la flexibilidad al hablar y argumentar.'
          - '**Paso 5, reflexión final:** completa las frases de abajo.'
        wordBank:
          - Desde mi punto de vista…
          - Entiendo tu argumento, pero…
          - Creo que ese problema existe porque…
          - No estoy completamente de acuerdo con esa idea.
          - ¿No crees que eso también puede generar…?
          - Un ejemplo claro de eso es…
      - id: act6-group-a
        type: discussionQuestions
        title: Preguntas guía para el Grupo A
        answerable: false
        items:
          - question: ¿Por qué el servicio militar obligatorio es importante para Israel?
          - question: ¿Cómo ayuda a la seguridad y a la cohesión social?
          - question: ¿Qué valores puede enseñar?
          - question: ¿Qué pasaría si menos personas quisieran servir?
          - question: ¿El servicio militar crea responsabilidad y madurez?
      - id: act6-group-b
        type: discussionQuestions
        title: Preguntas guía para el Grupo B
        answerable: false
        items:
          - question: ¿Por qué el servicio militar debería ser una decisión individual?
          - question: ¿Puede existir presión social excesiva alrededor del ejército?
          - question: ¿Todos los jóvenes están emocionalmente preparados para esta experiencia?
          - question: ¿Es justo que el Estado decida sobre esta parte de la vida de las personas?
          - question: ¿Existen otras formas de contribuir a la sociedad?
      - id: act6-reflection
        type: discussionQuestions
        title: 'Paso 5: reflexión final'
        items:
          - question: El argumento más fuerte del otro grupo fue ___.
          - question: Una idea que me hizo pensar fue ___.
          - question: Después del debate, sigo pensando que ___.
          - question: Lo más difícil de defender fue ___.
      - id: closing-title
        type: heading
        level: 3
        text: Cierre
      - id: closing
        type: discussionQuestions
        items:
          - question: Hoy hablé sobre ___.
          - question: Lo más interesante fue ___.
          - question: Cambié mi opinión sobre ___.
          - question: Todavía tengo preguntas sobre ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Opinar y debatir** (Actividades 2, 3 y 6) y
          **Experiencias y efectos** (Actividades 1, 4 y 5). La clase dura 90 minutos, pero
          todas las partes juntas suman unos 150 minutos (presentación 10, calentamiento 12,
          actividades 15 + 20 + 15 + 15 + 15 + 20, cierre 8). Elige dos o tres actividades,
          por ejemplo una de debate (2 o 6) y una sobre el gran viaje (4).
      - id: n-sensitive
        anchor: respect
        text: >-
          Tema sensible: los estudiantes pueden tener experiencias y opiniones muy
          diferentes. Nadie tiene que contar su experiencia personal. Mantén una posición
          neutral, presenta siempre las dos posiciones y recuerda que en los debates los
          estudiantes defienden una posición asignada, no necesariamente la suya. Si la
          conversación se vuelve personal o política, vuelve a la lengua: las frases para
          opinar, reaccionar y argumentar.
      - id: n-slides
        anchor: null
        text: >-
          El cuaderno enlaza una presentación de la clase en gamma.app; ese enlace no se
          incluye aquí (además apunta a otra clase, «Familia, generaciones y relaciones»).
          Usa tu propia presentación si la tienes.
      - id: n-intro
        anchor: intro
        minutes: 10
        text: Da tu propio ejemplo primero. Cada estudiante completa una o dos frases.
      - id: n-warmup
        anchor: warmup
        minutes: 12
        text: Elige de 6 a 8 preguntas. Pide frases completas y que otro estudiante reaccione a cada respuesta.
      - id: n-act1
        anchor: act1
        minutes: 15
        text: Da una situación del Paso 2 a cada pareja. En el Paso 3, cada pareja comparte una sola conclusión.
      - id: n-act2
        anchor: act2
        minutes: 20
        text: Divide la clase en dos grupos y asigna las posiciones. Escribe las expresiones útiles en la pizarra.
      - id: n-act4
        anchor: act4
        minutes: 15
        text: >-
          En hebreo esta costumbre se llama *tiyul gadol*; en clase usamos *el gran viaje*.
          En el Paso 3, da una situación a cada pareja.
      - id: n-act6
        anchor: act6
        minutes: 20
        text: >-
          Asigna las posiciones al azar y recuerda que no tienen que estar de acuerdo con la
          posición que defienden. Después del debate, pide que cada grupo defienda la
          posición contraria durante un minuto (Paso 4).
      - id: n-closing
        anchor: closing
        minutes: 8
        text: Cada estudiante completa al menos dos frases del cierre.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: el-ejercito-y-el-gran-viaje-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: summary-intro
        type: text
        text: >-
          En esta clase hablamos de temas complejos: el servicio militar en Israel, la
          identidad, la presión social, el patriotismo, las experiencias personales y el
          debate entre el servicio obligatorio y la elección personal. Practicamos cómo dar
          opiniones complejas, debatir, estar de acuerdo o no, argumentar, hablar de efectos
          y comparar.
      - id: rules-debatir
        type: ruleSummary
        skill: Opinar y debatir
        rules:
          - text: 'Para dar tu opinión: **Creo que…, Me parece que…, Desde mi punto de vista…, En mi opinión…** Después de *creo que* y *me parece que* el verbo va en indicativo.'
            examples:
              - Creo que el servicio militar influye mucho en la sociedad.
              - Me parece que existe presión social en Israel.
          - text: 'Para estar de acuerdo o no (con el verbo *estar*): **Estoy de acuerdo porque…, No estoy (completamente) de acuerdo porque…, Entiendo tu punto de vista, pero…, Eso depende de…**'
            examples:
              - Estoy de acuerdo porque el ejército crea responsabilidad.
              - No estoy completamente de acuerdo porque cada persona vive experiencias diferentes.
          - text: 'Para argumentar y convencer: **Un ejemplo claro es…, El problema es que…, Una ventaja es que…, Una desventaja importante es…**'
            examples:
              - Una ventaja del servicio militar es la madurez emocional.
              - El problema es que algunas personas sienten mucha presión social.
          - text: 'Preguntas para reflexionar: **¿Crees que…? ¿Hasta qué punto…? ¿Es posible…? ¿Qué impacto puede tener…?** Para imaginar una situación: **¿Qué pasaría si…?** (condicional + imperfecto de subjuntivo).'
            examples:
              - ¿Crees que existe demasiada presión social?
              - ¿Hasta qué punto el ejército influye en la sociedad israelí?
              - ¿Es posible criticar el ejército y seguir siendo patriótico?
              - ¿Qué pasaría si menos personas quisieran servir?
      - id: rules-efectos
        type: ruleSummary
        skill: Experiencias y efectos
        rules:
          - text: 'Para hablar de efectos y resultados: **influir en** algo, **afectar** algo, **generar** algo, **ayudar a** alguien **a** + infinitivo.'
            examples:
              - El ejército puede influir en la identidad nacional.
              - Algunas experiencias pueden afectar la salud mental.
              - El servicio puede generar presión emocional.
              - El gran viaje ayuda a muchas personas a desconectarse emocionalmente.
          - text: 'Para hablar de experiencias: **He conocido…** (pretérito perfecto), **Me sorprendió…** y **Escuché que…** (pretérito indefinido), **Nunca había pensado en…** (pretérito pluscuamperfecto: *había* + participio).'
            examples:
              - He conocido personas con experiencias muy diferentes.
              - Me sorprendió la presión social alrededor del servicio militar.
              - Escuché que muchos israelíes viajan a Sudamérica.
              - Nunca había pensado en eso.
          - text: 'Para comparar: **más… que**, **menos… que** (cosas diferentes) y **tan… como** (cosas iguales).'
            examples:
              - Algunas unidades son más prestigiosas que otras.
              - La presión social en Israel puede ser más fuerte que en otros países.
              - El servicio nacional no siempre es tan valorado como el servicio militar.
      - id: debate-words
        type: table
        caption: Palabras para el debate
        header: [Español, Hebreo]
        rows:
          - [argumentar, לטעון]
          - [justificar, להצדיק]
          - [cuestionar, להטיל ספק]
          - [reflexionar, להרהר]
          - [persuadir, לשכנע]
          - [la contradicción, סתירה]
          - [la desigualdad, אי-שוויון]
          - [la cohesión social, לכידות חברתית]
          - [la identidad nacional, זהות לאומית]
          - [la libertad individual, חופש אישי]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos habilidades con el grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: el-ejercito-y-el-gran-viaje-tarea
