vocabulary:
  - slug: el-ejercito-y-el-gran-viaje
    title: El ejército y el gran viaje
    items: *el-ejercito-y-el-gran-viaje-words

activities:
  - slug: el-ejercito-y-el-gran-viaje-debatir
    title: Opinar y debatir
    minutes: 8
    items:
      - id: desde
        type: multipleChoice
        prompt: ___ mi punto de vista, el gran viaje ayuda a crecer.
        options:
          - { text: Desde, correct: true }
          - {
              text: En,
              feedback: 'Decimos *desde mi punto de vista*. Con *en* decimos *en mi opinión*.',
            }
          - { text: Por, feedback: 'La expresión es *desde mi punto de vista*.' }
      - id: estoy
        type: multipleChoice
        prompt: No ___ de acuerdo porque cada persona vive experiencias diferentes.
        options:
          - { text: estoy, correct: true }
          - { text: soy, feedback: 'Usamos *estar*: *estar de acuerdo*.' }
          - { text: tengo, feedback: 'La expresión es *estar de acuerdo*: *no estoy de acuerdo*.' }
      - id: pero
        type: multipleChoice
        prompt: Entiendo tu idea, ___ no estoy completamente de acuerdo.
        options:
          - { text: pero, correct: true }
          - {
              text: sino,
              feedback: '*Sino* corrige una idea negativa (*no es A, sino B*). Aquí usamos *pero*.',
            }
          - {
              text: porque,
              feedback: '*Porque* da una razón. Aquí presentamos una idea contraria: *pero*.',
            }
      - id: funciones
        type: matching
        prompt: Une cada frase con su función.
        pairs:
          - [En mi opinión…, dar una opinión]
          - [Estoy de acuerdo porque…, aceptar una idea]
          - [No estoy de acuerdo porque…, rechazar una idea]
          - [Un ejemplo claro es…, dar un ejemplo]
          - [Eso depende de la situación., decir que no siempre es igual]
      - id: indicativo
        type: trueFalse
        prompt: 'Después de *creo que* (en una frase afirmativa) el verbo va en indicativo: *Creo que existe presión social.*'
        answer: true
        feedback:
          correct: '¡Correcto! *Creo que existe…, Me parece que es…*'
          incorrect: 'En una frase afirmativa, después de *creo que* usamos el indicativo: *Creo que existe presión social.*'
      - id: ventaja
        type: fillBlank
        prompt: Completa con el verbo *ser*.
        text: Una ventaja del gran viaje ___ que las personas pueden descansar.
        blanks: [[es]]
      - id: ordena-presion
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Me parece que existe presión social.
      - id: ejemplo
        type: multipleChoice
        prompt: ¿Qué frase usamos para dar un ejemplo?
        options:
          - { text: Un ejemplo claro es…, correct: true }
          - {
              text: Eso depende de…,
              feedback: '*Eso depende de…* dice que la respuesta no siempre es igual.',
            }
          - {
              text: 'Entiendo tu idea, pero…',
              feedback: '*Entiendo tu idea, pero…* sirve para no estar de acuerdo con respeto.',
            }

  - slug: el-ejercito-y-el-gran-viaje-efectos
    title: Experiencias y efectos
    minutes: 8
    items:
      - id: influir-en
        type: multipleChoice
        prompt: El ejército puede influir ___ la identidad nacional.
        options:
          - { text: en, correct: true }
          - { text: a, feedback: 'El verbo es *influir en*: *influir en la identidad*.' }
          - { text: de, feedback: 'El verbo es *influir en*: *influir en la identidad*.' }
      - id: ayudar-a
        type: fillBlank
        prompt: Completa con las preposiciones que faltan.
        text: El gran viaje ayuda ___ muchas personas ___ desconectarse.
        blanks: [[a], [a]]
      - id: afectar
        type: multipleChoice
        prompt: Algunas experiencias pueden ___ la salud mental.
        options:
          - { text: afectar, correct: true }
          - {
              text: influir,
              feedback: '*Influir* necesita *en*: *influir en la salud mental*. Sin preposición usamos *afectar*.',
            }
          - {
              text: ayudar,
              feedback: '*Ayudar* va con *a*: *ayudar a alguien*. Aquí la frase correcta es *afectar la salud mental*.',
            }
      - id: hebreo
        type: matching
        prompt: Une cada expresión con su significado en hebreo.
        pairs:
          - [He conocido…, הכרתי…]
          - [Me sorprendió…, הפתיע אותי…]
          - [Nunca había pensado en…, אף פעם לא חשבתי על…]
          - [Escuché que…, שמעתי ש…]
          - [influir en…, להשפיע על…]
      - id: pluscuamperfecto
        type: trueFalse
        prompt: '*Nunca había pensado en eso* está en pretérito perfecto.'
        answer: false
        feedback:
          correct: '¡Correcto! *Había pensado* (había + participio) es el pretérito pluscuamperfecto.'
          incorrect: 'El pretérito perfecto es *he pensado*. *Había pensado* es el pluscuamperfecto.'
      - id: he-conocido
        type: fillBlank
        prompt: Completa con *haber* (yo).
        text: ___ conocido personas con experiencias muy diferentes.
        blanks: [[He, he, Yo he, yo he]]
      - id: sorprendio
        type: multipleChoice
        prompt: Me ___ la presión social alrededor del gran viaje.
        options:
          - { text: sorprendió, correct: true }
          - {
              text: sorprendí,
              feedback: 'Lo que sorprende es *la presión social* (ella): *me sorprendió*.',
            }
          - { text: sorprendieron, feedback: '*La presión social* es singular: *me sorprendió*.' }
      - id: ordena-eso
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Nunca había pensado en eso.
