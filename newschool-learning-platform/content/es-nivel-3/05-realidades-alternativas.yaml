activities:
  - slug: realidades-alternativas-presente
    title: 'Hipótesis sobre el presente: si tuviera…, haría…'
    minutes: 8
    items:
      - id: estudiaria
        type: multipleChoice
        prompt: Si tuviera más tiempo, ___ otro idioma.
        options:
          - { text: estudiaría, correct: true }
          - {
              text: estudiaré,
              feedback: '*Estudiaré* es futuro. Con *si* + imperfecto de subjuntivo (*tuviera*), la otra parte va en condicional: *estudiaría*.',
            }
          - {
              text: estudiara,
              feedback: '*Estudiara* es imperfecto de subjuntivo: va después de *si*. En la otra parte usamos el condicional: *estudiaría*.',
            }
      - id: viviera
        type: fillBlank
        prompt: Completa con el imperfecto de subjuntivo de *vivir*.
        text: Si ___ en Japón, comería sushi todos los días.
        blanks: [[viviera, viviese]]
      - id: une-mundos
        type: matching
        prompt: Une las dos partes de cada frase.
        pairs:
          - [Si el dinero no existiera…, …la gente intercambiaría bienes.]
          - [Si los humanos volaran…, …las ciudades serían más pequeñas.]
          - [Si los animales hablaran…, …los humanos aprenderían sus idiomas.]
          - [Si todas las películas fueran musicales…, …los actores cantarían siempre.]
      - id: imaginario
        type: trueFalse
        prompt: '*Si fuera rico, viajaría* habla de algo imaginario en el presente.'
        answer: true
        feedback:
          correct: ¡Correcto! *Si* + imperfecto de subjuntivo (*fuera*) + condicional (*viajaría*) = algo imaginario.
          incorrect: '*Si fuera rico, viajaría* es una hipótesis: no soy rico ahora, lo imagino.'
      - id: fueras
        type: multipleChoice
        prompt: Si ___ presidente, cambiarías muchas cosas.
        options:
          - { text: fueras, correct: true }
          - {
              text: serías,
              feedback: 'Después de *si* no usamos el condicional. Usamos el imperfecto de subjuntivo: *fueras*.',
            }
          - {
              text: eres,
              feedback: 'Con *eres* (presente) la otra parte iría en futuro (*cambiarás*). Con *cambiarías* usamos *fueras*.',
            }
      - id: superpoder
        type: fillBlank
        prompt: Completa con *tener* (imperfecto de subjuntivo) y *volar* (condicional).
        text: Si yo ___ un superpoder, ___ a la Luna.
        blanks: [[tuviera, tuviese], [volaría]]
      - id: correcta
        type: multipleChoice
        prompt: ¿Qué oración es correcta?
        options:
          - { text: 'Si fuera rico, viajaría.', correct: true }
          - {
              text: 'Si sería rico, viajaría.',
              feedback: 'Después de *si* nunca va el condicional: *Si fuera rico…*',
            }
          - {
              text: 'Si fuera rico, viajaré.',
              feedback: 'Con *si* + imperfecto de subjuntivo (*fuera*) usamos el condicional: *viajaría*.',
            }
      - id: ordena-alas
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Si tuviera alas, viajaría por todo el mundo.

  - slug: realidades-alternativas-pasado
    title: 'Hipótesis sobre el pasado: si hubiera…, habría…'
    minutes: 8
    items:
      - id: habria-aprobado
        type: multipleChoice
        prompt: Si hubiera estudiado más, ___ el examen.
        options:
          - { text: habría aprobado, correct: true }
          - {
              text: habría aprobar,
              feedback: 'Después de *habría* va el participio, no el infinitivo: *habría aprobado*.',
            }
          - {
              text: aprobé,
              feedback: '*Aprobé* cuenta un hecho real. Para imaginar un pasado diferente usamos *habría* + participio: *habría aprobado*.',
            }
      - id: hubieramos
        type: fillBlank
        prompt: Completa con el verbo *haber* (nosotros) en pluscuamperfecto de subjuntivo.
        text: Si ___ salido antes, no habríamos perdido el tren.
        blanks: [[hubiéramos, hubiésemos]]
      - id: participios
        type: matching
        prompt: Une cada verbo con su participio.
        pairs:
          - [estudiar, estudiado]
          - [ir, ido]
          - [hacer, hecho]
          - [decir, dicho]
          - [ser, sido]
      - id: estructura
        type: trueFalse
        prompt: 'Para una hipótesis sobre el pasado usamos: *si* + pluscuamperfecto de subjuntivo (*hubiera* + participio), condicional compuesto (*habría* + participio).'
        answer: true
        feedback:
          correct: '¡Correcto! *Si hubiera estudiado medicina, habría sido doctor.*'
          incorrect: 'Sí, es la estructura correcta: *Si hubiera estudiado medicina, habría sido doctor.*'
      - id: habria-vivido
        type: multipleChoice
        prompt: Si hubiera aceptado ese trabajo, ___ en Madrid.
        options:
          - { text: habría vivido, correct: true }
          - { text: habría vivir, feedback: 'Después de *habría* va el participio: *vivido*.' }
          - {
              text: he vivido,
              feedback: '*He vivido* es pretérito perfecto, un hecho real. Para imaginar el pasado usamos *habría vivido*.',
            }
      - id: internet
        type: fillBlank
        prompt: Completa con el verbo *haber* en pluscuamperfecto de subjuntivo.
        text: Si no ___ existido internet, la comunicación habría sido más lenta.
        blanks: [[hubiera, hubiese]]
      - id: sido
        type: fillBlank
        prompt: Completa con el participio de *ser*.
        text: Si hubiera estudiado medicina, habría ___ doctor.
        blanks: [[sido]]
      - id: ordena-partido
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Si hubiera practicado más, habría ganado el partido.
