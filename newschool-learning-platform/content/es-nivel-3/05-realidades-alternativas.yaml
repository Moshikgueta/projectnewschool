# Cycle "Realidades alternativas", converted from the Spanish level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-3
slug: realidades-alternativas
title: Realidades alternativas
goal: Hacer hipótesis sobre el presente (si tuviera…, haría…) y sobre el pasado (si hubiera…, habría…).
position: 5
status: published

review:
  - >-
    The two workbook exercises ("Hipótesis sobre el presente" and "Hipótesis sobre el
    pasado") are NEW: the notebook has no self-study exercises. They were written from
    the cycle's two skills, its summary rules, the class examples and its vocabulary.
    Please check level, wording and every right answer before students see them.
  - >-
    Skill names: "segundo / tercer condicional" are labels from English grammar
    (second / third conditional). The skills are now called "Hipótesis sobre el
    presente" (si + imperfecto de subjuntivo, condicional simple) and "Hipótesis sobre
    el pasado" (si + pluscuamperfecto de subjuntivo, condicional compuesto); the old
    names are kept in brackets so students recognise them. The structures in the
    notebook are correct.
  - >-
    Summary (wrong rule): "Errores comunes: Incorrecto: Si soy rico, viajaré" is
    grammatical Spanish: it is a real, possible condition (si + presente, futuro). It
    now says this is not a mistake but a different meaning, and the typical mistakes
    shown are "Si sería rico…" (condicional after si) and "habría ir" (missing
    participle). Tables of the imperfecto de subjuntivo, the pluscuamperfecto de
    subjuntivo and the condicional compuesto were added, plus a note that "Si hubiera
    aceptado…, ahora estaría…" (and the question "Si no hubiera sucedido ___, el mundo
    sería…") mixes a past condition with a present result.
  - >-
    Corrections: "Soy Maria" → "Soy María"; "Mi vida sería más relajante" → "más
    relajada" (relajante = that relaxes you); Activity 1 role play "Si viviera en la
    playa, sería más relajado" → "estaría más relajado" (a state uses estar); Activity 3
    "habría sacado una foto con él" → "me habría sacado una foto con él"; Activity 4
    "Hoy, 2025, … porque el internet nunca existió" → "Hoy, en 2025, … porque internet
    nunca existió"; warm-up "¿quién habría sido y qué habrías dicho?" → "¿… y qué le
    habrías dicho?"; "¿a dónde irías?" → "¿adónde irías?"; "programa de TV" →
    "programa de televisión"; a stray character "ð" before "Para guiar" was removed.
  - >-
    Vocabulary: "Inteligencia artificial" (left over from the previous cycle) was
    removed; "Historia, סיפור" → "סיפור / היסטוריה" (this cycle uses it for history);
    "Consecuencia" and "Resultado" had the same gloss, "Consecuencia" is now "השלכה /
    תוצאה"; "Reinventar, לדמיין מחדש" → "להמציא מחדש"; "Falso, מזויף" → "שקרי /
    מזויף". Please confirm.
  - >-
    Left out: the "Nivel: 3 (avanzado / extremo)" line (the course is B1), the
    "Date" and "Participants" fields, and the empty "Ahora tú: 1. 2. 3." lines of the
    homework (students answer Mori in the chat). The Quizlet link is kept without
    "?new". The "Respuesta de alumno 1/2/3" lines are replaced by the answer boxes.
  - >-
    The notebook gives no plan for choosing activities and no time for the warm-up
    questions or the summary. Times given as ranges are recorded as the upper value
    (Actividad 3 15–20 → 20; steps 5–7 → 7, 5–8 → 8, 7–8 → 8, 5–6 → 6). The plan note
    only says which skill each activity practises; please add your recommendation.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: realidades-alternativas-clase
    title: 'Clase: Realidades alternativas'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Realidades alternativas
      - id: skills
        type: cycleOverview
        skills:
          - name: Hipótesis sobre el presente
            description: '(Segundo condicional) *Si tuviera alas, viajaría por todo el mundo.*'
          - name: Hipótesis sobre el pasado
            description: '(Tercer condicional) *Si hubiera estudiado más, habría aprobado el examen.*'
      - id: quizlet
        type: externalLink
        label: Realidades alternativas en Quizlet
        url: https://quizlet.com/il/1070299625/realidades-alternativas-actualizado-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___. Mi vida sería más / menos ___ si tuviera ___.
        example: Soy María. Mi vida sería más relajada si tuviera un pasaje de avión.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de preparación
      - id: warmup-presente-title
        type: heading
        level: 4
        text: Hipótesis sobre el presente (segundo condicional)
      - id: warmup-presente-rule
        type: callout
        tone: info
        title: Si + imperfecto de subjuntivo, condicional simple
        text: |-
          Se usa para hablar de situaciones **irreales o imaginarias** en el presente o en el futuro.
          *Si tuviera alas, viajaría por todo el mundo.*
          *Si fueras presidente, cambiarías muchas cosas.*
          **Regla fácil:** imagina cosas que **no son reales ahora**, pero que sueñas o inventas.
      - id: warmup-presente
        type: discussionQuestions
        items:
          - question: Si pudieras cambiar una cosa de tu vida, ¿qué sería?
            frame: Si pudiera cambiar una cosa, cambiaría ___.
          - question: Si pudieras intercambiar vidas con alguien por un día, ¿quién sería y por qué?
            frame: Si pudiera intercambiar vidas con alguien, sería ___ porque ___.
          - question: Si pudieras vivir en un libro, un programa de televisión o una película, ¿cuál elegirías y por qué?
            frame: Elegiría ___ porque ___.
          - question: Si pudieras inventar una nueva tecnología, ¿qué sería y cómo cambiaría el mundo?
            frame: Inventaría ___. El mundo ___.
          - question: Si tuvieras que mudarte a otro país mañana, ¿adónde irías y qué harías allí?
            frame: Iría a ___ y allí ___.
          - question: Si pudieras eliminar un problema global (pobreza, contaminación, guerras), ¿cuál elegirías y por qué?
            frame: Eliminaría ___ porque ___.
      - id: warmup-pasado-title
        type: heading
        level: 4
        text: Hipótesis sobre el pasado (tercer condicional)
      - id: warmup-pasado-rule
        type: callout
        tone: info
        title: Si + pluscuamperfecto de subjuntivo, condicional compuesto
        text: |-
          Se usa para hablar de situaciones **que ya pasaron** y no se pueden cambiar: solo imaginamos cómo habrían sido diferentes.
          *Si hubiera estudiado más, habría aprobado el examen.*
          *Si hubiéramos salido antes, no habríamos perdido el tren.*
          **Regla fácil:** imagina el pasado como una película que **no se puede editar**; solo puedes pensar en lo que *habría pasado*.
      - id: warmup-pasado
        type: discussionQuestions
        items:
          - question: Si hubieras conocido a una persona famosa en el pasado, ¿quién habría sido y qué le habrías dicho?
            frame: Habría sido ___ y le habría dicho ___.
          - question: Si hubieras nacido en otra época histórica, ¿cómo habría cambiado tu vida?
            frame: Si hubiera nacido en ___, mi vida ___.
          - question: Si hubieras tomado una decisión diferente en la adolescencia, ¿qué habría pasado después?
            frame: Si hubiera ___, habría ___.
          - question: Si no se hubieran inventado los teléfonos inteligentes, ¿qué habría sido diferente en tu vida?
            frame: Si no se hubieran inventado los teléfonos inteligentes, yo ___.
          - question: Si no hubiera sucedido ___, el mundo sería completamente diferente ahora. ¿Qué hecho elegirías?
            frame: Si no hubiera sucedido ___, el mundo sería ___.
          - question: ¿Qué significa para ti la historia alternativa?
            frame: Para mí, la historia alternativa es ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: La vida paralela'
        skills: [Hipótesis sobre el presente]
        minutes: 15
        steps:
          - Imagina que puedes cambiar un aspecto de tu vida en este momento. Completa al menos **3 frases** de abajo (5 minutos).
          - 'En parejas, entrevístense (7 minutos): *¿Por qué cambiarías eso? ¿Cómo mejoraría tu vida? ¿Qué problemas tendría esa nueva realidad? ¿Qué harías primero? ¿Quién reaccionaría diferente en tu vida?*'
          - 'Variación creativa (8 minutos): tu profesor elige una de las tres opciones de abajo.'
        example: |-
          *Si tuviera más tiempo, estudiaría otro idioma.*
          *Si fuera Messi por un día, jugaría en el Camp Nou.*
          *Si viviera en Japón, comería sushi todos los días.*
      - id: act1-sentences
        type: discussionQuestions
        title: Mi vida paralela
        items:
          - question: Si tuviera más tiempo, ___.
          - question: Si fuera otra persona por un día, ___.
          - question: Si viviera en otro lugar, ___.
          - question: 'Extra: Si pudiera aprender cualquier habilidad, ___.'
          - question: 'Extra: Si no tuviera que estudiar / trabajar, ___.'
      - id: act1-variations
        type: callout
        tone: info
        title: Variación creativa
        text: |-
          **1. Galería de mundos alternativos:** cada pareja escribe en una tarjeta su frase favorita (*Si viviera en París, trabajaría en la moda.*). Se pegan en la pared o la pizarra; la clase camina, lee y vota la más original.
          **2. Juego del cambio inesperado:** el profesor dice una categoría sorpresa (*dinero, profesión, familia, superpoder*) y los estudiantes improvisan una frase: *Si tuviera un superpoder, volaría a… / Si cambiara de profesión, sería…*
          **3. Role play paralelo:** dos estudiantes actúan como si **ya vivieran en esa realidad paralela**: *—Si viviera en la playa, estaría más relajado. —¿De verdad? Entonces yo te visitaría todos los días.*
      - id: act2
        type: classActivity
        title: 'Actividad 2: Realidad alternativa grupal'
        skills: [Hipótesis sobre el presente]
        minutes: 20
        steps:
          - 'En grupos de 3–4, inventen **3 cambios radicales** para la realidad actual. Escriban cada cambio en condicional (8 minutos).'
          - 'Organicen sus frases en un **mini manifiesto de su nuevo mundo**. Usen comparativos: *El mundo sería mucho más limpio. La vida sería menos complicada.* (6 minutos)'
          - 'Presenten su realidad alternativa a la clase (6 minutos): exposición oral, cartel o mini póster, o role play (*En nuestro mundo no existe el dinero, así que yo cambio pizza por clases de español.*).'
          - 'Opcional: la clase vota cuál es el mundo más divertido, el más utópico y el más distópico.'
        example: |-
          *Si el dinero no existiera, la gente intercambiaría bienes.*
          *Si los humanos volaran, las ciudades serían más pequeñas.*
          *Si los animales hablaran, los humanos aprenderían sus idiomas.*
      - id: act2-sentences
        type: discussionQuestions
        title: Nuestro nuevo mundo
        items:
          - question: 'Sociedad: Si no hubiera escuelas, ___.'
          - question: 'Tecnología: Si los robots gobernaran, ___.'
          - question: 'Medio ambiente: Si no existiera el plástico, ___.'
          - question: 'Cultura: Si todas las películas fueran musicales, ___.'
      - id: act3
        type: classActivity
        title: 'Actividad 3: El efecto mariposa personal'
        skills: [Hipótesis sobre el pasado]
        minutes: 20
        steps:
          - Piensa en decisiones pasadas que no se pueden cambiar. Completa al menos **3 frases** de abajo (5 minutos).
          - 'En grupos de 3–4, compartan sus frases y busquen coincidencias o sorpresas: *Yo también habría elegido otra carrera. / ¡Yo nunca habría hecho eso!* (7 minutos)'
          - 'Hagan preguntas de seguimiento: *¿Por qué no lo hiciste? ¿Cómo habría cambiado tu vida exactamente?*'
          - 'Variación creativa (8 minutos): tu profesor elige una de las tres opciones de abajo.'
        example: |-
          *Si hubiera estudiado medicina, habría sido doctor.*
          *Si hubiera aceptado ese trabajo, habría vivido en Madrid.*
          *Si hubiera conocido a Messi, me habría sacado una foto con él.*
      - id: act3-sentences
        type: discussionQuestions
        title: Mi efecto mariposa
        items:
          - question: Si hubiera tomado otra decisión en la escuela, habría ___.
          - question: Si hubiera aceptado una oportunidad, habría ___.
          - question: Si hubiera conocido a cierta persona, mi vida habría ___.
          - question: 'Extra: Si hubiera viajado a otro país cuando era joven, habría ___.'
          - question: 'Extra: Si hubiera estudiado otra carrera, habría ___.'
          - question: 'Extra: Si hubiera hecho algo diferente la semana pasada, habría ___.'
      - id: act3-variations
        type: callout
        tone: info
        title: Variación creativa
        text: |-
          **1. Mapa del destino:** cada grupo escribe sus frases más interesantes en tarjetas y las coloca en un mural o en la pizarra, formando una línea del tiempo alternativa.
          **2. Juego del «y entonces»:** un estudiante dice *Si hubiera estudiado arte, habría pintado cuadros.* Otro continúa: *Y si hubieras pintado cuadros, habrías expuesto en un museo.* Así se construye una cadena de realidades alternativas.
          **3. Role play histórico personal:** cada estudiante actúa como si estuviera **viviendo ahora esa vida alternativa**: *Si hubiera aceptado el trabajo en Nueva York, ahora estaría trabajando en Wall Street.*
      - id: act4
        type: classActivity
        title: 'Actividad 4: Historia alternativa mundial'
        skills: [Hipótesis sobre el pasado]
        minutes: 20
        steps:
          - 'En grupos, elijan un hecho histórico (5 minutos): un **descubrimiento** (el viaje de Colón, la llegada a la Luna), un **invento** (la electricidad, internet, la imprenta) o un hecho de **guerra o política** (la Segunda Guerra Mundial, la Guerra Fría, la caída del Muro de Berlín).'
          - 'Escriban **3 frases** sobre cómo habría cambiado el mundo: *Si + pluscuamperfecto de subjuntivo, condicional compuesto* (8 minutos).'
          - 'Cada grupo comparte su realidad histórica alternativa en voz alta. Los demás hacen preguntas: *¿Y qué habría pasado con la economía? ¿Cómo habría sido diferente la cultura?* (8 minutos)'
          - 'Opcional (5 minutos): dibujen un símbolo o un mini póster de su mundo alternativo (por ejemplo, un mapa de Europa sin América), o un estudiante presenta un **noticiero alternativo**: *Hoy, en 2025, seguimos comunicándonos con cartas porque internet nunca existió…*'
        example: |-
          *Si no se hubiera descubierto América, Europa habría seguido comerciando solo con Asia.*
          *Si no hubiera existido internet, la comunicación habría sido mucho más lenta.*
          *Si la Segunda Guerra Mundial hubiera terminado de otra forma, el mapa político habría cambiado completamente.*
      - id: act4-sentences
        type: discussionQuestions
        title: Nuestra historia alternativa
        items:
          - question: 'Nuestro hecho histórico: ___'
          - question: Si ___, ___.
            frame: Si no hubiera…, habría…
          - question: Si ___, ___.
            frame: Si no se hubiera…, habría…
          - question: Si ___, ___.
            frame: Si … hubiera…, habría…
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Hipótesis sobre el presente** (ronda de
          introducción, primeras preguntas y Actividades 1 y 2) e **Hipótesis sobre el
          pasado** (segundas preguntas y Actividades 3 y 4). El cuaderno no indica cuántas
          actividades elegir: elige al menos una para cada habilidad.
      - id: n-intro
        anchor: intro
        minutes: 8
        text: Da tu propio ejemplo primero y después pregunta a cada estudiante. Se practica la hipótesis sobre el presente con humor y ejemplos personales.
      - id: n-warmup
        anchor: warmup-title
        text: >-
          Lee con el grupo cada recuadro de gramática antes de sus preguntas. Haz al menos
          dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de
          cada pregunta.
      - id: n-act1
        anchor: act1
        minutes: 15
        text: >-
          Da primero tus ejemplos modelo. Las frases *Extra* son para los estudiantes más
          avanzados. Objetivo: practicar *si + imperfecto de subjuntivo, condicional
          simple*, conectar lo personal con lo imaginario y usar vocabulario personal.
      - id: n-act2
        anchor: act2
        minutes: 20
        text: >-
          Si los grupos necesitan ayuda, da las categorías de abajo (sociedad, tecnología,
          medio ambiente, cultura). Objetivo: practicar vocabulario abstracto (utopía,
          distopía, cambio, sociedad, tecnología) y comparar ideas.
      - id: n-act3
        anchor: act3
        minutes: 20
        text: >-
          Da primero tus ejemplos modelo. Las frases *Extra* son para los estudiantes más
          avanzados. Objetivo: practicar *si + pluscuamperfecto de subjuntivo, condicional
          compuesto* con experiencias personales.
      - id: n-act4
        anchor: act4
        minutes: 20
        text: >-
          Puedes dar una lista de hechos históricos para inspirar o dejar que los grupos
          elijan libremente. Objetivo: practicar la hipótesis sobre el pasado en contextos
          culturales e históricos.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: realidades-alternativas-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-presente
        type: ruleSummary
        skill: Hipótesis sobre el presente (segundo condicional)
        rules:
          - text: 'Se usa para hablar de situaciones irreales, poco probables o completamente imaginarias en el presente o en el futuro.'
          - text: 'Estructura: **Si + imperfecto de subjuntivo, condicional simple**.'
            examples:
              - Si tuviera más tiempo, estudiaría otro idioma.
              - Si viviera en Japón, comería sushi todos los días.
              - Si los humanos volaran, las ciudades serían más pequeñas.
          - text: 'El condicional simple termina en **-ía**: *sería, tendría, podría, haría, cambiaría*. Después de *si* va el imperfecto de subjuntivo: *si pudiera…, si tuviera…, si fuera…*'
          - text: '**Cuidado:** después de *si* nunca va el condicional.'
            examples: ['Si sería rico, viajaría. ✗', 'Si fuera rico, viajaría. ✓']
          - text: '*Si soy rico, viajaré* (si + presente, futuro) no es un error: habla de algo **real y posible**. *Si fuera rico, viajaría* habla de algo **imaginario**.'
      - id: presente-table
        type: table
        caption: Imperfecto de subjuntivo y condicional simple
        header: [Persona, tener → tuviera, ser → fuera, viajar → viajaría]
        rows:
          - [yo, tuviera, fuera, viajaría]
          - [tú, tuvieras, fueras, viajarías]
          - [él / ella / usted, tuviera, fuera, viajaría]
          - [nosotros / nosotras, tuviéramos, fuéramos, viajaríamos]
          - [vosotros / vosotras, tuvierais, fuerais, viajaríais]
          - [ellos / ellas / ustedes, tuvieran, fueran, viajarían]
      - id: rules-pasado
        type: ruleSummary
        skill: Hipótesis sobre el pasado (tercer condicional)
        rules:
          - text: 'Se usa para hablar de situaciones pasadas que no ocurrieron, pero que podrían haber cambiado los resultados.'
          - text: 'Estructura: **Si + pluscuamperfecto de subjuntivo (*hubiera* + participio), condicional compuesto (*habría* + participio)**.'
            examples:
              - Si hubiera estudiado medicina, habría sido doctor.
              - Si hubiéramos salido antes, no habríamos perdido el tren.
              - Si no se hubiera descubierto América, Europa habría seguido comerciando solo con Asia.
          - text: '**Cuidado:** después de *habría* va el participio (*-ado, -ido* o irregular), no el infinitivo.'
            examples: ['Si hubiera estudiado, habría ir. ✗', 'Si hubiera estudiado, habría ido. ✓']
          - text: 'Participios irregulares útiles:'
            examples:
              [
                'hacer → hecho',
                'decir → dicho',
                'ver → visto',
                'escribir → escrito',
                'poner → puesto',
              ]
          - text: 'Si el resultado es **ahora**, la segunda parte va en condicional simple.'
            examples:
              - Si hubiera aceptado el trabajo en Nueva York, ahora estaría trabajando en Wall Street.
              - Si no hubiera sucedido ___, el mundo sería completamente diferente ahora.
      - id: pasado-table
        type: table
        caption: Pluscuamperfecto de subjuntivo y condicional compuesto
        header: [Persona, hubiera + participio, habría + participio]
        rows:
          - [yo, hubiera estudiado, habría aprobado]
          - [tú, hubieras estudiado, habrías aprobado]
          - [él / ella / usted, hubiera estudiado, habría aprobado]
          - [nosotros / nosotras, hubiéramos estudiado, habríamos aprobado]
          - [vosotros / vosotras, hubierais estudiado, habríais aprobado]
          - [ellos / ellas / ustedes, hubieran estudiado, habrían aprobado]
      - id: rules-diferencia
        type: ruleSummary
        skill: Presente o pasado
        rules:
          - text: '**Hipótesis sobre el presente:** cosas irreales, pero posibles en un mundo imaginario.'
            examples: [Si tuviera alas, viajaría por todo el mundo.]
          - text: '**Hipótesis sobre el pasado:** cosas que ya no pueden cambiar porque ocurrieron de otra manera.'
            examples: [Si hubiera tenido alas, habría viajado por todo el mundo.]
      - id: expresiones
        type: table
        caption: Expresiones útiles
        header: [Presente, Pasado]
        rows:
          - [Si yo fuera…, 'Si hubiera pasado…, habría cambiado…']
          - [Si yo tuviera…, 'Si no hubiera sucedido…, habría sido…']
          - [Si yo pudiera…, 'Si hubiera tenido la oportunidad…, habría hecho…']
      - id: aplicaciones
        type: examples
        title: Realidades alternativas personales y globales
        items:
          - text: Si viviera en otro país, aprendería otro idioma.
            gloss: personal, presente
          - text: Si hubiera aceptado ese trabajo, habría vivido en Madrid.
            gloss: personal, pasado
          - text: Si los animales hablaran, los humanos aprenderían sus idiomas.
            gloss: global, presente
          - text: Si no hubiera existido internet, la comunicación habría sido más lenta.
            gloss: global, pasado
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos estructuras con el grupo y pide un ejemplo nuevo para cada una, uno personal y otro global.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: realidades-alternativas-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia un mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: mori-presente
        type: aiTutorPrompt
        title: 'Parte 1: Hipótesis sobre el presente'
        intro: 'Ejemplo de Mori: *Si ganara la lotería, compraría una casa en la playa. Si ganara la lotería, viajaría por el mundo. Si ganara la lotería, ayudaría a mi familia.*'
        message: |-
          Hola Mori, quiero practicar las hipótesis sobre el presente (si + imperfecto de subjuntivo, condicional simple). Pregúntame: «Imagina que ganas la lotería. ¿Qué harías con el dinero?».
          Voy a responder con 3 frases. Corrige mis frases y hazme una pregunta más.
      - id: mori-pasado
        type: aiTutorPrompt
        title: 'Parte 2: Hipótesis sobre el pasado'
        intro: 'Ejemplo de Mori: *Si hubiera estudiado medicina, habría sido doctor. Si hubiera viajado a Japón, habría aprendido japonés. Si hubiera practicado más, habría ganado el partido.*'
        message: |-
          Hola Mori, quiero practicar las hipótesis sobre el pasado (si + pluscuamperfecto de subjuntivo, condicional compuesto). Pregúntame: «¿Qué 3 cosas habrían cambiado en tu vida si hubieras tomado decisiones diferentes en el pasado?».
          Voy a responder con 3 frases. Corrige mis frases y hazme una pregunta más.
      - id: mori-bonus
        type: aiTutorPrompt
        title: 'Parte 3: Bonus (opcional)'
        intro: 'Si quieres, primero grábate un audio de 1 minuto con tus respuestas y después escríbelas para Mori.'
        message: |-
          Hola Mori, te voy a dar tres respuestas:
          1. Una hipótesis sobre el presente (Si yo pudiera…, haría…).
          2. Una hipótesis sobre el pasado (Si hubiera…, habría…).
          3. Mi opinión: ¿Es útil imaginar realidades alternativas? ¿Por qué?
          Corrige mis errores, por favor.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**

