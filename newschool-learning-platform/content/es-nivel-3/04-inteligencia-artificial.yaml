vocabulary:
  - slug: inteligencia-artificial
    title: Inteligencia artificial
    items: *inteligencia-artificial-words

activities:
  - slug: inteligencia-artificial-futuro
    title: 'Futuro simple: será, cambiará, podrá'
    minutes: 8
    items:
      - id: sera
        type: multipleChoice
        prompt: En 10 años la IA ___ más rápida que los profesores.
        options:
          - { text: será, correct: true }
          - {
              text: sería,
              feedback: '*Sería* es condicional, para algo imaginado. Para una predicción usamos el futuro: *será*.',
            }
          - {
              text: es,
              feedback: '*Es* es presente. Con *en 10 años* hablamos del futuro: *será*.',
            }
      - id: haran
        type: fillBlank
        prompt: Completa con el futuro simple de *hacer*.
        text: Dentro de 10 años, los robots ___ muchos trabajos.
        blanks: [[harán]]
      - id: une-futuro
        type: matching
        prompt: Une cada verbo con su forma de futuro para *él / ella*.
        pairs:
          - [tener, tendrá]
          - [poder, podrá]
          - [hacer, hará]
          - [cambiar, cambiará]
          - [ser, será]
      - id: formacion
        type: trueFalse
        prompt: 'El futuro simple se forma con el infinitivo + *-é, -ás, -á, -emos, -éis, -án*: *cambiaré, cambiarás, cambiará*.'
        answer: true
        feedback:
          correct: ¡Correcto! Las terminaciones son las mismas para los verbos en -ar, -er e -ir.
          incorrect: 'Sí: infinitivo + *-é, -ás, -á, -emos, -éis, -án*. Por ejemplo, *cambiar → cambiaré, cambiará*.'
      - id: podra
        type: fillBlank
        prompt: Completa con el futuro simple de *poder*.
        text: Creo que en 10 años la IA ___ reemplazar muchos trabajos.
        blanks: [[podrá]]
      - id: vamos-a
        type: multipleChoice
        prompt: 'Un plan: Mañana nosotros ___ a usar ChatGPT en clase.'
        options:
          - { text: vamos, correct: true }
          - {
              text: van,
              feedback: '*Van* es para *ellos / ellas*. Para *nosotros* usamos *vamos a*.',
            }
          - { text: voy, feedback: '*Voy* es para *yo*. Para *nosotros* usamos *vamos a*.' }
      - id: prediccion
        type: multipleChoice
        prompt: ¿Qué oración es una predicción en futuro simple?
        options:
          - { text: Las clases serán más personalizadas., correct: true }
          - {
              text: Las clases son más personalizadas.,
              feedback: '*Son* es presente. El futuro simple de *ser* es *serán*.',
            }
          - {
              text: Las clases serían más personalizadas.,
              feedback: '*Serían* es condicional, para algo imaginado. El futuro simple es *serán*.',
            }
      - id: ordena-mundo
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: El mundo con IA será diferente.

  - slug: inteligencia-artificial-condicional
    title: 'Condicional: sería, tendría, podría'
    minutes: 8
    items:
      - id: usaria
        type: multipleChoice
        prompt: Si yo escribiera la canción, ___ menos versos.
        options:
          - { text: usaría, correct: true }
          - {
              text: usaré,
              feedback: 'Con *si* + imperfecto de subjuntivo (*escribiera*), la otra parte va en condicional: *usaría*.',
            }
          - {
              text: usaba,
              feedback: '*Usaba* es imperfecto de indicativo. Para una situación imaginaria usamos el condicional: *usaría*.',
            }
      - id: seria
        type: fillBlank
        prompt: Completa con el condicional de *ser*.
        text: Si hubiera una distopía, yo ___ el mejor médico.
        blanks: [[sería]]
      - id: une-condicional
        type: matching
        prompt: Une cada verbo con su forma de condicional para *yo*.
        pairs:
          - [tener, tendría]
          - [poder, podría]
          - [hacer, haría]
          - [ser, sería]
          - [decir, diría]
      - id: despues-de-si
        type: trueFalse
        prompt: 'Después de *si* usamos el condicional: *Si la IA enseñaría sola…*'
        answer: false
        feedback:
          correct: '¡Correcto! Después de *si* va el imperfecto de subjuntivo: *Si la IA enseñara sola…*'
          incorrect: 'Después de *si* nunca va el condicional. Usamos el imperfecto de subjuntivo: *Si la IA enseñara sola, los estudiantes perderían la motivación.*'
      - id: ensenara
        type: multipleChoice
        prompt: Si la IA ___ sola, los estudiantes perderían la motivación.
        options:
          - { text: enseñara, correct: true }
          - {
              text: enseñaría,
              feedback: 'Después de *si* no usamos el condicional. Usamos el imperfecto de subjuntivo: *enseñara*.',
            }
          - {
              text: enseñará,
              feedback: '*Enseñará* es futuro. Para una situación imaginaria, después de *si* va el imperfecto de subjuntivo: *enseñara*.',
            }
      - id: existiera
        type: fillBlank
        prompt: Completa con el imperfecto de subjuntivo de *existir*.
        text: Si no ___ la IA, el mundo sería diferente.
        blanks: [[existiera, existiese]]
      - id: imaginado
        type: multipleChoice
        prompt: ¿Qué oración habla de algo imaginado, no de una predicción?
        options:
          - {
              text: Yo tendría más tiempo libre si los robots hicieran todo el trabajo.,
              correct: true,
            }
          - {
              text: La IA va a crear nuevas profesiones.,
              feedback: '*Va a crear* es futuro: algo que creemos que sí pasará.',
            }
          - {
              text: La IA será más rápida que los profesores.,
              feedback: '*Será* es futuro: una predicción. Para algo imaginado usamos el condicional (*tendría, sería*).',
            }
      - id: ordena-vida
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: La vida sería más aburrida sin IA.
