# Cycle "Identidad y comunidad", converted from the Spanish nivel 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-3
slug: identidad-y-comunidad
title: Identidad y comunidad
goal: Formular hipótesis con si + imperfecto de subjuntivo y narrar cambios en pasado, presente y futuro.
position: 15
status: in_review

review:
  - >-
    The two workbook exercises ("Oraciones hipotéticas" and "Construcción narrativa")
    are NEW: the notebook has no self-study exercises. They were written from the
    cycle's two skills, its summary rules, the activity examples and its vocabulary.
    Please check level, wording and every right answer before students see them.
  - >-
    Skill name: "2º condicional" is the English-teaching term ("second
    conditional"). It is now "Oraciones hipotéticas (si + imperfecto de subjuntivo +
    condicional)" everywhere; "speed sharing" and "speed debate" (English) →
    "rondas rápidas" and "debate rápido".
  - >-
    Summary, hypotheses: the formula "Si + verbo en -ra, -se → verbo en -ría" is kept
    but explained (the conditional ends in -ía added to the infinitive: cambiaría,
    sería, habría), with a table of the imperfecto de subjuntivo (cambiar, tener,
    ser) and a rule that the conditional never goes after "si" (from the Mori model
    "si cambiaría" → "si cambiara"). Please confirm.
  - >-
    Summary, narrative: "Pasado (pretérito e imperfecto)" → "pretérito indefinido e
    imperfecto", with when to use each; "espero que" now says it takes the present
    subjunctive. Example "En esa época, solía jugar en la comunidad deportiva" →
    "solía participar en la comunidad deportiva". Comparisons: the example "La
    comunidad religiosa influye más que la deportiva" does not match "más + adjetivo
    + que", so a rule "verbo + más / menos que" was added.
  - >-
    Corrections: Activity 1 title "¿Cuál sería mi Rol?" → "¿Cuál sería mi rol?";
    Activity 1 model "Si fuéramos una comunidad, formaríamos parte de la comunidad
    de…" (illogical) → "Si fuéramos una comunidad, seríamos la comunidad de…";
    Activity 4 "Hoy en día…, sin embargo en el futuro…" → "Hoy en día…; sin embargo,
    en el futuro…"; "votan cuál cambio es" → "votan qué cambio es"; Activity 5
    "encuesta rápida online" → "encuesta rápida en línea"; Mori "el imperfecto y no
    el pretérito" → "el imperfecto y no el pretérito indefinido". The warm-up
    question numbered "1" after question 5 is question 6. Stray characters (the
    "ð¡️" emoji) and the asterisk debris around Activities 2–5 were removed.
  - >-
    The source does not say which activity practises which skill. The plan note now
    says: Activities 1, 2, 3 and 5 practise the hypotheses (with contrast and
    argument), Activity 4 the narrative. Please confirm and choose activities for
    the class time.
  - >-
    Times recorded as the upper value of each range: Activity 1 (5 + 7 + 20 + 10 + 5
    = 47 min), Activity 2 (5 + 10 + 10 + 10 + 5 optional = 40 min), Activity 3 (5 + 10
    + 10 + 10 + 5 = 40 min), Activity 4 (7 + 10 + 10 + 10 + 5 optional = 42 min),
    Activity 5 (5 + 7 + 15 + 5 + 5 optional = 37 min).
  - >-
    Mori: the source has lines to send to Mori in five steps (ask for questions, ask
    for corrections, ask for explanations, a model interaction, closing). They are
    now one main message, with the model interaction as its introduction, and the
    correction, explanation and closing lines in the tips callout.
  - >-
    Vocabulary: "Debate, ויכוח" → "דיון / ויכוח"; "Poder, כוח" → "Poder (sustantivo)"
    to separate it from the verb. Please confirm.
  - >-
    The "Respuesta de alumno 1/2/3" lines are replaced by the answer boxes.
    Warm-up sentence frames were added (the source has none). The intro round in the
    source has an empty bullet; the second example (religión) is kept. The Quizlet
    link is kept as in the source.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: identidad-y-comunidad-clase
    title: 'Clase: Identidad y comunidad'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Identidad y comunidad
      - id: skills
        type: cycleOverview
        skills:
          - name: Oraciones hipotéticas
            description: '*Si* + imperfecto de subjuntivo + condicional: *Si tuviera más tiempo, estudiaría otro idioma.*'
          - name: Construcción narrativa
            description: 'Pasado, presente y futuro: *Cuando era niño, solo hablaba hebreo. Hoy en día estudio español. En 5 años trabajaré en otro país.*'
      - id: quizlet
        type: externalLink
        label: Identidad y comunidad en Quizlet
        url: https://quizlet.com/il/859042961/extreme-spanish-identity-community-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___. El elemento más importante de mi identidad es ___.
        example: Soy Ana. El elemento más importante de mi identidad es mi familia.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup
        type: discussionQuestions
        items:
          - question: Además de tu nombre y tu nacionalidad, ¿qué otras cosas forman parte de tu identidad?
            frame: Además de mi nombre, forman parte de mi identidad ___.
          - question: ¿Qué comunidades existen en tu ciudad o país que influyen en tu forma de pensar? ¿Te sientes parte de ellas?
            frame: En mi ciudad hay ___. Me siento / No me siento parte de ___.
          - question: 'De estos aspectos (idioma, cultura, religión, trabajo, pasatiempos), ¿cuál ha cambiado más en tu vida y por qué?'
            frame: Lo que más ha cambiado es ___ porque ___.
          - question: ¿A qué comunidades perteneces?
            frame: Pertenezco a ___.
          - question: ¿Cuál es la conexión entre la identidad y la comunidad?
            frame: Creo que la conexión es que ___.
          - question: ¿Piensas que la comunidad cambia tu identidad o que tu identidad cambia la comunidad? Explica con un ejemplo.
            frame: Pienso que ___. Por ejemplo, ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: ¿Cuál sería mi rol?'
        skills: [Oraciones hipotéticas]
        minutes: 47
        steps:
          - 'Escribe 3 comunidades a las que perteneces (familia, universidad, deporte, religión, redes sociales, barrio…). En parejas o tríos, busquen una comunidad en común.'
          - 'Toda la clase comparte y elige una comunidad común. Cada estudiante elige un rol dentro de esa comunidad.'
          - 'En grupos de 3 o 4, inventen una **comunidad hipotética** inspirada en las suyas. Decidan: principios y valores (¿qué defiende?), roles (¿quién hace qué?), eventos (¿qué actividades organizan y con qué objetivo?) y, si quieren, símbolos (bandera, lema, mascota, logo).'
          - 'Cada grupo presenta su comunidad en 3 partes: qué es y qué valores tiene, qué rol tiene cada miembro y qué eventos organizaría y por qué. Opcional: muestren dibujos, fotos o íconos.'
          - Escribe una mini conclusión.
      - id: act1-frames
        type: discussionQuestions
        title: Frases modelo
        items:
          - question: Mis comunidades
            frame: Pertenezco a la comunidad de ___ porque ___. / Me siento parte de ___ ya que ___.
          - question: Mi rol
            frame: Dentro de esta comunidad, mi rol sería ___ porque ___. / Me encargaría de ___ con el fin de ___.
          - question: Nuestra nueva comunidad
            frame: Si fuéramos una comunidad, seríamos la comunidad de ___. Nuestros valores serían ___ porque ___.
          - question: Nuestros eventos
            frame: Nuestros eventos serían en ___ con el fin de ___. En el evento habría ___ para ___.
          - question: Mi conclusión
            frame: Si mi comunidad existiera de verdad, cambiaría mi vida porque ___. / Lo más interesante de crear esta comunidad fue ___.
      - id: act2
        type: classActivity
        title: 'Actividad 2: Más allá de mi identidad'
        skills: [Oraciones hipotéticas]
        minutes: 40
        steps:
          - 'Escribe **5 elementos** de tu identidad. Categorías: idiomas, valores, gustos e intereses, cultura y nacionalidad, creencias y religión, profesión y estudios, pasatiempos. Usa: *Una parte de mi identidad es… / Algo esencial en mí es…*'
          - 'En parejas, comparen sus listas: ¿Qué elementos de tu identidad compartes conmigo? ¿Qué elemento es único en ti? ¿Cuál de tus elementos es más importante y por qué? Usen conectores: *además, sin embargo, en cambio, también, por eso…*'
          - 'Mini debate en grupos de 3 o 4: ¿Qué elementos de la identidad son universales (comunes a todos)? ¿Cuáles son individuales (únicos)? ¿Algunos elementos pueden cambiar con el tiempo (trabajo, pasatiempos, creencias)?'
          - Completa las frases hipotéticas de abajo. Después compártelas en voz alta o en rondas rápidas con diferentes compañeros.
          - 'Opcional: dibuja un «escudo de identidad» con símbolos de tus 5 elementos y preséntalo en 1 o 2 frases: *Este símbolo representa mi pasión por… porque…*'
      - id: act2-sentences
        type: discussionQuestions
        title: Hipótesis
        items:
          - question: Si cambiara mi idioma, mi vida sería diferente porque ___.
          - question: Si cambiara mis valores, mi relación con los demás sería ___.
          - question: Si cambiara mis pasatiempos, pasaría más tiempo con ___.
      - id: act3
        type: classActivity
        title: 'Actividad 3: Comunidades en conflicto'
        skills: [Oraciones hipotéticas]
        minutes: 40
        steps:
          - 'Escribe **2 comunidades** que influyen en tu forma de pensar (familia, escuela, trabajo, religión, deportes, redes sociales, política, cultura): *Una comunidad que influye en mí es… porque… / Otra comunidad importante en mi vida es…*'
          - 'En grupos de 3 o 4, compartan sus comunidades y elijan las **4 más representativas** del grupo: ¿Qué comunidad influye más en tu vida personal? ¿Cuál influye más en tu forma de pensar? ¿Hay alguna comunidad que influya en todos nosotros?'
          - 'Comparen sus comunidades con frases de contraste (mira abajo). Usen conectores: *sin embargo, en cambio, por lo tanto, además…*'
          - 'Cada estudiante formula al menos **2 hipótesis** (mira abajo). Compártanlas en voz alta o en un debate rápido (1 minuto por estudiante).'
          - 'Cada grupo presenta: la comunidad que tiene más poder de influencia, una comparación con otra comunidad y una hipótesis sobre qué pasaría si esa comunidad no existiera.'
        example: |-
          *La comunidad religiosa influye más que la deportiva porque transmite valores todos los días.*
          *En cambio, la comunidad deportiva influye solo en momentos específicos.*
          *Si esta comunidad no existiera, la sociedad sería menos solidaria.*
      - id: act3-frames
        type: discussionQuestions
        title: Contraste e hipótesis
        items:
          - question: La comunidad ___ influye más que ___ porque ___.
          - question: Mientras que la comunidad ___ nos ayuda a ___, la comunidad ___ nos limita en ___.
          - question: En mi opinión, ___ es más importante que ___ porque ___.
          - question: Si esta comunidad no existiera, mi vida sería ___.
          - question: Si la comunidad ___ tuviera menos poder, la sociedad cambiaría porque ___.
      - id: act4
        type: classActivity
        title: 'Actividad 4: Narrativa de cambio'
        skills: [Construcción narrativa]
        minutes: 42
        steps:
          - 'Elige **un aspecto de tu vida** (idioma, cultura, religión, trabajo, estudios, pasatiempos, valores) y escribe 3 frases: una en pasado, una en presente y una en futuro.'
          - 'Amplía tu narración con conectores. Pasado: *cuando tenía…, solía…, en esa época…* Presente: *actualmente, en este momento, todavía…* Futuro: *en unos años, probablemente, espero que…*'
          - 'Cuenta tu historia a tu compañero. Él te hace **2 o 3 preguntas**: *¿Por qué cambiaste…? ¿Quién influyó en ese cambio? ¿Qué harías si tuvieras otra oportunidad?*'
          - 'En grupos de 3 o 4, compartan sus historias y voten qué cambio es el más sorprendente, el más común y el más positivo. Presenten un resumen: *En nuestro grupo, todos cambiamos en… pero en el futuro queremos…*'
          - 'Opcional: dibuja tu **línea de vida** con 3 puntos (pasado, presente, futuro) y una frase corta en cada punto. Preséntala en parejas o al grupo.'
        example: |-
          *Cuando era niño, solo hablaba hebreo.*
          *Hoy en día estudio inglés y español.*
          *En 5 años, creo que trabajaré en otro país.*
      - id: act4-sentences
        type: discussionQuestions
        title: Mi narrativa de cambio
        items:
          - question: Pasado (antes)
            frame: Cuando era niño / niña, ___. En esa época, ___.
          - question: Presente (ahora)
            frame: Hoy en día ___. Actualmente ___.
          - question: Futuro (en 5 años)
            frame: Creo que ___. Probablemente ___.
          - question: Todo junto
            frame: Antes ___, pero ahora ___. Hoy en día ___; sin embargo, en el futuro ___. Si pienso en el futuro, creo que ___.
      - id: act5
        type: classActivity
        title: 'Actividad 5: Mini debate, identidad o comunidad'
        skills: [Oraciones hipotéticas]
        minutes: 37
        steps:
          - 'Escribe una idea personal para cada afirmación: *La comunidad cambia la identidad porque… / La identidad cambia la comunidad porque…* Puedes usar: *La comunidad cambia la identidad cuando… / La identidad influye en la comunidad si…*'
          - 'Equipo A defiende que la comunidad cambia la identidad. Equipo B defiende que la identidad cambia la comunidad. Cada equipo prepara 3 argumentos principales y 1 ejemplo real o personal.'
          - 'Debate guiado en rondas: apertura (1 minuto por grupo), respuesta con contraste e hipótesis obligatoria (mira abajo). Habla 1 minuto como máximo por turno y usa conectores: *además, en cambio, sin embargo, por lo tanto…*'
          - 'Conclusión individual: *Después del debate, pienso que… / Lo más importante que aprendí es…*'
          - 'Opcional: voten qué argumento fue el más convincente (no qué equipo «ganó»).'
        example: |-
          *La comunidad escolar cambia la identidad porque los estudiantes aprenden valores comunes.*
          *Si mi comunidad fuera más abierta, yo sería más tolerante.*
      - id: act5-rounds
        type: discussionQuestions
        title: Rondas del debate
        items:
          - question: Apertura
            frame: En nuestra opinión, la comunidad cambia la identidad porque ___.
          - question: Respuesta con contraste
            frame: Sin embargo, pensamos que la identidad cambia la comunidad cuando ___.
          - question: Hipótesis
            frame: Si mi comunidad fuera diferente, yo sería ___. / Si mi identidad cambiara, mi comunidad también ___.
          - question: Mi conclusión
            frame: Después del debate, pienso que ___. Lo más importante que aprendí es ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Oraciones hipotéticas** (Actividades 1, 2, 3 y
          5) y **Construcción narrativa** (Actividad 4). El cuaderno no indica qué
          actividades combinar: elige según el tiempo de la clase.
      - id: n-intro
        anchor: intro
        text: Muy breve, 2 frases por estudiante. Da tu propio ejemplo primero.
      - id: n-warmup
        anchor: warmup
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act1
        anchor: act1
        minutes: 47
        text: >-
          Fase 1, comunidades personales: 5 minutos. Fase 2, selección y roles: 7
          minutos. Fase 3, creación de la nueva comunidad: 20 minutos. Fase 4,
          presentación: 10 minutos. Fase 5, reflexión escrita: 5 minutos. Para mostrar la
          comunidad pueden usar el celular, la pizarra o fichas rápidas.
      - id: n-act2
        anchor: act2
        minutes: 40
        text: >-
          Escribe las categorías en la pizarra. Reflexión individual: 5 minutos.
          Comparación en parejas: 10 minutos (circula, escucha y anima a usar
          conectores). Mini debate: 10 minutos. Hipótesis: 10 minutos. Escudo de
          identidad (opcional): 5 minutos.
      - id: n-act3
        anchor: act3
        minutes: 40
        text: >-
          Lluvia de ideas: 5 minutos. Puesta en común: 10 minutos. Debate y contraste: 10
          minutos (recuerda los conectores). Hipótesis: 10 minutos. Mini presentación: 5
          minutos.
      - id: n-act4
        anchor: act4
        minutes: 42
        text: >-
          Preparación individual: 7 minutos. Ampliación: 10 minutos. Intercambio en
          parejas: 10 minutos (las preguntas de seguimiento obligan a ampliar la
          narración). Grupos pequeños: 10 minutos. Línea de vida (opcional): 5 minutos.
      - id: n-act5
        anchor: act5
        minutes: 37
        text: >-
          Preparación individual: 5 minutos. División en equipos: 7 minutos. Debate
          guiado: 15 minutos (tú moderas las rondas). Conclusión individual: 5 minutos.
          Votación (opcional): 5 minutos, con manos levantadas, stickers o una encuesta
          rápida en línea.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: identidad-y-comunidad-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-hipoteticas
        type: ruleSummary
        skill: Oraciones hipotéticas
        rules:
          - text: 'Estructura: *si* + **imperfecto de subjuntivo** (-ra / -se), + **condicional** (infinitivo + -ía).'
            examples:
              - Si tuviera más tiempo, estudiaría otro idioma.
              - Si mi comunidad fuera más inclusiva, habría más oportunidades para todos.
              - Si cambiara mis valores, mi vida sería muy diferente.
          - text: 'Después de *si* **nunca** va el condicional.'
            examples: [Si cambiara mi idioma… (no *Si cambiaría mi idioma…*)]
          - text: 'Usos: situaciones imaginarias o poco probables, consecuencias posibles (no seguras), debates e hipótesis sobre comunidades inventadas.'
            examples:
              - Si esta comunidad no existiera, la sociedad sería menos solidaria.
          - text: 'Conectores útiles: *entonces, en ese caso, como resultado, por lo tanto*.'
            examples:
              - Si mi comunidad fuera más abierta, entonces yo sería más tolerante.
      - id: subjuntivo-table
        type: table
        caption: Imperfecto de subjuntivo y condicional
        header: [Persona, cambiar, tener, ser, condicional (ser)]
        rows:
          - [yo, cambiara, tuviera, fuera, sería]
          - [tú, cambiaras, tuvieras, fueras, serías]
          - [él / ella / usted, cambiara, tuviera, fuera, sería]
          - [nosotros / nosotras, cambiáramos, tuviéramos, fuéramos, seríamos]
          - [ellos / ellas / ustedes, cambiaran, tuvieran, fueran, serían]
      - id: rules-narrativa
        type: ruleSummary
        skill: Construcción narrativa
        rules:
          - text: '**Pasado:** el **imperfecto** describe cómo era tu vida antes y lo que hacías normalmente; el **pretérito indefinido** cuenta un hecho terminado.'
            examples:
              - Cuando era niño, solo hablaba hebreo.
              - En esa época, solía participar en la comunidad deportiva.
              - En 2015 me mudé a otra ciudad.
          - text: '**Presente:** la situación actual.'
            examples:
              [
                Hoy en día estudio inglés y español.,
                Actualmente pertenezco a varias comunidades en línea.,
              ]
          - text: '**Futuro:** proyectos, expectativas y cambios. Después de *espero que* el verbo va en presente de subjuntivo.'
            examples:
              - En 5 años, creo que trabajaré en otro país.
              - En el futuro, mi comunidad organizará más eventos culturales.
              - Espero que mi comunidad sea más abierta.
          - text: 'Conectores temporales: *antes, en esa época, hoy en día, actualmente, ahora, en unos años, en el futuro, probablemente*.'
            examples: ['Antes…, pero ahora…, y en el futuro…']
      - id: rules-comparaciones
        type: ruleSummary
        skill: Comparaciones
        rules:
          - text: '*Más / menos* + adjetivo + *que*; verbo + *más / menos que*.'
            examples:
              [
                Mi barrio es más tranquilo que el centro.,
                La comunidad religiosa influye más que la deportiva.,
              ]
          - text: '*Tan* + adjetivo + *como*; *tanto / tanta / tantos / tantas* + sustantivo + *como*.'
            examples:
              - La identidad personal es tan importante como la comunidad.
              - Tengo tantas conexiones en mi comunidad como en mi familia.
      - id: connectors-table
        type: table
        caption: Conectores para argumentar y justificar
        header: [Función, Conectores]
        rows:
          - [Contraste, 'sin embargo, en cambio, aunque']
          - [Añadir ideas, 'además, también, por otra parte']
          - [Ejemplificar, 'por ejemplo, en mi caso, como muestra']
          - [Conclusión, 'por lo tanto, en conclusión, al final']
      - id: phrases
        type: examples
        title: Frases modelo de la clase
        items:
          - text: Soy… y el elemento más importante de mi identidad es…
          - text: Pertenezco a la comunidad de… porque…
          - text: Dentro de esta comunidad, mi rol sería… porque…
          - text: Si esta comunidad no existiera, mi vida sería…
          - text: Antes…, pero ahora…, y en el futuro…
          - text: Después del debate, pienso que…
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos habilidades con el grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: identidad-y-comunidad-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia el mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: mori-main
        type: aiTutorPrompt
        title: Mi identidad y mi comunidad
        intro: |-
          Así puede ser la conversación:
          **Tú:** *Mori, hazme una pregunta con si + imperfecto de subjuntivo.*
          **Mori:** *Si pudieras cambiar un aspecto de tu identidad, ¿qué cambiarías?*
          **Tú:** *Si cambiaría mi idioma, mi vida sería diferente.*
          **Mori:** *No decimos «si cambiaría», decimos «si cambiara». La estructura es: si + imperfecto de subjuntivo + condicional. Repite: Si cambiara mi idioma, mi vida sería diferente.*
          **Tú:** *Si cambiara mi idioma, mi vida sería diferente.*
          **Mori:** *Muy bien. Usamos «cambiara» porque es el tiempo del subjuntivo en las oraciones hipotéticas irreales.*
        message: >-
          ¡Hola Mori! Hazme preguntas sobre mi identidad y mi comunidad. Quiero que me
          preguntes en pasado, presente y futuro, y también con si + imperfecto de
          subjuntivo + condicional. Corrige mis errores, por favor: si digo algo mal,
          dime la forma correcta y repite mi frase corregida para que yo la diga otra vez.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿No entiendes una corrección? Envía: **Mori, explícame por qué está mal.** o **¿Por qué se usa *cambiara* y no *cambiaría*?** o **¿Por qué se usa el imperfecto y no el pretérito indefinido aquí?**
          ¿Quieres terminar? Envía: **Mori, hazme una última pregunta para repasar.** o **Mori, dime si mi español hoy fue mejor.** o **Mori, dame una frase para practicar en casa.**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: identidad-y-comunidad-practica
    book: workbook
    title: 'Práctica: Identidad y comunidad'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practica las dos habilidades del ciclo. Cada respuesta se corrige al momento, y puedes intentarlo otra vez.
      - id: ex-hipoteticas
        type: activity
        activity: identidad-y-comunidad-hipoteticas
      - id: ex-narrativa
        type: activity
        activity: identidad-y-comunidad-narrativa

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: identidad-y-comunidad-vocabulario
    title: Vocabulario
    phase: review
    blocks:
