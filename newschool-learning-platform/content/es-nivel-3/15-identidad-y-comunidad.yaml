vocabulary:
  - slug: identidad-y-comunidad
    title: Identidad y comunidad
    items: *identidad-y-comunidad-words

activities:
  - slug: identidad-y-comunidad-hipoteticas
    title: 'Oraciones hipotéticas: si tuviera, estudiaría'
    minutes: 8
    items:
      - id: tuviera
        type: multipleChoice
        prompt: Si ___ más tiempo, estudiaría otro idioma.
        options:
          - { text: tuviera, correct: true }
          - {
              text: tendría,
              feedback: 'Después de *si* no usamos el condicional. Usa el imperfecto de subjuntivo: *tuviera*.',
            }
          - {
              text: tengo,
              feedback: 'Es una situación imaginaria: después de *si* va el imperfecto de subjuntivo, *tuviera*, y después el condicional, *estudiaría*.',
            }
      - id: fuera
        type: fillBlank
        prompt: Completa con el verbo *ser* en imperfecto de subjuntivo.
        text: Si mi comunidad ___ más inclusiva, habría más oportunidades para todos.
        blanks: [[fuera, fuese]]
      - id: seria
        type: multipleChoice
        prompt: Si cambiara mis valores, mi vida ___ muy diferente.
        options:
          - { text: sería, correct: true }
          - {
              text: fuera,
              feedback: '*Fuera* es imperfecto de subjuntivo: va después de *si*. La consecuencia va en condicional: *sería*.',
            }
          - {
              text: será,
              feedback: '*Será* es futuro. Con *si* + imperfecto de subjuntivo, la consecuencia va en condicional: *sería*.',
            }
      - id: si-cambiaria
        type: trueFalse
        prompt: '*Si cambiaría mi idioma, mi vida sería diferente* es una oración correcta.'
        answer: false
        feedback:
          correct: '¡Correcto! Después de *si* no va el condicional: *Si cambiara mi idioma, mi vida sería diferente.*'
          incorrect: 'Después de *si* no usamos el condicional. Lo correcto es: *Si cambiara mi idioma, mi vida sería diferente.*'
      - id: formas
        type: matching
        prompt: Une cada verbo con su forma de *yo* en imperfecto de subjuntivo.
        pairs:
          - [tener, tuviera]
          - [ser, fuera]
          - [poder, pudiera]
          - [cambiar, cambiara]
          - [existir, existiera]
      - id: existiera
        type: fillBlank
        prompt: Completa con el verbo *existir* en imperfecto de subjuntivo.
        text: Si esta comunidad no ___, la sociedad sería menos solidaria.
        blanks: [[existiera, existiese]]
      - id: cambiarias
        type: fillBlank
        prompt: Completa con el verbo *cambiar* en condicional (tú).
        text: Si pudieras cambiar un aspecto de tu identidad, ¿qué ___?
        blanks: [[cambiarías]]
      - id: ordena-vida
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Mi vida sería muy diferente.

  - slug: identidad-y-comunidad-narrativa
    title: 'Construcción narrativa: antes, ahora y en el futuro'
    minutes: 8
    items:
      - id: hablaba
        type: multipleChoice
        prompt: Cuando era niño, solo ___ hebreo.
        options:
          - { text: hablaba, correct: true }
          - {
              text: hablé,
              feedback: 'Para describir cómo era tu vida antes (algo habitual), usamos el imperfecto: *hablaba*.',
            }
          - {
              text: hablaré,
              feedback: '*Hablaré* es futuro. *Cuando era niño* habla del pasado: *hablaba*.',
            }
      - id: trabajare
        type: multipleChoice
        prompt: En 5 años, creo que ___ en otro país.
        options:
          - { text: trabajaré, correct: true }
          - {
              text: trabajaba,
              feedback: '*Trabajaba* es imperfecto (pasado). *En 5 años* habla del futuro: *trabajaré*.',
            }
          - {
              text: trabajé,
              feedback: '*Trabajé* es pretérito indefinido (pasado). Para el futuro usa *trabajaré*.',
            }
      - id: conectores
        type: matching
        prompt: Une cada función con su conector.
        pairs:
          - [Contraste, sin embargo]
          - [Añadir ideas, además]
          - [Ejemplificar, por ejemplo]
          - [Conclusión, por lo tanto]
      - id: pertenecia
        type: fillBlank
        prompt: Completa con el verbo *pertenecer* en imperfecto.
        text: Antes no ___ a ninguna comunidad deportiva, pero ahora juego en un equipo.
        blanks: [[pertenecía, yo pertenecía]]
      - id: imperfecto-antes
        type: trueFalse
        prompt: 'Usamos el imperfecto para describir cómo era nuestra vida antes: *En esa época, solía participar en la comunidad deportiva.*'
        answer: true
        feedback:
          correct: ¡Correcto! El imperfecto describe hábitos y situaciones del pasado.
          incorrect: 'Sí: para describir cómo era la vida antes y lo que hacíamos normalmente, usamos el imperfecto (*era, hablaba, solía*).'
      - id: tan
        type: multipleChoice
        prompt: La identidad personal es ___ importante como la comunidad.
        options:
          - { text: tan, correct: true }
          - {
              text: más,
              feedback: 'Con *más* usamos *que*: *más importante que*. Con *como* usamos *tan*: *tan importante como*.',
            }
          - {
              text: tanto,
              feedback: '*Tanto* va con un sustantivo. Con un adjetivo (*importante*) usamos *tan*.',
            }
      - id: tantas
        type: fillBlank
        prompt: Completa la comparación.
        text: Tengo ___ conexiones en mi comunidad como en mi familia.
        blanks: [[tantas]]
      - id: ordena-eventos
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Mi comunidad organizará más eventos culturales.
