vocabulary:
  - slug: noticias-recientes
    title: Noticias recientes
    items: *noticias-recientes-words

activities:
  - slug: noticias-recientes-indirecto
    title: 'Estilo indirecto: dijo que…'
    minutes: 8
    items:
      - id: estaba
        type: multipleChoice
        prompt: '«Estoy cansado». → Dijo que ___ cansado.'
        options:
          - { text: estaba, correct: true }
          - {
              text: estoy,
              feedback: 'Después de *dijo que*, el presente cambia al imperfecto: *estoy → estaba*. Y *estoy* es para *yo*, no para él.',
            }
          - {
              text: estaré,
              feedback: '*Estaré* es futuro. El presente cambia al imperfecto: *estaba*.',
            }
      - id: habria
        type: fillBlank
        prompt: 'Pasa al estilo indirecto con el verbo *haber*: «Mañana habrá lluvia».'
        text: Informaron que al día siguiente ___ lluvia.
        blanks: [[habría]]
      - id: expresiones
        type: matching
        prompt: Une cada expresión del estilo directo con la del estilo indirecto.
        pairs:
          - [hoy, ese día]
          - [mañana, al día siguiente]
          - [ayer, el día anterior]
          - [aquí, allí]
          - [este, ese]
      - id: combustible
        type: multipleChoice
        prompt: 'Una semana después, reportas este titular: «Hoy sube el precio del combustible». ¿Qué frase es correcta?'
        options:
          - { text: Informaron que ese día subía el precio del combustible., correct: true }
          - {
              text: Informaron que hoy sube el precio del combustible.,
              feedback: 'Lo cuentas otro día: *hoy* cambia a *ese día*, y el presente al imperfecto (*subía*).',
            }
          - {
              text: Informaron que ese día subirá el precio del combustible.,
              feedback: '*Subirá* es futuro. El presente *sube* cambia al imperfecto: *subía*.',
            }
      - id: iba-a
        type: fillBlank
        prompt: 'Pasa al estilo indirecto: «Mañana voy a viajar».'
        text: Comentó que al día siguiente ___ a viajar.
        blanks: [[iba]]
      - id: futuro-condicional
        type: trueFalse
        prompt: 'En estilo indirecto, el futuro (*habrá*) cambia al condicional (*habría*).'
        answer: true
        feedback:
          correct: '¡Correcto! *«Habrá lluvia»* → *Dijeron que habría lluvia.*'
          incorrect: 'El futuro sí cambia al condicional: *«Habrá lluvia»* → *Dijeron que habría lluvia.*'
      - id: su-equipo
        type: fillBlank
        prompt: 'Cambia el posesivo: «Nuestro equipo gana hoy».'
        text: Dijeron que ___ equipo ganaba ese día.
        blanks: [[su]]
      - id: ordena-cansado
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Dijo que estaba muy cansado.

  - slug: noticias-recientes-tiempos
    title: 'Tiempos mezclados: hablar de noticias'
    minutes: 8
    items:
      - id: funciones
        type: matching
        prompt: Une cada tiempo verbal con su función en las noticias.
        pairs:
          - [pretérito perfecto, hechos recientes]
          - [pretérito indefinido, eventos terminados]
          - [imperfecto, contexto o descripción]
          - [futuro, predicciones]
          - [condicional, hipótesis o consecuencias]
      - id: ocurrio
        type: multipleChoice
        prompt: Ayer ___ un accidente en la autopista.
        options:
          - { text: ocurrió, correct: true }
          - {
              text: ocurrirá,
              feedback: '*Ocurrirá* es futuro. *Ayer* habla de un evento terminado: usamos el indefinido, *ocurrió*.',
            }
          - {
              text: ocurriría,
              feedback: '*Ocurriría* es condicional (hipótesis). Para un evento terminado usamos el indefinido: *ocurrió*.',
            }
      - id: era
        type: multipleChoice
        prompt: Ayer ocurrió un accidente. El tráfico ___ muy intenso y había mucha gente en la calle.
        options:
          - { text: era, correct: true }
          - {
              text: será,
              feedback: '*Será* es futuro. Para describir el contexto en el pasado usamos el imperfecto: *era*.',
            }
          - {
              text: sería,
              feedback: '*Sería* es condicional (hipótesis). Para describir el contexto usamos el imperfecto: *era*.',
            }
      - id: habra
        type: fillBlank
        prompt: Completa con el verbo *haber* en futuro (predicción).
        text: Mañana ___ más información.
        blanks: [[habrá]]
      - id: estaria
        type: multipleChoice
        prompt: 'Hipótesis: con una aclaración del gobierno, la gente ___ más tranquila.'
        options:
          - { text: estaría, correct: true }
          - {
              text: estuvo,
              feedback: '*Estuvo* es indefinido (un hecho terminado). Para una hipótesis usamos el condicional: *estaría*.',
            }
          - {
              text: estaba,
              feedback: '*Estaba* es imperfecto (descripción del pasado). Para una hipótesis usamos el condicional: *estaría*.',
            }
      - id: he-leido
        type: fillBlank
        prompt: Completa con el verbo *leer* (yo) en pretérito perfecto.
        text: Esta semana ___ una noticia importante.
        blanks: [[he leído, yo he leído]]
      - id: imperfecto-futuro
        type: trueFalse
        prompt: 'Usamos el imperfecto para hacer predicciones sobre el futuro: *Mañana llovía.*'
        answer: false
        feedback:
          correct: '¡Correcto! Para predicciones usamos el futuro: *Mañana lloverá. Mañana habrá más información.*'
          incorrect: 'El imperfecto describe el contexto en el pasado (*El tráfico era intenso*). Para predicciones usamos el futuro: *Mañana lloverá.*'
      - id: ordena-informacion
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Mañana habrá más información.
