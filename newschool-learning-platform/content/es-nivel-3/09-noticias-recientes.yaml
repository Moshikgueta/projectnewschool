# Cycle "Noticias recientes", converted from the Spanish nivel 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-3
slug: noticias-recientes
title: Noticias recientes
goal: Contar lo que otros dijeron con el estilo indirecto y hablar de noticias mezclando los tiempos verbales.
position: 9
status: in_review

review:
  - >-
    The two workbook exercises ("Estilo indirecto" and "Tiempos mezclados") are NEW:
    the notebook has no self-study exercises. They were written from the cycle's
    summary rules, the headline examples and the vocabulary. Please check level,
    wording and every right answer before students see them.
  - >-
    The source range (lines 6391–8227) holds THREE blocks titled "Noticias recientes"
    (starting at lines 6393, 7004 and 7615). I compared them line by line: they are
    exact copies (the only difference is two empty lines at the end of the third
    block); same goals, warm-up, news text, activities, summary, Mori tasks and
    vocabulary. They contain no extra news texts or activities, so ONE copy was
    converted and the other two were left out.
  - >-
    Summary, estilo indirecto (incomplete rule, please confirm): the notebook said
    "pasado suele quedar igual" ("Hubo" → "hubo"). The rules now say: indefinido →
    stays the same or becomes pluscuamperfecto ("el día anterior hubo / había habido
    un terremoto"); pretérito perfecto → pluscuamperfecto ("he leído" → "había
    leído"); ir a → iba a; imperfecto stays. A rule was added that the present can
    stay when the information is still true, since Activity 3's own model ("Seis
    estudiantes dijeron que consumen noticias digitales") does that. A table of tense
    changes was added. "Estilo indirecto (Reported Speech)": the English was removed.
  - >-
    Step 1 of the headline activity called "Mañana comienza la feria del libro"
    "futuro"; the verb is a present with future meaning. It now says "presente con
    valor de futuro" (it still changes to the imperfect: "comenzaba").
  - >-
    Numbering: the source has two "Actividad 1" (Lectura y comprensión, and Titulares
    en estilo indirecto) followed by Actividades 2–5. They are renumbered 1–6. Mori
    "Tarea 2" had no title; it is now "Una noticia corta en estilo indirecto".
  - >-
    Corrections: warm-up "¿En tu opinión, los niños están…?" → "En tu opinión, ¿los
    niños están…?" (opening ¿ goes where the question starts); the warm-up items were
    all numbered "1." (a list-format error), now a normal list. The headline activity
    example "Comentaron que el día anterior hubo un terremoto" also gives "había
    habido". "Hasta ahora / ahora / después" steps in Activity 6 kept.
  - >-
    The reading text is labelled "NOTICIA REAL SIMPLIFICADA" in the source; I could not
    check that it is a real news item, so it is labelled "Noticia adaptada (nivel B1)".
    Please confirm or change. Answer key for the comprehension questions is in a
    teacher note. "horas pico" (Latin American) is kept although the text is about
    Spain ("horas punta").
  - >-
    Times: intro 5; warm-up "10–15" → 15; reading activity "10–12" → 12 (its parts:
    reading 2–3 → 3, comprehension 5, pair discussion 5–7 → 7, transition 3–5 → 5,
    which add up to more than 12). The other activities have no times in the source.
    Left out: "Respuesta estudiante 1/2/3" lines and the "Fecha / Participantes"
    lines. The intro example mentions Ynet (a site name, no link).
  - >-
    Vocabulary: the first four words (noticia, titular, artículo, reportero /
    periodista) were listed twice; kept once. "Noticia – חדשות" → "ידיעה / חדשה"
    (חדשות = noticias); "Declarar / Anuncio – להצהיר / הודעה" split into "Declarar –
    להצהיר" and "Anuncio – הודעה / הכרזה"; "Estilo indirecto – סגנון עקיף" → "דיבור
    עקיף" (the usual Hebrew grammar term); "Hipótesis – הנחה / השערה" → "השערה" (הנחה
    also means "discount", which is in the same list). Please confirm. The Quizlet
    link's "?new" parameter was removed.
  - >-
    Added (not in the source, please check): the example for the debate (Activity 5:
    "El año pasado se publicaron muchas noticias falsas… Si hubiera normas, habría
    menos desinformación…"), the sentence frames for the warm-up, the comprehension
    and discussion questions, the survey report, the Nivel 2 headlines and the good
    news, and "Por favor, corrige mis errores" at the end of Mori Tarea 3. Small fixes:
    "Hola Mori" → "Hola, Mori"; debate dilemma B "tiempo de pantalla" → "tiempo en
    pantalla" (air time); survey question "¿Revisas el pronóstico?" → "¿Revisas el
    pronóstico del tiempo?". The "Objetivo" lines of each activity are summed up in
    the teacher notes or the Mori intros.
  - >-
    The third grammar goal (connectors for opinion and organising information) has no
    rule in the source summary; a short list of connectors from the activities and
    the news text (según, sin embargo, ya que, por eso, además) was added to the
    mixed-tenses rules.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: noticias-recientes-clase
    title: 'Clase: Noticias recientes'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Noticias recientes
      - id: skills
        type: cycleOverview
        skills:
          - name: Estilo indirecto
            description: 'Contar lo que otra persona dijo: *Dijo que estaba cansado. Informaron que al día siguiente habría lluvia.*'
          - name: Tiempos mezclados
            description: 'Pretérito perfecto, indefinido, imperfecto, futuro y condicional para hablar de noticias'
      - id: quizlet
        type: externalLink
        label: Noticias recientes en Quizlet
        url: https://quizlet.com/il/1121348298/noticias-recientes-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Yo soy ___. Cuando quiero informarme de las noticias, yo ___.
        example: Yo soy Moshik. Cuando quiero saber las noticias, abro Ynet en mi teléfono o escucho la radio.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup
        type: discussionQuestions
        items:
          - question: ¿Cada cuánto crees que una persona debe consumir noticias?
            frame: Creo que una persona debe consumir noticias ___ porque ___.
          - question: ¿Qué es para ti la libertad de expresión?
            frame: Para mí, la libertad de expresión es ___.
          - question: ¿Ha ocurrido una protesta, crisis o desastre en tu zona recientemente?
            frame: Sí, recientemente ha ocurrido ___. / No, no ha ocurrido nada.
          - question: ¿Cómo han cambiado las noticias con las redes sociales?
            frame: Con las redes sociales, las noticias han ___.
          - question: ¿Admiras a algún periodista? ¿Por qué?
            frame: Admiro a ___ porque ___.
          - question: En tu opinión, ¿los niños están demasiado expuestos a las noticias?
            frame: En mi opinión, ___ porque ___.
          - question: ¿Has visto una noticia o una predicción del tiempo equivocada? ¿Qué pasó?
            frame: Sí, una vez ___. Dijeron que ___, pero ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Lectura y comprensión'
        skills: [Tiempos mezclados, Estilo indirecto]
        minutes: 12
        steps:
          - '**Lectura individual (3 minutos):** lee la noticia de abajo.'
          - '**Comprensión (5 minutos):** responde a las preguntas de comprensión.'
          - '**En parejas (7 minutos):** hablen de las preguntas de discusión.'
          - '**Transición (5 minutos):** cuenta al grupo lo que dijo tu compañero: *Mi compañero dijo que… / Ella comentó que… / Él explicó que…*'
      - id: act1-news
        type: callout
        tone: info
        title: 'Noticia adaptada (nivel B1): España anuncia nuevas medidas para mejorar el transporte público'
        text: |-
          El Gobierno de España anunció esta semana un plan para mejorar el transporte público en varias ciudades del país. El proyecto incluye nuevas líneas de autobús, trenes más rápidos y descuentos especiales para estudiantes y personas mayores. Según el Ministerio de Transportes, las medidas comenzarán a aplicarse el próximo mes y tendrán un impacto positivo en la movilidad diaria.

          Muchas ciudades, como Barcelona, Valencia y Sevilla, han recibido la noticia con entusiasmo, ya que el tráfico ha aumentado mucho en los últimos años. Sin embargo, algunos usuarios dijeron que todavía falta mejorar la frecuencia en horas pico.

          Una portavoz del ministerio comentó: *«Queremos que más personas elijan el transporte público y reduzcan el uso del coche particular».*
      - id: act1-comprehension
        type: discussionQuestions
        title: Comprensión
        items:
          - question: ¿Qué anunció el Gobierno de España esta semana?
            frame: El Gobierno anunció ___.
          - question: ¿Qué medidas incluye el plan?
            frame: El plan incluye ___.
          - question: ¿Cuándo comenzarán a aplicarse las medidas?
            frame: Comenzarán a aplicarse ___.
          - question: ¿Cómo reaccionaron las ciudades mencionadas?
            frame: Las ciudades recibieron la noticia ___.
          - question: ¿Qué problema señalaron algunos usuarios?
            frame: Algunos usuarios dijeron que ___.
          - question: ¿Qué dijo la portavoz sobre el objetivo del plan?
            frame: La portavoz dijo que querían que ___.
      - id: act1-discussion
        type: discussionQuestions
        title: Discusión en parejas
        items:
          - question: ¿Tu ciudad necesita un plan similar?
            frame: Creo que mi ciudad ___ porque ___.
          - question: ¿Qué transporte usas más?
            frame: Uso más ___.
          - question: ¿Existen descuentos donde vives?
            frame: Sí, hay descuentos para ___. / No, no hay descuentos.
          - question: ¿Las noticias sobre transporte suelen ser positivas o negativas?
            frame: Suelen ser ___ porque ___.
          - question: ¿Cómo afecta el transporte a tu vida cotidiana?
            frame: El transporte ___.
      - id: act2
        type: classActivity
        title: 'Actividad 2: Titulares en estilo indirecto'
        skills: [Estilo indirecto]
        steps:
          - '**Paso 1, identifica el tiempo del verbo:** ¿el titular está en presente, en pasado o habla del futuro? *El gobierno anuncia nuevas medidas* (presente). *Ayer hubo un accidente* (pasado). *Mañana comienza la feria del libro* (presente con valor de futuro).'
          - '**Paso 2, elige el verbo para reportar:** *dijo que…, informó que…, anunció que…, explicaron que…*'
          - '**Paso 3, cambia el tiempo verbal hacia el pasado:** presente → imperfecto (*anuncia → anunciaba*); futuro → condicional (*habrá → habría*); el indefinido puede quedar igual (*hubo → hubo*) o pasar a pluscuamperfecto (*había habido*).'
          - '**Paso 4, cambia las expresiones de tiempo y lugar** (mira la tabla de abajo).'
          - '**Paso 5, ajusta los pronombres y posesivos:** *«Nuestro equipo gana hoy»* → *Dijeron que su equipo ganaba ese día.*'
          - '**Nivel 1, transformación guiada:** el profesor muestra un titular y tú lo transformas al estilo indirecto siguiendo los pasos.'
          - '**Nivel 2, intercambio de titulares:** escribe dos titulares (inventados o reales) y dáselos a otro estudiante. Cada uno transforma los titulares que recibió al estilo indirecto y comparten los resultados con el grupo.'
        example: |-
          *«Hoy inauguran un nuevo museo».* → *Dijeron que ese día inauguraban un nuevo museo.*
          *«Mañana cierran la autopista».* → *Dijeron que al día siguiente cerraban la autopista.*
          *«Hoy sube el precio del combustible».* → *Informaron que ese día subía el precio del combustible.*
          *«Ayer hubo un terremoto».* → *Comentaron que el día anterior hubo (había habido) un terremoto.*
      - id: act2-table
        type: table
        caption: Expresiones de tiempo y lugar
        header: [Directo, Indirecto]
        rows:
          - [hoy, ese día]
          - [mañana, al día siguiente]
          - [ayer, el día anterior]
          - [aquí, allí]
          - [este, ese]
      - id: act2-examples
        type: examples
        title: Más ejemplos
        items:
          - text: '«Hoy comienzan las clases». → Dijeron que ese día comenzaban las clases.'
          - text: '«Mañana habrá lluvia». → Informaron que al día siguiente habría lluvia.'
      - id: act2-headlines
        type: discussionQuestions
        title: Mis titulares (Nivel 2)
        items:
          - question: 'Titular 1:'
            frame: Dijeron que ___.
          - question: 'Titular 2:'
            frame: Informaron que ___.
      - id: act3
        type: classActivity
        title: 'Actividad 3: Encuesta. ¿Cómo consumes noticias?'
        skills: [Estilo indirecto]
        steps:
          - '**Paso 1, demostración:** el profesor entrevista a un alumno y reporta sus respuestas.'
          - '**Paso 2, encuesta en parejas:** pregunta a tu compañero (preguntas de abajo).'
          - '**Paso 3, reporte:** presenta al grupo las respuestas de tu compañero en estilo indirecto.'
          - '**Paso 4 (opcional), conclusión:** resume las respuestas de todo el grupo.'
        example: '*Seis estudiantes dijeron que consumen noticias digitales, pero varios comentaron que también usan redes sociales.*'
      - id: act3-questions
        type: discussionQuestions
        title: Preguntas de la encuesta
        items:
          - question: ¿Cada cuánto consumes noticias?
            frame: Mi compañero dijo que ___.
          - question: ¿Dónde? (canal, periódico, red social)
            frame: Explicó que ___.
          - question: ¿Noticias locales o internacionales?
            frame: Comentó que prefería ___.
          - question: ¿Qué titular recuerdas de esta semana?
            frame: Dijo que recordaba ___.
          - question: ¿Revisas el pronóstico del tiempo? ¿Fue correcto?
            frame: Me contó que ___.
      - id: act4
        type: classActivity
        title: 'Actividad 4: Noticias nacionales e internacionales'
        skills: [Estilo indirecto, Tiempos mezclados]
        steps:
          - 'En parejas, elijan **una noticia nacional** y **una noticia internacional**.'
          - 'Prepárenlas con este formato: tipo de evento, tema, dónde y cuándo, titular resumido, fuente y una cita breve inventada (*El portavoz afirmó que…*).'
          - Cambien de pareja y cuenten lo que escucharon en **estilo indirecto**.
      - id: act5
        type: classActivity
        title: 'Actividad 5: Debate. Libertad de expresión'
        skills: [Tiempos mezclados]
        steps:
          - 'Elijan un dilema: **A. Privacidad de los famosos:** ¿deberían los medios publicar datos médicos? **B. Cobertura electoral desigual:** ¿debe haber normas que regulen el tiempo en pantalla? **C. Noticias falsas:** ¿debe controlarse lo que se publica en las redes?'
          - 'Preparen argumentos en grupo usando el pasado, el presente, el futuro, el condicional y conectores.'
          - Debatan con el otro grupo.
        example: '*El año pasado se publicaron muchas noticias falsas (indefinido). Hoy cualquiera puede publicar (presente). Si hubiera normas, habría menos desinformación (condicional), aunque también habría menos libertad.*'
      - id: act6
        type: classActivity
        title: 'Actividad 6: El Canal de Buenas Noticias'
        skills: [Tiempos mezclados]
        steps:
          - 'Inventa una noticia positiva con: un titular, qué ha pasado hasta ahora (pretérito perfecto), qué está ocurriendo ahora (presente) y qué ocurrirá después (futuro).'
          - Presenta tu noticia como si fueras periodista del «Canal de Buenas Noticias».
      - id: act6-frames
        type: discussionQuestions
        title: Mi buena noticia
        items:
          - question: Titular
            frame: ___
          - question: ¿Qué ha pasado hasta ahora?
            frame: Hasta ahora, ___ ha / han ___.
          - question: ¿Qué está ocurriendo ahora?
            frame: Ahora ___ está ___.
          - question: ¿Qué ocurrirá después?
            frame: En el futuro, ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Estilo indirecto** (Actividades 1, 2, 3 y 4) y
          **Tiempos mezclados** (Actividades 1, 4, 5 y 6). También se trabajan la
          comprensión lectora, el debate y los conectores para dar opinión y organizar la
          información. Solo las primeras partes tienen tiempos en el cuaderno: elige las
          actividades según el tiempo del grupo.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: Da tu propio ejemplo primero.
      - id: n-warmup
        anchor: warmup
        minutes: 15
        text: Elige 3 o 4 preguntas. Haz al menos dos preguntas a cada estudiante.
      - id: n-act1
        anchor: act1-comprehension
        minutes: 12
        text: >-
          Respuestas: 1. Un plan para mejorar el transporte público en varias ciudades.
          2. Nuevas líneas de autobús, trenes más rápidos y descuentos especiales para
          estudiantes y personas mayores. 3. El próximo mes. 4. Con entusiasmo, ya que el
          tráfico ha aumentado mucho. 5. Que todavía falta mejorar la frecuencia en horas
          pico. 6. Que quieren que más personas elijan el transporte público y reduzcan el
          uso del coche particular. Esta lectura modela una noticia antes de que los
          alumnos produzcan la suya: activa el vocabulario y prepara el estilo indirecto.
          Las partes suman más de 12 minutos (3 + 5 + 7 + 5); acorta la discusión si hace
          falta.
      - id: n-act2
        anchor: act2
        text: >-
          Nivel 1: muestra titulares en la pizarra (por ejemplo, *«Hoy inauguran un nuevo
          museo»*) y pide la transformación paso a paso. Nivel 2: los alumnos intercambian
          sus propios titulares.
      - id: n-act3
        anchor: act3
        text: Haz tú la demostración con un alumno. Si la información sigue siendo verdad, acepta el presente en el reporte (*dijeron que consumen…*).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: noticias-recientes-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-indirecto
        type: ruleSummary
        skill: Estilo indirecto
        rules:
          - text: 'El **estilo indirecto** sirve para contar lo que otra persona dijo. Usamos un verbo como *dijo, comentó, explicó, informó, anunció, afirmó* + **que**, y cambiamos los **tiempos**, los **pronombres** y las **expresiones de tiempo**.'
            examples:
              - '«Estoy cansado». → Dijo que estaba cansado.'
              - '«Mañana voy a viajar». → Comentó que al día siguiente iba a viajar.'
          - text: 'Cuando el verbo que introduce está en pasado (*dijo, informaron*), el tiempo de la frase cambia hacia el pasado (mira la tabla).'
            examples:
              - '«El gobierno anuncia nuevas medidas». → Informaron que el gobierno anunciaba nuevas medidas.'
              - '«Mañana habrá lluvia». → Informaron que al día siguiente habría lluvia.'
              - '«He leído la noticia». → Dijo que había leído la noticia.'
          - text: 'El **indefinido** puede quedar igual o pasar a pluscuamperfecto. El **imperfecto** queda igual.'
            examples:
              [
                '«Ayer hubo un terremoto». → Comentaron que el día anterior hubo / había habido un terremoto.',
              ]
          - text: 'Si la información **sigue siendo verdad** ahora, podemos mantener el presente.'
            examples: [Seis estudiantes dijeron que consumen noticias digitales.]
          - text: 'Cambian también los **pronombres y posesivos** (*yo → él / ella, nuestro → su*) y las **expresiones de tiempo y lugar** (*hoy → ese día, mañana → al día siguiente, ayer → el día anterior, aquí → allí, este → ese*).'
            examples: ['«Nuestro equipo gana hoy». → Dijeron que su equipo ganaba ese día.']
      - id: indirecto-table
        type: table
        caption: Cambios de tiempo en estilo indirecto
        header: [Estilo directo, Estilo indirecto]
        rows:
          - ['presente: «Estoy cansado».', 'imperfecto: Dijo que estaba cansado.']
          - ['futuro: «Habrá lluvia».', 'condicional: Dijo que habría lluvia.']
          - ['ir a + infinitivo: «Voy a viajar».', 'iba a + infinitivo: Dijo que iba a viajar.']
          - [
              'pretérito perfecto: «He leído la noticia».',
              'pluscuamperfecto: Dijo que había leído la noticia.',
            ]
          - [
              'indefinido: «Hubo un terremoto».',
              'indefinido o pluscuamperfecto: Dijo que hubo / había habido un terremoto.',
            ]
          - [
              'imperfecto: «El tráfico era intenso».',
              'imperfecto: Dijo que el tráfico era intenso.',
            ]
      - id: rules-tiempos
        type: ruleSummary
        skill: Tiempos mezclados
        rules:
          - text: 'Para hablar de noticias y eventos, combinamos varios tiempos según la función.'
          - text: '**Pretérito perfecto:** hechos recientes.'
            examples: [He leído una noticia importante.]
          - text: '**Pretérito indefinido:** eventos terminados.'
            examples: [Ayer ocurrió un accidente.]
          - text: '**Imperfecto:** contexto o descripción.'
            examples: [El tráfico era muy intenso.]
          - text: '**Futuro:** predicciones.'
            examples: [Mañana habrá más información.]
          - text: '**Condicional:** hipótesis o consecuencias.'
            examples: [La gente estaría más tranquila con una aclaración.]
          - text: '**Conectores** para dar opinión y organizar la información: *según* (fuente), *ya que* (causa), *sin embargo* (oposición), *por eso* (consecuencia), *además* (añadir).'
            examples:
              - Según el Ministerio, las medidas comenzarán el próximo mes.
              - Las ciudades están contentas, ya que el tráfico ha aumentado mucho. Sin embargo, falta mejorar la frecuencia.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos habilidades. Pide a cada estudiante que cuente en estilo indirecto un titular de esta semana y que añada una predicción en futuro.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: noticias-recientes-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia un mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: mori-indirecto
        type: aiTutorPrompt
        title: 'Tarea 1: Practicar el estilo indirecto'
        intro: 'Objetivo: transformar afirmaciones, preguntas y opiniones al estilo indirecto, con corrección inmediata.'
        message: >-
          Hola, Mori. Quiero practicar cómo reportar lo que otras personas dicen. ¿Puedes
          hacerme preguntas sobre noticias recientes y corregir mis errores cuando use el
          estilo indirecto?
      - id: mori-noticia
        type: aiTutorPrompt
        title: 'Tarea 2: Una noticia corta en estilo indirecto'
        intro: 'Objetivo: aplicar el estilo indirecto en un contexto real y prestar atención a los cambios de tiempo verbal, pronombres y expresiones de tiempo.'
        message: >-
          Mori, dame una noticia corta y yo la repetiré en estilo indirecto. Por favor,
          revisa mis cambios de tiempo, pronombres y expresiones temporales.
      - id: mori-tiempo
        type: aiTutorPrompt
        title: 'Tarea 3: El pronóstico del tiempo (pasado, presente, futuro y condicional)'
        intro: 'Objetivo: practicar los tiempos mezclados: pasado (*fue, hizo*), presente (*es, hay*), futuro (*hará, habrá*) y condicional (*pasaría, habría*).'
        message: >-
          Mori, hazme preguntas para que pueda describir cómo fue el clima la semana
          pasada, cómo es hoy, cuál es el pronóstico de mañana y qué podría pasar si la
          previsión fuera incorrecta. Por favor, corrige mis errores.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**

