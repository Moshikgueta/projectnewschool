# Cycle "Carrera y desarrollo personal", converted from the Spanish level 3 digital
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-3
slug: carrera-y-desarrollo-personal
title: Carrera y desarrollo personal
goal: Presentarse en un contexto profesional y construir una narrativa con varios tiempos verbales.
position: 3
status: in_review

review:
  - >-
    The two workbook exercises ("Presentación personal" and "Narrar con varios
    tiempos") are NEW: the notebook has no self-study exercises. They were written
    from the cycle's two skills, its summary rules, the activity examples and its
    vocabulary. Please check level, wording and every right answer before students
    see them.
  - >-
    Summary, conditionals (rules translated from English): "Si + pasado, condicional
    simple" → "Si + imperfecto de subjuntivo (tuviera / tuviese), condicional
    simple"; "Si + pluscuamperfecto, condicional compuesto" → "Si + pluscuamperfecto
    de subjuntivo (hubiera / hubiese aceptado), condicional compuesto". The labels
    "cero / primer / segundo / tercer condicional" are given as "condicional tipo 0,
    1, 2, 3". A rule was added that after "si" we never use the future or the
    conditional.
  - >-
    Summary, other fixes: the "Futuro" example "En el futuro me gustaría tener mi
    propia empresa" is a conditional, not a future; it is moved to the conditional
    rule and the future now has "En el futuro tendré mi propia empresa" and "Mañana
    voy a presentar un proyecto importante". Passive (optional part): "Más formación
    debería ser dada a los empleados" (calque of an English passive) → "Se debería
    dar más formación a los empleados". The passive and the conditionals are not
    among this cycle's two skills (they belong to "Dinero y ahorros"); they are kept
    in the summary under "Para ampliar" because Activity 3 and Mori use them.
  - >-
    Corrections: Activity 1 "Cuéntame sobre tu jefe favorito" → "Háblame de tu jefe
    favorito"; Mori "¿Cómo describirías tu jefe ideal?" → "¿Cómo describirías a tu
    jefe ideal?" (personal "a"); Mori Activity 4 example "En el futuro me inspiraría
    tener mi propia empresa" → "En el futuro me gustaría inspirar a otros con mi
    propia empresa"; Activity 5 steps were all numbered "1."; they are renumbered.
    Stray characters ("ð¹") removed. Activity 3 poll "¿Alguna vez tuviste un jefe
    ideal…?" → "¿Alguna vez has tenido…?" and "Prefiero no decir" → "Prefiero no
    decirlo"; Activity 4 "qué los impactó más" → "qué les impactó más", "¿Quién
    recuerda qué quería ser de niño Pedro?" → "¿…qué quería ser Pedro de niño?", and
    the instruction "Solo tienes 2 minutos con tu compañero" is given as "Solo tienes
    1 minuto" (each 2-minute round is 1 minute per person, as the source says in
    Etapa 2). Warm-up "por ti mismo" → "por ti mismo/a".
  - >-
    Activities 3, 4 and 5 are written for an online class with Zoom Poll, breakout
    rooms, the chat and Jamboard / Zoom whiteboard (no links). They are kept, and the
    tools are mentioned only in teacher notes; Jamboard is no longer available, so
    the note says "pizarra virtual". Activity 3 practises the type 2 and 3
    conditionals, which are not one of the two skills; it is kept as in the source.
  - >-
    Times given as ranges are recorded as the upper value (Activity 3: 10–15 → 15,
    pairs 5–6 → 6; Activity 4: 3–4 rounds → 4; Activity 5: preparation 2–3 → 3,
    sharing 2–3 → 3). Activities 1 and 2 have only partial times in the source
    (Activity 2: 7 minutes to find a resource, 2 minutes to present).
  - >-
    "Networking" (Activity 4 title and vocabulary) is an English loanword that is
    widely used in Spanish; kept. The Quizlet link is kept without its "?new"
    parameter. Warm-up sentence frames were added (the source has none).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: carrera-y-desarrollo-personal-clase
    title: 'Clase: Carrera y desarrollo personal'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Carrera y desarrollo personal
      - id: skills
        type: cycleOverview
        skills:
          - name: Presentación personal
            description: '*Soy Ana, trabajo como ingeniera. Me dedico a… Cuando era niña soñaba con…*'
          - name: Narrar con varios tiempos verbales
            description: 'Pasado, presente y futuro: *Cuando era niño quería… Hoy trabajo en… En el futuro…*'
      - id: quizlet
        type: externalLink
        label: Carrera y desarrollo personal en Quizlet
        url: https://quizlet.com/il/1071844576/carrera-y-desarrollo-personal-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___. Cuando era niño/a soñaba con ser ___ y hoy soy ___.
        example: Soy Ana. Cuando era niña soñaba con ser piloto y hoy soy ingeniera de software.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de discusión
      - id: warmup
        type: discussionQuestions
        items:
          - question: ¿Qué haces en el trabajo de manera rutinaria? (Di tres cosas.)
            frame: En el trabajo normalmente ___, ___ y ___.
          - question: '¿Qué es más importante para ti en el trabajo: el dinero o el interés personal? (Explica con tres razones en una sola frase.)'
            frame: Para mí es más importante ___ porque ___, ___ y ___.
          - question: ¿Sientes que tu trabajo es significativo para ti? ¿Por qué sí o por qué no?
            frame: Sí, siento que mi trabajo es significativo porque ___. / No, porque ___.
          - question: ¿Qué otras cosas haces por ti mismo/a además del trabajo?
            frame: Además del trabajo, ___.
          - question: ¿Qué necesitas hacer para tener un buen equilibrio entre la vida laboral y la personal?
            frame: Para tener un buen equilibrio, necesito ___.
          - question: ¿Cuál fue la situación más desafiante que tuviste en el trabajo y cómo la resolviste?
            frame: La situación más desafiante fue cuando ___. La resolví ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Simulación de entrevista de trabajo'
        skills: [Presentación personal]
        steps:
          - 'Trabajen en parejas: uno es el entrevistador y el otro, el entrevistado.'
          - El entrevistador hace una pregunta de la lista y el entrevistado responde.
          - Cambien los roles.
          - Cada estudiante da retroalimentación a su compañero.
      - id: act1-questions
        type: discussionQuestions
        title: Banco de preguntas
        items:
          - question: Háblame de tu jefe favorito y de por qué te gustaba trabajar con él o con ella.
            frame: Mi jefe favorito fue ___. Me gustaba trabajar con él / ella porque ___.
          - question: He visto en tu currículum que cambiaste varias veces de trabajo. ¿Por qué crees que fue así?
            frame: Cambié de trabajo porque ___.
          - question: Háblame de un éxito o un fracaso que te enseñó algo importante.
            frame: Una vez ___. Aprendí que ___.
          - question: ¿Qué piensas que dicen tus colegas de ti a tus espaldas?
            frame: Creo que dicen que soy ___.
          - question: ¿Por qué no deberíamos contratarte?
            frame: No deberían contratarme si buscan ___.
      - id: act2
        type: classActivity
        title: 'Actividad 2: ¿Qué me inspira en mi trabajo?'
        skills: [Narrar con varios tiempos verbales]
        steps:
          - Busca (7 minutos) un vídeo corto, una imagen o una cita que te inspire en tu vida profesional.
          - 'Preséntalo (2 minutos como máximo): ¿Cuál es la fuente de inspiración? ¿Qué te inspira a hacer? Da un ejemplo concreto de cómo te inspira.'
          - 'Retroalimentación del grupo: ¿fue clara, convincente, memorable, bien estructurada?'
          - 'Discusión con el profesor: ¿cómo construimos una narrativa con **pasado, presente y futuro**?'
      - id: act2-notes
        type: discussionQuestions
        title: Mi fuente de inspiración
        items:
          - question: ¿Cuál es la fuente de inspiración?
            frame: Mi fuente de inspiración es ___.
          - question: ¿Qué te inspira a hacer?
            frame: Me inspira a ___.
          - question: Ejemplo concreto
            frame: El año pasado ___. Hoy ___. En el futuro ___.
      - id: act3
        type: classActivity
        title: 'Actividad 3: Debate, jefe ideal vs. jefe horrible'
        skills: [Narrar con varios tiempos verbales]
        minutes: 15
        steps:
          - 'Encuesta inicial (2 minutos): *¿Alguna vez has tenido un jefe ideal o un jefe horrible?* (Sí / No / Prefiero no decirlo). Comenten los resultados.'
          - 'Trabajo en parejas (6 minutos): el estudiante A describe cómo sería su **jefe ideal** con condicionales; el estudiante B describe cómo sería su **jefe horrible**. Después de 3 minutos, cambian los roles.'
          - 'Puesta en común (5 minutos): cada pareja comparte una frase sobre el jefe ideal y una sobre el jefe horrible.'
          - 'Mini debate (3 minutos): *¿Qué es más importante: evitar un jefe horrible o tener un jefe ideal?* Escribe tu postura (*Yo creo que…*); dos o tres estudiantes defienden su opinión con condicionales.'
          - 'Opcional (mini-tarea): escribe una frase con el condicional tipo 3 sobre una experiencia real.'
        example: |-
          **Estudiante A:** *Si tuviera un jefe ideal, me daría más confianza. Si mi jefe fuera justo, todos trabajaríamos mejor.*
          **Estudiante B:** *Si mi jefe fuera autoritario, me sentiría muy estresado. Si mi jefe no escuchara a su equipo, habría más problemas.*
          **Tipo 3:** *Si mi jefe anterior me hubiera dado más apoyo, habría crecido más en la empresa. Si hubiera tenido un jefe horrible, habría buscado otro trabajo.*
      - id: act3-board
        type: table
        caption: Jefe ideal y jefe horrible
        header: [Jefe ideal, Jefe horrible]
        rows:
          - [
              'Si fuera empático, habría más motivación.',
              'Si gritara a sus empleados, la moral bajaría.',
            ]
          - [
              'Si tuviera visión, inspiraría al equipo.',
              'Si no planificara, los proyectos fracasarían.',
            ]
      - id: act3-sentences
        type: discussionQuestions
        title: Mis frases
        items:
          - question: Mi jefe ideal
            frame: Si mi jefe fuera ___, ___.
          - question: Mi jefe horrible
            frame: Si mi jefe ___, ___.
          - question: '¿Qué es más importante: evitar un jefe horrible o tener un jefe ideal?'
            frame: Yo creo que ___ porque, si ___, ___.
          - question: 'Opcional: una frase con el condicional tipo 3'
            frame: Si mi jefe anterior hubiera ___, habría ___.
      - id: act4
        type: classActivity
        title: 'Actividad 4: Networking exprés'
        skills: [Presentación personal, Narrar con varios tiempos verbales]
        minutes: 15
        steps:
          - 'Instrucción y demostración (2 minutos): vas a presentarte como en un evento de *networking*. Solo tienes 1 minuto. Incluye siempre: 1) nombre y profesión; 2) qué haces en tu día a día; 3) algo curioso de ti (pasado, presente o futuro).'
          - 'Rondas rápidas (8 minutos): en parejas, cada ronda dura 2 minutos (1 minuto por persona). Después, el profesor cambia las parejas (4 rondas). Puedes tomar notas de lo que recuerdas de cada persona.'
          - 'Puesta en común (5 minutos): escribe *La persona más memorable para mí fue ___ porque ___*. Dos voluntarios explican en voz alta qué les impactó más.'
          - 'Opcional (mini-tarea): escribe una versión mejorada de tu presentación con tres tiempos: pasado (*Cuando era niño/a quería…*), presente (*Hoy trabajo en…*) y futuro (*En cinco años espero…*).'
        example: |-
          *Soy Ana, trabajo como ingeniera de software.*
          *Me dedico a desarrollar aplicaciones educativas.*
          *Cuando era niña soñaba con ser piloto, y en el futuro quiero aprender a volar drones.*
      - id: act4-variants
        type: callout
        tone: tip
        title: Variantes para hacerlo más divertido
        text: |-
          **Desafío extra:** en una ronda, preséntate como si fueras otra persona (un artista, un médico, un emprendedor…).
          **Juego de memoria:** al final, el profesor pregunta: *¿Quién recuerda qué quería ser Pedro de niño?*
      - id: act4-sentences
        type: discussionQuestions
        title: Mi presentación
        items:
          - question: Nombre y profesión
            frame: Soy ___, trabajo como ___.
          - question: Mi día a día
            frame: Me dedico a ___.
          - question: Algo curioso de mí
            frame: Cuando era niño/a soñaba con ___, y en el futuro quiero ___.
          - question: La persona más memorable para mí
            frame: La persona más memorable para mí fue ___ porque ___.
      - id: act5
        type: classActivity
        title: 'Actividad 5: La línea de vida profesional'
        skills: [Narrar con varios tiempos verbales]
        minutes: 11
        steps:
          - 'Instrucción (1 minuto): vas a contar tu carrera como si fuera una línea de vida, con pasado, presente y futuro.'
          - 'Preparación individual (3 minutos): piensa en 3 momentos clave. Pasado (imperfecto / indefinido): *Cuando era niño/a, soñaba con ser… / Mi primer trabajo fue…* Presente: *Hoy trabajo en… / Ahora estudio para…* Futuro / condicional: *En el futuro me gustaría… / Si pudiera elegir, trabajaría como…*'
          - 'Intercambio en parejas (4 minutos): comparte tu línea de vida con tu compañero.'
          - 'Puesta en común (3 minutos, opcional): presenta en 2 frases la línea de vida de tu compañero.'
          - 'Variantes: escribe las 3 frases en el chat, o el grupo vota la línea de vida más sorprendente.'
        example: |-
          *Cuando era niño, quería ser médico. Hoy soy ingeniero de software. En el futuro me gustaría dirigir mi propia empresa.*
          *Mi compañero soñaba con ser profesor, hoy trabaja como consultor y en el futuro quiere dar clases en la universidad.*
      - id: act5-timeline
        type: discussionQuestions
        title: Mi línea de vida
        items:
          - question: Pasado
            frame: Cuando era niño/a, soñaba con ser ___. / Mi primer trabajo fue ___.
          - question: Presente
            frame: Hoy trabajo en ___. / Ahora estudio para ___.
          - question: Futuro
            frame: En el futuro me gustaría ___. / Si pudiera elegir, trabajaría como ___.
          - question: La línea de vida de mi compañero
            frame: Mi compañero/a soñaba con ser ___, hoy trabaja como ___ y en el futuro quiere ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Presentación personal** (Actividades 1 y 4) y
          **Narrar con varios tiempos verbales** (Actividades 2, 4 y 5). La Actividad 3
          practica los condicionales de tipo 2 y 3 en un debate. El cuaderno no indica
          cómo combinar las actividades.
      - id: n-intro
        anchor: intro
        text: 'Máximo 5 minutos: cada estudiante dice 2 frases, no más de 30 segundos. Da tu propio ejemplo primero.'
      - id: n-warmup
        anchor: warmup-title
        text: Haz al menos dos preguntas a cada estudiante. Las respuestas escritas aquí aparecen debajo de cada pregunta.
      - id: n-act1
        anchor: act1
        text: >-
          Asegúrate de que las respuestas incluyan vocabulario de la unidad y corrige la
          gramática en el momento.
      - id: n-act2
        anchor: act2
        text: >-
          Los estudiantes necesitan internet para buscar un vídeo, una imagen o una cita
          (7 minutos). Al final, guía la discusión: qué tiempos usaron para el pasado, el
          presente y el futuro, y qué conectores ayudan.
      - id: n-act3
        anchor: act3
        minutes: 15
        text: >-
          Pensada para una clase en línea. Encuesta: 2 minutos (encuesta de Zoom o a mano
          alzada). Parejas: 6 minutos (salas de grupos; muestra las instrucciones en
          pantalla y léelas en voz alta). Puesta en común: 5 minutos (en el chat o en
          voz alta); escribe las frases en una pizarra virtual en dos columnas, *Jefe
          ideal* y *Jefe horrible*. Mini debate: 3 minutos. Ejemplo para comentar la
          encuesta: *¡Veo que el 60 % ha tenido un jefe horrible! Vamos a debatirlo…*
      - id: n-act4
        anchor: act4
        minutes: 15
        text: >-
          Salas de grupos (Zoom / Meet) y chat. Da primero tu propio ejemplo. Cambia las
          parejas cada 2 minutos (3 o 4 rondas). En la puesta en común, los estudiantes
          escriben en el chat.
      - id: n-act5
        anchor: act5
        minutes: 11
        text: >-
          Instrucción: 1 minuto. Preparación: 3 minutos. Parejas: 4 minutos (salas de
          grupos). Puesta en común opcional: 3 minutos.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: carrera-y-desarrollo-personal-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-narrativa
        type: ruleSummary
        skill: Narrar con varios tiempos verbales
        rules:
          - text: '**Pretérito imperfecto:** hábitos o situaciones del pasado.'
            examples: ['Cuando era niño, soñaba con ser médico.']
          - text: '**Pretérito indefinido / perfecto:** hechos puntuales y terminados.'
            examples:
              [El año pasado trabajé en una empresa internacional., Este año he cambiado de puesto.]
          - text: '**Presente:** la situación actual o las rutinas.'
            examples: [Hoy trabajo como consultor., Actualmente estudio una maestría en negocios.]
          - text: '**Futuro** (*tendré*) o **ir a + infinitivo:** planes y predicciones.'
            examples:
              [
                En el futuro tendré mi propia empresa.,
                Mañana voy a presentar un proyecto importante.,
              ]
          - text: '**Condicional simple:** deseos o situaciones hipotéticas.'
            examples:
              [
                En el futuro me gustaría tener mi propia empresa.,
                'Si pudiera cambiar de trabajo, lo haría mañana mismo.',
              ]
      - id: connectors
        type: table
        caption: Conectores útiles para una narrativa
        header: [Momento, Conectores]
        rows:
          - [Pasado, 'cuando era niño/a…, en aquel tiempo…, antes…, hace unos años…']
          - [Presente, 'actualmente…, hoy en día…, en este momento…']
          - [
              Futuro / condicional,
              'en el futuro…, dentro de cinco años…, si pudiera…, me gustaría…',
            ]
      - id: rules-presentacion
        type: ruleSummary
        skill: Presentación personal
        rules:
          - text: 'Una presentación breve incluye: **nombre y profesión**, **qué haces en tu día a día** y **algo curioso de ti** (pasado, presente o futuro).'
            examples:
              [
                'Soy Ana, trabajo como ingeniera de software.',
                Me dedico a desarrollar aplicaciones educativas.,
              ]
          - text: 'Para decir tu profesión: *soy* + profesión (sin *un / una*) o *trabajo como* + profesión.'
            examples: [Soy ingeniera., Trabajo como consultor.]
          - text: 'Usa tres tiempos para ser memorable.'
            examples:
              [
                'Cuando era niña soñaba con ser piloto, y en el futuro quiero aprender a volar drones.',
              ]
      - id: extra-title
        type: heading
        level: 3
        text: Para ampliar
      - id: rules-condicionales
        type: ruleSummary
        skill: Oraciones condicionales
        rules:
          - text: '**Tipo 0, hechos generales:** si + presente, presente.'
            examples: ['Si trabajas duro, logras buenos resultados.']
          - text: '**Tipo 1, posibilidades reales de futuro:** si + presente, futuro.'
            examples: ['Si estudio más este año, conseguiré un mejor empleo.']
          - text: '**Tipo 2, situaciones irreales (presente / futuro):** si + imperfecto de subjuntivo (*tuviera / tuviese*), condicional simple.'
            examples: ['Si tuviera un jefe más flexible, estaría más motivado.']
          - text: '**Tipo 3, situaciones irreales del pasado:** si + pluscuamperfecto de subjuntivo (*hubiera / hubiese* + participio), condicional compuesto (*habría* + participio).'
            examples: ['Si hubiera aceptado aquel trabajo, habría viajado más.']
          - text: 'Después de **si** nunca usamos el futuro ni el condicional.'
            examples: ['Si tengo tiempo, te llamaré. (no *Si tendré tiempo*)']
      - id: rules-pasiva
        type: ruleSummary
        skill: Voz pasiva (opcional)
        rules:
          - text: 'Se usa cuando lo importante es la **acción** y no quién la realiza. **Ser + participio** (+ *por* + agente), o **se** + verbo.'
            examples:
              [
                El proyecto fue aprobado por el comité.,
                Se ofrecieron nuevas oportunidades en la empresa.,
                Se debería dar más formación a los empleados.,
              ]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: >-
          Repasa las dos habilidades y pide a cada estudiante una mini-narrativa de tres
          frases (pasado, presente, futuro) con un conector en cada frase.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: carrera-y-desarrollo-personal-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia un mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: mori-main
        type: aiTutorPrompt
        title: Mensaje general
        message: >-
          Hola Mori, quiero practicar lo que aprendí en la clase sobre carrera y
          desarrollo personal. Hazme preguntas para que pueda presentarme, contar mi
          trayectoria y usar pasado, presente, futuro y condicionales. Corrige mis
          errores.
      - id: mori-entrevista
        type: aiTutorPrompt
        title: 'Actividad 1: Mini entrevista de trabajo'
        intro: 'Mori podría preguntarte: *¿Por qué deberíamos contratarte? ¿Qué aprendiste de un error en tu carrera? ¿Cómo describirías a tu jefe ideal? ¿Qué te motiva más: el dinero o la satisfacción profesional? ¿Dónde te ves en cinco años?*'
        message: >-
          Simulemos una entrevista de trabajo. Hazme 5 preguntas como si fueras el
          entrevistador, y yo responderé. Corrige mis respuestas y dame una versión
          mejorada.
      - id: mori-linea
        type: aiTutorPrompt
        title: 'Actividad 2: Mi línea de vida profesional'
        intro: 'Estructura: *Cuando era niño/a…* (imperfecto) · *Hoy…* (presente) · *En el futuro…* (futuro o condicional)'
        message: >-
          Quiero practicar mi línea de vida profesional. Pídeme que hable de mi pasado,
          presente y futuro profesional. Luego ayúdame a mejorarla con conectores y
          correcciones.
      - id: mori-condicionales
        type: aiTutorPrompt
        title: 'Actividad 3: Condicionales en el trabajo'
        intro: 'Ejemplos: *Si tuvieras un jefe horrible, ¿qué harías?* (tipo 2) · *Si hubieras aceptado otro trabajo el año pasado, ¿qué habría pasado?* (tipo 3) · *Si consigues un ascenso este año, ¿qué harás con el dinero extra?* (tipo 1)'
        message: >-
          Hazme preguntas usando condicionales sobre trabajo y carrera. Yo responderé
          con el condicional correcto. Por favor, corrige mis errores.
      - id: mori-inspiracion
        type: aiTutorPrompt
        title: 'Actividad 4: Inspiración laboral'
        intro: 'Ejemplo: *El año pasado me inspiró un jefe que confiaba en mí. Hoy me inspira aprender algo nuevo cada día. En el futuro me gustaría inspirar a otros con mi propia empresa.*'
        message: >-
          Pregúntame qué me inspira en mi trabajo y ayúdame a responder con pasado,
          presente y futuro. Después dame ejemplos mejores de cómo hacerlo.
      - id: mori-test
        type: aiTutorPrompt
        title: Cierre de la tarea
        message: >-
          Hazme un pequeño test: dame frases con errores en tiempos verbales y
          condicionales, y yo intentaré corregirlas.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: carrera-y-desarrollo-personal-practica
