vocabulary:
  - slug: carrera-y-desarrollo-personal
    title: Carrera y desarrollo personal
    items: *carrera-y-desarrollo-personal-words

activities:
  - slug: carrera-y-desarrollo-personal-presentacion
    title: 'Presentación personal: soy, trabajo como, me dedico a'
    minutes: 8
    items:
      - id: trabajo-como
        type: multipleChoice
        prompt: Soy Ana, ___ como ingeniera de software.
        options:
          - { text: trabajo, correct: true }
          - {
              text: trabaja,
              feedback: '*Trabaja* es para él / ella. Para hablar de ti usa *trabajo*.',
            }
          - {
              text: trabajar,
              feedback: '*Trabajar* es el infinitivo. Hay que conjugar el verbo: *trabajo*.',
            }
      - id: me-dedico
        type: fillBlank
        prompt: Completa con el verbo *dedicarse* en presente (yo).
        text: Me ___ a desarrollar aplicaciones educativas.
        blanks: [[dedico]]
      - id: entrevista
        type: matching
        prompt: Une cada pregunta de la entrevista con una buena respuesta.
        pairs:
          - [¿Por qué deberíamos contratarte?, Porque tengo experiencia y aprendo rápido.]
          - [¿Dónde te ves en cinco años?, En cinco años espero dirigir un equipo.]
          - [¿Qué aprendiste de un error?, Aprendí a pedir ayuda a tiempo.]
          - [¿Qué te motiva más?, Me motiva aprender algo nuevo cada día.]
          - [¿Cómo describirías a tu jefe ideal?, Sería justo y escucharía a su equipo.]
      - id: sonaba
        type: multipleChoice
        prompt: Cuando era niña, ___ con ser piloto.
        options:
          - { text: soñaba, correct: true }
          - {
              text: sueño,
              feedback: '*Sueño* es presente. *Cuando era niña* habla de una situación del pasado: usamos el imperfecto, *soñaba*.',
            }
          - {
              text: soñaré,
              feedback: '*Soñaré* es futuro. Para una situación del pasado usamos el imperfecto, *soñaba*.',
            }
      - id: sin-un
        type: trueFalse
        prompt: 'Para decir tu profesión, decimos *Soy ingeniero* o *Trabajo como ingeniero*, sin *un*.'
        answer: true
        feedback:
          correct: '¡Correcto! *Soy ingeniero*, no *Soy un ingeniero*.'
          incorrect: 'Con la profesión no usamos *un / una*: *Soy ingeniero. Trabajo como ingeniero.*'
      - id: espero
        type: fillBlank
        prompt: Completa con el verbo *esperar* en presente (yo).
        text: En cinco años ___ tener mi propia empresa.
        blanks: [[espero, yo espero]]
      - id: memorable
        type: multipleChoice
        prompt: La persona más memorable para mí ___ Pedro, porque quería ser astronauta.
        options:
          - { text: fue, correct: true }
          - { text: fui, feedback: '*Fui* es para *yo*. Hablamos de Pedro (él): *fue*.' }
          - { text: ser, feedback: '*Ser* es el infinitivo. Hay que conjugar el verbo: *fue*.' }
      - id: ordena-ana
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Soy Ana y trabajo como ingeniera.

  - slug: carrera-y-desarrollo-personal-narrativa
    title: 'Narrar con varios tiempos: pasado, presente y futuro'
    minutes: 8
    items:
      - id: trabaje
        type: multipleChoice
        prompt: El año pasado ___ en una empresa internacional.
        options:
          - { text: trabajé, correct: true }
          - {
              text: trabajo,
              feedback: '*Trabajo* es presente. *El año pasado* es un hecho terminado: *trabajé*.',
            }
          - {
              text: trabajaré,
              feedback: '*Trabajaré* es futuro. Para el año pasado usamos el indefinido, *trabajé*.',
            }
      - id: tiempos
        type: matching
        prompt: Une cada oración con su tiempo verbal.
        pairs:
          - ['Cuando era niño, soñaba con ser médico.', Pretérito imperfecto]
          - [El año pasado trabajé en una empresa internacional., Pretérito indefinido]
          - [Hoy trabajo como consultor., Presente]
          - [Mañana voy a presentar un proyecto., Ir a + infinitivo (futuro)]
          - ['Si pudiera, cambiaría de trabajo.', Condicional]
      - id: tuviera
        type: fillBlank
        prompt: Completa con el verbo *tener* (situación irreal).
        text: Si ___ un jefe más flexible, estaría más motivado.
        blanks: [[tuviera, tuviese, yo tuviera, yo tuviese]]
      - id: habria-viajado
        type: multipleChoice
        prompt: Si hubiera aceptado aquel trabajo, ___ más.
        options:
          - { text: habría viajado, correct: true }
          - {
              text: viajaría,
              feedback: 'Es una situación irreal del pasado: con *si hubiera…* usamos el condicional compuesto, *habría viajado*.',
            }
          - {
              text: había viajado,
              feedback: '*Había viajado* es pluscuamperfecto de indicativo. En el resultado va el condicional compuesto: *habría viajado*.',
            }
      - id: imperfecto
        type: trueFalse
        prompt: 'Usamos el pretérito imperfecto para hábitos o situaciones del pasado: *Cuando era niño, soñaba con ser médico.*'
        answer: true
        feedback:
          correct: '¡Correcto! *Era* y *soñaba* describen una situación del pasado.'
          incorrect: 'El imperfecto (*era, soñaba*) describe hábitos y situaciones del pasado. Para hechos puntuales usamos el indefinido (*trabajé*).'
      - id: companero
        type: fillBlank
        prompt: Completa con *soñar* en imperfecto y *trabajar* en presente.
        text: Mi compañero ___ con ser profesor, y hoy ___ como consultor.
        blanks: [[soñaba], [trabaja]]
      - id: actualmente
        type: multipleChoice
        prompt: ___ trabajo en una empresa de tecnología.
        options:
          - { text: Actualmente, correct: true }
          - {
              text: Hace unos años,
              feedback: '*Hace unos años* es un conector de pasado; con *trabajo* (presente) usamos *actualmente*.',
            }
          - {
              text: Dentro de cinco años,
              feedback: '*Dentro de cinco años* habla del futuro; con *trabajo* (presente) usamos *actualmente*.',
            }
      - id: ordena-futuro
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: En el futuro quiero dirigir mi propia empresa.
