          - { term: Reciclaje, gloss: מיחזור }
          - { term: Basura, gloss: אשפה }
          - { term: Energía, gloss: אנרגיה }
          - { term: Agua, gloss: מים }
          - { term: Aire limpio, gloss: אוויר נקי }
          - { term: Tierra, gloss: אדמה / כדור הארץ }
          - { term: Recursos, gloss: משאבים }
          - { term: Biodiversidad, gloss: מגוון ביולוגי }
