vocabulary:
  - slug: sustentabilidad
    title: Sustentabilidad
    items: *sustentabilidad-words

activities:
  - slug: sustentabilidad-hipoteticas
    title: 'Oraciones hipotéticas: si viviera, viviría'
    minutes: 8
    items:
      - id: fuera
        type: multipleChoice
        prompt: Si yo ___ presidente, prohibiría los plásticos.
        options:
          - { text: fuera, correct: true }
          - {
              text: sería,
              feedback: 'Después de *si* no usamos el condicional. Usa el imperfecto de subjuntivo: *Si yo fuera…*',
            }
          - {
              text: soy,
              feedback: 'Es una hipótesis (no es real): usa el imperfecto de subjuntivo, *fuera*, con el condicional *prohibiría*.',
            }
      - id: viviera
        type: fillBlank
        prompt: Completa con el verbo *vivir* en imperfecto de subjuntivo (yo).
        text: Si ___ en la naturaleza, cuidaría el agua.
        blanks: [[viviera, yo viviera, viviese, yo viviese]]
      - id: usara
        type: multipleChoice
        prompt: ¿Qué pasaría si toda la ciudad ___ el transporte público?
        options:
          - { text: usara, correct: true }
          - {
              text: usaría,
              feedback: 'Después de *si* no va el condicional. Usa el imperfecto de subjuntivo: *usara*.',
            }
          - {
              text: use,
              feedback: '*Use* es presente de subjuntivo. Después de *si*, en una hipótesis, usamos el imperfecto de subjuntivo: *usara*.',
            }
      - id: raices
        type: matching
        prompt: Une cada verbo con su forma de *yo* en condicional.
        pairs:
          - [poder, podría]
          - [hacer, haría]
          - [querer, querría]
          - [decir, diría]
          - [vivir, viviría]
      - id: terminaciones
        type: trueFalse
        prompt: 'El condicional se forma con el infinitivo + *-ía, -ías, -ía, -íamos, -ían*: *usar → usaría*.'
        answer: true
        feedback:
          correct: ¡Correcto! *usar → usaría, usarías, usaría, usaríamos, usarían*.
          incorrect: 'Sí: al infinitivo completo le agregamos *-ía, -ías, -ía, -íamos, -ían*. *usar → usaría*.'
      - id: deberiamos
        type: fillBlank
        prompt: Completa con el verbo *deber* en condicional (nosotros).
        text: Para mejorar el planeta, ___ usar menos autos.
        blanks: [[deberíamos, nosotros deberíamos]]
      - id: estaria
        type: multipleChoice
        prompt: Si cambiáramos nuestros hábitos, el aire ___ más limpio.
        options:
          - { text: estaría, correct: true }
          - {
              text: estará,
              feedback: '*Estará* es futuro. Con *si* + imperfecto de subjuntivo, la otra parte va en condicional: *estaría*.',
            }
          - {
              text: estuviera,
              feedback: '*Estuviera* es imperfecto de subjuntivo: va después de *si*. La consecuencia va en condicional: *estaría*.',
            }
      - id: ordena-podria
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Yo podría reciclar más en casa.

  - slug: sustentabilidad-escritura
    title: 'Escritura: una carta formal'
    minutes: 8
    items:
      - id: saludo
        type: multipleChoice
        prompt: ¿Cómo empieza una carta formal a un alcalde?
        options:
          - { text: 'Estimado Sr. Alcalde:', correct: true }
          - {
              text: '¡Hola, amigo!',
              feedback: 'Es un saludo informal. En una carta formal escribimos *Estimado/a…:*',
            }
          - {
              text: 'Atentamente,',
              feedback: '*Atentamente* es la despedida: va al final de la carta.',
            }
      - id: partes
        type: matching
        prompt: Une cada parte de la carta con un ejemplo.
        pairs:
          - [Saludo, 'Estimado Sr. Alcalde:']
          - [Problema, Actualmente hay muy pocos puntos de reciclaje.]
          - [Propuesta, Le propongo que promueva más puntos de reciclaje.]
          - [Argumento, ya que así reduciríamos la basura.]
          - [Despedida, 'Atentamente, Ana.']
      - id: propongo
        type: multipleChoice
        prompt: Le propongo que ___ más puntos de reciclaje en la ciudad.
        options:
          - { text: promueva, correct: true }
          - {
              text: promueve,
              feedback: 'Después de *le propongo que* el verbo va en presente de subjuntivo: *promueva*.',
            }
          - {
              text: promover,
              feedback: 'Después de *que* necesitamos un verbo conjugado en subjuntivo: *promueva*.',
            }
      - id: usted
        type: trueFalse
        prompt: 'En una carta formal a un político usamos *usted*: *Le escribo para pedirle…*'
        answer: true
        feedback:
          correct: ¡Correcto! En una carta formal hablamos de *usted*.
          incorrect: 'En una carta formal usamos *usted* (*le escribo, le propongo*), no *tú*.'
      - id: reciclen
        type: fillBlank
        prompt: Completa con el verbo *reciclar* en presente de subjuntivo.
        text: Es importante que los ciudadanos ___ más.
        blanks: [[reciclen]]
      - id: ya-que
        type: multipleChoice
        prompt: Deberíamos plantar más árboles, ___ limpian el aire.
        options:
          - { text: ya que, correct: true }
          - {
              text: pero,
              feedback: '*Pero* expresa un contraste. Para dar una razón usamos *porque* o *ya que*.',
            }
          - {
              text: atentamente,
              feedback: '*Atentamente* es la despedida de la carta. Para dar una razón usamos *porque* o *ya que*.',
            }
      - id: hubiera
        type: fillBlank
        prompt: Completa la carta con *haber* (imperfecto de subjuntivo) y *poder* (condicional).
        text: Si ___ más puntos de reciclaje, los ciudadanos ___ reciclar más fácilmente.
        blanks: [[hubiera, hubiese], [podrían]]
      - id: ordena-escribo
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Le escribo para pedirle ayuda.
