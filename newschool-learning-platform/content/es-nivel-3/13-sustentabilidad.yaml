# Cycle "Sustentabilidad", converted from the Spanish nivel 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-3
slug: sustentabilidad
title: Sustentabilidad
goal: Formular hipótesis con el condicional y si + imperfecto de subjuntivo, y escribir una propuesta o carta formal.
position: 13
status: in_review

review:
  - >-
    The two workbook exercises ("Oraciones hipotéticas" and "Escritura formal") are
    NEW: the notebook has no self-study exercises. They were written from the cycle's
    two skills, its summary rules, the activity examples and its vocabulary. Please
    check level, wording and every right answer before students see them.
  - >-
    Summary, conditional: the source gives the structure as "infinitivo + ía" only.
    It now lists all endings (-ía, -ías, -ía, -íamos, -ían) and the irregular stems
    used in the cycle (podr-, har-, querr-, dir-, tendr-, habr-), with a new table
    (usar, poder, hacer). A table of the imperfecto de subjuntivo (usar, vivir, ser)
    and the rule for forming it (3rd person plural of the indefinido minus -ron + -ra)
    were added, since the cycle uses viviera, fuera, usara, hubiera, cambiáramos.
    "Le propongo que… / Es importante que…" now say that the verb after them goes in
    the present subjunctive. Please confirm.
  - >-
    Activity 3: the frame "Cuidaría mi hogar ___ (usando presente continuo)" was wrong:
    "barriendo, reciclando, plantando" are gerunds, not the present continuous. Now
    "(con un gerundio: barriendo, reciclando…)". The bold/asterisk formatting debris
    around this activity was removed.
  - >-
    Corrections: "¿Vivirías…" (capital after the comma) → "¿vivirías…"; "proteger mejor
    al medio ambiente" → "proteger mejor el medio ambiente"; "convencer a la gente a
    que recicle" / "a reciclar" (warm-up 5 and Mori) → "convencer a la gente de que
    recicle"; "platos descartables" → "platos desechables" (descartable is regional,
    Río de la Plata); "Estructura de respuesta: Yo podría (condicional+verbo en
    infinitivo AR ER IR)" → "Yo podría + infinitivo"; Activity 2 "Si sí, ¿cuál?" →
    "Si lo tiene, ¿cuál es?"; "pase directamente" → "pasa directamente". Stray
    characters "ð" and "ð¹" before steps were removed.
  - >-
    The plan says skill 1 is practised with the questions and Activity 1 "o 3" (read
    as Activity 3); skill 2 with Activity 2 or 4. Activity 5 ("Si yo fuera
    presidente") is not in the plan; it is kept as an extra activity for skill 1.
    The "Nivel: 3 (extremo)" line was not copied.
  - >-
    Times recorded as the upper value of each range: Activity 1 (2 + 5 + 7 = 14
    min), Activity 4 (3 + 15 + 10 + 7 = 35 min), Activity 5 (5 + 10 + 12 + 5 = 32
    min). Activity 2 has 30 minutes of group work plus 3–10 minutes of presentation
    per group, so no total is given. Activity 4's "Variante digital" mentions email
    templates and online letter simulators with no link; kept as a teacher note.
  - >-
    Vocabulary: "Cuidar, לטפל" → "לשמור על / לטפל ב"; "Tierra, אדמה" → "אדמה / כדור
    הארץ"; "Deberíamos, היינו צריכים" → "היינו צריכים / כדאי לנו"; "Árboles" and
    "Hábitos" kept in the plural as in the source. Please confirm. The "Vocabulario
    clave" list in the summary repeats the Quizlet words, so it is kept only as a
    short line.
  - >-
    The "Respuesta de alumno 1/2/3" lines are replaced by the answer boxes. Warm-up
    sentence frames were added (the source has only the frame for question 3). The
    Quizlet link is kept as in the source.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: sustentabilidad-clase
    title: 'Clase: Sustentabilidad'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Sustentabilidad
      - id: skills
        type: cycleOverview
        skills:
          - name: Oraciones hipotéticas
            description: 'Condicional y *si* + imperfecto de subjuntivo: *Si viviera en el campo, plantaría árboles. Podríamos reciclar más.*'
          - name: Escritura
            description: 'Una propuesta de campaña o una carta formal: *Estimado Sr. Alcalde: Le propongo que…*'
      - id: quizlet
        type: externalLink
        label: Sustentabilidad en Quizlet
        url: https://quizlet.com/il/859133355/extreme-spanish-sustainability-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        frame: Soy ___. Podría ___ para proteger el medio ambiente.
        example: Soy Ana. Podría usar menos platos desechables para proteger el medio ambiente.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup
        type: discussionQuestions
        items:
          - question: En tu mundo ideal, ¿vivirías en el campo o en la ciudad?
            frame: En mi mundo ideal, viviría en ___ porque ___.
          - question: ¿Cómo podríamos proteger mejor el medio ambiente? Da un ejemplo.
            frame: Podríamos ___. Por ejemplo, ___.
          - question: ¿Hay algo que tú podrías hacer al respecto?
            frame: Yo podría ___.
          - question: ¿Qué le dirías a alguien que piensa que no hay que salvar el medio ambiente?
            frame: Le diría que ___.
          - question: ¿Qué harías para convencer a la gente de que recicle más?
            frame: Yo haría ___.
          - question: ¿Qué haría el gobierno si escuchara tus ideas?
            frame: Si el gobierno escuchara mis ideas, ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Deberíamos ser mejores…'
        skills: [Oraciones hipotéticas]
        minutes: 14
        steps:
          - 'Solo: escribe **3 acciones** que deberíamos hacer para mejorar el medio ambiente.'
          - 'En grupos de 3 o 4: compartan sus ideas y elijan **las 3 más importantes o creativas**. Escríbanlas así: *Para mejorar el planeta, deberíamos + infinitivo…*'
          - 'Cada grupo presenta sus tres propuestas. El resto de la clase hace una pregunta con *¿Qué pasaría si…?*'
          - 'Variante competitiva: la clase vota la propuesta más realista, la más creativa y la más urgente.'
        example: |-
          *Para mejorar el planeta, deberíamos usar el transporte público más seguido.*
          *Para mejorar el planeta, deberíamos reducir el consumo de carne.*
          *¿Qué pasaría si toda la ciudad usara el transporte público?*
      - id: act1-sentences
        type: discussionQuestions
        title: Mis 3 acciones
        items:
          - question: Para mejorar el planeta, deberíamos ___.
          - question: Para mejorar el planeta, deberíamos ___.
          - question: Para mejorar el planeta, deberíamos ___.
      - id: act2
        type: classActivity
        title: 'Actividad 2: Campaña «Salvar el planeta»'
        skills: [Escritura]
        steps:
          - 'En grupos, escriban una **propuesta escrita** para una campaña llamada *Salvar el planeta*. Tienen **30 minutos**. Pueden dividirse las tareas, pero **todos** participan.'
          - 'La propuesta responde a las 7 preguntas de abajo. Al final, tienen un **documento escrito completo**.'
          - 'Cada grupo presenta su propuesta a la clase (entre 3 y 10 minutos). Todos hablan: cada estudiante presenta una parte diferente, o presentan juntos.'
          - Al final, voten por la mejor campaña. Gana la propuesta con más votos.
      - id: act2-proposal
        type: discussionQuestions
        title: Nuestra propuesta
        items:
          - question: ¿Cuál es el **objetivo** de la campaña?
            frame: El objetivo de la campaña es ___.
          - question: ¿Quién es el **público objetivo**?
            frame: Nuestro público objetivo es ___.
          - question: ¿Cuál es el **tema** de la campaña y su **estrategia**?
            frame: El tema es ___ y la estrategia es ___.
          - question: ¿Tiene un **eslogan**? Si lo tiene, ¿cuál es? Si no, ¿cómo funcionará sin él?
            frame: Nuestro eslogan es «___».
          - question: ¿Dónde se **anunciaría** la campaña?
            frame: La campaña se anunciaría en ___.
          - question: ¿Qué la hace **efectiva**?
            frame: Es efectiva porque ___.
          - question: ¿Cuáles son los **indicadores clave de rendimiento (KPI)** para medir el éxito?
            frame: Mediríamos el éxito con ___.
      - id: act3
        type: classActivity
        title: 'Actividad 3: Vivir en la naturaleza'
        skills: [Oraciones hipotéticas]
        steps:
          - 'Responde a la pregunta del profesor: *Si vivieras en la naturaleza, ¿dónde vivirías?*'
          - 'Elige un lugar hermoso en un país hispanohablante. Busca información e imágenes **en español** (5 minutos).'
          - Muestra la imagen del lugar y descríbelo con las dos frases de abajo.
        example: |-
          *Si viviera en la naturaleza, viviría en la selva de Costa Rica porque me gusta la biodiversidad.*
          *Cuidaría mi hogar barriendo las hojas todos los días.*
          *Cuidaría mi hogar reciclando y plantando árboles nuevos.*
      - id: act3-sentences
        type: discussionQuestions
        title: Mi lugar en la naturaleza
        items:
          - question: Si viviera en la naturaleza, viviría en ___ porque ___.
          - question: Cuidaría mi hogar ___ (con un gerundio, por ejemplo *reciclando*).
      - id: act4
        type: classActivity
        title: 'Actividad 4: Una carta por una causa'
        skills: [Escritura]
        minutes: 35
        steps:
          - Escribe una **carta formal** a un funcionario público, político o líder comunitario (tu favorito). Propón una acción para proteger el medio ambiente.
          - 'Escribe la carta en español (en papel o en digital). Incluye las 5 partes de abajo.'
          - 'Entrega tu carta a un compañero. Él la responde **como si fuera el funcionario**, con expresiones de cortesía y una solución o un comentario.'
          - Algunas parejas leen su carta y su respuesta a la clase.
        example: |-
          *Estimado Sr. Alcalde:*
          *Le escribo para pedirle que promueva más puntos de reciclaje en nuestra ciudad, porque actualmente hay muy pocos. Si hubiera más, los ciudadanos podrían reciclar más fácilmente y reducir la basura.*
          *Atentamente, …*
      - id: act4-letter
        type: discussionQuestions
        title: Mi carta
        items:
          - question: Saludo formal
            frame: 'Estimado/a ___:'
          - question: El problema ambiental
            frame: Le escribo porque en nuestra ciudad ___.
          - question: Una propuesta clara
            frame: Deberíamos ___. / Podríamos ___. / Le propongo que ___.
          - question: Un argumento persuasivo
            frame: '___ porque ___. / ___, ya que ___.'
          - question: Despedida formal
            frame: Atentamente, ___.
      - id: act5
        type: classActivity
        title: 'Actividad 5: Debate verde, «Si yo fuera presidente…»'
        skills: [Oraciones hipotéticas]
        minutes: 32
        steps:
          - 'Solo: completa las 3 frases de abajo.'
          - 'En grupos de 3 o 4: compartan sus ideas y elijan **una medida ambiental prioritaria**. Preparen un mini-argumento: ¿Qué problema ambiental resuelve? ¿Qué pasaría si se aplicara? ¿Qué pasaría si no se aplicara?'
          - 'Cada grupo presenta su propuesta con frases condicionales. Los otros grupos hacen **preguntas desafiantes**: *¿Qué pasaría si la gente no cumpliera la norma? ¿Cómo convencerías a los ciudadanos?*'
          - La clase vota la medida más efectiva, la más realista y la más creativa.
      - id: act5-sentences
        type: discussionQuestions
        title: Si yo fuera presidente…
        items:
          - question: Si yo fuera presidente, podría ___.
          - question: Si yo fuera presidente, haría ___.
          - question: Si yo fuera presidente, prohibiría ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dos habilidades en este ciclo: **Oraciones hipotéticas** (condicional y verbos
          modales), con las preguntas de calentamiento y la Actividad 1 o 3; y
          **Escritura**, con la Actividad 2 o 4. La Actividad 5 es una opción extra para
          las oraciones hipotéticas.
      - id: n-intro
        anchor: intro
        text: >-
          Muy, muy corto: 2 oraciones por estudiante, no más de 30 segundos por persona y
          no más de 5 minutos en total. Si ya se conocen, pasa directamente a las
          preguntas. Da tu propio ejemplo primero.
      - id: n-warmup
        anchor: warmup
        text: >-
          Haz al menos dos preguntas a cada estudiante. Para la pregunta 3, escribe en la
          pizarra la estructura *Yo podría + infinitivo (-ar, -er, -ir)*.
      - id: n-act1
        anchor: act1
        minutes: 14
        text: >-
          Lluvia de ideas individual: 2 minutos. Puesta en común en grupos: 5 minutos.
          Debate corto: 7 minutos. Practican *deberíamos + infinitivo* y el condicional
          con *¿Qué pasaría si…?*
      - id: n-act2
        anchor: act2
        text: >-
          Explica que deben escribir una propuesta escrita para la campaña. Trabajo en
          grupos: 30 minutos. Presentación: de 3 a 10 minutos por grupo. Si no hay grupos,
          un estudiante puede trabajar solo o con el profesor.
      - id: n-act3
        anchor: act3
        text: >-
          Haz la pregunta inicial: *Si vivieras en la naturaleza, ¿dónde vivirías?* La
          búsqueda dura 5 minutos y se hace en español.
      - id: n-act4
        anchor: act4
        minutes: 35
        text: >-
          Introducción del profesor: 3 minutos. Redacción: 15 minutos. Intercambio de
          cartas: 10 minutos. Compartir: 7 minutos. Variante digital: se pueden usar
          plantillas de correo electrónico o simuladores de carta formal en línea (el
          cuaderno no da ningún enlace).
      - id: n-act5
        anchor: act5
        minutes: 32
        text: >-
          Preparación individual: 5 minutos. Debate en grupos: 10 minutos. Debate en
          clase: 12 minutos. Votación: 5 minutos.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: sustentabilidad-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: rules-hipoteticas
        type: ruleSummary
        skill: Oraciones hipotéticas
        rules:
          - text: 'El **condicional simple** expresa hipótesis, deseos y propuestas. Se forma con el **infinitivo** + **-ía, -ías, -ía, -íamos, -ían**.'
            examples:
              [
                Yo usaría menos plástico.,
                ¿Qué harías para convencer a la gente?,
                El gobierno escucharía nuestras ideas.,
              ]
          - text: 'Algunos verbos cambian la raíz, pero tienen las mismas terminaciones.'
            examples:
              [
                'poder → podría',
                'hacer → haría',
                'querer → querría',
                'decir → diría',
                'tener → tendría',
                'haber → habría',
              ]
          - text: '**Oraciones hipotéticas:** *si* + **imperfecto de subjuntivo**, + **condicional**. Después de *si* nunca va el condicional.'
            examples:
              - Si viviera en la naturaleza, cuidaría el agua.
              - Si yo fuera presidente, prohibiría los plásticos.
              - ¿Qué pasaría si toda la ciudad usara el transporte público?
          - text: 'El **imperfecto de subjuntivo** se forma con la 3.ª persona plural del pretérito indefinido: quita **-ron** y agrega **-ra, -ras, -ra, -ramos, -ran**.'
            examples:
              [
                'usaron → usara',
                'vivieron → viviera',
                'fueron → fuera',
                'hicieron → hiciera',
                'cambiaron → cambiara (nosotros: cambiáramos)',
              ]
          - text: 'Verbos modales en condicional: **podría** (posibilidad), **debería** (recomendación, obligación moral), **querría** (deseo). Después va el infinitivo.'
            examples:
              [
                Yo podría reciclar más en casa.,
                Deberíamos usar menos autos.,
                Querría vivir en el campo para respirar aire limpio.,
              ]
      - id: condicional-table
        type: table
        caption: Condicional simple
        header: [Persona, usar, poder, hacer]
        rows:
          - [yo, usaría, podría, haría]
          - [tú, usarías, podrías, harías]
          - [él / ella / usted, usaría, podría, haría]
          - [nosotros / nosotras, usaríamos, podríamos, haríamos]
          - [ellos / ellas / ustedes, usarían, podrían, harían]
      - id: subjuntivo-table
        type: table
        caption: Imperfecto de subjuntivo
        header: [Persona, usar, vivir, ser]
        rows:
          - [yo, usara, viviera, fuera]
          - [tú, usaras, vivieras, fueras]
          - [él / ella / usted, usara, viviera, fuera]
          - [nosotros / nosotras, usáramos, viviéramos, fuéramos]
          - [ellos / ellas / ustedes, usaran, vivieran, fueran]
      - id: rules-escritura
        type: ruleSummary
        skill: Escritura
        rules:
          - text: '**Para dar soluciones:** *deberíamos / podríamos / yo podría* + infinitivo.'
            examples:
              - Para mejorar el planeta, deberíamos plantar más árboles.
              - Podríamos usar bicicletas en vez de autos.
          - text: '**Para persuadir en una carta o campaña:** *Le propongo que…* y *Es importante que…* van con el verbo en **presente de subjuntivo**. *Deberíamos considerar…* va con un sustantivo o un infinitivo.'
            examples:
              [
                Le propongo que promueva más puntos de reciclaje.,
                Es importante que los ciudadanos reciclen.,
                Deberíamos considerar el transporte público.,
              ]
          - text: '**Para debatir o argumentar:** *¿Qué pasaría si…?*, *Si no hiciéramos nada, …*, *Si cambiáramos nuestros hábitos, …*'
            examples:
              - Si no hiciéramos nada, la contaminación aumentaría.
              - Si cambiáramos nuestros hábitos, el aire estaría más limpio.
          - text: '**Carta formal:** saludo (*Estimado/a…:*), problema, propuesta, argumento (*porque / ya que*) y despedida (*Atentamente*). Usamos **usted**: *Le escribo…*'
            examples: ['Estimado Sr. Alcalde: Le escribo para pedirle… Atentamente, Ana.']
      - id: recap
        type: callout
        tone: info
        title: Resumen práctico
        text: |-
          Usa el **condicional** para hablar de posibilidades y propuestas.
          Usa **si + imperfecto de subjuntivo** para las hipótesis.
          Refuerza con los **modales** *podría, debería, querría*.
          Usa el vocabulario de la sustentabilidad (*medio ambiente, reciclaje, recursos, reducir, reutilizar, proteger…*) en campañas, cartas y debates.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos habilidades con el grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: sustentabilidad-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia un mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Paso 1: Introducción y preguntas'
        intro: 'Mori te pregunta tu nombre y una cosa que *podrías* hacer para proteger el medio ambiente. Ejemplo: *Soy Ana. Podría usar menos bolsas de plástico.*'
        message: >-
          ¡Hola Mori! Quiero practicar el condicional sobre la sustentabilidad. Primero
          pregúntame mi nombre y una cosa que podría hacer para proteger el medio
          ambiente. Después hazme estas preguntas, una por una: En tu mundo ideal,
          ¿vivirías en el campo o en la ciudad? ¿Por qué? ¿Cómo podríamos proteger mejor
          el medio ambiente? ¿Qué harías para convencer a la gente de que recicle más?
          ¿Qué haría el gobierno si escuchara tus ideas? Por favor, corrige mis errores.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Paso 2: Deberíamos ser mejores…'
        intro: 'Escribe tres frases. Ejemplo: *Para mejorar el planeta, deberíamos plantar más árboles. Para mejorar el planeta, deberíamos usar bicicletas en vez de autos.*'
        message: >-
          ¡Hola Mori! Te voy a escribir tres frases con la estructura «Para mejorar el
          planeta, deberíamos + infinitivo». Corrige mis frases y pregúntame qué pasaría
          si todos lo hiciéramos.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Paso 3: Carta por una causa'
        intro: 'Escribe un mini-correo a un político o alcalde con saludo (*Estimado/a…*), problema ambiental, propuesta (*Deberíamos / Podríamos / Le propongo que…*), argumento (*porque / ya que…*) y despedida (*Atentamente…*). Ejemplo: *Estimado Sr. Alcalde: Le escribo para pedir más puntos de reciclaje en la ciudad, porque actualmente hay muy pocos. Si hubiera más, la gente podría reciclar fácilmente. Atentamente, Ana.*'
        message: >-
          ¡Hola Mori! Te voy a escribir una carta formal a un político sobre un problema
          ambiental. Corrige mis errores y después contéstame como si fueras el político.
      - id: mori-4
        type: aiTutorPrompt
        title: 'Paso 4: Debate verde'
        intro: 'Completa tres frases: *Si yo fuera presidente, podría… / haría… / prohibiría…*'
        message: >-
          ¡Hola Mori! Te voy a escribir tres frases: «Si yo fuera presidente, podría…»,
          «Si yo fuera presidente, haría…» y «Si yo fuera presidente, prohibiría…».
          Corrige mis frases y después hazme preguntas de seguimiento, por ejemplo: ¿Qué
          pasaría si la gente no cumpliera la norma? ¿Cómo convencerías a los ciudadanos?
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: sustentabilidad-practica
    book: workbook
    title: 'Práctica: Sustentabilidad'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practica las dos habilidades del ciclo. Cada respuesta se corrige al momento, y puedes intentarlo otra vez.
      - id: ex-hipoteticas
        type: activity
        activity: sustentabilidad-hipoteticas
      - id: ex-escritura
        type: activity
        activity: sustentabilidad-escritura

