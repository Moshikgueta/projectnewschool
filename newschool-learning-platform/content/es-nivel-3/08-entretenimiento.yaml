vocabulary:
  - slug: entretenimiento
    title: Entretenimiento
    items: *entretenimiento-words

activities:
  - slug: entretenimiento-perfecto
    title: 'Pretérito perfecto: he visto, ha colaborado'
    minutes: 8
    items:
      - id: he-visto
        type: multipleChoice
        prompt: Yo ___ *La Casa de Papel* tres veces.
        options:
          - { text: he visto, correct: true }
          - { text: he veído, feedback: 'El participio de *ver* es irregular: *visto*.' }
          - {
              text: ha visto,
              feedback: '*Ha* es para él / ella. Para *yo* usamos *he*: *he visto*.',
            }
      - id: participios
        type: matching
        prompt: Une cada verbo con su participio irregular.
        pairs:
          - [hacer, hecho]
          - [escribir, escrito]
          - [decir, dicho]
          - [poner, puesto]
          - [volver, vuelto]
      - id: ha-colaborado
        type: fillBlank
        prompt: Completa con el verbo *colaborar* en pretérito perfecto.
        text: Shakira ___ con muchos artistas internacionales.
        blanks: [[ha colaborado]]
      - id: han-crecido
        type: fillBlank
        prompt: Completa con el verbo *crecer* en pretérito perfecto.
        text: Las plataformas digitales ___ muchísimo en la última década.
        blanks: [[han crecido]]
      - id: este-mes
        type: multipleChoice
        prompt: ___ he visto una serie increíble.
        options:
          - { text: Este mes, correct: true }
          - {
              text: El año pasado,
              feedback: '*El año pasado* es un tiempo terminado: va con el indefinido (*El año pasado vi…*). Con el perfecto usamos *este mes, este año, últimamente*.',
            }
          - {
              text: Ayer,
              feedback: '*Ayer* es un tiempo terminado: va con el indefinido (*Ayer vi…*). Con el perfecto usamos *este mes, este año, últimamente*.',
            }
      - id: haber
        type: trueFalse
        prompt: 'El pretérito perfecto se forma con el verbo *tener* + participio: *tengo visto*.'
        answer: false
        feedback:
          correct: '¡Correcto! Se forma con *haber* + participio: *he visto, has escuchado, ha colaborado*.'
          incorrect: 'En español usamos *haber* (no *tener*) + participio: *he visto, has escuchado, ha colaborado*.'
      - id: has-recibido
        type: fillBlank
        prompt: Completa la pregunta con el verbo *recibir* (tú) en pretérito perfecto.
        text: ¿Qué premios ___ en los últimos años?
        blanks: [[has recibido, tú has recibido]]
      - id: ordena-cine
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Mucha gente ha dejado de ir al cine.

  - slug: entretenimiento-opiniones
    title: 'Opiniones con argumentos: creo que…, porque…'
    minutes: 8
    items:
      - id: porque
        type: multipleChoice
        prompt: Creo que es una serie innovadora ___ mezcla géneros.
        options:
          - { text: porque, correct: true }
          - {
              text: sin embargo,
              feedback: '*Sin embargo* expresa oposición. Para dar la causa usamos *porque*.',
            }
          - {
              text: por eso,
              feedback: '*Por eso* introduce una consecuencia. Para dar la causa usamos *porque*.',
            }
      - id: conectores
        type: matching
        prompt: Une cada conector con su función.
        pairs:
          - [porque, causa]
          - [por eso, consecuencia]
          - [aunque, contraste]
          - [además, añadir una idea]
      - id: desacuerdo
        type: multipleChoice
        prompt: ¿Qué frase expresa desacuerdo de forma diplomática?
        options:
          - { text: 'No estoy completamente de acuerdo, porque…', correct: true }
          - {
              text: Estoy de acuerdo contigo porque…,
              feedback: 'Esta frase expresa acuerdo, no desacuerdo.',
            }
          - { text: Es verdad que…, feedback: '*Es verdad que…* expresa acuerdo.' }
      - id: desde
        type: fillBlank
        prompt: Completa la frase para introducir una opinión.
        text: ___ mi punto de vista, es una película inolvidable.
        blanks: [[Desde, desde]]
      - id: negativo
        type: multipleChoice
        prompt: ¿Qué adjetivo es negativo?
        options:
          - { text: predecible, correct: true }
          - {
              text: inspirador,
              feedback: '*Inspirador* es positivo: algo que te da ideas y ganas de hacer cosas.',
            }
          - { text: cautivador, feedback: '*Cautivador* es positivo: algo que te atrae mucho.' }
      - id: sin-embargo
        type: trueFalse
        prompt: '*Sin embargo* sirve para añadir una idea más, como *además*.'
        answer: false
        feedback:
          correct: '¡Correcto! *Sin embargo* expresa oposición: *Es popular; sin embargo, es superficial.*'
          incorrect: '*Sin embargo* expresa oposición fuerte (*Es popular; sin embargo, es superficial*). Para añadir una idea usamos *además*.'
      - id: por-eso
        type: fillBlank
        prompt: Completa con un conector de consecuencia.
        text: He visto la serie dos veces y me ha encantado. ___, la he recomendado muchas veces.
        blanks: [[Por eso, por eso, Por esa razón, por esa razón, Por lo tanto, por lo tanto]]
      - id: ordena-opinion
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: En mi opinión, este programa es muy superficial.
