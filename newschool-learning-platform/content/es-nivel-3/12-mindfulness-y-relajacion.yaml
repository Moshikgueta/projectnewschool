# Cycle "Mindfulness y relajación", converted from the Spanish level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (Spanish).
course: es-nivel-3
slug: mindfulness-y-relajacion
title: Mindfulness y relajación
goal: Contar una historia con varios tiempos verbales y hablar de situaciones hipotéticas con si + imperfecto de subjuntivo.
position: 12
status: in_review

review:
  - >-
    The two workbook exercises ("Narración en varios tiempos" and "Situaciones
    hipotéticas") are NEW: the notebook has no self-study exercises. They were written
    from the cycle's summary rules, the activity examples and its vocabulary. Please
    check level, wording and every right answer before students see them.
  - >-
    Skill 2 was called "segundo condicional" (English grammar term). It is now
    "Situaciones hipotéticas (si + imperfecto de subjuntivo + condicional)". A table of
    the imperfect subjunctive and conditional forms used in the cycle was ADDED, and a
    rule that after "si" Spanish never uses the conditional (*si tendría).
  - >-
    Summary, tenses table: the "Futuro" row gave "Mañana quiero desconectarme en la
    montaña", which is the present of querer + infinitive. The rule now says that
    plans and intentions can be expressed with ir a + infinitivo, querer + infinitivo
    or the futuro simple (iré, tendré), with an example of each. "Presente: estados y
    acciones actuales" is kept. "Conectores temporales: ayer, hoy, mañana, en el
    futuro, si…" → "Marcadores de tiempo" (ayer, hoy, mañana… are time markers; "si"
    was removed from that list).
  - >-
    Corrections: "Actividad 2: Adivina donde deseo relajarme" → "Adivina dónde deseo
    relajarme"; Activity 4 had a stray Hebrew letter "ן" before "Si tuvieras un
    taller"; "Discuta lo que fue convincente" → "Comenten qué fue convincente";
    Activity 5 "Si tuvieras más tiempo libre, cómo lo usarías…?" → "¿cómo lo
    usarías…?"; Activity 1 model "sentí serenidad en mis músculos" → "sentí mucha
    serenidad y relajé todos los músculos"; garbled emoji characters ("ð") and "✔️"
    were removed from the summary.
  - >-
    The homework has no Mori messages in the source: it is a list of five tasks (two
    sentences about yourself, practice questions, mini diary, guessing game, reflection
    questions). Each task is turned into a message to Mori. The reflection questions in
    the homework repeat warm-up questions; they are kept in both places on purpose
    (class: spoken, homework: written).
  - >-
    The warm-up questions are grouped as in the source: basic, "Preguntas de reflexión
    (intermedio)" and "Preguntas hipotéticas (condicionales B1–B2)". Sentence frames were
    added (the source has none). The summary's "Reflexión final" questions are the same
    as Activity 1, step 6; they are kept once, in the summary.
  - >-
    Vocabulary glosses changed: "Meditar, למדוט" → "לעשות מדיטציה / למדוט"; "Mente, מחשבה
    / תודעה" → "שכל / תודעה"; "Bienestar, רווחה" → "רווחה / הרגשה טובה"; "Olfato, ריח" →
    "חוש הריח"; "Gusto, טעם" → "חוש הטעם / טעם"; "Retiro, ריטריט / פרישה" → "ריטריט"
    (פרישה = retirement from work, a different meaning); "Sueño, שינה" → "שינה / חלום";
    "Condicional, תנאי" → "(זמן) תנאי". Please confirm.
  - >-
    Times given as ranges are recorded as the upper value; the step times of
    Activities 1 and 5 add up to about 27 minutes each and are in the teacher notes.
    Activity 1 needs four contrasting images chosen by the teacher (not in the
    notebook). The "Respuesta de alumno 1/2/3" lines are replaced by the answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: mindfulness-y-relajacion-clase
    title: 'Clase: Mindfulness y relajación'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Mindfulness y relajación
      - id: skills
        type: cycleOverview
        skills:
          - name: Narración en varios tiempos
            description: 'Pasado, presente, futuro y condicional: *Ayer tuve ansiedad. Hoy me concentro en respirar. Mañana voy a caminar. Si pudiera, meditaría.*'
          - name: Situaciones hipotéticas
            description: '*Si* + imperfecto de subjuntivo + condicional: *Si pudiera vivir en la playa, estaría más tranquilo.*'
      - id: quizlet
        type: externalLink
        label: Mindfulness y relajación en Quizlet
        url: https://quizlet.com/il/860753650/extreme-spanish-mindfulness-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Ronda de introducción
      - id: intro
        type: sentenceFrame
        prompt: Di una frase en presente y una en condicional.
        frame: Soy ___. Si pudiera estar ahora en un lugar relajante, estaría en ___.
        example: Soy Ana. Si pudiera estar ahora en un lugar relajante, estaría en la playa.
      - id: warmup-title
        type: heading
        level: 3
        text: Preguntas de calentamiento
      - id: warmup-basic
        type: discussionQuestions
        items:
          - question: ¿Qué haces normalmente cuando necesitas relajarte?
            frame: Cuando necesito relajarme, normalmente ___.
          - question: '¿Qué lugar te transmite más calma: la ciudad o la naturaleza? ¿Por qué?'
            frame: ___ me transmite más calma porque ___.
          - question: ¿Prefieres relajarte solo o acompañado? ¿Qué ventajas tiene cada opción?
            frame: Prefiero relajarme ___ porque ___.
      - id: warmup-reflection-title
        type: heading
        level: 4
        text: Preguntas de reflexión (intermedio)
      - id: warmup-reflection
        type: discussionQuestions
        items:
          - question: ¿Qué papel juegan las redes sociales en tu nivel de estrés? ¿Crees que ayudan o empeoran?
            frame: Creo que las redes sociales ___ porque ___.
          - question: ¿Qué opinas del mindfulness como práctica? ¿Es solo una moda o realmente puede cambiar la vida de una persona?
            frame: En mi opinión, el mindfulness ___.
          - question: ¿Qué importancia tienen los hábitos (sueño, comida, ejercicio) en tu bienestar emocional?
            frame: Para mi bienestar, ___ es muy importante porque ___.
      - id: warmup-hypothetical-title
        type: heading
        level: 4
        text: Preguntas hipotéticas
      - id: warmup-hypothetical
        type: discussionQuestions
        items:
          - question: Si tuvieras que recomendar una práctica de relajación a un amigo muy estresado, ¿qué le dirías y por qué?
            frame: Le diría que ___ porque ___.
          - question: Si las empresas ofrecieran talleres de mindfulness en el trabajo, ¿qué efectos positivos o negativos podrían tener?
            frame: Si las empresas ofrecieran talleres, los trabajadores ___.
          - question: Si pudieras inventar una máquina que redujera el estrés, ¿cómo funcionaría y quién la usaría?
            frame: Mi máquina ___ y la usarían ___.
          - question: ¿Qué harías si tuvieras un mes libre, sin trabajo ni obligaciones, para dedicarlo a tu bienestar?
            frame: Si tuviera un mes libre, ___.
      - id: activities-title
        type: heading
        level: 3
        text: Actividades
      - id: act1
        type: classActivity
        title: 'Actividad 1: Historias sensoriales en cuatro tiempos'
        skills: [Narración en varios tiempos, Situaciones hipotéticas]
        minutes: 27
        steps:
          - 'Mira las 4 imágenes que muestra tu profesor. ¿Cuál transmite más calma? ¿Cuál más energía? (respuesta rápida, una palabra)'
          - Escucha el modelo de tu profesor con los cuatro tiempos.
          - 'Elige una imagen y escribe 4 frases, una en cada tiempo: pasado, presente, futuro y condicional. Usa al menos 2 palabras del vocabulario (serenidad, energía, meditar, respirar, bosque…).'
          - 'En parejas: A comparte su narración. B hace una pregunta de seguimiento en condicional. Después cambian.'
          - Cada pareja elige su frase favorita (la más creativa o emotiva) y la comparte con la clase.
          - '¿Qué tiempo verbal fue más fácil de usar? ¿Cuál más difícil? ¿Qué vocabulario nuevo apareció en las frases de tus compañeros?'
        example: |-
          **Pasado:** *El verano pasado estuve en una playa y sentí mucha serenidad y relajé todos los músculos.*
          **Presente:** *Hoy, cuando pienso en ese lugar, me concentro en mi respiración y siento calma.*
          **Futuro:** *Mañana quiero volver a la playa para desconectarme del estrés.*
          **Condicional:** *Si pudiera vivir allí, liberaría toda la tensión cada día.*
          **Pregunta de seguimiento:** *¿Qué pasaría si fueras allí con un amigo?*
      - id: act1-sentences
        type: discussionQuestions
        title: Mi historia en cuatro tiempos
        items:
          - question: '**Pasado:** ___'
            frame: El verano pasado estuve en ___ y sentí ___.
          - question: '**Presente:** ___'
            frame: Hoy, cuando pienso en ese lugar, ___.
          - question: '**Futuro:** ___'
            frame: Mañana voy a / quiero ___.
          - question: '**Condicional:** ___'
            frame: Si pudiera ___, ___.
      - id: act1-board
        type: table
        caption: Frases favoritas de la clase (ejemplo)
        header: [Pasado, Presente, Futuro, Condicional]
        rows:
          - [
              El verano pasado estuve en la montaña y sentí energía.,
              Ahora me concentro en respirar profundamente.,
              Mañana quiero ir al bosque para liberar tensión.,
              'Si pudiera, meditaría en la playa todos los días.',
            ]
      - id: act1-variants
        type: callout
        tone: info
        title: Variantes
        text: |-
          **Competencia de creatividad:** voten cuál narración fue la más relajante, la más divertida o la más convincente.
          **Historias combinadas:** cada pareja mezcla sus frases para crear una mini historia completa (4 frases conectadas).
          **Cambio de enfoque sensorial:** repitan el ejercicio con un solo sentido (vista, oído, olfato, tacto o gusto).
      - id: act2
        type: classActivity
        title: 'Actividad 2: Adivina dónde deseo relajarme'
        skills: [Situaciones hipotéticas]
        steps:
          - Describe lo que experimentarías en tu lugar ideal de relajación con las frases de abajo. No digas el nombre del lugar.
          - Los demás estudiantes adivinan cuál es el lugar.
          - 'Gana la persona que logra que los demás adivinen su lugar.'
      - id: act2-template
        type: discussionQuestions
        title: Mi lugar ideal de relajación
        items:
          - question: Si estuviera allí, vería ___.
          - question: Si estuviera allí, escucharía ___.
          - question: Si estuviera allí, olería ___.
          - question: Si estuviera allí, comería ___.
          - question: Si estuviera allí, sentiría ___ en el cuerpo.
          - question: Si estuviera allí, me sentiría (emocionalmente) ___.
          - question: Si estuviera allí, estaría con ___ y le diría que ___.
      - id: act3
        type: classActivity
        title: 'Actividad 3: Diseña tu retiro de relajación'
        skills: [Situaciones hipotéticas]
        steps:
          - 'En grupos pequeños, creen un retiro ideal: lugar, actividades, público objetivo, precio y beneficios.'
          - Preséntenlo a la clase en 3 o 4 frases persuasivas con el condicional.
          - 'Votación: ¿qué retiro suena más atractivo?'
        example: '*Si vinieras a nuestro retiro, aprenderías a relajarte mejor.*'
      - id: act3-plan
        type: discussionQuestions
        title: Nuestro retiro
        items:
          - question: Lugar
          - question: Actividades
          - question: Público objetivo
          - question: Precio
          - question: Beneficios
          - question: 'Frase persuasiva: Si vinieras a nuestro retiro, ___.'
      - id: act4
        type: classActivity
        title: 'Actividad 4: Describe tu taller de mindfulness perfecto'
        skills: [Situaciones hipotéticas]
        minutes: 15
        steps:
          - Diseña un taller de mindfulness. Responde a las preguntas de abajo.
          - Prepara tu presentación (tienes 15 minutos para prepararte y presentar).
          - Presenta tu taller. Después, todos votan a qué taller asistirían.
          - Comenten qué fue convincente y qué no en cada presentación.
      - id: act4-questions
        type: discussionQuestions
        title: Mi taller de mindfulness
        items:
          - question: Si tuvieras un taller, ¿dónde se llevaría a cabo?
            frame: Mi taller se llevaría a cabo en ___.
          - question: Si tuvieras un taller, ¿quién sería el público objetivo?
            frame: El público objetivo sería ___.
          - question: ¿Cuánto costaría?
            frame: Costaría ___.
          - question: ¿Qué actividad sería parte del taller?
            frame: Una actividad del taller sería ___.
      - id: act5
        type: classActivity
        title: 'Actividad 5: Mini diario de mindfulness en cuatro tiempos'
        skills: [Narración en varios tiempos, Situaciones hipotéticas]
        minutes: 27
        steps:
          - 'Escucha el modelo de tu profesor con cuatro encabezados: *Ayer…* (pasado), *Hoy…* (presente), *Mañana…* (futuro), *Si pudiera…* (condicional).'
          - Escribe un mini diario de 8 a 10 frases, con al menos 2 frases en cada tiempo. Incluye una emoción, una acción, un ambiente y un detalle sensorial (vista, oído, olfato, tacto o gusto).
          - 'En grupos de 3, lee tu diario. Hagan una lista común de las emociones, los ambientes y las acciones que más se repiten. ¿Cuál fue la emoción dominante del grupo (ansiedad, calma, energía…)?'
          - El grupo escribe un diario colectivo de 4 frases (una en cada tiempo) y lo presenta a la clase.
          - Después de cada presentación, otro grupo hace una pregunta en condicional.
          - '¿Qué tiempo verbal usaste más? ¿Qué palabra del vocabulario se repitió más? ¿Qué fue lo más difícil: pasado, presente, futuro o condicional?'
        example: |-
          *Ayer tuve ansiedad antes de una reunión.*
          *Hoy me concentro en respirar para liberar tensión.*
          *Mañana quiero desconectarme en la montaña.*
          *Si pudiera meditar todos los días, tendría más serenidad.*
          **Diario colectivo:** *Ayer sentimos tensión antes del trabajo. Hoy intentamos concentrarnos en la respiración. Mañana queremos desconectarnos en la naturaleza. Si pudiéramos meditar más, viviríamos con más serenidad.*
          **Preguntas:** *¿Qué pasaría si no pudieras desconectarte en la naturaleza? Si tuvieras más tiempo libre, ¿cómo lo usarías para relajarte?*
      - id: act5-diary
        type: discussionQuestions
        title: Mi mini diario
        items:
          - question: '**Ayer…**'
            frame: Ayer sentí tensión en los músculos y escuché ___.
          - question: '**Hoy…**'
            frame: Hoy respiro profundamente y noto ___.
          - question: '**Mañana…**'
            frame: Mañana voy a ___.
          - question: '**Si pudiera…**'
            frame: Si pudiera ___, ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Habilidades del ciclo: **Narración en varios tiempos** (Actividades 1 y 5) y
          **Situaciones hipotéticas** con *si* + imperfecto de subjuntivo + condicional
          (Actividades 1 a 5 y preguntas hipotéticas). El cuaderno no indica qué
          actividades combinar; las Actividades 1 y 5 duran unos 27 minutos cada una.
      - id: n-intro
        anchor: intro
        text: Da tu propio ejemplo primero. Cada estudiante dice una frase en presente y una en condicional.
      - id: n-warmup
        anchor: warmup-title
        text: >-
          Haz al menos dos preguntas a cada estudiante. Elige las preguntas de reflexión
          o las hipotéticas según el nivel del grupo.
      - id: n-act1
        anchor: act1
        minutes: 27
        text: >-
          Antes de la clase, elige 4 imágenes contrastantes (por ejemplo: bosque, playa,
          montaña, ciudad tranquila). Imágenes: 3 minutos. Modelo guiado: 2 minutos (elige
          una imagen y da el ejemplo con los cuatro tiempos). Trabajo individual: 5
          minutos. Parejas: 7 minutos. Puesta en común: 7 minutos (escribe las frases
          favoritas en la pizarra en una tabla de cuatro columnas). Mini reflexión: 3
          minutos.
      - id: n-act4
        anchor: act4
        minutes: 15
        text: Explica que cada estudiante diseña un taller y debe incluir las cuatro respuestas. Pide que usen el condicional en toda la presentación.
      - id: n-act5
        anchor: act5
        minutes: 27
        text: >-
          Introducción: 3 minutos (escribe en la pizarra los cuatro encabezados y da el
          modelo oral). Escritura: 6 minutos. Grupos de 3: 7 minutos (circula y anota
          expresiones útiles para comentar después). Diario colectivo: 6 minutos.
          Preguntas de seguimiento: 3 minutos. Cierre y reflexión: 2 minutos.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: mindfulness-y-relajacion-resumen
    title: Resumen
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Lo que aprendimos hoy
      - id: tenses-table
        type: table
        caption: Tiempos verbales
        header: [Tiempo, Uso, Ejemplo]
        rows:
          - [Pasado, 'Experiencias, emociones pasadas', Ayer tuve ansiedad antes de una reunión.]
          - [Presente, Estados y acciones actuales, Hoy me concentro en respirar.]
          - [
              Futuro,
              Planes e intenciones,
              'Mañana voy a desconectarme en la montaña. / Mañana iré a la montaña.',
            ]
          - [
              Condicional,
              'Hipótesis, deseos, imaginación',
              'Si pudiera vivir en la playa, estaría más tranquilo.',
            ]
      - id: rules-narracion
        type: ruleSummary
        skill: Narración en varios tiempos
        rules:
          - text: 'Una buena narración combina tiempos: **pasado** (qué pasó), **presente** (qué hago ahora), **futuro** (qué voy a hacer) y **condicional** (qué haría).'
            examples:
              - Ayer tuve ansiedad antes de una reunión.
              - Hoy me concentro en respirar para liberar tensión.
              - Mañana voy a desconectarme en la montaña.
              - Si pudiera meditar todos los días, tendría más serenidad.
          - text: 'Para planes e intenciones usamos **ir a + infinitivo**, **querer + infinitivo** o el **futuro simple**.'
            examples:
              [
                Mañana voy a caminar en el bosque.,
                Mañana quiero desconectarme.,
                Mañana iré a la playa.,
              ]
          - text: 'Marcadores de tiempo:'
            examples:
              [
                'ayer, el verano pasado → pasado; hoy, ahora → presente; mañana, en el futuro → futuro',
              ]
      - id: rules-hipotesis
        type: ruleSummary
        skill: Situaciones hipotéticas
        rules:
          - text: 'Para hablar de situaciones imaginarias usamos: **si + imperfecto de subjuntivo + condicional**.'
            examples:
              - Si pudiera meditar todos los días, tendría más serenidad.
              - 'Si estuviera allí, vería el mar.'
              - 'Si vinieras a nuestro retiro, aprenderías a relajarte mejor.'
          - text: 'Después de **si** nunca usamos el condicional.'
            examples: ['Si tuviera tiempo, meditaría. (no: *Si tendría tiempo…*)']
          - text: 'Las dos partes pueden cambiar de orden. Si *si* va primero, ponemos coma.'
            examples: ['Si pudiera, viviría en la montaña. = Viviría en la montaña si pudiera.']
      - id: hipotesis-table
        type: table
        caption: Formas del ciclo (yo)
        header: [Infinitivo, Imperfecto de subjuntivo, Condicional]
        rows:
          - [poder, pudiera, podría]
          - [estar, estuviera, estaría]
          - [tener, tuviera, tendría]
          - [venir, viniera, vendría]
          - [ser / ir, fuera, sería / iría]
          - [ver, viera, vería]
          - [vivir, viviera, viviría]
      - id: rules-vocab
        type: ruleSummary
        skill: Vocabulario útil
        rules:
          - text: '**Emociones:** serenidad, calma, ansiedad, energía, tensión'
          - text: '**Sentidos:** ver, escuchar, oler, sentir, saborear'
          - text: '**Acciones:** respirar, meditar, descansar, desconectarse'
          - text: '**Ambientes:** bosque, playa, montaña, ciudad, naturaleza'
      - id: recap
        type: callout
        tone: info
        title: Actividades y gramática
        text: |-
          **Narración en 4 tiempos:** frases en pasado, presente, futuro y condicional.
          **Plantillas condicionales:** *Si estuviera allí, vería / escucharía / olería…*
          **Persuasión con condicional:** *Si vinieras a nuestro retiro, aprenderías a relajarte mejor.*
          **Mini diario:** 2 o más frases en cada tiempo, con un detalle sensorial.
      - id: reflection
        type: discussionQuestions
        title: Reflexión final
        items:
          - question: ¿Qué tiempo verbal fue más fácil?
          - question: ¿Cuál fue más difícil?
          - question: ¿Qué vocabulario nuevo apareció?
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Repasa las dos habilidades con el grupo y pide un ejemplo nuevo para cada regla.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: mindfulness-y-relajacion-tarea
    title: Tarea con Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Tarea con Mori
      - id: how
        type: text
        text: Abre el chat con Mori, copia un mensaje y envíalo. Mori te hará preguntas; responde a todas.
      - id: mori-1
        type: aiTutorPrompt
        title: '1. Ronda de introducción'
        intro: 'Escribe dos frases cortas sobre ti: una en presente (*Soy ___.*) y una en condicional (*Si pudiera estar ahora en un lugar relajante, estaría en ___.*).'
        message: Hola Mori, te voy a escribir dos frases sobre mí, una en presente y una en condicional. Corrige mis frases y hazme una pregunta más en condicional.
      - id: mori-2
        type: aiTutorPrompt
        title: '2. Preguntas de práctica'
        intro: 'Responde en 2 o 3 frases a cada pregunta: ¿Qué haces normalmente cuando necesitas relajarte? (presente) ¿Qué lugar te transmitió calma en el pasado? (pasado) ¿Qué harás mañana para sentir más tranquilidad? (futuro) Si tuvieras una semana libre, ¿qué harías para relajarte? (condicional)'
        message: >-
          Hola Mori, hazme estas 4 preguntas, una por una: ¿Qué haces normalmente cuando
          necesitas relajarte? ¿Qué lugar te transmitió calma en el pasado? ¿Qué harás
          mañana para sentir más tranquilidad? Si tuvieras una semana libre, ¿qué harías
          para relajarte? Voy a responder en 2 o 3 frases. Corrige mis tiempos verbales.
      - id: mori-3
        type: aiTutorPrompt
        title: '3. Mini diario de mindfulness en 4 tiempos'
        intro: 'Escribe 8 a 10 frases, al menos 2 en cada tiempo, con un detalle sensorial (ver, oír, oler, sentir, saborear). Modelo: *Ayer tuve ansiedad antes de dormir y escuché mucho ruido. Hoy respiro profundamente y siento calma en los músculos. Mañana voy a caminar en el bosque y oler los árboles. Si pudiera meditar todos los días, tendría más serenidad.*'
        message: Hola Mori, te voy a enviar mi mini diario de mindfulness en pasado, presente, futuro y condicional. Corrige mis errores, sobre todo los tiempos verbales, y hazme una pregunta sobre mi diario.
      - id: mori-4
        type: aiTutorPrompt
        title: '4. Juego: Adivina mi lugar de relajación'
        intro: 'Completa: *Si estuviera allí, vería… / escucharía… / olería… / sentiría… / me sentiría…*'
        message: Hola Mori, juguemos a «Adivina mi lugar de relajación». Te voy a describir mi lugar secreto con frases como «Si estuviera allí, vería…» y tú intentas adivinarlo. Corrige mis frases en condicional.
      - id: mori-5
        type: aiTutorPrompt
        title: '5. Preguntas de reflexión (nivel más alto)'
        message: >-
          Hola Mori, quiero practicar mis opiniones. Hazme estas preguntas, una por una:
          ¿Qué papel juegan las redes sociales en tu nivel de estrés? ¿Ayudan o empeoran?
          ¿Qué opinas del mindfulness como práctica? ¿Es una moda o realmente puede
          cambiar la vida? ¿Qué importancia tienen los hábitos (sueño, comida, ejercicio)
          en tu bienestar? Corrige mis errores.
      - id: tips
        type: callout
        tone: tip
        title: Consejos
        text: |-
          ¿Quieres más preguntas? Envía: **¡Por favor, pregúntame más!**
          ¿No entiendes una explicación? Envía: **¿Puedes explicármelo en hebreo pero con la oración en español?**

