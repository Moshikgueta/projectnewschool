activities:
  - slug: mindfulness-y-relajacion-tiempos
    title: 'Narración en varios tiempos: ayer, hoy, mañana'
    minutes: 8
    items:
      - id: tuve
        type: multipleChoice
        prompt: Ayer ___ ansiedad antes de una reunión.
        options:
          - { text: tuve, correct: true }
          - { text: tengo, feedback: '*Tengo* es presente. Con *ayer* usamos el pasado: *tuve*.' }
          - { text: tendré, feedback: '*Tendré* es futuro. Con *ayer* usamos el pasado: *tuve*.' }
      - id: me-concentro
        type: multipleChoice
        prompt: Hoy ___ en mi respiración.
        options:
          - { text: me concentro, correct: true }
          - {
              text: me concentré,
              feedback: '*Me concentré* es pasado. Con *hoy* y una acción de ahora usamos el presente: *me concentro*.',
            }
          - {
              text: me concentraría,
              feedback: '*Me concentraría* es condicional (algo imaginario). Para lo que hago ahora usamos el presente: *me concentro*.',
            }
      - id: voy
        type: fillBlank
        prompt: 'Completa con el verbo *ir* para hablar de un plan (yo).'
        text: Mañana ___ a caminar en el bosque.
        blanks: [[voy, iré, yo voy, yo iré]]
      - id: marcadores
        type: matching
        prompt: Une cada comienzo con su tiempo verbal.
        pairs:
          - [Ayer…, pasado]
          - [Hoy…, presente]
          - [Mañana…, futuro]
          - [Si pudiera…, condicional]
      - id: plan
        type: trueFalse
        prompt: '*Mañana quiero desconectarme en la montaña* habla de un plan o una intención para el futuro.'
        answer: true
        feedback:
          correct: '¡Correcto! *Querer* + infinitivo, *ir a* + infinitivo y el futuro (*iré*) sirven para hablar de planes.'
          incorrect: 'Con *mañana quiero…* hablamos de una intención para el futuro.'
      - id: estuve-senti
        type: fillBlank
        prompt: Completa con *estar* y *sentir* en pasado (yo).
        text: El verano pasado ___ en una playa y ___ mucha calma.
        blanks: [[estuve], [sentí]]
      - id: futuro
        type: multipleChoice
        prompt: ¿Qué frase habla del futuro?
        options:
          - { text: Mañana iré a la playa., correct: true }
          - {
              text: Ayer fui a la playa.,
              feedback: '*Fui* es pasado (*ayer*). Para el futuro decimos *iré* o *voy a ir*.',
            }
          - {
              text: 'Si pudiera, iría a la playa.',
              feedback: '*Iría* es condicional: una situación imaginaria, no un plan. El futuro es *iré*.',
            }
      - id: ordena-tension
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Ayer sentí tensión en los músculos.

  - slug: mindfulness-y-relajacion-hipotesis
    title: 'Situaciones hipotéticas: si pudiera…'
    minutes: 8
    items:
      - id: estaria
        type: multipleChoice
        prompt: Si pudiera vivir en la playa, ___ más tranquilo.
        options:
          - { text: estaría, correct: true }
          - {
              text: estaré,
              feedback: '*Estaré* es futuro. Con *si* + imperfecto de subjuntivo (*pudiera*) usamos el condicional: *estaría*.',
            }
          - {
              text: estoy,
              feedback: 'Es una situación imaginaria: después de *si pudiera…* usamos el condicional, *estaría*.',
            }
      - id: tuviera
        type: multipleChoice
        prompt: Si ___ más tiempo libre, meditaría todos los días.
        options:
          - { text: tuviera, correct: true }
          - {
              text: tendría,
              feedback: 'Después de *si* nunca usamos el condicional. Usamos el imperfecto de subjuntivo: *tuviera*.',
            }
          - {
              text: tengo,
              feedback: 'Con *meditaría* (condicional) la situación es imaginaria: *si tuviera*.',
            }
      - id: estuviera-veria
        type: fillBlank
        prompt: Completa con *estar* (imperfecto de subjuntivo) y *ver* (condicional).
        text: Si ___ allí, ___ el mar.
        blanks: [[estuviera, estuviese, yo estuviera], [vería]]
      - id: si-condicional
        type: trueFalse
        prompt: '*Si tendría tiempo, meditaría* es correcto.'
        answer: false
        feedback:
          correct: '¡Correcto! Después de *si* no usamos el condicional: *Si tuviera tiempo, meditaría.*'
          incorrect: 'Después de *si* usamos el imperfecto de subjuntivo, no el condicional: *Si tuviera tiempo, meditaría.*'
      - id: sentidos
        type: matching
        prompt: Une las dos partes de cada frase.
        pairs:
          - ['Si estuviera allí, vería', el mar azul.]
          - ['Si estuviera allí, escucharía', el canto de los pájaros.]
          - ['Si estuviera allí, olería', el aroma de las flores.]
          - ['Si estuviera allí, comería', fruta fresca.]
      - id: aprenderias
        type: fillBlank
        prompt: Completa con el verbo *aprender* en condicional (tú).
        text: Si vinieras a nuestro retiro, ___ a relajarte.
        blanks: [[aprenderías]]
      - id: harias
        type: multipleChoice
        prompt: ¿Qué ___ si tuvieras un mes libre?
        options:
          - { text: harías, correct: true }
          - {
              text: haces,
              feedback: '*Haces* es presente. Con *si tuvieras* (situación imaginaria) usamos el condicional: *harías*.',
            }
          - {
              text: hicieras,
              feedback: '*Hicieras* es imperfecto de subjuntivo; va después de *si*. En la otra parte usamos el condicional: *harías*.',
            }
      - id: ordena-meditaria
        type: reorderSentence
        prompt: Ordena las palabras.
        sentence: Si tuviera tiempo, meditaría más.
