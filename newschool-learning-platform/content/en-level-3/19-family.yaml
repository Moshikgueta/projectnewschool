# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-level-3
slug: family
title: Family
goal: Describe your family with strong adjectives and connect your ideas with connecting words.
position: 19
status: published

review:
  - >-
    The two workbook exercises ("Adjectives" and "Connecting words") are NEW: the notebook
    has no self-study exercises. They were written from the cycle's summary rules,
    examples and vocabulary. Please check level, wording and every right answer before
    students see them.
  - >-
    Summary, connectors table 2 was broken: the row "But / However – Next step – Then, my
    parents built their careers." and the row "After that – Contrast – My family is warm,
    but communication can be intense" had their cells mixed up. They are now one row:
    "But / However – Contrast – My family is warm, but communication can be intense." The
    sequence connectors stay in the first table and in the last row. A rule on the
    punctuation of "however" was added.
  - >-
    Summary, adjectives: "The situation sounds dramatic, however, it is manageable." (a
    comma splice) → "The situation sounds dramatic; however, it is manageable."; "Adjectives
    help us explain emotional states clearly" → "Adjectives help us describe people,
    places and feelings clearly and precisely" (the list that follows covers personality,
    atmosphere and generations, not only emotions). "Put the connectors between 2 ideas, or
    at the beginning, to make the sentence more formal" was reworded so that only the
    sentence-initial position is described as more formal.
  - >-
    The BBC Learning English podcast "6 Minute English – The bond between sisters"
    (bbc.co.uk, used in Activity 4 and in homework activity 2) is not on the link
    allow-list, so the link was removed. It is named in a teacher note; in the homework,
    students are told to use the podcast the teacher shared. The host needs approval, or
    the episode could be linked from YouTube if available there.
  - >-
    Activity 3: the steps jump from Step 3 to Step 5; renumbered. "57 year age gap" →
    "57-year age gap". The YouTube video link is kept.
  - >-
    Activity 2 has no activity type in the source (the "Activity:" line is empty). Activity
    5 (debate) gives only the topic and the two group positions, with no steps; short
    steps (brainstorm, debate, class discussion) were added following the debate in the
    previous cycle. Please confirm.
  - >-
    Small corrections: "to help the other nannies' problems" → "to help with the other
    nanny's problems"; "Class revision" → "Class review"; Activity 4 question "Do you
    march to your own drum in your family, or are you similar to them? Which stereotype
    fits your family…" was split into two questions; "Introduction Round:" → "Introduction
    round". The level note "3 (extreme)" and the empty Class / Topic / Students lines were
    left out.
  - >-
    The warm-up questions have model answers in the source; they are kept as the frame
    (model answer) under each question. The "Answer of student 1/2/3" lines are replaced
    by the answer boxes. The source gives no activity times, so no minutes were added.
    Teacher-only instructions (picking from the 8 warm-up questions, the Activity 2 tip,
    the Activity 4 comprehension check) moved to teacher notes.
  - >-
    Both Quizlet links are kept without their tracking parameters (?i=…&x=…). The
    vocabulary block keeps the Hebrew glosses; the English definitions from the source are
    kept in a table under it. Gloss changed: "To put someone on the spot" "להביך / לשים
    במצב לא נוח" → "להעמיד מישהו במצב לא נוח (לדרוש תשובה מיידית)".
  - >-
    The homework main message asks Mori for comparison structures (more … than, as … as,
    whereas), which belong to the previous cycle rather than to this cycle's two skills.
    It is kept as in the source.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: family-class
    title: 'Class: Family'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Family
      - id: skills
        type: cycleOverview
        skills:
          - name: Connecting words
            description: '*first, then, although, however, while, whereas, because, so, as a result*'
          - name: Adjectives
            description: Strong adjectives to describe people and families (*supportive, stubborn, resilient, open-minded*)
      - id: quizlet-translation
        type: externalLink
        label: Family on Quizlet (English + translation)
        url: https://quizlet.com/il/1148396000/family-english-translation-flash-cards/
      - id: quizlet-definition
        type: externalLink
        label: Family on Quizlet (English + definition)
        url: https://quizlet.com/il/1148395708/family-english-definition-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I am ___.
        example: I am Dana.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: Would you describe your family as more traditional or modern, and how does that affect important decisions?
            frame: '*I would describe my family as relatively traditional, especially when it comes to values and celebrations. However, they are open-minded when it comes to career choices and lifestyle decisions.*'
          - question: Who is a particularly influential person in your family, and why would you describe them as supportive, demanding, independent, or something else?
            frame: '*My older sister is very determined and responsible, which makes her a strong role model for me. Even though she can be strict, she is also incredibly supportive.*'
          - question: What qualities do you admire in older family members, although you may not always agree with them?
            frame: "*I admire my grandparents' resilience and patience, even though they grew up in difficult circumstances. They are wise and practical, which makes their advice meaningful and realistic.*"
          - question: How would you describe your family dynamic, and what makes it similar to or different from other families you know?
            frame: '*My family dynamic is quite supportive and open, although we sometimes argue about small things. We usually solve problems quickly because we value honest communication.*'
          - question: How has your relationship with your parents changed over the years, and what experiences influenced that change?
            frame: '*My relationship with my parents has become more balanced and respectful over the years. While we used to disagree frequently, we now communicate more calmly because we understand each other better.*'
          - question: Do you think growing up in Israel creates a unique family atmosphere compared to other countries? Why or why not?
            frame: '*Growing up in Israel creates a very warm and intense family atmosphere, since families tend to be closely connected. Although this closeness can sometimes feel overwhelming, it also provides strong emotional support.*'
          - question: How do family expectations influence personal choices, such as career or lifestyle, and do you find that positive or limiting?
            frame: '*Family expectations can be motivating because they encourage responsibility and ambition. However, they can also feel restrictive if they limit personal freedom.*'
          - question: If you could describe your ideal future family life, what would it look like, and what values would be most important to you?
            frame: '*My ideal future family life would be calm and stable, while still being adventurous and flexible. I would like to create an environment that is supportive and respectful, so that everyone feels valued.*'
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: Family work tree'
        skills: [Adjectives, Connecting words]
        steps:
          - '**Prepare your family work tree.** Go back three generations: grandparents, parents, yourself and (optional) your children. For each person, write their profession or main occupation, 2–3 adjectives that describe their personality or work style, and one short sentence about their influence (if relevant). Look for connections or comparisons in your tree.'
          - '**Present in pairs.** Present your family work tree and what you found. Your partner asks follow-up questions. Then switch.'
          - '**Talk in pairs.** Discuss the questions below.'
          - "**Class presentation.** Tell the class something about your partner's family work tree. Use a connecting word between your sentences."
      - id: act1-tree
        type: discussionQuestions
        title: My family work tree
        items:
          - question: 'Grandparents:'
            frame: My grandfather was a ___. He was ___ and ___, and he ___.
          - question: 'Parents:'
            frame: My mother is a ___. She is ___ and ___, so ___.
          - question: 'Me:'
            frame: I am a ___. I am ___ and ___, although ___.
          - question: 'Children (optional):'
      - id: act1-questions
        type: discussionQuestions
        title: Questions for pairs
        items:
          - question: Is there a clear pattern in your family's professions?
          - question: Would you describe your family as career-oriented or family-oriented?
          - question: Who had the strongest influence on you, and why?
          - question: Did you choose a similar or different path compared to your parents?
          - question: Was there pressure to follow a specific profession?
          - question: How did social or cultural factors influence your family's choices?
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Activity 2: Super Nanny visits my family'
        skills: [Adjectives, Connecting words]
        steps:
          - '**Set the tone.** You are a "Super Nanny" who visits your family for one week. Observe everything and write a short professional (but slightly dramatic) report.'
          - '**Write the report.** Write a short, funny report with the structure below: an opening observation, family roles with adjectives, ONE thing to change, a funny solution (use a modal verb and a connecting word), and a positive closing.'
          - "**Super Nanny conference.** In pairs of nannies, report to each other about the families you watched. Each nanny adds another suggestion to help with the other nanny's problems."
          - '**Class review.** Discuss the questions below.'
        example: '*This is a warm but slightly dramatic family. Although everyone loves each other deeply, simple discussions often become intense debates. The mother is efficient and responsible, while the father is relaxed and optimistic, which sometimes leads to forgotten tasks. The children are creative and energetic, although they strongly dislike cleaning. I recommend introducing a clear chore schedule because structure would reduce daily arguments. Despite minor chaos, this family has strong values and impressive loyalty.*'
      - id: act2-structure
        type: table
        caption: Report structure
        header: [Part, Examples]
        rows:
          - [
              Opening observation,
              '*"This is a loving but slightly chaotic family." / "Although the family members care about each other, their communication is dramatic."*',
            ]
          - [
              Family roles with adjectives,
              '*"The mother is highly organized but easily overwhelmed." / "The father is calm, although he disappears when it''s time to wash the dishes." / "The children are energetic and creative, which often results in noise."*',
            ]
          - [
              ONE thing to change,
              'Bedtime routine, phone usage, dinner conversations, division of chores, dramatic reactions, being late, overprotectiveness',
            ]
          - [
              'A funny solution (modal verb + connecting word)',
              '*"I recommend a ''No Phones at Dinner'' contract, which should reduce emotional explosions." / "A chore rotation system would create balance, although resistance is expected."*',
            ]
          - [
              Positive closing,
              '*"Despite minor chaos, this is a warm and loyal family." / "With small adjustments, the family will become calmer and more efficient."*',
            ]
      - id: act2-report
        type: discussionQuestions
        title: My Super Nanny report
        items:
          - question: 'Opening observation:'
            frame: This is a ___ but ___ family.
          - question: 'Family roles:'
            frame: The ___ is ___, although / while ___.
          - question: 'One thing to change:'
          - question: 'My solution:'
            frame: I recommend ___, which should ___.
          - question: 'Positive closing:'
            frame: Despite ___, this is a ___ and ___ family.
      - id: act2-review
        type: discussionQuestions
        title: Class review
        items:
          - question: Why do people often notice problems in other families more easily than in their own, and is that perception usually accurate?
          - question: Do you think outsiders tend to exaggerate family "problems" because they don't understand the full context, or can distance actually create a clearer perspective?
          - question: How does social media influence the way we judge other families, especially when everything looks perfect online?
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Activity 3: Generation gaps'
        skills: [Adjectives, Connecting words]
        steps:
          - '**Group brainstorm.** Discuss the brainstorm questions below.'
          - '**Video.** As a class, watch an interview with a boy and a man who have a 57-year age gap. While you watch, write down one surprising similarity, one clear difference, and two adjectives to describe each person.'
          - '**Pair discussion.** Talk about what you saw in the video and how you feel about generation gaps. Use the questions below or ask your own.'
          - '**Class review.** Each pair shares what they found.'
        resource:
          label: 57 Years Apart – A Boy and a Man Talk About Life (YouTube)
          url: https://www.youtube.com/watch?v=BqSxjmvXzzY
      - id: act3-brainstorm
        type: discussionQuestions
        title: Brainstorm
        items:
          - question: What is a generation gap?
          - question: What might cause generation gaps?
          - question: How do you think a younger generation would describe an older generation?
          - question: How do you think an older generation would describe a younger generation?
      - id: act3-video
        type: discussionQuestions
        title: While you watch
        items:
          - question: 'One surprising similarity:'
          - question: 'One clear difference:'
          - question: 'Two adjectives for the boy and two for the man:'
            frame: The boy is ___ and ___, while the man is ___ and ___.
      - id: act3-pairs
        type: discussionQuestions
        title: Pair discussion
        items:
          - question: Have you ever had a meaningful conversation with someone much older or younger than you?
          - question: What stereotypes about your generation annoy you?
          - question: Do you think your generation is more open, stressed, independent, or sensitive than previous ones?
          - question: What do older generations misunderstand about younger people?
          - question: What do younger generations misunderstand about older people?
          - question: 'How do these things affect generation gaps: technology, work ethic, relationships, social media, respect, independence?'
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Activity 4: Sibling relationships'
        skills: [Adjectives, Connecting words]
        steps:
          - "**Listen to the podcast** about sibling relationships that your teacher shares. You can read the transcript while you listen. Write down one positive description of the sisters' relationship, one stereotype that is mentioned, and one expression that you found interesting."
          - '**Check your understanding.** Answer the comprehension questions below.'
          - '**Talk in pairs or groups** about your sibling relationships. Describe them with adjectives, and connect your sentences with connecting words.'
          - '**Class sharing.** Discuss the last questions with the class.'
      - id: act4-notes
        type: discussionQuestions
        title: While you listen
        items:
          - question: "One positive description of the sisters' relationship:"
          - question: 'One stereotype that is mentioned:'
          - question: 'One interesting expression:'
      - id: act4-comprehension
        type: discussionQuestions
        title: Comprehension
        items:
          - question: How did Eileen describe her relationship with her sisters?
          - question: What does "march to your own drum" mean in the podcast?
          - question: What did the psychotherapist say about sibling stereotypes?
      - id: act4-talk
        type: discussionQuestions
        title: Conversation questions
        items:
          - question: Do you get on with your siblings? Has it changed over time?
          - question: Have you ever been "put on the spot" by a sibling?
          - question: Do you march to your own drum in your family, or are you similar to them?
          - question: Which stereotype fits your family, and which one doesn't?
          - question: Why do people like labeling siblings?
          - question: Is being the oldest / middle / youngest really influential?
          - question: Are stereotypes harmful or helpful?
          - question: Does Israeli culture create specific sibling roles?
      - id: act4-sharing
        type: discussionQuestions
        title: Class sharing
        items:
          - question: Do sibling roles influence adult personality?
          - question: Are sibling relationships stronger than friendships?
          - question: Why do relationships often improve with age?
      # Activity 5
      - id: act5
        type: classActivity
        title: 'Activity 5: Debate – loyalty vs. independence'
        skills: [Connecting words, Adjectives]
        steps:
          - 'Family loyalty and personal independence are often seen as equally important values, yet they can sometimes conflict with one another. In many cultures, including Israeli society, strong family bonds provide emotional support and stability, although they may also create expectations and pressure. While loyalty encourages responsibility and connection, independence allows individuals to develop their own identity and make their own choices. Is it possible to keep a deep family commitment without sacrificing personal freedom?'
          - '**Group 1:** Family is above everything else, and family loyalty should be a main value in life. **Group 2:** Each family member is an individual living their own life. Families should let their members live as they want.'
          - "**Brainstorm in groups.** Think of arguments and examples for your group's opinion. Use strong adjectives and connecting words (*although, however, while, because, as a result*)."
          - '**Debate!** One argument at a time: Group 1 gives an argument and Group 2 responds; then Group 2 gives an argument and Group 1 responds.'
          - '**Class discussion.** Which arguments were the strongest, and why?'
      - id: act5-arguments
        type: discussionQuestions
        title: My arguments
        items:
          - question: 'Argument 1:'
            frame: Although ___, ___ because ___.
          - question: 'Argument 2:'
            frame: ___. As a result, ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: **adjectives** and **connecting words**. Every activity
          practises both. Choose two or three activities for one lesson.
      - id: n-warmup
        anchor: warmup
        text: >-
          Pick from the 8 questions. Make sure students answer in full sentences and use
          adjectives and connecting words between the parts of the sentence. The model
          answer under each question shows the level we want.
      - id: n-act2
        anchor: act2
        text: >-
          Keep this activity playful and not judgmental. Treat it as a comedy show, not a
          therapy session.
      - id: n-act3
        anchor: act3
        text: >-
          If you have students from different generations in the class, ask them how it
          feels to study a language with a different generation.
      - id: n-act4
        anchor: act4
        text: >-
          The podcast is BBC Learning English, *6 Minute English: The bond between sisters*
          (14 November 2024). The bbc.co.uk link is not on the platform's link allow-list,
          so share it on screen from the old notebook. Students can read the transcript
          while they listen. In Step 2, make sure everyone understood the podcast before the
          conversation questions.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: family-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-adjectives
        type: ruleSummary
        skill: Adjectives
        rules:
          - text: '**We use adjectives to describe.** They help us describe people, places and feelings clearly and precisely: personality traits (*supportive, stubborn, independent*), family atmosphere (*warm, chaotic, traditional, intense*), generations (*open-minded, adaptable, conservative, resilient*) and emotional reactions (*overwhelmed, respected, misunderstood, valued*).'
          - text: '**After *to be*** (*am / is / are / was / were*):'
            examples: [My family is very supportive.]
          - text: '**After verbs like** *feel, seem, look, sound, become*:'
            examples:
              - The atmosphere became tense during the debate.
              - She seems open-minded, although she is traditional.
              - The situation sounds dramatic; however, it is manageable.
          - text: '**Before a noun:**'
            examples: [a loyal friend, a warm family]
          - text: '**Make adjectives stronger** with adverbs (intensifiers) like *very, really, extremely, surprisingly, deeply, incredibly*.'
            examples: [She is incredibly supportive.]
          - text: '**Upgrade your adjectives!** Use higher-level words so you sound interesting, not basic (see the table).'
      - id: upgrade-table
        type: table
        caption: Upgrade your adjectives
        header: [Basic adjective, Upgrade]
        rows:
          - [Nice, Supportive / Warm / Considerate]
          - [Angry, Frustrated / Resentful / Irritated]
          - [Old, Experienced / Traditional / Conservative]
          - [Young, Energetic / Curious]
          - [Strict, Demanding / Disciplined / Authoritative]
      - id: goal
        type: callout
        tone: tip
        title: The goal
        text: Combine **strong adjectives**, **connecting words** and a **clear structure** to make your speaking sound advanced and natural.
      - id: rules-connectors
        type: ruleSummary
        skill: Connecting words
        rules:
          - text: '**Use connectors to explain events in a logical order,** especially when you describe changes over time: family history, career paths, generational changes or life experiences.'
          - text: '**Use connectors to add, contrast or compare ideas.** In complex topics like disagreements or debates, connectors show the relationship between ideas.'
          - text: '**Placement:** connecting words usually join two complete ideas (two clauses), or a main idea + a contrast, reason or result. Put the connector between the two ideas, or at the beginning of the sentence (*Although…*), which sounds more formal.'
          - text: '*However* usually starts a new sentence (or comes after a semicolon) and has a comma after it.'
            examples: [My family is warm. However, communication can be intense.]
      - id: sequence-table
        type: table
        caption: Connectors for order
        header: [Connector, Use, Example]
        rows:
          - [First, Beginning, 'First, my grandparents immigrated to Israel.']
          - [Then, Next step, 'Then, my parents built their careers.']
          - [After that, Later event, 'After that, our family moved to another city.']
          - [Finally, Conclusion, 'Finally, I decided to choose a different path.']
      - id: connectors-table
        type: table
        caption: Connectors to add, contrast and compare
        header: [Connector, Use, Example]
        rows:
          - [
              And / Also / Too / In addition,
              Adding information,
              'My sister is independent, and she is also very ambitious.',
            ]
          - [But / However, Contrast, 'My family is warm, but communication can be intense.']
          - [
              Although / While,
              Contrast (two different ideas in one sentence),
              'Although we disagree, we respect each other.',
            ]
          - [
              Whereas,
              Formal contrast (a clear comparison between two sides),
              'My brother prefers stability, whereas I prefer independence.',
            ]
          - [Because, Giving a reason, I chose a stable career because my parents value security.]
          - [
              So / As a result,
              Showing an effect or result,
              'My family is very close, so we talk every day.',
            ]
          - [
              If,
              Condition,
              "If I followed my family's expectations, my life would be very different.",
            ]
          - [
              First / Then / After that / Finally,
              Showing sequence or order,
              'First, my grandparents immigrated. Then, my parents built their careers.',
            ]
      - id: placement-examples
        type: examples
        items:
          - text: '❌ *My family is very close, but although we argue because we are emotional, and however we love each other.*'
            gloss: Too long, and too many connectors.
          - text: '✅ *My family is very close, but we argue a lot.*'
          - text: '✅ *Although we disagree, we respect each other.*'
          - text: "✅ *My family is supportive and traditional because they value stability. Although they didn't understand my creative career at first, they accept it now.*"
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both skills with the group and ask for one new example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: family-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-main
        type: aiTutorPrompt
        title: My family
        message: >-
          Hi Mori! Talk to me about my family and ask me questions that help me describe
          the personalities and atmosphere using strong adjectives like supportive,
          traditional, independent, or intense. Ask me to compare two generations in my
          family using comparison structures such as more… than, less… than, as… as,
          while, or whereas. Encourage me to explain how my family is similar to or
          different from other families I know. Please correct my mistakes and suggest
          stronger adjectives or clearer comparison sentences when needed.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**
      - id: extra-title
        type: heading
        level: 3
        text: 2 interactive activities
      - id: mori-swap
        type: aiTutorPrompt
        title: 'Activity 1: Family swap'
        intro: You have the chance to be part of a famous family! Choose a well-known family (the Royal Family, the Kardashians, the Banai family…). Describe your "new" family to Mori, and talk about the differences and similarities between them and your real family. Send Mori this message.
        message: >-
          Hi Mori, I'm joining a famous family, and I want you to ask me questions about
          what life would be like in that family. Encourage me to describe them using
          strong adjectives and to explain my ideas using connecting words such as
          because, although, however, while, even though, and as a result. Ask me to talk
          about similarities and differences between this famous family and my real
          family, but make sure I justify my answers clearly and connect my ideas
          logically. Please correct my mistakes and suggest clearer sentences if my ideas
          are not well-connected.
      - id: swap-remember
        type: callout
        tone: tip
        title: "Don't forget to:"
        text: |-
          Describe your "new" family with strong adjectives.
          Give strong examples, using connecting words.
          Choose different connecting words depending on the meaning of your sentence.
      - id: mori-siblings
        type: aiTutorPrompt
        title: 'Activity 2: Relationships between siblings'
        intro: "Listen again to the podcast about sibling relationships from class (your teacher shared it). You can use the transcript while you listen. Write down one positive description of the sisters' relationship, one stereotype that is mentioned, and one expression that you found interesting. Then send Mori this message."
        message: >-
          Hi Mori, today I listened to a podcast about sibling relationships and common
          stereotypes about older, middle, and younger siblings. Please ask me questions
          that help me describe my relationship with my siblings using strong adjectives
          like supportive, competitive, independent, protective, or stubborn. Ask me
          whether my place in the family matches or doesn't match common stereotypes, and
          encourage me to explain my ideas clearly using connecting words such as although,
          however, because, while, and as a result. Please correct my mistakes and suggest
          stronger adjectives or clearer sentences if my ideas are not well-connected.
      - id: siblings-remember
        type: callout
        tone: tip
        title: "Don't forget to:"
        text: |-
          Talk about personal experiences using the correct narrative tenses.
          Explain your answers in long sentences using connecting words.
          Describe your siblings with strong adjectives.

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: family-practice
    book: workbook
    title: 'Practice: Family'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise adjectives and connecting words on your own. Each answer is checked right away, and you can try again.
      - id: ex-adjectives
        type: activity
        activity: family-adjectives
      - id: ex-connectors
        type: activity
        activity: family-connectors

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: family-vocabulary
    title: Vocabulary
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Family words
        glossLang: he
        link: https://quizlet.com/il/1148396000/family-english-translation-flash-cards/
