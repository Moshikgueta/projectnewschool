vocabulary:
  - slug: family
    title: Family
    items: *family-words

activities:
  - slug: family-adjectives
    title: 'Adjectives: describe your family'
    minutes: 8
    items:
      - id: upgrade-nice
        type: multipleChoice
        prompt: 'Upgrade the basic adjective: *My grandmother is very nice. She always helps and encourages me.*'
        options:
          - { text: supportive, correct: true }
          - {
              text: stubborn,
              feedback: '*Stubborn* means unwilling to change your opinion. It is not an upgrade of *nice*.',
            }
          - {
              text: bossy,
              feedback: '*Bossy* means always telling others what to do. It is negative, not an upgrade of *nice*.',
            }
      - id: definitions
        type: matching
        prompt: Match each adjective with its meaning.
        pairs:
          - [stubborn, unwilling to change their opinion]
          - [resilient, able to recover quickly from difficulties]
          - [adaptable, able to adjust easily to new situations]
          - [bossy, always telling others what to do]
          - [open-minded, willing to consider new ideas]
      - id: after-seem
        type: trueFalse
        prompt: 'An adjective can come after verbs like *seem, look, sound, feel* and *become*: *She seems open-minded.*'
        answer: true
        feedback:
          correct: 'Right! *The atmosphere became tense. The situation sounds dramatic.*'
          incorrect: 'Adjectives come after *to be* and after verbs like *seem, look, sound, feel, become*: *She seems open-minded.*'
      - id: loyal-friend
        type: multipleChoice
        prompt: Which is correct?
        options:
          - { text: a loyal friend, correct: true }
          - {
              text: a friend loyal,
              feedback: 'In English, the adjective comes before the noun: *a loyal friend*.',
            }
          - {
              text: a loyals friend,
              feedback: 'Adjectives never take *-s* in English: *a loyal friend, loyal friends*.',
            }
      - id: protective
        type: fillBlank
        prompt: 'Complete with one adjective from the word bank.'
        text: My older brother always wants to take care of me and defend me. He is very ___.
        blanks: [[protective]]
        wordBank: [protective, spoiled, competitive]
      - id: spoiled-competitive
        type: fillBlank
        prompt: 'Complete with one adjective from the word bank in each blank.'
        text: My little sister gets everything she wants, so she is a bit ___. My twin always wants to win, so he is very ___.
        blanks: [[spoiled, spoilt], [competitive]]
        wordBank: [protective, spoiled, competitive]
      - id: upgrade-strict
        type: multipleChoice
        prompt: 'Which word is an upgrade of *strict*?'
        options:
          - { text: demanding, correct: true }
          - { text: energetic, feedback: '*Energetic* is an upgrade of *young*, not of *strict*.' }
          - {
              text: considerate,
              feedback: '*Considerate* is an upgrade of *nice*, not of *strict*.',
            }
      - id: order-supportive
        type: reorderSentence
        prompt: Put the words in order.
        sentence: My family is incredibly supportive.

  - slug: family-connectors
    title: 'Connecting words: although, however, because, so'
    minutes: 8
    items:
      - id: although
        type: multipleChoice
        prompt: ___ we disagree, we respect each other.
        options:
          - { text: Although, correct: true }
          - {
              text: Because,
              feedback: '*Because* gives a reason. Here the two ideas are in contrast, so use *although*.',
            }
          - {
              text: However,
              feedback: '*However* starts a new sentence and has a comma: *We disagree. However, we respect each other.*',
            }
      - id: because
        type: fillBlank
        prompt: Complete with a connector that gives a reason.
        text: I chose a stable career ___ my parents value security.
        blanks: [[because, since, as]]
      - id: so
        type: fillBlank
        prompt: Complete with a connector that shows a result (one word).
        text: My family is very close, ___ we talk every day.
        blanks: [[so]]
      - id: whereas
        type: multipleChoice
        prompt: My brother prefers stability, ___ I prefer independence.
        options:
          - { text: whereas, correct: true }
          - {
              text: because,
              feedback: '*Because* gives a reason. Here we compare two sides, so use *whereas* (or *while*).',
            }
          - {
              text: so,
              feedback: '*So* shows a result. Here we compare two sides, so use *whereas* (or *while*).',
            }
      - id: uses
        type: matching
        prompt: Match each connector with its use.
        pairs:
          - [In addition, adding information]
          - [Whereas, formal contrast between two sides]
          - [Because, giving a reason]
          - [As a result, showing a result]
          - [Finally, conclusion of a sequence]
      - id: too-many
        type: trueFalse
        prompt: 'A good sentence uses as many connectors as possible: *My family is very close, but although we argue because we are emotional, and however we love each other.*'
        answer: false
        feedback:
          correct: 'Right! That sentence is too long. Better: *My family is very close, but we argue a lot.*'
          incorrect: 'Too many connectors make a sentence confusing. Connect two ideas clearly: *My family is very close, but we argue a lot.*'
      - id: however-comma
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: 'My family is warm. However, communication can be intense.', correct: true }
          - {
              text: 'My family is warm, however communication can be intense.',
              feedback: '*However* usually starts a new sentence (or comes after a semicolon) and has a comma after it.',
            }
          - {
              text: 'My family is warm. However communication, can be intense.',
              feedback: 'The comma goes right after *However*: *However, communication…*',
            }
      - id: order-first
        type: reorderSentence
        prompt: Put the words in order.
        sentence: First, my grandparents immigrated to Israel.
