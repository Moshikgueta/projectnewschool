# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-level-3
slug: social-media
title: Social Media
goal: Talk about social media with the present perfect and the passive voice.
position: 14
status: published

review:
  - >-
    The two workbook exercises ("Present perfect" and "Passive voice") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's summary
    rules, the activity examples and the vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Summary, passive voice: the source gives the structure "be (correct tense) + past
    participle" but uses three tenses across the cycle (present simple passive in the
    warm-up, past simple passive and present perfect passive in Activity 1). A small
    table "Passive voice in three tenses" was added. Please confirm.
  - >-
    Summary, present perfect: "He's = He has" now adds that *he's* can also mean *he
    is* (the context tells you which).
  - >-
    Activity 1 presentation rule "No names of speakers (focus on actions, not people)"
    → "Don't say who did the action (focus on actions, not people)", which is what the
    passive voice rule means. Step 3 now says "at least 3 sentences in the present
    perfect passive and at least 1 in the past simple passive".
  - >-
    Activity 2 prompt "Something that I noticed changed in my habits" → "Something
    I've noticed has changed in my habits" (present perfect, like the other prompts).
  - >-
    Activity 3 Step 2 "Think about what content (time, habits, etc.) is repeated
    between both users" → "Think about which topics (time, habits, control…) appear
    in both texts".
  - >-
    Activity 4: Group 1 "we should be informed mainly by social media for news" → "we
    should be informed mainly by social media"; the debate steps say "Group A / B"
    while the teams are "Group 1 / 2": both are now "Group 1 / 2".
  - >-
    Mori, "Influencer interview": the source message says "Ask me to use the present
    perfect", but in this activity the student asks the questions and Mori answers as
    the influencer. The message now asks Mori to answer in character and to correct
    the student's present perfect and passive questions. Please confirm.
  - >-
    Activity 3 uses a gamma.app "Visual aid" page, which is not on the link
    allow-list. The link was removed; the two texts from it are in the notebook and
    are kept in the class section; the page is mentioned in a teacher note.
  - >-
    Small corrections: Activity 1 "Breakout rooms or personal" is now a teacher note
    (groups or individual work); "significant engagement" → "a lot of engagement" in
    the example bank; stray asterisks, broken bold and quotation marks were removed. The two Quizlet links are kept without their "?i=…&x=…"
    tracking parameters.
  - >-
    The vocabulary table also has English definitions; the vocabulary block only
    holds term + Hebrew gloss, so the definitions are not in the block (they are in
    the "English + Definition" Quizlet set, linked in class).
  - >-
    The source gives no activity times and no lesson plan. The plan note (which
    activity practises which skill) was written from the activity skill lines. The
    "Answer of student 1/2/3" lines are replaced by the optional answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: social-media-class
    title: 'Class: Social Media'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Social Media
      - id: skills
        type: cycleOverview
        skills:
          - name: Present perfect
            description: Experiences and recent changes (*I've noticed that short videos have become very popular.*)
          - name: Passive voice
            description: Focus on the action, not on who did it (*A new feature has been introduced.*)
      - id: quizlet
        type: externalLink
        label: Social Media on Quizlet (English + Hebrew)
        url: https://quizlet.com/il/1137582884/social-media-english-hebrew-flash-cards/
      - id: quizlet-definitions
        type: externalLink
        label: Social Media on Quizlet (English + definitions)
        url: https://quizlet.com/il/1137582236/social-media-english-definition-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: My name is ___ and I think social media has improved / worsened / changed our lives.
        example: My name is Marta, and I think social media has changed our lives in both positive and negative ways.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: Have you changed your daily routine because of social media?
            frame: "Yes, I have changed it because ___. / No, I haven't changed it because ___."
          - question: Have you met or gotten to know anyone important thanks to social media? Tell the class about them.
            frame: I've met ___ thanks to ___.
          - question: What kind of posts have you shared recently?
            frame: Recently, I've shared ___.
          - question: How is inclusion promoted on social media?
            frame: Inclusion on social media is promoted through ___.
          - question: How are fake news stories spread on social media, and how can they be stopped?
            frame: Fake news is spread through ___. It can be stopped by ___.
          - question: How is personal data collected by social media platforms, and how do you feel about it?
            frame: Personal data is collected by ___. I feel ___.
          - question: What kinds of content are promoted most often on social media, in your opinion?
            frame: In my opinion, ___ is promoted most often.
          - question: Do you think enough is being done to protect teenagers on social media? Why or why not?
            frame: I think enough / not enough is being done because ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: Trends of the century'
        skills: [Passive voice]
        steps:
          - Social media platforms change all the time, and the race to be the most innovative platform never ends. Your group is a research or media analysis team. You prepare a short report about the latest trends and new features of one platform.
          - 'Your teacher gives your group (or you) a platform: Instagram, TikTok, YouTube or X / Twitter.'
          - 'Think of **5** recent trends or changes on your platform. They can be real or made up, but realistic. Think about new features, popular content, platform policies, viral trends, and technology (AI, algorithms, moderation).'
          - 'Write your report: 5 formal sentences in the passive voice. At least **3** sentences in the **present perfect passive** and at least **1** in the **past simple passive**.'
          - "Present your report (3 minutes per group). Don't read word for word, speak clearly and slowly, use the passive voice naturally, and don't say who did the action (focus on actions, not people)."
          - 'While the other groups present: write down one passive sentence you hear and decide if it is present perfect passive or past simple passive.'
          - Finish with the class reflection questions.
        example: |-
          *A new feature has been introduced that allows users to…*
          *A post has been shared that received a lot of engagement.*
          *In 2025, a policy was implemented to improve user safety.*
          *Artificial intelligence has been used to personalize content.*
          *A recent report has been published showing increased user activity.*
      - id: act1-opening
        type: callout
        tone: tip
        title: Example opening
        text: '*Today, we are presenting recent trends on Instagram. Over the last few months, several changes have been introduced…*'
      - id: act1-report
        type: discussionQuestions
        title: Our report
        items:
          - question: 'Present perfect passive: ___'
            frame: A new ___ has been ___.
          - question: 'Present perfect passive: ___'
          - question: 'Present perfect passive: ___'
          - question: 'Past simple passive: ___'
            frame: In ___, ___ was ___.
          - question: 'Fifth sentence: ___'
      - id: act1-listening
        type: discussionQuestions
        title: Active listening
        items:
          - question: 'A passive sentence I heard: ___'
            frame: It is in the present perfect passive / past simple passive.
      - id: act1-reflection
        type: discussionQuestions
        title: Class reflection
        items:
          - question: Which platform has changed the most recently?
          - question: Why is the passive voice useful in reports and news?
          - question: Would this information sound different in the active voice?
      # Activity 2
      - id: act2
        type: classActivity
        title: "Activity 2: Things I've noticed on social media"
        skills: [Present perfect]
        steps:
          - Social media is a huge part of our lives, whether we like it or not. We see trends and news all the time, sometimes without noticing.
          - Look at the prompt bank. Think about things you've noticed, heard about or come across online, on TV, in ads or from people.
          - Choose 2 prompts and write a sentence for each about your experience and how it made you feel.
          - 'In groups of 2 or 3, take turns: Student A shares one sentence, Student B responds with the present perfect, Student C may ask a follow-up question.'
          - 'Class share: the teacher chooses 3 students to be A, B and C in front of the class.'
        example: |-
          *A: I've noticed that short videos have become very popular recently.*
          *B: I've seen that too, especially on YouTube.*
          *C: Have you noticed that people have stopped watching longer videos?*
      - id: act2-prompts
        type: callout
        tone: info
        title: Prompt bank
        text: |-
          Something I've noticed that has become very popular recently.
          Something I've heard people talk about a lot.
          Something I've seen that has made me laugh / think / feel uncomfortable.
          Something I've seen that many people like.
          Something I've avoided because it feels negative or stressful.
          Something I've watched or read that has been shared or mentioned many times.
          Someone I've discovered through social media that I didn't know before.
          Something I've noticed has changed in my habits.
      - id: act2-sentences
        type: discussionQuestions
        title: My two prompts
        items:
          - question: 'Prompt 1: ___'
            frame: I've ___. It made me feel ___.
          - question: 'Prompt 2: ___'
            frame: I've ___. It made me feel ___.
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Activity 3: Passive scrolling vs. active choice'
        skills: [Passive voice]
        steps:
          - Open discussion about passive and active use of social media (questions below).
          - Read what two social media users say about their scrolling. Think about which topics (time, habits, control…) appear in both texts.
          - "In pairs: one student talks about Text 1, the other about Text 2. Take turns saying something you noticed about social media use **in the passive voice**. Add to or contrast with your partner, don't only say one sentence."
          - Finish with the group conversation questions.
      - id: act3-warmup
        type: discussionQuestions
        title: Warm-up conversation
        items:
          - question: Do you think content is usually chosen by users or chosen for them?
          - question: Have you ever realized that time was wasted without noticing while you used social media?
          - question: Do you scroll, or do you decide what to watch?
      - id: act3-text1
        type: callout
        tone: info
        title: Text 1
        text: >-
          *"Honestly, most of the time when I open social media, I don't really have a
          plan. I tell myself I'll check it for a minute, but then I start scrolling
          without thinking. One video ends, another one starts, and I don't even remember
          choosing it. After a while, I suddenly realize that a lot of time has passed,
          and I feel tired or distracted. I often see content that I wouldn't actively
          look for, but it keeps appearing anyway. Sometimes I close the app and think,
          'What did I actually want to do there?'"*
      - id: act3-text2
        type: callout
        tone: info
        title: Text 2
        text: >-
          *"Before I open social media, I usually know what I want to do. I follow
          specific creators because I enjoy their content, and I try to avoid things that
          stress me out. If I notice that something feels negative or repetitive, I stop
          watching and move on. I also pay attention to how much time I spend online,
          especially on busy days. When I decide what to watch and when to stop, I feel
          more in control and less overwhelmed. Social media feels more useful to me when
          I treat it as a choice, not a habit."*
      - id: act3-pairs
        type: discussionQuestions
        title: What I noticed (passive voice)
        items:
          - question: Content has been ___.
          - question: Time has been ___.
          - question: Control has been ___.
          - question: Habits have been ___.
          - question: Choices have been ___.
      - id: act3-group
        type: discussionQuestions
        title: Group conversation
        items:
          - question: What has been lost through passive scrolling?
          - question: What has been gained through active choice?
          - question: What has been encouraged by platforms?
          - question: What has not been protected enough?
          - question: What has been hard for you while using social media?
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Activity 4: Debate: where should we get our news?'
        skills: [Present perfect]
        steps:
          - 'Today, news is everywhere. Many people get information through social media, where news is shared quickly, often with personal opinions and emotions. Traditional news channels try to follow professional standards, but some people feel they are slow, biased or overwhelming. Trust in information has changed, and many people feel tired of constant news. **The question is not only what we watch, but who we trust to inform us.**'
          - "Group 1: Today, we should be informed mainly by social media. Group 2: We shouldn't trust social media; we should be informed mainly by news channels."
          - Brainstorm in your group points that support your team's opinion. Even if you don't totally agree with it, think of reasons and examples from your own experience, using the present perfect.
          - 'Debate! One argument at a time: Group 1 gives an argument, Group 2 responds; Group 2 gives an argument, Group 1 responds.'
          - Finish with the class discussion questions.
      - id: act4-brainstorm
        type: discussionQuestions
        title: Brainstorm
        items:
          - question: Why do people trust this source?
          - question: How is information shared or controlled?
          - question: How do emotions and speed affect news?
          - question: How does this source affect stress or information fatigue?
      - id: act4-discussion
        type: discussionQuestions
        title: Class discussion
        items:
          - question: How has trust in information changed in recent years?
          - question: Do you feel overexposed to the news today? Has this changed in the past years?
          - question: Which source do you personally rely on more, and why?
          - question: Do you think it's possible to stay informed without feeling overwhelmed?
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: the **present perfect** (introduction round, warm-up,
          Activities 2 and 4) and the **passive voice**, mostly present perfect passive
          and past simple passive (Activities 1 and 3; the warm-up also uses the present
          simple passive). The notebook gives no timings.
      - id: n-warmup
        anchor: warmup
        text: Ask each student at least two questions. Answers typed here are visible to you below each question.
      - id: n-act1
        anchor: act1
        text: >-
          Work in groups (breakout rooms) or give each student a platform. Optional: let
          the groups pretend to present in a newsroom, at a company meeting or at a
          digital trends conference.
      - id: n-act2
        anchor: act2
        text: >-
          In the class share, compare the three-student conversation with the group
          conversations: different students, opinions and experiences lead to different
          answers.
      - id: n-act3
        anchor: act3
        text: >-
          The two texts come from the old notebook's "Passive vs Active Scrolling"
          gamma.app page (not on the link allow-list). The texts are reproduced here;
          share the page on screen if you want the visuals.
      - id: n-act4
        anchor: act4
        text: Assign the two groups. Remind students they defend the group's opinion, not necessarily their own.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: social-media-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-present-perfect
        type: ruleSummary
        skill: Present perfect (have + past participle)
        rules:
          - text: 'We use the present perfect for **past experiences that matter now**, for **recent changes** or **repeated actions** in our lives, and when the **exact time is not important**.'
          - text: '**Form:** subject + *have / has* + past participle. *I / you / we / they* **have**; *he / she / it* **has**.'
            examples:
              - "I've posted many photos on Instagram this week."
              - Have you seen the latest viral video on TikTok?
              - "In recent years, we've spent too much time on social media."
          - text: "**Contractions:** *I've* = I have, *he's* = he has. (*He's* can also mean *he is*: the context tells you which.)"
          - text: 'Use the **past simple after the present perfect** to add detail: **when** or **where** something happened.'
            examples:
              - "I've seen that video many times, but I first watched it on Instagram last year."
              - "We've followed that journalist for a long time and discovered their work on Twitter during the elections."
          - text: 'Use **time expressions** to make your story more interesting.'
            examples: ["Recently, I've…", "I've always…", "I've never…"]
      - id: rules-passive
        type: ruleSummary
        skill: Passive voice
        rules:
          - text: >-
              We use the passive voice to focus on the **action or result**, not on who
              did it. It is very common in news headlines, reports and social media news,
              because we talk about **something** that interests most people, not
              **someone**.
            examples:
              - '**Active:** The platform shared the video.'
              - '**Passive:** The video **was shared** (by the platform).'
          - text: '**Form:** subject + *be* (in the correct tense) + past participle (+ *by* + agent). The **subject** receives the action (*the video, the post, users*). The **agent** is who did the action; we often leave it out because it is obvious, not important, or we want to focus on the action.'
            examples:
              - A meme **has been shared** by millions of users.
              - A charity campaign **was promoted** on Twitter last week.
              - Personal data **has been collected** (by apps).
          - text: >-
              **Mix active and passive** to sound natural. The passive shows **results,
              effects and experiences** (what has happened, what has been done). The
              active shows **opinions, actions and personal involvement** (what *you*
              think, feel or did).
            examples:
              - A lot of content has been shared recently, but I avoid most of it.
              - Short videos have been promoted heavily, yet I choose longer content when I want real information.
              - A lot of news has been shared on social media, but I only trust a few sources.
      - id: passive-table
        type: table
        caption: Passive voice in three tenses
        header: [Tense, Form, Example]
        rows:
          - [
              Present simple passive,
              am / is / are + past participle,
              Personal data **is collected** by apps.,
            ]
          - [Past simple passive, was / were + past participle, The video **was shared** last week.]
          - [
              Present perfect passive,
              has / have been + past participle,
              A new feature **has been introduced**.,
            ]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both skills with the group and ask for one new social media example for each rule. The three-tense table was added in the conversion.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: social-media-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-main
        type: aiTutorPrompt
        title: Information and social media
        message: >-
          Hi Mori! Let's talk about how people get information today, especially through
          social media and news. Please ask me questions about things that have happened
          or have been experienced, so that I can answer using the present perfect. Try
          to ask questions that encourage me to use the passive voice (for example: has
          been shared, has been influenced, has been exposed). Also, encourage me to mix
          passive and active voice in the same answers. Ask follow-up questions so I can
          add personal reactions or opinions using active voice and complete sentences.
      - id: extra-title
        type: heading
        level: 3
        text: 2 interactive activities
      - id: mori-participation
        type: aiTutorPrompt
        title: 'Activity 1: Participation and social pressure online'
        intro: >-
          Many people get information and opinions through social media. News, trends and
          reactions are shared quickly, and people often expect you to take part. Some
          people scroll passively; others choose carefully what to engage with. Think:
          are you an **observer, a commenter, an active participant, a selective user,
          or something else**? How do you take part compared to your generation, or to the
          people close to you? Has your participation changed over the years?
        message: >-
          Hi Mori! I want to talk about how people participate online. Please ask me
          questions about my experiences and observations so that I can answer using the
          present perfect. Ask me to explain what has been done or what has been
          experienced by people in general. Challenge me to give examples and react to
          your questions.
      - id: tips-participation
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Use the present perfect to talk about experiences.
          Explain your ideas in more than one sentence.
          React to Mori: agree, disagree or add something!
      - id: mori-influencer
        type: aiTutorPrompt
        title: 'Activity 2: Influencer interview'
        intro: >-
          Choose an influencer you have heard about (a social media influencer, a
          journalist or public figure online, a YouTuber or podcaster, someone famous or
          niche). Find information about them on the internet or with AI: what they are
          known for, who follows them, and what kind of influence they have. Fill in the
          name, send the message, then ask Mori **4 questions in the passive voice** and
          **4 questions in the present perfect**. For example: *How has your content
          changed over time? Has criticism been directed at you online?*
        message: >-
          Hi Mori! I want to interview an influencer. The influencer I chose is: ___.
          Please answer my questions as if you are this influencer, in a natural,
          conversational way. I will ask you questions in the present perfect and the
          passive voice; please correct my questions if I make mistakes.
      - id: tips-influencer
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Use the correct form of present perfect and passive voice questions.
          Ask follow-up questions that come up naturally, not only the ones you prepared.
          Ask open-ended questions.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

