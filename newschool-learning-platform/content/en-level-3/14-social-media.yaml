activities:
  - slug: social-media-present-perfect
    title: "Present perfect: I've noticed, Have you seen…?"
    minutes: 8
    items:
      - id: have-posted
        type: multipleChoice
        prompt: I ___ many photos on Instagram this week.
        options:
          - { text: have posted, correct: true }
          - {
              text: has posted,
              feedback: '*Has* is for *he, she, it*. With *I*, use *have*: *I have posted*.',
            }
          - { text: have post, feedback: 'After *have*, use the past participle: *posted*.' }
      - id: have-you-seen
        type: multipleChoice
        prompt: ___ you seen the latest viral video?
        options:
          - { text: Have, correct: true }
          - { text: Has, feedback: '*Has* is for *he, she, it*. For *you*, use *have*.' }
          - {
              text: Did,
              feedback: '*Seen* is a past participle, so the question needs *have*: *Have you seen…?*',
            }
      - id: has-changed
        type: fillBlank
        prompt: Write *change* in the present perfect.
        text: She ___ her daily routine because of social media.
        blanks: [[has changed]]
      - id: last-year
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - {
              text: "I've seen that video many times, but I first watched it on Instagram last year.",
              correct: true,
            }
          - {
              text: "I've seen that video many times, but I've first watched it on Instagram last year.",
              feedback: '*Last year* is a specific time. To add when it happened, use the past simple: *I first watched it last year*.',
            }
          - {
              text: 'I see that video many times, but I first watched it on Instagram last year.',
              feedback: "For experiences up to now, use the present perfect: *I've seen that video many times*.",
            }
      - id: hes
        type: trueFalse
        prompt: "In *He's posted a new video*, *he's* means *he has*."
        answer: true
        feedback:
          correct: "Right! *He has posted* (present perfect). *He's* can also mean *he is*, but here it comes before a past participle."
          incorrect: "*Posted* is a past participle, so *he's* here means *he has*: *He has posted a new video.*"
      - id: participles
        type: matching
        prompt: Match each verb with its past participle.
        pairs:
          - [post, posted]
          - [see, seen]
          - [spend, spent]
          - [write, written]
          - [become, become]
      - id: always
        type: fillBlank
        prompt: Complete with the time expression that is the opposite of *never*.
        text: "I've ___ followed fashion creators on Instagram."
        blanks: [[always]]
      - id: order-videos
        type: reorderSentence
        prompt: Put the words in order.
        sentence: Short videos have become very popular recently.

  - slug: social-media-passive
    title: 'Passive voice: was shared, has been shared'
    minutes: 8
    items:
      - id: was-shared
        type: multipleChoice
        prompt: The video ___ by the platform yesterday.
        options:
          - { text: was shared, correct: true }
          - {
              text: has been shared,
              feedback: '*Yesterday* is a finished time. Use the past simple passive: *was shared*.',
            }
          - {
              text: shared,
              feedback: 'The video does not share; it receives the action. Use *be* + past participle: *was shared*.',
            }
      - id: data-collected
        type: multipleChoice
        prompt: Personal data ___ by apps for many years.
        options:
          - { text: has been collected, correct: true }
          - {
              text: has collected,
              feedback: 'This is active: the data does not collect anything. Use the passive: *has been collected*.',
            }
          - {
              text: has been collect,
              feedback: 'After *has been*, use the past participle: *collected*.',
            }
      - id: introduced
        type: fillBlank
        prompt: Write *introduce* in the present perfect passive.
        text: A new feature ___ that allows users to edit their posts.
        blanks: [[has been introduced]]
      - id: agent
        type: trueFalse
        prompt: In the passive voice, we always have to say who did the action (*by* + agent).
        answer: false
        feedback:
          correct: Right! We often leave out the agent because it is obvious, not important, or we want to focus on the action.
          incorrect: 'The agent (*by* + person) is optional. We often leave it out: *Personal data has been collected.*'
      - id: active-passive
        type: matching
        prompt: Match each active sentence with its passive form.
        pairs:
          - [The platform shared the video., The video was shared.]
          - [Millions of users have shared a meme., A meme has been shared.]
          - [The app promotes short videos., Short videos are promoted.]
          - [Apps have collected personal data., Personal data has been collected.]
      - id: which-tense
        type: multipleChoice
        prompt: '*A charity campaign was promoted on Twitter last week.* Which tense is this?'
        options:
          - { text: Past simple passive, correct: true }
          - {
              text: Present perfect passive,
              feedback: 'The present perfect passive uses *has / have been*. Here we have *was* + past participle.',
            }
          - {
              text: Present simple passive,
              feedback: 'The present simple passive uses *is / are*. Here we have *was*: past simple.',
            }
      - id: promoted
        type: fillBlank
        prompt: Write *promote* in the present perfect passive.
        text: Short videos ___ heavily, yet I choose longer content.
        blanks: [[have been promoted]]
      - id: order-report
        type: reorderSentence
        prompt: Put the words in order.
        sentence: A recent report has been published.
