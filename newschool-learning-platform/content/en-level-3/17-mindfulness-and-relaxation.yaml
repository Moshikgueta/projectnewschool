vocabulary:
  - slug: mindfulness-and-relaxation
    title: Mindfulness and Relaxation
    items: *mindfulness-and-relaxation-words

activities:
  - slug: mindfulness-and-relaxation-adjectives
    title: 'Adjectives: serene, soothing, overwhelming'
    minutes: 8
    items:
      - id: soothing
        type: multipleChoice
        prompt: 'Upgrade *nice*: The music in the spa was ___.'
        options:
          - { text: soothing, correct: true }
          - {
              text: sleek,
              feedback: '*Sleek* upgrades *modern*. It describes design, not music. *Soothing* means having a calming effect.',
            }
          - {
              text: efficient,
              feedback: '*Efficient* upgrades *good* for something that works well. For calming music, use *soothing*.',
            }
      - id: upgrade
        type: matching
        prompt: Match each weak adjective with an upgrade.
        pairs:
          - [nice, harmonious]
          - [good, functional]
          - [calm, tranquil]
          - [bright, sun-drenched]
          - [modern, minimalist]
      - id: looks
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: The situation looks overwhelming., correct: true }
          - {
              text: The situation looks overwhelmingly.,
              feedback: 'After verbs like *look, feel, seem*, use an adjective (*overwhelming*), not an adverb.',
            }
          - {
              text: The situation overwhelming looks.,
              feedback: 'The adjective comes after the verb *look*: *The situation looks overwhelming.*',
            }
      - id: after-verbs
        type: trueFalse
        prompt: Adjectives can come after verbs like *feel, seem, look, sound* and *become*.
        answer: true
        feedback:
          correct: Right! *He became less anxious. The room feels serene.*
          incorrect: 'Adjectives can come after *be* and after verbs like *feel, seem, look, sound, become*: *He became less anxious.*'
      - id: restorative
        type: multipleChoice
        prompt: Which adjective means *helping someone recover energy or emotional strength*?
        options:
          - { text: restorative, correct: true }
          - {
              text: oppressive,
              feedback: '*Oppressive* means causing discomfort or emotional pressure: the opposite idea.',
            }
          - { text: restless, feedback: '*Restless* means unable to relax or stay calm.' }
      - id: extremely
        type: multipleChoice
        prompt: Make the adjective stronger. I felt ___ anxious before my exam.
        options:
          - { text: extremely, correct: true }
          - {
              text: extreme,
              feedback: 'Before an adjective, use an adverb: *extremely anxious*, not *extreme anxious*.',
            }
          - {
              text: slowly,
              feedback: "*Slowly* is an adverb, but it doesn't make an adjective stronger. Use *very, really, extremely, deeply…*",
            }
      - id: anxious
        type: fillBlank
        prompt: Write the adjective that means *worried or uneasy about something*. It starts with *a*.
        text: After the breathing exercise, he became less ___.
        blanks: [[anxious]]
      - id: order-peaceful
        type: reorderSentence
        prompt: Put the words in order.
        sentence: The classroom was peaceful after the exercise.

  - slug: mindfulness-and-relaxation-narrative
    title: 'Narrative tenses: then, now, next and if'
    minutes: 8
    items:
      - id: spent
        type: multipleChoice
        prompt: Two years ago, I ___ a week in the mountains.
        options:
          - { text: spent, correct: true }
          - {
              text: have spent,
              feedback: '*Two years ago* is a finished time, so use the past simple: *spent*.',
            }
          - { text: spend, feedback: '*Spend* is the present. The action is finished: *spent*.' }
      - id: used-to
        type: fillBlank
        prompt: Write the form for a past habit that is not true now.
        text: Students ___ accept stress as normal. Now they talk about it openly.
        blanks: [[used to]]
      - id: take
        type: multipleChoice
        prompt: I usually ___ a deep breath when I feel stressed.
        options:
          - { text: take, correct: true }
          - {
              text: took,
              feedback: '*Usually* shows a routine now, so use the present simple: *take*.',
            }
          - {
              text: am taking,
              feedback: 'For routines and things that happen regularly, use the present simple: *I usually take…*',
            }
      - id: tenses
        type: matching
        prompt: Match each sentence with what it shows.
        pairs:
          - [I felt extremely anxious before my final exam., a finished past experience]
          - [I used to drink coffee every night., a past habit that is not true now]
          - [I usually meditate in the morning., a routine now]
          - [Next year I am going to try a meditation workshop., a future plan]
          - ['If I lived near the sea, I would feel calmer.', an imaginary situation]
      - id: were
        type: fillBlank
        prompt: Use the verb *be* for an imaginary situation.
        text: If modern life ___ less fast-paced, people would experience less stress.
        blanks: [[were, was]]
      - id: would-become
        type: multipleChoice
        prompt: If adults practiced mindfulness regularly, they ___ more emotionally resilient.
        options:
          - { text: would become, correct: true }
          - {
              text: will become,
              feedback: 'In the second conditional, the result uses *would* + base verb: *would become*.',
            }
          - {
              text: became,
              feedback: 'The *if* part has the past simple; the result part needs *would*: *would become*.',
            }
      - id: lives-there
        type: trueFalse
        prompt: '*If I lived near the mountains, I would be more patient.* The speaker lives near the mountains.'
        answer: false
        feedback:
          correct: Right! The second conditional is imaginary. The speaker doesn't live near the mountains.
          incorrect: "The second conditional talks about an imaginary situation. The speaker doesn't live near the mountains now."
      - id: order-meditation
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I am going to try meditation next week.
