# Cycle "Mindfulness & Relaxation", converted from the English level 3
# digital notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-level-3
slug: mindfulness-and-relaxation
title: Mindfulness and Relaxation
goal: Describe places and feelings with strong adjectives and tell stories across tenses, including the second conditional.
position: 17
status: published

review:
  - >-
    The two workbook exercises ("Adjectives" and "Narrative tenses") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's summary
    rules, the activity examples and the vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    The source lists three skills (second conditional, adjectives, narrative building
    across tenses). All three are kept in the class and the summary. The workbook has
    two exercises: adjectives, and narrative tenses, which includes three second
    conditional items. The second conditional already has its own exercise in cycle 16
    (Artificial Intelligence). Please say if you want a separate one here.
  - >-
    Activity 3, Step 3: "If you would react in a different way (fight, flight,
    freeze), how would this benefit you?" has *would* in the if-clause, which is
    wrong. It now reads "If you reacted to stress in a different way (not with fight,
    flight or freeze), how would this benefit you?". Please confirm the meaning.
  - >-
    Activity 4, first brainstorm question ("If you had experienced… how would your
    reactions have been different?") and the homework "what would have been different
    if you participated at another time" are about the past, so they are the THIRD
    conditional, not the second. The activity question is kept and marked as third
    conditional in a teacher note; the homework sentence was corrected to "if you had
    done it at another time in your life".
  - >-
    Summary, narrative tenses: the source text was copied from a networking/career
    cycle ("different experiences in your career", "talk about your job now", "in a
    networking situation… stay within 2 minutes… sound professional"). It was
    rewritten for this topic: past for experiences, present for routines, future for
    goals, and mixed tenses to tell a clear story (present → past → future or
    imagined result). "Future: want to / going to / will" is kept; a note says *want
    to* is a way to talk about goals, not a future tense.
  - >-
    Summary, second conditional: "imagining something unreal or possible in the
    present or future" → "unreal or unlikely". "Predictions about possible results"
    is kept as "possible results of an imagined change". The example "If relaxation
    techniques were mandatory, some teenagers might feel uncomfortable" uses *might*;
    a line now explains that *might* and *could* can replace *would*.
  - >-
    The adjective upgrade table appears twice (Activity 2 and the summary). It is
    kept in both places because the activity uses it in class; the summary copy is
    the reference.
  - >-
    Links: the "Photos of relaxing places" presentation is on gamma.app, which is not
    on the link allow-list, so it was removed and mentioned in a teacher note. The
    Quizlet links were kept without their "?i=…&x=…" parameters. The YouTube links
    are kept as they are.
  - >-
    Small corrections: "not only 'calm', 'good', 'nice)" → closed quote; broken bold and stray asterisks in the summary and the Activity 3 heading
    were removed; "Step 3" questions were lightly edited for B1 wording ("systematically
    applied" → "regularly used", "built into daily life" → "part of daily life"). "Answer of student 1/2/3" lines were removed (the platform has
    answer boxes).
  - >-
    Homework: the main Mori message and the two interactive activities are kept as
    three messages. The quotation marks inside the messages were simplified.
  - >-
    Vocabulary: the source table has English definitions, which the vocabulary block
    cannot hold, so only the Hebrew glosses are kept. "Re-wire (your brain)" →
    "Rewire (your brain)" (usual spelling). "Present-moment" was kept as in the
    source; it is used before a noun (present-moment awareness).
  - >-
    The source gives no times for the activities, so no minutes were added. The
    "Level: 3 (extreme)" line was left out.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: mindfulness-and-relaxation-class
    title: 'Class: Mindfulness and Relaxation'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Mindfulness and Relaxation
      - id: skills
        type: cycleOverview
        skills:
          - name: Adjectives
            description: Strong, precise adjectives for feelings and places (*serene, overwhelming, restorative*)
          - name: Narrative tenses
            description: Tell a story across tenses, from the past to now and the future (*Two years ago I spent a week in the mountains…*)
          - name: Second conditional
            description: Imagined changes and their results (*If I lived near the mountains, I would be more patient.*)
      - id: quizlet-he
        type: externalLink
        label: Mindfulness and Relaxation on Quizlet (English–Hebrew)
        url: https://quizlet.com/il/1143133221/mindfulness-relaxation-english-hebrew-flash-cards/
      - id: quizlet-def
        type: externalLink
        label: Mindfulness and Relaxation on Quizlet (English–definition)
        url: https://quizlet.com/il/1143118631/mindfulness-relaxation-english-definition-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        prompt: Say your name and where you would like to be right now.
        frame: I am ___. If I could be in a relaxing place right now, I would be ___.
        example: I am Amit. If I could be in a relaxing place right now, I would be in India, meditating.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup-tip
        type: callout
        tone: tip
        text: Answer in full sentences. Use conditionals (*If I…, I would…*) and adjectives.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Think about a time when you felt truly relaxed. What made the situation calm or peaceful? Describe the atmosphere.
            frame: I felt truly relaxed when… The atmosphere was…
          - question: Some people say the city can be stimulating but exhausting, while nature is peaceful but isolating. Which environment do you find more restorative, and why? Try to contrast the two.
            frame: I find… more restorative because… while…
          - question: In your opinion, what makes an activity genuinely relaxing rather than just entertaining?
            frame: An activity is genuinely relaxing when…
          - question: If you had to design the perfect "stress-free day" for a busy professional, what would it include?
            frame: The perfect stress-free day would include…
          - question: What role does technology play in modern stress?
            frame: Technology makes us feel… because…
          - question: If you had to give up one daily habit to feel calmer, what would it be, and how would your routine change?
            frame: If I gave up…, my routine would…
          - question: Do you or someone you know practice mindfulness? What have you heard about the benefits of this practice?
            frame: I have heard that mindfulness…
          - question: If you could relive one relaxing moment from the past year, which one would you choose?
            frame: If I could relive one moment, I would choose…
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: The place that changes you'
        skills: [Narrative tenses, Adjectives]
        steps:
          - 'Look at the pictures of calm places in nature and in the city. Go over the list of adjectives and find better words than *calm, good* and *nice*.'
          - Answer the questions about the pictures below.
          - Write a mini sensory story about one of the pictures, or about a place that makes you relaxed. Use strong adjectives, and look them up if you need to. Follow the format below.
          - In pairs or breakout rooms, tell your story. The others listen and ask a follow-up question.
          - As a class, say one interesting descriptive thing about another student's story.
        example: |-
          *Two years ago, I spent a week in the mountains. At first, the silence felt intimidating and almost oppressive. But after a few days, the atmosphere became grounding and liberating.*
          *Now, when I think about that experience, I notice my breathing is slowing down.*
          *Next year, I hope to return there to escape the constant digital noise.*
          *If I lived near the mountains, I would probably become more patient and emotionally balanced.*
      - id: act1-pictures
        type: discussionQuestions
        title: Look at the pictures
        items:
          - question: Which place feels the most restorative? Why?
            frame: The most restorative place is… because…
          - question: Which place might look peaceful but actually feel uncomfortable?
            frame: … looks peaceful, but it might feel…
          - question: Which place would be calming for some people but stressful for others?
            frame: … would be calming for…, but stressful for…
      - id: act1-story
        type: discussionQuestions
        title: My sensory story
        items:
          - question: '1. Past story (3–4 sentences): describe a real or imagined memory in that place.'
            frame: Two years ago, I… At first, it felt… But after…
          - question: '2. Present reflection (2–3 sentences): how does thinking about this place affect you now?'
            frame: Now, when I think about it, I…
          - question: '3. Future intention (2 sentences): what would you like to experience there?'
            frame: Next year, I hope to… / I want to…
          - question: '4. Second conditional (2 sentences): if this place were part of your daily life, how would it change you?'
            frame: If I lived near…, I would…
      - id: act1-reflection
        type: discussionQuestions
        title: Class reflection
        items:
          - question: Which adjectives were overused?
          - question: Which descriptions sounded vivid or cinematic?
          - question: Which conditional ideas felt realistic, and which felt idealistic?
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Activity 2: A mindfulness-friendly workspace'
        skills: [Adjectives, Second conditional]
        steps:
          - 'You have been hired to design a mindfulness-friendly workspace for professionals who feel stressed and distracted. First, go over common adjectives and learn how to upgrade them (table below).'
          - 'In breakout rooms, plan the workspace. The space must reduce stress, improve focus, feel calming but not boring, and work for 20 employees. Use the second conditional when you plan and debate.'
          - Write a short prompt for an AI image generator so it can create a picture of your workspace.
          - 'Each group presents its prompt and AI image. The class responds: *If you worked there every day, how would your behavior change?*'
          - 'Class revision: Did the image match the adjectives? What details were missing? How could the prompt be improved?'
        example: |-
          *If the lighting were too bright, people would feel tense.*
          *Please generate a picture of a serene, minimalist workspace filled with soft natural light, warm wooden furniture, large leafy plants and sound-absorbing walls. The atmosphere is tranquil, airy and restorative. There are comfortable ergonomic chairs, neutral earthy tones and a quiet meditation corner with textured cushions. The space feels spacious yet cozy, balanced and harmonious.*
      - id: act2-upgrade
        type: table
        caption: Upgrade your adjectives
        header: [Weak, Upgrade]
        rows:
          - [nice, soothing / harmonious]
          - [good, functional / efficient]
          - [calm, tranquil / serene / restorative]
          - [bright, softly illuminated / sun-drenched]
          - [modern, minimalist / sleek / contemporary]
      - id: act2-plan
        type: discussionQuestions
        title: Plan your workspace
        items:
          - question: 'Lighting (natural? warm? dim?)'
            frame: The lighting would be… If it were…, people would feel…
          - question: Colors
            frame: We would use… colors because…
          - question: 'Materials (wood? glass? plants?)'
            frame: We would choose… because…
          - question: Sound environment
            frame: The space would sound…
          - question: Furniture layout
            frame: The furniture would be…
          - question: Working conditions
            frame: Employees would…
          - question: One unique mindfulness feature
            frame: Our special feature would be…
          - question: 'Our AI image prompt: ___'
            frame: Please generate a picture of a… workspace with…
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Activity 3: Mindfulness in action'
        skills: [Adjectives, Second conditional, Narrative tenses]
        steps:
          - 'Class brainstorm: What does the word *mindfulness* mean to you right now? Think of a time when you felt stressed. What usually helps you calm down?'
          - Watch the short video about what mindfulness is. Then answer the questions about the video.
          - In breakout rooms, talk about mindfulness in real-life and imaginary situations.
          - Each student shares something from the conversation. The class answers the last two questions together.
        resource:
          label: 'What Is Mindfulness? (The Mindfulness Toolkit)'
          url: https://www.youtube.com/watch?v=kO5I0p3IuiQ
      - id: act3-brainstorm
        type: discussionQuestions
        title: Class brainstorm
        items:
          - question: What does the word *mindfulness* mean to you right now?
            frame: To me, mindfulness means…
          - question: Think of a time when you felt stressed. What usually helps you calm down?
            frame: When I felt stressed…, … helped me. Usually, I…
      - id: act3-video
        type: discussionQuestions
        title: After the video
        items:
          - question: What words did the video use to describe fear and anxiety?
          - question: How can mindfulness help people *think differently*, according to the video?
          - question: What is one example of a mindful choice everyone could make?
      - id: act3-groups
        type: discussionQuestions
        title: Talk in groups
        items:
          - question: If someone you knew was always rushing and stressed, what would you recommend they do to be more mindful?
            frame: If my friend were always stressed, I would recommend…
          - question: If you reacted to stress in a different way (not with fight, flight or freeze), how would this benefit you?
            frame: If I reacted more calmly, I would…
          - question: What sensations in your body could you notice to be more relaxed in your daily life?
            frame: I could notice…
          - question: If you could choose a daily activity to do in a more mindful way, what would it be and why?
            frame: If I could choose, I would… mindfully because…
      - id: act3-class
        type: discussionQuestions
        title: Class revision
        items:
          - question: If everyone practiced mindfulness regularly, how might schools or workplaces change?
            frame: If everyone practiced mindfulness, schools might…
          - question: What might be a disadvantage of trying to be mindful all the time?
            frame: One disadvantage might be…
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Activity 4: Mindfulness for all?'
        skills: [Narrative tenses, Second conditional]
        steps:
          - "Read the text below. Then the class splits into two groups. **Group 1:** Everyone can benefit from learning mindfulness; breathing exercises should be introduced before exams. **Group 2:** Mindfulness is a personal choice and isn't suitable for everyone; breathing exercises should not be mandatory."
          - "Brainstorm in your group. Find points that support your side, even if you don't fully agree with it. Use reasons and examples from your own life."
          - '**Rule:** every argument must include an adjective and a personal example or a sentence in the second conditional.'
          - 'Debate! Each group gives one argument at a time: Group 1 gives an argument, Group 2 responds; Group 2 gives an argument, Group 1 responds.'
          - Finish with the class discussion questions below.
        example: |-
          *If schools introduced breathing exercises, students would feel calmer and more focused.*
          *When I was at school, I felt extremely anxious before exams.*
      - id: act4-text
        type: text
        text: >-
          In recent years, exam stress among students has increased significantly. Many
          educators report that students feel anxious, distracted and emotionally
          overwhelmed before important tests. As a result, some schools around the world
          have begun introducing short breathing or mindfulness exercises before exams.
          Supporters argue that these practices help students feel calmer, more focused
          and mentally prepared. However, critics believe that mindfulness should remain a
          personal choice and may not be effective or comfortable for everyone. The
          question is whether schools should actively promote these techniques or leave
          stress management entirely to individual students.
      - id: act4-brainstorm
        type: discussionQuestions
        title: Brainstorm in groups
        items:
          - question: If you had experienced regular mindfulness exercises throughout your school years, how would your reactions to stressful exams have been different? How would your behavior, emotions or performance have changed?
            frame: If I had practiced mindfulness at school, I would have felt…
          - question: If mindfulness practices were a daily routine in schools, what kind of classroom atmosphere would develop over time? Would it become calmer and more emotionally balanced, or artificial and uncomfortable? Use vivid adjectives.
            frame: If mindfulness were a daily routine, the classroom would feel…
          - question: If schools regularly used mindfulness techniques in high-pressure situations (exams, conflicts, presentations), how might this change students' long-term ability to handle stress on their own?
            frame: If schools used these techniques, students might…
      - id: act4-discussion
        type: discussionQuestions
        title: Class discussion
        items:
          - question: If modern life suddenly became slower and less competitive, would people actually feel more relaxed, or would they find new reasons to feel stressed? Why?
            frame: If life became slower, people would…
          - question: Some people say relaxation must be "earned" after hard work. Others believe it should be part of daily life. What do you think?
            frame: I think relaxation should… because…
          - question: How would mindfulness taught at school affect workplaces in the future, when the students grow up?
            frame: If students learned mindfulness at school, workplaces would…
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Three skills this cycle: **adjectives** (Activities 1, 2 and 3), **narrative
          tenses** (Activities 1 and 4) and the **second conditional** (introduction
          round, warm-up, Activities 1–4). The source gives no timings.
      - id: n-warmup
        anchor: warmup-title
        text: >-
          Pick from the 8 questions. Make sure students answer in full sentences and use
          conditionals and adjectives. If students don't feel comfortable talking about
          real experiences, they can make something up, as long as they speak English.
      - id: n-act1
        anchor: act1
        text: >-
          The pictures and the adjective list are on the notebook's gamma.app page
          (gamma.app/docs/Mindfulness-Relxation-L3-fo6kmxsl0y16e1d), which is not on the
          link allow-list. Share it on screen, or show your own pictures of calm places
          in nature and in the city. Encourage students to go beyond *calm, good, nice*.
      - id: n-act3
        anchor: act3
        text: After the video, check understanding with the comprehension questions before the group conversation. Correct common mistakes in the class revision.
      - id: n-act4
        anchor: act4
        text: >-
          The first brainstorm question is about the past (*If you had experienced…,
          how would… have been different?*), so it is the **third conditional**, not
          the second. Accept simple answers, and model one: *If I had practiced
          mindfulness at school, I would have felt calmer before exams.*

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: mindfulness-and-relaxation-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-adjectives
        type: ruleSummary
        skill: Adjectives
        rules:
          - text: 'We use **adjectives** to describe how people feel, what a place is like, and the atmosphere of a situation. They help us explain emotions clearly and precisely.'
          - text: '**After *be*** (*am, is, are, was, were*):'
            examples:
              [
                The classroom was peaceful after the breathing exercise.,
                I am more focused when the room is quiet.,
              ]
          - text: '**After verbs like** *feel, seem, look, sound, become*:'
            examples: [He became less anxious., The situation looks overwhelming.]
          - text: '**Before a noun:**'
            examples: [a chaotic environment]
          - text: '**Make adjectives stronger** with adverbs (intensifiers): *very, really, extremely, surprisingly, deeply, incredibly*.'
            examples: [I felt extremely anxious before my exam.]
          - text: '**Upgrade your adjectives:** use richer words so you sound interesting, not basic (see the table).'
      - id: upgrade-table
        type: table
        caption: Upgrade your adjectives
        header: [Weak, Upgrade]
        rows:
          - [nice, soothing / harmonious]
          - [good, functional / efficient]
          - [calm, tranquil / serene / restorative]
          - [bright, softly illuminated / sun-drenched]
          - [modern, minimalist / sleek / contemporary]
      - id: rules-narrative
        type: ruleSummary
        skill: Narrative tenses
        rules:
          - text: '**Past simple:** finished actions and experiences. The action is finished; the time is not now.'
            examples: [I felt extremely anxious before my final exam.]
          - text: '**Past habits** (*used to*, *when I was…*): things that were true before but are not true now. Talk about how life was before.'
            examples: [Students used to accept stress as normal.]
          - text: '**Present simple:** your life and routines now. What is true today and what happens regularly.'
            examples: [I usually take a deep breath when I feel stressed.]
          - text: "**Future** (*going to, will*) and **goals** (*want to, hope to*): plans and intentions, something that hasn't happened yet."
            examples:
              [
                I want to develop better stress-management habits.,
                Next year I am going to try a meditation workshop.,
              ]
          - text: '**Mixed tenses:** to tell a clear story, start with the **present** (how things are now), move to the **past** (an experience), and finish with the **future** or an **imagined result** (second conditional). Choose one main example and connect your ideas smoothly.'
            examples:
              [
                "Many students feel overwhelmed before exams. In the past, students didn't talk openly about anxiety. If schools introduced breathing exercises, stress levels would decrease.",
              ]
      - id: rules-conditional
        type: ruleSummary
        skill: Second conditional
        rules:
          - text: 'We use the **second conditional** for unreal or imaginary situations in the present, imaginary changes in society or schools, possible results of an imagined change, and alternative realities (*What would happen if…?*).'
          - text: '**Form:** *If* + past simple, *would* + base verb.'
            examples:
              [
                'If adults practiced mindfulness regularly, they would become more emotionally resilient.',
              ]
          - text: 'We can use **might** or **could** instead of *would* when the result is less certain or is a possibility.'
            examples:
              ['If relaxation techniques were mandatory, some teenagers might feel uncomfortable.']
          - text: 'We use the **past simple** after *if*, but we are **not talking about the past**. We imagine something unreal or unlikely, now or in the future.'
          - text: 'We often use **were** instead of *was* with all subjects.'
            examples:
              ['If modern life were less fast-paced, people would experience less chronic stress.']
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through the three skills with the group and ask for one new example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: mindfulness-and-relaxation-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Message 1: A conversation in four parts'
        message: |-
          Hi Mori. I want to practice speaking about mindfulness and relaxation, so please have a structured conversation with me in four parts.
          First, ask me about a stressful situation I experienced in the past and follow up with questions about how I felt and how I reacted, encouraging me to use strong adjectives and narrative tenses.
          Then, ask me how I usually relax today and what habits help me feel calm, and challenge me to explain why these habits are effective.
          After that, ask me at least three thoughtful hypothetical questions about mindfulness and relaxation using the second conditional (for example, "If…, what would…?"). Please make the questions analytical and push me to give detailed answers rather than short responses.
          At the end, correct my main grammar mistakes, suggest stronger adjectives, and rewrite one of my sentences in a more advanced way.
      - id: task2-title
        type: heading
        level: 3
        text: 'Activity 1: Mindfulness and what it makes me feel'
      - id: task2-text
        type: text
        text: >-
          Watch the short mindfulness video and take part in the practice. Think about
          what it made you feel, and what would have been different if you had done it at
          another time in your life.
      - id: task2-video
        type: externalLink
        label: 'Headspace: Mini meditation, Breathe'
        url: https://www.youtube.com/watch?v=cEqZthCaMpo
      - id: mori-2
        type: aiTutorPrompt
        title: 'Message 2: My mindfulness experience'
        message: |-
          Hi Mori. I watched a short mindfulness video and practiced the exercise, and I'd like to talk about my experience using narrative tenses, strong adjectives and the second conditional.
          Please ask me to describe what I did and how I felt before, during and after the practice, and encourage me to use detailed emotional and sensory language.
          Then ask me how this experience compares to how I usually react to stress, using past forms like "used to" and the past simple.
          After that, ask me two hypothetical questions about how my life would change if I practiced mindfulness regularly.
          Finally, correct my main grammar mistakes, suggest stronger adjectives, and rewrite one of my sentences in a more advanced way.
      - id: task2-tips
        type: callout
        tone: tip
        title: "Don't forget to…"
        text: |-
          Try to be present in the exercise, not cynical.
          Explain exactly what you feel with the right adjectives.
          Add adverbs to make your adjectives stronger (*deeply relaxed, extremely tense*).
      - id: task3-title
        type: heading
        level: 3
        text: 'Activity 2: "What if" relaxing challenge'
      - id: task3-text
        type: text
        text: >-
          You and Mori take turns asking each other "What if you were in…?", and each
          time you choose a different environment: for example, a silent forest at night,
          a noisy open office, or a completely digital-free house. After each question,
          the other person answers with the second conditional and describes how they
          would feel with a new, specific adjective. You can't use the same adjective
          twice!
      - id: mori-3
        type: aiTutorPrompt
        title: 'Message 3: The "What if" game'
        message: |-
          Hi Mori. Let's play a "What if" game to practice the second conditional.
          Please ask me "What if you were in…?" about different environments, and I will answer using "If I were…, I would feel…" with a strong adjective and a short explanation. We cannot repeat the same adjective twice.
          After three questions from you, I will ask you three, and at the end, please correct my grammar and suggest stronger adjectives if needed.
      - id: task3-tips
        type: callout
        tone: tip
        title: "Don't forget to…"
        text: |-
          Think of interesting places for the "What if" questions.
          Upgrade your adjectives.
          Add a personal experience, if you have one.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: mindfulness-and-relaxation-practice
    book: workbook
    title: 'Practice: Mindfulness and Relaxation'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the skills of this cycle on your own. Each answer is checked right away, and you can try again.
      - id: ex-adjectives
        type: activity
        activity: mindfulness-and-relaxation-adjectives
      - id: ex-narrative
        type: activity
        activity: mindfulness-and-relaxation-narrative

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: mindfulness-and-relaxation-vocabulary
    title: Vocabulary
    phase: review
    blocks:
      - id: words
        type: vocabulary
