activities:
  - slug: artificial-intelligence-conditional
    title: 'Second conditional: If AI replaced drivers…'
    minutes: 8
    items:
      - id: replaced
        type: multipleChoice
        prompt: If AI ___ most office jobs, many people would need new skills.
        options:
          - { text: replaced, correct: true }
          - {
              text: replaces,
              feedback: 'This is an imaginary situation, so after *if* we use the past simple: *replaced*.',
            }
          - {
              text: would replace,
              feedback: "We don't use *would* after *if*. Use the past simple: *If AI replaced…*",
            }
      - id: were-ceo
        type: fillBlank
        prompt: Use the verb *be* the way we learned for imaginary situations.
        text: If I ___ a CEO, I would invest in AI development.
        blanks: [[were, was]]
      - id: would-lose
        type: fillBlank
        prompt: Use *would* and the verb *lose*.
        text: If AI controlled our phones, we ___ our privacy.
        blanks: [[would lose]]
      - id: not-past
        type: trueFalse
        prompt: 'In *If AI became more intelligent than humans, society would change*, the past simple *became* talks about the past.'
        answer: false
        feedback:
          correct: Right! The past simple after *if* shows an imaginary situation in the present or the future.
          incorrect: 'We use the past simple after *if*, but we are not talking about the past. It is an imaginary situation now or in the future.'
      - id: might
        type: multipleChoice
        prompt: 'If AI controlled social media, misinformation ___ increase. (We are not sure about the result.)'
        options:
          - { text: might, correct: true }
          - {
              text: would,
              feedback: '*Would* shows the expected or most likely result. For a less certain result, use *might*.',
            }
          - {
              text: will,
              feedback: '*Will* is not used in the second conditional. Use *would*, *could* or *might*.',
            }
      - id: results
        type: matching
        prompt: Match each *if* part with the best result.
        pairs:
          - [If AI replaced drivers…, …unemployment would increase.]
          - [If AI analyzed medical data faster…, …doctors could save more lives.]
          - [If I were the Minister of Education…, …I would introduce AI lessons.]
          - [If schools banned AI completely…, …students would use it at home.]
      - id: correct-sentence
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: 'If I had more time, I would learn about AI.', correct: true }
          - {
              text: 'If I would have more time, I would learn about AI.',
              feedback: "Don't use *would* after *if*. Use the past simple: *If I had more time…*",
            }
          - {
              text: 'If I have more time, I would learn about AI.',
              feedback: 'For an imaginary situation, use the past simple after *if*: *had*, not *have*.',
            }
      - id: order-what-would
        type: reorderSentence
        prompt: Put the words in order.
        sentence: What would you do if AI replaced your job?

  - slug: artificial-intelligence-future
    title: 'Future: will or going to?'
    minutes: 8
    items:
      - id: promise
        type: multipleChoice
        prompt: "Don't worry, I ___ how this tool works. (a promise)"
        options:
          - { text: will explain, correct: true }
          - {
              text: explain,
              feedback: 'For a promise about the future, use *will* + base verb: *I will explain*.',
            }
          - {
              text: explained,
              feedback: '*Explained* is the past. A promise is about the future: *I will explain*.',
            }
      - id: plan
        type: multipleChoice
        prompt: Our school decided last month. It ___ introduce AI lessons next year.
        options:
          - { text: is going to, correct: true }
          - { text: going to, feedback: "Don't forget *be*: *It is going to introduce…*" }
          - {
              text: is go to,
              feedback: 'The form is *be* + *going to* + base verb: *It is going to introduce…*',
            }
      - id: will-plans
        type: trueFalse
        prompt: We use *will* for plans that we made before we speak.
        answer: false
        feedback:
          correct: 'Right! For plans made before, use *going to*: *We are going to train teachers.*'
          incorrect: 'For plans made before, use *going to*. *Will* is for predictions, promises and quick decisions.'
      - id: uses
        type: matching
        prompt: Match each sentence with its use.
        pairs:
          - [AI will become an essential skill in most careers., a prediction]
          - ["Don't worry, I will help you with this tool.", a promise]
          - ["That's a good point. I'll change my opinion.", a spontaneous decision]
          - [We are going to train teachers next month., a plan made before]
      - id: is-going-to
        type: fillBlank
        prompt: Use *going to* and the verb *regulate*.
        text: The new law is ready. The government ___ AI in classrooms next year.
        blanks: [[is going to regulate]]
      - id: wont-replace
        type: fillBlank
        prompt: Write a negative prediction with *will* and the verb *replace*.
        text: I think AI ___ all teachers. Students need people.
        blanks: [["won't replace", will not replace]]
      - id: plan-result
        type: multipleChoice
        prompt: Which sentence follows the rule "going to for the plan, will for the result"?
        options:
          - {
              text: 'Schools are going to teach AI literacy, and this will prepare students for future jobs.',
              correct: true,
            }
          - {
              text: 'Schools will teach AI literacy, and this is going to prepare students for future jobs.',
              feedback: 'Start with *going to* for the plan, then use *will* for the result.',
            }
          - {
              text: 'Schools going to teach AI literacy, and this will prepare students for future jobs.',
              feedback: "Don't forget *are*: *Schools are going to teach…*",
            }
      - id: order-explain
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I will explain how this tool works.
