# Cycle "Identity and Community", converted from the English level 3 digital
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-level-3
slug: identity-and-community
title: Identity and Community
goal: Talk about identity and community with the second conditional and comparisons.
position: 18
status: published

review:
  - >-
    The two workbook exercises ("Second conditional" and "Comparisons") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's summary
    rules, examples and vocabulary. Please check level, wording and every right answer
    before students see them.
  - >-
    The source lists three skills: (1) second conditional, (2) comparisons and (3)
    narrative building across multiple tenses. All three are kept in the skills overview
    and the summary, but the goal and the two workbook exercises cover the second
    conditional and comparisons only (the platform pattern is two skills and two
    exercises per cycle). Please confirm, or ask for a third exercise on narrative tenses.
  - >-
    Summary, narrative tenses: the source says "use different types of past tense to talk
    about different experiences in your career", and the mixed-tenses rule talks about "a
    networking situation" and staying "within 2 minutes". These lines seem copied from a
    networking/career cycle; they were rewritten for identity and life stories. Activity 3
    asks for the past continuous and the past perfect, which the summary did not cover, so
    one short rule with an example was added for each. Please confirm.
  - >-
    Summary, second conditional: "Predictions about possible results" → "The imagined
    result of an unreal situation"; "Imaginary changes in society or schools" → "Imaginary
    changes in society or in a community"; "something unreal or possible" → "something
    unreal or unlikely". The examples use "If I were to + verb"; a note was added that
    this is a more formal form of the same conditional. A note was added that "was" is also
    heard in informal speech (If I was…).
  - >-
    Summary, comparisons table: "more than / less than" → "more … than / less … than";
    "less" and "least" were marked as working with adjectives of any length; a rule was
    added that superlatives take "the" (the strongest, the most influential).
  - >-
    Activity 2, Step 2: the list "They must find: Find one similarity…" was cleaned up, and
    "What would change if they were to switch between one identity element?" → "What would
    change if you switched one identity element with your partner?". The speed-date time
    "4-6 minutes" is recorded as 6 minutes.
  - >-
    Activity 5: the source mixes "Group 1 / Group 2" and "Group A / Group B"; it now uses
    Group 1 and Group 2 throughout. "Class revision" / "Class sharing and revising" →
    "Class review" in all activities.
  - >-
    Small corrections: "past 5-10 years" → "past 5–10 years"; a stray character ("ð")
    after the warm-up instructions was removed; "If I were a part of" → "If I were part
    of"; "Narrative Tense" → "Narrative tenses"; "I used to be a Taylor Swift fan and went
    to every fan meeting" → "…and I went to every fan event". The level note "3
    (extreme)" and the empty Date / Participants lines were left out.
  - >-
    The warm-up questions in the source have no sentence frames; short frames using the
    second conditional and comparisons were added. Please check them.
  - >-
    The source gives no activity times, so no minutes were added except the speed date.
    The "Answer of student 1/2/3" lines are replaced by the answer boxes. Teacher-only
    instructions (picking from the 8 warm-up questions, the community information in
    Activity 4, encouraging students to use AI or Mori in Activity 3) moved to teacher
    notes.
  - >-
    Both Quizlet links are kept without their tracking parameters (?i=…&x=…). The
    vocabulary block keeps the Hebrew glosses; the English definitions from the source are
    kept in a table under it. Glosses changed: Inclusion "הכללה" → "הכלה"; Individual
    "יחיד" → "פרט / יחיד".

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: identity-and-community-class
    title: 'Class: Identity and Community'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Identity and Community
      - id: skills
        type: cycleOverview
        skills:
          - name: Second conditional
            description: Unreal or imaginary situations (*If I moved to another country, I would miss my friends.*)
          - name: Comparisons
            description: '*more … than, -er, as … as, the most, the -est* (*A small community is often stronger than a large one.*)'
          - name: Narrative tenses
            description: Telling a story across several tenses (past simple, past continuous, past perfect, present and future)
      - id: quizlet-translation
        type: externalLink
        label: Identity and Community on Quizlet (English + translation)
        url: https://quizlet.com/il/1144388375/identity-and-community-english-translation-flash-cards/
      - id: quizlet-definition
        type: externalLink
        label: Identity and Community on Quizlet (English + definition)
        url: https://quizlet.com/il/1144387949/identity-and-community-english-definition-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: My name is ___. As a grown-up, I am more ___ than I was when I was a child.
        example: My name is Dana. As a grown-up, I am more patient than I was when I was a child.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: Besides your name and nationality, what is one part of your identity that really shapes who you are today? Give an example from your life.
            frame: One part of my identity that shapes who I am is ___. For example, ___.
          - question: If you had to describe yourself without mentioning your job or family, how would you define your identity?
            frame: If I had to describe myself without my job or family, I would say that I am ___.
          - question: Think about a moment when you strongly felt "this is who I am." What happened? What did you learn about yourself?
            frame: I felt "this is who I am" when ___. I learned that I ___.
          - question: Has your identity changed in the past 5–10 years? What exactly changed – your values, priorities, lifestyle, beliefs? What caused this change?
            frame: Yes, my ___ changed. Today I am more / less ___ than I was, because ___.
          - question: Do you feel different when you are with different communities (for example, family vs. colleagues vs. friends)? In what way does your behavior or personality change?
            frame: With my ___, I am more ___ than I am with my ___.
          - question: Are you more similar to your parents or more different from them? In what ways are you similar or different?
            frame: I am as ___ as my mother / father, but I am more ___ than her / him.
          - question: Do you feel as comfortable expressing your true opinions at work as you do with close friends? Why or why not?
            frame: I feel more / less comfortable at work than with my friends, because ___.
          - question: If you moved to another country tomorrow, which part of your identity would stay the same, and which part would probably change?
            frame: If I moved to another country, my ___ would stay the same, but my ___ would probably change.
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: My role in communities'
        skills: [Comparisons, Narrative tenses, Second conditional]
        steps:
          - '**Class brainstorm.** What roles do different people usually play in groups, and why? (*leader, listener, organizer, supporter, mediator*)'
          - '**Community building.** In breakout rooms, your group builds a new community and imagines what life will be like there. Choose one of the communities below and decide on the points in the list.'
          - "**Hypothetical thinking.** Each student says what role they would have in the community, and why. Then choose a role you probably wouldn't have, and explain why with a comparison."
          - '**Class review.** Each group presents its community and the roles in it. Then discuss the questions below.'
        example: '*If I were part of the "Therapists for a Change" community, I would be the spokesperson because I have experience in writing speeches to the press. I wouldn''t be the treasurer because I am less responsible with money than I am with my words.*'
      - id: act1-communities
        type: table
        caption: Choose a community, then decide…
        header: [Communities, Decide on]
        rows:
          - [A hobby-based group, The main purpose]
          - [A community moving to Mars, Who can join]
          - [An environmental community, Important values]
          - [
              A religious community (a made-up religion!),
              What makes people feel that they belong there?,
            ]
          - [
              '',
              'What roles exist in the community? (*leader, strategist, mediator, critic, creative mind…*)',
            ]
      - id: act1-roles
        type: discussionQuestions
        title: My role
        items:
          - question: 'The role I would have:'
            frame: If I were part of the ___ community, I would be the ___ because ___.
          - question: "A role I wouldn't have:"
            frame: I wouldn't be the ___ because I am less / more ___ than ___.
      - id: act1-review
        type: discussionQuestions
        title: Class review
        items:
          - question: Which community seems more inclusive?
          - question: Which one is more sustainable long-term?
          - question: Which one would create the strongest sense of identity?
          - question: Which community has clearer roles?
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Activity 2: Speed identity'
        skills: [Comparisons, Second conditional]
        steps:
          - '**My identity.** On your own, think of 5 identity elements that describe you and write them down.'
          - '**Speed date.** Meet a partner for 6 minutes and present your identity elements. Together, find one similarity and one difference, ask one "why" question, and say what would change if you switched one identity element with your partner.'
          - "**Class review.** Present 2 of your identity elements, 1 comparison with your partner, and 1 identity element that you would / wouldn't take if your partner offered it."
        example: '*Examples of identity elements: creative, analytical, Israeli, problem-solver, introvert, athlete.*'
      - id: act2-elements
        type: discussionQuestions
        title: My identity elements
        items:
          - question: 'My 5 identity elements: ___'
          - question: 'One similarity:'
            frame: We are both ___. / I am as ___ as my partner.
          - question: 'One difference:'
            frame: I am more ___ than my partner, but she / he is ___er than me.
          - question: 'If we switched:'
            frame: If I were ___ like my partner, I would ___.
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Activity 3: What would happen today?'
        skills: [Narrative tenses, Second conditional]
        steps:
          - '**Choose the experience.** On your own, choose an important experience that influenced your life: a career decision, a moment in your military service, a trip, a success or failure, a relationship, a course of study, a move to a new city, or a risk.'
          - '**Tell the story.** Write what happened: 2 sentences in the **past simple**, 1 in the **past continuous**, 1 in the **past perfect** and 1 sentence about your feelings. Use the structure guide below.'
          - "**What would happen today?** Share your experience with the class and say what your life would be like today if this experience didn't exist."
          - '**Class discussion.** Discuss the questions below.'
      - id: act3-guide
        type: discussionQuestions
        title: Structure guide
        items:
          - question: When did it happen?
          - question: What was happening at the time?
            frame: I was ___ing when ___.
          - question: What had happened before that?
            frame: Before that, I had ___.
          - question: What exactly happened?
          - question: How did you feel?
          - question: What changed afterward?
      - id: act3-today
        type: discussionQuestions
        title: What would happen today?
        items:
          - question: If this experience didn't exist in my life, I would ___.
          - question: I would be more / less ___ because ___.
          - question: I would probably ___ at work / in my community.
          - question: If this part of my identity were different, I would ___.
          - question: My life would be completely different because ___.
      - id: act3-discussion
        type: discussionQuestions
        title: Class discussion
        items:
          - question: How do early life experiences influence a person's identity later in life?
          - question: Do you think identity is shaped more by major turning points or by small everyday experiences over time?
          - question: Can a single experience significantly change someone's identity, or does identity usually develop gradually?
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Activity 4: Communities around the world'
        skills: [Comparisons]
        steps:
          - '**Community presentation.** Your teacher shows pictures of five unique communities: the Amish, the Maasai (Kenya and Tanzania), Auroville (India), digital nomads (a global online community) and the kibbutz (Israel).'
          - '**Research.** In groups, choose 2 communities and research them online. Answer the research questions below.'
          - '**Compare.** Mix the groups. Each member presents one community, and the new group compares the communities by values, roles, identity, power structure, belonging, change and flexibility, and individual vs. collective.'
          - '**Class review.** Talk about the communities and other strong communities around the world.'
      - id: act4-research
        type: discussionQuestions
        title: Research questions
        items:
          - question: What defines identity in this community?
          - question: What values are central?
          - question: How strong is the sense of belonging?
          - question: Is identity more individual or collective?
          - question: What challenges does this community face today?
      - id: act4-compare
        type: discussionQuestions
        title: Compare the communities
        items:
          - question: 'Values:'
            frame: The ___ are more / less ___ than the ___.
          - question: 'Roles and power structure:'
            frame: The ___ have clearer roles than ___.
          - question: 'Belonging and identity:'
            frame: The ___ have the strongest sense of ___.
          - question: 'Change and flexibility:'
            frame: The ___ are not as ___ as the ___.
      - id: act4-review
        type: discussionQuestions
        title: Class review
        items:
          - question: Which type of community tends to create the strongest collective identity?
          - question: What makes a community sustainable over time?
          - question: What challenges do traditional communities face in modern global society?
      # Activity 5
      - id: act5
        type: classActivity
        title: 'Activity 5: Debate – change in a community?'
        skills: [Second conditional, Comparisons]
        steps:
          - "Communities are built on shared values, traditions and social roles that shape people's identity and sense of belonging. However, societies change all the time because of technology, globalization and differences between generations. This creates tension between preserving tradition and adapting to new realities."
          - '**Group 1:** Tradition protects identity. Communities should stay as they have always been. **Group 2:** Identity evolves over time. Development is necessary for the future of communities.'
          - "**Brainstorm in groups.** Think of points that support your group's opinion, even if you don't totally agree with it. Use reasons and examples from your own experience, the second conditional and comparisons between communities. The questions below can help."
          - '**Rule:** every argument must include a comparison and a personal example or a sentence in the second conditional.'
          - '**Debate!** One argument at a time: Group 1 gives an argument and Group 2 responds; then Group 2 gives an argument and Group 1 responds.'
          - '**Class discussion.** Discuss the questions below.'
      - id: act5-brainstorm
        type: discussionQuestions
        title: Brainstorm questions
        items:
          - question: If leadership remained in the hands of one generation for many years, how might that shape the future direction of the community? Would stability increase, or would innovation decrease?
          - question: If younger members were given more decision-making power, how might the identity of the community evolve? Would it become stronger, weaker, or simply different?
          - question: If a community refused to adapt to social and technological changes, or adapted too quickly to every new trend, how might each approach affect its identity, stability and relevance? Would members feel more protected or more disconnected in each case?
      - id: act5-discussion
        type: discussionQuestions
        title: Class discussion
        items:
          - question: What communities came to mind while we were debating?
          - question: What other conflicts are there between the older and younger generations of communities?
          - question: How would you react if you were an elder? What about a person from the younger generation?
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Skills this cycle: the **second conditional** (Activities 1, 2, 3 and 5),
          **comparisons** (Activities 1, 2, 4 and 5) and **narrative tenses** (Activities 1
          and 3).
      - id: n-warmup
        anchor: warmup
        text: >-
          Pick from the 8 questions. Make sure students answer in full sentences and use
          conditionals and comparisons. If students don't feel comfortable speaking about
          real-life experiences, they can make something up, as long as they practise
          speaking in English.
      - id: n-act1
        anchor: act1
        text: >-
          Step 2 is in breakout rooms. Each group chooses one community and decides on its
          purpose, who can join, its values, what creates belonging, and its roles.
      - id: n-act3
        anchor: act3
        text: Encourage students to work with AI or Mori while they build their story in Step 2.
      - id: n-act4
        anchor: act4
        text: |-
          Show pictures and give a little information about each community:
          **The Amish:** a traditional religious lifestyle that rejects most modern technology. A strong collective identity and clear social roles create a powerful sense of belonging and stability.
          **The Maasai (Kenya and Tanzania):** identity is deeply connected to tradition, land and age-based roles in the community. They face the challenge of balancing modernization with cultural preservation.
          **Auroville (India):** created as an international community that promotes unity beyond nationality and religion. Its experimental social structure challenges traditional ideas of ownership, hierarchy and identity.
          **Digital nomads (global online community):** the community is based not on geography but on lifestyle and shared values such as freedom and mobility. Identity is shaped more by flexibility and global connection than by long-term physical belonging.
          **The kibbutz (Israel):** originally built on a strong collective ideology and shared responsibility. Over time, many kibbutzim have moved toward privatization, creating tension between traditional communal identity and modern individualism.
      - id: n-act5
        anchor: act5
        text: Divide the class into two groups and give each group its opinion before the brainstorm.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: identity-and-community-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-narrative
        type: ruleSummary
        skill: Narrative tenses
        rules:
          - text: '**Past simple:** finished actions and completed experiences. **The action is finished, and the time is not now!**'
            examples:
              [
                "I lived on a kibbutz as a child and slept in the children's house, not with my parents.",
              ]
          - text: '**Past habits** (*when I was…, I used to…*): situations or habits that were true in the past but are not true now. **Talk about how life was before.**'
            examples: [I used to be a Taylor Swift fan, and I went to every fan event.]
          - text: '**Past continuous** (*was / were + -ing*): what was happening at the time of the story.'
            examples: [I was studying at university when I joined the community.]
          - text: '**Past perfect** (*had + past participle*): what had happened before the main event.'
            examples: [I had never lived abroad before I moved to Berlin.]
          - text: '**Present simple:** who you are now and your routines. **What is true today, and what happens regularly.**'
            examples:
              [
                'I am part of the "Fourth Quarter", a community that tries to unite different communities in Israel.',
              ]
          - text: "**Future** (*want to / going to / will*): goals, plans and intentions. **Something that hasn't happened yet!**"
            examples:
              [
                I hope that my values about personal relationships will stay the same when I am promoted to CEO.,
              ]
          - text: '**Mixed tenses:** when you tell a story about your identity or your community, mix tenses to show a clear timeline. Start with the **present** (who you are now), move to the **past** (key experiences), and finish with the **future** (goals) or an imagined situation. Choose one main example and connect your ideas smoothly.'
            examples:
              - Many communities feel overwhelmed by change. In the past, the elders took care of everyone. Today, the younger generation wants to be involved as well. If the generations cooperated, it would be in the best interest of the community.
      - id: rules-second-conditional
        type: ruleSummary
        skill: Second conditional
        rules:
          - text: 'We use the **second conditional** to talk about unreal or hypothetical situations in the present, imaginary changes in society or in a community, the imagined result of an unreal situation, and alternative realities (*What would happen if…?*).'
          - text: '**Form:** *If* + past simple, *would* + base verb.'
            examples:
              - If I got American citizenship, I would leave Israel and never come back.
              - If closed religious communities accepted outsiders, it would change their uniqueness.
          - text: 'Even though we use the **past simple**, we are not talking about the past. We are imagining something unreal or unlikely in the present or future.'
          - text: '*If* + subject + *were to* + base verb is a more formal way to say the same thing.'
            examples: [If I were to get American citizenship, I would leave Israel.]
          - text: '**Were:** in the second conditional, *were* is commonly used instead of *was* with all subjects (*If I were…, If identity were…*). In informal speech you will also hear *was*.'
            examples:
              [
                If identity were based only on economic success,
                many important values would disappear.,
              ]
      - id: rules-comparisons
        type: ruleSummary
        skill: Comparisons
        rules:
          - text: 'Use **more / less + adjective + than** with long adjectives, and **adjective + -er + than** with short adjectives.'
          - text: 'Use **as + adjective + as** when two things are equal, and **not as … as** when they are not.'
          - text: 'Superlatives take **the**: *the strongest, the most influential, the least structured*.'
      - id: comparisons-table
        type: table
        caption: Comparisons
        header: [Comparison, When to use it, Example]
        rows:
          - [
              '**more … than / less … than**',
              'With long adjectives (2+ syllables). *Less* works with any adjective.',
              'A traditional community is **more structured than** a modern digital community.',
            ]
          - [
              '**-er … than**',
              'With short adjectives (1 syllable, sometimes 2)',
              'A small community is often **stronger than** a large one.',
            ]
          - [
              '**as … as**',
              'When two things are equal',
              'A digital community can be **as meaningful as** a physical one.',
            ]
          - [
              '**the most / the least**',
              'With long adjectives (2+ syllables). *The least* works with any adjective.',
              "Family is often **the most influential** community in a person's life.",
            ]
          - [
              '**the -est**',
              'With short adjectives (1 syllable, sometimes 2)',
              'A close-knit group creates **the strongest** sense of belonging.',
            ]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through the skills with the group and ask for one new example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: identity-and-community-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-main
        type: aiTutorPrompt
        title: Identity and community
        message: >-
          Hi Mori! Let's talk about identity and community. Please ask me questions that
          help me use narrative tenses to describe how identity develops over time. Ask me
          to compare different types of communities and values using comparative forms.
          Also include "what if" questions so I can practice the second conditional and
          imagine how identity would change in different situations. Ask follow-up
          questions to make me explain my ideas clearly, and correct my mistakes with a
          better model sentence.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**
      - id: extra-title
        type: heading
        level: 3
        text: 2 interactive activities
      - id: mori-compare
        type: aiTutorPrompt
        title: 'Activity 1: Community comparison'
        intro: Think about a community that you are part of and a unique community from around the world. Think of similarities and differences between the two. Then send this message to Mori.
        message: >-
          Hi Mori! I want to compare two communities: one community I belong to and one
          unique community from around the world. First, ask me to describe my community
          and my role in it using narrative tenses (what happened, how I joined, how it
          influenced me). Then ask me to describe the unique community and explain its
          values, structure, and identity. After that, ask me to compare the two
          communities using comparative forms (more than, less than, -er, -est, most,
          least, as…as). Please ask follow-up questions to help me explain my ideas
          clearly, and correct my mistakes with improved model sentences.
      - id: mori-values
        type: aiTutorPrompt
        title: 'Activity 2: Important values'
        intro: Think about how values influence identity. Imagine how your priorities, beliefs and behavior might change if your personal values or your community's values were different. Then send this message to Mori.
        message: >-
          Hi Mori! Let's talk about identity and values using conditionals. Please ask me
          questions about how different values shape identity, and include "what if"
          questions so I can practice the second conditional by imagining how my
          personality, priorities, or lifestyle would change if my values or my
          community's values were different. You can also ask one or two third conditional
          questions about how my identity might have developed differently in the past.
          Please ask follow-up questions that make me explain and compare ideas clearly,
          and correct my mistakes with improved model sentences.

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: identity-and-community-practice
    book: workbook
    title: 'Practice: Identity and Community'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the second conditional and comparisons on your own. Each answer is checked right away, and you can try again.
      - id: ex-conditional
        type: activity
        activity: identity-and-community-conditional
      - id: ex-comparisons
        type: activity
        activity: identity-and-community-comparisons

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: identity-and-community-vocabulary
    title: Vocabulary
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Identity and community words
        glossLang: he
        link: https://quizlet.com/il/1144388375/identity-and-community-english-translation-flash-cards/
        items: &identity-and-community-words
          - { term: Self-perception, gloss: תפיסה עצמית }
          - { term: Core values, gloss: ערכי ליבה }
          - { term: Belief system, gloss: מערכת אמונות }
          - { term: Mindset, gloss: דפוס חשיבה }
          - { term: Heritage, gloss: מורשת }
          - { term: Turning point, gloss: נקודת מפנה }
          - { term: Impact, gloss: השפעה }
          - { term: Independence, gloss: עצמאות }
          - { term: Social structure, gloss: מבנה חברתי }
          - { term: Hierarchy, gloss: היררכיה }
          - { term: Membership, gloss: 'חברות, שייכות לקבוצה' }
          - { term: Inclusion, gloss: הכלה }
          - { term: Exclusion, gloss: הדרה }
          - { term: Diversity, gloss: גיוון }
          - { term: Cohesion, gloss: לכידות }
          - { term: Commitment, gloss: מחויבות }
