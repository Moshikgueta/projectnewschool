      - id: quizlet-definition
        type: externalLink
        label: The same words with English definitions on Quizlet
        url: https://quizlet.com/il/1144387949/identity-and-community-english-definition-flash-cards/
      - id: definitions
        type: table
        caption: Definitions
        header: [Word, Definition]
        rows:
          - [Self-perception, The way a person sees and understands themselves]
          - [Core values, The main beliefs that guide a person's behavior]
          - [Belief system, A set of ideas or principles that shape how someone sees the world]
          - [Mindset, A way of thinking about life and situations]
          - [Heritage, Cultural traditions and history passed down from previous generations]
          - [Turning point, An important moment that causes a major change]
          - [Impact, A strong effect or influence]
          - [Independence, The ability to act and think freely without relying on others]
          - [Social structure, The organized system of relationships and roles in a society]
          - [Hierarchy, A system where people have different levels of power or status]
          - [Membership, The state of belonging to a group or organization]
          - [Inclusion, The act of making someone feel accepted and part of a group]
          - [Exclusion, The act of leaving someone out of a group]
          - [Diversity, 'The presence of different backgrounds, cultures, or perspectives']
          - [Cohesion, The strength of connection and unity within a group]
          - [Commitment, 'A strong dedication to a person, group, or idea']
          - [Support system, A group of people who provide emotional or practical help]
          - [Transformation, A complete or major change]
          - [Priorities, The things that are considered most important]
          - [Lifestyle, The way a person chooses to live]
          - [Element, A basic part of something]
          - [Success, The achievement of goals]
          - [Failure, The lack of success or inability to achieve a goal]
          - [Digital nomad, A person who works remotely while traveling]
          - [Collective, A group that acts together and shares responsibility]
          - [Individual, 'A single person, separate from a group']
          - [Elder, An older and respected member of a community]
          - [Belonging, The feeling of being accepted and part of a group]
          - [Conformity, The act of following group rules or social expectations]
          - [Identity crisis, A period of uncertainty about one's identity or direction in life]

vocabulary:
  - slug: identity-and-community
    title: Identity and Community
    items: *identity-and-community-words

activities:
  - slug: identity-and-community-conditional
    title: 'Second conditional: If I were…, I would…'
    minutes: 8
    items:
      - id: moved-would
        type: multipleChoice
        prompt: If I moved to another country, I ___ my family a lot.
        options:
          - { text: would miss, correct: true }
          - {
              text: will miss,
              feedback: '*Will* is for real possibilities (first conditional). For an imagined situation, use *would* + base verb.',
            }
          - {
              text: missed,
              feedback: 'The past simple goes in the *if* part. The result part needs *would* + base verb: *would miss*.',
            }
      - id: if-had
        type: fillBlank
        prompt: Write the correct form of *have*.
        text: If I ___ more free time, I would join a community choir.
        blanks: [[had]]
      - id: were-all
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: 'If I were part of that community, I would be the leader.', correct: true }
          - {
              text: 'If I am part of that community, I would be the leader.',
              feedback: 'In the second conditional, the *if* part is in the past simple: *If I were…*',
            }
          - {
              text: 'If I would be part of that community, I would be the leader.',
              feedback: "Don't use *would* in the *if* part. Use the past simple: *If I were…*",
            }
      - id: not-past
        type: trueFalse
        prompt: 'In *If I had more money, I would travel*, the speaker is talking about the past.'
        answer: false
        feedback:
          correct: Right! The past simple here is for an imagined situation in the present or future.
          incorrect: 'The verb is in the past simple, but we are imagining something unreal now or in the future, not talking about the past.'
      - id: identity-were
        type: fillBlank
        prompt: Complete the sentence from the summary.
        text: If identity ___ based only on economic success, many important values ___ disappear.
        blanks: [[were, was], [would, could, might]]
      - id: halves
        type: matching
        prompt: Match the two halves of each sentence.
        pairs:
          - ['If younger members had more power…', '…they would make more decisions.']
          - ['If I were the spokesperson…', '…I would write speeches to the press.']
          - ['If the community accepted outsiders…', '…it would lose some of its uniqueness.']
          - ['If my sister moved abroad…', '…she would miss her friends.']
      - id: wouldnt-treasurer
        type: fillBlank
        prompt: Write the negative of *would be* (one word or two).
        text: I ___ the treasurer, because I am not good with money.
        blanks: [["wouldn't be", would not be]]
      - id: order-what
        type: reorderSentence
        prompt: Put the words in order to make a question.
        sentence: What would you change if you were the leader?

  - slug: identity-and-community-comparisons
    title: 'Comparisons: more … than, -er, as … as, the most'
    minutes: 8
    items:
      - id: stronger
        type: multipleChoice
        prompt: A small community is often ___ than a large one.
        options:
          - { text: stronger, correct: true }
          - {
              text: more strong,
              feedback: '*Strong* is a short adjective (1 syllable), so add *-er*: *stronger*.',
            }
          - {
              text: strongest,
              feedback: '*-est* is the superlative. With *than*, use the comparative: *stronger*.',
            }
      - id: more-structured
        type: fillBlank
        prompt: A traditional community has many rules and clear roles. Complete the sentence.
        text: A traditional community is ___ structured than a modern digital community.
        blanks: [[more]]
      - id: as-as
        type: fillBlank
        prompt: The two things are equal. Complete the sentence.
        text: A digital community can be ___ meaningful ___ a physical one.
        blanks: [[as], [as]]
      - id: most-influential
        type: multipleChoice
        prompt: Family is often ___ community in a person's life.
        options:
          - { text: the most influential, correct: true }
          - {
              text: the influentialest,
              feedback: '*Influential* is a long adjective, so use *the most*: *the most influential*.',
            }
          - {
              text: most influential than,
              feedback: 'With a superlative, use *the* and no *than*: *the most influential*.',
            }
      - id: the-superlative
        type: trueFalse
        prompt: 'We use *the* before a superlative: *the strongest, the most inclusive*.'
        answer: true
        feedback:
          correct: Right! *A close-knit group creates the strongest sense of belonging.*
          incorrect: 'Superlatives take *the*: *the strongest, the most inclusive*.'
      - id: forms
        type: matching
        prompt: Match each adjective with its comparative form.
        pairs:
          - [strong, stronger]
          - [close, closer]
          - [diverse, more diverse]
          - [traditional, more traditional]
          - [flexible, more flexible]
      - id: not-as
        type: multipleChoice
        prompt: 'The kibbutz is more traditional than a digital-nomad community. Which sentence means the same?'
        options:
          - { text: A digital-nomad community is not as traditional as the kibbutz., correct: true }
          - {
              text: A digital-nomad community is as traditional as the kibbutz.,
              feedback: '*As … as* means the two are equal. Here they are not equal, so use *not as … as*.',
            }
          - {
              text: The kibbutz is less traditional than a digital-nomad community.,
              feedback: '*Less* means the opposite: here the kibbutz is *more* traditional.',
            }
      - id: order-least
        type: reorderSentence
        prompt: Put the words in order.
        sentence: This is the least structured community in the world.
