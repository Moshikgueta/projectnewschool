vocabulary:
  - slug: entertainment
    title: Entertainment
    items: *entertainment-words

activities:
  - slug: entertainment-present-perfect
    title: 'Present perfect: I have seen it three times'
    minutes: 8
    items:
      - id: have-ever
        type: multipleChoice
        prompt: ___ you ever left a concert before it ended?
        options:
          - { text: Have, correct: true }
          - { text: Has, feedback: '*Has* is for *he, she, it*. For *you*, use *have*.' }
          - {
              text: Did,
              feedback: '*Left* here is a past participle after *ever*, so we need *have*: *Have you ever left…?*',
            }
      - id: seen
        type: fillBlank
        prompt: Write the past participle of *see*.
        text: She has never ___ that movie.
        blanks: [[seen]]
      - id: participles
        type: matching
        prompt: Match each verb with its past participle.
        pairs:
          - [choose, chosen]
          - [see, seen]
          - [become, become]
          - [watch, watched]
          - [make, made]
      - id: for-since
        type: multipleChoice
        prompt: He has worked in the film industry ___ 2015.
        options:
          - { text: since, correct: true }
          - {
              text: for,
              feedback: 'Use *for* with a period of time (*for 5 years*). *2015* is a point in time, so use *since*.',
            }
          - {
              text: ago,
              feedback: '*Ago* goes with the past simple (*five years ago*), not with the present perfect.',
            }
      - id: has-changed
        type: fillBlank
        prompt: Complete with the present perfect of *change*.
        text: Technology ___ the way we watch shows.
        blanks: [[has changed]]
      - id: last-year
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: I saw Adele in concert last year., correct: true }
          - {
              text: I have seen Adele in concert last year.,
              feedback: '*Last year* is a specific time, so use the past simple: *I saw*.',
            }
          - {
              text: I have saw Adele in concert last year.,
              feedback: 'After *have*, use the past participle (*seen*), and with *last year* use the past simple: *I saw*.',
            }
      - id: trends
        type: trueFalse
        prompt: 'We can use the present perfect to describe changes over time: *Movie theaters have become less popular in the last decade.*'
        answer: true
        feedback:
          correct: Right! The present perfect describes changes and trends up to now.
          incorrect: 'The present perfect is used for changes from the past up to now: *People have started using their phones for most entertainment.*'
      - id: order-streamed
        type: reorderSentence
        prompt: Put the words in order.
        sentence: Have you ever streamed a live concert?

  - slug: entertainment-opinions
    title: 'Expressing opinions: In my opinion…'
    minutes: 8
    items:
      - id: phrase
        type: multipleChoice
        prompt: Which phrase introduces a personal opinion?
        options:
          - { text: From my point of view…, correct: true }
          - {
              text: For example…,
              feedback: '*For example* introduces an example that supports your opinion, not the opinion itself.',
            }
          - {
              text: "That's why…",
              feedback: "*That's why* connects a reason and a result. Start an opinion with *I think…, In my opinion…, From my point of view…*",
            }
      - id: reactions
        type: matching
        prompt: Match each reaction with its meaning.
        pairs:
          - ["That's a good point.", Agreeing]
          - ['I see what you mean, but…', Partly agreeing]
          - ['I am not sure I agree with that, because…', Disagreeing]
          - ['I would say that…', Giving your opinion]
      - id: because
        type: fillBlank
        prompt: Complete with a connecting word that gives a reason.
        text: I think The Matrix is innovative ___ it changed action movies.
        blanks: [[because, since, as]]
      - id: overrated
        type: multipleChoice
        prompt: "*Everyone says this show is amazing, but I think it's not that good.* For me, the show is ___."
        options:
          - { text: overrated, correct: true }
          - {
              text: underrated,
              feedback: '*Underrated* means not appreciated enough. Here people like it *more* than it deserves: *overrated*.',
            }
          - {
              text: iconic,
              feedback: '*Iconic* means very famous and recognized. The speaker thinks it is less good than people say: *overrated*.',
            }
      - id: adjectives
        type: matching
        prompt: Match each adjective with its meaning.
        pairs:
          - [Thought-provoking, Making you think deeply]
          - [Captivating, Very interesting and holding your attention]
          - [Superficial, Shallow; not deep or meaningful]
          - [Niche, 'For a small, specific group of people']
      - id: support
        type: trueFalse
        prompt: A strong opinion only needs an opinion phrase; you don't need to give a reason or an example.
        answer: false
        feedback:
          correct: Right! Support your opinion with reasons and examples so it is more convincing.
          incorrect: 'Support your opinion with a reason and an example: *I think it is inspiring because… For example…*'
      - id: polite
        type: multipleChoice
        prompt: 'Your friend says: *Reality shows are great.* You disagree. What is the most polite answer?'
        options:
          - { text: 'I am not sure I agree with that, because they are often fake.', correct: true }
          - {
              text: 'No. You are wrong.',
              feedback: 'Disagree in a respectful way: start with a reaction like *I am not sure I agree with that*, and give a reason.',
            }
          - {
              text: "That's a good point.",
              feedback: "*That's a good point* is for agreeing. To disagree, say *I am not sure I agree with that, because…*",
            }
      - id: order-opinion
        type: reorderSentence
        prompt: Put the words in order.
        sentence: In my opinion, this documentary is eye-opening.
