sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: entertainment-class
    title: 'Class: Entertainment'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Entertainment
      - id: skills
        type: cycleOverview
        skills:
          - name: Present perfect
            description: Experiences, changes over time and situations that continue to now (*I have seen this show three times.*)
          - name: Expressing opinions
            description: Give your opinion, support it with reasons and react to other people's opinions (*In my opinion, it is overrated because…*)
      - id: quizlet-translation
        type: externalLink
        label: 'Entertainment on Quizlet: English - Translation'
        url: https://quizlet.com/il/1119909654/entertainment-english-translation-flash-cards/
      - id: quizlet-definition
        type: externalLink
        label: 'Entertainment on Quizlet: English - Definition'
        url: https://quizlet.com/il/1119907145/entertainment-english-definition-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I am ___. A show / concert / play that I think everyone has to watch is ___.
        example: I am Dana. A show that I think everyone has to watch is The Office.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup-how
        type: text
        text: Answer in full sentences and use the present perfect.
      - id: warmup
        type: discussionQuestions
        items:
          - question: What is entertainment, in your opinion?
            frame: In my opinion, entertainment is…
          - question: What new show, podcast or musician have you discovered recently, and what made you interested in them?
            frame: Recently I have discovered… I became interested because…
          - question: What form of entertainment have you been using more this year (TV, social media, podcasts or live events), and why do you prefer it?
            frame: This year I have been using… more, because…
          - question: Have you ever left a cultural event before it ended because you felt bored or uninterested? What happened?
            frame: Yes, I have. Once I left… because… / No, I have never left…
          - question: What live event or concert have you enjoyed the most in the past few years? What made it memorable?
            frame: The event I have enjoyed the most is… It was memorable because…
          - question: Which movie, show or artist have you watched more than once, and why do you think it is worth re-watching?
            frame: I have watched… more than once, because…
          - question: Describe your entertainment style. Do you prefer popular (mainstream) entertainment or more niche and indie styles?
            frame: I prefer… because… / I have always liked…
          - question: Is there a type of entertainment that you think is underrated? Why?
            frame: I think… is underrated because…
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: Rate it!'
        skills: [Expressing opinions]
        steps:
          - Many classic movies, artists and shows have shaped the entertainment industry over the years. As a group, rate these all-time favorites with the adjectives below. You can also add other entertainment, as long as the group agrees on it.
          - Read the list and choose 6 pieces of entertainment you want to rate. Present your choices to your group.
          - You may not all agree! Explain your opinions and try to **convince the others** with clear reasons.
          - As a class, try to agree on the ratings. Can you persuade the other groups?
        example: '*In my opinion, Titanic is overrated, because the story is very simple. I see what you mean, but I think it is unforgettable.*'
      - id: act1-list
        type: table
        caption: List of entertainment
        rows:
          - [Titanic, The Lion King, Friends]
          - [Elton John, Michael Jackson, The Phantom of the Opera]
          - [Game of Thrones, Adele, Les Misérables]
          - [Beyoncé, Forrest Gump, Romeo and Juliet]
          - [The Nutcracker, The Matrix, Mamma Mia!]
          - [Swan Lake, The Office, '']
      - id: act1-ratings
        type: wordBank
        words:
          [
            Overrated,
            Innovative,
            Unforgettable,
            Thought-provoking,
            Meaningful,
            Another criterion of your choice,
          ]
      - id: act1-sentences
        type: discussionQuestions
        title: My ratings
        items:
          - question: ___ is ___, because ___.
            frame: In my opinion, ___ is ___, because ___.
          - question: ___ is ___, because ___.
            frame: I think ___ is ___, because ___.
          - question: ___ is ___, because ___.
            frame: From my point of view, ___ is ___, because ___.
          - question: 'Something I did not agree with: ___'
            frame: I see what you mean, but ___. / I am not sure I agree with that, because ___.
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Activity 2: Podcast interview'
        skills: [Present perfect]
        steps:
          - Choose a person you admire from the entertainment industry to interview on your podcast.
          - 'Write 5 questions in the present perfect about their life that you would like to ask on the show. Topics you can ask about: *career, experiences, challenges, personal life*.'
          - Choose 2 questions and answer them as if you were the famous person.
          - Present your podcast to your partner. Think of another question to add to your partner's interview list.
        example: |-
          *I **have chosen** Adele because her songs are very meaningful.*
          *Question 1: What artists have you collaborated with over the years?*
      - id: act2-questions
        type: discussionQuestions
        title: My podcast
        items:
          - question: I have chosen ___ because ___.
          - question: 'Question 1: ___'
            frame: Have you ever ___? / What have you ___?
          - question: 'Question 2: ___'
          - question: 'Question 3: ___'
          - question: 'Question 4: ___'
          - question: 'Question 5: ___'
          - question: 'Answer 1 (as the famous person): ___'
            frame: I have ___ for ___ years. / I have never ___.
          - question: 'Answer 2 (as the famous person): ___'
          - question: "A question for my partner's interview: ___"
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Activity 3: Cheap entertainment'
        skills: [Expressing opinions, Present perfect]
        steps:
          - 'Research a type of "cheap entertainment": something flashy, low-quality, exaggerated or made mainly to get attention.'
          - As a group, brainstorm different kinds of cheap entertainment, and find adjectives that describe them.
          - In pairs or small groups, choose one example of cheap entertainment and search online for details about it. Use the questions below.
          - 'Present your findings to the class: introduce the entertainment type, explain why it is considered "cheap", describe it with opinion adjectives, support your argument with present perfect sentences, and say whether people should or shouldn''t watch it, and why.'
        example: '*Reality shows have become very popular because people love drama. In my opinion, they are trashy and exaggerated.*'
        wordBank: [sensational, trashy, controversial, exaggerated, superficial, overrated]
      - id: act3-questions
        type: discussionQuestions
        title: Our research
        items:
          - question: What type of entertainment is it?
          - question: Who is the audience?
          - question: Why has it become popular?
            frame: It has become popular because…
          - question: What "cheap" elements does it include (drama, scandals, fights, fake stories…)?
          - question: How would you describe this type of entertainment with adjectives?
            frame: I would say that it is ___ and ___.
          - question: Should people watch it? Why or why not?
            frame: I believe people should / shouldn't watch it, because…
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Activity 4: Debate: Is the entertainment world dying?'
        skills: [Present perfect, Expressing opinions]
        steps:
          - 'People today use their phones for entertainment and go out less to theaters, shows or lectures. Has the entertainment world been dying? As a class, read the topic and talk about the types of entertainment people consume today: movie theaters, live shows, concerts, museums, cultural events, and staying at home with Netflix, YouTube, TikTok, etc.'
          - "Two groups: group A argues that the entertainment world is in decline; group B argues that it is not. In your group, prepare 4–5 strong arguments in the present perfect, and prepare answers to the other group's arguments."
          - 'Debate! Each group gives one argument at a time: group A gives an argument, group B responds; group B gives an argument, group A responds.'
          - 'Optional: discuss the follow-up questions below as a class.'
        example: |-
          *Group A: Movie theaters have become less popular in the last few years.*
          *Group B: That's a good point, but many concerts have sold out this year.*
      - id: act4-arguments
        type: discussionQuestions
        title: Our arguments
        items:
          - question: 'Argument 1: ___'
            frame: In the last few years, ___ has / have ___.
          - question: 'Argument 2: ___'
          - question: 'Argument 3: ___'
          - question: 'Argument 4: ___'
          - question: 'Our answer to the other group: ___'
            frame: I see what you mean, but ___.
      - id: act4-followup
        type: discussionQuestions
        title: Follow-up questions (optional)
        items:
          - question: How has technology changed the way we enjoy entertainment?
          - question: How have people's habits changed?
          - question: What cultural activities have survived or stayed strong?
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: the **present perfect** (warm-up, Activities 2 and 4)
          and **expressing opinions** (Activities 1, 3 and 4). Pick the warm-up
          questions you need; make sure students answer in full sentences with the
          present perfect.
      - id: n-warmup
        anchor: warmup
        text: Ask each student at least two questions. Answers typed here are visible to you below each question.
      - id: n-act1
        anchor: act1
        text: >-
          The source has a Canva design for this activity
          (canva.com/design/DAG7FxkOQyQ), which is not on the link allow-list. Share
          it on screen if you use it. Push students to persuade each other with the
          reaction phrases from the summary (*That's a good point / I see what you
          mean, but… / I am not sure I agree with that because…*).
      - id: n-act2
        anchor: act2
        text: >-
          Check that the questions really are in the present perfect (*have / has +
          past participle*), and that answers with a specific time switch to the past
          simple (*I have worked with Elton John. We worked together in 2019.*).
      - id: n-act3
        anchor: act3
        text: >-
          "Cheap entertainment" can describe entertainment that is exaggerated,
          dramatic or over-the-top, clickbait, low-effort, or made mainly for views,
          drama or shock value. Examples: reality shows, tabloid TV, clickbait YouTube
          channels, gossip shows, "trash TV", staged pranks, overly dramatic talent
          shows and sensational news segments.
      - id: n-act4
        anchor: act4
        text: >-
          Give each group time to prepare 4–5 arguments in the present perfect before
          the debate. Useful time phrases: *recently, lately, over the years, in the
          last few years*.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: entertainment-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-present-perfect
        type: ruleSummary
        skill: Present perfect
        rules:
          - text: 'The present perfect always uses **have / has + past participle**. Some past participles look like the past simple (*watch → watched → watched*); others change (*see → saw → seen*). Learn the irregular verbs!'
          - text: 'Use the present perfect for **life experiences** without saying **when** they happened. It focuses on the experience, not the time. To say when it happened, use the past simple.'
            examples:
              [She has never watched that movie., Have you ever made a bad decision in your career?]
          - text: 'Use the present perfect for **changes, trends or developments over time**: something started in the past and has changed up to now. Time phrases: *recently, lately, over the years, in the last few years*.'
            examples:
              - People have started using their phones for most entertainment.
              - Movie theaters have become less popular in the last decade.
              - Technology has changed the way we watch shows.
          - text: 'Use the present perfect for actions or situations that **started in the past and continue to the present**. **For** + a period of time (*for a long time, for 5 years*); **since** + a point in time (*since 2020, since March*).'
            examples:
              [He has worked in the industry for a long time., This show has been on TV since 1990.]
      - id: rules-opinions
        type: ruleSummary
        skill: Expressing opinions
        rules:
          - text: 'Use an **opinion phrase** to introduce your idea, so the listener knows it is your personal view: *I think…, In my opinion…, I believe…, From my point of view…, I would say that…*'
          - text: "**Support your opinion** with reasons and examples, so your argument is stronger. Use connecting words: *because, so, for example, that's why*."
            examples:
              [
                'In my opinion, Friends is iconic because everyone knows the characters. For example, my kids watch it now.',
              ]
          - text: "**React to other people's opinions** politely: start with a reaction, add a short reason, then add a follow-up question or comment to keep the conversation going."
      - id: reactions-table
        type: table
        caption: Reacting to an opinion
        header: [Reaction, Example]
        rows:
          - [Agreeing, "*That's a good point.*"]
          - [Partly agreeing, '*I see what you mean, but…*']
          - [Disagreeing, '*I am not sure I agree with that, because…*']
    teacherNotes:
      - id: n-summary
        anchor: null
        text: >-
          Go through both skills with the group and ask for one new example for each
          rule. If students ask about *This show has been playing since 1990*, it is
          the present perfect continuous (*have / has been + -ing*), which also works
          for situations that continue to now.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: entertainment-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-1
        type: aiTutorPrompt
        title: "Message 1: Let's talk about entertainment"
        message: |-
          Hi Mori! Let's talk about entertainment. Ask me questions about my experiences with movies, shows and other entertainment, so I need to answer using opinion adjectives and the present perfect tense.
      - id: interactive-title
        type: heading
        level: 3
        text: Two interactive activities
      - id: mori-2
        type: aiTutorPrompt
        title: 'Activity 1: Convince me!'
        intro: Imagine you are in a real conversation and someone gives you a strong opinion about entertainment. How would you react? Would you agree or disagree, and why?
        message: |-
          Hi Mori! Let's play an opinion challenge called "Convince Me". Give me strong or surprising opinions about entertainment (movies, series, celebrities, trends). I have to agree or disagree and explain my opinion with reasons and adjectives. After every answer, challenge me with a follow-up question to push my thinking.
      - id: mori-2-remember
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Start your answer with an opinion phrase (*I think…, In my opinion…*).
          Add a reason and an example to your opinion.
          Add adjectives to make your opinion richer.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Activity 2: Entertainment experiences'
        intro: Mori will name different types of entertainment. You will both talk about your experiences in the present perfect and ask each other questions.
        message: |-
          Hi Mori! Let's talk about different types of entertainment. Give me one topic at a time (for example: movie theaters, concerts, museums, live shows, cultural events, or staying at home with Netflix/YouTube/TikTok). For each topic, ask me questions in the present perfect about my experiences, and I will answer and also ask YOU a question in the present perfect. Please correct my mistakes and challenge me to give more details.
      - id: mori-3-remember
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Use the present perfect, and add time phrases with *for* and *since*.
          Ask Mori questions too!
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: entertainment-practice
    book: workbook
    title: 'Practice: Entertainment'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. Each answer is checked right away, and you can try again.
      - id: ex-present-perfect
        type: activity
        activity: entertainment-present-perfect
      - id: ex-opinions
