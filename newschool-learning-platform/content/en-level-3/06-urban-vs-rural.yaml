# Cycle "Urban vs. Rural", converted from the English level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-level-3
slug: urban-vs-rural
title: Urban vs. Rural
goal: Compare city and country life with relative clauses and clear, supported opinions.
position: 6
status: published

review:
  - >-
    The two workbook exercises ("Relative clauses" and "Expressing opinions") are
    NEW: the notebook has no self-study exercises. They were written from the cycle's
    summary rules and table, the activity examples and the vocabulary. Please check
    level, wording and every right answer before students see them.
  - >-
    Warm-up instruction: the source says "use the present perfect tense" (copied from
    another cycle). This cycle's skills are relative clauses and opinions, so it now
    says "use relative clauses and give reasons". Please confirm.
  - >-
    Warm-up question 4: "Has your quality of life changed when you moved?" mixes the
    present perfect with a finished time (*when you moved*). It now reads "Did your
    quality of life change when you moved?"
  - >-
    Activity 3 example: "Central Park in New York, which is one of the largest cities
    in the world" makes *which* refer to the park, but the information is about New
    York (and the sentence has no main verb). It now reads "Central Park, which is in
    New York, is one of the most famous city parks in the world." "Bahai Gardens" →
    "Bahá'í Gardens".
  - >-
    Activity 4: in the source the mouse who lives in the countryside is called "the
    town mouse", which is confusing next to "the city mouse" (in the classic fable the
    town mouse IS the city mouse). He is now "the country mouse", the title is "City
    mouse, country mouse" and the debate question "City life or Town life?" → "City
    life or country life?". The step numbers (two "Step 1"s) were fixed.
  - >-
    Links: the pamphlet for Activity 1 and the optional pictures for Activity 3 are
    gamma.app pages, which are not on the link allow-list. They were removed and
    mentioned in teacher notes. Activity 1 depends on the pamphlet: students need to
    see it on screen. The YouTube documentary (Activity 2) is kept.
  - >-
    Summary, defining clauses: the source says "We usually use the clause that". It
    now says "We often use *that*, or *who* for people and *which* for things". The
    reason / contrast word list ends with "on the one hand"; "on the other hand" was
    added, because the two go together.
  - >-
    Vocabulary: "Acre" is glossed in the source as "about a quarter of a dunam". An
    acre is about 4 dunams (4,047 m²), so the gloss was corrected to "יחידת מידה
    לשטח, כ-4 דונם". Please check. The English definitions are kept in a table under
    the cards (the cards hold a term and a Hebrew gloss only).
  - >-
    Small corrections: "Massai" → "Maasai"; "Sometimes these projects can be affected
    by the community, and sometimes they are decisions made from up above" →
    "Sometimes the community can influence these projects, and sometimes the
    decisions are made from above"; stray asterisks and broken bold removed; Quizlet
    tracking parameters removed. Warm-up example answers: "Givataim" → "Givatayim",
    "everything at my reach" → "everything within reach", "a closed and united
    community" → "a close and united community", "I enjoy having peace and quiet,
    but also have to earn money" → "I enjoy peace and quiet, but I also have to earn
    money". In the homework, the third Mori message was slightly
    shortened into one paragraph without changing what it asks.
  - >-
    The source gives no times for the activities and no lesson plan, so no minutes
    were added. The "Answer of student 1/2/3" lines are replaced by the answer boxes.
    The level label "3 (extreme)" and the "Students: write the names…" line were not
    copied.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: urban-vs-rural-class
    title: 'Class: Urban vs. Rural'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Urban vs. Rural Life
      - id: skills
        type: cycleOverview
        skills:
          - name: Relative clauses
            description: Add information with *who, which, that, where* (*I live in a city that has many parks.*)
          - name: Expressing opinions
            description: Say what you think, give reasons and compare (*In my opinion, rural life is healthier because…*)
      - id: quizlet-translation
        type: externalLink
        label: 'Urban vs. Rural on Quizlet: English - Translation'
        url: https://quizlet.com/il/1129073522/urban-vs-rural-english-translation-flash-cards/
      - id: quizlet-definition
        type: externalLink
        label: 'Urban vs. Rural on Quizlet: English - Definition'
        url: https://quizlet.com/il/1129072621/urban-vs-rural-english-definition-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I am ___. My home is in a rural / urban environment.
        example: I am Dana. My home is in an urban environment.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup-how
        type: text
        text: Answer in full sentences. Use relative clauses (*who, which, that, where*) and give reasons.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Would you rather live in an urban or a rural area? Which one offers a better quality of life for you personally?
            frame: I would rather live in a ___ area that ___ because ___.
          - question: Describe a neighborhood that you enjoyed living in or visiting. What amenities did it have that made your quality of life better?
            frame: I loved living in ___. I liked that the street had ___. It was different from ___, where ___.
          - question: Tell the class about your current housing situation. Is there something that you would like to change about it? Why?
            frame: I live in ___. I would like to ___ because ___.
          - question: Have you ever moved to a new apartment? Did your quality of life change when you moved? What was the main reason for the change?
            frame: Yes, I have. When I moved from ___ to ___, my quality of life changed for the better / worse because ___.
          - question: If you could choose where to live in the future, what kind of place would you choose and why?
            frame: If I could choose a place to live in the future, I would live in a place where ___.
          - question: What kind of community suits you best? Why?
            frame: I prefer living in a ___ community, because ___.
          - question: Is there urban nature where you live? Do you have time to appreciate it in your daily life?
            frame: Near my home there is a ___ where ___.
          - question: Do you think urban renewal projects, which often include demolition and renovation, are a good solution? Why or why not?
            frame: In my opinion, urban renewal is / isn't a good solution because ___.
      - id: warmup-examples
        type: callout
        tone: info
        title: Example answers
        text: |-
          *I would rather live in a rural area that has good professional and commuting opportunities for my family and me, because I enjoy peace and quiet, but I also have to earn money.*
          *I loved living in Givatayim on one of the main streets. I liked **that** the street had banks, pharmacies, small shops and bars **that** made everything accessible. This was very different from the community I grew up in, **where** everything was a car drive away.*
          *I live in a rental apartment with my partner. I would like to move into a larger apartment because it's a bit crowded, and my office is also my living room.*
          *Yes, I have. When I moved from the USA to Israel, my family's quality of life changed for the worse because we didn't have much money and had to watch our budget.*
          *If I could choose a place to live in the future, I would go back to the neighborhood **where** I grew up. The memories **that** I have from there still make me homesick.*
          *I prefer living in an urban community, but in a quiet neighborhood in the city. I like having everything within reach, but also living in a close and united community.*
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: Demolition in our neighborhood'
        skills: [Relative clauses, Expressing opinions]
        steps:
          - In Israel, we see many demolition and urban renewal projects. Sometimes the community can influence these projects, and sometimes the decisions are made from above.
          - Read the pamphlet that was delivered to your building (your teacher shows it).
          - As a group (and a community), work together and decide what to do. Each student or pair has a role (see the table below).
          - Use the discussion questions below to decide what to do.
          - As a group, decide. Do you support the project, oppose it, or support it with conditions?
        example: '*We support urban renewal, which improves infrastructure, but we want limits on demolition, because residents who live here need stability.*'
      - id: act1-roles
        type: table
        caption: Roles
        header: [Role, Point of view]
        rows:
          - [Long-time resident, 'Worried about noise, demolition and quality of life']
          - [Young professional, 'Supports skyscrapers, amenities and an urban lifestyle']
          - [Parent / family resident, 'Concerned about safety, open spaces and the commute']
          - [Community representative, Focused on compromise and regional council decisions]
      - id: act1-questions
        type: discussionQuestions
        title: Discussion questions
        items:
          - question: How will the demolition affect people who live here now, especially residents who have lived here for many years?
          - question: Do you think urban renewal is a good solution for this neighborhood, which already has high population density? Why or why not?
          - question: What are your main concerns about construction (noise pollution, commute, safety, isolation, etc.)? Give a personal example.
          - question: What benefits do you see in green buildings and improved infrastructure that could improve the quality of life?
          - question: How will this project change the character of the neighborhood where you live? Is that positive or negative for you?
          - question: 'Our decision: ___'
            frame: We support / oppose the project, which ___, because ___.
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Activity 2: The Amish community'
        skills: [Expressing opinions]
        steps:
          - Watch the first 7 minutes of the documentary about the Amish community.
          - In groups or as a class, talk about the video and answer the questions below.
        resource:
          label: 'The lives of the Amish in the US | DW Documentary'
          url: https://www.youtube.com/watch?v=B9He5DVePvk
      - id: act2-questions
        type: discussionQuestions
        items:
          - question: What surprised you most about the Amish way of life, and why?
            frame: What surprised me most was ___, because ___.
          - question: How is the Amish lifestyle different from the urban life that most people in Israel know?
          - question: What role does infrastructure (electricity, transportation, technology) play in your daily life, compared to the Amish lifestyle in the video? Could you imagine giving it up?
          - question: What elements of Amish rural life do you think could improve urban or rural life in Israel today? Are there ideas that the country could realistically adopt?
            frame: From my point of view, ___ could work in Israel because ___.
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Activity 3: Urban nature competition'
        skills: [Relative clauses]
        steps:
          - 'Urban nature means natural or green spaces inside cities, such as parks, rivers, gardens or green rooftops. These spaces improve quality of life, reduce stress and noise pollution, and create a balance between urban infrastructure and nature.'
          - "As a group, brainstorm cities that have urban nature (for example: Central Park, Hyde Park, the Bahá'í Gardens…)."
          - In pairs or on your own, search online and find 3 urban nature locations on 3 different continents. Describe them with relative clauses.
          - As a group again, present your locations. The group that found the most unique and special urban nature locations wins!
          - 'Optional: your teacher shows urban nature locations from around the world. Build a sentence with a relative clause about each one.'
        example: |-
          *Central Park, **which** is in New York, is one of the most famous city parks in the world.*
          *Gardens by the Bay in Singapore is an example of urban nature **that** combines advanced technology with natural environments.*
          *Bosco Verticale in Italy is an example of urban nature **where** people can live, and not just a place **where** they can go sightseeing.*
      - id: act3-locations
        type: discussionQuestions
        title: Our urban nature locations
        items:
          - question: 'Location 1: ___'
            frame: ___ in ___ is a park / garden ___ where / that / which ___.
          - question: 'Location 2: ___'
          - question: 'Location 3: ___'
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Activity 4: City mouse, country mouse'
        skills: [Expressing opinions, Relative clauses]
        steps:
          - Read the short story about the city mouse and the country mouse below.
          - 'Debate: Which offers a better quality of life, city life or country life? Group 1: urban life. Group 2: rural life.'
          - 'In your group, think of arguments to support your opinion. Each argument must include at least 3 vocabulary words, at least one relative clause and at least one personal example. Tip: use the story for ideas.'
          - 'Debate! Each group gives one argument at a time: group A gives an argument, group B responds; group B gives an argument, group A responds.'
          - Discuss the questions below as a class.
      - id: act4-story
        type: text
        text: |-
          *The country mouse lived in the quiet countryside, where mornings began with birdsong and nights were dark and peaceful. Food was simple but fresh, and life moved at a slow, predictable pace. One evening, his cousin, the city mouse, arrived with exciting stories about a city full of skyscrapers, bright lights and endless food. Curious and tempted, the country mouse agreed to visit.*

          *As soon as they reached the city, the country mouse was amazed. The streets were alive, the city skyline towered above him, and tables were covered with rich food from every corner of the world. But the excitement didn't last long. Suddenly, loud noises echoed through the building, footsteps rushed past, and doors slammed. The country mouse hid in fear, shaking from the noise and danger that came with this fast-paced life.*

          *When the city mouse later visited the countryside, he enjoyed the fresh air and open spaces at first, but soon felt restless. The silence felt heavy, the nights were long, and there was no excitement to break the routine. In the end, both mice understood an important truth: a good quality of life is not the same for everyone, and a place that feels thrilling to one can feel overwhelming or empty to another.*
      - id: act4-arguments
        type: discussionQuestions
        title: Our arguments
        items:
          - question: 'Argument 1: ___'
            frame: In my opinion, ___ life is better because people who ___.
          - question: 'Argument 2: ___'
          - question: 'Argument 3: ___'
          - question: 'Our answer to the other group: ___'
            frame: I see your point; however, ___.
      - id: act4-discussion
        type: discussionQuestions
        title: Class discussion
        items:
          - question: What part of the story made you think differently?
          - question: Which mouse do you identify with more, and why?
            frame: I identify with the ___ mouse, because ___.
          - question: Are there living situations that offer a balance between urban and rural life?
            frame: I think ___, where ___, offers a balance.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: **relative clauses** (warm-up, Activities 1, 3 and 4)
          and **expressing opinions** (Activities 1, 2 and 4). Choose the warm-up
          questions you need.
      - id: n-warmup
        anchor: warmup
        text: >-
          Ask each student at least two questions. The example answers below show
          relative clauses in bold; read one aloud as a model. Answers typed here are
          visible to you below each question.
      - id: n-act1
        anchor: act1
        text: >-
          The pamphlet ("Demolition Announcement") is a gamma.app page, which is not on
          the link allow-list. Show it on screen from the old notebook, or describe the
          project yourself (an old building in a dense neighborhood will be demolished
          and replaced by a tall green building). Give out the four roles before the
          discussion.
      - id: n-act2
        anchor: act2
        text: Play only the first 7 minutes of the video.
      - id: n-act3
        anchor: act3
        text: >-
          For the optional step, the source has a gamma.app page with pictures of
          urban nature locations ("L3 Urban vs. Rural Activity 3"), which is not on the
          link allow-list. Show it on screen, or choose your own pictures.
      - id: n-act4
        anchor: act4
        text: >-
          Split the class into two groups before reading. Check that every argument
          has a relative clause, three vocabulary words and a personal example.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: urban-vs-rural-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: relative-table
        type: table
        caption: Relative words
        header: [Relative word, When we use it, Example]
        rows:
          - ['**Who**', For people, 'People **who live in cities** often commute long hours.']
          - [
              '**Whom**',
              'For people (formal, object)',
              'The residents **whom we met** supported the project.',
            ]
          - [
              '**Which**',
              For things or ideas,
              'Urban renewal, **which improves infrastructure**, is controversial.',
            ]
          - [
              '**That**',
              For people or things (defining clauses only),
              'A building **that includes green spaces** attracts families.',
            ]
          - ['**Where**', For places, 'This is a city **where urban nature is important**.']
          - ['**When**', For time, 'That was a period **when housing prices increased**.']
          - [
              '**Whose**',
              For possession,
              'A neighborhood **whose residents protested** stopped the demolition.',
            ]
      - id: rules-relative
        type: ruleSummary
        skill: Relative clauses
        rules:
          - text: 'Use relative clauses to **add information** about a person, place, thing or idea. They help us combine ideas into one sentence and avoid repetition, so we sound more fluent and descriptive.'
            examples:
              - I live in a city **that** has many parks.
              - She met a person **who** works as an urban planner.
              - This is a neighborhood **where** people enjoy urban nature.
          - text: '**Defining relative clauses** give **essential** information: we need it to understand who or what we are talking about. We do **not** use commas. We often use *that*, or *who* for people and *which* for things.'
            examples:
              - The apartment **that has a balcony** is very expensive.
              - People **who live in the city center** often deal with noise pollution.
              - I prefer places **where I can walk to work**.
          - text: '**Non-defining relative clauses** add **extra** information that is not essential. We **must** use commas, and we **cannot** use *that*.'
            examples:
              - Tel Aviv, **which is very dense**, has limited green spaces.
              - My brother, **who lives in the suburbs**, prefers a slower lifestyle.
              - Central neighborhoods, **where housing is expensive**, attract young professionals.
      - id: rules-opinions
        type: ruleSummary
        skill: Expressing opinions
        rules:
          - text: 'When we give opinions, we explain how we feel, what we believe and why. A good opinion has **a clear idea, a reason, and sometimes an example**.'
          - text: 'Use **opinion phrases** to introduce your idea, so the listener knows it is a personal view, not a fact: *I think…, I believe…, In my opinion…, From my point of view…, Personally,…*'
          - text: 'Use **reason** and **contrast** words to support your opinion: *because, since, as* (reasons); *but, however, although, on the one hand… on the other hand…* (contrast).'
            examples:
              [
                'Personally, I prefer the countryside because it is slow-paced. However, the commute can be long.',
              ]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: >-
          Go through both skills with the group and ask for one new example for each
          rule. *Whom*, *when* and *whose* are in the table for recognition; the
          practice focuses on *who, which, that, where*.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: urban-vs-rural-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Message 1: Urban and rural life'
        message: |-
          Hi Mori! Let's practice talking about urban and rural life. Please ask me open-ended, conversational questions about my personal experiences living in or visiting cities, suburbs, rural areas or community settlements. Ask me how these places affected my quality of life, about my experiences with noise, commuting, isolation or urban nature, and about my housing preferences. Please encourage me to express clear opinions, support them with reasons and personal examples, use relative clauses, and compare urban and rural lifestyles in a balanced and polite way. You can also ask follow-up questions to help me explain my ideas more deeply.
      - id: interactive-title
        type: heading
        level: 3
        text: Two interactive activities
      - id: mori-2
        type: aiTutorPrompt
        title: 'Activity 1: Urban vs. rural in Israel'
        intro: 'Choose one urban place in Israel (for example: Tel Aviv, Jerusalem, Haifa) and one rural place (for example: a moshav, a kibbutz, a community settlement or a small town). Compare them from your own experience, visits or realistic knowledge. Think about quality of life; urban nature or natural surroundings; noise, pace of life and population density; community feeling and daily routine.'
        message: |-
          Hi Mori! Please help me compare an urban place and a rural place in Israel. Ask me questions that make me describe my experiences, express my opinions, and explain differences in quality of life, urban nature, pace of life and community. Encourage me to use relative clauses (that / which / where), give reasons and add personal examples. Please ask follow-up questions to help me explain my answers more deeply.
      - id: mori-2-remember
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Use at least 4 relative clauses.
          Compare at least 3 aspects of living.
          Give your personal opinions, not only facts.
      - id: act-communities-title
        type: heading
        level: 4
        text: 'Activity 2: Communities and ways of living'
      - id: act-communities-how
        type: text
        text: Many communities live in unique ways, and their lifestyle depends on where they live. Choose **one** of these communities and read about it online **in English**. Then answer the questions below and send your answers to Mori.
      - id: communities
        type: table
        caption: Communities
        header: [Community, Where, About]
        rows:
          - [
              Amish,
              United States,
              'A rural community that avoids most modern technology and values simplicity, agriculture and strict social rules.',
            ]
          - [
              Sami,
              'Northern Norway, Sweden and Finland',
              'An indigenous community living in Arctic regions, traditionally connected to reindeer herding and extreme natural environments.',
            ]
          - [
              People who live in Tokyo,
              Japan,
              'A highly urbanized society with extreme population density and advanced infrastructure. Daily life is fast-paced and strongly shaped by technology and public transportation.',
            ]
          - [
              People who live in Delhi,
              India,
              'An urban community in one of the largest and most densely populated cities in the world. Daily life is shaped by heavy traffic, crowded public spaces, strong social diversity and a fast-paced urban environment, alongside areas of poverty and rapid development.',
            ]
          - [
              Maasai,
              Kenya and Tanzania,
              'A semi-nomadic community living in rural villages, closely connected to land, livestock and traditional customs.',
            ]
      - id: communities-questions
        type: discussionQuestions
        title: My community
        items:
          - question: How does the place where this community lives influence their lifestyle?
            frame: 'Try to use a relative clause (*where / that / which*): They live in a place where ___.'
          - question: What do you think are the main advantages of living in this kind of community?
            frame: Focus on quality of life, community or connection to nature.
          - question: What challenges do you think people in this community face?
            frame: Think about isolation, infrastructure, education or modern life.
          - question: Would you personally feel comfortable living in this community? Why or why not?
            frame: Support your opinion with a reason or a personal comparison.
          - question: Which aspects of this lifestyle could work in modern urban or rural areas today?
            frame: Explain your idea with an example.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Activity 2: Send your answers to Mori'
        intro: Copy the message, then paste your five answers after it.
        message: |-
          Hi Mori! I have completed a class assignment in which I researched and wrote about one community that lives in a unique rural or urban environment. In my answers, I explained where this community lives, how people live there, and how the living environment affects quality of life, community, pace of life and connection to nature. The goal of the task was to express personal opinions and use relative clauses (who / which / that / where) naturally. Please review my answers and help me improve them by checking my grammar, especially relative clauses, my use of opinion language, and overall clarity. Correct any mistakes, suggest more natural phrasing, and give me one improved model sentence for each answer. Please also explain briefly what I did well and what I can improve next time.
      - id: mori-3-remember
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Choose only one community and write as much as you can about it.
          Write informative answers with defining and non-defining relative clauses.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: urban-vs-rural-practice
    book: workbook
    title: 'Practice: Urban vs. Rural'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. Each answer is checked right away, and you can try again.
      - id: ex-relative-clauses
        type: activity
        activity: urban-vs-rural-relative-clauses
      - id: ex-opinions
        type: activity
        activity: urban-vs-rural-opinions

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: urban-vs-rural-vocabulary
    title: Vocabulary
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Urban and rural words
        glossLang: he
        link: https://quizlet.com/il/1129073522/urban-vs-rural-english-translation-flash-cards/
        items: &urban-vs-rural-words
          - { term: Urban, gloss: עירוני }
          - { term: Rural, gloss: כפרי }
          - { term: Infrastructure, gloss: תשתיות }
          - { term: Commute, gloss: נסיעה יומית לעבודה }
          - { term: Urban sprawl, gloss: התפשטות עירונית }
          - { term: Fast-paced, gloss: קצב חיים מהיר }
          - { term: Amenities, gloss: שירותים / מתקנים }
          - { term: Noise pollution, gloss: זיהום רעש }
          - { term: Housing shortage, gloss: מחסור בדיור }
          - { term: Countryside, gloss: אזור כפרי }
          - { term: Agriculture, gloss: חקלאות }
          - { term: Open spaces, gloss: שטחים פתוחים }
          - { term: Population density, gloss: צפיפות אוכלוסין }
          - { term: Self-sufficient, gloss: עצמאי / מקיים את עצמו }
          - { term: Slow-paced, gloss: קצב חיים איטי }
          - { term: Isolation, gloss: בידוד }
          - { term: Natural surroundings, gloss: סביבה טבעית }
