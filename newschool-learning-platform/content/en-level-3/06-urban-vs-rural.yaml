vocabulary:
  - slug: urban-vs-rural
    title: Urban vs. Rural
    items: *urban-vs-rural-words

activities:
  - slug: urban-vs-rural-relative-clauses
    title: 'Relative clauses: who, which, that, where'
    minutes: 8
    items:
      - id: who-people
        type: fillBlank
        prompt: Complete with a relative word.
        text: People ___ live in the city center often deal with noise pollution.
        blanks: [[who, that]]
      - id: where-place
        type: multipleChoice
        prompt: This is a neighborhood ___ people enjoy urban nature.
        options:
          - { text: where, correct: true }
          - { text: who, feedback: '*Who* is for people. For a place, use *where*.' }
          - {
              text: which,
              feedback: '*Which* is for things or ideas. Here we say what happens in the place: *where people enjoy…*',
            }
      - id: words
        type: matching
        prompt: Match each relative word with its use.
        pairs:
          - [who, people]
          - [which, things or ideas]
          - [where, places]
          - [whose, possession]
          - [when, time]
      - id: non-defining
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: 'Tel Aviv, which is very dense, has limited green spaces.', correct: true }
          - {
              text: 'Tel Aviv, that is very dense, has limited green spaces.',
              feedback: 'This is extra (non-defining) information, with commas. We cannot use *that* here: use *which*.',
            }
          - {
              text: 'Tel Aviv, who is very dense, has limited green spaces.',
              feedback: '*Who* is for people. Tel Aviv is a place (a thing): use *which*.',
            }
      - id: commas
        type: trueFalse
        prompt: 'In a defining relative clause (essential information), we use commas: *The apartment, that has a balcony, is very expensive.*'
        answer: false
        feedback:
          correct: 'Right! Defining clauses have no commas: *The apartment that has a balcony is very expensive.*'
          incorrect: 'Defining clauses give essential information and have **no** commas. Commas are for non-defining clauses (extra information).'
      - id: which-thing
        type: fillBlank
        prompt: Complete with a relative word. Notice the commas.
        text: Urban renewal, ___ improves infrastructure, is controversial.
        blanks: [[which]]
      - id: brother
        type: multipleChoice
        prompt: 'My brother, ___ lives in the suburbs, prefers a slower lifestyle.'
        options:
          - { text: who, correct: true }
          - {
              text: that,
              feedback: 'With commas (extra information), we cannot use *that*. For a person, use *who*.',
            }
          - { text: where, feedback: '*Where* is for places. *My brother* is a person: use *who*.' }
      - id: order-parks
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I live in a city that has many parks.

  - slug: urban-vs-rural-opinions
    title: 'Expressing opinions: I believe… because…'
    minutes: 8
    items:
      - id: phrase
        type: multipleChoice
        prompt: Which phrase shows that you are giving a personal opinion, not a fact?
        options:
          - { text: 'Personally, I think…', correct: true }
          - {
              text: 'However,…',
              feedback: '*However* introduces a contrast. To start an opinion, use *I think…, Personally,…, In my opinion…*',
            }
          - {
              text: 'Because…',
              feedback: '*Because* gives a reason. Start with an opinion phrase like *Personally, I think…*',
            }
      - id: good-opinion
        type: trueFalse
        prompt: A good opinion has a clear idea, a reason, and sometimes an example.
        answer: true
        feedback:
          correct: 'Right! *I prefer the countryside (idea) because it is quiet (reason). For example, …*'
          incorrect: 'A good opinion includes a clear idea, a reason, and sometimes an example.'
      - id: reason-contrast
        type: matching
        prompt: Match each word with what it does.
        pairs:
          - [because, gives a reason]
          - [however, shows a contrast]
          - [In my opinion, introduces an opinion]
          - [For example, gives an example]
      - id: however
        type: multipleChoice
        prompt: 'I love the city because it is fast-paced. ___, the noise pollution can be terrible.'
        options:
          - { text: However, correct: true }
          - {
              text: Because,
              feedback: 'The second sentence is a contrast (a negative point), so use *However*.',
            }
          - { text: Since, feedback: '*Since* gives a reason. For a contrast, use *However*.' }
      - id: since
        type: fillBlank
        prompt: Complete with a word that gives a reason (*because*, *since* or *as*).
        text: I would rather live in a rural area, ___ I enjoy peace and quiet.
        blanks: [[because, since, as]]
      - id: other-hand
        type: fillBlank
        prompt: Complete the contrast.
        text: On the one hand, the city has many amenities. On the ___ hand, the commute is long.
        blanks: [[other]]
      - id: vocab
        type: multipleChoice
        prompt: 'In my opinion, rural life is better because it is calm and relaxed. Rural life is ___.'
        options:
          - { text: slow-paced, correct: true }
          - {
              text: fast-paced,
              feedback: '*Fast-paced* means busy and moving quickly. Calm and relaxed is *slow-paced*.',
            }
          - {
              text: self-sufficient,
              feedback: '*Self-sufficient* means able to live without outside help. Calm and relaxed is *slow-paced*.',
            }
      - id: order-believe
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I believe that urban nature improves our quality of life.
