vocabulary:
  - slug: health
    title: Health
    items: *health-words

activities:
  - slug: health-past-habits
    title: 'Past habits and states: used to, would, past simple'
    minutes: 8
    items:
      - id: used-to-skip
        type: multipleChoice
        prompt: I ___ skip breakfast, but now I eat every morning.
        options:
          - { text: used to, correct: true }
          - {
              text: use to,
              feedback: "In positive sentences, write *used to*: *I used to skip breakfast.* (*use to* comes after *did / didn't*.)",
            }
          - {
              text: was used to,
              feedback: 'For a past habit that is different now, use *used to* + verb: *I used to skip breakfast.*',
            }
      - id: long-hair
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: I used to have long hair., correct: true }
          - {
              text: I would have long hair.,
              feedback: '*Would* is for repeated actions, not states. *Have* (long hair) is a state, so use *used to*.',
            }
          - {
              text: I use to have long hair.,
              feedback: 'In positive sentences, write *used to*: *I used to have long hair.*',
            }
      - id: would-states
        type: trueFalse
        prompt: 'We can use *would* for past states, with verbs like *be, have* and *feel*.'
        answer: false
        feedback:
          correct: 'Right! *Would* is only for repeated actions: *We would have coffee together every morning.* For states, use *used to*: *I used to be very fit.*'
          incorrect: '*Would* is for repeated actions, not states. For states, use *used to*: *I used to be very fit.*'
      - id: coffee
        type: fillBlank
        prompt: 'Complete with *would* or *used to*.'
        text: When I worked at the hospital, we ___ have coffee together every morning.
        blanks: [[would, used to]]
      - id: did-you-use
        type: fillBlank
        prompt: Complete the question.
        text: Did you ___ to eat differently when you trained more?
        blanks: [[use]]
      - id: which-form
        type: matching
        prompt: Match each sentence with what it shows.
        pairs:
          - [I broke my leg in 2015., a specific completed action]
          - [I used to be very fit., a past state that is different now]
          - [Every summer we would swim in the sea., a repeated action in a memory]
          - [
              "People used to smoke inside restaurants, but today it's not allowed.",
              a past habit that is different now,
            ]
      - id: went-doctor
        type: fillBlank
        prompt: Write *go* in the past simple.
        text: I ___ to my family doctor last week.
        blanks: [[went]]
      - id: order-jogging
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I used to go jogging every morning.

  - slug: health-modal-verbs
    title: 'Modal verbs: You should rest, you must take your medicine'
    minutes: 8
    items:
      - id: must-take
        type: multipleChoice
        prompt: She must ___ her medicine every morning.
        options:
          - { text: take, correct: true }
          - {
              text: takes,
              feedback: 'After a modal verb, use the base form with no *-s*: *She must take…*',
            }
          - { text: to take, feedback: 'Do not use *to* after *must*: *She must take…*' }
      - id: should-call
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: He should call an ambulance., correct: true }
          - {
              text: He shoulds call an ambulance.,
              feedback: 'Modal verbs do not change for *he / she*: *he should*, not *he shoulds*.',
            }
          - {
              text: He should calls an ambulance.,
              feedback: 'After a modal verb, use the base form: *should call*.',
            }
      - id: modal-meanings
        type: matching
        prompt: Match each sentence with its meaning.
        pairs:
          - [You must rest., necessity]
          - [You should rest more., gentle advice]
          - [You could try yoga., a friendly suggestion]
          - [You might feel better after a walk., a possibility (not sure)]
      - id: should-water
        type: fillBlank
        prompt: 'Give gentle advice with a modal verb.'
        text: You ___ drink more water. It's good for your headaches.
        blanks: [[should, ought to]]
      - id: might-help
        type: fillBlank
        prompt: 'Use a modal verb of possibility (you are not sure).'
        text: "Yoga ___ help you relax, but I'm not sure."
        blanks: [[might, may, could]]
      - id: have-to
        type: trueFalse
        prompt: '*Must* and *have to* can both show necessity: *You must rest. / You have to rest.*'
        answer: true
        feedback:
          correct: "Right! Both show necessity. Remember: *have to* changes with the person (*she has to*), but *must* doesn't."
          incorrect: 'Both *must* and *have to* show necessity: *You must rest. / You have to rest.*'
      - id: alone
        type: trueFalse
        prompt: 'A modal verb can come alone, without another verb: *She must medicine.*'
        answer: false
        feedback:
          correct: 'Right! Always add a verb in the base form: *She must take medicine.*'
          incorrect: 'A modal verb never comes alone. Add a verb in the base form: *She must take medicine.*'
      - id: order-walk
        type: reorderSentence
        prompt: Put the words in order.
        sentence: You might feel better after a walk.
