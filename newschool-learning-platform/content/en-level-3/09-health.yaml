# Cycle "Health", converted from the English level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-level-3
slug: health
title: Health
goal: Talk about health with past habits and states (used to, would, past simple) and modal verbs.
position: 9
status: in_review

review:
  - >-
    The two workbook exercises ("Past habits and states" and "Modal verbs") are NEW:
    the notebook has no self-study exercises. They were written from the cycle's
    summary rules, the grammar reminder, the activity examples and the vocabulary.
    Please check level, wording and every right answer before students see them.
  - >-
    Activity 4, example point: "Hospitals used to have only doctors. Today, they have
    other specialists like nurses, psychologists…" is not historically right (nurses
    worked in hospitals long before 1891). It now reads "Hospitals used to have
    mostly doctors and nurses. Today, they also have psychologists, physical
    therapists and occupational therapists." "Extra scores" → "extra points".
  - >-
    Summary, past habits: the past simple rule had no example; one was added (*I
    broke my leg in 2015.*). An example of *would* with a state was added to show the
    rule "not states" (*I used to have long hair* ✓ / *I would have long hair* ✗), and
    the negative and question forms *didn't use to / Did you use to…?* (used in
    Activity 1) were added. Please confirm.
  - >-
    Grammar reminder: *have to* is listed with the modal verbs. It works like a modal
    for necessity but changes with the person (*she has to*); a short note was added
    to the summary. Please confirm.
  - >-
    Activity 3: the forum post is on a canva.com page, which is not on the link
    allow-list; the link was removed (the post text from the notebook is kept in the
    page). "alternitive" → "alternative". Broken emoji were removed.
  - >-
    Activity 4: the painting "The Doctor" (1891) by Sir Luke Fildes has no link in
    the source; a teacher note says to show it on screen.
  - >-
    Activity 2: "What could make your service special over others?" → "What could
    make your service special, different from the others?".
  - >-
    Homework, "The people who helped me feel better": "What health professions helped
    you?" → "Which health professionals helped you?"; "What treatment or advice did
    you give?" → "What treatment or advice did they give you?". "My mysterious
    illness": "Which health professions have seen or might see" → "Which health
    professionals have seen you or might see you". "Send him this message" → "send
    this message". Broken emoji were removed from the example post.
  - >-
    Small corrections: "health related" → "health-related"; stray asterisks and
    broken bold were removed. The two Quizlet links are kept without their "?i=…&x=…"
    parameters.
  - >-
    Vocabulary: the source has an English definition for every word; the vocabulary
    block has only a term and a Hebrew gloss, so the definitions were left out (they
    are on the definition Quizlet set). Note that the source definition of "Therapy"
    is circular ("a type of therapy… to improve… help"), for the Quizlet set. Terms
    fixed: "Phisycal Therpist" → "Physical therapist"; "Occupational Therapist" →
    "Occupational therapist"; "Social Worker" → "Social worker". Glosses changed:
    Flexible "גמישות" (a noun) → "גמיש"; Nurse "אח / אחות סיעודיים" → "אח / אחות".
  - >-
    The source gives timings only for Activity 2 (15 minutes to plan) and Activity
    4 (10 minutes to plan); they are in the steps and teacher notes. Warm-up frames
    for questions without one in the source were added. The "Answer of student
    1/2/3" lines are replaced by the answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: health-class
    title: 'Class: Health'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Health
      - id: skills
        type: cycleOverview
        skills:
          - name: Past habits and states
            description: '*used to*, *would* and the past simple (*I used to skip breakfast.*)'
          - name: Modal verbs
            description: 'Advice, possibility and necessity: *should, might, could, have to, must* (*You should rest more.*)'
      - id: quizlet-definition
        type: externalLink
        label: 'Health on Quizlet: English – Definition'
        url: https://quizlet.com/il/1106437787/extreme-english-health-english-definition-flash-cards/
      - id: quizlet-translation
        type: externalLink
        label: 'Health on Quizlet: English – Translation'
        url: https://quizlet.com/il/1106438637/extreme-english-health-englishtranslation-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I am ___. I think that people should be as healthy as me / should try to be healthier than me.
        example: I am Dana. I think that people should try to be healthier than me.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: How do you define health? Give examples.
            frame: In my opinion, health is ___. For example, ___.
          - question: What is an unhealthy habit that you **used to** have?
            frame: I used to ___, but now I don't anymore because ___.
          - question: What is a health-related subject that **should** be taught in school, but isn't?
            frame: A health-related subject that should be taught in school is ___ because ___.
          - question: What is a healthy habit that you **might** adopt? Explain your answer.
            frame: I might ___ because ___.
          - question: When you feel stressed, what **might** help you relax or feel better?
            frame: ___ might help me feel relaxed when I'm stressed because ___.
          - question: What bad habits do you think people **should** avoid in order to live longer?
            frame: I think people should avoid ___ because ___.
          - question: How has your lifestyle changed since you became an adult? What things did you **use to** do differently?
            frame: When I was younger, I used to ___. Now I ___.
          - question: What **could** you do to make your mental health or well-being better?
            frame: I could ___.
      - id: grammar-reminder
        type: callout
        tone: info
        title: Quick grammar reminder
        text: |-
          *used to* → a past habit or state that is different now
          *would* → repeated past actions (not states)
          **past simple** → a specific completed action
          **Modal verbs:** *should / might / could / have to / must*
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: My fitness as a child vs. today'
        skills: [Past habits and states]
        steps:
          - 'First, talk about the difference between **fitness** and **health** (כושר לעומת בריאות).'
          - 'Think about your fitness habits when you were younger (5 years ago, last year, or when you were a teenager): what you used to do, how you used to feel about it, and what is different today.'
          - In pairs or groups, talk about your past and present fitness routines. Ask about past habits that don't happen anymore (*used to*) and about specific past actions (past simple). Use the questions below.
        example: |-
          *A: Did you use to eat differently when you trained more?*
          *B: Yes, I did. I used to eat a big breakfast every morning, but now I often skip it.*
      - id: act1-questions
        type: discussionQuestions
        title: Questions to ask
        items:
          - question: Did you have any fitness goals or routines back then?
            frame: Yes, I did. I used to ___.
          - question: What was your energy level like compared to now?
          - question: Did you use to eat differently when you trained more?
          - question: How has your daily routine changed since then?
          - question: "What healthy habits do you have today that you didn't use to have?"
          - question: What do you wish you still did?
          - question: Why did you stop? How did it make you feel?
          - question: Would you like to do it again?
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Activity 2: Mindfulness'
        skills: [Modal verbs]
        steps:
          - What does **mindfulness** mean to you? Why do you think it is so popular today?
          - 'Split into 2 groups. One group plans a **mindfulness retreat**; the other designs a **mindfulness app** for the public. The goal of both: to help people relax, focus and reduce stress.'
          - In your group, plan your idea with modal verbs. Use the questions below (15 minutes).
          - Each group presents its ideas to the class. The other group asks 2–3 follow-up questions.
        example: '*People who work long hours might use our app. There should be a short breathing exercise every morning. Phones must not be allowed at the retreat.*'
      - id: act2-plan
        type: discussionQuestions
        title: Our plan
        items:
          - question: What kind of people might use your service?
            frame: ___ might use our service.
          - question: What activities should there be?
            frame: There should be ___.
          - question: What must not be allowed?
            frame: ___ must not be allowed.
          - question: What could make your service special, different from the others?
            frame: ___ could make our service special.
          - question: What rules will people have to follow?
            frame: People will have to ___.
          - question: What features can people personalize?
            frame: People can personalize ___.
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Activity 3: Health and wellness forum'
        skills: [Modal verbs]
        steps:
          - You have just joined an online Health and Wellness Forum. A new member has posted a desperate message asking for help. Read the post carefully.
          - 'As forum members, write 4–5 pieces of advice in the comments: medical, alternative and emotional advice. Use modal verbs for suggestions, possibilities and necessity.'
          - Pay attention to social norms, and remember to be kind!
        example: '*You should drink less coffee. You might feel better if you go jogging again. You must not skip meals!*'
      - id: act3-post
        type: callout
        tone: info
        title: 'HELP! Feeling sick but no one knows why'
        text: |-
          *Hi everyone,*
          *I've been feeling unwell for the last few months, and I don't know what's wrong.*
          *It started with **constant fatigue** – I wake up tired, even after sleeping 9 hours. Then I began to get **headaches**, **dizziness**, and sometimes my **hands shake** for no reason. I've done blood tests, heart tests, even a brain scan – everything looks normal.*
          *My doctor says it's "probably stress," but I'm not sure. I work from home all day, and I hardly go outside. I used to go jogging, but lately I've stopped. I also drink a lot of coffee – maybe too much – and I often skip meals when I'm busy.*
          *A friend told me to try yoga or acupuncture. My mother says I should eat more soup. My neighbor gave me herbal drops that taste like sadness.*
          *I'm open to anything – traditional medicine, natural healing, even something a bit strange – as long as it helps me feel like myself again.*
          *What should I do?*
          *– Tired and Confused in Tel Aviv*
      - id: act3-comments
        type: discussionQuestions
        title: My comments
        items:
          - question: 'Medical advice: ___'
            frame: You should ___. / You must ___.
          - question: 'Alternative advice: ___'
            frame: You could try ___.
          - question: 'Emotional advice: ___'
            frame: It might help to ___.
          - question: 'Another piece of advice: ___'
          - question: 'Another piece of advice: ___'
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Activity 4: Health in history'
        skills: [Past habits and states]
        steps:
          - 'Look at the painting *The Doctor* (1891) by Sir Luke Fildes. What do you see in the picture? How do you think people took care of their health at that time? What was the doctor doing differently from doctors today, or the same?'
          - 'Debate in two groups: *"People were healthier in the past than they are today."* One group agrees and one group disagrees.'
          - 'Each group plans for 10 minutes and prepares 4 points: a past habit (*used to* + verb), a repeated past action (*would* + verb), a past state (*used to be / feel / have*) and a comparison.'
          - The groups present one point at a time. Connect to the other group's point before you present your own (*That's a good point; however, …*) to get extra points.
        example: |-
          *People wouldn't check their symptoms on the internet and then freak out.*
          *Hospitals used to have mostly doctors and nurses. Today, they also have psychologists, physical therapists and occupational therapists.*
      - id: act4-points
        type: discussionQuestions
        title: Our 4 points
        items:
          - question: 'A past habit: ___'
            frame: People used to ___.
          - question: 'A repeated past action: ___'
            frame: People would ___.
          - question: 'A past state: ___'
            frame: People used to be / feel / have ___.
          - question: 'A comparison: ___'
            frame: In the past, ___, but today ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: **past habits and states** (warm-up, Activities 1 and
          4) and **modal verbs** (warm-up, Activities 2 and 3).
      - id: n-warmup
        anchor: warmup-title
        text: >-
          Pick from the 8 questions. Make sure students answer in full sentences. Go
          over the quick grammar reminder before the activities. Answers typed here
          are visible to you below each question.
      - id: n-act1
        anchor: act1
        text: Start by defining fitness vs. health (כושר לעומת בריאות) with the group.
      - id: n-act2
        anchor: act2
        minutes: 15
        text: >-
          Start with a short question about mindfulness: what it means to the students
          and why they think it is so popular today. Groups plan for 15 minutes, then
          present.
      - id: n-act3
        anchor: act3
        text: >-
          The interactive post in the old notebook is a canva.com design (not on the
          link allow-list). The full text of the post is on this page; you can also
          share the Canva design on screen.
      - id: n-act4
        anchor: act4
        minutes: 10
        text: >-
          Show the painting *The Doctor* (1891) by Sir Luke Fildes on screen (search
          for it by name; there is no link in the source). Give extra points to a group
          that connects to the other group's point before presenting its own.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: health-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-modals
        type: ruleSummary
        skill: Modal verbs
        rules:
          - text: '**Modal verbs** are "helping" verbs that show the speaker''s attitude: possibility, necessity or advice. Choose the right one for how strong or polite you want to sound.'
            examples:
              - You should rest more. (gentle advice)
              - You must rest. (necessity)
              - You could rest. (friendly suggestion)
          - text: 'A modal verb does not come by itself! Always add another verb in the **base form** (V1).'
            examples: ['She must medicine. ❌', 'She must **take** medicine. ✅']
          - text: "Modal verbs **don't change** for people or numbers. They stay the same with every subject."
            examples:
              [
                'He shoulds call an ambulance. ❌',
                'He should call an ambulance. ✅',
                'They should call an ambulance. ✅',
              ]
          - text: '*Have to* also shows necessity, but it changes with the person: *I have to, she has to.*'
            examples: [I have to stretch every day., She has to take her medication in the morning.]
      - id: rules-past-habits
        type: ruleSummary
        skill: Past habits and states
        rules:
          - text: 'To talk about past habits and states, we can use **used to**, **would** or the **past simple**.'
          - text: "**Used to** + verb: things that were true or repeated in the past, but **not now**. Good for personal stories, nostalgia or comparing generations. Negative: *didn't use to*; question: *Did you use to…?*"
            examples:
              - "I used to skip breakfast. (I don't do this anymore.)"
              - "People used to smoke inside restaurants, but today it's not allowed."
              - Did you use to eat differently when you trained more?
          - text: '**Would** + verb: repeated actions or routines in the past, **not states**. Good for memories and stories.'
            examples:
              - When I worked at the hospital, we would have coffee together in the morning.
              - 'I used to have long hair. ✅ / I would have long hair. ❌ (a state)'
          - text: '**Past simple**: specific completed actions. Mix it with *used to* and *would* to make your story sound natural.'
            examples: [I broke my leg in 2015.]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both skills with the group and ask for one new health example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: health-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-main
        type: aiTutorPrompt
        title: Health and well-being
        message: >-
          Hi Mori! Let's talk about health and well-being. Please ask me questions about
          my health habits in the past so that I need to answer using used to, would, or
          the past simple tense. Also, ask me for advice or suggestions about staying
          healthy so that I need to answer using modal verbs like should, might, could,
          or have to. Ask follow-up questions to help me speak more and use complete
          sentences.
      - id: extra-title
        type: heading
        level: 3
        text: Two interactive activities
      - id: helped-questions
        type: discussionQuestions
        title: 'Activity 1: The people who helped me feel better'
        items:
          - question: What happened?
          - question: Which health professionals helped you?
          - question: What treatment or advice did they give you?
          - question: Was it a positive or negative experience? Why?
          - question: How did you feel before, during and after?
          - question: What did you learn from the experience?
      - id: mori-helped
        type: aiTutorPrompt
        title: 'Activity 1: Send your paragraph to Mori'
        intro: >-
          Think of a time when you needed help with your health, physical or emotional.
          It can be a small situation (a sprained ankle, a bad cold, a check-up) or
          something bigger. Answer the questions above in a short paragraph. Send your
          paragraph to Mori, then send this message.
        message: |-
          Hi Mori! I wrote a short paragraph about a time I needed help with my health.
          Please read my paragraph, highlight and correct any grammar mistakes, and give me tips on how to improve my mistakes.
          Then, ask me follow-up questions about my experience so I can practice using past tenses (past simple, used to, would) and modal verbs (should, might, could, have to).
          Please help me speak in full sentences and use the grammar correctly in my answers.
      - id: helped-remember
        type: callout
        tone: tip
        title: "Don't forget to use"
        text: |-
          **Past simple:** *I visited / I felt / I learned*
          **Used to:** *I used to ignore small pains.*
          **Modal verbs:** *I should rest more. / I might visit again. / I have to stretch every day.*
      - id: illness-task
        type: text
        text: |-
          **Activity 2: My mysterious illness.** Imagine you are writing on an online forum for people with strange health problems. Write a post that is creative but realistic, about 8–10 sentences long. Include:
          a title for the post;
          what you have already tried to feel better;
          which health professionals have seen you or might see you;
          how you feel about the situation;
          what kind of advice you are looking for.
      - id: illness-example
        type: callout
        tone: info
        title: 'Example post: "Strange dizziness every morning!"'
        text: |-
          *Hi everyone,*
          *For the last two weeks, I've been feeling dizzy every morning when I get out of bed. I used to sleep really well, but now I wake up tired and heavy. I went to my family doctor, but all my blood tests were normal. My nurse friend said I should drink more water, but it didn't help. I might try seeing a physiotherapist next week because I think it's something with my neck. Has anyone had this before? What could it be?*
      - id: mori-illness
        type: aiTutorPrompt
        title: 'Activity 2: Send your post to Mori'
        intro: Send your post to Mori, then send this message.
        message: |-
          Hi Mori! I have written a post for a health forum about a strange illness. Please read my post, correct any grammar mistakes, and explain my mistakes. Then, ask me follow-up questions about my situation so that I can practice using modal verbs (should, might, could, have to) and past tenses (past simple, used to, would).
          Ask realistic questions - like a doctor or someone in a health forum would - and help me answer in full sentences.
      - id: illness-remember
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Write your post in a short and interesting way, so that others will enjoy reading it!
          Ask Mori questions, as if you are talking in a forum.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

