# Cycle "Education", converted from the English level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-level-3
slug: education
title: Education
goal: Talk about learning experiences with the present perfect, and about the future of education with will and going to.
position: 2
status: in_review

review:
  - >-
    The two workbook exercises ("Present perfect" and "Will or going to") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's summary
    rules, the activity examples and its vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Summary, present perfect rule 1: the source says the present perfect is for
    experiences "at an unspecified time" but gives the example "I have studied English
    for 5 years", which is the other use (something that started in the past and
    continues now). The rule now has the example "I have studied at a university", and
    a second rule with *for / since* keeps "I have studied English for 5 years". Rule 2
    ("Sometimes the verb looks like the past tense, sometimes it changes") now explains
    regular (-ed) and irregular past participles with examples. Please confirm.
  - >-
    Summary, will vs. going to rule 3 ("start with going to for your plan, then will
    for the result") is a useful pattern, not a strict rule; it now says "often". The
    workbook does not test it.
  - >-
    Warm-up question 5 ("What is one subject that you think will not be taught in
    school in 50 years?") had the model answer "I have/haven't felt guilty about
    something small", copied by mistake from the "Feelings and emotions" cycle. It was
    replaced with "I think ___ will not be taught in school in 50 years, because ___".
    Frames were added to the questions that had none.
  - >-
    Small corrections: Activity 1 skill "Perfect tense" → "Present perfect"; warm-up 3
    "studied in a form of higher education like college or a university" → "studied at
    a college or a university"; "learning disabilites" → "learning disabilities";
    garbled emoji characters ("ð", "ð°", "ð§") and stray asterisks were removed. Activity
    2 example "(decision/promise)" is kept as "a promise".
  - >-
    Vocabulary: "Achivement" → "Achievement", "Confrence" → "Conference", "Asignment" →
    "Assignment", "School Secritery" → "School secretary", "Guidance Counsler" →
    "Guidance counselor". "To assess" was glossed "להעריך באופן בוחן"; it is now "לבחון /
    להעריך" (please confirm). The "Definition" column was left out (the vocabulary block
    has a term and a Hebrew gloss only); note that in the source the definition of
    "Vocational training" is cut off ("Education that") and "After-school activities"
    has none, and "College" says "high education" (→ higher education) — fix them on
    Quizlet if needed.
  - >-
    Both Quizlet links (translation and definitions) are kept without their tracking
    parameters (?i=…&x=…). The "Level: 3 (extreme)" header and the "Students" line were
    left out. The "Answer of student 1/2/3" lines are replaced by the optional answer
    boxes. Times kept as given: Activity 1, 5 minutes to brainstorm and 10 to write;
    Activity 2, 10 minutes to plan and 3 to present.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: education-class
    title: 'Class: Education'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Education
      - id: skills
        type: cycleOverview
        skills:
          - name: Present perfect
            description: Learning experiences and their results now (*My teacher has encouraged me.*)
          - name: Will vs. going to
            description: Predictions and promises with *will*, plans with *going to* (*We're going to train teachers. It will help students.*)
      - id: quizlet-he
        type: externalLink
        label: Education on Quizlet (English–Hebrew)
        url: https://quizlet.com/il/1107211102/education-translation-flash-cards/
      - id: quizlet-def
        type: externalLink
        label: Education on Quizlet (English definitions)
        url: https://quizlet.com/il/1107209463/education-definitions-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I am ___. My favorite subject in school was ___.
        example: I am Shachar. My favorite subject in school was history.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: Have you ever had a meaningful learning experience that you still think about today? Did it happen in a formal or a non-formal place of education?
            frame: Yes, I have. / No, I haven't. ___
          - question: Have you ever studied a subject that was very difficult for you? What did you do?
            frame: Yes, I have. I have studied ___. I ___.
          - question: Have you ever studied at a college or a university? How was the experience compared to school as a child?
            frame: Yes, I have. / No, I haven't. Compared to school, ___.
          - question: Have you ever been part of a group project? What was your role in the group?
            frame: Yes, I have. My role was ___.
          - question: What is one subject that you think will not be taught in school in 50 years?
            frame: I think ___ will not be taught in school in 50 years, because ___.
          - question: Are you going to study something new next year? Tell the class about it.
            frame: Yes, I'm going to study ___. / No, I'm not going to ___.
          - question: If you could pick a subject to learn in vocational training, what would it be and why?
            frame: If I could pick a subject, I would learn ___ because ___.
          - question: Have you ever been part of an informal education program? Tell the class about it.
            frame: Yes, I have. I have been part of ___. / No, I haven't.
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: A letter to my mentor'
        skills: [Present perfect]
        steps:
          - Think of a mentor who encouraged you to be your best. It can be a teacher, a guidance counselor, a coach or anyone else.
          - Brainstorm together (5 minutes) with the questions below.
          - Write a short letter (8–10 sentences) to your mentor (10 minutes). Use the present perfect to say what this person has done for you.
          - Share your letter in pairs or with the class.
        example: |-
          *Dear Mrs. Cohen,*
          *I've always remembered your English lessons. You have encouraged me to speak with confidence, and you've helped me enjoy learning. I still use the things you've taught me every day. When I felt nervous before tests, you always supported me. Thank you for everything you've done for me.*
          *Best wishes, Maya*
      - id: act1-brainstorm
        type: discussionQuestions
        title: Brainstorm
        items:
          - question: Who is the person?
            frame: My mentor is ___. He / She was my ___.
          - question: What has the person done? (has / have + V3)
            frame: He / She has ___.
          - question: How has this affected your life?
            frame: Thanks to him / her, I have ___.
          - question: What is one thing you want to thank this person for?
            frame: Thank you for ___.
      - id: act1-letter
        type: discussionQuestions
        title: My letter
        items:
          - question: Dear ___,
            frame: You have ___. You've helped me ___. Thank you for ___.
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Activity 2: Education for everyone'
        skills: [Will vs. going to]
        steps:
          - You are the **Ministry of Education team**. You are planning a new **Inclusive Learning Program** for all children, with and without disabilities.
          - In groups, plan your program (10 minutes). Say your plans and intentions with *going to*, and your predictions and promises with *will*.
          - Present your ideas to the class (3 minutes).
          - After each presentation, another group asks the presenting group a follow-up question.
        example: |-
          *We're going to train teachers to use new learning tools. (a plan)*
          *We will build more accessible classrooms. (a promise)*
          *Students with learning disabilities will receive extra support. (a prediction)*
          *We're going to include more technology in lessons. (an intention)*
      - id: act2-plan
        type: discussionQuestions
        title: Our Inclusive Learning Program
        items:
          - question: 'Our plans and intentions:'
            frame: We're going to ___. We're going to ___.
          - question: 'Our promises and predictions:'
            frame: We will ___. Students will ___.
          - question: 'Our follow-up question for another group:'
            frame: How are you going to ___? / Do you think ___ will ___?
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Activity 3: What type of learner are you?'
        skills: [Present perfect]
        steps:
          - How do you prefer to learn something new? By reading, listening or doing? Is one harder for you than the others?
          - Read the learning styles below.
          - In pairs, ask each other the quiz questions. Answer in full sentences.
          - Decide what type of learner your partner is, and tell the group.
        example: |-
          *A: Have you ever learned something just by watching someone do it?*
          *B: Yes, I have. I learned to cook by watching my grandmother.*
          *A: I think you are a visual learner.*
      - id: act3-styles
        type: table
        caption: Learning styles
        header: [Learner, Learns best…]
        rows:
          - [Visual, 'by seeing things like pictures, videos and written notes']
          - [Auditory, by listening to explanations and discussions]
          - [Kinesthetic, 'by doing and moving, using the body to understand things']
          - [Social, 'by working with others, sharing ideas and talking about them']
          - [Online, 'through technology: digital courses, videos or apps']
          - [Vocational, from practical training for real jobs and skills]
      - id: act3-quiz
        type: discussionQuestions
        title: 'Quiz: What type of learner are you?'
        items:
          - question: Have you ever learned something just by watching someone do it?
          - question: Have you ever recorded or listened to lessons to remember better?
          - question: Have you ever built, fixed or created something to understand it?
          - question: Have you ever studied better in a group than alone?
          - question: Have you ever learned something by writing or reading notes many times?
          - question: Do you think you will learn new things online or in a classroom in the future?
          - question: Are you going to take any courses or workshops this year? What kind?
          - question: Do you think technology will make learning easier for you?
          - question: 'My partner is a ___ learner, because ___.'
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Activity 4: My classroom in the future'
        skills: [Will vs. going to]
        steps:
          - Imagine that you are a teacher in 2050. Choose 3 subjects that are not taught in school today.
          - For each subject, say why it will be important and how you are going to teach it.
          - In pairs or groups, present your future subjects. The others ask follow-up questions.
        example: |-
          *I am going to teach a Mental Health Awareness class.*
          *Students will learn how to manage stress and emotions.*
          *I'm going to invite professionals to give talks.*
      - id: act4-subjects
        type: discussionQuestions
        title: My subjects in 2050
        items:
          - question: 'Subject 1: ___'
            frame: I'm going to teach ___. It will be important because ___. I'm going to ___.
          - question: 'Subject 2: ___'
            frame: I'm going to teach ___. It will be important because ___. I'm going to ___.
          - question: 'Subject 3: ___'
            frame: I'm going to teach ___. It will be important because ___. I'm going to ___.
      - id: act4-followup
        type: discussionQuestions
        title: Follow-up questions
        answerable: false
        items:
          - question: Why did you choose these subjects?
          - question: Which one do you think will help students the most?
          - question: Are you going to focus more on theory or practice?
          - question: How will you make the lessons interesting?
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Level 3 (B1). Two skills this cycle: the **present perfect** (warm-up,
          Activities 1 and 3) and **will vs. going to** (Activities 2 and 4; questions 6–8
          of the Activity 3 quiz). Choose the activities that fit your time.
      - id: n-warmup
        anchor: warmup
        text: >-
          Pick the questions that fit your group and ask each student at least two. Make
          sure students answer in full sentences and use the present perfect. Answers
          typed here are visible to you below each question.
      - id: n-act1
        anchor: act1
        text: >-
          Ask the students about a meaningful mentor first. Brainstorm together for 5
          minutes, then give 10 minutes to write. Point out the past simple for details in
          the example (*When I felt nervous…, you always supported me*).
      - id: n-act2
        anchor: act2
        text: >-
          Groups have 10 minutes to plan and 3 minutes to present. Check that every plan
          has both *going to* (plans, intentions) and *will* (predictions, promises).
      - id: n-act3
        anchor: act3
        text: >-
          Ask the group how they prefer to learn before showing the learning styles, and
          explain each style briefly.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: education-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-present-perfect
        type: ruleSummary
        skill: Present perfect
        rules:
          - text: "Use the **present perfect** to talk about what you have experienced or learned in your life, at a time we don't say."
            examples: [I have studied at a university., She has taken an online course.]
          - text: 'Use it with **for / since** for something that started in the past and is still true now.'
            examples: [I have studied English for 5 years.]
          - text: '**Form:** *have / has* + past participle (V3). Regular verbs add **-ed**, like the past simple (*learn → learned*); irregular verbs change (*teach → taught, take → taken*).'
          - text: 'Use the present perfect to **connect the past and the present**, when the result is still true or important now.'
            examples: ["I've learned a lot from my teachers. (The knowledge is still with me now.)"]
          - text: 'Use the **past simple after the present perfect** to add details: when or where it happened.'
            examples: ["I've taken an online course. I took it last year."]
      - id: rules-future
        type: ruleSummary
        skill: Will vs. going to
        rules:
          - text: 'Use **will** for predictions, promises and decisions you make at the moment of speaking.'
            examples:
              [
                I think technology will make learning easier.,
                I promise I will help you.,
                "The door is open. I'll close it.",
              ]
          - text: 'Use **going to** for plans and intentions you decided before.'
            examples: ["I'm going to study nursing next year."]
          - text: 'When you use both, you often start with **going to** for your plan and continue with **will** for the result you expect. *Going to* = what you plan to do; *will* = what you believe will happen because of it.'
            examples:
              [
                "I'm going to take a special education course next year. It will help me work with children with learning disabilities.",
              ]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both skills with the group and ask for one new example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: education-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Message 1: Education and learning'
        message: |-
          Hi Mori! Let's talk about education and learning. Please ask me questions about my learning experiences so that I need to answer using the present perfect tense. Also, ask me about future plans for learning or teaching so that I need to answer using will or going to. Ask follow-up questions to help me speak more and use complete sentences.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Message 2: The students of the future'
        intro: 'Imagine that you are a student in the year 2050. Your teacher, Mori, explains three new school subjects: **Financial classes**, **Mental health classes** and **First aid classes**. Talk to Mori about how these classes will help students in the future.'
        message: |-
          Hi Mori! Let's imagine you are my teacher in the year 2050. You're going to teach me about three new subjects: Financial Classes, Mental Health Classes and First Aid Classes. Please tell me what I'm going to learn in these classes, and ask me questions about what I think will happen in the future because of them. I will try to answer using "will" and "going to" in full sentences.
      - id: mori-2-remember
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Ask follow-up questions, not only answer Mori's questions.
          Answer in full sentences, not only *yes* or *no*.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Message 3: In my life…'
        intro: 'Choose an educational topic that is close to your heart, for example: formal or informal education, art education, technology in schools, languages, learning styles or learning disabilities. Write your topic in the message.'
        message: |-
          Hi Mori! I'd like to talk about an educational topic that is close to my heart: ___. Please ask me questions about my experiences, what I have learned, and what I have done in this area. I want to practice using the present perfect tense, for example sentences like "I've learned...", "I've taken...", "I've discovered..." or "I've met...". After each answer, please ask me a follow-up question so I can explain more and keep the conversation going.
      - id: mori-3-remember
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Use *have / has* + V3 to talk about experiences and results.
          Use the past simple to add details.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: education-practice
    book: workbook
    title: 'Practice: Education'
