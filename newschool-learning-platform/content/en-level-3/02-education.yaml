vocabulary:
  - slug: education
    title: Education
    items: *education-words

activities:
  - slug: education-perfect
    title: 'Present perfect: My teacher has encouraged me'
    minutes: 8
    items:
      - id: have-ever
        type: multipleChoice
        prompt: ___ you ever studied at a university?
        options:
          - { text: Have, correct: true }
          - { text: Has, feedback: '*Has* is for *he, she, it*. For *you*, use *have*.' }
          - {
              text: Did,
              feedback: '*Studied* here is a past participle after *ever*, so we need *have*: *Have you ever studied…?*',
            }
      - id: encouraged
        type: fillBlank
        prompt: 'Write the past participle of *encourage*.'
        text: My teacher has ___ me to speak with confidence.
        blanks: [[encouraged]]
      - id: participles
        type: matching
        prompt: Match each verb with its past participle (V3).
        pairs:
          - [teach, taught]
          - [take, taken]
          - [write, written]
          - [give, given]
          - [be, been]
      - id: took-it
        type: multipleChoice
        prompt: Which is correct?
        options:
          - { text: "I've taken an online course. I took it last year.", correct: true }
          - {
              text: "I've taken an online course last year.",
              feedback: '*Last year* is a specific time, so use the past simple: *I took it last year.*',
            }
          - {
              text: "I took an online course. I've taken it last year.",
              feedback: "Use the present perfect for the experience and the past simple for the time: *I've taken a course. I took it last year.*",
            }
      - id: say-when
        type: trueFalse
        prompt: 'When we say **when** something happened (*last year, in 2020*), we use the past simple, not the present perfect.'
        answer: true
        feedback:
          correct: "Right! *I've studied at a university. I studied there in 2020.*"
          incorrect: 'With a specific time, use the past simple: *I graduated in 2020*, not *I have graduated in 2020*.'
      - id: hasnt-graduated
        type: fillBlank
        prompt: 'Write the negative of *graduate* in the present perfect.'
        text: My sister ___ from university yet.
        blanks: [["hasn't graduated", has not graduated]]
      - id: have-learned
        type: multipleChoice
        prompt: I ___ a lot from my teachers, and I still use it today.
        options:
          - { text: have learned, correct: true }
          - {
              text: has learned,
              feedback: '*Has* is for *he, she, it*. With *I*, use *have*: *I have learned*.',
            }
          - {
              text: learn,
              feedback: 'The learning happened before, and the result is still true now, so use the present perfect: *I have learned*.',
            }
      - id: order-project
        type: reorderSentence
        prompt: Put the words in order.
        sentence: Have you ever been part of a group project?

  - slug: education-future
    title: "Will or going to: It will help. I'm going to study."
    minutes: 8
    items:
      - id: decided
        type: multipleChoice
        prompt: "I've already decided. I ___ study nursing next year."
        options:
          - { text: am going to, correct: true }
          - {
              text: will,
              feedback: 'The plan was decided before, so use *going to*: *I am going to study nursing.*',
            }
          - { text: going to, feedback: 'You need *am* before *going to*: *I am going to study.*' }
      - id: close-door
        type: multipleChoice
        prompt: 'A: The class is very noisy. B: Wait, I ___ close the door.'
        options:
          - { text: will, correct: true }
          - {
              text: am going to,
              feedback: "B decides at the moment of speaking, so use *will*: *I'll close the door.*",
            }
          - {
              text: going,
              feedback: 'For a decision now, use *will* + verb: *I will close the door.*',
            }
      - id: prediction
        type: trueFalse
        prompt: 'We can use *will* for predictions: *I think technology will make learning easier.*'
        answer: true
        feedback:
          correct: 'Right! *Will* is for predictions, promises and decisions at the moment of speaking.'
          incorrect: '*Will* is used for predictions: *Students will receive extra support.*'
      - id: promise
        type: fillBlank
        prompt: Complete the promise.
        text: I promise I ___ help you with your assignment.
        blanks: [[will]]
      - id: train-teachers
        type: fillBlank
        prompt: "It's in our plan. Use *be going to*."
        text: We ___ train teachers to use new learning tools.
        blanks: [[are going to, "'re going to"]]
      - id: uses
        type: matching
        prompt: Match each sentence with its use.
        pairs:
          - ["We're going to include more technology in lessons.", a plan]
          - [I think robots will teach some classes in 2050., a prediction]
          - ["It's cold in here. I'll close the window.", a decision at the moment of speaking]
          - [I promise I will help you after class., a promise]
      - id: going-to-take
        type: multipleChoice
        prompt: Are you ___ any courses this year?
        options:
          - { text: going to take, correct: true }
          - { text: going take, feedback: "Don't forget *to*: *going to take*." }
          - {
              text: go to take,
              feedback: 'The form is *be* + *going to* + verb: *Are you going to take…?*',
            }
      - id: order-teach
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I am going to teach a mental health class.
