          - { term: Protest, gloss: מחאה }
          - { term: To fund, gloss: לממן }
          - { term: To interfere, gloss: להתערב (בצורה שלילית) }
          - { term: To intervene, gloss: להתערב }
          - { term: To preserve, gloss: לשמר }
          - { term: Extinct species, gloss: מינים נכחדים }
          - { term: Consequence, gloss: תוצאה / השלכה }

vocabulary:
  - slug: sustainability
    title: Sustainability
    items: *sustainability-words

activities:
  - slug: sustainability-conditional
    title: 'Second conditional: If cities limited traffic, the air would improve'
    minutes: 8
    items:
      - id: would-decrease
        type: multipleChoice
        prompt: If governments invested more in renewable energy, pollution ___ decrease.
        options:
          - { text: would, correct: true }
          - {
              text: will,
              feedback: 'The if-part uses the past simple (*invested*), so this is an imagined situation. Use *would*, not *will*.',
            }
          - {
              text: would to,
              feedback: 'After *would*, use the base verb without *to*: *would decrease*.',
            }
      - id: reduced
        type: fillBlank
        prompt: Write the verb *reduce* in the correct form.
        text: If people ___ meat consumption, carbon emissions would fall.
        blanks: [[reduced]]
      - id: if-i-were
        type: multipleChoice
        prompt: If I ___ president, I would introduce stricter environmental laws.
        options:
          - { text: were, correct: true }
          - {
              text: am,
              feedback: 'I am not president: this is unreal. The second conditional uses the past simple in the if-part: *If I were…*',
            }
          - {
              text: would be,
              feedback: "Don't use *would* in the if-part. Use the past simple: *If I were president…*",
            }
      - id: not-past
        type: trueFalse
        prompt: '*If cities limited car traffic, air quality would improve.* This sentence talks about the past.'
        answer: false
        feedback:
          correct: Right! We use the past simple, but we are imagining a different present or future.
          incorrect: 'The verb *limited* is in the past simple, but the sentence imagines a different present or future, not the past.'
      - id: meanings
        type: matching
        prompt: Match each word with what it shows in a second conditional sentence.
        pairs:
          - [would, the expected or most likely result]
          - [could, a possible ability or option]
          - [might, a possible but less certain result]
          - [were, the verb *be* in the if-part for all subjects]
      - id: could-reduce
        type: fillBlank
        prompt: Write the modal verb that shows **a possible ability or option**.
        text: If cities invested in public transportation, people ___ reduce their carbon footprint.
        blanks: [[could]]
      - id: which-correct
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: 'If recycling were easier, people would recycle more.', correct: true }
          - {
              text: 'If recycling would be easier, people would recycle more.',
              feedback: "Don't use *would* in the if-part. Use the past simple: *If recycling were easier…*",
            }
          - {
              text: 'If recycling were easier, people recycle more.',
              feedback: 'The result part needs *would* + base verb: *people would recycle more*.',
            }
      - id: order-president
        type: reorderSentence
        prompt: Put the words in order.
        sentence: If I were president, I would ban plastic bags.

  - slug: sustainability-modals
    title: 'Modal verbs: must, should, could, might'
    minutes: 8
    items:
      - id: must-take
        type: multipleChoice
        prompt: Governments must ___ action.
        options:
          - { text: take, correct: true }
          - {
              text: to take,
              feedback: 'After *must*, use the base verb without *to*: *must take*.',
            }
          - { text: taking, feedback: 'After a modal verb, use the base verb: *must take*.' }
      - id: he-should
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: He should protect nature., correct: true }
          - {
              text: He shoulds protect nature.,
              feedback: 'Modal verbs never change form: *he should*, not *he shoulds*.',
            }
          - {
              text: He should protects nature.,
              feedback: 'After a modal verb, use the base verb: *should protect*.',
            }
      - id: how-it-sounds
        type: matching
        prompt: Match each modal verb with when we use it.
        pairs:
          - [must, 'a very strong obligation: laws, no choice']
          - [should, advice or a recommendation]
          - [could, a friendly suggestion or a possibility]
          - [might, an uncertain result]
          - ["shouldn't", saying something is not a good idea]
      - id: shouldnt-build
        type: fillBlank
        prompt: Write the **polite warning** from the summary table (negative of *should*).
        text: We ___ build in protected areas.
        blanks: [["shouldn't", should not]]
      - id: alone
        type: trueFalse
        prompt: '*People should sustainable.* is a correct sentence.'
        answer: false
        feedback:
          correct: 'Right! A modal verb needs a base verb: *People should live more sustainably.*'
          incorrect: 'A modal verb never stands alone. It needs a base verb: *People should live more sustainably.*'
      - id: might-help
        type: multipleChoice
        prompt: This policy ___ help wildlife recover, but we are not sure.
        options:
          - { text: might, correct: true }
          - {
              text: must,
              feedback: '*Must* is a strong obligation. For an uncertain result, use *might*.',
            }
          - {
              text: has to,
              feedback: '*Has to* is about rules and pressure. For an uncertain result, use *might*.',
            }
      - id: has-to
        type: fillBlank
        prompt: Complete with the correct form of *have to*.
        text: The city ___ to reduce air pollution. It's a new law.
        blanks: [[has]]
      - id: order-ought
        type: reorderSentence
        prompt: Put the words in order.
        sentence: Companies ought to reduce environmental damage.
