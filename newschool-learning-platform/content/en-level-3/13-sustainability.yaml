          - { term: Finite resources, gloss: משאבים מתכלים }
          - { term: Solution, gloss: פתרון }
          - { term: Proposal, gloss: הצעה }
          - { term: Campaign, gloss: קמפיין }
          - { term: Slogan, gloss: סיסמה }
