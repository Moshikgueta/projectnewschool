# Cycle "Sustainability", converted from the English level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-level-3
slug: sustainability
title: Sustainability
goal: Talk about the environment with the second conditional and modal verbs.
position: 13
status: in_review

review:
  - >-
    The two workbook exercises ("Second conditional" and "Modal verbs") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's summary
    rules, the summary tables and the vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Summary, modal verbs: rule 3 says "modal verbs never change form", but the table
    includes *have to*, which does change (*he has to*). *Have to* is not a true modal
    verb. A note was added to rule 3 and to the table row ("has to with he / she /
    it"). The rule that a modal needs a base verb now also mentions *ought to* (*ought
    to + base verb*).
  - >-
    Summary, second conditional: "unreal or impossible situations that happen now" →
    "unreal or impossible situations in the present". The *were* rule now adds that
    *If I was…* is also common in informal speech. Please confirm.
  - >-
    Activity 3, Step 3 follow-up question "Will it still work if there is no
    funding?" is a first conditional; changed to "Would it still work if there were no
    funding?" to match the cycle's skills.
  - >-
    Activity 4: "one environmental issue they care about" → "you care about"; closing
    "Best regards, thanks for your time" → "Best regards / Thank you for your time".
    The letter checklist in the source has no grammar requirement; a line was added
    asking for modal verbs and at least one second conditional sentence (the
    activity's skills). Please confirm.
  - >-
    Activity 5: the source names the teams "Group 1 / Group 2" and then "Group A /
    Group B" in the debate steps. Both are now "Group 1 / Group 2".
  - >-
    Activities 2 and 3 use gamma.app pages ("Additional material" with the
    demonstration cards, and the campaign "Visual Aid"). gamma.app is not on the link
    allow-list, so the links were removed and the resources are mentioned in teacher
    notes.
  - >-
    Small corrections: the duplicated title "Sustainabitily" was removed;
    "behaviour" → "behavior" (the course uses American spelling); "city and community
    municipalities" → "cities and local councils"; "banned from usage" → "banned";
    "hypothetical situations in your future" → "in the present or future" (Mori task
    1 tips); stray asterisks and broken bold were removed. The two Quizlet links are
    kept without their "?i=…&x=…" tracking parameters.
  - >-
    The vocabulary table also has English definitions; the vocabulary block only
    holds term + Hebrew gloss, so the definitions are not in the block (they are in
    the "English + Definition" Quizlet set, linked in class). "To conserve" keeps
    both glosses (לשמר / לחסוך).
  - >-
    The source gives a time only for the introduction round (max. 5 minutes) and no
    lesson plan. The plan note (which activity practises which skill) was written from
    the activity skill lines. The "Answer of student 1/2/3" lines are replaced by the
    optional answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: sustainability-class
    title: 'Class: Sustainability'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Sustainability
      - id: skills
        type: cycleOverview
        skills:
          - name: Second conditional
            description: Imagine a different present or future (*If cities limited car traffic, air quality would improve.*)
          - name: Modal verbs
            description: Advice, obligation and possibility (*We should…, Governments must…, This might…*)
      - id: quizlet
        type: externalLink
        label: Sustainability on Quizlet (English + Hebrew)
        url: https://quizlet.com/il/1142375570/sustainability-english-translation-flash-cards/
      - id: quizlet-definitions
        type: externalLink
        label: Sustainability on Quizlet (English + definitions)
        url: https://quizlet.com/il/1142376527/sustainability-english-definition-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I'm ___. I could ___ to protect the environment.
        example: I am Dina. I could use less water when I wash the dishes to protect the environment.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: What is a sustainable habit in another country or community that you think people in Israel should adopt?
            frame: In ___, people ___. I think people in Israel should ___.
          - question: What might stop people from recycling? Does it affect you? Why?
            frame: People might not recycle because ___.
          - question: Is there something you personally could do more to help the environment? Why aren't you doing it now?
            frame: I could ___ (I could + base verb), but ___.
          - question: What would you say to someone who thinks the environment is not important?
            frame: I would tell them that ___.
          - question: What would you do to convince people to recycle more?
            frame: I would ___.
          - question: What should cities and local councils do to make their cities more sustainable?
            frame: Cities should ___.
          - question: If you could pass any law to make your environment greener, what would it be?
            frame: If I could pass a law, I would ___.
          - question: What product should be banned because it's harmful to the environment? Give examples to explain your answer.
            frame: I think ___ should be banned because ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: We could be doing more'
        skills: [Modal verbs]
        steps:
          - 'Individual brainstorm: think about sustainability in everyday life, in business and in government.'
          - Write 4 sentences about what you, your community or your country could be doing more to help the environment. Use modal verbs and the sentence starters below.
          - 'In breakout rooms: share 2 of your ideas and explain why you chose them.'
          - The group responds with modal verbs (not only "I agree") and asks at least one follow-up question about each idea.
          - 'After everyone presents, the group chooses three ideas: the most realistic, the most effective long-term solution and the most controversial idea.'
          - Each group presents its 3 ideas to the class with modal verbs. The class votes again for each category.
      - id: act1-sentences
        type: discussionQuestions
        title: My ideas (choose 4)
        items:
          - question: To protect the planet, people should ___.
          - question: One realistic change individuals could make is ___.
          - question: Governments or big companies must ___.
          - question: This solution might help, but ___.
          - question: If people really cared, they would ___.
          - question: We shouldn't expect ___.
      - id: act1-follow-up
        type: callout
        tone: tip
        title: Follow-up questions
        text: |-
          Why do you think this **would** work?
          Who **should** be responsible for this?
          What **might** go wrong?
          **Could** people realistically change this habit?
          Is this something individuals **must** do, or governments?
      - id: act1-vote
        type: discussionQuestions
        title: Our group's choices
        items:
          - question: 'Most realistic: ___'
          - question: 'Most effective long-term solution: ___'
          - question: 'Most controversial idea: ___'
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Activity 2: Would you cross the line?'
        skills: [Second conditional, Modal verbs]
        steps:
          - Around the world, people try to convince others to recycle more and live sustainably. Some demonstrations are **peaceful**. Others involve **vandalism or aggressive actions**.
          - 'Class brainstorm: have you heard of peaceful or aggressive environmental demonstrations, in Israel or around the world?'
          - 'In groups of 2–4: your group gets 2 demonstration cards, one peaceful and one aggressive.'
          - 'Each student chooses one role and keeps it for both role-plays: environmental activist, government official, ordinary citizen, or tourist watching from the outside.'
          - 'For each demonstration, role-play a short discussion: *If this demonstration happened in our country, would it convince people to recycle more?*'
          - 'Rules: every speaker uses at least one second conditional sentence and at least one modal verb.'
          - Each group shares one sentence about each protest with the class.
        example: |-
          *If people saw this protest, they would…*
          *This could raise awareness, but it might also…*
          *If activists acted this way, the public wouldn't…*
          *Governments should / shouldn't respond by…*
          *If recycling were easier, people would…*
      - id: act2-sentences
        type: discussionQuestions
        title: My sentences
        items:
          - question: 'The peaceful demonstration: ___'
            frame: If people saw this demonstration, they would ___.
          - question: 'The aggressive demonstration: ___'
            frame: This could ___, but it might also ___.
      - id: act2-discussion
        type: discussionQuestions
        title: Class discussion
        items:
          - question: Which demonstration would be more effective? Why?
          - question: Which one might backfire?
          - question: If you weren't emotionally involved, which type of protest would convince you more?
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Activity 3: Campaigning for a greener future'
        skills: [Second conditional, Modal verbs]
        steps:
          - 'In groups of 2–3: your teacher gives your group a general topic: recycling, reducing plastic use, saving water, sustainable fashion or reducing food waste.'
          - 'Turn the general topic into a very specific campaign focus. Ask: Who exactly are you trying to change? What *one behavior* do you want to change? Then write your campaign sentence.'
          - 'Design your campaign in three stages (below): goal and target audience, strategy and message, visibility and impact. Use modal verbs and conditional sentences.'
          - 'Mixed groups: each student has 2 minutes to present their campaign: focus, target audience, strategy and why it would work.'
          - The group asks 2 follow-up questions with conditionals or modal verbs.
          - 'Optional: reflect on the campaigns as a class.'
        example: '*Our campaign focuses on educating the young generation about recycling bottles in urban Israeli cities.*'
      - id: act3-plan
        type: discussionQuestions
        title: Our campaign
        items:
          - question: 'Campaign focus: Our campaign focuses on ___ in ___.'
          - question: What is the campaign goal? What change do you want to see?
            frame: Our campaign aims to ___.
          - question: Who is your target audience?
            frame: If our audience changed this habit, it would ___.
          - question: What is the main idea? How will you convince people?
            frame: We would convince people by ___. This strategy could work because ___. People might change their behavior if ___.
          - question: Where would people see the campaign? How could its success be measured?
            frame: People would see this campaign ___. Success could be measured by ___. If the campaign succeeded, we would see ___.
      - id: act3-follow-up
        type: callout
        tone: tip
        title: Follow-up questions
        text: |-
          What would you do if people ignored the campaign?
          How could you adapt this campaign for another group?
          What might go wrong?
          Would it still work if there were no funding?
      - id: act3-discussion
        type: discussionQuestions
        title: Class discussion (optional)
        items:
          - question: If you ran this campaign in real life, what part do you think might be the most challenging?
          - question: If the campaign didn't fully succeed, what small change could make it more effective?
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Activity 4: A letter for a cause'
        skills: [Second conditional, Modal verbs]
        steps:
          - Choose one environmental issue you care about (for example recycling, plastic waste, public transport or green spaces).
          - Choose a person with decision-making power, such as a mayor, a city council member, a school principal or a community leader.
          - Write them a formal letter or e-mail about the issue. Use modal verbs and at least one second conditional sentence.
          - 'In pairs: read your letters aloud to each other. The listener asks 2 follow-up questions as if they were the person who received the letter (about clarity, effectiveness and possible consequences). Then switch roles.'
          - Each pair shares something memorable from the letters with the class.
      - id: act4-letter
        type: discussionQuestions
        title: My letter
        items:
          - question: 'Formal greeting: Dear ___,'
          - question: 'The environmental problem: what is it?'
            frame: I am writing to you about ___.
          - question: 'A real solution, and why it will help:'
            frame: The city should ___. If the city ___, people would ___.
          - question: 'What will happen if the situation stays as it is today?'
            frame: If nothing changes, ___.
          - question: 'Formal closing: Best regards / Thank you for your time, ___'
      - id: act4-discussion
        type: discussionQuestions
        title: Class discussion
        items:
          - question: If you really sent this letter, how do you think the person would respond, and why?
          - question: Was there a moment while writing or listening to the letters that made you think, "Oh, I hadn't thought about it like that"?
          - question: If people wrote more letters like these, do you think it would actually lead to change? Why or why not?
      # Activity 5
      - id: act5
        type: classActivity
        title: 'Activity 5: Should nature be left alone?'
        skills: [Modal verbs, Second conditional]
        steps:
          - 'Around the world, governments and environmental groups debate how much humans should **intervene in nature**. Some people believe nature should be left completely alone. Others believe humans **must** actively manage nature to protect it. If humans stopped managing natural areas, would nature recover on its own, or would things get worse?'
          - 'Group 1: Nature should be left alone as much as possible. Group 2: Humans should actively manage and control nature.'
          - Brainstorm in your group points that support your team's opinion. Even if you don't totally agree with it, think of reasons and examples from your own experience. Use the second conditional and modal verbs to convince the other team.
          - 'Debate! One argument at a time: Group 1 gives an argument, Group 2 responds; Group 2 gives an argument, Group 1 responds.'
          - Finish with the class discussion questions.
      - id: act5-brainstorm
        type: discussionQuestions
        title: Brainstorm
        items:
          - question: What would happen if humans completely stopped managing forests or wildlife?
          - question: Should humans control animal populations, or let nature decide?
          - question: If an endangered species threatened local communities, what should be done?
          - question: Could human intervention actually cause more damage in the long run?
      - id: act5-discussion
        type: discussionQuestions
        title: Class discussion
        items:
          - question: Think about nature in Israel. Is there a place where nature causes problems for people, or people cause problems for nature? What should be done there?
          - question: Can you think of a real example where human intervention helped nature, or made things worse? What would you do differently if it happened again?
          - question: Looking ahead, what should governments or communities do differently to protect nature without harming people?
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: **modal verbs** (introduction round, warm-up, Activity 1)
          and the **second conditional** together with modal verbs (Activities 2–5). No
          lesson timings are given in the notebook except the introduction round.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: Give your own example first, then go around the group.
      - id: n-warmup
        anchor: warmup
        text: Ask each student at least two questions. Answers typed here are visible to you below each question.
      - id: n-act2
        anchor: act2
        text: >-
          The demonstration cards are on the old notebook's gamma.app page
          ("Environmental Demonstrations: Peaceful vs Aggressive Actions"), which is not
          on the link allow-list. Share it on screen, or describe one peaceful and one
          aggressive demonstration yourself. Finish by summarising and asking the class
          discussion questions.
      - id: n-act3
        anchor: act3
        text: >-
          Work with the visual presentation (the old notebook's "Sustainability campaign
          L3" gamma.app page, not on the link allow-list; share it on screen) to guide
          the groups step by step through the campaign-building process. Give each group
          the same or a different topic. For the presentation, mix the groups so that
          students hear different campaigns.
      - id: n-act5
        anchor: act5
        text: Assign the two groups. Remind students they defend the group's opinion, not necessarily their own.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: sustainability-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-modals
        type: ruleSummary
        skill: Modal verbs
        rules:
          - text: >-
              Modal verbs are "helping" verbs that show **attitude, possibility, necessity
              or advice**. They express the speaker's attitude, not only the topic. Choose
              the word by how strong or polite you want to sound.
            examples:
              - We **should** protect natural areas. → gentle advice
              - Governments **must** protect natural areas. → strong obligation
              - Cities **could** protect natural areas. → friendly suggestion
          - text: 'A modal verb **never stands alone**. It is always followed by a **base verb** (V1). With *ought to*, the base verb comes after *to*.'
            examples:
              - Governments must action. ❌
              - Governments must take action. ✅
              - People should sustainable. ❌
              - People should live more sustainably. ✅
          - text: 'Modal verbs **never change form**: they are the same for all subjects. (*Have to* is not a true modal: it changes to *has to* with *he, she, it*.)'
            examples:
              - He shoulds protect nature. ❌
              - He should protect nature. ✅
              - They should protect nature. ✅
      - id: modals-table
        type: table
        caption: Modal verbs and how they sound
        header: [Modal verb, How it sounds, When to use it, Sustainability example]
        rows:
          - [
              Must,
              'Very strong, formal',
              'Laws, urgent responsibility, no choice',
              Governments **must** protect endangered ecosystems.,
            ]
          - [
              Have to (has to with he / she / it),
              'Strong, practical',
              External rules or real-world pressure,
              Cities **have to** reduce air pollution.,
            ]
          - [
              Should,
              'Neutral, polite',
              'Advice, recommendations',
              People **should** respect natural habitats.,
            ]
          - [
              Ought to,
              Slightly formal,
              Moral or ethical responsibility,
              Companies **ought to** reduce environmental damage.,
            ]
          - [
              Could,
              'Soft, friendly',
              'Suggestions, possibilities',
              Communities **could** restore local forests.,
            ]
          - [
              Might,
              'Very soft, careful',
              Uncertain results,
              This policy **might** help wildlife recover.,
            ]
          - [
              Would,
              'Conditional, reflective',
              Imagining results or future impact,
              'If humans interfered less, nature **would** recover faster.',
            ]
          - [
              Shouldn't,
              Polite warning,
              Saying something is not a good idea,
              We **shouldn't** build in protected areas.,
            ]
      - id: rules-second-conditional
        type: ruleSummary
        skill: Second conditional
        rules:
          - text: 'We use the second conditional for **unreal or impossible situations in the present**, **imaginary changes**, and **dreams and hypothetical ideas** about the present or future.'
          - text: '**Form:** *If* + past simple, *would* + base verb.'
            examples:
              - If governments invested more in renewable energy, pollution would decrease.
              - If people reduced meat consumption, carbon emissions would fall.
              - If cities limited car traffic, air quality would improve.
          - text: We use the **past simple**, but we are **not** talking about the past. We are imagining a different present or future.
          - text: '**Were:** in the second conditional, *were* is commonly used instead of *was* with all subjects (*If I was…* is also common in informal speech).'
            examples: ['If I were president, I would introduce stricter environmental laws.']
          - text: "**Modal verbs:** we don't only use *would*. We can also use *could* or *might* to change the meaning."
      - id: conditional-modals-table
        type: table
        caption: Would, could or might?
        header: [Modal verb, What it shows, Example sentence]
        rows:
          - [
              would,
              The expected or most likely result,
              '*If plastic production decreased, ocean pollution would decline.*',
            ]
          - [
              could,
              A possible ability or option,
              '*If cities invested in public transportation, people could reduce their carbon footprint.*',
            ]
          - [
              might,
              A possible but less certain result,
              '*If governments banned fast fashion, consumer habits might change.*',
            ]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both skills with the group and ask for one new sustainability example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: sustainability-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-main
        type: aiTutorPrompt
        title: Sustainability and nature
        message: >-
          Hi Mori! Let's talk about sustainability and how people interact with nature.
          Please ask me questions that help me use modal verbs (should, could, might,
          must, shouldn't) to talk about responsibility, advice, and possible solutions.
          Also ask 'what if' questions so I can practice the second conditional and
          imagine how the situation would change if people, governments, or companies
          behaved differently. Try to ask follow-up questions that make me explain my
          ideas more clearly and compare different options. Please encourage me to
          answer in full sentences and correct my mistakes by giving a better model
          sentence.
      - id: extra-title
        type: heading
        level: 3
        text: 2 interactive activities
      - id: mori-would-should
        type: aiTutorPrompt
        title: 'Activity 1: Would you / Should you?'
        intro: >-
          You and Mori take turns asking and answering questions about **sustainable
          habits and lifestyle choices**. Each question begins with **"Would you…?"** or
          **"Should you…?"**. Explain your answers clearly, with **modal verbs** and
          **second conditional** sentences.
        message: >-
          Hi Mori! Let's play a conversation game called "Would You / Should You" about
          sustainability and everyday habits. Please start by asking me a few 'Would
          you…' questions about realistic but challenging sustainable choices, and model
          full, natural answers yourself, so I can see how to use modal verbs and the
          second conditional. After that, invite me to ask you similar 'Would you…'
          questions and encourage me to react and ask follow-up questions. Then switch to
          'Should you…' questions about responsibility and advice, first modeling strong
          answers and then asking me to respond using modal verbs and at least one second
          conditional sentence. Add some 'what if' questions using If + past simple,
          would… and politely challenge my ideas when appropriate. Please correct my
          mistakes by offering improved model sentences. End by asking me which one
          sustainable habit I would realistically change starting tomorrow, and why.
      - id: tips-would-should
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Choose the modal verb that fits how urgent and how polite you want to be.
          Use the second conditional for hypothetical situations in the present or future.
          Ask Mori follow-up questions, don't only answer.
      - id: mori-president
        type: aiTutorPrompt
        title: 'Activity 2: If I were president'
        intro: >-
          Imagine you are the president (or prime minister) of your country and can make
          important environmental decisions. First think out loud with Mori, then turn
          your ideas into a short speech to the country.
        message: >-
          Hi Mori! Let's do an activity called "If I Were President". Please start by
          asking me questions that help me imagine what I would change if I were in
          charge of my country. Guide me to think of three environmental or
          nature-related decisions I would make, and encourage me to explain why, using
          the second conditional (If I were…, I would…) and modal verbs (would, should,
          must, could). Ask follow-up questions like what problem each decision would
          solve, who it would affect, and what might happen if the decision failed. After
          we discuss all three ideas, ask me to write a short speech to my country where I
          explain my green decisions and new environmental laws in a confident but
          realistic way. Please remind me to use at least one second conditional sentence
          and several modal verbs in the speech, and correct my language by giving
          improved model sentences if needed.
      - id: tips-president
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Keep your speech short: 6–8 sentences.
          Speak with a clear leadership tone.
          Explain your decisions and laws.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: sustainability-practice
    book: workbook
    title: 'Practice: Sustainability'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. Each answer is checked right away, and you can try again.
      - id: ex-conditional
        type: activity
        activity: sustainability-conditional
      - id: ex-modals
        type: activity
        activity: sustainability-modals

