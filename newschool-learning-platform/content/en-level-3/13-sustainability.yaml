          - { term: Resources, gloss: משאבים }
          - { term: Biodiversity, gloss: מגוון ביולוגי }
          - { term: Climate change, gloss: שינויי אקלים }
          - { term: Public transportation, gloss: תחבורה ציבורית }
          - { term: Energy, gloss: אנרגיה }
          - { term: Natural resources, gloss: משאבי טבע }
          - { term: Ecosystem, gloss: מערכת אקולוגית }
          - { term: To protect, gloss: להגן }
          - { term: To reduce, gloss: להפחית }
          - { term: To reuse, gloss: להשתמש מחדש }
          - { term: To recycle, gloss: למחזר }
