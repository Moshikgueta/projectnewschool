# Cycle "Alternative Realities", converted from the English level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-level-3
slug: alternative-realities
title: Alternative Realities
goal: Imagine different presents and pasts with the second and third conditionals.
position: 15
status: published

review:
  - >-
    The two workbook exercises ("Second conditional" and "Third conditional") are NEW:
    the notebook has no self-study exercises. They were written from the cycle's
    summary rules, the summary tables, the warm-up questions and the vocabulary.
    Please check level, wording and every right answer before students see them.
  - >-
    Warm-up, third conditional: four questions are really **mixed conditionals** (past
    condition, present result: "If you had studied something different, what would
    you be doing now?", "…where would you be now?", "…what would be different
    today?", "…how would your life look now?"). They are correct English and are kept;
    a teacher note and a short "Mixed conditional" box in the summary (NEW) explain
    the form. Please confirm or move them.
  - >-
    Warm-up corrections: "If you hadn't met one important person in your life, how
    would it have changed?" → "how would your life have changed?"; "If you had grown
    up in another country when you were younger, how would you have changed?" → "If
    you had grown up in another country, how would you have been different?"
  - >-
    Activity 3, Step 4 frame: "If people live in this world today, they would…" is
    wrong (present + would). Changed to "If people lived in this world today, they
    would…".
  - >-
    Activity 4: "If Theodor Herzl had chosen Uganda instead of Israel" → "If Theodor
    Herzl had accepted the Uganda plan instead of the Land of Israel" (Uganda was a
    British proposal, and Israel did not yet exist). The speed round "what would
    happen in the future (now, 10, or in 100 years)" → "immediately, in 10 years or in
    100 years". The wheel item "If Donald Trump had never been president…" is kept as
    in the source; you may prefer a less political example.
  - >-
    Mori, "One decision, two realities": the message called "what my life would be
    like today if I had made a different choice" the second conditional; it is a mixed
    conditional. The message now asks for the second conditional to imagine life today
    in the other reality (If I lived…, I would…) and the third conditional for the past
    decision. Please confirm.
  - >-
    Activity 5 has no skill line in the source; "Second and third conditionals" was
    added from its instructions. The debate steps say "Group A / B" while the teams are
    "Group 1 / 2": both are now "Group 1 / 2".
  - >-
    Activity 1 uses a gamma.app "Visual Aid" page, which is not on the link allow-list:
    the link was removed and the page is mentioned in a teacher note. The Activity 4
    "What If? Wheel" is on wheelofnames.com and is kept.
  - >-
    The "Teacher note: grammar focus" (second and third conditional rules before the
    warm-up) is a teacher note on the warm-up; its rules are the same as the summary.
    The summary rules and tables are kept once.
  - >-
    Small corrections: stray asterisks and broken bold were removed; "Change The World
    (?)" → "Change the world?"; the Quizlet links are kept without their "?i=…&x=…"
    tracking parameters. The vocabulary table also has English definitions; the
    vocabulary block only holds term + Hebrew gloss (the definitions are in the
    "English + Definition" Quizlet set, linked in class).
  - >-
    The source gives a time only for the introduction round (5 minutes) and no
    lesson plan; the plan note was written from the activity skill lines. The
    "Student 1/2/3 answer" lines are replaced by the optional answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: alternative-realities-class
    title: 'Class: Alternative Realities'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Alternative Realities
      - id: skills
        type: cycleOverview
        skills:
          - name: Second conditional
            description: Imagine a different present or future (*If I had more time, I would learn another language.*)
          - name: Third conditional
            description: Imagine a different past (*If I had studied more, I would have passed the exam.*)
      - id: quizlet
        type: externalLink
        label: Alternative Realities on Quizlet (English + Hebrew)
        url: https://quizlet.com/il/1138309219/alternative-realities-english-hebrew-translation-flash-cards/
      - id: quizlet-definitions
        type: externalLink
        label: Alternative Realities on Quizlet (English + definitions)
        url: https://quizlet.com/il/1138308073/alternative-realities-english-definition-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I am ___. My life would be more / less ___ if I had ___.
        example: "I'm Maria. My life would be more relaxing if I had a plane ticket."
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup-second-title
        type: heading
        level: 4
        text: Second conditional
      - id: warmup-second
        type: discussionQuestions
        items:
          - question: If you could change one thing in your life, what would it be and why?
            frame: If I could change one thing, I would change ___ because ___.
          - question: If you could swap lives with someone for one day, who would it be and why?
            frame: If I could swap lives with someone, it would be ___ because ___.
          - question: If you could live in a book, TV show or movie, which one would you choose and why?
            frame: I would choose ___ because ___.
          - question: If you could solve one global problem, which one would you choose and why?
            frame: I would solve ___ because ___.
          - question: If you could invent a new technology, what would it be and how would it change the world?
            frame: I would invent ___. It would ___.
          - question: If you had to move to another country tomorrow, where would you go and what would you do there?
            frame: I would go to ___ and I would ___.
      - id: warmup-third-title
        type: heading
        level: 4
        text: Third conditional
      - id: warmup-third
        type: discussionQuestions
        items:
          - question: If you had studied something different at school, what would you be doing now?
            frame: If I had studied ___, I would be ___ now.
          - question: If you hadn't met one important person in your life, how would your life have changed?
            frame: If I hadn't met ___, my life would have ___.
          - question: If you had grown up in another country, how would you have been different?
            frame: If I had grown up in ___, I would have ___.
          - question: If you had said "yes" to an opportunity you once refused, where would you be now?
            frame: If I had said yes to ___, I would be ___ now.
          - question: If you had made a different decision as a teenager, what would be different today?
            frame: If I had ___, ___ would be different today.
          - question: If you hadn't changed one habit in the past, how would your life look now?
            frame: If I hadn't stopped / started ___, my life would ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: My parallel life'
        skills: [Second conditional]
        steps:
          - Look at the pictures of alternative realities, jobs and situations your teacher shows. Imagine living a parallel life.
          - Choose a picture from the board, or another picture yourself, and write at least 3 sentences in the second conditional (starters below).
          - "In pairs or groups: present your parallel life and what you would do in it (2 minutes). Then answer the others' follow-up questions (1 minute)."
          - Each pair shares 1 or 2 sentences about their alternative realities. The teacher writes them on the board, and the class votes for the most popular alternative reality.
      - id: act1-sentences
        type: discussionQuestions
        title: My parallel life
        items:
          - question: If I had more time, I would ___.
          - question: If I were another person for one day, I would ___.
          - question: If I lived in another place, I would ___.
          - question: If I could learn any skill, I would ___.
          - question: "If I didn't have to work or study, I would ___."
      - id: act1-follow-up
        type: callout
        tone: tip
        title: Follow-up questions
        text: |-
          *Why would you change that?*
          *How would your life be different?*
          *What problems would this new life have?*
          *What would you do first?*
          *Who would react differently?*
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Activity 2: Change the world?'
        skills: [Second conditional]
        steps:
          - 'In groups of 3–4: your teacher gives your group one global topic: money, health, education or the environment.'
          - 'Your group creates **4 different scenarios** about a completely different global reality. Every sentence uses the second conditional. Include positive and negative effects. Be specific: who, what changes, what happens.'
          - 'Switch groups: in the new group there are students from different topics. Each student explains one scenario from their first group.'
          - 'Optional: reflect as a class with the third conditional (questions below).'
        example: |-
          *If money didn't exist, people would exchange goods.*
          *If everyone had free education, there would be less violence in the world.*
          *If no one recycled, we wouldn't be able to drink natural water.*
      - id: act2-scenarios
        type: discussionQuestions
        title: Our scenarios
        items:
          - question: 'Scenario 1: If ___, ___ would ___.'
          - question: 'Scenario 2: If ___, ___ would ___.'
          - question: 'Scenario 3: If ___, ___ would ___.'
          - question: 'Scenario 4: If ___, ___ would ___.'
      - id: act2-reflection
        type: discussionQuestions
        title: Class reflection (optional, third conditional)
        items:
          - question: If the world had made different decisions in the past, would this alternative reality exist today?
          - question: If governments had acted earlier, how would our world be different now?
          - question: Which idea would have helped the world most?
          - question: Which idea would have caused the biggest problems?
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Activity 3: Alternative realities on screen'
        skills: [Second conditional, Third conditional]
        steps:
          - Brainstorm movies, series or books about alternative realities. Look at the list below for ideas.
          - "In pairs or groups: choose one world and imagine living inside it now (second conditional). If you don't know enough about it, look it up on the internet or with AI."
          - 'Step out of the world and look back at it critically: how could the story or the future have changed if different decisions had been made? (third conditional)'
          - Each pair shares its topic and one insight that combines the second and third conditional.
        example: '*If people lived in this world today, they would ___, but if this future had really happened, it would have ___.*'
      - id: act3-list
        type: table
        caption: Ideas
        header: [Type, Title, What it is about]
        rows:
          - [Movie, Meet the Robinsons, 'An optimistic, retro view of the future']
          - [Movie, Back to the Future Part II, How the 80s imagined 2015]
          - [Movie, The Truman Show, Reality as a controlled world]
          - [Movie, Her, An emotional future shaped by AI]
          - [Movie, The Matrix, Hidden reality vs. truth]
          - [TV series, Black Mirror, Near-future realities shaped by technology]
          - [TV series, "The Handmaid's Tale", A society rebuilt after a political shift]
          - [TV series, Westworld, Artificial worlds and identity]
          - [TV series, Stranger Things, Parallel worlds colliding]
          - [
              TV series,
              The Last of Us,
              'A world reshaped by a global collapse, where survival depends on past decisions, moral dilemmas and human relationships',
            ]
          - [Book, '1984', Total control and rewritten reality]
          - [Book, The Hunger Games, Reality reshaped by power and spectacle]
      - id: act3-second
        type: discussionQuestions
        title: Living inside the world (second conditional)
        items:
          - question: If you lived in this world, what would your daily life be like?
          - question: If this reality existed today, what would be better than real life? What would be worse?
          - question: "What wouldn't you enjoy or feel comfortable with?"
          - question: If this world became real tomorrow, which type of person would succeed there, and why?
          - question: If you had to survive in this reality for one year, what habits would you need to change first?
      - id: act3-third
        type: discussionQuestions
        title: Rewriting the story (third conditional)
        items:
          - question: If the main character had made a different choice, how would the story have changed?
          - question: If people had known the truth earlier, what might have happened?
          - question: If society had developed differently, would this future have existed?
          - question: If the community had prepared better for the crisis, what problems could have been avoided?
          - question: If one key character had not died or disappeared, how would the power balance in the story have shifted?
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Activity 4: Alternative world history'
        skills: [Third conditional]
        steps:
          - One event in history can change the world in different ways over time. Choose a historical event from Israeli, Jewish or world history (ideas below).
          - 'Imagine three consequences of the change: immediately, 10 years after the event, and 100 years after the event.'
          - 'In pairs: share your event and its consequences. Which time period is the most surprising? Which change seems the most realistic? Which change would have affected daily life the most?'
          - 'Class reflection: which historical event would have changed the world the most in the long run?'
          - 'Optional speed round: spin the "What If?" wheel. Say what would have happened immediately, in 10 years or in 100 years.'
        resource:
          label: '"What If?" wheel'
          url: https://wheelofnames.com/fhc-tjp
      - id: act4-ideas
        type: callout
        tone: info
        title: Ideas
        text: |-
          If Theodor Herzl had accepted the Uganda plan instead of the Land of Israel…
          If Israel had been founded with different borders in 1948…
          If Christopher Columbus had never reached the Americas…
          If World War II had ended differently…
          If the Internet had never been invented…
      - id: act4-consequences
        type: discussionQuestions
        title: My alternative history
        items:
          - question: 'My event: If ___ had ___, …'
          - question: 'Immediately: ___ would have ___.'
          - question: '10 years later: ___ would have ___.'
          - question: '100 years later: ___ would have ___.'
      # Activity 5
      - id: act5
        type: classActivity
        title: "Activity 5: It's my life"
        skills: [Second conditional, Third conditional]
        steps:
          - Some people believe that thinking about "what if" and alternative realities helps us learn, grow and make better choices. Others believe that always imagining different outcomes creates regret and stops us from accepting our lives as they are. Is "what if" thinking helpful, or is acceptance the healthier path?
          - "Group 1: 'What if?' thinking is useful. Group 2: Acceptance of reality is healthier."
          - Brainstorm in your group points that support your team's opinion. Even if you don't totally agree with it, think of reasons and examples from your own experience. Use the second and third conditionals to convince the other team.
          - 'Debate! One argument at a time: Group 1 gives an argument, Group 2 responds; Group 2 gives an argument, Group 1 responds.'
          - Finish with the class discussion questions.
      - id: act5-brainstorm
        type: discussionQuestions
        title: Brainstorm
        items:
          - question: Why do people think about alternative realities or "what if" situations?
          - question: If people imagined different possibilities more often, how would it affect their choices today?
          - question: How do past "what if" thoughts influence regret or personal growth?
          - question: If people had not questioned their past decisions, what would they have missed or avoided?
          - question: How does focusing on acceptance affect stress, happiness or motivation?
      - id: act5-discussion
        type: discussionQuestions
        title: Class discussion
        items:
          - question: If people focused a little less on "what if" thinking, how would their daily lives or stress levels change?
          - question: If you had to give advice to someone who often regrets past decisions, what would you tell them after this discussion?
          - question: If you could change one habit related to "what if" thinking in your own life, what would you do differently?
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: the **second conditional** (introduction round, warm-up,
          Activities 1 and 2) and the **third conditional** (warm-up, Activity 4, and with
          the second conditional in Activities 3 and 5; optional reflection in Activity
          2).
      - id: n-intro
        anchor: intro
        minutes: 5
        text: Give your own example first, then go around the group.
      - id: n-warmup
        anchor: warmup-title
        text: >-
          Grammar focus: ease the students into conditionals. Start with the second
          conditional questions (different situations now or in the future: *If + past
          simple, would + base verb*), then move to the third conditional (imagining a
          different past: *If + past perfect, would have + past participle*). Choose
          questions for your group's level. Note: questions 1, 4, 5 and 6 of the third
          conditional set are mixed conditionals (*If you had studied…, what would you be
          doing now?*): past condition, present result. Accept answers with *would* +
          base verb there.
      - id: n-act1
        anchor: act1
        text: >-
          The pictures are on the old notebook's "Alternative Realities: Lives We Dream
          Of Living" gamma.app page, which is not on the link allow-list. Show it on
          screen or choose your own pictures.
      - id: n-act4
        anchor: act4
        text: For the speed round, spin the wheel and give the class interesting events (for example, if humans had never landed on the Moon, if smartphones had never existed, if people had never discovered coffee).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: alternative-realities-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-second
        type: ruleSummary
        skill: Second conditional
        rules:
          - text: 'We use the second conditional for **unreal or impossible situations now**, **imaginary changes**, and **dreams and hypothetical ideas** about the present or future.'
          - text: '**Form:** *If* + past simple, *would* + base verb.'
            examples:
              - If I had more time, I would learn another language.
              - If I lived in another country, I would travel more.
              - If she were the president, she would change many things.
          - text: We use the **past simple**, but we are **not** talking about the past.
          - text: '**Were:** in the second conditional, *were* is commonly used instead of *was* with all subjects for unreal or imaginary situations.'
            examples: ['If he were more confident, he would speak more.']
          - text: "**Modal verbs:** we don't only use *would*. We can also use *could* or *might* to change the meaning."
      - id: second-modals-table
        type: table
        caption: Second conditional with would, could or might
        header: [Modal verb, What it shows, Example sentence]
        rows:
          - [
              Would,
              The expected or most likely result,
              'If I had more time, I **would** learn another language.',
            ]
          - [
              Could,
              A possible ability or option,
              'If I had more time, I **could** learn another language.',
            ]
          - [
              Might,
              A possible but less certain result,
              'If I had more time, I **might** learn another language.',
            ]
      - id: rules-third
        type: ruleSummary
        skill: Third conditional
        rules:
          - text: "We use the third conditional for **situations that can't change**: situations in the past that did not happen, imagining different results, and regrets, missed opportunities or alternative pasts."
          - text: '**Form:** *If* + past perfect, *would have* + past participle (V3).'
            examples:
              - If I had studied more, I would have passed the exam.
              - If we had left earlier, we would not have missed the train.
              - If the Internet had not existed, communication would have been slower.
          - text: '**Modal verbs:** we can use *would have*, *could have* or *might have* to show different meanings.'
      - id: third-modals-table
        type: table
        caption: Third conditional with would have, could have or might have
        header: [Modal form, What it shows, Example sentence]
        rows:
          - [
              Would have + V3,
              The expected or definite result,
              'If I had studied more, I **would have passed** the exam.',
            ]
          - [
              Could have + V3,
              A possible result or ability,
              'If I had studied more, I **could have passed** the exam.',
            ]
          - [
              Might have + V3,
              A possible but uncertain result,
              'If I had studied more, I **might have passed** the exam.',
            ]
      - id: difference-table
        type: table
        caption: Key difference between the second and third conditional
        header: [Conditional, Time, Reality]
        rows:
          - [Second conditional, Now / future, Unreal but imagined]
          - [Third conditional, Past, Impossible to change]
      - id: mixed
        type: callout
        tone: info
        title: Mixed conditional
        text: |-
          A past situation can have a result **now**: *If* + past perfect, *would* + base verb.
          *If I had studied medicine, I would be a doctor now.*
          *If you had said yes, where would you be today?*
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both skills with the group and ask for one new example for each rule. The "Mixed conditional" box was added in the conversion because several warm-up questions use it.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: alternative-realities-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-main
        type: aiTutorPrompt
        title: What if?
        message: >-
          Hi Mori! Let's talk about alternative realities and 'what if' situations. Please
          ask me questions that help me imagine different versions of life or history. Ask
          some questions that require the second conditional (imagining unreal situations
          in the present or future), and some that require the third conditional
          (imagining how the past could have been different). Encourage me to explain
          consequences, regrets, or different outcomes. Ask follow-up questions so I can
          give personal opinions, compare realities, and explain whether these alternative
          worlds would have been better or worse. Please help me use full sentences and
          correct conditional forms.
      - id: extra-title
        type: heading
        level: 3
        text: 2 interactive activities
      - id: mori-lunch
        type: aiTutorPrompt
        title: 'Activity 1: Lunch in an alternative reality'
        intro: >-
          Choose a famous person who is no longer alive (an artist, leader, scientist,
          musician, writer…). Imagine that they are alive today and know about today's
          world. You are meeting them for lunch, and Mori pretends to be that person.
          Write the name in the message.
        message: >-
          Hi Mori! Let's imagine an alternative reality. You are ___ (name of a famous
          person), who is still alive today, and we are meeting for lunch. Please speak as
          if you are this person. Ask me questions about why I chose to meet you, what I
          would ask you, and how I think the world would be different if you were alive
          today. Ask some questions that encourage me to use the second conditional
          (imagining life today), and some that encourage the third conditional (imagining
          how the past could have been different). Ask follow-up questions so I can
          express opinions, regrets, or admiration, and explain my ideas in full
          sentences.
      - id: tips-lunch
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Use conditional sentences clearly.
          Explain your ideas with reasons and feelings, don't just answer.
          React and ask questions back.
      - id: mori-two-realities
        type: aiTutorPrompt
        title: 'Activity 2: One decision, two realities'
        intro: >-
          Imagine that one small decision in your past created two versions of your life,
          and you can talk to both. Choose one real decision (about studies, work, a
          relationship, travel or timing) and imagine two realities: the life you are
          living now, and the life you would have lived if you had chosen differently.
        message: >-
          Hi Mori! Let's imagine an alternative reality. One decision in my past created
          two different versions of my life. Please guide a conversation where you
          sometimes speak as 'me now' and sometimes as 'me in the alternative reality'.
          Ask me questions that help me imagine my life today in the other reality (second
          conditional: If I lived…, I would…), and questions that help me reflect on how
          that past decision affected my life (third conditional: If I had chosen…, I
          would have…). Please ask follow-up questions so I can compare the two realities,
          express regrets or satisfaction, and explain what I have learned. Help me use
          full sentences and clear conditional forms.
      - id: tips-two-realities
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Use the second and the third conditional at least once each.
          Compare the two realities clearly.
          React emotionally and personally (don't talk only about facts).
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: alternative-realities-practice
    book: workbook
    title: 'Practice: Alternative Realities'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. Each answer is checked right away, and you can try again.
      - id: ex-second
        type: activity
        activity: alternative-realities-second-conditional
      - id: ex-third
        type: activity
        activity: alternative-realities-third-conditional

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: alternative-realities-vocabulary
    title: Vocabulary
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Alternative realities words
        glossLang: he
        link: https://quizlet.com/il/1138309219/alternative-realities-english-hebrew-translation-flash-cards/
        items: &alternative-realities-words
          - { term: Reality, gloss: מציאות }
          - { term: Alternative, gloss: חלופה }
          - { term: Possibility, gloss: אפשרות }
          - { term: To decide, gloss: להחליט }
          - { term: To accept, gloss: לקבל }
          - { term: To miss (out), gloss: לפספס }
          - { term: To regret, gloss: להתחרט }
          - { term: To invent, gloss: להמציא }
          - { term: To fail, gloss: להיכשל }
          - { term: To affect, gloss: להשפיע על }
          - { term: Already, gloss: כבר }
          - { term: Finally, gloss: לבסוף }
          - { term: Immediately, gloss: מיד }
          - { term: Instead, gloss: במקום }
          - { term: Suddenly, gloss: פתאום }
          - { term: Eventually, gloss: בסופו של דבר }
          - { term: Society, gloss: חברה }
          - { term: Outcome, gloss: תוצאה }
          - { term: Consequence, gloss: תוצאה / השלכה }
          - { term: Hypothetical, gloss: היפותטי }
          - { term: Scenario, gloss: תרחיש }
          - { term: Turning point, gloss: נקודת מפנה }
          - { term: Dilemma, gloss: דילמה }
          - { term: Trade-off, gloss: פשרה / ויתור הדדי }
          - { term: Impact, gloss: השפעה }
          - { term: Perspective, gloss: נקודת מבט }
          - { term: Inevitable, gloss: בלתי נמנע }
          - { term: Unpredictable, gloss: לא צפוי }
          - { term: To assume, gloss: להניח }
          - { term: To reflect on, gloss: להרהר ב־ }
          - { term: To shift, gloss: לשנות / להסיט }

vocabulary:
  - slug: alternative-realities
    title: Alternative Realities
    items: *alternative-realities-words

activities:
  - slug: alternative-realities-second-conditional
    title: 'Second conditional: If I had more time, I would…'
    minutes: 8
    items:
      - id: would-learn
        type: multipleChoice
        prompt: If I had more time, I ___ learn another language.
        options:
          - { text: would, correct: true }
          - {
              text: will,
              feedback: 'The if-part uses the past simple (*had*), so this is imagined. Use *would*, not *will*.',
            }
          - {
              text: would have,
              feedback: '*Would have* + past participle is the third conditional (the past). Here we need *would* + base verb.',
            }
      - id: lived
        type: fillBlank
        prompt: Write the verb *live* in the correct form.
        text: If I ___ in another country, I would travel more.
        blanks: [[lived]]
      - id: were-confident
        type: multipleChoice
        prompt: If he ___ more confident, he would speak more.
        options:
          - { text: were, correct: true }
          - {
              text: is,
              feedback: 'This is an unreal situation now. The if-part uses the past simple: *If he were…*',
            }
          - {
              text: would be,
              feedback: "Don't use *would* in the if-part: *If he were more confident…*",
            }
      - id: questions-answers
        type: matching
        prompt: Match each question with its answer.
        pairs:
          - [
              'If you could swap lives with someone for one day, who would it be?',
              It would be my favorite singer.,
            ]
          - [
              'If you had to move to another country tomorrow, where would you go?',
              I would go to Canada.,
            ]
          - [
              'If you could invent a new technology, what would it be?',
              It would be a machine that cleans the ocean.,
            ]
          - [
              'If you could solve one global problem, which one would you choose?',
              I would choose hunger.,
            ]
      - id: not-past
        type: trueFalse
        prompt: '*If I had more time, I would travel.* This sentence talks about the past.'
        answer: false
        feedback:
          correct: Right! It uses the past simple, but it imagines a different present or future.
          incorrect: "*Had* is the past simple, but the sentence is about now: I don't have more time now."
      - id: which-correct
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: "If money didn't exist, people would exchange goods.", correct: true }
          - {
              text: "If money doesn't exist, people would exchange goods.",
              feedback: "With *would* in the result, the if-part needs the past simple: *If money didn't exist…*",
            }
          - {
              text: "If money wouldn't exist, people would exchange goods.",
              feedback: "Don't use *would* in the if-part: *If money didn't exist…*",
            }
      - id: might
        type: fillBlank
        prompt: Write the modal verb that shows **a possible but less certain result**.
        text: If I had more time, I ___ learn another language.
        blanks: [[might]]
      - id: order-rich
        type: reorderSentence
        prompt: Put the words in order.
        sentence: If I were rich, I would travel the world.

  - slug: alternative-realities-third-conditional
    title: 'Third conditional: If I had studied, I would have passed'
    minutes: 8
    items:
      - id: would-have-passed
        type: multipleChoice
        prompt: If I had studied more, I ___ the exam.
        options:
          - { text: would have passed, correct: true }
          - {
              text: would pass,
              feedback: '*Would pass* is the second conditional (now or the future). For the past, use *would have passed*.',
            }
          - {
              text: had passed,
              feedback: 'The result part uses *would have* + past participle: *would have passed*.',
            }
      - id: had-left
        type: fillBlank
        prompt: Write the verb *leave* in the correct form.
        text: If we ___ earlier, we would not have missed the train.
        blanks: [[had left]]
      - id: would-have-been
        type: fillBlank
        prompt: Write the verb *be* in the correct form.
        text: If the Internet had not existed, communication ___ slower.
        blanks: [[would have been]]
      - id: meanings
        type: matching
        prompt: Match each form with what it shows.
        pairs:
          - [would have + V3, the expected or definite result]
          - [could have + V3, a possible result or ability]
          - [might have + V3, a possible but uncertain result]
          - [If + past perfect, the past situation that did not happen]
      - id: cant-change
        type: trueFalse
        prompt: We use the third conditional to imagine a different past that we can't change.
        answer: true
        feedback:
          correct: Right! The third conditional is about the past, which is impossible to change.
          incorrect: "The third conditional is about the past: situations that did not happen and that we can't change."
      - id: which-correct
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: 'If she had taken the job, she would have moved to London.', correct: true }
          - {
              text: 'If she would have taken the job, she would have moved to London.',
              feedback: "Don't use *would* in the if-part. Use the past perfect: *If she had taken…*",
            }
          - {
              text: 'If she took the job, she would have moved to London.',
              feedback: 'The third conditional uses the past perfect in the if-part: *If she had taken…*',
            }
      - id: which-time
        type: multipleChoice
        prompt: '*If I had grown up in another country, my life would have been different.* This sentence is about…'
        options:
          - { text: the past, correct: true }
          - {
              text: now or the future,
              feedback: '*Had grown up* (past perfect) and *would have been* show the third conditional: the past.',
            }
      - id: order-known
        type: reorderSentence
        prompt: Put the words in order.
        sentence: If I had known, I would have helped you.
