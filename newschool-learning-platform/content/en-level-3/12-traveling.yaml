# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-level-3
slug: traveling
title: Traveling
goal: Talk about travel experiences with the present perfect and the past perfect.
position: 12
status: in_review

review:
  - >-
    The two workbook exercises ("Present perfect" and "Past perfect") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's summary
    rules, the activity examples and the vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    Introduction round: the model answer "I have traveled to Mexico before I started
    learning English" mixes the present perfect with a finished past time. It now
    reads "I had traveled to Mexico before I started learning English", matching the
    frame. "how hard learning a new language is" → "how hard it is to learn a new
    language".
  - >-
    Activity 1, "Lie" example: "I've traveled to Australia and went skydiving…" mixes
    two tenses in one verb phrase. It now reads "I've been to Australia, and I went
    skydiving over the Great Barrier Reef." Activity 3: the frame "I've made a
    mistake when…" (present perfect + *when*) → "I've made a mistake with…"; Part 3
    was labelled "Past 3" and repeated the Part 2 frames, so it is now "Part 3" with
    the frames "I've learned that… / Now I always…". Please confirm.
  - >-
    Summary: "Time phrases - Don't use like yesterday…" was rewritten as "Don't use
    finished-time phrases like *yesterday, last week, in 2020* with the present
    perfect". The past participle explanation ("the verb changes from the present
    simple form…") was rewritten: regular verbs have the same form as the past simple
    (*worked*), irregular verbs often have a different form (*gone, seen, eaten*).
  - >-
    Homework: "so I need to answer using…" → "and I will answer using…". Activity 2
    question 7, "Have you ever had to share a room with strangers before?" was the
    present perfect twice; it is now "Had you ever shared a room with strangers
    before that?" (past perfect, as the activity asks). Question 3, "any of the local
    languages" → "any of the local language".
  - >-
    Activity 2 awards had emojis that were broken in the export (shown as "ð"); they
    were removed and the award names kept. The broken emoji at the end of the warm-up
    note was removed too. Activity 4 "if they heard about this" → "if they have heard
    about this".
  - >-
    Small corrections: stray asterisks and broken bold removed; "Answer of student
    1/2/3" lines removed (the platform has answer boxes); Quizlet links kept without
    their tracking parameters (?i=…&x=…). The Activity 4 debate skill in the source is
    "Conversation and opinions"; it practises the present perfect and the past, so it
    is tagged with the present perfect.
  - >-
    Vocabulary: the source table has a Definition column, but the vocabulary block
    only holds a term and a Hebrew gloss, so the definitions were left out (they are
    in the second Quizlet set, "English + Definition", linked in class). "Stranded"
    "תקוע / נטוש" → "תקוע" (נטוש means abandoned). The source gives no times for the
    activities, so no minutes were set.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: traveling-class
    title: 'Class: Traveling'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Traveling
      - id: skills
        type: cycleOverview
        skills:
          - name: Present perfect
            description: Travel experiences without saying when (*I have visited Paris. Have you ever been to London?*)
          - name: Past perfect
            description: An action before another action in the past (*By the time I arrived at the airport, I had forgotten my passport.*)
      - id: quizlet-translation
        type: externalLink
        label: 'Traveling on Quizlet: English + Translation'
        url: https://quizlet.com/il/1144397812/traveling-english-translation-flash-cards/
      - id: quizlet-definition
        type: externalLink
        label: 'Traveling on Quizlet: English + Definition'
        url: https://quizlet.com/il/1144397308/traveling-english-definition-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I am ___. I had traveled to ___ before I started learning English.
        example: I am Shachar. I had traveled to Mexico before I started learning English, and it made me understand how hard it is to learn a new language.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: How many countries have you visited in your life?
            frame: I have visited ___ countries.
          - question: What is the best trip you have taken so far? What made it special?
            frame: The best trip I have taken is ___. It was special because ___.
          - question: "What's the most unexpected thing that has happened to you while traveling?"
            frame: The most unexpected thing that has happened to me is ___.
          - question: During a trip you took, what had you packed in your suitcase that turned out to be completely useless?
            frame: I had packed ___, but I never used it.
          - question: Have you visited the same place more than once? Why did you go back?
            frame: "Yes, I have visited ___ twice. I went back because ___. / No, I haven't."
          - question: Have you ever lost something while traveling? What had you done before you realized it was missing?
            frame: "Yes, I've lost ___. Before I realized it, I had ___."
          - question: Have you ever had to change plans in the middle of a trip? What had happened that caused the change of plans?
            frame: 'Yes. We changed our plans because ___ had ___.'
          - question: Have you traveled solo? What was the experience like compared to traveling with a group?
            frame: "I have / haven't traveled solo. It was ___ than traveling with a group."
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: Travel stories'
        skills: [Present perfect]
        steps:
          - "Think about the trips you have taken: countries and cities you've visited, unusual things you have done, or problems you've had while traveling."
          - '**Brainstorm:** think of one true and one false experience from a trip. Start with the present perfect, and add details with the past simple.'
          - '**Storytelling and interrogation:** in pairs or groups, share both stories. The others only listen. Then each group member asks at least 2 follow-up questions.'
          - '**Vote and justify:** the group decides which story is a lie and gives one reason with evidence. Then the storyteller reveals the answer.'
          - '**Class challenge (optional):** 2–3 strong storytellers present their stories to the whole class.'
        example: |-
          *Truth: I've been to Japan and tried sushi in a traditional restaurant. It was amazing, and I got to learn how to make sushi with the chef!*
          *Lie: I've been to Australia, and I went skydiving over the Great Barrier Reef. It was the most thrilling experience of my life!*
      - id: act1-frames
        type: callout
        tone: tip
        title: Useful sentences
        text: |-
          **To tell:** *I've never… / When I arrived… / Before that, I had…*
          **To ask:** *When did this happen? / Who were you with? / Had you planned it before the trip?*
      - id: act1-stories
        type: discussionQuestions
        title: My two stories
        items:
          - question: 'Story 1: ___'
            frame: "I've ___. When I arrived, ___."
          - question: 'Story 2: ___'
            frame: "I've ___. Before that, I had ___."
          - question: 'Which story is a lie? Why?'
            frame: I think story ___ is a lie because ___.
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Activity 2: By the time you did that, I had already…'
        skills: [Past perfect]
        steps:
          - "**The teacher's story:** the teacher tells one travel story and writes its year as the start of the timeline."
          - "**Individual thinking:** think of a travel story or problem that happened **before** the teacher's story. Use the structure and the verb bank below."
          - '**Chain storytelling:** tell your story and add one extra detail in the past simple. The next student links their story to the teacher or to the student before them, depending on the year. The teacher adds the years to the timeline.'
          - '**Summary and awards:** the teacher goes over common mistakes, and the class chooses the stories that get an award.'
        example: |-
          *Teacher: In 2025, I got completely lost in Venice because I followed Google Maps and walked in circles for an hour.*
          *Student 1: By the time you got lost in Venice in 2025, I had already lost my passport at the Madrid airport in 2019. I had to speak with the police and missed my flight!*
          *Student 2: By the time you lost your passport in 2019, I had already eaten fried insects in Thailand in 2018 without knowing what they were. I thought they were chips!*
        wordBank:
          [
            had already lost,
            had already booked,
            had already forgotten,
            had already missed,
            had already arrived,
            had already tried,
          ]
      - id: act2-reminder
        type: callout
        tone: info
        title: Grammar reminder
        text: |-
          *By the time + past simple, I had already + past participle.*
          **did / happened** → past simple · **had already done** → past perfect
          *By the time I **arrived** at the airport, I **had forgotten** my passport.*
          Which happened first? Forgetting the passport. Which happened later? Arriving at the airport.
      - id: act2-story
        type: discussionQuestions
        title: My story
        items:
          - question: 'My story: ___'
            frame: By the time you ___ (year), I had already ___ (year).
          - question: 'One extra detail (past simple): ___'
      - id: act2-awards
        type: table
        caption: Awards
        rows:
          - [The Most Unlucky Traveler]
          - [The Funniest Story]
          - [The Most Stressful Moment]
          - [The Trip I Never Want to Have]
          - [The Story I Related to the Most]
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Activity 3: Learn from my mistakes'
        skills: [Present perfect, Past perfect]
        steps:
          - '**Choose an experience:** think of a travel experience where you made a mistake or learned something. Topics: language, cultural mistakes, food, getting lost, transport, money, internet / phone, safety or health.'
          - '**Think and plan:** prepare a 3-part story (see below).'
          - '**Group sharing:** in breakout rooms, present your experience with all three parts. The listener asks a follow-up question, then you switch roles.'
          - "**Class advice round:** share a piece of advice connected to your story with the class (*I've learned that…*)."
      - id: act3-parts
        type: discussionQuestions
        title: My 3-part story
        items:
          - question: 'Part 1: the experience (present perfect)'
            frame: "I've had a problem with… / I've made a mistake with…"
          - question: 'Part 2: what happened before the experience (past perfect)'
            frame: Before that, I had… / By the time…, I had already…
          - question: 'Part 3: the lesson or advice I learned'
            frame: "I've learned that… / Now I always…"
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Activity 4: Debate: tourists, in or out?'
        skills: [Present perfect]
        steps:
          - Read the topic below as a class. Have you heard about this in the news? Share what you know, without giving opinions yet!
          - "**Brainstorm:** Group A argues that the number of tourists should be limited; Group B argues that it shouldn't. Prepare 4–5 strong arguments with the present perfect and the past, and answers to the other group's arguments."
          - '**Debate!** Each group gives one argument at a time: Group A gives an argument, Group B responds; Group B gives an argument, Group A responds.'
          - '**Optional:** answer the follow-up questions below as a class.'
        example: '*Prices in Barcelona have gone up a lot because of tourism.*'
      - id: act4-text
        type: text
        text: >-
          In recent years, popular cities like Barcelona, Venice and Amsterdam have become
          extremely crowded because of tourism. Many local people say that too many
          tourists make daily life harder, for example by increasing prices, noise and
          overcrowding. At the same time, others argue that tourism is important because it
          creates jobs and helps the local economy, which is why this topic is debated so
          much today.
      - id: act4-questions
        type: discussionQuestions
        title: Follow-up questions
        items:
          - question: How do you think too many tourists affect daily life in a city? Can you give one example?
          - question: Have you ever visited a very crowded tourist place? How did it make you feel?
            frame: "Yes, I've visited ___. It made me feel ___."
          - question: If a city limits the number of tourists, do you think it is fair or unfair? Why?
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: the **present perfect** (warm-up, Activities 1, 3 and 4)
          and the **past perfect** (introduction round, warm-up, Activities 2 and 3).
      - id: n-warmup
        anchor: warmup-title
        text: >-
          Pick from the 8 questions. Make sure students answer in full sentences with the
          present perfect or the past perfect. If students don't feel comfortable talking
          about real experiences, they can make something up, as long as they practise
          speaking in English.
      - id: n-act1
        anchor: act1
        text: >-
          Individual work, then breakout rooms. Alternative for the class challenge: write
          real sentences students used (anonymously); the class says which tense each
          sentence is in and who said it.
      - id: n-act2
        anchor: act2
        text: >-
          Write the year of your story on the side of the notebook as the start of the
          timeline. Start with a year that students can go back from (for example, 2025).
          Add each student's year to the timeline as they speak.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: traveling-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-present-perfect
        type: ruleSummary
        skill: Present perfect
        rules:
          - text: 'We use the **present perfect** for **life experiences** (without saying when).'
            examples: [I have visited Paris.]
          - text: '… for **actions that started in the past and continue now**.'
            examples: [She has lived here for 5 years.]
          - text: '… for **recent actions with a result now**.'
            examples: [He has just finished his homework.]
          - text: "**Time phrases:** don't use finished-time phrases like *yesterday, last week, in 2020* with the present perfect. The present perfect puts the focus on the experience, not the time."
          - text: '**Form:** *have / has + past participle (V3)*. *I / you / we / they* → **have**; *he / she / it* → **has**.'
            examples: [They have eaten dinner., She has seen that movie.]
          - text: '**Questions:** *Have / Has + subject + past participle?* You can add *ever*.'
            examples: [Have you ever been to London?]
          - text: "**Negatives:** *subject + haven't / hasn't + past participle.* You can use *never* (*I have never…*)."
            examples: ["I haven't finished yet."]
      - id: participle-table
        type: table
        caption: Past participle (V3)
        header: [Base form, Past simple, Past participle]
        rows:
          - [work, worked, worked]
          - [go, went, gone]
          - [see, saw, seen]
          - [eat, ate, eaten]
      - id: participle-note
        type: callout
        tone: info
        title: Past participle
        text: For regular verbs, the past participle is the same as the past simple (*work → worked → worked*). Irregular verbs often have a different form (*go → went → gone*).
      - id: rules-past-perfect
        type: ruleSummary
        skill: Past perfect
        rules:
          - text: We use the **past perfect** to show that one action happened **before another action in the past**. It's great for storytelling and for showing the order of past events.
            examples: [I had finished my homework before dinner started.]
          - text: '**Connectors:** use *before, after, when, by the time* to make the order clear.'
            examples:
              [
                'By the time you missed your stop in 2014, I had already been stuck in a hotel elevator in London for 20 minutes, with strangers! That was back in 2013.',
              ]
          - text: '**Form:** *had + past participle (V3)*. It is the same for all subjects!'
            examples: [She had left when I arrived., We had never seen snow before that trip.]
          - text: '**Questions:** *Had + subject + past participle?*'
            examples: [Had they already eaten when you arrived?]
          - text: "**Negatives:** *subject + hadn't + past participle.*"
            examples: ["He hadn't studied for the exam."]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both skills with the group and ask for one new example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: traveling-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Message 1: My travel experiences'
        message: |-
          Hi Mori! Let's talk about traveling. Ask me questions about my travel experiences, and I will answer using the present perfect to describe what I've done, and the past perfect to explain what had happened before a problem or situation during a trip.
          Please correct my mistakes.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Message 2: Interview a famous traveler'
        intro: >-
          Choose a famous traveler from history or modern times: Marco Polo, Christopher
          Columbus, Ibn Battuta, Amelia Earhart, Bear Grylls or Anthony Bourdain. Write 5
          interview questions: 3 in the present perfect (life experiences) and 2 in the past
          perfect (what happened *before* something else). Then send the message, with the
          traveler's name, and have a real conversation with Mori.
        message: |-
          Hi Mori! Let's play an interview game called "Travel Back in Time". Pretend you are [name of the traveler]. I will ask you questions about your travel experiences using the present perfect and the past perfect.
          After each answer, ask me one follow-up question so we can have a real conversation.
      - id: mori-2-examples
        type: callout
        tone: info
        title: Question examples
        text: |-
          **Present perfect:** *Have you ever…? / What places have you visited? / What challenges have you faced?*
          **Past perfect:** *What had happened before…? / Had you ever… before you…?*
      - id: mori-2-tips
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Use the present perfect for experiences.
          Use the past perfect for things that happened before a main event.
          Ask clear questions, not just yes / no questions.
          Keep the conversation natural and curious.
      - id: mori-3-questions
        type: discussionQuestions
        title: 'Traveling questions: answer with the present perfect and the past perfect'
        items:
          - question: Have you ever traveled alone? What had you done before that made you feel ready to travel solo?
          - question: Have you ever lost your luggage? What had you packed that you really needed?
          - question: Have you ever gotten lost in a foreign country? Had you already learned any of the local language before that?
          - question: Have you ever tried strange food abroad? What had people told you about it before you ate it?
          - question: Have you ever visited a place from a movie? Had you already watched the movie before going?
          - question: Have you ever had a flight delayed? What had you planned to do when you arrived?
          - question: Have you ever stayed in a hostel? Had you ever shared a room with strangers before that?
          - question: Have you ever gone on a road trip with friends? Had you and your friends planned everything before starting?
          - question: Have you ever missed a flight or train? What had happened that made you late?
          - question: Have you ever made a new friend while traveling? What had you both experienced before you met?
      - id: mori-3
        type: aiTutorPrompt
        title: 'Message 3: Traveling questions'
        intro: Answer the questions above, then send this message and your answers to Mori. Try asking Mori "Have you ever…?" questions too.
        message: |-
          Hi Mori. I answered some questions about my travel experiences using the present perfect and the past perfect.
          First, go over my answers and give me improvement points. Then, have a conversation with me based on my answers.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: traveling-practice
    book: workbook
    title: 'Practice: Traveling'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. Each answer is checked right away, and you can try again.
      - id: ex-present-perfect
        type: activity
        activity: traveling-present-perfect
      - id: ex-past-perfect
        type: activity
        activity: traveling-past-perfect

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: traveling-vocabulary
    title: Vocabulary
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Travel words
        glossLang: he
        link: https://quizlet.com/il/1144397812/traveling-english-translation-flash-cards/
        items: &traveling-words
          - { term: Itinerary, gloss: מסלול טיול }
          - { term: Accommodation, gloss: מקום לינה }
          - { term: To make reservations, gloss: להזמין מקום }
          - { term: To book in advance, gloss: להזמין מראש }
          - { term: Departure, gloss: יציאה }
          - { term: Once-in-a-lifetime, gloss: פעם בחיים }
          - { term: To manage a budget, gloss: לנהל תקציב }
          - { term: To deal with problems, gloss: להתמודד עם בעיות }
          - { term: To adjust (to), gloss: להסתגל ל־ }
          - { term: Stranded, gloss: תקוע }
          - { term: Disoriented, gloss: מבולבל / חסר התמצאות }
          - { term: To handle a situation, gloss: להתמודד עם מצב }
          - { term: Overcrowded, gloss: צפוף מדי }
          - { term: Unpredictable, gloss: בלתי צפוי }
          - { term: Insurance, gloss: ביטוח }
          - { term: I can handle it, gloss: אני מסתדר / אני יכול להתמודד }
          - { term: An excursion, gloss: טיול קצר / סיור }
          - { term: A walk, gloss: הליכה }
          - { term: A hike, gloss: טיול רגלי }
          - { term: A trek, gloss: מסע רגלי ארוך }
          - { term: A trip, gloss: טיול }
          - { term: A vacation, gloss: חופשה }
          - { term: A journey, gloss: מסע }
          - { term: A tour, gloss: סיור }
          - { term: Tour guide, gloss: מדריך טיולים }
          - { term: Local, gloss: מקומי }
          - { term: Travel agent, gloss: סוכן נסיעות }
          - { term: To wander around, gloss: לשוטט }
          - { term: Pickpocket, gloss: כייס }
          - { term: Scam, gloss: תרמית }
          - { term: A cruise, gloss: שייט תענוגות }

vocabulary:
  - slug: traveling
    title: Traveling
    items: *traveling-words

activities:
  - slug: traveling-present-perfect
    title: 'Present perfect: I have visited, have you ever…?'
    minutes: 8
    items:
      - id: have-been
        type: multipleChoice
        prompt: I ___ to Japan twice.
        options:
          - { text: have been, correct: true }
          - {
              text: has been,
              feedback: '*Has* is for *he, she, it*. With *I*, use *have*: *I have been*.',
            }
          - {
              text: am been,
              feedback: 'The present perfect is *have / has + past participle*: *I have been*.',
            }
      - id: has-lived
        type: multipleChoice
        prompt: She ___ here for 5 years, and she still loves the city.
        options:
          - { text: has lived, correct: true }
          - {
              text: lives,
              feedback: 'For an action that started in the past and continues now (*for 5 years*), use the present perfect: *has lived*.',
            }
          - {
              text: have lived,
              feedback: 'With *she*, use *has*: *She has lived here for 5 years.*',
            }
      - id: have-ever
        type: fillBlank
        prompt: Complete the question.
        text: ___ you ever been to London?
        blanks: [[Have]]
      - id: havent-finished
        type: fillBlank
        prompt: Write the negative of *finish* in the present perfect.
        text: I ___ packing my suitcase yet.
        blanks: [["haven't finished", have not finished]]
      - id: last-year
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: I visited Paris last year., correct: true }
          - {
              text: I have visited Paris last year.,
              feedback: "*Last year* is a finished time. Don't use it with the present perfect: *I visited Paris last year.*",
            }
          - {
              text: I have visit Paris.,
              feedback: 'After *have*, use the past participle: *I have visited Paris.*',
            }
      - id: participles
        type: matching
        prompt: Match each verb with its past participle.
        pairs:
          - [go, gone]
          - [see, seen]
          - [eat, eaten]
          - [take, taken]
          - [fly, flown]
      - id: has-he-she
        type: trueFalse
        prompt: 'We use *has* with *he, she* and *it*: *She has seen that movie.*'
        answer: true
        feedback:
          correct: 'Right! *I / you / we / they have*, *he / she / it has*.'
          incorrect: 'With *he, she, it* we use *has*: *She has seen that movie.* With *I, you, we, they* we use *have*.'
      - id: order-hotel
        type: reorderSentence
        prompt: Put the words in order.
        sentence: We have just arrived at the hotel.

  - slug: traveling-past-perfect
    title: 'Past perfect: By the time I arrived, I had already…'
    minutes: 8
    items:
      - id: had-forgotten
        type: multipleChoice
        prompt: By the time I arrived at the airport, I ___ my passport at home.
        options:
          - { text: had forgotten, correct: true }
          - {
              text: have forgotten,
              feedback: 'Both actions are in the past, and forgetting happened first. Use the past perfect: *had forgotten*.',
            }
          - {
              text: forget,
              feedback: '*Forget* is the present. The action happened before another past action: *had forgotten*.',
            }
      - id: never-seen
        type: fillBlank
        prompt: Write *never* + the past perfect of *see*.
        text: We ___ snow before that trip.
        blanks: [[had never seen]]
      - id: first-action
        type: multipleChoice
        prompt: 'When we got to the station, the train had left. What happened first?'
        options:
          - { text: The train left., correct: true }
          - {
              text: We got to the station.,
              feedback: '*Had left* is the past perfect, so the train left first. We got to the station later.',
            }
      - id: hadnt-booked
        type: fillBlank
        prompt: Write the negative of *book* in the past perfect.
        text: I ___ a hotel before I arrived, so I was stranded at night.
        blanks: [["hadn't booked", had not booked]]
      - id: same-all
        type: trueFalse
        prompt: 'In the past perfect, we use *has had* with *he, she* and *it*.'
        answer: false
        feedback:
          correct: 'Right! The past perfect is the same for all subjects: *I had left, she had left*.'
          incorrect: 'The past perfect is *had + past participle* for all subjects: *She had left when I arrived.*'
      - id: had-question
        type: multipleChoice
        prompt: ___ they already eaten when you arrived?
        options:
          - { text: Had, correct: true }
          - {
              text: Have,
              feedback: '*When you arrived* is in the past, and eating happened before it. Use the past perfect: *Had they…?*',
            }
          - {
              text: Did,
              feedback: '*Eaten* is a past participle, so we need *had*: *Had they already eaten?*',
            }
      - id: halves
        type: matching
        prompt: Match the two parts of each sentence.
        pairs:
          - ['By the time we got to the gate,', the plane had already left.]
          - [She was very tired because, she had walked all day.]
          - ["I didn't have any money because", a pickpocket had stolen my wallet.]
          - [We had never tried sushi, before that trip to Japan.]
      - id: order-left
        type: reorderSentence
        prompt: Put the words in order.
        sentence: She had left when I arrived.
