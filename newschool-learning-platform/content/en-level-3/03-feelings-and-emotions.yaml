vocabulary:
  - slug: feelings-and-emotions
    title: Feelings and Emotions
    items: *feelings-and-emotions-words

activities:
  - slug: feelings-and-emotions-adjectives
    title: 'Adjectives for feelings: I feel proud'
    minutes: 8
    items:
      - id: kind-teacher
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: She is a kind teacher., correct: true }
          - {
              text: She is a teacher kind.,
              feedback: 'In English, the adjective comes before the noun: *a kind teacher*.',
            }
          - {
              text: She is kind a teacher.,
              feedback: 'The adjective goes between *a* and the noun: *a kind teacher*.',
            }
      - id: feel-happy
        type: multipleChoice
        prompt: I feel ___ today.
        options:
          - { text: happy, correct: true }
          - {
              text: happily,
              feedback: 'After *feel*, use an adjective, not an adverb: *I feel happy.*',
            }
          - {
              text: happiness,
              feedback: '*Happiness* is a noun. After *feel*, use an adjective: *I feel happy.*',
            }
      - id: relieved-jealous
        type: fillBlank
        prompt: Complete with the words in the box.
        text: The test was cancelled, so I felt ___. My friend has a new car, and I want one too. I'm ___.
        wordBank: [relieved, jealous, bored, proud]
        blanks: [[relieved], [jealous]]
      - id: definitions
        type: matching
        prompt: Match each adjective with its meaning.
        pairs:
          - [proud, feeling good about what you or someone else did]
          - [lonely, sad because you are alone]
          - [confused, not able to think clearly or understand]
          - [guilty, feeling bad because you did something wrong]
          - [overwhelmed, feeling that something is too much to deal with]
      - id: after-verbs
        type: trueFalse
        prompt: 'An adjective can come after verbs like *feel, look, seem, sound* and *taste*: *The soup tastes delicious.*'
        answer: true
        feedback:
          correct: 'Right! *I feel happy. You look tired. That sounds great.*'
          incorrect: 'After *feel, look, seem, sound* and *taste*, we use an adjective: *The soup tastes delicious.*'
      - id: tastes
        type: multipleChoice
        prompt: The soup tastes ___.
        options:
          - { text: delicious, correct: true }
          - {
              text: deliciously,
              feedback: 'After *taste*, use an adjective, not an adverb: *tastes delicious*.',
            }
          - {
              text: delicious soup,
              feedback: 'The noun is already in the sentence (*The soup*). Use only the adjective: *tastes delicious*.',
            }
      - id: really-excited
        type: multipleChoice
        prompt: 'Make the feeling stronger: I am ___ about the trip.'
        options:
          - { text: really excited, correct: true }
          - {
              text: excited really,
              feedback: '*Really* comes before the adjective: *really excited*.',
            }
          - {
              text: really excitement,
              feedback: '*Excitement* is a noun. After *I am*, use an adjective: *really excited*.',
            }
      - id: order-proud
        type: reorderSentence
        prompt: Put the words in order.
        sentence: My parents are very proud of me.

  - slug: feelings-and-emotions-perfect
    title: 'Present perfect: Have you ever felt embarrassed?'
    minutes: 8
    items:
      - id: felt
        type: multipleChoice
        prompt: Have you ever ___ embarrassed?
        options:
          - { text: felt, correct: true }
          - { text: feel, feedback: 'After *have*, use the past participle (V3): *feel → felt*.' }
          - {
              text: feeling,
              feedback: 'The present perfect is *have* + V3, not *-ing*: *Have you ever felt…?*',
            }
      - id: yes-i-have
        type: fillBlank
        prompt: Complete the short answer.
        text: "A: Have you ever forgotten someone's birthday? B: Yes, I ___. It made me feel embarrassed."
        blanks: [[have]]
      - id: participles
        type: matching
        prompt: Match each verb with its past participle (V3).
        pairs:
          - [break, broken]
          - [forget, forgotten]
          - [win, won]
          - [meet, met]
          - [write, written]
      - id: has-lost
        type: multipleChoice
        prompt: She ___ never lost her phone.
        options:
          - { text: has, correct: true }
          - { text: have, feedback: 'With *he, she, it*, use *has*: *She has never lost…*' }
          - {
              text: is,
              feedback: 'The present perfect uses *have / has*, not *is*: *She has never lost her phone.*',
            }
      - id: broken
        type: fillBlank
        prompt: 'Write the past participle of *break*.'
        text: Have you ever ___ a promise?
        blanks: [[broken]]
      - id: time-important
        type: trueFalse
        prompt: 'We use the present perfect when the exact time of the experience is important.'
        answer: false
        feedback:
          correct: 'Right! In the present perfect, the experience is important, not the time: *I have visited Paris.*'
          incorrect: "The present perfect is for experiences when the exact time is not important: *I have visited Paris.* (It doesn't matter when.)"
      - id: visited
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: I have visited Paris., correct: true }
          - {
              text: I have visited Paris last summer.,
              feedback: '*Last summer* is an exact time, so use the past simple: *I visited Paris last summer.*',
            }
          - {
              text: I have visit Paris.,
              feedback: 'After *have*, use the past participle: *visited*.',
            }
      - id: order-jealous
        type: reorderSentence
        prompt: Put the words in order.
        sentence: Have you ever felt jealous of a friend?
