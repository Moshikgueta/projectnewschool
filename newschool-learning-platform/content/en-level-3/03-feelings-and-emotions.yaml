# Cycle "Feelings and Emotions", converted from the English level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-level-3
slug: feelings-and-emotions
title: Feelings and Emotions
goal: Describe feelings with adjectives and talk about emotional experiences with the present perfect.
position: 3
status: published

review:
  - >-
    The two workbook exercises ("Adjectives for feelings" and "Present perfect") are
    NEW: the notebook has no self-study exercises. They were written from the cycle's
    summary rules, the activity examples, the Activity 4 verb table and its vocabulary.
    Please check level, wording and every right answer before students see them.
  - >-
    Present perfect + "when": several models say "I have felt proud of myself when I…",
    "I have felt jealous of a friend when they…", "I have felt this way when I didn't
    pass my test…" and "I have felt embarrassed when I spoke with my parents…". For one
    specific event, the past simple is more natural, and the summary of the level 2
    course teaches "present perfect for the experience, past simple for the details".
    The frames now read "Yes, I have. I felt ___ when I ___." and the examples were
    split the same way (*I have felt this way. I felt this way when I didn't pass my
    university exam…*). Please confirm.
  - >-
    Activity 1 example: the sentence "She is a girl because usually girls are more
    jealous than guys" was removed (a gender stereotype, not needed for the task).
    "Jelousy" → "Jealousy"; "and is the color hot pink" → "and she is hot pink".
  - >-
    Summary, adjectives: "very tired" appeared twice in the adverb examples ("extremely
    tired, very tired") → "really excited, extremely tired, very happy"; a stray
    quotation mark after "I am nervous" and missing full stops were fixed. The rule
    heading "Adverbs make adjectives stronger" is kept (really, extremely and very are
    adverbs).
  - >-
    Vocabulary glosses changed: "Nervous" עצבני / מתוח → "מתוח / לחוץ" (עצבני usually
    means irritated or angry); "Sympathetic" סימפטי / מבין → "מבין / משתתף ברגשות"
    (סימפטי in Hebrew means nice, a false friend); "Jealous" קנאי → "מקנא / קנאי". Please
    confirm. The "Definition" column was left out (the vocabulary block has a term and
    a Hebrew gloss only); the definitions are on the second Quizlet set.
  - >-
    Activity 2 needs a bingo card with feelings and emotions; it is not in the notebook.
    A teacher note suggests making one from the vocabulary list. "University Test" →
    "university exam".
  - >-
    Small corrections: "something small.." → "something small"; stray asterisks,
    broken bold and garbled emoji characters ("ð") were removed; the closing quotation
    mark of the "Have you ever?" Mori message was added. The teacher-only lines of
    Activities 1, 3 and 4 ("Start by asking…", "Build an example question…", "Do this
    as a class…") moved to teacher notes.
  - >-
    Links: the three Inside Out clips are on youtube.com and are kept. Both Quizlet
    links are kept without their tracking parameters (?funnelUUID=…). The "Level: 3
    (extreme)" header and the "Students" line were left out. The "Answer of student
    1/2/3" lines are replaced by the optional answer boxes. The source gives no times
    for the activities, so none were added.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: feelings-and-emotions-class
    title: 'Class: Feelings and Emotions'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Feelings and Emotions
      - id: skills
        type: cycleOverview
        skills:
          - name: Adjectives for feelings
            description: Describe people, things and feelings (*I feel nervous. She is a proud parent.*)
          - name: Present perfect
            description: Emotional experiences in your life (*Have you ever felt embarrassed?*)
      - id: quizlet-he
        type: externalLink
        label: Feelings and Emotions on Quizlet (English–Hebrew)
        url: https://quizlet.com/il/1107202276/feelings-and-emotions-translation-flash-cards/
      - id: quizlet-def
        type: externalLink
        label: Feelings and Emotions on Quizlet (English definitions)
        url: https://quizlet.com/il/1107200143/feelings-and-emotions-definition-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I am ___. When I speak English, I feel ___.
        example: I am Shachar. When I speak English, I feel shy.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup-note
        type: callout
        tone: info
        text: Answer in full sentences. If you don't feel comfortable talking about real experiences, you can make something up, as long as you practise speaking English!
      - id: warmup
        type: discussionQuestions
        items:
          - question: Do you feel comfortable talking about your feelings? Why?
            frame: I feel / don't feel comfortable talking about my feelings because ___.
          - question: Have you ever felt proud of yourself? What was the situation?
            frame: Yes, I have. I felt proud of myself when I ___.
          - question: Has a friend ever made you jealous? What happened?
            frame: Yes, I have felt jealous of a friend. I felt jealous when he / she ___.
          - question: Have you ever hidden your feelings from someone that you care about? Why?
            frame: I have / haven't hidden my feelings from ___ because ___.
          - question: Have you ever felt guilty about something small that you did? What was it?
            frame: Yes, I have. I felt guilty when I ___. / No, I haven't.
          - question: How do you feel after a long day at work? Use at least 3 adjectives.
            frame: After a long day at work, I feel ___, ___ and ___.
          - question: What is something simple in your life that makes you feel content?
            frame: ___ makes me feel content.
          - question: Has someone in your life ever made you grateful? Tell the class about it.
            frame: Yes, ___ has made me grateful. I felt grateful when he / she ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: Our emotions'
        skills: [Adjectives for feelings]
        steps:
          - Have you seen the movie *Inside Out*? Watch the short clip about the different emotions in our lives.
          - Talk about the clip with the class (questions below).
          - Make up a new emotion to add to the group! Describe it like a person, with at least 5 adjectives, and explain why you chose them. You can talk freely or use the frames below.
        resource:
          label: Inside Out clip - Get to know your emotions (YouTube)
          url: https://www.youtube.com/watch?v=nEUzQ7yL9A0
        example: |-
          *The emotion is called Jealousy.*
          *She is very tall and very thin, and she is hot pink, because she always looks at everything from above. She wants to have everything. She is not friendly at all to the other emotions, and she always wants to feel like them.*
          *When someone feels jealousy, they feel that their life isn't good enough and they want to live another person's life.*
          *This is an important emotion because sometimes, when you feel jealous, it helps you appreciate what you already have in life.*
      - id: act1-talk
        type: discussionQuestions
        title: About the clip
        items:
          - question: Which emotion do you think represents you the best? Why?
            frame: I think ___ represents me the best because I am often ___.
          - question: Is there an emotion that is more dominant than the others in your personality?
            frame: In my personality, ___ is more dominant because ___.
      - id: act1-emotion
        type: discussionQuestions
        title: My new emotion
        items:
          - question: The emotion is called ___.
          - question: 'He / She is ___, ___, ___, ___ and ___, because ___.'
          - question: When someone feels this emotion, they ___.
          - question: I think this is an important emotion because ___.
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Activity 2: Feeling bingo'
        skills: [Adjectives for feelings, Present perfect]
        steps:
          - In pairs or groups, you get a bingo card with feelings and emotions.
          - Choose an emotion. Tell a story about a time when you felt it, with the present perfect, but don't say the name of the emotion.
          - The group guesses the emotion. The first group to finish its bingo card wins!
        example: |-
          *I have felt this way. I felt this way when I didn't pass my university exam after I had studied for 3 weeks.*
          *You felt disappointed!*
      - id: act2-story
        type: discussionQuestions
        title: My bingo story
        items:
          - question: 'I have felt this way. I felt this way when ___.'
            frame: You felt ___!
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Activity 3: Core memories'
        skills: [Adjectives for feelings]
        steps:
          - Watch the opening scene of *Inside Out*. It explains what core memories are.
          - Talk about the clip with the class (questions below).
          - In pairs, share some of your core memories from life. Use the present perfect and as many feeling adjectives as you can.
          - Change partners halfway and share with another classmate.
        resource:
          label: 'Inside Out: opening scene (YouTube)'
          url: https://www.youtube.com/watch?v=x__NgnMBHV0
        example: '*I have never forgotten my first day at school. I was nervous and shy, but my teacher was very kind, and in the end I felt happy and proud.*'
      - id: act3-talk
        type: discussionQuestions
        title: About the clip
        items:
          - question: Are all of our memories core memories?
            frame: I think ___ because ___.
          - question: Do core memories have to be positive?
            frame: No, they don't. / Yes, they do. For example, ___.
          - question: 'One of my core memories:'
            frame: I have never forgotten ___. I felt ___ and ___.
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Activity 4: Have you ever?'
        skills: [Present perfect]
        steps:
          - Look at the verbs in the table below.
          - Choose a classmate and ask a question with *Have you ever…?* and one of the verbs in V3 (past participle).
          - Your classmate answers and says how it made them feel. Then he / she asks the next question to another student.
        example: |-
          *Have you ever forgotten someone's birthday? How did it make you feel?*
          *Yes, I have. It made me feel embarrassed.*
          *Have you ever broken a promise?*
      - id: act4-verbs
        type: table
        caption: Verbs (base form)
        rows:
          - [win, lose, break, forget]
          - [say, meet, write, do]
          - [see, make, eat, travel]
          - [speak, send, help, hear]
          - [miss, fight, keep, find]
      - id: act4-questions
        type: discussionQuestions
        title: My questions
        items:
          - question: Have you ever ___?
            frame: Yes, I have. / No, I haven't. It made me feel ___.
          - question: Have you ever ___?
            frame: Yes, I have. / No, I haven't. It made me feel ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Level 3 (B1). Two skills this cycle: **adjectives for feelings** (Activities 1,
          2 and 3) and the **present perfect** (warm-up, Activities 2 and 4). Choose the
          activities that fit your time.
      - id: n-warmup
        anchor: warmup
        text: >-
          Pick the questions that fit your group and ask each student at least two. Make
          sure students answer in full sentences and use the present perfect for the
          experience (*Yes, I have*) and the past simple for the details (*I felt proud
          when I passed my test*). Answers typed here are visible to you below each
          question.
      - id: n-act1
        anchor: act1
        text: >-
          Start by asking who has seen *Inside Out*, and explain the movie briefly to those
          who haven't. Watch the clip, then hold a short class conversation.
      - id: n-act2
        anchor: act2
        text: >-
          The bingo card is not in the notebook. Make one with 9–16 feelings from the
          vocabulary list (proud, jealous, disappointed, relieved, embarrassed…), or let
          each group write its own card.
      - id: n-act3
        anchor: act3
        text: >-
          Explain the movie briefly to those who haven't seen it, then watch the opening
          scene. Make sure the pairs use the present perfect and many feeling adjectives.
          You can switch the pairs halfway.
      - id: n-act4
        anchor: act4
        text: >-
          Before the activity, explain the present perfect briefly (*have / has* + V3) and
          build an example question together. Do the activity as a whole class, so you can
          check that every verb changes correctly (*break → broken, forget → forgotten,
          win → won*) and students don't learn a mistake.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: feelings-and-emotions-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-adjectives
        type: ruleSummary
        skill: Adjectives for feelings
        rules:
          - text: '**Adjectives** describe nouns (people, places, things) and also feelings. They tell us what something or someone is like.'
            examples: [a big house, a funny movie, a tired student, a proud parent]
          - text: 'Adjectives come **after the verb *to be*** (*am, is, are*):'
            examples: [The house is big., I am nervous.]
          - text: 'Adjectives come **after *feel, look, seem, sound, taste***:'
            examples: [I feel happy., The soup tastes delicious.]
          - text: 'Adjectives come **before a noun**:'
            examples: [She is a kind teacher., It was a shocking movie.]
          - text: '**Adverbs make adjectives stronger.** Put *really, extremely* or *very* before the adjective to show a stronger feeling.'
            examples: [really excited, extremely tired, very happy]
      - id: rules-present-perfect
        type: ruleSummary
        skill: Present perfect
        rules:
          - text: 'Use the present perfect to talk about **life experiences**, when the exact time is not important but the experience is.'
            examples: ["I have visited Paris. (It doesn't matter when, only that it happened.)"]
          - text: '**Form:** *have / has* + V3 (past participle). Some verbs add -ed (*travel → traveled*), and some change (*see → seen, meet → met*).'
            examples: [I have seen…, She has met…, We have traveled…]
          - text: '**Questions:** *Have you ever* + V3? This is a common way to ask about experiences.'
            examples:
              ['Have you ever felt embarrassed? → Yes, I have. I have felt embarrassed at school.']
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both skills with the group and ask for one new example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: feelings-and-emotions-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Message 1: Emotions and feelings'
        message: |-
          Hi Mori! Let's talk about emotions and feelings. Ask me questions about experiences that I had, so that I need to answer using feeling and emotion adjectives and the present perfect tense.
      - id: mori-2-video
        type: externalLink
        label: 'Riley gets mad | Inside Out (YouTube)'
        url: https://www.youtube.com/watch?v=kwhRQY1IsNA
        description: Watch the family dinner scene. Pay attention to how the different emotions act in each person's head. Then imagine that you are in a similar situation. Which five emotions would be in your head?
      - id: mori-2
        type: aiTutorPrompt
        title: 'Message 2: The feelings in my head'
        message: |-
          Hi Mori! I have just watched the family dinner scene from the movie Inside Out. I want to tell you which five emotions would be in my head if I was in that situation. I will describe each emotion using an adjective, and I will give an example from my life using the present perfect tense. Please ask me follow-up questions about my emotions so I can explain more.
      - id: mori-2-remember
        type: callout
        tone: tip
        title: When you talk to Mori
        text: |-
          Use **adjectives** to describe your emotions (*angry, nervous, relaxed, embarrassed, proud*).
          Use the **present perfect** to talk about times you have felt these emotions: *I have been nervous before a family discussion. I have felt embarrassed before; I felt embarrassed when I spoke with my parents about school.*
          Be ready to **explain why** each emotion is in your head.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Message 3: Have you ever?'
        message: |-
          Hi Mori! Ask me questions with "Have you ever…?" using different verbs (like win, lose, break, meet, travel). After I answer, ask me a follow-up question about my feelings. Then let me ask you a question with "Have you ever…?".
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: feelings-and-emotions-practice
    book: workbook
    title: 'Practice: Feelings and Emotions'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. Each answer is checked right away, and you can try again.
      - id: ex-adjectives
        type: activity
        activity: feelings-and-emotions-adjectives
      - id: ex-present-perfect
        type: activity
        activity: feelings-and-emotions-perfect

