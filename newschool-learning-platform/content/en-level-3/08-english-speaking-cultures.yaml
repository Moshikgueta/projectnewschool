vocabulary:
  - slug: english-speaking-cultures
    title: English-Speaking Cultures
    items: *english-speaking-cultures-words

activities:
  - slug: english-speaking-cultures-questions
    title: 'Questions in the past: Did you…? Were you…? Have you ever…? Had you…?'
    minutes: 8
    items:
      - id: did-feel
        type: multipleChoice
        prompt: ___ you feel at ease at your first meeting with the team?
        options:
          - { text: Did, correct: true }
          - {
              text: Were,
              feedback: '*Were* goes with the *-ing* form (*Were you feeling…?*). With the base verb *feel*, use *Did*.',
            }
          - {
              text: Have,
              feedback: '*Have* goes with a past participle (*Have you felt…?*). With the base verb *feel*, use *Did*.',
            }
      - id: were-doing
        type: fillBlank
        prompt: Complete the past continuous question.
        text: What ___ you doing when the meeting started?
        blanks: [[were]]
      - id: life-experience
        type: multipleChoice
        prompt: Which question asks about a life experience, without saying when?
        options:
          - { text: Have you ever lived abroad?, correct: true }
          - {
              text: Did you live abroad in 2019?,
              feedback: 'This question gives a time (*in 2019*), so it is the past simple. For a life experience, use *Have you ever…?*',
            }
          - {
              text: Were you living abroad last year?,
              feedback: 'This is the past continuous: an action in progress at a time in the past. For a life experience, use *Have you ever…?*',
            }
      - id: question-tenses
        type: matching
        prompt: Match each question with its tense.
        pairs:
          - [Did you hit it off with your new team?, Past simple]
          - [Were you talking to your manager when I called?, Past continuous]
          - [Have you ever taken a rain check?, Present perfect]
          - [Had you met her before the trip?, Past perfect]
      - id: has-she
        type: fillBlank
        prompt: Complete the present perfect question.
        text: ___ she ever experienced culture shock?
        blanks: [[Has]]
      - id: had-met
        type: fillBlank
        prompt: Write *meet* in the right form (past perfect).
        text: Had they ___ before the project started?
        blanks: [[met]]
      - id: base-verb
        type: trueFalse
        prompt: 'In a past simple question, the main verb is in the base form: *Did you catch up with her?*'
        answer: true
        feedback:
          correct: 'Right! *Did* shows the past, so the verb stays in the base form: *Did you catch…?*'
          incorrect: 'After *did*, use the base form: *Did you catch up?*, not *Did you caught up?*'
      - id: order-get-along
        type: reorderSentence
        prompt: Put the words in order to make a question.
        sentence: Did you get along with your manager?

  - slug: english-speaking-cultures-norms
    title: 'Social norms: polite and natural English'
    minutes: 8
    items:
      - id: most-polite
        type: multipleChoice
        prompt: You are in a café. Which is the most polite way to order?
        options:
          - { text: 'Could I have a coffee, please?', correct: true }
          - {
              text: I want a coffee.,
              feedback: "*I want…* is too direct in English. Try *Could I have…?* or *I'd like…*",
            }
          - {
              text: Give me a coffee.,
              feedback: 'An order like *Give me…* sounds rude. Ask a polite question: *Could I have…?*',
            }
      - id: phrases
        type: matching
        prompt: Match each phrase with its meaning.
        pairs:
          - [hit it off, like each other immediately]
          - [drift apart, slowly become less close]
          - [break the ice, make people feel comfortable]
          - [take a rain check, say no politely and do it another time]
          - [speak your mind, say what you really think]
      - id: softer
        type: multipleChoice
        prompt: "Your friend loves reality TV, but you don't. Which answer is softer and more polite?"
        options:
          - { text: "It's not really my cup of tea.", correct: true }
          - {
              text: Reality TV is terrible.,
              feedback: "This is very direct. Use softer language when you disagree: *It's not really my cup of tea.*",
            }
          - {
              text: I hate reality TV.,
              feedback: "This is too direct. A softer way: *It's not really my cup of tea.*",
            }
      - id: there-for-me
        type: fillBlank
        prompt: Complete the phrase *be there for someone*.
        text: My friends were ___ for me during a hard time.
        blanks: [[there]]
      - id: rain-check-uk
        type: trueFalse
        prompt: '*Take a rain check* is mostly a UK phrase.'
        answer: false
        feedback:
          correct: 'Right! *Take a rain check* is a US / Canada phrase.'
          incorrect: '*Take a rain check* is used mostly in the US and Canada. UK phrases are, for example, *pop round* and *have a chinwag*.'
      - id: hung-out
        type: fillBlank
        prompt: Write *hang* in the past simple.
        text: We ___ out after work last Friday.
        blanks: [[hung]]
      - id: most-formal
        type: multipleChoice
        prompt: Which phrase is the most formal?
        options:
          - { text: I would appreciate…, correct: true }
          - {
              text: Can I have…?,
              feedback: '*Can I have…?* is polite but casual. *I would appreciate…* is very formal.',
            }
          - {
              text: I want…,
              feedback: '*I want…* is too direct. *I would appreciate…* is very formal.',
            }
      - id: order-hit-it-off
        type: reorderSentence
        prompt: Put the words in order.
        sentence: We hit it off as soon as we met.
