review:
  - >-
    The two workbook exercises ("Questions in the past" and "Social norms and
    conversation") are NEW: the notebook has no self-study exercises. They were
    written from the cycle's summary rules, the phrase tables and the vocabulary.
    Please check level, wording and every right answer before students see them.
  - >-
    Quizlet: the source labels look swapped. The link under "English – Translation"
    is the "english-definition" set and the link under "English – Definition" is the
    "english-translation" set. The links are labelled here by their URLs; please
    check. The "?i=…&x=…" parameters were removed.
  - >-
    Warm-up: the teacher instruction says "use the present perfect tense" (copied
    from another cycle?). This cycle's skill is questions in the past tenses, so the
    teacher note now says "use past tenses". Please confirm.
  - >-
    Warm-up question 5: "Has someone ever felt that you came across as something
    that you didn't want to be?" → "Have you ever come across as someone you are not?"
    with a short explanation of *come across as*. Model answer: "Yes, they have" →
    "Yes, I have"; "stuck up" → "stuck-up"; "I was only in a little bit of shock" → "I
    was just a little overwhelmed". Please confirm the new wording.
  - >-
    "Cultural shock" → "culture shock" (warm-up 3 and the summary example).
    Warm-up 8: "How do you feel that the people in the USA… are different" → "How do
    you think people in the USA… are different".
  - >-
    Activity 3: the podcast "English isn't always English" is linked on canva.com in
    class, which is not on the link allow-list. The homework links the same title on
    docs.google.com; that link is used for the class activity too. Please check it
    is the same podcast. The activity had no title; it is now "English isn't always
    English". The homework Mori message had a url-shortener.me link, which was
    removed from the message.
  - >-
    Activity 4 (debate): every argument must use "a modal verb or the present
    perfect", which are not this cycle's skills (the same rule appears in the Cuisine
    cycle). Kept as in the source, with "or a question in the past" added. "Group 1 /
    Group 2" and "Group A / Group B" were made consistent (Group A / B).
  - >-
    Activity 2: "can not be translated" → "cannot be translated"; "Tell the class in a
    reported speech" → "Use reported speech to tell the class". The phrase "Take the
    piss" (UK / Australia) is very informal and can sound rude; it is kept as in the
    source. Please decide whether to keep it.
  - >-
    Summary, social norms rule 1: "Instead of *I don't like it* → *It wasn't really my
    cup of tea*" mixes present and past; it now reads "*It's not really my cup of
    tea.*". Rule 2 was reworded ("Try and learn phrases that are frequently used in the
    language that you are talking" → "Learn phrases that people often use in the
    culture you are talking to"). The politeness table had broken emoji (shown as
