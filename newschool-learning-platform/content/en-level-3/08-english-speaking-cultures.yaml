    "פאסיב-אגרסיב" → "פסיבי-אגרסיבי"; Soccer "כדורגל בארצות הברית" → "כדורגל (המונח
    האמריקאי)"; Football "כדורגל בבריטניה" → "כדורגל (המונח הבריטי)". The broken term
