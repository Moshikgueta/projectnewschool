vocabulary:
  - slug: recent-news
    title: Recent News
    items: *recent-news-words

activities:
  - slug: recent-news-reported
    title: 'Reported speech: She said she was tired'
    minutes: 8
    items:
      - id: was-tired
        type: multipleChoice
        prompt: '"I am tired," Dana said. → Dana said she ___ tired.'
        options:
          - { text: was, correct: true }
          - {
              text: am,
              feedback: 'In reported speech, the present changes to the past, and *I* becomes *she*: *she was*.',
            }
          - { text: were, feedback: 'With *she*, the past of *be* is *was*, not *were*.' }
      - id: would-call
        type: fillBlank
        prompt: 'Report the sentence: "I will call you tomorrow," he said.'
        text: He said he ___ call me the next day.
        blanks: [[would]]
      - id: time-words
        type: matching
        prompt: Match each time or place word with its form in reported speech.
        pairs:
          - [today, that day]
          - [tomorrow, the next day]
          - [yesterday, the day before]
          - [here, there]
          - [now, then]
      - id: told-me
        type: multipleChoice
        prompt: He ___ me that he was busy.
        options:
          - { text: told, correct: true }
          - {
              text: said,
              feedback: 'When we say who received the information (*me*), we use *told*: *He told me…* With *said*, there is no person: *He said that…*',
            }
          - {
              text: asked,
              feedback: '*Asked* is for questions. Here he gives information, so use *told*.',
            }
      - id: asked-if
        type: multipleChoice
        prompt: '"Do you like coffee?" she asked me. → She asked ___.'
        options:
          - { text: if I liked coffee, correct: true }
          - {
              text: if did I like coffee,
              feedback: 'A reported question has normal word order (subject + verb) and no *did*: *if I liked coffee*.',
            }
          - {
              text: that I liked coffee,
              feedback: 'For a yes / no question, use *if*, not *that*: *She asked if I liked coffee.*',
            }
      - id: here-there
        type: trueFalse
        prompt: 'In reported speech, *here* usually changes to *there*.'
        answer: true
        feedback:
          correct: 'Right! *"I am here," she said. → She said she was there.*'
          incorrect: 'Place words change too: *here → there*, just like *today → that day*.'
      - id: were-going
        type: fillBlank
        prompt: 'Report the sentence: "We are going to the protest today," they said.'
        text: They said they ___ going to the protest ___.
        blanks: [[were], [that day]]
      - id: order-told
        type: reorderSentence
        prompt: Put the words in order.
        sentence: She told me that she was busy.

  - slug: recent-news-tenses
    title: 'Mixed tenses: yesterday, today and tomorrow'
    minutes: 8
    items:
      - id: started
        type: multipleChoice
        prompt: Yesterday the protest ___.
        options:
          - { text: started, correct: true }
          - {
              text: starts,
              feedback: '*Yesterday* is a finished time, so use the past simple: *started*.',
            }
          - {
              text: will start,
              feedback: '*Will* is for the future. *Yesterday* needs the past simple: *started*.',
            }
      - id: are-watching
        type: multipleChoice
        prompt: Right now, people ___ the news.
        options:
          - { text: are watching, correct: true }
          - {
              text: watched,
              feedback: '*Watched* is the past. For an action happening now, use the present continuous: *are watching*.',
            }
          - {
              text: were watching,
              feedback: '*Were watching* is the past continuous. *Right now* needs the present: *are watching*.',
            }
      - id: storm
        type: fillBlank
        prompt: 'Complete with the right tense: *start*, then *still rain*.'
        text: The storm ___ yesterday, and it ___ now.
        blanks: [[started], [is still raining, "'s still raining"]]
      - id: if-watch
        type: fillBlank
        prompt: 'Complete the prediction with *will* + *understand*.'
        text: If people watch the report, they ___ better.
        blanks: [[will understand]]
      - id: time-tense
        type: matching
        prompt: Match each time expression with the tense we usually use.
        pairs:
          - [Last week…, past simple]
          - [Right now…, present continuous]
          - [Every morning…, present simple]
          - [Tomorrow…, future with will]
      - id: one-tense
        type: trueFalse
        prompt: One sentence can only have one tense.
        answer: false
        feedback:
          correct: 'Right! We mix tenses to connect times: *Last week the government made a statement, and today people are still talking about it.*'
          incorrect: 'A sentence can talk about more than one time, so it can have more than one tense: *Yesterday the protest started, and tomorrow they will protest again.*'
      - id: statement
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - {
              text: 'Last week the government made a statement, and today people are still talking about it.',
