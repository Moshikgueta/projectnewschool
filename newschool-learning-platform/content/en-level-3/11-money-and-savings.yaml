# Cycle "Money and Savings", converted from the English level 3 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-level-3
slug: money-and-savings
title: Money and Savings
goal: Talk about money and saving with the passive voice and conditional (hypothetical) sentences.
position: 11
status: in_review

review:
  - >-
    The two workbook exercises ("Passive voice" and "Conditionals") are NEW: the
    notebook has no self-study exercises. They were written from the cycle's summary
    rules, the activity questions and the vocabulary. Please check level, wording and
    every right answer before students see them.
  - >-
    The skill "Hypothetical sentences" covers all four conditionals in the notebook
    (zero, first, second and third), so it is named "Conditionals (hypothetical
    sentences)" here.
  - >-
    Activities 1–4 each link to a gamma.app page ("If I Had Money Money Money -
    Questions", "Scenarios", "Tips and Questions", "How can money be saved?"). The
    host is not on the link allow-list, so the links were removed and mentioned in
    teacher notes. All the questions and tips from the notebook are kept in the class
    section.
  - >-
    Activity 3: the reading "5 Tips to Save Money - By Daniel Roberts, Financial
    Advisor" includes an "About Daniel" paragraph that looks copied from a real
    advisor's website. It was replaced with a one-line neutral description; the name
    and the short quote are kept. Please check the source and whether we may use the
    name and quote at all. The teacher instruction "If the students haven't learned
    zero and first conditional, make them answer only those questions" was illogical;
    it now reads "If the group has only learned the zero and first conditionals, ask
    only those questions; otherwise ask one question of each type".
  - >-
    Small corrections: "Senarios" → "Scenarios" (link label, removed with the link);
    "If you always buy the cheapest" → "If you always buy the cheapest things"; "Ask
    Mori answers, too!" → "Ask Mori questions, too!"; the warm-up "What would you do
    if your salary was cut by 20%?" is kept (*was* is fine in speech; *were* is more
    formal). Stray asterisks and broken bold removed; "Answer of student 1/2/3" lines
    removed (the platform has answer boxes). Quizlet links kept without their
    tracking parameters (?i=…&x=…).
  - >-
    Summary: the passive example "Money is saved by cooking at home" is kept; note
    that *by cooking* here says how, not who does the action. Activity 1 Stage 2 asks
    students to practise reported speech, which is not a skill of this cycle; it is
    kept in a teacher note as optional.
  - >-
    Vocabulary: the source table has a Definition column, but the vocabulary block
    only holds a term and a Hebrew gloss, so the definitions were left out (they are
    in the second Quizlet set, "English - Definition", linked in class). The source
    gives no times for the activities, so no minutes were set.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: money-and-savings-class
    title: 'Class: Money and Savings'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Money and Savings
      - id: skills
        type: cycleOverview
        skills:
          - name: Passive voice
            description: 'When the action is more important than who does it (*Money is saved by cooking at home. More money should be saved.*)'
          - name: Conditionals (hypothetical sentences)
            description: 'Zero, first, second and third conditionals (*If you won $10,000, what would you do with it?*)'
      - id: quizlet-translation
        type: externalLink
        label: 'Money and Savings on Quizlet: English - Translation'
        url: https://quizlet.com/il/1144393030/money-and-savings-english-translation-flash-cards/
      - id: quizlet-definition
        type: externalLink
        label: 'Money and Savings on Quizlet: English - Definition'
        url: https://quizlet.com/il/1144392638/money-and-savings-english-definition-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I am ___. I think financial health is important because ___.
        example: I am Dana. I think financial health is important because it gives you peace of mind.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: How much money do you think should be saved every month by young people?
            frame: I think ___ should be saved every month because ___.
          - question: Do you think saving money is taught well in schools, or should it be taught more?
            frame: I think saving money is / isn't taught well in schools. It should be ___.
          - question: What would you do if your salary was cut by 20%?
            frame: If my salary was cut by 20%, I would ___.
          - question: "What do you think should be done if someone's savings are lost because of a bank mistake?"
            frame: I think the money should be ___.
          - question: How can good saving habits be learned by teenagers today?
            frame: Good saving habits can be learned by ___.
          - question: If you were given one million dollars, how would it be spent?
            frame: If I were given one million dollars, it would be spent on ___.
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: If I had money, money, money'
        skills: [Conditionals (hypothetical sentences)]
        steps:
          - In pairs, discuss and answer 4 of the questions below. Your teacher chooses the questions for your level.
          - As a class, talk about your answers. Tell the group what your partner said.
        example: '*If I won $10,000 tomorrow, I would pay for a trip to Japan and save the rest.*'
      - id: act1-zero
        type: discussionQuestions
        title: 'Zero conditional: general truths and facts'
        items:
          - question: If you save money every month, what happens?
          - question: "If people don't plan their spending, what usually happens to their money?"
          - question: If someone spends more than they earn, what problems do they have?
          - question: If you always buy the cheapest things, how does it affect your lifestyle?
      - id: act1-first
        type: discussionQuestions
        title: 'First conditional: real future possibilities'
        items:
          - question: If you get a bonus this year, how will you use it?
          - question: If you find a cheaper apartment, how will you spend the extra money?
          - question: If you open a savings account next month, how much will you save?
          - question: If your expenses go up next year, what will you cut first?
      - id: act1-second
        type: discussionQuestions
        title: 'Second conditional: unreal or hypothetical present or future'
        items:
          - question: If you won $10,000 tomorrow, what would you do with it?
          - question: If you could live anywhere for less money, where would you go?
          - question: If you had to save 50% of your salary, what would you stop buying?
          - question: If you could change one thing about how people save money, what would you change?
      - id: act1-third
        type: discussionQuestions
        title: 'Third conditional: unreal or hypothetical past'
        items:
          - question: If you had saved more money last year, what would you have done with it?
          - question: If you had known more about money when you were 18, what would you have done differently?
          - question: If you had spent less on clothes when you were younger, how much would you have saved?
          - question: If you had asked for advice earlier, would you have avoided any money mistakes?
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Activity 2: What should be done?'
        skills: [Passive voice]
        steps:
          - Your teacher shows a scenario and asks **What should be done?**
          - Answer in one short sentence with the passive voice (*should be + past participle*).
        example: |-
          *A big bonus is given to you at work. What should be done with it?*
          *A big bonus should be saved or invested wisely rather than spent immediately.*
      - id: act2-scenarios
        type: discussionQuestions
        title: Scenarios
        items:
          - question: A big bonus is given to you at work. What should be done with it?
            frame: The bonus should be ___.
          - question: "A friend's money was stolen from their bank account. What should be done?"
            frame: The bank should be ___. / The money should be ___.
          - question: "Too much money is spent on things people don't really need. What could be done to change this?"
            frame: Less money could be ___.
          - question: Not enough money is saved by young people today. What should be done to help them save more?
            frame: Young people should be ___.
          - question: Some people think that more financial education should be given in schools. Do you agree?
            frame: I agree / disagree. Financial education should / shouldn't be ___.
          - question: Your city wants ideas for how public money should be spent. What do you think should be done?
            frame: Public money should be spent on ___.
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Activity 3: Money tips'
        skills: [Conditionals (hypothetical sentences)]
        steps:
          - Read the text below together as a group.
          - In pairs, you receive one tip. Read it and answer the questions about it.
          - Share your tip and your best answer with the class.
      - id: act3-reading-title
        type: heading
        level: 4
        text: 5 Tips to Save Money, by Daniel Roberts, Financial Advisor
      - id: act3-quote
        type: callout
        tone: info
        title: Daniel Roberts, Certified Financial Advisor
        text: '*"Saving money doesn''t mean you can''t enjoy life. It means you take care of your future while you enjoy today."*'
      - id: act3-about
        type: text
        text: >-
          **About the author:** a financial advisor who helps people save money, invest
          and plan for the future.
      - id: act3-tips
        type: table
        caption: The 5 tips
        header: [Tip, What it means]
        rows:
          - [
              Pay yourself first,
              "When you get money, save a part of it before you spend it. Even a small amount helps. If you save first, you won't spend it by accident.",
            ]
          - [
              Know where your money goes,
              "Write down what you spend money on for one week. You will see small things that can be changed. Many people waste money because they don't see the details.",
            ]
          - [
              Set a goal,
              "It's easier to save when you have a goal, like a trip, a laptop or your future studies. When you have a goal, saving feels like a plan, not a sacrifice.",
            ]
          - [
              Spend less on small things,
              'One coffee here, one snack there: it all adds up. Try to buy small things less often and save that money instead. You will be surprised how much you keep.',
            ]
          - [
              'Start now, not later',
              'Many people wait to start saving until they "have more money". But saving is a habit. Start small today, and you will build a good habit for tomorrow.',
            ]
      - id: act3-tip1
        type: discussionQuestions
        title: 'Tip 1: Pay yourself first'
        items:
          - question: 'Zero: If you save a part of your money first, what happens?'
          - question: 'First: If you start saving first this month, how will it help you?'
          - question: 'Second: If you could save half your salary, what would you do with it?'
          - question: 'Third: If you had always saved money first, how would your finances be different now?'
      - id: act3-tip2
        type: discussionQuestions
        title: 'Tip 2: Know where your money goes'
        items:
          - question: 'Zero: If you write down your spending, what do you notice?'
          - question: 'First: If you track your spending this week, what will you learn?'
          - question: 'Second: If you could see all your spending in one place, how would you feel?'
          - question: 'Third: If you had tracked your money better last year, what would you have changed?'
      - id: act3-tip3
        type: discussionQuestions
        title: 'Tip 3: Set a goal'
        items:
          - question: 'Zero: If you have a goal, do you save money more easily?'
          - question: 'First: If you set a savings goal this month, how much will you save?'
          - question: 'Second: If you could choose any savings goal today, what would it be?'
          - question: 'Third: If you had set a clear goal last year, what would you have done with the money?'
      - id: act3-tip4
        type: discussionQuestions
        title: 'Tip 4: Spend less on small things'
        items:
          - question: 'Zero: If you buy fewer small things, what happens to your savings?'
          - question: 'First: If you stop buying snacks every day, how much will you save this month?'
          - question: 'Second: If you could avoid buying one thing every day, how would you feel?'
          - question: 'Third: If you had spent less on snacks last year, what bigger thing could you have bought?'
      - id: act3-tip5
        type: discussionQuestions
        title: 'Tip 5: Start now, not later'
        items:
          - question: 'Zero: If you wait too long to save, what happens?'
          - question: 'First: If you save your money today, what will you do with it in the future?'
          - question: 'Second: If you could give yourself saving advice, what would you say?'
          - question: 'Third: If you had started saving when you were younger, how would your life be different now?'
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Activity 4: How can money be saved?'
        skills: [Passive voice]
        steps:
          - 'As a class, answer the conversation starters below: how money can be saved or wasted in daily life.'
          - In pairs, choose 3 topics from the list and think of solutions for saving money. Use the passive voice.
          - Each pair presents one solution to the class. Another pair asks a follow-up question.
        example: '*Water can be saved at home if showers are kept short.*'
      - id: act4-starters
        type: discussionQuestions
        title: Conversation starters
        items:
          - question: Where do you think money is wasted the most?
            frame: I think money is wasted the most on ___.
          - question: What is something small that could be changed to save money?
            frame: ___ could be changed.
          - question: What do you do at home that helps money be saved?
            frame: At home, ___ is / are ___.
      - id: act4-topics
        type: discussionQuestions
        title: Choose 3 topics
        items:
          - question: How water can be saved at home.
          - question: How food waste can be reduced.
          - question: How energy is wasted in daily life.
          - question: How transport costs can be saved.
          - question: How shopping habits can be changed.
          - question: How money is wasted on entertainment.
          - question: How money could be saved when you travel.
          - question: How old things can be reused instead of thrown away.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Two skills this cycle: the **passive voice** (warm-up, Activities 2 and 4) and
          **conditionals** (warm-up, Activities 1 and 3).
      - id: n-warmup
        anchor: warmup-title
        text: Many warm-up questions use the passive or a conditional. Ask students to answer with the same structure.
      - id: n-act1
        anchor: act1
        text: >-
          Choose the questions for the group's level. The notebook's question cards are on
          a gamma.app page ("If I Had Money Money Money - Questions"), which is not on the
          link allow-list; the same questions are below. In the class part, students can
          also practise reported speech (*She said she would buy a car.*), as an option.
      - id: n-act2
        anchor: act2
        text: >-
          Group activity. Make sure everyone answers with the passive voice in the correct
          way. The notebook's scenario cards are on a gamma.app page ("Scenarios"), not on
          the link allow-list; the same scenarios are below.
      - id: n-act3
        anchor: act3
        text: >-
          Choose the tip for each pair according to their level. If the group has only
          learned the zero and first conditionals, ask only those questions; otherwise ask
          one question of each type. The notebook's tip cards are on a gamma.app page
          ("Tips and Questions"), not on the link allow-list.
      - id: n-act4
        anchor: act4
        text: The notebook's topic cards are on a gamma.app page ("How can money be saved?"), not on the link allow-list; the same topics are below.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: money-and-savings-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-conditionals
        type: ruleSummary
        skill: Conditionals (hypothetical sentences)
        rules:
          - text: Use conditionals to talk about real or unreal situations and their results. They explain what happens, what could happen, or what might have happened.
          - text: 'A conditional has two parts: the **if-clause** (the condition) and the **main clause** (the result). The verb tenses change with the type.'
          - text: '**Zero conditional:** facts or general truths. *If + present simple, present simple.*'
            examples: ['If you save money, you have more security.']
          - text: '**First conditional:** a real future possibility. *If + present simple, will + base verb.*'
            examples: ['If you save money this month, you will have extra cash.']
          - text: '**Second conditional:** an unreal or hypothetical situation now or in the future. *If + past simple, would + base verb.*'
            examples: ['If you won $10,000, you would buy something big.']
          - text: '**Third conditional:** an unreal past. *If + past perfect, would have + past participle.*'
            examples: ['If you had saved last year, you would have traveled more.']
      - id: conditionals-table
        type: table
        caption: The four conditionals
        header: [Type, Use, If-clause, Main clause]
        rows:
          - [Zero, Facts and general truths, present simple, present simple]
          - [First, Real future possibility, present simple, will + base verb]
          - [Second, Unreal now or in the future, past simple, would + base verb]
          - [Third, Unreal past, past perfect, would have + past participle]
      - id: rules-passive
        type: ruleSummary
        skill: Passive voice
        rules:
          - text: Use the **passive voice** when the action is more important than the person who does it.
            examples: [Money is saved by cooking at home.]
          - text: '**Form:** *be + past participle (V3)*.'
            examples: [Food waste can be reduced., A friend's money was stolen.]
          - text: '**With modal verbs:** *modal verb + be + past participle*.'
            examples: [More money should be saved every month., Old things can be reused.]
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both skills with the group and ask for one new example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: money-and-savings-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Message 1: Money and savings'
        message: |-
          Hi Mori! I want to talk about money and savings. Can you ask me questions using the passive voice and conditionals?
          Please correct my mistakes.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Message 2: Money news reporter'
        message: |-
          Hi Mori! Let's do a "Money News Reporter" game. You start a short news story about money in the passive voice, and I continue it with two or three more sentences in the passive voice.
          Please correct my mistakes.
      - id: mori-2-tips
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Keep your answers short but informative, in full sentences.
          Ask Mori questions, too! Keep the conversation going.
          Use the passive voice while reporting the economic news.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Message 3: If I were rich'
        message: |-
          Hi Mori! Let's do an "If I Were Rich…" role-play. Ask me fun "if…" questions about being rich or saving money, so I can answer with zero, first, second or third conditionals (I will choose).
          Please correct my mistakes.
      - id: mori-3-tips
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Use the correct conditional for each situation.
          Try to use modal verbs (*could, should, might*).
          Use connecting words (*because, so, but, and then*).
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: money-and-savings-practice
    book: workbook
    title: 'Practice: Money and Savings'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. Each answer is checked right away, and you can try again.
      - id: ex-passive
        type: activity
        activity: money-and-savings-passive
      - id: ex-conditionals
        type: activity
        activity: money-and-savings-conditionals

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: money-and-savings-vocabulary
    title: Vocabulary
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Money words
        glossLang: he
        link: https://quizlet.com/il/1144393030/money-and-savings-english-translation-flash-cards/
        items: &money-and-savings-words
