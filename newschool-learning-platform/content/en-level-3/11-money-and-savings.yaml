vocabulary:
  - slug: money-and-savings
    title: Money and Savings
    items: *money-and-savings-words

activities:
  - slug: money-and-savings-passive
    title: 'Passive voice: Money is saved, money should be saved'
    minutes: 8
    items:
      - id: should-be-saved
        type: multipleChoice
        prompt: More money should ___ every month.
        options:
          - { text: be saved, correct: true }
          - {
              text: saved,
              feedback: 'With a modal verb, the passive is *modal + be + past participle*: *should be saved*.',
            }
          - {
              text: be save,
              feedback: 'After *be*, use the past participle (V3): *saved*, not *save*.',
            }
      - id: be-reduced
        type: fillBlank
        prompt: Write the passive of *reduce* after *can*.
        text: Food waste can ___ if we plan our meals.
        blanks: [[be reduced]]
      - id: was-stolen
        type: multipleChoice
        prompt: "A friend's money ___ from their bank account last week."
        options:
          - { text: was stolen, correct: true }
          - {
              text: stole,
              feedback: 'The money did not steal anything. Something happened to it, so use the passive: *was stolen*.',
            }
          - {
              text: is stolen,
              feedback: '*Last week* is the past, so *be* is in the past simple: *was stolen*.',
            }
      - id: action-important
        type: trueFalse
        prompt: We use the passive voice when the action is more important than the person who does it.
        answer: true
        feedback:
          correct: 'Right! *Money is saved by cooking at home.* The saving is the important part.'
          incorrect: 'The passive puts the action first, not the person: *Money is saved by cooking at home.*'
      - id: is-spent
        type: fillBlank
        prompt: Write the passive of *spend* in the present simple.
        text: "Too much money ___ on things people don't really need."
        blanks: [[is spent]]
      - id: active-passive
        type: matching
        prompt: Match each active sentence with its passive form.
        pairs:
          - [People save money by cooking at home., Money is saved by cooking at home.]
          - [
              Schools should teach financial education.,
              Financial education should be taught in schools.,
            ]
          - [Someone stole my wallet., My wallet was stolen.]
          - [We can reuse old things., Old things can be reused.]
      - id: which-passive
        type: multipleChoice
        prompt: Which sentence is in the passive voice?
        options:
          - { text: A big bonus was given to me at work., correct: true }
          - {
              text: My boss gave me a big bonus.,
              feedback: 'This is active: the person (*my boss*) does the action. The passive is *A big bonus was given to me.*',
            }
          - {
              text: I am saving my bonus.,
              feedback: 'This is the present continuous (active). The passive needs *be + past participle*: *was given*.',
            }
      - id: order-water
        type: reorderSentence
        prompt: Put the words in order.
        sentence: Water can be saved at home.

  - slug: money-and-savings-conditionals
    title: 'Conditionals: If you save money…'
    minutes: 8
    items:
      - id: zero
        type: multipleChoice
        prompt: 'A general truth: If you spend more than you earn, you ___ money problems.'
        options:
          - { text: have, correct: true }
          - {
              text: would have,
              feedback: 'This is a general truth, so use the zero conditional: *If + present simple, present simple*.',
            }
          - {
              text: had,
              feedback: 'For facts and general truths, both parts are in the present simple: *you have*.',
            }
      - id: first
        type: multipleChoice
        prompt: 'A real plan: If I get a bonus this year, I ___ it.'
        options:
          - { text: will save, correct: true }
          - {
              text: would save,
              feedback: '*If I get* (present simple) is a real future possibility: the first conditional uses *will*.',
            }
          - {
              text: saved,
              feedback: 'The result is in the future, so use *will* + base verb: *I will save it*.',
            }
      - id: won
        type: fillBlank
        prompt: Write the verb *win* in the past simple (second conditional).
        text: If I ___ $10,000 tomorrow, I would buy a new car.
        blanks: [[won]]
      - id: would-have-traveled
        type: fillBlank
        prompt: Write *would have* + the past participle of *travel* (third conditional).
        text: If I had saved more money last year, I ___ more.
        blanks: [[would have traveled, would have travelled]]
      - id: forms
        type: matching
        prompt: Match each conditional with its form.
        pairs:
          - [Zero conditional, 'If + present simple, present simple']
          - [First conditional, 'If + present simple, will + base verb']
          - [Second conditional, 'If + past simple, would + base verb']
          - [Third conditional, 'If + past perfect, would have + past participle']
      - id: unreal-past
        type: trueFalse
        prompt: The third conditional talks about an unreal situation in the past.
        answer: true
        feedback:
          correct: "Right! *If I had known more about money, I would have saved more.* (But I didn't know.)"
          incorrect: 'The third conditional is about the past, and it did not happen: *If I had saved last year, I would have traveled more.*'
      - id: had-known
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - {
              text: 'If I had known more about money at 18, I would have saved more.',
              correct: true,
            }
          - {
              text: 'If I would have known more about money at 18, I would have saved more.',
              feedback: "Don't use *would* in the if-clause. The third conditional uses the past perfect: *If I had known…*",
            }
          - {
              text: 'If I had known more about money at 18, I will save more.',
              feedback: 'For an unreal past, the result is *would have* + past participle: *I would have saved more.*',
            }
      - id: order-lottery
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I would buy a house if I won the lottery.
