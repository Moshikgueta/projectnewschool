vocabulary:
  - slug: career-and-personal-development
    title: Career & Personal Development
    items: *career-and-personal-development-words

activities:
  - slug: career-and-personal-development-tenses
    title: 'Narrative tenses: before, now and in the future'
    minutes: 8
    items:
      - id: dreamed
        type: multipleChoice
        prompt: When I was a child, I ___ of being a pilot.
        options:
          - { text: dreamed, correct: true }
          - {
              text: dream,
              feedback: '*When I was a child* is a finished time in the past, so use the past simple: *dreamed*.',
            }
          - {
              text: have dreamed,
              feedback: 'With a finished time like *when I was a child*, use the past simple, not the present perfect.',
            }
      - id: work-now
        type: multipleChoice
        prompt: Now I ___ as a designer in a small company.
        options:
          - { text: work, correct: true }
          - {
              text: worked,
              feedback: '*Worked* is the past simple. For your job now, use the present simple: *I work*.',
            }
          - {
              text: will work,
              feedback: '*Will work* is the future. *Now* tells us we need the present simple: *I work*.',
            }
      - id: wanted
        type: fillBlank
        prompt: Write the verb *want* in the past simple.
        text: When I was younger, I ___ to be a doctor.
        blanks: [[wanted]]
      - id: used-to
        type: multipleChoice
        prompt: I ___ work in a bank, but now I'm a teacher.
        options:
          - { text: used to, correct: true }
          - {
              text: use to,
              feedback: 'For a past habit that is not true now, write *used to* + base verb: *I used to work in a bank.*',
            }
          - {
              text: am used to,
              feedback: '*Be used to* means that something is normal for you now. For a past habit, use *used to*.',
            }
      - id: going-to
        type: fillBlank
        prompt: Write *I* + *going to* + *study* (a plan for the future).
        text: Next year ___ management. I have already registered for the course.
        blanks: [["I'm going to study", I am going to study]]
      - id: present-routines
        type: trueFalse
        prompt: We use the present simple to talk about our job now and our routines.
        answer: true
        feedback:
          correct: 'Right! *I work as a designer. I usually work with small teams.*'
          incorrect: 'The present simple is for what is true today and what happens regularly: *I work as a designer.*'
      - id: time-markers
        type: matching
        prompt: Match each beginning with its tense.
        pairs:
          - [When I started…, past simple]
          - ['Before, I used to…', past habit]
          - [Now I…, present simple]
          - ['In the future, I want to…', future]
      - id: order-business
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I want to start my own business in the future.

  - slug: career-and-personal-development-conditional
    title: 'Second conditional: If I had…, I would…'
    minutes: 8
    items:
      - id: had-experience
        type: multipleChoice
        prompt: If I ___ more experience, I would apply for that job.
        options:
          - { text: had, correct: true }
          - {
              text: have,
              feedback: 'In the second conditional, use the past simple after *if*: *If I had…*',
            }
          - {
              text: would have,
              feedback: "Don't use *would* after *if*. Use the past simple: *If I had…*",
            }
      - id: would-spend
        type: fillBlank
        prompt: Write *I* + *would* + *spend*.
        text: If I worked fewer hours, ___ more time with my family.
        blanks: [[I would spend, "I'd spend"]]
      - id: correct-sentence
        type: multipleChoice
        prompt: Which sentence is correct?
        options:
          - { text: 'If I had more time, I would study more.', correct: true }
          - {
              text: 'If I have more time, I would study more.',
              feedback: 'For an imaginary situation, use the past simple after *if*: *If I had more time…*',
            }
          - {
              text: 'If I had more time, I will study more.',
              feedback: 'In the second conditional, the result uses *would* + base verb, not *will*.',
            }
      - id: imaginary
        type: trueFalse
        prompt: The second conditional talks about imaginary or unlikely situations now or in the future.
        answer: true
        feedback:
          correct: "Right! *If I won the lottery, I would stop working.* (I probably won't win.)"
          incorrect: 'The second conditional is for imaginary or unlikely situations: *If I won the lottery, I would stop working.*'
      - id: boss-were
        type: fillBlank
        prompt: Write the verb *be* in the past simple.
        text: Work would be easier if my boss ___ more organized.
        blanks: [[were, was]]
      - id: what-would
        type: multipleChoice
        prompt: What ___ you do if you caught a co-worker stealing?
        options:
          - { text: would, correct: true }
          - {
              text: will,
              feedback: '*Caught* is the past simple, so this is the second conditional: *What would you do…?*',
            }
          - {
              text: did,
              feedback: 'The question is about the result of an imaginary situation, so use *would*: *What would you do…?*',
            }
      - id: will-result
        type: trueFalse
        prompt: 'This sentence is correct: *If I won the lottery, I will travel around the world.*'
        answer: false
        feedback:
          correct: 'Right! The result needs *would*: *If I won the lottery, I would travel around the world.*'
          incorrect: 'With *if* + past simple (*won*), the result uses *would*: *I would travel around the world.*'
      - id: order-chance
        type: reorderSentence
        prompt: Put the words in order.
        sentence: I would change jobs if I had the chance.
