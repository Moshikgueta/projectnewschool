# Cycle "Career & Personal Development", converted from the English level 3
# digital notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (English).
course: en-level-3
slug: career-and-personal-development
title: Career & Personal Development
goal: Talk about your career with narrative tenses (past, present and future) and the second conditional.
position: 10
status: published

review:
  - >-
    The two workbook exercises ("Narrative tenses" and "Second conditional") are NEW:
    the notebook has no self-study exercises. They were written from the cycle's
    summary rules, the activity examples and the vocabulary. Please check level,
    wording and every right answer before students see them. In the item
    "my boss ___ more organized", both *were* and *was* are accepted.
  - >-
    Activity 1 links to an "Interactive Interview" page on gamma.app, which is not on
    the link allow-list. The link was removed and the page is mentioned in a teacher
    note; the question list from the notebook is kept in the class section.
  - >-
    Activity 6: the source lists Israeli companies with a shorter work week as
    "Bituach Yashir" and a placeholder "**EXAMPLE**". The placeholder was removed and
    Bituach Yashir moved to a teacher note. Please check that this example is correct
    and add a second one if you have it.
  - >-
    Summary, second conditional: the rule titled "Use the verb 'had'" really says to
    use the past simple after *if* (not only the verb *had*). It is now titled "Past
    simple after *if*", with the same ❌/✅ example. The form "Would + verb → if + past
    simple" is written as "result first: would + base verb + if + past simple (no
    comma)".
  - >-
    Small corrections: "Interveiw" (gamma page title) is not used; broken bold and
    stray asterisks removed; "Answer of student 1/2/3" lines removed (the platform
    has answer boxes); "say one positive comment" → "give one positive comment";
    "Remind to:" → "Remember to:"; the quote in Activity 2 is kept as "Reach for the
    moon. If you fall, you will land among the stars." The warm-up model answer is kept
    as the example of a full answer in the first question's frame.
  - >-
    Vocabulary: the source table has a Definition column, but the vocabulary block
    only holds a term and a Hebrew gloss, so the definitions were left out (they are
    in the second Quizlet set, "English - Definition", linked in class).
    "Accountability" has no definition or Hebrew in the source; the gloss "אחריותיות
    / חובת דין וחשבון" was added, please confirm. "Resume" → "Résumé (CV)".
  - >-
    Timings: introduction round "max. 5 minutes" → 5; Activity 2 talks "2–3 minutes"
    → 3 and "1.5 minutes" kept in the note; Activity 5 "1.5 / 2 minutes" → 2. The
    source gives no total times for the activities, so no `minutes` were set on them.
    The teacher note "Select 2–3 activities" is kept as the plan note.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: career-and-personal-development-class
    title: 'Class: Career & Personal Development'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Career & Personal Development
      - id: skills
        type: cycleOverview
        skills:
          - name: Narrative tenses
            description: Past, present and future to present yourself professionally and tell your career story (*When I started… / Now I… / In the future, I want to…*)
          - name: Second conditional
            description: Imaginary situations now or in the future (*If I had more experience, I would apply for that job.*)
      - id: quizlet-translation
        type: externalLink
        label: 'Career & Personal Development on Quizlet: English - Translation'
        url: https://quizlet.com/br/1125151279/career-personal-development-english-translation-flash-cards/
      - id: quizlet-definition
        type: externalLink
        label: 'Career & Personal Development on Quizlet: English - Definition'
        url: https://quizlet.com/br/1125151357/career-personal-development-english-definitions-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Introduction round
      - id: intro
        type: sentenceFrame
        frame: I am ___. When I was a child, I wanted to be ___, and today I am ___.
        example: I am Dana. When I was a child, I wanted to be a pilot, and today I am an accountant.
      - id: warmup-title
        type: heading
        level: 3
        text: Warm-up questions
      - id: warmup
        type: discussionQuestions
        items:
          - question: What do you usually do at work? (Mention two things.)
            frame: 'When I am at work, I usually ___. I also ___. (*When I am at work, I usually meet my students and have great conversations with them. I also try to keep in touch with other teachers to learn new things.*)'
          - question: 'What is more important for you at work: money or personal interest? Why?'
            frame: For me, ___ is more important because ___.
          - question: Do you like your job or studies? Why or why not?
            frame: I like / don't like my ___ because ___.
          - question: What do you do for yourself outside of work?
            frame: Outside of work, I ___.
          - question: What helps you have a good work-life balance?
            frame: ___ helps me have a good work-life balance because ___.
          - question: What was a difficult situation you had at work or school? How did you solve it?
            frame: Once, I had a problem with ___. I solved it by ___.
          - question: If you could choose any job in the world, what job would you choose and why?
            frame: If I could choose any job, I would be a ___ because ___.
          - question: "If you could have your boss's job, would you want it? Why?"
            frame: "Yes, I would… / No, I wouldn't… because ___."
      - id: activities-title
        type: heading
        level: 3
        text: Activities
      # Activity 1
      - id: act1
        type: classActivity
        title: 'Activity 1: Job interview simulation'
        skills: [Narrative tenses]
        steps:
          - 'In pairs, role-play a short job interview. Choose the field and the position. The more creative, the better! Student 1 is the interviewer, Student 2 is the interviewee.'
          - 'Round 1: the interviewer chooses **one question** from the list below. The interviewee answers. The interviewer may ask **one follow-up question** (optional).'
          - 'Round 2: switch roles, but stay with the same profession. Choose one question, answer, and ask one follow-up question (optional).'
          - In the same pairs, give **one positive comment** to each other about the conversation.
          - As a group, each pair tells the class about the interview experience.
        example: |-
          *I liked that you spoke clearly.*
          *I liked your example.*
          *You used good vocabulary.*
      - id: act1-questions
        type: discussionQuestions
        title: Interview questions (choose one each round)
        items:
          - question: Tell me about your current job or studies.
          - question: Why did you choose this job or field?
          - question: What is one skill you learned in a previous job or course?
          - question: What is one thing you do well at work?
          - question: What would you like to improve in the future?
          - question: What is a trait that you think will help you do this job?
          - question: If I talked to your previous boss, what would they say about you?
      # Activity 2
      - id: act2
        type: classActivity
        title: 'Activity 2: My work inspiration'
        skills: [Narrative tenses]
        steps:
          - Choose something that inspires you to do a better job at work. It can be a quote, an image or a personal experience.
          - 'Prepare your answer in points: What is my inspiration? Why do I like it? How does it help or inspire me?'
          - Present your inspiration (maximum 1.5 minutes). After each presentation, the group asks one follow-up question.
        example: '*A quote that keeps me motivated is "Reach for the moon. If you fall, you will land among the stars."*'
      - id: act2-remember
        type: callout
        tone: tip
        title: Remember
        text: |-
          Keep it simple. Write points, not sentences. Look up words that might be difficult. Think about the tense you want to use.
          **Past:** *When I started… / Before, I…*
          **Present:** *Now I…*
          **Future:** *In the future, I want to…*
      - id: act2-points
        type: discussionQuestions
        title: My inspiration
        items:
          - question: What is my inspiration?
          - question: Why do I like it?
          - question: How does it help or inspire me?
      # Activity 3
      - id: act3
        type: classActivity
        title: 'Activity 3: Ideal job and boss'
        skills: [Second conditional]
        steps:
          - Imagine working in your dream job with your dream boss. Be creative!
          - 'In pairs: tell your partner what your profession would be and why you chose it. Then build hypothetical sentences about your day and your work life in this ideal job. Ideas: salary, work-life balance.'
          - 'Optional: ask your partner questions in the second conditional.'
          - Switch roles.
          - 'Class survey: each student says one hypothetical sentence. Raise your hand if you would do the same.'
        example: |-
          *If I had an ideal boss, they would listen to the team.*
          *had* = past simple (condition) · *would listen* = result
      - id: act3-sentences
        type: discussionQuestions
        title: My ideal job
        items:
          - question: 'My ideal profession: ___'
            frame: If I could choose, I would be a ___ because ___.
          - question: If my job were perfect, I would ___.
          - question: If my boss were more ___, work would be easier.
          - question: If I worked fewer hours, I would ___.
      - id: act3-remember
        type: callout
        tone: tip
        title: Remember
        text: '**If + past simple → would + base verb:** *If I worked fewer hours, I would spend more time with my family.*'
      # Activity 4
      - id: act4
        type: classActivity
        title: 'Activity 4: Speed networking'
        skills: [Narrative tenses]
        steps:
          - 'Build your own self-introduction for networking (2 minutes): name + job or studies, what you usually do, a future goal.'
          - 'First round: in pairs, introduce yourselves. Not too quick and not too short: the round is 4 minutes long. Both students speak.'
          - Switch pairs. If you have time, add an interesting fact about your career.
          - Write in the group chat about your experience. The teacher reads the messages aloud (you can send them anonymously).
        example: |-
          *I'm Ana. I work as a designer. I usually work with small teams. In the future, I want to start my own business.*
          *The most interesting person was ___ because ___.*
      - id: act4-sentences
        type: discussionQuestions
        title: My networking introduction
        items:
          - question: 'Name + job / studies: ___'
            frame: "I'm ___. I work as / I study ___."
          - question: 'What I usually do: ___'
            frame: I usually ___.
          - question: 'My future goal: ___'
            frame: In the future, I want to ___.
          - question: 'After the rounds: ___'
            frame: The most interesting person was ___ because ___.
      # Activity 5
      - id: act5
        type: classActivity
        title: 'Activity 5: Professional life timeline'
        skills: [Narrative tenses]
        steps:
          - Think about your career in the past, now and what you want to do in the future. Make a short professional timeline, not a story about your whole life.
          - Think silently and write short notes only, not full sentences.
          - Share your timeline with the class (2 minutes maximum). After each presentation, the group asks one follow-up question and the student answers briefly.
          - 'Talk as a class: What did some of the presentations have in common? What was easy or hard about talking for 2 minutes? Do our past jobs have an impact on what we want to achieve in the future?'
      - id: act5-notes
        type: discussionQuestions
        title: My timeline (notes)
        items:
          - question: 'Past: my first job / what I wanted to do when I was younger'
          - question: 'Present: my profession today / what I am studying'
          - question: 'Future: career goals / retirement plans'
      # Activity 6
      - id: act6
        type: classActivity
        title: 'Activity 6: Work-life balance debate'
        skills: [Second conditional]
        steps:
          - Read the paragraph below as a class. Have you heard about companies that shortened their work week?
          - "Group A: employees should work 4 days a week. Group B: the work week should be 5 days. In groups, prepare 4–5 strong arguments with the second conditional (*What would happen if…?*) and answers to the other group's arguments."
          - 'Debate! Each group gives one argument at a time: Group A gives an argument, Group B responds; Group B gives an argument, Group A responds.'
        example: '*If we worked four days a week, we would have more time for our families.*'
      - id: act6-text
        type: text
        text: >-
          In recent years, some companies have decided to shorten the work week from five
          days to four, without reducing employees' salaries. Supporters of this model
          argue that a four-day work week can improve work-life balance, reduce stress, and
          even increase productivity, because employees feel more motivated and focused.
          However, critics believe that working fewer days could create pressure to do the
          same amount of work in less time and may not suit all industries. As a result,
          the debate continues about whether a four-day or five-day work week is better for
          both employees and employers.
      - id: act6-arguments
        type: discussionQuestions
        title: Our arguments
        items:
          - question: 'Argument 1: ___'
            frame: If we worked ___ days a week, ___ would ___.
          - question: 'Argument 2: ___'
          - question: 'Argument 3: ___'
          - question: 'Our answer to the other group: ___'
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Select **2–3 activities** according to time and group profile. The activities
          are independent and do not need to be done in one class. **Narrative tenses:**
          Activities 1, 2, 4 and 5. **Second conditional:** Activities 3 and 6 (and the
          last two warm-up questions).
      - id: n-intro
        anchor: intro-title
        text: Maximum 5 minutes.
        minutes: 5
      - id: n-warmup
        anchor: warmup-title
        text: Pick from the 8 questions. Make sure students answer in full sentences.
      - id: n-act1
        anchor: act1
        text: >-
          The notebook links to an "Interactive Interview" page on gamma.app (not on the
          link allow-list). Show it on screen if you want, or use the question list below.
      - id: n-act2
        anchor: act2
        text: >-
          Step 1 (choosing an inspiration) takes no more than 3 minutes. Ask for precise
          answers so each student speaks for a maximum of 1.5 minutes.
        minutes: 3
      - id: n-act3
        anchor: act3
        text: >-
          Before the activity, explain the form: *If + past simple → would + base verb*.
          After the class survey, go over the common mistakes and summarize the activity.
      - id: n-act4
        anchor: act4
        text: The self-introduction takes 2 minutes; each networking round is 4 minutes.
      - id: n-act5
        anchor: act5
        text: Time each student for 2 minutes, no more.
        minutes: 2
      - id: n-act6
        anchor: act6
        text: >-
          You can give an Israeli example of a company that shortened its work week, such
          as Bituach Yashir (from the notebook; please check before class).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: career-and-personal-development-summary
    title: Summary
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: What we learned today
      - id: rules-tenses
        type: ruleSummary
        skill: Narrative tenses
        rules:
          - text: '**Past simple:** finished actions and completed experiences. The action is finished, and the time is not now!'
            examples: [I started working at the bank in 2015.]
          - text: '**Past habits** (*when I was… / I used to…*): situations or habits that were true in the past but are not true now. Talk about how life was before.'
            examples: ['When I was a student, I used to work at a café.']
          - text: '**Present simple:** your job now and your routines. What is true today, and what happens regularly.'
            examples: [I work as a designer. I usually work with small teams.]
          - text: "**Future** (*want to / going to / will*): goals, plans and intentions. Something that hasn't happened yet!"
            examples: ['In the future, I want to start my own business.']
          - text: >-
              **Mixed tenses:** in a networking situation, use mixed tenses to show a
              clear timeline. Start with the **present** (who you are and what you do
              now), move to the **past** (key experiences or achievements), and finish
              with the **future** (goals or next steps). To stay within **2 minutes**,
              choose **one main example**, avoid long details, and connect your ideas
              smoothly.
      - id: rules-second-conditional
        type: ruleSummary
        skill: Second conditional
        rules:
          - text: We use the **second conditional** to talk about imaginary, unreal or unlikely situations now or in the future.
          - text: '**Form:** *If + past simple, would + base verb*. Or result first: *would + base verb + if + past simple* (no comma).'
            examples:
              - If I had more experience, I would apply for that job.
              - Work would be easier if my boss were more organized.
          - text: '**Past simple after *if*:** for an imaginary situation in the present or future, use the past simple after *if* and *would* + base verb in the result.'
            examples:
              - ❌ If I have more time, I would study more.
              - ✅ If I had more time, I would study more.
      - id: past-experiences
        type: callout
        tone: warning
        title: Past experiences
        text: |-
          When you talk about a finished time in the past (for example, *when I was a child*), use the past simple, not the present.
          ❌ *When I was a child, I dream…*
          ✅ *When I was a child, I dreamed…*
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Go through both skills with the group and ask for one new example for each rule.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: career-and-personal-development-homework
    title: Homework with Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Homework with Mori
      - id: how
        type: text
        text: Open the chat with Mori, copy a message and send it. Mori will ask you questions; answer every one.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Message 1: My professional life'
        message: |-
          Hi Mori! Let's talk about my professional life. Ask me questions about my past experiences, my life now, and my future plans.
          Please help me use the correct tense (past, present, future), correct my mistakes, and ask follow-up questions.
      - id: mori-1-tips
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Start your answers clearly (*Now…, In the past…, In the future…*).
          Give **one example**, not a long story.
          Keep the conversation flowing by answering fully.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Message 2: What would you do in the workplace?'
        intro: 'Practise the second conditional with work dilemmas. You and Mori create situations, react to them and question each other. Example: *What would you do if you caught a co-worker stealing?*'
        message: |-
          Hi Mori! Let's play a work dilemma game called "What Would You Do?". Give me difficult or uncomfortable work situations. I will answer using the second conditional (If… would…).
          Then I will create a new dilemma and ask YOU what you would do. Please correct my grammar, ask follow-up questions, and push me to explain my reasons.
      - id: mori-2-tips
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Use **If + past simple**, **would + verb**.
          Explain your **reason**, not just the action.
          Ask Mori **at least one dilemma question**.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Message 3: Career storytelling'
        intro: 'Choose one person (a friend, sibling, partner or parent) and tell Mori about their career: their **past** (how they started), their **present** (what they do now) and their **future** (plans, hopes or possible changes). Optional: tell Mori what you think they should do next, and how their life would be different if they changed careers.'
        message: |-
          Hi Mori! I want to tell you about a relative's or friend's career. I will describe their past, present, and future.
          Please listen, correct my tense use, ask follow-up questions, and help me tell the story more clearly.
      - id: mori-3-tips
        type: callout
        tone: tip
        title: "Don't forget to"
        text: |-
          Keep the story focused on one person.
          Use clear time markers (*before, now, in the future*).
          Answer Mori's questions in complete sentences.
      - id: tips
        type: callout
        tone: tip
        title: Tips
        text: |-
          Want more questions? Send: **Please ask me more!**
          Don't understand an explanation? Send: **Can you explain it to me in Hebrew but with the sentence in English?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: career-and-personal-development-practice
    book: workbook
    title: 'Practice: Career & Personal Development'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Practise the two skills of this cycle on your own. Each answer is checked right away, and you can try again.
      - id: ex-tenses
        type: activity
        activity: career-and-personal-development-tenses
      - id: ex-conditional
        type: activity
        activity: career-and-personal-development-conditional

  # ── vocabulary ───────────────────────────────────────────────────────────
