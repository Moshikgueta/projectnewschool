    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Career words
        glossLang: he
        link: https://quizlet.com/br/1125151279/career-personal-development-english-translation-flash-cards/
        items: &career-and-personal-development-words
          - { term: Career, gloss: קריירה }
