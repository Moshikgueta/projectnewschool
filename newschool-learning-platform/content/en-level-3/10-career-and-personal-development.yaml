          - { term: Work ethic, gloss: מוסר עבודה }
          - { term: Decision, gloss: החלטה }
          - { term: Opportunity, gloss: הזדמנות }
          - { term: Challenge, gloss: אתגר }
          - { term: To improve, gloss: לשפר }
          - { term: To develop, gloss: לפתח }
          - { term: To manage, gloss: לנהל }
          - { term: To communicate, gloss: לתקשר }
          - { term: Teamwork, gloss: עבודת צוות }
          - { term: Feedback, gloss: משוב }
          - { term: Flexible, gloss: גמיש }
          - { term: Motivated, gloss: בעל מוטיבציה }
          - { term: Balance, gloss: איזון }
          - { term: Schedule, gloss: לוח זמנים }
          - { term: To apply, gloss: להגיש מועמדות }
          - { term: Interview, gloss: ראיון }
          - { term: Résumé (CV), gloss: קורות חיים }
