# Cycle "Filme & Fernsehen – Gegenwart & Zukunft", converted from the German
# level 2 digital notebook ("Conversational German - Digital Notebook",
# docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (German).
course: de-konversation-2
slug: filme-und-fernsehen-zukunft
title: 'Filme und Fernsehen: Gegenwart und Zukunft'
goal: Mit werden über Filmpläne und Vorhersagen sprechen und im Präsens Vorlieben und Meinungen sagen.
position: 21
status: published

review:
  - >-
    The two workbook exercises ("Zukunft mit werden" and "Vorlieben und Meinungen")
    are NEW: the notebook has no self-study exercises. They were written from the
    cycle's skills, its summary, the activity examples and its vocabulary. Please
    check level, wording and every right answer before students see them.
  - >-
    Grammar, future: the focus line said "Zukunft – werden / gehen für Pläne und
    Vorhersagen" and the warm-up heading "(Üben Präsens und wird gehen / wird)".
    "gehen" for the future is a calque of English "going to" / Spanish "ir a"; it
    is wrong for German. The rule now says: Futur I = werden (position 2) +
    infinitive at the end, and for plans the Präsens with a time word is also very
    common (Am Freitag sehe ich einen Film). A werden conjugation table was added.
  - >-
    Activity 3: "Mit **Würden** sprechen wir über Dinge, die in der Zukunft
    passieren" → "Mit **werden** …" (würden is Konjunktiv II, not future).
  - >-
    Broken German in the activity goals: "Die Schüler werden benutzt, um über
    konkrete Pläne zu sprechen" ("the students are used") and "Die Schüler werden
    benutzen, um …" → "Die Schüler benutzen werden, um …" (Activities 1, 2, 3).
    Activity 2: "Wir werden sprechen über die Zukunft und über Dinge, die wir
    vermuten" → "Wir sprechen über die Zukunft und über Dinge, die wir vermuten"
    (verb position). Activity 1: "Ich bin mit Freunden." → "Ich bin mit Freunden
    zusammen."; Activity 4: "Im echten Ende stirbt …" → "Im Original stirbt …";
    "Elsa wird Popstar werden" → "Elsa wird ein Popstar werden". "Student 1 liest"
    → "Schüler 1 liest". Quizlet label "Filmen und Fernsehen" → "Filme und
    Fernsehen".
  - >-
    The two skills are "Zukunft mit werden" (Activities 1–4) and "Vorlieben und
    Meinungen" (Präsens, gern, Lieblings-, ich mag …, weil …, ich denke, dass …;
    warm-up and Activity 4). The notebook has no plan; the plan note was added.
    The weil / dass rule (verb at the end) was added to the summary.
  - >-
    The class vote at the end of Activity 4 used emojis that were broken in the
    export (⭐, "ð¤£", "ð¬"); they were removed and the three categories kept as
    words. The recommended German trailers (Alles steht Kopf 2, Coco, Elemental,
    Die Schule der magischen Tiere) have no links in the notebook; they are listed in
    a teacher note. The teacher model "Nächste Woche werde ich Dune 2 im Kino sehen"
    is kept; you may want a newer film.
  - >-
    The Mori homework prompts are written in Hebrew in the notebook ("instructions in
    Hebrew, examples in German"). They were translated into simple German; the
    examples are kept as intros. Please check, or tell us if you prefer the Hebrew
    messages. The tips callout was added from the course pattern.
  - >-
    The grammar summary is in Hebrew in the notebook. The rules are given in simple
    German (ruleSummary) and short corrected Hebrew explanations are kept as Hebrew
    text blocks; the Hebrew translations of the examples are kept as glosses.
  - >-
    Vocabulary: "gern – בשמחה / אוהב" → "בשמחה (ich schaue gern = אני אוהב לצפות)";
    "werden – יהיה / אעשה" → "(פועל עזר לעתיד); להפוך ל־"; "sehen (werden) – לראות
    (בעתיד)" → "ich werde … sehen – אני אראה"; "nächste Woche – שבוע הבא" → "בשבוע
    הבא"; "die Lieblingsserie – הסדרה האהובה" → "הסדרה האהובה עליי" (also
    Lieblingsfilm). Please confirm.
  - >-
    Times: ranges are recorded as the larger number (2–3 → 3, 8–10 → 10, 5–7 → 7).
    Activity totals: Activity 1 = 18, Activity 2 = 20, Activity 3 = 20, Activity 4 =
    22 minutes. The Quizlet link lost its "?new" parameter. The "Antwort von Schüler
    1/2/3" lines are replaced by the optional answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: filme-und-fernsehen-zukunft-unterricht
    title: 'Unterricht: Filme und Fernsehen – Gegenwart und Zukunft'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Filme und Fernsehen: Gegenwart und Zukunft'
      - id: skills
        type: cycleOverview
        skills:
          - name: Zukunft mit werden
            description: '*Am Freitag werde ich einen Film sehen. Der Film wird lustig sein.*'
          - name: Vorlieben und Meinungen
            description: '*Ich schaue gern Serien. Ich mag Komödien, weil sie lustig sind.*'
      - id: quizlet
        type: externalLink
        label: Filme und Fernsehen (Gegenwart und Zukunft) auf Quizlet
        url: https://quizlet.com/br/1132373551/filme-fernsehen-gegenwart-zukunft-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Vorstellungsrunde
      - id: intro
        type: sentenceFrame
        frame: Ich bin ___. Meine Lieblingsserie / Mein Lieblingsfilm ist ___. Nächste Woche werde ich ___ sehen.
        example: Hallo, ich bin Marta. Meine Lieblingsserie ist „The Crown“. Nächste Woche werde ich „Dune 2“ im Kino sehen.
      - id: warmup-title
        type: heading
        level: 3
        text: Aufwärmfragen
      - id: warmup
        type: discussionQuestions
        items:
          - question: Welche Filme schaust du normalerweise?
            frame: Normalerweise schaue ich ___.
          - question: Welche Serie magst du jetzt?
            frame: Jetzt mag ich ___.
          - question: Welchen Film wirst du diese Woche sehen?
            frame: Diese Woche werde ich ___ sehen.
          - question: Gehst du bald ins Kino? Welchen Film wirst du sehen?
            frame: Ja, ich gehe bald ins Kino. Ich werde ___ sehen.
          - question: Mit wem wirst du deinen nächsten Film schauen?
            frame: Ich werde meinen nächsten Film mit ___ schauen.
          - question: Welche Snacks wirst du beim nächsten Filmabend essen?
            frame: Beim nächsten Filmabend werde ich ___ essen.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Plane deinen perfekten Filmabend'
        skills: [Zukunft mit werden]
        minutes: 18
        steps:
          - 'Antworte: Wie sieht dein perfekter Filmabend aus?'
          - 'Arbeitet in kleinen Gruppen (2–3 Personen). Plant **einen perfekten Filmabend**: Was werdet ihr sehen? Wo und wann wird der Filmabend sein? Wer wird dabei sein? Was werdet ihr essen und trinken?'
          - Schreibt 3–4 kurze Sätze mit **werden**.
          - Präsentiert euren Filmabend mit 2–3 Sätzen.
        example: |-
          *Am Freitag werden wir „Harry Potter“ sehen.*
          *Wir werden bei Freunden zu Hause sein.*
          *Wir werden Pizza essen und Cola trinken.*
      - id: act1-sentences
        type: discussionQuestions
        title: Unser Filmabend
        items:
          - question: Am ___ werden wir ___ sehen.
          - question: Wir werden ___ sein.
          - question: ___ wird dabei sein.
          - question: Wir werden ___ essen und ___ trinken.
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Trailer-Vorhersagen'
        skills: [Zukunft mit werden]
        minutes: 20
        steps:
          - Wir sehen einen Trailer auf Deutsch. Du musst nicht alles verstehen. Schau einfach zu und achte auf die Bilder.
          - Beantworte die Fragen in ganzen Sätzen mit **werden**.
          - Schreib **3 kurze Sätze** über die Zukunft des Films.
          - Lies **einen Satz** der Gruppe vor.
        example: |-
          *Der Film wird von einem Kind handeln.*
          *Die Hauptfigur wird einen neuen Freund finden.*
          *Am Ende wird alles gut sein.*
      - id: act2-questions
        type: discussionQuestions
        title: Was wird passieren?
        items:
          - question: Worum wird es in dem Film gehen?
            frame: Der Film wird von ___ handeln.
          - question: Was wird mit der Hauptfigur passieren?
            frame: Die Hauptfigur wird ___.
          - question: Wird der Film lustig oder traurig sein?
            frame: Der Film wird ___ sein.
          - question: Wie wird der Film enden?
            frame: Am Ende wird ___.
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Erfinde einen neuen Film'
        skills: [Zukunft mit werden]
        minutes: 20
        steps:
          - Ihr erfindet jetzt euren eigenen Film. Er existiert noch nicht. Ihr plant ihn für die Zukunft.
          - 'Arbeitet in Gruppen (2–3 Personen). Wie heißt euer Film? Welches Genre wird es sein (Komödie, Drama, Abenteuer, Animation …)? Wer wird die Hauptfigur sein? Was wird in der Geschichte passieren? Wie wird der Film enden?'
          - Schreibt 4–5 kurze Sätze mit **werden**.
          - Präsentiert euren Film in 30–45 Sekunden. Die Gruppe kann danach eine Frage stellen, z. B. *Wird der Film lustig sein? Wird die Hauptfigur allein sein?*
        example: |-
          *Unser Film heißt „Der fliegende Hund“.*
          *Es wird ein Abenteuerfilm sein.*
          *Die Hauptfigur wird ein Kind sein.*
          *Der Hund wird sprechen und dem Kind helfen.*
          *Am Ende wird die Familie wieder zusammen sein.*
      - id: act3-sentences
        type: discussionQuestions
        title: Unser Film
        items:
          - question: Unser Film heißt „___“.
          - question: Es wird ein ___film sein.
          - question: Die Hauptfigur wird ___.
          - question: In der Geschichte wird ___ passieren.
          - question: Am Ende wird ___.
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Ein neues Ende erfinden'
        skills: [Zukunft mit werden, Vorlieben und Meinungen]
        minutes: 22
        steps:
          - 'Wählt in Gruppen (2–3 Personen) einen Film oder eine Serie, die ihr alle kennt: *Titanic, Harry Potter, Die Eiskönigin, Coco, Toy Story, Der König der Löwen*.'
          - Schreibt **einen** sehr kurzen Satz im Präsens über das echte Ende. Nicht die ganze Geschichte erzählen!
          - Erfindet ein **neues Ende mit werden**.
          - Präsentiert das echte Ende und euer neues Ende in 30–45 Sekunden.
          - 'Die Gruppe wählt: das kreativste Ende, das lustigste Ende, das beste Filmende.'
        example: |-
          *Im Original von Titanic stirbt Jack. / Am Ende von Coco kehrt Miguel zu seiner Familie zurück.*
          *In unserer Version wird Jack überleben. Dann wird er mit Rose nach Italien gehen. Am Ende werden sie zusammen glücklich sein.*
          *In unserer Version wird Elsa ein Popstar werden. Anna wird ihre Managerin sein. Am Ende werden sie auf Welttournee gehen.*
      - id: act4-sentences
        type: discussionQuestions
        title: Echtes Ende und neues Ende
        items:
          - question: Im Original ___.
          - question: In unserer Version wird ___.
          - question: Dann wird ___.
          - question: Am Ende wird ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: **Zukunft mit werden** (Aktivitäten 1–4)
          und **Vorlieben und Meinungen** im Präsens (Vorstellungsrunde, Aufwärmfragen,
          Aktivität 4). Die Aktivitäten zusammen sind länger als eine Stunde: Wähl zwei
          oder drei davon.
      - id: n-intro
        anchor: intro
        text: Gib zuerst dein Beispiel, dann ist jeder Schüler dran.
      - id: n-warmup
        anchor: warmup
        text: Die Fragen üben das Präsens und die Zukunft mit *werden*. Stell jedem Schüler mindestens zwei Fragen.
      - id: n-act1
        anchor: act1
        text: >-
          Einstimmung (3 Minuten): Schreib kurze Beispiele im Präsens an die Tafel
          (*Ich sehe einen Film. Ich bin mit Freunden zusammen. Ich esse Popcorn.*).
          Erkläre: „Jetzt sprechen wir über die Zukunft. Dafür benutzen wir
          **werden**.“ Modell: *Am Freitag werde ich einen Film sehen. Ich werde mit
          Freunden zusammen sein. Wir werden Popcorn essen.* Gruppenarbeit: 10
          Minuten; hilf bei den Formen von *werden* und beim Wortschatz (Film, Freunde,
          Snacks, zu Hause, Kino). Präsentation: 5 Minuten.
      - id: n-act2
        anchor: act2
        text: >-
          Wähl **einen** kurzen deutschen Trailer (60–90 Sekunden), z. B. „Alles steht
          Kopf 2“, „Coco“, „Elemental“ oder „Die Schule der magischen Tiere“ (auf
          YouTube; das Heft nennt keine Links). Vorbereitung 2 Minuten: Schreib an die
          Tafel *Der Film wird … / Die Hauptfigur wird … / Am Ende wird …* und erkläre:
          „Wir sprechen über die Zukunft und über Dinge, die wir vermuten.“ Trailer: 3
          Minuten (erste Runde nur schauen, ohne Notizen; optional eine zweite Runde).
          Geführte Vorhersagen: 5 Minuten; schreib 1–2 gute Beispiele an die Tafel.
          Schreiben: 5 Minuten. Teilen: 5 Minuten.
      - id: n-act3
        anchor: act3
        text: >-
          Vorbereitung 3 Minuten: Schreib die Satzmodelle an die Tafel und erkläre: „Mit
          **werden** sprechen wir über Dinge, die in der Zukunft passieren.“
          Gruppenarbeit: 10 Minuten; hilf bei *werden*, beim Wortschatz und bei kurzen,
          klaren Sätzen. Präsentation: 7 Minuten.
      - id: n-act4
        anchor: act4
        text: >-
          Film wählen: 2 Minuten. Echtes Ende: 3 Minuten (nur ein Satz!). Neues Ende: 10
          Minuten. Präsentation: 7 Minuten, mit Abstimmung am Ende.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: filme-und-fernsehen-zukunft-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: rules-werden
        type: ruleSummary
        skill: Zukunft mit werden
        rules:
          - text: 'Mit **werden** sprechen wir über Pläne, Ideen und Vermutungen für die Zukunft: über Dinge, die noch nicht passiert sind.'
          - text: '*werden* steht an **Position 2**, der **Infinitiv** steht **am Ende**.'
            examples:
              [
                Ich werde am Freitag einen Film sehen.,
                Wir werden Pizza essen.,
                Der Film wird lustig sein.,
              ]
          - text: 'In Fragen ohne Fragewort steht *werden* am Anfang.'
            examples: [Wird der Film lustig sein?, Wird die Hauptfigur allein sein?]
          - text: 'Für Pläne benutzen wir auch oft das **Präsens** mit einer Zeitangabe (*morgen, am Freitag, nächste Woche*).'
            examples: [Am Freitag sehe ich einen Film., Nächste Woche gehe ich ins Kino.]
      - id: werden-table
        type: table
        caption: werden
        header: [Person, werden, Beispiel]
        rows:
          - [ich, werde, Ich werde einen Film sehen.]
          - [du, wirst, Wirst du ins Kino gehen?]
          - [er / sie / es, wird, Der Film wird spannend sein.]
          - [wir, werden, Wir werden Popcorn essen.]
          - [ihr, werdet, Was werdet ihr sehen?]
          - [sie / Sie, werden, Sie werden zusammen glücklich sein.]
      - id: werden-he
        type: text
        lang: he
        text: >-
          עתיד עם werden: משתמשים בו כשמדברים על משהו שעוד לא קרה – תוכנית, רעיון, ניחוש.
          המבנה: נושא + werden (במקום השני) + פועל בשם הפועל בסוף המשפט: Ich werde am
          Freitag einen Film sehen. לתוכניות אפשר גם להשתמש בהווה עם מילת זמן: Am Freitag
          sehe ich einen Film.
      - id: werden-examples
        type: examples
        items:
          - { text: Ich werde am Freitag einen Film sehen., gloss: אני אצפה בסרט ביום שישי }
          - { text: Wir werden Pizza essen., gloss: אנחנו נאכל פיצה }
          - { text: Der Film wird lustig sein., gloss: הסרט יהיה מצחיק }
          - {
              text: Nächste Woche werde ich einen Film im Kino sehen.,
              gloss: בשבוע הבא אראה סרט בקולנוע,
            }
      - id: rules-meinung
        type: ruleSummary
        skill: Vorlieben und Meinungen
        rules:
          - text: '**Präsens**: für Gewohnheiten, Vorlieben und Dinge, die normalerweise passieren. Mit **gern** sagen wir, was wir gern machen.'
            examples:
              [
                Ich schaue gern Filme.,
                Meine Lieblingsserie ist „Friends“.,
                Ich sehe Filme zu Hause.,
              ]
          - text: 'Fragen im Präsens: das Verb steht nach dem Fragewort.'
            examples: [Welche Filme schaust du gern?, Was ist deine Lieblingsserie?]
          - text: 'Meinungen: *Ich mag …*, *Ich denke, dass …*, *…, weil …*. Nach **dass** und **weil** steht das Verb **am Ende**.'
            examples:
              [
                Ich mag Komödien.,
                'Ich denke, dass der Film gut ist.',
                'Ich werde ihn sehen, weil er spannend ist.',
              ]
          - text: 'Gegenwart und Zukunft zusammen: was ich jetzt mag → was ich bald mache.'
            examples: [Jetzt schaue ich Serien., Nächste Woche werde ich einen Film im Kino sehen.]
      - id: meinung-he
        type: text
        lang: he
        text: >-
          הווה (Präsens) – להרגלים, להעדפות ולדברים שקורים בדרך כלל. עם gern אומרים מה
          אוהבים לעשות: Ich schaue gern Filme (אני אוהב לצפות בסרטים). להבעת דעה: Ich mag …
          (אני אוהב …), Ich denke, dass … (אני חושב ש…), … weil … (כי …). אחרי dass ו־weil
          הפועל עובר לסוף המשפט.
      - id: meinung-examples
        type: examples
        items:
          - { text: Ich schaue gern Filme., gloss: אני אוהב לצפות בסרטים }
          - { text: Meine Lieblingsserie ist „Friends“., gloss: הסדרה האהובה עליי היא Friends }
          - { text: Ich sehe Filme zu Hause., gloss: אני צופה בסרטים בבית }
          - { text: Ich mag …, gloss: אני אוהב … }
          - { text: 'Ich denke, dass …', gloss: אני חושב ש… }
          - { text: 'Ich werde ihn sehen, weil …', gloss: אצפה בו כי … }
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die zwei Fertigkeiten mit der Gruppe und bitte um ein neues Beispiel für jede Regel.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: filme-und-fernsehen-zukunft-hausaufgaben
    title: Hausaufgaben mit Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben mit Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere eine Nachricht und schick sie ab. Mori stellt dir Fragen; beantworte alle.
      - id: mori-1
        type: aiTutorPrompt
        title: '1: Was ich jetzt mag'
        intro: 'Beispiel für deine Antwort: *Ich schaue gern Filme. Meine Lieblingsserie ist „Friends“. Ich sehe Filme zu Hause.*'
        message: |-
          Hallo Mori! Bitte frag mich nach Filmen und Serien, die ich heute mag.
          Ich möchte im Präsens antworten.
          Bitte korrigiere mich sofort.
      - id: mori-2
        type: aiTutorPrompt
        title: '2: Pläne für die Zukunft'
        intro: 'Beispiel: *Diese Woche werde ich einen Film im Kino sehen. Ich werde ihn mit Freunden anschauen.*'
        message: |-
          Hallo Mori! Bitte frag mich, welchen Film oder welche Serie ich in der nächsten Woche sehen werde.
          Ich möchte mit „werden“ antworten.
          Bitte korrigiere jeden Fehler.
      - id: mori-3
        type: aiTutorPrompt
        title: '3: Ein perfekter Filmabend'
        intro: 'Beispiel: *Am Freitag werde ich einen Film sehen. Wir werden Pizza essen. Wir werden bei mir zu Hause sein.*'
        message: |-
          Hallo Mori! Ich möchte einen perfekten Filmabend planen. Bitte stell mir Fragen dazu.
          Ich möchte mit Sätzen in der Zukunft mit „werden“ antworten.
          Bitte korrigiere jeden Fehler.
      - id: mori-4
        type: aiTutorPrompt
        title: '4: Was wird im Film passieren?'
        intro: 'Beispiel: *Der Film wird lustig sein. Die Hauptfigur wird ein Problem haben. Am Ende wird alles gut sein.*'
        message: |-
          Hallo Mori! Bitte nenn mir einen bekannten Film und frag mich, was in dem Film passieren wird.
          Ich möchte mit „werden“ antworten.
          Bitte korrigiere jeden Fehler.
      - id: mori-5
        type: aiTutorPrompt
        title: '5: Eine kurze Geschichte – jetzt und in der Zukunft'
        intro: 'Beispiel: *Jetzt schaue ich Serien. Ich mag Komödien. Nächste Woche werde ich einen Film im Kino sehen. Ich werde ihn mit meiner Freundin anschauen. Der Film wird spannend sein.*'
        message: |-
          Hallo Mori! Ich möchte dir 4–5 Sätze über Filme erzählen: was ich jetzt mag und was ich in der Zukunft machen werde.
          Ich benutze das Präsens und die Zukunft mit „werden“.
          Bitte korrigiere mich freundlich, stell mir Fragen, die mir helfen, und schlag mir dann eine bessere, klarere Version auf Deutsch vor.
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**

