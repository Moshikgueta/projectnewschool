vocabulary:
  - slug: filme-und-fernsehen-zukunft
    title: 'Filme und Fernsehen: Gegenwart und Zukunft'
    items: *filme-und-fernsehen-zukunft-words

activities:
  - slug: filme-und-fernsehen-zukunft-werden
    title: 'Zukunft mit werden: Ich werde einen Film sehen.'
    minutes: 8
    items:
      - id: werde
        type: multipleChoice
        prompt: Am Freitag ___ ich einen Film sehen.
        options:
          - { text: werde, correct: true }
          - {
              text: wird,
              feedback: '*wird* passt zu *er / sie / es*. Mit *ich* sagen wir *werde*.',
            }
          - {
              text: werden,
              feedback: '*werden* passt zu *wir / sie*. Mit *ich* sagen wir *werde*.',
            }
      - id: wir-werden
        type: fillBlank
        prompt: Ergänze *werden*.
        text: Wir ___ Pizza essen.
        blanks: [[werden]]
      - id: film-wird
        type: fillBlank
        prompt: Ergänze *werden*.
        text: Der Film ___ lustig sein.
        blanks: [[wird]]
      - id: konjugation
        type: matching
        prompt: Welche Form von *werden* passt?
        pairs:
          - [ich, werde]
          - [du, wirst]
          - [er / sie / es, wird]
          - [wir, werden]
          - [ihr, werdet]
      - id: infinitiv-ende
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Ich werde am Freitag einen Film sehen., correct: true }
          - {
              text: Ich werde sehen am Freitag einen Film.,
              feedback: 'Der Infinitiv (*sehen*) steht am Ende: *Ich werde am Freitag einen Film sehen.*',
            }
          - {
              text: Ich sehen werde am Freitag einen Film.,
              feedback: '*werden* steht an Position 2, der Infinitiv am Ende: *Ich werde … sehen.*',
            }
      - id: praesens-zukunft
        type: trueFalse
        prompt: 'Der Satz *Am Freitag sehe ich einen Film.* kann auch über die Zukunft sprechen.'
        answer: true
        feedback:
          correct: Richtig! Präsens + Zeitangabe (*am Freitag*) kann über die Zukunft sprechen.
          incorrect: 'Doch: Mit einer Zeitangabe wie *am Freitag* spricht auch das Präsens über die Zukunft.'
      - id: wird-finden
        type: fillBlank
        prompt: Ergänze den Infinitiv von *finden*.
        text: Die Hauptfigur wird einen neuen Freund ___.
        blanks: [[finden]]
      - id: ordne-kino
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Nächste Woche werde ich ins Kino gehen.

  - slug: filme-und-fernsehen-zukunft-meinung
    title: 'Vorlieben und Meinungen: Ich schaue gern …, weil …'
    minutes: 8
    items:
      - id: schaue-gern
        type: multipleChoice
        prompt: Ich ___ gern Filme.
        options:
          - { text: schaue, correct: true }
          - { text: schaust, feedback: '*schaust* passt zu *du*. Mit *ich* sagen wir *schaue*.' }
          - {
              text: schauen,
              feedback: '*schauen* passt zu *wir / sie*. Mit *ich* sagen wir *schaue*.',
            }
      - id: lieblingsserie
        type: fillBlank
        prompt: Ergänze das Wort (Lieblings- + Serie).
        text: Meine ___ ist „Friends“.
        blanks: [[Lieblingsserie]]
      - id: schaust-du
        type: multipleChoice
        prompt: Welche Filme ___ du gern?
        options:
          - { text: schaust, correct: true }
          - { text: schaue, feedback: '*schaue* passt zu *ich*. Mit *du* sagen wir *schaust*.' }
          - {
              text: schaut,
              feedback: '*schaut* passt zu *er / sie / es* oder *ihr*. Mit *du* sagen wir *schaust*.',
            }
      - id: weil-ende
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: 'Ich werde den Film sehen, weil er spannend ist.', correct: true }
          - {
              text: 'Ich werde den Film sehen, weil er ist spannend.',
              feedback: 'Nach *weil* steht das Verb am Ende: *…, weil er spannend ist.*',
            }
          - {
              text: 'Ich werde den Film sehen, weil ist er spannend.',
              feedback: 'Nach *weil* steht das Verb am Ende: *…, weil er spannend ist.*',
            }
      - id: dass-tf
        type: trueFalse
        prompt: 'Nach *dass* steht das Verb am Ende: *Ich denke, dass der Film gut ist.*'
        answer: true
        feedback:
          correct: Richtig! Wie bei *weil* geht das Verb nach *dass* ans Ende.
          incorrect: 'Doch: Nach *dass* steht das Verb am Ende: *…, dass der Film gut ist.*'
      - id: dass-ist
        type: fillBlank
        prompt: Ergänze *sein* im Präsens.
        text: Ich denke, dass der Film lustig ___.
        blanks: [[ist]]
      - id: satzteile
        type: matching
        prompt: Was passt zusammen?
        pairs:
          - ['Ich mag Komödien,', weil sie lustig sind.]
          - ['Ich denke,', dass der Film gut ist.]
          - [Meine Lieblingsserie, ist „Friends“.]
          - [Welche Filme, schaust du gern?]
      - id: ordne-lieblingsserie
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Meine Lieblingsserie ist Friends.
