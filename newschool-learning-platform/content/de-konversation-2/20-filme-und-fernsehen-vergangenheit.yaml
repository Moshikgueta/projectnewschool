vocabulary:
  - slug: filme-und-fernsehen-vergangenheit
    title: 'Filme und Fernsehen: Gegenwart und Vergangenheit'
    items: *filme-und-fernsehen-vergangenheit-words

activities:
  - slug: filme-und-fernsehen-vergangenheit-zeiten
    title: 'Früher und heute: habe gesehen, war, mochte'
    minutes: 8
    items:
      - id: habe-gesehen
        type: multipleChoice
        prompt: Gestern ___ ich einen Film gesehen.
        options:
          - { text: habe, correct: true }
          - { text: bin, feedback: '*sehen* bildet das Perfekt mit *haben*: *Ich habe … gesehen.*' }
          - { text: war, feedback: 'Das Perfekt ist *haben* + Partizip II: *Ich habe … gesehen.*' }
      - id: war-im-kino
        type: multipleChoice
        prompt: Letzte Woche ___ ich im Kino.
        options:
          - { text: war, correct: true }
          - {
              text: habe,
              feedback: 'Bei *sein* sagen wir in der Vergangenheit meistens *war*: *Ich war im Kino.*',
            }
          - {
              text: bin,
              feedback: '*bin* ist Präsens. *Letzte Woche* ist Vergangenheit: *Ich war im Kino.*',
            }
      - id: gesehen
        type: fillBlank
        prompt: Ergänze das Partizip II von *sehen*.
        text: Ich habe den Film zu Hause mit meiner Schwester ___.
        blanks: [[gesehen]]
      - id: partizip
        type: matching
        prompt: Welches Partizip II passt?
        pairs:
          - [sehen, gesehen]
          - [schauen, geschaut]
          - [lieben, geliebt]
          - [weinen, geweint]
          - [mögen, gemocht]
      - id: frueher-jetzt-tf
        type: trueFalse
        prompt: 'Im Satz *Früher mochte ich Cartoons, jetzt schaue ich Serien.* zeigt *früher* die Vergangenheit und *jetzt* die Gegenwart.'
        answer: true
        feedback:
          correct: Richtig! *früher* + Vergangenheit, *jetzt* + Präsens.
          incorrect: '*früher* = in der Vergangenheit (*mochte*), *jetzt* = heute (*schaue*).'
      - id: frueher-jetzt
        type: fillBlank
        prompt: Ergänze *sehen* (Perfekt) und *schauen* (Präsens).
        text: Früher habe ich Zeichentrickfilme ___. Jetzt ___ ich Serien.
        blanks: [[gesehen], [schaue]]
        wordBank: [gesehen, schaue, geschaut, schaut]
      - id: keinen-film
        type: multipleChoice
        prompt: Ich habe gestern ___ Film gesehen. (Verneinung)
        options:
          - { text: keinen, correct: true }
          - {
              text: nicht,
              feedback: 'Vor einem Nomen ohne Artikel verneinen wir mit *kein*: *keinen Film*.',
            }
          - {
              text: kein,
              feedback: '*der Film* steht hier im Akkusativ: *einen Film* → *keinen Film*.',
            }
      - id: ordne-gestern
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Ich habe gestern einen Film gesehen.

  - slug: filme-und-fernsehen-vergangenheit-weil
    title: 'Meinungen mit weil: …, weil er lustig war.'
    minutes: 8
    items:
      - id: weil-verb-ende
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: 'Ich mag diese Serie, weil sie spannend ist.', correct: true }
          - {
              text: 'Ich mag diese Serie, weil sie ist spannend.',
              feedback: 'Nach *weil* steht das Verb am Ende: *…, weil sie spannend ist.*',
            }
          - {
              text: 'Ich mag diese Serie, weil ist sie spannend.',
              feedback: 'Nach *weil* steht das Verb am Ende: *…, weil sie spannend ist.*',
            }
      - id: weil-tf
        type: trueFalse
        prompt: Nach *weil* steht das Verb am Ende.
        answer: true
        feedback:
          correct: 'Richtig! *…, weil er lustig war.*'
          incorrect: 'Doch: Nach *weil* geht das Verb ans Ende: *…, weil er lustig war.*'
      - id: langweilig-war
        type: fillBlank
        prompt: Ergänze *sein* in der Vergangenheit.
        text: Ich mochte die Serie nicht, weil sie langweilig ___.
        blanks: [[war]]
      - id: hat-gefallen
        type: multipleChoice
        prompt: Mir ___ der Film gefallen.
        options:
          - { text: hat, correct: true }
          - {
              text: ist,
              feedback: '*gefallen* bildet das Perfekt mit *haben*: *Mir hat der Film gefallen.*',
            }
          - {
              text: habe,
              feedback: 'Das Subjekt ist *der Film* (er), nicht *ich*: *Mir hat der Film gefallen.*',
            }
      - id: adjektive
        type: matching
        prompt: Was passt zusammen?
        pairs:
          - [lustig, Man lacht viel.]
          - [spannend, 'Man will wissen, wie es weitergeht.']
          - [langweilig, Nichts passiert.]
          - [traurig, Man weint.]
          - [interessant, Man lernt etwas Neues.]
      - id: geschichte-war
        type: fillBlank
        prompt: Ergänze *sein* in der Vergangenheit.
        text: Der Film war gut, weil die Geschichte interessant ___.
        blanks: [[war]]
      - id: weil-dass
        type: multipleChoice
        prompt: Der Film hat mir nicht gefallen, ___ er langweilig war.
        options:
          - { text: weil, correct: true }
          - { text: dass, feedback: 'Wir sagen einen Grund (warum?): dafür benutzen wir *weil*.' }
          - { text: warum, feedback: 'Mit *warum* fragen wir. Die Antwort beginnt mit *weil*.' }
      - id: ordne-weil
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Ich mag diese Serie, weil sie spannend ist.
