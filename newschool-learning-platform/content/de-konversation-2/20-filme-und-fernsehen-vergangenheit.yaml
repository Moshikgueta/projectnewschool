# Cycle "Filme & Fernsehen – Gegenwart und Vergangenheit", converted from the
# German level 2 digital notebook ("Conversational German - Digital Notebook",
# docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (German).
course: de-konversation-2
slug: filme-und-fernsehen-vergangenheit
title: 'Filme und Fernsehen: Gegenwart und Vergangenheit'
goal: Über Filme und Serien früher und heute sprechen und eine Meinung mit weil begründen.
position: 20
status: in_review

review:
  - >-
    The two workbook exercises ("Früher und heute" and "Meinungen mit weil") are NEW:
    the notebook has no self-study exercises. They were written from the cycle's
    skills, its summary, the activity examples and its vocabulary. Please check level,
    wording and every right answer before students see them.
  - >-
    The notebook lists five grammar points (Präsens, Perfekt, früher + Perfekt,
    Meinungen mit weil, optional Vergleiche). They are grouped as two skills: "Früher
    und heute" (Präsens, Perfekt, früher / jetzt) and "Meinungen mit weil". The
    optional comparisons appear only in the vocabulary (besser als, der beste) and
    in Activity 3 (der beste Film). The notebook has no plan saying which activity
    goes with which skill; the plan note was added.
  - >-
    Grammar: the summary called "Ich war im Kino" and "Früher mochte ich
    Horrorfilme" Perfekt; they are Präteritum. A rule was added: with sein, haben
    and mögen we usually say war, hatte, mochte. The weil rule now says that the
    verb goes to the end ("…, weil er lustig war"), which the notebook does not say.
  - >-
    The models of Activity 2 (Friends) and Activity 4 (Titanic) were in the
    Präteritum ("Rachel kam ins Café. Sie weinte."; "Im Original sank das Schiff und
    Jack starb."; "Im Original geschah …"). The cycle practises the Perfekt, so they
    were rewritten in the Perfekt ("Rachel ist ins Café gekommen. Sie hat geweint."
    "Im Original ist das Schiff gesunken und Jack ist gestorben." "Im Original ist
    … passiert."). The Präteritum is also correct in a written story; please choose.
    "Sie sagte, dass sie nicht heiraten will" → "Sie hat gesagt, dass sie nicht
    heiraten wollte". Please also check that "Sie hat geweint" matches the scene you
    show (in the pilot episode Rachel arrives wet and upset).
  - >-
    Other corrections: "Welcher war dein erster Kinofilm?" → "Was war dein erster
    Kinofilm?"; "Die Geschichte war über das Erwachsenwerden" → "In der Geschichte
    ging es um das Erwachsenwerden" (Activity 1 model; "über" is a calque of English
    "about"); the heading "Vorbereitungsfragen" → "Aufwärmfragen" (course pattern).
    The intro follow-up questions are now a teacher note.
  - >-
    Activity 2 needs a Friends clip (Rachel arrives at Central Perk in her wedding
    dress, season 1, episode 1). The notebook gives no link; the teacher note asks
    the teacher to prepare it.
  - >-
    The Mori homework prompts are written in Hebrew in the notebook ("instructions in
    Hebrew, examples in German"). They were translated into simple German; the
    examples are kept as intros. Please check, or tell us if you prefer the Hebrew
    messages. The tips callout was added from the course pattern.
  - >-
    The grammar summary is in Hebrew in the notebook. The rules are given in simple
    German (ruleSummary) and short corrected Hebrew explanations are kept as Hebrew
    text blocks; the Hebrew translations of the examples are kept as glosses.
  - >-
    Vocabulary: "gefallen – למצוא חן בעיניי" → "למצוא חן (בעיני מישהו)"; "das
    Lieblings- – אהוב עליי" → "Lieblings- (der Lieblingsfilm)" (it is a prefix, not a
    neuter noun); "erinnern – לזכור" → "sich erinnern (an) – לזכור"; "letztes Mal" →
    "das letzte Mal". Please confirm.
  - >-
    Times: ranges are recorded as the larger number (8–10 → 10, 45–60 seconds).
    Activity totals: Activity 1 = 22, Activity 3 = 12 minutes; Activities 2 and 4
    have no time. The Quizlet link lost its "?new" parameter. The "Schüler 1/2/3"
    answer lines are replaced by the optional answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: filme-und-fernsehen-vergangenheit-unterricht
    title: 'Unterricht: Filme und Fernsehen – Gegenwart und Vergangenheit'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Filme und Fernsehen: Gegenwart und Vergangenheit'
      - id: skills
        type: cycleOverview
        skills:
          - name: Früher und heute
            description: 'Perfekt (*Ich habe gestern einen Film gesehen.*), *früher / jetzt* und Präsens'
          - name: Meinungen mit weil
            description: '*Mir hat der Film gefallen, weil er lustig war.*'
      - id: quizlet
        type: externalLink
        label: Filme und Fernsehen (Gegenwart und Vergangenheit) auf Quizlet
        url: https://quizlet.com/br/1132370505/filme-fernsehen-gegenwart-und-vergangenheit-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Vorstellungsrunde
      - id: intro
        type: sentenceFrame
        frame: Ich bin ___. Als Kind war mein Lieblingsfilm ___. Jetzt ist meine Lieblingsserie ___.
        example: Ich bin Marta. Als Kind war mein Lieblingsfilm „Der König der Löwen“. Jetzt ist meine Lieblingsserie „The Crown“.
      - id: warmup-title
        type: heading
        level: 3
        text: Aufwärmfragen
      - id: warmup
        type: discussionQuestions
        items:
          - question: Welchen Film hast du als Kind oft gesehen?
            frame: Als Kind habe ich oft ___ gesehen.
          - question: Was war dein erster Kinofilm?
            frame: Mein erster Kinofilm war ___.
          - question: Welche Serie hast du zuletzt gesehen?
            frame: Zuletzt habe ich ___ gesehen.
          - question: Mit wem hast du sie gesehen?
            frame: Ich habe sie mit ___ gesehen. / Ich habe sie allein gesehen.
          - question: Warst du letzten Monat im Kino? Was hast du gesehen?
            frame: Ja, ich war im Kino. Ich habe ___ gesehen. / Nein, ich war nicht im Kino.
          - question: Welche Serie hast du als Teenager geliebt?
            frame: Als Teenager habe ich ___ geliebt.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Mein letzter Film / Meine letzte Serie'
        skills: [Früher und heute, Meinungen mit weil]
        minutes: 22
        steps:
          - 'Schreib **5 kurze Sätze** über deinen letzten Film oder deine letzte Serie. Leitfragen: Was hast du gesehen? Wo hast du es gesehen? Mit wem? Worum ging es? Hat es dir gefallen? Warum?'
          - 'Paarinterview: Frag deinen Partner / deine Partnerin: *Was war deine Lieblingsszene? Wer war deine Lieblingsfigur? Hat es so geendet, wie du gedacht hast?*'
          - Erzähl der Gruppe von dem Film deines Partners / deiner Partnerin.
        example: |-
          *Der letzte Film, den ich gesehen habe, war „Alles steht Kopf 2“.*
          *Ich habe ihn zu Hause mit meiner Schwester gesehen.*
          *Er war lustig und emotional.*
          *In der Geschichte ging es um das Erwachsenwerden.*
          *Mir hat er gefallen, weil er berührend war.*
          *Mein Partner hat „Barbie“ gesehen. Er hat ihn mit Freunden gesehen. Ihm hat der Film gefallen, weil er lustig war.*
      - id: act1-sentences
        type: discussionQuestions
        title: Mein letzter Film
        items:
          - question: Der letzte Film, den ich gesehen habe, war ___.
          - question: Ich habe ihn ___ mit ___ gesehen.
          - question: Er war ___.
          - question: In der Geschichte ging es um ___.
          - question: Mir hat er (nicht) gefallen, weil ___.
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Eine Szene aus „Friends“'
        skills: [Früher und heute, Meinungen mit weil]
        steps:
          - 'Hör zu: Rachel kommt im Brautkleid ins Café. Achte auf die Reaktionen.'
          - Sieh die Szene zweimal. Beim ersten Mal nur schauen, beim zweiten Mal auf die Handlung achten.
          - 'Erzähl nach: Was ist passiert? Benutze das Perfekt.'
          - Sag deine Meinung über die Szene.
        example: |-
          *Zuerst ist Rachel ins Café gekommen. Dann hat sie geweint.*
          *Danach war die Gruppe überrascht.*
          *Am Ende hat sie gesagt, dass sie nicht heiraten wollte.*
      - id: act2-retell
        type: discussionQuestions
        title: Was ist passiert?
        items:
          - question: Zuerst ___.
          - question: Dann ___.
          - question: Danach ___.
          - question: Am Ende ___.
      - id: act2-opinion
        type: discussionQuestions
        title: Meine Meinung
        items:
          - question: Ich glaube, die Szene war ___, weil ___.
          - question: Mein Lieblingsmoment war, als ___.
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Der beste oder schlechteste Film'
        skills: [Meinungen mit weil, Früher und heute]
        minutes: 12
        steps:
          - Hör das Modell von deiner Lehrkraft.
          - Schreib 3 Sätze über den besten oder den schlechtesten Film, den du gesehen hast.
          - Lies deine Sätze deinem Partner / deiner Partnerin vor. Er / Sie fragt nur **Warum?**
          - Erzähl der Gruppe von dem Film deines Partners / deiner Partnerin.
        example: |-
          *Der beste Film, den ich je gesehen habe, war „Avatar“.*
          *Ich habe ihn im Kino gesehen.*
          *Er hat mir gefallen, weil er wunderschön war.*
          *Mein Partner mochte „Barbie“, weil er lustig war.*
      - id: act3-sentences
        type: discussionQuestions
        title: Der beste / schlechteste Film
        items:
          - question: Der beste / schlechteste Film war ___.
          - question: Ich habe ihn ___ gesehen.
          - question: Er hat mir (nicht) gefallen, weil ___.
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Ein neues Ende schreiben'
        skills: [Früher und heute]
        steps:
          - 'Wähl einen Film: *Titanic, Der König der Löwen, Die Eiskönigin (Frozen), Toy Story, Coco*.'
          - 'Sag in 1–2 Sätzen, was im Original passiert ist (Perfekt).'
          - 'Schreib ein neues Ende im Präsens: Es passiert „jetzt“.'
          - Präsentiere das Original und dein neues Ende (45–60 Sekunden).
        example: |-
          *Im Original ist das Schiff gesunken und Jack ist gestorben.*
          *In unserer Version von Titanic überlebt Jack. Er bleibt bei Rose. Am Ende gehen sie zusammen nach Hause.*
      - id: act4-sentences
        type: discussionQuestions
        title: Original und neues Ende
        items:
          - question: 'Original: Im Original ist ___.'
          - question: 'Neu: In unserer Version ___.'
          - question: Dann ___.
          - question: Am Ende ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: **Früher und heute** (Perfekt, *früher /
          jetzt*, Präsens; Aufwärmfragen, Aktivitäten 1, 2 und 4) und **Meinungen mit
          weil** (Aktivitäten 1, 2 und 3). Wähl zwei oder drei Aktivitäten.
      - id: n-intro
        anchor: intro
        text: 'Gib zuerst dein Beispiel. Kurze Anschlussfragen: *Warum hat dir das gefallen? Wer war deine Lieblingsfigur? Gefällt es dir heute noch?*'
      - id: n-warmup
        anchor: warmup
        text: Stell jedem Schüler mindestens zwei Fragen. Die Antworten erscheinen unter jeder Frage.
      - id: n-act1
        anchor: act1
        text: >-
          Schreiben: 7 Minuten. Paarinterview: 10 Minuten. Präsentation: 5 Minuten.
          Ziel: das Perfekt in kurzen, klaren Sätzen.
      - id: n-act2
        anchor: act2
        text: >-
          Bereite den Ausschnitt aus „Friends“ vor (Staffel 1, Folge 1: Rachel kommt im
          Brautkleid ins Central Perk). Das Heft nennt keinen Link. Zeig die Szene
          zweimal. Die Nacherzählung im Perfekt; im Präteritum (*Rachel kam ins Café.*)
          ist sie auch richtig.
      - id: n-act3
        anchor: act3
        text: 'Schreiben: 4 Minuten. Partneraustausch: 5 Minuten. Gruppe: 3 Minuten.'
      - id: n-act4
        anchor: act4
        text: >-
          Ziel: Vergangenheit (was im Original passiert ist) und Gegenwart (ein neues
          Ende, das „jetzt“ passiert). Schreib die Modelle an die Tafel: *In unserer
          Version bleibt ___. Dann geht ___. Am Ende ___.*

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: filme-und-fernsehen-vergangenheit-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: rules-zeiten
        type: ruleSummary
        skill: Früher und heute
        rules:
          - text: '**Präsens**: für Gewohnheiten und Vorlieben **jetzt**. Das Verb steht an Position 2.'
            examples:
              [
                Ich mag Filme.,
                Ich schaue Serien am Abend.,
                Meine Lieblingsserie ist „Friends“.,
                Welche Serie schaust du?,
              ]
          - text: '**Perfekt**: für Erlebnisse in der Vergangenheit (Filme, die wir gesehen haben; Szenen, die passiert sind). *haben / sein* an Position 2, das **Partizip II** am Ende.'
            examples: [Ich habe gestern einen Film gesehen., Sie hat geweint., Was hast du gesehen?]
          - text: 'Bei *sein*, *haben* und *mögen* sagen wir in der Vergangenheit meistens **war, hatte, mochte** (Präteritum).'
            examples: [Ich war im Kino., Warst du im Kino?, Früher mochte ich Horrorfilme.]
          - text: 'Verneinung: **kein / keinen** vor einem Nomen ohne Artikel, sonst **nicht**.'
            examples: [Ich habe keinen Film gesehen., Ich war nicht im Kino.]
          - text: '**früher** + Vergangenheit = so war es, aber heute nicht mehr. Im Deutschen brauchen wir keine besondere Form wie *used to* im Englischen. Mit **jetzt** + Präsens sprechen wir über heute.'
            examples:
              [
                Früher habe ich Zeichentrickfilme gesehen.,
                'Früher mochte ich Cartoons, jetzt schaue ich Serien.',
              ]
      - id: zeiten-he
        type: text
        lang: he
        text: >-
          הווה (Präsens) – להרגלים ולהעדפות עכשיו. עבר (Perfekt) – לחוויות שהסתיימו:
          haben / sein במקום השני ו־Partizip II בסוף המשפט. עם sein, haben ו־mögen אומרים
          בדרך כלל war, hatte, mochte. בעזרת früher מדברים על מה שהיה פעם ועכשיו כבר לא;
          בגרמנית לא צריך מבנה מיוחד כמו used to באנגלית.
      - id: zeiten-examples
        type: examples
        items:
          - { text: Ich mag Filme., gloss: אני אוהב סרטים }
          - { text: Ich schaue Serien am Abend., gloss: אני צופה בסדרות בערב }
          - { text: Meine Lieblingsserie ist „Friends“., gloss: הסדרה האהובה עליי היא Friends }
          - { text: Welche Serie schaust du?, gloss: באיזו סדרה אתה צופה? }
          - { text: Magst du diesen Film?, gloss: אתה אוהב את הסרט הזה? }
          - { text: Ich habe gestern einen Film gesehen., gloss: ראיתי סרט אתמול }
          - { text: Ich war im Kino., gloss: הייתי בקולנוע }
          - { text: Sie hat geweint., gloss: היא בכתה }
          - { text: Was hast du gesehen?, gloss: מה ראית? }
          - { text: Warst du im Kino?, gloss: היית בקולנוע? }
          - { text: Ich habe keinen Film gesehen., gloss: לא ראיתי סרט }
          - { text: Ich war nicht im Kino., gloss: לא הייתי בקולנוע }
          - { text: Früher habe ich Zeichentrickfilme gesehen., gloss: בעבר צפיתי בסרטים מצוירים }
          - { text: Früher mochte ich Horrorfilme., gloss: פעם אהבתי סרטי אימה }
          - {
              text: 'Früher mochte ich Cartoons, jetzt schaue ich Serien.',
              gloss: 'בעבר אהבתי מצוירים, עכשיו אני צופה בסדרות',
            }
      - id: rules-weil
        type: ruleSummary
        skill: Meinungen mit weil
        rules:
          - text: 'Mit **weil** sagen wir, **warum** uns etwas gefällt oder nicht gefällt. Vor *weil* steht ein Komma.'
            examples: ['Ich mag diese Serie, weil sie spannend ist.']
          - text: 'Nach **weil** steht das Verb **am Ende**.'
            examples:
              [
                'Mir hat der Film gefallen, weil er lustig war.',
                'Der Film war gut, weil die Geschichte interessant war.',
                'Ich mochte die Serie nicht, weil sie langweilig war.',
              ]
          - text: '*gefallen*: Das, was gefällt, ist das Subjekt; die Person steht im Dativ (*mir, dir, ihm, ihr*). Perfekt mit *haben*.'
            examples:
              [
                Mir hat der Film gefallen.,
                Hat dir die Serie gefallen?,
                Ihm hat der Film nicht gefallen.,
              ]
      - id: weil-he
        type: text
        lang: he
        text: >-
          כדי להסביר למה משהו מוצא חן בעינינו משתמשים ב־weil (כי). לפני weil יש פסיק,
          ואחרי weil הפועל עובר לסוף המשפט: Ich mag diese Serie, weil sie spannend ist.
          עם gefallen הדבר שמוצא חן הוא הנושא, והאדם בא בצורת mir / dir / ihm / ihr: Mir
          hat der Film gefallen – הסרט מצא חן בעיניי.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die zwei Fertigkeiten mit der Gruppe und bitte um ein neues Beispiel für jede Regel.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: filme-und-fernsehen-vergangenheit-hausaufgaben
    title: Hausaufgaben mit Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben mit Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere eine Nachricht und schick sie ab. Mori stellt dir Fragen; beantworte alle.
      - id: mori-1
        type: aiTutorPrompt
        title: '1: Was ich heute schaue (Präsens)'
        intro: 'Beispiel: *Ich schaue gern Serien. Ich schaue am Abend.*'
        message: |-
          Hallo Mori! Bitte frag mich, welche Serie oder welchen Film ich heute mag und wann ich schaue.
          Ich möchte im Präsens antworten.
          Bitte korrigiere mich sofort.
      - id: mori-2
        type: aiTutorPrompt
        title: '2: Der letzte Film (Perfekt)'
        intro: 'Beispiel: *Ich habe gestern einen Film gesehen. Ich war zu Hause.*'
        message: |-
          Hallo Mori! Bitte frag mich nach dem letzten Film oder der letzten Serie, die ich gesehen habe.
          Ich möchte im Perfekt antworten.
          Bitte korrigiere jeden Fehler.
      - id: mori-3
        type: aiTutorPrompt
        title: '3: Früher und heute'
        intro: 'Beispiel: *Früher habe ich Cartoons gesehen. Jetzt schaue ich Serien.*'
        message: |-
          Hallo Mori! Ich möchte vergleichen, was ich als Kind gesehen habe und was ich heute schaue. Bitte frag mich danach.
          Ich möchte das Wort „früher“ benutzen.
          Bitte korrigiere jeden Fehler.
      - id: mori-4
        type: aiTutorPrompt
        title: '4: Meine Meinung mit weil'
        intro: 'Beispiel: *Mir hat der Film gefallen, weil er lustig war. Ich mochte die Serie nicht, weil sie langweilig war.*'
        message: |-
          Hallo Mori! Bitte frag mich, warum mir ein Film gefallen oder nicht gefallen hat.
          Ich möchte mit „weil“ antworten.
          Bitte korrigiere jeden Fehler.
      - id: mori-5
        type: aiTutorPrompt
        title: '5: Ein kurzes Interview'
        message: |-
          Hallo Mori! Bitte sei mein Interviewer und frag mich:
          – Welche Serie schaust du jetzt?
          – Welchen Film hast du zuletzt gesehen?
          – Was hast du als Kind gern gesehen?
          – Warum magst du einen Film (nicht)?
          Ich antworte auf Deutsch. Bitte korrigiere jeden Fehler freundlich.
      - id: mori-6
        type: aiTutorPrompt
        title: '6: Eine Mini-Geschichte'
        intro: 'Beispiel: *Heute schaue ich Serien. Gestern habe ich einen Film gesehen. Ich war mit meiner Schwester zu Hause. Früher habe ich Cartoons gesehen. Mir hat der Film gefallen, weil er spannend war.*'
        message: |-
          Hallo Mori! Ich möchte dir eine kurze Geschichte (4–5 Sätze) über einen Film oder eine Serie erzählen:
          – ein Satz im Präsens
          – zwei Sätze in der Vergangenheit
          – ein Satz mit „früher“
          – ein Satz mit „weil“
          Bitte korrigiere mich und schlag mir dann eine bessere Version vor.
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: filme-und-fernsehen-vergangenheit-uebung
    book: workbook
    title: 'Übung: Filme und Fernsehen – Gegenwart und Vergangenheit'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Übe die zwei Fertigkeiten des Zyklus. Jede Antwort wird sofort korrigiert, und du kannst es noch einmal versuchen.
      - id: ex-zeiten
        type: activity
        activity: filme-und-fernsehen-vergangenheit-zeiten
      - id: ex-weil
        type: activity
        activity: filme-und-fernsehen-vergangenheit-weil

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: filme-und-fernsehen-vergangenheit-wortschatz
    title: Wortschatz
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Wörter für Filme und Serien
        glossLang: he
        link: https://quizlet.com/br/1132370505/filme-fernsehen-gegenwart-und-vergangenheit-flash-cards/
        items: &filme-und-fernsehen-vergangenheit-words
          - { term: der Film, gloss: סרט }
          - { term: die Serie, gloss: סדרה }
          - { term: die Folge, gloss: פרק }
          - { term: der Schauspieler / die Schauspielerin, gloss: שחקן / שחקנית }
          - { term: die Figur, gloss: דמות }
          - { term: die Geschichte, gloss: סיפור }
          - { term: das Ende, gloss: הסוף }
          - { term: die Szene, gloss: סצנה }
          - { term: das Kino, gloss: קולנוע }
          - { term: zu Hause, gloss: בבית }
          - { term: sehen, gloss: לראות }
          - { term: schauen, gloss: לצפות }
          - { term: gefallen, gloss: למצוא חן (בעיני מישהו) }
          - { term: mögen, gloss: לאהוב }
          - { term: lieben, gloss: לאהוב מאוד }
          - { term: langweilig, gloss: משעמם }
          - { term: spannend, gloss: מותח }
