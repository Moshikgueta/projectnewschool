vocabulary:
  - slug: umzug
    title: Umzug
    items: *umzug-words

activities:
  - slug: umzug-futur
    title: 'Futur mit werden: Ich werde umziehen'
    minutes: 8
    items:
      - id: ich-werde
        type: multipleChoice
        prompt: Ich ___ nach Berlin ziehen.
        options:
          - { text: werde, correct: true }
          - {
              text: wird,
              feedback: '*wird* gehört zu *er / sie / es*. Mit *ich* sagen wir *ich werde*.',
            }
          - {
              text: werden,
              feedback: '*werden* gehört zu *wir* und *sie / Sie*. Mit *ich* sagen wir *ich werde*.',
            }
      - id: wirst-werden
        type: fillBlank
        prompt: Ergänze die richtige Form von *werden*.
        text: Du ___ eine Wohnung finden. Wir ___ nächstes Jahr umziehen.
        blanks: [[wirst], [werden]]
        wordBank: [werde, wirst, wird, werden]
      - id: personen
        type: matching
        prompt: Welche Form von *werden* passt?
        pairs:
          - [ich, werde]
          - [du, wirst]
          - [er / sie / es, wird]
          - [wir, werden]
          - [ihr, werdet]
      - id: zeitangabe-zuerst
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Nächstes Jahr werde ich nach Spanien ziehen., correct: true }
          - {
              text: Nächstes Jahr ich werde nach Spanien ziehen.,
              feedback: '*werden* steht an Position 2. Nach *Nächstes Jahr* kommt zuerst *werde*, dann *ich*.',
            }
          - {
              text: Nächstes Jahr werde ich ziehen nach Spanien.,
              feedback: 'Der Infinitiv steht am Ende: *… nach Spanien ziehen*.',
            }
      - id: infinitiv-ende
        type: trueFalse
        prompt: 'Im Satz *Ich werde einen neuen Job suchen.* steht der Infinitiv *suchen* am Ende.'
        answer: true
        feedback:
          correct: Richtig! *werden* an Position 2, der Infinitiv am Ende.
          incorrect: 'Doch: *Ich werde einen neuen Job suchen.* Der Infinitiv *suchen* steht am Ende.'
      - id: praesens-zukunft
        type: trueFalse
        prompt: 'Der Satz *Ich ziehe nächsten Monat nach Madrid.* spricht über die Zukunft.'
        answer: true
        feedback:
          correct: Richtig! Präsens + Zeitangabe (*nächsten Monat*) kann über die Zukunft sprechen.
          incorrect: 'Das Verb ist im Präsens, aber *nächsten Monat* zeigt die Zukunft. Präsens + Zeitangabe = Zukunft.'
      - id: bevor-lernen
        type: fillBlank
        prompt: 'Ergänze: *werden* + Infinitiv.'
        text: Bevor ich gehe, ___ ich Portugiesisch ___.
        blanks: [[werde], [lernen]]
        wordBank: [werde, wird, lernen, lerne]
      - id: ordne-sparen
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Nächsten Monat werde ich Geld sparen.

  - slug: umzug-fragen
    title: 'Fragen in einer neuen Stadt: Wo ist …?'
    minutes: 8
    items:
      - id: einkaufen
        type: multipleChoice
        prompt: Du möchtest Lebensmittel kaufen. Was fragst du?
        options:
          - { text: Wo ist der nächste Supermarkt?, correct: true }
          - {
              text: Wie bezahlt man hier den Bus?,
              feedback: 'Diese Frage ist über den Bus. Für Lebensmittel fragst du: *Wo ist der nächste Supermarkt?*',
            }
          - {
              text: Wo kann ich neue Leute kennenlernen?,
              feedback: 'Diese Frage ist über neue Leute. Für Lebensmittel fragst du: *Wo ist der nächste Supermarkt?*',
            }
      - id: wie-bezahlt
        type: fillBlank
        prompt: Ergänze das Fragewort.
        text: ___ bezahlt man hier den Bus?
        blanks: [[Wie]]
        wordBank: [Wie, Wo, Wer]
      - id: situationen
        type: matching
        prompt: Welche Frage passt zu welcher Situation?
        pairs:
          - [Du suchst ein Café., Kann mir jemand ein gutes Café empfehlen?]
          - [Du willst mit dem Bus fahren., Wie bezahlt man hier den Bus?]
          - [Du kennst niemanden., Wo kann ich neue Leute kennenlernen?]
          - [Du suchst eine Wohnung., Wo kann ich hier gut wohnen?]
      - id: empfehlen
        type: multipleChoice
        prompt: Kann mir jemand einen guten Supermarkt ___?
        options:
          - { text: empfehlen, correct: true }
          - { text: empfiehlt, feedback: 'Nach *kann* kommt der Infinitiv am Ende: *empfehlen*.' }
          - {
              text: zu empfehlen,
              feedback: 'Nach *kann* steht der Infinitiv ohne *zu*: *Kann mir jemand … empfehlen?*',
            }
      - id: wortstellung
        type: multipleChoice
        prompt: Welche Frage ist richtig?
        options:
          - { text: Wie bezahlt man hier das Parken?, correct: true }
          - {
              text: Wie man bezahlt hier das Parken?,
              feedback: 'In der W-Frage steht das Verb direkt nach dem Fragewort: *Wie bezahlt man …?*',
            }
          - {
              text: Wie man hier das Parken bezahlt?,
              feedback: 'In der W-Frage steht das Verb an Position 2: *Wie bezahlt man hier das Parken?*',
            }
      - id: gute-nachricht
        type: trueFalse
        prompt: 'Eine gute Nachricht in einer Stadtgruppe hat einen Gruß, eine kurze Information über dich und eine klare Frage.'
        answer: true
        feedback:
          correct: 'Richtig! Zum Beispiel: *Hallo! Ich bin neu in der Stadt. Wo ist der nächste Supermarkt?*'
          incorrect: 'Doch: Gruß + kurze Information + klare Frage. *Hallo! Ich bin neu in der Stadt. Wo ist der nächste Supermarkt?*'
      - id: neu-in-der-stadt
        type: fillBlank
        prompt: Ergänze.
        text: Hallo zusammen! Ich bin ___ in der Stadt.
        blanks: [[neu]]
      - id: ordne-supermarkt
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Wo ist der nächste Supermarkt?
