vocabulary:
  - slug: nachhaltigkeit
    title: Nachhaltigkeit
    items: *nachhaltigkeit-words

activities:
  - slug: nachhaltigkeit-werden
    title: 'Zukunft mit werden: Ich werde mehr recyceln.'
    minutes: 8
    items:
      - id: ich-werde
        type: multipleChoice
        prompt: Ich ___ mehr recyceln.
        options:
          - { text: werde, correct: true }
          - {
              text: wird,
              feedback: '*wird* ist für *er / sie / es*. Für *ich* sagen wir *ich werde*.',
            }
          - {
              text: werden,
              feedback: '*werden* ist für *wir* und *sie / Sie*. Für *ich* sagen wir *ich werde*.',
            }
      - id: du-wirst
        type: multipleChoice
        prompt: Du ___ weniger Plastik benutzen.
        options:
          - { text: wirst, correct: true }
          - { text: werde, feedback: '*werde* ist für *ich*. Für *du* sagen wir *du wirst*.' }
          - {
              text: wird,
              feedback: '*wird* ist für *er / sie / es*. Für *du* sagen wir *du wirst*.',
            }
      - id: wir-gehen
        type: fillBlank
        prompt: Ergänze *werden* und den Infinitiv.
        text: Wir ___ mehr zu Fuß ___.
        blanks: [[werden], [gehen]]
        wordBank: [werden, wird, gehen, gehst]
      - id: infinitiv-ende
        type: trueFalse
        prompt: 'Der Satz *Ich werde benutzen weniger Plastik.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! Der Infinitiv steht am Ende: *Ich werde weniger Plastik benutzen.*'
          incorrect: 'Mit *werden* steht der Infinitiv am Ende: *Ich werde weniger Plastik benutzen.*'
      - id: person-werden
        type: matching
        prompt: Welche Form von *werden* passt?
        pairs:
          - [ich, werde]
          - [du, wirst]
          - [er / sie / es, wird]
          - [wir, werden]
          - [ihr, werdet]
      - id: wenn-wird
        type: multipleChoice
        prompt: Wenn wir mehr recyceln, ___
        options:
          - { text: wird die Umwelt sauberer., correct: true }
          - {
              text: die Umwelt wird sauberer.,
              feedback: 'Nach dem wenn-Satz kommt zuerst das Verb: *…, wird die Umwelt sauberer.*',
            }
          - {
              text: die Umwelt sauberer wird.,
              feedback: 'Das Verb steht nur im wenn-Satz am Ende. Danach kommt zuerst das Verb: *…, wird die Umwelt sauberer.*',
            }
      - id: wenn-schmutzig
        type: fillBlank
        prompt: Ergänze die richtige Form von *werden*.
        text: Wenn wir nicht recyceln, ___ die Umwelt schmutzig.
        blanks: [[wird]]
      - id: ordne-bus
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Ich werde mit dem Bus fahren.

  - slug: nachhaltigkeit-vergleiche
    title: 'Vergleiche: besser als, so … wie'
    minutes: 8
    items:
      - id: umweltfreundlicher
        type: multipleChoice
        prompt: Das Fahrrad ist ___ als das Auto.
        options:
          - { text: umweltfreundlicher, correct: true }
          - {
              text: mehr umweltfreundlich,
              feedback: 'Im Deutschen sagen wir nicht *mehr* + Adjektiv. Wir hängen *-er* an: *umweltfreundlicher*.',
            }
          - {
              text: umweltfreundlich,
              feedback: 'Mit *als* brauchen wir den Komparativ mit *-er*: *umweltfreundlicher als*.',
            }
      - id: so-wie
        type: multipleChoice
        prompt: Der Bus ist so praktisch ___ das Auto.
        options:
          - { text: wie, correct: true }
          - {
              text: als,
              feedback: '*als* steht nach dem Komparativ (*praktischer als*). Mit *so* sagen wir *so … wie*.',
            }
          - { text: so, feedback: 'Die Struktur ist *so* + Adjektiv + *wie*: *so praktisch wie*.' }
      - id: besser
        type: fillBlank
        prompt: Ergänze den Komparativ von *gut*.
        text: Eine Stofftasche ist ___ als eine Plastiktasche.
        blanks: [[besser]]
      - id: so-gut-als
        type: trueFalse
        prompt: 'Der Satz *Leitungswasser ist so gut als Wasser aus der Flasche.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! Mit *so* sagen wir *wie*: *so gut wie*.'
          incorrect: 'Wenn zwei Dinge gleich sind, sagen wir *so … wie*: *so gut wie*.'
      - id: komparativ-paare
        type: matching
        prompt: Welcher Komparativ passt?
        pairs:
          - [sauber, sauberer]
          - [grün, grüner]
          - [gut, besser]
          - [groß, größer]
          - [praktisch, praktischer]
      - id: weniger-als
        type: fillBlank
        prompt: Ergänze *weniger … als*.
        text: Mit einer Trinkflasche benutzen wir ___ Plastik ___ mit Plastikflaschen.
        blanks: [[weniger], [als]]
        wordBank: [weniger, als, wie, so]
      - id: richtiger-satz
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Der Bus ist weniger schädlich als das Auto., correct: true }
          - {
              text: Der Bus ist weniger schädlich wie das Auto.,
              feedback: 'Nach *weniger* + Adjektiv steht *als*: *weniger schädlich als*.',
            }
          - {
              text: Der Bus ist so schädlicher wie das Auto.,
              feedback: 'Nach *so* steht die Grundform des Adjektivs: *so schädlich wie*.',
            }
      - id: ordne-fahrrad
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Das Fahrrad ist umweltfreundlicher als das Auto.
