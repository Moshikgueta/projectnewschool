activities:
  - slug: gesundheit-perfekt
    title: 'Perfekt: Ich habe … / Ich bin …'
    minutes: 8
    items:
      - id: bin-gestuerzt
        type: multipleChoice
        prompt: Gestern ___ ich zu Hause gestürzt.
        options:
          - { text: bin, correct: true }
          - {
              text: habe,
              feedback: '*stürzen* ist eine Bewegung: Das Perfekt bildet man mit *sein*. *Ich bin gestürzt.*',
            }
          - {
              text: ist,
              feedback: '*ist* gehört zu *er / sie / es*. Mit *ich* sagen wir *ich bin*: *Ich bin gestürzt.*',
            }
      - id: habe-getrunken
        type: multipleChoice
        prompt: Ich ___ viel Wasser getrunken.
        options:
          - { text: habe, correct: true }
          - {
              text: bin,
              feedback: '*trinken* ist keine Bewegung: Das Perfekt bildet man mit *haben*. *Ich habe getrunken.*',
            }
          - {
              text: hat,
              feedback: '*hat* gehört zu *er / sie / es*. Mit *ich* sagen wir *ich habe*.',
            }
      - id: gegangen
        type: fillBlank
        prompt: Ergänze das Partizip II von *gehen*.
        text: Ich bin zum Arzt ___.
        blanks: [[gegangen]]
      - id: partizipien
        type: matching
        prompt: Welches Partizip II passt?
        pairs:
          - [schlafen, geschlafen]
          - [trinken, getrunken]
          - [essen, gegessen]
          - [sprechen, gesprochen]
          - [fühlen, gefühlt]
      - id: partizip-ende
        type: trueFalse
        prompt: 'Im Perfekt steht das Partizip II meistens am Ende: *Ich habe gestern viel geschlafen.*'
        answer: true
        feedback:
          correct: Richtig! *habe* an Position 2, *geschlafen* am Ende.
          incorrect: 'Doch: Das Partizip II steht am Ende. *Ich habe gestern viel geschlafen.*'
      - id: besser-gefuehlt
        type: fillBlank
        prompt: Ergänze *haben* und das Partizip II von *fühlen*.
        text: Am Montag ___ ich mich besser ___.
        blanks: [[habe], [gefühlt, gefuehlt]]
      - id: nach-hause
        type: trueFalse
        prompt: 'Der Satz *Ich habe nach Hause gegangen.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! *gehen* ist eine Bewegung: *Ich bin nach Hause gegangen.*'
          incorrect: '*gehen* ist eine Bewegung und bildet das Perfekt mit *sein*: *Ich bin nach Hause gegangen.*'
      - id: ordne-knie
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Ich habe mir das Knie verletzt.

  - slug: gesundheit-ratschlaege
    title: 'Ratschläge: Du solltest …'
    minutes: 8
    items:
      - id: solltest
        type: multipleChoice
        prompt: Du ___ mehr schlafen.
        options:
          - { text: solltest, correct: true }
          - {
              text: sollte,
              feedback: '*sollte* gehört zu *ich* und *er / sie*. Mit *du* sagen wir *du solltest*.',
            }
          - {
              text: sollten,
              feedback: '*sollten* gehört zu *wir* und *sie / Sie*. Mit *du* sagen wir *du solltest*.',
            }
      - id: infinitiv-ende
        type: multipleChoice
        prompt: Welcher Rat ist richtig?
        options:
          - { text: Du solltest Wasser trinken., correct: true }
          - {
              text: Du solltest zu trinken Wasser.,
              feedback: 'Nach dem Modalverb kommt kein *zu*, und der Infinitiv steht am Ende: *Du solltest Wasser trinken.*',
            }
          - {
              text: Du solltest trinken Wasser.,
              feedback: 'Der Infinitiv steht am Ende: *Du solltest Wasser trinken.*',
            }
      - id: kannst
        type: fillBlank
        prompt: Ergänze eine Form von *können*.
        text: Vielleicht ___ du Tee trinken.
        blanks: [[kannst, könntest, koenntest]]
      - id: keine-endung
        type: trueFalse
        prompt: 'Bei Modalverben hat die *er / sie / es*-Form keine Endung *-t*: *er muss, sie sollte*.'
        answer: true
        feedback:
          correct: Richtig! *er muss*, nicht *er musst*.
          incorrect: 'Doch: *er muss, er kann, sie sollte*. Die *er / sie / es*-Form hat kein *-t*.'
      - id: problem-rat
        type: matching
        prompt: Welcher Rat passt zu welchem Problem?
        pairs:
          - [Ich trinke nie Wasser., Du solltest mehr Wasser trinken.]
          - [Ich bin nachts immer am Handy., Vielleicht kannst du dein Handy abends weglegen.]
          - [Ich habe Halsschmerzen., Du könntest Tee trinken.]
          - [Ich habe mir den Arm verletzt., Du solltest deinen Arm ausruhen.]
      - id: weil
        type: multipleChoice
        prompt: 'Du solltest früher ins Bett gehen. Das ist gut, weil ___.'
        options:
          - { text: du dann besser schläfst, correct: true }
          - {
              text: du schläfst dann besser,
              feedback: 'Nach *weil* steht das Verb am Ende: *weil du dann besser schläfst*.',
            }
          - {
              text: dann du besser schläfst,
              feedback: 'Nach *weil* kommt zuerst das Subjekt *du*, das Verb steht am Ende: *weil du dann besser schläfst*.',
            }
      - id: musst
        type: fillBlank
        prompt: 'Ergänze *müssen* (starke Notwendigkeit).'
        text: Wenn es morgen noch wehtut, ___ du zum Arzt gehen.
        blanks: [[musst]]
      - id: ordne-wasser
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Du solltest mehr Wasser trinken.
