vocabulary:
  - slug: musik
    title: Musik
    items: *musik-words

activities:
  - slug: musik-zeiten
    title: 'Heute und früher: höre, habe gehört, mochte'
    minutes: 8
    items:
      - id: habe-gehoert
        type: multipleChoice
        prompt: Gestern ___ ich ein Lied von Adele gehört.
        options:
          - { text: habe, correct: true }
          - { text: bin, feedback: '*hören* bildet das Perfekt mit *haben*: *Ich habe … gehört.*' }
          - {
              text: höre,
              feedback: '*höre* ist Präsens. Im Perfekt steht *haben* an Position 2 und *gehört* am Ende.',
            }
      - id: frueher-jetzt
        type: fillBlank
        prompt: Ergänze das Verb *hören*.
        text: Früher habe ich Kinderlieder ___. Jetzt ___ ich Rockmusik.
        blanks: [[gehört, gehoert], [höre, hoere]]
        wordBank: [gehört, höre, hört]
      - id: warst-du
        type: multipleChoice
        prompt: ___ du schon einmal auf einem Konzert?
        options:
          - { text: Warst, correct: true }
          - {
              text: Hast,
              feedback: '*sein* bildet das Perfekt mit *sein*: *Bist du … gewesen?* Oder kurz: *Warst du …?*',
            }
          - {
              text: Bist,
              feedback: '*Bist du* braucht am Ende *gewesen*. Ohne *gewesen* sagen wir *Warst du …?*',
            }
      - id: hast-gewesen
        type: trueFalse
        prompt: 'Der Satz *Hast du schon einmal auf einem Konzert gewesen?* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! Richtig ist: *Bist du schon einmal auf einem Konzert gewesen?*'
          incorrect: '*sein* bildet das Perfekt mit *sein*: *Bist du … gewesen?* (oder *Warst du …?*).'
      - id: partizip
        type: matching
        prompt: Welches Partizip II passt?
        pairs:
          - [hören, gehört]
          - [singen, gesungen]
          - [tanzen, getanzt]
          - [lieben, geliebt]
          - [mögen, gemocht]
      - id: als-kind-mochte
        type: multipleChoice
        prompt: Als Kind ___ ich Shakira.
        options:
          - { text: mochte, correct: true }
          - {
              text: mag,
              feedback: '*als Kind* ist Vergangenheit. Bei *mögen* sagen wir meistens *mochte*.',
            }
          - {
              text: möchte,
              feedback: '*möchte* heißt „ich will gern“ (jetzt). Die Vergangenheit von *mögen* ist *mochte*.',
            }
      - id: am-abend
        type: fillBlank
        prompt: Ergänze *hören* im Präsens.
        text: Am Abend ___ ich Musik.
        blanks: [[höre, hoere]]
      - id: ordne-frueher
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Früher habe ich Kinderlieder gehört.

  - slug: musik-vergleiche
    title: 'Vergleiche: älter als, das beste Lied'
    minutes: 8
    items:
      - id: aelter
        type: multipleChoice
        prompt: Adele ist ___ als Billie Eilish.
        options:
          - { text: älter, correct: true }
          - { text: alter, feedback: '*alt* bekommt im Komparativ einen Umlaut: *älter*.' }
          - {
              text: mehr alt,
              feedback: 'Im Deutschen sagen wir nicht *mehr alt*. Wir hängen *-er* an: *älter*.',
            }
      - id: beliebter
        type: multipleChoice
        prompt: Pop ist ___ Jazz.
        options:
          - { text: beliebter als, correct: true }
          - {
              text: mehr beliebt als,
              feedback: 'Auch lange Adjektive bekommen *-er*: *beliebter, populärer, interessanter*.',
            }
          - { text: beliebter wie, feedback: 'Nach dem Komparativ steht *als*: *beliebter als*.' }
      - id: lange-adjektive
        type: trueFalse
        prompt: 'Im Deutschen bekommen auch lange Adjektive *-er*: *populärer, interessanter*.'
        answer: true
        feedback:
          correct: Richtig! Im Deutschen gibt es kein *mehr … als* wie im Englischen.
          incorrect: 'Doch: Alle Adjektive bekommen *-er*: *populärer als*, *interessanter als*.'
      - id: lauter
        type: fillBlank
        prompt: Schreib den Komparativ von *laut*.
        text: Rock ist ___ als Pop.
        blanks: [[lauter]]
      - id: das-beste
        type: fillBlank
        prompt: Schreib den Superlativ von *gut*.
        text: Das ist das ___ Lied.
        blanks: [[beste]]
      - id: komparativ
        type: matching
        prompt: Welcher Komparativ passt?
        pairs:
          - [gut, besser]
          - [alt, älter]
          - [jung, jünger]
          - [ruhig, ruhiger]
          - [berühmt, berühmter]
      - id: beruehmteste
        type: multipleChoice
        prompt: Er ist der ___ Sänger.
        options:
          - { text: berühmteste, correct: true }
          - {
              text: berühmter,
              feedback: '*berühmter* ist der Komparativ (mit *als*). Für *der … Sänger* brauchen wir den Superlativ: *der berühmteste*.',
            }
          - {
              text: am berühmtesten,
              feedback: '*am … -sten* steht ohne Nomen. Vor einem Nomen sagen wir *der berühmteste Sänger*.',
            }
      - id: ordne-beste
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Das ist das beste Lied.
