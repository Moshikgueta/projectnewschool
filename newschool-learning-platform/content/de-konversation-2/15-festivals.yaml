          - { term: das Straßenfest, gloss: חגיגת רחוב / פסטיבל רחוב }
          - { term: die Tradition, gloss: מסורת }
          - { term: der Brauch, gloss: מנהג }
          - { term: das Ereignis, gloss: אירוע }
