vocabulary:
  - slug: festivals
    title: Festivals
    items: *festivals-words

activities:
  - slug: festivals-imperativ
    title: 'Imperativ: Komm! Trag! Bring … mit!'
    minutes: 8
    items:
      - id: bring-mit
        type: multipleChoice
        prompt: 'Gib deinem Freund einen Tipp (*Wasser mitbringen*):'
        options:
          - { text: Bring Wasser mit!, correct: true }
          - {
              text: Du bringst Wasser mit!,
              feedback: 'Im Imperativ sagen wir *du* nicht, und das Verb steht am Anfang: *Bring Wasser mit!*',
            }
          - {
              text: Mitbring Wasser!,
              feedback: 'Bei *mitbringen* steht *mit* am Ende: *Bring Wasser mit!*',
            }
      - id: trag-schuhe
        type: fillBlank
        prompt: Schreib den Imperativ (*du*) von *tragen*.
        text: ___ bequeme Schuhe!
        blanks: [[Trag, Trage]]
      - id: imperativ-formen
        type: matching
        prompt: Welcher Imperativ passt?
        pairs:
          - [du kommst, Komm!]
          - [du tanzt, Tanz!]
          - [du gehst, Geh!]
          - [du isst, Iss!]
          - [du hörst zu, Hör zu!]
      - id: iss
        type: multipleChoice
        prompt: '*essen* (du isst): ___ viel Obst auf dem Festival!'
        options:
          - { text: Iss, correct: true }
          - { text: Esse, feedback: 'Verben mit *e → i* behalten das *i* im Imperativ: *Iss!*' }
          - { text: Isst, feedback: 'Wir nehmen die *du*-Form ohne *-st*: *du isst → Iss!*' }
      - id: ohne-du
        type: trueFalse
        prompt: 'Im Imperativ (*du*) sagen wir das Wort *du* nicht: *Komm früh!*'
        answer: true
        feedback:
          correct: Richtig! Das Verb steht am Anfang, ohne *du*.
          incorrect: 'Doch: im Imperativ sagen wir *du* nicht. *Komm früh!*'
      - id: nicht-allein
        type: fillBlank
        prompt: 'Ein negativer Tipp: Ergänze.'
        text: Geh ___ allein!
        blanks: [[nicht]]
      - id: ihr-form
        type: multipleChoice
        prompt: 'Du sprichst mit zwei Freunden (*ihr*). Welcher Satz ist richtig?'
        options:
          - { text: Bringt Wasser mit!, correct: true }
          - {
              text: Bring Wasser mit!,
              feedback: '*Bring* ist für eine Person (*du*). Für *ihr* sagen wir *Bringt … mit!*',
            }
          - {
              text: Bringen Wasser mit!,
              feedback: 'Mit *-en* brauchen wir *Sie*: *Bringen Sie Wasser mit!* Für *ihr*: *Bringt Wasser mit!*',
            }
      - id: ordne-freunde
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Bring deine Freunde mit!

  - slug: festivals-zeiten
    title: 'Drei Zeiten: Perfekt, Präsens, werden'
    minutes: 8
    items:
      - id: habe-getanzt
        type: multipleChoice
        prompt: Letztes Jahr ___ ich getanzt.
        options:
          - { text: habe, correct: true }
          - {
              text: werde,
              feedback: '*getanzt* ist ein Partizip II: Perfekt mit *haben*. *Letztes Jahr habe ich getanzt.*',
            }
          - { text: bin, feedback: '*tanzen* hat im Perfekt *haben*: *Ich habe getanzt.*' }
      - id: werde-wiederkommen
        type: multipleChoice
        prompt: Nächstes Jahr ___ ich wiederkommen.
        options:
          - { text: werde, correct: true }
          - {
              text: habe,
              feedback: '*Nächstes Jahr* ist Zukunft: *werden* + Infinitiv. *Ich werde wiederkommen.*',
            }
          - { text: wird, feedback: '*wird* ist für *er / sie / es*. Für *ich* sagen wir *werde*.' }
      - id: leute-tragen
        type: fillBlank
        prompt: Ergänze *tragen* im Präsens.
        text: Jetzt ___ die Leute Kostüme.
        blanks: [[tragen]]
      - id: satzteile
        type: matching
        prompt: Welcher Satzteil passt?
        pairs:
          - [Letztes Jahr habe ich, auf dem Karneval getanzt.]
