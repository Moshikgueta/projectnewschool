        text: Übe die zwei Fertigkeiten des Zyklus. Jede Antwort wird sofort korrigiert, und du kannst es noch einmal versuchen.
      - id: ex-identitaet
        type: activity
        activity: identitaet-und-gemeinschaft-identitaet
      - id: ex-zukunft
        type: activity
        activity: identitaet-und-gemeinschaft-zukunft

