vocabulary:
  - slug: identitaet-und-gemeinschaft
    title: Identität und Gemeinschaft
    items: *identitaet-und-gemeinschaft-words

activities:
  - slug: identitaet-und-gemeinschaft-identitaet
    title: 'Identität: sein und Vergleiche'
    minutes: 8
    items:
      - id: ich-bin
        type: multipleChoice
        prompt: Ich ___ Student.
        options:
          - { text: bin, correct: true }
          - { text: ist, feedback: '*ist* ist für *er / sie / es*. Für *ich* sagen wir *bin*.' }
          - { text: bist, feedback: '*bist* ist für *du*. Für *ich* sagen wir *bin*.' }
      - id: bist-sind
        type: fillBlank
        prompt: Ergänze das Verb *sein*.
        text: Du ___ heute müde. Wir ___ in Tel Aviv.
        blanks: [[bist], [sind]]
      - id: sein-formen
        type: matching
        prompt: Welche Form von *sein* passt?
        pairs:
          - [ich, bin]
          - [du, bist]
          - [er / sie / es, ist]
          - [wir, sind]
          - [ihr, seid]
      - id: groesser
        type: multipleChoice
        prompt: Meine Stadt ist ___ als mein Dorf.
        options:
          - { text: größer, correct: true }
          - {
              text: mehr groß,
              feedback: 'Im Deutschen sagen wir nicht *mehr groß*. Wir sagen Adjektiv + *-er*: *größer*.',
            }
          - { text: großer, feedback: '*groß* bekommt im Komparativ einen Umlaut: *größer*.' }
      - id: so-wie
        type: fillBlank
        prompt: Meine Familie und deine Familie sind gleich freundlich. Ergänze.
        text: Meine Familie ist so freundlich ___ deine.
        blanks: [[wie]]
        wordBank: [wie, als, so]
      - id: als-nicht-wie
        type: trueFalse
        prompt: 'Der Satz *Meine Nachbarschaft ist ruhiger wie die Innenstadt.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! Nach dem Komparativ kommt *als*: *ruhiger als die Innenstadt*.'
          incorrect: 'Nach dem Komparativ (*ruhiger*) kommt *als*, nicht *wie*. *wie* benutzen wir mit *so … wie*.'
      - id: weniger-laut
        type: multipleChoice
        prompt: Die Innenstadt ist sehr laut. Meine Nachbarschaft ist ___ laut als die Innenstadt.
        options:
          - { text: weniger, correct: true }
          - {
              text: mehr,
              feedback: 'Die Innenstadt ist lauter, also ist meine Nachbarschaft *weniger laut*. Und mit Adjektiven sagen wir nicht *mehr*, sondern *-er* (*lauter*).',
            }
          - {
              text: am wenigsten,
              feedback: '*am wenigsten* ist der Superlativ, ohne *als*. Mit *als* sagen wir *weniger … als*.',
            }
      - id: ordne-israel
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Ich komme aus Israel.

  - slug: identitaet-und-gemeinschaft-zukunft
    title: Zukunft mit werden
    minutes: 8
    items:
      - id: ich-werde
        type: multipleChoice
        prompt: Ich ___ meinen Nachbarn helfen.
        options:
          - { text: werde, correct: true }
          - { text: wird, feedback: '*wird* ist für *er / sie / es*. Für *ich* sagen wir *werde*.' }
          - {
              text: werden,
              feedback: '*werden* ist für *wir* und *sie*. Für *ich* sagen wir *werde*.',
            }
      - id: gemeinschaft-wird
        type: fillBlank
        prompt: Ergänze die richtige Form von *werden*.
        text: Meine Gemeinschaft ___ sauberer sein.
        blanks: [[wird]]
      - id: werden-formen
        type: matching
        prompt: Welche Form von *werden* passt?
        pairs:
          - [ich, werde]
          - [du, wirst]
          - [er / sie / es, wird]
          - [wir, werden]
          - [ihr, werdet]
      - id: infinitiv-ende
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Ich werde meinen Nachbarn helfen., correct: true }
          - {
              text: Ich werde helfen meinen Nachbarn.,
              feedback: 'Mit *werden* steht der Infinitiv am Ende: *Ich werde meinen Nachbarn helfen.*',
            }
          - {
              text: Ich werde meinen Nachbarn helfe.,
              feedback: 'Nach *werden* kommt der Infinitiv: *helfen*, nicht *helfe*.',
            }
      - id: regel-ende
        type: trueFalse
        prompt: 'Mit *werden* steht der Infinitiv am Ende des Satzes: *Meine Stadt wird moderner sein.*'
        answer: true
        feedback:
          correct: Richtig! *wird* steht auf Position 2, *sein* am Ende.
          incorrect: 'Doch: *werden* steht auf Position 2, der Infinitiv (*sein*) am Ende.'
      - id: wir-werden-tun
        type: fillBlank
        prompt: Ergänze *werden* und den Infinitiv.
        text: Wir ___ dieses Jahr etwas für die Gemeinschaft ___.
        blanks: [[werden], [tun, machen]]
      - id: in-fuenf-jahren
        type: multipleChoice
        prompt: In fünf Jahren ___ meine Stadt größer sein.
        options:
          - { text: wird, correct: true }
          - {
              text: werde,
              feedback: '*werde* ist für *ich*. Für *meine Stadt* (sie) sagen wir *wird*.',
            }
          - {
              text: wirst,
              feedback: '*wirst* ist für *du*. Für *meine Stadt* (sie) sagen wir *wird*.',
            }
      - id: ordne-stadt
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Meine Stadt wird moderner sein.
