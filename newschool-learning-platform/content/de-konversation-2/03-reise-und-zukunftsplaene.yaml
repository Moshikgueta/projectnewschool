vocabulary:
  - slug: reise-und-zukunftsplaene
    title: Reise und Zukunftspläne
    items: *reise-und-zukunftsplaene-words

activities:
  - slug: reise-und-zukunftsplaene-futur
    title: Reisepläne mit Futur I
    minutes: 8
    items:
      - id: werden-wir
        type: multipleChoice
        prompt: Nächstes Jahr ___ wir nach Spanien reisen.
        options:
          - { text: werden, correct: true }
          - { text: wird, feedback: '*wird* ist für *er / sie*. Für *wir* sagen wir *werden*.' }
          - { text: werde, feedback: '*werde* ist für *ich*. Für *wir* sagen wir *werden*.' }
      - id: uebernachten
        type: fillBlank
        prompt: Ergänze das Verb im Infinitiv (übernachten).
        text: Ich werde in einem Hotel im Zentrum ___.
        blanks: [[übernachten, uebernachten]]
      - id: wo-wirst
        type: multipleChoice
        prompt: Wo ___ du übernachten?
        options:
          - { text: wirst, correct: true }
          - { text: werde, feedback: '*werde* ist für *ich*. Für *du* sagen wir *wirst*.' }
          - { text: wird, feedback: '*wird* ist für *er / sie*. Für *du* sagen wir *wirst*.' }
      - id: praesens-zukunft
        type: trueFalse
        prompt: 'Mit einer Zeitangabe kann auch das Präsens über die Zukunft sprechen: *Ich reise morgen nach Berlin.*'
        answer: true
        feedback:
          correct: 'Richtig! *Ich reise morgen.* und *Ich werde morgen reisen.* sind beide richtig.'
          incorrect: 'Doch: Im Deutschen sprechen wir oft mit Präsens + Zeitangabe über die Zukunft: *Ich reise morgen.*'
      - id: frage-antwort
        type: matching
        prompt: Welche Antwort passt zu welcher Frage?
        pairs:
          - [Wohin wirst du reisen?, Ich werde nach Italien reisen.]
          - [Mit wem wirst du reisen?, Ich werde mit meiner Schwester reisen.]
          - [Wo wirst du übernachten?, Ich werde in einem Hostel übernachten.]
          - [Welche Souvenirs wirst du kaufen?, Ich werde Postkarten kaufen.]
          - [Welches Verkehrsmittel wirst du benutzen?, Ich werde mit dem Zug fahren.]
      - id: partner-wird
        type: fillBlank
        prompt: 'Bericht über deinen Partner: Ergänze *wird* und den Infinitiv von *probieren*.'
        text: Mein Partner ___ Japan besuchen und dort Ramen ___.
        blanks: [[wird], [probieren]]
      - id: eines-tages
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Eines Tages werde ich Japan besuchen., correct: true }
          - {
              text: Eines Tages ich werde Japan besuchen.,
              feedback: '*werden* steht auf Position 2, direkt nach *Eines Tages*: *Eines Tages werde ich …*',
            }
          - {
              text: Eines Tages werde ich besuchen Japan.,
              feedback: 'Der Infinitiv steht am Satzende: *… Japan besuchen.*',
            }
      - id: ordne-frage
        type: reorderSentence
        prompt: Ordne die Wörter zu einer Frage.
        sentence: Mit wem wirst du reisen?

  - slug: reise-und-zukunftsplaene-vorhersagen
    title: 'Vorhersagen und Reihenfolge: ich glaube, zuerst, wenn'
    minutes: 8
    items:
      - id: glaube-wird
        type: multipleChoice
        prompt: Ich glaube, die Reise ___ interessant sein.
        options:
          - { text: wird, correct: true }
          - { text: werde, feedback: '*die Reise* ist *sie*: Wir sagen *wird*.' }
          - {
              text: ist,
              feedback: 'Mit *ist* brauchen wir kein *sein* am Ende. Für eine Vorhersage sagen wir *die Reise wird interessant sein*.',
            }
      - id: wetter
        type: fillBlank
        prompt: Ergänze die Vorhersage.
        text: Ich glaube, das Wetter ___ gut ___.
        blanks: [[wird], [sein]]
        wordBank: [wird, sein, ist, werden]
      - id: wenn-satz
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: 'Wenn ich ankomme, werde ich ein Taxi nehmen.', correct: true }
          - {
              text: 'Wenn ich ankomme, ich werde ein Taxi nehmen.',
              feedback: 'Nach dem *wenn*-Satz beginnt der Hauptsatz mit dem Verb: *…, werde ich ein Taxi nehmen.*',
            }
          - {
              text: 'Wenn ich komme an, werde ich ein Taxi nehmen.',
              feedback: 'Im *wenn*-Satz steht das Verb am Ende: *Wenn ich ankomme, …*',
            }
      - id: bevor-ende
        type: trueFalse
        prompt: 'Nach *bevor* steht das Verb am Ende: *Bevor ich reise, werde ich meinen Koffer packen.*'
        answer: true
        feedback:
          correct: Richtig! Im *bevor*-Satz steht das Verb (*reise*) am Ende.
          incorrect: 'Doch: Nach *wenn, bevor* und *nachdem* steht das Verb am Ende: *Bevor ich reise, …*'
      - id: reihenfolge-woerter
        type: matching
        prompt: Was bedeuten die Wörter?
        pairs:
          - [zuerst, קודם]
          - [dann, אחר כך]
          - [schließlich, לבסוף]
          - [bevor, לפני ש…]
          - [nachdem, אחרי ש…]
      - id: zuerst-schliesslich
        type: fillBlank
        prompt: Ergänze *Zuerst* und *Schließlich*.
        text: ___ werde ich fliegen. Dann werde ich im Hotel einchecken. ___ werde ich die Stadt erkunden.
        blanks: [[Zuerst], [Schließlich, Schliesslich]]
        wordBank: [Zuerst, Schließlich]
      - id: nachdem
        type: multipleChoice
        prompt: Nachdem ich ___, werde ich zum Strand gehen.
        options:
          - { text: eingecheckt habe, correct: true }
          - {
              text: einchecke,
              feedback: 'Nach *nachdem* ist die erste Handlung schon fertig: Wir benutzen das Perfekt: *Nachdem ich eingecheckt habe, …*',
            }
          - {
              text: werde einchecken,
              feedback: 'Im *nachdem*-Satz benutzen wir kein Futur, sondern das Perfekt: *eingecheckt habe*.',
            }
      - id: ordne-glaube
        type: reorderSentence
        prompt: Ordne die Wörter zu einer Vorhersage.
        sentence: Ich glaube, es wird schön sein.
