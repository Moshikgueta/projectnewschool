course: de-konversation-2
slug: reise-und-zukunftsplaene
title: Reise und Zukunftspläne
goal: Über Reisepläne sprechen, mit dem Futur I, und Vorhersagen und Reihenfolgen für die Zukunft ausdrücken.
position: 3
status: in_review

review:
  - >-
    The two workbook exercises ("Reisepläne mit Futur I" and "Vorhersagen und
    Reihenfolge") are NEW: the notebook has no self-study exercises. They were
    written from the cycle's summary, the activity examples and its vocabulary.
    Please check level, wording and every right answer before students see them.
  - >-
    Skills: the notebook lists six "geübte Fähigkeiten" (travel plans, Futur I,
    planned future, predictions, wenn / nachdem / bevor, fluency). They were grouped
    into the cycle's two skills: "Reisepläne mit Futur I" (werden + Infinitiv,
    Präsens + Zeitangabe) and "Vorhersagen und Reihenfolge" (ich glaube, es wird …;
    zuerst / dann / danach / schließlich; wenn / nachdem / bevor). Please confirm.
  - >-
    Summary, wenn / nachdem / bevor: the notebook says "after wenn / nachdem /
    bevor use the present tense" and gives "Nachdem ich einchecke, werde ich zum
    Strand gehen". With *nachdem* the first action is already finished, so it takes
    the Perfekt: "Nachdem ich eingecheckt habe, werde ich zum Strand gehen." The rule
    now says: wenn / bevor + Präsens, nachdem + Perfekt; the verb goes to the end of
    the wenn / nachdem / bevor clause, and the main clause starts with the verb
    (werde ich …). Rewritten in German and in the Hebrew text block.
  - >-
    Activity 3 report: "Mein Partner reist nach Griechenland. Der Mitarbeiter
    meinte, die Strände würden ihm gefallen." uses indirect speech with Konjunktiv
    II, which is above A2. The example is now the A2 form the notebook also accepts:
    "Mein Partner wird nach Griechenland reisen. Der Mitarbeiter glaubt, die Strände
    werden ihm gefallen." The original is mentioned in a teacher note.
  - >-
    Corrections: heading "Vorbereitungsfragen (Vorbereitungspläne)" →
    "Aufwärmfragen"; "Student A / Student B" (English) → "Schüler A / Schüler B";
    vocabulary "einpacken" kept, and "packen" (used in the summary example) added;
    stray markdown characters (\#\#\#, \*\*) removed.
  - >-
    The summary is written in Hebrew in the notebook. The rules are given in simple
    German (ruleSummary) and the corrected Hebrew explanation is kept as a Hebrew
    text block. The homework instructions were in Hebrew; the German Mori messages
    from the notebook are kept, and the Hebrew instructions became German intros.
    The optional task (one prediction sentence) is a fourth Mori message. The tips
    callout was added from the course pattern. Please check the Hebrew.
  - >-
    The notebook offers four activities and says the teacher chooses 2 (teacher
    note). Times: introduction 5; Activities 1–3: 12–15 → 15; Activity 4: 8–10 → 10.
    The warm-up has no time. The Quizlet link lost its tracking parameter (?new).
    The "Antwort von Schüler 1/2/3" lines are replaced by the optional answer boxes.
  - >-
    Vocabulary: glosses kept; "werden – פועל עזר לעתיד (יהיה / תהיה / יהיו)" kept.
    "ich glaube – אני חושב / חושבת" kept. Please confirm.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: reise-und-zukunftsplaene-unterricht
    title: 'Unterricht: Reise und Zukunftspläne'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Reise und Zukunftspläne
      - id: skills
        type: cycleOverview
        skills:
          - name: Reisepläne mit Futur I
            description: '*werden* + Infinitiv: *Ich werde nach Italien reisen.* Oder Präsens + Zeitangabe: *Ich reise morgen.*'
          - name: Vorhersagen und Reihenfolge
            description: '*Ich glaube, es wird schön sein. Zuerst … dann … Wenn ich ankomme, …*'
      - id: quizlet
        type: externalLink
        label: Reise und Zukunftspläne auf Quizlet
        url: https://quizlet.com/br/1128200322/reise-und-zukunftsplane-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Vorstellungsrunde
      - id: intro
        type: sentenceFrame
        frame: Ich bin ___. Ich werde nach ___ reisen.
        example: Ich bin Anna. Ich werde nächstes Jahr nach Italien reisen.
      - id: warmup-title
        type: heading
        level: 3
        text: Aufwärmfragen
      - id: warmup
        type: discussionQuestions
        items:
          - question: Wohin reist du in deinem nächsten Urlaub?
            frame: Ich werde nach ___ reisen.
          - question: Mit wem wirst du reisen?
            frame: Ich werde mit ___ reisen.
          - question: Was wirst du auf dieser Reise machen?
            frame: Ich werde ___ besuchen und ___ probieren.
          - question: Wo wirst du übernachten? (Hotel / Airbnb / Hostel …)
            frame: Ich werde in einem ___ übernachten.
          - question: Welches Verkehrsmittel wirst du benutzen?
            frame: Ich werde fliegen / mit dem Zug / mit dem Bus fahren.
          - question: Welche Souvenirs wirst du kaufen?
            frame: Ich werde ___ kaufen.
      - id: warmup-examples
        type: examples
        items:
          - { text: Ich werde nach Italien reisen. }
          - { text: Ich werde mit meiner Schwester reisen. }
          - { text: Ich werde Museen besuchen und lokales Essen probieren. }
          - { text: Ich werde in einem Hotel im Zentrum übernachten. }
          - { text: Ich werde fliegen und dann mit dem Zug fahren. }
          - { text: Ich werde Postkarten und Magnete kaufen. }
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Planung einer Gruppenreise'
        skills: [Reisepläne mit Futur I]
        minutes: 15
        steps:
          - Arbeitet in Gruppen von 3–4 Personen.
          - Plant eine gemeinsame Reise. Jede Person sagt mindestens einen Satz mit *Wir werden …*.
          - Jede Gruppe stellt ihre Reise kurz vor.
          - 'Abstimmung (freiwillig): beste Reise, entspannendste Reise, abenteuerlichste Reise.'
        example: |-
          *Wir werden nach Spanien reisen.*
          *Wir werden in Barcelona übernachten.*
          *Wir werden Tapas essen und Museen besuchen.*
          *Wir werden Souvenirs für unsere Familien kaufen.*
      - id: act1-questions
        type: discussionQuestions
        title: Hilfsfragen
        items:
          - question: Wohin werden wir reisen?
          - question: Wie werden wir reisen?
          - question: Wo werden wir übernachten?
          - question: Was werden wir essen?
          - question: Welche Orte werden wir besuchen?
          - question: Was werden wir kaufen?
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Traumreise'
        skills: [Reisepläne mit Futur I, Vorhersagen und Reihenfolge]
        minutes: 15
        steps:
          - 'Schreiben: Ergänze die 3 Sätze unten.'
          - 'Partnerinterview: Arbeitet zu zweit und stellt Fragen: *Was wirst du als Erstes tun? Mit wem wirst du reisen? Welches Essen wirst du probieren? Wie wird das Wetter sein?*'
          - 'Bericht in der 3. Person: *Mein Partner / Meine Partnerin wird ___ besuchen und dort ___ machen.*'
        example: '*Mein Partner wird Japan besuchen und dort Ramen probieren.*'
      - id: act2-sentences
        type: discussionQuestions
        title: Meine Traumreise
        items:
          - question: Eines Tages werde ich ___ besuchen.
          - question: Ich werde ___ machen / ausprobieren.
          - question: Ich denke, die Reise wird ___ sein.
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Rollenspiel im Reisebüro'
        skills: [Reisepläne mit Futur I, Vorhersagen und Reihenfolge]
        minutes: 15
        steps:
          - 'Schüler A ist der Reisende und erzählt seine Pläne. Schüler B arbeitet im Reisebüro und gibt Empfehlungen und Meinungen.'
          - Tauscht die Rollen.
          - Erzähl der Gruppe kurz, was dein Partner / deine Partnerin plant.
        example: '*Mein Partner wird nach Griechenland reisen. Der Mitarbeiter glaubt, die Strände werden ihm gefallen.*'
      - id: act3-language
        type: callout
        tone: info
        title: Sprache für das Rollenspiel
        text: |-
          **Reisender:** Ich werde nach ___ reisen. Ich werde ___ besuchen. Ich werde ___ essen. Ich werde in ___ übernachten.
          **Reisebüro:** Das wird sehr schön! Ich glaube, das wird Ihnen gefallen. Ich empfehle Ihnen ein Hotel im Zentrum. Sie brauchen bequeme Schuhe. Ich schicke Ihnen die Informationen.
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Mein Reiseplan'
        skills: [Vorhersagen und Reihenfolge]
        minutes: 10
        steps:
          - Schreib einen Reiseplan in 4 Schritten (Sätze unten).
          - Teil deinen Plan mit einem Partner oder stell ihn kurz der Klasse vor.
        example: |-
          *Zuerst werde ich fliegen.*
          *Dann werde ich im Hotel einchecken.*
          *Danach wird das Wetter gut sein.*
          *Schließlich werde ich die Stadt erkunden.*
      - id: act4-sentences
        type: discussionQuestions
        title: Mein Reiseplan in 4 Schritten
        items:
          - question: Zuerst werde ich ___.
          - question: Dann werde ich ___.
          - question: Danach wird ___. (Vorhersage)
          - question: Schließlich werde ich ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Ziel: Die Lernenden sprechen über Reisepläne, Traumreisen und
          Zukunftsvorhersagen mit einfachen, korrekten Zukunftsformen (A2). Es gibt
          vier Aktivitäten; wähl **zwei** davon aus. Achte auch auf Anschlussfragen
          und flüssiges Sprechen.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: Gib zuerst dein Beispiel, dann ist jeder Schüler dran.
      - id: n-warmup
        anchor: warmup
        text: >-
          Stell jedem Schüler mindestens zwei Fragen. Die Beispielsätze unter den
          Fragen sind Modelle. Bei der ersten Frage (*Wohin reist du …?*) sind
          Präsens und Futur I beide richtig.
      - id: n-act1
        anchor: act1
        minutes: 15
        text: 'Fokus: eine gemeinsame, schon geplante Reise im Futur I (*Wir werden …*). Schreib die Hilfsfragen an die Tafel.'
      - id: n-act2
        anchor: act2
        minutes: 15
        text: 'Fokus: Futur I für Wünsche und Vorhersagen (*Eines Tages werde ich … Ich denke, die Reise wird … sein.*).'
      - id: n-act3
        anchor: act3
        minutes: 15
        text: >-
          Fokus: Futur I für Pläne und Vorhersagen. Im Heft steht als Bericht auch
          *Der Mitarbeiter meinte, die Strände würden ihm gefallen.* Das ist indirekte
          Rede (über A2); für A2 reicht *… die Strände werden ihm gefallen.*
      - id: n-act4
        anchor: act4
        minutes: 10
        text: 'Fokus: Reihenfolge + Futur I (strukturierte Produktion). Der dritte Satz ist eine Vorhersage (*Danach wird das Wetter gut sein.*).'

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: reise-und-zukunftsplaene-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: rules-futur
        type: ruleSummary
        skill: Reisepläne mit Futur I
        rules:
          - text: '**Futur I:** *werden* (konjugiert) auf **Position 2** + **Infinitiv am Satzende**.'
            examples:
              - Ich **werde** nach Italien **reisen**.
              - Ich **werde** in einem Hotel **übernachten**.
              - Ich **werde** Museen **besuchen**.
          - text: 'Wir benutzen das Futur I für **Pläne** und für **Träume und Wünsche**.'
            examples:
              [Ich werde nächstes Jahr nach Spanien reisen., Eines Tages werde ich Japan besuchen.]
          - text: 'Im Deutschen gibt es keinen Unterschied wie im Englischen zwischen *will* und *going to*. Wir benutzen **werden** oder das **Präsens mit einer Zeitangabe**.'
            examples: [Ich werde reisen., Ich reise morgen.]
      - id: werden-table
        type: table
        caption: werden
        header: [Person, werden, Beispiel]
        rows:
          - [ich, werde, Ich werde reisen.]
          - [du, wirst, Du wirst reisen.]
          - [er / sie, wird, Er / Sie wird reisen.]
          - [wir, werden, Wir werden reisen.]
      - id: rules-vorhersagen
        type: ruleSummary
        skill: Vorhersagen und Reihenfolge
        rules:
          - text: '**Vorhersagen und Meinungen:** *Ich glaube, …* + Futur I.'
            examples:
              [Ich glaube, es wird schön sein., Ich glaube, die Reise wird interessant sein.]
          - text: '**Reihenfolge:** *zuerst, dann, danach, schließlich*. Nach diesen Wörtern kommt zuerst das Verb (*werde*), dann das Subjekt (*ich*).'
            examples:
              - Zuerst werde ich fliegen.
              - Dann werde ich im Hotel einchecken.
              - Danach wird das Wetter gut sein.
              - Schließlich werde ich die Stadt erkunden.
          - text: '**wenn / bevor** + Präsens: Das Verb steht am Ende des Nebensatzes. Danach beginnt der Hauptsatz mit dem Verb (*werde ich …*).'
            examples:
              - '**Wenn** ich **ankomme**, **werde** ich ein Taxi nehmen.'
              - '**Bevor** ich **reise**, **werde** ich meinen Koffer packen.'
          - text: '**nachdem** + Perfekt: Die erste Handlung ist dann schon fertig.'
            examples: ['**Nachdem** ich **eingecheckt habe**, **werde** ich zum Strand gehen.']
      - id: key-sentence
        type: callout
        tone: tip
        title: Kurz gesagt
        text: |-
          **werden + Verb = Zukunft**: für Pläne, Träume und Vorhersagen.
          Nach *wenn / bevor*: Präsens; nach *nachdem*: Perfekt. Die Zukunft steht im Hauptsatz.
          Die Reihenfolge (*zuerst, dann, danach, schließlich*) macht deinen Plan klar.
      - id: summary-he
        type: text
        lang: he
        text: >-
          בשיעור הזה תרגלנו איך לדבר על העתיד בהקשר של נסיעות, חופשות ותוכניות. עתיד –
          Futur I: werden (ich werde, du wirst, er / sie wird, wir werden) במקום השני,
          והפועל בצורת המקור בסוף המשפט. משתמשים בו לתוכניות, לחלומות ולתחזיות (Ich
          glaube, es wird schön sein). בגרמנית אין הבדל כמו באנגלית בין will ל־going
          to: אומרים werden או הווה עם מילת זמן (Ich reise morgen). אחרי wenn / bevor
          משתמשים בהווה, ואחרי nachdem ב־Perfekt (Nachdem ich eingecheckt habe, …),
          כי הפעולה הראשונה כבר הסתיימה. במשפט הזה הפועל עובר לסוף, והמשפט הראשי
          מתחיל בפועל (werde ich …). מילות רצף: zuerst – קודם, dann – אחר כך, danach –
          לאחר מכן, schließlich – לבסוף.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die Regeln mit der Gruppe und bitte um ein neues Beispiel für jede Regel.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: reise-und-zukunftsplaene-hausaufgaben
    title: Hausaufgaben mit Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben mit Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori. Schreib deine Sätze auf Deutsch, kopiere die Nachricht und schick alles zusammen ab. Mori korrigiert dich und stellt dir Fragen.
      - id: mori-reiseplaene
        type: aiTutorPrompt
        title: 'Aufgabe 1: Reisepläne'
        intro: 'Schreib 5 Sätze über deine Reisepläne mit *werden* + Verb: *Ich werde nach ___ reisen. Ich werde mit ___ reisen. Ich werde ___ besuchen. Ich werde in ___ übernachten. Ich werde ___ essen / kaufen.*'
        message: |-
          Mori, hier sind meine Reisepläne.
          Bitte korrigiere mich und stell mir eine Frage.
      - id: mori-traumreise
        type: aiTutorPrompt
        title: 'Aufgabe 2: Traumreise'
        intro: 'Schreib 4–5 Sätze über deine Traumreise, mit mindestens einem Satz mit *Eines Tages werde ich …* und einem Satz mit *Ich glaube, es wird …*. Beispiel: *Eines Tages werde ich Japan besuchen. Ich glaube, die Reise wird sehr interessant sein.*'
        message: |-
          Mori, das ist meine Traumreise.
          Bitte korrigiere mich und stell mir eine Anschlussfrage.
      - id: mori-reihenfolge
        type: aiTutorPrompt
        title: 'Aufgabe 3: Reihenfolge'
        intro: 'Schreib 4 Sätze mit *Zuerst … Dann … Danach … Schließlich …*. Du kannst auch einen Satz mit *wenn / nachdem / bevor* schreiben. Beispiel: *Zuerst werde ich fliegen. Danach werde ich im Hotel einchecken.*'
        message: |-
          Mori, hier ist mein Reiseplan.
          Bitte korrigiere mich.
      - id: mori-vorhersage
        type: aiTutorPrompt
        title: 'Extra-Aufgabe (freiwillig): eine Vorhersage'
        intro: 'Schreib einen Satz: Wie wird das Wetter sein? Wie wird die Reise sein? Beispiel: *Ich glaube, das Wetter wird gut sein.*'
        message: Mori, hier ist meine Vorhersage für meine Reise. Bitte korrigiere mich.
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**

