vocabulary:
  - slug: ehrenamt
    title: Ehrenamt und Helfen
    items: *ehrenamt-words

activities:
  - slug: ehrenamt-perfekt
    title: 'Perfekt: Ich habe geholfen'
    minutes: 8
    items:
      - id: habe-geholfen
        type: multipleChoice
        prompt: Ich ___ meiner Nachbarin geholfen.
        options:
          - { text: habe, correct: true }
          - {
              text: bin,
              feedback: '*helfen* ist keine Bewegung: Das Perfekt hat *haben*. *Ich habe geholfen.*',
            }
          - { text: hat, feedback: '*hat* gehört zu *er / sie / es*. Mit *ich* sagen wir *habe*.' }
      - id: gegeben
        type: fillBlank
        prompt: Ergänze das Perfekt von *geben*.
        text: Wir ___ unserer Gemeinschaft Zeit ___.
        blanks: [[haben], [gegeben]]
      - id: partizip
        type: matching
        prompt: Welches Partizip II passt zu welchem Verb?
        pairs:
          - [helfen, geholfen]
          - [arbeiten, gearbeitet]
          - [machen, gemacht]
          - [geben, gegeben]
          - [gehen, gegangen]
      - id: bin-gegangen
        type: multipleChoice
        prompt: Ich ___ zur Schule gegangen.
        options:
          - { text: bin, correct: true }
          - {
              text: habe,
              feedback: '*gehen* ist eine Bewegung: Das Perfekt hat *sein*. *Ich bin gegangen.*',
            }
          - { text: ist, feedback: '*ist* gehört zu *er / sie / es*. Mit *ich* sagen wir *bin*.' }
      - id: frage
        type: trueFalse
        prompt: '*Hast du jemandem geholfen?* ist eine richtige Frage im Perfekt.'
        answer: true
        feedback:
          correct: Richtig! *Hast* steht am Anfang, *geholfen* am Ende.
          incorrect: 'Die Frage ist richtig: Das Hilfsverb (*hast*) steht am Anfang, das Partizip II (*geholfen*) am Ende.'
      - id: nicht
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Ich habe nicht geholfen., correct: true }
          - {
              text: Ich nicht habe geholfen.,
              feedback: 'Das Verb *habe* steht auf Position 2: *Ich habe nicht geholfen.*',
            }
          - {
              text: Ich habe geholfen nicht.,
              feedback: '*nicht* steht vor dem Partizip II, und das Partizip steht am Ende: *Ich habe nicht geholfen.*',
            }
      - id: meinem
        type: fillBlank
        prompt: '*helfen* steht mit Dativ. Ergänze: *mein Freund* → ?'
        text: Ich habe ___ Freund beim Umzug geholfen.
        blanks: [[meinem]]
      - id: ordne-hunden
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Wir haben den Hunden geholfen.

  - slug: ehrenamt-frueher
    title: 'Früher: Früher habe ich geholfen'
    minutes: 8
    items:
      - id: frueher-tierheim
        type: multipleChoice
        prompt: ___ habe ich im Tierheim gearbeitet. Heute arbeite ich in einem Büro.
        options:
          - { text: Früher, correct: true }
          - {
              text: Morgen,
              feedback: '*Morgen* ist die Zukunft. Für die Vergangenheit sagen wir *früher*.',
            }
          - {
              text: Jetzt,
              feedback: '*Jetzt* ist heute. Für etwas, das in der Vergangenheit so war, sagen wir *früher*.',
            }
      - id: used-to
        type: trueFalse
        prompt: Im Deutschen braucht man für Gewohnheiten in der Vergangenheit eine besondere Form, wie *used to* im Englischen.
        answer: false
        feedback:
          correct: 'Genau! Wir sagen nur *früher* + Vergangenheit: *Früher habe ich geholfen.*'
          incorrect: 'Im Deutschen gibt es keine besondere Form. Wir sagen *früher* + Vergangenheit: *Früher habe ich geholfen.*'
      - id: war
        type: multipleChoice
        prompt: Früher ___ ich sehr hilfsbereit.
        options:
          - { text: war, correct: true }
          - {
              text: bin,
              feedback: '*bin* ist Gegenwart. Mit *früher* sagen wir *war*: *Früher war ich sehr hilfsbereit.*',
            }
          - {
              text: habe,
              feedback: '*hilfsbereit sein*: Wir brauchen das Verb *sein*. In der Vergangenheit sagen wir *war*.',
            }
      - id: hatte
        type: fillBlank
        prompt: Ergänze *haben* in der Vergangenheit.
        text: Früher ___ ich viel Stress in der Schule.
        blanks: [[hatte]]
      - id: position-2
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Früher habe ich in einer Schule geholfen., correct: true }
          - {
              text: Früher ich habe in einer Schule geholfen.,
              feedback: 'Nach *früher* kommt zuerst das Verb (Position 2), dann *ich*: *Früher habe ich …*',
            }
          - {
              text: Früher habe ich geholfen in einer Schule.,
              feedback: 'Das Partizip II steht am Ende: *Früher habe ich in einer Schule geholfen.*',
            }
      - id: wochenende
        type: fillBlank
        prompt: Ergänze das Perfekt von *helfen*.
        text: Früher ___ ich jedes Wochenende ___.
        blanks: [[habe], [geholfen]]
      - id: heute-frueher
        type: matching
        prompt: Was passt zusammen? Heute → früher
        pairs:
          - [Ich bin müde., Früher war ich müde.]
          - [Ich habe Stress., Früher hatte ich Stress.]
          - [Ich helfe im Tierheim., Früher habe ich im Tierheim geholfen.]
          - [Ich gehe zur Schule., Früher bin ich zur Schule gegangen.]
      - id: ordne-samstag
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Früher habe ich jeden Samstag geholfen.
