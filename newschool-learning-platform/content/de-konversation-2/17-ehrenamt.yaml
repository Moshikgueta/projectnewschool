# Cycle "Ehrenamt und Helfen", converted from the German level 2 digital notebook
# (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (German).
course: de-konversation-2
slug: ehrenamt
title: Ehrenamt und Helfen
goal: Im Perfekt über Hilfe erzählen und mit „früher“ über Gewohnheiten in der Vergangenheit sprechen.
position: 17
status: published

review:
  - >-
    The two workbook exercises ("Perfekt" and "Früher") are NEW: the notebook has no
    self-correcting exercises. They were written from the cycle's two skills, its
    summary rules, the activity examples and its vocabulary. Please check level,
    wording and every right answer before students see them.
  - >-
    The title "Ehrenamt & Helfen" is now "Ehrenamt und Helfen". The grammar summary
    is in Hebrew in the notebook: it is given as German rule summaries, with a short
    Hebrew text block for each skill (the Hebrew is kept close to the notebook).
    ADDED to the summary: "helfen" takes the dative (meiner Nachbarin, meinem
    Freund, den Hunden), and with "sein" and "haben" we usually say "früher war
    ich / früher hatte ich" (Präteritum), as in the notebook's own examples; the
    grammar focus says "früher + Perfekt/Präteritum" but the summary did not explain
    it. Please confirm.
  - >-
    The grammar focus also lists the prepositions "für, mit, in, bei", but the
    notebook's summary has no part for them. A short rule with examples from the
    cycle (für andere, für mich, in einer Schule, beim Umzug) was ADDED as a third
    rule block; the notebook has no example with "mit", so "Ich habe mit meiner
    Mutter gekocht" was ADDED. Remove the block if you prefer.
  - >-
    Activity 1 ("Freiwilligenlauf", a literal title that does not mean anything in
    German) is now "Freiwillige im Perfekt". Its sentences 1, 2, 3 and 6 had one
    blank before the object, but the answer needs two words (haben … Partizip II,
    with the Partizip at the end): they now have a second blank at the end ("Viele
    Freiwillige ___ Menschen in Not ___."). Sentences 4 and 5 already have the
    Partizip, so only the auxiliary is missing. The answer key is in a teacher note.
  - >-
    Activity 2: stray quotation mark removed from the title ("Früher war ich ein
    Super-Freiwilliger!"); frame and example "Unsere Rolle war … / Unsere Rolle war
    Lehrer" → "Wir waren … / Wir waren Lehrer" (more natural German). Activity 4: the
    closing note to the teacher ("Diese Version bleibt eine Debatte, aber …") moved to
    a teacher note.
  - >-
    The Mori prompts are written in Hebrew in the notebook ("instructions in Hebrew,
    examples in German"). They were translated into German, as in the other
    cycles, and the example answers moved to the intro line. The tips callout was
    added as in the other cycles.
  - >-
    Vocabulary: "helfen" appeared twice (1. helfen, 31. helfen + Dativ); it is kept
    once as "helfen (+ Dativ)". Glosses changed: "haben – להיות (עזר) / יש" → "יש
    ל… / פועל עזר ב־Perfekt"; "gern – בשמחה / אוהב" → "בשמחה / (לעשות) בכיף". Nouns
    already had articles. Hebrew of the summary example "Früher war ich sehr
    hilfsbereit – בעבר הייתי מאוד עוזר" → "בעבר מאוד אהבתי לעזור" (gender-neutral). The vocabulary is very basic (A1 words such as gut,
    heute, hier); the notebook says so itself.
  - >-
    The notebook gives no times for the introduction, the warm-up or Activity 1, and
    no plan for which activities go with which skill; the plan note is ADDED. Times
    are recorded from the phases (Activity 4 presentation 3–4 minutes per group →
    4). The Quizlet link is kept without its "?new" parameter. The "Student 1/2/3"
    answer lines are replaced by the optional answer boxes (decision C2).

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: ehrenamt-unterricht
    title: 'Unterricht: Ehrenamt und Helfen'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Ehrenamt und Helfen
      - id: skills
        type: cycleOverview
        skills:
          - name: Perfekt
            description: '*haben / sein* + Partizip II: *Ich habe meiner Nachbarin geholfen.*'
          - name: Früher
            description: 'Gewohnheiten in der Vergangenheit: *Früher habe ich im Tierheim gearbeitet. Früher war ich sehr hilfsbereit.*'
      - id: quizlet
        type: externalLink
        label: Ehrenamt und Helfen auf Quizlet
        url: https://quizlet.com/br/1132356588/ehrenamt-helfen-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Vorstellungsrunde
      - id: intro
        type: sentenceFrame
        prompt: 'Sag zwei Sätze: Wer bist du? Was hast du für andere getan (oder früher getan)?'
        frame: Ich bin ___. Ich habe für andere ___. / Früher habe ich ___.
        example: Ich bin Ana. Ich habe für andere gekocht. Früher habe ich in einer Schule geholfen.
      - id: warmup-title
        type: heading
        level: 3
        text: Aufwärmfragen
      - id: warmup
        type: discussionQuestions
        items:
          - question: Hast du in letzter Zeit jemandem geholfen? Was hast du getan?
            frame: Ja. Ich habe meinem / meiner ___ geholfen. Ich habe ___.
          - question: Hast du früher ehrenamtlich gearbeitet? Wo?
            frame: Ja. Früher habe ich in ___ gearbeitet. / Nein, ich habe nie ehrenamtlich gearbeitet.
          - question: Wer war die letzte Person, der du geholfen hast? Wie hast du geholfen?
            frame: Ich habe meinem Freund geholfen. Ich habe ihm beim Umzug geholfen.
          - question: Hat dir jemand geholfen? Wer und wie?
            frame: Mein / Meine ___ hat mir geholfen. Er / Sie hat für mich ___.
          - question: Warst du als Kind hilfsbereit? Warum?
            frame: Ja. Ich war hilfsbereit, weil ich gern geholfen habe. / Nein, ich war nicht sehr hilfsbereit, weil ___.
          - question: Hast du früher regelmäßig irgendwo geholfen? Wo?
            frame: Ja. Früher habe ich jeden ___ in / im ___ geholfen.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Freiwillige im Perfekt'
        skills: [Perfekt, Früher]
        steps:
          - Lies die Sätze unten.
          - Setz das richtige Verb aus der Wortliste ein und schreib es im **Perfekt**. Achte auf **haben / sein + Partizip II**.
          - Manche Verben kommen mehr als einmal vor.
        example: '*Ich ___ meinem Freund ___.* → *Ich habe meinem Freund geholfen.*'
        wordBank: [helfen, geben, brauchen, arbeiten, machen, helfen]
      - id: act1-sentences
        type: discussionQuestions
        title: Sätze
        items:
          - question: Viele Freiwillige ___ Menschen in Not ___.
          - question: Wir ___ unserer Gemeinschaft Zeit ___.
          - question: Die Menschen ___ Hilfe ___.
          - question: Ich ___ früher in einem Tierheim gearbeitet.
          - question: Wir ___ die Stadt ein bisschen besser gemacht.
          - question: Meine Familie ___ mir in einer schwierigen Zeit ___.
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Früher war ich ein Super-Freiwilliger!'
        skills: [Früher, Perfekt]
        steps:
          - 'Zu zweit denken (5 Minuten): Erfindet eine **ungewöhnliche** freiwillige Organisation aus der Vergangenheit. Sie ist nicht echt: Ihr könnt kreativ sein.'
          - 'Schreiben (10 Minuten): Schreibt zusammen **vier kurze Sätze** (siehe unten).'
          - 'Präsentation (1 Minute pro Paar): Lest eure vier Sätze der Klasse vor.'
        example: |-
          Ideen: eine Organisation, die alten Menschen beim Tanzen hilft; eine Gruppe, die Straßen für Tiere malt; eine Schule für Superhelden.
          *Die Organisation hieß „Happy Hands“.*
          *Früher hat die Organisation alten Menschen geholfen.*
          *Wir waren Lehrer. Wir haben jeden Tag Musik gemacht.*
          *Die Organisation hat geschlossen, weil es kein Geld mehr gab.*
      - id: act2-sentences
        type: discussionQuestions
        title: Unsere Organisation
        items:
          - question: Die Organisation hieß ___.
          - question: Früher hat die Organisation ___.
          - question: Wir waren ___. Wir haben ___.
          - question: Die Organisation hat geschlossen, weil ___.
      - id: act2-focus
        type: callout
        tone: info
        title: Sprachfokus
        text: |-
          **Perfekt:** *wir haben geholfen, wir haben gearbeitet*
          **früher** für die Vergangenheit
          Einfache, klare Sätze
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Ein Tag als Helfer'
        skills: [Perfekt]
        steps:
          - 'Zu zweit planen (5 Minuten): Stellt euch vor, gestern wart ihr Freiwillige für einen Tag.'
          - 'Wählt den Ort: *Tierheim, Schule, Krankenhaus, Park, Gemeindezentrum*.'
          - 'Wählt die Menschen oder Tiere: *Kinder, alte Menschen, Hunde, Nachbarn*.'
          - 'Schreiben (10 Minuten): Schreibt zusammen **fünf kurze Sätze** mit den Modellen unten.'
          - 'Vorlesen (1 Minute pro Paar): Lest eure fünf Sätze der Klasse vor.'
        example: |-
          *Gestern waren wir im Tierheim.*
          *Wir haben dort gearbeitet.*
          *Wir haben den Hunden geholfen.*
          *Am Ende des Tages haben wir alles sauber gemacht.*
          *Wir haben uns glücklich gefühlt.*
      - id: act3-sentences
        type: discussionQuestions
        title: Unser Tag als Helfer
        items:
          - question: Gestern waren wir in / im ___.
          - question: Wir haben dort ___.
          - question: Wir haben ___ geholfen.
          - question: Am Ende des Tages haben wir ___.
          - question: Wir haben uns ___ gefühlt.
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Mini-Debatte'
        skills: [Perfekt, Früher]
        steps:
          - 'Das Thema: *Sollen Schüler vor dem Abschluss ehrenamtlich arbeiten?* Die Stadt sagt: „Alle Schüler sollen **30 Stunden** ehrenamtlich arbeiten, bevor sie die Schule beenden.“'
          - 'Gruppe A: **Ja, das ist gut.** Gruppe B: **Nein, das ist nicht gut.**'
          - In Gruppen vorbereiten (10 Minuten). Jede Gruppe schreibt **3 kurze Argumente**. Jedes Argument hat **ein Beispiel aus der Vergangenheit**.
          - 'Präsentation (4 Minuten pro Gruppe): *Wir sind Gruppe A / B. Wir finden das gut / nicht gut, weil … Ein Beispiel aus der Vergangenheit: …*'
          - 'Fragen (2 Minuten pro Gruppe): *Warum denkst du das? Hast du ein Beispiel? Was hast du früher gemacht?*'
          - 'Entscheidung: Die Lehrkraft sagt, welche Gruppe besser argumentiert hat und warum.'
          - 'Reflexion: *Welche Gruppe war überzeugender? Welche Beispiele waren gut? Hat eine Geschichte deine Meinung geändert?*'
        example: |-
          **Gruppe A (Ja):** *Ich finde das gut, weil Hilfe wichtig ist. Früher habe ich alten Menschen geholfen. Ich habe gelernt, geduldig zu sein.*
          **Gruppe B (Nein):** *Ich finde das nicht gut, weil Schüler müde sind. Früher hatte ich viel Stress in der Schule. Ich hatte keine Zeit für mich.*
      - id: act4-arguments
        type: discussionQuestions
        title: Unsere Argumente
        items:
          - question: Ich finde das gut / nicht gut, weil ___.
          - question: Früher habe ich ___.
          - question: In meiner Schule haben wir ___.
          - question: Ich habe gelernt, dass ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: **Perfekt** (Aktivitäten 1 und 3) und
          **früher** für Gewohnheiten in der Vergangenheit (Aktivitäten 2 und 4). Beide
          kommen auch in der Vorstellungsrunde und in den Aufwärmfragen vor. Wähle die
          Aktivitäten passend zur Zeit.
      - id: n-intro
        anchor: intro
        text: Gib zuerst das Modell («Ich bin Ana. Ich habe für andere gekocht. Früher habe ich in einer Schule geholfen.»), dann ist jeder Schüler dran.
      - id: n-warmup
        anchor: warmup
        text: Stell jedem Schüler mindestens zwei Fragen. Die Antworten erscheinen unter jeder Frage.
      - id: n-act1
        anchor: act1
        text: >-
          Lösungen: 1. haben … geholfen; 2. haben … gegeben; 3. haben … gebraucht; 4.
          habe; 5. haben; 6. hat … geholfen. Erinnere daran, dass *helfen* mit Dativ
          steht (*Menschen in Not, mir*).
      - id: n-act2
        anchor: act2
        minutes: 15
        text: >-
          Denken: 5 Minuten. Schreiben: 10 Minuten. Präsentation: 1 Minute pro Paar.
          Lies zuerst das Beispielmodell vor. Ziel: Perfekt und das Wort *früher*.
      - id: n-act3
        anchor: act3
        minutes: 15
        text: >-
          Planen: 5 Minuten. Schreiben: 10 Minuten. Vorlesen: 1 Minute pro Paar. Die
          Schüler üben das Perfekt in einer klaren, geführten Erzählung über einen
          einzigen Tag als Freiwillige.
      - id: n-act4
        anchor: act4
        text: >-
          Erkläre die Situation mit einfachen Worten: *Einige Menschen sagen: Helfen ist
          gut für den Charakter. Andere sagen: Schüler haben schon zu viel Stress.* Teile
          die Klasse in Gruppe A und B. Vorbereitung: 10 Minuten; Präsentation: 4
          Minuten pro Gruppe; Fragen: 2 Minuten pro Gruppe; dann Entscheidung und
          Reflexion im Plenum. Diese Version bleibt eine Debatte, aber mit sehr klaren
          Rollen, kurzen, sicheren Satzmustern, Fokus auf Vergangenheit und persönliche
          Erfahrung und ohne abstrakte Sprache oder lange Erklärungen.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: ehrenamt-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: rules-perfekt
        type: ruleSummary
        skill: Perfekt
        rules:
          - text: 'Im gesprochenen Deutsch erzählen wir mit dem **Perfekt**, was passiert ist: *haben* / *sein* + **Partizip II**. Das Partizip II steht am Ende.'
            examples:
              - Ich habe geholfen.
              - Wir haben in einer Organisation gearbeitet.
              - Ich bin zur Schule gegangen.
          - text: '**Fragen**: Das Hilfsverb steht am Anfang, das Partizip II am Ende.'
            examples: [Hast du jemandem geholfen?, Bist du dort gewesen?]
          - text: '**Verneinung**: *nicht* steht vor dem Partizip II.'
            examples: [Ich habe nicht geholfen., Wir sind nicht gegangen.]
          - text: '*helfen* steht mit **Dativ**: *meinem Freund, meiner Nachbarin, den Hunden, mir, ihm*.'
            examples: [Ich habe meiner Nachbarin geholfen., Ich habe ihm beim Umzug geholfen.]
      - id: perfekt-he
        type: text
        lang: he
        text: >-
          עבר בגרמנית – Perfekt: בגרמנית מדוברת משתמשים ב־Perfekt כדי לדבר על פעולות
          שהסתיימו בעבר: haben / sein + Partizip II. Ich habe geholfen – עזרתי. Wir haben
          in einer Organisation gearbeitet – עבדנו בארגון. Ich bin zur Schule gegangen –
          הלכתי לבית הספר. שאלה: Hast du jemandem geholfen? – עזרת למישהו? שלילה: Ich
          habe nicht geholfen – לא עזרתי.
      - id: rules-frueher
        type: ruleSummary
        skill: Früher
        rules:
          - text: 'Für Dinge, die **früher** so waren, aber heute nicht mehr, sagen wir **früher** + Vergangenheit. Wir brauchen keine besondere Form.'
            examples:
              - Früher habe ich im Tierheim gearbeitet.
              - Früher habe ich jedes Wochenende geholfen.
          - text: 'Mit *sein* und *haben* sagen wir meistens **war** und **hatte**.'
            examples:
              [Früher war ich sehr hilfsbereit., Früher hatte ich viel Stress in der Schule.]
          - text: 'Wenn *früher* am Anfang steht, kommt das Verb (*habe, war, hatte*) auf Position 2, dann das Subjekt.'
            examples: [Früher **habe** ich in einer Schule geholfen.]
      - id: frueher-he
        type: text
        lang: he
        text: >-
          הרגלים בעבר – früher: כדי לדבר על דברים שהיו נכונים בעבר אבל כבר לא היום,
          מוסיפים את המילה früher למשפט בזמן עבר. בגרמנית לא צריך מבנה מיוחד כמו
          "used to" באנגלית. Früher habe ich im Tierheim gearbeitet – בעבר עבדתי במקלט
          לבעלי חיים. Früher war ich sehr hilfsbereit – בעבר מאוד אהבתי לעזור.
      - id: rules-praep
        type: ruleSummary
        skill: Kleine Wörter – für, mit, in, bei
        rules:
          - text: '**für** + Akkusativ: für wen?'
            examples: [Ich habe für andere gekocht., Sie hat für mich gekocht.]
          - text: '**mit, in, bei** + Dativ (*bei dem* = *beim*).'
            examples:
              - Früher habe ich in einer Schule geholfen.
              - Ich habe ihm beim Umzug geholfen.
              - Ich habe mit meiner Mutter gekocht.
      - id: recap
        type: callout
        tone: info
        title: Was ich jetzt kann
        text: |-
          Über Erfahrungen in der Vergangenheit sprechen.
          Von Hilfe und Ehrenamt erzählen.
          Das **Perfekt** richtig benutzen.
          Gewohnheiten in der Vergangenheit mit **früher** ausdrücken.
          Kurze, klare Sätze auf A2-Niveau bilden.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die zwei Fertigkeiten mit der Gruppe und bitte um ein neues Beispiel für jede Regel.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: ehrenamt-hausaufgaben
    title: Hausaufgaben mit Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben mit Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere eine Nachricht und schick sie ab. Mori stellt dir Fragen; beantworte alle.
      - id: mori-ich
        type: aiTutorPrompt
        title: '1: Wer bin ich und was habe ich für andere getan?'
        intro: 'Beispielantwort: *Ich bin Daniel. Ich habe meiner Nachbarin geholfen. Ich habe für sie eingekauft.*'
        message: Hallo Mori, bitte mich, mich auf Deutsch vorzustellen und eine Sache zu erzählen, die ich für eine andere Person getan habe. Ich möchte das Perfekt benutzen. Bitte korrigiere mich sofort.
      - id: mori-hilfe
        type: aiTutorPrompt
        title: '2: Anderen helfen'
        intro: 'Beispiel: *Ich habe meinem Freund geholfen. Ich habe ihm beim Umzug geholfen.*'
        message: Mori, frag mich, wem ich in letzter Zeit geholfen habe und was ich genau gemacht habe. Ich möchte in einfachen Sätzen im Perfekt antworten. Bitte korrigiere jeden Fehler.
      - id: mori-frueher
        type: aiTutorPrompt
        title: '3: Früher und heute'
        intro: 'Beispiel: *Früher habe ich im Tierheim gearbeitet. Früher war ich sehr hilfsbereit.*'
        message: Mori, bitte mich, über etwas zu sprechen, das ich früher gemacht habe, aber heute nicht mehr mache. Ich möchte das Wort „früher“ benutzen. Hilf mir, das Verb in die Vergangenheit zu setzen.
      - id: mori-tag
        type: aiTutorPrompt
        title: '4: Ein Tag als Freiwilliger'
        intro: 'Beispiel: *Gestern war ich im Park. Ich habe alten Menschen geholfen. Ich habe mich glücklich gefühlt.*'
        message: Mori, bitte mich, mir vorzustellen, dass ich einen Tag lang Freiwilliger / Freiwillige war. Frag mich, wo ich war, wem ich geholfen habe und wie ich mich gefühlt habe. Ich antworte im Perfekt.
      - id: mori-interview
        type: aiTutorPrompt
        title: '5: Ein kurzes Interview über Ehrenamt'
        message: |-
          Mori, sei ein Interviewer. Stell mir diese Fragen, eine nach der anderen:
          Wem hast du einmal geholfen?
          Wo hast du geholfen?
          Was hast du genau gemacht?
          War es leicht oder schwer?
          Möchtest du das noch einmal machen?
          Ich antworte auf Deutsch, und du korrigierst jeden Fehler.
      - id: mori-geschichte
        type: aiTutorPrompt
        title: '6: Eine kurze Geschichte'
        message: |-
          Mori, bitte mich, eine kurze Geschichte in 4–5 Sätzen über eine Erfahrung mit Hilfe oder Ehrenamt zu erzählen. Ich benutze das Perfekt und das Wort „früher“. Bitte:
          Korrigiere mich freundlich.
          Stell mir Fragen, damit ich mich selbst korrigieren kann.
          Schlag mir dann eine bessere, klare Version auf Deutsch vor.
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: ehrenamt-uebung
    book: workbook
    title: 'Übung: Ehrenamt und Helfen'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Übe die zwei Fertigkeiten des Zyklus. Jede Antwort wird sofort korrigiert, und du kannst es noch einmal versuchen.
      - id: ex-perfekt
        type: activity
        activity: ehrenamt-perfekt
      - id: ex-frueher
        type: activity
        activity: ehrenamt-frueher

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: ehrenamt-wortschatz
    title: Wortschatz
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Wörter für Ehrenamt und Helfen
        glossLang: he
        link: https://quizlet.com/br/1132356588/ehrenamt-helfen-flash-cards/
        items: &ehrenamt-words
          - { term: helfen (+ Dativ), gloss: לעזור (ל…) }
          - { term: der Freund / die Freundin, gloss: חבר / חברה }
          - { term: die Familie, gloss: משפחה }
          - { term: der Nachbar / die Nachbarin, gloss: שכן / שכנה }
          - { term: die Stadt, gloss: עיר }
          - { term: die Schule, gloss: בית ספר }
          - { term: die Arbeit, gloss: עבודה }
          - { term: der Mensch, gloss: אדם }
          - { term: die Zeit, gloss: זמן }
          - { term: gut, gloss: טוב }
          - { term: schlecht, gloss: רע }
          - { term: viel, gloss: הרבה }
          - { term: wenig, gloss: מעט }
          - { term: gern, gloss: בשמחה / (לעשות) בכיף }
          - { term: zusammen, gloss: ביחד }
          - { term: heute, gloss: היום }
          - { term: gestern, gloss: אתמול }
          - { term: früher, gloss: פעם / בעבר }
          - { term: jetzt, gloss: עכשיו }
          - { term: hier, gloss: כאן }
          - { term: dort, gloss: שם }
          - { term: sein, gloss: להיות }
          - { term: haben, gloss: יש ל… / פועל עזר ב־Perfekt }
          - { term: gehen, gloss: ללכת }
          - { term: kommen, gloss: לבוא }
          - { term: machen, gloss: לעשות }
          - { term: geben, gloss: לתת }
          - { term: arbeiten, gloss: לעבוד }
          - { term: lernen, gloss: ללמוד }
          - { term: fühlen, gloss: להרגיש }
          - { term: für, gloss: בשביל }
