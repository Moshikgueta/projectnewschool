# Cycle "Ziele und Projekte: Vergangenheit", converted from the German level 2
# (conversational) digital notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher
# review: see `review` below. Blocks without `lang` are in the course language (German).
course: de-konversation-2
slug: ziele-und-projekte-vergangenheit
title: 'Ziele und Projekte: Vergangenheit'
goal: Im Perfekt erzählen, was du für deine Ziele gemacht hast, und die Schritte in der richtigen Reihenfolge sagen.
position: 6
status: in_review

review:
  - >-
    The two workbook exercises ("Über Ziele sprechen im Perfekt" and "Reihenfolge:
    zuerst, dann, danach, am Ende") are NEW: the notebook has no self-study
    exercises. They were written from the cycle's summary, the activity examples and
    its vocabulary. Please check level, wording and every right answer before
    students see them.
  - >-
    Skills: the notebook lists four language goals (talk about goals, report past
    actions, use time words, ask and answer short questions) with the Perfekt as
    grammar focus. They are grouped into two skills: "Über Ziele sprechen (Perfekt)"
    and "Reihenfolge erzählen (zuerst, dann, danach, am Ende)". Please confirm.
  - >-
    Activity 4 example had English left in from the English notebook: "Zuerst habe
    ich mich für Englischkurse angemeldet … Danach habe ich Serien auf Englisch
    geschaut" → "für einen Deutschkurs angemeldet … Serien auf Deutsch geschaut".
  - >-
    Grammar: the Hebrew summary calls the Partizip II "the third form of the verb"
    (from the English notebook); the German rule now says how it is formed (ge-…-t,
    ge-…-en, no ge- with er- / ver-: erreicht, versucht; aufgegeben, angemeldet).
    ADDED: the word order after zuerst / dann / danach / am Ende (verb in position
    2), "Mein Ziel war es, … zu + Infinitiv", the reflexive "Ich habe mich stolz
    gefühlt", and a note that sein and haben are usually said in the Präteritum (war,
    hatte), as in "Mein Ziel war es …" and "Mein Partner war am Ende stolz". A table
    of the cycle's verbs in the Perfekt was added.
  - >-
    Corrections: Activity 1 title "Mein Vorbild (VERGANGENHEIT)" → "Mein Vorbild";
    partner reaction "Das macht Sinn" (Anglicism) → "Das ergibt Sinn" (Activities 3
    and 4; please revert if you prefer the colloquial form); letter ending "Dein
    jetziges Ich." → "Dein jetziges Ich"; the summary's list of time words now has
    "zuerst" (used in Activity 4) next to dann / danach / am Ende.
  - >-
    The Mori homework prompts are all in Hebrew in the notebook. They were
    translated into German messages to copy; the Hebrew instruction "copy each
    prompt, one by one, and answer in short German sentences" is the intro text.
    The tips callout was added from the course pattern.
  - >-
    The Hebrew summary's part 5 ("personal and safe conversation": we talked, we
    listened, we reported) is not a rule; it is kept as a short Hebrew recap text.
    Please check the Hebrew.
  - >-
    Vocabulary: "haben – להיות (פועל עזר)" was wrong (haben = to have) → "שיש ל־ /
    פועל עזר"; "sein" → "להיות / פועל עזר"; "letzte Woche – שבוע שעבר" → "בשבוע שעבר";
    "letztes Wochenende" → "בסוף השבוע שעבר". Verbs now show their Perfekt (hat
    gelernt, ist geblieben …). The Hebrew headings of the list were dropped.
  - >-
    Times: Activity 1 phase 1 = 5 minutes; Activity 3 (8–10) → 10; Activity 4 (10–15)
    → 15, with steps 5, 6 (4–6) and 4 (3–4) minutes. The Quizlet link lost its "?new"
    parameter. The "Antwort von Schüler 1/2/3" and "Student 1/2/3" lines are replaced
    by the answer boxes. There are no Anfänger / Fortgeschrittene parts in this
    cycle.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: ziele-und-projekte-vergangenheit-unterricht
    title: 'Unterricht: Ziele und Projekte (Vergangenheit)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Ziele und Projekte: Vergangenheit'
      - id: skills
        type: cycleOverview
        skills:
          - name: Über Ziele sprechen (Perfekt)
            description: '*Mein Ziel war es, Deutsch zu lernen. Ich habe jeden Tag gelernt.*'
          - name: Reihenfolge erzählen
            description: '*Zuerst habe ich … Dann habe ich … Danach … Am Ende …*'
      - id: quizlet
        type: externalLink
        label: Ziele und Projekte auf Quizlet
        url: https://quizlet.com/br/1128894611/ziele-und-projekte-vergangenheit-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Vorstellungsrunde
      - id: intro
        type: sentenceFrame
        prompt: 'Sag drei kurze Sätze: deinen Namen und dein Ziel (Präsens), eine Sache, die du schon gemacht hast (Perfekt), und wie du dich fühlst.'
        frame: |-
          Ich bin ___. Mein Ziel ist es, ___.
          Letzte Woche habe ich ___.
          Ich fühle mich ___, weil ___.
        example: Ich bin Noa. Mein Ziel ist es, besser Deutsch zu sprechen. Letzte Woche habe ich jeden Tag mit Mori geübt. Ich fühle mich gut, weil ich viel gelernt habe.
      - id: warmup-title
        type: heading
        level: 3
        text: Aufwärmfragen
      - id: warmup
        type: discussionQuestions
        items:
          - question: Was hast du bisher für dein Ziel gemacht?
            frame: Bis jetzt habe ich ___. (*Bis jetzt habe ich gelernt, geübt und meine Hausaufgaben gemacht.*)
          - question: Was war dein letztes Ziel?
            frame: Mein letztes Ziel war es, ___. Ich habe es erreicht. / Ich habe es nicht erreicht.
          - question: Was hast du getan, um dein Ziel zu erreichen?
            frame: Letzte Woche habe ich ___. Ich habe auch ___.
          - question: Wie hast du dich gefühlt?
            frame: Ich habe mich ___ gefühlt.
          - question: Was hast du danach gemacht?
            frame: Danach habe ich ___.
          - question: Hast du gefeiert?
            frame: Ich habe mit ___ gefeiert. Wir haben ___ gegessen / getrunken.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Mein Vorbild'
        skills: [Über Ziele sprechen (Perfekt)]
        steps:
          - 'Denk an dein Vorbild. Notiere: Name, Beruf, was die Person gemacht hat.'
          - Erzähl der Gruppe von deinem Vorbild. Benutze die Sätze unten.
        example: |-
          *Mein Vorbild ist Greta Thunberg.*
          *Sie hat viele Reden gehalten und viel für den Klimaschutz gemacht.*
          *Sie ist mein Vorbild, weil sie mutig ist.*
      - id: act1-sentences
        type: discussionQuestions
        title: Mein Vorbild
        items:
          - question: Mein Vorbild ist ___.
          - question: Diese Person hat ___.
          - question: Sie / Er ist mein Vorbild, weil ___.
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Eine Sache, die mir geholfen hat'
        skills: [Über Ziele sprechen (Perfekt)]
        steps:
          - 'Denk an eine Sache, die dir bei deinem Ziel geholfen hat: eine App, ein Kurs, eine Person, ein Buch, ein Werkzeug. Schreib nur Stichwörter.'
          - Schreib zwei kurze Sätze mit dem Satzmodell unten.
          - 'Arbeitet zu zweit: Erzähl deinem Partner / deiner Partnerin von deiner Sache. Er / Sie stellt eine einfache Frage.'
          - Einige Schüler sagen der Klasse einen Satz.
        example: |-
          *Das ist Quizlet.*
          *Es hat mir geholfen, neue Wörter zu lernen.*
          *Wie hat es dir geholfen? Wann hast du es benutzt?*
      - id: act2-sentences
        type: discussionQuestions
        title: Meine Sache
        items:
          - question: Das ist ___.
          - question: Es hat mir geholfen, ___.
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Brief an mein Ziel-Ich'
        skills: [Über Ziele sprechen (Perfekt)]
        minutes: 10
        steps:
          - 'Du schreibst einen kurzen Brief an dein zukünftiges Ich. Dein zukünftiges Ich hat das Ziel schon erreicht.'
          - 'Schreib, was dein Ziel war, was du in der Vergangenheit gemacht hast und was du nicht gemacht hast. Schreib kurze, einfache Sätze im Perfekt (ich habe / ich bin).'
          - '(Optional) Lies deinem Partner / deiner Partnerin einen Satz vor. Er / Sie reagiert kurz: *Das ist gut. / Das ergibt Sinn.*'
        example: |-
          *Liebes zukünftiges Ich,*
          *mein Ziel war es, besser Deutsch zu sprechen.*
          *Ich habe jeden Tag gelernt. Ich habe mit meinen Freunden Deutsch gesprochen. Ich habe nicht aufgegeben.*
          *Ich glaube an dich.*
          *Dein jetziges Ich*
      - id: act3-letter
        type: discussionQuestions
        title: Liebes zukünftiges Ich
        items:
          - question: Mein Ziel war es, ___.
          - question: Ich habe ___.
          - question: Ich habe auch ___.
          - question: Ich habe nicht ___.
          - question: Ich glaube an dich. Dein jetziges Ich
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Mein Zielzeitplan'
        skills: [Reihenfolge erzählen, Über Ziele sprechen (Perfekt)]
        minutes: 15
        steps:
          - 'Wähl ein Ziel, das du in der Vergangenheit erreicht hast (klein oder groß). Schreib 4–5 kurze Sätze: Was hast du zuerst gemacht? Was ist danach passiert? Wie hat es geendet?'
          - 'Erzähl deinem Partner / deiner Partnerin deine Zeitleiste. Er / Sie reagiert kurz und positiv: *Das ist gut. / Das ergibt Sinn. / Wie hast du dich am Ende gefühlt?*'
          - Sag der Klasse einen Satz über deinen Partner / deine Partnerin.
        example: |-
          *Zuerst habe ich mich für einen Deutschkurs angemeldet.*
          *Dann habe ich jede Woche mit Mori geübt.*
          *Danach habe ich Serien auf Deutsch geschaut.*
          *Am Ende habe ich meine Prüfung bestanden.*
          *Mein Partner hat jede Woche gelernt. Mein Partner war am Ende stolz.*
      - id: act4-timeline
        type: discussionQuestions
        title: Meine Zeitleiste
        items:
          - question: Zuerst habe ich ___.
          - question: Dann habe ich ___.
          - question: Danach habe ich ___.
          - question: Am Ende habe ich ___.
          - question: 'Über meinen Partner / meine Partnerin: ___'
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Grammatikfokus: **Perfekt** (haben / sein + Partizip II). Zwei Fertigkeiten:
          **Über Ziele sprechen** (Aktivitäten 1–3) und **Reihenfolge erzählen** mit
          *zuerst, dann, danach, am Ende* (Aktivität 4).
      - id: n-intro
        anchor: intro
        text: Jeder Schüler sagt drei kurze Sätze. Gib zuerst dein eigenes Beispiel.
      - id: n-warmup
        anchor: warmup
        text: Stell jedem Schüler mindestens zwei Fragen. Die Antworten erscheinen unter jeder Frage.
      - id: n-act1
        anchor: act1
        text: >-
          Phase 1 (Vorbereitung): 5 Minuten. Gib zuerst das Lehrermodell (Greta
          Thunberg). Dann spricht jeder Schüler mit der Struktur.
      - id: n-act2
        anchor: act2
        text: >-
          Schreib das Satzmodell an die Tafel: «Das ist ___. Es hat mir geholfen, ___.»
          Ziel: über Hilfe in der Vergangenheit sprechen, das Perfekt mit *hat
          geholfen* benutzen und einfache Gründe nennen. Lehrermodell: *Das ist Quizlet.
          Es hat mir geholfen, neue Wörter zu lernen.*
      - id: n-act3
        anchor: act3
        text: >-
          Keine langen Texte: 3–5 Sätze sind genug. Fokus auf Perfekt, Wortstellung und
          *haben* oder *sein*. Fehler nur kurz korrigieren. Das Teilen (Schritt 3) ist
          optional.
      - id: n-act4
        anchor: act4
        text: >-
          Ablauf: Einzelarbeit – Partnerarbeit – Plenum. Schritt 1 (Zeitleiste, 5
          Minuten): schreib die Satzanfänge an die Tafel (Zuerst habe ich … / Dann habe
          ich … / Danach habe ich … / Am Ende habe ich …). Schritt 2 (Partner, 6
          Minuten): keine langen Gespräche, das gibt Sicherheit und einen flüssigen
          Ablauf. Schritt 3 (Plenum, 4 Minuten): jeder sagt einen Satz über den Partner.
          Fokus auf die Reihenfolge, nicht auf Perfektion. Korrigiere nur Perfekt,
          Wortstellung und Zeitwörter. Lob und Bestätigung geben.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: ziele-und-projekte-vergangenheit-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: intro-he
        type: text
        lang: he
        text: בשיעור זה תרגלנו דיבור על מטרות ופרויקטים בעבר בגרמנית, בזמן Perfekt.
      - id: rules-ziele
        type: ruleSummary
        skill: Über Ziele sprechen (Perfekt)
        rules:
          - text: 'Wir sagen, was unser Ziel war, was wir dafür gemacht haben und ob wir es erreicht haben. Nach *Mein Ziel war es,* kommt **zu + Infinitiv** am Ende.'
            examples:
              [
                'Mein Ziel war es, Deutsch zu lernen.',
                Ich habe viel gelernt.,
                Ich habe es erreicht.,
              ]
          - text: 'Perfekt: Subjekt + **haben / sein** (Position 2) + … + **Partizip II** (am Ende).'
            examples: [Ich habe gelernt., Ich bin nach Hause gegangen.]
          - text: '**haben** bei den meisten Verben. **sein** bei Verben der Bewegung (gehen, fahren, kommen), bei einer Veränderung und bei *bleiben*.'
            examples: [Ich habe jeden Tag geübt., Ich bin motiviert geblieben.]
          - text: 'Partizip II: **ge- … -t** (gelernt, gemacht, geübt, gefeiert); **ge- … -en** (geholfen, geblieben). Verben mit *er-* und *ver-* haben kein *ge* (erreicht, versucht). Bei trennbaren Verben steht *ge* in der Mitte (aufgegeben, angemeldet).'
          - text: 'Über Gefühle in der Vergangenheit: **sich fühlen** → *Ich habe mich … gefühlt.*'
            examples: [Ich habe mich stolz gefühlt.]
          - text: '*sein* und *haben* benutzen wir in der Vergangenheit meistens im **Präteritum**: *war, hatte*.'
            examples:
              ['Mein Ziel war es, besser Deutsch zu sprechen.', Mein Partner war am Ende stolz.]
      - id: verbs-table
        type: table
        caption: Verben aus diesem Zyklus
        header: [Infinitiv, Perfekt]
        rows:
          - [lernen, hat gelernt]
          - [machen, hat gemacht]
          - [üben, hat geübt]
          - [arbeiten, hat gearbeitet]
          - [planen, hat geplant]
          - [feiern, hat gefeiert]
          - [erreichen, hat erreicht]
          - [versuchen, hat versucht]
          - [helfen, hat geholfen]
          - [aufgeben, hat aufgegeben]
          - [bleiben, ist geblieben]
          - [gehen, ist gegangen]
      - id: ziele-he
        type: text
        lang: he
        text: >-
          למדנו לומר מה הייתה המטרה שלנו, מה עשינו כדי להשיג אותה והאם הצלחנו. המבנה של
          Perfekt: נושא + haben / sein + Partizip II, והפועל העיקרי מגיע בסוף המשפט.
          ברוב הפעלים משתמשים ב־haben; עם פעלי תנועה, שינוי מצב ו־bleiben משתמשים
          ב־sein.
      - id: ziele-examples
        type: examples
        items:
          - { text: 'Mein Ziel war es, Deutsch zu lernen.', gloss: המטרה שלי הייתה ללמוד גרמנית }
          - { text: Ich habe viel gelernt., gloss: למדתי הרבה }
          - { text: Ich bin nach Hause gegangen., gloss: הלכתי הביתה }
          - { text: Ich habe mich stolz gefühlt., gloss: הרגשתי גאה }
      - id: rules-reihenfolge
        type: ruleSummary
        skill: Reihenfolge erzählen
        rules:
          - text: 'Zeitwörter in der Vergangenheit: **gestern, letzte Woche, letztes Wochenende**.'
            examples: [Letzte Woche habe ich viel geübt.]
          - text: 'Für die Reihenfolge: **zuerst → dann → danach → am Ende**. So erzählen wir, was wir zuerst gemacht haben, was danach kam und wie es geendet hat.'
          - text: 'Steht das Zeitwort am Anfang, kommt das Verb (*habe / bin*) auf **Position 2**, dann das Subjekt.'
            examples:
              - Zuerst habe ich mich für einen Deutschkurs angemeldet.
              - Dann habe ich jede Woche mit Mori geübt.
              - Danach habe ich Serien auf Deutsch geschaut.
              - Am Ende habe ich meine Prüfung bestanden.
      - id: reihenfolge-he
        type: text
        lang: he
        text: >-
          מילות זמן ורצף עוזרות לספר סיפור ברור ומסודר: מה עשינו קודם (zuerst), מה עשינו
          אחר כך (dann, danach) ואיך זה נגמר (am Ende). כשמילת הזמן בתחילת המשפט, הפועל
          (habe / bin) בא מיד אחריה, במקום השני.
      - id: recap-he
        type: text
        lang: he
        text: >-
          במהלך השיעור דיברנו על חוויות אמיתיות, הקשבנו לבני הזוג, הגבנו במשפטים קצרים
          ותרגלנו דיווח על אדם אחר. בקיצור: תרגלנו עבר Perfekt, דיברנו על מטרות
          והתקדמות, השתמשנו במילות זמן וחיזקנו את הביטחון בדיבור בגרמנית.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die zwei Fertigkeiten mit der Gruppe und bitte um ein neues Beispiel für jede Regel.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: ziele-und-projekte-vergangenheit-hausaufgaben
    title: Hausaufgaben mit Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben mit Mori
      - id: how
        type: text
        text: 'Ziel: Sprechen im Perfekt, mit sofortiger Korrektur und kurzer Erklärung. Öffne den Chat mit Mori, kopiere die Nachrichten eine nach der anderen und antworte in kurzen deutschen Sätzen.'
      - id: mori-1
        type: aiTutorPrompt
        title: 'Nachricht 1: Mein letztes Ziel'
        message: |-
          Hallo Mori! Ich möchte auf Deutsch über mein letztes Ziel sprechen.
          Bitte stell mir 4 einfache Fragen im Perfekt.
          Korrigiere meine Antworten und erkläre kurz, wenn ich Fehler mache.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Nachricht 2: Was ich für mein Ziel gemacht habe'
        message: |-
          Hallo Mori! Bitte frag mich, was ich gemacht habe, um mein Ziel zu erreichen.
          Stell mir 4 Fragen im Perfekt.
          Hilf mir, klare und kurze Sätze zu bilden.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Nachricht 3: Die Reihenfolge'
        message: |-
          Hallo Mori! Ich möchte üben, Schritte in der Vergangenheit zu erzählen.
          Bitte lass mich Sätze mit diesen Wörtern bilden: zuerst, dann, danach, am Ende.
          Korrigiere die Wortstellung in meinen Sätzen.
      - id: mori-4
        type: aiTutorPrompt
        title: 'Nachricht 4: Wie ich mich gefühlt habe'
        message: |-
          Hallo Mori! Ich möchte üben, über Gefühle in der Vergangenheit zu sprechen.
          Bitte frag mich, wie ich mich gefühlt habe, als ich an meinem Ziel gearbeitet habe oder als ich es erreicht habe.
          Korrigiere meinen Gebrauch von „haben“ und „sein“ und erkläre kurz.
      - id: mori-5
        type: aiTutorPrompt
        title: 'Nachricht 5: Über eine andere Person berichten'
        message: |-
          Hallo Mori! Ich möchte üben, über eine andere Person in der Vergangenheit zu sprechen.
          Bitte lass mich erzählen, was eine andere Person gemacht hat, um ein Ziel zu erreichen.
          Korrigiere meinen Gebrauch der 3. Person (er / sie).
      - id: mori-6
        type: aiTutorPrompt
        title: 'Nachricht 6: Wiederholung'
        message: |-
          Hallo Mori! Ich möchte das Perfekt wiederholen.
          Bitte stell mir Fragen über gestern, letzte Woche, Schritte in der richtigen Reihenfolge und Erfahrungen.
          Korrigiere mich immer sofort und erkläre kurz.
      - id: mori-7
        type: aiTutorPrompt
        title: 'Nachricht 7: Selbsttest'
        message: |-
          Hallo Mori! Ich schreibe jetzt 5 Sätze auf Deutsch im Perfekt.
          Bitte überprüfe:
          – haben / sein
          – Partizip II
          – Wortstellung
          Sag mir auch, was schon gut ist.
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: ziele-und-projekte-vergangenheit-uebung
    book: workbook
    title: 'Übung: Ziele und Projekte (Vergangenheit)'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Übe die zwei Fertigkeiten des Zyklus. Jede Antwort wird sofort korrigiert, und du kannst es noch einmal versuchen.
      - id: ex-perfekt
        type: activity
        activity: ziele-und-projekte-vergangenheit-perfekt
      - id: ex-reihenfolge
        type: activity
        activity: ziele-und-projekte-vergangenheit-reihenfolge

  # ── vocabulary ───────────────────────────────────────────────────────────
  - slug: ziele-und-projekte-vergangenheit-wortschatz
    title: Wortschatz
    phase: review
    blocks:
      - id: words
        type: vocabulary
        title: Wörter für Ziele und Projekte
        glossLang: he
        link: https://quizlet.com/br/1128894611/ziele-und-projekte-vergangenheit-flash-cards/
        items: &ziele-und-projekte-vergangenheit-words
          - { term: das Ziel, gloss: מטרה }
          - { term: der Fortschritt, gloss: התקדמות }
          - { term: der Erfolg, gloss: הצלחה }
          - { term: die Motivation, gloss: מוטיבציה }
          - { term: das Vorbild, gloss: מודל לחיקוי }
          - { term: die Hilfe, gloss: עזרה }
          - { term: der Plan, gloss: תוכנית }
          - { term: der Schritt, gloss: צעד }
          - { term: die Erfahrung, gloss: חוויה / ניסיון }
          - { term: die Vergangenheit, gloss: עבר }
          - { term: lernen (hat gelernt), gloss: ללמוד }
          - { term: machen (hat gemacht), gloss: לעשות }
          - { term: erreichen (hat erreicht), gloss: להשיג }
