vocabulary:
  - slug: ziele-und-projekte-vergangenheit
    title: 'Ziele und Projekte: Vergangenheit'
    items: *ziele-und-projekte-vergangenheit-words

activities:
  - slug: ziele-und-projekte-vergangenheit-perfekt
    title: 'Über Ziele sprechen: das Perfekt'
    minutes: 8
    items:
      - id: ziel-war
        type: multipleChoice
        prompt: Mein Ziel ___ es letztes Jahr, Deutsch zu lernen.
        options:
          - { text: war, correct: true }
          - {
              text: ist,
              feedback: '*letztes Jahr* ist Vergangenheit. *sein* in der Vergangenheit: *war*.',
            }
          - {
              text: hat,
              feedback: 'Wir sagen *Mein Ziel ist es / war es, … zu lernen*, mit *sein*: *war*.',
            }
      - id: ziel-erreicht
        type: fillBlank
        prompt: Ergänze das Partizip II von *erreichen*.
        text: Ich habe mein Ziel ___.
        blanks: [[erreicht]]
      - id: geholfen
        type: multipleChoice
        prompt: Quizlet hat mir ___, neue Wörter zu lernen.
        options:
          - { text: geholfen, correct: true }
          - {
              text: gehelft,
              feedback: '*helfen* ist unregelmäßig: Das Partizip II ist *geholfen*.',
            }
          - {
              text: helfen,
              feedback: 'Im Perfekt brauchen wir das Partizip II: *Es hat mir geholfen.*',
            }
      - id: partizip-paare
        type: matching
        prompt: Welches Partizip II passt?
        pairs:
          - [lernen, gelernt]
          - [üben, geübt]
          - [erreichen, erreicht]
          - [versuchen, versucht]
          - [helfen, geholfen]
      - id: bleiben-sein
        type: trueFalse
        prompt: '*bleiben* bildet das Perfekt mit *sein*: *Ich bin motiviert geblieben.*'
        answer: true
        feedback:
          correct: Richtig! *bleiben* → *ist geblieben*.
          incorrect: '*bleiben* bildet das Perfekt mit *sein*: *Ich bin motiviert geblieben.*'
      - id: gefuehlt
        type: fillBlank
        prompt: Ergänze *haben* oder *sein*.
        text: Ich ___ mich sehr stolz gefühlt.
        blanks: [[habe]]
      - id: falsch-bin-gelernt
        type: trueFalse
        prompt: 'Der Satz *Ich bin jeden Tag gelernt.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! *lernen* bildet das Perfekt mit *haben*: *Ich habe jeden Tag gelernt.*'
          incorrect: '*lernen* ist keine Bewegung: *Ich habe jeden Tag gelernt.*'
      - id: ordne-aufgegeben
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Ich habe nicht aufgegeben.

  - slug: ziele-und-projekte-vergangenheit-reihenfolge
    title: 'Reihenfolge: zuerst, dann, danach, am Ende'
    minutes: 8
    items:
      - id: satzteile
        type: matching
        prompt: Welche Teile passen zusammen?
        pairs:
          - [Zuerst habe ich mich, für einen Deutschkurs angemeldet.]
          - [Dann habe ich jede Woche, mit Mori geübt.]
          - [Danach habe ich Serien, auf Deutsch geschaut.]
          - [Am Ende habe ich meine Prüfung, bestanden.]
      - id: position-2
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Zuerst habe ich einen Plan gemacht., correct: true }
          - {
              text: Zuerst ich habe einen Plan gemacht.,
              feedback: 'Nach *zuerst* kommt das Verb auf Position 2: *Zuerst habe ich …*',
            }
          - {
              text: Zuerst habe ich gemacht einen Plan.,
              feedback: 'Das Partizip II steht am Ende: *Zuerst habe ich einen Plan gemacht.*',
            }
      - id: dann-geuebt
        type: fillBlank
        prompt: Ergänze das Perfekt von *üben*.
        text: Dann ___ ich jede Woche mit Mori ___.
        blanks: [[habe], [geübt, geuebt]]
      - id: regel-position
        type: trueFalse
        prompt: 'Nach *zuerst, dann, danach* und *am Ende* am Satzanfang steht das Verb (*habe / bin*) auf Position 2.'
        answer: true
        feedback:
          correct: 'Richtig! *Danach habe ich …, Am Ende bin ich …*'
          incorrect: 'Das Verb steht auf Position 2: *Dann habe ich jede Woche geübt.*'
      - id: am-ende
        type: multipleChoice
        prompt: ___ habe ich meine Prüfung bestanden. (Das ist der letzte Schritt.)
        options:
          - { text: Am Ende, correct: true }
          - {
              text: Zuerst,
              feedback: '*Zuerst* ist für den ersten Schritt. Für den letzten Schritt sagen wir *am Ende*.',
            }
          - {
              text: Dann,
              feedback: '*Dann* ist für einen Schritt in der Mitte. Für den letzten Schritt sagen wir *am Ende*.',
            }
      - id: war-zufrieden
        type: fillBlank
        prompt: Ergänze *sein* in der Vergangenheit (ein Wort).
        text: Am Ende ___ ich sehr zufrieden.
        blanks: [[war]]
      - id: danach-gegangen
        type: fillBlank
        prompt: Ergänze das Perfekt von *gehen*.
        text: Danach ___ ich nach Hause ___.
        blanks: [[bin], [gegangen]]
      - id: ordne-mori
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Danach habe ich mit Mori geübt.
