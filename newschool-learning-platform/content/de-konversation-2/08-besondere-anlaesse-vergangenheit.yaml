activities:
  - slug: besondere-anlaesse-vergangenheit-perfekt
    title: 'Perfekt: Ich habe gefeiert, ich bin gegangen'
    minutes: 8
    items:
      - id: habe-gefeiert
        type: multipleChoice
        prompt: Ich ___ meinen Geburtstag gefeiert.
        options:
          - { text: habe, correct: true }
          - { text: bin, feedback: '*feiern* bildet das Perfekt mit *haben*: *Ich habe gefeiert.*' }
          - {
              text: hat,
              feedback: '*hat* ist für *er / sie / es*. Für *ich* sagen wir *ich habe*.',
            }
