vocabulary:
  - slug: soziale-medien-zukunft
    title: Soziale Medien und die Zukunft
    items: *soziale-medien-zukunft-words

activities:
  - slug: soziale-medien-zukunft-werden
    title: 'Futur I: Ich werde mehr Fotos posten.'
    minutes: 8
    items:
      - id: er-wird
        type: multipleChoice
        prompt: Er ___ Fotos von seinem Hund posten.
        options:
          - { text: wird, correct: true }
          - { text: werde, feedback: '*werde* ist für *ich*. Für *er* sagen wir *er wird*.' }
          - { text: wirst, feedback: '*wirst* ist für *du*. Für *er* sagen wir *er wird*.' }
      - id: du-werden
        type: trueFalse
        prompt: 'Der Satz *Du werden mehr Videos sehen.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! Für *du* sagen wir *wirst*: *Du wirst mehr Videos sehen.*'
          incorrect: '*werden* ist für *wir* und *sie / Sie*. Für *du* sagen wir *du wirst*.'
      - id: werde-teilen
        type: fillBlank
        prompt: Ergänze *werden* und den Infinitiv von *teilen*.
        text: Am Freitag ___ ich ein Foto von meinem Wochenende ___.
        blanks: [[werde], [teilen]]
      - id: am-montag
        type: multipleChoice
        prompt: Am Montag ___
        options:
          - { text: werde ich Instagram nutzen., correct: true }
          - {
              text: ich werde Instagram nutzen.,
              feedback: 'Nach der Zeitangabe kommt zuerst *werden*, dann das Subjekt: *Am Montag werde ich …*',
            }
          - {
              text: werde ich nutzen Instagram.,
              feedback: 'Der Infinitiv steht am Ende: *Am Montag werde ich Instagram nutzen.*',
            }
      - id: fragen-antworten
        type: matching
        prompt: Welche Antwort passt zu welcher Frage?
        pairs:
          - [Welche App wirst du weniger nutzen?, Ich werde Facebook weniger nutzen.]
          - [Was wirst du dieses Jahr posten?, Ich werde Fotos von meinem Hund posten.]
          - [Welche Musik wirst du hören?, Ich werde Popmusik hören.]
          - [Wie wirst du ohne Apps kommunizieren?, Ich werde telefonieren.]
          - [Mit wem wirst du online sprechen?, Mit meinen Freunden.]
      - id: medien-werden
        type: fillBlank
        prompt: Ergänze die richtige Form von *werden*.
        text: Soziale Medien ___ in Zukunft schneller sein.
        blanks: [[werden]]
      - id: kinder-werden
        type: multipleChoice
        prompt: In Zukunft ___ Kinder weniger lesen als heute.
        options:
          - { text: werden, correct: true }
          - { text: wird, feedback: '*Kinder* ist Plural (*sie*): *Kinder werden*.' }
          - { text: werdet, feedback: '*werdet* ist für *ihr*. *Kinder* = *sie*: *Kinder werden*.' }
      - id: ordne-online
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Ich werde weniger online sein.

  - slug: soziale-medien-zukunft-vergleiche
    title: 'Komparativ und Superlativ: beliebter, am schnellsten'
    minutes: 8
    items:
      - id: beliebter
        type: multipleChoice
        prompt: TikTok ist ___ als Twitter.
        options:
          - { text: beliebter, correct: true }
          - {
              text: mehr beliebt,
              feedback: 'Im Deutschen sagen wir nicht *mehr* + Adjektiv. Alle Adjektive bekommen *-er*: *beliebter*.',
            }
          - {
              text: am beliebtesten,
              feedback: '*am beliebtesten* ist der Superlativ. Mit *als* brauchen wir den Komparativ: *beliebter als*.',
            }
      - id: schnellste
        type: multipleChoice
        prompt: TikTok ist die ___ App.
        options:
          - { text: schnellste, correct: true }
          - {
              text: schneller,
              feedback: 'Mit *die* + Adjektiv vergleichen wir drei oder mehr Dinge: *die schnellste App*.',
            }
          - { text: meisten schnell, feedback: 'Der Superlativ hat *-ste*: *die schnellste App*.' }
      - id: besser
        type: fillBlank
        prompt: Ergänze den Komparativ von *gut*.
        text: Mein neues Profil wird ___ sein als mein altes.
        blanks: [[besser]]
      - id: superlativ-paare
        type: matching
        prompt: Welcher Superlativ passt?
        pairs:
          - [schnell, am schnellsten]
          - [gut, am besten]
          - [sicher, am sichersten]
          - [groß, am größten]
          - [viel, am meisten]
      - id: lange-adjektive
        type: trueFalse
        prompt: 'Auch lange Adjektive bekommen im Komparativ *-er*: *interessant → interessanter*.'
        answer: true
        feedback:
          correct: Richtig! *interessanter, beliebter, nützlicher*.
          incorrect: 'Im Deutschen bekommen alle Adjektive *-er*, auch lange: *interessanter als*.'
      - id: weniger-als
        type: fillBlank
        prompt: Ergänze *weniger … als*.
        text: YouTube macht ___ süchtig ___ Instagram.
        blanks: [[weniger], [als]]
        wordBank: [weniger, als, wie, am]
      - id: am-meisten
        type: multipleChoice
        prompt: Wer wird ___ lernen? (viel)
        options:
          - { text: am meisten, correct: true }
          - {
              text: am mehr,
              feedback: '*mehr* ist der Komparativ. Der Superlativ von *viel* ist *am meisten*.',
            }
          - { text: am vielsten, feedback: '*viel* ist unregelmäßig: *viel → mehr → am meisten*.' }
      - id: ordne-instagram
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Instagram ist die beliebteste App.
