# Cycle "Soziale Medien und die Zukunft", converted from the German level 2 digital
# notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (German).
course: de-konversation-2
slug: soziale-medien-zukunft
title: Soziale Medien und die Zukunft
goal: Über soziale Medien sprechen, mit dem Futur I und mit Komparativ und Superlativ.
position: 9
status: published

review:
  - >-
    The two workbook exercises ("Futur I mit werden" and "Komparativ und Superlativ")
    are NEW: the notebook has no self-study exercises. They were written from the
    cycle's two skills, its summary, the activity examples and its vocabulary. Please
    check level, wording and every right answer before students see them.
  - >-
    Summary, werden: the notebook's table says "Du / Wir / Sie werden + Verb". "du
    werden" is wrong: the table is now ich werde, du wirst, er / sie / es wird, wir
    werden, ihr werdet, sie / Sie werden, with the infinitive at the end. The time word
    "nächster Monat" → "nächsten Monat" (accusative, as used in a sentence), and a rule
    was added that after a time word at the start, *werden* comes before the subject
    (Am Montag werde ich …).
  - >-
    Summary, comparisons (translated from English): the notebook says "mehr / weniger +
    adjective + als" and "-er + als for short adjectives". In German every adjective
    takes -er (interessanter, beliebter, nützlicher), and "mehr + adjective" is not
    correct; "weniger + adjective" is fine; mehr / weniger go before nouns (mehr
    Videos). Rewritten. Superlative: the notebook says "am meisten / am wenigsten +
    adjective" or "-ste for short adjectives". Rewritten as der / die / das +
    adjective + -ste (die schnellste App, die beste App) and am + adjective + -sten (am
    schnellsten); *am meisten / am wenigsten* are the superlatives of *viel / wenig*
    (Wer wird am meisten lernen?). Please confirm. The Activity 4 goal line was
    changed the same way.
  - >-
    The summary and the Mori homework are written in Hebrew in the notebook. The rules
    are given in simple German (ruleSummary) with Hebrew text blocks (lang he), and the
    Hebrew translations of the examples became an "examples" block with glosses. The
    Mori prompt was translated into a German message. Please check the German and the
    Hebrew.
  - >-
    Corrections: introduction "besser / schlechter / gleich gemacht" ("gleich
    gemacht" means "made equal") → "besser / schlechter gemacht" or "nicht verändert";
    Activity 4 "Meine Woche wird interessanter als deine!" → "… wird interessanter
    sein als deine!"; "Deine Woche wird der größte Spaß überhaupt!" → "Deine Woche
    wird die lustigste sein!"; "Wer wird die geringste Zeit online verbringen?" → "Wer
    wird am wenigsten Zeit online verbringen?"; Activity 5 "Soziale Medien werden die
    Welt verschlimmern" → "… die Welt schlechter machen" (simpler, matches group A);
    summary answer frames "Es ist mehr / weniger … als …" → "Es ist ___er / weniger ___
    als ___", "Es ist die …" → "Es ist die ___ste App.".
  - >-
    Activity 3 has two titles in the notebook ("Das soziale Netzwerk der Zukunft
    (Erfindung)" and "Die App der Zukunft"); the second is used. Activity 1 asks
    students to open real apps (Instagram, TikTok, YouTube, X) during class: please
    check this suits your group. The hashtags (#DeutschLernen #ZukunftOnline) were
    kept.
  - >-
    The "Antworten der Schüler 1/2/3" lines were removed (the platform has answer
    boxes); the model answers are kept under each question. The notebook says "Dauer:
    90 Minuten" (teacher note).
  - >-
    Vocabulary: nouns now carry their article (die App, die Plattform, das Profil, der
    Beitrag / der Post, das Video, das Foto / das Bild, die Zukunft, der Plan, die
    Meinung, das Problem, die Idee); "werden – יהיה / לעשות בעתיד" → "פועל עזר לעתיד
    (אני אעשה) / להפוך ל־"; "süchtig (machend) – ממכר" → "süchtig machen – לגרום
    להתמכרות (להיות ממכר)"; "Zukunft" → "die Zukunft / in Zukunft". "nächste Woche –
    שבוע הבא" → "בשבוע הבא". Added "nächstes Jahr – בשנה הבאה" (used in the summary).
    Please confirm.
  - >-
    Times given as ranges are recorded as the upper value (Activity 2 partner work
    5–7 → 7, presentations 3–5 → 5; Activity 3 20–25 → 25; Activity 5 preparation 4–5
    → 5, presentation 3–4 → 4). The Quizlet link lost its "?new" parameter.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: soziale-medien-zukunft-unterricht
    title: 'Unterricht: Soziale Medien und die Zukunft'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Soziale Medien und die Zukunft
      - id: skills
        type: cycleOverview
        skills:
          - name: Futur I mit werden
            description: '*ich werde* + Infinitiv (Pläne, Vorhersagen): *Ich werde mehr Fotos posten.*'
          - name: Komparativ und Superlativ
            description: '*beliebter als, weniger … als, die schnellste App, am meisten*'
      - id: quizlet
        type: externalLink
        label: Soziale Medien und die Zukunft auf Quizlet
        url: https://quizlet.com/br/1131168754/soziale-medien-und-die-zukunft-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Einführungsrunde
      - id: intro
        type: sentenceFrame
        prompt: Sag zwei Sätze. (Optional ein Satz mit *weil*.)
        frame: Ich bin ___. Ich denke, soziale Medien haben unser Leben besser / schlechter gemacht. / … haben unser Leben nicht verändert.
        example: Ich bin Sarah. Ich denke, soziale Medien haben unser Leben besser gemacht, weil man leichter mit Freunden sprechen kann.
      - id: warmup-title
        type: heading
        level: 3
        text: Vorbereitungsfragen
      - id: warmup
        type: discussionQuestions
        items:
          - question: Welche App wirst du in Zukunft weniger nutzen? Warum?
            frame: |-
              Ich werde ___ weniger nutzen, weil ___.
              *Modell: Ich werde Facebook weniger nutzen, weil es nicht mehr modern ist.*
          - question: Welche Probleme werden soziale Medien in den nächsten Jahren machen?
            frame: |-
              Sie werden ___.
              *Modell: Sie werden mehr Stress und weniger Zeit mit der Familie bringen.*
          - question: Welche Musik wirst du nach dem Unterricht hören?
            frame: |-
              Ich werde ___ hören.
              *Modell: Ich werde Popmusik hören.*
          - question: Was wirst du dieses Jahr posten? Warum?
            frame: |-
              Ich werde ___ posten, weil ___.
              *Modell: Ich werde Fotos von meinem Hund posten, weil er süß ist.*
          - question: Wie werden soziale Medien in 10 Jahren sein?
            frame: |-
              Sie werden ___ sein.
              *Modell: Sie werden schneller sein und mehr kurze Videos haben.*
          - question: Wenn morgen alle Apps schließen, wie wirst du kommunizieren?
            frame: |-
              Ich werde ___.
              *Modell: Ich werde telefonieren oder meine Freunde treffen.*
          - question: Was wirst du tun, um soziale Medien gesünder zu nutzen?
            frame: |-
              Ich werde ___.
              *Modell: Ich werde weniger online sein und mehr Zeit mit Freunden verbringen.*
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Sprachen lernen mit sozialen Medien'
        skills: [Futur I mit werden, Komparativ und Superlativ]
        steps:
          - Bildet Gruppen von 3–4 Personen. Jede Person öffnet eine Social-Media-App (Instagram, TikTok, YouTube, X).
          - Findet einen echten Beitrag auf Deutsch oder Englisch, der euch gefällt.
          - Schreibt **drei Sätze im Futur** über diesen Beitrag.
          - 'Vergleicht eure Sätze in der Gruppe: *Mein Beitrag wird nützlicher sein als deiner. Dein Video wird interessanter sein als meins.*'
          - Wählt gemeinsam den kreativsten Satz.
          - 'Präsentiert ihn vor der Klasse wie einen Social-Media-Post. Optional: Fügt Hashtags hinzu, zum Beispiel **#DeutschLernen #ZukunftOnline**.'
        example: |-
          *Ich werde diesem Account folgen, weil ich neue Wörter lernen möchte.*
          *Dieses Video wird interessanter sein als Fernsehen.*
          *In Zukunft werde ich hier viel lernen.*
      - id: act1-sentences
        type: discussionQuestions
        title: Drei Sätze über unseren Beitrag
        items:
          - question: Ich werde ___.
          - question: Dieses Video / Dieser Beitrag wird ___er sein als ___.
          - question: In Zukunft werde ich ___.
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Mein perfektes Profil'
        skills: [Futur I mit werden, Komparativ und Superlativ]
        minutes: 22
        steps:
          - 'Einzelarbeit (10 Minuten): Stell dir vor, du erstellst ein ganz neues Social-Media-Profil (nicht echt). Füll die Vorlage unten aus.'
          - Schreib mindestens 2 Vergleiche.
          - 'Partnerarbeit (7 Minuten): Zeig dein Profil deinem Partner / deiner Partnerin und vergleicht: *Dein Profil wird kreativer sein als meins. Meine App macht weniger süchtig als deine.*'
          - 'Stellt euch Fragen: *Warum diese App? Was wirst du zuerst posten? Wem wirst du folgen?*'
          - 'Kurzpräsentationen (5 Minuten): Einige präsentieren das Profil ihres Partners / ihrer Partnerin.'
        example: |-
          *Annas Profil wird auf LinkedIn sein, weil sie einen Job sucht.*
          *Davids Profil wird interessanter sein als sein altes.*
      - id: act2-profile
        type: discussionQuestions
        title: Mein Profil
        items:
          - question: Mein Profil wird auf ___ sein.
          - question: Ich werde mein Profil nutzen, um ___.
          - question: Diese Plattform ist besser, weil ___.
          - question: 'Drei Dinge über mich: ___'
          - question: In Zukunft werde ich ___ posten.
          - question: Ich werde ___ folgen.
      - id: act2-compare
        type: discussionQuestions
        title: Vergleiche (mindestens 2)
        items:
          - question: ___ ist besser als ___.
          - question: Mein neues Profil wird ___er sein als mein altes.
          - question: TikTok ist weniger ___ als YouTube.
          - question: Instagram ist die ___ste App.
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Die App der Zukunft'
        skills: [Futur I mit werden, Komparativ und Superlativ]
        minutes: 25
        steps:
          - 'Arbeitet in Gruppen (3–4). Erfindet eine App: Wie heißt sie? Was werden die Nutzer tun? Warum ist sie besser?'
          - 'Macht ein Poster: wofür die Leute die App benutzen werden, 3 Merkmale und 2 Vergleiche.'
          - Präsentiert eure App (1 Minute).
          - 'Abstimmung: die originellste · die nützlichste · die lustigste App.'
        example: '*Unsere App heißt VisionApp. Sie wird sicherer sein als Instagram und schneller als TikTok. Die Leute werden sie nutzen, um kurze Reisevideos zu teilen. Sie ist die nützlichste App für Reisende.*'
      - id: act3-poster
        type: discussionQuestions
        title: Unser Poster
        items:
          - question: 'Name der App: ___'
          - question: Die Leute werden sie benutzen, um ___.
          - question: 'Merkmale (3): ___'
          - question: Sie wird sicherer sein als ___.
          - question: Sie wird weniger süchtig machen als ___.
          - question: Sie ist die beste App für ___.
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Meine digitale Woche'
        skills: [Futur I mit werden, Komparativ und Superlativ]
        minutes: 15
        steps:
          - 'Einzelarbeit (5 Minuten): Schreib **mindestens 5 Sätze** über deine digitale Woche: Wochentag + *werden* + Verb. Kurze und einfache Sätze sind perfekt.'
          - 'Paarvergleich (5 Minuten): Vergleicht eure Pläne (Satzanfänge unten). Ziel: freundlicher Wettbewerb und viele Vergleiche.'
          - 'Mini-Interview (3 Minuten): Fragt euch gegenseitig: *Warum wirst du TikTok so viel nutzen? Was wirst du teilen? Mit wem wirst du online sprechen? Wo wirst du das veröffentlichen?* Stellt mindestens zwei Folgefragen.'
          - 'Kurze Gruppenpräsentation (2 Minuten): Einige berichten über ihren Partner / ihre Partnerin: *Anna wird mehr YouTube-Videos anschauen als ich. Carlos wird nächste Woche die meisten Fotos posten.*'
        example: |-
          *Am Montag werde ich Instagram nutzen, um die Nachrichten zu checken.*
          *Am Mittwoch werde ich mir ein Fußballvideo auf YouTube ansehen.*
          *Am Freitag werde ich ein Foto von meinem Wochenende teilen.*
      - id: act4-week
        type: discussionQuestions
        title: Meine digitale Woche
        items:
          - question: Am Montag werde ich ___ benutzen.
          - question: Am Dienstag werde ich mir ___ ansehen.
          - question: Am Mittwoch werde ich ___ tun.
          - question: Am Donnerstag werde ich ___ lernen.
          - question: Am Freitag werde ich etwas posten / teilen.
      - id: act4-compare
        type: discussionQuestions
        title: Vergleiche mit deinem Partner / deiner Partnerin
        items:
          - question: Ich werde ___ häufiger benutzen als du.
          - question: Du wirst ___ weniger sehen als ich.
          - question: Meine Woche wird interessanter sein als deine!
          - question: Deine Woche wird die lustigste sein!
      - id: act4-extra
        type: callout
        tone: info
        title: Wenn Zeit bleibt
        text: |-
          **A) Wettbewerb:** Die Klasse stimmt ab: Wer hat die digitalste Woche? Wer wird am meisten lernen? Wer wird am wenigsten Zeit online verbringen?
          **B) Gesunde Gewohnheiten:** Ein zusätzlicher Satz: *Am Sonntag werde ich eine Pause von den sozialen Medien machen.*
      - id: act5
        type: classActivity
        title: 'Aktivität 5: Werden soziale Medien die Welt verbessern?'
        skills: [Futur I mit werden, Komparativ und Superlativ]
        minutes: 13
        steps:
          - 'Die Klasse wird in zwei Gruppen geteilt (1 Minute). **Gruppe A:** *Soziale Medien werden die Welt besser machen.* **Gruppe B:** *Soziale Medien werden die Welt schlechter machen.*'
          - 'Vorbereitung (5 Minuten): Jede Gruppe schreibt **drei Zukunftssätze** für ihre Meinung (Satzanfänge unten).'
          - 'Präsentation (4 Minuten): Jede Gruppe liest ihre drei Sätze vor.'
          - 'Vergleiche (2 Minuten): Formuliert zusammen Vergleiche: *Gruppe A hat mehr positive Ideen als Gruppe B. Gruppe B hat stärkere Argumente als Gruppe A.*'
          - 'Abstimmung (1 Minute): Welche Gruppe hat die besten Argumente? Welche Gruppe war überzeugender?'
          - 'Kurze Reflexion: Welche Idee war am interessantesten?'
        example: |-
          *Soziale Medien werden Menschen näher zusammenbringen.*
          *Die Menschen werden mehr online sein als im echten Leben.*
          *In Zukunft werden Kinder weniger lesen als heute.*
      - id: act5-sentences
        type: discussionQuestions
        title: Unsere drei Zukunftssätze
        items:
          - question: Soziale Medien werden ___.
          - question: In Zukunft werden Menschen ___.
          - question: Sie werden mehr / weniger ___ als heute.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Dauer: 90 Minuten. Zwei Fertigkeiten in diesem Zyklus: **Futur I mit werden**
          (Pläne, Vorhersagen) und **Komparativ und Superlativ** (*beliebter als,
          weniger … als, die schnellste App, am meisten*). Alle Aktivitäten üben beide.
      - id: n-intro
        anchor: intro
        text: Gib zuerst dein eigenes Beispiel (Modell der Lehrkraft), dann ist jeder Schüler dran.
      - id: n-warmup
        anchor: warmup
        text: Stell jedem Schüler mindestens zwei Fragen. Die Modellantworten stehen unter jeder Frage.
      - id: n-act1
        anchor: act1
        text: Die Schüler brauchen ein Handy oder einen Computer mit einer Social-Media-App.
      - id: n-act2
        anchor: act2
        text: Einzelarbeit 10 Minuten, Partnerarbeit 7 Minuten, Kurzpräsentationen 5 Minuten.
      - id: n-act4
        anchor: act4
        text: >-
          Schreib die Satzanfänge und die Vergleichsrahmen an die Tafel. Zum Schluss
          hebst du gute Beispiele von *werden* und Vergleichen hervor.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: soziale-medien-zukunft-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: rules-werden
        type: ruleSummary
        skill: Futur I mit werden
        rules:
          - text: 'Über die Zukunft (Pläne, Vorhersagen) sprechen wir mit **werden** + Infinitiv. *werden* steht an Position 2, der Infinitiv **am Ende**.'
            examples:
              [
                Ich **werde** dieses Wochenende ein neues Foto **posten**.,
                Sie **wird** künftig mehr Kochseiten **folgen**.,
                Soziale Medien **werden** in Zukunft schneller **sein**.,
              ]
          - text: 'Steht eine Zeitangabe am Anfang, kommt danach *werden*, dann das Subjekt.'
            examples:
              [
                Am Montag **werde ich** Instagram nutzen.,
                Nächste Woche **wird sie** mehr Videos sehen.,
              ]
          - text: 'Zeitangaben für die Zukunft:'
            examples:
              - 'morgen, heute Abend, nächste Woche, nächsten Monat, nächstes Jahr, in Zukunft, am Montag, am Freitag'
      - id: werden-table
        type: table
        caption: werden
        header: [Person, werden]
        rows:
          - [ich, werde]
          - [du, wirst]
          - [er / sie / es, wird]
          - [wir, werden]
          - [ihr, werdet]
          - [sie / Sie, werden]
      - id: rules-vergleiche
        type: ruleSummary
        skill: Komparativ und Superlativ
        rules:
          - text: 'Zwei Dinge vergleichen: Adjektiv + **-er** + **als**. Das gilt für **alle** Adjektive, auch für lange (*interessanter, beliebter*). Unregelmäßig: *gut → besser*, *viel → mehr*. Nicht: *mehr beliebt*.'
            examples:
              [
                TikTok ist **beliebter als** Twitter.,
                Mein Profil wird **besser** sein **als** mein altes.,
              ]
          - text: '**weniger** + Adjektiv + **als**. Vor einem Nomen: **mehr / weniger** + Nomen + **als**.'
            examples:
              [
                YouTube macht **weniger süchtig als** Instagram.,
                Sie werden **mehr kurze Videos** haben.,
              ]
          - text: 'Drei oder mehr Dinge vergleichen (Superlativ): **der / die / das** + Adjektiv + **-ste**, oder **am** + Adjektiv + **-sten**. Unregelmäßig: *gut → die beste / am besten*.'
            examples:
              [
                TikTok ist **die schnellste** App.,
                Instagram ist **die visuellste** Social-Media-App.,
                Facebook ist **die unbeliebteste** App in meiner Familie.,
                TikTok ist **am schnellsten**.,
              ]
          - text: '**am meisten / am wenigsten** sind der Superlativ von *viel / wenig*.'
            examples:
              [Wer wird **am meisten** lernen?, Wer wird **am wenigsten** Zeit online verbringen?]
          - text: 'Nützliche Adjektive:'
            examples:
              - 'beliebt, interessant, sicher, unterhaltsam, kreativ, nützlich, schnell, positiv'
      - id: steigerung-table
        type: table
        caption: Komparativ und Superlativ
        header: [Adjektiv, Komparativ, Superlativ]
        rows:
          - [schnell, schneller, am schnellsten / die schnellste]
          - [sicher, sicherer, am sichersten / die sicherste]
          - [einfach, einfacher, am einfachsten / die einfachste]
          - [lustig, lustiger, am lustigsten / die lustigste]
          - [groß, größer, am größten / die größte]
          - [gut, besser, am besten / die beste]
          - [viel, mehr, am meisten / die meisten]
      - id: rules-fragen
        type: ruleSummary
        skill: Fragen und Antworten
        rules:
          - text: 'Fragen über die Zukunft und Meinungen, und Antwortrahmen:'
            examples:
              [
                Was wirst du dieses Jahr posten? – Ich werde ___ posten.,
                Welche App wirst du weniger nutzen? – Ich werde ___ weniger nutzen.,
                Warum macht TikTok mehr Spaß als YouTube? – Es ist ___er / weniger ___ als ___.,
                Welche App ist am nützlichsten? – Es ist die ___ste App.,
              ]
      - id: summary-he
        type: text
        lang: he
        text: >-
          על העתיד מדברים עם werden + פועל בצורת המקור בסוף המשפט: ich werde, du wirst,
          er / sie / es wird, wir werden, ihr werdet, sie / Sie werden. כשמשווים בין שני
          דברים מוסיפים לכל תואר – גם לתואר ארוך – את הסיומת ‎-er ואחריו als (beliebter
          als); בגרמנית לא אומרים mehr לפני תואר, אבל weniger לפני תואר אפשר (weniger
          süchtig als). כשמשווים בין שלושה דברים או יותר: die + תואר + ‎-ste (die
          schnellste App) או am + תואר + ‎-sten (am schnellsten). am meisten / am
          wenigsten הם "הכי הרבה" / "הכי מעט".
      - id: summary-examples
        type: examples
        items:
          - {
              text: Ich werde dieses Wochenende ein neues Foto posten.,
              gloss: אני אעלה תמונה חדשה בסוף השבוע.,
            }
          - {
              text: Sie wird künftig mehr Kochseiten folgen.,
              gloss: היא תעקוב בעתיד אחרי יותר עמודי בישול.,
            }
          - {
              text: Soziale Medien werden in Zukunft schneller sein.,
              gloss: הרשתות החברתיות יהיו מהירות יותר בעתיד.,
            }
          - { text: TikTok ist beliebter als Twitter., gloss: טיקטוק פופולרית יותר מטוויטר. }
          - {
              text: YouTube macht weniger süchtig als Instagram.,
              gloss: יוטיוב פחות ממכר מאינסטגרם.,
            }
          - {
              text: Mein Profil wird besser sein als mein altes.,
              gloss: הפרופיל החדש שלי יהיה טוב יותר מהישן.,
            }
          - {
              text: Instagram ist die visuellste Social-Media-App.,
              gloss: אינסטגרם היא האפליקציה הכי ויזואלית.,
            }
          - {
              text: Facebook ist die unbeliebteste App in meiner Familie.,
              gloss: פייסבוק היא האפליקציה הכי פחות פופולרית במשפחה שלי.,
            }
          - { text: TikTok ist die schnellste App., gloss: טיקטוק היא האפליקציה הכי מהירה. }
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die zwei Fertigkeiten mit der Gruppe und bitte um ein neues Beispiel für jede Regel.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: soziale-medien-zukunft-hausaufgaben
    title: Hausaufgaben mit Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben mit Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere die Nachricht und schick sie ab. Mori stellt dir Fragen; beantworte alle.
      - id: mori
        type: aiTutorPrompt
        title: Soziale Medien und die Zukunft
        message: |-
          Hallo Mori! Du bist mein Deutschlehrer auf Niveau A2.
          Bitte stell mir kurze, klare Fragen auf Deutsch zu diesen Themen:
          1. Futur mit „werden“: Frag mich, welche App ich weniger nutzen werde, welche Musik ich nach dem Unterricht hören werde und was ich dieses Jahr posten werde. Bitte mich, einen Satz mit „In Zukunft werde ich …“ zu ergänzen.
          2. Vergleiche: Bitte mich, zwei Apps mit „mehr / weniger … als“ oder mit „-er … als“ zu vergleichen. Frag mich, welche App für mich am nützlichsten ist. Bitte mich, YouTube und TikTok zu vergleichen.
          3. Kreativität: Bitte mich, eine App der Zukunft zu erfinden und zu beschreiben. Frag mich, warum sie besser sein wird als die Apps von heute.
          Nach jeder Antwort:
          – Wenn es einen Fehler gibt, korrigiere mich freundlich.
          – Gib mir einen richtigen Modellsatz.
          – Stell sofort die nächste Frage.
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**

