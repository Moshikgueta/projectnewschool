        title: Wörter für das Wochenende
        glossLang: he
        link: https://quizlet.com/br/1127415756/wochenendplane-flash-cards/
        items: &wochenendplaene-words
          - { term: werden, gloss: 'פועל עזר לעתיד (גם: להיות / להפוך ל־)' }
          - { term: bleiben, gloss: להישאר }
          - { term: gehen, gloss: ללכת }
          - { term: treffen, gloss: לפגוש }
          - { term: arbeiten, gloss: לעבוד }
          - { term: essen, gloss: לאכול }
          - { term: lernen, gloss: ללמוד }
          - { term: sich entspannen, gloss: להירגע }
          - { term: reisen, gloss: לטייל / לנסוע }
          - { term: besuchen, gloss: לבקר }
          - { term: sollen / sollte, gloss: צריך / כדאי (המלצה) }
          - { term: können, gloss: יכול / אפשר }
          - { term: müssen, gloss: חייב }
          - { term: das Wochenende, gloss: סוף שבוע }
