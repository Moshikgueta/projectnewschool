vocabulary:
  - slug: wochenendplaene
    title: Wochenendpläne
    items: *wochenendplaene-words

activities:
  - slug: wochenendplaene-futur
    title: 'Futur I: werden + Infinitiv'
    minutes: 8
    items:
      - id: werde-bleiben
        type: multipleChoice
        prompt: Dieses Wochenende ___ ich zu Hause bleiben.
        options:
          - { text: werde, correct: true }
          - { text: wird, feedback: '*wird* ist für *er / sie*. Für *ich* sagen wir *werde*.' }
          - { text: wirst, feedback: '*wirst* ist für *du*. Für *ich* sagen wir *werde*.' }
      - id: wirst-werde
        type: fillBlank
        prompt: Ergänze die richtige Form von *werden*.
        text: Was ___ du am Samstag machen? — Ich ___ Freunde treffen.
        blanks: [[wirst], [werde]]
        wordBank: [werde, wirst, wird, werden]
      - id: werden-formen
        type: matching
        prompt: Welche Form von *werden* passt?
        pairs:
          - [ich, werde]
          - [du, wirst]
          - [er / sie, wird]
          - [wir, werden]
      - id: infinitiv-ende
        type: trueFalse
        prompt: 'Im Satz *Am Samstag werde ich Freunde treffen.* steht das Verb *treffen* am Satzende.'
        answer: true
        feedback:
          correct: Richtig! *werden* steht auf Position 2, der Infinitiv am Ende.
          incorrect: 'Doch: Der Infinitiv (*treffen*) steht im Futur I immer am Satzende.'
      - id: richtiger-satz
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Am Sonntag werde ich einen Film sehen., correct: true }
          - {
              text: Am Sonntag ich werde einen Film sehen.,
              feedback: '*werden* steht auf Position 2, direkt nach *Am Sonntag*: *Am Sonntag werde ich …*',
            }
          - {
              text: Am Sonntag werde ich sehen einen Film.,
              feedback: 'Der Infinitiv steht am Satzende: *… einen Film sehen.*',
            }
      - id: bruder-wird
        type: fillBlank
        prompt: Ergänze die richtige Form von *werden*.
        text: Mein Bruder ___ am Samstag arbeiten.
        blanks: [[wird]]
      - id: solltest
        type: multipleChoice
        prompt: 'Eine Empfehlung: Am Freitag ___ du das Museum besuchen.'
        options:
          - { text: solltest, correct: true }
          - {
              text: musst,
              feedback: '*musst* bedeutet: Das ist nötig. Für eine Empfehlung sagen wir *solltest*.',
            }
          - {
              text: wirst sollen,
              feedback: 'Für eine Empfehlung brauchen wir kein *werden*: *Du solltest das Museum besuchen.*',
            }
      - id: ordne-frage
        type: reorderSentence
        prompt: Ordne die Wörter zu einer Frage.
        sentence: Was wirst du am Wochenende machen?

  - slug: wochenendplaene-vergleiche
    title: 'Vergleiche: besser als, so … wie, am besten'
    minutes: 8
    items:
      - id: interessanter
        type: multipleChoice
        prompt: Ein Wochenende auf Reisen ist ___ als ein Wochenende zu Hause.
        options:
          - { text: interessanter, correct: true }
          - {
              text: mehr interessant,
              feedback: 'Im Deutschen bilden wir den Komparativ mit *-er*: *interessanter als*.',
            }
          - {
              text: interessant,
              feedback: 'Vor *als* brauchen wir den Komparativ: *interessanter als*.',
            }
      - id: besser
        type: fillBlank
        prompt: Schreib den Komparativ von *gut*.
        text: Für mich ist dieses Wochenende ___ als das letzte.
        blanks: [[besser]]
      - id: entspannender
        type: fillBlank
        prompt: Schreib den Komparativ von *entspannend*.
        text: Aktivitäten am Abend sind ___ als Aktivitäten am Morgen.
        blanks: [[entspannender]]
      - id: genauso-wie
        type: multipleChoice
        prompt: Aktivitäten draußen sind genauso gut ___ Aktivitäten drinnen.
        options:
          - { text: wie, correct: true }
          - {
              text: als,
              feedback: 'Wenn zwei Dinge gleich sind, sagen wir *so / genauso … wie*. *als* steht nach dem Komparativ (*besser als*).',
            }
          - { text: dann, feedback: 'Wenn zwei Dinge gleich sind, sagen wir *so / genauso … wie*.' }
      - id: komparativ-als
        type: trueFalse
        prompt: 'Nach einem Komparativ (*besser, schöner*) kommt *als*: *besser als*.'
        answer: true
        feedback:
          correct: 'Richtig! *Dieses Wochenende ist besser als das letzte.*'
          incorrect: 'Doch: Komparativ + *als*: *besser als, entspannender als*.'
      - id: komparativ-paare
        type: matching
        prompt: Welcher Komparativ passt zu welchem Adjektiv?
        pairs:
          - [gut, besser]
          - [schlecht, schlechter]
          - [interessant, interessanter]
          - [lustig, lustiger]
          - [entspannend, entspannender]
      - id: am-lustigsten
        type: multipleChoice
        prompt: Der Samstag war ___.
        options:
          - { text: am lustigsten, correct: true }
          - {
              text: am lustigste,
              feedback: 'Nach *am* endet der Superlativ auf *-sten*: *am lustigsten*.',
            }
          - {
              text: mehr lustig,
              feedback: 'Im Deutschen sagen wir nicht *mehr lustig*. Der Superlativ ist *am lustigsten*.',
            }
      - id: mehr-spass
        type: fillBlank
        prompt: Ergänze *mehr* oder *weniger*.
        text: Mein Plan macht ___ Spaß als dein Plan, denn dein Plan ist langweilig.
        blanks: [[mehr]]
        wordBank: [mehr, weniger]
