          - { term: wohin, gloss: לאן }
          - { term: wann, gloss: מתי }
          - { term: mit wem, gloss: עם מי }
          - { term: danach, gloss: אחרי זה }
          - { term: zu Hause, gloss: בבית }
          - { term: dort, gloss: שם }
          - { term: nach, gloss: ל־ / אל }
          - { term: im, gloss: ב־ (ב + ה־) }

vocabulary:
  - slug: mein-leben-in-der-vergangenheit
    title: Mein Leben in der Vergangenheit
    items: *mein-leben-in-der-vergangenheit-words

activities:
  - slug: mein-leben-in-der-vergangenheit-perfekt
    title: 'Perfekt mit haben / sein'
    minutes: 8
    items:
      - id: habe-gegessen
        type: multipleChoice
        prompt: Gestern ___ ich Pizza gegessen.
        options:
          - { text: habe, correct: true }
          - {
              text: bin,
              feedback: '*essen* ist kein Verb der Bewegung: Wir sagen *Ich habe gegessen*.',
            }
          - { text: hat, feedback: '*hat* ist für *er / sie*. Für *ich* sagen wir *habe*.' }
      - id: ist-gefahren
        type: multipleChoice
        prompt: Am Samstag ___ sie nach Berlin gefahren.
        options:
          - { text: ist, correct: true }
          - {
              text: hat,
              feedback: '*fahren* ist ein Verb der Bewegung: Das Perfekt bilden wir mit *sein*: *sie ist gefahren*.',
            }
          - { text: bin, feedback: '*bin* ist für *ich*. Für *sie* (eine Frau) sagen wir *ist*.' }
      - id: haben-sind
        type: fillBlank
        prompt: Ergänze *haben* oder *sind*.
        text: Wir ___ gestern Freunde getroffen. Dann ___ wir nach Hause gegangen.
        blanks: [[haben], [sind]]
        wordBank: [haben, sind]
      - id: partizip-ende
        type: trueFalse
        prompt: 'Der Satz *Ich habe gearbeitet gestern.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! Das Partizip II steht am Satzende: *Ich habe gestern gearbeitet.*'
          incorrect: 'Das Partizip II steht immer am Satzende: *Ich habe gestern gearbeitet.*'
      - id: frage-gegessen
        type: multipleChoice
        prompt: 'Antwort: *Ich habe gestern Abend Pizza gegessen.* Welche Frage passt?'
        options:
          - { text: Was hast du gestern Abend gegessen?, correct: true }
          - {
              text: Was du hast gestern Abend gegessen?,
              feedback: 'In einer W-Frage steht *hast* direkt nach dem Fragewort (Position 2): *Was hast du …?*',
            }
          - {
              text: Was hast du gegessen gestern Abend?,
              feedback: 'Das Partizip II steht am Ende: *Was hast du gestern Abend gegessen?*',
            }
      - id: frage-antwort
        type: matching
        prompt: Welche Antwort passt zu welcher Frage?
        pairs:
          - [Wohin bist du gefahren?, Ich bin nach Berlin gefahren.]
          - [Wen hast du getroffen?, Ich habe meine Freunde getroffen.]
          - [Mit wem hast du gesprochen?, Ich habe mit meiner Mutter gesprochen.]
          - [Was hast du gekauft?, Ich habe Brot gekauft.]
          - [Wann bist du aufgestanden?, Ich bin um 7 Uhr aufgestanden.]
      - id: bericht-partner
        type: fillBlank
        prompt: 'Bericht über deinen Partner (3. Person): Ergänze *ist* oder *hat*.'
        text: Mein Partner ___ in Haifa geboren und ___ gestern Nudeln gegessen.
        blanks: [[ist], [hat]]
        wordBank: [ist, hat]
      - id: ordne-frage
        type: reorderSentence
        prompt: Ordne die Wörter zu einer Frage.
        sentence: Was hast du gestern gemacht?

  - slug: mein-leben-in-der-vergangenheit-partizip
    title: Unregelmäßige Verben im Perfekt
    minutes: 8
    items:
      - id: partizip-paare
        type: matching
        prompt: Welches Partizip II passt zu welchem Verb?
        pairs:
          - [gehen, gegangen]
          - [essen, gegessen]
          - [sehen, gesehen]
          - [treffen, getroffen]
          - [sprechen, gesprochen]
      - id: gesehen
        type: multipleChoice
        prompt: Ich habe letzte Woche einen Film ___.
        options:
          - { text: gesehen, correct: true }
          - {
              text: gesieht,
              feedback: '*sehen* ist unregelmäßig: Das Partizip II endet auf *-en*: *gesehen*.',
            }
          - {
              text: sehen,
              feedback: '*sehen* ist der Infinitiv. Im Perfekt brauchen wir das Partizip II: *gesehen*.',
            }
      - id: getrunken
        type: fillBlank
        prompt: Schreib das Partizip II von *trinken*.
        text: Danach habe ich Kaffee ___.
        blanks: [[getrunken]]
      - id: gekommen
        type: fillBlank
        prompt: Schreib das Partizip II von *kommen*.
        text: Wir sind am Wochenende nach Hause ___.
        blanks: [[gekommen]]
      - id: gemacht
        type: trueFalse
        prompt: 'Das Partizip II von *machen* ist *gemacht*.'
        answer: true
        feedback:
          correct: 'Richtig! *machen* ist regelmäßig: *ge-* + *mach* + *-t*.'
          incorrect: '*machen* ist regelmäßig: *ge-* + Stamm + *-t* = *gemacht*.'
      - id: aufgestanden
        type: multipleChoice
        prompt: Ich bin gestern um 7 Uhr ___.
        options:
          - { text: aufgestanden, correct: true }
          - {
              text: geaufstanden,
              feedback: 'Bei trennbaren Verben steht *-ge-* in der Mitte: *auf-ge-standen*.',
            }
          - { text: aufgesteht, feedback: '*stehen* ist unregelmäßig: *aufgestanden*.' }
      - id: fahren-haben
        type: trueFalse
        prompt: 'Der Satz *Ich habe nach Berlin gefahren.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! *fahren* ist ein Verb der Bewegung: *Ich bin nach Berlin gefahren.*'
          incorrect: 'Verben der Bewegung bilden das Perfekt mit *sein*: *Ich bin nach Berlin gefahren.*'
      - id: gesprochen
        type: fillBlank
        prompt: Schreib das Partizip II von *sprechen*.
        text: Sie hat gestern mit ihrer Mutter ___.
        blanks: [[gesprochen]]
