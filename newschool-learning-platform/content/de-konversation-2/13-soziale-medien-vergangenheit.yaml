# Cycle "Soziale Medien – Die Vergangenheit", converted from the German level 2 digital
# notebook ("Conversational German - Digital Notebook", docs/CONTENT-AUDIT.md).
# DRAFT for teacher review: see `review` below.
# Blocks without `lang` are in the course language (German).
course: de-konversation-2
slug: soziale-medien-vergangenheit
title: Soziale Medien – Die Vergangenheit
goal: Im Perfekt über soziale Medien erzählen und Apps und Erlebnisse vergleichen.
position: 13
status: in_review

review:
  - >-
    The two workbook exercises ("Perfekt" and "Vergleiche") are NEW: the notebook has no
    self-study exercises. They were written from the cycle's two skills, its summary,
    the activity examples and its vocabulary. Please check level, wording and every
    right answer before students see them.
  - >-
    The notebook lists three grammar points (Perfekt; Vergleiche; asking and answering
    questions in the past). The cycle overview uses two skills, "Perfekt" and
    "Vergleiche"; questions in the Perfekt are practised inside both (warm-up and the
    interviews in Activities 1 and 3).
  - >-
    Summary, Vergleiche: the notebook lists only "mehr … als / weniger … als / am
    meisten / am wenigsten", but its own examples use the comparative with -er
    (interessanter als, nützlicher als) and the superlative am …-sten (am
    beliebtesten). The rule was rewritten for German: adjective + -er + als (not "mehr
    interessant"), am + adjective + -(e)sten, "weniger + adjective + als", and "mehr /
    weniger / am meisten" with verbs and nouns. Umlaut in short adjectives (groß →
    größer) and the irregular forms gut → besser → am besten, viel → mehr → am meisten
    were added (the workbook uses them). Please confirm.
  - >-
    Summary, Perfekt: rule added that verbs with be-, ver-, er- (and -ieren) take no ge-
    in the Partizip II (benutzt, bekommen, eröffnet), because the cycle uses these verbs
    a lot. "gehen, kommen, werden, bleiben" are now described as verbs of movement or
    change of state, plus bleiben and sein. The Hebrew summary is kept as Hebrew text
    blocks (lang he) next to the German rules; please check the Hebrew.
  - >-
    Corrections: Activity 2 frame "Dein Video war das Interessanteste." → "Dein Video
    war am interessantesten." (matches the summary rule; with an implied noun it would
    be lowercase "das interessanteste"); Activity 3 "Die Leute schrieben: „Super!“"
    (Präteritum) → "Die Leute haben „Super!“ geschrieben." (Perfekt, the cycle's
    tense); "B = Influencer (oder er selbst)" → "B = Influencer (oder spielt sich
    selbst)"; Activity 4 "Gruppe B liest einen Gegensatz" → "einen Satz dagegen";
    "Vergangenheit (haben / waren)" → "Vergangenheit (Perfekt oder war / waren)";
    "einen Vergleich (mehr / weniger … als)" → "(… -er als, mehr / weniger … als)".
  - >-
    The extra part "שיעורי בית – אקסטרה: Mein Social-Media-Post der Woche" describes a
    5–7 minute in-class closing task (write a short post, then read one sentence), so it
    is Activity 5 ("Abschluss") in the class section, with a teacher note that it can
    also be given as homework. Its Hebrew instructions were translated into German.
  - >-
    The six Mori prompts are written in Hebrew in the notebook ("copy and send as they
    are; instructions in Hebrew, examples in German"). They were translated into German
    messages; the German example answers are kept as the intro of each prompt. Please
    check that this matches how students use Mori in this course. The tips callout was
    added from the course pattern.
  - >-
    Vocabulary: the Perfekt verbs were listed as bare participles with "I" glosses
    ("benutzt – השתמשתי"); they now read "ich habe … benutzt – השתמשתי" so term and
    gloss match. "komisch – מוזר" → "מוזר / מצחיק"; "der Post" now also gives "der
    Beitrag" (used in the activities). The Hebrew headings of the word lists were
    dropped. Please confirm.
  - >-
    Times: Activity 2 (15–18) → 18, Activity 3 (18–20) → 20, Activity 4 (15–20) → 20;
    the step times are in teacher notes. The Quizlet link lost its "?new" parameter.
    The "Schüler 1/2/3" answer lines are replaced by the answer boxes. There is no
    beginner / intermediate split in this cycle.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: soziale-medien-vergangenheit-unterricht
    title: 'Unterricht: Soziale Medien – Die Vergangenheit'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Soziale Medien – Die Vergangenheit
      - id: skills
        type: cycleOverview
        skills:
          - name: Perfekt
            description: '*haben / sein* + Partizip II: *Ich habe ein Foto gepostet. Ich bin online gegangen.*'
          - name: Vergleiche
            description: '*interessanter als, weniger … als, mehr als, am meisten, am beliebtesten*'
      - id: quizlet
        type: externalLink
        label: Soziale Medien – Vergangenheit auf Quizlet
        url: https://quizlet.com/il/1131228299/soziale-medien-die-vergangenheit-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Vorstellungsrunde
      - id: intro
        type: sentenceFrame
        frame: Ich bin ___. Gestern habe ich ___ benutzt.
        example: Ich bin Marta. Gestern habe ich Instagram benutzt. Das letzte Foto, das ich gepostet habe, war von meinem Hund.
      - id: warmup-title
        type: heading
        level: 3
        text: Aufwärmfragen
      - id: warmup-how
        type: text
        text: Antworte in ganzen Sätzen im Perfekt.
      - id: warmup
        type: discussionQuestions
        items:
          - question: Welche App hast du gestern benutzt? Warum?
            frame: Gestern habe ich ___ benutzt, weil ich ___ habe.
          - question: Was war das letzte Foto oder Video, das du gepostet hast?
            frame: Das letzte Foto, das ich gepostet habe, war von ___.
          - question: Welche Musik hast du letzte Woche gehört?
            frame: Letzte Woche habe ich ___ auf ___ gehört.
          - question: Welcher Beitrag hat dich am meisten interessiert? Wo hast du ihn gesehen?
            frame: Ich habe ___ auf ___ gesehen. Es war ___.
          - question: Welche App hast du letztes Jahr häufiger genutzt? Welche weniger?
            frame: Letztes Jahr habe ich ___ häufiger genutzt als ___.
          - question: Hattest du schon mal ein lustiges oder seltsames Erlebnis online?
            frame: Ein Freund hat mich ___. / Ich habe ___.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Mein Social-Media-Tag'
        skills: [Perfekt, Vergleiche]
        minutes: 15
        steps:
          - 'Schreiben: Schreib vier Sätze über gestern (unten).'
          - 'Paarinterview: Stell deinem Partner / deiner Partnerin mindestens 3 Fragen. Antwortet in ganzen Sätzen und benutzt einen Vergleich.'
          - 'Fragen: Was hast du gepostet? Was hast du gesehen? Mit wem hast du gesprochen? Welche App war interessanter? Hat es dir Spaß gemacht?'
          - 'Berichten: Sag der Gruppe einen Satz über deinen Partner / deine Partnerin.'
        example: |-
          *Gestern habe ich Instagram benutzt. Ich habe mir Kochvideos angesehen. Mir hat ein Beitrag über Reisen gefallen. Mir hat die Werbung nicht gefallen.*
          *TikTok war interessanter als YouTube.*
          *Mein Partner hat gestern Instagram benutzt. Er hat lustige Videos gesehen. TikTok war für ihn interessanter als YouTube.*
      - id: act1-sentences
        type: discussionQuestions
        title: Mein Tag gestern
        items:
          - question: Gestern habe ich ___ benutzt.
          - question: Ich habe ___ gesehen / gepostet.
          - question: Mir hat ___ gefallen.
          - question: Mir hat ___ nicht gefallen.
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Meine digitale Zeitleiste'
        skills: [Perfekt, Vergleiche]
        minutes: 18
        steps:
          - Zeichne eine Linie und schreib 3 Momente aus dem letzten Jahr.
          - 'Hilfsfragen: Wann hast du dein Konto eröffnet? Wann hast du etwas Wichtiges gepostet? Wann hast du viele Likes bekommen?'
          - Vergleiche deine Zeitleiste mit der Zeitleiste von deinem Partner / deiner Partnerin.
          - 'Kurze Fragen: Welcher Moment war am aufregendsten? Welche App war nützlicher?'
        example: |-
          *Im Januar habe ich mein Profil eröffnet. Im März habe ich mein erstes Video gepostet. Im August habe ich hundert Likes bekommen.*
          *Mein erster Beitrag war beliebter als deiner. Du hast weniger Likes bekommen als ich. Ich habe Instagram häufiger genutzt als du. Dein Video war am interessantesten.*
        wordBank: [gepostet, gesehen, geteilt, bekommen, eröffnet, gefolgt]
      - id: act2-timeline
        type: discussionQuestions
        title: Meine Zeitleiste
        items:
          - question: 'Moment 1: Im ___ habe ich ___.'
          - question: 'Moment 2: Im ___ habe ich ___.'
          - question: 'Moment 3: Im ___ habe ich ___.'
          - question: 'Vergleich: Mein ___ war ___ als deiner. / Ich habe ___ häufiger genutzt als du.'
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Interview – Erinnerungen'
        skills: [Perfekt, Vergleiche]
        minutes: 20
        steps:
          - 'Rollen: A ist Journalist / Journalistin. B ist Influencer / Influencerin (oder spielt sich selbst).'
          - A stellt die Fragen unten. B antwortet in ganzen Sätzen.
          - Tauscht die Rollen.
          - Präsentiert kurz im Plenum, was ihr erfahren habt.
        example: |-
          *Mein meistgesehener Beitrag war ein Video von meinem Hund.*
          *Die Leute haben „Super!“ geschrieben.*
          *Ich habe TikTok häufiger genutzt als Instagram.*
      - id: act3-questions
        type: discussionQuestions
        title: Fragen für das Interview
        items:
          - question: Welcher Beitrag hatte die meisten Aufrufe?
            frame: Mein meistgesehener Beitrag war ___.
          - question: Was stand im besten Kommentar?
            frame: Die Leute haben „___“ geschrieben.
          - question: Wem bist du zuerst gefolgt?
            frame: Ich bin zuerst ___ gefolgt.
          - question: Was hast du gemacht, als du viele Likes bekommen hast?
            frame: Als ich viele Likes bekommen habe, habe ich ___.
          - question: Welche App hast du letztes Jahr am meisten benutzt? Warum?
            frame: Ich habe ___ am meisten benutzt, weil ___.
          - question: Hattest du einen lustigen Moment online?
            frame: Ja, ich habe ___. / Nein, ich hatte keinen lustigen Moment.
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Haben soziale Medien geholfen oder geschadet?'
        skills: [Perfekt, Vergleiche]
        minutes: 20
        steps:
          - 'Thema: Haben soziale Medien im letzten Jahr mehr geholfen oder mehr Probleme gemacht? Gruppe A: Sie haben geholfen (positiv). Gruppe B: Sie haben Probleme gemacht (negativ).'
          - Jede Gruppe schreibt 3 kurze Sätze. Jeder Satz hat die Vergangenheit (Perfekt oder war / waren) und einen Vergleich (… -er als, mehr / weniger … als).
          - Gruppe A liest einen Satz, Gruppe B liest einen Satz dagegen. Wechselt, bis alle Sätze gelesen sind. Lest nur eure vorbereiteten Sätze.
          - 'Reaktionen: Ich denke anders. / Das war wichtiger als … / Das war ein größeres Problem.'
          - 'Abstimmung: Welche Gruppe hatte bessere Sätze? Welche Gruppe hatte mehr Vergleiche?'
        example: |-
          **Positiv:** *Soziale Medien haben Familien geholfen. Viele Menschen haben mehr gelernt als früher. YouTube war nützlicher als die Schule.*
          **Negativ:** *Menschen haben mehr Zeit online verbracht als mit der Familie. Viele Schüler waren gestresster als früher. Instagram war weniger sicher als früher.*
          *A: Soziale Medien haben Schülern geholfen, schneller zu lernen.*
          *B: Schüler haben mehr Zeit online verbracht als mit Freunden.*
      - id: act4-sentences
        type: discussionQuestions
        title: Unsere 3 Sätze
        items:
          - question: Satz 1
          - question: Satz 2
          - question: Satz 3
      - id: act5
        type: classActivity
        title: 'Abschluss: Mein Social-Media-Post der Woche'
        skills: [Perfekt, Vergleiche]
        minutes: 7
        steps:
          - Schreib einen kurzen „Post“ (3–4 Sätze) über deine letzte Woche in den sozialen Medien.
          - Lies der Gruppe einen Satz aus deinem Post vor.
          - Ein anderer Schüler / eine andere Schülerin stellt eine kurze Frage (Warum? Mit wem? Wann?).
        example: '*Letzte Woche habe ich Instagram benutzt. Ich habe ein lustiges Video gesehen. TikTok war interessanter als YouTube. Es war sehr lustig.*'
      - id: act5-post
        type: discussionQuestions
        title: Mein Post
        items:
          - question: Letzte Woche habe ich ___.
          - question: Ich habe ___ gesehen / gepostet.
          - question: ___ war interessanter als ___.
          - question: Es war ___.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: **Perfekt** und **Vergleiche**; dazu Fragen
          in der Vergangenheit stellen und beantworten. Alle Aktivitäten üben beide
          Fertigkeiten. Dauer der Stunde: 90 Minuten.
      - id: n-intro
        anchor: intro
        minutes: 5
        text: Gib zuerst dein Beispiel. Jeder Schüler sagt zwei einfache Sätze im Perfekt. Korrigiere sanft und wiederhole den Satz korrekt.
      - id: n-warmup
        anchor: warmup-title
        text: Stell jedem Schüler mindestens zwei Fragen. Die Schüler antworten in ganzen Sätzen im Perfekt. Die Antworten erscheinen unter jeder Frage.
      - id: n-act1
        anchor: act1
        minutes: 15
        text: >-
          Schreiben: 5 Minuten. Paarinterview: 6 Minuten (schreib die Fragen an die Tafel).
          Berichten: 4 Minuten. Ziel: mindestens 3 Fragen, Antworten in ganzen Sätzen und
          ein Vergleich (*TikTok war interessanter als YouTube.*).
      - id: n-act2
        anchor: act2
        minutes: 18
        text: >-
          Zeitleiste: 8 Minuten. Vergleichen: 7 Minuten. Schreib die Wortbank und die
          Satzrahmen an die Tafel. Achte auf Partizipien ohne *ge-*: *eröffnet, bekommen*,
          und auf *Ich bin … gefolgt* (mit *sein*).
      - id: n-act3
        anchor: act3
        minutes: 20
        text: Schreib die Fragen und die Satzhilfe an die Tafel. Nach dem Rollentausch präsentiert jedes Paar kurz im Plenum.
      - id: n-act4
        anchor: act4
        minutes: 20
        text: >-
          Gruppen bilden: 2 Minuten («Heute sprechen wir über soziale Medien im letzten
          Jahr. Gruppe A: positiv. Gruppe B: negativ.»). Sätze vorbereiten: 8 Minuten,
          mit den Modellen an der Tafel. Geführter Austausch: 8 Minuten, nur vorbereitete
          Sätze, keine freien Reden. Abstimmung: 3 Minuten. Schreib die Reaktionen an die
          Tafel.
      - id: n-act5
        anchor: act5
        minutes: 7
        text: >-
          Im Heft steht diese Aufgabe als «Hausaufgabe extra», aber sie ist als Abschluss
          der Stunde beschrieben (Schreiben 3–4 Minuten, Teilen 2–3 Minuten). Schreib die
          Struktur an die Tafel. Du kannst sie auch als Hausaufgabe geben.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: soziale-medien-vergangenheit-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: rules-perfekt
        type: ruleSummary
        skill: Perfekt
        rules:
          - text: 'Über die Vergangenheit sprechen wir mit dem **Perfekt**: *haben* oder *sein* + **Partizip II**.'
            examples:
              [
                Ich **habe** Instagram **benutzt**.,
                Ich **habe** ein Foto **gepostet**.,
                Ich **habe** ein Video **gesehen**.,
                Ich **bin** online **gegangen**.,
              ]
          - text: 'Die meisten Verben haben *haben*: benutzen, posten, sehen, hören, schreiben … Verben der **Bewegung** oder **Veränderung** haben *sein*: gehen, kommen, folgen, werden; auch *bleiben* und *sein*.'
            examples: [Ich habe Musik gehört., Ich bin zuerst meiner Schwester gefolgt.]
          - text: '*haben / sein* steht auf Position 2. Das **Partizip II** steht am **Ende** des Satzes.'
            examples: [Gestern habe ich ein Video auf TikTok gesehen.]
          - text: 'Partizip II: meistens **ge-** … **-t** (gepostet, gehört, geteilt) oder **ge-** … **-en** (gesehen, geschrieben, gesprochen). Verben mit *be-, ver-, er-* haben **kein ge-**.'
            examples: ['benutzen → benutzt, bekommen → bekommen, eröffnen → eröffnet']
          - text: 'Zeitwörter für die Vergangenheit:'
            examples: ['gestern, letzte Woche, letztes Jahr, vor zwei Tagen']
      - id: perfekt-he
        type: text
        lang: he
        text: >-
          כדי לדבר על מה שעשינו בעבר משתמשים בזמן Perfekt: haben או sein + Partizip II (צורת
          העבר של הפועל). רוב הפעלים משתמשים ב־haben (benutzen, posten, sehen, hören,
          schreiben). פעלים של תנועה או שינוי מצב משתמשים ב־sein (gehen, kommen, werden),
          וגם bleiben. הפועל בצורת Partizip II נמצא בסוף המשפט. מילות זמן: gestern – אתמול,
          letzte Woche – שבוע שעבר, letztes Jahr – שנה שעברה, vor zwei Tagen – לפני יומיים.
      - id: rules-vergleiche
        type: ruleSummary
        skill: Vergleiche
        rules:
          - text: '**Komparativ:** Adjektiv + **-er** + **als**. Wir sagen nicht *mehr interessant*.'
            examples:
              [
                TikTok war **interessanter als** Instagram.,
                YouTube war **nützlicher als** TikTok.,
                Mein erster Beitrag war **beliebter als** deiner.,
              ]
          - text: 'Kurze Adjektive bekommen oft einen Umlaut. Einige Formen sind unregelmäßig.'
            examples:
              ['groß → größer, alt → älter', 'gut → besser → am besten', 'viel → mehr → am meisten']
          - text: '**Superlativ:** **am** + Adjektiv + **-sten** (nach -t oder -s: **-esten**).'
            examples:
              [
                Instagram war **am beliebtesten**.,
                Dieser Moment war **am aufregendsten**.,
                Dein Video war **am interessantesten**.,
              ]
          - text: '**weniger** + Adjektiv + **als** = nicht so … wie.'
            examples: [Instagram war **weniger sicher als** früher.]
          - text: 'Mit Verben und Nomen: **mehr / weniger … als**, **am meisten / am wenigsten**.'
            examples:
              [
                Ich habe WhatsApp **mehr als** Facebook benutzt.,
                Du hast **weniger** Likes bekommen **als** ich.,
                Welche App hast du **am meisten** benutzt?,
              ]
      - id: vergleiche-he
        type: text
        lang: he
        text: >-
          כדי להשוות בין אפליקציות, חוויות או דברים: תואר + ‎-er + als = יותר … מ־ (interessanter
          als – מעניין יותר מ־). בגרמנית לא אומרים mehr interessant. הכי: am + תואר + ‎-sten
          (am beliebtesten – הכי פופולרי). weniger + תואר + als – פחות … מ־. עם פעלים ושמות
          עצם: mehr als – יותר מ־, weniger als – פחות מ־, am meisten – הכי הרבה, am wenigsten
          – הכי פחות.
      - id: example-full
        type: examples
        items:
          - {
              text: 'Letztes Jahr habe ich Instagram häufiger genutzt als Facebook, weil ich dort mehr mit meinen Freunden gesprochen habe.',
              gloss: בשנה שעברה השתמשתי באינסטגרם יותר מאשר בפייסבוק,
              כי דיברתי שם יותר עם החברים שלי,
            }
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die zwei Fertigkeiten mit der Gruppe und bitte um ein neues Beispiel für jede Regel.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: soziale-medien-vergangenheit-hausaufgaben
    title: Hausaufgaben mit Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben mit Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere eine Nachricht und schick sie ab. Mori stellt dir Fragen; beantworte alle.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Nachricht 1: Was ich gestern online gemacht habe'
        intro: 'Beispielantwort: *Gestern habe ich Instagram benutzt und ein Video gesehen.*'
        message: Hallo Mori! Frag mich, was ich gestern in den sozialen Medien gemacht habe. Ich möchte im Perfekt antworten. Bitte korrigiere mich sofort.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Nachricht 2: Mein letzter Post'
        intro: 'Beispiel: *Das letzte Foto, das ich gepostet habe, war von meinem Hund.*'
        message: Hallo Mori! Frag mich, was mein letzter Post war. Ich möchte ihn in einem ganzen Satz in der Vergangenheit beschreiben. Bitte korrigiere mich.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Nachricht 3: Apps vergleichen'
        intro: 'Beispiel: *Ich habe TikTok mehr als Facebook benutzt. Instagram war interessanter als YouTube.*'
        message: Hallo Mori! Nenn mir zwei Apps (zum Beispiel TikTok und Instagram) und bitte mich, sie zu vergleichen, mit „mehr als“, „weniger als“ und „am meisten“. Bitte korrigiere mich.
      - id: mori-4
        type: aiTutorPrompt
        title: 'Nachricht 4: Ein lustiges oder seltsames Erlebnis'
        intro: 'Beispiel: *Ein Freund hat mich in einem lustigen Meme markiert.*'
        message: Hallo Mori! Frag mich nach einem lustigen oder seltsamen Erlebnis, das ich online hatte. Ich antworte im Perfekt, und du korrigierst mich.
      - id: mori-5
        type: aiTutorPrompt
        title: 'Nachricht 5: Kurzes Interview'
        intro: 'Beispiel: *Letztes Jahr habe ich WhatsApp häufiger als Instagram benutzt.*'
        message: |-
          Hallo Mori! Sei ein Journalist und interview mich über meine Vergangenheit in den sozialen Medien. Frag mich:
          Welche App habe ich am meisten benutzt?
          Welcher Post hat die meisten Kommentare bekommen?
          Mit wem habe ich am meisten gesprochen?
          Bitte korrigiere meine Fehler.
      - id: mori-6
        type: aiTutorPrompt
        title: 'Nachricht 6: Eine kurze Geschichte über gestern'
        intro: 'Beispiel: *Gestern habe ich WhatsApp benutzt, ein Video gesehen und mit meiner Schwester gesprochen.*'
        message: Hallo Mori! Bitte mich, 4–5 Sätze über meinen gestrigen Tag in den sozialen Medien zu erzählen. Ich benutze das Perfekt, und du korrigierst jeden Fehler.
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: soziale-medien-vergangenheit-uebung
    book: workbook
    title: 'Übung: Soziale Medien – Die Vergangenheit'
    phase: after_class
    blocks:
      - id: intro
        type: text
