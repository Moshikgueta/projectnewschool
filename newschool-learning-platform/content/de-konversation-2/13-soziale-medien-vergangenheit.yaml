activities:
  - slug: soziale-medien-vergangenheit-perfekt
    title: 'Perfekt: Ich habe gepostet, ich bin gegangen'
    minutes: 8
    items:
      - id: habe-benutzt
        type: multipleChoice
        prompt: Gestern ___ ich Instagram benutzt.
        options:
          - { text: habe, correct: true }
          - { text: bin, feedback: '*benutzen* hat im Perfekt *haben*: *Ich habe … benutzt.*' }
          - { text: hat, feedback: '*hat* ist für *er / sie*. Für *ich* sagen wir *habe*.' }
      - id: gepostet-gesehen
        type: fillBlank
        prompt: Schreib das Partizip II von *posten* und *sehen*.
        text: Ich habe ein Foto ___. Dann habe ich ein Video ___.
        blanks: [[gepostet], [gesehen]]
      - id: partizipien
        type: matching
        prompt: Welches Partizip II passt zu welchem Verb?
        pairs:
          - [benutzen, benutzt]
          - [posten, gepostet]
          - [sehen, gesehen]
          - [schreiben, geschrieben]
          - [sprechen, gesprochen]
      - id: bin-gegangen
        type: multipleChoice
        prompt: Ich ___ online gegangen.
        options:
          - { text: bin, correct: true }
          - {
              text: habe,
              feedback: '*gehen* ist ein Verb der Bewegung: es hat *sein*. *Ich bin … gegangen.*',
            }
          - { text: ist, feedback: '*ist* ist für *er / sie*. Für *ich* sagen wir *bin*.' }
      - id: partizip-ende
        type: trueFalse
        prompt: 'Im Perfekt steht das Partizip II am Ende des Satzes: *Gestern habe ich ein Video auf TikTok gesehen.*'
        answer: true
        feedback:
          correct: Richtig! *habe* steht auf Position 2, *gesehen* am Ende.
          incorrect: 'Doch: *haben / sein* steht auf Position 2, das Partizip II am Ende.'
      - id: likes-bekommen
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Ich habe hundert Likes bekommen., correct: true }
          - {
              text: Ich habe hundert Likes gebekommen.,
              feedback: 'Verben mit *be-* haben kein *ge-*: *bekommen → bekommen*.',
            }
          - {
              text: Ich bin hundert Likes bekommen.,
              feedback: '*bekommen* hat im Perfekt *haben*: *Ich habe … bekommen.*',
            }
      - id: musik-gehoert
        type: fillBlank
        prompt: Ergänze das Perfekt von *hören*.
        text: Letzte Woche ___ ich Popmusik auf Spotify ___.
        blanks: [[habe], [gehört, gehoert]]
      - id: ordne-partner
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Mein Partner hat lustige Videos gesehen.

  - slug: soziale-medien-vergangenheit-vergleiche
    title: 'Vergleiche: interessanter als, am beliebtesten'
    minutes: 8
    items:
      - id: interessanter
        type: multipleChoice
        prompt: TikTok war ___ als Instagram.
        options:
          - { text: interessanter, correct: true }
          - {
              text: mehr interessant,
              feedback: 'Im Deutschen sagen wir nicht *mehr interessant*. Wir sagen Adjektiv + *-er*: *interessanter*.',
            }
          - {
              text: interessant,
              feedback: 'Mit *als* brauchen wir den Komparativ: *interessanter als*.',
            }
      - id: nuetzlicher
        type: fillBlank
        prompt: Schreib den Komparativ von *nützlich*.
        text: YouTube war ___ als TikTok.
        blanks: [[nützlicher, nuetzlicher]]
      - id: am-beliebtesten
        type: multipleChoice
        prompt: 'Von allen Apps war Instagram am ___.'
        options:
          - { text: beliebtesten, correct: true }
          - {
              text: beliebter,
              feedback: '*beliebter* ist der Komparativ (mit *als*). Für „am meisten“ sagen wir *am beliebtesten*.',
            }
          - {
              text: beliebt,
              feedback: 'Der Superlativ ist *am* + Adjektiv + *-sten*: *am beliebtesten*.',
            }
      - id: mehr-als
        type: trueFalse
        prompt: 'Der Satz *Ich habe WhatsApp mehr als Facebook benutzt.* ist richtig.'
        answer: true
        feedback:
          correct: 'Richtig! Mit Verben benutzen wir *mehr als*.'
          incorrect: 'Der Satz ist richtig: mit Verben sagen wir *mehr … als*.'
      - id: komparative
        type: matching
        prompt: Welcher Komparativ passt?
        pairs:
          - [interessant, interessanter]
          - [schnell, schneller]
          - [groß, größer]
          - [gut, besser]
          - [viel, mehr]
      - id: weniger-likes
        type: fillBlank
        prompt: 'Du hast 50 Likes bekommen, ich 100. Ergänze den Satz.'
        text: Du hast ___ Likes bekommen als ich.
        blanks: [[weniger]]
        wordBank: [weniger, mehr, am meisten]
      - id: am-meisten
        type: multipleChoice
        prompt: Welche App hast du letztes Jahr ___ benutzt?
        options:
          - { text: am meisten, correct: true }
          - { text: meisten, feedback: 'Der Superlativ von *viel* ist *am meisten*.' }
          - {
              text: am mehr,
              feedback: '*mehr* ist der Komparativ (mit *als*). Der Superlativ ist *am meisten*.',
            }
      - id: ordne-tiktok
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: TikTok war interessanter als YouTube.
