activities:
  - slug: bisherige-erfahrungen-perfekt
    title: 'Perfekt: haben / sein + Partizip II'
    minutes: 8
    items:
      - id: habe-gesehen
        type: multipleChoice
        prompt: Gestern ___ ich einen Film gesehen.
        options:
          - { text: habe, correct: true }
          - { text: bin, feedback: '*sehen* ist keine Bewegung: Wir sagen *Ich habe … gesehen*.' }
          - { text: hat, feedback: '*hat* ist für *er / sie / es*. Für *ich* sagen wir *habe*.' }
      - id: bin-gegangen
        type: multipleChoice
        prompt: Ich ___ früh nach Hause gegangen.
        options:
          - { text: bin, correct: true }
          - { text: habe, feedback: '*gehen* ist eine Bewegung: Wir sagen *Ich bin … gegangen*.' }
          - { text: ist, feedback: '*ist* ist für *er / sie / es*. Für *ich* sagen wir *bin*.' }
      - id: partizip-paare
        type: matching
        prompt: Welches Partizip II passt?
        pairs:
          - [machen, gemacht]
          - [kaufen, gekauft]
          - [essen, gegessen]
          - [sehen, gesehen]
          - [gehen, gegangen]
      - id: noch-nie-gereist
        type: fillBlank
        prompt: Ergänze *haben* oder *sein* und das Partizip II von *reisen*.
        text: Ich ___ noch nie allein ___.
        blanks: [[bin], [gereist]]
      - id: partizip-ende
        type: trueFalse
        prompt: Im Perfekt steht das Partizip II am Ende des Satzes.
        answer: true
        feedback:
          correct: 'Richtig! *Ich habe gestern einen Film **gesehen**.*'
          incorrect: 'Das Partizip II steht am Ende: *Ich habe gestern einen Film gesehen.*'
      - id: falsch-haben-gegangen
        type: trueFalse
        prompt: 'Der Satz *Ich habe nach Hause gegangen.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! *gehen* ist eine Bewegung: *Ich bin nach Hause gegangen.*'
          incorrect: 'Bei Verben der Bewegung benutzen wir *sein*: *Ich bin nach Hause gegangen.*'
      - id: familie-besucht
        type: fillBlank
        prompt: Ergänze das Perfekt von *besuchen*.
        text: Letzte Woche ___ ich meine Familie ___.
        blanks: [[habe], [besucht]]
      - id: ordne-aufgewacht
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Ich bin um sieben Uhr aufgewacht.

  - slug: bisherige-erfahrungen-fragen
    title: 'Fragen im Perfekt: Was hast du gemacht?'
    minutes: 8
    items:
      - id: was-gekocht
        type: multipleChoice
        prompt: 'A: *Gestern habe ich Nudeln gekocht.* Welche Frage passt?'
        options:
          - { text: Was hast du gekocht?, correct: true }
          - {
              text: Was hast du kochen?,
              feedback: 'Im Perfekt brauchen wir das Partizip II: *gekocht*.',
            }
          - {
              text: Was du hast gekocht?,
              feedback: 'Nach dem W-Wort kommt das Verb (*hast*), dann das Subjekt: *Was hast du gekocht?*',
            }
      - id: wo-gewesen
        type: fillBlank
        prompt: Ergänze *haben* oder *sein*.
        text: Wo ___ du gewesen?
        blanks: [[bist]]
      - id: hast-du-schon-mal
        type: fillBlank
        prompt: Ergänze *haben* oder *sein*. Achte auf den großen Buchstaben am Satzanfang.
        text: ___ du schon mal Sushi gegessen?
        blanks: [[Hast]]
      - id: frage-antwort
        type: matching
        prompt: Welche Antwort passt zu welcher Frage?
        pairs:
          - [Was hast du gegessen?, Ich habe Pizza gegessen.]
          - [Wohin bist du gegangen?, Ich bin ins Kino gegangen.]
          - [Wann bist du aufgewacht?, Ich bin um sieben Uhr aufgewacht.]
          - [Was hast du gekauft?, Ich habe ein Buch gekauft.]
          - [Mit wem hast du gekocht?, Ich habe mit meiner Schwester gekocht.]
      - id: wohin
        type: multipleChoice
        prompt: Welche Frage ist richtig?
        options:
          - { text: Wohin bist du gegangen?, correct: true }
          - {
              text: Wo bist du gegangen?,
              feedback: 'Für eine Richtung fragen wir mit *wohin*: *Wohin bist du gegangen?*',
            }
          - {
              text: Wohin hast du gegangen?,
              feedback: '*gehen* ist eine Bewegung: *Wohin bist du gegangen?*',
            }
      - id: ja-nein-frage
        type: trueFalse
        prompt: 'In einer Ja/Nein-Frage im Perfekt steht *haben* oder *sein* am Anfang: *Hast du schon Berlin besucht?*'
        answer: true
        feedback:
          correct: Richtig! *Haben / Sein* + Subjekt + … + Partizip II?
          incorrect: 'Doch: *Hast du schon Berlin besucht? Bist du jemals allein gereist?*'
      - id: partner-hat
        type: multipleChoice
        prompt: Mein Partner ___ Nudeln gekocht.
        options:
          - { text: hat, correct: true }
          - {
              text: habe,
              feedback: '*habe* ist für *ich*. Für *mein Partner* (er) sagen wir *hat*.',
            }
          - {
              text: hast,
              feedback: '*hast* ist für *du*. Für *mein Partner* (er) sagen wir *hat*.',
            }
      - id: ordne-wochenende
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Was hast du letztes Wochenende gemacht?
