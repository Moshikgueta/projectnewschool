# Cycle "Bisherige Erfahrungen", converted from the German level 2
# (conversational) digital notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher
# review: see `review` below. Blocks without `lang` are in the course language (German).
course: de-konversation-2
slug: bisherige-erfahrungen
title: Bisherige Erfahrungen
goal: Über Erlebnisse und Erfahrungen im Perfekt sprechen und Fragen im Perfekt stellen.
position: 5
status: published

review:
  - >-
    The two workbook exercises ("Perfekt mit haben und sein" and "Fragen im
    Perfekt") are NEW: the notebook has no self-study exercises. They were written
    from the cycle's summary rules, the activity examples and its vocabulary. Please
    check level, wording and every right answer before students see them.
  - >-
    Skills: the notebook lists four language goals (talk about past actions, use the
    Perfekt, time vs. experience, ask simple follow-up questions). They are grouped
    into two skills: "Perfekt (haben / sein + Partizip II)" (with time words and
    schon / noch nie) and "Fragen im Perfekt". Please confirm.
  - >-
    Grammar corrections: Activity 2 "Ich habe noch nie allein gereist" → "Ich bin noch
    nie allein gereist" (reisen takes sein), and the structure "Ich habe noch nie +
    Partizip II" → "Ich habe / bin noch nie … + Partizip II". The summary said sein is
    used for "change of state (aufwachen, bleiben)": bleiben is not a change of state;
    the rule now lists movement, change of state (aufwachen) and the two special
    verbs bleiben and sein. The summary called the Partizip II "the third form of the
    verb" (from the English notebook); this is replaced by a German rule on how the
    Partizip II is formed (ge-…-t, ge-…-en, aufgewacht, besucht).
  - >-
    Grammar: the summary's question rule "Haben / Sein + Subjekt + Partizip II?"
    covers only yes/no questions, but its own examples are W-questions (Was hast du
    gestern gemacht?). Both patterns are now given. ADDED: a table of haben / sein in
    the Präsens, a short list of Partizip II forms from the cycle, and the word
    order after dann / danach (verb in position 2) and weil (verb at the end).
  - >-
    Corrections: Mori prompt 1 "Wo bist du gegangen?" → "Wohin bist du gegangen?"
    (direction needs wohin); prompt 4 "Danach stelle mir bitte 2 einfache Fragen" →
    "Stell mir danach bitte 2 einfache Fragen"; warm-up 6 frame "Letzte Woche habe
    ich gelernt …" → "Letzte Woche habe ich ___ gelernt." (Partizip at the end);
    Activity 3 "Das letzte Mal, dass ich …" → "Das letzte Mal, als ich …" (as in
    the activity title; als is the standard form for a past moment).
  - >-
    Mori prompt 1 was half Hebrew, half German; it is now one German message. The
    "Ziel" lines of the 8 prompts are kept as short intros. Broken emoji characters
    ("ð¢", "ð¡", "ð¹") were removed throughout.
  - >-
    Activity 5 ("Aufgabe 5: Was habe ich wann getan?") uses a wordwall.net wheel,
    which is not an allowed link host: the link was left out and the game is kept,
    with a teacher note (a wheel can be made on wheelofnames.com). Activity 4 needs
    three pictures chosen by the teacher (not in the notebook).
  - >-
    The warm-up questions in the notebook exist only for "Anfängerniveau"; there are
    no Fortgeschrittene questions in this cycle, so no level heading is used. The
    four "Merken" boxes of the activities are kept as info callouts.
  - >-
    Vocabulary: nouns now carry their article (die Erfahrung, die Erinnerung, die
    Geschichte, die Vergangenheit); verbs show their Perfekt (hat gemacht, ist
    gegangen …); "alleine" → "allein"; the empty item 8 was removed; glosses
    "letzte Woche – שבוע שעבר" → "בשבוע שעבר", "letztes Wochenende" → "בסוף השבוע
    שעבר", "haben – יש / פועל עזר" → "שיש ל־ / פועל עזר", "sein" → "להיות / פועל עזר".
    The English-style headings of the list were dropped. Please confirm.
  - >-
    The Quizlet link lost its tracking parameter (?funnelUUID=…). The source gives no
    activity times, so no minutes are recorded. The "Student 1/2/3" and "Antwort von
    Schüler 1/2/3" lines are replaced by the answer boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: bisherige-erfahrungen-unterricht
    title: 'Unterricht: Bisherige Erfahrungen'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Bisherige Erfahrungen
      - id: skills
        type: cycleOverview
        skills:
          - name: Perfekt (haben / sein + Partizip II)
            description: '*Gestern habe ich einen Film gesehen. Ich bin noch nie allein gereist.*'
          - name: Fragen im Perfekt
            description: '*Was hast du gekocht? Hast du schon mal Sushi gegessen?*'
      - id: quizlet
        type: externalLink
        label: Bisherige Erfahrungen auf Quizlet
        url: https://quizlet.com/br/1128890214/bisherige-erfahrungen-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Vorstellungsrunde
      - id: intro
        type: sentenceFrame
        prompt: Sag zwei kurze Sätze im Perfekt.
        frame: Gestern / Letztes Wochenende / Vor zwei Tagen habe ich ___. / bin ich ___.
        example: Letztes Wochenende habe ich meine Oma besucht. Vor zwei Tagen bin ich ins Kino gegangen.
      - id: warmup-title
        type: heading
        level: 3
        text: Aufwärmfragen
      - id: warmup
        type: discussionQuestions
        items:
          - question: Was hast du letztes Wochenende gemacht?
            frame: Letztes Wochenende habe ich ___.
          - question: Um wie viel Uhr bist du gestern aufgewacht?
            frame: Gestern bin ich um ___ aufgewacht.
          - question: Was hast du als letzte Mahlzeit gegessen?
            frame: Ich habe ___ gegessen.
          - question: Welche Orte hast du letzten Monat besucht?
            frame: Ich habe ___ besucht.
          - question: Was hast du zuletzt in einem Geschäft gekauft?
            frame: Ich habe ___ gekauft.
          - question: Was hast du letzte Woche gelernt?
            frame: Letzte Woche habe ich ___ gelernt.
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Was hast du gestern gemacht?'
        skills: [Perfekt (haben / sein + Partizip II), Fragen im Perfekt]
        steps:
          - Schreib drei Sätze im Perfekt über gestern.
          - 'Arbeitet zu zweit: A sagt einen Satz, B stellt eine Frage im Perfekt.'
          - 'Vergleicht: *Ich habe das auch gemacht. / Ich habe etwas anderes gemacht.*'
          - Berichte der Gruppe über deinen Partner / deine Partnerin (er / sie).
        example: |-
          *Gestern habe ich einen Film gesehen. Ich habe mit Freunden gegessen. Ich bin früh nach Hause gegangen.*
          *A: Gestern habe ich Nudeln gekocht.*
          *B: Was hast du gekocht?*
          *Mein Partner hat Nudeln gekocht und einen Film gesehen.*
      - id: act1-sentences
        type: discussionQuestions
        title: Meine drei Sätze und mein Bericht
        items:
          - question: Gestern habe / bin ich ___.
          - question: Ich habe / bin ___.
          - question: Ich habe / bin ___.
          - question: Mein Partner / Meine Partnerin hat / ist ___.
      - id: act1-merken
        type: callout
        tone: info
        title: Merken
        text: |-
          **Perfekt = haben / sein + Partizip II**
          *Ich habe gelernt. Ich bin gegangen.*
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Ich habe noch nie …'
        skills: [Perfekt (haben / sein + Partizip II)]
        steps:
          - Schreib zwei oder drei Sätze mit *Ich habe / bin noch nie …* + Partizip II.
          - 'Lies deine Sätze vor. Die anderen reagieren: *Ich schon! / Ich auch nicht!*'
          - Schreib zwei kurze Sätze über die Gruppe.
        example: |-
          *Ich habe noch nie Sushi gegessen. Ich bin noch nie allein gereist.*
          *Viele Schüler haben Sushi gegessen. Niemand ist Fallschirm gesprungen.*
      - id: act2-sentences
        type: discussionQuestions
        title: Ich habe noch nie …
        items:
          - question: Ich habe / bin noch nie ___.
          - question: Ich habe / bin noch nie ___.
          - question: Ich habe / bin noch nie ___.
          - question: 'Über die Gruppe: ___'
          - question: 'Über die Gruppe: ___'
      - id: act2-merken
        type: callout
        tone: info
        title: Merken
        text: 'Das Perfekt benutzen wir auch für Erfahrungen. Wichtige Wörter: **noch nie, schon, jemals**.'
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Das letzte Mal, als ich …'
        skills: [Perfekt (haben / sein + Partizip II), Fragen im Perfekt]
        steps:
          - Vervollständige die Sätze unten.
          - Lies einen Satz vor. Die anderen stellen Fragen im Perfekt.
          - Schreib zwei Sätze über deine Mitschüler.
        example: |-
          *A: Das letzte Mal, als ich gekocht habe, war am Sonntag.*
          *B: Was hast du gekocht?*
          *C: Mit wem hast du gekocht?*
          *Viele Schüler haben am Wochenende einen Film gesehen. Mein Klassenkamerad ist letzten Sommer ans Meer gereist.*
      - id: act3-sentences
        type: discussionQuestions
        title: Das letzte Mal …
        items:
          - question: Das letzte Mal, als ich gekocht habe, war ___.
          - question: Das letzte Mal, als ich einen Film gesehen habe, war ___.
          - question: Meine letzte Reise war ___.
          - question: Mein letztes Date war ___.
          - question: Das letzte Familienessen war ___.
          - question: 'Über meine Mitschüler: ___'
          - question: 'Über meine Mitschüler: ___'
      - id: act3-merken
        type: callout
        tone: info
        title: Merken
        text: 'Zeitwörter: **gestern, letzte Woche, vor zwei Tagen, letztes Jahr**'
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Geschichten in drei Bildern'
        skills: [Perfekt (haben / sein + Partizip II)]
        steps:
          - Schau dir die drei Bilder an. Verbinde sie zu einer kurzen Geschichte im Perfekt.
          - Erzähl deine Geschichte der Klasse.
          - Schreib zwei Sätze über die Geschichte von einem anderen Schüler / einer anderen Schülerin.
        example: |-
          *Ich war am Strand, dann habe ich in einem Restaurant gegessen und danach bin ich auf eine Party gegangen.*
          *Mir hat die Geschichte gefallen. Seine Geschichte war lustig.*
        wordBank: [und, dann, danach, weil, aber]
      - id: act4-sentences
        type: discussionQuestions
        title: Meine Geschichte
        items:
          - question: Zuerst ___.
          - question: Dann ___.
          - question: Danach ___.
          - question: 'Über eine andere Geschichte: ___'
      - id: act4-merken
        type: callout
        tone: info
        title: Merken
        text: Perfekt · Zeitwörter · Konnektoren
      - id: act5
        type: classActivity
        title: 'Aktivität 5: Was habe ich wann gemacht?'
        skills: [Perfekt (haben / sein + Partizip II), Fragen im Perfekt]
        steps:
          - Ein Schüler dreht das Rad.
          - Das Wort auf dem Rad gibt eine Zeit oder eine Situation.
          - Stell eine Frage oder sag einen Satz im Perfekt. Sprich über deine Erfahrung oder Handlung.
          - Wer geantwortet hat, dreht als Nächstes.
        example: '*Letzte Woche* → *Letzte Woche habe ich meine Familie besucht.*'
      - id: act5-merken
        type: callout
        tone: info
        title: Merken
        text: Benutze **haben / sein + Partizip II** und die Zeitwörter oder Situationen vom Rad.
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: **Perfekt** (haben / sein + Partizip II,
          mit Zeitwörtern und für Erfahrungen mit *schon / noch nie / jemals*) und
          **Fragen im Perfekt** (Aktivitäten 1, 3 und 5). Die Aufwärmfragen sind für das
          Anfängerniveau.
      - id: n-intro
        anchor: intro
        text: Jeder Schüler sagt zwei kurze Sätze im Perfekt. Gib zuerst dein eigenes Beispiel.
      - id: n-warmup
        anchor: warmup
        text: Stell jedem Schüler mindestens zwei Fragen. Die Antworten erscheinen unter jeder Frage.
      - id: n-act1
        anchor: act1
        text: >-
          Ablauf: 1. Schreiben, 2. Fragen mit dem Partner, 3. Vergleichen, 4. Berichten.
          So üben die Schüler die 1. Person (*Ich habe gekocht*), die 2. Person (*Was
          hast du gekocht?*) und die 3. Person (*Mein Partner hat gekocht*).
      - id: n-act2
        anchor: act2
        text: Achte auf *haben* oder *sein*, besonders bei Verben der Bewegung (*Ich bin noch nie allein gereist*).
      - id: n-act4
        anchor: act4
        text: >-
          Wähl vor dem Unterricht drei Bilder (z. B. Strand, Restaurant, Party); sie
          sind nicht im Heft. Zeig sie auf dem Bildschirm oder verteile sie
          ausgedruckt.
      - id: n-act5
        anchor: act5
        text: >-
          Im Heft ist dafür ein Glücksrad auf wordwall.net («Vergangenheit erzählen»)
          verlinkt; diese Seite ist hier nicht erlaubt. Du kannst ein Rad mit Zeitwörtern
          und Situationen auf wheelofnames.com erstellen (z. B. gestern, letzte Woche,
          letztes Wochenende, vor zwei Tagen, im Juli, im Urlaub, auf einer Party).

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: bisherige-erfahrungen-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: rules-perfekt
        type: ruleSummary
        skill: Perfekt (haben / sein + Partizip II)
        rules:
          - text: 'Mit dem **Perfekt** sprechen wir über Dinge in der Vergangenheit, über Erfahrungen und über Handlungen, die fertig sind. Im gesprochenen Deutsch ist es die wichtigste Vergangenheitsform.'
            examples: [Gestern habe ich gearbeitet.]
          - text: 'Struktur: Subjekt + **haben / sein** (Position 2) + … + **Partizip II** (am Ende des Satzes).'
            examples: [Ich habe gelernt., Ich habe Pizza gegessen., Ich bin nach Hause gegangen.]
          - text: 'Partizip II: regelmäßige Verben **ge- … -t** (gemacht, gelernt, gekauft, gearbeitet); viele unregelmäßige Verben **ge- … -en** (gegessen, gesehen, gegangen). Bei trennbaren Verben steht *ge* in der Mitte (aufgewacht); Verben mit *be-* haben kein *ge* (besucht).'
          - text: '**haben** benutzen wir bei den meisten Verben: essen, lernen, kaufen, sehen …'
            examples: [Ich habe einen Film gesehen., Ich habe Pizza gegessen.]
          - text: '**sein** benutzen wir bei Verben der Bewegung (gehen, fahren, kommen, reisen), bei einer Veränderung (aufwachen) und bei *bleiben* und *sein*.'
            examples:
              [Ich bin nach Hause gegangen., Ich bin früh aufgewacht., Ich bin zu Hause geblieben.]
          - text: 'Zeitwörter sagen, **wann** etwas passiert ist: gestern, letzte Woche, letztes Wochenende, vor zwei Tagen, im Juli.'
            examples: [Letzte Woche habe ich meine Familie besucht.]
          - text: 'Für eine **Erfahrung ohne genaue Zeit** benutzen wir auch das Perfekt, mit **schon, noch nie, jemals**.'
            examples: [Ich habe schon Berlin besucht., Ich habe noch nie Sushi gegessen.]
      - id: haben-sein-table
        type: table
        caption: haben und sein (Präsens)
        header: [Person, haben, sein]
        rows:
          - [ich, habe, bin]
          - [du, hast, bist]
          - [er / sie / es, hat, ist]
          - [wir, haben, sind]
          - [ihr, habt, seid]
          - [sie / Sie, haben, sind]
      - id: partizip-table
        type: table
        caption: Verben aus diesem Zyklus
        header: [Infinitiv, Perfekt]
        rows:
          - [machen, hat gemacht]
          - [lernen, hat gelernt]
          - [kaufen, hat gekauft]
          - [arbeiten, hat gearbeitet]
          - [besuchen, hat besucht]
          - [essen, hat gegessen]
          - [sehen, hat gesehen]
          - [treffen, hat getroffen]
          - [gehen, ist gegangen]
          - [kommen, ist gekommen]
          - [reisen, ist gereist]
          - [aufwachen, ist aufgewacht]
          - [bleiben, ist geblieben]
      - id: perfekt-he
        type: text
        lang: he
        text: >-
          משתמשים ב־Perfekt כדי לדבר על דברים שקרו בעבר, על חוויות אישיות ועל פעולות
          שכבר הסתיימו. המבנה: נושא + haben / sein (במקום השני) + Partizip II בסוף
          המשפט. ברוב הפעלים משתמשים ב־haben. עם פעלי תנועה (gehen, fahren, kommen,
          reisen), עם שינוי מצב (aufwachen) ועם bleiben ו־sein משתמשים ב־sein. על חוויה
          בלי זמן מוגדר מדברים גם ב־Perfekt, עם schon (כבר), noch nie (אף פעם לא) ו־jemals
          (אי פעם).
      - id: perfekt-examples
        type: examples
        items:
          - { text: Gestern habe ich gearbeitet., gloss: אתמול עבדתי }
          - { text: Ich habe gelernt., gloss: למדתי }
          - { text: Ich habe gegessen., gloss: אכלתי }
          - { text: Ich bin gegangen., gloss: הלכתי }
          - { text: Ich habe noch nie Sushi gegessen., gloss: אף פעם לא אכלתי סושי }
      - id: rules-fragen
        type: ruleSummary
        skill: Fragen im Perfekt
        rules:
          - text: 'W-Frage: **W-Wort + haben / sein + Subjekt + … + Partizip II?**'
            examples: [Was hast du gestern gemacht?, Wo bist du gewesen?, Wohin bist du gegangen?]
          - text: 'Ja/Nein-Frage: **Haben / Sein + Subjekt + … + Partizip II?**'
            examples: [Hast du schon mal Sushi gegessen?, Bist du jemals allein gereist?]
          - text: 'Über eine andere Person berichten wir mit **hat** oder **ist** (er / sie).'
            examples: [Mein Partner hat Nudeln gekocht und einen Film gesehen.]
      - id: rules-konnektoren
        type: ruleSummary
        skill: Konnektoren
        rules:
          - text: 'Mit **und, aber, dann, danach, weil** verbinden wir Ideen.'
          - text: 'Nach *dann* und *danach* steht das Verb auf Position 2.'
            examples: ['Ich habe gelernt, dann habe ich einen Film gesehen.']
          - text: 'Nach *weil* steht das Verb am Ende.'
            examples: ['Ich bin früh nach Hause gegangen, weil ich müde war.']
      - id: recap
        type: callout
        tone: info
        title: Kurz gesagt
        text: |-
          Das Perfekt ist die wichtigste Vergangenheit im gesprochenen Deutsch.
          **haben / sein + Partizip II**, das Partizip steht am Ende.
          Wir benutzen Zeitwörter oder sprechen über Erfahrungen (*schon, noch nie*).
    teacherNotes:
      - id: n-summary
        anchor: null
        text: Wiederhole die Regeln mit der Gruppe und bitte um ein neues Beispiel für jede Regel, besonders für *haben* und *sein*.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: bisherige-erfahrungen-hausaufgaben
    title: Hausaufgaben mit Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben mit Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere eine Nachricht und schick sie ab. Mori stellt dir Fragen; antworte auf Deutsch.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Nachricht 1: Über gestern sprechen'
        intro: 'Ziel: Perfekt mit Zeitwörtern.'
        message: |-
          Hallo Mori! Ich möchte das Perfekt auf Deutsch üben.
          Bitte stell mir 5 einfache Fragen darüber, was ich gestern gemacht habe.
          Zum Beispiel: Was hast du gegessen? Wohin bist du gegangen?
          Bitte korrigiere meine Antworten und erkläre kurz, wenn ich einen Fehler mache.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Nachricht 2: Letztes Wochenende'
        intro: 'Ziel: mehr sprechen und Sätze verbinden.'
        message: |-
          Hallo Mori! Lass uns über letztes Wochenende sprechen.
          Stell mir bitte 5 Fragen im Perfekt.
          Hilf mir, meine Sätze mit „und“, „dann“ und „danach“ zu verbinden.
          Korrigiere mich, wenn nötig.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Nachricht 3: Lebenserfahrungen'
        intro: 'Ziel: das Perfekt für Erfahrungen (*Ich habe noch nie …*).'
        message: |-
          Hallo Mori! Ich möchte „Ich habe noch nie …“ üben.
          Stell mir 5 Fragen über Lebenserfahrungen.
          Zum Beispiel: Hast du schon mal Sushi gegessen?
          Bitte korrigiere meine Antworten und stell mir eine kurze Anschlussfrage.
      - id: mori-4
        type: aiTutorPrompt
        title: 'Nachricht 4: Eine kurze Geschichte'
        intro: 'Ziel: flüssig erzählen, mit Konnektoren.'
        message: |-
          Hallo Mori! Ich erzähle dir jetzt eine kurze Geschichte über meine Vergangenheit.
          Bitte überprüfe mein Perfekt und meine Konnektoren (und, dann, danach, aber).
          Stell mir danach bitte 2 einfache Fragen.
      - id: mori-5
        type: aiTutorPrompt
        title: 'Nachricht 5: Fragen und Antworten'
        intro: 'Ziel: Fragen im Perfekt bilden.'
        message: |-
          Hallo Mori! Ich möchte Fragen im Perfekt üben.
          Gib mir bitte einen Satz, und ich formuliere eine Frage dazu.
          Korrigiere meine Frage und gib mir ein besseres Beispiel.
      - id: mori-6
        type: aiTutorPrompt
        title: 'Nachricht 6: Über eine andere Person berichten'
        intro: 'Ziel: die 3. Person (er / sie).'
        message: |-
          Hallo Mori! Ich schreibe jetzt über das, was eine andere Person gemacht hat.
          Bitte korrigiere meine Sätze im Perfekt und sag mir, ob meine Wortstellung richtig ist.
      - id: mori-7
        type: aiTutorPrompt
        title: 'Nachricht 7: Wiederholung'
        intro: 'Ziel: alles von A2 wiederholen.'
        message: |-
          Hallo Mori! Ich möchte eine kurze Wiederholung machen.
          Stell mir bitte Fragen zu:
          – gestern
          – letzte Woche
          – Erfahrungen (noch nie / schon)
          Bitte korrigiere mich immer sofort und erkläre kurz.
      - id: mori-8
        type: aiTutorPrompt
        title: 'Nachricht 8: Selbsttest'
        intro: 'Ziel: mehr Sicherheit.'
        message: |-
          Hallo Mori! Ich schreibe jetzt 5 Sätze im Perfekt.
          Bitte überprüfe:
          – haben / sein
          – Partizip II
          – Wortstellung
          Sag mir auch, was schon sehr gut ist.
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**

  # ── workbook: practice on your own ───────────────────────────────────────
  - slug: bisherige-erfahrungen-uebung
    book: workbook
    title: 'Übung: Bisherige Erfahrungen'
    phase: after_class
    blocks:
      - id: intro
        type: text
        text: Übe die zwei Fertigkeiten des Zyklus. Jede Antwort wird sofort korrigiert, und du kannst es noch einmal versuchen.
      - id: ex-perfekt
