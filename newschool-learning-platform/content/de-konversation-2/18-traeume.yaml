activities:
  - slug: traeume-perfekt
    title: 'Perfekt: Ich habe geträumt'
    minutes: 8
    items:
      - id: habe-getraeumt
        type: multipleChoice
        prompt: Letzte Nacht ___ ich geträumt.
        options:
          - { text: habe, correct: true }
          - {
              text: bin,
              feedback: '*träumen* ist keine Bewegung: Das Perfekt hat *haben*. *Ich habe geträumt.*',
            }
          - { text: hat, feedback: '*hat* gehört zu *er / sie / es*. Mit *ich* sagen wir *habe*.' }
      - id: aufgewacht
        type: multipleChoice
        prompt: Ich ___ um 7 Uhr aufgewacht.
        options:
          - { text: bin, correct: true }
          - {
              text: habe,
              feedback: '*aufwachen* ist eine Veränderung: Das Perfekt hat *sein*. *Ich bin aufgewacht.*',
            }
          - {
              text: hat,
              feedback: '*aufwachen* hat *sein*, und mit *ich* sagen wir *bin*: *Ich bin aufgewacht.*',
            }
      - id: geflogen
        type: fillBlank
        prompt: Ergänze das Perfekt von *fliegen*.
        text: Im Traum ___ ich ___.
        blanks: [[bin], [geflogen]]
      - id: partizip
        type: matching
        prompt: Welches Partizip II passt zu welchem Verb?
        pairs:
          - [träumen, geträumt]
          - [sehen, gesehen]
          - [schlafen, geschlafen]
          - [fallen, gefallen]
          - [aufwachen, aufgewacht]
      - id: frueher
        type: trueFalse
        prompt: '*Früher habe ich jede Nacht geträumt.* bedeutet: Das war in der Vergangenheit oft so, aber heute nicht mehr.'
        answer: true
        feedback:
          correct: Richtig! Mit *früher* + Vergangenheit sprechen wir über Gewohnheiten in der Vergangenheit.
          incorrect: '*früher* + Vergangenheit = eine Gewohnheit in der Vergangenheit, heute nicht mehr.'
      - id: vergessen
        type: fillBlank
        prompt: Ergänze das Partizip II von *vergessen*.
        text: Ich habe viel geträumt, aber ich habe es ___.
        blanks: [[vergessen]]
      - id: frage
        type: multipleChoice
        prompt: Welche Frage ist richtig?
        options:
          - { text: Hast du letzte Nacht geträumt?, correct: true }
          - {
              text: Hast du letzte Nacht träumen?,
              feedback: 'Im Perfekt brauchen wir das Partizip II: *geträumt*.',
            }
          - {
              text: Bist du letzte Nacht geträumt?,
              feedback: '*träumen* hat im Perfekt *haben*: *Hast du … geträumt?*',
            }
      - id: ordne-hund
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Letzte Nacht habe ich einen Hund gesehen.

  - slug: traeume-praepositionen
    title: 'Präpositionen: um, am, im, vor, neben'
    minutes: 8
    items:
      - id: um
        type: multipleChoice
        prompt: Ich bin ___ 7 Uhr aufgewacht.
        options:
          - { text: um, correct: true }
          - {
              text: am,
              feedback: '*am* steht vor Tagen und Daten (*am Montag*). Vor einer Uhrzeit steht *um*.',
            }
          - {
              text: im,
              feedback: '*im* steht vor Monaten und Jahren (*im Juni*). Vor einer Uhrzeit steht *um*.',
            }
      - id: am-im
        type: fillBlank
        prompt: Ergänze *am* oder *im*.
        text: Die Party war ___ Montag. Mein Geburtstag ist ___ Juni.
        blanks: [[am], [im]]
        wordBank: [am, im]
      - id: in-italien
        type: multipleChoice
        prompt: Mein Traumhaus ist ___ Italien.
        options:
          - { text: in, correct: true }
          - {
              text: auf,
              feedback: '*auf* ist für eine Oberfläche (*auf dem Tisch*). Für ein Land sagen wir *in*: *in Italien*.',
            }
          - {
              text: bei,
              feedback: '*bei* ist für eine Person (*bei mir zu Hause*). Für ein Land sagen wir *in*.',
            }
      - id: zeit-ort
        type: matching
        prompt: Was passt zusammen?
        pairs:
          - [um, 15 Uhr]
          - [am, Montag]
          - [im, Juni]
          - [auf, dem Tisch]
          - [bei, mir zu Hause]
      - id: hinter
        type: fillBlank
        prompt: 'Ergänze die Präposition: מאחורי = ?'
        text: Ich habe Angst. Der Hund ist ___ mir.
        blanks: [[hinter]]
      - id: zeit-vor-ort
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Ich war am Montag im Park., correct: true }
          - {
              text: Ich war um Montag im Park.,
              feedback: '*um* steht vor einer Uhrzeit. Vor einem Tag steht *am*: *am Montag*.',
            }
          - {
              text: Ich war am Montag auf dem Park.,
              feedback: '*auf* ist für eine Oberfläche. Wir sagen *im Park*: *Ich war am Montag im Park.*',
            }
      - id: im-in-dem
        type: trueFalse
        prompt: '*im* = *in dem* und *am* = *an dem*.'
        answer: true
        feedback:
          correct: Richtig! *im Park = in dem Park, am Montag = an dem Montag*.
          incorrect: '*im* ist die kurze Form von *in dem*, *am* die kurze Form von *an dem*.'
      - id: ordne-neben
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Neben mir war ein Hund.
