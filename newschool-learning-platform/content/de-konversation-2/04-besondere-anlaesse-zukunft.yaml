# Cycle "Besondere Anlässe: Zukunft", converted from the German level 2
# (conversational) digital notebook (docs/CONTENT-AUDIT.md). DRAFT for teacher
# review: see `review` below. Blocks without `lang` are in the course language (German).
course: de-konversation-2
slug: besondere-anlaesse-zukunft
title: 'Besondere Anlässe: Zukunft'
goal: Über Feiern und Pläne sprechen, mit dem Präsens + Zeitangabe und dem Futur I (werden + Infinitiv).
position: 4
status: published

review:
  - >-
    The two workbook exercises ("Präsens + Zeitangabe" and "Futur I mit werden") are
    NEW: the notebook has no self-study exercises. They were written from the
    cycle's two skills, its summary, the activity examples and its vocabulary.
    Please check level, wording and every right answer before students see them.
  - >-
    Grammar, Futur I: the notebook says werden is used for "decisions made in the
    moment" (Lernziele and the Hebrew summary, "כשמחליטים עכשיו"). That is the
    English "will" rule translated literally; in German a spontaneous decision is
    normally said in the Präsens (Ich mache das! Ich komme mit!). The rule now says:
    Futur I for intentions and promises, for guesses with wahrscheinlich /
    vielleicht, and when no time word makes the future clear. Please confirm.
  - >-
    Grammar, Präsens + Zeitangabe: the notebook presents it as "fixed plans / near
    future" (like the English present continuous). In German the Präsens + time word
    is the most common way to talk about any future when the time is clear; the rule
    says so, and keeps the notebook's idea that both forms are correct and the
    difference is situation and style.
  - >-
    ADDED to the summary: a conjugation table of werden (ich werde, du wirst, er
    wird, wir werden, ihr werdet, sie werden), the word order rule (werden in
    position 2, infinitive at the end), and the rule for separable verbs (Wir laden
    Freunde ein → Wir werden Freunde einladen). The workbook checks them.
  - >-
    The notebook's "Nützliche Formulierungen" (Hebrew, for the teacher only, with a
    comparison table) became a German teacher note on the summary; the Hebrew
    student summary is kept as Hebrew text blocks (lang he) next to German rules.
    Typos in the Hebrew summary fixed: "Prasens" → "Präsens", "Gaste" → "Gäste".
    Please check the Hebrew.
  - >-
    The Mori homework messages are in Hebrew in the notebook ("Mori, אני רוצה לספר
    לך…"). They were translated into German messages to copy; the four parts and
    their examples are kept. The general tips callout was added from the course
    pattern; the notebook's note "short sentences are enough" is kept as a callout.
  - >-
    Activity 1: the notebook says students write in "einer Google-Docs-Vorlage", but
    no link is given; please add one (docs.google.com is allowed) if you have it.
    Activity 3 needs 4 pictures of celebrations chosen by the teacher (not in the
    notebook). Activity 4 needs a blank 12-month calendar (not in the notebook).
  - >-
    Introduction round: "In Zukunft feiere ich …" → "Bald feiere ich ___." ("in
    Zukunft" means "from now on", not "at a future date").
  - >-
    Activity 4: the three voting options had broken emoji characters ("ð"); they
    were removed. Activity 3 reaction "Leider werde ich nicht kommen können" (werden
    + double infinitive) is correct but hard for A2; it is kept, with "Leider kann
    ich nicht kommen" added as a simpler option. Please confirm.
  - >-
    The notebook's title is "Besondere Anlässe und Zukunftspläne"; the course title
    "Besondere Anlässe: Zukunft" is used. The weaker / stronger group hints of each
    activity are kept as teacher notes (there are no separate Anfänger /
    Fortgeschrittene tasks in this cycle).
  - >-
    Vocabulary: "werden – יהיה / יהפוך" → "להפוך ל־ / פועל עזר לעתיד" (יהיה is only one
    future form); "der Abschluss – סיום לימודים" → "סיום (לימודים)". Please confirm.
  - >-
    Times: the introduction round (max. 5 minutes) is recorded as 5; the steps of
    Activity 2 given as ranges are recorded as the upper value (2–3 → 3, 3–4 → 4,
    1–2 → 2). The other activities have no times in the source. The Quizlet link is
    kept as it is. The "Antwort von Schüler 1/2/3" lines are replaced by the answer
    boxes.

sections:
  # ── in class ─────────────────────────────────────────────────────────────
  - slug: besondere-anlaesse-zukunft-unterricht
    title: 'Unterricht: Besondere Anlässe (Zukunft)'
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: 'Besondere Anlässe: Zukunft'
      - id: skills
        type: cycleOverview
        skills:
          - name: Präsens + Zeitangabe
            description: '*Ich feiere am Samstag meinen Geburtstag.* Feste Pläne mit einer Zeitangabe'
          - name: Futur I (werden + Infinitiv)
            description: '*Ich werde meinen Geburtstag feiern.* Absichten und Vermutungen'
      - id: quizlet
        type: externalLink
        label: Besondere Anlässe auf Quizlet
        url: https://quizlet.com/br/1128206763/besondere-anlasse-flash-cards/
      - id: intro-title
        type: heading
        level: 3
        text: Vorstellungsrunde
      - id: intro
        type: sentenceFrame
        prompt: 'Sag zwei kurze Sätze: zuerst deinen Namen, dann wähl einen oder zwei Satzanfänge.'
        frame: |-
          Ich bin ___.
          Ich organisiere gern / nicht gern Partys, weil ___.
          Auf Partys tanze / esse / rede / spiele ich gern.
          Bald feiere ich ___.
          Ich bevorzuge große / kleine Partys.
          Eine Party ohne ___ ist keine Party.
        example: Ich bin Dana. Eine Party ohne Musik ist keine Party.
      - id: warmup-title
        type: heading
        level: 3
        text: Aufwärmfragen
      - id: warmup
        type: discussionQuestions
        items:
          - question: Wie und mit wem wirst du deinen nächsten Geburtstag feiern?
            frame: Ich werde meinen Geburtstag mit ___ feiern. (*Ich werde meinen Geburtstag mit Freunden zu Hause feiern.*)
          - question: Was wirst du an den nächsten Feiertagen (Weihnachten, Neujahr, Ostern usw.) unternehmen? Mit wem wirst du zusammen sein?
            frame: An ___ werde ich ___. (*An Weihnachten werde ich zu Hause bleiben und mit meiner Familie kochen.*)
          - question: Wirst du in Zukunft viele Menschen zu deiner Hochzeit oder zu einer anderen wichtigen Feier einladen? Warum oder warum nicht?
            frame: Ich werde viele / wenige Menschen einladen, weil ___. (*Ich werde viele Menschen einladen, weil mir Familie und Freunde wichtig sind.*)
          - question: Wie wirst du die Leute zu deiner Party einladen? Warum bevorzugst du diese Methode?
            frame: Ich werde die Leute per ___ einladen, weil ___. (*Ich werde die Leute per WhatsApp einladen, weil es schnell und einfach ist.*)
          - question: Welchen besonderen Anlass wirst du nächstes Jahr feiern?
            frame: Nächstes Jahr werde ich ___ feiern. (*Nächstes Jahr werde ich meinen Studienabschluss feiern.*)
          - question: Wie wirst du diesen Anlass feiern?
            frame: Ich werde diesen Anlass mit ___ feiern. (*Ich werde diesen Anlass mit einer kleinen Party feiern.*)
      - id: activities-title
        type: heading
        level: 3
        text: Aktivitäten
      - id: act1
        type: classActivity
        title: 'Aktivität 1: Einladungen schreiben'
        skills: [Präsens + Zeitangabe, Futur I (werden + Infinitiv)]
        steps:
          - 'Lies die Punkte für eine Einladung: Anlass, Datum / Zeit, Ort, Gäste, Bitte um Rückmeldung.'
          - 'Schreib zwei kurze Einladungen: 1. zu einer Geburtstagsfeier, 2. zu einem besonderen Anlass (z. B. Hochzeit, Abschluss, Reise, Jubiläum).'
          - Schreib kurze und klare Sätze. Du kannst das Präsens oder *werden* benutzen.
          - Wähl eine Einladung aus und lies sie der Klasse vor.
        example: |-
          *Liebe Anna,*
          *ich feiere meinen Geburtstag am Samstag um 18 Uhr bei mir zu Hause. Wir treffen uns in der Müllerstraße 5.*
          *Ich werde Essen und Getränke vorbereiten. Bitte gib mir bis Donnerstag Bescheid.*
          *Liebe Grüße*
          *Max*
        wordBank: [um Rückmeldung bitten, die Teilnahme bestätigen, Bescheid geben]
      - id: act1-invitation
        type: discussionQuestions
        title: Meine Einladung
        items:
          - question: Liebe / Lieber ___,
          - question: Ich feiere ___ am ___ um ___ Uhr.
          - question: Die Feier ist in / bei ___.
          - question: Ich werde ___ vorbereiten.
          - question: Bitte gib mir bis ___ Bescheid.
          - question: Liebe Grüße, ___
      - id: act2
        type: classActivity
        title: 'Aktivität 2: Eine Party planen'
        skills: [Präsens + Zeitangabe, Futur I (werden + Infinitiv)]
        steps:
          - 'Arbeitet zu zweit oder zu dritt. Wählt einen Anlass: Geburtstag, Hochzeit, Abschluss, Überraschungsparty oder Abschiedsparty.'
          - Plant zusammen die Party. Sprecht frei, die Grammatik ist jetzt nicht wichtig.
          - Beschreibt eure Party mit dem Präsens und einer Zeitangabe. Beantwortet die Fragen unten.
          - Sagt den gleichen Plan noch einmal, diesmal mit *werden*.
          - Jede Gruppe sagt der Klasse zwei oder drei Sätze. Nicht mehr.
        example: |-
          *Wir feiern die Party am Samstag im Garten. Wir laden 20 Gäste ein.*
          *Wir werden die Party am Samstag im Garten feiern. Es wird Musik geben.*
      - id: act2-plan
        type: discussionQuestions
        title: Unsere Party
        items:
          - question: Wann?
            frame: Wir feiern am ___. / Wir werden am ___ feiern.
          - question: Wo?
            frame: Die Party ist im / in der ___. / Die Party wird im / in der ___ sein.
          - question: Wer kommt?
            frame: Wir laden ___ ein. / Wir werden ___ einladen.
          - question: Essen und Trinken?
            frame: Es gibt ___. / Es wird ___ geben.
          - question: Musik / Aktivitäten?
            frame: Wir tanzen / spielen ___. / Wir werden ___.
      - id: act3
        type: classActivity
        title: 'Aktivität 3: Traditionen und Feste'
        skills: [Präsens + Zeitangabe, Futur I (werden + Infinitiv)]
        steps:
          - Schau dir die 4 Bilder von Feiern an (z. B. Geburtstag, Hochzeit, Abschlussfeier, Neujahr). Wählt zu zweit zwei Bilder aus.
          - 'Beschreibt die Feier mit dem Präsens und einer Zeitangabe: Warum feiern sie? Wo ist die Feier? Wann ist die Feier?'
          - Sagt das Gleiche noch einmal, aber jetzt mit *werden*.
          - Jedes Paar sagt der Klasse 2–3 Sätze.
          - Reagiert auf die Feier. Wählt eine Reaktion aus der Liste und sagt sie laut.
        example: |-
          *Sie heiraten im Sommer. Die Feier ist im Hotel.*
          *Sie werden im Sommer heiraten. Die Feier wird im Hotel sein.*
        wordBank:
          - Ich werde kommen. Danke für die Einladung!
          - Leider kann ich nicht kommen.
          - Leider werde ich nicht kommen können.
          - Ich werde an diesem Tag beschäftigt sein.
      - id: act3-sentences
        type: discussionQuestions
        title: Unsere Bilder
        items:
          - question: 'Bild 1 (Präsens + Zeitangabe): ___'
          - question: 'Bild 1 (mit werden): ___'
          - question: 'Bild 2 (Präsens + Zeitangabe): ___'
          - question: 'Bild 2 (mit werden): ___'
      - id: act4
        type: classActivity
        title: 'Aktivität 4: Festkalender'
        skills: [Präsens + Zeitangabe, Futur I (werden + Infinitiv)]
        steps:
          - Arbeitet in Gruppen (3–4 Personen) mit einem leeren Kalender für 12 Monate.
          - 'Wählt mindestens 5 Ereignisse für das nächste Jahr: Geburtstage, Feiertage, eine Reise oder einen Urlaub, einen Abschluss, einen Nationalfeiertag, eine Familienfeier, eine Überraschungsparty.'
          - Schreibt einfache, vollständige Sätze in den Kalender. Ihr dürft beide Zukunftsformen benutzen.
          - Gestaltet den Kalender mit Farben, Zeichnungen, Bildern oder Emojis.
          - 'Jede Gruppe präsentiert 2–3 Monate: 1–2 Sätze pro Monat.'
          - 'Die Klasse stellt eine oder zwei Fragen: Wer kommt? Wo ist die Feier? Wann ist sie? Was gibt es zu essen?'
        example: |-
          ***März:*** *Wir feiern Annas Geburtstag.*
          ***Juli:*** *Wir werden mit Freunden ans Meer fahren.*
          ***August:*** *Ich werde ein Konzert besuchen.*
          ***Dezember:*** *Wir feiern Weihnachten mit der Familie.*
      - id: act4-calendar
        type: discussionQuestions
        title: Unser Kalender
        items:
          - question: '___ (Monat): ___'
          - question: '___ (Monat): ___'
          - question: '___ (Monat): ___'
          - question: '___ (Monat): ___'
          - question: '___ (Monat): ___'
    teacherNotes:
      - id: n-plan
        anchor: null
        text: >-
          Zwei Fertigkeiten in diesem Zyklus: **Präsens + Zeitangabe** und **Futur I
          (werden + Infinitiv)**. Alle vier Aktivitäten üben beide Formen. Botschaft für
          die Gruppe: Beide Formen sind richtig; der Unterschied ist die Situation und
          der Stil, nicht «richtig oder falsch».
      - id: n-intro
        anchor: intro
        minutes: 5
        text: Jeder Schüler sagt zwei kurze Sätze. Gib zuerst dein eigenes Beispiel.
      - id: n-warmup
        anchor: warmup
        text: Stell jedem Schüler mindestens zwei Fragen. Die Antworten erscheinen unter jeder Frage.
      - id: n-act1
        anchor: act1
        text: >-
          Schreib die Punkte an die Tafel: Anlass, Datum / Zeit, Ort, Einladung / Gäste,
          Bitte um Rückmeldung. Die Schüler schreiben in Einzelarbeit, in einer
          Google-Docs-Vorlage oder auf Papier (die Vorlage ist im Heft nicht verlinkt);
          sie dürfen Bilder hinzufügen oder das Layout ändern. Beim Vorlesen nicht
          unterbrechen; erst danach kurz korrigieren. Fokus auf Verständlichkeit, nicht
          auf Perfektion. Schwächere Gruppen: nur eine Einladung schreiben. Stärkere
          Gruppen: einen Satz mit *wahrscheinlich* oder *vielleicht* ergänzen.
      - id: n-act2
        anchor: act2
        text: >-
          Schritt 1 (freies Planen, 3 Minuten): nicht korrigieren, nur zuhören. Schritt 2
          (Präsens + Zeitangabe, 4 Minuten): schreib an die Tafel «Wann? Wo? Wer kommt?
          Essen und Trinken? Musik / Aktivitäten?»; kurze Sätze akzeptieren, nur bei
          Bedarf leicht korrigieren. Schritt 3 (werden, 4 Minuten): wenn nötig ein
          Beispiel vormachen, keine neuen Wörter einführen. Schritt 4 (Präsentation, 2
          Minuten pro Gruppe): nicht unterbrechen, wiederholte Fehler notieren. Schritt 5
          (Rückmeldung, 2 Minuten): «Beide Formen sind richtig. Der Unterschied ist die
          Situation.» Optional an der Tafel: *Wir feiern am Samstag. / Wir werden am
          Samstag feiern.* Schwächere Gruppen: Schritt 1 weglassen. Stärkere Gruppen:
          einen Satz mit *wahrscheinlich* oder *vielleicht* ergänzen.
      - id: n-act3
        anchor: act3
        text: >-
          Bereite vor dem Unterricht 4 Bilder von Feiern vor (z. B. Geburtstag,
          Hochzeit, Abschlussfeier, Neujahr / Feiertag); sie sind nicht im Heft. Schreib
          für Schritt 2 an die Tafel: «Warum feiern sie? Wo ist die Feier? Wann ist die
          Feier?» und für Schritt 5 die Reaktionen. Kurze Sätze akzeptieren, nur bei
          Bedarf korrigieren. Schwächere Gruppen: Schritt 2 und 3 gemeinsam machen, nur
          ein Bild beschreiben. Stärkere Gruppen: einen Satz mit *wahrscheinlich* oder
          *vielleicht* hinzufügen.
      - id: n-act4
        anchor: act4
        text: >-
          Teile die Klasse in Gruppen; jede Gruppe bekommt einen leeren Kalender für 12
          Monate (Papier oder digital; nicht im Heft). Kurze Sätze reichen völlig aus,
          perfekte Grammatik ist nicht nötig. Optionaler Wettbewerb am Ende, Abstimmung
          per Handzeichen: die kreativste Feier, die beste Sommerparty, der verrückteste
          Plan. Schwächere Gruppen: nur 3 Ereignisse, nur Präsens **oder** nur *werden*.
          Stärkere Gruppen: einen Satz mit *wahrscheinlich* oder *vielleicht*
          ergänzen.

  # ── summary ──────────────────────────────────────────────────────────────
  - slug: besondere-anlaesse-zukunft-zusammenfassung
    title: Zusammenfassung
    phase: during_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Was wir heute gelernt haben
      - id: intro-he
        type: text
        lang: he
        text: >-
          בשיעור הזה למדנו שתי דרכים פשוטות לדבר על העתיד בגרמנית. שתי הדרכים נכונות.
          ההבדל הוא בסיטואציה ובסגנון, לא ב"נכון" או "לא נכון".
      - id: rules-praesens
        type: ruleSummary
        skill: Präsens + Zeitangabe
        rules:
          - text: 'Im Deutschen sprechen wir oft mit dem **Präsens** über die Zukunft. Eine **Zeitangabe** (am Samstag, nächste Woche, im Juli) zeigt, dass es um die Zukunft geht.'
            examples:
              [
                Ich feiere am Samstag meinen Geburtstag.,
                Wir treffen uns nächste Woche.,
                Die Party ist am Freitag.,
              ]
          - text: 'Wir benutzen diese Form vor allem für **feste Pläne**: Die Sache ist schon geplant.'
            examples: [Wir feiern am Samstag zu Hause.]
          - text: 'Das Verb steht auf **Position 2**. Beginnt der Satz mit der Zeitangabe, kommt das Subjekt nach dem Verb.'
            examples: [Ich feiere am Samstag. → Am Samstag feiere ich.]
          - text: 'Bei trennbaren Verben (einladen, mitbringen) steht die Vorsilbe am Ende.'
            examples: [Wir laden Freunde ein., Ich bringe Essen mit.]
      - id: praesens-he
        type: text
        lang: he
        text: >-
          הווה + מילת זמן: בגרמנית מדברים הרבה על העתיד בזמן הווה, כשמילת זמן (am
          Samstag, nächste Woche, im Juli) מראה שמדובר בעתיד. משתמשים בזה במיוחד כשיש
          תוכנית קבועה, כשמשהו כבר נקבע מראש. הפועל במקום השני במשפט.
      - id: praesens-examples
        type: examples
        items:
          - {
              text: Ich feiere am Samstag meinen Geburtstag.,
              gloss: אני חוגג את יום ההולדת שלי ביום שבת,
            }
          - { text: Wir treffen uns nächste Woche., gloss: אנחנו נפגשים בשבוע הבא }
          - { text: Die Party ist am Freitag., gloss: המסיבה ביום שישי }
      - id: rules-futur
        type: ruleSummary
        skill: Futur I (werden + Infinitiv)
        rules:
          - text: 'Futur I = **werden** (konjugiert, Position 2) + **Infinitiv** (am Ende des Satzes).'
            examples: [Ich werde meinen Geburtstag feiern., Wir werden viele Gäste einladen.]
          - text: 'Wir benutzen *werden* für **Absichten** und **allgemeine Pläne**, und auch wenn keine Zeitangabe da ist.'
            examples: [Wir werden zu Hause feiern.]
          - text: 'Mit *wahrscheinlich* oder *vielleicht* sagen wir eine **Vermutung**.'
            examples:
              [Ich werde wahrscheinlich Essen mitbringen., Wir werden vielleicht im Garten feiern.]
          - text: '*Es wird … geben* = es gibt in der Zukunft.'
            examples: [Es wird Musik geben.]
          - text: 'Trennbare Verben stehen im Futur I ganz am Ende, in einem Wort.'
            examples: [Wir laden Freunde ein. → Wir werden Freunde einladen.]
      - id: werden-table
        type: table
        caption: werden (Präsens)
        header: [Person, werden, Beispiel]
        rows:
          - [ich, werde, Ich werde meinen Geburtstag feiern.]
          - [du, wirst, Du wirst viele Gäste einladen.]
          - [er / sie / es, wird, Es wird Musik geben.]
          - [wir, werden, Wir werden zu Hause feiern.]
          - [ihr, werdet, Ihr werdet Essen mitbringen.]
          - [sie / Sie, werden, Sie werden im Sommer heiraten.]
      - id: futur-he
        type: text
        lang: he
        text: >-
          עתיד עם werden: הפועל werden בהטיה (במקום השני), והפועל העיקרי בשם הפועל בסוף
          המשפט. משתמשים בזה כשמדברים על כוונה או על תכנון כללי, וכשאין מילת זמן. עם
          wahrscheinlich (כנראה) או vielleicht (אולי) מביעים השערה. שימו לב: החלטה
          ספונטנית ("אני אעשה את זה!") נאמרת בגרמנית בדרך כלל בהווה: Ich mache das!
      - id: futur-examples
        type: examples
        items:
          - { text: Ich werde meinen Geburtstag feiern., gloss: אני אחגוג את יום ההולדת שלי }
          - { text: Wir werden viele Gäste einladen., gloss: נזמין הרבה אורחים }
          - { text: Es wird Musik geben., gloss: תהיה מוזיקה }
          - { text: Ich werde wahrscheinlich Essen mitbringen., gloss: כנראה אביא אוכל }
      - id: compare-table
        type: table
        caption: Vergleich
        header: [Form, Wann?, Beispiel]
        rows:
          - [Präsens + Zeitangabe, fester Plan, Wir feiern am Samstag zu Hause.]
          - [werden + Infinitiv, Absicht / allgemeiner Plan, Wir werden zu Hause feiern.]
      - id: tip
        type: callout
        tone: tip
        title: Merksatz
        text: |-
          Fester Plan → Präsens + Zeitangabe. Absicht oder allgemeiner Plan → *werden*.
          Kurze Sätze sind super. Du darfst beide Formen mischen. Das Wichtigste: Man versteht dich.
    teacherNotes:
      - id: n-summary
        anchor: null
        text: >-
          Nur kurz erklären: Auf A2-Niveau gibt es zwei übliche Arten, über die Zukunft
          zu sprechen, und beide sind richtig. Tafelbeispiele für das Präsens: *Ich
          feiere am Samstag meinen Geburtstag. Wir treffen uns nächste Woche. Die Party
          ist am Freitag. Wir laden Freunde ein.* Für *werden*: *Ich werde meinen
          Geburtstag feiern. Wir werden viele Gäste einladen. Es wird Musik geben. Ich
          werde wahrscheinlich Essen mitbringen.* Bitte die Gruppe um ein neues Beispiel
          für jede Form.

  # ── after class ──────────────────────────────────────────────────────────
  - slug: besondere-anlaesse-zukunft-hausaufgaben
    title: Hausaufgaben mit Mori
    phase: after_class
    blocks:
      - id: title
        type: heading
        level: 2
        text: Hausaufgaben mit Mori
      - id: how
        type: text
        text: Öffne den Chat mit Mori, kopiere eine Nachricht und schick sie ab. Mori stellt dir Fragen und korrigiert dich; antworte auf Deutsch.
      - id: mori-1
        type: aiTutorPrompt
        title: 'Teil 1: Präsens + Zeitangabe'
        intro: 'Schreib und sag danach **5 Sätze** über Pläne, die schon fest sind. Benutze das Präsens und eine Zeitangabe (am Samstag, nächste Woche, im Juli …). Beispiele: *Ich feiere am Samstag meinen Geburtstag. Wir treffen uns nächste Woche mit Freunden.*'
        message: Hallo Mori! Ich möchte dir von meinen festen Plänen erzählen. Ich schreibe 5 Sätze im Präsens mit einer Zeitangabe. Bitte stell mir Fragen und korrigiere mich, wenn nötig.
      - id: mori-2
        type: aiTutorPrompt
        title: 'Teil 2: Futur I mit werden'
        intro: 'Schreib und sag danach **5 Sätze** über Absichten oder allgemeine Pläne. Benutze *werden* + Infinitiv. Beispiele: *Ich werde meinen Geburtstag feiern. Ich werde wahrscheinlich zu Hause bleiben.*'
        message: Hallo Mori! Ich möchte das Futur mit „werden“ üben. Ich schreibe 5 Sätze über meine Pläne. Bitte korrigiere mich und erkläre kurz, wenn nötig.
      - id: mori-3
        type: aiTutorPrompt
        title: 'Teil 3: Ein kurzes Gespräch'
        intro: Antworte mündlich, in kurzen und klaren Sätzen.
        message: Hallo Mori! Bitte stell mir Fragen über besondere Anlässe und Feiern in der Zukunft.
      - id: mori-4
        type: aiTutorPrompt
        title: 'Teil 4: Mein Festkalender'
        intro: 'Erzähl von **mindestens 4 Ereignissen**: ein Geburtstag, ein Feiertag, eine Reise, eine Familienfeier oder ein Treffen mit Freunden. Du kannst das Präsens + Zeitangabe und *werden* + Infinitiv mischen.'
        message: Hallo Mori! Ich erzähle dir von meinem Festkalender für das nächste Jahr. Bitte stell mir Fragen und korrigiere mich, wenn nötig.
      - id: note
        type: callout
        tone: info
        title: Wichtig
        text: Du brauchst keine langen Sätze. Ein einfacher, klarer Satz ist besser als ein komplizierter Satz mit Fehlern.
      - id: tips
        type: callout
        tone: tip
        title: Tipps
        text: |-
          Du möchtest mehr Fragen? Schick: **Bitte stell mir mehr Fragen!**
          Du verstehst eine Erklärung nicht? Schick: **Kannst du es mir auf Hebräisch erklären, aber mit dem Satz auf Deutsch?**

