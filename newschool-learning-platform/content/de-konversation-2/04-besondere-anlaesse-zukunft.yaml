vocabulary:
  - slug: besondere-anlaesse-zukunft
    title: 'Besondere Anlässe: Zukunft'
    items: *besondere-anlaesse-zukunft-words

activities:
  - slug: besondere-anlaesse-zukunft-praesens
    title: 'Präsens + Zeitangabe: Ich feiere am Samstag.'
    minutes: 8
    items:
      - id: feiere
        type: multipleChoice
        prompt: Ich ___ am Samstag meinen Geburtstag.
        options:
          - { text: feiere, correct: true }
          - {
              text: feiern,
              feedback: '*feiern* ist der Infinitiv (oder die Form für *wir*). Für *ich* sagen wir *feiere*.',
            }
          - {
              text: feiert,
              feedback: '*feiert* ist für *er / sie / es* oder *ihr*. Für *ich* sagen wir *feiere*.',
            }
      - id: zukunft-praesens
        type: trueFalse
        prompt: 'Im Deutschen können wir mit dem Präsens über die Zukunft sprechen, wenn eine Zeitangabe da ist: *Wir treffen uns nächste Woche.*'
        answer: true
        feedback:
          correct: Richtig! Die Zeitangabe (*nächste Woche*) zeigt die Zukunft.
          incorrect: 'Doch: Präsens + Zeitangabe ist im Deutschen sehr normal für die Zukunft. *Wir treffen uns nächste Woche.*'
      - id: am-im
        type: fillBlank
        prompt: Ergänze *am* oder *im*.
        text: Wir feiern ___ Samstag. Meine Schwester heiratet ___ Juli.
        blanks: [[am], [im]]
        wordBank: [am, im]
      - id: laden-ein
        type: fillBlank
        prompt: Ergänze das Verb *einladen* im Präsens.
        text: Wir ___ 20 Gäste ___.
        blanks: [[laden], [ein]]
      - id: position-2
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Am Samstag feiere ich meinen Geburtstag., correct: true }
          - {
              text: Am Samstag ich feiere meinen Geburtstag.,
              feedback: 'Das Verb steht auf Position 2: *Am Samstag feiere ich …*',
            }
          - {
              text: Am Samstag meinen Geburtstag ich feiere.,
              feedback: 'Das Verb steht auf Position 2, direkt nach der Zeitangabe: *Am Samstag feiere ich …*',
            }
      - id: personen-feiern
        type: matching
        prompt: Welche Form von *feiern* passt?
        pairs:
          - [ich, feiere]
          - [du, feierst]
          - [er / sie / es, feiert]
          - [wir, feiern]
      - id: party-ist
        type: fillBlank
        prompt: Ergänze das Verb *sein* im Präsens.
        text: Die Party ___ am Freitag.
        blanks: [[ist]]
      - id: ordne-gaeste
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Wir laden viele Gäste ein.

  - slug: besondere-anlaesse-zukunft-werden
    title: 'Futur I: werden + Infinitiv'
    minutes: 8
    items:
      - id: werden-formen
        type: matching
        prompt: Welche Form von *werden* passt?
        pairs:
          - [ich, werde]
          - [du, wirst]
          - [er / sie / es, wird]
          - [wir, werden]
          - [ihr, werdet]
      - id: wir-werden
        type: multipleChoice
        prompt: Wir ___ viele Gäste einladen.
        options:
          - { text: werden, correct: true }
          - {
              text: wird,
              feedback: '*wird* ist für *er / sie / es*. Für *wir* sagen wir *werden*.',
            }
          - { text: werdet, feedback: '*werdet* ist für *ihr*. Für *wir* sagen wir *werden*.' }
      - id: infinitiv-ende
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: Ich werde meinen Geburtstag feiern., correct: true }
          - {
              text: Ich werde feiern meinen Geburtstag.,
              feedback: 'Der Infinitiv steht am Ende des Satzes: *Ich werde meinen Geburtstag feiern.*',
            }
          - {
              text: Ich werde meinen Geburtstag feiere.,
              feedback: 'Nach *werden* kommt der Infinitiv (*feiern*), nicht *feiere*.',
            }
      - id: es-wird-geben
        type: fillBlank
        prompt: Ergänze *werden* und *geben*.
        text: Es ___ Musik ___.
        blanks: [[wird], [geben]]
      - id: regel-position
        type: trueFalse
        prompt: 'Im Futur I steht *werden* auf Position 2 und der Infinitiv am Ende.'
        answer: true
        feedback:
          correct: 'Richtig! *Wir werden zu Hause feiern.*'
          incorrect: '*werden* steht auf Position 2, der Infinitiv am Ende: *Wir werden zu Hause feiern.*'
      - id: du-wirst
        type: fillBlank
        prompt: Ergänze die richtige Form von *werden*.
        text: Du ___ wahrscheinlich Essen mitbringen.
        blanks: [[wirst]]
      - id: einladen-futur
        type: multipleChoice
        prompt: '*Wir laden Freunde ein.* Wie heißt der Satz mit *werden*?'
        options:
          - { text: Wir werden Freunde einladen., correct: true }
          - {
              text: Wir werden Freunde laden ein.,
              feedback: 'Im Futur I steht das trennbare Verb am Ende, in einem Wort: *einladen*.',
            }
          - {
              text: Wir werden einladen Freunde.,
              feedback: 'Der Infinitiv steht am Ende: *Wir werden Freunde einladen.*',
            }
      - id: ordne-bleiben
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Ich werde zu Hause bleiben.
