vocabulary:
  - slug: ziele-und-projekte-zukunft
    title: Ziele und Projekte – Zukunft
    items: *ziele-und-projekte-zukunft-words

activities:
  - slug: ziele-und-projekte-zukunft-werden
    title: 'Futur mit werden: Ich werde mein Ziel erreichen'
    minutes: 8
    items:
      - id: werde-lesen
        type: multipleChoice
        prompt: Nächste Woche ___ ich jeden Tag 10 Minuten lesen.
        options:
          - { text: werde, correct: true }
          - {
              text: wird,
              feedback: '*wird* gehört zu *er / sie / es*. Mit *ich* sagen wir *ich werde*.',
            }
          - {
              text: werden,
              feedback: '*werden* gehört zu *wir* und *sie / Sie*. Mit *ich* sagen wir *ich werde*.',
            }
      - id: werden-wird
        type: fillBlank
        prompt: Ergänze die richtige Form von *werden*.
        text: Wir ___ reisen. Mein Bruder ___ einen Kurs machen.
        blanks: [[werden], [wird]]
        wordBank: [werde, wirst, wird, werden]
      - id: wortstellung
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: In der Zukunft werde ich jeden Tag üben., correct: true }
          - {
              text: In der Zukunft ich werde jeden Tag üben.,
              feedback: '*werden* steht an Position 2. Nach *In der Zukunft* kommt zuerst *werde*, dann *ich*.',
            }
          - {
              text: In der Zukunft werde ich üben jeden Tag.,
              feedback: 'Der Infinitiv steht am Ende: *… jeden Tag üben*.',
            }
      - id: personen
        type: matching
        prompt: Welche Form von *werden* passt?
        pairs:
          - [ich, werde]
          - [du, wirst]
          - [meine Mutter, wird]
          - [wir, werden]
          - [ihr, werdet]
      - id: infinitiv-ende
        type: trueFalse
        prompt: 'Im Satz *Ich werde nächste Woche mit Mori sprechen.* steht der Infinitiv am Ende.'
        answer: true
        feedback:
          correct: Richtig! *werde* an Position 2, *sprechen* am Ende.
          incorrect: 'Doch: *Ich werde nächste Woche mit Mori sprechen.* Der Infinitiv *sprechen* steht am Ende.'
      - id: fuehlen
        type: fillBlank
        prompt: 'Ergänze: *werden* + Infinitiv von *fühlen*.'
        text: Ich ___ mich sehr glücklich ___.
        blanks: [[werde], [fühlen, fuehlen]]
      - id: mein-ziel
        type: multipleChoice
        prompt: Was ist dein Ziel?
        options:
          - { text: 'Mein Ziel ist, besser Deutsch zu sprechen.', correct: true }
          - {
              text: 'Mein Ziel ist, besser Deutsch sprechen.',
              feedback: 'Nach *Mein Ziel ist,* brauchen wir *zu* + Infinitiv: *… besser Deutsch zu sprechen.*',
            }
          - {
              text: 'Mein Ziel ist, zu besser Deutsch sprechen.',
              feedback: '*zu* steht direkt vor dem Infinitiv am Ende: *… besser Deutsch zu sprechen.*',
            }
      - id: ordne-mori
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Nächste Woche werde ich mit Mori sprechen.

  - slug: ziele-und-projekte-zukunft-zeitsaetze
    title: 'Zeitsätze: wenn und nachdem'
    minutes: 8
    items:
      - id: wenn-habe
        type: multipleChoice
        prompt: Wenn ich Zeit ___, werde ich Podcasts hören.
        options:
          - { text: habe, correct: true }
          - {
              text: haben werde,
              feedback: 'Im *wenn*-Satz steht das Präsens. Die Zukunft (*werde*) steht nur im Hauptsatz.',
            }
          - {
              text: hat,
              feedback: '*hat* gehört zu *er / sie / es*. Mit *ich* sagen wir *ich habe*.',
            }
      - id: nachdem-erreicht
        type: multipleChoice
        prompt: Nachdem ich mein Ziel ___, werde ich feiern.
        options:
          - { text: erreicht habe, correct: true }
          - {
              text: erreiche,
              feedback: 'Nach *nachdem* ist die Handlung schon fertig: Wir benutzen das Perfekt, *erreicht habe*.',
            }
          - {
              text: erreichen werde,
              feedback: 'Im *nachdem*-Satz steht kein *werden*. Die Handlung ist schon fertig: *erreicht habe*.',
            }
      - id: hauptsatz-werde
        type: fillBlank
        prompt: Ergänze die richtige Form von *werden*.
        text: Wenn ich mehr Zeit habe, ___ ich Filme auf Deutsch schauen.
        blanks: [[werde]]
      - id: komma-verb
        type: trueFalse
        prompt: 'Der Satz *Wenn ich Zeit habe, ich werde lernen.* ist richtig.'
        answer: false
        feedback:
          correct: 'Genau! Nach dem *wenn*-Satz kommt zuerst das Verb: *Wenn ich Zeit habe, werde ich lernen.*'
          incorrect: 'Nach dem Komma beginnt der Hauptsatz mit dem Verb: *Wenn ich Zeit habe, werde ich lernen.*'
      - id: partizipien
        type: matching
        prompt: Welches Partizip II passt? (für *nachdem* + Perfekt)
        pairs:
          - [erreichen, erreicht]
          - [lernen, gelernt]
          - [machen, gemacht]
          - [schaffen, geschafft]
          - [beginnen, begonnen]
      - id: nachdem-kurs
        type: fillBlank
        prompt: Ergänze das Perfekt von *machen*.
        text: Nachdem ich den Kurs ___ ___, werde ich nach Deutschland reisen.
        blanks: [[gemacht], [habe]]
      - id: verb-am-ende
        type: multipleChoice
        prompt: Welcher Satz ist richtig?
        options:
          - { text: 'Wenn ich mein Ziel erreiche, werde ich sehr glücklich sein.', correct: true }
          - {
              text: 'Wenn ich erreiche mein Ziel, werde ich sehr glücklich sein.',
              feedback: 'Im *wenn*-Satz steht das Verb am Ende: *Wenn ich mein Ziel erreiche, …*',
            }
          - {
              text: 'Wenn ich mein Ziel erreiche, ich werde sehr glücklich sein.',
              feedback: 'Nach dem Komma kommt zuerst das Verb: *…, werde ich sehr glücklich sein.*',
            }
      - id: ordne-wenn
        type: reorderSentence
        prompt: Ordne die Wörter.
        sentence: Wenn ich Zeit habe, werde ich lernen.
